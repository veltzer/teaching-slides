<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,19.6721 7,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 7,19.6721" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="56.9942" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.6966" rx="6" />
  <text x="640" y="76.8786" text-anchor="middle" font-size="25.0098" fill="var(--bg)" font-weight="bold">Async Programming Cheatsheet</text>
  <rect x="40" y="96.9943" width="1200" height="43.5837" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="59.3548" y="125.4913" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold">Future::poll()</text>
  <text x="485.1612" y="125.4913" text-anchor="start" font-size="21.437" fill="var(--text)">returns Pending or Ready(T)</text>
  <rect x="40" y="140.5781" width="1200" height="43.5837" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="169.0752" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold">async fn</text>
  <text x="485.1612" y="169.0752" text-anchor="start" font-size="21.437" fill="var(--text)">generates a state machine</text>
  <rect x="40" y="184.1619" width="1200" height="43.5837" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="59.3548" y="212.659" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold">.await</text>
  <text x="485.1612" y="212.659" text-anchor="start" font-size="21.437" fill="var(--text)">yield point (state transition)</text>
  <rect x="40" y="227.7457" width="1200" height="43.5837" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="256.2428" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold">Pin&lt;&amp;mut F&gt;</text>
  <text x="485.1612" y="256.2428" text-anchor="start" font-size="21.437" fill="var(--text)">prevents moving self-referential futures</text>
  <rect x="40" y="271.3295" width="1200" height="43.5837" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="59.3548" y="299.8267" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold">Unpin</text>
  <text x="485.1612" y="299.8267" text-anchor="start" font-size="21.437" fill="var(--text)">opt-out of pinning restrictions</text>
  <rect x="40" y="314.9133" width="1200" height="43.5837" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="343.4104" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold">tokio::spawn</text>
  <text x="485.1612" y="343.4104" text-anchor="start" font-size="21.437" fill="var(--text)">run a Send + 'static future</text>
  <rect x="40" y="358.4972" width="1200" height="43.5837" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="59.3548" y="386.9943" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold">spawn_blocking</text>
  <text x="485.1612" y="386.9943" text-anchor="start" font-size="21.437" fill="var(--text)">run blocking code off the async runtime</text>
  <rect x="40" y="402.081" width="1200" height="43.5837" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="430.5781" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold">join!</text>
  <text x="485.1612" y="430.5781" text-anchor="start" font-size="21.437" fill="var(--text)">run all futures concurrently</text>
  <rect x="40" y="445.6647" width="1200" height="43.5837" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="59.3548" y="474.1619" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold">select!</text>
  <text x="485.1612" y="474.1619" text-anchor="start" font-size="21.437" fill="var(--text)">race futures, first one wins</text>
  <rect x="40" y="489.2486" width="1200" height="43.5837" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="517.7458" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold">Stream</text>
  <text x="485.1612" y="517.7458" text-anchor="start" font-size="21.437" fill="var(--text)">async iterator</text>
  <rect x="40" y="532.8324" width="1200" height="43.5837" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="59.3548" y="561.3295" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold">Cancellation-safe</text>
  <text x="485.1612" y="561.3295" text-anchor="start" font-size="21.437" fill="var(--text)">no partial state lost on cancel</text>
  <rect x="40" y="576.4163" width="1200" height="43.5837" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="604.9134" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold">async_trait</text>
  <text x="485.1612" y="604.9134" text-anchor="start" font-size="21.437" fill="var(--text)">async fn in dyn trait objects</text>
</svg>
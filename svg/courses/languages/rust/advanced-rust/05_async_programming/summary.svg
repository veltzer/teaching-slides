    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="20" markerHeight="13.7705" refX="18" refY="6.8852" orient="auto">
      <polygon points="0,19.6721 7,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="20" markerHeight="13.7705" refX="2" refY="6.8852" orient="auto">
      <polygon points="0,0 7,19.6721" fill="#555" />
    </marker>
  </defs>
  <rect x="18.2772" y="17.9775" width="1133.1836" height="61.1236" fill="var(--primary-dk)" stroke="var(--primary-dk)" stroke-width="2.6966" rx="7.1911" />
  <text x="584.869" y="57.5281" text-anchor="middle" font-size="25.1686" fill="var(--bg)" font-weight="bold">Async Programming Cheatsheet</text>
  <rect x="18.2772" y="79.1012" width="1133.1836" height="46.7415" fill="var(--surface)" stroke="var(--border-faint)" stroke-width="2.6966" rx="7.1911" />
  <text x="36.5543" y="109.6629" text-anchor="start" font-size="21.5731" fill="var(--primary-dk)" font-weight="bold">Future::poll()</text>
  <text x="438.6517" y="109.6629" text-anchor="start" font-size="21.5731" fill="var(--text-darker)">returns Pending or Ready(T)</text>
  <rect x="18.2772" y="125.8427" width="1133.1836" height="46.7415" fill="var(--info-indigo-lt)" stroke="var(--border-faint)" stroke-width="2.6966" rx="7.1911" />
  <text x="36.5543" y="156.4045" text-anchor="start" font-size="21.5731" fill="var(--primary-dk)" font-weight="bold">async fn</text>
  <text x="438.6517" y="156.4045" text-anchor="start" font-size="21.5731" fill="var(--text-darker)">generates a state machine</text>
  <rect x="18.2772" y="172.5843" width="1133.1836" height="46.7415" fill="var(--surface)" stroke="var(--border-faint)" stroke-width="2.6966" rx="7.1911" />
  <text x="36.5543" y="203.1461" text-anchor="start" font-size="21.5731" fill="var(--primary-dk)" font-weight="bold">.await</text>
  <text x="438.6517" y="203.1461" text-anchor="start" font-size="21.5731" fill="var(--text-darker)">yield point (state transition)</text>
  <rect x="18.2772" y="219.3259" width="1133.1836" height="46.7415" fill="var(--info-indigo-lt)" stroke="var(--border-faint)" stroke-width="2.6966" rx="7.1911" />
  <text x="36.5543" y="249.8876" text-anchor="start" font-size="21.5731" fill="var(--primary-dk)" font-weight="bold">Pin&lt;&amp;mut F&gt;</text>
  <text x="438.6517" y="249.8876" text-anchor="start" font-size="21.5731" fill="var(--text-darker)">prevents moving self-referential futures</text>
  <rect x="18.2772" y="266.0674" width="1133.1836" height="46.7415" fill="var(--surface)" stroke="var(--border-faint)" stroke-width="2.6966" rx="7.1911" />
  <text x="36.5543" y="296.6293" text-anchor="start" font-size="21.5731" fill="var(--primary-dk)" font-weight="bold">Unpin</text>
  <text x="438.6517" y="296.6293" text-anchor="start" font-size="21.5731" fill="var(--text-darker)">opt-out of pinning restrictions</text>
  <rect x="18.2772" y="312.809" width="1133.1836" height="46.7415" fill="var(--info-indigo-lt)" stroke="var(--border-faint)" stroke-width="2.6966" rx="7.1911" />
  <text x="36.5543" y="343.3708" text-anchor="start" font-size="21.5731" fill="var(--primary-dk)" font-weight="bold">tokio::spawn</text>
  <text x="438.6517" y="343.3708" text-anchor="start" font-size="21.5731" fill="var(--text-darker)">run a Send + 'static future</text>
  <rect x="18.2772" y="359.5506" width="1133.1836" height="46.7415" fill="var(--surface)" stroke="var(--border-faint)" stroke-width="2.6966" rx="7.1911" />
  <text x="36.5543" y="390.1124" text-anchor="start" font-size="21.5731" fill="var(--primary-dk)" font-weight="bold">spawn_blocking</text>
  <text x="438.6517" y="390.1124" text-anchor="start" font-size="21.5731" fill="var(--text-darker)">run blocking code off the async runtime</text>
  <rect x="18.2772" y="406.2922" width="1133.1836" height="46.7415" fill="var(--info-indigo-lt)" stroke="var(--border-faint)" stroke-width="2.6966" rx="7.1911" />
  <text x="36.5543" y="436.854" text-anchor="start" font-size="21.5731" fill="var(--primary-dk)" font-weight="bold">join!</text>
  <text x="438.6517" y="436.854" text-anchor="start" font-size="21.5731" fill="var(--text-darker)">run all futures concurrently</text>
  <rect x="18.2772" y="453.0337" width="1133.1836" height="46.7415" fill="var(--surface)" stroke="var(--border-faint)" stroke-width="2.6966" rx="7.1911" />
  <text x="36.5543" y="483.5955" text-anchor="start" font-size="21.5731" fill="var(--primary-dk)" font-weight="bold">select!</text>
  <text x="438.6517" y="483.5955" text-anchor="start" font-size="21.5731" fill="var(--text-darker)">race futures, first one wins</text>
  <rect x="18.2772" y="499.7753" width="1133.1836" height="46.7415" fill="var(--info-indigo-lt)" stroke="var(--border-faint)" stroke-width="2.6966" rx="7.1911" />
  <text x="36.5543" y="530.3372" text-anchor="start" font-size="21.5731" fill="var(--primary-dk)" font-weight="bold">Stream</text>
  <text x="438.6517" y="530.3372" text-anchor="start" font-size="21.5731" fill="var(--text-darker)">async iterator</text>
  <rect x="18.2772" y="546.5169" width="1133.1836" height="46.7415" fill="var(--surface)" stroke="var(--border-faint)" stroke-width="2.6966" rx="7.1911" />
  <text x="36.5543" y="577.0787" text-anchor="start" font-size="21.5731" fill="var(--primary-dk)" font-weight="bold">Cancellation-safe</text>
  <text x="438.6517" y="577.0787" text-anchor="start" font-size="21.5731" fill="var(--text-darker)">no partial state lost on cancel</text>
  <rect x="18.2772" y="593.2585" width="1133.1836" height="46.7415" fill="var(--info-indigo-lt)" stroke="var(--border-faint)" stroke-width="2.6966" rx="7.1911" />
  <text x="36.5543" y="623.8203" text-anchor="start" font-size="21.5731" fill="var(--primary-dk)" font-weight="bold">async_trait</text>
  <text x="438.6517" y="623.8203" text-anchor="start" font-size="21.5731" fill="var(--text-darker)">async fn in dyn trait objects</text>
</svg>
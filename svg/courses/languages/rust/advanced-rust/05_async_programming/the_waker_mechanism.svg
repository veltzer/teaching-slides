<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="20" markerHeight="16.8" refX="18" refY="8.4" orient="auto">
      <polygon points="0,24 7,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="20" markerHeight="16.8" refX="2" refY="8.4" orient="auto">
      <polygon points="0,0 7,24" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="52.8" text-anchor="middle" font-size="28" fill="#222222" font-weight="bold">Future Executor / Waker Interaction</text>
  <rect x="80" y="120" width="400" height="288" fill="#e3f2fd" stroke="#333333" stroke-width="3" rx="8" />
  <text x="280" y="187.2" text-anchor="middle" font-size="26" fill="#222222" font-weight="bold">Executor</text>
  <text x="280" y="240" text-anchor="middle" font-size="24" fill="#222222">(runtime)</text>
  <text x="280" y="292.8" text-anchor="middle" font-size="24" fill="#222222">task queue</text>
  <rect x="800" y="120" width="400" height="288" fill="#fff3e0" stroke="#333333" stroke-width="3" rx="8" />
  <text x="1000" y="187.2" text-anchor="middle" font-size="26" fill="#222222" font-weight="bold">Future</text>
  <text x="1000" y="240" text-anchor="middle" font-size="24" fill="#222222">stores waker</text>
  <text x="1000" y="292.8" text-anchor="middle" font-size="24" fill="#222222">I/O / timer state</text>
  <line x1="480" y1="216" x2="800" y2="216" stroke="#555" stroke-width="3" marker-end="url(#arr)" />
  <text x="640" y="196.8" text-anchor="middle" font-size="24" fill="#333" font-weight="bold">poll()</text>
  <line x1="800" y1="312" x2="480" y2="312" stroke="#555" stroke-width="3" marker-end="url(#arr)" />
  <text x="640" y="297.6" text-anchor="middle" font-size="22" fill="#333">Pending + waker saved</text>
  <path d="M 280 408 Q 640 648 1000 408" stroke="#555" stroke-width="3" fill="none" marker-start="url(#arrl)" />
  <text x="640" y="672" text-anchor="middle" font-size="24" fill="#555" font-style="italic">wake() called when I/O ready</text>
  <line x1="480" y1="360" x2="800" y2="360" stroke="#555" stroke-width="3" marker-end="url(#arr)" />
  <text x="640" y="345.6" text-anchor="middle" font-size="22" fill="#333">poll() again → Ready(value)</text>
</svg>
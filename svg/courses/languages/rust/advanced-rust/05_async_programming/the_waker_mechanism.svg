<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 7,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 7,24" fill="#555" />
    </marker>
  </defs>
  <text x="440.0999" y="55.0125" text-anchor="middle" font-size="15.5478" fill="var(--text)" font-weight="bold">Future Executor / Waker Interaction</text>
  <rect x="129.1444" y="92.3272" width="222.1111" height="159.92" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.3753" rx="6" />
  <text x="240.1999" y="129.6418" text-anchor="middle" font-size="14.4372" fill="var(--text)" font-weight="bold">Executor</text>
  <text x="240.1999" y="158.9605" text-anchor="middle" font-size="13.3266" fill="var(--text)">(runtime)</text>
  <text x="240.1999" y="188.2792" text-anchor="middle" font-size="13.3266" fill="var(--text)">task queue</text>
  <rect x="528.9444" y="92.3272" width="222.1111" height="159.92" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.3753" rx="6" />
  <text x="640" y="129.6418" text-anchor="middle" font-size="14.4372" fill="var(--text)" font-weight="bold">Future</text>
  <text x="640" y="158.9605" text-anchor="middle" font-size="13.3266" fill="var(--text)">stores waker</text>
  <text x="640" y="188.2792" text-anchor="middle" font-size="13.3266" fill="var(--text)">I/O / timer state</text>
  <line x1="351.2555" y1="145.6338" x2="528.9444" y2="145.6338" stroke="var(--text-muted)" stroke-width="0.9079" marker-end="url(#arr)" />
  <text x="440.0999" y="134.9725" text-anchor="middle" font-size="13.3266" fill="var(--text)" font-weight="bold">poll()</text>
  <line x1="528.9444" y1="198.9405" x2="351.2555" y2="198.9405" stroke="var(--text-muted)" stroke-width="0.9079" marker-end="url(#arr)" />
  <text x="440.0999" y="190.9445" text-anchor="middle" font-size="12.2161" fill="var(--text)">Pending + waker saved</text>
  <path d="M 240.1999 252.2472 Q 440.0999 385.5139 640 252.2472" stroke="var(--text-muted)" stroke-width="0.9079" fill="none" marker-start="url(#arrl)" />
  <text x="440.0999" y="398.8406" text-anchor="middle" font-size="13.3266" fill="var(--text-muted)" font-style="italic">wake() called when I/O ready</text>
  <line x1="351.2555" y1="225.5939" x2="528.9444" y2="225.5939" stroke="var(--text-muted)" stroke-width="0.9079" marker-end="url(#arr)" />
  <text x="440.0999" y="217.5979" text-anchor="middle" font-size="12.2161" fill="var(--text)">poll() again → Ready(value)</text>
</svg>
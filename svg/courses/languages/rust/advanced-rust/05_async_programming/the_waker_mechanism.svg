<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.0504" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Future Executor / Waker Interaction</text>
  <rect x="40" y="102.9458" width="428.5714" height="269.7674" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="254.2856" y="165.8914" text-anchor="middle" font-size="26.0467" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Executor</text>
  <text x="254.2856" y="215.3488" text-anchor="middle" font-size="24.043" fill="var(--text)" font-family="Arial, sans-serif">(runtime)</text>
  <text x="254.2856" y="264.8062" text-anchor="middle" font-size="24.043" fill="var(--text)" font-family="Arial, sans-serif">task queue</text>
  <rect x="811.4286" y="102.9458" width="428.5714" height="269.7674" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1025.7144" y="165.8914" text-anchor="middle" font-size="26.0467" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Future</text>
  <text x="1025.7144" y="215.3488" text-anchor="middle" font-size="24.043" fill="var(--text)" font-family="Arial, sans-serif">stores waker</text>
  <text x="1025.7144" y="264.8062" text-anchor="middle" font-size="24.043" fill="var(--text)" font-family="Arial, sans-serif">I/O / timer state</text>
  <line x1="468.5714" y1="192.8681" x2="811.4286" y2="192.8681" stroke="var(--text-muted)" stroke-width="0.9079" marker-end="url(#arrow)" />
  <text x="639.9999" y="174.8837" text-anchor="middle" font-size="24.043" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">poll()</text>
  <line x1="811.4286" y1="282.7906" x2="468.5714" y2="282.7906" stroke="var(--text-muted)" stroke-width="0.9079" marker-end="url(#arrow)" />
  <text x="639.9999" y="269.3023" text-anchor="middle" font-size="22.0395" fill="var(--text)" font-family="Arial, sans-serif">Pending + waker saved</text>
  <path d="M 254.2856 372.7131 Q 639.9999 597.5193 1025.7144 372.7131" stroke="var(--text-muted)" stroke-width="0.9079" fill="none" marker-start="url(#arrow)" />
  <text x="639.9999" y="620" text-anchor="middle" font-size="24.043" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">wake() called when I/O ready</text>
  <line x1="468.5714" y1="327.752" x2="811.4286" y2="327.752" stroke="var(--text-muted)" stroke-width="0.9079" marker-end="url(#arrow)" />
  <text x="639.9999" y="314.2636" text-anchor="middle" font-size="22.0395" fill="var(--text)" font-family="Arial, sans-serif">poll() again → Ready(value)</text>
</svg>
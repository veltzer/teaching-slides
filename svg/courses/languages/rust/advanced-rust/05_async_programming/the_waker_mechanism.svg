<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 7,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 7,24" fill="#555" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.0504" fill="var(--text)" font-weight="bold">Future Executor / Waker Interaction</text>
  <rect x="40" y="102.9458" width="428.5714" height="269.7674" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="254.2856" y="165.8914" text-anchor="middle" font-size="26.0467" fill="var(--text)" font-weight="bold">Executor</text>
  <text x="254.2856" y="215.3488" text-anchor="middle" font-size="24.043" fill="var(--text)">(runtime)</text>
  <text x="254.2856" y="264.8062" text-anchor="middle" font-size="24.043" fill="var(--text)">task queue</text>
  <rect x="811.4286" y="102.9458" width="428.5714" height="269.7674" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1025.7144" y="165.8914" text-anchor="middle" font-size="26.0467" fill="var(--text)" font-weight="bold">Future</text>
  <text x="1025.7144" y="215.3488" text-anchor="middle" font-size="24.043" fill="var(--text)">stores waker</text>
  <text x="1025.7144" y="264.8062" text-anchor="middle" font-size="24.043" fill="var(--text)">I/O / timer state</text>
  <line x1="468.5714" y1="192.8681" x2="811.4286" y2="192.8681" stroke="var(--text-muted)" stroke-width="0.9079" marker-end="url(#arr)" />
  <text x="639.9999" y="174.8837" text-anchor="middle" font-size="24.043" fill="var(--text)" font-weight="bold">poll()</text>
  <line x1="811.4286" y1="282.7906" x2="468.5714" y2="282.7906" stroke="var(--text-muted)" stroke-width="0.9079" marker-end="url(#arr)" />
  <text x="639.9999" y="269.3023" text-anchor="middle" font-size="22.0395" fill="var(--text)">Pending + waker saved</text>
  <path d="M 254.2856 372.7131 Q 639.9999 597.5193 1025.7144 372.7131" stroke="var(--text-muted)" stroke-width="0.9079" fill="none" marker-start="url(#arrl)" />
  <text x="639.9999" y="620" text-anchor="middle" font-size="24.043" fill="var(--text-muted)" font-style="italic">wake() called when I/O ready</text>
  <line x1="468.5714" y1="327.752" x2="811.4286" y2="327.752" stroke="var(--text-muted)" stroke-width="0.9079" marker-end="url(#arr)" />
  <text x="639.9999" y="314.2636" text-anchor="middle" font-size="22.0395" fill="var(--text)">poll() again → Ready(value)</text>
</svg>
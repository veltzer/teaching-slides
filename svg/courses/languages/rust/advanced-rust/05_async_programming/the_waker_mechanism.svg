<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 7,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 7,24" fill="#555" />
    </marker>
  </defs>
  <text x="409.6" y="33.792" text-anchor="middle" font-size="17.92" fill="var(--text)" font-weight="bold">Future Executor / Waker Interaction</text>
  <rect x="51.2" y="76.8" width="256" height="184.32" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="179.2" y="119.808" text-anchor="middle" font-size="16.64" fill="var(--text)" font-weight="bold">Executor</text>
  <text x="179.2" y="153.6" text-anchor="middle" font-size="15.36" fill="var(--text)">(runtime)</text>
  <text x="179.2" y="187.392" text-anchor="middle" font-size="15.36" fill="var(--text)">task queue</text>
  <rect x="512" y="76.8" width="256" height="184.32" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="640" y="119.808" text-anchor="middle" font-size="16.64" fill="var(--text)" font-weight="bold">Future</text>
  <text x="640" y="153.6" text-anchor="middle" font-size="15.36" fill="var(--text)">stores waker</text>
  <text x="640" y="187.392" text-anchor="middle" font-size="15.36" fill="var(--text)">I/O / timer state</text>
  <line x1="307.2" y1="138.24" x2="512" y2="138.24" stroke="var(--text-muted)" stroke-width="1.92" marker-end="url(#arr)" />
  <text x="409.6" y="125.952" text-anchor="middle" font-size="15.36" fill="var(--text)" font-weight="bold">poll()</text>
  <line x1="512" y1="199.68" x2="307.2" y2="199.68" stroke="var(--text-muted)" stroke-width="1.92" marker-end="url(#arr)" />
  <text x="409.6" y="190.464" text-anchor="middle" font-size="14.08" fill="var(--text)">Pending + waker saved</text>
  <path d="M 179.2 261.12 Q 409.6 414.72 640 261.12" stroke="var(--text-muted)" stroke-width="1.92" fill="none" marker-start="url(#arrl)" />
  <text x="409.6" y="430.08" text-anchor="middle" font-size="15.36" fill="var(--text-muted)" font-style="italic">wake() called when I/O ready</text>
  <line x1="307.2" y1="230.4" x2="512" y2="230.4" stroke="var(--text-muted)" stroke-width="1.92" marker-end="url(#arr)" />
  <text x="409.6" y="221.184" text-anchor="middle" font-size="14.08" fill="var(--text)">poll() again → Ready(value)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20 6.4,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.4,20" fill="#555" />
    </marker>
  </defs>
  <text x="711.1864" y="40" text-anchor="middle" font-size="26.6342" fill="var(--text)" font-weight="bold">async/await → State Machine</text>
  <rect x="40" y="75.0336" width="630.5084" height="544.9664" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="60.339" y="129.5302" text-anchor="start" font-size="22.8293" fill="var(--code-bg)" font-weight="bold">async fn example() {</text>
  <text x="60.339" y="172.349" text-anchor="start" font-size="22.8293" fill="var(--code-bg)">    let a = foo().await;</text>
  <text x="60.339" y="215.1678" text-anchor="start" font-size="22.8293" fill="var(--code-bg)">    let b = bar(a).await;</text>
  <text x="60.339" y="257.9866" text-anchor="start" font-size="22.8293" fill="var(--code-bg)">    a + b</text>
  <text x="60.339" y="300.8054" text-anchor="start" font-size="22.8293" fill="var(--code-bg)">}</text>
  <text x="60.339" y="343.6242" text-anchor="start" font-size="22.8293" fill="var(--code-bg)" />
  <text x="60.339" y="386.443" text-anchor="start" font-size="22.8293" fill="var(--code-bg)">Each .await = potential yield point</text>
  <text x="60.339" y="429.2617" text-anchor="start" font-size="22.8293" fill="var(--code-bg)">(future saves state, resumes later)</text>
  <rect x="792.5424" y="113.9597" width="447.4576" height="116.7785" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1016.2712" y="164.5638" text-anchor="middle" font-size="24.7317" fill="var(--text)" font-weight="bold">Start</text>
  <text x="1016.2712" y="203.4899" text-anchor="middle" font-size="24.7317" fill="var(--text)">poll foo()</text>
  <rect x="792.5424" y="289.1275" width="447.4576" height="116.7785" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1016.2712" y="339.7315" text-anchor="middle" font-size="24.7317" fill="var(--text)" font-weight="bold">State 1</text>
  <text x="1016.2712" y="378.6577" text-anchor="middle" font-size="24.7317" fill="var(--text)">poll bar(a)</text>
  <rect x="792.5424" y="464.2953" width="447.4576" height="116.7785" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1016.2712" y="514.8993" text-anchor="middle" font-size="24.7317" fill="var(--text)" font-weight="bold">Complete</text>
  <text x="1016.2712" y="553.8255" text-anchor="middle" font-size="24.7317" fill="var(--text)">return a+b</text>
  <line x1="1016.2712" y1="230.7383" x2="1016.2712" y2="289.1275" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="1036.6101" y="267.7181" text-anchor="start" font-size="20.9269" fill="var(--text-muted)">Ready(a)</text>
  <line x1="1016.2712" y1="405.906" x2="1016.2712" y2="464.2953" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="1036.6101" y="442.8859" text-anchor="start" font-size="20.9269" fill="var(--text-muted)">Ready(b)</text>
</svg>
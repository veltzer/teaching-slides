<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="711.1864" y="40" text-anchor="middle" font-size="26.6342" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">async/await → State Machine</text>
  <rect x="40" y="75.0336" width="630.5084" height="544.9664" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="60.339" y="129.5302" text-anchor="start" font-size="22.8293" fill="var(--code-bg)" font-weight="bold" font-family="Arial, sans-serif">async fn example() {</text>
  <text x="60.339" y="172.349" text-anchor="start" font-size="22.8293" fill="var(--code-bg)" font-family="Arial, sans-serif">    let a = foo().await;</text>
  <text x="60.339" y="215.1678" text-anchor="start" font-size="22.8293" fill="var(--code-bg)" font-family="Arial, sans-serif">    let b = bar(a).await;</text>
  <text x="60.339" y="257.9866" text-anchor="start" font-size="22.8293" fill="var(--code-bg)" font-family="Arial, sans-serif">    a + b</text>
  <text x="60.339" y="300.8054" text-anchor="start" font-size="22.8293" fill="var(--code-bg)" font-family="Arial, sans-serif">}</text>
  <text x="60.339" y="343.6242" text-anchor="start" font-size="22.8293" fill="var(--code-bg)" font-family="Arial, sans-serif"/>
  <text x="60.339" y="386.443" text-anchor="start" font-size="22.8293" fill="var(--code-bg)" font-family="Arial, sans-serif">Each .await = potential yield point</text>
  <text x="60.339" y="429.2617" text-anchor="start" font-size="22.8293" fill="var(--code-bg)" font-family="Arial, sans-serif">(future saves state, resumes later)</text>
  <rect x="792.5424" y="113.9597" width="447.4576" height="116.7785" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1016.2712" y="164.5638" text-anchor="middle" font-size="24.7317" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Start</text>
  <text x="1016.2712" y="203.4899" text-anchor="middle" font-size="24.7317" fill="var(--text)" font-family="Arial, sans-serif">poll foo()</text>
  <rect x="792.5424" y="289.1275" width="447.4576" height="116.7785" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1016.2712" y="339.7315" text-anchor="middle" font-size="24.7317" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">State 1</text>
  <text x="1016.2712" y="378.6577" text-anchor="middle" font-size="24.7317" fill="var(--text)" font-family="Arial, sans-serif">poll bar(a)</text>
  <rect x="792.5424" y="464.2953" width="447.4576" height="116.7785" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1016.2712" y="514.8993" text-anchor="middle" font-size="24.7317" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Complete</text>
  <text x="1016.2712" y="553.8255" text-anchor="middle" font-size="24.7317" fill="var(--text)" font-family="Arial, sans-serif">return a+b</text>
  <line x1="1016.2712" y1="230.7383" x2="1016.2712" y2="289.1275" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1036.6101" y="267.7181" text-anchor="start" font-size="20.9269" fill="var(--text-muted)" font-family="Arial, sans-serif">Ready(a)</text>
  <line x1="1016.2712" y1="405.906" x2="1016.2712" y2="464.2953" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1036.6101" y="442.8859" text-anchor="start" font-size="20.9269" fill="var(--text-muted)" font-family="Arial, sans-serif">Ready(b)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="18.2857" markerHeight="14" refX="16.4571" refY="7" orient="auto">
      <polygon points="0,20 6.4,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="18.2857" markerHeight="14" refX="1.8286" refY="7" orient="auto">
      <polygon points="0,0 6.4,20" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="44" text-anchor="middle" font-size="25.6" fill="#222222" font-weight="bold">async/await → State Machine</text>
  <rect x="36.5714" y="80" width="566.8571" height="560" fill="#f8f8f8" stroke="#aaa" stroke-width="2.7429" rx="7.3143" />
  <text x="54.8571" y="136" text-anchor="start" font-size="21.9429" fill="#1a1a2e" font-weight="bold">async fn example() {</text>
  <text x="54.8571" y="180" text-anchor="start" font-size="21.9429" fill="#1a1a2e">    let a = foo().await;</text>
  <text x="54.8571" y="224" text-anchor="start" font-size="21.9429" fill="#1a1a2e">    let b = bar(a).await;</text>
  <text x="54.8571" y="268" text-anchor="start" font-size="21.9429" fill="#1a1a2e">    a + b</text>
  <text x="54.8571" y="312" text-anchor="start" font-size="21.9429" fill="#1a1a2e">}</text>
  <text x="54.8571" y="356" text-anchor="start" font-size="21.9429" fill="#1a1a2e" />
  <text x="54.8571" y="400" text-anchor="start" font-size="21.9429" fill="#1a1a2e">Each .await = potential yield point</text>
  <text x="54.8571" y="444" text-anchor="start" font-size="21.9429" fill="#1a1a2e">(future saves state, resumes later)</text>
  <rect x="713.1429" y="120" width="402.2857" height="120" fill="#e3f2fd" stroke="#333333" stroke-width="2.7429" rx="7.3143" />
  <text x="914.2857" y="172" text-anchor="middle" font-size="23.7714" fill="#222222" font-weight="bold">Start</text>
  <text x="914.2857" y="212" text-anchor="middle" font-size="23.7714" fill="#222222">poll foo()</text>
  <rect x="713.1429" y="300" width="402.2857" height="120" fill="#e8f5e9" stroke="#333333" stroke-width="2.7429" rx="7.3143" />
  <text x="914.2857" y="352" text-anchor="middle" font-size="23.7714" fill="#222222" font-weight="bold">State 1</text>
  <text x="914.2857" y="392" text-anchor="middle" font-size="23.7714" fill="#222222">poll bar(a)</text>
  <rect x="713.1429" y="480" width="402.2857" height="120" fill="#fff3e0" stroke="#333333" stroke-width="2.7429" rx="7.3143" />
  <text x="914.2857" y="532" text-anchor="middle" font-size="23.7714" fill="#222222" font-weight="bold">Complete</text>
  <text x="914.2857" y="572" text-anchor="middle" font-size="23.7714" fill="#222222">return a+b</text>
  <line x1="914.2857" y1="240" x2="914.2857" y2="300" stroke="#555" stroke-width="2.7429" marker-end="url(#arr)" />
  <text x="932.5714" y="278" text-anchor="start" font-size="20.1143" fill="#555">Ready(a)</text>
  <line x1="914.2857" y1="420" x2="914.2857" y2="480" stroke="#555" stroke-width="2.7429" marker-end="url(#arr)" />
  <text x="932.5714" y="458" text-anchor="start" font-size="20.1143" fill="#555">Ready(b)</text>
</svg>
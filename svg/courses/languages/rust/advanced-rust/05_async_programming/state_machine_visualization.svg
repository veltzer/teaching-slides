<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20 6.4,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.4,20" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="44" text-anchor="middle" font-size="25.6" fill="var(--text)" font-weight="bold">async/await → State Machine</text>
  <rect x="36.5714" y="80" width="566.8571" height="560" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="54.8571" y="136" text-anchor="start" font-size="21.9429" fill="var(--code-bg)" font-weight="bold">async fn example() {</text>
  <text x="54.8571" y="180" text-anchor="start" font-size="21.9429" fill="var(--code-bg)">    let a = foo().await;</text>
  <text x="54.8571" y="224" text-anchor="start" font-size="21.9429" fill="var(--code-bg)">    let b = bar(a).await;</text>
  <text x="54.8571" y="268" text-anchor="start" font-size="21.9429" fill="var(--code-bg)">    a + b</text>
  <text x="54.8571" y="312" text-anchor="start" font-size="21.9429" fill="var(--code-bg)">}</text>
  <text x="54.8571" y="356" text-anchor="start" font-size="21.9429" fill="var(--code-bg)" />
  <text x="54.8571" y="400" text-anchor="start" font-size="21.9429" fill="var(--code-bg)">Each .await = potential yield point</text>
  <text x="54.8571" y="444" text-anchor="start" font-size="21.9429" fill="var(--code-bg)">(future saves state, resumes later)</text>
  <rect x="713.1429" y="120" width="402.2857" height="120" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="914.2857" y="172" text-anchor="middle" font-size="23.7714" fill="var(--text)" font-weight="bold">Start</text>
  <text x="914.2857" y="212" text-anchor="middle" font-size="23.7714" fill="var(--text)">poll foo()</text>
  <rect x="713.1429" y="300" width="402.2857" height="120" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="914.2857" y="352" text-anchor="middle" font-size="23.7714" fill="var(--text)" font-weight="bold">State 1</text>
  <text x="914.2857" y="392" text-anchor="middle" font-size="23.7714" fill="var(--text)">poll bar(a)</text>
  <rect x="713.1429" y="480" width="402.2857" height="120" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="914.2857" y="532" text-anchor="middle" font-size="23.7714" fill="var(--text)" font-weight="bold">Complete</text>
  <text x="914.2857" y="572" text-anchor="middle" font-size="23.7714" fill="var(--text)">return a+b</text>
  <line x1="914.2857" y1="240" x2="914.2857" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="932.5714" y="278" text-anchor="start" font-size="20.1143" fill="var(--text-muted)">Ready(a)</text>
  <line x1="914.2857" y1="420" x2="914.2857" y2="480" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="932.5714" y="458" text-anchor="start" font-size="20.1143" fill="var(--text-muted)">Ready(b)</text>
</svg>
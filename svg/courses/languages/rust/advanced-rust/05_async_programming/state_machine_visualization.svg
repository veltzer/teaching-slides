<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="630.5084" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.189853692466"/>
  <text x="60.339" y="97.999957428568" text-anchor="start" font-size="23.551671150234" fill="var(--code-bg)" font-weight="bold" font-family="Arial, sans-serif">async fn example() {</text>
  <text x="60.339" y="143.571398163263" text-anchor="start" font-size="23.551671150234" fill="var(--code-bg)" font-family="Arial, sans-serif">    let a = foo().await;</text>
  <text x="60.339" y="189.142838897958" text-anchor="start" font-size="23.551671150234" fill="var(--code-bg)" font-family="Arial, sans-serif">    let b = bar(a).await;</text>
  <text x="60.339" y="234.714279632653" text-anchor="start" font-size="23.551671150234" fill="var(--code-bg)" font-family="Arial, sans-serif">    a + b</text>
  <text x="60.339" y="280.285720367347" text-anchor="start" font-size="23.551671150234" fill="var(--code-bg)" font-family="Arial, sans-serif">}</text>
  <text x="60.339" y="325.857161102042" text-anchor="start" font-size="23.551671150234" fill="var(--code-bg)" font-family="Arial, sans-serif"/>
  <text x="60.339" y="371.428601836737" text-anchor="start" font-size="23.551671150234" fill="var(--code-bg)" font-family="Arial, sans-serif">Each .await = potential yield point</text>
  <text x="60.339" y="416.999936142852" text-anchor="start" font-size="23.551671150234" fill="var(--code-bg)" font-family="Arial, sans-serif">(future saves state, resumes later)</text>
  <rect x="792.5424" y="81.428495408157" width="447.4576" height="124.285699081631" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.189853692466" filter="url(#shadow)"/>
  <text x="1016.2712" y="135.285720367347" text-anchor="middle" font-size="25.514267427659" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Start</text>
  <text x="1016.2712" y="176.714215775505" text-anchor="middle" font-size="25.514267427659" fill="var(--text)" font-family="Arial, sans-serif">poll foo()</text>
  <rect x="792.5424" y="267.857097244894" width="447.4576" height="124.285699081631" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.189853692466" filter="url(#shadow)"/>
  <text x="1016.2712" y="321.714215775505" text-anchor="middle" font-size="25.514267427659" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">State 1</text>
  <text x="1016.2712" y="363.142817612242" text-anchor="middle" font-size="25.514267427659" fill="var(--text)" font-family="Arial, sans-serif">poll bar(a)</text>
  <rect x="792.5424" y="454.285699081631" width="447.4576" height="124.285699081631" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.189853692466" filter="url(#shadow)"/>
  <text x="1016.2712" y="508.142817612242" text-anchor="middle" font-size="25.514267427659" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Complete</text>
  <text x="1016.2712" y="549.571419448979" text-anchor="middle" font-size="25.514267427659" fill="var(--text)" font-family="Arial, sans-serif">return a+b</text>
  <line x1="1016.2712" y1="205.714300918369" x2="1016.2712" y2="267.857097244894" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1036.6101" y="245.071376877547" text-anchor="start" font-size="21.58907487281" fill="var(--text-muted)" font-family="Arial, sans-serif">Ready(a)</text>
  <line x1="1016.2712" y1="392.142796326526" x2="1016.2712" y2="454.285699081631" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1036.6101" y="431.499978714284" text-anchor="start" font-size="21.58907487281" fill="var(--text-muted)" font-family="Arial, sans-serif">Ready(b)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="56.1111" width="412.5" height="451.1111" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="56.1111" width="412.5" height="37.0556" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="58.75" y="80.2777" width="412.5" height="12.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="265" y="80.2777" font-family="Arial,sans-serif" font-size="16.5115" font-weight="bold" fill="var(--bg)" text-anchor="middle">Rust Side</text>
  <rect x="77.5" y="107.6667" width="375" height="64.4444" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="96.25" y="127" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)">Safe Rust code</text>
  <text x="96.25" y="143.1111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">fn compute(x: i32) -&gt; i32 {</text>
  <text x="96.25" y="157.6111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">    x * 2 }</text>
  <line x1="265" y1="172.1111" x2="265" y2="197.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="77.5" y="197.8889" width="375" height="80.5556" fill="var(--ok-fill)" rx="6" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="96.25" y="217.2223" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)">extern "C" export</text>
  <text x="96.25" y="233.3333" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">#[no_mangle]</text>
  <text x="96.25" y="247.8333" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">pub extern "C" fn compute(x: i32)</text>
  <text x="96.25" y="262.3333" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">    -&gt; i32 { ... }</text>
  <line x1="265" y1="278.4444" x2="265" y2="304.2223" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="77.5" y="304.2223" width="375" height="88.6111" fill="var(--warn-fill)" rx="6" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="96.25" y="323.5556" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)">unsafe block (when calling C)</text>
  <text x="96.25" y="339.6667" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">extern "C" {</text>
  <text x="96.25" y="354.1667" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">    fn c_func(n: i32) -&gt; i32;</text>
  <text x="96.25" y="368.6667" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">}</text>
  <text x="96.25" y="383.1667" font-family="Courier New,monospace" font-size="10.4284" fill="var(--danger-accent)">// unsafe { c_func(42) }</text>
  <rect x="77.5" y="407.3333" width="375" height="83.7777" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="96.25" y="425.0556" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">Type Mapping</text>
  <text x="96.25" y="439.5556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Rust i32         ↔   C int</text>
  <text x="96.25" y="452.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Rust *const T    ↔   C const T*</text>
  <text x="96.25" y="465.3333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Rust *mut T      ↔   C T*</text>
  <text x="96.25" y="478.2223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Rust c_char      ↔   C char  (libc)</text>
  <rect x="490" y="56.1111" width="187.5" height="451.1111" fill="var(--text)" rx="6" filter="url(#shadow)" />
  <text x="583.75" y="273.6111" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle" transform="rotate(-90 580 300)">C  ABI  Boundary</text>
  <line x1="490" y1="201.1111" x2="677.4999" y2="201.1111" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)" />
  <text x="581.875" y="197.0833" font-family="Arial,sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">call</text>
  <line x1="677.4999" y1="233.3333" x2="490" y2="233.3333" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)" />
  <text x="581.875" y="247.8333" font-family="Arial,sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">return</text>
  <text x="583.75" y="338.0556" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">• no RAII</text>
  <text x="583.75" y="354.1667" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">• no panics</text>
  <text x="583.75" y="370.2777" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">• raw ptrs</text>
  <text x="583.75" y="386.3889" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">• C types</text>
  <rect x="696.25" y="56.1111" width="412.5" height="451.1111" fill="var(--warn-fill)" rx="6" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="696.25" y="56.1111" width="412.5" height="37.0556" fill="var(--warn-accent)" rx="6" />
  <rect x="696.25" y="80.2777" width="412.5" height="12.8889" fill="var(--warn-accent)" rx="6"/>
  <text x="902.5" y="80.2777" font-family="Arial,sans-serif" font-size="16.5115" font-weight="bold" fill="var(--bg)" text-anchor="middle">C Side</text>
  <rect x="715" y="107.6667" width="375" height="80.5556" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="733.75" y="127" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)">C header (generated by cbindgen)</text>
  <text x="733.75" y="143.1111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">/* compute.h */</text>
  <text x="733.75" y="157.6111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">int compute(int x);</text>
  <text x="733.75" y="172.1111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">void free_string(char* s);</text>
  <line x1="902.5" y1="188.2223" x2="902.5" y2="210.7777" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="715" y="210.7777" width="375" height="96.6667" fill="var(--warn-fill)" rx="6" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="733.75" y="230.1111" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)">C code using Rust library</text>
  <text x="733.75" y="246.2223" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">#include "compute.h"</text>
  <text x="733.75" y="260.7223" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">int main() {</text>
  <text x="733.75" y="275.2223" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">    int r = compute(21);</text>
  <text x="733.75" y="289.7223" font-family="Courier New,monospace" font-size="10.4284" fill="var(--text)">    // r == 42 }</text>
  <line x1="902.5" y1="307.4444" x2="902.5" y2="330" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="715" y="330" width="375" height="80.5556" fill="var(--danger-fill)" rx="6" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="733.75" y="349.3333" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)">Ownership at boundary</text>
  <text x="733.75" y="365.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Memory allocated in Rust → free in Rust</text>
  <text x="733.75" y="379.9444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Memory allocated in C   → free in C</text>
  <text x="733.75" y="394.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">Never mix allocators!</text>
  <rect x="58.75" y="523.3333" width="1162.5" height="77.3333" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="544.2777" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">bindgen Workflow (C → Rust)</text>
  <rect x="86.875" y="553.9444" width="168.75" height="32.2223" fill="var(--primary-accent)" rx="6" />
  <text x="171.25" y="574.0833" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--bg)" text-anchor="middle">C header (.h)</text>
  <line x1="255.6249" y1="570.0556" x2="302.5" y2="570.0556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="304.375" y="553.9444" width="168.75" height="32.2223" fill="var(--primary-accent)" rx="6" />
  <text x="388.75" y="574.0833" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--bg)" text-anchor="middle">bindgen (build.rs)</text>
  <line x1="474.9999" y1="570.0556" x2="521.875" y2="570.0556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="523.75" y="553.9444" width="187.5" height="32.2223" fill="var(--primary-accent)" rx="6" />
  <text x="617.5" y="574.0833" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--bg)" text-anchor="middle">bindings.rs (auto)</text>
  <line x1="713.125" y1="570.0556" x2="760" y2="570.0556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="761.8749" y="553.9444" width="187.5" height="32.2223" fill="var(--primary-accent)" rx="6" />
  <text x="855.6249" y="574.0833" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--bg)" text-anchor="middle">unsafe Rust wrappers</text>
  <line x1="951.25" y1="570.0556" x2="998.1249" y2="570.0556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="1000" y="553.9444" width="183.75" height="32.2223" fill="var(--primary-accent)" rx="6" />
  <text x="1091.8749" y="574.0833" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--bg)" text-anchor="middle">Safe Rust API</text>
</svg>
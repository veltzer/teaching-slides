<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="425.806452" height="480.47341" fill="url(#grad-primary)" rx="6.29127" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="425.806452" height="39.467507" fill="url(#grad-primary)" rx="6.29127" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="65.739577" width="425.806452" height="13.727824" fill="url(#grad-primary)" rx="6.29127" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="252.903226" y="65.739577" font-size="17.31305" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Rust Side</text>
  <rect x="59.354839" y="94.911296" width="387.096774" height="68.639013" fill="var(--bg)" rx="6.29127"/>
  <text x="78.709677" y="115.502978" font-size="12.756913" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Safe Rust</text>
  <text x="78.709677" y="132.662731" font-size="10.934646" fill="var(--text)" font-family="Courier New, monospace">fn compute(x: i32)</text>
  <text x="78.709677" y="148.10652" font-size="10.934646" fill="var(--text)" font-family="Courier New, monospace">    -&gt; i32 { x*2 }</text>
  <line x1="252.903226" y1="163.550308" x2="252.903226" y2="191.005956" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="59.354839" y="191.005956" width="387.096774" height="85.798873" fill="url(#grad-ok)" rx="6.29127" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="78.709677" y="211.597745" font-size="12.756913" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">export</text>
  <text x="78.709677" y="228.757392" font-size="10.934646" fill="var(--text)" font-family="Courier New, monospace">#[no_mangle]</text>
  <text x="78.709677" y="244.201181" font-size="10.934646" fill="var(--text)" font-family="Courier New, monospace">pub extern "C"</text>
  <text x="78.709677" y="259.644969" font-size="10.934646" fill="var(--text)" font-family="Courier New, monospace">fn compute(x: i32)</text>
  <line x1="252.903226" y1="276.804722" x2="252.903226" y2="304.260477" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="59.354839" y="304.260477" width="387.096774" height="94.378696" fill="url(#grad-warn)" rx="6.29127" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="78.709677" y="324.852159" font-size="12.756913" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">unsafe: calling C</text>
  <text x="78.709677" y="342.011912" font-size="10.934646" fill="var(--text)" font-family="Courier New, monospace">extern "C" {</text>
  <text x="78.709677" y="357.455701" font-size="10.934646" fill="var(--text)" font-family="Courier New, monospace">  fn c_func(n: i32);</text>
  <text x="78.709677" y="372.89949" font-size="10.934646" fill="var(--text)" font-family="Courier New, monospace">}</text>
  <text x="78.709677" y="388.343278" font-size="10.934646" fill="var(--danger-accent)" font-family="Courier New, monospace">unsafe { c_func(42) }</text>
  <rect x="59.354839" y="414.082855" width="387.096774" height="89.230695" fill="var(--bg)" rx="6.29127"/>
  <text x="78.709677" y="432.958679" font-size="11.845832" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Types</text>
  <text x="78.709677" y="448.402468" font-size="10.934646" fill="var(--text)" font-family="Arial, sans-serif">i32 ↔ int</text>
  <text x="78.709677" y="462.130185" font-size="10.934646" fill="var(--text)" font-family="Arial, sans-serif">*const T ↔ const T*</text>
  <text x="78.709677" y="475.858009" font-size="10.934646" fill="var(--text)" font-family="Arial, sans-serif">*mut T ↔ T*</text>
  <text x="78.709677" y="489.585939" font-size="10.934646" fill="var(--text)" font-family="Arial, sans-serif">c_char ↔ char</text>
  <rect x="485.16129" y="40" width="193.548387" height="480.47341" fill="var(--text)" rx="6.29127"/>
  <text x="583.75" y="273.6111" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle" transform="rotate(-90 580 300)" font-family="Arial, sans-serif">C ABI</text>
  <line x1="485.16129" y1="194.437886" x2="678.709574" y2="194.437886" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <text x="580" y="190.147921" font-size="10.48545" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">call</text>
  <line x1="678.709574" y1="228.757392" x2="485.16129" y2="228.757392" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <text x="580" y="244.201181" font-size="10.48545" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">return</text>
  <text x="581.935484" y="340.295948" font-size="10.48545" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">no RAII</text>
  <text x="581.935484" y="357.455701" font-size="10.48545" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">no panic</text>
  <text x="581.935484" y="374.615348" font-size="10.48545" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">raw ptrs</text>
  <text x="581.935484" y="391.775207" font-size="10.48545" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">C types</text>
  <rect x="698.064516" y="40" width="425.806452" height="480.47341" fill="url(#grad-warn)" rx="6.29127" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="698.064516" y="40" width="425.806452" height="39.467507" fill="var(--warn-accent)" rx="6.29127"/>
  <rect x="698.064516" y="65.739577" width="425.806452" height="13.727824" fill="var(--warn-accent)" rx="6.29127"/>
  <text x="910.967742" y="65.739577" font-size="17.31305" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">C Side</text>
  <rect x="717.419355" y="94.911296" width="387.096774" height="85.798873" fill="var(--bg)" rx="6.29127"/>
  <text x="736.774194" y="115.502978" font-size="12.756913" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">header</text>
  <text x="736.774194" y="132.662731" font-size="10.934646" fill="var(--text)" font-family="Courier New, monospace">/* compute.h */</text>
  <text x="736.774194" y="148.10652" font-size="10.934646" fill="var(--text)" font-family="Courier New, monospace">int compute(int x);</text>
  <text x="736.774194" y="163.550308" font-size="10.934646" fill="var(--text)" font-family="Courier New, monospace">void free_string(char*);</text>
  <line x1="910.967742" y1="180.710168" x2="910.967742" y2="204.733674" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="717.419355" y="204.733674" width="387.096774" height="102.958626" fill="url(#grad-warn)" rx="6.29127" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="736.774194" y="225.325463" font-size="12.756913" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">C calls Rust</text>
  <text x="736.774194" y="242.485322" font-size="10.934646" fill="var(--text)" font-family="Courier New, monospace">#include "compute.h"</text>
  <text x="736.774194" y="257.929111" font-size="10.934646" fill="var(--text)" font-family="Courier New, monospace">int r = compute(21);</text>
  <line x1="910.967742" y1="307.692299" x2="910.967742" y2="331.716018" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="717.419355" y="331.716018" width="387.096774" height="85.798873" fill="url(#grad-danger)" rx="6.29127" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="736.774194" y="352.307701" font-size="12.756913" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Ownership</text>
  <text x="736.774194" y="369.467454" font-size="10.934646" fill="var(--text)" font-family="Arial, sans-serif">Rust alloc → Rust free</text>
  <text x="736.774194" y="384.911242" font-size="10.934646" fill="var(--text)" font-family="Arial, sans-serif">C alloc → C free</text>
  <text x="736.774194" y="400.355031" font-size="10.934646" fill="var(--danger-accent)" font-family="Arial, sans-serif">Never mix!</text>
  <rect x="40" y="537.633163" width="1200" height="82.366837" fill="url(#grad-primary)" rx="6.29127" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="559.94081" font-size="13.668203" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">bindgen: C → Rust</text>
  <rect x="69.032258" y="570.236705" width="174.193548" height="34.319613" fill="var(--primary-accent)" rx="6.29127"/>
  <text x="156.129032" y="591.686423" font-size="11.845832" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">C header (.h)</text>
  <line x1="243.225703" y1="587.396565" x2="291.612903" y2="587.396565" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="293.548387" y="570.236705" width="174.193548" height="34.319613" fill="var(--primary-accent)" rx="6.29127"/>
  <text x="380.645161" y="591.686423" font-size="11.845832" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">bindgen</text>
  <line x1="469.677316" y1="587.396565" x2="518.064516" y2="587.396565" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="520" y="570.236705" width="193.548387" height="34.319613" fill="var(--primary-accent)" rx="6.29127"/>
  <text x="616.774194" y="591.686423" font-size="11.845832" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">bindings.rs</text>
  <line x1="715.483871" y1="587.396565" x2="763.870968" y2="587.396565" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="765.806348" y="570.236705" width="193.548387" height="34.319613" fill="var(--primary-accent)" rx="6.29127"/>
  <text x="862.580542" y="591.686423" font-size="11.845832" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">unsafe wrappers</text>
  <line x1="961.290323" y1="587.396565" x2="1009.677316" y2="587.396565" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="1011.612903" y="570.236705" width="189.677419" height="34.319613" fill="var(--primary-accent)" rx="6.29127"/>
  <text x="1106.45151" y="591.686423" font-size="11.845832" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Safe Rust API</text>
</svg>

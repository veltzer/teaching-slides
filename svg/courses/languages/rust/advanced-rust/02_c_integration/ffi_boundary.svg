<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="425.806452" height="480.47341" fill="var(--primary-fill)" rx="6.29127" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="40" width="425.806452" height="39.467507" fill="var(--primary-fill)" rx="6.29127" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="65.739577" width="425.806452" height="13.727824" fill="var(--primary-fill)" rx="6.29127" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="252.903226" y="65.739577" font-family="Arial,sans-serif" font-size="17.31305" font-weight="bold" fill="var(--bg)" text-anchor="middle">Rust Side</text>
  <rect x="59.354839" y="94.911296" width="387.096774" height="68.639013" fill="var(--bg)" rx="6.29127" filter="url(#shadow)" />
  <text x="78.709677" y="115.502978" font-family="Arial,sans-serif" font-size="12.756913" font-weight="bold" fill="var(--primary-accent)">Safe Rust code</text>
  <text x="78.709677" y="132.662731" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">fn compute(x: i32) -&gt; i32 {</text>
  <text x="78.709677" y="148.10652" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">    x * 2 }</text>
  <line x1="252.903226" y1="163.550308" x2="252.903226" y2="191.005956" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="59.354839" y="191.005956" width="387.096774" height="85.798873" fill="var(--ok-fill)" rx="6.29127" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="78.709677" y="211.597745" font-family="Arial,sans-serif" font-size="12.756913" font-weight="bold" fill="var(--ok-accent)">extern "C" export</text>
  <text x="78.709677" y="228.757392" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">#[no_mangle]</text>
  <text x="78.709677" y="244.201181" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">pub extern "C" fn compute(x: i32)</text>
  <text x="78.709677" y="259.644969" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">    -&gt; i32 { ... }</text>
  <line x1="252.903226" y1="276.804722" x2="252.903226" y2="304.260477" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="59.354839" y="304.260477" width="387.096774" height="94.378696" fill="var(--warn-fill)" rx="6.29127" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="78.709677" y="324.852159" font-family="Arial,sans-serif" font-size="12.756913" font-weight="bold" fill="var(--warn-accent)">unsafe block (when calling C)</text>
  <text x="78.709677" y="342.011912" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">extern "C" {</text>
  <text x="78.709677" y="357.455701" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">    fn c_func(n: i32) -&gt; i32;</text>
  <text x="78.709677" y="372.89949" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">}</text>
  <text x="78.709677" y="388.343278" font-family="Courier New,monospace" font-size="10.934646" fill="var(--danger-accent)">// unsafe { c_func(42) }</text>
  <rect x="59.354839" y="414.082855" width="387.096774" height="89.230695" fill="var(--bg)" rx="6.29127" filter="url(#shadow)" />
  <text x="78.709677" y="432.958679" font-family="Arial,sans-serif" font-size="11.845832" font-weight="bold" fill="var(--primary-accent)">Type Mapping</text>
  <text x="78.709677" y="448.402468" font-family="Arial,sans-serif" font-size="10.934646" fill="var(--text)">Rust i32         ↔   C int</text>
  <text x="78.709677" y="462.130185" font-family="Arial,sans-serif" font-size="10.934646" fill="var(--text)">Rust *const T    ↔   C const T*</text>
  <text x="78.709677" y="475.858009" font-family="Arial,sans-serif" font-size="10.934646" fill="var(--text)">Rust *mut T      ↔   C T*</text>
  <text x="78.709677" y="489.585939" font-family="Arial,sans-serif" font-size="10.934646" fill="var(--text)">Rust c_char      ↔   C char  (libc)</text>
  <rect x="485.16129" y="40" width="193.548387" height="480.47341" fill="var(--text)" rx="6.29127" filter="url(#shadow)" />
  <text x="583.75" y="273.6111" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle" transform="rotate(-90 580 300)">C  ABI  Boundary</text>
  <line x1="485.16129" y1="194.437886" x2="678.709574" y2="194.437886" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)" />
  <text x="580" y="190.147921" font-family="Arial,sans-serif" font-size="10.48545" fill="var(--text-faint)" text-anchor="middle">call</text>
  <line x1="678.709574" y1="228.757392" x2="485.16129" y2="228.757392" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)" />
  <text x="580" y="244.201181" font-family="Arial,sans-serif" font-size="10.48545" fill="var(--text-faint)" text-anchor="middle">return</text>
  <text x="581.935484" y="340.295948" font-family="Arial,sans-serif" font-size="10.48545" fill="var(--warn-accent)" text-anchor="middle">• no RAII</text>
  <text x="581.935484" y="357.455701" font-family="Arial,sans-serif" font-size="10.48545" fill="var(--warn-accent)" text-anchor="middle">• no panics</text>
  <text x="581.935484" y="374.615348" font-family="Arial,sans-serif" font-size="10.48545" fill="var(--warn-accent)" text-anchor="middle">• raw ptrs</text>
  <text x="581.935484" y="391.775207" font-family="Arial,sans-serif" font-size="10.48545" fill="var(--warn-accent)" text-anchor="middle">• C types</text>
  <rect x="698.064516" y="40" width="425.806452" height="480.47341" fill="var(--warn-fill)" rx="6.29127" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="698.064516" y="40" width="425.806452" height="39.467507" fill="var(--warn-accent)" rx="6.29127" />
  <rect x="698.064516" y="65.739577" width="425.806452" height="13.727824" fill="var(--warn-accent)" rx="6.29127"/>
  <text x="910.967742" y="65.739577" font-family="Arial,sans-serif" font-size="17.31305" font-weight="bold" fill="var(--bg)" text-anchor="middle">C Side</text>
  <rect x="717.419355" y="94.911296" width="387.096774" height="85.798873" fill="var(--bg)" rx="6.29127" filter="url(#shadow)" />
  <text x="736.774194" y="115.502978" font-family="Arial,sans-serif" font-size="12.756913" font-weight="bold" fill="var(--danger-accent)">C header (generated by cbindgen)</text>
  <text x="736.774194" y="132.662731" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">/* compute.h */</text>
  <text x="736.774194" y="148.10652" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">int compute(int x);</text>
  <text x="736.774194" y="163.550308" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">void free_string(char* s);</text>
  <line x1="910.967742" y1="180.710168" x2="910.967742" y2="204.733674" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="717.419355" y="204.733674" width="387.096774" height="102.958626" fill="var(--warn-fill)" rx="6.29127" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="736.774194" y="225.325463" font-family="Arial,sans-serif" font-size="12.756913" font-weight="bold" fill="var(--warn-accent)">C code using Rust library</text>
  <text x="736.774194" y="242.485322" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">#include "compute.h"</text>
  <text x="736.774194" y="257.929111" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">int main() {</text>
  <text x="736.774194" y="273.3729" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">    int r = compute(21);</text>
  <text x="736.774194" y="288.816688" font-family="Courier New,monospace" font-size="10.934646" fill="var(--text)">    // r == 42 }</text>
  <line x1="910.967742" y1="307.692299" x2="910.967742" y2="331.716018" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="717.419355" y="331.716018" width="387.096774" height="85.798873" fill="var(--danger-fill)" rx="6.29127" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="736.774194" y="352.307701" font-family="Arial,sans-serif" font-size="12.756913" font-weight="bold" fill="var(--danger-accent)">Ownership at boundary</text>
  <text x="736.774194" y="369.467454" font-family="Arial,sans-serif" font-size="10.934646" fill="var(--text)">Memory allocated in Rust → free in Rust</text>
  <text x="736.774194" y="384.911242" font-family="Arial,sans-serif" font-size="10.934646" fill="var(--text)">Memory allocated in C   → free in C</text>
  <text x="736.774194" y="400.355031" font-family="Arial,sans-serif" font-size="10.934646" fill="var(--danger-accent)">Never mix allocators!</text>
  <rect x="40" y="537.633163" width="1200" height="82.366837" fill="var(--primary-fill)" rx="6.29127" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="559.94081" font-family="Arial,sans-serif" font-size="13.668203" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">bindgen Workflow (C → Rust)</text>
  <rect x="69.032258" y="570.236705" width="174.193548" height="34.319613" fill="var(--primary-accent)" rx="6.29127" />
  <text x="156.129032" y="591.686423" font-family="Arial,sans-serif" font-size="11.845832" font-weight="bold" fill="var(--bg)" text-anchor="middle">C header (.h)</text>
  <line x1="243.225703" y1="587.396565" x2="291.612903" y2="587.396565" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="293.548387" y="570.236705" width="174.193548" height="34.319613" fill="var(--primary-accent)" rx="6.29127" />
  <text x="380.645161" y="591.686423" font-family="Arial,sans-serif" font-size="11.845832" font-weight="bold" fill="var(--bg)" text-anchor="middle">bindgen (build.rs)</text>
  <line x1="469.677316" y1="587.396565" x2="518.064516" y2="587.396565" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="520" y="570.236705" width="193.548387" height="34.319613" fill="var(--primary-accent)" rx="6.29127" />
  <text x="616.774194" y="591.686423" font-family="Arial,sans-serif" font-size="11.845832" font-weight="bold" fill="var(--bg)" text-anchor="middle">bindings.rs (auto)</text>
  <line x1="715.483871" y1="587.396565" x2="763.870968" y2="587.396565" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="765.806348" y="570.236705" width="193.548387" height="34.319613" fill="var(--primary-accent)" rx="6.29127" />
  <text x="862.580542" y="591.686423" font-family="Arial,sans-serif" font-size="11.845832" font-weight="bold" fill="var(--bg)" text-anchor="middle">unsafe Rust wrappers</text>
  <line x1="961.290323" y1="587.396565" x2="1009.677316" y2="587.396565" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="1011.612903" y="570.236705" width="189.677419" height="34.319613" fill="var(--primary-accent)" rx="6.29127" />
  <text x="1106.45151" y="591.686423" font-family="Arial,sans-serif" font-size="11.845832" font-weight="bold" fill="var(--bg)" text-anchor="middle">Safe Rust API</text>
</svg>
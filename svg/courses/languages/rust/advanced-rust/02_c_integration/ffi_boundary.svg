<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="17.7778" width="391.1111" height="497.7778" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="17.7778" y="17.7778" width="391.1111" height="40.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="17.7778" y="44.4444" width="391.1111" height="14.2222" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="213.3333" y="44.4444" font-family="Arial,sans-serif" font-size="16.8889" font-weight="bold" fill="var(--bg)" text-anchor="middle">Rust Side</text>
  <rect x="35.5556" y="74.6667" width="355.5556" height="71.1111" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="53.3333" y="96" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)">Safe Rust code</text>
  <text x="53.3333" y="113.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">fn compute(x: i32) -&gt; i32 {</text>
  <text x="53.3333" y="129.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">    x * 2 }</text>
  <line x1="213.3333" y1="145.7778" x2="213.3333" y2="174.2222" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="35.5556" y="174.2222" width="355.5556" height="88.8889" fill="var(--ok-fill)" rx="6" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="53.3333" y="195.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">extern "C" export</text>
  <text x="53.3333" y="213.3333" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">#[no_mangle]</text>
  <text x="53.3333" y="229.3333" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">pub extern "C" fn compute(x: i32)</text>
  <text x="53.3333" y="245.3333" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">    -&gt; i32 { ... }</text>
  <line x1="213.3333" y1="263.1111" x2="213.3333" y2="291.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="35.5556" y="291.5556" width="355.5556" height="97.7778" fill="var(--warn-fill)" rx="6" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="53.3333" y="312.8889" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-accent)">unsafe block (when calling C)</text>
  <text x="53.3333" y="330.6667" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">extern "C" {</text>
  <text x="53.3333" y="346.6667" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">    fn c_func(n: i32) -&gt; i32;</text>
  <text x="53.3333" y="362.6667" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">}</text>
  <text x="53.3333" y="378.6667" font-family="Courier New,monospace" font-size="10.6667" fill="var(--danger-accent)">// unsafe { c_func(42) }</text>
  <rect x="35.5556" y="405.3333" width="355.5556" height="92.4444" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="53.3333" y="424.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--primary-accent)">Type Mapping</text>
  <text x="53.3333" y="440.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Rust i32         ↔   C int</text>
  <text x="53.3333" y="455.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Rust *const T    ↔   C const T*</text>
  <text x="53.3333" y="469.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Rust *mut T      ↔   C T*</text>
  <text x="53.3333" y="483.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Rust c_char      ↔   C char  (libc)</text>
  <rect x="426.6667" y="17.7778" width="177.7778" height="497.7778" fill="var(--text)" rx="6" filter="url(#shadow)" />
  <text x="515.5556" y="257.7778" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle" transform="rotate(-90 580 300)">C  ABI  Boundary</text>
  <line x1="426.6667" y1="177.7778" x2="604.4444" y2="177.7778" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)" />
  <text x="513.7778" y="173.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">call</text>
  <line x1="604.4444" y1="213.3333" x2="426.6667" y2="213.3333" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)" />
  <text x="513.7778" y="229.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">return</text>
  <text x="515.5556" y="328.8889" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">• no RAII</text>
  <text x="515.5556" y="346.6667" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">• no panics</text>
  <text x="515.5556" y="364.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">• raw ptrs</text>
  <text x="515.5556" y="382.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">• C types</text>
  <rect x="622.2222" y="17.7778" width="391.1111" height="497.7778" fill="var(--warn-fill)" rx="6" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="622.2222" y="17.7778" width="391.1111" height="40.8889" fill="var(--warn-accent)" rx="6" />
  <rect x="622.2222" y="44.4444" width="391.1111" height="14.2222" fill="var(--warn-accent)" rx="6"/>
  <text x="817.7778" y="44.4444" font-family="Arial,sans-serif" font-size="16.8889" font-weight="bold" fill="var(--bg)" text-anchor="middle">C Side</text>
  <rect x="640" y="74.6667" width="355.5556" height="88.8889" fill="var(--bg)" rx="6" filter="url(#shadow)" />
  <text x="657.7778" y="96" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">C header (generated by cbindgen)</text>
  <text x="657.7778" y="113.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">/* compute.h */</text>
  <text x="657.7778" y="129.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">int compute(int x);</text>
  <text x="657.7778" y="145.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">void free_string(char* s);</text>
  <line x1="817.7778" y1="163.5556" x2="817.7778" y2="188.4444" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="640" y="188.4444" width="355.5556" height="106.6667" fill="var(--warn-fill)" rx="6" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="657.7778" y="209.7778" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-accent)">C code using Rust library</text>
  <text x="657.7778" y="227.5556" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">#include "compute.h"</text>
  <text x="657.7778" y="243.5556" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">int main() {</text>
  <text x="657.7778" y="259.5556" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">    int r = compute(21);</text>
  <text x="657.7778" y="275.5556" font-family="Courier New,monospace" font-size="10.6667" fill="var(--text)">    // r == 42 }</text>
  <line x1="817.7778" y1="295.1111" x2="817.7778" y2="320" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="640" y="320" width="355.5556" height="88.8889" fill="var(--danger-fill)" rx="6" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="657.7778" y="341.3333" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">Ownership at boundary</text>
  <text x="657.7778" y="359.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Memory allocated in Rust → free in Rust</text>
  <text x="657.7778" y="375.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)">Memory allocated in C   → free in C</text>
  <text x="657.7778" y="391.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-accent)">Never mix allocators!</text>
  <rect x="17.7778" y="533.3333" width="1102.2222" height="85.3333" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="556.4444" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">bindgen Workflow (C → Rust)</text>
  <rect x="44.4444" y="567.1111" width="160" height="35.5556" fill="var(--primary-accent)" rx="6" />
  <text x="124.4444" y="589.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--bg)" text-anchor="middle">C header (.h)</text>
  <line x1="204.4444" y1="584.8889" x2="248.8889" y2="584.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="250.6667" y="567.1111" width="160" height="35.5556" fill="var(--primary-accent)" rx="6" />
  <text x="330.6667" y="589.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--bg)" text-anchor="middle">bindgen (build.rs)</text>
  <line x1="412.4444" y1="584.8889" x2="456.8889" y2="584.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="458.6667" y="567.1111" width="177.7778" height="35.5556" fill="var(--primary-accent)" rx="6" />
  <text x="547.5556" y="589.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--bg)" text-anchor="middle">bindings.rs (auto)</text>
  <line x1="638.2222" y1="584.8889" x2="682.6667" y2="584.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="684.4444" y="567.1111" width="177.7778" height="35.5556" fill="var(--primary-accent)" rx="6" />
  <text x="773.3333" y="589.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--bg)" text-anchor="middle">unsafe Rust wrappers</text>
  <line x1="864" y1="584.8889" x2="908.4444" y2="584.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="910.2222" y="567.1111" width="174.2222" height="35.5556" fill="var(--primary-accent)" rx="6" />
  <text x="997.3333" y="589.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--bg)" text-anchor="middle">Safe Rust API</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <circle cx="640" cy="330" r="166.8533" fill="none" stroke="var(--danger-border)" stroke-width="4.2667" opacity="0.3"/>
  <circle cx="640" cy="330" r="125.1399" fill="none" stroke="var(--danger-border)" stroke-width="2.8444" opacity="0.2"/>
  <rect x="617.5" y="141.5" width="45" height="36.25" rx="6" fill="url(#grad-danger)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="617.5" y="482.25" width="45" height="36.25" rx="6" fill="url(#grad-danger)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="308.25" width="37.5" height="43.5" rx="6" fill="url(#grad-danger)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="797.5" y="308.25" width="37.5" height="43.5" rx="6" fill="url(#grad-danger)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="115" y="98" width="299.9999" height="101.5" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1333"/>
  <text x="137.5" y="134.25" font-size="16.6854" fill="var(--danger-accent)" font-family="Courier New, monospace">fn</text>
  <text x="167.5" y="134.25" font-size="16.6854" fill="var(--warn-accent)" font-family="Courier New, monospace">longest</text>
  <text x="257.5" y="134.25" font-size="16.6854" fill="var(--primary-accent)" font-family="Courier New, monospace">&lt;'a&gt;</text>
  <text x="310" y="134.25" font-size="16.6854" fill="var(--bg)" font-family="Courier New, monospace">(</text>
  <text x="152.5" y="163.25" font-size="16.6854" fill="var(--bg)" font-family="Courier New, monospace">x: &amp;</text>
  <text x="204.9999" y="163.25" font-size="16.6854" fill="var(--primary-accent)" font-family="Courier New, monospace">'a</text>
  <text x="235" y="163.25" font-size="16.6854" fill="var(--danger-accent)" font-family="Courier New, monospace">str</text>
  <text x="272.4999" y="163.25" font-size="16.6854" fill="var(--bg)" font-family="Courier New, monospace">)</text>
  <text x="287.5" y="163.25" font-size="16.6854" fill="var(--bg)" font-family="Courier New, monospace">-&gt; &amp;</text>
  <text x="339.9999" y="163.25" font-size="16.6854" fill="var(--primary-accent)" font-family="Courier New, monospace">'a</text>
  <text x="370" y="163.25" font-size="16.6854" fill="var(--danger-accent)" font-family="Courier New, monospace">str</text>
  <text x="137.5" y="185" font-size="13.9044" fill="var(--primary-accent)" font-family="Courier New, monospace">// lifetimes</text>
  <rect x="865" y="98" width="299.9999" height="101.5" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="2.1333"/>
  <text x="887.5" y="134.25" font-size="16.6854" fill="var(--danger-accent)" font-family="Courier New, monospace">impl</text>
  <text x="939.9999" y="134.25" font-size="16.6854" fill="var(--warn-accent)" font-family="Courier New, monospace">Iterator</text>
  <text x="1052.5" y="134.25" font-size="16.6854" fill="var(--danger-accent)" font-family="Courier New, monospace">for</text>
  <text x="1090" y="134.25" font-size="16.6854" fill="var(--primary-accent)" font-family="Courier New, monospace">Fib</text>
  <text x="910" y="163.25" font-size="16.6854" fill="var(--danger-accent)" font-family="Courier New, monospace">type</text>
  <text x="970" y="163.25" font-size="16.6854" fill="var(--bg)" font-family="Courier New, monospace">Item =</text>
  <text x="1060" y="163.25" font-size="16.6854" fill="var(--primary-accent)" font-family="Courier New, monospace">u64</text>
  <text x="887.5" y="185" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">// trait impl</text>
  <rect x="115" y="460.5" width="299.9999" height="101.5" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="2.1333"/>
  <text x="137.5" y="496.75" font-size="16.6854" fill="var(--danger-accent)" font-family="Courier New, monospace">async fn</text>
  <text x="235" y="496.75" font-size="16.6854" fill="var(--warn-accent)" font-family="Courier New, monospace">fetch</text>
  <text x="295" y="496.75" font-size="16.6854" fill="var(--bg)" font-family="Courier New, monospace">() {</text>
  <text x="160" y="525.75" font-size="16.6854" fill="var(--bg)" font-family="Courier New, monospace">client.</text>
  <text x="250" y="525.75" font-size="16.6854" fill="var(--warn-accent)" font-family="Courier New, monospace">get</text>
  <text x="287.5" y="525.75" font-size="16.6854" fill="var(--bg)" font-family="Courier New, monospace">(url).</text>
  <text x="355" y="525.75" font-size="16.6854" fill="var(--primary-accent)" font-family="Courier New, monospace">await</text>
  <text x="137.5" y="547.5" font-size="13.9044" fill="var(--warn-accent)" font-family="Courier New, monospace">// async runtime</text>
  <rect x="865" y="460.5" width="299.9999" height="101.5" rx="6" fill="var(--code-bg)" stroke="var(--danger-border)" stroke-width="2.1333"/>
  <text x="887.5" y="496.75" font-size="16.6854" fill="var(--danger-accent)" font-family="Courier New, monospace">unsafe</text>
  <text x="970" y="496.75" font-size="16.6854" fill="var(--bg)" font-family="Courier New, monospace">{</text>
  <text x="910" y="525.75" font-size="16.6854" fill="var(--bg)" font-family="Courier New, monospace">*raw_ptr = </text>
  <text x="1045" y="525.75" font-size="16.6854" fill="var(--warn-accent)" font-family="Courier New, monospace">42</text>
  <text x="1074.9999" y="525.75" font-size="16.6854" fill="var(--bg)" font-family="Courier New, monospace">;</text>
  <text x="887.5" y="547.5" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">// unsafe blocks</text>
  <text x="595" y="351.75" font-size="83.4266" fill="var(--danger-accent)" font-weight="bold" opacity="0.6" font-family="Arial, sans-serif">R</text>
</svg>

<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Rust gear outline -->
  <circle cx="400" cy="200" r="120" fill="none" stroke="#e94560" stroke-width="3" opacity="0.3"/>
  <circle cx="400" cy="200" r="90" fill="none" stroke="#e94560" stroke-width="2" opacity="0.2"/>
  <!-- Gear teeth -->
  <rect x="385" y="70" width="30" height="25" rx="3" fill="#e94560" opacity="0.3"/>
  <rect x="385" y="305" width="30" height="25" rx="3" fill="#e94560" opacity="0.3"/>
  <rect x="270" y="185" width="25" height="30" rx="3" fill="#e94560" opacity="0.3"/>
  <rect x="505" y="185" width="25" height="30" rx="3" fill="#e94560" opacity="0.3"/>
  <!-- Advanced concepts -->
  <!-- Lifetime annotations -->
  <rect x="50" y="40" width="200" height="70" rx="6" fill="#16213e" stroke="#53d8fb" stroke-width="1.5"/>
  <text x="65" y="65" font-family="monospace" font-size="12" fill="#e94560">fn</text>
  <text x="85" y="65" font-family="monospace" font-size="12" fill="#ffd93d">longest</text>
  <text x="145" y="65" font-family="monospace" font-size="12" fill="#53d8fb">&lt;'a&gt;</text>
  <text x="180" y="65" font-family="monospace" font-size="12" fill="white">(</text>
  <text x="75" y="85" font-family="monospace" font-size="12" fill="white">x: &amp;</text>
  <text x="110" y="85" font-family="monospace" font-size="12" fill="#53d8fb">'a</text>
  <text x="130" y="85" font-family="monospace" font-size="12" fill="#e94560">str</text>
  <text x="155" y="85" font-family="monospace" font-size="12" fill="white">)</text>
  <text x="165" y="85" font-family="monospace" font-size="12" fill="white">-&gt; &amp;</text>
  <text x="200" y="85" font-family="monospace" font-size="12" fill="#53d8fb">'a</text>
  <text x="220" y="85" font-family="monospace" font-size="12" fill="#e94560">str</text>
  <text x="65" y="100" font-family="monospace" font-size="10" fill="#53d8fb">// lifetimes</text>
  <!-- Trait objects -->
  <rect x="550" y="40" width="200" height="70" rx="6" fill="#16213e" stroke="#00b894" stroke-width="1.5"/>
  <text x="565" y="65" font-family="monospace" font-size="12" fill="#e94560">impl</text>
  <text x="600" y="65" font-family="monospace" font-size="12" fill="#ffd93d">Iterator</text>
  <text x="675" y="65" font-family="monospace" font-size="12" fill="#e94560">for</text>
  <text x="700" y="65" font-family="monospace" font-size="12" fill="#53d8fb">Fib</text>
  <text x="580" y="85" font-family="monospace" font-size="12" fill="#e94560">type</text>
  <text x="620" y="85" font-family="monospace" font-size="12" fill="white">Item =</text>
  <text x="680" y="85" font-family="monospace" font-size="12" fill="#53d8fb">u64</text>
  <text x="565" y="100" font-family="monospace" font-size="10" fill="#00b894">// trait impl</text>
  <!-- Async -->
  <rect x="50" y="290" width="200" height="70" rx="6" fill="#16213e" stroke="#ffd93d" stroke-width="1.5"/>
  <text x="65" y="315" font-family="monospace" font-size="12" fill="#e94560">async fn</text>
  <text x="130" y="315" font-family="monospace" font-size="12" fill="#ffd93d">fetch</text>
  <text x="170" y="315" font-family="monospace" font-size="12" fill="white">() {</text>
  <text x="80" y="335" font-family="monospace" font-size="12" fill="white">client.</text>
  <text x="140" y="335" font-family="monospace" font-size="12" fill="#ffd93d">get</text>
  <text x="165" y="335" font-family="monospace" font-size="12" fill="white">(url).</text>
  <text x="210" y="335" font-family="monospace" font-size="12" fill="#53d8fb">await</text>
  <text x="65" y="350" font-family="monospace" font-size="10" fill="#ffd93d">// async runtime</text>
  <!-- Unsafe -->
  <rect x="550" y="290" width="200" height="70" rx="6" fill="#16213e" stroke="#e94560" stroke-width="1.5"/>
  <text x="565" y="315" font-family="monospace" font-size="12" fill="#e94560">unsafe</text>
  <text x="620" y="315" font-family="monospace" font-size="12" fill="white">{</text>
  <text x="580" y="335" font-family="monospace" font-size="12" fill="white">*raw_ptr = </text>
  <text x="670" y="335" font-family="monospace" font-size="12" fill="#ffd93d">42</text>
  <text x="690" y="335" font-family="monospace" font-size="12" fill="white">;</text>
  <text x="565" y="350" font-family="monospace" font-size="10" fill="#e94560">// unsafe blocks</text>
  <!-- Center R -->
  <text x="370" y="215" font-family="serif" font-size="60" fill="#e94560" font-weight="bold" opacity="0.6">R</text>

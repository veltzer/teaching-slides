<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="42.6667" y="36" width="576" height="144" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="330.6667" y="90" text-anchor="middle" font-size="21.3333" fill="#c62828">let s1 = String::from("hi"); let s2 = s1;</text>
  <text x="330.6667" y="151.2" text-anchor="middle" font-size="21.3333" fill="#c62828">println!("{}", s1); // Error: value moved</text>
  <rect x="661.3333" y="36" width="576" height="144" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="949.3333" y="90" text-anchor="middle" font-size="21.3333" fill="#2e7d32">let s1 = String::from("hi");</text>
  <text x="949.3333" y="151.2" text-anchor="middle" font-size="21.3333" fill="#2e7d32">let s2 = s1.clone(); // OK: deep copy</text>
  <rect x="42.6667" y="234" width="576" height="144" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="330.6667" y="288" text-anchor="middle" font-size="21.3333" fill="#c62828">let mut s = String::new();</text>
  <text x="330.6667" y="349.2" text-anchor="middle" font-size="21.3333" fill="#c62828">let r1 = &amp;mut s; let r2 = &amp;mut s; // Error</text>
  <rect x="661.3333" y="234" width="576" height="144" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="949.3333" y="288" text-anchor="middle" font-size="21.3333" fill="#2e7d32">Use r1, then drop scope;</text>
  <text x="949.3333" y="349.2" text-anchor="middle" font-size="21.3333" fill="#2e7d32">then create r2 // OK</text>
  <rect x="42.6667" y="432" width="576" height="144" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="330.6667" y="486" text-anchor="middle" font-size="21.3333" fill="#c62828">Missing semicolons / wrong return</text>
  <text x="330.6667" y="547.2" text-anchor="middle" font-size="21.3333" fill="#c62828">fn f() -&gt; i32 { 5; } // returns ()</text>
  <rect x="661.3333" y="432" width="576" height="144" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="949.3333" y="486" text-anchor="middle" font-size="21.3333" fill="#2e7d32">Implicit return (no semicolon)</text>
  <text x="949.3333" y="547.2" text-anchor="middle" font-size="21.3333" fill="#2e7d32">fn f() -&gt; i32 { 5 } // returns 5</text>
  <rect x="256" y="619.2" width="341.3333" height="79.2" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="426.6667" y="673.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Common Mistakes</text>
  <rect x="682.6667" y="619.2" width="341.3333" height="79.2" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="853.3333" y="673.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Correct Patterns</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="578.5715" height="126.087" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="329.2857" y="87.2826" text-anchor="middle" font-size="20.0069" fill="var(--danger-accent)">let s1 = String::from("hi"); let s2 = s1;</text>
  <text x="329.2857" y="140.8696" text-anchor="middle" font-size="20.0069" fill="var(--danger-accent)">println!("{}", s1); // Error: value moved</text>
  <rect x="661.4285" y="40" width="578.5715" height="126.087" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="950.7142" y="87.2826" text-anchor="middle" font-size="20.0069" fill="var(--ok-accent)">let s1 = String::from("hi");</text>
  <text x="950.7142" y="140.8696" text-anchor="middle" font-size="20.0069" fill="var(--ok-accent)">let s2 = s1.clone(); // OK: deep copy</text>
  <rect x="40" y="213.3696" width="578.5715" height="126.087" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="329.2857" y="260.6521" text-anchor="middle" font-size="20.0069" fill="var(--danger-accent)">let mut s = String::new();</text>
  <text x="329.2857" y="314.2391" text-anchor="middle" font-size="20.0069" fill="var(--danger-accent)">let r1 = &amp;mut s; let r2 = &amp;mut s; // Error</text>
  <rect x="661.4285" y="213.3696" width="578.5715" height="126.087" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="950.7142" y="260.6521" text-anchor="middle" font-size="20.0069" fill="var(--ok-accent)">Use r1, then drop scope;</text>
  <text x="950.7142" y="314.2391" text-anchor="middle" font-size="20.0069" fill="var(--ok-accent)">then create r2 // OK</text>
  <rect x="40" y="386.7391" width="578.5715" height="126.087" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="329.2857" y="434.0217" text-anchor="middle" font-size="20.0069" fill="var(--danger-accent)">Missing semicolons / wrong return</text>
  <text x="329.2857" y="487.6087" text-anchor="middle" font-size="20.0069" fill="var(--danger-accent)">fn f() -&gt; i32 { 5; } // returns ()</text>
  <rect x="661.4285" y="386.7391" width="578.5715" height="126.087" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="950.7142" y="434.0217" text-anchor="middle" font-size="20.0069" fill="var(--ok-accent)">Implicit return (no semicolon)</text>
  <text x="950.7142" y="487.6087" text-anchor="middle" font-size="20.0069" fill="var(--ok-accent)">fn f() -&gt; i32 { 5 } // returns 5</text>
  <rect x="254.2858" y="550.6522" width="342.8571" height="69.3478" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="425.7144" y="597.9348" text-anchor="middle" font-size="20.0069" font-weight="bold">Common Mistakes</text>
  <rect x="682.8572" y="550.6522" width="342.8571" height="69.3478" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="854.2856" y="597.9348" text-anchor="middle" font-size="20.0069" font-weight="bold">Correct Patterns</text>
</svg>
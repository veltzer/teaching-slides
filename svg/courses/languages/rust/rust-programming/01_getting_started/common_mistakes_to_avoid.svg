<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="39.0989" y="32.9897" width="527.8351" height="131.9588" fill="#ffebee" stroke="#333" stroke-width="3.9099" rx="9.7748" />
  <ns0:text x="303.0164" y="82.4742" text-anchor="middle" font-size="19.5494" fill="#c62828">let s1 = String::from("hi"); let s2 = s1;</ns0:text>
  <ns0:text x="303.0164" y="138.5567" text-anchor="middle" font-size="19.5494" fill="#c62828">println!("{}", s1); // Error: value moved</ns0:text>
  <ns0:rect x="606.0328" y="32.9897" width="527.8351" height="131.9588" fill="#e8f5e9" stroke="#333" stroke-width="3.9099" rx="9.7748" />
  <ns0:text x="869.9503" y="82.4742" text-anchor="middle" font-size="19.5494" fill="#2e7d32">let s1 = String::from("hi");</ns0:text>
  <ns0:text x="869.9503" y="138.5567" text-anchor="middle" font-size="19.5494" fill="#2e7d32">let s2 = s1.clone(); // OK: deep copy</ns0:text>
  <ns0:rect x="39.0989" y="214.433" width="527.8351" height="131.9588" fill="#ffebee" stroke="#333" stroke-width="3.9099" rx="9.7748" />
  <ns0:text x="303.0164" y="263.9175" text-anchor="middle" font-size="19.5494" fill="#c62828">let mut s = String::new();</ns0:text>
  <ns0:text x="303.0164" y="320" text-anchor="middle" font-size="19.5494" fill="#c62828">let r1 = &amp;mut s; let r2 = &amp;mut s; // Error</ns0:text>
  <ns0:rect x="606.0328" y="214.433" width="527.8351" height="131.9588" fill="#e8f5e9" stroke="#333" stroke-width="3.9099" rx="9.7748" />
  <ns0:text x="869.9503" y="263.9175" text-anchor="middle" font-size="19.5494" fill="#2e7d32">Use r1, then drop scope;</ns0:text>
  <ns0:text x="869.9503" y="320" text-anchor="middle" font-size="19.5494" fill="#2e7d32">then create r2 // OK</ns0:text>
  <ns0:rect x="39.0989" y="395.8763" width="527.8351" height="131.9588" fill="#ffebee" stroke="#333" stroke-width="3.9099" rx="9.7748" />
  <ns0:text x="303.0164" y="445.3608" text-anchor="middle" font-size="19.5494" fill="#c62828">Missing semicolons / wrong return</ns0:text>
  <ns0:text x="303.0164" y="501.4433" text-anchor="middle" font-size="19.5494" fill="#c62828">fn f() -&gt; i32 { 5; } // returns ()</ns0:text>
  <ns0:rect x="606.0328" y="395.8763" width="527.8351" height="131.9588" fill="#e8f5e9" stroke="#333" stroke-width="3.9099" rx="9.7748" />
  <ns0:text x="869.9503" y="445.3608" text-anchor="middle" font-size="19.5494" fill="#2e7d32">Implicit return (no semicolon)</ns0:text>
  <ns0:text x="869.9503" y="501.4433" text-anchor="middle" font-size="19.5494" fill="#2e7d32">fn f() -&gt; i32 { 5 } // returns 5</ns0:text>
  <ns0:rect x="234.5934" y="567.4227" width="312.7911" height="72.5773" fill="#ffebee" stroke="#333" stroke-width="1.9549" rx="5.8648" />
  <ns0:text x="390.989" y="616.9072" text-anchor="middle" font-size="19.5494" font-weight="bold">Common Mistakes</ns0:text>
  <ns0:rect x="625.5823" y="567.4227" width="312.7911" height="72.5773" fill="#e8f5e9" stroke="#333" stroke-width="1.9549" rx="5.8648" />
  <ns0:text x="781.9778" y="616.9072" text-anchor="middle" font-size="19.5494" font-weight="bold">Correct Patterns</ns0:text>
</ns0:svg>
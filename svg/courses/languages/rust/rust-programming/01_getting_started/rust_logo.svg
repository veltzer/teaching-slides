<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="90" fill="#000" stroke="#333" stroke-width="2"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#fff" stroke-width="4"/>
  <!-- Gear teeth around the circle -->
  <g fill="#fff">
    <rect x="95" y="5" width="10" height="20" rx="2"/>
    <rect x="95" y="175" width="10" height="20" rx="2"/>
    <rect x="5" y="95" width="20" height="10" rx="2"/>
    <rect x="175" y="95" width="20" height="10" rx="2"/>
    <rect x="28" y="28" width="10" height="20" rx="2" transform="rotate(45 33 38)"/>
    <rect x="162" y="28" width="10" height="20" rx="2" transform="rotate(-45 167 38)"/>
    <rect x="28" y="152" width="10" height="20" rx="2" transform="rotate(-45 33 162)"/>
    <rect x="162" y="152" width="10" height="20" rx="2" transform="rotate(45 167 162)"/>
  </g>
  <!-- R letter -->
  <text x="100" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#fff">R</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <!-- Rust logo placeholder: gear shape with R -->
  <defs>
    <clipPath id="gear-clip">
      <circle cx="72" cy="72" r="64"/>
    </clipPath>
  </defs>
  <!-- Outer gear teeth -->
  <g transform="translate(72,72)">
    <circle r="60" fill="#000" stroke="none"/>
    <!-- Gear teeth around the circle -->
    <g fill="#000">
      <rect x="-5" y="-70" width="10" height="16" rx="2"/>
      <rect x="-5" y="-70" width="10" height="16" rx="2" transform="rotate(30)"/>
      <rect x="-5" y="-70" width="10" height="16" rx="2" transform="rotate(60)"/>
      <rect x="-5" y="-70" width="10" height="16" rx="2" transform="rotate(90)"/>
      <rect x="-5" y="-70" width="10" height="16" rx="2" transform="rotate(120)"/>
      <rect x="-5" y="-70" width="10" height="16" rx="2" transform="rotate(150)"/>
      <rect x="-5" y="-70" width="10" height="16" rx="2" transform="rotate(180)"/>
      <rect x="-5" y="-70" width="10" height="16" rx="2" transform="rotate(210)"/>
      <rect x="-5" y="-70" width="10" height="16" rx="2" transform="rotate(240)"/>
      <rect x="-5" y="-70" width="10" height="16" rx="2" transform="rotate(270)"/>
      <rect x="-5" y="-70" width="10" height="16" rx="2" transform="rotate(300)"/>
      <rect x="-5" y="-70" width="10" height="16" rx="2" transform="rotate(330)"/>
    </g>
    <!-- Inner ring cutout -->
    <circle r="48" fill="#fff"/>
    <!-- Inner black ring -->
    <circle r="44" fill="#000"/>
    <!-- Center white circle -->
    <circle r="32" fill="#fff"/>
  </g>
  <!-- Letter R in the center -->
  <text x="72" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#000">R</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <ellipse cx="640" cy="318.4882" rx="152.9412" ry="77.2048" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.1907"/>
  <ellipse cx="169.4117" cy="95.1461" rx="129.4117" ry="55.1461" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4.1907"/>
  <ellipse cx="1110.5883" cy="95.1461" rx="129.4117" ry="55.1461" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.1907"/>
  <ellipse cx="169.4117" cy="560.4421" rx="129.4117" ry="55.1461" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.1907"/>
  <ellipse cx="1110.5883" cy="560.4421" rx="129.4117" ry="55.1461" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="4.1907"/>
  <text x="640" y="337.1" text-anchor="middle" font-size="27.3385" fill="var(--bg)" font-family="Arial, sans-serif">Rust</text>
  <text x="169.4117" y="110.0355" text-anchor="middle" font-size="25.0603" font-family="Arial, sans-serif" fill="var(--text)">Memory Safety</text>
  <text x="1110.5883" y="110.0355" text-anchor="middle" font-size="25.0603" font-family="Arial, sans-serif" fill="var(--text)">Concurrency</text>
  <text x="169.4117" y="575.3316" text-anchor="middle" font-size="25.0603" font-family="Arial, sans-serif" fill="var(--text)">Performance</text>
  <text x="1110.5883" y="575.3316" text-anchor="middle" font-size="25.0603" font-family="Arial, sans-serif" fill="var(--text)">Zero-Cost</text>
  <text x="1110.5883" y="620" text-anchor="middle" font-size="22.782" font-family="Arial, sans-serif" fill="var(--text)">Abstractions</text>
  <line x1="510.5883" y1="244.0408" x2="287.0589" y2="162.1487" stroke="var(--text)" stroke-width="2"/>
  <line x1="769.4117" y1="244.0408" x2="992.9412" y2="162.1487" stroke="var(--text)" stroke-width="2"/>
  <line x1="510.5883" y1="392.9355" x2="287.0589" y2="497.1618" stroke="var(--text)" stroke-width="2"/>
  <line x1="769.4117" y1="392.9355" x2="992.9412" y2="497.1618" stroke="var(--text)" stroke-width="2"/>
</svg>

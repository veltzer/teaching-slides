<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ellipse cx="640" cy="318.4882" rx="152.9412" ry="77.2048" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.1907" />
  <ellipse cx="169.4117" cy="95.1461" rx="129.4117" ry="55.1461" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4.1907" />
  <ellipse cx="1110.5883" cy="95.1461" rx="129.4117" ry="55.1461" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.1907" />
  <ellipse cx="169.4117" cy="560.4421" rx="129.4117" ry="55.1461" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.1907" />
  <ellipse cx="1110.5883" cy="560.4421" rx="129.4117" ry="55.1461" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="4.1907" />
  <text x="640" y="337.1" text-anchor="middle" font-size="27.3385" fill="var(--bg)">Rust</text>
  <text x="169.4117" y="110.0355" text-anchor="middle" font-size="25.0603">Memory Safety</text>
  <text x="1110.5883" y="110.0355" text-anchor="middle" font-size="25.0603">Concurrency</text>
  <text x="169.4117" y="575.3316" text-anchor="middle" font-size="25.0603">Performance</text>
  <text x="1110.5883" y="575.3316" text-anchor="middle" font-size="25.0603">Zero-Cost</text>
  <text x="1110.5883" y="620" text-anchor="middle" font-size="22.782">Abstractions</text>
  <line x1="510.5883" y1="244.0408" x2="287.0589" y2="162.1487" stroke="var(--text)" stroke-width="2" />
  <line x1="769.4117" y1="244.0408" x2="992.9412" y2="162.1487" stroke="var(--text)" stroke-width="2" />
  <line x1="510.5883" y1="392.9355" x2="287.0589" y2="497.1618" stroke="var(--text)" stroke-width="2" />
  <line x1="769.4117" y1="392.9355" x2="992.9412" y2="497.1618" stroke="var(--text)" stroke-width="2" />
</svg>
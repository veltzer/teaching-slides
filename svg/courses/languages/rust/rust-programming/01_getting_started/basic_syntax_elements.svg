<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="42.6667" y="36" width="256" height="144" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="170.6667" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Variables</text>
  <rect x="341.3333" y="36" width="256" height="144" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="469.3333" y="100.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Functions</text>
  <text x="469.3333" y="151.2" text-anchor="middle" font-size="21.3333">fn name() {}</text>
  <rect x="640" y="36" width="256" height="144" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="768" y="100.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Types</text>
  <text x="768" y="151.2" text-anchor="middle" font-size="21.3333">i32, bool, str</text>
  <rect x="938.6667" y="36" width="298.6667" height="144" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1088" y="100.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Control Flow</text>
  <text x="1088" y="151.2" text-anchor="middle" font-size="21.3333">if, match, loop</text>
  <rect x="42.6667" y="252" width="1194.6667" height="180" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="324" text-anchor="middle" font-size="23.4667" font-weight="bold">Expressions vs Statements</text>
  <text x="640" y="388.8" text-anchor="middle" font-size="21.3333">Everything is an expression (returns a value) -- no trailing semicolon = return value</text>
  <rect x="42.6667" y="504" width="373.3333" height="162" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="228.2667" y="568.8" text-anchor="middle" font-size="21.3333">let mut x = 5;</text>
  <text x="228.2667" y="630" text-anchor="middle" font-size="21.3333">Immutable by default</text>
  <rect x="458.6667" y="504" width="373.3333" height="162" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="644.2667" y="568.8" text-anchor="middle" font-size="21.3333">println!("{}",x);</text>
  <text x="644.2667" y="630" text-anchor="middle" font-size="21.3333">Macros use !</text>
  <rect x="874.6667" y="504" width="362.6667" height="162" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="1056" y="568.8" text-anchor="middle" font-size="21.3333">// comment</text>
  <text x="1056" y="630" text-anchor="middle" font-size="21.3333">/// doc comment</text>
</svg>
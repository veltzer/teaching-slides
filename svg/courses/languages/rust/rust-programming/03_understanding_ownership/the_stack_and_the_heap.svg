<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="196.5218" y="40" text-anchor="middle" font-size="26.7823" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Stack</text>
  <rect x="40" y="72.2222" width="313.0434" height="80.5556" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="196.5218" y="127" text-anchor="middle" font-size="22.3186" font-family="Arial, sans-serif" fill="var(--primary-text)">x: i32 = 5</text>
  <rect x="40" y="152.7778" width="313.0434" height="80.5556" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="196.5218" y="207.5555" text-anchor="middle" font-size="22.3186" font-family="Arial, sans-serif" fill="var(--primary-text)">y: bool = true</text>
  <rect x="40" y="233.3333" width="313.0434" height="112.7778" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="196.5218" y="278.4445" text-anchor="middle" font-size="22.3186" font-family="Arial, sans-serif" fill="var(--info-text)">s: String {</text>
  <text x="196.5218" y="323.5556" text-anchor="middle" font-size="22.3186" font-family="Arial, sans-serif" fill="var(--info-text)">ptr, len:5, cap:5 }</text>
  <rect x="40" y="346.1111" width="313.0434" height="80.5556" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="196.5218" y="400.8889" text-anchor="middle" font-size="22.3186" font-family="Arial, sans-serif" fill="var(--primary-text)">z: f64 = 3.14</text>
  <text x="196.5218" y="491.1111" text-anchor="middle" font-size="22.3186" font-family="Arial, sans-serif" fill="var(--text)">LIFO, fast, fixed size</text>
  <text x="1031.3044" y="40" text-anchor="middle" font-size="26.7823" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Heap</text>
  <rect x="822.6087" y="88.3333" width="417.3913" height="128.8889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1031.3044" y="146.3333" text-anchor="middle" font-size="22.3186" font-family="Arial, sans-serif" fill="var(--ok-text)">"hello" (5 bytes)</text>
  <text x="1031.3044" y="191.4444" text-anchor="middle" font-size="22.3186" font-family="Arial, sans-serif" fill="var(--ok-text)">allocated at runtime</text>
  <rect x="848.6958" y="281.6666" width="365.2174" height="96.6666" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1031.3044" y="346.1111" text-anchor="middle" font-size="22.3186" font-family="Arial, sans-serif" fill="var(--warn-text)">Vec data, Box data...</text>
  <text x="1031.3044" y="458.8888" text-anchor="middle" font-size="22.3186" font-family="Arial, sans-serif" fill="var(--text)">Dynamic, slower, flexible</text>
  <line x1="353.0436" y1="288.1111" x2="822.6087" y2="152.7778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="9.7246 5.8348"/>
  <text x="587.8261" y="185" text-anchor="middle" font-size="22.3186" font-family="Arial, sans-serif" fill="var(--text)">ptr points to heap</text>
  <rect x="405.2175" y="539.4444" width="626.0869" height="80.5556" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="718.261" y="594.2222" text-anchor="middle" font-size="22.3186" font-family="Arial, sans-serif" fill="var(--danger-text)">Drop: heap freed when owner leaves scope</text>
</svg>

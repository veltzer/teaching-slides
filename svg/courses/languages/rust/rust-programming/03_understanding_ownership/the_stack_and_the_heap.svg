<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr_sh" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="213.3333" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Stack</text>
  <rect x="85.3333" y="90" width="256" height="90" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" />
  <text x="213.3333" y="151.2" text-anchor="middle" font-size="21.3333">x: i32 = 5</text>
  <rect x="85.3333" y="180" width="256" height="90" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" />
  <text x="213.3333" y="241.2" text-anchor="middle" font-size="21.3333">y: bool = true</text>
  <rect x="85.3333" y="270" width="256" height="126" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" />
  <text x="213.3333" y="320.4" text-anchor="middle" font-size="21.3333">s: String {</text>
  <text x="213.3333" y="370.8" text-anchor="middle" font-size="21.3333">ptr, len:5, cap:5 }</text>
  <rect x="85.3333" y="396" width="256" height="90" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" />
  <text x="213.3333" y="457.2" text-anchor="middle" font-size="21.3333">z: f64 = 3.14</text>
  <text x="213.3333" y="558" text-anchor="middle" font-size="21.3333">LIFO, fast, fixed size</text>
  <text x="896" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Heap</text>
  <rect x="725.3333" y="108" width="341.3333" height="144" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="896" y="172.8" text-anchor="middle" font-size="21.3333">"hello" (5 bytes)</text>
  <text x="896" y="223.2" text-anchor="middle" font-size="21.3333">allocated at runtime</text>
  <rect x="746.6667" y="324" width="298.6667" height="108" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="896" y="396" text-anchor="middle" font-size="21.3333">Vec data, Box data...</text>
  <text x="896" y="522" text-anchor="middle" font-size="21.3333">Dynamic, slower, flexible</text>
  <line x1="341.3333" y1="331.2" x2="725.3333" y2="180" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_sh)" stroke-dasharray="10.6667 6.4" />
  <text x="533.3333" y="216" text-anchor="middle" font-size="21.3333">ptr points to heap</text>
  <rect x="384" y="612" width="512" height="90" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="673.2" text-anchor="middle" font-size="21.3333">Drop: heap freed when owner leaves scope</text>

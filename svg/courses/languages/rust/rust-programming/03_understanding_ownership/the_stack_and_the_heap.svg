<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_sh" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="194.4919" y="49.2308" text-anchor="middle" font-size="23.339" font-weight="bold">Stack</text>
  <rect x="77.7967" y="82.0513" width="233.3903" height="82.0513" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="194.4919" y="137.8462" text-anchor="middle" font-size="19.4492">x: i32 = 5</text>
  <rect x="77.7967" y="164.1026" width="233.3903" height="82.0513" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="194.4919" y="219.8974" text-anchor="middle" font-size="19.4492">y: bool = true</text>
  <rect x="77.7967" y="246.1538" width="233.3903" height="114.8718" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="194.4919" y="292.1026" text-anchor="middle" font-size="19.4492">s: String {</text>
  <text x="194.4919" y="338.0513" text-anchor="middle" font-size="19.4492">ptr, len:5, cap:5 }</text>
  <rect x="77.7967" y="361.0256" width="233.3903" height="82.0513" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="194.4919" y="416.8205" text-anchor="middle" font-size="19.4492">z: f64 = 3.14</text>
  <text x="194.4919" y="508.7179" text-anchor="middle" font-size="19.4492">LIFO, fast, fixed size</text>
  <text x="816.8661" y="49.2308" text-anchor="middle" font-size="23.339" font-weight="bold">Heap</text>
  <rect x="661.2725" y="98.4615" width="311.1871" height="131.2821" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="816.8661" y="157.5385" text-anchor="middle" font-size="19.4492">"hello" (5 bytes)</text>
  <text x="816.8661" y="203.4872" text-anchor="middle" font-size="19.4492">allocated at runtime</text>
  <rect x="680.7218" y="295.3846" width="272.2887" height="98.4615" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="816.8661" y="361.0256" text-anchor="middle" font-size="19.4492">Vec data, Box data...</text>
  <text x="816.8661" y="475.8974" text-anchor="middle" font-size="19.4492">Dynamic, slower, flexible</text>
  <line x1="311.1871" y1="301.9487" x2="661.2725" y2="164.1026" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_sh)" stroke-dasharray="9.7246 5.8348" />
  <text x="486.2298" y="196.9231" text-anchor="middle" font-size="19.4492">ptr points to heap</text>
  <rect x="350.0855" y="557.9487" width="466.7806" height="82.0513" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="583.4758" y="613.7436" text-anchor="middle" font-size="19.4492">Drop: heap freed when owner leaves scope</text>
</svg>
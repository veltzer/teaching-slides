<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr_slice" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">String Literal &amp;str vs String Memory Layout</text>
  <rect x="42.6667" y="108" width="256" height="180" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="170.6667" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">s: &amp;str</text>
  <text x="170.6667" y="223.2" text-anchor="middle" font-size="21.3333">ptr | len: 13</text>
  <text x="170.6667" y="266.4" text-anchor="middle" font-size="21.3333">(fat pointer)</text>
  <rect x="426.6667" y="108" width="426.6667" height="144" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="640" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Static / Read-Only Memory</text>
  <text x="640" y="226.8" text-anchor="middle" font-size="21.3333">"Hello, world!"</text>
  <line x1="298.6667" y1="198" x2="426.6667" y2="198" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_slice)" />
  <rect x="42.6667" y="360" width="256" height="180" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="170.6667" y="424.8" text-anchor="middle" font-size="21.3333" font-weight="bold">s: String</text>
  <text x="170.6667" y="475.2" text-anchor="middle" font-size="21.3333">ptr | len | cap</text>
  <text x="170.6667" y="518.4" text-anchor="middle" font-size="21.3333">(owned, growable)</text>
  <rect x="426.6667" y="360" width="426.6667" height="144" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="640" y="424.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Heap-allocated buffer</text>
  <text x="640" y="478.8" text-anchor="middle" font-size="21.3333">[ H | e | l | l | o | ... ]</text>
  <line x1="298.6667" y1="450" x2="426.6667" y2="450" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_slice)" />
  <rect x="917.3333" y="108" width="341.3333" height="144" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="1088" y="172.8" text-anchor="middle" font-size="21.3333">&amp;str: borrowed, no Drop</text>
  <text x="1088" y="223.2" text-anchor="middle" font-size="21.3333">compiled into binary</text>
  <rect x="917.3333" y="360" width="341.3333" height="144" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="1088" y="424.8" text-anchor="middle" font-size="21.3333">String: owned, Drop frees</text>
  <text x="1088" y="475.2" text-anchor="middle" font-size="21.3333">heap memory on scope exit</text>
  <rect x="213.3333" y="594" width="853.3333" height="90" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="655.2" text-anchor="middle" font-size="21.3333">Prefer &amp;str for function params; use String when you need ownership</text>
</svg>
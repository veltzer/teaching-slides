<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.4736" y="40" text-anchor="middle" font-size="24.401" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">String Literal &amp;str vs String Memory Layout</text>
  <rect x="40" y="89.7143" width="252.6316" height="165.7143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="166.3157" y="149.3714" text-anchor="middle" font-size="20.3341" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">s: &amp;str</text>
  <text x="166.3157" y="195.7714" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--primary-text)">ptr | len: 13</text>
  <text x="166.3157" y="235.5429" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--primary-text)">(fat pointer)</text>
  <rect x="418.9473" y="89.7143" width="421.0527" height="132.5714" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.4736" y="149.3714" text-anchor="middle" font-size="20.3341" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Static / Read-Only Memory</text>
  <text x="629.4736" y="199.0857" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--ok-text)">"Hello, world!"</text>
  <line x1="292.6315" y1="172.5715" x2="418.9473" y2="172.5715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="321.7143" width="252.6316" height="165.7143" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="166.3157" y="381.3715" text-anchor="middle" font-size="20.3341" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">s: String</text>
  <text x="166.3157" y="427.7715" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--info-text)">ptr | len | cap</text>
  <text x="166.3157" y="467.5428" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--info-text)">(owned, growable)</text>
  <rect x="418.9473" y="321.7143" width="421.0527" height="132.5714" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.4736" y="381.3715" text-anchor="middle" font-size="20.3341" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Heap-allocated buffer</text>
  <text x="629.4736" y="431.0857" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--warn-text)">[ H | e | l | l | o | ... ]</text>
  <line x1="292.6315" y1="404.5714" x2="418.9473" y2="404.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="903.1579" y="89.7143" width="336.8421" height="132.5714" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1071.5789" y="149.3714" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--danger-text)">&amp;str: borrowed, no Drop</text>
  <text x="1071.5789" y="195.7714" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--danger-text)">compiled into binary</text>
  <rect x="903.1579" y="321.7143" width="336.8421" height="132.5714" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1071.5789" y="381.3715" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--danger-text)">String: owned, Drop frees</text>
  <text x="1071.5789" y="427.7715" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--danger-text)">heap memory on scope exit</text>
  <rect x="208.4209" y="537.1429" width="842.1053" height="82.8571" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.4736" y="593.4857" text-anchor="middle" font-size="20.3341" font-family="Arial, sans-serif" fill="var(--primary-text)">Prefer &amp;str for function params; use String when you need ownership</text>
</svg>

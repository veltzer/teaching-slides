<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_slice" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">String Literal &amp;str vs String Memory Layout</text>
  <rect x="39.9221" y="101.0526" width="239.5322" height="168.4211" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="159.6881" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">s: &amp;str</text>
  <text x="159.6881" y="208.8421" text-anchor="middle" font-size="19.961">ptr | len: 13</text>
  <text x="159.6881" y="249.2632" text-anchor="middle" font-size="19.961">(fat pointer)</text>
  <rect x="399.2203" y="101.0526" width="399.2203" height="134.7368" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Static / Read-Only Memory</text>
  <text x="598.8304" y="212.2105" text-anchor="middle" font-size="19.961">"Hello, world!"</text>
  <line x1="279.4542" y1="185.2632" x2="399.2203" y2="185.2632" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_slice)" />
  <rect x="39.9221" y="336.8421" width="239.5322" height="168.4211" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="159.6881" y="397.4737" text-anchor="middle" font-size="19.961" font-weight="bold">s: String</text>
  <text x="159.6881" y="444.6316" text-anchor="middle" font-size="19.961">ptr | len | cap</text>
  <text x="159.6881" y="485.0526" text-anchor="middle" font-size="19.961">(owned, growable)</text>
  <rect x="399.2203" y="336.8421" width="399.2203" height="134.7368" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="397.4737" text-anchor="middle" font-size="19.961" font-weight="bold">Heap-allocated buffer</text>
  <text x="598.8304" y="448" text-anchor="middle" font-size="19.961">[ H | e | l | l | o | ... ]</text>
  <line x1="279.4542" y1="421.0526" x2="399.2203" y2="421.0526" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_slice)" />
  <rect x="858.3236" y="101.0526" width="319.3762" height="134.7368" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1018.0117" y="161.6842" text-anchor="middle" font-size="19.961">&amp;str: borrowed, no Drop</text>
  <text x="1018.0117" y="208.8421" text-anchor="middle" font-size="19.961">compiled into binary</text>
  <rect x="858.3236" y="336.8421" width="319.3762" height="134.7368" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1018.0117" y="397.4737" text-anchor="middle" font-size="19.961">String: owned, Drop frees</text>
  <text x="1018.0117" y="444.6316" text-anchor="middle" font-size="19.961">heap memory on scope exit</text>
  <rect x="199.6101" y="555.7895" width="798.4405" height="84.2105" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="613.0526" text-anchor="middle" font-size="19.961">Prefer &amp;str for function params; use String when you need ownership</text>
</svg>
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">String Literal &amp;str vs String Memory Layout</ns0:text>
  <ns0:rect x="39.9221" y="101.0526" width="239.5322" height="168.4211" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="159.6881" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">s: &amp;str</ns0:text>
  <ns0:text x="159.6881" y="208.8421" text-anchor="middle" font-size="19.961">ptr | len: 13</ns0:text>
  <ns0:text x="159.6881" y="249.2632" text-anchor="middle" font-size="19.961">(fat pointer)</ns0:text>
  <ns0:rect x="399.2203" y="101.0526" width="399.2203" height="134.7368" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="598.8304" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Static / Read-Only Memory</ns0:text>
  <ns0:text x="598.8304" y="212.2105" text-anchor="middle" font-size="19.961">"Hello, world!"</ns0:text>
  <ns0:line x1="279.4542" y1="185.2632" x2="399.2203" y2="185.2632" stroke="#333" stroke-width="3.9922" marker-end="url(#arr_slice)" />
  <ns0:rect x="39.9221" y="336.8421" width="239.5322" height="168.4211" fill="#f3e5f5" stroke="#333" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="159.6881" y="397.4737" text-anchor="middle" font-size="19.961" font-weight="bold">s: String</ns0:text>
  <ns0:text x="159.6881" y="444.6316" text-anchor="middle" font-size="19.961">ptr | len | cap</ns0:text>
  <ns0:text x="159.6881" y="485.0526" text-anchor="middle" font-size="19.961">(owned, growable)</ns0:text>
  <ns0:rect x="399.2203" y="336.8421" width="399.2203" height="134.7368" fill="#fff3e0" stroke="#333" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="598.8304" y="397.4737" text-anchor="middle" font-size="19.961" font-weight="bold">Heap-allocated buffer</ns0:text>
  <ns0:text x="598.8304" y="448" text-anchor="middle" font-size="19.961">[ H | e | l | l | o | ... ]</ns0:text>
  <ns0:line x1="279.4542" y1="421.0526" x2="399.2203" y2="421.0526" stroke="#333" stroke-width="3.9922" marker-end="url(#arr_slice)" />
  <ns0:rect x="858.3236" y="101.0526" width="319.3762" height="134.7368" fill="#ffebee" stroke="#333" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="1018.0117" y="161.6842" text-anchor="middle" font-size="19.961">&amp;str: borrowed, no Drop</ns0:text>
  <ns0:text x="1018.0117" y="208.8421" text-anchor="middle" font-size="19.961">compiled into binary</ns0:text>
  <ns0:rect x="858.3236" y="336.8421" width="319.3762" height="134.7368" fill="#ffebee" stroke="#333" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="1018.0117" y="397.4737" text-anchor="middle" font-size="19.961">String: owned, Drop frees</ns0:text>
  <ns0:text x="1018.0117" y="444.6316" text-anchor="middle" font-size="19.961">heap memory on scope exit</ns0:text>
  <ns0:rect x="199.6101" y="555.7895" width="798.4405" height="84.2105" fill="#e3f2fd" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="598.8304" y="613.0526" text-anchor="middle" font-size="19.961">Prefer &amp;str for function params; use String when you need ownership</ns0:text>
</ns0:svg>
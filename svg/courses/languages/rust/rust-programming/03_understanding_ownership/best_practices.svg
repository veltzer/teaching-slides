<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="383.0902" y="32.3232" width="383.0902" height="129.2929" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="574.6352" y="113.1313" text-anchor="middle" font-size="22.9854" fill="var(--bg)" font-weight="bold">Ownership Best Practices</text>
  <line x1="478.8627" y1="161.6162" x2="229.8541" y2="242.4242" stroke="var(--text)" stroke-width="2" />
  <line x1="670.4078" y1="161.6162" x2="919.4164" y2="242.4242" stroke="var(--text)" stroke-width="2" />
  <line x1="478.8627" y1="161.6162" x2="229.8541" y2="436.3636" stroke="var(--text)" stroke-width="2" />
  <line x1="670.4078" y1="161.6162" x2="919.4164" y2="436.3636" stroke="var(--text)" stroke-width="2" />
  <rect x="57.4635" y="226.2626" width="344.7811" height="129.2929" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="229.8541" y="281.2121" text-anchor="middle" font-size="19.1545" font-weight="bold">Prefer Borrowing</text>
  <text x="229.8541" y="326.4646" text-anchor="middle" font-size="19.1545">Use &amp;T / &amp;mut T over moves</text>
  <rect x="747.0258" y="226.2626" width="344.7811" height="129.2929" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="919.4164" y="281.2121" text-anchor="middle" font-size="19.1545" font-weight="bold">Clone Sparingly</text>
  <text x="919.4164" y="326.4646" text-anchor="middle" font-size="19.1545">Only .clone() when needed</text>
  <rect x="57.4635" y="420.202" width="344.7811" height="129.2929" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="229.8541" y="475.1515" text-anchor="middle" font-size="19.1545" font-weight="bold">Small Scopes</text>
  <text x="229.8541" y="520.404" text-anchor="middle" font-size="19.1545">Drop values early with { }</text>
  <rect x="747.0258" y="420.202" width="344.7811" height="129.2929" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="919.4164" y="475.1515" text-anchor="middle" font-size="19.1545" font-weight="bold">Use Copy Types</text>
  <text x="919.4164" y="520.404" text-anchor="middle" font-size="19.1545">i32, bool, f64 copy cheaply</text>
  <rect x="287.3176" y="581.8182" width="574.6352" height="58.1818" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="574.6352" y="623.8384" text-anchor="middle" font-size="19.1545">Return owned values when callers need ownership of data</text>
</svg>
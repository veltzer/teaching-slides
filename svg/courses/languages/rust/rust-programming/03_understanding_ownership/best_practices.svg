<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="426.6667" y="36" width="426.6667" height="144" fill="#673ab7" stroke="#333" stroke-width="4.2667" rx="17.0667" />
  <text x="640" y="126" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Ownership Best Practices</text>
  <line x1="533.3333" y1="180" x2="256" y2="270" stroke="#333" stroke-width="4.2667" />
  <line x1="746.6667" y1="180" x2="1024" y2="270" stroke="#333" stroke-width="4.2667" />
  <line x1="533.3333" y1="180" x2="256" y2="486" stroke="#333" stroke-width="4.2667" />
  <line x1="746.6667" y1="180" x2="1024" y2="486" stroke="#333" stroke-width="4.2667" />
  <rect x="64" y="252" width="384" height="144" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="256" y="313.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Prefer Borrowing</text>
  <text x="256" y="363.6" text-anchor="middle" font-size="21.3333">Use &amp;T / &amp;mut T over moves</text>
  <rect x="832" y="252" width="384" height="144" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="1024" y="313.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Clone Sparingly</text>
  <text x="1024" y="363.6" text-anchor="middle" font-size="21.3333">Only .clone() when needed</text>
  <rect x="64" y="468" width="384" height="144" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="256" y="529.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Small Scopes</text>
  <text x="256" y="579.6" text-anchor="middle" font-size="21.3333">Drop values early with { }</text>
  <rect x="832" y="468" width="384" height="144" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="1024" y="529.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Use Copy Types</text>
  <text x="1024" y="579.6" text-anchor="middle" font-size="21.3333">i32, bool, f64 copy cheaply</text>
  <rect x="320" y="648" width="640" height="64.8" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="694.8" text-anchor="middle" font-size="21.3333">Return owned values when callers need ownership of data</text>
</svg>
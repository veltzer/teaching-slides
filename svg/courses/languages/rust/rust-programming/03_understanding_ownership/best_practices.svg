    </defs>
  <ns0:rect x="383.0902" y="32.3232" width="383.0902" height="129.2929" fill="#673ab7" stroke="#333" stroke-width="3.8309" rx="15.3236" />
  <ns0:text x="574.6352" y="113.1313" text-anchor="middle" font-size="22.9854" fill="white" font-weight="bold">Ownership Best Practices</ns0:text>
  <ns0:line x1="478.8627" y1="161.6162" x2="229.8541" y2="242.4242" stroke="#333" stroke-width="3.8309" />
  <ns0:line x1="670.4078" y1="161.6162" x2="919.4164" y2="242.4242" stroke="#333" stroke-width="3.8309" />
  <ns0:line x1="478.8627" y1="161.6162" x2="229.8541" y2="436.3636" stroke="#333" stroke-width="3.8309" />
  <ns0:line x1="670.4078" y1="161.6162" x2="919.4164" y2="436.3636" stroke="#333" stroke-width="3.8309" />
  <ns0:rect x="57.4635" y="226.2626" width="344.7811" height="129.2929" fill="#e3f2fd" stroke="#333" stroke-width="1.9154" rx="9.5773" />
  <ns0:text x="229.8541" y="281.2121" text-anchor="middle" font-size="19.1545" font-weight="bold">Prefer Borrowing</ns0:text>
  <ns0:text x="229.8541" y="326.4646" text-anchor="middle" font-size="19.1545">Use &amp;T / &amp;mut T over moves</ns0:text>
  <ns0:rect x="747.0258" y="226.2626" width="344.7811" height="129.2929" fill="#f3e5f5" stroke="#333" stroke-width="1.9154" rx="9.5773" />
  <ns0:text x="919.4164" y="281.2121" text-anchor="middle" font-size="19.1545" font-weight="bold">Clone Sparingly</ns0:text>
  <ns0:text x="919.4164" y="326.4646" text-anchor="middle" font-size="19.1545">Only .clone() when needed</ns0:text>
  <ns0:rect x="57.4635" y="420.202" width="344.7811" height="129.2929" fill="#e8f5e9" stroke="#333" stroke-width="1.9154" rx="9.5773" />
  <ns0:text x="229.8541" y="475.1515" text-anchor="middle" font-size="19.1545" font-weight="bold">Small Scopes</ns0:text>
  <ns0:text x="229.8541" y="520.404" text-anchor="middle" font-size="19.1545">Drop values early with { }</ns0:text>
  <ns0:rect x="747.0258" y="420.202" width="344.7811" height="129.2929" fill="#fff3e0" stroke="#333" stroke-width="1.9154" rx="9.5773" />
  <ns0:text x="919.4164" y="475.1515" text-anchor="middle" font-size="19.1545" font-weight="bold">Use Copy Types</ns0:text>
  <ns0:text x="919.4164" y="520.404" text-anchor="middle" font-size="19.1545">i32, bool, f64 copy cheaply</ns0:text>
  <ns0:rect x="287.3176" y="581.8182" width="574.6352" height="58.1818" fill="#ffebee" stroke="#333" stroke-width="1.9154" rx="5.7464" />
  <ns0:text x="574.6352" y="623.8384" text-anchor="middle" font-size="19.1545">Return owned values when callers need ownership of data</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_move" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Move Semantics: let s2 = s1;</text>
  <text x="259.4931" y="117.8947" text-anchor="middle" font-size="21.9571" font-weight="bold">Before Move</text>
  <rect x="59.883" y="151.5789" width="179.6491" height="151.5789" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="149.7076" y="208.8421" text-anchor="middle" font-size="19.961" font-weight="bold">s1 (stack)</text>
  <text x="149.7076" y="262.7368" text-anchor="middle" font-size="19.961">ptr | len:5 | cap:5</text>
  <rect x="279.4542" y="151.5789" width="159.6881" height="151.5789" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="359.2982" y="208.8421" text-anchor="middle" font-size="19.961" font-weight="bold">Heap</text>
  <text x="359.2982" y="262.7368" text-anchor="middle" font-size="19.961">"hello"</text>
  <line x1="239.5322" y1="225.6842" x2="279.4542" y2="225.6842" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_move)" />
  <text x="938.1677" y="117.8947" text-anchor="middle" font-size="21.9571" font-weight="bold">After Move</text>
  <rect x="658.7135" y="151.5789" width="179.6491" height="151.5789" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" stroke-dasharray="7.9844 5.9883" />
  <text x="748.538" y="208.8421" text-anchor="middle" font-size="19.961" fill="var(--text-faint)">s1 (invalid)</text>
  <text x="748.538" y="262.7368" text-anchor="middle" font-size="19.961" fill="var(--text-faint)">-- moved --</text>
  <rect x="878.2846" y="151.5789" width="179.6491" height="151.5789" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="968.1092" y="208.8421" text-anchor="middle" font-size="19.961" font-weight="bold">s2 (stack)</text>
  <text x="968.1092" y="262.7368" text-anchor="middle" font-size="19.961">ptr | len:5 | cap:5</text>
  <rect x="878.2846" y="353.6842" width="179.6491" height="117.8947" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="968.1092" y="404.2105" text-anchor="middle" font-size="19.961" font-weight="bold">Heap</text>
  <text x="968.1092" y="448" text-anchor="middle" font-size="19.961">"hello"</text>
  <line x1="968.1092" y1="303.1579" x2="968.1092" y2="353.6842" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_move)" />
  <line x1="489.0449" y1="225.6842" x2="638.7525" y2="225.6842" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_move)" stroke-dasharray="11.9766 5.9883" />
  <text x="564.8967" y="202.1053" text-anchor="middle" font-size="19.961">move</text>
  <rect x="199.6101" y="522.1053" width="798.4405" height="117.8947" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="579.3684" text-anchor="middle" font-size="19.961">Ownership transfers from s1 to s2. s1 is invalidated (no double free).</text>
  <text x="598.8304" y="626.5263" text-anchor="middle" font-size="19.961">Only one owner at a time -- no shallow copy like C++</text>
</svg>
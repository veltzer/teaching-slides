<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="688" y="40" text-anchor="middle" font-size="26.0531" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Move Semantics: let s2 = s1;</text>
  <text x="280" y="106.2857" text-anchor="middle" font-size="23.882" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Before Move</text>
  <rect x="40" y="139.4285" width="216" height="149.1428" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="148" y="195.7714" text-anchor="middle" font-size="21.7109" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">s1 (stack)</text>
  <text x="148" y="248.8" text-anchor="middle" font-size="21.7109" font-family="Arial, sans-serif" fill="var(--danger-text)">ptr | len:5 | cap:5</text>
  <rect x="304.0001" y="139.4285" width="192" height="149.1428" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="400" y="195.7714" text-anchor="middle" font-size="21.7109" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Heap</text>
  <text x="400" y="248.8" text-anchor="middle" font-size="21.7109" font-family="Arial, sans-serif" fill="var(--ok-text)">"hello"</text>
  <line x1="256.0001" y1="212.3429" x2="304.0001" y2="212.3429" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1096.0001" y="106.2857" text-anchor="middle" font-size="23.882" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">After Move</text>
  <rect x="760.0001" y="139.4285" width="216" height="149.1428" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" stroke-dasharray="7.9844 5.9883" filter="url(#shadow)"/>
  <text x="868" y="195.7714" text-anchor="middle" font-size="21.7109" fill="var(--text-faint)" font-family="Arial, sans-serif">s1 (invalid)</text>
  <text x="868" y="248.8" text-anchor="middle" font-size="21.7109" fill="var(--text-faint)" font-family="Arial, sans-serif">-- moved --</text>
  <rect x="1024" y="139.4285" width="216" height="149.1428" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1132.0001" y="195.7714" text-anchor="middle" font-size="21.7109" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">s2 (stack)</text>
  <text x="1132.0001" y="248.8" text-anchor="middle" font-size="21.7109" font-family="Arial, sans-serif" fill="var(--primary-text)">ptr | len:5 | cap:5</text>
  <rect x="1024" y="338.2857" width="216" height="116" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1132.0001" y="388" text-anchor="middle" font-size="21.7109" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Heap</text>
  <text x="1132.0001" y="431.0857" text-anchor="middle" font-size="21.7109" font-family="Arial, sans-serif" fill="var(--ok-text)">"hello"</text>
  <line x1="1132.0001" y1="288.5714" x2="1132.0001" y2="338.2857" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="556.0001" y1="212.3429" x2="736.0001" y2="212.3429" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="11.9766 5.9883"/>
  <text x="647.2001" y="189.1429" text-anchor="middle" font-size="21.7109" font-family="Arial, sans-serif" fill="var(--text)">move</text>
  <rect x="208" y="504" width="959.9999" height="116" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="688" y="560.3428" text-anchor="middle" font-size="21.7109" font-family="Arial, sans-serif" fill="var(--warn-text)">Ownership transfers from s1 to s2. s1 is invalidated (no double free).</text>
  <text x="688" y="606.7428" text-anchor="middle" font-size="21.7109" font-family="Arial, sans-serif" fill="var(--warn-text)">Only one owner at a time -- no shallow copy like C++</text>
</svg>

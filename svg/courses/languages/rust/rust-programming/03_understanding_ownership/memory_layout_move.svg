<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr_move" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Move Semantics: let s2 = s1;</text>
  <text x="277.3333" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Before Move</text>
  <rect x="64" y="162" width="192" height="162" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="160" y="223.2" text-anchor="middle" font-size="21.3333" font-weight="bold">s1 (stack)</text>
  <text x="160" y="280.8" text-anchor="middle" font-size="21.3333">ptr | len:5 | cap:5</text>
  <rect x="298.6667" y="162" width="170.6667" height="162" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="384" y="223.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Heap</text>
  <text x="384" y="280.8" text-anchor="middle" font-size="21.3333">"hello"</text>
  <line x1="256" y1="241.2" x2="298.6667" y2="241.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_move)" />
  <text x="1002.6667" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">After Move</text>
  <rect x="704" y="162" width="192" height="162" fill="#ffebee" stroke="#999" stroke-width="2.1333" rx="6.4" stroke-dasharray="8.5333 6.4" />
  <text x="800" y="223.2" text-anchor="middle" font-size="21.3333" fill="#999">s1 (invalid)</text>
  <text x="800" y="280.8" text-anchor="middle" font-size="21.3333" fill="#999">-- moved --</text>
  <rect x="938.6667" y="162" width="192" height="162" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="1034.6667" y="223.2" text-anchor="middle" font-size="21.3333" font-weight="bold">s2 (stack)</text>
  <text x="1034.6667" y="280.8" text-anchor="middle" font-size="21.3333">ptr | len:5 | cap:5</text>
  <rect x="938.6667" y="378" width="192" height="126" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="1034.6667" y="432" text-anchor="middle" font-size="21.3333" font-weight="bold">Heap</text>
  <text x="1034.6667" y="478.8" text-anchor="middle" font-size="21.3333">"hello"</text>
  <line x1="1034.6667" y1="324" x2="1034.6667" y2="378" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_move)" />
  <line x1="522.6667" y1="241.2" x2="682.6667" y2="241.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_move)" stroke-dasharray="12.8 6.4" />
  <text x="603.7333" y="216" text-anchor="middle" font-size="21.3333">move</text>
  <rect x="213.3333" y="558" width="853.3333" height="126" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="619.2" text-anchor="middle" font-size="21.3333">Ownership transfers from s1 to s2. s1 is invalidated (no double free).</text>
  <text x="640" y="669.6" text-anchor="middle" font-size="21.3333">Only one owner at a time -- no shallow copy like C++</text>
</svg>
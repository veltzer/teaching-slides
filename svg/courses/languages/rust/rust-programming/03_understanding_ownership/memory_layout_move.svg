<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_move" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="688" y="40" text-anchor="middle" font-size="26.0531" font-weight="bold">Move Semantics: let s2 = s1;</text>
  <text x="280" y="106.2857" text-anchor="middle" font-size="23.882" font-weight="bold">Before Move</text>
  <rect x="40" y="139.4285" width="216" height="149.1428" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="148" y="195.7714" text-anchor="middle" font-size="21.7109" font-weight="bold">s1 (stack)</text>
  <text x="148" y="248.8" text-anchor="middle" font-size="21.7109">ptr | len:5 | cap:5</text>
  <rect x="304.0001" y="139.4285" width="192" height="149.1428" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="400" y="195.7714" text-anchor="middle" font-size="21.7109" font-weight="bold">Heap</text>
  <text x="400" y="248.8" text-anchor="middle" font-size="21.7109">"hello"</text>
  <line x1="256.0001" y1="212.3429" x2="304.0001" y2="212.3429" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_move)" />
  <text x="1096.0001" y="106.2857" text-anchor="middle" font-size="23.882" font-weight="bold">After Move</text>
  <rect x="760.0001" y="139.4285" width="216" height="149.1428" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" stroke-dasharray="7.9844 5.9883" />
  <text x="868" y="195.7714" text-anchor="middle" font-size="21.7109" fill="var(--text-faint)">s1 (invalid)</text>
  <text x="868" y="248.8" text-anchor="middle" font-size="21.7109" fill="var(--text-faint)">-- moved --</text>
  <rect x="1024" y="139.4285" width="216" height="149.1428" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1132.0001" y="195.7714" text-anchor="middle" font-size="21.7109" font-weight="bold">s2 (stack)</text>
  <text x="1132.0001" y="248.8" text-anchor="middle" font-size="21.7109">ptr | len:5 | cap:5</text>
  <rect x="1024" y="338.2857" width="216" height="116" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1132.0001" y="388" text-anchor="middle" font-size="21.7109" font-weight="bold">Heap</text>
  <text x="1132.0001" y="431.0857" text-anchor="middle" font-size="21.7109">"hello"</text>
  <line x1="1132.0001" y1="288.5714" x2="1132.0001" y2="338.2857" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_move)" />
  <line x1="556.0001" y1="212.3429" x2="736.0001" y2="212.3429" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_move)" stroke-dasharray="11.9766 5.9883" />
  <text x="647.2001" y="189.1429" text-anchor="middle" font-size="21.7109">move</text>
  <rect x="208" y="504" width="959.9999" height="116" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="688" y="560.3428" text-anchor="middle" font-size="21.7109">Ownership transfers from s1 to s2. s1 is invalidated (no double free).</text>
  <text x="688" y="606.7428" text-anchor="middle" font-size="21.7109">Only one owner at a time -- no shallow copy like C++</text>
</svg>
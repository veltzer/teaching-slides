    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:marker id="arr_move" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Move Semantics: let s2 = s1;</ns0:text>
  <ns0:text x="259.4931" y="117.8947" text-anchor="middle" font-size="21.9571" font-weight="bold">Before Move</ns0:text>
  <ns0:rect x="59.883" y="151.5789" width="179.6491" height="151.5789" fill="var(--danger-pale)" stroke="var(--text-dark)" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="149.7076" y="208.8421" text-anchor="middle" font-size="19.961" font-weight="bold">s1 (stack)</ns0:text>
  <ns0:text x="149.7076" y="262.7368" text-anchor="middle" font-size="19.961">ptr | len:5 | cap:5</ns0:text>
  <ns0:rect x="279.4542" y="151.5789" width="159.6881" height="151.5789" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="359.2982" y="208.8421" text-anchor="middle" font-size="19.961" font-weight="bold">Heap</ns0:text>
  <ns0:text x="359.2982" y="262.7368" text-anchor="middle" font-size="19.961">"hello"</ns0:text>
  <ns0:line x1="239.5322" y1="225.6842" x2="279.4542" y2="225.6842" stroke="var(--text-dark)" stroke-width="3.9922" marker-end="url(#arr_move)" />
  <ns0:text x="938.1677" y="117.8947" text-anchor="middle" font-size="21.9571" font-weight="bold">After Move</ns0:text>
  <ns0:rect x="658.7135" y="151.5789" width="179.6491" height="151.5789" fill="var(--danger-pale)" stroke="var(--text-faintest)" stroke-width="1.9961" rx="5.9883" stroke-dasharray="7.9844 5.9883" />
  <ns0:text x="748.538" y="208.8421" text-anchor="middle" font-size="19.961" fill="var(--text-faintest)">s1 (invalid)</ns0:text>
  <ns0:text x="748.538" y="262.7368" text-anchor="middle" font-size="19.961" fill="var(--text-faintest)">-- moved --</ns0:text>
  <ns0:rect x="878.2846" y="151.5789" width="179.6491" height="151.5789" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="968.1092" y="208.8421" text-anchor="middle" font-size="19.961" font-weight="bold">s2 (stack)</ns0:text>
  <ns0:text x="968.1092" y="262.7368" text-anchor="middle" font-size="19.961">ptr | len:5 | cap:5</ns0:text>
  <ns0:rect x="878.2846" y="353.6842" width="179.6491" height="117.8947" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="968.1092" y="404.2105" text-anchor="middle" font-size="19.961" font-weight="bold">Heap</ns0:text>
  <ns0:text x="968.1092" y="448" text-anchor="middle" font-size="19.961">"hello"</ns0:text>
  <ns0:line x1="968.1092" y1="303.1579" x2="968.1092" y2="353.6842" stroke="var(--text-dark)" stroke-width="3.9922" marker-end="url(#arr_move)" />
  <ns0:line x1="489.0449" y1="225.6842" x2="638.7525" y2="225.6842" stroke="var(--text-dark)" stroke-width="3.9922" marker-end="url(#arr_move)" stroke-dasharray="11.9766 5.9883" />
  <ns0:text x="564.8967" y="202.1053" text-anchor="middle" font-size="19.961">move</ns0:text>
  <ns0:rect x="199.6101" y="522.1053" width="798.4405" height="117.8947" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="598.8304" y="579.3684" text-anchor="middle" font-size="19.961">Ownership transfers from s1 to s2. s1 is invalidated (no double free).</ns0:text>
  <ns0:text x="598.8304" y="626.5263" text-anchor="middle" font-size="19.961">Only one owner at a time -- no shallow copy like C++</ns0:text>
</ns0:svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="386.9993" y="16.3265" width="386.9993" height="114.2857" fill="#673ab7" stroke="#333" stroke-width="3.87" rx="15.48" />
  <ns0:text x="580.4989" y="91.4286" text-anchor="middle" font-size="23.22" fill="white" font-weight="bold">Borrowing Best Practices</ns0:text>
  <ns0:line x1="483.749" y1="130.6122" x2="232.1995" y2="195.9184" stroke="#333" stroke-width="3.87" />
  <ns0:line x1="677.2487" y1="130.6122" x2="928.7982" y2="195.9184" stroke="#333" stroke-width="3.87" />
  <ns0:line x1="483.749" y1="130.6122" x2="232.1995" y2="408.1633" stroke="#333" stroke-width="3.87" />
  <ns0:line x1="677.2487" y1="130.6122" x2="928.7982" y2="408.1633" stroke="#333" stroke-width="3.87" />
  <ns0:rect x="58.0499" y="179.5918" width="348.2993" height="146.9388" fill="#e3f2fd" stroke="#333" stroke-width="1.935" rx="9.675" />
  <ns0:text x="232.1995" y="235.102" text-anchor="middle" font-size="19.3499" font-weight="bold">Prefer &amp;T params</ns0:text>
  <ns0:text x="232.1995" y="280.8163" text-anchor="middle" font-size="19.3499">Borrow instead of taking</ns0:text>
  <ns0:text x="232.1995" y="316.7347" text-anchor="middle" font-size="19.3499">ownership in functions</ns0:text>
  <ns0:rect x="754.6485" y="179.5918" width="348.2993" height="146.9388" fill="#f3e5f5" stroke="#333" stroke-width="1.935" rx="9.675" />
  <ns0:text x="928.7982" y="235.102" text-anchor="middle" font-size="19.3499" font-weight="bold">Minimize &amp;mut scope</ns0:text>
  <ns0:text x="928.7982" y="280.8163" text-anchor="middle" font-size="19.3499">Drop mutable refs early</ns0:text>
  <ns0:text x="928.7982" y="316.7347" text-anchor="middle" font-size="19.3499">to allow other borrows</ns0:text>
  <ns0:rect x="58.0499" y="391.8367" width="348.2993" height="146.9388" fill="#e8f5e9" stroke="#333" stroke-width="1.935" rx="9.675" />
  <ns0:text x="232.1995" y="447.3469" text-anchor="middle" font-size="19.3499" font-weight="bold">Use slice params</ns0:text>
  <ns0:text x="232.1995" y="493.0612" text-anchor="middle" font-size="19.3499">fn foo(s: &amp;str) not</ns0:text>
  <ns0:text x="232.1995" y="528.9796" text-anchor="middle" font-size="19.3499">fn foo(s: &amp;String)</ns0:text>
  <ns0:rect x="754.6485" y="391.8367" width="348.2993" height="146.9388" fill="#fff3e0" stroke="#333" stroke-width="1.935" rx="9.675" />
  <ns0:text x="928.7982" y="447.3469" text-anchor="middle" font-size="19.3499" font-weight="bold">Avoid dangling refs</ns0:text>
  <ns0:text x="928.7982" y="493.0612" text-anchor="middle" font-size="19.3499">Never return &amp;T to a</ns0:text>
  <ns0:text x="928.7982" y="528.9796" text-anchor="middle" font-size="19.3499">local variable</ns0:text>
  <ns0:rect x="290.2494" y="581.2245" width="580.4989" height="58.7755" fill="#ffebee" stroke="#333" stroke-width="1.935" rx="5.805" />
  <ns0:text x="580.4989" y="623.6735" text-anchor="middle" font-size="19.3499">Trust the borrow checker -- it prevents data races and use-after-free</ns0:text>
</ns0:svg>
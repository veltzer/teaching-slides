<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="650.9091" y="40" text-anchor="middle" font-size="24.8407" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">References: Borrowing Without Ownership</text>
  <rect x="40" y="106.2857" width="261.8183" height="182.2858" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="170.909" y="162.6286" text-anchor="middle" font-size="20.7006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">&amp;s (reference)</text>
  <text x="170.909" y="209.0286" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--primary-text)">borrows s1</text>
  <text x="170.909" y="255.4286" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--primary-text)">read-only access</text>
  <rect x="476.3636" y="106.2857" width="305.4546" height="182.2858" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.0909" y="162.6286" text-anchor="middle" font-size="20.7006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">s1: String (owner)</text>
  <text x="629.0909" y="209.0286" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--info-text)">ptr | len:5 | cap:5</text>
  <text x="629.0909" y="255.4286" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--info-text)">still valid after borrow</text>
  <rect x="956.3637" y="106.2857" width="283.6363" height="182.2858" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1098.1819" y="162.6286" text-anchor="middle" font-size="20.7006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Heap Data</text>
  <text x="1098.1819" y="209.0286" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--ok-text)">"hello"</text>
  <text x="1098.1819" y="255.4286" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--ok-text)">not copied</text>
  <line x1="301.8181" y1="195.7714" x2="476.3636" y2="195.7714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="389.0908" y="175.8857" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--text)">points to</text>
  <line x1="781.8182" y1="195.7714" x2="956.3637" y2="195.7714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="869.0909" y="175.8857" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--text)">owns</text>
  <rect x="105.4545" y="354.8571" width="480.0001" height="116" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="345.4545" y="404.5714" text-anchor="middle" font-size="20.7006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">&amp;T = immutable borrow</text>
  <text x="345.4545" y="450.9714" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--warn-text)">Many readers allowed</text>
  <rect x="672.7273" y="354.8571" width="480.0001" height="116" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="912.7273" y="404.5714" text-anchor="middle" font-size="20.7006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">&amp;mut T = mutable borrow</text>
  <text x="912.7273" y="450.9714" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--danger-text)">Only ONE writer allowed</text>
  <rect x="214.5454" y="520.5715" width="872.7273" height="99.4285" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="650.9091" y="586.8572" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--primary-text)">References never own data -- the original owner keeps ownership</text>
</svg>
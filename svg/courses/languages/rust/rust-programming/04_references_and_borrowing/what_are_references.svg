<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_ref0" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">References: Borrowing Without Ownership</text>
  <rect x="39.9221" y="117.8947" width="239.5322" height="185.2632" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="159.6881" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">&amp;s (reference)</text>
  <text x="159.6881" y="222.3158" text-anchor="middle" font-size="19.961">borrows s1</text>
  <text x="159.6881" y="269.4737" text-anchor="middle" font-size="19.961">read-only access</text>
  <rect x="439.1423" y="117.8947" width="279.4542" height="185.2632" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="578.8694" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">s1: String (owner)</text>
  <text x="578.8694" y="222.3158" text-anchor="middle" font-size="19.961">ptr | len:5 | cap:5</text>
  <text x="578.8694" y="269.4737" text-anchor="middle" font-size="19.961">still valid after borrow</text>
  <rect x="878.2846" y="117.8947" width="259.4931" height="185.2632" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1008.0312" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">Heap Data</text>
  <text x="1008.0312" y="222.3158" text-anchor="middle" font-size="19.961">"hello"</text>
  <text x="1008.0312" y="269.4737" text-anchor="middle" font-size="19.961">not copied</text>
  <line x1="279.4542" y1="208.8421" x2="439.1423" y2="208.8421" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_ref0)" />
  <text x="359.2982" y="188.6316" text-anchor="middle" font-size="19.961">points to</text>
  <line x1="718.5965" y1="208.8421" x2="878.2846" y2="208.8421" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_ref0)" />
  <text x="798.4405" y="188.6316" text-anchor="middle" font-size="19.961">owns</text>
  <rect x="99.8051" y="370.5263" width="439.1423" height="117.8947" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="319.3762" y="421.0526" text-anchor="middle" font-size="19.961" font-weight="bold">&amp;T = immutable borrow</text>
  <text x="319.3762" y="468.2105" text-anchor="middle" font-size="19.961">Many readers allowed</text>
  <rect x="618.7914" y="370.5263" width="439.1423" height="117.8947" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="838.3626" y="421.0526" text-anchor="middle" font-size="19.961" font-weight="bold">&amp;mut T = mutable borrow</text>
  <text x="838.3626" y="468.2105" text-anchor="middle" font-size="19.961">Only ONE writer allowed</text>
  <rect x="199.6101" y="538.9474" width="798.4405" height="101.0526" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="606.3158" text-anchor="middle" font-size="19.961">References never own data -- the original owner keeps ownership</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:marker id="arr_ref0" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">References: Borrowing Without Ownership</ns0:text>
  <ns0:rect x="39.9221" y="117.8947" width="239.5322" height="185.2632" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="159.6881" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">&amp;s (reference)</ns0:text>
  <ns0:text x="159.6881" y="222.3158" text-anchor="middle" font-size="19.961">borrows s1</ns0:text>
  <ns0:text x="159.6881" y="269.4737" text-anchor="middle" font-size="19.961">read-only access</ns0:text>
  <ns0:rect x="439.1423" y="117.8947" width="279.4542" height="185.2632" fill="#f3e5f5" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="578.8694" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">s1: String (owner)</ns0:text>
  <ns0:text x="578.8694" y="222.3158" text-anchor="middle" font-size="19.961">ptr | len:5 | cap:5</ns0:text>
  <ns0:text x="578.8694" y="269.4737" text-anchor="middle" font-size="19.961">still valid after borrow</ns0:text>
  <ns0:rect x="878.2846" y="117.8947" width="259.4931" height="185.2632" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="1008.0312" y="175.1579" text-anchor="middle" font-size="19.961" font-weight="bold">Heap Data</ns0:text>
  <ns0:text x="1008.0312" y="222.3158" text-anchor="middle" font-size="19.961">"hello"</ns0:text>
  <ns0:text x="1008.0312" y="269.4737" text-anchor="middle" font-size="19.961">not copied</ns0:text>
  <ns0:line x1="279.4542" y1="208.8421" x2="439.1423" y2="208.8421" stroke="#333" stroke-width="3.9922" marker-end="url(#arr_ref0)" />
  <ns0:text x="359.2982" y="188.6316" text-anchor="middle" font-size="19.961">points to</ns0:text>
  <ns0:line x1="718.5965" y1="208.8421" x2="878.2846" y2="208.8421" stroke="#333" stroke-width="3.9922" marker-end="url(#arr_ref0)" />
  <ns0:text x="798.4405" y="188.6316" text-anchor="middle" font-size="19.961">owns</ns0:text>
  <ns0:rect x="99.8051" y="370.5263" width="439.1423" height="117.8947" fill="#fff3e0" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="319.3762" y="421.0526" text-anchor="middle" font-size="19.961" font-weight="bold">&amp;T = immutable borrow</ns0:text>
  <ns0:text x="319.3762" y="468.2105" text-anchor="middle" font-size="19.961">Many readers allowed</ns0:text>
  <ns0:rect x="618.7914" y="370.5263" width="439.1423" height="117.8947" fill="#ffebee" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="838.3626" y="421.0526" text-anchor="middle" font-size="19.961" font-weight="bold">&amp;mut T = mutable borrow</ns0:text>
  <ns0:text x="838.3626" y="468.2105" text-anchor="middle" font-size="19.961">Only ONE writer allowed</ns0:text>
  <ns0:rect x="199.6101" y="538.9474" width="798.4405" height="101.0526" fill="#e3f2fd" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="598.8304" y="606.3158" text-anchor="middle" font-size="19.961">References never own data -- the original owner keeps ownership</ns0:text>
</ns0:svg>
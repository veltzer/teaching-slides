<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr_ref0" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">References: Borrowing Without Ownership</text>
  <rect x="42.6667" y="126" width="256" height="198" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="170.6667" y="187.2" text-anchor="middle" font-size="21.3333" font-weight="bold">&amp;s (reference)</text>
  <text x="170.6667" y="237.6" text-anchor="middle" font-size="21.3333">borrows s1</text>
  <text x="170.6667" y="288" text-anchor="middle" font-size="21.3333">read-only access</text>
  <rect x="469.3333" y="126" width="298.6667" height="198" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="618.6667" y="187.2" text-anchor="middle" font-size="21.3333" font-weight="bold">s1: String (owner)</text>
  <text x="618.6667" y="237.6" text-anchor="middle" font-size="21.3333">ptr | len:5 | cap:5</text>
  <text x="618.6667" y="288" text-anchor="middle" font-size="21.3333">still valid after borrow</text>
  <rect x="938.6667" y="126" width="277.3333" height="198" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1077.3333" y="187.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Heap Data</text>
  <text x="1077.3333" y="237.6" text-anchor="middle" font-size="21.3333">"hello"</text>
  <text x="1077.3333" y="288" text-anchor="middle" font-size="21.3333">not copied</text>
  <line x1="298.6667" y1="223.2" x2="469.3333" y2="223.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_ref0)" />
  <text x="384" y="201.6" text-anchor="middle" font-size="21.3333">points to</text>
  <line x1="768" y1="223.2" x2="938.6667" y2="223.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_ref0)" />
  <text x="853.3333" y="201.6" text-anchor="middle" font-size="21.3333">owns</text>
  <rect x="106.6667" y="396" width="469.3333" height="126" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="341.3333" y="450" text-anchor="middle" font-size="21.3333" font-weight="bold">&amp;T = immutable borrow</text>
  <text x="341.3333" y="500.4" text-anchor="middle" font-size="21.3333">Many readers allowed</text>
  <rect x="661.3333" y="396" width="469.3333" height="126" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="896" y="450" text-anchor="middle" font-size="21.3333" font-weight="bold">&amp;mut T = mutable borrow</text>
  <text x="896" y="500.4" text-anchor="middle" font-size="21.3333">Only ONE writer allowed</text>
  <rect x="213.3333" y="576" width="853.3333" height="108" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="648" text-anchor="middle" font-size="21.3333">References never own data -- the original owner keeps ownership</text>
</svg>
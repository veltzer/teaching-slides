<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr_ref1" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Memory Layout: &amp;s1 borrows String s1</text>
  <text x="170.6667" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Stack</text>
  <rect x="42.6667" y="162" width="256" height="108" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" />
  <text x="170.6667" y="230.4" text-anchor="middle" font-size="21.3333">s1: { ptr, len, cap }</text>
  <rect x="42.6667" y="270" width="256" height="90" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" />
  <text x="170.6667" y="331.2" text-anchor="middle" font-size="21.3333">&amp;s1: ptr to s1</text>
  <text x="746.6667" y="126" text-anchor="middle" font-size="23.4667" font-weight="bold">Heap</text>
  <rect x="576" y="162" width="341.3333" height="126" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="6.4" />
  <text x="746.6667" y="216" text-anchor="middle" font-size="21.3333">"hello" (5 bytes)</text>
  <text x="746.6667" y="262.8" text-anchor="middle" font-size="21.3333">heap-allocated buffer</text>
  <line x1="298.6667" y1="216" x2="576" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_ref1)" stroke-dasharray="10.6667 6.4" />
  <text x="437.3333" y="190.8" text-anchor="middle" font-size="21.3333">s1.ptr</text>
  <line x1="170.6667" y1="270" x2="170.6667" y2="216" stroke="#333" stroke-width="2.1333" marker-end="url(#arr_ref1)" stroke-dasharray="6.4 4.2667" />
  <text x="213.3333" y="252" font-size="21.3333">&amp;s1 points to s1</text>
  <rect x="42.6667" y="432" width="533.3333" height="108" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="309.3333" y="496.8" text-anchor="middle" font-size="21.3333">Reference = pointer to the stack variable</text>
  <rect x="640" y="432" width="533.3333" height="108" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="906.6667" y="496.8" text-anchor="middle" font-size="21.3333">No heap copy, no ownership transfer</text>
  <rect x="213.3333" y="594" width="853.3333" height="90" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="655.2" text-anchor="middle" font-size="21.3333">Reference is an extra level of indirection: &amp;s1 -&gt; s1 -&gt; heap</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="175.849" y="40" text-anchor="middle" font-size="24.647443861085" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Stack</text>
  <rect x="40" y="77.419289282" width="271.6982" height="112.257980749222" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.375355688904" filter="url(#shadow)"/>
  <text x="175.849" y="148.5161421436" text-anchor="middle" font-size="22.406718848292" font-family="Arial, sans-serif" fill="var(--primary-text)">s1: { ptr, len, cap }</text>
  <rect x="40" y="189.677495837667" width="271.6982" height="93.548336108222" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.375355688904" filter="url(#shadow)"/>
  <text x="175.849" y="253.290332778356" text-anchor="middle" font-size="22.406718848292" font-family="Arial, sans-serif" fill="var(--info-text)">&amp;s1: ptr to s1</text>
  <text x="787.1698" y="40" text-anchor="middle" font-size="24.647443861085" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Heap</text>
  <rect x="606.0378" y="77.419289282" width="362.2642" height="130.967738293444" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.375355688904" filter="url(#shadow)"/>
  <text x="787.1698" y="133.548449011445" text-anchor="middle" font-size="22.406718848292" font-family="Arial, sans-serif" fill="var(--ok-text)">"hello" (5 bytes)</text>
  <text x="787.1698" y="182.193479916755" text-anchor="middle" font-size="22.406718848292" font-family="Arial, sans-serif" fill="var(--ok-text)">heap-allocated buffer</text>
  <line x1="311.6981" y1="133.548449011445" x2="606.0378" y2="133.548449011445" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="9.9805 5.9883"/>
  <text x="458.8678" y="107.354901352756" text-anchor="middle" font-size="22.406718848292" font-family="Arial, sans-serif" fill="var(--text)">s1.ptr</text>
  <line x1="175.849" y1="189.677495837667" x2="175.849" y2="133.548449011445" stroke="var(--text)" stroke-width="1.9961" marker-end="url(#arrow)" stroke-dasharray="5.9883 3.9922"/>
  <text x="221.132" y="170.967851196667" font-size="22.406718848292" font-family="Arial, sans-serif" fill="var(--primary-text)">&amp;s1 points to s1</text>
  <rect x="40" y="358.064523413111" width="566.0378" height="112.257980749222" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.375355688904" filter="url(#shadow)"/>
  <text x="323.0188" y="425.419311862644" text-anchor="middle" font-size="22.406718848292" font-family="Arial, sans-serif" fill="var(--warn-text)">Reference = pointer to the stack variable</text>
  <rect x="673.9622" y="358.064523413111" width="566.0378" height="112.257980749222" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.375355688904" filter="url(#shadow)"/>
  <text x="956.9812" y="425.419311862644" text-anchor="middle" font-size="22.406718848292" font-family="Arial, sans-serif" fill="var(--danger-text)">No heap copy, no ownership transfer</text>
  <rect x="221.132" y="526.451663891778" width="905.6604" height="93.548336108222" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.375355688904" filter="url(#shadow)"/>
  <text x="673.9622" y="590.064500832467" text-anchor="middle" font-size="22.406718848292" font-family="Arial, sans-serif" fill="var(--primary-text)">Reference is an extra level of indirection: &amp;s1 -&gt; s1 -&gt; heap</text>
</svg>

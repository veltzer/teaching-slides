<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Borrow Checker Rules at a Glance</text>
  <rect x="42.6667" y="108" width="554.6667" height="270" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="320" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="#2e7d32">ALLOWED</text>
  <text x="320" y="241.2" text-anchor="middle" font-size="21.3333">&amp;T + &amp;T + &amp;T (many immutable)</text>
  <text x="320" y="295.2" text-anchor="middle" font-size="21.3333">&amp;mut T (one mutable, alone)</text>
  <text x="320" y="349.2" text-anchor="middle" font-size="21.3333">Non-overlapping scopes: &amp;T then &amp;mut T</text>
  <rect x="682.6667" y="108" width="554.6667" height="270" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="960" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="#c62828">REJECTED</text>
  <text x="960" y="241.2" text-anchor="middle" font-size="21.3333">&amp;T + &amp;mut T (simultaneous)</text>
  <text x="960" y="295.2" text-anchor="middle" font-size="21.3333">&amp;mut T + &amp;mut T (two writers)</text>
  <text x="960" y="349.2" text-anchor="middle" font-size="21.3333">Dangling ref (owner dropped)</text>
  <rect x="128" y="432" width="298.6667" height="126" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="277.3333" y="486" text-anchor="middle" font-size="21.3333" font-weight="bold">Compile Time</text>
  <text x="277.3333" y="536.4" text-anchor="middle" font-size="21.3333">Zero runtime cost</text>
  <rect x="490.6667" y="432" width="298.6667" height="126" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="486" text-anchor="middle" font-size="21.3333" font-weight="bold">NLL (Non-Lexical)</text>
  <text x="640" y="536.4" text-anchor="middle" font-size="21.3333">Ref ends at last use</text>
  <rect x="853.3333" y="432" width="298.6667" height="126" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="1002.6667" y="486" text-anchor="middle" font-size="21.3333" font-weight="bold">Data Race Free</text>
  <text x="1002.6667" y="536.4" text-anchor="middle" font-size="21.3333">Prevents UB at compile</text>
  <rect x="213.3333" y="612" width="853.3333" height="79.2" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="666" text-anchor="middle" font-size="21.3333">Key insight: aliasing XOR mutation (but never both)</text>
</svg>
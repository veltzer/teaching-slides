<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="592.5926" y="50" text-anchor="middle" font-size="23.7037" font-weight="bold">Borrow Checker Rules at a Glance</text>
  <rect x="39.5062" y="100" width="513.5803" height="250" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="296.2963" y="166.6667" text-anchor="middle" font-size="21.7284" font-weight="bold" fill="var(--ok-accent)">ALLOWED</text>
  <text x="296.2963" y="223.3333" text-anchor="middle" font-size="19.7531">&amp;T + &amp;T + &amp;T (many immutable)</text>
  <text x="296.2963" y="273.3333" text-anchor="middle" font-size="19.7531">&amp;mut T (one mutable, alone)</text>
  <text x="296.2963" y="323.3333" text-anchor="middle" font-size="19.7531">Non-overlapping scopes: &amp;T then &amp;mut T</text>
  <rect x="632.0988" y="100" width="513.5803" height="250" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="888.8889" y="166.6667" text-anchor="middle" font-size="21.7284" font-weight="bold" fill="var(--danger-accent)">REJECTED</text>
  <text x="888.8889" y="223.3333" text-anchor="middle" font-size="19.7531">&amp;T + &amp;mut T (simultaneous)</text>
  <text x="888.8889" y="273.3333" text-anchor="middle" font-size="19.7531">&amp;mut T + &amp;mut T (two writers)</text>
  <text x="888.8889" y="323.3333" text-anchor="middle" font-size="19.7531">Dangling ref (owner dropped)</text>
  <rect x="118.5185" y="400" width="276.5432" height="116.6667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="256.7901" y="450" text-anchor="middle" font-size="19.7531" font-weight="bold">Compile Time</text>
  <text x="256.7901" y="496.6667" text-anchor="middle" font-size="19.7531">Zero runtime cost</text>
  <rect x="454.321" y="400" width="276.5432" height="116.6667" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="592.5926" y="450" text-anchor="middle" font-size="19.7531" font-weight="bold">NLL (Non-Lexical)</text>
  <text x="592.5926" y="496.6667" text-anchor="middle" font-size="19.7531">Ref ends at last use</text>
  <rect x="790.1234" y="400" width="276.5432" height="116.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="928.3951" y="450" text-anchor="middle" font-size="19.7531" font-weight="bold">Data Race Free</text>
  <text x="928.3951" y="496.6667" text-anchor="middle" font-size="19.7531">Prevents UB at compile</text>
  <rect x="197.5308" y="566.6667" width="790.1234" height="73.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="592.5926" y="616.6667" text-anchor="middle" font-size="19.7531">Key insight: aliasing XOR mutation (but never both)</text>
</svg>
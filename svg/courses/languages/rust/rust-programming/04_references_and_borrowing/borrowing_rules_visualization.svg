<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.4784" font-weight="bold">Borrow Checker Rules at a Glance</text>
  <rect x="40" y="89.1525" width="557.1429" height="245.7627" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="318.5714" y="154.6893" text-anchor="middle" font-size="22.4386" font-weight="bold" fill="var(--ok-accent)">ALLOWED</text>
  <text x="318.5714" y="210.3954" text-anchor="middle" font-size="20.3987">&amp;T + &amp;T + &amp;T (many immutable)</text>
  <text x="318.5714" y="259.548" text-anchor="middle" font-size="20.3987">&amp;mut T (one mutable, alone)</text>
  <text x="318.5714" y="308.7005" text-anchor="middle" font-size="20.3987">Non-overlapping scopes: &amp;T then &amp;mut T</text>
  <rect x="682.8571" y="89.1525" width="557.1429" height="245.7627" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="961.4285" y="154.6893" text-anchor="middle" font-size="22.4386" font-weight="bold" fill="var(--danger-accent)">REJECTED</text>
  <text x="961.4285" y="210.3954" text-anchor="middle" font-size="20.3987">&amp;T + &amp;mut T (simultaneous)</text>
  <text x="961.4285" y="259.548" text-anchor="middle" font-size="20.3987">&amp;mut T + &amp;mut T (two writers)</text>
  <text x="961.4285" y="308.7005" text-anchor="middle" font-size="20.3987">Dangling ref (owner dropped)</text>
  <rect x="125.7142" y="384.0678" width="300" height="114.6893" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="275.7142" y="433.2203" text-anchor="middle" font-size="20.3987" font-weight="bold">Compile Time</text>
  <text x="275.7142" y="479.0961" text-anchor="middle" font-size="20.3987">Zero runtime cost</text>
  <rect x="490" y="384.0678" width="300" height="114.6893" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="433.2203" text-anchor="middle" font-size="20.3987" font-weight="bold">NLL (Non-Lexical)</text>
  <text x="639.9999" y="479.0961" text-anchor="middle" font-size="20.3987">Ref ends at last use</text>
  <rect x="854.2856" y="384.0678" width="300" height="114.6893" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1004.2857" y="433.2203" text-anchor="middle" font-size="20.3987" font-weight="bold">Data Race Free</text>
  <text x="1004.2857" y="479.0961" text-anchor="middle" font-size="20.3987">Prevents UB at compile</text>
  <rect x="211.4285" y="547.9096" width="857.1427" height="72.0904" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="597.0622" text-anchor="middle" font-size="20.3987">Key insight: aliasing XOR mutation (but never both)</text>
</svg>
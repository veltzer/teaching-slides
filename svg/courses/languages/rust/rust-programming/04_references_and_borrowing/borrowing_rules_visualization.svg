<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.4784" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Borrow Checker Rules at a Glance</text>
  <rect x="40" y="89.1525" width="557.1429" height="245.7627" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="318.5714" y="154.6893" text-anchor="middle" font-size="22.4386" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">ALLOWED</text>
  <text x="318.5714" y="210.3954" text-anchor="middle" font-size="20.3987" font-family="Arial, sans-serif" fill="var(--ok-text)">&amp;T + &amp;T + &amp;T (many immutable)</text>
  <text x="318.5714" y="259.548" text-anchor="middle" font-size="20.3987" font-family="Arial, sans-serif" fill="var(--ok-text)">&amp;mut T (one mutable, alone)</text>
  <text x="318.5714" y="308.7005" text-anchor="middle" font-size="20.3987" font-family="Arial, sans-serif" fill="var(--ok-text)">Non-overlapping scopes: &amp;T then &amp;mut T</text>
  <rect x="682.8571" y="89.1525" width="557.1429" height="245.7627" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="961.4285" y="154.6893" text-anchor="middle" font-size="22.4386" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">REJECTED</text>
  <text x="961.4285" y="210.3954" text-anchor="middle" font-size="20.3987" font-family="Arial, sans-serif" fill="var(--danger-text)">&amp;T + &amp;mut T (simultaneous)</text>
  <text x="961.4285" y="259.548" text-anchor="middle" font-size="20.3987" font-family="Arial, sans-serif" fill="var(--danger-text)">&amp;mut T + &amp;mut T (two writers)</text>
  <text x="961.4285" y="308.7005" text-anchor="middle" font-size="20.3987" font-family="Arial, sans-serif" fill="var(--danger-text)">Dangling ref (owner dropped)</text>
  <rect x="125.7142" y="384.0678" width="300" height="114.6893" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="275.7142" y="433.2203" text-anchor="middle" font-size="20.3987" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Compile Time</text>
  <text x="275.7142" y="479.0961" text-anchor="middle" font-size="20.3987" font-family="Arial, sans-serif" fill="var(--primary-text)">Zero runtime cost</text>
  <rect x="490" y="384.0678" width="300" height="114.6893" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="433.2203" text-anchor="middle" font-size="20.3987" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">NLL (Non-Lexical)</text>
  <text x="639.9999" y="479.0961" text-anchor="middle" font-size="20.3987" font-family="Arial, sans-serif" fill="var(--info-text)">Ref ends at last use</text>
  <rect x="854.2856" y="384.0678" width="300" height="114.6893" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1004.2857" y="433.2203" text-anchor="middle" font-size="20.3987" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Data Race Free</text>
  <text x="1004.2857" y="479.0961" text-anchor="middle" font-size="20.3987" font-family="Arial, sans-serif" fill="var(--warn-text)">Prevents UB at compile</text>
  <rect x="211.4285" y="547.9096" width="857.1427" height="72.0904" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="597.0622" text-anchor="middle" font-size="20.3987" font-family="Arial, sans-serif" fill="var(--ok-text)">Key insight: aliasing XOR mutation (but never both)</text>
</svg>

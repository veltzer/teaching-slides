<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ellipse cx="640" cy="330" rx="137.931" ry="91.954" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <ellipse cx="295.1724" cy="148.9655" rx="114.9426" ry="68.9655" fill="var(--primary-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <ellipse cx="984.8276" cy="148.9655" rx="114.9426" ry="68.9655" fill="var(--info-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <ellipse cx="295.1724" cy="511.0345" rx="114.9426" ry="68.9655" fill="var(--ok-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <ellipse cx="984.8276" cy="511.0345" rx="114.9426" ry="68.9655" fill="var(--warn-fill)" stroke="var(--text)" stroke-width="4.2667" />
  <text x="640" y="342.931" text-anchor="middle" font-size="27.5862" fill="var(--bg)">Core</text>
  <text x="295.1724" y="161.8966" text-anchor="middle" font-size="25.2874">Concept 1</text>
  <text x="984.8276" y="161.8966" text-anchor="middle" font-size="25.2874">Concept 2</text>
  <text x="295.1724" y="523.9655" text-anchor="middle" font-size="25.2874">Concept 3</text>
  <text x="984.8276" y="523.9655" text-anchor="middle" font-size="25.2874">Concept 4</text>
  <line x1="525.0574" y1="278.2759" x2="387.1264" y2="200.6897" stroke="var(--text)" stroke-width="2" />
  <line x1="754.9426" y1="278.2759" x2="892.8736" y2="200.6897" stroke="var(--text)" stroke-width="2" />
  <line x1="525.0574" y1="381.7241" x2="387.1264" y2="459.3103" stroke="var(--text)" stroke-width="2" />
  <line x1="754.9426" y1="381.7241" x2="892.8736" y2="459.3103" stroke="var(--text)" stroke-width="2" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Rust Concurrency Models</text>
  <rect x="42.6667" y="100.8" width="362.6667" height="234" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="224" y="165.6" text-anchor="middle" font-size="21.3333" font-weight="bold">Message Passing</text>
  <text x="224" y="219.6" text-anchor="middle" font-size="21.3333">mpsc::channel()</text>
  <text x="224" y="266.4" text-anchor="middle" font-size="21.3333">tx.send() / rx.recv()</text>
  <text x="224" y="313.2" text-anchor="middle" font-size="21.3333">"Share by communicating"</text>
  <rect x="458.6667" y="100.8" width="362.6667" height="234" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="165.6" text-anchor="middle" font-size="21.3333" font-weight="bold">Shared State</text>
  <text x="640" y="219.6" text-anchor="middle" font-size="21.3333">Arc&lt;Mutex&lt;T&gt;&gt;</text>
  <text x="640" y="266.4" text-anchor="middle" font-size="21.3333">Arc&lt;RwLock&lt;T&gt;&gt;</text>
  <text x="640" y="313.2" text-anchor="middle" font-size="21.3333">Atomic types</text>
  <rect x="874.6667" y="100.8" width="362.6667" height="234" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1056" y="165.6" text-anchor="middle" font-size="21.3333" font-weight="bold">Thread Spawn</text>
  <text x="1056" y="219.6" text-anchor="middle" font-size="21.3333">thread::spawn(move || {})</text>
  <text x="1056" y="266.4" text-anchor="middle" font-size="21.3333">handle.join()</text>
  <text x="1056" y="313.2" text-anchor="middle" font-size="21.3333">OS-level threads</text>
  <rect x="128" y="396" width="426.6667" height="126" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="341.3333" y="450" text-anchor="middle" font-size="21.3333" font-weight="bold">Send trait</text>
  <text x="341.3333" y="500.4" text-anchor="middle" font-size="21.3333">Type can be transferred between threads</text>
  <rect x="618.6667" y="396" width="426.6667" height="126" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="832" y="450" text-anchor="middle" font-size="21.3333" font-weight="bold">Sync trait</text>
  <text x="832" y="500.4" text-anchor="middle" font-size="21.3333">Type can be shared (&amp;T) between threads</text>
  <rect x="170.6667" y="576" width="938.6667" height="108" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="648" text-anchor="middle" font-size="21.3333">Compiler enforces thread safety: data races are compile errors, not runtime bugs</text>
</svg>
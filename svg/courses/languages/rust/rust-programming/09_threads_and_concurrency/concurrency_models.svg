<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="364.2858" height="232.716074055021" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="222.1427" y="104.44450445816" text-anchor="middle" font-size="21.322146139654" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Message Passing</text>
  <text x="222.1427" y="158.148222165064" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--primary-text)">mpsc::channel()</text>
  <text x="222.1427" y="204.691415371131" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--primary-text)">tx.send() / rx.recv()</text>
  <text x="222.1427" y="251.234500552509" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--primary-text)">"Share by communicating"</text>
  <rect x="457.8571" y="40" width="364.2858" height="232.716074055021" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="639.9999" y="104.44450445816" text-anchor="middle" font-size="21.322146139654" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Shared State</text>
  <text x="639.9999" y="158.148222165064" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--info-text)">Arc&lt;Mutex&lt;T&gt;&gt;</text>
  <text x="639.9999" y="204.691415371131" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--info-text)">Arc&lt;RwLock&lt;T&gt;&gt;</text>
  <text x="639.9999" y="251.234500552509" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--info-text)">Atomic types</text>
  <rect x="875.7142" y="40" width="364.2858" height="232.716074055021" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="1057.8571" y="104.44450445816" text-anchor="middle" font-size="21.322146139654" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Thread Spawn</text>
  <text x="1057.8571" y="158.148222165064" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--ok-text)">thread::spawn(move || {})</text>
  <text x="1057.8571" y="204.691415371131" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--ok-text)">handle.join()</text>
  <text x="1057.8571" y="251.234500552509" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--ok-text)">OS-level threads</text>
  <rect x="125.7142" y="333.580208238074" width="428.5714" height="125.308638641213" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="339.9999" y="387.283925944979" text-anchor="middle" font-size="21.322146139654" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Send trait</text>
  <text x="339.9999" y="437.407381401464" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--warn-text)">Type can be transferred between threads</text>
  <rect x="618.5713" y="333.580208238074" width="428.5714" height="125.308638641213" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="832.857" y="387.283925944979" text-anchor="middle" font-size="21.322146139654" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Sync trait</text>
  <text x="832.857" y="437.407381401464" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--danger-text)">Type can be shared (&amp;T) between threads</text>
  <rect x="168.5713" y="512.59267261088" width="942.8571" height="107.40732738912" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="639.9999" y="584.19759354519" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--primary-text)">Compiler enforces thread safety: data races are compile errors, not runtime bugs</text>
</svg>

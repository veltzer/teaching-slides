<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Rust Concurrency Models</ns0:text>
  <ns0:rect x="39.9221" y="94.3158" width="339.3373" height="218.9474" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="209.5906" y="154.9474" text-anchor="middle" font-size="19.961" font-weight="bold">Message Passing</ns0:text>
  <ns0:text x="209.5906" y="205.4737" text-anchor="middle" font-size="19.961">mpsc::channel()</ns0:text>
  <ns0:text x="209.5906" y="249.2632" text-anchor="middle" font-size="19.961">tx.send() / rx.recv()</ns0:text>
  <ns0:text x="209.5906" y="293.0526" text-anchor="middle" font-size="19.961">"Share by communicating"</ns0:text>
  <ns0:rect x="429.1618" y="94.3158" width="339.3373" height="218.9474" fill="#f3e5f5" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="598.8304" y="154.9474" text-anchor="middle" font-size="19.961" font-weight="bold">Shared State</ns0:text>
  <ns0:text x="598.8304" y="205.4737" text-anchor="middle" font-size="19.961">Arc&lt;Mutex&lt;T&gt;&gt;</ns0:text>
  <ns0:text x="598.8304" y="249.2632" text-anchor="middle" font-size="19.961">Arc&lt;RwLock&lt;T&gt;&gt;</ns0:text>
  <ns0:text x="598.8304" y="293.0526" text-anchor="middle" font-size="19.961">Atomic types</ns0:text>
  <ns0:rect x="818.4016" y="94.3158" width="339.3373" height="218.9474" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="988.0702" y="154.9474" text-anchor="middle" font-size="19.961" font-weight="bold">Thread Spawn</ns0:text>
  <ns0:text x="988.0702" y="205.4737" text-anchor="middle" font-size="19.961">thread::spawn(move || {})</ns0:text>
  <ns0:text x="988.0702" y="249.2632" text-anchor="middle" font-size="19.961">handle.join()</ns0:text>
  <ns0:text x="988.0702" y="293.0526" text-anchor="middle" font-size="19.961">OS-level threads</ns0:text>
  <ns0:rect x="119.7661" y="370.5263" width="399.2203" height="117.8947" fill="#fff3e0" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="319.3762" y="421.0526" text-anchor="middle" font-size="19.961" font-weight="bold">Send trait</ns0:text>
  <ns0:text x="319.3762" y="468.2105" text-anchor="middle" font-size="19.961">Type can be transferred between threads</ns0:text>
  <ns0:rect x="578.8694" y="370.5263" width="399.2203" height="117.8947" fill="#ffebee" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="778.4795" y="421.0526" text-anchor="middle" font-size="19.961" font-weight="bold">Sync trait</ns0:text>
  <ns0:text x="778.4795" y="468.2105" text-anchor="middle" font-size="19.961">Type can be shared (&amp;T) between threads</ns0:text>
  <ns0:rect x="159.6881" y="538.9474" width="878.2846" height="101.0526" fill="#e3f2fd" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="598.8304" y="606.3158" text-anchor="middle" font-size="19.961">Compiler enforces thread safety: data races are compile errors, not runtime bugs</ns0:text>
</ns0:svg>
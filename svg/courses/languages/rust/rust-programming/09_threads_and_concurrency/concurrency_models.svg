<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Rust Concurrency Models</text>
  <rect x="39.9221" y="94.3158" width="339.3373" height="218.9474" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="209.5906" y="154.9474" text-anchor="middle" font-size="19.961" font-weight="bold">Message Passing</text>
  <text x="209.5906" y="205.4737" text-anchor="middle" font-size="19.961">mpsc::channel()</text>
  <text x="209.5906" y="249.2632" text-anchor="middle" font-size="19.961">tx.send() / rx.recv()</text>
  <text x="209.5906" y="293.0526" text-anchor="middle" font-size="19.961">"Share by communicating"</text>
  <rect x="429.1618" y="94.3158" width="339.3373" height="218.9474" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="154.9474" text-anchor="middle" font-size="19.961" font-weight="bold">Shared State</text>
  <text x="598.8304" y="205.4737" text-anchor="middle" font-size="19.961">Arc&lt;Mutex&lt;T&gt;&gt;</text>
  <text x="598.8304" y="249.2632" text-anchor="middle" font-size="19.961">Arc&lt;RwLock&lt;T&gt;&gt;</text>
  <text x="598.8304" y="293.0526" text-anchor="middle" font-size="19.961">Atomic types</text>
  <rect x="818.4016" y="94.3158" width="339.3373" height="218.9474" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="988.0702" y="154.9474" text-anchor="middle" font-size="19.961" font-weight="bold">Thread Spawn</text>
  <text x="988.0702" y="205.4737" text-anchor="middle" font-size="19.961">thread::spawn(move || {})</text>
  <text x="988.0702" y="249.2632" text-anchor="middle" font-size="19.961">handle.join()</text>
  <text x="988.0702" y="293.0526" text-anchor="middle" font-size="19.961">OS-level threads</text>
  <rect x="119.7661" y="370.5263" width="399.2203" height="117.8947" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="319.3762" y="421.0526" text-anchor="middle" font-size="19.961" font-weight="bold">Send trait</text>
  <text x="319.3762" y="468.2105" text-anchor="middle" font-size="19.961">Type can be transferred between threads</text>
  <rect x="578.8694" y="370.5263" width="399.2203" height="117.8947" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="778.4795" y="421.0526" text-anchor="middle" font-size="19.961" font-weight="bold">Sync trait</text>
  <text x="778.4795" y="468.2105" text-anchor="middle" font-size="19.961">Type can be shared (&amp;T) between threads</text>
  <rect x="159.6881" y="538.9474" width="878.2846" height="101.0526" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="606.3158" text-anchor="middle" font-size="19.961">Compiler enforces thread safety: data races are compile errors, not runtime bugs</text>
</svg>
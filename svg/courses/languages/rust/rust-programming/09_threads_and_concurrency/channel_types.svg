<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_chan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Channel Types: Message Passing</text>
  <rect x="39.9221" y="101.0526" width="239.5322" height="185.2632" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="159.6881" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Producer (tx)</text>
  <text x="159.6881" y="212.2105" text-anchor="middle" font-size="19.961">tx.send(msg)</text>
  <text x="159.6881" y="256" text-anchor="middle" font-size="19.961">can clone tx</text>
  <rect x="479.0643" y="101.0526" width="239.5322" height="185.2632" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Channel</text>
  <text x="598.8304" y="212.2105" text-anchor="middle" font-size="19.961">FIFO queue</text>
  <text x="598.8304" y="256" text-anchor="middle" font-size="19.961">buffered/unbuffered</text>
  <rect x="918.2066" y="101.0526" width="239.5322" height="185.2632" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1037.9727" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Consumer (rx)</text>
  <text x="1037.9727" y="212.2105" text-anchor="middle" font-size="19.961">rx.recv()</text>
  <text x="1037.9727" y="256" text-anchor="middle" font-size="19.961">blocks until msg</text>
  <line x1="279.4542" y1="192" x2="479.0643" y2="192" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_chan)" />
  <text x="379.2592" y="168.4211" text-anchor="middle" font-size="19.961">send</text>
  <line x1="718.5965" y1="192" x2="918.2066" y2="192" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_chan)" />
  <text x="818.4016" y="168.4211" text-anchor="middle" font-size="19.961">recv</text>
  <rect x="39.9221" y="336.8421" width="538.9474" height="134.7368" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="309.3957" y="390.7368" text-anchor="middle" font-size="19.961" font-weight="bold">mpsc (multi-producer, single-consumer)</text>
  <text x="309.3957" y="444.6316" text-anchor="middle" font-size="19.961">Multiple tx clones, one rx. Ownership transferred on send.</text>
  <rect x="618.7914" y="336.8421" width="538.9474" height="134.7368" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="888.2651" y="390.7368" text-anchor="middle" font-size="19.961" font-weight="bold">sync_channel (bounded)</text>
  <text x="888.2651" y="444.6316" text-anchor="middle" font-size="19.961">Fixed buffer size. send() blocks when full.</text>
  <rect x="199.6101" y="522.1053" width="798.4405" height="117.8947" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="572.6316" text-anchor="middle" font-size="19.961">Message ownership is moved through the channel</text>
  <text x="598.8304" y="619.7895" text-anchor="middle" font-size="19.961">Sender cannot use value after send -- compiler enforced</text>
</svg>
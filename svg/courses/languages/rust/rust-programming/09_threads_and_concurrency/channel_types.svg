<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr_chan" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Channel Types: Message Passing</ns0:text>
  <ns0:rect x="39.9221" y="101.0526" width="239.5322" height="185.2632" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="159.6881" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Producer (tx)</ns0:text>
  <ns0:text x="159.6881" y="212.2105" text-anchor="middle" font-size="19.961">tx.send(msg)</ns0:text>
  <ns0:text x="159.6881" y="256" text-anchor="middle" font-size="19.961">can clone tx</ns0:text>
  <ns0:rect x="479.0643" y="101.0526" width="239.5322" height="185.2632" fill="#fff3e0" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="598.8304" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Channel</ns0:text>
  <ns0:text x="598.8304" y="212.2105" text-anchor="middle" font-size="19.961">FIFO queue</ns0:text>
  <ns0:text x="598.8304" y="256" text-anchor="middle" font-size="19.961">buffered/unbuffered</ns0:text>
  <ns0:rect x="918.2066" y="101.0526" width="239.5322" height="185.2632" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="1037.9727" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Consumer (rx)</ns0:text>
  <ns0:text x="1037.9727" y="212.2105" text-anchor="middle" font-size="19.961">rx.recv()</ns0:text>
  <ns0:text x="1037.9727" y="256" text-anchor="middle" font-size="19.961">blocks until msg</ns0:text>
  <ns0:line x1="279.4542" y1="192" x2="479.0643" y2="192" stroke="#333" stroke-width="3.9922" marker-end="url(#arr_chan)" />
  <ns0:text x="379.2592" y="168.4211" text-anchor="middle" font-size="19.961">send</ns0:text>
  <ns0:line x1="718.5965" y1="192" x2="918.2066" y2="192" stroke="#333" stroke-width="3.9922" marker-end="url(#arr_chan)" />
  <ns0:text x="818.4016" y="168.4211" text-anchor="middle" font-size="19.961">recv</ns0:text>
  <ns0:rect x="39.9221" y="336.8421" width="538.9474" height="134.7368" fill="#f3e5f5" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="309.3957" y="390.7368" text-anchor="middle" font-size="19.961" font-weight="bold">mpsc (multi-producer, single-consumer)</ns0:text>
  <ns0:text x="309.3957" y="444.6316" text-anchor="middle" font-size="19.961">Multiple tx clones, one rx. Ownership transferred on send.</ns0:text>
  <ns0:rect x="618.7914" y="336.8421" width="538.9474" height="134.7368" fill="#ffebee" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="888.2651" y="390.7368" text-anchor="middle" font-size="19.961" font-weight="bold">sync_channel (bounded)</ns0:text>
  <ns0:text x="888.2651" y="444.6316" text-anchor="middle" font-size="19.961">Fixed buffer size. send() blocks when full.</ns0:text>
  <ns0:rect x="199.6101" y="522.1053" width="798.4405" height="117.8947" fill="#e3f2fd" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="598.8304" y="572.6316" text-anchor="middle" font-size="19.961">Message ownership is moved through the channel</ns0:text>
  <ns0:text x="598.8304" y="619.7895" text-anchor="middle" font-size="19.961">Sender cannot use value after send -- compiler enforced</ns0:text>
</ns0:svg>
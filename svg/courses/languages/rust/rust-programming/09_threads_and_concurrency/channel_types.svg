<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr_chan" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Channel Types: Message Passing</text>
  <rect x="42.6667" y="108" width="256" height="198" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="170.6667" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Producer (tx)</text>
  <text x="170.6667" y="226.8" text-anchor="middle" font-size="21.3333">tx.send(msg)</text>
  <text x="170.6667" y="273.6" text-anchor="middle" font-size="21.3333">can clone tx</text>
  <rect x="512" y="108" width="256" height="198" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Channel</text>
  <text x="640" y="226.8" text-anchor="middle" font-size="21.3333">FIFO queue</text>
  <text x="640" y="273.6" text-anchor="middle" font-size="21.3333">buffered/unbuffered</text>
  <rect x="981.3333" y="108" width="256" height="198" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1109.3333" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Consumer (rx)</text>
  <text x="1109.3333" y="226.8" text-anchor="middle" font-size="21.3333">rx.recv()</text>
  <text x="1109.3333" y="273.6" text-anchor="middle" font-size="21.3333">blocks until msg</text>
  <line x1="298.6667" y1="205.2" x2="512" y2="205.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_chan)" />
  <text x="405.3333" y="180" text-anchor="middle" font-size="21.3333">send</text>
  <line x1="768" y1="205.2" x2="981.3333" y2="205.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_chan)" />
  <text x="874.6667" y="180" text-anchor="middle" font-size="21.3333">recv</text>
  <rect x="42.6667" y="360" width="576" height="144" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="330.6667" y="417.6" text-anchor="middle" font-size="21.3333" font-weight="bold">mpsc (multi-producer, single-consumer)</text>
  <text x="330.6667" y="475.2" text-anchor="middle" font-size="21.3333">Multiple tx clones, one rx. Ownership transferred on send.</text>
  <rect x="661.3333" y="360" width="576" height="144" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="949.3333" y="417.6" text-anchor="middle" font-size="21.3333" font-weight="bold">sync_channel (bounded)</text>
  <text x="949.3333" y="475.2" text-anchor="middle" font-size="21.3333">Fixed buffer size. send() blocks when full.</text>
  <rect x="213.3333" y="558" width="853.3333" height="126" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="612" text-anchor="middle" font-size="21.3333">Message ownership is moved through the channel</text>
  <text x="640" y="662.4" text-anchor="middle" font-size="21.3333">Sender cannot use value after send -- compiler enforced</text>
</svg>
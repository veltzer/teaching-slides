<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="257.1429" height="199.375099121096" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.274950283528" filter="url(#shadow)"/>
  <text x="168.5713" y="105.249954882811" text-anchor="middle" font-size="21.454996261925" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Producer (tx)</text>
  <text x="168.5713" y="159.624971972655" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--primary-text)">tx.send(msg)</text>
  <text x="168.5713" y="206.749957617186" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--primary-text)">can clone tx</text>
  <rect x="511.4285" y="40" width="257.1429" height="199.375099121096" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.274950283528" filter="url(#shadow)"/>
  <text x="639.9999" y="105.249954882811" text-anchor="middle" font-size="21.454996261925" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Channel</text>
  <text x="639.9999" y="159.624971972655" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--warn-text)">FIFO queue</text>
  <text x="639.9999" y="206.749957617186" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--warn-text)">buffered/unbuffered</text>
  <rect x="982.8571" y="40" width="257.1429" height="199.375099121096" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.274950283528" filter="url(#shadow)"/>
  <text x="1111.4285" y="105.249954882811" text-anchor="middle" font-size="21.454996261925" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Consumer (rx)</text>
  <text x="1111.4285" y="159.624971972655" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--ok-text)">rx.recv()</text>
  <text x="1111.4285" y="206.749957617186" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--ok-text)">blocks until msg</text>
  <line x1="297.1428" y1="137.874987011718" x2="511.4285" y2="137.874987011718" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="404.2856" y="112.500095703128" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--text)">send</text>
  <line x1="768.5714" y1="137.874987011718" x2="982.8571" y2="137.874987011718" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="875.7143" y="112.500095703128" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--text)">recv</text>
  <rect x="40" y="293.750006835938" width="578.5715" height="144.999972656249" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.274950283528" filter="url(#shadow)"/>
  <text x="329.2856" y="351.749930273436" text-anchor="middle" font-size="21.454996261925" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">mpsc (multi-producer, single-consumer)</text>
  <text x="329.2856" y="409.750072460939" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--info-text)">Multiple tx clones, one rx. Ownership transferred on send.</text>
  <rect x="661.4285" y="293.750006835938" width="578.5715" height="144.999972656249" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.274950283528" filter="url(#shadow)"/>
  <text x="950.7143" y="351.749930273436" text-anchor="middle" font-size="21.454996261925" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">sync_channel (bounded)</text>
  <text x="950.7143" y="409.750072460939" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--danger-text)">Fixed buffer size. send() blocks when full.</text>
  <rect x="211.4285" y="493.124996582031" width="857.1429" height="126.875003417969" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.274950283528" filter="url(#shadow)"/>
  <text x="639.9999" y="547.500013671875" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--primary-text)">Message ownership is moved through the channel</text>
  <text x="639.9999" y="598.250015039063" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--primary-text)">Sender cannot use value after send -- compiler enforced</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_chan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.6179" font-weight="bold">Channel Types: Message Passing</text>
  <rect x="40" y="89.7143" width="257.1429" height="182.2858" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="168.5713" y="149.3714" text-anchor="middle" font-size="20.5149" font-weight="bold">Producer (tx)</text>
  <text x="168.5713" y="199.0857" text-anchor="middle" font-size="20.5149">tx.send(msg)</text>
  <text x="168.5713" y="242.1714" text-anchor="middle" font-size="20.5149">can clone tx</text>
  <rect x="511.4285" y="89.7143" width="257.1429" height="182.2858" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="149.3714" text-anchor="middle" font-size="20.5149" font-weight="bold">Channel</text>
  <text x="639.9999" y="199.0857" text-anchor="middle" font-size="20.5149">FIFO queue</text>
  <text x="639.9999" y="242.1714" text-anchor="middle" font-size="20.5149">buffered/unbuffered</text>
  <rect x="982.8571" y="89.7143" width="257.1429" height="182.2858" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1111.4285" y="149.3714" text-anchor="middle" font-size="20.5149" font-weight="bold">Consumer (rx)</text>
  <text x="1111.4285" y="199.0857" text-anchor="middle" font-size="20.5149">rx.recv()</text>
  <text x="1111.4285" y="242.1714" text-anchor="middle" font-size="20.5149">blocks until msg</text>
  <line x1="297.1428" y1="179.2" x2="511.4285" y2="179.2" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_chan)" />
  <text x="404.2856" y="156.0001" text-anchor="middle" font-size="20.5149">send</text>
  <line x1="768.5714" y1="179.2" x2="982.8571" y2="179.2" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_chan)" />
  <text x="875.7143" y="156.0001" text-anchor="middle" font-size="20.5149">recv</text>
  <rect x="40" y="321.7143" width="578.5715" height="132.5714" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="329.2856" y="374.7428" text-anchor="middle" font-size="20.5149" font-weight="bold">mpsc (multi-producer, single-consumer)</text>
  <text x="329.2856" y="427.7715" text-anchor="middle" font-size="20.5149">Multiple tx clones, one rx. Ownership transferred on send.</text>
  <rect x="661.4285" y="321.7143" width="578.5715" height="132.5714" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="950.7143" y="374.7428" text-anchor="middle" font-size="20.5149" font-weight="bold">sync_channel (bounded)</text>
  <text x="950.7143" y="427.7715" text-anchor="middle" font-size="20.5149">Fixed buffer size. send() blocks when full.</text>
  <rect x="211.4285" y="504" width="857.1429" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="553.7143" text-anchor="middle" font-size="20.5149">Message ownership is moved through the channel</text>
  <text x="639.9999" y="600.1143" text-anchor="middle" font-size="20.5149">Sender cannot use value after send -- compiler enforced</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Send and Sync: Thread Safety Markers</text>
  <rect x="42.6667" y="108" width="576" height="252" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="330.6667" y="172.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Send</text>
  <text x="330.6667" y="226.8" text-anchor="middle" font-size="21.3333">Ownership can transfer between threads</text>
  <text x="330.6667" y="280.8" text-anchor="middle" font-size="21.3333">Most types are Send (i32, String, Vec...)</text>
  <text x="330.6667" y="331.2" text-anchor="middle" font-size="21.3333" fill="#c62828">NOT Send: Rc&lt;T&gt;, raw pointers</text>
  <rect x="661.3333" y="108" width="576" height="252" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="949.3333" y="172.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Sync</text>
  <text x="949.3333" y="226.8" text-anchor="middle" font-size="21.3333">&amp;T can be shared between threads</text>
  <text x="949.3333" y="280.8" text-anchor="middle" font-size="21.3333">T is Sync if &amp;T is Send</text>
  <text x="949.3333" y="331.2" text-anchor="middle" font-size="21.3333" fill="#c62828">NOT Sync: Cell&lt;T&gt;, RefCell&lt;T&gt;</text>
  <rect x="42.6667" y="414" width="384" height="126" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="234.6667" y="468" text-anchor="middle" font-size="21.3333" font-weight="bold">Arc&lt;T&gt;</text>
  <text x="234.6667" y="518.4" text-anchor="middle" font-size="21.3333">Send + Sync ref counting</text>
  <rect x="448" y="414" width="384" height="126" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="468" text-anchor="middle" font-size="21.3333" font-weight="bold">Mutex&lt;T&gt;</text>
  <text x="640" y="518.4" text-anchor="middle" font-size="21.3333">Makes T Sync via locking</text>
  <rect x="853.3333" y="414" width="384" height="126" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="1045.3333" y="468" text-anchor="middle" font-size="21.3333" font-weight="bold">RwLock&lt;T&gt;</text>
  <text x="1045.3333" y="518.4" text-anchor="middle" font-size="21.3333">Many readers OR one writer</text>
  <rect x="170.6667" y="594" width="938.6667" height="90" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="655.2" text-anchor="middle" font-size="21.3333">Auto-traits: compiler derives Send/Sync if all fields are Send/Sync</text>
</svg>
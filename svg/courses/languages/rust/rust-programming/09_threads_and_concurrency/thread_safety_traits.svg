<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.6179" font-weight="bold">Send and Sync: Thread Safety Markers</text>
  <rect x="40" y="89.7143" width="578.5715" height="232" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="329.2856" y="149.3714" text-anchor="middle" font-size="22.5664" font-weight="bold">Send</text>
  <text x="329.2856" y="199.0857" text-anchor="middle" font-size="20.5149">Ownership can transfer between threads</text>
  <text x="329.2856" y="248.8" text-anchor="middle" font-size="20.5149">Most types are Send (i32, String, Vec...)</text>
  <text x="329.2856" y="295.2" text-anchor="middle" font-size="20.5149" fill="var(--danger-accent)">NOT Send: Rc&lt;T&gt;, raw pointers</text>
  <rect x="661.4285" y="89.7143" width="578.5715" height="232" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="950.7143" y="149.3714" text-anchor="middle" font-size="22.5664" font-weight="bold">Sync</text>
  <text x="950.7143" y="199.0857" text-anchor="middle" font-size="20.5149">&amp;T can be shared between threads</text>
  <text x="950.7143" y="248.8" text-anchor="middle" font-size="20.5149">T is Sync if &amp;T is Send</text>
  <text x="950.7143" y="295.2" text-anchor="middle" font-size="20.5149" fill="var(--danger-accent)">NOT Sync: Cell&lt;T&gt;, RefCell&lt;T&gt;</text>
  <rect x="40" y="371.4286" width="385.7143" height="116" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="232.8571" y="421.1428" text-anchor="middle" font-size="20.5149" font-weight="bold">Arc&lt;T&gt;</text>
  <text x="232.8571" y="467.5428" text-anchor="middle" font-size="20.5149">Send + Sync ref counting</text>
  <rect x="447.1428" y="371.4286" width="385.7143" height="116" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="421.1428" text-anchor="middle" font-size="20.5149" font-weight="bold">Mutex&lt;T&gt;</text>
  <text x="639.9999" y="467.5428" text-anchor="middle" font-size="20.5149">Makes T Sync via locking</text>
  <rect x="854.2856" y="371.4286" width="385.7143" height="116" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1047.1428" y="421.1428" text-anchor="middle" font-size="20.5149" font-weight="bold">RwLock&lt;T&gt;</text>
  <text x="1047.1428" y="467.5428" text-anchor="middle" font-size="20.5149">Many readers OR one writer</text>
  <rect x="168.5713" y="537.1429" width="942.8572" height="82.8571" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="593.4857" text-anchor="middle" font-size="20.5149">Auto-traits: compiler derives Send/Sync if all fields are Send/Sync</text>
</svg>
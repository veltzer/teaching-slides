<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="386.9993" y="16.3265" width="386.9993" height="114.2857" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="580.4989" y="91.4286" text-anchor="middle" font-size="23.22" fill="var(--bg)" font-weight="bold">Concurrency Tips</text>
  <line x1="483.749" y1="130.6122" x2="232.1995" y2="189.3878" stroke="var(--text)" stroke-width="2" />
  <line x1="677.2487" y1="130.6122" x2="928.7982" y2="189.3878" stroke="var(--text)" stroke-width="2" />
  <line x1="483.749" y1="130.6122" x2="232.1995" y2="408.1633" stroke="var(--text)" stroke-width="2" />
  <line x1="677.2487" y1="130.6122" x2="928.7982" y2="408.1633" stroke="var(--text)" stroke-width="2" />
  <rect x="58.0499" y="173.0612" width="348.2993" height="146.9388" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="232.1995" y="228.5714" text-anchor="middle" font-size="19.3499" font-weight="bold">Channels over mutexes</text>
  <text x="232.1995" y="274.2857" text-anchor="middle" font-size="19.3499">Message passing avoids</text>
  <text x="232.1995" y="310.2041" text-anchor="middle" font-size="19.3499">shared state complexity</text>
  <rect x="754.6485" y="173.0612" width="348.2993" height="146.9388" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="928.7982" y="228.5714" text-anchor="middle" font-size="19.3499" font-weight="bold">Minimize lock scope</text>
  <text x="928.7982" y="274.2857" text-anchor="middle" font-size="19.3499">Hold Mutex lock briefly</text>
  <text x="928.7982" y="310.2041" text-anchor="middle" font-size="19.3499">Drop guard ASAP</text>
  <rect x="58.0499" y="391.8367" width="348.2993" height="146.9388" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="232.1995" y="447.3469" text-anchor="middle" font-size="19.3499" font-weight="bold">Use scoped threads</text>
  <text x="232.1995" y="493.0612" text-anchor="middle" font-size="19.3499">thread::scope() borrows</text>
  <text x="232.1995" y="528.9796" text-anchor="middle" font-size="19.3499">data without Arc/move</text>
  <rect x="754.6485" y="391.8367" width="348.2993" height="146.9388" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="928.7982" y="447.3469" text-anchor="middle" font-size="19.3499" font-weight="bold">Consistent lock order</text>
  <text x="928.7982" y="493.0612" text-anchor="middle" font-size="19.3499">Always acquire locks in</text>
  <text x="928.7982" y="528.9796" text-anchor="middle" font-size="19.3499">the same order (no deadlock)</text>
  <rect x="290.2494" y="581.2245" width="580.4989" height="58.7755" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="580.4989" y="623.6735" text-anchor="middle" font-size="19.3499">Prefer Arc&lt;Mutex&lt;T&gt;&gt; for simple sharing; channels for pipelines</text>
</svg>
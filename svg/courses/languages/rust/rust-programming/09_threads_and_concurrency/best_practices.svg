<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="417.7778" y="40" width="444.4445" height="106.2827" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="109.843" text-anchor="middle" font-size="23.9967" fill="var(--bg)" font-weight="bold">Concurrency Tips</text>
  <line x1="528.8888" y1="146.2827" x2="239.9999" y2="200.9425" stroke="var(--text)" stroke-width="2" />
  <line x1="751.1112" y1="146.2827" x2="1040.0001" y2="200.9425" stroke="var(--text)" stroke-width="2" />
  <line x1="528.8888" y1="146.2827" x2="239.9999" y2="404.3979" stroke="var(--text)" stroke-width="2" />
  <line x1="751.1112" y1="146.2827" x2="1040.0001" y2="404.3979" stroke="var(--text)" stroke-width="2" />
  <rect x="40" y="185.7592" width="400" height="136.6492" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="239.9999" y="237.3822" text-anchor="middle" font-size="19.9971" font-weight="bold">Channels over mutexes</text>
  <text x="239.9999" y="279.8953" text-anchor="middle" font-size="19.9971">Message passing avoids</text>
  <text x="239.9999" y="313.2985" text-anchor="middle" font-size="19.9971">shared state complexity</text>
  <rect x="840" y="185.7592" width="400" height="136.6492" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1040.0001" y="237.3822" text-anchor="middle" font-size="19.9971" font-weight="bold">Minimize lock scope</text>
  <text x="1040.0001" y="279.8953" text-anchor="middle" font-size="19.9971">Hold Mutex lock briefly</text>
  <text x="1040.0001" y="313.2985" text-anchor="middle" font-size="19.9971">Drop guard ASAP</text>
  <rect x="40" y="389.2146" width="400" height="136.6492" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="239.9999" y="440.8377" text-anchor="middle" font-size="19.9971" font-weight="bold">Use scoped threads</text>
  <text x="239.9999" y="483.3508" text-anchor="middle" font-size="19.9971">thread::scope() borrows</text>
  <text x="239.9999" y="516.7539" text-anchor="middle" font-size="19.9971">data without Arc/move</text>
  <rect x="840" y="389.2146" width="400" height="136.6492" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1040.0001" y="440.8377" text-anchor="middle" font-size="19.9971" font-weight="bold">Consistent lock order</text>
  <text x="1040.0001" y="483.3508" text-anchor="middle" font-size="19.9971">Always acquire locks in</text>
  <text x="1040.0001" y="516.7539" text-anchor="middle" font-size="19.9971">the same order (no deadlock)</text>
  <rect x="306.6666" y="565.3403" width="666.6667" height="54.6597" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="604.8168" text-anchor="middle" font-size="19.9971">Prefer Arc&lt;Mutex&lt;T&gt;&gt; for simple sharing; channels for pipelines</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr_async" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Sync vs Async Execution Model</text>
  <rect x="42.6667" y="108" width="362.6667" height="234" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="224" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Synchronous</text>
  <text x="224" y="226.8" text-anchor="middle" font-size="21.3333">1 thread per connection</text>
  <text x="224" y="273.6" text-anchor="middle" font-size="21.3333">Blocks on I/O (idle CPU)</text>
  <text x="224" y="320.4" text-anchor="middle" font-size="21.3333">10K threads = high overhead</text>
  <rect x="458.6667" y="108" width="362.6667" height="234" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Async (Rust)</text>
  <text x="640" y="226.8" text-anchor="middle" font-size="21.3333">Many tasks on few threads</text>
  <text x="640" y="273.6" text-anchor="middle" font-size="21.3333">Yields on .await (no block)</text>
  <text x="640" y="320.4" text-anchor="middle" font-size="21.3333">100K+ tasks, low overhead</text>
  <rect x="874.6667" y="108" width="362.6667" height="234" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1056" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Tokio Runtime</text>
  <text x="1056" y="226.8" text-anchor="middle" font-size="21.3333">Executor: polls Futures</text>
  <text x="1056" y="273.6" text-anchor="middle" font-size="21.3333">Reactor: watches I/O</text>
  <text x="1056" y="320.4" text-anchor="middle" font-size="21.3333">Work-stealing scheduler</text>
  <line x1="405.3333" y1="223.2" x2="458.6667" y2="223.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_async)" />
  <line x1="821.3333" y1="223.2" x2="874.6667" y2="223.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_async)" />
  <rect x="106.6667" y="396" width="1066.6667" height="126" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="450" text-anchor="middle" font-size="21.3333" font-weight="bold">async fn -&gt; impl Future: compiler transforms to state machine</text>
  <text x="640" y="500.4" text-anchor="middle" font-size="21.3333">Each .await is a yield point. No threads blocked. No callback hell.</text>
  <rect x="213.3333" y="576" width="853.3333" height="108" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="648" text-anchor="middle" font-size="21.3333">Use async for I/O-bound work; use threads for CPU-bound work</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:marker id="arr_async" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Sync vs Async Execution Model</ns0:text>
  <ns0:rect x="39.9221" y="101.0526" width="339.3373" height="218.9474" fill="#ffebee" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="209.5906" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Synchronous</ns0:text>
  <ns0:text x="209.5906" y="212.2105" text-anchor="middle" font-size="19.961">1 thread per connection</ns0:text>
  <ns0:text x="209.5906" y="256" text-anchor="middle" font-size="19.961">Blocks on I/O (idle CPU)</ns0:text>
  <ns0:text x="209.5906" y="299.7895" text-anchor="middle" font-size="19.961">10K threads = high overhead</ns0:text>
  <ns0:rect x="429.1618" y="101.0526" width="339.3373" height="218.9474" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="598.8304" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Async (Rust)</ns0:text>
  <ns0:text x="598.8304" y="212.2105" text-anchor="middle" font-size="19.961">Many tasks on few threads</ns0:text>
  <ns0:text x="598.8304" y="256" text-anchor="middle" font-size="19.961">Yields on .await (no block)</ns0:text>
  <ns0:text x="598.8304" y="299.7895" text-anchor="middle" font-size="19.961">100K+ tasks, low overhead</ns0:text>
  <ns0:rect x="818.4016" y="101.0526" width="339.3373" height="218.9474" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="988.0702" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Tokio Runtime</ns0:text>
  <ns0:text x="988.0702" y="212.2105" text-anchor="middle" font-size="19.961">Executor: polls Futures</ns0:text>
  <ns0:text x="988.0702" y="256" text-anchor="middle" font-size="19.961">Reactor: watches I/O</ns0:text>
  <ns0:text x="988.0702" y="299.7895" text-anchor="middle" font-size="19.961">Work-stealing scheduler</ns0:text>
  <ns0:line x1="379.2592" y1="208.8421" x2="429.1618" y2="208.8421" stroke="#333" stroke-width="3.9922" marker-end="url(#arr_async)" />
  <ns0:line x1="768.499" y1="208.8421" x2="818.4016" y2="208.8421" stroke="#333" stroke-width="3.9922" marker-end="url(#arr_async)" />
  <ns0:rect x="99.8051" y="370.5263" width="998.0507" height="117.8947" fill="#fff3e0" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="598.8304" y="421.0526" text-anchor="middle" font-size="19.961" font-weight="bold">async fn -&gt; impl Future: compiler transforms to state machine</ns0:text>
  <ns0:text x="598.8304" y="468.2105" text-anchor="middle" font-size="19.961">Each .await is a yield point. No threads blocked. No callback hell.</ns0:text>
  <ns0:rect x="199.6101" y="538.9474" width="798.4405" height="101.0526" fill="#f3e5f5" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="598.8304" y="606.3158" text-anchor="middle" font-size="19.961">Use async for I/O-bound work; use threads for CPU-bound work</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_async" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Sync vs Async Execution Model</text>
  <rect x="39.9221" y="101.0526" width="339.3373" height="218.9474" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="209.5906" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Synchronous</text>
  <text x="209.5906" y="212.2105" text-anchor="middle" font-size="19.961">1 thread per connection</text>
  <text x="209.5906" y="256" text-anchor="middle" font-size="19.961">Blocks on I/O (idle CPU)</text>
  <text x="209.5906" y="299.7895" text-anchor="middle" font-size="19.961">10K threads = high overhead</text>
  <rect x="429.1618" y="101.0526" width="339.3373" height="218.9474" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Async (Rust)</text>
  <text x="598.8304" y="212.2105" text-anchor="middle" font-size="19.961">Many tasks on few threads</text>
  <text x="598.8304" y="256" text-anchor="middle" font-size="19.961">Yields on .await (no block)</text>
  <text x="598.8304" y="299.7895" text-anchor="middle" font-size="19.961">100K+ tasks, low overhead</text>
  <rect x="818.4016" y="101.0526" width="339.3373" height="218.9474" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="988.0702" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Tokio Runtime</text>
  <text x="988.0702" y="212.2105" text-anchor="middle" font-size="19.961">Executor: polls Futures</text>
  <text x="988.0702" y="256" text-anchor="middle" font-size="19.961">Reactor: watches I/O</text>
  <text x="988.0702" y="299.7895" text-anchor="middle" font-size="19.961">Work-stealing scheduler</text>
  <line x1="379.2592" y1="208.8421" x2="429.1618" y2="208.8421" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_async)" />
  <line x1="768.499" y1="208.8421" x2="818.4016" y2="208.8421" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_async)" />
  <rect x="99.8051" y="370.5263" width="998.0507" height="117.8947" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="421.0526" text-anchor="middle" font-size="19.961" font-weight="bold">async fn -&gt; impl Future: compiler transforms to state machine</text>
  <text x="598.8304" y="468.2105" text-anchor="middle" font-size="19.961">Each .await is a yield point. No threads blocked. No callback hell.</text>
  <rect x="199.6101" y="538.9474" width="798.4405" height="101.0526" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="606.3158" text-anchor="middle" font-size="19.961">Use async for I/O-bound work; use threads for CPU-bound work</text>
</svg>
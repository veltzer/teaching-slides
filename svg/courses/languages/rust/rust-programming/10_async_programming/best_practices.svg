<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="426.6667" y="18" width="426.6667" height="126" fill="#673ab7" stroke="#333" stroke-width="4.2667" rx="17.0667" />
  <text x="640" y="100.8" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Async Best Practices</text>
  <line x1="533.3333" y1="144" x2="256" y2="208.8" stroke="#333" stroke-width="4.2667" />
  <line x1="746.6667" y1="144" x2="1024" y2="208.8" stroke="#333" stroke-width="4.2667" />
  <line x1="533.3333" y1="144" x2="256" y2="450" stroke="#333" stroke-width="4.2667" />
  <line x1="746.6667" y1="144" x2="1024" y2="450" stroke="#333" stroke-width="4.2667" />
  <rect x="64" y="190.8" width="384" height="162" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="256" y="252" text-anchor="middle" font-size="21.3333" font-weight="bold">Never block in async</text>
  <text x="256" y="302.4" text-anchor="middle" font-size="21.3333">Use spawn_blocking() for</text>
  <text x="256" y="342" text-anchor="middle" font-size="21.3333">CPU-heavy or sync I/O work</text>
  <rect x="832" y="190.8" width="384" height="162" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="1024" y="252" text-anchor="middle" font-size="21.3333" font-weight="bold">Use select! wisely</text>
  <text x="1024" y="302.4" text-anchor="middle" font-size="21.3333">Race futures, cancel losers</text>
  <text x="1024" y="342" text-anchor="middle" font-size="21.3333">Great for timeouts</text>
  <rect x="64" y="432" width="384" height="162" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="256" y="493.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Bound concurrency</text>
  <text x="256" y="543.6" text-anchor="middle" font-size="21.3333">Use Semaphore or buffered</text>
  <text x="256" y="583.2" text-anchor="middle" font-size="21.3333">streams to limit parallelism</text>
  <rect x="832" y="432" width="384" height="162" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="1024" y="493.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Graceful shutdown</text>
  <text x="1024" y="543.6" text-anchor="middle" font-size="21.3333">Handle Ctrl+C signals</text>
  <text x="1024" y="583.2" text-anchor="middle" font-size="21.3333">Drain tasks before exit</text>
  <rect x="320" y="640.8" width="640" height="64.8" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="687.6" text-anchor="middle" font-size="21.3333">Keep async tasks small; use channels for coordination between tasks</text>
</svg>
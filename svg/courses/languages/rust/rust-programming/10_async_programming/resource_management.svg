    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr_res" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Async Resource Management</ns0:text>
  <ns0:rect x="39.9221" y="101.0526" width="339.3373" height="202.1053" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="209.5906" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Semaphore</ns0:text>
  <ns0:text x="209.5906" y="212.2105" text-anchor="middle" font-size="19.961">Limit concurrent access</ns0:text>
  <ns0:text x="209.5906" y="262.7368" text-anchor="middle" font-size="19.961">tokio::sync::Semaphore</ns0:text>
  <ns0:rect x="429.1618" y="101.0526" width="339.3373" height="202.1053" fill="#f3e5f5" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="598.8304" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">JoinSet</ns0:text>
  <ns0:text x="598.8304" y="212.2105" text-anchor="middle" font-size="19.961">Manage task groups</ns0:text>
  <ns0:text x="598.8304" y="262.7368" text-anchor="middle" font-size="19.961">Collect results, cancel all</ns0:text>
  <ns0:rect x="818.4016" y="101.0526" width="339.3373" height="202.1053" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="988.0702" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">CancellationToken</ns0:text>
  <ns0:text x="988.0702" y="212.2105" text-anchor="middle" font-size="19.961">Graceful shutdown signal</ns0:text>
  <ns0:text x="988.0702" y="262.7368" text-anchor="middle" font-size="19.961">tokio_util::sync</ns0:text>
  <ns0:rect x="39.9221" y="353.6842" width="538.9474" height="134.7368" fill="#fff3e0" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="309.3957" y="404.2105" text-anchor="middle" font-size="19.961" font-weight="bold">tokio::sync::Mutex (async-aware)</ns0:text>
  <ns0:text x="309.3957" y="454.7368" text-anchor="middle" font-size="19.961">Use when lock is held across .await points</ns0:text>
  <ns0:rect x="618.7914" y="353.6842" width="538.9474" height="134.7368" fill="#ffebee" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="888.2651" y="404.2105" text-anchor="middle" font-size="19.961" font-weight="bold">std::sync::Mutex (sync)</ns0:text>
  <ns0:text x="888.2651" y="454.7368" text-anchor="middle" font-size="19.961">Use for short critical sections without .await</ns0:text>
  <ns0:rect x="159.6881" y="538.9474" width="878.2846" height="101.0526" fill="#e3f2fd" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="598.8304" y="589.4737" text-anchor="middle" font-size="19.961">RAII still works: Drop runs when task completes or is cancelled</ns0:text>
  <ns0:text x="598.8304" y="633.2632" text-anchor="middle" font-size="19.961">Use timeout() to prevent tasks from running forever</ns0:text>
</ns0:svg>
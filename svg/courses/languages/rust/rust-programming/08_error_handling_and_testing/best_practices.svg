<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="417.7778" y="40" width="444.4445" height="106.2827" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="109.843" text-anchor="middle" font-size="23.9967" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Error &amp; Testing Tips</text>
  <line x1="528.8888" y1="146.2827" x2="239.9999" y2="200.9425" stroke="var(--text)" stroke-width="2"/>
  <line x1="751.1112" y1="146.2827" x2="1040.0001" y2="200.9425" stroke="var(--text)" stroke-width="2"/>
  <line x1="528.8888" y1="146.2827" x2="239.9999" y2="404.3979" stroke="var(--text)" stroke-width="2"/>
  <line x1="751.1112" y1="146.2827" x2="1040.0001" y2="404.3979" stroke="var(--text)" stroke-width="2"/>
  <rect x="40" y="185.7592" width="400" height="136.6492" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="239.9999" y="237.3822" text-anchor="middle" font-size="19.9971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Use ? over unwrap()</text>
  <text x="239.9999" y="279.8953" text-anchor="middle" font-size="19.9971" font-family="Arial, sans-serif" fill="var(--primary-text)">Reserve .unwrap() for tests</text>
  <text x="239.9999" y="313.2985" text-anchor="middle" font-size="19.9971" font-family="Arial, sans-serif" fill="var(--primary-text)">and prototypes only</text>
  <rect x="840" y="185.7592" width="400" height="136.6492" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1040.0001" y="237.3822" text-anchor="middle" font-size="19.9971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Custom error types</text>
  <text x="1040.0001" y="279.8953" text-anchor="middle" font-size="19.9971" font-family="Arial, sans-serif" fill="var(--info-text)">enum AppError with From</text>
  <text x="1040.0001" y="313.2985" text-anchor="middle" font-size="19.9971" font-family="Arial, sans-serif" fill="var(--info-text)">impls for conversion</text>
  <rect x="40" y="389.2146" width="400" height="136.6492" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="239.9999" y="440.8377" text-anchor="middle" font-size="19.9971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Test edge cases</text>
  <text x="239.9999" y="483.3508" text-anchor="middle" font-size="19.9971" font-family="Arial, sans-serif" fill="var(--ok-text)">#[should_panic] for panics</text>
  <text x="239.9999" y="516.7539" text-anchor="middle" font-size="19.9971" font-family="Arial, sans-serif" fill="var(--ok-text)">Result returns in #[test]</text>
  <rect x="840" y="389.2146" width="400" height="136.6492" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1040.0001" y="440.8377" text-anchor="middle" font-size="19.9971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Organize tests</text>
  <text x="1040.0001" y="483.3508" text-anchor="middle" font-size="19.9971" font-family="Arial, sans-serif" fill="var(--warn-text)">Unit: #[cfg(test)] mod</text>
  <text x="1040.0001" y="516.7539" text-anchor="middle" font-size="19.9971" font-family="Arial, sans-serif" fill="var(--warn-text)">Integration: tests/ dir</text>
  <rect x="306.6666" y="565.3403" width="666.6667" height="54.6597" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="604.8168" text-anchor="middle" font-size="19.9971" font-family="Arial, sans-serif" fill="var(--danger-text)">Use anyhow/thiserror crates for ergonomic error handling</text>
</svg>

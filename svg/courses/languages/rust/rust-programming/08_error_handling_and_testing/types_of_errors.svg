<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr_err" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Rust Error Handling: Two Categories</text>
  <rect x="42.6667" y="108" width="384" height="252" fill="#ffebee" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="234.6667" y="172.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Unrecoverable</text>
  <text x="234.6667" y="226.8" text-anchor="middle" font-size="21.3333">panic!("msg")</text>
  <text x="234.6667" y="280.8" text-anchor="middle" font-size="21.3333">Unwinds stack or aborts</text>
  <text x="234.6667" y="327.6" text-anchor="middle" font-size="21.3333">Bugs, invariant violations</text>
  <rect x="448" y="108" width="384" height="252" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="172.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Recoverable</text>
  <text x="640" y="226.8" text-anchor="middle" font-size="21.3333">Result&lt;T, E&gt;</text>
  <text x="640" y="280.8" text-anchor="middle" font-size="21.3333">Ok(value) | Err(error)</text>
  <text x="640" y="327.6" text-anchor="middle" font-size="21.3333">File not found, parse fail</text>
  <rect x="853.3333" y="108" width="384" height="252" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1045.3333" y="172.8" text-anchor="middle" font-size="23.4667" font-weight="bold">Absence</text>
  <text x="1045.3333" y="226.8" text-anchor="middle" font-size="21.3333">Option&lt;T&gt;</text>
  <text x="1045.3333" y="280.8" text-anchor="middle" font-size="21.3333">Some(value) | None</text>
  <text x="1045.3333" y="327.6" text-anchor="middle" font-size="21.3333">No null pointers</text>
  <line x1="426.6667" y1="234" x2="448" y2="234" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_err)" />
  <line x1="832" y1="234" x2="853.3333" y2="234" stroke="#333" stroke-width="4.2667" marker-end="url(#arr_err)" />
  <rect x="42.6667" y="414" width="1194.6667" height="126" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="468" text-anchor="middle" font-size="21.3333" font-weight="bold">The ? Operator: Propagate errors concisely</text>
  <text x="640" y="518.4" text-anchor="middle" font-size="21.3333">File::open("f.txt")?.read_to_string(&amp;mut s)? -- returns Err early if failure</text>
  <rect x="213.3333" y="594" width="853.3333" height="90" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="655.2" text-anchor="middle" font-size="21.3333">No exceptions -- errors are values you must handle or propagate</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:marker id="arr_err" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Rust Error Handling: Two Categories</ns0:text>
  <ns0:rect x="39.9221" y="101.0526" width="359.2982" height="235.7895" fill="#ffebee" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="219.5712" y="161.6842" text-anchor="middle" font-size="21.9571" font-weight="bold">Unrecoverable</ns0:text>
  <ns0:text x="219.5712" y="212.2105" text-anchor="middle" font-size="19.961">panic!("msg")</ns0:text>
  <ns0:text x="219.5712" y="262.7368" text-anchor="middle" font-size="19.961">Unwinds stack or aborts</ns0:text>
  <ns0:text x="219.5712" y="306.5263" text-anchor="middle" font-size="19.961">Bugs, invariant violations</ns0:text>
  <ns0:rect x="419.1813" y="101.0526" width="359.2982" height="235.7895" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="598.8304" y="161.6842" text-anchor="middle" font-size="21.9571" font-weight="bold">Recoverable</ns0:text>
  <ns0:text x="598.8304" y="212.2105" text-anchor="middle" font-size="19.961">Result&lt;T, E&gt;</ns0:text>
  <ns0:text x="598.8304" y="262.7368" text-anchor="middle" font-size="19.961">Ok(value) | Err(error)</ns0:text>
  <ns0:text x="598.8304" y="306.5263" text-anchor="middle" font-size="19.961">File not found, parse fail</ns0:text>
  <ns0:rect x="798.4405" y="101.0526" width="359.2982" height="235.7895" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="978.0896" y="161.6842" text-anchor="middle" font-size="21.9571" font-weight="bold">Absence</ns0:text>
  <ns0:text x="978.0896" y="212.2105" text-anchor="middle" font-size="19.961">Option&lt;T&gt;</ns0:text>
  <ns0:text x="978.0896" y="262.7368" text-anchor="middle" font-size="19.961">Some(value) | None</ns0:text>
  <ns0:text x="978.0896" y="306.5263" text-anchor="middle" font-size="19.961">No null pointers</ns0:text>
  <ns0:line x1="399.2203" y1="218.9474" x2="419.1813" y2="218.9474" stroke="#333" stroke-width="3.9922" marker-end="url(#arr_err)" />
  <ns0:line x1="778.4795" y1="218.9474" x2="798.4405" y2="218.9474" stroke="#333" stroke-width="3.9922" marker-end="url(#arr_err)" />
  <ns0:rect x="39.9221" y="387.3684" width="1117.8168" height="117.8947" fill="#fff3e0" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="598.8304" y="437.8947" text-anchor="middle" font-size="19.961" font-weight="bold">The ? Operator: Propagate errors concisely</ns0:text>
  <ns0:text x="598.8304" y="485.0526" text-anchor="middle" font-size="19.961">File::open("f.txt")?.read_to_string(&amp;mut s)? -- returns Err early if failure</ns0:text>
  <ns0:rect x="199.6101" y="555.7895" width="798.4405" height="84.2105" fill="#f3e5f5" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="598.8304" y="613.0526" text-anchor="middle" font-size="19.961">No exceptions -- errors are values you must handle or propagate</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="364.2857" height="255.8824" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.1429" y="108.2353" text-anchor="middle" font-size="24.9773" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Tuple</text>
  <text x="222.1429" y="166.2353" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">(i32, f64, bool)</text>
  <text x="222.1429" y="220.8235" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">Fixed size, mixed types</text>
  <text x="222.1429" y="268.5883" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">Access: tup.0, tup.1</text>
  <rect x="457.8572" y="40" width="364.2857" height="255.8824" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="108.2353" text-anchor="middle" font-size="24.9773" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Array</text>
  <text x="639.9999" y="166.2353" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">[i32; 5]</text>
  <text x="639.9999" y="220.8235" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">Fixed size, same type</text>
  <text x="639.9999" y="268.5883" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">Stack allocated</text>
  <rect x="875.7143" y="40" width="364.2857" height="255.8824" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1057.8571" y="108.2353" text-anchor="middle" font-size="24.9773" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Struct</text>
  <text x="1057.8571" y="166.2353" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--ok-text)">struct Point { x: f64 }</text>
  <text x="1057.8571" y="220.8235" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--ok-text)">Named fields</text>
  <text x="1057.8571" y="268.5883" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--ok-text)">Custom types</text>
  <rect x="40" y="364.1176" width="1200" height="255.8824" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="432.3529" text-anchor="middle" font-size="22.8959" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Memory Layout</text>
  <rect x="82.8571" y="466.4706" width="85.7143" height="102.353" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="168.5714" y="466.4706" width="85.7143" height="102.353" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="254.2857" y="466.4706" width="85.7143" height="102.353" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="125.7143" y="534.7059" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">i32</text>
  <text x="211.4286" y="534.7059" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">f64</text>
  <text x="297.1428" y="534.7059" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--primary-text)">bool</text>
  <text x="254.2857" y="602.9412" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--warn-text)">Tuple: contiguous in memory</text>
  <rect x="532.8571" y="466.4706" width="64.2857" height="102.353" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="597.1428" y="466.4706" width="64.2857" height="102.353" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="661.4285" y="466.4706" width="64.2857" height="102.353" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="725.7142" y="466.4706" width="64.2857" height="102.353" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="789.9999" y="466.4706" width="64.2857" height="102.353" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="564.9999" y="534.7059" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">[0]</text>
  <text x="629.2856" y="534.7059" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">[1]</text>
  <text x="693.5713" y="534.7059" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">[2]</text>
  <text x="757.857" y="534.7059" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">[3]</text>
  <text x="822.1427" y="534.7059" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--info-text)">[4]</text>
  <text x="693.5713" y="602.9412" text-anchor="middle" font-size="20.8144" font-family="Arial, sans-serif" fill="var(--warn-text)">Array: same-type, contiguous</text>
</svg>

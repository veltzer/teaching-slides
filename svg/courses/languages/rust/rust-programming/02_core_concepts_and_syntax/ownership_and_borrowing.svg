<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-3.5556%" y="-7.1111%" width="96%" height="110.2222%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow-accent" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:marker id="arrow-red" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#c62828" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="17.7778" width="515.5556" height="266.6667" rx="7.1111" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7778" />
  <ns0:text x="284.4444" y="46.2222" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#1565c0">Ownership</ns0:text>
  <ns0:rect x="44.4444" y="62.2222" width="480" height="88.8889" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="284.4444" y="85.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#212121">Move semantics</ns0:text>
  <ns0:text x="62.2222" y="104.8889" font-family="monospace" font-size="13.3333" fill="#212121">let s1 = String::from("hello");</ns0:text>
  <ns0:text x="62.2222" y="124.4444" font-family="monospace" font-size="13.3333" fill="#212121">let s2 = s1;  // s1 moved to s2</ns0:text>
  <ns0:text x="62.2222" y="142.2222" font-family="monospace" font-size="13.3333" fill="#c62828">// s1 is no longer valid here!</ns0:text>
  <ns0:rect x="44.4444" y="163.5556" width="213.3333" height="103.1111" rx="3.5556" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="151.1111" y="183.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#555555">Stack: s1 (ptr/len/cap)</ns0:text>
  <ns0:text x="151.1111" y="202.6667" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="#c62828">→ INVALID after move</ns0:text>
  <ns0:rect x="275.5556" y="163.5556" width="213.3333" height="103.1111" rx="3.5556" fill="#f2f2f2" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="382.2222" y="183.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#555555">Stack: s2 (ptr/len/cap)</ns0:text>
  <ns0:text x="382.2222" y="202.6667" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="#1565c0">→ owns heap data</ns0:text>
  <ns0:text x="382.2222" y="231.1111" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="#555555">Heap: "hello"</ns0:text>
  <ns0:text x="382.2222" y="250.6667" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="#9e9e9e">freed when s2 drops</ns0:text>
  <ns0:line x1="151.1111" y1="202.6667" x2="275.5556" y2="202.6667" stroke="#c62828" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-red)" />
  <ns0:rect x="586.6667" y="17.7778" width="524.4444" height="266.6667" rx="7.1111" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7778" />
  <ns0:text x="848.8889" y="46.2222" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#2e7d32">Borrowing (&amp;)</ns0:text>
  <ns0:rect x="604.4444" y="62.2222" width="488.8889" height="80" rx="5.3333" fill="url(#grad-surface)" stroke="#2e7d32" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="848.8889" y="85.3333" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#2e7d32">Immutable borrow — many readers OK</ns0:text>
  <ns0:text x="622.2222" y="106.6667" font-family="monospace" font-size="12.4444" fill="#212121">let s1 = String::from("hello");</ns0:text>
  <ns0:text x="622.2222" y="126.2222" font-family="monospace" font-size="12.4444" fill="#2e7d32">let r1 = &amp;s1;  let r2 = &amp;s1;  // OK</ns0:text>
  <ns0:rect x="604.4444" y="154.6667" width="488.8889" height="80" rx="5.3333" fill="url(#grad-surface)" stroke="#e65100" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="848.8889" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#e65100">Mutable borrow — exactly one writer</ns0:text>
  <ns0:text x="622.2222" y="199.1111" font-family="monospace" font-size="12.4444" fill="#212121">let mut s = String::from("hello");</ns0:text>
  <ns0:text x="622.2222" y="218.6667" font-family="monospace" font-size="12.4444" fill="#e65100">let r = &amp;mut s;  // only one &amp;mut allowed</ns0:text>
  <ns0:rect x="26.6667" y="304" width="1084.4444" height="177.7778" rx="7.1111" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="330.6667" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Borrow Checker Rules</ns0:text>
  <ns0:rect x="44.4444" y="343.1111" width="302.2222" height="115.5556" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="195.5556" y="366.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#ffffff">Rule 1: Single owner</ns0:text>
  <ns0:text x="62.2222" y="387.5556" font-family="sans-serif" font-size="12.4444" fill="#bbdefb">Each value has exactly</ns0:text>
  <ns0:text x="62.2222" y="407.1111" font-family="sans-serif" font-size="12.4444" fill="#bbdefb">one owner at a time.</ns0:text>
  <ns0:text x="62.2222" y="426.6667" font-family="sans-serif" font-size="12.4444" fill="#bbdefb">When owner drops → value freed.</ns0:text>
  <ns0:text x="62.2222" y="446.2222" font-family="sans-serif" font-size="12.4444" fill="#90caf9">No double-free, no leaks.</ns0:text>
  <ns0:rect x="382.2222" y="343.1111" width="302.2222" height="115.5556" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="533.3333" y="366.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#212121">Rule 2: Borrows</ns0:text>
  <ns0:text x="400" y="387.5556" font-family="sans-serif" font-size="12.4444" fill="#555555">Either many &amp;T (read-only),</ns0:text>
  <ns0:text x="400" y="407.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">OR exactly one &amp;mut T,</ns0:text>
  <ns0:text x="400" y="426.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">never both at the same time.</ns0:text>
  <ns0:text x="400" y="446.2222" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">No data races — enforced at compile time.</ns0:text>
  <ns0:rect x="720" y="343.1111" width="373.3333" height="115.5556" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="906.6667" y="366.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#212121">Rule 3: Lifetimes</ns0:text>
  <ns0:text x="737.7778" y="387.5556" font-family="sans-serif" font-size="12.4444" fill="#555555">References must not outlive the</ns0:text>
  <ns0:text x="737.7778" y="407.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">data they point to.</ns0:text>
  <ns0:text x="737.7778" y="426.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">No dangling pointers.</ns0:text>
  <ns0:text x="737.7778" y="446.2222" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">Compiler tracks &amp; rejects violations.</ns0:text>
  <ns0:rect x="26.6667" y="497.7778" width="1084.4444" height="37.3333" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="520.8889" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#1565c0">These three rules eliminate entire classes of bugs: use-after-free, double-free, data races — at zero runtime cost</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="570.491853" height="298.969135" rx="6.83567" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.245822" y="71.890064" text-anchor="middle" font-size="19.801342" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Ownership</text>
  <rect x="59.672133" y="89.82821" width="531.147587" height="99.656419" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="325.245822" y="115.73881" text-anchor="middle" font-size="15.840982" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Move semantics</text>
  <text x="79.344266" y="137.663306" font-size="14.85095" fill="var(--text)" font-family="Courier New, monospace">let s1 = String::from("hello");</text>
  <text x="79.344266" y="159.587555" font-size="14.85095" fill="var(--text)" font-family="Courier New, monospace">let s2 = s1;  // s1 moved to s2</text>
  <text x="79.344266" y="179.518938" font-size="14.85095" fill="var(--danger-accent)" font-family="Courier New, monospace">// s1 is no longer valid here!</text>
  <rect x="59.672133" y="203.436548" width="236.065594" height="115.601328" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="177.70493" y="225.360797" text-anchor="middle" font-size="12.870884" fill="var(--text-muted)" font-family="Arial, sans-serif">Stack: s1 (ptr/len/cap)</text>
  <text x="177.70493" y="247.285293" text-anchor="middle" font-size="12.870884" fill="var(--danger-accent)" font-family="Courier New, monospace">→ INVALID after move</text>
  <rect x="315.40986" y="203.436548" width="236.065594" height="115.601328" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="433.442657" y="225.360797" text-anchor="middle" font-size="12.870884" fill="var(--text-muted)" font-family="Arial, sans-serif">Stack: s2 (ptr/len/cap)</text>
  <text x="433.442657" y="247.285293" text-anchor="middle" font-size="12.870884" fill="var(--primary-accent)" font-family="Courier New, monospace">→ owns heap data</text>
  <text x="433.442657" y="279.175233" text-anchor="middle" font-size="11.880851" fill="var(--text-muted)" font-family="Arial, sans-serif">Heap: "hello"</text>
  <text x="433.442657" y="301.09973" text-anchor="middle" font-size="11.880851" fill="var(--text-faint)" font-family="Arial, sans-serif">freed when s2 drops</text>
  <line x1="177.70493" y1="247.285293" x2="315.40986" y2="247.285293" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-danger)" />
  <rect x="659.672185" y="40" width="580.327815" height="298.969135" rx="6.83567" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.836145" y="71.890064" text-anchor="middle" font-size="19.801342" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Borrowing (&amp;)</text>
  <rect x="679.344213" y="89.82821" width="540.983654" height="89.690728" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="949.836145" y="115.73881" text-anchor="middle" font-size="14.85095" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Immutable borrow — many readers OK</text>
  <text x="699.016451" y="139.656419" font-size="13.860803" fill="var(--text)" font-family="Courier New, monospace">let s1 = String::from("hello");</text>
  <text x="699.016451" y="161.580792" font-size="13.860803" fill="var(--ok-accent)" font-family="Courier New, monospace">let r1 = &amp;s1;  let r2 = &amp;s1;  // OK</text>
  <rect x="679.344213" y="193.470856" width="540.983654" height="89.690728" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="949.836145" y="219.381456" text-anchor="middle" font-size="14.85095" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Mutable borrow — exactly one writer</text>
  <text x="699.016451" y="243.298942" font-size="13.860803" fill="var(--text)" font-family="Courier New, monospace">let mut s = String::from("hello");</text>
  <text x="699.016451" y="265.223439" font-size="13.860803" fill="var(--warn-accent)" font-family="Courier New, monospace">let r = &amp;mut s;  // only one &amp;mut allowed</text>
  <rect x="40" y="360.893507" width="1200" height="199.312715" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.000052" y="390.790458" text-anchor="middle" font-size="17.821162" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Borrow Checker Rules</text>
  <rect x="59.672133" y="404.742253" width="334.426259" height="129.55337" rx="6.83567" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.885262" y="430.652976" text-anchor="middle" font-size="14.85095" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Rule 1: Single owner</text>
  <text x="79.344266" y="454.570586" font-size="13.860803" fill="var(--primary-accent)" font-family="Arial, sans-serif">Each value has exactly</text>
  <text x="79.344266" y="476.494835" font-size="13.860803" fill="var(--primary-accent)" font-family="Arial, sans-serif">one owner at a time.</text>
  <text x="79.344266" y="498.419332" font-size="13.860803" fill="var(--primary-accent)" font-family="Arial, sans-serif">When owner drops → value freed.</text>
  <text x="79.344266" y="520.343704" font-size="13.860803" fill="var(--primary-accent)" font-family="Arial, sans-serif">No double-free, no leaks.</text>
  <rect x="433.442657" y="404.742253" width="334.426259" height="129.55337" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="600.655787" y="430.652976" text-anchor="middle" font-size="14.85095" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Rule 2: Borrows</text>
  <text x="453.11479" y="454.570586" font-size="13.860803" fill="var(--text-muted)" font-family="Arial, sans-serif">Either many &amp;T (read-only),</text>
  <text x="453.11479" y="476.494835" font-size="13.860803" fill="var(--text-muted)" font-family="Arial, sans-serif">OR exactly one &amp;mut T,</text>
  <text x="453.11479" y="498.419332" font-size="13.860803" fill="var(--text-muted)" font-family="Arial, sans-serif">never both at the same time.</text>
  <text x="453.11479" y="520.343704" font-size="13.860803" fill="var(--text-faint)" font-family="Arial, sans-serif">No data races — enforced at compile time.</text>
  <rect x="807.213182" y="404.742253" width="413.11479" height="129.55337" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1013.770577" y="430.652976" text-anchor="middle" font-size="14.85095" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Rule 3: Lifetimes</text>
  <text x="826.885315" y="454.570586" font-size="13.860803" fill="var(--text-muted)" font-family="Arial, sans-serif">References must not outlive the</text>
  <text x="826.885315" y="476.494835" font-size="13.860803" fill="var(--text-muted)" font-family="Arial, sans-serif">data they point to.</text>
  <text x="826.885315" y="498.419332" font-size="13.860803" fill="var(--text-muted)" font-family="Arial, sans-serif">No dangling pointers.</text>
  <text x="826.885315" y="520.343704" font-size="13.860803" fill="var(--text-faint)" font-family="Arial, sans-serif">Compiler tracks &amp; rejects violations.</text>
  <rect x="40" y="578.144368" width="1200" height="41.855632" rx="6.83567" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000052" y="604.055092" text-anchor="middle" font-size="15.840982" fill="var(--primary-accent)" font-family="Arial, sans-serif">These three rules eliminate entire classes of bugs: use-after-free, double-free, data races — at zero runtime cost</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="17.7778" width="515.5556" height="266.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="284.4444" y="46.2222" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">Ownership</text>
  <rect x="44.4444" y="62.2222" width="480" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="284.4444" y="85.3333" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">Move semantics</text>
  <text x="62.2222" y="104.8889" font-family="monospace" font-size="13.3333" fill="var(--text)">let s1 = String::from("hello");</text>
  <text x="62.2222" y="124.4444" font-family="monospace" font-size="13.3333" fill="var(--text)">let s2 = s1;  // s1 moved to s2</text>
  <text x="62.2222" y="142.2222" font-family="monospace" font-size="13.3333" fill="var(--danger-accent)">// s1 is no longer valid here!</text>
  <rect x="44.4444" y="163.5556" width="213.3333" height="103.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="151.1111" y="183.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">Stack: s1 (ptr/len/cap)</text>
  <text x="151.1111" y="202.6667" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--danger-accent)">→ INVALID after move</text>
  <rect x="275.5556" y="163.5556" width="213.3333" height="103.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="382.2222" y="183.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">Stack: s2 (ptr/len/cap)</text>
  <text x="382.2222" y="202.6667" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">→ owns heap data</text>
  <text x="382.2222" y="231.1111" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="var(--text-muted)">Heap: "hello"</text>
  <text x="382.2222" y="250.6667" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="var(--text-faint)">freed when s2 drops</text>
  <line x1="151.1111" y1="202.6667" x2="275.5556" y2="202.6667" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-danger)" />
  <rect x="586.6667" y="17.7778" width="524.4444" height="266.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="848.8889" y="46.2222" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">Borrowing (&amp;)</text>
  <rect x="604.4444" y="62.2222" width="488.8889" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="848.8889" y="85.3333" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--ok-accent)">Immutable borrow — many readers OK</text>
  <text x="622.2222" y="106.6667" font-family="monospace" font-size="12.4444" fill="var(--text)">let s1 = String::from("hello");</text>
  <text x="622.2222" y="126.2222" font-family="monospace" font-size="12.4444" fill="var(--ok-accent)">let r1 = &amp;s1;  let r2 = &amp;s1;  // OK</text>
  <rect x="604.4444" y="154.6667" width="488.8889" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="848.8889" y="177.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--warn-accent)">Mutable borrow — exactly one writer</text>
  <text x="622.2222" y="199.1111" font-family="monospace" font-size="12.4444" fill="var(--text)">let mut s = String::from("hello");</text>
  <text x="622.2222" y="218.6667" font-family="monospace" font-size="12.4444" fill="var(--warn-accent)">let r = &amp;mut s;  // only one &amp;mut allowed</text>
  <rect x="26.6667" y="304" width="1084.4444" height="177.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="330.6667" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Borrow Checker Rules</text>
  <rect x="44.4444" y="343.1111" width="302.2222" height="115.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="195.5556" y="366.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">Rule 1: Single owner</text>
  <text x="62.2222" y="387.5556" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">Each value has exactly</text>
  <text x="62.2222" y="407.1111" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">one owner at a time.</text>
  <text x="62.2222" y="426.6667" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">When owner drops → value freed.</text>
  <text x="62.2222" y="446.2222" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">No double-free, no leaks.</text>
  <rect x="382.2222" y="343.1111" width="302.2222" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="533.3333" y="366.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">Rule 2: Borrows</text>
  <text x="400" y="387.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Either many &amp;T (read-only),</text>
  <text x="400" y="407.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">OR exactly one &amp;mut T,</text>
  <text x="400" y="426.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">never both at the same time.</text>
  <text x="400" y="446.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">No data races — enforced at compile time.</text>
  <rect x="720" y="343.1111" width="373.3333" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="906.6667" y="366.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">Rule 3: Lifetimes</text>
  <text x="737.7778" y="387.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">References must not outlive the</text>
  <text x="737.7778" y="407.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">data they point to.</text>
  <text x="737.7778" y="426.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">No dangling pointers.</text>
  <text x="737.7778" y="446.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">Compiler tracks &amp; rejects violations.</text>
  <rect x="26.6667" y="497.7778" width="1084.4444" height="37.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="520.8889" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">These three rules eliminate entire classes of bugs: use-after-free, double-free, data races — at zero runtime cost</text>
</svg>
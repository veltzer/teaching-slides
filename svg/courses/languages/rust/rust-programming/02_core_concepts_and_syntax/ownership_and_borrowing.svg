<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="56.1111" width="543.75" height="241.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="339.9999" y="81.8889" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">Ownership</text>
  <rect x="86.875" y="96.3889" width="506.25" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="339.9999" y="117.3333" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text)">Move semantics</text>
  <text x="105.625" y="135.0556" font-family="monospace" font-size="13.0354" fill="var(--text)">let s1 = String::from("hello");</text>
  <text x="105.625" y="152.7777" font-family="monospace" font-size="13.0354" fill="var(--text)">let s2 = s1;  // s1 moved to s2</text>
  <text x="105.625" y="168.8889" font-family="monospace" font-size="13.0354" fill="var(--danger-accent)">// s1 is no longer valid here!</text>
  <rect x="86.875" y="188.2223" width="225" height="93.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="199.375" y="205.9444" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Stack: s1 (ptr/len/cap)</text>
  <text x="199.375" y="223.6667" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--danger-accent)">→ INVALID after move</text>
  <rect x="330.625" y="188.2223" width="225" height="93.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="443.125" y="205.9444" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Stack: s2 (ptr/len/cap)</text>
  <text x="443.125" y="223.6667" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">→ owns heap data</text>
  <text x="443.125" y="249.4444" text-anchor="middle" font-family="sans-serif" font-size="10.4284" fill="var(--text-muted)">Heap: "hello"</text>
  <text x="443.125" y="267.1667" text-anchor="middle" font-family="sans-serif" font-size="10.4284" fill="var(--text-faint)">freed when s2 drops</text>
  <line x1="199.375" y1="223.6667" x2="330.625" y2="223.6667" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-danger)" />
  <rect x="658.75" y="56.1111" width="553.1249" height="241.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="935.3125" y="81.8889" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">Borrowing (&amp;)</text>
  <rect x="677.4999" y="96.3889" width="515.625" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="935.3125" y="117.3333" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--ok-accent)">Immutable borrow — many readers OK</text>
  <text x="696.25" y="136.6667" font-family="monospace" font-size="12.1663" fill="var(--text)">let s1 = String::from("hello");</text>
  <text x="696.25" y="154.3889" font-family="monospace" font-size="12.1663" fill="var(--ok-accent)">let r1 = &amp;s1;  let r2 = &amp;s1;  // OK</text>
  <rect x="677.4999" y="180.1667" width="515.625" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="935.3125" y="201.1111" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--warn-accent)">Mutable borrow — exactly one writer</text>
  <text x="696.25" y="220.4444" font-family="monospace" font-size="12.1663" fill="var(--text)">let mut s = String::from("hello");</text>
  <text x="696.25" y="238.1667" font-family="monospace" font-size="12.1663" fill="var(--warn-accent)">let r = &amp;mut s;  // only one &amp;mut allowed</text>
  <rect x="68.125" y="315.5" width="1143.7499" height="161.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="339.6667" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Borrow Checker Rules</text>
  <rect x="86.875" y="350.9444" width="318.75" height="104.7223" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="246.25" y="371.8889" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)">Rule 1: Single owner</text>
  <text x="105.625" y="391.2223" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">Each value has exactly</text>
  <text x="105.625" y="408.9444" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">one owner at a time.</text>
  <text x="105.625" y="426.6667" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">When owner drops → value freed.</text>
  <text x="105.625" y="444.3889" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">No double-free, no leaks.</text>
  <rect x="443.125" y="350.9444" width="318.75" height="104.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="602.5" y="371.8889" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--text)">Rule 2: Borrows</text>
  <text x="461.875" y="391.2223" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">Either many &amp;T (read-only),</text>
  <text x="461.875" y="408.9444" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">OR exactly one &amp;mut T,</text>
  <text x="461.875" y="426.6667" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">never both at the same time.</text>
  <text x="461.875" y="444.3889" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">No data races — enforced at compile time.</text>
  <rect x="799.375" y="350.9444" width="393.75" height="104.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="996.25" y="371.8889" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--text)">Rule 3: Lifetimes</text>
  <text x="818.125" y="391.2223" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">References must not outlive the</text>
  <text x="818.125" y="408.9444" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">data they point to.</text>
  <text x="818.125" y="426.6667" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">No dangling pointers.</text>
  <text x="818.125" y="444.3889" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">Compiler tracks &amp; rejects violations.</text>
  <rect x="68.125" y="491.1111" width="1143.7499" height="33.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="512.0556" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">These three rules eliminate entire classes of bugs: use-after-free, double-free, data races — at zero runtime cost</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
  </defs>
  <rect x="40" y="40" width="570.491853" height="298.969135" rx="6.83567" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="325.245822" y="71.890064" text-anchor="middle" font-family="sans-serif" font-size="19.801342" font-weight="bold" fill="var(--primary-accent)">Ownership</text>
  <rect x="59.672133" y="89.82821" width="531.147587" height="99.656419" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="325.245822" y="115.73881" text-anchor="middle" font-family="sans-serif" font-size="15.840982" font-weight="bold" fill="var(--text)">Move semantics</text>
  <text x="79.344266" y="137.663306" font-family="monospace" font-size="14.85095" fill="var(--text)">let s1 = String::from("hello");</text>
  <text x="79.344266" y="159.587555" font-family="monospace" font-size="14.85095" fill="var(--text)">let s2 = s1;  // s1 moved to s2</text>
  <text x="79.344266" y="179.518938" font-family="monospace" font-size="14.85095" fill="var(--danger-accent)">// s1 is no longer valid here!</text>
  <rect x="59.672133" y="203.436548" width="236.065594" height="115.601328" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="177.70493" y="225.360797" text-anchor="middle" font-family="sans-serif" font-size="12.870884" fill="var(--text-muted)">Stack: s1 (ptr/len/cap)</text>
  <text x="177.70493" y="247.285293" text-anchor="middle" font-family="monospace" font-size="12.870884" fill="var(--danger-accent)">→ INVALID after move</text>
  <rect x="315.40986" y="203.436548" width="236.065594" height="115.601328" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="433.442657" y="225.360797" text-anchor="middle" font-family="sans-serif" font-size="12.870884" fill="var(--text-muted)">Stack: s2 (ptr/len/cap)</text>
  <text x="433.442657" y="247.285293" text-anchor="middle" font-family="monospace" font-size="12.870884" fill="var(--primary-accent)">→ owns heap data</text>
  <text x="433.442657" y="279.175233" text-anchor="middle" font-family="sans-serif" font-size="11.880851" fill="var(--text-muted)">Heap: "hello"</text>
  <text x="433.442657" y="301.09973" text-anchor="middle" font-family="sans-serif" font-size="11.880851" fill="var(--text-faint)">freed when s2 drops</text>
  <line x1="177.70493" y1="247.285293" x2="315.40986" y2="247.285293" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-danger)" />
  <rect x="659.672185" y="40" width="580.327815" height="298.969135" rx="6.83567" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="949.836145" y="71.890064" text-anchor="middle" font-family="sans-serif" font-size="19.801342" font-weight="bold" fill="var(--ok-accent)">Borrowing (&amp;)</text>
  <rect x="679.344213" y="89.82821" width="540.983654" height="89.690728" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="949.836145" y="115.73881" text-anchor="middle" font-family="sans-serif" font-size="14.85095" font-weight="bold" fill="var(--ok-accent)">Immutable borrow — many readers OK</text>
  <text x="699.016451" y="139.656419" font-family="monospace" font-size="13.860803" fill="var(--text)">let s1 = String::from("hello");</text>
  <text x="699.016451" y="161.580792" font-family="monospace" font-size="13.860803" fill="var(--ok-accent)">let r1 = &amp;s1;  let r2 = &amp;s1;  // OK</text>
  <rect x="679.344213" y="193.470856" width="540.983654" height="89.690728" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="949.836145" y="219.381456" text-anchor="middle" font-family="sans-serif" font-size="14.85095" font-weight="bold" fill="var(--warn-accent)">Mutable borrow — exactly one writer</text>
  <text x="699.016451" y="243.298942" font-family="monospace" font-size="13.860803" fill="var(--text)">let mut s = String::from("hello");</text>
  <text x="699.016451" y="265.223439" font-family="monospace" font-size="13.860803" fill="var(--warn-accent)">let r = &amp;mut s;  // only one &amp;mut allowed</text>
  <rect x="40" y="360.893507" width="1200" height="199.312715" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.000052" y="390.790458" text-anchor="middle" font-family="sans-serif" font-size="17.821162" font-weight="bold" fill="var(--text)">Borrow Checker Rules</text>
  <rect x="59.672133" y="404.742253" width="334.426259" height="129.55337" rx="6.83567" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="226.885262" y="430.652976" text-anchor="middle" font-family="sans-serif" font-size="14.85095" font-weight="bold" fill="var(--bg)">Rule 1: Single owner</text>
  <text x="79.344266" y="454.570586" font-family="sans-serif" font-size="13.860803" fill="var(--primary-accent)">Each value has exactly</text>
  <text x="79.344266" y="476.494835" font-family="sans-serif" font-size="13.860803" fill="var(--primary-accent)">one owner at a time.</text>
  <text x="79.344266" y="498.419332" font-family="sans-serif" font-size="13.860803" fill="var(--primary-accent)">When owner drops → value freed.</text>
  <text x="79.344266" y="520.343704" font-family="sans-serif" font-size="13.860803" fill="var(--primary-accent)">No double-free, no leaks.</text>
  <rect x="433.442657" y="404.742253" width="334.426259" height="129.55337" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="600.655787" y="430.652976" text-anchor="middle" font-family="sans-serif" font-size="14.85095" font-weight="bold" fill="var(--text)">Rule 2: Borrows</text>
  <text x="453.11479" y="454.570586" font-family="sans-serif" font-size="13.860803" fill="var(--text-muted)">Either many &amp;T (read-only),</text>
  <text x="453.11479" y="476.494835" font-family="sans-serif" font-size="13.860803" fill="var(--text-muted)">OR exactly one &amp;mut T,</text>
  <text x="453.11479" y="498.419332" font-family="sans-serif" font-size="13.860803" fill="var(--text-muted)">never both at the same time.</text>
  <text x="453.11479" y="520.343704" font-family="sans-serif" font-size="13.860803" fill="var(--text-faint)">No data races — enforced at compile time.</text>
  <rect x="807.213182" y="404.742253" width="413.11479" height="129.55337" rx="6.83567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1013.770577" y="430.652976" text-anchor="middle" font-family="sans-serif" font-size="14.85095" font-weight="bold" fill="var(--text)">Rule 3: Lifetimes</text>
  <text x="826.885315" y="454.570586" font-family="sans-serif" font-size="13.860803" fill="var(--text-muted)">References must not outlive the</text>
  <text x="826.885315" y="476.494835" font-family="sans-serif" font-size="13.860803" fill="var(--text-muted)">data they point to.</text>
  <text x="826.885315" y="498.419332" font-family="sans-serif" font-size="13.860803" fill="var(--text-muted)">No dangling pointers.</text>
  <text x="826.885315" y="520.343704" font-family="sans-serif" font-size="13.860803" fill="var(--text-faint)">Compiler tracks &amp; rejects violations.</text>
  <rect x="40" y="578.144368" width="1200" height="41.855632" rx="6.83567" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.000052" y="604.055092" text-anchor="middle" font-family="sans-serif" font-size="15.840982" fill="var(--primary-accent)">These three rules eliminate entire classes of bugs: use-after-free, double-free, data races — at zero runtime cost</text>
</svg>
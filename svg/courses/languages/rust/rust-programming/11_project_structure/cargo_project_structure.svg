<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="447.1428" y="40" width="342.8571" height="126.875" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="618.5715" y="123.375" text-anchor="middle" font-size="25.746" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Workspace</text>
  <rect x="82.8572" y="275.625" width="278.5714" height="126.875" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.1428" y="355.375" text-anchor="middle" font-size="23.6005" font-family="Arial, sans-serif" fill="var(--info-text)">crate: app</text>
  <rect x="479.2857" y="275.625" width="278.5714" height="126.875" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="618.5715" y="355.375" text-anchor="middle" font-size="23.6005" font-family="Arial, sans-serif" fill="var(--info-text)">crate: core</text>
  <rect x="875.7143" y="275.625" width="278.5714" height="126.875" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1015.0001" y="355.375" text-anchor="middle" font-size="23.6005" font-family="Arial, sans-serif" fill="var(--info-text)">crate: utils</text>
  <rect x="40" y="511.25" width="214.2857" height="108.75" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="147.1429" y="583.75" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--ok-text)">mod main</text>
  <rect x="286.4286" y="511.25" width="214.2857" height="108.75" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="393.5714" y="583.75" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--ok-text)">mod config</text>
  <rect x="532.8572" y="511.25" width="214.2857" height="108.75" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="583.75" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--ok-text)">mod lib</text>
  <rect x="779.2858" y="511.25" width="214.2857" height="108.75" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="886.4287" y="583.75" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--ok-text)">mod models</text>
  <rect x="1025.7143" y="511.25" width="214.2857" height="108.75" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1132.8572" y="583.75" text-anchor="middle" font-size="21.455" font-family="Arial, sans-serif" fill="var(--ok-text)">mod helpers</text>
  <line x1="532.8572" y1="166.875" x2="222.1428" y2="275.625" stroke="var(--text)" stroke-width="2"/>
  <line x1="618.5715" y1="166.875" x2="618.5715" y2="275.625" stroke="var(--text)" stroke-width="2"/>
  <line x1="704.2857" y1="166.875" x2="1015.0001" y2="275.625" stroke="var(--text)" stroke-width="2"/>
  <line x1="147.1429" y1="402.5" x2="147.1429" y2="511.25" stroke="var(--text)" stroke-width="2"/>
  <line x1="297.1429" y1="402.5" x2="393.5714" y2="511.25" stroke="var(--text)" stroke-width="2"/>
  <line x1="618.5715" y1="402.5" x2="640" y2="511.25" stroke="var(--text)" stroke-width="2"/>
  <line x1="875.7143" y1="402.5" x2="886.4287" y2="511.25" stroke="var(--text)" stroke-width="2"/>
  <line x1="1154.2857" y1="402.5" x2="1132.8572" y2="511.25" stroke="var(--text)" stroke-width="2"/>
</svg>

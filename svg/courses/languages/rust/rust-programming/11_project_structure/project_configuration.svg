  <rect x="606.0328" y="247.4227" width="254.1428" height="98.9691" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="733.1042" y="313.4021" text-anchor="middle" font-size="19.5494">[dev-dependencies]</text>
  <rect x="899.2745" y="247.4227" width="234.5934" height="98.9691" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1016.5712" y="313.4021" text-anchor="middle" font-size="19.5494">[features]</text>
  <rect x="273.6923" y="445.3608" width="195.4944" height="92.3711" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="371.4395" y="508.0412" text-anchor="middle" font-size="19.5494">serde 1.0</text>
  <rect x="508.2856" y="445.3608" width="195.4944" height="92.3711" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="606.0328" y="508.0412" text-anchor="middle" font-size="19.5494">tokio 1.0</text>
  <rect x="742.879" y="445.3608" width="215.0439" height="92.3711" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="850.4009" y="508.0412" text-anchor="middle" font-size="19.5494">pretty_assertions</text>
  <rect x="390.989" y="560.8247" width="175.945" height="79.1753" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="478.9615" y="616.9072" text-anchor="middle" font-size="19.5494">serde_json</text>
  <line x1="449.6373" y1="346.3918" x2="371.4395" y2="445.3608" stroke="var(--text)" stroke-width="2" />
  <line x1="449.6373" y1="346.3918" x2="606.0328" y2="445.3608" stroke="var(--text)" stroke-width="2" />
  <line x1="733.1042" y1="346.3918" x2="850.4009" y2="445.3608" stroke="var(--text)" stroke-width="2" />
  <line x1="371.4395" y1="537.732" x2="478.9615" y2="560.8247" stroke="var(--text)" stroke-width="1.9549" />
</svg>
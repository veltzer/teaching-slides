<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="410.9092" y="40" width="436.3637" height="110.3261" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.0909" y="112.5" text-anchor="middle" font-size="24.2255" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Cargo.toml</text>
  <rect x="40" y="244.8913" width="261.8182" height="94.5652" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="170.9091" y="307.9348" text-anchor="middle" font-size="20.1879" font-family="Arial, sans-serif" fill="var(--warn-text)">[package]</text>
  <rect x="345.4546" y="244.8913" width="261.8182" height="94.5652" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="476.3637" y="307.9348" text-anchor="middle" font-size="20.1879" font-family="Arial, sans-serif" fill="var(--info-text)">[dependencies]</text>
  <rect x="650.9091" y="244.8913" width="283.6363" height="94.5652" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="792.7272" y="307.9348" text-anchor="middle" font-size="20.1879" font-family="Arial, sans-serif" fill="var(--ok-text)">[dev-dependencies]</text>
  <rect x="978.1818" y="244.8913" width="261.8182" height="94.5652" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1109.0909" y="307.9348" text-anchor="middle" font-size="20.1879" font-family="Arial, sans-serif" fill="var(--danger-text)">[features]</text>
  <rect x="280.0001" y="434.0217" width="218.1817" height="88.2608" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="389.091" y="493.913" text-anchor="middle" font-size="20.1879" font-family="Arial, sans-serif" fill="var(--info-text)">serde 1.0</text>
  <rect x="541.8182" y="434.0217" width="218.1817" height="88.2608" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="650.9091" y="493.913" text-anchor="middle" font-size="20.1879" font-family="Arial, sans-serif" fill="var(--info-text)">tokio 1.0</text>
  <rect x="803.6364" y="434.0217" width="240" height="88.2608" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="923.6363" y="493.913" text-anchor="middle" font-size="20.1879" font-family="Arial, sans-serif" fill="var(--ok-text)">pretty_assertions</text>
  <rect x="410.9092" y="544.3478" width="196.3636" height="75.6522" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="509.091" y="597.9348" text-anchor="middle" font-size="20.1879" font-family="Arial, sans-serif" fill="var(--info-text)">serde_json</text>
  <line x1="476.3637" y1="339.4566" x2="389.091" y2="434.0217" stroke="var(--text)" stroke-width="2" />
  <line x1="476.3637" y1="339.4566" x2="650.9091" y2="434.0217" stroke="var(--text)" stroke-width="2" />
  <line x1="792.7272" y1="339.4566" x2="923.6363" y2="434.0217" stroke="var(--text)" stroke-width="2" />
  <line x1="389.091" y1="522.2826" x2="509.091" y2="544.3478" stroke="var(--text)" stroke-width="1.9549" />
</svg>
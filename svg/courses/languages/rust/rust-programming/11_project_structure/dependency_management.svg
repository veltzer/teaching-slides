<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowvis" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="268.9655" height="182.2858" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="174.4828" y="106.2857" text-anchor="middle" font-size="22.1739" font-weight="bold">crate root</text>
  <text x="174.4828" y="162.6286" text-anchor="middle" font-size="20.1581">(lib.rs)</text>
  <rect x="40" y="288.5714" width="248.2759" height="132.5714" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="164.138" y="371.4286" text-anchor="middle" font-size="20.1581">pub mod api</text>
  <rect x="40" y="487.4286" width="248.2759" height="132.5714" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="164.138" y="570.2857" text-anchor="middle" font-size="20.1581">mod internal</text>
  <rect x="433.1035" y="288.5714" width="248.2759" height="132.5714" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="557.2415" y="371.4286" text-anchor="middle" font-size="20.1581">pub fn serve()</text>
  <rect x="433.1035" y="487.4286" width="268.9655" height="132.5714" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="567.5862" y="570.2857" text-anchor="middle" font-size="20.1581">fn helper()</text>
  <rect x="846.8966" y="56.5714" width="393.1034" height="265.1429" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1043.4484" y="129.4857" text-anchor="middle" font-size="22.1739" font-weight="bold">Visibility Rules</text>
  <text x="1043.4484" y="189.1429" text-anchor="middle" font-size="20.1581" fill="var(--ok-accent)">pub = accessible outside</text>
  <text x="1043.4484" y="248.8" text-anchor="middle" font-size="20.1581" fill="var(--danger-accent)">no pub = private to module</text>
  <rect x="846.8966" y="388" width="393.1034" height="232" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1043.4484" y="460.9143" text-anchor="middle" font-size="20.1581">pub(crate) = crate only</text>
  <text x="1043.4484" y="520.5715" text-anchor="middle" font-size="20.1581">pub(super) = parent only</text>
  <text x="1043.4484" y="580.2285" text-anchor="middle" font-size="20.1581">pub(in path) = specific</text>
  <line x1="174.4828" y1="222.2858" x2="164.138" y2="288.5714" stroke="var(--text)" stroke-width="2" />
  <line x1="174.4828" y1="222.2858" x2="164.138" y2="487.4286" stroke="var(--text)" stroke-width="2" />
  <line x1="288.2758" y1="354.8571" x2="433.1035" y2="354.8571" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowvis)" />
  <line x1="288.2758" y1="553.7143" x2="433.1035" y2="553.7143" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowvis)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowvis" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="19.961" y="50.5263" width="259.4931" height="185.2632" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="149.7076" y="117.8947" text-anchor="middle" font-size="21.9571" font-weight="bold">crate root</text>
  <text x="149.7076" y="175.1579" text-anchor="middle" font-size="19.961">(lib.rs)</text>
  <rect x="19.961" y="303.1579" width="239.5322" height="134.7368" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="139.7271" y="387.3684" text-anchor="middle" font-size="19.961">pub mod api</text>
  <rect x="19.961" y="505.2632" width="239.5322" height="134.7368" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="139.7271" y="589.4737" text-anchor="middle" font-size="19.961">mod internal</text>
  <rect x="399.2203" y="303.1579" width="239.5322" height="134.7368" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="518.9864" y="387.3684" text-anchor="middle" font-size="19.961">pub fn serve()</text>
  <rect x="399.2203" y="505.2632" width="259.4931" height="134.7368" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="528.9668" y="589.4737" text-anchor="middle" font-size="19.961">fn helper()</text>
  <rect x="798.4405" y="67.3684" width="379.2592" height="269.4737" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="988.0702" y="141.4737" text-anchor="middle" font-size="21.9571" font-weight="bold">Visibility Rules</text>
  <text x="988.0702" y="202.1053" text-anchor="middle" font-size="19.961" fill="var(--ok-accent)">pub = accessible outside</text>
  <text x="988.0702" y="262.7368" text-anchor="middle" font-size="19.961" fill="var(--danger-accent)">no pub = private to module</text>
  <rect x="798.4405" y="404.2105" width="379.2592" height="235.7895" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="988.0702" y="478.3158" text-anchor="middle" font-size="19.961">pub(crate) = crate only</text>
  <text x="988.0702" y="538.9474" text-anchor="middle" font-size="19.961">pub(super) = parent only</text>
  <text x="988.0702" y="599.5789" text-anchor="middle" font-size="19.961">pub(in path) = specific</text>
  <line x1="149.7076" y1="235.7895" x2="139.7271" y2="303.1579" stroke="var(--text)" stroke-width="2" />
  <line x1="149.7076" y1="235.7895" x2="139.7271" y2="505.2632" stroke="var(--text)" stroke-width="2" />
  <line x1="259.4931" y1="370.5263" x2="399.2203" y2="370.5263" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowvis)" />
  <line x1="259.4931" y1="572.6316" x2="399.2203" y2="572.6316" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowvis)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="426.6667" y="18" width="426.6667" height="126" fill="#673ab7" stroke="#333" stroke-width="4.2667" rx="17.0667" />
  <text x="640" y="100.8" text-anchor="middle" font-size="25.6" fill="white" font-weight="bold">Collection Best Practices</text>
  <line x1="533.3333" y1="144" x2="256" y2="208.8" stroke="#333" stroke-width="4.2667" />
  <line x1="746.6667" y1="144" x2="1024" y2="208.8" stroke="#333" stroke-width="4.2667" />
  <line x1="533.3333" y1="144" x2="256" y2="450" stroke="#333" stroke-width="4.2667" />
  <line x1="746.6667" y1="144" x2="1024" y2="450" stroke="#333" stroke-width="4.2667" />
  <rect x="64" y="190.8" width="384" height="162" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="256" y="252" text-anchor="middle" font-size="21.3333" font-weight="bold">Pre-allocate capacity</text>
  <text x="256" y="302.4" text-anchor="middle" font-size="21.3333">with_capacity() avoids</text>
  <text x="256" y="342" text-anchor="middle" font-size="21.3333">repeated re-allocation</text>
  <rect x="832" y="190.8" width="384" height="162" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="1024" y="252" text-anchor="middle" font-size="21.3333" font-weight="bold">Use .get() for safety</text>
  <text x="1024" y="302.4" text-anchor="middle" font-size="21.3333">Returns Option instead</text>
  <text x="1024" y="342" text-anchor="middle" font-size="21.3333">of panicking on bad index</text>
  <rect x="64" y="432" width="384" height="162" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="256" y="493.2" text-anchor="middle" font-size="21.3333" font-weight="bold">Iterate, don't index</text>
  <text x="256" y="543.6" text-anchor="middle" font-size="21.3333">for x in &amp;v is idiomatic</text>
  <text x="256" y="583.2" text-anchor="middle" font-size="21.3333">and avoids bounds checks</text>
  <rect x="832" y="432" width="384" height="162" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="1024" y="493.2" text-anchor="middle" font-size="21.3333" font-weight="bold">entry() API for maps</text>
  <text x="1024" y="543.6" text-anchor="middle" font-size="21.3333">.entry(k).or_insert(v)</text>
  <text x="1024" y="583.2" text-anchor="middle" font-size="21.3333">avoids double lookup</text>
  <rect x="320" y="640.8" width="640" height="64.8" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="640" y="687.6" text-anchor="middle" font-size="21.3333">Avoid .clone() on collection elements -- borrow or use references</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect x="386.9993" y="16.3265" width="386.9993" height="114.2857" fill="#673ab7" stroke="#333" stroke-width="3.87" rx="15.48" />
  <ns0:text x="580.4989" y="91.4286" text-anchor="middle" font-size="23.22" fill="white" font-weight="bold">Collection Best Practices</ns0:text>
  <ns0:line x1="483.749" y1="130.6122" x2="232.1995" y2="189.3878" stroke="#333" stroke-width="3.87" />
  <ns0:line x1="677.2487" y1="130.6122" x2="928.7982" y2="189.3878" stroke="#333" stroke-width="3.87" />
  <ns0:line x1="483.749" y1="130.6122" x2="232.1995" y2="408.1633" stroke="#333" stroke-width="3.87" />
  <ns0:line x1="677.2487" y1="130.6122" x2="928.7982" y2="408.1633" stroke="#333" stroke-width="3.87" />
  <ns0:rect x="58.0499" y="173.0612" width="348.2993" height="146.9388" fill="#e3f2fd" stroke="#333" stroke-width="1.935" rx="9.675" />
  <ns0:text x="232.1995" y="228.5714" text-anchor="middle" font-size="19.3499" font-weight="bold">Pre-allocate capacity</ns0:text>
  <ns0:text x="232.1995" y="274.2857" text-anchor="middle" font-size="19.3499">with_capacity() avoids</ns0:text>
  <ns0:text x="232.1995" y="310.2041" text-anchor="middle" font-size="19.3499">repeated re-allocation</ns0:text>
  <ns0:rect x="754.6485" y="173.0612" width="348.2993" height="146.9388" fill="#f3e5f5" stroke="#333" stroke-width="1.935" rx="9.675" />
  <ns0:text x="928.7982" y="228.5714" text-anchor="middle" font-size="19.3499" font-weight="bold">Use .get() for safety</ns0:text>
  <ns0:text x="928.7982" y="274.2857" text-anchor="middle" font-size="19.3499">Returns Option instead</ns0:text>
  <ns0:text x="928.7982" y="310.2041" text-anchor="middle" font-size="19.3499">of panicking on bad index</ns0:text>
  <ns0:rect x="58.0499" y="391.8367" width="348.2993" height="146.9388" fill="#e8f5e9" stroke="#333" stroke-width="1.935" rx="9.675" />
  <ns0:text x="232.1995" y="447.3469" text-anchor="middle" font-size="19.3499" font-weight="bold">Iterate, don't index</ns0:text>
  <ns0:text x="232.1995" y="493.0612" text-anchor="middle" font-size="19.3499">for x in &amp;v is idiomatic</ns0:text>
  <ns0:text x="232.1995" y="528.9796" text-anchor="middle" font-size="19.3499">and avoids bounds checks</ns0:text>
  <ns0:rect x="754.6485" y="391.8367" width="348.2993" height="146.9388" fill="#fff3e0" stroke="#333" stroke-width="1.935" rx="9.675" />
  <ns0:text x="928.7982" y="447.3469" text-anchor="middle" font-size="19.3499" font-weight="bold">entry() API for maps</ns0:text>
  <ns0:text x="928.7982" y="493.0612" text-anchor="middle" font-size="19.3499">.entry(k).or_insert(v)</ns0:text>
  <ns0:text x="928.7982" y="528.9796" text-anchor="middle" font-size="19.3499">avoids double lookup</ns0:text>
  <ns0:rect x="290.2494" y="581.2245" width="580.4989" height="58.7755" fill="#ffebee" stroke="#333" stroke-width="1.935" rx="5.805" />
  <ns0:text x="580.4989" y="623.6735" text-anchor="middle" font-size="19.3499">Avoid .clone() on collection elements -- borrow or use references</ns0:text>
</ns0:svg>
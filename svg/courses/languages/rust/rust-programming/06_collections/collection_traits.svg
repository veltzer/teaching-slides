<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="615.015" y="51.8919" text-anchor="middle" font-size="24.6006" font-weight="bold">Key Collection Traits</text>
  <rect x="41.001" y="103.7838" width="348.5085" height="224.8649" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="215.2553" y="166.0541" text-anchor="middle" font-size="20.5005" font-weight="bold">Iterator</text>
  <text x="215.2553" y="217.9459" text-anchor="middle" font-size="20.5005">fn next(&amp;mut self)</text>
  <text x="215.2553" y="262.9189" text-anchor="middle" font-size="20.5005">  -&gt; Option&lt;Item&gt;</text>
  <text x="215.2553" y="307.8919" text-anchor="middle" font-size="20.5005">.map() .filter() .collect()</text>
  <rect x="440.7608" y="103.7838" width="348.5085" height="224.8649" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="615.015" y="166.0541" text-anchor="middle" font-size="20.5005" font-weight="bold">FromIterator</text>
  <text x="615.015" y="217.9459" text-anchor="middle" font-size="20.5005">Enables .collect()</text>
  <text x="615.015" y="262.9189" text-anchor="middle" font-size="20.5005">Vec, String, HashMap</text>
  <text x="615.015" y="307.8919" text-anchor="middle" font-size="20.5005">all implement this</text>
  <rect x="840.5206" y="103.7838" width="348.5085" height="224.8649" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1014.7748" y="166.0541" text-anchor="middle" font-size="20.5005" font-weight="bold">IntoIterator</text>
  <text x="1014.7748" y="217.9459" text-anchor="middle" font-size="20.5005">Enables for..in loops</text>
  <text x="1014.7748" y="262.9189" text-anchor="middle" font-size="20.5005">for x in collection {}</text>
  <text x="1014.7748" y="307.8919" text-anchor="middle" font-size="20.5005">consumes / borrows</text>
  <rect x="41.001" y="380.5405" width="553.5135" height="121.0811" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="317.7578" y="432.4324" text-anchor="middle" font-size="20.5005" font-weight="bold">Index / IndexMut</text>
  <text x="317.7578" y="480.8649" text-anchor="middle" font-size="20.5005">v[i] syntax for Vec, HashMap[key]</text>
  <rect x="635.5155" y="380.5405" width="553.5135" height="121.0811" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="912.2722" y="432.4324" text-anchor="middle" font-size="20.5005" font-weight="bold">Extend</text>
  <text x="912.2722" y="480.8649" text-anchor="middle" font-size="20.5005">Append items from iterator to collection</text>
  <rect x="205.005" y="553.5135" width="820.02" height="86.4865" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="615.015" y="612.3243" text-anchor="middle" font-size="20.5005">Iterators are lazy: zero-cost abstractions optimized by LLVM</text>
</svg>
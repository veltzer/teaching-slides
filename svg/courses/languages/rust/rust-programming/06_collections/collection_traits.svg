<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="615.015" y="51.8919" text-anchor="middle" font-size="24.6006" font-weight="bold">Key Collection Traits</ns0:text>
  <ns0:rect x="41.001" y="103.7838" width="348.5085" height="224.8649" fill="#e3f2fd" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="215.2553" y="166.0541" text-anchor="middle" font-size="20.5005" font-weight="bold">Iterator</ns0:text>
  <ns0:text x="215.2553" y="217.9459" text-anchor="middle" font-size="20.5005">fn next(&amp;mut self)</ns0:text>
  <ns0:text x="215.2553" y="262.9189" text-anchor="middle" font-size="20.5005">  -&gt; Option&lt;Item&gt;</ns0:text>
  <ns0:text x="215.2553" y="307.8919" text-anchor="middle" font-size="20.5005">.map() .filter() .collect()</ns0:text>
  <ns0:rect x="440.7608" y="103.7838" width="348.5085" height="224.8649" fill="#f3e5f5" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="166.0541" text-anchor="middle" font-size="20.5005" font-weight="bold">FromIterator</ns0:text>
  <ns0:text x="615.015" y="217.9459" text-anchor="middle" font-size="20.5005">Enables .collect()</ns0:text>
  <ns0:text x="615.015" y="262.9189" text-anchor="middle" font-size="20.5005">Vec, String, HashMap</ns0:text>
  <ns0:text x="615.015" y="307.8919" text-anchor="middle" font-size="20.5005">all implement this</ns0:text>
  <ns0:rect x="840.5206" y="103.7838" width="348.5085" height="224.8649" fill="#e8f5e9" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="1014.7748" y="166.0541" text-anchor="middle" font-size="20.5005" font-weight="bold">IntoIterator</ns0:text>
  <ns0:text x="1014.7748" y="217.9459" text-anchor="middle" font-size="20.5005">Enables for..in loops</ns0:text>
  <ns0:text x="1014.7748" y="262.9189" text-anchor="middle" font-size="20.5005">for x in collection {}</ns0:text>
  <ns0:text x="1014.7748" y="307.8919" text-anchor="middle" font-size="20.5005">consumes / borrows</ns0:text>
  <ns0:rect x="41.001" y="380.5405" width="553.5135" height="121.0811" fill="#fff3e0" stroke="#333" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="317.7578" y="432.4324" text-anchor="middle" font-size="20.5005" font-weight="bold">Index / IndexMut</ns0:text>
  <ns0:text x="317.7578" y="480.8649" text-anchor="middle" font-size="20.5005">v[i] syntax for Vec, HashMap[key]</ns0:text>
  <ns0:rect x="635.5155" y="380.5405" width="553.5135" height="121.0811" fill="#ffebee" stroke="#333" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="912.2722" y="432.4324" text-anchor="middle" font-size="20.5005" font-weight="bold">Extend</ns0:text>
  <ns0:text x="912.2722" y="480.8649" text-anchor="middle" font-size="20.5005">Append items from iterator to collection</ns0:text>
  <ns0:rect x="205.005" y="553.5135" width="820.02" height="86.4865" fill="#e3f2fd" stroke="#333" stroke-width="2.05" rx="10.2503" />
  <ns0:text x="615.015" y="612.3243" text-anchor="middle" font-size="20.5005">Iterators are lazy: zero-cost abstractions optimized by LLVM</ns0:text>

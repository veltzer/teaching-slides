<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.9773" font-weight="bold">Key Collection Traits</text>
  <rect x="40" y="91.1765" width="364.2857" height="221.7647" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.1429" y="152.5883" text-anchor="middle" font-size="20.8144" font-weight="bold">Iterator</text>
  <text x="222.1429" y="203.7647" text-anchor="middle" font-size="20.8144">fn next(&amp;mut self)</text>
  <text x="222.1429" y="248.1176" text-anchor="middle" font-size="20.8144">  -&gt; Option&lt;Item&gt;</text>
  <text x="222.1429" y="292.4706" text-anchor="middle" font-size="20.8144">.map() .filter() .collect()</text>
  <rect x="457.8572" y="91.1765" width="364.2857" height="221.7647" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="152.5883" text-anchor="middle" font-size="20.8144" font-weight="bold">FromIterator</text>
  <text x="639.9999" y="203.7647" text-anchor="middle" font-size="20.8144">Enables .collect()</text>
  <text x="639.9999" y="248.1176" text-anchor="middle" font-size="20.8144">Vec, String, HashMap</text>
  <text x="639.9999" y="292.4706" text-anchor="middle" font-size="20.8144">all implement this</text>
  <rect x="875.7143" y="91.1765" width="364.2857" height="221.7647" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1057.8571" y="152.5883" text-anchor="middle" font-size="20.8144" font-weight="bold">IntoIterator</text>
  <text x="1057.8571" y="203.7647" text-anchor="middle" font-size="20.8144">Enables for..in loops</text>
  <text x="1057.8571" y="248.1176" text-anchor="middle" font-size="20.8144">for x in collection {}</text>
  <text x="1057.8571" y="292.4706" text-anchor="middle" font-size="20.8144">consumes / borrows</text>
  <rect x="40" y="364.1176" width="578.5714" height="119.4118" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="329.2857" y="415.2941" text-anchor="middle" font-size="20.8144" font-weight="bold">Index / IndexMut</text>
  <text x="329.2857" y="463.0589" text-anchor="middle" font-size="20.8144">v[i] syntax for Vec, HashMap[key]</text>
  <rect x="661.4285" y="364.1176" width="578.5714" height="119.4118" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="950.7142" y="415.2941" text-anchor="middle" font-size="20.8144" font-weight="bold">Extend</text>
  <text x="950.7142" y="463.0589" text-anchor="middle" font-size="20.8144">Append items from iterator to collection</text>
  <rect x="211.4286" y="534.7059" width="857.1428" height="85.2941" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="592.7059" text-anchor="middle" font-size="20.8144">Iterators are lazy: zero-cost abstractions optimized by LLVM</text>
</svg>
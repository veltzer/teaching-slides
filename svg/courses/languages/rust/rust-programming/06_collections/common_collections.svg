<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Rust Standard Collections</text>
  <rect x="42.6667" y="108" width="362.6667" height="252" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="224" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">Vec&lt;T&gt;</text>
  <text x="224" y="234" text-anchor="middle" font-size="21.3333">Growable array</text>
  <text x="224" y="280.8" text-anchor="middle" font-size="21.3333">Contiguous heap memory</text>
  <text x="224" y="327.6" text-anchor="middle" font-size="21.3333">O(1) push/pop, O(1) index</text>
  <rect x="458.6667" y="108" width="362.6667" height="252" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">String</text>
  <text x="640" y="234" text-anchor="middle" font-size="21.3333">UTF-8 encoded text</text>
  <text x="640" y="280.8" text-anchor="middle" font-size="21.3333">Wrapper around Vec&lt;u8&gt;</text>
  <text x="640" y="327.6" text-anchor="middle" font-size="21.3333">Owned, growable</text>
  <rect x="874.6667" y="108" width="362.6667" height="252" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1056" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">HashMap&lt;K,V&gt;</text>
  <text x="1056" y="234" text-anchor="middle" font-size="21.3333">Key-value store</text>
  <text x="1056" y="280.8" text-anchor="middle" font-size="21.3333">Hash-based buckets</text>
  <text x="1056" y="327.6" text-anchor="middle" font-size="21.3333">O(1) avg lookup</text>
  <rect x="170.6667" y="432" width="426.6667" height="108" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="384" y="500.4" text-anchor="middle" font-size="21.3333">Also: VecDeque, LinkedList, BTreeMap</text>
  <rect x="682.6667" y="432" width="426.6667" height="108" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="896" y="500.4" text-anchor="middle" font-size="21.3333">Also: HashSet, BTreeSet, BinaryHeap</text>
  <rect x="213.3333" y="594" width="853.3333" height="90" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="640" y="655.2" text-anchor="middle" font-size="21.3333">All collections own their data and free it on drop (RAII)</text>
</svg>
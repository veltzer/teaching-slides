<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="364.2858" height="253.750006835938" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.274950283528" filter="url(#shadow)"/>
  <text x="222.1427" y="112.500095703128" text-anchor="middle" font-size="23.600506346368" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Vec&lt;T&gt;</text>
  <text x="222.1427" y="166.875003417969" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--primary-text)">Growable array</text>
  <text x="222.1427" y="213.9999890625" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--primary-text)">Contiguous heap memory</text>
  <text x="222.1427" y="261.124974707031" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--primary-text)">O(1) push/pop, O(1) index</text>
  <rect x="457.8571" y="40" width="364.2858" height="253.750006835938" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.274950283528" filter="url(#shadow)"/>
  <text x="639.9999" y="112.500095703128" text-anchor="middle" font-size="23.600506346368" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">String</text>
  <text x="639.9999" y="166.875003417969" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--info-text)">UTF-8 encoded text</text>
  <text x="639.9999" y="213.9999890625" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--info-text)">Wrapper around Vec&lt;u8&gt;</text>
  <text x="639.9999" y="261.124974707031" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--info-text)">Owned, growable</text>
  <rect x="875.7142" y="40" width="364.2858" height="253.750006835938" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.274950283528" filter="url(#shadow)"/>
  <text x="1057.8571" y="112.500095703128" text-anchor="middle" font-size="23.600506346368" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">HashMap&lt;K,V&gt;</text>
  <text x="1057.8571" y="166.875003417969" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--ok-text)">Key-value store</text>
  <text x="1057.8571" y="213.9999890625" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--ok-text)">Hash-based buckets</text>
  <text x="1057.8571" y="261.124974707031" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--ok-text)">O(1) avg lookup</text>
  <rect x="168.5713" y="366.249993164062" width="428.5714" height="108.749924804685" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.274950283528" filter="url(#shadow)"/>
  <text x="382.857" y="435.12496376953" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--warn-text)">Also: VecDeque, LinkedList, BTreeMap</text>
  <rect x="682.8571" y="366.249993164062" width="428.5714" height="108.749924804685" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.274950283528" filter="url(#shadow)"/>
  <text x="897.1428" y="435.12496376953" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--danger-text)">Also: HashSet, BTreeSet, BinaryHeap</text>
  <rect x="211.4284" y="529.375044433595" width="857.1428" height="90.624955566405" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.274950283528" filter="url(#shadow)"/>
  <text x="639.9999" y="590.99998359375" text-anchor="middle" font-size="21.454996261925" font-family="Arial, sans-serif" fill="var(--primary-text)">All collections own their data and free it on drop (RAII)</text>
</svg>

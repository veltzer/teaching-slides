<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Rust Standard Collections</ns0:text>
  <ns0:rect x="39.9221" y="101.0526" width="339.3373" height="235.7895" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="209.5906" y="168.4211" text-anchor="middle" font-size="21.9571" font-weight="bold">Vec&lt;T&gt;</ns0:text>
  <ns0:text x="209.5906" y="218.9474" text-anchor="middle" font-size="19.961">Growable array</ns0:text>
  <ns0:text x="209.5906" y="262.7368" text-anchor="middle" font-size="19.961">Contiguous heap memory</ns0:text>
  <ns0:text x="209.5906" y="306.5263" text-anchor="middle" font-size="19.961">O(1) push/pop, O(1) index</ns0:text>
  <ns0:rect x="429.1618" y="101.0526" width="339.3373" height="235.7895" fill="#f3e5f5" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="598.8304" y="168.4211" text-anchor="middle" font-size="21.9571" font-weight="bold">String</ns0:text>
  <ns0:text x="598.8304" y="218.9474" text-anchor="middle" font-size="19.961">UTF-8 encoded text</ns0:text>
  <ns0:text x="598.8304" y="262.7368" text-anchor="middle" font-size="19.961">Wrapper around Vec&lt;u8&gt;</ns0:text>
  <ns0:text x="598.8304" y="306.5263" text-anchor="middle" font-size="19.961">Owned, growable</ns0:text>
  <ns0:rect x="818.4016" y="101.0526" width="339.3373" height="235.7895" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="988.0702" y="168.4211" text-anchor="middle" font-size="21.9571" font-weight="bold">HashMap&lt;K,V&gt;</ns0:text>
  <ns0:text x="988.0702" y="218.9474" text-anchor="middle" font-size="19.961">Key-value store</ns0:text>
  <ns0:text x="988.0702" y="262.7368" text-anchor="middle" font-size="19.961">Hash-based buckets</ns0:text>
  <ns0:text x="988.0702" y="306.5263" text-anchor="middle" font-size="19.961">O(1) avg lookup</ns0:text>
  <ns0:rect x="159.6881" y="404.2105" width="399.2203" height="101.0526" fill="#fff3e0" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="359.2982" y="468.2105" text-anchor="middle" font-size="19.961">Also: VecDeque, LinkedList, BTreeMap</ns0:text>
  <ns0:rect x="638.7525" y="404.2105" width="399.2203" height="101.0526" fill="#ffebee" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="838.3626" y="468.2105" text-anchor="middle" font-size="19.961">Also: HashSet, BTreeSet, BinaryHeap</ns0:text>
  <ns0:rect x="199.6101" y="555.7895" width="798.4405" height="84.2105" fill="#e3f2fd" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="598.8304" y="613.0526" text-anchor="middle" font-size="19.961">All collections own their data and free it on drop (RAII)</ns0:text>
</ns0:svg>
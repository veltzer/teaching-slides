<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_str" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="592.5926" y="50" text-anchor="middle" font-size="23.7037" font-weight="bold">String Internal Layout (wraps Vec&lt;u8&gt;)</text>
  <text x="217.284" y="116.6667" text-anchor="middle" font-size="21.7284" font-weight="bold">Stack: String struct</text>
  <rect x="39.5062" y="140" width="355.5556" height="83.3333" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="217.284" y="196.6667" text-anchor="middle" font-size="19.7531">ptr: 0x7fa3...</text>
  <rect x="39.5062" y="223.3333" width="355.5556" height="83.3333" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="217.284" y="280" text-anchor="middle" font-size="19.7531">len: 5 (bytes used)</text>
  <rect x="39.5062" y="306.6667" width="355.5556" height="83.3333" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="217.284" y="363.3333" text-anchor="middle" font-size="19.7531">cap: 8 (bytes allocated)</text>
  <text x="829.6296" y="116.6667" text-anchor="middle" font-size="21.7284" font-weight="bold">Heap: UTF-8 bytes</text>
  <rect x="572.8395" y="150" width="69.1358" height="100" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="606.4197" y="213.3333" text-anchor="middle" font-size="21.7284">h</text>
  <rect x="641.9753" y="150" width="69.1358" height="100" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="675.5556" y="213.3333" text-anchor="middle" font-size="21.7284">e</text>
  <rect x="711.1111" y="150" width="69.1358" height="100" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="744.6914" y="213.3333" text-anchor="middle" font-size="21.7284">l</text>
  <rect x="780.2469" y="150" width="69.1358" height="100" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="813.8271" y="213.3333" text-anchor="middle" font-size="21.7284">l</text>
  <rect x="849.3827" y="150" width="69.1358" height="100" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="882.963" y="213.3333" text-anchor="middle" font-size="21.7284">o</text>
  <rect x="918.5185" y="150" width="69.1358" height="100" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="5.9259 3.9506" rx="6"/>
  <text x="952.0988" y="213.3333" text-anchor="middle" font-size="19.7531">--</text>
  <rect x="987.6544" y="150" width="69.1358" height="100" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="5.9259 3.9506" rx="6"/>
  <text x="1021.2345" y="213.3333" text-anchor="middle" font-size="19.7531">--</text>
  <rect x="1056.7901" y="150" width="69.1358" height="100" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="5.9259 3.9506" rx="6"/>
  <text x="1090.3704" y="213.3333" text-anchor="middle" font-size="19.7531">--</text>
  <text x="790.1234" y="300" text-anchor="middle" font-size="19.7531">|-- len: 5 used --|-- cap: 3 spare --|</text>
  <line x1="395.0618" y1="183.3333" x2="572.8395" y2="183.3333" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_str)" />
  <rect x="59.2593" y="416.6667" width="493.8271" height="100" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="306.1729" y="480" text-anchor="middle" font-size="19.7531">UTF-8 encoded: multi-byte chars possible</text>
  <rect x="612.3456" y="416.6667" width="513.5803" height="100" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="869.1358" y="480" text-anchor="middle" font-size="19.7531">No indexing by char! Use .chars() iterator</text>
  <rect x="197.5308" y="566.6667" width="790.1234" height="73.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="592.5926" y="616.6667" text-anchor="middle" font-size="19.7531">String = Vec&lt;u8&gt; with UTF-8 guarantee; &amp;str = &amp;[u8] slice</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_str" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="650.9091" y="40" text-anchor="middle" font-size="24.6999" font-weight="bold">String Internal Layout (wraps Vec&lt;u8&gt;)</text>
  <text x="236.3637" y="105.5368" text-anchor="middle" font-size="22.6416" font-weight="bold">Stack: String struct</text>
  <rect x="40" y="128.4746" width="392.7273" height="81.9209" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="236.3637" y="184.1808" text-anchor="middle" font-size="20.5833">ptr: 0x7fa3...</text>
  <rect x="40" y="210.3954" width="392.7273" height="81.9209" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="236.3637" y="266.1017" text-anchor="middle" font-size="20.5833">len: 5 (bytes used)</text>
  <rect x="40" y="292.3164" width="392.7273" height="81.9209" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="236.3637" y="348.0226" text-anchor="middle" font-size="20.5833">cap: 8 (bytes allocated)</text>
  <text x="912.7273" y="105.5368" text-anchor="middle" font-size="22.6416" font-weight="bold">Heap: UTF-8 bytes</text>
  <rect x="629.0909" y="138.3051" width="76.3636" height="98.3051" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="666.1818" y="200.5649" text-anchor="middle" font-size="22.6416">h</text>
  <rect x="705.4545" y="138.3051" width="76.3636" height="98.3051" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="742.5455" y="200.5649" text-anchor="middle" font-size="22.6416">e</text>
  <rect x="781.8182" y="138.3051" width="76.3636" height="98.3051" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="818.9091" y="200.5649" text-anchor="middle" font-size="22.6416">l</text>
  <rect x="858.1818" y="138.3051" width="76.3636" height="98.3051" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="895.2727" y="200.5649" text-anchor="middle" font-size="22.6416">l</text>
  <rect x="934.5455" y="138.3051" width="76.3636" height="98.3051" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="971.6364" y="200.5649" text-anchor="middle" font-size="22.6416">o</text>
  <rect x="1010.9091" y="138.3051" width="76.3636" height="98.3051" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="5.9259 3.9506" rx="6"/>
  <text x="1048.0001" y="200.5649" text-anchor="middle" font-size="20.5833">--</text>
  <rect x="1087.2728" y="138.3051" width="76.3636" height="98.3051" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="5.9259 3.9506" rx="6"/>
  <text x="1124.3636" y="200.5649" text-anchor="middle" font-size="20.5833">--</text>
  <rect x="1163.6364" y="138.3051" width="76.3636" height="98.3051" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="5.9259 3.9506" rx="6"/>
  <text x="1200.7273" y="200.5649" text-anchor="middle" font-size="20.5833">--</text>
  <text x="869.0909" y="285.7627" text-anchor="middle" font-size="20.5833">|-- len: 5 used --|-- cap: 3 spare --|</text>
  <line x1="432.7273" y1="171.0734" x2="629.0909" y2="171.0734" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_str)" />
  <rect x="61.8182" y="400.452" width="545.4545" height="98.3051" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="334.5455" y="462.7119" text-anchor="middle" font-size="20.5833">UTF-8 encoded: multi-byte chars possible</text>
  <rect x="672.7272" y="400.452" width="567.2728" height="98.3051" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="956.3636" y="462.7119" text-anchor="middle" font-size="20.5833">No indexing by char! Use .chars() iterator</text>
  <rect x="214.5454" y="547.9096" width="872.7273" height="72.0904" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="650.9091" y="597.0622" text-anchor="middle" font-size="20.5833">String = Vec&lt;u8&gt; with UTF-8 guarantee; &amp;str = &amp;[u8] slice</text>
</svg>
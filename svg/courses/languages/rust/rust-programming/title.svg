<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <circle cx="640" cy="330" r="139.0443" fill="none" stroke="var(--danger-border)" stroke-width="5.6889" opacity="0.4" />
  <rect x="622" y="173.4" width="36" height="26.1" rx="6" fill="var(--danger-fill)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="622" y="460.5" width="36" height="26.1" rx="6" fill="var(--danger-fill)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="478" y="312.6" width="27" height="34.8" rx="6" fill="var(--danger-fill)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="775" y="312.6" width="27" height="34.8" rx="6" fill="var(--danger-fill)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="587.5" y="359" font-family="serif" font-size="97.3311" fill="var(--danger-accent)" font-weight="bold" opacity="0.5">R</text>
  <rect x="130" y="127" width="210" height="145" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1333" />
  <text x="160" y="167.6" font-family="monospace" font-size="18.0758" fill="var(--danger-accent)">let</text>
  <text x="202" y="167.6" font-family="monospace" font-size="18.0758" fill="var(--bg)">s =</text>
  <text x="242.5" y="167.6" font-family="monospace" font-size="18.0758" fill="var(--ok-accent)">String</text>
  <text x="160" y="199.5" font-family="monospace" font-size="18.0758" fill="var(--danger-accent)">let</text>
  <text x="202" y="199.5" font-family="monospace" font-size="18.0758" fill="var(--bg)">t = s;</text>
  <text x="160" y="243" font-family="monospace" font-size="13.9044" fill="var(--primary-accent)">// s is moved to t</text>
  <rect x="939.9999" y="127" width="225" height="145" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="2.1333" />
  <text x="962.5" y="167.6" font-family="monospace" font-size="18.0758" fill="var(--danger-accent)">fn</text>
  <text x="992.5" y="167.6" font-family="monospace" font-size="18.0758" fill="var(--warn-accent)">greet</text>
  <text x="1052.5" y="167.6" font-family="monospace" font-size="18.0758" fill="var(--bg)">(</text>
  <text x="977.5" y="196.6" font-family="monospace" font-size="18.0758" fill="var(--bg)">s: </text>
  <text x="1007.4999" y="196.6" font-family="monospace" font-size="18.0758" fill="var(--primary-accent)">&amp;str</text>
  <text x="977.5" y="243" font-family="monospace" font-size="13.9044" fill="var(--ok-accent)">// borrowing</text>
  <rect x="130" y="431.5" width="255" height="145" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="2.1333" />
  <text x="152.5" y="472.1" font-family="monospace" font-size="18.0758" fill="var(--danger-accent)">match</text>
  <text x="220" y="472.1" font-family="monospace" font-size="18.0758" fill="var(--bg)">value {</text>
  <text x="175" y="501.1" font-family="monospace" font-size="18.0758" fill="var(--warn-accent)">Some</text>
  <text x="235" y="501.1" font-family="monospace" font-size="18.0758" fill="var(--bg)">(x) =&gt; x,</text>
  <text x="175" y="530.1" font-family="monospace" font-size="18.0758" fill="var(--warn-accent)">None</text>
  <text x="235" y="530.1" font-family="monospace" font-size="18.0758" fill="var(--bg)">=&gt; 0,</text>
  <text x="152.5" y="559.1" font-family="monospace" font-size="18.0758" fill="var(--bg)">}</text>
  <rect x="939.9999" y="431.5" width="240" height="116" rx="6" fill="var(--code-bg)" stroke="var(--danger-border)" stroke-width="2.1333" />
  <text x="962.5" y="472.1" font-family="monospace" font-size="18.0758" fill="var(--primary-accent)">Result</text>
  <text x="1041.9999" y="472.1" font-family="monospace" font-size="18.0758" fill="var(--bg)">&lt;T, E&gt;</text>
  <text x="962.5" y="508.35" font-family="monospace" font-size="18.0758" fill="var(--primary-accent)">Option</text>
  <text x="1049.5" y="508.35" font-family="monospace" font-size="18.0758" fill="var(--bg)">&lt;T&gt;</text>
  <text x="962.5" y="537.35" font-family="monospace" font-size="13.9044" fill="var(--danger-accent)">// no null values</text>
  <text x="415" y="591" font-family="monospace" font-size="19.4662" fill="var(--primary-accent)">memory safety - zero cost abstractions - fearless concurrency</text>
</svg>
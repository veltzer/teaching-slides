  <text x="128" y="198" font-family="monospace" font-size="20.8" fill="#e94560">let</text>
  <text x="172.8" y="198" font-family="monospace" font-size="20.8" fill="white">t = s;</text>
  <text x="128" y="252" font-family="monospace" font-size="16" fill="#53d8fb">// s is moved to t</text>
  <rect x="960" y="108" width="240" height="180" rx="9.6" fill="#16213e" stroke="#00b894" stroke-width="2.4" />
  <text x="984" y="158.4" font-family="monospace" font-size="20.8" fill="#e94560">fn</text>
  <text x="1016" y="158.4" font-family="monospace" font-size="20.8" fill="#ffd93d">greet</text>
  <text x="1080" y="158.4" font-family="monospace" font-size="20.8" fill="white">(</text>
  <text x="1000" y="194.4" font-family="monospace" font-size="20.8" fill="white">s: </text>
  <text x="1032" y="194.4" font-family="monospace" font-size="20.8" fill="#53d8fb">&amp;str</text>
  <text x="1000" y="252" font-family="monospace" font-size="16" fill="#00b894">// borrowing</text>
  <rect x="96" y="486" width="272" height="180" rx="9.6" fill="#16213e" stroke="#ffd93d" stroke-width="2.4" />
  <text x="120" y="536.4" font-family="monospace" font-size="20.8" fill="#e94560">match</text>
  <text x="192" y="536.4" font-family="monospace" font-size="20.8" fill="white">value {</text>
  <text x="144" y="572.4" font-family="monospace" font-size="20.8" fill="#ffd93d">Some</text>
  <text x="208" y="572.4" font-family="monospace" font-size="20.8" fill="white">(x) =&gt; x,</text>
  <text x="144" y="608.4" font-family="monospace" font-size="20.8" fill="#ffd93d">None</text>
  <text x="208" y="608.4" font-family="monospace" font-size="20.8" fill="white">=&gt; 0,</text>
  <text x="120" y="644.4" font-family="monospace" font-size="20.8" fill="white">}</text>
  <rect x="960" y="486" width="256" height="144" rx="9.6" fill="#16213e" stroke="#e94560" stroke-width="2.4" />
  <text x="984" y="536.4" font-family="monospace" font-size="20.8" fill="#53d8fb">Result</text>
  <text x="1068.8" y="536.4" font-family="monospace" font-size="20.8" fill="white">&lt;T, E&gt;</text>
  <text x="984" y="581.4" font-family="monospace" font-size="20.8" fill="#53d8fb">Option</text>
  <text x="1076.8" y="581.4" font-family="monospace" font-size="20.8" fill="white">&lt;T&gt;</text>
  <text x="984" y="617.4" font-family="monospace" font-size="16" fill="#e94560">// no null values</text>
  <text x="400" y="684" font-family="monospace" font-size="22.4" fill="#0f3460">memory safety - zero cost abstractions - fearless concurrency</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <circle cx="640" cy="330" r="139.0443" fill="none" stroke="var(--danger-border)" stroke-width="5.6889" opacity="0.4"/>
  <rect x="622" y="173.4" width="36" height="26.1" rx="6" fill="url(#grad-danger)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="622" y="460.5" width="36" height="26.1" rx="6" fill="url(#grad-danger)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="478" y="312.6" width="27" height="34.8" rx="6" fill="url(#grad-danger)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="775" y="312.6" width="27" height="34.8" rx="6" fill="url(#grad-danger)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="587.5" y="359" font-size="97.3311" fill="var(--danger-accent)" font-weight="bold" opacity="0.5" font-family="Arial, sans-serif">R</text>
  <rect x="130" y="127" width="210" height="145" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1333"/>
  <text x="160" y="167.6" font-size="18.0758" fill="var(--danger-accent)" font-family="Courier New, monospace">let</text>
  <text x="202" y="167.6" font-size="18.0758" fill="var(--bg)" font-family="Courier New, monospace">s =</text>
  <text x="242.5" y="167.6" font-size="18.0758" fill="var(--ok-accent)" font-family="Courier New, monospace">String</text>
  <text x="160" y="199.5" font-size="18.0758" fill="var(--danger-accent)" font-family="Courier New, monospace">let</text>
  <text x="202" y="199.5" font-size="18.0758" fill="var(--bg)" font-family="Courier New, monospace">t = s;</text>
  <text x="160" y="243" font-size="13.9044" fill="var(--primary-accent)" font-family="Courier New, monospace">// s is moved to t</text>
  <rect x="939.9999" y="127" width="225" height="145" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="2.1333"/>
  <text x="962.5" y="167.6" font-size="18.0758" fill="var(--danger-accent)" font-family="Courier New, monospace">fn</text>
  <text x="992.5" y="167.6" font-size="18.0758" fill="var(--warn-accent)" font-family="Courier New, monospace">greet</text>
  <text x="1052.5" y="167.6" font-size="18.0758" fill="var(--bg)" font-family="Courier New, monospace">(</text>
  <text x="977.5" y="196.6" font-size="18.0758" fill="var(--bg)" font-family="Courier New, monospace">s: </text>
  <text x="1007.4999" y="196.6" font-size="18.0758" fill="var(--primary-accent)" font-family="Courier New, monospace">&amp;str</text>
  <text x="977.5" y="243" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">// borrowing</text>
  <rect x="130" y="431.5" width="255" height="145" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="2.1333"/>
  <text x="152.5" y="472.1" font-size="18.0758" fill="var(--danger-accent)" font-family="Courier New, monospace">match</text>
  <text x="220" y="472.1" font-size="18.0758" fill="var(--bg)" font-family="Courier New, monospace">value {</text>
  <text x="175" y="501.1" font-size="18.0758" fill="var(--warn-accent)" font-family="Courier New, monospace">Some</text>
  <text x="235" y="501.1" font-size="18.0758" fill="var(--bg)" font-family="Courier New, monospace">(x) =&gt; x,</text>
  <text x="175" y="530.1" font-size="18.0758" fill="var(--warn-accent)" font-family="Courier New, monospace">None</text>
  <text x="235" y="530.1" font-size="18.0758" fill="var(--bg)" font-family="Courier New, monospace">=&gt; 0,</text>
  <text x="152.5" y="559.1" font-size="18.0758" fill="var(--bg)" font-family="Courier New, monospace">}</text>
  <rect x="939.9999" y="431.5" width="240" height="116" rx="6" fill="var(--code-bg)" stroke="var(--danger-border)" stroke-width="2.1333"/>
  <text x="962.5" y="472.1" font-size="18.0758" fill="var(--primary-accent)" font-family="Courier New, monospace">Result</text>
  <text x="1041.9999" y="472.1" font-size="18.0758" fill="var(--bg)" font-family="Courier New, monospace">&lt;T, E&gt;</text>
  <text x="962.5" y="508.35" font-size="18.0758" fill="var(--primary-accent)" font-family="Courier New, monospace">Option</text>
  <text x="1049.5" y="508.35" font-size="18.0758" fill="var(--bg)" font-family="Courier New, monospace">&lt;T&gt;</text>
  <text x="962.5" y="537.35" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">// no null values</text>
  <text x="415" y="591" font-size="19.4662" fill="var(--primary-accent)" font-family="Courier New, monospace">memory safety - zero cost abstractions - fearless concurrency</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--code-bg)" rx="6"/>
  <circle cx="568.8889" cy="320" r="142.2222" fill="none" stroke="var(--danger-border)" stroke-width="5.6889" opacity="0.4" />
  <rect x="551.8222" y="147.2" width="34.1333" height="28.8" rx="6" fill="var(--danger-fill)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="551.8222" y="464" width="34.1333" height="28.8" rx="6" fill="var(--danger-fill)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="415.2889" y="300.8" width="25.6" height="38.4" rx="6" fill="var(--danger-fill)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="696.8889" y="300.8" width="25.6" height="38.4" rx="6" fill="var(--danger-fill)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="519.1111" y="352" font-family="serif" font-size="99.5556" fill="var(--danger-accent)" font-weight="bold" opacity="0.5">R</text>
  <rect x="85.3333" y="96" width="199.1111" height="160" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1333" />
  <text x="113.7778" y="140.8" font-family="monospace" font-size="18.4889" fill="var(--danger-accent)">let</text>
  <text x="153.6" y="140.8" font-family="monospace" font-size="18.4889" fill="var(--bg)">s =</text>
  <text x="192" y="140.8" font-family="monospace" font-size="18.4889" fill="var(--ok-accent)">String</text>
  <text x="113.7778" y="176" font-family="monospace" font-size="18.4889" fill="var(--danger-accent)">let</text>
  <text x="153.6" y="176" font-family="monospace" font-size="18.4889" fill="var(--bg)">t = s;</text>
  <text x="113.7778" y="224" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">// s is moved to t</text>
  <rect x="853.3333" y="96" width="213.3333" height="160" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="2.1333" />
  <text x="874.6667" y="140.8" font-family="monospace" font-size="18.4889" fill="var(--danger-accent)">fn</text>
  <text x="903.1111" y="140.8" font-family="monospace" font-size="18.4889" fill="var(--warn-accent)">greet</text>
  <text x="960" y="140.8" font-family="monospace" font-size="18.4889" fill="var(--bg)">(</text>
  <text x="888.8889" y="172.8" font-family="monospace" font-size="18.4889" fill="var(--bg)">s: </text>
  <text x="917.3333" y="172.8" font-family="monospace" font-size="18.4889" fill="var(--primary-accent)">&amp;str</text>
  <text x="888.8889" y="224" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)">// borrowing</text>
  <rect x="85.3333" y="432" width="241.7778" height="160" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="2.1333" />
  <text x="106.6667" y="476.8" font-family="monospace" font-size="18.4889" fill="var(--danger-accent)">match</text>
  <text x="170.6667" y="476.8" font-family="monospace" font-size="18.4889" fill="var(--bg)">value {</text>
  <text x="128" y="508.8" font-family="monospace" font-size="18.4889" fill="var(--warn-accent)">Some</text>
  <text x="184.8889" y="508.8" font-family="monospace" font-size="18.4889" fill="var(--bg)">(x) =&gt; x,</text>
  <text x="128" y="540.8" font-family="monospace" font-size="18.4889" fill="var(--warn-accent)">None</text>
  <text x="184.8889" y="540.8" font-family="monospace" font-size="18.4889" fill="var(--bg)">=&gt; 0,</text>
  <text x="106.6667" y="572.8" font-family="monospace" font-size="18.4889" fill="var(--bg)">}</text>
  <rect x="853.3333" y="432" width="227.5556" height="128" rx="6" fill="var(--code-bg)" stroke="var(--danger-border)" stroke-width="2.1333" />
  <text x="874.6667" y="476.8" font-family="monospace" font-size="18.4889" fill="var(--primary-accent)">Result</text>
  <text x="950.0444" y="476.8" font-family="monospace" font-size="18.4889" fill="var(--bg)">&lt;T, E&gt;</text>
  <text x="874.6667" y="516.8" font-family="monospace" font-size="18.4889" fill="var(--primary-accent)">Option</text>
  <text x="957.1556" y="516.8" font-family="monospace" font-size="18.4889" fill="var(--bg)">&lt;T&gt;</text>
  <text x="874.6667" y="548.8" font-family="monospace" font-size="14.2222" fill="var(--danger-accent)">// no null values</text>
  <text x="355.5556" y="608" font-family="monospace" font-size="19.9111" fill="var(--primary-accent)">memory safety - zero cost abstractions - fearless concurrency</text>
</svg>
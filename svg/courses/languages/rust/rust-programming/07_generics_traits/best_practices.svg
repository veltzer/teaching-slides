  <ns0:rect x="386.9993" y="16.3265" width="386.9993" height="114.2857" fill="#673ab7" stroke="#333" stroke-width="3.87" rx="15.48" />
  <ns0:text x="580.4989" y="91.4286" text-anchor="middle" font-size="23.22" fill="white" font-weight="bold">Generics/Traits Tips</ns0:text>
  <ns0:line x1="483.749" y1="130.6122" x2="232.1995" y2="189.3878" stroke="#333" stroke-width="3.87" />
  <ns0:line x1="677.2487" y1="130.6122" x2="928.7982" y2="189.3878" stroke="#333" stroke-width="3.87" />
  <ns0:line x1="483.749" y1="130.6122" x2="232.1995" y2="408.1633" stroke="#333" stroke-width="3.87" />
  <ns0:line x1="677.2487" y1="130.6122" x2="928.7982" y2="408.1633" stroke="#333" stroke-width="3.87" />
  <ns0:rect x="58.0499" y="173.0612" width="348.2993" height="146.9388" fill="#e3f2fd" stroke="#333" stroke-width="1.935" rx="9.675" />
  <ns0:text x="232.1995" y="228.5714" text-anchor="middle" font-size="19.3499" font-weight="bold">Minimal bounds</ns0:text>
  <ns0:text x="232.1995" y="274.2857" text-anchor="middle" font-size="19.3499">Only require traits you</ns0:text>
  <ns0:text x="232.1995" y="310.2041" text-anchor="middle" font-size="19.3499">actually call methods on</ns0:text>
  <ns0:rect x="754.6485" y="173.0612" width="348.2993" height="146.9388" fill="#f3e5f5" stroke="#333" stroke-width="1.935" rx="9.675" />
  <ns0:text x="928.7982" y="228.5714" text-anchor="middle" font-size="19.3499" font-weight="bold">Static over dynamic</ns0:text>
  <ns0:text x="928.7982" y="274.2857" text-anchor="middle" font-size="19.3499">Prefer impl Trait / generics</ns0:text>
  <ns0:text x="928.7982" y="310.2041" text-anchor="middle" font-size="19.3499">over dyn Trait when possible</ns0:text>
  <ns0:rect x="58.0499" y="391.8367" width="348.2993" height="146.9388" fill="#e8f5e9" stroke="#333" stroke-width="1.935" rx="9.675" />
  <ns0:text x="232.1995" y="447.3469" text-anchor="middle" font-size="19.3499" font-weight="bold">#[derive] first</ns0:text>
  <ns0:text x="232.1995" y="493.0612" text-anchor="middle" font-size="19.3499">Auto-derive Debug, Clone,</ns0:text>
  <ns0:text x="232.1995" y="528.9796" text-anchor="middle" font-size="19.3499">PartialEq before manual impl</ns0:text>
  <ns0:rect x="754.6485" y="391.8367" width="348.2993" height="146.9388" fill="#fff3e0" stroke="#333" stroke-width="1.935" rx="9.675" />
  <ns0:text x="928.7982" y="447.3469" text-anchor="middle" font-size="19.3499" font-weight="bold">Coherence rules</ns0:text>
  <ns0:text x="928.7982" y="493.0612" text-anchor="middle" font-size="19.3499">Orphan rule: impl trait for</ns0:text>
  <ns0:text x="928.7982" y="528.9796" text-anchor="middle" font-size="19.3499">type only if one is local</ns0:text>
  <ns0:rect x="290.2494" y="581.2245" width="580.4989" height="58.7755" fill="#ffebee" stroke="#333" stroke-width="1.935" rx="5.805" />
  <ns0:text x="580.4989" y="623.6735" text-anchor="middle" font-size="19.3499">Use where clauses for readability with complex bounds</ns0:text>
</ns0:svg>
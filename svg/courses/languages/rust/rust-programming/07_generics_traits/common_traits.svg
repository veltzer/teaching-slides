  <rect x="878.2846" y="94.3158" width="279.4542" height="168.4211" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="1.9961" rx="9.9805" />
  <text x="1018.0117" y="148.2105" text-anchor="middle" font-size="19.961" font-weight="bold">PartialOrd/Ord</text>

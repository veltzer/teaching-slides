<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Essential Std Library Traits</text>
  <rect x="39.9221" y="94.3158" width="259.4931" height="168.4211" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="169.6686" y="148.2105" text-anchor="middle" font-size="19.961" font-weight="bold">Display/Debug</text>
  <text x="169.6686" y="195.3684" text-anchor="middle" font-size="19.961">Formatting output</text>
  <text x="169.6686" y="235.7895" text-anchor="middle" font-size="19.961">{} and {:?}</text>
  <rect x="319.3762" y="94.3158" width="259.4931" height="168.4211" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="449.1228" y="148.2105" text-anchor="middle" font-size="19.961" font-weight="bold">Clone/Copy</text>
  <text x="449.1228" y="195.3684" text-anchor="middle" font-size="19.961">Duplication semantics</text>
  <text x="449.1228" y="235.7895" text-anchor="middle" font-size="19.961">deep vs bitwise</text>
  <rect x="598.8304" y="94.3158" width="259.4931" height="168.4211" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="728.577" y="148.2105" text-anchor="middle" font-size="19.961" font-weight="bold">PartialEq/Eq</text>
  <text x="728.577" y="195.3684" text-anchor="middle" font-size="19.961">Equality comparison</text>
  <text x="728.577" y="235.7895" text-anchor="middle" font-size="19.961">== and !=</text>
  <rect x="878.2846" y="94.3158" width="279.4542" height="168.4211" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1018.0117" y="148.2105" text-anchor="middle" font-size="19.961" font-weight="bold">PartialOrd/Ord</text>
  <text x="1018.0117" y="195.3684" text-anchor="middle" font-size="19.961">Ordering comparison</text>
  <text x="1018.0117" y="235.7895" text-anchor="middle" font-size="19.961">&lt; &gt; &lt;= &gt;= .sort()</text>
  <rect x="39.9221" y="303.1579" width="259.4931" height="168.4211" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="169.6686" y="357.0526" text-anchor="middle" font-size="19.961" font-weight="bold">From/Into</text>
  <text x="169.6686" y="404.2105" text-anchor="middle" font-size="19.961">Type conversion</text>
  <text x="169.6686" y="444.6316" text-anchor="middle" font-size="19.961">impl From&lt;T&gt;</text>
  <rect x="319.3762" y="303.1579" width="259.4931" height="168.4211" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="449.1228" y="357.0526" text-anchor="middle" font-size="19.961" font-weight="bold">Drop</text>
  <text x="449.1228" y="404.2105" text-anchor="middle" font-size="19.961">Destructor / cleanup</text>
  <text x="449.1228" y="444.6316" text-anchor="middle" font-size="19.961">RAII pattern</text>
  <rect x="598.8304" y="303.1579" width="259.4931" height="168.4211" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="728.577" y="357.0526" text-anchor="middle" font-size="19.961" font-weight="bold">Iterator</text>
  <text x="728.577" y="404.2105" text-anchor="middle" font-size="19.961">Lazy sequences</text>
  <text x="728.577" y="444.6316" text-anchor="middle" font-size="19.961">.next() -&gt; Option</text>
  <rect x="878.2846" y="303.1579" width="279.4542" height="168.4211" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1018.0117" y="357.0526" text-anchor="middle" font-size="19.961" font-weight="bold">AsRef/Deref</text>
  <text x="1018.0117" y="404.2105" text-anchor="middle" font-size="19.961">Cheap conversion</text>
  <text x="1018.0117" y="444.6316" text-anchor="middle" font-size="19.961">auto-dereferencing</text>
  <rect x="199.6101" y="522.1053" width="798.4405" height="117.8947" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="572.6316" text-anchor="middle" font-size="19.961" font-weight="bold">Most can be derived: #[derive(Debug, Clone, PartialEq)]</text>
  <text x="598.8304" y="619.7895" text-anchor="middle" font-size="19.961">Compiler auto-generates implementations for simple structs/enums</text>
</svg>
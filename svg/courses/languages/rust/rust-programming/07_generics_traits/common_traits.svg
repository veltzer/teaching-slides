  <rect x="39.9221" y="303.1579" width="259.4931" height="168.4211" fill="var(--danger-pale)" stroke="var(--text-dark)" stroke-width="1.9961" rx="9.9805" />
  <text x="169.6686" y="357.0526" text-anchor="middle" font-size="19.961" font-weight="bold">From/Into</text>

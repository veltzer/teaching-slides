<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="278.5714" height="179.012356348117" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="179.2856" y="97.283979957323" text-anchor="middle" font-size="21.322146139654" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Display/Debug</text>
  <text x="179.2856" y="147.407435413808" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--primary-text)">Formatting output</text>
  <text x="179.2856" y="190.370474394144" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--primary-text)">{} and {:?}</text>
  <rect x="339.9999" y="40" width="278.5714" height="179.012356348117" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="479.2857" y="97.283979957323" text-anchor="middle" font-size="21.322146139654" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Clone/Copy</text>
  <text x="479.2857" y="147.407435413808" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--info-text)">Duplication semantics</text>
  <text x="479.2857" y="190.370474394144" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--info-text)">deep vs bitwise</text>
  <rect x="639.9999" y="40" width="278.5714" height="179.012356348117" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="779.2857" y="97.283979957323" text-anchor="middle" font-size="21.322146139654" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">PartialEq/Eq</text>
  <text x="779.2857" y="147.407435413808" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--ok-text)">Equality comparison</text>
  <text x="779.2857" y="190.370474394144" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--ok-text)">== and !=</text>
  <rect x="940" y="40" width="300" height="179.012356348117" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="1090" y="97.283979957323" text-anchor="middle" font-size="21.322146139654" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">PartialOrd/Ord</text>
  <text x="1090" y="147.407435413808" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--warn-text)">Ordering comparison</text>
  <text x="1090" y="190.370474394144" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--warn-text)">&lt; &gt; &lt;= &gt;= .sort()</text>
  <rect x="40" y="261.975287303765" width="278.5714" height="179.012356348117" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="179.2856" y="319.259267261088" text-anchor="middle" font-size="21.322146139654" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">From/Into</text>
  <text x="179.2856" y="369.382722717573" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--danger-text)">Type conversion</text>
  <text x="179.2856" y="412.34576169791" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--danger-text)">impl From&lt;T&gt;</text>
  <rect x="339.9999" y="261.975287303765" width="278.5714" height="179.012356348117" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="479.2857" y="319.259267261088" text-anchor="middle" font-size="21.322146139654" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Drop</text>
  <text x="479.2857" y="369.382722717573" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--primary-text)">Destructor / cleanup</text>
  <text x="479.2857" y="412.34576169791" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--primary-text)">RAII pattern</text>
  <rect x="639.9999" y="261.975287303765" width="278.5714" height="179.012356348117" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="779.2857" y="319.259267261088" text-anchor="middle" font-size="21.322146139654" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Iterator</text>
  <text x="779.2857" y="369.382722717573" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--info-text)">Lazy sequences</text>
  <text x="779.2857" y="412.34576169791" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--info-text)">.next() -&gt; Option</text>
  <rect x="940" y="261.975287303765" width="300" height="179.012356348117" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="1090" y="319.259267261088" text-anchor="middle" font-size="21.322146139654" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">AsRef/Deref</text>
  <text x="1090" y="369.382722717573" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--ok-text)">Cheap conversion</text>
  <text x="1090" y="412.34576169791" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--ok-text)">auto-dereferencing</text>
  <rect x="211.4285" y="494.691361358787" width="857.1429" height="125.308638641213" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.236095561661" filter="url(#shadow)"/>
  <text x="639.9999" y="548.395079065691" text-anchor="middle" font-size="21.322146139654" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Most can be derived: #[derive(Debug, Clone, PartialEq)]</text>
  <text x="639.9999" y="598.518534522176" text-anchor="middle" font-size="21.322146139654" font-family="Arial, sans-serif" fill="var(--warn-text)">Compiler auto-generates implementations for simple structs/enums</text>
</svg>

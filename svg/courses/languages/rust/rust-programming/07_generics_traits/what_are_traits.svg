<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr_trait" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.6179" font-weight="bold">Traits: Shared Behavior (like interfaces)</text>
  <rect x="40" y="89.7143" width="321.4286" height="182.2858" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="200.7143" y="149.3714" text-anchor="middle" font-size="20.5149" font-weight="bold">trait Summary</text>
  <text x="200.7143" y="199.0857" text-anchor="middle" font-size="20.5149">fn summarize(&amp;self)</text>
  <text x="200.7143" y="242.1714" text-anchor="middle" font-size="20.5149">  -&gt; String</text>
  <rect x="479.2856" y="73.1428" width="321.4286" height="116" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="122.8571" text-anchor="middle" font-size="20.5149" font-weight="bold">NewsArticle</text>
  <text x="639.9999" y="169.2571" text-anchor="middle" font-size="20.5149">impl Summary for ...</text>
  <rect x="479.2856" y="205.7143" width="321.4286" height="116" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="255.4286" text-anchor="middle" font-size="20.5149" font-weight="bold">Tweet</text>
  <text x="639.9999" y="301.8286" text-anchor="middle" font-size="20.5149">impl Summary for ...</text>
  <line x1="361.4286" y1="156.0001" x2="479.2856" y2="129.4857" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_trait)" />
  <line x1="361.4286" y1="205.7143" x2="479.2856" y2="262.0571" stroke="var(--text)" stroke-width="2" marker-end="url(#arr_trait)" />
  <rect x="918.5713" y="73.1428" width="321.4286" height="265.1429" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.2856" y="129.4857" text-anchor="middle" font-size="20.5149" font-weight="bold">Static Dispatch</text>
  <text x="1079.2856" y="175.8857" text-anchor="middle" font-size="20.5149">fn notify&lt;T: Summary&gt;</text>
  <text x="1079.2856" y="222.2858" text-anchor="middle" font-size="20.5149">Monomorphized, inlined</text>
  <text x="1079.2856" y="268.6858" text-anchor="middle" font-size="20.5149" font-weight="bold">Dynamic Dispatch</text>
  <text x="1079.2856" y="315.0858" text-anchor="middle" font-size="20.5149">dyn Summary (vtable)</text>
  <rect x="40" y="371.4286" width="600" height="116" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="339.9999" y="421.1428" text-anchor="middle" font-size="20.5149" font-weight="bold">Trait Bounds: T: Display + Clone</text>
  <text x="339.9999" y="467.5428" text-anchor="middle" font-size="20.5149">Constrain generic types to required behavior</text>
  <rect x="682.8571" y="371.4286" width="557.1429" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="961.4284" y="421.1428" text-anchor="middle" font-size="20.5149" font-weight="bold">Default Implementations</text>
  <text x="961.4284" y="467.5428" text-anchor="middle" font-size="20.5149">Provide fallback method bodies in trait</text>
  <rect x="211.4284" y="537.1429" width="857.1428" height="82.8571" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="593.4857" text-anchor="middle" font-size="20.5149">Traits = Rust's primary abstraction mechanism (no inheritance)</text>
</svg>
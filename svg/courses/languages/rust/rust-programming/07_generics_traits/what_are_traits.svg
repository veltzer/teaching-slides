<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="57.575831496778" width="321.4286" height="193.333404040397" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.179143483694" filter="url(#shadow)"/>
  <text x="200.7143" y="120.848506703395" text-anchor="middle" font-size="21.127418442272" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">trait Summary</text>
  <text x="200.7143" y="173.57578907254" text-anchor="middle" font-size="21.127418442272" font-family="Arial, sans-serif" fill="var(--primary-text)">fn summarize(&amp;self)</text>
  <text x="200.7143" y="219.272738842974" text-anchor="middle" font-size="21.127418442272" font-family="Arial, sans-serif" fill="var(--primary-text)">  -&gt; String</text>
  <rect x="479.2856" y="40" width="321.4286" height="123.030290174473" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.179143483694" filter="url(#shadow)"/>
  <text x="639.9999" y="92.727282369145" text-anchor="middle" font-size="21.127418442272" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">NewsArticle</text>
  <text x="639.9999" y="141.939398438934" text-anchor="middle" font-size="21.127418442272" font-family="Arial, sans-serif" fill="var(--ok-text)">impl Summary for ...</text>
  <rect x="479.2856" y="180.606121671252" width="321.4286" height="123.030290174473" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.179143483694" filter="url(#shadow)"/>
  <text x="639.9999" y="233.333404040397" text-anchor="middle" font-size="21.127418442272" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Tweet</text>
  <text x="639.9999" y="282.545520110186" text-anchor="middle" font-size="21.127418442272" font-family="Arial, sans-serif" fill="var(--warn-text)">impl Summary for ...</text>
  <line x1="361.4286" y1="127.878945362702" x2="479.2856" y2="99.757614967856" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="361.4286" y1="180.606121671252" x2="479.2856" y2="240.363630578513" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="918.5713" y="40" width="321.4286" height="281.212137281908" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.179143483694" filter="url(#shadow)"/>
  <text x="1079.2856" y="99.757614967856" text-anchor="middle" font-size="21.127418442272" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Static Dispatch</text>
  <text x="1079.2856" y="148.969731037646" text-anchor="middle" font-size="21.127418442272" font-family="Arial, sans-serif" fill="var(--info-text)">fn notify&lt;T: Summary&gt;</text>
  <text x="1079.2856" y="198.18195316803" text-anchor="middle" font-size="21.127418442272" font-family="Arial, sans-serif" fill="var(--info-text)">Monomorphized, inlined</text>
  <text x="1079.2856" y="247.394069237819" text-anchor="middle" font-size="21.127418442272" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Dynamic Dispatch</text>
  <text x="1079.2856" y="296.606185307609" text-anchor="middle" font-size="21.127418442272" font-family="Arial, sans-serif" fill="var(--info-text)">dyn Summary (vtable)</text>
  <rect x="40" y="356.36369421487" width="600" height="123.030290174473" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.179143483694" filter="url(#shadow)"/>
  <text x="339.9999" y="409.09087052342" text-anchor="middle" font-size="21.127418442272" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Trait Bounds: T: Display + Clone</text>
  <text x="339.9999" y="458.302986593209" text-anchor="middle" font-size="21.127418442272" font-family="Arial, sans-serif" fill="var(--danger-text)">Constrain generic types to required behavior</text>
  <rect x="682.8571" y="356.36369421487" width="557.1429" height="123.030290174473" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.179143483694" filter="url(#shadow)"/>
  <text x="961.4284" y="409.09087052342" text-anchor="middle" font-size="21.127418442272" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Default Implementations</text>
  <text x="961.4284" y="458.302986593209" text-anchor="middle" font-size="21.127418442272" font-family="Arial, sans-serif" fill="var(--primary-text)">Provide fallback method bodies in trait</text>
  <rect x="211.4284" y="532.121266758488" width="857.1428" height="87.878733241512" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.179143483694" filter="url(#shadow)"/>
  <text x="639.9999" y="591.87877566575" text-anchor="middle" font-size="21.127418442272" font-family="Arial, sans-serif" fill="var(--warn-text)">Traits = Rust's primary abstraction mechanism (no inheritance)</text>
</svg>

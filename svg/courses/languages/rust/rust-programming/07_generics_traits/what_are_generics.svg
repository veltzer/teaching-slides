<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Generics: Write Once, Use with Any Type</ns0:text>
  <ns0:rect x="39.9221" y="101.0526" width="339.3373" height="202.1053" fill="#e3f2fd" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="209.5906" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Generic Functions</ns0:text>
  <ns0:text x="209.5906" y="212.2105" text-anchor="middle" font-size="19.961">fn largest&lt;T&gt;(list: &amp;[T])</ns0:text>
  <ns0:text x="209.5906" y="256" text-anchor="middle" font-size="19.961">Type param T resolved</ns0:text>
  <ns0:text x="209.5906" y="293.0526" text-anchor="middle" font-size="19.961">at compile time</ns0:text>
  <ns0:rect x="429.1618" y="101.0526" width="339.3373" height="202.1053" fill="#f3e5f5" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="598.8304" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Generic Structs</ns0:text>
  <ns0:text x="598.8304" y="212.2105" text-anchor="middle" font-size="19.961">struct Point&lt;T&gt; { x: T }</ns0:text>
  <ns0:text x="598.8304" y="256" text-anchor="middle" font-size="19.961">Point&lt;i32&gt;, Point&lt;f64&gt;</ns0:text>
  <ns0:text x="598.8304" y="293.0526" text-anchor="middle" font-size="19.961">each a distinct type</ns0:text>
  <ns0:rect x="818.4016" y="101.0526" width="339.3373" height="202.1053" fill="#e8f5e9" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="988.0702" y="161.6842" text-anchor="middle" font-size="19.961" font-weight="bold">Generic Enums</ns0:text>
  <ns0:text x="988.0702" y="212.2105" text-anchor="middle" font-size="19.961">Option&lt;T&gt;, Result&lt;T,E&gt;</ns0:text>
  <ns0:text x="988.0702" y="256" text-anchor="middle" font-size="19.961">Built into the language</ns0:text>
  <ns0:text x="988.0702" y="293.0526" text-anchor="middle" font-size="19.961">used everywhere</ns0:text>
  <ns0:rect x="119.7661" y="353.6842" width="958.1287" height="134.7368" fill="#fff3e0" stroke="#333" stroke-width="3.9922" rx="9.9805" />
  <ns0:text x="598.8304" y="410.9474" text-anchor="middle" font-size="21.9571" font-weight="bold">Monomorphization</ns0:text>
  <ns0:text x="598.8304" y="461.4737" text-anchor="middle" font-size="19.961">Compiler generates specialized code for each concrete type used -- zero runtime cost</ns0:text>
  <ns0:rect x="119.7661" y="538.9474" width="459.1033" height="101.0526" fill="#ffebee" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="349.3177" y="602.9474" text-anchor="middle" font-size="19.961">fn foo&lt;T&gt;(x: T) with i32 -&gt; fn foo_i32(x: i32)</ns0:text>
  <ns0:rect x="618.7914" y="538.9474" width="459.1033" height="101.0526" fill="#ffebee" stroke="#333" stroke-width="1.9961" rx="9.9805" />
  <ns0:text x="848.3431" y="602.9474" text-anchor="middle" font-size="19.961">fn foo&lt;T&gt;(x: T) with f64 -&gt; fn foo_f64(x: f64)</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.6179" font-weight="bold">Generics: Write Once, Use with Any Type</text>
  <rect x="40" y="89.7143" width="364.2858" height="198.8572" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="222.1427" y="149.3714" text-anchor="middle" font-size="20.5149" font-weight="bold">Generic Functions</text>
  <text x="222.1427" y="199.0857" text-anchor="middle" font-size="20.5149">fn largest&lt;T&gt;(list: &amp;[T])</text>
  <text x="222.1427" y="242.1714" text-anchor="middle" font-size="20.5149">Type param T resolved</text>
  <text x="222.1427" y="278.6285" text-anchor="middle" font-size="20.5149">at compile time</text>
  <rect x="457.8571" y="89.7143" width="364.2858" height="198.8572" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="639.9999" y="149.3714" text-anchor="middle" font-size="20.5149" font-weight="bold">Generic Structs</text>
  <text x="639.9999" y="199.0857" text-anchor="middle" font-size="20.5149">struct Point&lt;T&gt; { x: T }</text>
  <text x="639.9999" y="242.1714" text-anchor="middle" font-size="20.5149">Point&lt;i32&gt;, Point&lt;f64&gt;</text>
  <text x="639.9999" y="278.6285" text-anchor="middle" font-size="20.5149">each a distinct type</text>
  <rect x="875.7142" y="89.7143" width="364.2858" height="198.8572" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1057.8571" y="149.3714" text-anchor="middle" font-size="20.5149" font-weight="bold">Generic Enums</text>
  <text x="1057.8571" y="199.0857" text-anchor="middle" font-size="20.5149">Option&lt;T&gt;, Result&lt;T,E&gt;</text>
  <text x="1057.8571" y="242.1714" text-anchor="middle" font-size="20.5149">Built into the language</text>
  <text x="1057.8571" y="278.6285" text-anchor="middle" font-size="20.5149">used everywhere</text>
  <rect x="125.7142" y="338.2857" width="1028.5714" height="132.5714" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="639.9999" y="394.6286" text-anchor="middle" font-size="22.5664" font-weight="bold">Monomorphization</text>
  <text x="639.9999" y="444.3429" text-anchor="middle" font-size="20.5149">Compiler generates specialized code for each concrete type used -- zero runtime cost</text>
  <rect x="125.7142" y="520.5715" width="492.8571" height="99.4285" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="372.1427" y="583.5429" text-anchor="middle" font-size="20.5149">fn foo&lt;T&gt;(x: T) with i32 -&gt; fn foo_i32(x: i32)</text>
  <rect x="661.4284" y="520.5715" width="492.8571" height="99.4285" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="907.8571" y="583.5429" text-anchor="middle" font-size="20.5149">fn foo&lt;T&gt;(x: T) with f64 -&gt; fn foo_f64(x: f64)</text>
</svg>
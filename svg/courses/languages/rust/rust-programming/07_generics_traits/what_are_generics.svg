<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Generics: Write Once, Use with Any Type</text>
  <rect x="42.6667" y="108" width="362.6667" height="216" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="224" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Generic Functions</text>
  <text x="224" y="226.8" text-anchor="middle" font-size="21.3333">fn largest&lt;T&gt;(list: &amp;[T])</text>
  <text x="224" y="273.6" text-anchor="middle" font-size="21.3333">Type param T resolved</text>
  <text x="224" y="313.2" text-anchor="middle" font-size="21.3333">at compile time</text>
  <rect x="458.6667" y="108" width="362.6667" height="216" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Generic Structs</text>
  <text x="640" y="226.8" text-anchor="middle" font-size="21.3333">struct Point&lt;T&gt; { x: T }</text>
  <text x="640" y="273.6" text-anchor="middle" font-size="21.3333">Point&lt;i32&gt;, Point&lt;f64&gt;</text>
  <text x="640" y="313.2" text-anchor="middle" font-size="21.3333">each a distinct type</text>
  <rect x="874.6667" y="108" width="362.6667" height="216" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1056" y="172.8" text-anchor="middle" font-size="21.3333" font-weight="bold">Generic Enums</text>
  <text x="1056" y="226.8" text-anchor="middle" font-size="21.3333">Option&lt;T&gt;, Result&lt;T,E&gt;</text>
  <text x="1056" y="273.6" text-anchor="middle" font-size="21.3333">Built into the language</text>
  <text x="1056" y="313.2" text-anchor="middle" font-size="21.3333">used everywhere</text>
  <rect x="128" y="378" width="1024" height="144" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="439.2" text-anchor="middle" font-size="23.4667" font-weight="bold">Monomorphization</text>
  <text x="640" y="493.2" text-anchor="middle" font-size="21.3333">Compiler generates specialized code for each concrete type used -- zero runtime cost</text>
  <rect x="128" y="576" width="490.6667" height="108" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="373.3333" y="644.4" text-anchor="middle" font-size="21.3333">fn foo&lt;T&gt;(x: T) with i32 -&gt; fn foo_i32(x: i32)</text>
  <rect x="661.3333" y="576" width="490.6667" height="108" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="10.6667" />
  <text x="906.6667" y="644.4" text-anchor="middle" font-size="21.3333">fn foo&lt;T&gt;(x: T) with f64 -&gt; fn foo_f64(x: f64)</text>
</svg>
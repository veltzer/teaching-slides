<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Wi-Fi monitoring tools by question</text>

  <rect x="40" y="100" width="380" height="200" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="230" y="145" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Live state of my client</text>
  <text x="230" y="190" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Courier New, monospace">iw dev wlan0 link</text>
  <text x="230" y="220" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Courier New, monospace">wpa_cli status</text>
  <text x="230" y="250" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">RSSI, rate, AP</text>

  <rect x="450" y="100" width="380" height="200" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="145" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">What APs can I see?</text>
  <text x="640" y="190" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Courier New, monospace">iw dev wlan0 scan</text>
  <text x="640" y="220" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Courier New, monospace">nmcli dev wifi list</text>
  <text x="640" y="250" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">SSIDs, channels, security</text>

  <rect x="860" y="100" width="380" height="200" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1050" y="145" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">What's on the air?</text>
  <text x="1050" y="190" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Courier New, monospace">tcpdump -i wlan0mon</text>
  <text x="1050" y="220" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Courier New, monospace">wireshark</text>
  <text x="1050" y="250" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">raw 802.11 frames</text>

  <rect x="40" y="340" width="380" height="200" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="230" y="385" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Per-client AP stats</text>
  <text x="230" y="430" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Courier New, monospace">iw dev wlan0 station dump</text>
  <text x="230" y="460" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">tx/rx bytes, retries,</text>
  <text x="230" y="480" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">last signal, current rate</text>

  <rect x="450" y="340" width="380" height="200" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="385" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Long-running metrics</text>
  <text x="640" y="430" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">vendor controller dashboards</text>
  <text x="640" y="460" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">prometheus + node_exporter</text>
  <text x="640" y="490" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">channel utilisation over time</text>

  <rect x="860" y="340" width="380" height="200" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1050" y="385" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Non-Wi-Fi noise</text>
  <text x="1050" y="430" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">USB spectrum analyser</text>
  <text x="1050" y="460" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">(Wi-Spy, Ekahau Sidekick)</text>
  <text x="1050" y="490" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">microwave / video / radar</text>

  <text x="640" y="620" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">Pick by question; don't reach for Wireshark when iw will do</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/></marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Wi-Fi tuning workflow: measure &#8594; change one thing &#8594; re-measure</text>

  <rect x="40" y="100" width="240" height="120" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="155" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. Survey</text>
  <text x="160" y="190" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">channels, RSSI, SNR</text>

  <rect x="320" y="100" width="240" height="120" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="440" y="155" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2. Capture</text>
  <text x="440" y="190" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">retries, slow rates, BA</text>

  <rect x="600" y="100" width="240" height="120" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="720" y="155" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. Diagnose</text>
  <text x="720" y="190" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">coverage / contention / interference</text>

  <rect x="880" y="100" width="360" height="120" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1060" y="155" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">4. Change ONE thing</text>
  <text x="1060" y="190" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">channel, width, rates, QoS</text>

  <line x1="280" y1="160" x2="320" y2="160" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="160" x2="600" y2="160" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="160" x2="880" y2="160" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="320" y="340" width="600" height="120" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="620" y="395" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">5. Re-measure (same locations, same clients)</text>
  <text x="620" y="430" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">if better &#8594; keep it. if worse &#8594; revert. if same &#8594; root cause was elsewhere</text>

  <line x1="1060" y1="220" x2="1060" y2="320" stroke="var(--text)" stroke-width="2"/>
  <line x1="1060" y1="320" x2="920" y2="320" stroke="var(--text)" stroke-width="2"/>
  <line x1="920" y1="320" x2="920" y2="340" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="320" y1="400" x2="160" y2="400" stroke="var(--text)" stroke-width="2"/>
  <line x1="160" y1="400" x2="160" y2="240" stroke="var(--text)" stroke-width="2"/>
  <line x1="160" y1="240" x2="160" y2="220" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="620" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">Loop. Wi-Fi is never &quot;done&quot; &#8212; the environment changes around you.</text>
</svg>

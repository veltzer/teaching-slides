<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/></marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AP deployment architectures</text>

  <!-- Standalone -->
  <rect x="40" y="80" width="380" height="240" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="230" y="115" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Standalone</text>
  <rect x="180" y="160" width="100" height="50" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <text x="230" y="190" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">AP (web UI)</text>
  <text x="230" y="260" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">cheap &#8226; small scale</text>
  <text x="230" y="290" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">manual roaming</text>

  <!-- Controller-based -->
  <rect x="450" y="80" width="380" height="240" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="115" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Controller-based</text>
  <rect x="585" y="135" width="110" height="40" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2" rx="4"/>
  <text x="640" y="160" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">controller</text>
  <rect x="475" y="220" width="80" height="40" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <text x="515" y="245" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">AP</text>
  <rect x="600" y="220" width="80" height="40" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <text x="640" y="245" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">AP</text>
  <rect x="725" y="220" width="80" height="40" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <text x="765" y="245" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">AP</text>
  <line x1="630" y1="175" x2="555" y2="220" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="640" y1="175" x2="640" y2="220" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="650" y1="175" x2="725" y2="220" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="640" y="290" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">central config &#8226; coordinated channels &#8226; fast roaming</text>

  <!-- Mesh -->
  <rect x="860" y="80" width="380" height="240" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1050" y="115" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Mesh</text>
  <rect x="900" y="180" width="80" height="40" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <text x="940" y="205" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">root AP</text>
  <rect x="1010" y="180" width="80" height="40" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <text x="1050" y="205" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">mesh AP</text>
  <rect x="1120" y="180" width="80" height="40" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2" rx="4"/>
  <text x="1160" y="205" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">mesh AP</text>
  <line x1="980" y1="200" x2="1010" y2="200" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <line x1="1090" y1="200" x2="1120" y2="200" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="1050" y="160" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">wireless backhaul</text>
  <text x="1050" y="270" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">no cable to extra APs</text>
  <text x="1050" y="295" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">each hop halves throughput</text>

  <text x="640" y="370" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pick by scale and wiring constraints</text>

  <rect x="40" y="400" width="1200" height="40" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="100" y="425" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Standalone</text>
  <text x="640" y="425" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">home, &#8804; 3 APs, single VLAN, no roaming requirements</text>

  <rect x="40" y="450" width="1200" height="40" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="100" y="475" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Controller</text>
  <text x="640" y="475" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">offices, multi-floor, RF planning, fast roaming, multiple SSIDs/VLANs</text>

  <rect x="40" y="500" width="1200" height="40" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="100" y="525" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Mesh</text>
  <text x="640" y="525" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">retrofits where you can't run cable, large homes, temporary setups</text>

  <text x="640" y="620" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">prefer one extra ethernet drop to mesh</text>
</svg>

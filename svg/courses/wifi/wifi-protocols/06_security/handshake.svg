<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/></marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">WPA2 4-way handshake: deriving session keys from a shared PSK</text>

  <!-- Client -->
  <rect x="40" y="100" width="240" height="100" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Client (Supplicant)</text>
  <text x="160" y="180" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">knows: PSK, SSID, AP MAC</text>

  <!-- AP -->
  <rect x="1000" y="100" width="240" height="100" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1120" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AP (Authenticator)</text>
  <text x="1120" y="180" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">knows: PSK, SSID, client MAC</text>

  <!-- Vertical lines -->
  <line x1="160" y1="200" x2="160" y2="600" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="1120" y1="200" x2="1120" y2="600" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Msg 1: AP -> Client -->
  <line x1="1120" y1="240" x2="160" y2="240" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Msg 1: ANonce</text>
  <text x="640" y="258" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">AP picks a random nonce, sends it</text>

  <!-- Msg 2: Client -> AP -->
  <line x1="160" y1="320" x2="1120" y2="320" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Msg 2: SNonce + MIC</text>
  <text x="640" y="338" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">client picks SNonce, derives PTK, signs the message</text>

  <!-- Msg 3: AP -> Client -->
  <line x1="1120" y1="400" x2="160" y2="400" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="392" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Msg 3: GTK + MIC</text>
  <text x="640" y="418" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">AP also derives PTK, sends broadcast key (GTK), signs</text>

  <!-- Msg 4: Client -> AP -->
  <line x1="160" y1="480" x2="1120" y2="480" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="472" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Msg 4: ACK + MIC</text>
  <text x="640" y="498" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">client confirms; both sides install keys for unicast/broadcast</text>

  <!-- After -->
  <rect x="290" y="540" width="700" height="60" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="565" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">All four frames are sent in the clear!</text>
  <text x="640" y="588" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">An attacker who captures them can attempt offline PSK brute force.</text>
  <text x="640" y="620" text-anchor="middle" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">WPA3 SAE leaks nothing useful</text>
</svg>

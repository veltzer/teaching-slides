<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">WPA2 4-way handshake: deriving session keys from a shared PSK</text>

  <!-- Client -->
  <rect x="40" y="100" width="240" height="100" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="160" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Client (Supplicant)</text>
  <text x="160" y="180" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">knows: PSK, SSID, AP MAC</text>

  <!-- AP -->
  <rect x="1000" y="100" width="240" height="100" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="1120" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AP (Authenticator)</text>
  <text x="1120" y="180" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">knows: PSK, SSID, client MAC</text>

  <!-- Vertical lines -->
  <line x1="160" y1="200" x2="160" y2="600" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="1120" y1="200" x2="1120" y2="600" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Msg 1: AP -> Client -->
  <line x1="1120" y1="240" x2="160" y2="240" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Msg 1: ANonce</text>
  <text x="640" y="258" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">AP picks a random nonce, sends it</text>

  <!-- Msg 2: Client -> AP -->
  <line x1="160" y1="320" x2="1120" y2="320" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Msg 2: SNonce + MIC</text>
  <text x="640" y="338" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">client picks SNonce, derives PTK, signs the message</text>

  <!-- Msg 3: AP -> Client -->
  <line x1="1120" y1="400" x2="160" y2="400" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="392" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Msg 3: GTK + MIC</text>
  <text x="640" y="418" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">AP also derives PTK, sends broadcast key (GTK), signs</text>

  <!-- Msg 4: Client -> AP -->
  <line x1="160" y1="480" x2="1120" y2="480" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="472" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Msg 4: ACK + MIC</text>
  <text x="640" y="498" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">client confirms; both sides install keys for unicast/broadcast</text>

  <!-- After -->
  <rect x="290" y="540" width="700" height="60" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="640" y="565" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">All four frames are sent in the clear!</text>
  <text x="640" y="588" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">An attacker who captures them can attempt offline PSK brute force.</text>
  <text x="640" y="620" text-anchor="middle" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">WPA3 SAE leaks nothing useful</text>
</svg>

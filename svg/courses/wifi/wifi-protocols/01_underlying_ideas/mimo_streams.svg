<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/></marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3x3 MIMO: three spatial streams in the same channel</text>

  <!-- Transmitter -->
  <rect x="40" y="160" width="240" height="380" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="200" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Transmitter</text>
  <text x="160" y="230" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">3 antennas</text>
  <rect x="250" y="240" width="20" height="40" fill="var(--primary-accent)" rx="4"/>
  <rect x="250" y="340" width="20" height="40" fill="var(--primary-accent)" rx="4"/>
  <rect x="250" y="440" width="20" height="40" fill="var(--primary-accent)" rx="4"/>

  <!-- Receiver -->
  <rect x="1000" y="160" width="240" height="380" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1120" y="200" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Receiver</text>
  <text x="1120" y="230" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">3 antennas</text>
  <rect x="1010" y="240" width="20" height="40" fill="var(--info-accent)" rx="4"/>
  <rect x="1010" y="340" width="20" height="40" fill="var(--info-accent)" rx="4"/>
  <rect x="1010" y="440" width="20" height="40" fill="var(--info-accent)" rx="4"/>

  <!-- Direct paths -->
  <line x1="270" y1="260" x2="1010" y2="260" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="270" y1="360" x2="1010" y2="360" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="270" y1="460" x2="1010" y2="460" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Cross-paths (multipath used as additional channels) -->
  <line x1="270" y1="260" x2="1010" y2="360" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="270" y1="260" x2="1010" y2="460" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="270" y1="360" x2="1010" y2="260" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="270" y1="360" x2="1010" y2="460" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="270" y1="460" x2="1010" y2="260" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="270" y1="460" x2="1010" y2="360" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="640" y="180" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">3 independent streams travel through 9 paths</text>
  <text x="640" y="600" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">solid: direct path &#8226; dashed: multipath reflection</text>
  <text x="640" y="620" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">receiver solves H * x = y to recover the three originals</text>
</svg>

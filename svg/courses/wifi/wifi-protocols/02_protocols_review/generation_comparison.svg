<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">802.11 generations: peak rate, channel width, modulation</text>

  <!-- Header row -->
  <rect x="40" y="80" width="180" height="50" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="130" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">amendment</text>
  <rect x="220" y="80" width="180" height="50" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="310" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">band</text>
  <rect x="400" y="80" width="200" height="50" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="500" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">channel</text>
  <rect x="600" y="80" width="200" height="50" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="700" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">modulation</text>
  <rect x="800" y="80" width="200" height="50" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="900" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">streams</text>
  <rect x="1000" y="80" width="240" height="50" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="1120" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">peak rate</text>

  <!-- Row b -->
  <rect x="40" y="140" width="180" height="50" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">802.11b</text>
  <text x="310" y="172" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">2.4 GHz</text>
  <text x="500" y="172" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">22 MHz</text>
  <text x="700" y="172" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">DSSS</text>
  <text x="900" y="172" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">1</text>
  <text x="1120" y="172" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">11 Mbps</text>

  <!-- Row a -->
  <rect x="40" y="200" width="180" height="50" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">802.11a</text>
  <text x="310" y="232" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">5 GHz</text>
  <text x="500" y="232" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">20 MHz</text>
  <text x="700" y="232" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">64-QAM</text>
  <text x="900" y="232" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">1</text>
  <text x="1120" y="232" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">54 Mbps</text>

  <!-- Row g -->
  <rect x="40" y="260" width="180" height="50" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">802.11g</text>
  <text x="310" y="292" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">2.4 GHz</text>
  <text x="500" y="292" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">20 MHz</text>
  <text x="700" y="292" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">64-QAM</text>
  <text x="900" y="292" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">1</text>
  <text x="1120" y="292" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">54 Mbps</text>

  <!-- Row n -->
  <rect x="40" y="320" width="180" height="50" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">802.11n (Wi-Fi 4)</text>
  <text x="310" y="352" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">2.4 + 5 GHz</text>
  <text x="500" y="352" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">40 MHz</text>
  <text x="700" y="352" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">64-QAM</text>
  <text x="900" y="352" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">4</text>
  <text x="1120" y="352" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">600 Mbps</text>

  <!-- Row ac -->
  <rect x="40" y="380" width="180" height="50" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130" y="412" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">802.11ac (Wi-Fi 5)</text>
  <text x="310" y="412" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">5 GHz</text>
  <text x="500" y="412" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">160 MHz</text>
  <text x="700" y="412" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">256-QAM</text>
  <text x="900" y="412" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">8</text>
  <text x="1120" y="412" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">~3.5 Gbps</text>

  <!-- Row ax -->
  <rect x="40" y="440" width="180" height="50" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130" y="472" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">802.11ax (Wi-Fi 6)</text>
  <text x="310" y="472" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">2.4 / 5 / 6 GHz</text>
  <text x="500" y="472" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">160 MHz</text>
  <text x="700" y="472" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">1024-QAM</text>
  <text x="900" y="472" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">8</text>
  <text x="1120" y="472" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">~9.6 Gbps</text>

  <!-- Row be -->
  <rect x="40" y="500" width="180" height="50" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130" y="532" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">802.11be (Wi-Fi 7)</text>
  <text x="310" y="532" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">2.4 / 5 / 6 GHz</text>
  <text x="500" y="532" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">320 MHz</text>
  <text x="700" y="532" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">4096-QAM</text>
  <text x="900" y="532" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">16</text>
  <text x="1120" y="532" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">~46 Gbps</text>

  <text x="640" y="620" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">peak rates assume best case</text>
</svg>

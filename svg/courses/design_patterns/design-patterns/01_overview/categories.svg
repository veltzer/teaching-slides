<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">23 GoF patterns in 3 categories</text>

  <rect x="40" y="80" width="380" height="540" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="230" y="125" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Creational (5)</text>
  <text x="230" y="155" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">how objects come into existence</text>
  <text x="60" y="205" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Singleton</text>
  <text x="60" y="240" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Factory Method</text>
  <text x="60" y="275" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Abstract Factory</text>
  <text x="60" y="310" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Builder</text>
  <text x="60" y="345" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Prototype</text>

  <rect x="450" y="80" width="380" height="540" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="125" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Structural (7)</text>
  <text x="640" y="155" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">how classes and objects compose</text>
  <text x="470" y="205" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Adapter</text>
  <text x="470" y="240" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Bridge</text>
  <text x="470" y="275" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Composite</text>
  <text x="470" y="310" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Decorator</text>
  <text x="470" y="345" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Facade</text>
  <text x="470" y="380" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Flyweight</text>
  <text x="470" y="415" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Proxy</text>

  <rect x="860" y="80" width="380" height="540" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1050" y="125" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Behavioural (11)</text>
  <text x="1050" y="155" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">how objects share work</text>
  <text x="880" y="205" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Chain of Responsibility</text>
  <text x="880" y="235" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Command</text>
  <text x="880" y="265" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Interpreter</text>
  <text x="880" y="295" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Iterator</text>
  <text x="880" y="325" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Mediator</text>
  <text x="880" y="355" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Memento</text>
  <text x="880" y="385" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Observer</text>
  <text x="880" y="415" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">&#8226; State</text>
  <text x="880" y="445" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Strategy</text>
  <text x="880" y="475" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Template Method</text>
  <text x="880" y="505" font-size="15" fill="var(--text)" font-family="Arial, sans-serif">&#8226; Visitor</text>
</svg>

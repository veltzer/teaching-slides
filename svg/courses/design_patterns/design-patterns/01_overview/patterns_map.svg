<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="20.263747655025" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">23 GoF Patterns: Map by Concern</text>

  <rect x="40" y="65.663716814159" width="380" height="554.336283185841" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="230" y="111.858407079646" text-anchor="middle" font-size="22.290122420528" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Creational</text>
  <text x="230" y="142.654867256637" text-anchor="middle" font-size="14.184623358518" fill="var(--primary-text)" font-family="Arial, sans-serif">how objects come into being</text>
  <text x="60" y="209.380530973451" font-size="18.237372889523" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Singleton</text>
  <text x="60" y="255.575221238938" font-size="18.237372889523" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Factory Method</text>
  <text x="60" y="301.769911504425" font-size="18.237372889523" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Abstract Factory</text>
  <text x="60" y="347.964601769912" font-size="18.237372889523" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Builder</text>
  <text x="60" y="394.159292035398" font-size="18.237372889523" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Prototype</text>

  <rect x="450" y="65.663716814159" width="380" height="554.336283185841" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="640" y="111.858407079646" text-anchor="middle" font-size="22.290122420528" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Structural</text>
  <text x="640" y="142.654867256637" text-anchor="middle" font-size="14.184623358518" fill="var(--ok-text)" font-family="Arial, sans-serif">how things compose</text>
  <text x="470" y="199.115044247788" font-size="17.224185506772" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Adapter</text>
  <text x="470" y="240.176991150443" font-size="17.224185506772" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Bridge</text>
  <text x="470" y="281.238938053097" font-size="17.224185506772" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Composite</text>
  <text x="470" y="322.300884955752" font-size="17.224185506772" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Decorator</text>
  <text x="470" y="363.362831858407" font-size="17.224185506772" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Facade</text>
  <text x="470" y="404.424778761062" font-size="17.224185506772" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Flyweight</text>
  <text x="470" y="445.486725663717" font-size="17.224185506772" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Proxy</text>

  <rect x="860" y="65.663716814159" width="380" height="554.336283185841" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="1050" y="111.858407079646" text-anchor="middle" font-size="22.290122420528" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Behavioural</text>
  <text x="1050" y="142.654867256637" text-anchor="middle" font-size="14.184623358518" fill="var(--warn-text)" font-family="Arial, sans-serif">how objects share work</text>
  <text x="880" y="188.849557522124" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Chain of Responsibility</text>
  <text x="880" y="221.699115044248" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Command</text>
  <text x="880" y="254.548672566372" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Iterator</text>
  <text x="880" y="287.398230088496" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Mediator</text>
  <text x="880" y="320.247787610619" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Memento</text>
  <text x="880" y="353.097345132743" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Observer</text>
  <text x="880" y="385.946902654867" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">State</text>
  <text x="880" y="418.796460176991" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Strategy</text>
  <text x="880" y="451.646017699115" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Template Method</text>
  <text x="880" y="484.495575221239" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Visitor</text>
  <text x="880" y="517.345132743363" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Interpreter</text>
</svg>

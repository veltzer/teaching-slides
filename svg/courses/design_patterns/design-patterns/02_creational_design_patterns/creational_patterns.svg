<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Creational Patterns</text>

  <rect x="40" y="87.889908256881" width="382.758620689655" height="255.412844036697" rx="10.49246125174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--primary-text)">Factory Method</text>
  <text x="60.689655172414" y="162.385321100917" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">Subclass decides class</text>
  <text x="60.689655172414" y="194.311926605505" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">to instantiate</text>
  <text x="60.689655172414" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" font-style="italic" fill="var(--primary-text)">Hide concrete types</text>
  <text x="60.689655172414" y="279.449541284404" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--primary-text)">Logger.create(format)</text>
  <text x="60.689655172414" y="306.05504587156" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--primary-text)">  -&gt; JSONLogger / TextLogger</text>

  <rect x="448.620689655172" y="87.889908256881" width="382.758620689655" height="255.412844036697" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--ok-text)">Builder</text>
  <text x="469.310344827586" y="162.385321100917" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">Step-by-step construction</text>
  <text x="469.310344827586" y="194.311926605505" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">For complex objects</text>
  <text x="469.310344827586" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" font-style="italic" fill="var(--ok-text)">Fluent chain</text>
  <text x="469.310344827586" y="279.449541284404" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--ok-text)">Query.builder()</text>
  <text x="469.310344827586" y="298.605504587156" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--ok-text)">  .where(...).limit(10)</text>
  <text x="469.310344827586" y="317.761467889908" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--ok-text)">  .build()</text>

  <rect x="857.241379310345" y="87.889908256881" width="382.758620689655" height="255.412844036697" rx="10.49246125174" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--warn-text)">Singleton</text>
  <text x="877.931034482759" y="162.385321100917" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">One instance globally</text>
  <text x="877.931034482759" y="194.311926605505" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">Lazy or eager init</text>
  <text x="877.931034482759" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" font-style="italic" fill="var(--warn-text)">Often abused</text>
  <text x="877.931034482759" y="279.449541284404" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--warn-text)">Hard to test</text>
  <text x="877.931034482759" y="298.605504587156" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--warn-text)">Hidden coupling</text>
  <text x="877.931034482759" y="317.761467889908" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--warn-text)">Use DI instead</text>

  <rect x="40" y="385.871559633028" width="382.758620689655" height="234.128440366972" rx="10.49246125174" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="423.119266055046" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--info-text)">Abstract Factory</text>
  <text x="60.689655172414" y="455.045871559633" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">Family of related objects</text>
  <text x="60.689655172414" y="481.651376146789" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">Switch the whole family</text>
  <text x="60.689655172414" y="513.577981651376" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">at once</text>
  <text x="60.689655172414" y="556.146788990826" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--info-text)">Themes (DarkTheme.button)</text>

  <rect x="448.620689655172" y="385.871559633028" width="382.758620689655" height="234.128440366972" rx="10.49246125174" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="423.119266055046" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--danger-text)">Prototype</text>
  <text x="469.310344827586" y="455.045871559633" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">Clone existing object</text>
  <text x="469.310344827586" y="481.651376146789" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">Skip expensive init</text>
  <text x="469.310344827586" y="524.220183486239" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--danger-text)">obj.clone() vs new Obj(...)</text>

  <rect x="857.241379310345" y="385.871559633028" width="382.758620689655" height="234.128440366972" rx="10.49246125174" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1048.620689655173" y="423.119266055046" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--text)">When to use</text>
  <text x="877.931034482759" y="455.045871559633" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">Builder: many parameters</text>
  <text x="877.931034482759" y="481.651376146789" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">Factory: hide types</text>
  <text x="877.931034482759" y="508.256880733945" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">Singleton: rarely</text>
  <text x="877.931034482759" y="534.862385321101" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">Prototype: cloning needed</text>
  <text x="877.931034482759" y="572.110091743119" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--text-muted)">Don't pattern-hunt</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="22.290122420528" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Tangled vs Woven: Cross-Cutting Concerns</text>

  <text x="200" y="86.194690265487" text-anchor="middle" font-size="16.21099812402" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Without AOP</text>
  <text x="900" y="86.194690265487" text-anchor="middle" font-size="16.21099812402" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">With AOP</text>

  <rect x="40" y="106.725663716814" width="380" height="133.451327433628" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="60" y="137.522123893805" font-size="15.197810741269" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">OrderService.place</text>
  <text x="60" y="163.185840707965" font-size="13.171435975767" fill="var(--danger-text)" font-family="Courier New, monospace">log.enter()</text>
  <text x="60" y="183.716814159292" font-size="13.171435975767" fill="var(--danger-text)" font-family="Courier New, monospace">checkPerm()</text>
  <text x="60" y="204.247787610619" font-size="13.171435975767" fill="var(--danger-text)" font-family="Courier New, monospace">tx.begin()</text>
  <text x="60" y="224.778761061947" font-size="13.171435975767" font-weight="bold" fill="var(--danger-text)" font-family="Courier New, monospace">save(order)</text>

  <rect x="40" y="260.70796460177" width="380" height="133.451327433628" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="60" y="291.504424778761" font-size="15.197810741269" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">PaymentService.charge</text>
  <text x="60" y="317.16814159292" font-size="13.171435975767" fill="var(--danger-text)" font-family="Courier New, monospace">log.enter()</text>
  <text x="60" y="337.699115044248" font-size="13.171435975767" fill="var(--danger-text)" font-family="Courier New, monospace">checkPerm()</text>
  <text x="60" y="358.230088495575" font-size="13.171435975767" fill="var(--danger-text)" font-family="Courier New, monospace">tx.begin()</text>
  <text x="60" y="378.761061946903" font-size="13.171435975767" font-weight="bold" fill="var(--danger-text)" font-family="Courier New, monospace">charge(card)</text>

  <rect x="40" y="414.690265486726" width="380" height="133.451327433628" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="60" y="445.486725663717" font-size="15.197810741269" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">ShippingService.dispatch</text>
  <text x="60" y="471.150442477876" font-size="13.171435975767" fill="var(--danger-text)" font-family="Courier New, monospace">log.enter()</text>
  <text x="60" y="491.681415929204" font-size="13.171435975767" fill="var(--danger-text)" font-family="Courier New, monospace">checkPerm()</text>
  <text x="60" y="512.212389380531" font-size="13.171435975767" fill="var(--danger-text)" font-family="Courier New, monospace">tx.begin()</text>
  <text x="60" y="532.743362831858" font-size="13.171435975767" font-weight="bold" fill="var(--danger-text)" font-family="Courier New, monospace">send(pkg)</text>

  <text x="230" y="584.070796460177" font-size="14.184623358518" font-style="italic" fill="var(--danger-accent)" font-family="Arial, sans-serif" text-anchor="middle">Same boilerplate copied everywhere</text>

  <path d="M 440 342.83185840708 L 580 342.83185840708" stroke="var(--text-muted)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="510" y="327.433628318584" font-size="13.171435975767" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif" text-anchor="middle">extract</text>
  <text x="510" y="363.362831858407" font-size="13.171435975767" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif" text-anchor="middle">+ weave</text>

  <rect x="610" y="106.725663716814" width="380" height="41.061946902655" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="630" y="133.41592920354" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)" font-family="Courier New, monospace">save(order)</text>

  <rect x="610" y="168.318584070796" width="380" height="41.061946902655" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="630" y="195.008849557522" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)" font-family="Courier New, monospace">charge(card)</text>

  <rect x="610" y="229.911504424779" width="380" height="41.061946902655" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="630" y="256.601769911504" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)" font-family="Courier New, monospace">send(pkg)</text>

  <rect x="610" y="301.769911504425" width="630" height="246.371681415929" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="630" y="332.566371681416" font-size="15.197810741269" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Aspects (defined once)</text>
  <text x="630" y="363.362831858407" font-size="14.184623358518" fill="var(--info-text)" font-family="Courier New, monospace">@Aspect Logging</text>
  <text x="630" y="385.946902654867" font-size="12.158248593015" fill="var(--info-text)" font-family="Courier New, monospace">pointcut: service.*.*</text>
  <text x="630" y="408.530973451327" font-size="14.184623358518" fill="var(--info-text)" font-family="Courier New, monospace">@Aspect Security</text>
  <text x="630" y="431.115044247788" font-size="12.158248593015" fill="var(--info-text)" font-family="Courier New, monospace">pointcut: @RequiresPermission</text>
  <text x="630" y="453.699115044248" font-size="14.184623358518" fill="var(--info-text)" font-family="Courier New, monospace">@Aspect Transaction</text>
  <text x="630" y="476.283185840708" font-size="12.158248593015" fill="var(--info-text)" font-family="Courier New, monospace">pointcut: @Transactional</text>
  <text x="630" y="507.079646017699" font-size="13.171435975767" font-style="italic" fill="var(--info-text)" font-family="Arial, sans-serif">advice: @Before / @Around / @After</text>
  <text x="630" y="532.743362831858" font-size="13.171435975767" font-style="italic" fill="var(--info-text)" font-family="Arial, sans-serif">weaving: compile-time, load-time, runtime</text>

  <text x="800" y="584.070796460177" font-size="14.184623358518" font-style="italic" fill="var(--ok-accent)" font-family="Arial, sans-serif" text-anchor="middle">Business code clean; concerns in one place</text>

  <rect x="40" y="599.469026548673" width="1200" height="20.530973451327" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.079124296508" filter="url(#shadow)"/>
  <text x="640" y="614.867256637168" font-size="13.171435975767" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif" text-anchor="middle">Vocabulary: join point — pointcut — advice — aspect — weaving</text>
</svg>

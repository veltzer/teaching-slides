  <text x="940" y="256.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-accent)">cache hit shortcut</text>

  <rect x="40" y="335.272727272727" width="558.620689655172" height="284.727272727273" rx="10.444659357342" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="319.310344827586" y="366.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--text)">Latency budget (typical)</text>

  <rect x="60.689655172414" y="393.272727272727" width="41.379310344828" height="23.2" rx="3.133397807203" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="122.758620689655" y="411.2" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">5ms — pre-process</text>

  <rect x="60.689655172414" y="424.909090909091" width="62.068965517241" height="23.2" rx="3.133397807203" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="143.448275862069" y="442.836363636364" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">8ms — tokenize</text>

  <rect x="60.689655172414" y="456.545454545455" width="20.689655172414" height="23.2" rx="3.133397807203" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="102.068965517241" y="474.472727272727" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">2ms — cache check</text>

  <rect x="60.689655172414" y="488.181818181818" width="393.103448275862" height="23.2" rx="3.133397807203" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="469.310344827586" y="506.109090909091" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">~50ms — inference</text>

  <rect x="60.689655172414" y="519.818181818182" width="41.379310344828" height="23.2" rx="3.133397807203" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="122.758620689655" y="537.745454545455" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">5ms — post-process</text>

  <text x="60.689655172414" y="572.545454545455" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--text)">Total: ~70ms p50 / ~150ms p99</text>
  <text x="60.689655172414" y="596.8" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">Inference dominates — quantize or distill if budget tight</text>

  <rect x="640" y="335.272727272727" width="558.620689655172" height="284.727272727273" rx="10.444659357342" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="919.310344827586" y="366.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--text)">Cost levers</text>
  <text x="660.689655172414" y="400" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">Distill or quantize</text>
  <text x="660.689655172414" y="430" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">Dynamic batching</text>
  <text x="660.689655172414" y="460" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">Cache repeated queries</text>
  <text x="660.689655172414" y="490" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text)">Stream output</text>

  <text x="919.310344827586" y="514.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" font-weight="bold" fill="var(--text)">Production gotchas</text>
  <text x="660.689655172414" y="546.181818181818" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--danger-accent)">Tokenizer mismatch: silent bad results</text>
  <text x="660.689655172414" y="570.436363636364" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--danger-accent)">PII in logs: compliance violation</text>
  <text x="660.689655172414" y="594.690909090909" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--danger-accent)">Mixed model versions across replicas</text>
</svg>

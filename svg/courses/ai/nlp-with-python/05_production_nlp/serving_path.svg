  <rect x="40" y="103.272727272727" width="165.51724137931" height="84.363636363636" rx="10.444659357342" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.758620689655" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--primary-text)">Client</text>
  <text x="122.758620689655" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-text)">raw text</text>

  <rect x="246.896551724138" y="103.272727272727" width="165.51724137931" height="84.363636363636" rx="10.444659357342" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--info-text)">Pre-process</text>
  <text x="329.655172413793" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--info-text)">strip PII, validate</text>

  <rect x="453.793103448276" y="103.272727272727" width="165.51724137931" height="84.363636363636" rx="10.444659357342" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="536.551724137931" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--info-text)">Tokenize</text>
  <text x="536.551724137931" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--info-text)">pinned to model</text>

  <rect x="660.689655172414" y="103.272727272727" width="165.51724137931" height="84.363636363636" rx="10.444659357342" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="743.448275862069" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--warn-text)">Cache lookup</text>
  <text x="743.448275862069" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">hash → result?</text>

  <rect x="867.586206896552" y="103.272727272727" width="165.51724137931" height="84.363636363636" rx="10.444659357342" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--primary-text)">Inference</text>
  <text x="950.344827586207" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-text)">batched on GPU</text>

  <rect x="1074.48275862069" y="103.272727272727" width="165.51724137931" height="84.363636363636" rx="10.444659357342" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1157.241379310345" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--ok-text)">Post-process</text>
  <text x="1157.241379310345" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">format, redact</text>

  <path d="M 205.51724137931 145.454545454545 L 246.896551724138 145.454545454545" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 412.413793103448 145.454545454545 L 453.793103448276 145.454545454545" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 619.310344827586 145.454545454545 L 660.689655172414 145.454545454545" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 826.206896551724 145.454545454545 L 867.586206896552 145.454545454545" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1033.103448275862 145.454545454545 L 1074.48275862069 145.454545454545" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--code-text)">NLP with Python</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="115" y="240" width="170" height="60" rx="10" fill="var(--surface)"/>
  <text x="200" y="277" font-size="19" fill="var(--text)">Raw Text</text>
  <rect x="335" y="240" width="170" height="60" rx="10" fill="var(--primary-fill)"/>
  <text x="420" y="277" font-size="19" fill="var(--primary-text)">Tokenize</text>
  <rect x="555" y="240" width="170" height="60" rx="10" fill="var(--info-fill)"/>
  <text x="640" y="277" font-size="19" fill="var(--info-text)">Vectorize</text>
  <rect x="775" y="240" width="170" height="60" rx="10" fill="var(--warn-fill)"/>
  <text x="860" y="277" font-size="19" fill="var(--warn-text)">Model</text>
  <rect x="995" y="240" width="170" height="60" rx="10" fill="var(--ok-fill)"/>
  <text x="1080" y="277" font-size="19" fill="var(--ok-text)">Prediction</text>
  <line x1="290" y1="270" x2="322" y2="270" stroke="var(--text-muted)" stroke-width="3"/>
  <polygon points="332,270 320,263 320,277" fill="var(--text-muted)"/>
  <line x1="510" y1="270" x2="542" y2="270" stroke="var(--text-muted)" stroke-width="3"/>
  <polygon points="552,270 540,263 540,277" fill="var(--text-muted)"/>
  <line x1="730" y1="270" x2="762" y2="270" stroke="var(--text-muted)" stroke-width="3"/>
  <polygon points="772,270 760,263 760,277" fill="var(--text-muted)"/>
  <line x1="950" y1="270" x2="982" y2="270" stroke="var(--text-muted)" stroke-width="3"/>
  <polygon points="992,270 980,263 980,277" fill="var(--text-muted)"/>
  <line x1="420" y1="300" x2="230" y2="380" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="420" y1="300" x2="340" y2="380" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="420" y1="300" x2="450" y2="380" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="420" y1="300" x2="560" y2="380" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="182" y="380" width="96" height="36" rx="18" fill="var(--primary-accent)"/>
  <text x="230" y="404" font-size="17" fill="var(--primary-text)">the</text>
  <rect x="292" y="380" width="96" height="36" rx="18" fill="var(--primary-accent)"/>
  <text x="340" y="404" font-size="17" fill="var(--primary-text)">movie</text>
  <rect x="402" y="380" width="96" height="36" rx="18" fill="var(--primary-accent)"/>
  <text x="450" y="404" font-size="17" fill="var(--primary-text)">was</text>
  <rect x="512" y="380" width="96" height="36" rx="18" fill="var(--primary-accent)"/>
  <text x="560" y="404" font-size="17" fill="var(--primary-text)">great</text>
  <line x1="1080" y1="300" x2="1080" y2="379" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="850" y="398" font-size="17" text-anchor="end" fill="var(--text-faint)">positive</text>
  <rect x="865" y="379" width="239" height="26" rx="4" fill="var(--ok-fill)"/>
  <text x="1140" y="398" font-size="17" fill="var(--text-faint)">0.92</text>
  <text x="850" y="440" font-size="17" text-anchor="end" fill="var(--text-faint)">negative</text>
  <rect x="865" y="421" width="21" height="26" rx="4" fill="var(--danger-fill)"/>
  <text x="922" y="440" font-size="17" fill="var(--text-faint)">0.08</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">preprocessing • tokenization • TF-IDF • classical models • transformers • production</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

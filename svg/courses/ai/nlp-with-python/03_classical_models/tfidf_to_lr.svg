<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">TF-IDF + Logistic Regression: The Default Baseline</text>

  <rect x="40" y="102.142857142857" width="235.714285714286" height="82.857142857143" rx="8.427360687859" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="157.857142857143" y="133.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.801301289735" font-weight="bold" fill="var(--info-text)">Document</text>
  <text x="157.857142857143" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">"great movie, loved it"</text>

  <rect x="329.285714285714" y="102.142857142857" width="235.714285714286" height="82.857142857143" rx="8.427360687859" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="447.142857142857" y="128.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.801301289735" font-weight="bold" fill="var(--info-text)">Tokenize + clean</text>
  <text x="447.142857142857" y="153.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">[great, movie,</text>
  <text x="447.142857142857" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">loved, it]</text>

  <rect x="618.571428571429" y="102.142857142857" width="235.714285714286" height="82.857142857143" rx="8.427360687859" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="736.428571428571" y="128.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.801301289735" font-weight="bold" fill="var(--warn-text)">TF-IDF vector</text>
  <text x="736.428571428571" y="153.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">[0.0, 0.4, 0.0,</text>
  <text x="736.428571428571" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">0.5, 0.0, ...]</text>

  <rect x="907.857142857143" y="102.142857142857" width="235.714285714286" height="82.857142857143" rx="8.427360687859" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1025.714285714286" y="128.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.801301289735" font-weight="bold" fill="var(--primary-text)">Logistic Reg</text>
  <text x="1025.714285714286" y="153.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">w·x + b → sigmoid</text>
  <text x="1025.714285714286" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">P(positive) = 0.92</text>

  <path d="M 275.714285714286 143.571428571429 L 329.285714285714 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 565 143.571428571429 L 618.571428571429 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 854.285714285714 143.571428571429 L 907.857142857143 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="247.142857142857" width="578.571428571429" height="186.428571428571" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="329.285714285714" y="278.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">TF-IDF formula</text>
  <text x="61.428571428571" y="314.464285714286" font-family="Courier New, monospace" font-size="14.747881203753" fill="var(--text)">tf-idf(t,d) = tf(t,d) · idf(t)</text>
  <text x="61.428571428571" y="345.535714285714" font-family="Courier New, monospace" font-size="13.69446111777" fill="var(--text-muted)">tf(t,d) = count of t in d / |d|</text>
  <text x="61.428571428571" y="369.357142857143" font-family="Courier New, monospace" font-size="13.69446111777" fill="var(--text-muted)">idf(t) = log(N / df(t))</text>
  <text x="61.428571428571" y="400.428571428571" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Common words → low weight</text>
  <text x="61.428571428571" y="421.142857142857" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Rare distinctive words → high weight</text>

  <rect x="661.428571428571" y="247.142857142857" width="578.571428571429" height="186.428571428571" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950.714285714286" y="278.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Why this baseline first</text>
  <text x="682.857142857143" y="320" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Trains in seconds</text>
  <text x="682.857142857143" y="350" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Often beats fancy models</text>
  <text x="682.857142857143" y="380" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Calibrated probabilities</text>
  <text x="682.857142857143" y="415" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">Run before any transformer</text>

  <rect x="40" y="464.642857142857" width="1200" height="155.357142857143" rx="10.534200859823" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--ok-text)">Inspectable coefficients</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">"loved" → +1.8, "great" → +1.4, "boring" → -1.6</text>
  <text x="640" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">Sanity check</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.245046200557" font-weight="bold" fill="var(--text)">Classical vs Modern NLP Pipeline</text>

  <text x="308.965517241379" y="103.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889318714684" font-weight="bold" fill="var(--text-muted)">Classical</text>
  <text x="971.034482758621" y="103.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889318714684" font-weight="bold" fill="var(--text-muted)">Modern</text>

  <line x1="640" y1="82.181818181818" x2="640" y2="609.454545454545" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="164.137931034483" y="145.454545454545" width="289.655172413793" height="63.272727272727" rx="8.355727485873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="308.965517241379" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--info-text)">Tokenize</text>

  <rect x="164.137931034483" y="229.818181818182" width="289.655172413793" height="63.272727272727" rx="8.355727485873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="308.965517241379" y="266.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--info-text)">Normalize, stem, lemmatize</text>

  <rect x="164.137931034483" y="314.181818181818" width="289.655172413793" height="63.272727272727" rx="8.355727485873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="308.965517241379" y="351.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--info-text)">Vectorize (TF-IDF, BoW)</text>

  <rect x="164.137931034483" y="398.545454545455" width="289.655172413793" height="63.272727272727" rx="8.355727485873" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="308.965517241379" y="435.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--primary-text)">Linear model</text>

  <rect x="164.137931034483" y="482.909090909091" width="289.655172413793" height="63.272727272727" rx="8.355727485873" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="308.965517241379" y="519.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--ok-text)">Predict</text>

  <path d="M 308.965517241379 208.727272727273 L 308.965517241379 229.818181818182" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 308.965517241379 293.090909090909 L 308.965517241379 314.181818181818" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 308.965517241379 377.454545454545 L 308.965517241379 398.545454545455" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 308.965517241379 461.818181818182 L 308.965517241379 482.909090909091" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="826.206896551724" y="145.454545454545" width="289.655172413793" height="63.272727272727" rx="8.355727485873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.034482758621" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--info-text)">Subword tokenize</text>

  <rect x="826.206896551724" y="229.818181818182" width="289.655172413793" height="63.272727272727" rx="8.355727485873" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.034482758621" y="266.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--primary-text)">Pretrained transformer</text>

  <rect x="826.206896551724" y="314.181818181818" width="289.655172413793" height="63.272727272727" rx="8.355727485873" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.034482758621" y="351.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--primary-text)">Fine-tune or zero-shot</text>

  <rect x="826.206896551724" y="398.545454545455" width="289.655172413793" height="63.272727272727" rx="8.355727485873" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.034482758621" y="435.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--ok-text)">Predict</text>

  <path d="M 971.034482758621 208.727272727273 L 971.034482758621 229.818181818182" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 971.034482758621 293.090909090909 L 971.034482758621 314.181818181818" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 971.034482758621 377.454545454545 L 971.034482758621 398.545454545455" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="562" width="537.931034482759" height="58" rx="6.266795614405" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="308.965517241379" y="588.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--text)">Strong baseline, tiny compute</text>
  <text x="308.965517241379" y="609.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">Interpretable, fast, low data</text>

  <rect x="702.068965517241" y="562" width="537.931034482759" height="58" rx="6.266795614405" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="971.034482758621" y="588.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--text)">SOTA, transfer learning</text>
  <text x="971.034482758621" y="609.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">GPU helpful, more cost, hides errors</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1000" height="500" fill="var(--bg)" rx="6.0059"/>
  <rect x="186.875" y="126.875" width="187.5" height="93.75" rx="6.0059" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="280.625" y="165.9375" font-family="Arial, sans-serif" font-size="17.1875" font-weight="bold" fill="var(--bg)" text-anchor="middle">PROMPT</text>
  <text x="280.625" y="187.8125" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--primary-accent)" text-anchor="middle">Describe your problem</text>
  <text x="280.625" y="203.4375" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--primary-accent)" text-anchor="middle">or code task</text>
  <line x1="374.375" y1="173.75" x2="436.875" y2="173.75" stroke="var(--text-muted)" stroke-width="1.561" marker-end="url(#arrow)" />
  <rect x="436.875" y="126.875" width="187.5" height="93.75" rx="6.0059" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="530.625" y="165.9375" font-family="Arial, sans-serif" font-size="17.1875" font-weight="bold" fill="var(--bg)" text-anchor="middle">RESPONSE</text>
  <text x="530.625" y="187.8125" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--ok-accent)" text-anchor="middle">AI generates code,</text>
  <text x="530.625" y="203.4375" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--ok-accent)" text-anchor="middle">explanation, or fix</text>
  <line x1="624.375" y1="173.75" x2="686.875" y2="173.75" stroke="var(--text-muted)" stroke-width="1.561" marker-end="url(#arrow)" />
  <rect x="686.875" y="126.875" width="187.5" height="93.75" rx="6.0059" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="780.625" y="165.9375" font-family="Arial, sans-serif" font-size="17.1875" font-weight="bold" fill="var(--bg)" text-anchor="middle">REFINE</text>
  <text x="780.625" y="187.8125" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--warn-accent)" text-anchor="middle">Review, test, and</text>
  <text x="780.625" y="203.4375" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--warn-accent)" text-anchor="middle">iterate on output</text>
  <path d="M 780.625 220.625 Q 780.625 267.5 530.625 267.5 Q 280.625 267.5 280.625 220.625" stroke="var(--info-border)" stroke-width="1.561" fill="none" stroke-dasharray="4.6829 3.122" marker-end="url(#arrow)" />
  <text x="530.625" y="283.125" font-family="Arial, sans-serif" font-size="10.1562" fill="var(--info-accent)" text-anchor="middle">iterate until satisfied</text>
  <text x="190" y="330" font-family="Arial, sans-serif" font-size="14.0625" font-weight="bold" fill="var(--primary-accent)">When to Use Chat AI</text>
  <text x="655.625" y="330" font-family="Arial, sans-serif" font-size="14.0625" font-weight="bold" fill="var(--ok-accent)">When to Use IDE AI</text>
  <rect x="186.875" y="341.7187" width="437.5" height="109.375" rx="6.0059" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="202.5" y="362.8125" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--primary-accent)">• Exploring unfamiliar technologies or APIs</text>
  <text x="202.5" y="381.5625" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--primary-accent)">• Designing architecture and brainstorming solutions</text>
  <text x="202.5" y="400.3125" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--primary-accent)">• Debugging tricky errors with full context</text>
  <text x="202.5" y="419.0625" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--primary-accent)">• Generating boilerplate or scaffold code from scratch</text>
  <text x="202.5" y="437.8125" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--primary-accent)">• Long multi-turn conversations with deep context</text>
  <rect x="655.625" y="341.7187" width="437.5" height="109.375" rx="6.0059" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="671.25" y="362.8125" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--ok-accent)">• Inline autocomplete while typing code</text>
  <text x="671.25" y="381.5625" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--ok-accent)">• Quick refactoring within the editor context</text>
  <text x="671.25" y="400.3125" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--ok-accent)">• Real-time suggestions tied to open files</text>
  <text x="671.25" y="419.0625" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--ok-accent)">• Test generation for the current function</text>
  <text x="671.25" y="437.8125" font-family="Arial, sans-serif" font-size="10.9375" fill="var(--ok-accent)">• Navigating and explaining existing code</text>
  <text x="190" y="478.4375" font-family="Arial, sans-serif" font-size="14.0625" font-weight="bold" fill="var(--text-muted)">Prompting Strategies for Code Generation</text>
  <rect x="186.875" y="490.1562" width="210.9375" height="70.3125" rx="6.0059" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="292.3437" y="508.9062" font-family="Arial, sans-serif" font-size="10.9375" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Be Specific</text>
  <text x="292.3437" y="525.3124" font-family="Arial, sans-serif" font-size="10.1562" fill="var(--text)" text-anchor="middle">Language, version, framework,</text>
  <text x="292.3437" y="539.375" font-family="Arial, sans-serif" font-size="10.1562" fill="var(--text)" text-anchor="middle">style guide, and constraints</text>
  <text x="292.3437" y="553.4375" font-family="Arial, sans-serif" font-size="10.1562" fill="var(--text)" text-anchor="middle">must all be stated explicitly</text>
  <rect x="413.4375" y="490.1562" width="210.9375" height="70.3125" rx="6.0059" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="518.9063" y="508.9062" font-family="Arial, sans-serif" font-size="10.9375" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Provide Context</text>
  <text x="518.9063" y="525.3124" font-family="Arial, sans-serif" font-size="10.1562" fill="var(--text)" text-anchor="middle">Paste relevant code snippets,</text>
  <text x="518.9063" y="539.375" font-family="Arial, sans-serif" font-size="10.1562" fill="var(--text)" text-anchor="middle">error messages, or data</text>
  <text x="518.9063" y="553.4375" font-family="Arial, sans-serif" font-size="10.1562" fill="var(--text)" text-anchor="middle">samples before asking</text>
  <rect x="640" y="490.1562" width="210.9375" height="70.3125" rx="6.0059" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="745.4687" y="508.9062" font-family="Arial, sans-serif" font-size="10.9375" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Iterate Quickly</text>
  <text x="745.4687" y="525.3124" font-family="Arial, sans-serif" font-size="10.1562" fill="var(--text)" text-anchor="middle">Accept partial output, test it,</text>
  <text x="745.4687" y="539.375" font-family="Arial, sans-serif" font-size="10.1562" fill="var(--text)" text-anchor="middle">then ask for fixes or changes</text>
  <text x="745.4687" y="553.4375" font-family="Arial, sans-serif" font-size="10.1562" fill="var(--text)" text-anchor="middle">in the same conversation</text>
  <rect x="866.5625" y="490.1562" width="226.5625" height="70.3125" rx="6.0059" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="979.8438" y="508.9062" font-family="Arial, sans-serif" font-size="10.9375" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Verify Output</text>
  <text x="979.8438" y="525.3124" font-family="Arial, sans-serif" font-size="10.1562" fill="var(--text)" text-anchor="middle">Run tests, check logic, and</text>
  <text x="979.8438" y="539.375" font-family="Arial, sans-serif" font-size="10.1562" fill="var(--text)" text-anchor="middle">review security implications</text>
  <text x="979.8438" y="553.4375" font-family="Arial, sans-serif" font-size="10.1562" fill="var(--text)" text-anchor="middle">before using in production</text>
</svg>
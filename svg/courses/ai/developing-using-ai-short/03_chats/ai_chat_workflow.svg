<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="819.8559" height="409.9279" fill="var(--bg)" rx="4.924" />
  <rect x="153.2106" y="104.0192" width="153.723" height="76.8615" rx="4.924" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="1.6397" />
  <text x="230.0721" y="136.0448" font-family="Arial, sans-serif" font-size="14.0913" font-weight="bold" fill="var(--bg)" text-anchor="middle">PROMPT</text>
  <text x="230.0721" y="153.9792" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">Describe your problem</text>
  <text x="230.0721" y="166.7894" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">or code task</text>
  <line x1="306.9335" y1="142.45" x2="358.1745" y2="142.45" stroke="var(--text-muted)" stroke-width="1.2798" marker-end="url(#arrow)" />
  <rect x="358.1745" y="104.0192" width="153.723" height="76.8615" rx="4.924" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="1.6397" />
  <text x="435.036" y="136.0448" font-family="Arial, sans-serif" font-size="14.0913" font-weight="bold" fill="var(--bg)" text-anchor="middle">RESPONSE</text>
  <text x="435.036" y="153.9792" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">AI generates code,</text>
  <text x="435.036" y="166.7894" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">explanation, or fix</text>
  <line x1="511.8975" y1="142.45" x2="563.1385" y2="142.45" stroke="var(--text-muted)" stroke-width="1.2798" marker-end="url(#arrow)" />
  <rect x="563.1385" y="104.0192" width="153.723" height="76.8615" rx="4.924" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="1.6397" />
  <text x="640" y="136.0448" font-family="Arial, sans-serif" font-size="14.0913" font-weight="bold" fill="var(--bg)" text-anchor="middle">REFINE</text>
  <text x="640" y="153.9792" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">Review, test, and</text>
  <text x="640" y="166.7894" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">iterate on output</text>
  <path d="M 640 180.8807 Q 640 219.3114 435.036 219.3114 Q 230.0721 219.3114 230.0721 180.8807" stroke="var(--info-border)" stroke-width="1.2798" fill="none" stroke-dasharray="3.8393 2.5596" marker-end="url(#arrow)" />
  <text x="435.036" y="232.1217" font-family="Arial, sans-serif" font-size="10" fill="var(--info-accent)" text-anchor="middle">iterate until satisfied</text>
  <text x="155.7726" y="270.5524" font-family="Arial, sans-serif" font-size="11.5292" font-weight="bold" fill="var(--primary-accent)">When to Use Chat AI</text>
  <text x="537.518" y="270.5524" font-family="Arial, sans-serif" font-size="11.5292" font-weight="bold" fill="var(--ok-accent)">When to Use IDE AI</text>
  <rect x="153.2106" y="280.1601" width="358.6869" height="89.6717" rx="4.924" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.6397" />
  <text x="166.0208" y="297.454" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">• Exploring unfamiliar technologies or APIs</text>
  <text x="166.0208" y="312.8263" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">• Designing architecture and brainstorming solutions</text>
  <text x="166.0208" y="328.1986" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">• Debugging tricky errors with full context</text>
  <text x="166.0208" y="343.5709" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">• Generating boilerplate or scaffold code from scratch</text>
  <text x="166.0208" y="358.9432" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">• Long multi-turn conversations with deep context</text>
  <rect x="537.518" y="280.1601" width="358.6869" height="89.6717" rx="4.924" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.6397" />
  <text x="550.3283" y="297.454" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">• Inline autocomplete while typing code</text>
  <text x="550.3283" y="312.8263" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">• Quick refactoring within the editor context</text>
  <text x="550.3283" y="328.1986" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">• Real-time suggestions tied to open files</text>
  <text x="550.3283" y="343.5709" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">• Test generation for the current function</text>
  <text x="550.3283" y="358.9432" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">• Navigating and explaining existing code</text>
  <text x="155.7726" y="392.2498" font-family="Arial, sans-serif" font-size="11.5292" font-weight="bold" fill="var(--text-muted)">Prompting Strategies for Code Generation</text>
  <rect x="153.2106" y="401.8574" width="172.9384" height="57.6461" rx="4.924" fill="var(--surface)" stroke="var(--border)" stroke-width="0.8199" />
  <text x="239.6797" y="417.2297" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Be Specific</text>
  <text x="239.6797" y="430.6805" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">Language, version, framework,</text>
  <text x="239.6797" y="442.2098" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">style guide, and constraints</text>
  <text x="239.6797" y="453.739" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">must all be stated explicitly</text>
  <rect x="338.9592" y="401.8574" width="172.9384" height="57.6461" rx="4.924" fill="var(--surface)" stroke="var(--border)" stroke-width="0.8199" />
  <text x="425.4284" y="417.2297" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Provide Context</text>
  <text x="425.4284" y="430.6805" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">Paste relevant code snippets,</text>
  <text x="425.4284" y="442.2098" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">error messages, or data</text>
  <text x="425.4284" y="453.739" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">samples before asking</text>
  <rect x="524.7078" y="401.8574" width="172.9384" height="57.6461" rx="4.924" fill="var(--surface)" stroke="var(--border)" stroke-width="0.8199" />
  <text x="611.1769" y="417.2297" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Iterate Quickly</text>
  <text x="611.1769" y="430.6805" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">Accept partial output, test it,</text>
  <text x="611.1769" y="442.2098" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">then ask for fixes or changes</text>
  <text x="611.1769" y="453.739" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">in the same conversation</text>
  <rect x="710.4564" y="401.8574" width="185.7486" height="57.6461" rx="4.924" fill="var(--surface)" stroke="var(--border)" stroke-width="0.8199" />
  <text x="803.3307" y="417.2297" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Verify Output</text>
  <text x="803.3307" y="430.6805" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">Run tests, check logic, and</text>
  <text x="803.3307" y="442.2098" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">review security implications</text>
  <text x="803.3307" y="453.739" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">before using in production</text>
</svg>
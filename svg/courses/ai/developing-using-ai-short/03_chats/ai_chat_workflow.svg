<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="672.6488" height="336.3244" fill="var(--bg)" rx="4.9227" />
  <rect x="240.6148" y="145.6621" width="126.1217" height="63.0609" rx="4.9227" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="1.508" />
  <text x="303.6757" y="171.9374" font-family="Arial, sans-serif" font-size="11.5612" font-weight="bold" fill="var(--bg)" text-anchor="middle">PROMPT</text>
  <text x="303.6757" y="186.6516" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">Describe your problem</text>
  <text x="303.6757" y="197.1617" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">or code task</text>
  <line x1="366.7364" y1="177.1926" x2="408.777" y2="177.1926" stroke="var(--text-muted)" stroke-width="0.965" marker-end="url(#arrow)" />
  <rect x="408.777" y="145.6621" width="126.1217" height="63.0609" rx="4.9227" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="1.508" />
  <text x="471.8378" y="171.9374" font-family="Arial, sans-serif" font-size="11.5612" font-weight="bold" fill="var(--bg)" text-anchor="middle">RESPONSE</text>
  <text x="471.8378" y="186.6516" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">AI generates code,</text>
  <text x="471.8378" y="197.1617" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">explanation, or fix</text>
  <line x1="534.8986" y1="177.1926" x2="576.9391" y2="177.1926" stroke="var(--text-muted)" stroke-width="0.965" marker-end="url(#arrow)" />
  <rect x="576.9391" y="145.6621" width="126.1217" height="63.0609" rx="4.9227" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="1.508" />
  <text x="640" y="171.9374" font-family="Arial, sans-serif" font-size="11.5612" font-weight="bold" fill="var(--bg)" text-anchor="middle">REFINE</text>
  <text x="640" y="186.6516" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">Review, test, and</text>
  <text x="640" y="197.1617" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">iterate on output</text>
  <path d="M 640 208.7229 Q 640 240.2533 471.8378 240.2533 Q 303.6757 240.2533 303.6757 208.7229" stroke="var(--info-border)" stroke-width="0.965" fill="none" stroke-dasharray="2.8948 1.9299" marker-end="url(#arrow)" />
  <text x="471.8378" y="250.7635" font-family="Arial, sans-serif" font-size="10" fill="var(--info-accent)" text-anchor="middle">iterate until satisfied</text>
  <text x="242.7168" y="282.2939" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)">When to Use Chat AI</text>
  <text x="555.9189" y="282.2939" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">When to Use IDE AI</text>
  <rect x="240.6148" y="290.1765" width="294.2838" height="73.571" rx="4.9227" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.508" />
  <text x="251.1249" y="304.3652" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">• Exploring unfamiliar technologies or APIs</text>
  <text x="251.1249" y="316.9774" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">• Designing architecture and brainstorming solutions</text>
  <text x="251.1249" y="329.5896" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">• Debugging tricky errors with full context</text>
  <text x="251.1249" y="342.2017" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">• Generating boilerplate or scaffold code from scratch</text>
  <text x="251.1249" y="354.8139" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">• Long multi-turn conversations with deep context</text>
  <rect x="555.9189" y="290.1765" width="294.2838" height="73.571" rx="4.9227" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.508" />
  <text x="566.4291" y="304.3652" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">• Inline autocomplete while typing code</text>
  <text x="566.4291" y="316.9774" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">• Quick refactoring within the editor context</text>
  <text x="566.4291" y="329.5896" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">• Real-time suggestions tied to open files</text>
  <text x="566.4291" y="342.2017" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">• Test generation for the current function</text>
  <text x="566.4291" y="354.8139" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">• Navigating and explaining existing code</text>
  <text x="242.7168" y="382.1402" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--text-muted)">Prompting Strategies for Code Generation</text>
  <rect x="240.6148" y="390.0227" width="141.8869" height="47.2956" rx="4.9227" fill="var(--surface)" stroke="var(--border)" stroke-width="0.754" />
  <text x="311.5582" y="402.6349" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Be Specific</text>
  <text x="311.5582" y="413.6706" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">Language, version, framework,</text>
  <text x="311.5582" y="423.1298" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">style guide, and constraints</text>
  <text x="311.5582" y="432.5889" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">must all be stated explicitly</text>
  <rect x="393.0118" y="390.0227" width="141.8869" height="47.2956" rx="4.9227" fill="var(--surface)" stroke="var(--border)" stroke-width="0.754" />
  <text x="463.9552" y="402.6349" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Provide Context</text>
  <text x="463.9552" y="413.6706" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">Paste relevant code snippets,</text>
  <text x="463.9552" y="423.1298" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">error messages, or data</text>
  <text x="463.9552" y="432.5889" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">samples before asking</text>
  <rect x="545.4088" y="390.0227" width="141.8869" height="47.2956" rx="4.9227" fill="var(--surface)" stroke="var(--border)" stroke-width="0.754" />
  <text x="616.3522" y="402.6349" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Iterate Quickly</text>
  <text x="616.3522" y="413.6706" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">Accept partial output, test it,</text>
  <text x="616.3522" y="423.1298" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">then ask for fixes or changes</text>
  <text x="616.3522" y="432.5889" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">in the same conversation</text>
  <rect x="697.8058" y="390.0227" width="152.397" height="47.2956" rx="4.9227" fill="var(--surface)" stroke="var(--border)" stroke-width="0.754" />
  <text x="774.0043" y="402.6349" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Verify Output</text>
  <text x="774.0043" y="413.6706" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">Run tests, check logic, and</text>
  <text x="774.0043" y="423.1298" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">review security implications</text>
  <text x="774.0043" y="432.5889" font-family="Arial, sans-serif" font-size="10" fill="var(--text)" text-anchor="middle">before using in production</text>
</svg>
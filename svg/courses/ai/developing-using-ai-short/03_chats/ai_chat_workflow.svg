<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="999.0244" height="499.5122" fill="var(--bg)" rx="6"/>
  <rect x="46.8293" y="46.8293" width="187.3171" height="93.6585" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="140.4878" y="85.8537" font-family="Arial, sans-serif" font-size="17.1707" font-weight="bold" fill="var(--bg)" text-anchor="middle">PROMPT</text>
  <text x="140.4878" y="107.7073" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--primary-accent)" text-anchor="middle">Describe your problem</text>
  <text x="140.4878" y="123.3171" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--primary-accent)" text-anchor="middle">or code task</text>
  <line x1="234.1463" y1="93.6585" x2="296.5854" y2="93.6585" stroke="var(--text-muted)" stroke-width="1.561" marker-end="url(#arrow)" />
  <rect x="296.5854" y="46.8293" width="187.3171" height="93.6585" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="390.2439" y="85.8537" font-family="Arial, sans-serif" font-size="17.1707" font-weight="bold" fill="var(--bg)" text-anchor="middle">RESPONSE</text>
  <text x="390.2439" y="107.7073" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--ok-accent)" text-anchor="middle">AI generates code,</text>
  <text x="390.2439" y="123.3171" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--ok-accent)" text-anchor="middle">explanation, or fix</text>
  <line x1="483.9024" y1="93.6585" x2="546.3415" y2="93.6585" stroke="var(--text-muted)" stroke-width="1.561" marker-end="url(#arrow)" />
  <rect x="546.3415" y="46.8293" width="187.3171" height="93.6585" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="85.8537" font-family="Arial, sans-serif" font-size="17.1707" font-weight="bold" fill="var(--bg)" text-anchor="middle">REFINE</text>
  <text x="640" y="107.7073" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--warn-accent)" text-anchor="middle">Review, test, and</text>
  <text x="640" y="123.3171" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--warn-accent)" text-anchor="middle">iterate on output</text>
  <path d="M 640 140.4878 Q 640 187.3171 390.2439 187.3171 Q 140.4878 187.3171 140.4878 140.4878" stroke="var(--info-border)" stroke-width="1.561" fill="none" stroke-dasharray="4.6829 3.122" marker-end="url(#arrow)" />
  <text x="390.2439" y="202.9268" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--info-accent)" text-anchor="middle">iterate until satisfied</text>
  <text x="49.9512" y="249.7561" font-family="Arial, sans-serif" font-size="14.0488" font-weight="bold" fill="var(--primary-accent)">When to Use Chat AI</text>
  <text x="515.122" y="249.7561" font-family="Arial, sans-serif" font-size="14.0488" font-weight="bold" fill="var(--ok-accent)">When to Use IDE AI</text>
  <rect x="46.8293" y="261.4634" width="437.0732" height="109.2683" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="62.439" y="282.5366" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--primary-accent)">• Exploring unfamiliar technologies or APIs</text>
  <text x="62.439" y="301.2683" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--primary-accent)">• Designing architecture and brainstorming solutions</text>
  <text x="62.439" y="320" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--primary-accent)">• Debugging tricky errors with full context</text>
  <text x="62.439" y="338.7317" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--primary-accent)">• Generating boilerplate or scaffold code from scratch</text>
  <text x="62.439" y="357.4634" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--primary-accent)">• Long multi-turn conversations with deep context</text>
  <rect x="515.122" y="261.4634" width="437.0732" height="109.2683" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="530.7317" y="282.5366" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--ok-accent)">• Inline autocomplete while typing code</text>
  <text x="530.7317" y="301.2683" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--ok-accent)">• Quick refactoring within the editor context</text>
  <text x="530.7317" y="320" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--ok-accent)">• Real-time suggestions tied to open files</text>
  <text x="530.7317" y="338.7317" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--ok-accent)">• Test generation for the current function</text>
  <text x="530.7317" y="357.4634" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--ok-accent)">• Navigating and explaining existing code</text>
  <text x="49.9512" y="398.0488" font-family="Arial, sans-serif" font-size="14.0488" font-weight="bold" fill="var(--text-muted)">Prompting Strategies for Code Generation</text>
  <rect x="46.8293" y="409.7561" width="210.7317" height="70.2439" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="152.1951" y="428.4878" font-family="Arial, sans-serif" font-size="10.9268" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Be Specific</text>
  <text x="152.1951" y="444.878" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text)" text-anchor="middle">Language, version, framework,</text>
  <text x="152.1951" y="458.9268" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text)" text-anchor="middle">style guide, and constraints</text>
  <text x="152.1951" y="472.9756" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text)" text-anchor="middle">must all be stated explicitly</text>
  <rect x="273.1707" y="409.7561" width="210.7317" height="70.2439" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="378.5366" y="428.4878" font-family="Arial, sans-serif" font-size="10.9268" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Provide Context</text>
  <text x="378.5366" y="444.878" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text)" text-anchor="middle">Paste relevant code snippets,</text>
  <text x="378.5366" y="458.9268" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text)" text-anchor="middle">error messages, or data</text>
  <text x="378.5366" y="472.9756" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text)" text-anchor="middle">samples before asking</text>
  <rect x="499.5122" y="409.7561" width="210.7317" height="70.2439" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="604.878" y="428.4878" font-family="Arial, sans-serif" font-size="10.9268" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Iterate Quickly</text>
  <text x="604.878" y="444.878" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text)" text-anchor="middle">Accept partial output, test it,</text>
  <text x="604.878" y="458.9268" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text)" text-anchor="middle">then ask for fixes or changes</text>
  <text x="604.878" y="472.9756" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text)" text-anchor="middle">in the same conversation</text>
  <rect x="725.8537" y="409.7561" width="226.3415" height="70.2439" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="839.0244" y="428.4878" font-family="Arial, sans-serif" font-size="10.9268" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Verify Output</text>
  <text x="839.0244" y="444.878" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text)" text-anchor="middle">Run tests, check logic, and</text>
  <text x="839.0244" y="458.9268" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text)" text-anchor="middle">review security implications</text>
  <text x="839.0244" y="472.9756" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text)" text-anchor="middle">before using in production</text>
</svg>
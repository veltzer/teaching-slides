<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Flow -->
  <rect x="131.525423728814" y="40" width="264.406779661017" height="119.252336448598" rx="8.39995021596" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.728813559322" y="88.785046728972" text-anchor="middle" font-size="23.09986309389" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">PROMPT</text>
  <text x="263.728813559322" y="126.728971962617" text-anchor="middle" font-size="14.69991287793" fill="var(--primary-text)" font-family="Arial, sans-serif">Describe task</text>

  <line x1="397.966101694915" y1="99.626168224299" x2="485.423728813559" y2="99.626168224299" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="487.457627118644" y="40" width="264.406779661017" height="119.252336448598" rx="8.39995021596" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="619.661016949153" y="88.785046728972" text-anchor="middle" font-size="23.09986309389" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">RESPONSE</text>
  <text x="619.661016949153" y="126.728971962617" text-anchor="middle" font-size="14.69991287793" fill="var(--ok-text)" font-family="Arial, sans-serif">AI generates code</text>

  <line x1="753.898305084746" y1="99.626168224299" x2="841.35593220339" y2="99.626168224299" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="843.389830508475" y="40" width="264.406779661017" height="119.252336448598" rx="8.39995021596" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="975.593220338983" y="88.785046728972" text-anchor="middle" font-size="23.09986309389" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">REFINE</text>
  <text x="975.593220338983" y="126.728971962617" text-anchor="middle" font-size="14.69991287793" fill="var(--warn-text)" font-family="Arial, sans-serif">Review and iterate</text>

  <path d="M 975.593220338983 161.420560747664 Q 975.593220338983 213.457943925234 619.661016949153 213.457943925234 Q 263.728813559322 213.457943925234 263.728813559322 161.420560747664" stroke="var(--info-border)" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="619.661016949153" y="235.140186915888" text-anchor="middle" font-size="13.649919100935" fill="var(--info-accent)" font-family="Arial, sans-serif">iterate</text>

  <!-- Chat vs IDE -->
  <rect x="40" y="267.663551401869" width="584.745762711864" height="195.140186915888" rx="8.39995021596" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.864406779661" y="305.607476635514" text-anchor="middle" font-size="17.849894208915" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Chat AI: best for</text>
  <text x="60.338983050847" y="343.551401869159" font-size="14.69991287793" fill="var(--primary-text)" font-family="Arial, sans-serif">Exploring new APIs</text>
  <text x="60.338983050847" y="370.654205607477" font-size="14.69991287793" fill="var(--primary-text)" font-family="Arial, sans-serif">Architecture design</text>
  <text x="60.338983050847" y="397.757009345794" font-size="14.69991287793" fill="var(--primary-text)" font-family="Arial, sans-serif">Debug with context</text>
  <text x="60.338983050847" y="424.859813084112" font-size="14.69991287793" fill="var(--primary-text)" font-family="Arial, sans-serif">Scaffolding code</text>
  <text x="60.338983050847" y="451.96261682243" font-size="14.69991287793" fill="var(--primary-text)" font-family="Arial, sans-serif">Multi-turn dialogue</text>

  <rect x="655.254237288136" y="267.663551401869" width="584.745762711864" height="195.140186915888" rx="8.39995021596" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="947.118644067797" y="305.607476635514" text-anchor="middle" font-size="17.849894208915" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">IDE AI: best for</text>
  <text x="675.593220338983" y="343.551401869159" font-size="14.69991287793" fill="var(--ok-text)" font-family="Arial, sans-serif">Inline autocomplete</text>
  <text x="675.593220338983" y="370.654205607477" font-size="14.69991287793" fill="var(--ok-text)" font-family="Arial, sans-serif">Quick refactors</text>
  <text x="675.593220338983" y="397.757009345794" font-size="14.69991287793" fill="var(--ok-text)" font-family="Arial, sans-serif">Real-time hints</text>
  <text x="675.593220338983" y="424.859813084112" font-size="14.69991287793" fill="var(--ok-text)" font-family="Arial, sans-serif">Test generation</text>
  <text x="675.593220338983" y="451.96261682243" font-size="14.69991287793" fill="var(--ok-text)" font-family="Arial, sans-serif">Explain code</text>

  <!-- Strategies -->
  <rect x="40" y="484.485981308411" width="284.745762711864" height="135.514018691589" rx="8.39995021596" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="182.372881355932" y="517.009345794393" text-anchor="middle" font-size="15.749906654925" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Be specific</text>
  <text x="182.372881355932" y="554.953271028037" text-anchor="middle" font-size="13.649919100935" fill="var(--text)" font-family="Arial, sans-serif">Language, version</text>
  <text x="182.372881355932" y="582.056074766355" text-anchor="middle" font-size="13.649919100935" fill="var(--text)" font-family="Arial, sans-serif">Constraints</text>

  <rect x="340" y="484.485981308411" width="284.745762711864" height="135.514018691589" rx="8.39995021596" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="482.372881355932" y="517.009345794393" text-anchor="middle" font-size="15.749906654925" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Give context</text>
  <text x="482.372881355932" y="554.953271028037" text-anchor="middle" font-size="13.649919100935" fill="var(--text)" font-family="Arial, sans-serif">Paste code</text>
  <text x="482.372881355932" y="582.056074766355" text-anchor="middle" font-size="13.649919100935" fill="var(--text)" font-family="Arial, sans-serif">Share errors</text>

  <rect x="640" y="484.485981308411" width="284.745762711864" height="135.514018691589" rx="8.39995021596" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="782.372881355932" y="517.009345794393" text-anchor="middle" font-size="15.749906654925" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Iterate</text>
  <text x="782.372881355932" y="554.953271028037" text-anchor="middle" font-size="13.649919100935" fill="var(--text)" font-family="Arial, sans-serif">Test, refine</text>
  <text x="782.372881355932" y="582.056074766355" text-anchor="middle" font-size="13.649919100935" fill="var(--text)" font-family="Arial, sans-serif">Ask follow-ups</text>

  <rect x="940" y="484.485981308411" width="300" height="135.514018691589" rx="8.39995021596" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1089.491525423729" y="517.009345794393" text-anchor="middle" font-size="15.749906654925" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Verify</text>
  <text x="1089.491525423729" y="554.953271028037" text-anchor="middle" font-size="13.649919100935" fill="var(--text)" font-family="Arial, sans-serif">Run tests</text>
  <text x="1089.491525423729" y="582.056074766355" text-anchor="middle" font-size="13.649919100935" fill="var(--text)" font-family="Arial, sans-serif">Review security</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="949.3953" height="446.0553" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="379.6105" y="233.1866" width="178.0117" height="83.6355" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="468.6164" y="268.0346" font-family="Arial, sans-serif" font-size="15.8178" font-weight="bold" fill="var(--bg)" text-anchor="middle">PROMPT</text>
  <text x="468.6164" y="287.5495" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--primary-accent)" text-anchor="middle">Describe your problem</text>
  <text x="468.6164" y="301.4887" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--primary-accent)" text-anchor="middle">or code task</text>
  <line x1="557.622" y1="275.0044" x2="616.9593" y2="275.0044" stroke="var(--text-muted)" stroke-width="0.965" marker-end="url(#arrow)" />
  <rect x="616.9593" y="233.1866" width="178.0117" height="83.6355" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="705.9651" y="268.0346" font-family="Arial, sans-serif" font-size="15.8178" font-weight="bold" fill="var(--bg)" text-anchor="middle">RESPONSE</text>
  <text x="705.9651" y="287.5495" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--ok-accent)" text-anchor="middle">AI generates code,</text>
  <text x="705.9651" y="301.4887" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--ok-accent)" text-anchor="middle">explanation, or fix</text>
  <line x1="794.9708" y1="275.0044" x2="854.308" y2="275.0044" stroke="var(--text-muted)" stroke-width="0.965" marker-end="url(#arrow)" />
  <rect x="854.308" y="233.1866" width="178.0117" height="83.6355" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="943.3139" y="268.0346" font-family="Arial, sans-serif" font-size="15.8178" font-weight="bold" fill="var(--bg)" text-anchor="middle">REFINE</text>
  <text x="943.3139" y="287.5495" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--warn-accent)" text-anchor="middle">Review, test, and</text>
  <text x="943.3139" y="301.4887" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--warn-accent)" text-anchor="middle">iterate on output</text>
  <path d="M 943.3139 316.8219 Q 943.3139 358.6396 705.9651 358.6396 Q 468.6164 358.6396 468.6164 316.8219" stroke="var(--info-border)" stroke-width="0.965" fill="none" stroke-dasharray="2.8948 1.9299" marker-end="url(#arrow)" />
  <text x="705.9651" y="372.5789" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--info-accent)" text-anchor="middle">iterate until satisfied</text>
  <text x="382.5773" y="414.3965" font-family="Arial, sans-serif" font-size="13.6818" font-weight="bold" fill="var(--primary-accent)">When to Use Chat AI</text>
  <text x="824.6395" y="414.3965" font-family="Arial, sans-serif" font-size="13.6818" font-weight="bold" fill="var(--ok-accent)">When to Use IDE AI</text>
  <rect x="379.6105" y="424.851" width="415.3604" height="97.5746" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="394.4447" y="443.6689" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--primary-accent)">• Exploring unfamiliar technologies or APIs</text>
  <text x="394.4447" y="460.3961" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--primary-accent)">• Designing architecture and brainstorming solutions</text>
  <text x="394.4447" y="477.1232" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--primary-accent)">• Debugging tricky errors with full context</text>
  <text x="394.4447" y="493.8502" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--primary-accent)">• Generating boilerplate or scaffold code from scratch</text>
  <text x="394.4447" y="510.5773" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--primary-accent)">• Long multi-turn conversations with deep context</text>
  <rect x="824.6395" y="424.851" width="415.3604" height="97.5746" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="839.4739" y="443.6689" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--ok-accent)">• Inline autocomplete while typing code</text>
  <text x="839.4739" y="460.3961" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--ok-accent)">• Quick refactoring within the editor context</text>
  <text x="839.4739" y="477.1232" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--ok-accent)">• Real-time suggestions tied to open files</text>
  <text x="839.4739" y="493.8502" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--ok-accent)">• Test generation for the current function</text>
  <text x="839.4739" y="510.5773" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--ok-accent)">• Navigating and explaining existing code</text>
  <text x="382.5773" y="546.8192" font-family="Arial, sans-serif" font-size="13.6818" font-weight="bold" fill="var(--text-muted)">Prompting Strategies for Code Generation</text>
  <rect x="379.6105" y="557.2735" width="200.2631" height="62.7265" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="479.742" y="574.0006" font-family="Arial, sans-serif" font-size="13.6818" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Be Specific</text>
  <text x="479.742" y="588.6369" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--text)" text-anchor="middle">Language, version, framework,</text>
  <text x="479.742" y="601.1823" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--text)" text-anchor="middle">style guide, and constraints</text>
  <text x="479.742" y="613.7276" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--text)" text-anchor="middle">must all be stated explicitly</text>
  <rect x="594.7078" y="557.2735" width="200.2631" height="62.7265" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="694.8393" y="574.0006" font-family="Arial, sans-serif" font-size="13.6818" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Provide Context</text>
  <text x="694.8393" y="588.6369" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--text)" text-anchor="middle">Paste relevant code snippets,</text>
  <text x="694.8393" y="601.1823" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--text)" text-anchor="middle">error messages, or data</text>
  <text x="694.8393" y="613.7276" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--text)" text-anchor="middle">samples before asking</text>
  <rect x="809.8052" y="557.2735" width="200.2631" height="62.7265" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="909.9367" y="574.0006" font-family="Arial, sans-serif" font-size="13.6818" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Iterate Quickly</text>
  <text x="909.9367" y="588.6369" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--text)" text-anchor="middle">Accept partial output, test it,</text>
  <text x="909.9367" y="601.1823" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--text)" text-anchor="middle">then ask for fixes or changes</text>
  <text x="909.9367" y="613.7276" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--text)" text-anchor="middle">in the same conversation</text>
  <rect x="1024.9026" y="557.2735" width="215.0974" height="62.7265" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1132.4513" y="574.0006" font-family="Arial, sans-serif" font-size="13.6818" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Verify Output</text>
  <text x="1132.4513" y="588.6369" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--text)" text-anchor="middle">Run tests, check logic, and</text>
  <text x="1132.4513" y="601.1823" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--text)" text-anchor="middle">review security implications</text>
  <text x="1132.4513" y="613.7276" font-family="Arial, sans-serif" font-size="13.6818" fill="var(--text)" text-anchor="middle">before using in production</text>
</svg>
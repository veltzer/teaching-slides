    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="999.0244" height="499.5122" fill="var(--bg)" />
  <rect x="46.8293" y="46.8293" width="187.3171" height="93.6585" rx="9.3659" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="140.4878" y="85.8537" font-family="Arial, sans-serif" font-size="17.1707" font-weight="bold" fill="var(--bg)" text-anchor="middle">PROMPT</text>
  <text x="140.4878" y="107.7073" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--primary-lt)" text-anchor="middle">Describe your problem</text>
  <text x="140.4878" y="123.3171" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--primary-lt)" text-anchor="middle">or code task</text>
  <line x1="234.1463" y1="93.6585" x2="296.5854" y2="93.6585" stroke="var(--text-muted)" stroke-width="1.561" marker-end="url(#arrow)" />
  <rect x="296.5854" y="46.8293" width="187.3171" height="93.6585" rx="9.3659" fill="var(--ok)" filter="url(#shadow)" />
  <text x="390.2439" y="85.8537" font-family="Arial, sans-serif" font-size="17.1707" font-weight="bold" fill="var(--bg)" text-anchor="middle">RESPONSE</text>
  <text x="390.2439" y="107.7073" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--ok-lt)" text-anchor="middle">AI generates code,</text>
  <text x="390.2439" y="123.3171" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--ok-lt)" text-anchor="middle">explanation, or fix</text>
  <line x1="483.9024" y1="93.6585" x2="546.3415" y2="93.6585" stroke="var(--text-muted)" stroke-width="1.561" marker-end="url(#arrow)" />
  <rect x="546.3415" y="46.8293" width="187.3171" height="93.6585" rx="9.3659" fill="var(--warn)" filter="url(#shadow)" />
  <text x="640" y="85.8537" font-family="Arial, sans-serif" font-size="17.1707" font-weight="bold" fill="var(--bg)" text-anchor="middle">REFINE</text>
  <text x="640" y="107.7073" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--warn-pale)" text-anchor="middle">Review, test, and</text>
  <text x="640" y="123.3171" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--warn-pale)" text-anchor="middle">iterate on output</text>
  <path d="M 640 140.4878 Q 640 187.3171 390.2439 187.3171 Q 140.4878 187.3171 140.4878 140.4878" stroke="var(--info)" stroke-width="1.561" fill="none" stroke-dasharray="4.6829 3.122" marker-end="url(#arrow)" />
  <text x="390.2439" y="202.9268" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--info)" text-anchor="middle">iterate until satisfied</text>
  <text x="49.9512" y="249.7561" font-family="Arial, sans-serif" font-size="14.0488" font-weight="bold" fill="var(--primary-dk)">When to Use Chat AI</text>
  <text x="515.122" y="249.7561" font-family="Arial, sans-serif" font-size="14.0488" font-weight="bold" fill="var(--ok-dk)">When to Use IDE AI</text>
  <rect x="46.8293" y="261.4634" width="437.0732" height="109.2683" rx="6.2439" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.1707" />
  <text x="62.439" y="282.5366" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--primary-dk)">• Exploring unfamiliar technologies or APIs</text>
  <text x="62.439" y="301.2683" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--primary-dk)">• Designing architecture and brainstorming solutions</text>
  <text x="62.439" y="320" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--primary-dk)">• Debugging tricky errors with full context</text>
  <text x="62.439" y="338.7317" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--primary-dk)">• Generating boilerplate or scaffold code from scratch</text>
  <text x="62.439" y="357.4634" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--primary-dk)">• Long multi-turn conversations with deep context</text>
  <rect x="515.122" y="261.4634" width="437.0732" height="109.2683" rx="6.2439" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.1707" />
  <text x="530.7317" y="282.5366" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--ok-dk)">• Inline autocomplete while typing code</text>
  <text x="530.7317" y="301.2683" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--ok-dk)">• Quick refactoring within the editor context</text>
  <text x="530.7317" y="320" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--ok-dk)">• Real-time suggestions tied to open files</text>
  <text x="530.7317" y="338.7317" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--ok-dk)">• Test generation for the current function</text>
  <text x="530.7317" y="357.4634" font-family="Arial, sans-serif" font-size="10.9268" fill="var(--ok-dk)">• Navigating and explaining existing code</text>
  <text x="49.9512" y="398.0488" font-family="Arial, sans-serif" font-size="14.0488" font-weight="bold" fill="var(--text-muted)">Prompting Strategies for Code Generation</text>
  <rect x="46.8293" y="409.7561" width="210.7317" height="70.2439" rx="6.2439" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="0.7805" />
  <text x="152.1951" y="428.4878" font-family="Arial, sans-serif" font-size="10.9268" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Be Specific</text>
  <text x="152.1951" y="444.878" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text-dark)" text-anchor="middle">Language, version, framework,</text>
  <text x="152.1951" y="458.9268" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text-dark)" text-anchor="middle">style guide, and constraints</text>
  <text x="152.1951" y="472.9756" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text-dark)" text-anchor="middle">must all be stated explicitly</text>
  <rect x="273.1707" y="409.7561" width="210.7317" height="70.2439" rx="6.2439" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="0.7805" />
  <text x="378.5366" y="428.4878" font-family="Arial, sans-serif" font-size="10.9268" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Provide Context</text>
  <text x="378.5366" y="444.878" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text-dark)" text-anchor="middle">Paste relevant code snippets,</text>
  <text x="378.5366" y="458.9268" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text-dark)" text-anchor="middle">error messages, or data</text>
  <text x="378.5366" y="472.9756" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text-dark)" text-anchor="middle">samples before asking</text>
  <rect x="499.5122" y="409.7561" width="210.7317" height="70.2439" rx="6.2439" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="0.7805" />
  <text x="604.878" y="428.4878" font-family="Arial, sans-serif" font-size="10.9268" font-weight="bold" fill="var(--warn-mid)" text-anchor="middle">Iterate Quickly</text>
  <text x="604.878" y="444.878" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text-dark)" text-anchor="middle">Accept partial output, test it,</text>
  <text x="604.878" y="458.9268" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text-dark)" text-anchor="middle">then ask for fixes or changes</text>
  <text x="604.878" y="472.9756" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text-dark)" text-anchor="middle">in the same conversation</text>
  <rect x="725.8537" y="409.7561" width="226.3415" height="70.2439" rx="6.2439" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="0.7805" />
  <text x="839.0244" y="428.4878" font-family="Arial, sans-serif" font-size="10.9268" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Verify Output</text>
  <text x="839.0244" y="444.878" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text-dark)" text-anchor="middle">Run tests, check logic, and</text>
  <text x="839.0244" y="458.9268" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text-dark)" text-anchor="middle">review security implications</text>
  <text x="839.0244" y="472.9756" font-family="Arial, sans-serif" font-size="10.1463" fill="var(--text-dark)" text-anchor="middle">before using in production</text>
</svg>
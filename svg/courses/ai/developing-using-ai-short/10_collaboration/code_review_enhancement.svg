<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="53.3333" y="44.4444" width="1031.1111" height="48.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="77.3333" text-anchor="middle" fill="var(--bg)" font-size="21.3333" font-weight="bold" font-family="Arial, sans-serif">AI-Enhanced Code Review Process</text>
  <rect x="53.3333" y="128.8889" width="226.6667" height="97.7778" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="166.2222" y="164.4444" text-anchor="middle" fill="var(--warn-accent)" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">Pre-Review</text>
  <text x="166.2222" y="186.6667" text-anchor="middle" fill="var(--warn-accent)" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">AI Check</text>
  <text x="166.2222" y="213.3333" text-anchor="middle" fill="var(--text-muted)" font-size="11.5556" font-family="Arial, sans-serif">Automated scan</text>
  <line x1="280" y1="177.7778" x2="328.8889" y2="177.7778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="337.7778" y="128.8889" width="226.6667" height="97.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="450.6667" y="171.5556" text-anchor="middle" fill="var(--ok-accent)" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">Human</text>
  <text x="450.6667" y="193.7778" text-anchor="middle" fill="var(--ok-accent)" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">Review</text>
  <text x="450.6667" y="216.8889" text-anchor="middle" fill="var(--text-muted)" font-size="11.5556" font-family="Arial, sans-serif">Focus on design</text>
  <line x1="564.4444" y1="177.7778" x2="613.3333" y2="177.7778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="622.2222" y="128.8889" width="226.6667" height="97.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="735.1111" y="171.5556" text-anchor="middle" fill="var(--primary-accent)" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">AI</text>
  <text x="735.1111" y="193.7778" text-anchor="middle" fill="var(--primary-accent)" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">Suggestions</text>
  <text x="735.1111" y="216.8889" text-anchor="middle" fill="var(--text-muted)" font-size="11.5556" font-family="Arial, sans-serif">Refactor hints</text>
  <line x1="848.8889" y1="177.7778" x2="897.7778" y2="177.7778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="906.6667" y="128.8889" width="177.7778" height="97.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="995.5556" y="186.6667" text-anchor="middle" fill="var(--ok-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Merge</text>
  <text x="995.5556" y="213.3333" text-anchor="middle" fill="var(--text-muted)" font-size="11.5556" font-family="Arial, sans-serif">Approved</text>
  <rect x="53.3333" y="266.6667" width="1031.1111" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="300.4444" text-anchor="middle" fill="var(--primary-accent)" font-size="16.8889" font-weight="bold" font-family="Arial, sans-serif">AI Pre-Review: Humans focus on what matters</text>
  <text x="568.8889" y="328.8889" text-anchor="middle" fill="var(--text)" font-size="14.2222" font-family="Arial, sans-serif">AI handles style/linting/security → humans review architecture &amp; logic</text>
  <rect x="53.3333" y="373.3333" width="320" height="231.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="213.3333" y="408.8889" text-anchor="middle" fill="var(--primary-accent)" font-size="16" font-weight="bold" font-family="Arial, sans-serif">AI Catches</text>
  <text x="213.3333" y="439.1111" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• Code style violations</text>
  <text x="213.3333" y="465.7778" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• Security patterns</text>
  <text x="213.3333" y="492.4444" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• Missing test cases</text>
  <text x="213.3333" y="519.1111" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• Documentation gaps</text>
  <text x="213.3333" y="545.7778" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• Complexity metrics</text>
  <rect x="408.8889" y="373.3333" width="320" height="231.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="408.8889" text-anchor="middle" fill="var(--ok-accent)" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Humans Focus On</text>
  <text x="568.8889" y="439.1111" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• Business logic</text>
  <text x="568.8889" y="465.7778" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• Architecture decisions</text>
  <text x="568.8889" y="492.4444" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• Domain correctness</text>
  <text x="568.8889" y="519.1111" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• Team knowledge share</text>
  <text x="568.8889" y="545.7778" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• Mentoring junior devs</text>
  <rect x="764.4444" y="373.3333" width="320" height="231.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="924.4444" y="408.8889" text-anchor="middle" fill="var(--warn-accent)" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Outcomes</text>
  <text x="924.4444" y="439.1111" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• 50% faster review</text>
  <text x="924.4444" y="465.7778" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• Fewer reopened PRs</text>
  <text x="924.4444" y="492.4444" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• Consistent standards</text>
  <text x="924.4444" y="519.1111" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• Better code quality</text>
  <text x="924.4444" y="545.7778" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">• Reduced reviewer load</text>
</svg>
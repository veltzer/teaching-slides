<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Three circles -->
  <circle cx="240" cy="310" r="160" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="240" y="295" text-anchor="middle" fill="#1565c0" font-size="24" font-weight="bold" font-family="Arial, sans-serif">Developer A</text>
  <text x="240" y="328" text-anchor="middle" fill="#444" font-size="16" font-family="Arial, sans-serif">Domain expert</text>
  <circle cx="640" cy="440" r="120" fill="#f3e5f5" stroke="#8e24aa" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="428" text-anchor="middle" fill="#6a1b9a" font-size="22" font-weight="bold" font-family="Arial, sans-serif">AI</text>
  <text x="640" y="458" text-anchor="middle" fill="#6a1b9a" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Assistant</text>
  <text x="640" y="490" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Knowledge broker</text>
  <circle cx="1040" cy="310" r="160" fill="#e8f5e9" stroke="#43a047" stroke-width="3" filter="url(#shadow)"/>
  <text x="1040" y="295" text-anchor="middle" fill="#2e7d32" font-size="24" font-weight="bold" font-family="Arial, sans-serif">Developer B</text>
  <text x="1040" y="328" text-anchor="middle" fill="#444" font-size="16" font-family="Arial, sans-serif">Learning context</text>
  <!-- Connecting lines -->
  <line x1="392" y1="358" x2="530" y2="420" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <line x1="750" y1="406" x2="888" y2="358" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <!-- Banner -->
  <rect x="80" y="615" width="1120" height="75" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="660" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial, sans-serif">AI-Mediated Knowledge Transfer</text>
</svg>

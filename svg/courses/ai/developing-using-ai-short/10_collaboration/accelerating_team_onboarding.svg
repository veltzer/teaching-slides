<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="46.8996" y="40" width="329.058" height="329.058" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="211.428571" y="191.054334" text-anchor="middle" fill="var(--primary-accent)" font-size="24.130913" font-weight="bold" font-family="Arial, sans-serif">New</text>
  <text x="211.428571" y="224.741074" text-anchor="middle" fill="var(--primary-accent)" font-size="24.130913" font-weight="bold" font-family="Arial, sans-serif">Developer</text>
  <text x="211.428571" y="289.869064" text-anchor="middle" fill="var(--text-muted)" font-size="15.355933" font-family="Arial, sans-serif">Day 1</text>
  <line x1="372.142857" y1="204.528976" x2="500.714286" y2="204.528976" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="436.428571" y="187.685604" text-anchor="middle" fill="var(--primary-accent)" font-size="14.259234" font-family="Arial, sans-serif">learns via AI</text>
  <rect x="508.377" y="72.9058" width="263.246" height="263.246" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="640" y="191.054334" text-anchor="middle" fill="var(--info-accent)" font-size="24.130913" font-weight="bold" font-family="Arial, sans-serif">AI</text>
  <text x="640" y="224.741074" text-anchor="middle" fill="var(--info-accent)" font-size="24.130913" font-weight="bold" font-family="Arial, sans-serif">Mentor</text>
  <text x="640" y="283.131745" text-anchor="middle" fill="var(--text-muted)" font-size="15.355933" font-family="Arial, sans-serif">24/7 support</text>
  <line x1="768.571429" y1="204.528976" x2="897.142857" y2="204.528976" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="832.857143" y="187.685604" text-anchor="middle" fill="var(--primary-accent)" font-size="14.259234" font-family="Arial, sans-serif">integrates</text>
  <rect x="904.042" y="40" width="329.058" height="329.058" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="1068.571314" y="191.054334" text-anchor="middle" fill="var(--ok-accent)" font-size="24.130913" font-weight="bold" font-family="Arial, sans-serif">Team</text>
  <text x="1068.571314" y="224.741074" text-anchor="middle" fill="var(--ok-accent)" font-size="24.130913" font-weight="bold" font-family="Arial, sans-serif">Integration</text>
  <text x="1068.571314" y="289.869064" text-anchor="middle" fill="var(--text-muted)" font-size="15.355933" font-family="Arial, sans-serif">Week 2</text>
  <rect x="40" y="429.107858" width="1200" height="89.831497" rx="7.573018" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="483.006841" text-anchor="middle" fill="var(--bg)" font-size="28.518342" font-weight="bold" font-family="Arial, sans-serif">AI-Accelerated Onboarding: -45% ramp time</text>
  <rect x="40" y="541.39737" width="1200" height="78.60263" rx="7.573018" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="588.558893" text-anchor="middle" fill="var(--text)" font-size="17.54971" font-family="Arial, sans-serif">Codebase Q&amp;A, guided tutorials, automated code walkthroughs, context-aware suggestions</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- 3 panels top -->
  <rect x="60" y="80" width="360" height="340" rx="14" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="80" width="360" height="50" rx="14" fill="#fb8c00"/>
  <rect x="60" y="116" width="360" height="14" fill="#fb8c00"/>
  <text x="240" y="118" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Technical Writing</text>
  <text x="240" y="178" text-anchor="middle" fill="#e65100" font-size="17" font-weight="bold" font-family="Arial, sans-serif">Enhancement</text>
  <text x="240" y="218" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• Auto-generate docs</text>
  <text x="240" y="252" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• Improve clarity</text>
  <text x="240" y="286" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• API documentation</text>
  <text x="240" y="320" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• Changelog generation</text>
  <text x="240" y="354" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• Runbook creation</text>
  <rect x="460" y="80" width="360" height="340" rx="14" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="460" y="80" width="360" height="50" rx="14" fill="#43a047"/>
  <rect x="460" y="116" width="360" height="14" fill="#43a047"/>
  <text x="640" y="118" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Meeting</text>
  <text x="640" y="178" text-anchor="middle" fill="#2e7d32" font-size="17" font-weight="bold" font-family="Arial, sans-serif">Optimization</text>
  <text x="640" y="218" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• AI-generated agendas</text>
  <text x="640" y="252" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• Summary &amp; action items</text>
  <text x="640" y="286" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• Decision tracking</text>
  <text x="640" y="320" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• Follow-up automation</text>
  <text x="640" y="354" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• Fewer status meetings</text>
  <rect x="860" y="80" width="360" height="340" rx="14" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860" y="80" width="360" height="50" rx="14" fill="url(#grad-accent)"/>
  <rect x="860" y="116" width="360" height="14" fill="url(#grad-accent)"/>
  <text x="1040" y="118" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Cross-Team</text>
  <text x="1040" y="178" text-anchor="middle" fill="#1565c0" font-size="17" font-weight="bold" font-family="Arial, sans-serif">Communication</text>
  <text x="1040" y="218" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• Translate technical jargon</text>
  <text x="1040" y="252" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• Status report drafts</text>
  <text x="1040" y="286" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• Stakeholder updates</text>
  <text x="1040" y="320" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• Risk communication</text>
  <text x="1040" y="354" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">• Sprint summaries</text>
  <!-- Footer -->
  <rect x="60" y="460" width="1160" height="90" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="515" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial, sans-serif">AI-Enhanced Team Communication</text>
  <rect x="60" y="580" width="1160" height="90" rx="10" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="618" text-anchor="middle" fill="#1565c0" font-size="17" font-weight="bold" font-family="Arial, sans-serif">Less time on coordination overhead, more time on engineering</text>
  <text x="640" y="650" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">Async-first communication enabled by AI summaries and smart notifications</text>
</svg>

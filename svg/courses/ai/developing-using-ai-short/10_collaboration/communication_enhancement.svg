<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="372.413793" height="334.237216" rx="6.962536" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="372.413793" height="49.152435" rx="6.962536" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="75.389821" width="372.413793" height="13.762613" fill="url(#grad-warn)" rx="6.962536" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.206897" y="77.356031" text-anchor="middle" fill="var(--bg)" font-size="20.168841" font-weight="bold" font-family="Arial, sans-serif">Technical Writing</text>
  <text x="226.206897" y="136.339026" text-anchor="middle" fill="var(--warn-accent)" font-size="17.143503" font-weight="bold" font-family="Arial, sans-serif">Enhancement</text>
  <text x="226.206897" y="175.661023" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• Auto-generate docs</text>
  <text x="226.206897" y="209.084757" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• Improve clarity</text>
  <text x="226.206897" y="242.50849" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• API documentation</text>
  <text x="226.206897" y="275.932102" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• Changelog generation</text>
  <text x="226.206897" y="309.355958" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• Runbook creation</text>
  <rect x="453.793103" y="40" width="372.413793" height="334.237216" rx="6.962536" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="453.793103" y="40" width="372.413793" height="49.152435" rx="6.962536" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="453.793103" y="75.389821" width="372.413793" height="13.762613" fill="url(#grad-ok)" rx="6.962536" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="77.356031" text-anchor="middle" fill="var(--bg)" font-size="20.168841" font-weight="bold" font-family="Arial, sans-serif">Meeting</text>
  <text x="640" y="136.339026" text-anchor="middle" fill="var(--ok-accent)" font-size="17.143503" font-weight="bold" font-family="Arial, sans-serif">Optimization</text>
  <text x="640" y="175.661023" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• AI-generated agendas</text>
  <text x="640" y="209.084757" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• Summary &amp; action items</text>
  <text x="640" y="242.50849" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• Decision tracking</text>
  <text x="640" y="275.932102" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• Follow-up automation</text>
  <text x="640" y="309.355958" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• Fewer status meetings</text>
  <rect x="867.586097" y="40" width="372.413793" height="334.237216" rx="6.962536" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="867.586097" y="40" width="372.413793" height="49.152435" rx="6.962536" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="867.586097" y="75.389821" width="372.413793" height="13.762613" fill="url(#grad-primary)" rx="6.962536" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.792993" y="77.356031" text-anchor="middle" fill="var(--bg)" font-size="20.168841" font-weight="bold" font-family="Arial, sans-serif">Cross-Team</text>
  <text x="1053.792993" y="136.339026" text-anchor="middle" fill="var(--primary-accent)" font-size="17.143503" font-weight="bold" font-family="Arial, sans-serif">Communication</text>
  <text x="1053.792993" y="175.661023" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• Translate technical jargon</text>
  <text x="1053.792993" y="209.084757" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• Status report drafts</text>
  <text x="1053.792993" y="242.50849" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• Stakeholder updates</text>
  <text x="1053.792993" y="275.932102" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• Risk communication</text>
  <text x="1053.792993" y="309.355958" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">• Sprint summaries</text>
  <rect x="40" y="413.559334" width="1200" height="88.474554" rx="6.962536" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="467.627049" text-anchor="middle" fill="var(--bg)" font-size="24.20247" font-weight="bold" font-family="Arial, sans-serif">AI-Enhanced Team Communication</text>
  <rect x="40" y="531.525446" width="1200" height="88.474554" rx="6.962536" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="568.881233" text-anchor="middle" fill="var(--primary-accent)" font-size="17.143503" font-weight="bold" font-family="Arial, sans-serif">Less time on coordination overhead, more time on engineering</text>
  <text x="640" y="600.33888" text-anchor="middle" fill="var(--text-muted)" font-size="15.126573" font-family="Arial, sans-serif">Async-first communication enabled by AI summaries and smart notifications</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="96.25" y="104.4444" width="328.125" height="161.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="96.25" y="104.4444" width="328.125" height="37.0556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="96.25" y="130.2223" width="328.125" height="11.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="260.3125" y="132.6389" text-anchor="middle" fill="var(--bg)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">Tool Selection</text>
  <text x="260.3125" y="175.3333" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Arial, sans-serif">Evaluate fit for team</text>
  <text x="260.3125" y="199.5" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Security &amp; privacy</text>
  <text x="260.3125" y="220.4444" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Cost per seat</text>
  <text x="260.3125" y="241.3889" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Integration support</text>
  <line x1="424.3749" y1="185" x2="475.9375" y2="185" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="485.3125" y="104.4444" width="309.375" height="161.1111" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="485.3125" y="104.4444" width="309.375" height="37.0556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="485.3125" y="130.2223" width="309.375" height="11.2777" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="132.6389" text-anchor="middle" fill="var(--bg)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">Configuration</text>
  <text x="640" y="175.3333" text-anchor="middle" fill="var(--info-accent)" font-size="13.9044" font-family="Arial, sans-serif">Standardize settings</text>
  <text x="640" y="199.5" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Prompt templates</text>
  <text x="640" y="220.4444" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Shared context files</text>
  <text x="640" y="241.3889" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">IDE plugin settings</text>
  <line x1="794.6875" y1="185" x2="846.2499" y2="185" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="855.6249" y="104.4444" width="328.125" height="161.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="855.6249" y="104.4444" width="328.125" height="37.0556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="855.6249" y="130.2223" width="328.125" height="11.2777" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1019.6875" y="132.6389" text-anchor="middle" fill="var(--bg)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">Governance</text>
  <text x="1019.6875" y="175.3333" text-anchor="middle" fill="var(--ok-accent)" font-size="13.9044" font-family="Arial, sans-serif">Policy &amp; compliance</text>
  <text x="1019.6875" y="199.5" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Data handling rules</text>
  <text x="1019.6875" y="220.4444" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Usage monitoring</text>
  <text x="1019.6875" y="241.3889" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Audit logging</text>
  <rect x="265" y="305.8333" width="750" height="145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="346.1111" text-anchor="middle" fill="var(--primary-accent)" font-size="20.8566" font-weight="bold" font-family="Arial, sans-serif">Team AI Strategy</text>
  <text x="640" y="378.3333" text-anchor="middle" fill="var(--text)" font-size="14.7735" font-family="Arial, sans-serif">Unified approach across all projects</text>
  <text x="640" y="407.3333" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Consistent prompting patterns — shared knowledge base</text>
  <text x="640" y="433.1111" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Regular review cadence — adopt new capabilities as team</text>
  <rect x="115" y="483.0556" width="1050" height="104.7223" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="516.8889" text-anchor="middle" fill="var(--bg)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">Why Governance Matters</text>
  <text x="640" y="545.8889" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Arial, sans-serif">Without standards: 10 devs use 10 different prompts — unpredictable output quality</text>
  <text x="640" y="571.6667" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Arial, sans-serif">With standards: multiplied productivity, consistent code, shared learning</text>
</svg>
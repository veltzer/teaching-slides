<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Top 3 panels -->
  <rect x="60" y="80" width="350" height="200" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="80" width="350" height="46" rx="12" fill="url(#grad-accent)"/>
  <rect x="60" y="112" width="350" height="14" fill="url(#grad-accent)"/>
  <text x="235" y="115" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Tool Selection</text>
  <text x="235" y="168" text-anchor="middle" fill="#1565c0" font-size="16" font-family="Arial, sans-serif">Evaluate fit for team</text>
  <text x="235" y="198" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Security &amp; privacy</text>
  <text x="235" y="224" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Cost per seat</text>
  <text x="235" y="250" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Integration support</text>
  <line x1="410" y1="180" x2="465" y2="180" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <rect x="475" y="80" width="330" height="200" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="475" y="80" width="330" height="46" rx="12" fill="#8e24aa"/>
  <rect x="475" y="112" width="330" height="14" fill="#8e24aa"/>
  <text x="640" y="115" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Configuration</text>
  <text x="640" y="168" text-anchor="middle" fill="#6a1b9a" font-size="16" font-family="Arial, sans-serif">Standardize settings</text>
  <text x="640" y="198" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Prompt templates</text>
  <text x="640" y="224" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Shared context files</text>
  <text x="640" y="250" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">IDE plugin settings</text>
  <line x1="805" y1="180" x2="860" y2="180" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <rect x="870" y="80" width="350" height="200" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="870" y="80" width="350" height="46" rx="12" fill="#43a047"/>
  <rect x="870" y="112" width="350" height="14" fill="#43a047"/>
  <text x="1045" y="115" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Governance</text>
  <text x="1045" y="168" text-anchor="middle" fill="#2e7d32" font-size="16" font-family="Arial, sans-serif">Policy &amp; compliance</text>
  <text x="1045" y="198" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Data handling rules</text>
  <text x="1045" y="224" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Usage monitoring</text>
  <text x="1045" y="250" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Audit logging</text>
  <!-- Strategy box -->
  <rect x="240" y="330" width="800" height="180" rx="14" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="380" text-anchor="middle" fill="#1565c0" font-size="24" font-weight="bold" font-family="Arial, sans-serif">Team AI Strategy</text>
  <text x="640" y="420" text-anchor="middle" fill="#444" font-size="17" font-family="Arial, sans-serif">Unified approach across all projects</text>
  <text x="640" y="456" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">Consistent prompting patterns — shared knowledge base</text>
  <text x="640" y="488" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">Regular review cadence — adopt new capabilities as team</text>
  <!-- Footer -->
  <rect x="80" y="550" width="1120" height="130" rx="12" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="592" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Why Governance Matters</text>
  <text x="640" y="628" text-anchor="middle" fill="#bbdefb" font-size="16" font-family="Arial, sans-serif">Without standards: 10 devs use 10 different prompts — unpredictable output quality</text>
  <text x="640" y="660" text-anchor="middle" fill="#bbdefb" font-size="16" font-family="Arial, sans-serif">With standards: multiplied productivity, consistent code, shared learning</text>
</svg>

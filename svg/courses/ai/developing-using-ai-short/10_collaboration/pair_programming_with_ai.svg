<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Three boxes in a row -->
  <rect x="60" y="180" width="330" height="240" rx="14" fill="#ffebee" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="180" width="330" height="50" rx="14" fill="#e53935"/>
  <rect x="60" y="216" width="330" height="14" fill="#e53935"/>
  <text x="225" y="218" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Driver</text>
  <text x="225" y="270" text-anchor="middle" fill="#b71c1c" font-size="20" font-weight="bold" font-family="Arial, sans-serif">(Human)</text>
  <text x="225" y="320" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">Writes the code</text>
  <text x="225" y="352" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">Implements logic</text>
  <text x="225" y="384" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">Makes decisions</text>
  <line x1="390" y1="300" x2="450" y2="300" stroke="#1565c0" stroke-width="4" marker-end="url(#arrow-accent)"/>
  <rect x="460" y="180" width="360" height="240" rx="14" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="460" y="180" width="360" height="50" rx="14" fill="#8e24aa"/>
  <rect x="460" y="216" width="360" height="14" fill="#8e24aa"/>
  <text x="640" y="218" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">AI Assistant</text>
  <text x="640" y="270" text-anchor="middle" fill="#6a1b9a" font-size="16" font-family="Arial, sans-serif">Context-aware partner</text>
  <text x="640" y="308" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">Suggests completions</text>
  <text x="640" y="340" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">Explains patterns</text>
  <text x="640" y="372" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">Spots bugs early</text>
  <line x1="820" y1="300" x2="880" y2="300" stroke="#1565c0" stroke-width="4" marker-end="url(#arrow-accent)"/>
  <rect x="890" y="180" width="330" height="240" rx="14" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="890" y="180" width="330" height="50" rx="14" fill="#43a047"/>
  <rect x="890" y="216" width="330" height="14" fill="#43a047"/>
  <text x="1055" y="218" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Navigator</text>
  <text x="1055" y="270" text-anchor="middle" fill="#2e7d32" font-size="20" font-weight="bold" font-family="Arial, sans-serif">(Human)</text>
  <text x="1055" y="320" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">Reviews direction</text>
  <text x="1055" y="352" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">Guides architecture</text>
  <text x="1055" y="384" text-anchor="middle" fill="#555" font-size="15" font-family="Arial, sans-serif">Ensures quality</text>
  <!-- Banner -->
  <rect x="80" y="470" width="1120" height="80" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="518" text-anchor="middle" fill="white" font-size="26" font-weight="bold" font-family="Arial, sans-serif">AI-Augmented Pair Programming</text>
  <!-- Footer -->
  <rect x="80" y="580" width="1120" height="100" rx="10" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="618" text-anchor="middle" fill="#1565c0" font-size="18" font-weight="bold" font-family="Arial, sans-serif">Benefits over traditional pairing</text>
  <text x="640" y="652" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">AI never tires, knows every API, and accelerates both driver and navigator simultaneously</text>
</svg>

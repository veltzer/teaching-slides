<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="341.37931" height="278.399868" rx="7.563249" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="341.37931" height="57.99987" rx="7.563249" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="81.759987" width="341.37931" height="16.239883" fill="url(#grad-danger)" rx="7.563249" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.689655" y="84.079971" text-anchor="middle" fill="var(--bg)" font-size="24.09979" font-weight="bold" font-family="Arial, sans-serif">Driver</text>
  <text x="210.689655" y="144.399968" text-anchor="middle" fill="var(--danger-accent)" font-size="21.908969" font-weight="bold" font-family="Arial, sans-serif">(Human)</text>
  <text x="210.689655" y="202.399839" text-anchor="middle" fill="var(--text-muted)" font-size="16.431664" font-family="Arial, sans-serif">Writes the code</text>
  <text x="210.689655" y="239.520003" text-anchor="middle" fill="var(--text-muted)" font-size="16.431664" font-family="Arial, sans-serif">Implements logic</text>
  <text x="210.689655" y="276.63988" text-anchor="middle" fill="var(--text-muted)" font-size="16.431664" font-family="Arial, sans-serif">Makes decisions</text>
  <line x1="381.37931" y1="179.200006" x2="443.448276" y2="179.200006" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="453.793103" y="40" width="372.413793" height="278.399868" rx="7.563249" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="453.793103" y="40" width="372.413793" height="57.99987" rx="7.563249" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="453.793103" y="81.759987" width="372.413793" height="16.239883" fill="url(#grad-info)" rx="7.563249" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84.079971" text-anchor="middle" fill="var(--bg)" font-size="24.09979" font-weight="bold" font-family="Arial, sans-serif">AI Assistant</text>
  <text x="640" y="144.399968" text-anchor="middle" fill="var(--info-accent)" font-size="17.527074" font-family="Arial, sans-serif">Context-aware partner</text>
  <text x="640" y="188.479939" text-anchor="middle" fill="var(--text-muted)" font-size="16.431664" font-family="Arial, sans-serif">Suggests completions</text>
  <text x="640" y="225.59996" text-anchor="middle" fill="var(--text-muted)" font-size="16.431664" font-family="Arial, sans-serif">Explains patterns</text>
  <text x="640" y="262.71998" text-anchor="middle" fill="var(--text-muted)" font-size="16.431664" font-family="Arial, sans-serif">Spots bugs early</text>
  <line x1="826.206897" y1="179.200006" x2="888.275862" y2="179.200006" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="898.62069" y="40" width="341.37931" height="278.399868" rx="7.563249" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="898.62069" y="40" width="341.37931" height="57.99987" rx="7.563249" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="898.62069" y="81.759987" width="341.37931" height="16.239883" fill="url(#grad-ok)" rx="7.563249" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1069.310345" y="84.079971" text-anchor="middle" fill="var(--bg)" font-size="24.09979" font-weight="bold" font-family="Arial, sans-serif">Navigator</text>
  <text x="1069.310345" y="144.399968" text-anchor="middle" fill="var(--ok-accent)" font-size="21.908969" font-weight="bold" font-family="Arial, sans-serif">(Human)</text>
  <text x="1069.310345" y="202.399839" text-anchor="middle" fill="var(--text-muted)" font-size="16.431664" font-family="Arial, sans-serif">Reviews direction</text>
  <text x="1069.310345" y="239.520003" text-anchor="middle" fill="var(--text-muted)" font-size="16.431664" font-family="Arial, sans-serif">Guides architecture</text>
  <text x="1069.310345" y="276.63988" text-anchor="middle" fill="var(--text-muted)" font-size="16.431664" font-family="Arial, sans-serif">Ensures quality</text>
  <rect x="60.689655" y="376.399882" width="1158.62069" height="92.799908" rx="7.563249" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="432.079769" text-anchor="middle" fill="var(--bg)" font-size="28.481558" font-weight="bold" font-family="Arial, sans-serif">AI-Augmented Pair Programming</text>
  <rect x="60.689655" y="503.999971" width="1158.62069" height="116.000029" rx="7.563249" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="548.079798" text-anchor="middle" fill="var(--primary-accent)" font-size="19.718021" font-weight="bold" font-family="Arial, sans-serif">Benefits over traditional pairing</text>
  <text x="640" y="587.519946" text-anchor="middle" fill="var(--text)" font-size="16.431664" font-family="Arial, sans-serif">AI never tires, knows every API, and accelerates both driver and navigator simultaneously</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="96.25" y="185" width="309.375" height="193.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="96.25" y="185" width="309.375" height="40.2777" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="96.25" y="214" width="309.375" height="11.2777" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="250.9375" y="215.6111" text-anchor="middle" fill="var(--bg)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Driver</text>
  <text x="250.9375" y="257.5" text-anchor="middle" fill="var(--danger-accent)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">(Human)</text>
  <text x="250.9375" y="297.7777" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Writes the code</text>
  <text x="250.9375" y="323.5556" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Implements logic</text>
  <text x="250.9375" y="349.3333" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Makes decisions</text>
  <line x1="405.625" y1="281.6667" x2="461.875" y2="281.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="471.25" y="185" width="337.5" height="193.3333" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="471.25" y="185" width="337.5" height="40.2777" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="471.25" y="214" width="337.5" height="11.2777" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="215.6111" text-anchor="middle" fill="var(--bg)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">AI Assistant</text>
  <text x="640" y="257.5" text-anchor="middle" fill="var(--info-accent)" font-size="13.9044" font-family="Arial, sans-serif">Context-aware partner</text>
  <text x="640" y="288.1111" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Suggests completions</text>
  <text x="640" y="313.8889" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Explains patterns</text>
  <text x="640" y="339.6667" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Spots bugs early</text>
  <line x1="808.75" y1="281.6667" x2="865" y2="281.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="874.375" y="185" width="309.375" height="193.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="874.375" y="185" width="309.375" height="40.2777" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="874.375" y="214" width="309.375" height="11.2777" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1029.0625" y="215.6111" text-anchor="middle" fill="var(--bg)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Navigator</text>
  <text x="1029.0625" y="257.5" text-anchor="middle" fill="var(--ok-accent)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">(Human)</text>
  <text x="1029.0625" y="297.7777" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Reviews direction</text>
  <text x="1029.0625" y="323.5556" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Guides architecture</text>
  <text x="1029.0625" y="349.3333" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Ensures quality</text>
  <rect x="115" y="418.6111" width="1050" height="64.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="457.2777" text-anchor="middle" fill="var(--bg)" font-size="22.5947" font-weight="bold" font-family="Arial, sans-serif">AI-Augmented Pair Programming</text>
  <rect x="115" y="507.2223" width="1050" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="537.8333" text-anchor="middle" fill="var(--primary-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Benefits over traditional pairing</text>
  <text x="640" y="565.2223" text-anchor="middle" fill="var(--text)" font-size="13.0354" font-family="Arial, sans-serif">AI never tires, knows every API, and accelerates both driver and navigator simultaneously</text>
</svg>
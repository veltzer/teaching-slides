<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="53.3333" y="160" width="293.3333" height="213.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="53.3333" y="160" width="293.3333" height="44.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="53.3333" y="192" width="293.3333" height="12.4444" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="200" y="193.7778" text-anchor="middle" fill="var(--bg)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Driver</text>
  <text x="200" y="240" text-anchor="middle" fill="var(--danger-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">(Human)</text>
  <text x="200" y="284.4444" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">Writes the code</text>
  <text x="200" y="312.8889" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">Implements logic</text>
  <text x="200" y="341.3333" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">Makes decisions</text>
  <line x1="346.6667" y1="266.6667" x2="400" y2="266.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="408.8889" y="160" width="320" height="213.3333" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="408.8889" y="160" width="320" height="44.4444" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="408.8889" y="192" width="320" height="12.4444" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="568.8889" y="193.7778" text-anchor="middle" fill="var(--bg)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">AI Assistant</text>
  <text x="568.8889" y="240" text-anchor="middle" fill="var(--info-accent)" font-size="14.2222" font-family="Arial, sans-serif">Context-aware partner</text>
  <text x="568.8889" y="273.7778" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">Suggests completions</text>
  <text x="568.8889" y="302.2222" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">Explains patterns</text>
  <text x="568.8889" y="330.6667" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">Spots bugs early</text>
  <line x1="728.8889" y1="266.6667" x2="782.2222" y2="266.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="791.1111" y="160" width="293.3333" height="213.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="791.1111" y="160" width="293.3333" height="44.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="791.1111" y="192" width="293.3333" height="12.4444" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="937.7778" y="193.7778" text-anchor="middle" fill="var(--bg)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Navigator</text>
  <text x="937.7778" y="240" text-anchor="middle" fill="var(--ok-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">(Human)</text>
  <text x="937.7778" y="284.4444" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">Reviews direction</text>
  <text x="937.7778" y="312.8889" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">Guides architecture</text>
  <text x="937.7778" y="341.3333" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">Ensures quality</text>
  <rect x="71.1111" y="417.7778" width="995.5556" height="71.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="460.4444" text-anchor="middle" fill="var(--bg)" font-size="23.1111" font-weight="bold" font-family="Arial, sans-serif">AI-Augmented Pair Programming</text>
  <rect x="71.1111" y="515.5556" width="995.5556" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="549.3333" text-anchor="middle" fill="var(--primary-accent)" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Benefits over traditional pairing</text>
  <text x="568.8889" y="579.5556" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">AI never tires, knows every API, and accelerates both driver and navigator simultaneously</text>
</svg>
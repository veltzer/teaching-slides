<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  

    <!-- Gradients -->






    <!-- Drop shadow -->

    <!-- Arrow markers -->
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- == FORMULA HEADER == -->
  <rect x="60" y="30" width="1160" height="50" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Context + Task + Constraints + Format + Examples = Effective Prompt</text>

  <!-- == FIVE COMPONENTS == -->
  <!-- Context -->
  <rect x="60" y="100" width="210" height="130" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">CONTEXT</text>
  <text x="165" y="150" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">Who you are,</text>
  <text x="165" y="167" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">what project,</text>
  <text x="165" y="184" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">language/stack,</text>
  <text x="165" y="201" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">existing codebase</text>
  <text x="270" y="168" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#aaaaaa" text-anchor="middle">+</text>

  <!-- Task -->
  <rect x="290" y="100" width="210" height="130" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">TASK</text>
  <text x="395" y="150" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">Specific action:</text>
  <text x="395" y="167" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">write, fix, explain,</text>
  <text x="395" y="184" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">refactor, test,</text>
  <text x="395" y="201" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">document</text>
  <text x="500" y="168" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#aaaaaa" text-anchor="middle">+</text>

  <!-- Constraints -->
  <rect x="520" y="100" width="210" height="130" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="625" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f57c00" text-anchor="middle">CONSTRAINTS</text>
  <text x="625" y="150" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">No dependencies,</text>
  <text x="625" y="167" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">max lines, style,</text>
  <text x="625" y="184" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">performance, or</text>
  <text x="625" y="201" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">security rules</text>
  <text x="730" y="168" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#aaaaaa" text-anchor="middle">+</text>

  <!-- Format -->
  <rect x="750" y="100" width="210" height="130" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="855" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#6a1b9a" text-anchor="middle">FORMAT</text>
  <text x="855" y="150" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">Code block, JSON,</text>
  <text x="855" y="167" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">markdown, step-by-</text>
  <text x="855" y="184" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">step explanation,</text>
  <text x="855" y="201" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">inline comments</text>
  <text x="960" y="168" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#aaaaaa" text-anchor="middle">+</text>

  <!-- Examples -->
  <rect x="980" y="100" width="260" height="130" rx="10" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c62828" text-anchor="middle">EXAMPLES</text>
  <text x="1110" y="150" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">Sample input/output,</text>
  <text x="1110" y="167" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">existing code style,</text>
  <text x="1110" y="184" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">test cases, or data</text>
  <text x="1110" y="201" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">to guide the model</text>

  <!-- == BEFORE / AFTER == -->
  <text x="60" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c62828">BEFORE: Vague Prompt</text>
  <rect x="60" y="278" width="560" height="120" rx="8" fill="#f9f9f9" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="80" y="302" font-family="monospace" font-size="13" fill="#555555">"Write a function to sort a list."</text>
  <text x="80" y="332" font-family="Arial, sans-serif" font-size="13" fill="#c62828">Problems:</text>
  <text x="80" y="352" font-family="Arial, sans-serif" font-size="13" fill="#777777">&#x2022; No language specified</text>
  <text x="80" y="370" font-family="Arial, sans-serif" font-size="13" fill="#777777">&#x2022; No constraints (size, type, stability)</text>
  <text x="80" y="388" font-family="Arial, sans-serif" font-size="13" fill="#777777">&#x2022; No format preference, no examples</text>

  <text x="660" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">AFTER: Structured Prompt</text>
  <rect x="660" y="278" width="560" height="120" rx="8" fill="#f5f5f5" stroke="#4caf50" stroke-width="1.5"/>
  <text x="680" y="302" font-family="monospace" font-size="12" fill="#333333">"In Python 3.11, write a function that sorts</text>
  <text x="680" y="320" font-family="monospace" font-size="12" fill="#333333">a list of dicts by a given key. Use only</text>
  <text x="680" y="338" font-family="monospace" font-size="12" fill="#333333">stdlib, add type hints, include docstring.</text>
  <text x="680" y="356" font-family="monospace" font-size="12" fill="#333333">Example: sort_by_key(data, 'age') -&gt; [...]"</text>
  <text x="680" y="382" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32">Context + Task + Constraints + Format + Example</text>

  <!-- == TIPS ROW == -->
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#555555">Advanced Techniques</text>

  <rect x="60" y="445" width="280" height="165" rx="8" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>
  <text x="200" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">Chain of Thought</text>
  <text x="80" y="492" font-family="Arial, sans-serif" font-size="13" fill="#333333">Ask the model to "think step</text>
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="13" fill="#333333">by step" before answering.</text>
  <text x="80" y="528" font-family="Arial, sans-serif" font-size="13" fill="#333333">Surfaces reasoning errors</text>
  <text x="80" y="546" font-family="Arial, sans-serif" font-size="13" fill="#333333">and produces better results</text>
  <text x="80" y="564" font-family="Arial, sans-serif" font-size="13" fill="#333333">for complex logic tasks.</text>
  <text x="80" y="598" font-family="monospace" font-size="12" fill="#666666">"First reason through ...</text>
  <text x="80" y="614" font-family="monospace" font-size="12" fill="#666666"> then write the code."</text>

  <rect x="370" y="445" width="280" height="165" rx="8" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>
  <text x="510" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">Role Priming</text>
  <text x="390" y="492" font-family="Arial, sans-serif" font-size="13" fill="#333333">Assign an expert role to</text>
  <text x="390" y="510" font-family="Arial, sans-serif" font-size="13" fill="#333333">guide response style and</text>
  <text x="390" y="528" font-family="Arial, sans-serif" font-size="13" fill="#333333">depth. Security, performance,</text>
  <text x="390" y="546" font-family="Arial, sans-serif" font-size="13" fill="#333333">or teaching roles all shift</text>
  <text x="390" y="564" font-family="Arial, sans-serif" font-size="13" fill="#333333">the output meaningfully.</text>
  <text x="390" y="598" font-family="monospace" font-size="12" fill="#666666">"You are a senior Go</text>
  <text x="390" y="614" font-family="monospace" font-size="12" fill="#666666"> security engineer..."</text>

  <rect x="680" y="445" width="280" height="165" rx="8" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>
  <text x="820" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00" text-anchor="middle">Iterative Refinement</text>
  <text x="700" y="492" font-family="Arial, sans-serif" font-size="13" fill="#333333">Start broad, then narrow.</text>
  <text x="700" y="510" font-family="Arial, sans-serif" font-size="13" fill="#333333">Accept 80% solutions and</text>
  <text x="700" y="528" font-family="Arial, sans-serif" font-size="13" fill="#333333">refine in follow-up turns.</text>
  <text x="700" y="546" font-family="Arial, sans-serif" font-size="13" fill="#333333">Use "Now add error handling"</text>
  <text x="700" y="564" font-family="Arial, sans-serif" font-size="13" fill="#333333">to extend prior output.</text>
  <text x="700" y="598" font-family="monospace" font-size="12" fill="#666666">"Now add logging and</text>
  <text x="700" y="614" font-family="monospace" font-size="12" fill="#666666"> unit tests."</text>

  <rect x="990" y="445" width="250" height="165" rx="8" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>
  <text x="1115" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6a1b9a" text-anchor="middle">Few-Shot Examples</text>
  <text x="1010" y="492" font-family="Arial, sans-serif" font-size="13" fill="#333333">Provide 2-3 input/output</text>
  <text x="1010" y="510" font-family="Arial, sans-serif" font-size="13" fill="#333333">pairs to demonstrate style</text>
  <text x="1010" y="528" font-family="Arial, sans-serif" font-size="13" fill="#333333">and structure. Extremely</text>
  <text x="1010" y="546" font-family="Arial, sans-serif" font-size="13" fill="#333333">effective for code style</text>
  <text x="1010" y="564" font-family="Arial, sans-serif" font-size="13" fill="#333333">matching and templates.</text>
  <text x="1010" y="598" font-family="monospace" font-size="12" fill="#666666">"Input: 5 -&gt; Output: 25</text>
  <text x="1010" y="614" font-family="monospace" font-size="12" fill="#666666"> Input: 3 -&gt; ?"</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- == FORMULA HEADER == -->
  <rect x="60" y="30" width="1160" height="50" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Context + Task + Constraints + Format + Examples = Effective Prompt</text>

  <!-- == FIVE COMPONENTS == -->
  <!-- Context -->
  <rect x="60" y="100" width="210" height="130" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">CONTEXT</text>
  <text x="165" y="150" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">Who you are,</text>
  <text x="165" y="167" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">what project,</text>
  <text x="165" y="184" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">language/stack,</text>
  <text x="165" y="201" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">existing codebase</text>
  <text x="270" y="168" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">+</text>

  <!-- Task -->
  <rect x="290" y="100" width="210" height="130" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">TASK</text>
  <text x="395" y="150" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">Specific action:</text>
  <text x="395" y="167" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">write, fix, explain,</text>
  <text x="395" y="184" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">refactor, test,</text>
  <text x="395" y="201" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">document</text>
  <text x="500" y="168" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">+</text>

  <!-- Constraints -->
  <rect x="520" y="100" width="210" height="130" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="625" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">CONSTRAINTS</text>
  <text x="625" y="150" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">No dependencies,</text>
  <text x="625" y="167" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">max lines, style,</text>
  <text x="625" y="184" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">performance, or</text>
  <text x="625" y="201" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">security rules</text>
  <text x="730" y="168" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">+</text>

  <!-- Format -->
  <rect x="750" y="100" width="210" height="130" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="855" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">FORMAT</text>
  <text x="855" y="150" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">Code block, JSON,</text>
  <text x="855" y="167" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">markdown, step-by-</text>
  <text x="855" y="184" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">step explanation,</text>
  <text x="855" y="201" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">inline comments</text>
  <text x="960" y="168" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">+</text>

  <!-- Examples -->
  <rect x="980" y="100" width="260" height="130" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">EXAMPLES</text>
  <text x="1110" y="150" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">Sample input/output,</text>
  <text x="1110" y="167" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">existing code style,</text>
  <text x="1110" y="184" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">test cases, or data</text>
  <text x="1110" y="201" font-family="Arial, sans-serif" font-size="12" fill="var(--text)" text-anchor="middle">to guide the model</text>

  <!-- == BEFORE / AFTER == -->
  <text x="60" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-accent)">BEFORE: Vague Prompt</text>
  <rect x="60" y="278" width="560" height="120" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="80" y="302" font-family="monospace" font-size="13" fill="var(--text-muted)">"Write a function to sort a list."</text>
  <text x="80" y="332" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-accent)">Problems:</text>
  <text x="80" y="352" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; No language specified</text>
  <text x="80" y="370" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; No constraints (size, type, stability)</text>
  <text x="80" y="388" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">&#x2022; No format preference, no examples</text>

  <text x="660" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">AFTER: Structured Prompt</text>
  <rect x="660" y="278" width="560" height="120" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="680" y="302" font-family="monospace" font-size="12" fill="var(--text)">"In Python 3.11, write a function that sorts</text>
  <text x="680" y="320" font-family="monospace" font-size="12" fill="var(--text)">a list of dicts by a given key. Use only</text>
  <text x="680" y="338" font-family="monospace" font-size="12" fill="var(--text)">stdlib, add type hints, include docstring.</text>
  <text x="680" y="356" font-family="monospace" font-size="12" fill="var(--text)">Example: sort_by_key(data, 'age') -&gt; [...]"</text>
  <text x="680" y="382" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)">Context + Task + Constraints + Format + Example</text>

  <!-- == TIPS ROW == -->
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text-muted)">Advanced Techniques</text>

  <rect x="60" y="445" width="280" height="165" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="200" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Chain of Thought</text>
  <text x="80" y="492" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Ask the model to "think step</text>
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">by step" before answering.</text>
  <text x="80" y="528" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Surfaces reasoning errors</text>
  <text x="80" y="546" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">and produces better results</text>
  <text x="80" y="564" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">for complex logic tasks.</text>
  <text x="80" y="598" font-family="monospace" font-size="12" fill="var(--text-muted)">"First reason through ...</text>
  <text x="80" y="614" font-family="monospace" font-size="12" fill="var(--text-muted)"> then write the code."</text>

  <rect x="370" y="445" width="280" height="165" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="510" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Role Priming</text>
  <text x="390" y="492" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Assign an expert role to</text>
  <text x="390" y="510" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">guide response style and</text>
  <text x="390" y="528" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">depth. Security, performance,</text>
  <text x="390" y="546" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">or teaching roles all shift</text>
  <text x="390" y="564" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">the output meaningfully.</text>
  <text x="390" y="598" font-family="monospace" font-size="12" fill="var(--text-muted)">"You are a senior Go</text>
  <text x="390" y="614" font-family="monospace" font-size="12" fill="var(--text-muted)"> security engineer..."</text>

  <rect x="680" y="445" width="280" height="165" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="820" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Iterative Refinement</text>
  <text x="700" y="492" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Start broad, then narrow.</text>
  <text x="700" y="510" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Accept 80% solutions and</text>
  <text x="700" y="528" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">refine in follow-up turns.</text>
  <text x="700" y="546" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Use "Now add error handling"</text>
  <text x="700" y="564" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">to extend prior output.</text>
  <text x="700" y="598" font-family="monospace" font-size="12" fill="var(--text-muted)">"Now add logging and</text>
  <text x="700" y="614" font-family="monospace" font-size="12" fill="var(--text-muted)"> unit tests."</text>

  <rect x="990" y="445" width="250" height="165" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1115" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Few-Shot Examples</text>
  <text x="1010" y="492" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Provide 2-3 input/output</text>
  <text x="1010" y="510" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">pairs to demonstrate style</text>
  <text x="1010" y="528" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">and structure. Extremely</text>
  <text x="1010" y="546" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">effective for code style</text>
  <text x="1010" y="564" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">matching and templates.</text>
  <text x="1010" y="598" font-family="monospace" font-size="12" fill="var(--text-muted)">"Input: 5 -&gt; Output: 25</text>
  <text x="1010" y="614" font-family="monospace" font-size="12" fill="var(--text-muted)"> Input: 3 -&gt; ?"</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- == FORMULA HEADER == -->
  <rect x="96.25" y="67.1875" width="1087.5" height="45.3125" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="96.1875" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">Context + Task + Constraints + Format + Examples = Effective Prompt</text>

  <!-- == FIVE COMPONENTS == -->
  <!-- Context -->
  <rect x="96.25" y="130.625" width="196.875" height="117.8125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="194.6875" y="156" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">CONTEXT</text>
  <text x="194.6875" y="175.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">Who you are,</text>
  <text x="194.6875" y="191.3438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">what project,</text>
  <text x="194.6875" y="206.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">language/stack,</text>
  <text x="194.6875" y="222.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">existing codebase</text>
  <text x="293.125" y="192.25" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">+</text>

  <!-- Task -->
  <rect x="311.875" y="130.625" width="196.875" height="117.8125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410.3125" y="156" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">TASK</text>
  <text x="410.3125" y="175.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">Specific action:</text>
  <text x="410.3125" y="191.3438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">write, fix, explain,</text>
  <text x="410.3125" y="206.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">refactor, test,</text>
  <text x="410.3125" y="222.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">document</text>
  <text x="508.75" y="192.25" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">+</text>

  <!-- Constraints -->
  <rect x="527.5" y="130.625" width="196.875" height="117.8125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="625.9375" y="156" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">CONSTRAINTS</text>
  <text x="625.9375" y="175.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">No dependencies,</text>
  <text x="625.9375" y="191.3438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">max lines, style,</text>
  <text x="625.9375" y="206.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">performance, or</text>
  <text x="625.9375" y="222.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">security rules</text>
  <text x="724.375" y="192.25" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">+</text>

  <!-- Format -->
  <rect x="743.125" y="130.625" width="196.875" height="117.8125" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="841.5625" y="156" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">FORMAT</text>
  <text x="841.5625" y="175.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">Code block, JSON,</text>
  <text x="841.5625" y="191.3438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">markdown, step-by-</text>
  <text x="841.5625" y="206.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">step explanation,</text>
  <text x="841.5625" y="222.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">inline comments</text>
  <text x="940" y="192.25" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">+</text>

  <!-- Examples -->
  <rect x="958.75" y="130.625" width="243.75" height="117.8125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080.625" y="156" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">EXAMPLES</text>
  <text x="1080.625" y="175.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">Sample input/output,</text>
  <text x="1080.625" y="191.3438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">existing code style,</text>
  <text x="1080.625" y="206.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">test cases, or data</text>
  <text x="1080.625" y="222.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)" text-anchor="middle">to guide the model</text>

  <!-- == BEFORE / AFTER == -->
  <text x="96.25" y="282.875" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--danger-accent)">BEFORE: Vague Prompt</text>
  <rect x="96.25" y="291.9375" width="525" height="108.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="115" y="313.6875" font-family="monospace" font-size="11.9827" fill="var(--text-muted)">"Write a function to sort a list."</text>
  <text x="115" y="340.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--danger-accent)">Problems:</text>
  <text x="115" y="359" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; No language specified</text>
  <text x="115" y="375.3125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; No constraints (size, type, stability)</text>
  <text x="115" y="391.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">&#x2022; No format preference, no examples</text>

  <text x="658.75" y="282.875" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)">AFTER: Structured Prompt</text>
  <rect x="658.75" y="291.9375" width="525" height="108.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="677.5" y="313.6875" font-family="monospace" font-size="11.0609" fill="var(--text)">"In Python 3.11, write a function that sorts</text>
  <text x="677.5" y="330" font-family="monospace" font-size="11.0609" fill="var(--text)">a list of dicts by a given key. Use only</text>
  <text x="677.5" y="346.3125" font-family="monospace" font-size="11.0609" fill="var(--text)">stdlib, add type hints, include docstring.</text>
  <text x="677.5" y="362.625" font-family="monospace" font-size="11.0609" fill="var(--text)">Example: sort_by_key(data, 'age') -&gt; [...]"</text>
  <text x="677.5" y="386.1875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)">Context + Task + Constraints + Format + Example</text>

  <!-- == TIPS ROW == -->
  <text x="96.25" y="429.6875" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--text-muted)">Advanced Techniques</text>

  <rect x="96.25" y="443.2812" width="262.5" height="149.5312" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="227.5" y="465.9375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Chain of Thought</text>
  <text x="115" y="485.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Ask the model to "think step</text>
  <text x="115" y="502.1875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">by step" before answering.</text>
  <text x="115" y="518.5" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Surfaces reasoning errors</text>
  <text x="115" y="534.8125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">and produces better results</text>
  <text x="115" y="551.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">for complex logic tasks.</text>
  <text x="115" y="581.9375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">"First reason through ...</text>
  <text x="115" y="596.4375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"> then write the code."</text>

  <rect x="386.875" y="443.2812" width="262.5" height="149.5312" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="518.125" y="465.9375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Role Priming</text>
  <text x="405.625" y="485.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Assign an expert role to</text>
  <text x="405.625" y="502.1875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">guide response style and</text>
  <text x="405.625" y="518.5" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">depth. Security, performance,</text>
  <text x="405.625" y="534.8125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">or teaching roles all shift</text>
  <text x="405.625" y="551.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">the output meaningfully.</text>
  <text x="405.625" y="581.9375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">"You are a senior Go</text>
  <text x="405.625" y="596.4375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"> security engineer..."</text>

  <rect x="677.5" y="443.2812" width="262.5" height="149.5312" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="808.75" y="465.9375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Iterative Refinement</text>
  <text x="696.25" y="485.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Start broad, then narrow.</text>
  <text x="696.25" y="502.1875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Accept 80% solutions and</text>
  <text x="696.25" y="518.5" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">refine in follow-up turns.</text>
  <text x="696.25" y="534.8125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Use "Now add error handling"</text>
  <text x="696.25" y="551.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">to extend prior output.</text>
  <text x="696.25" y="581.9375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">"Now add logging and</text>
  <text x="696.25" y="596.4375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"> unit tests."</text>

  <rect x="968.125" y="443.2812" width="234.375" height="149.5312" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1085.3125" y="465.9375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Few-Shot Examples</text>
  <text x="986.875" y="485.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Provide 2-3 input/output</text>
  <text x="986.875" y="502.1875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">pairs to demonstrate style</text>
  <text x="986.875" y="518.5" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">and structure. Extremely</text>
  <text x="986.875" y="534.8125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">effective for code style</text>
  <text x="986.875" y="551.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">matching and templates.</text>
  <text x="986.875" y="581.9375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">"Input: 5 -&gt; Output: 25</text>
  <text x="986.875" y="596.4375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"> Input: 3 -&gt; ?"</text>
</svg>

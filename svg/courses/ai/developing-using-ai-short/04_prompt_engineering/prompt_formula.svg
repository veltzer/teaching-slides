<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- == FORMULA HEADER == -->
  <rect x="40" y="40" width="1179.661017" height="49.657534" rx="6.541823" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.830508" y="71.780822" font-family="Arial, sans-serif" font-size="20.099642" font-weight="bold" fill="var(--bg)" text-anchor="middle">Context + Task + Constraints + Format + Examples = Effective Prompt</text>

  <!-- == FIVE COMPONENTS == -->
  <!-- Context -->
  <rect x="40" y="109.520548" width="213.559322" height="129.109589" rx="6.541823" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.779661" y="137.328767" font-family="Arial, sans-serif" font-size="16.079692" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">CONTEXT</text>
  <text x="146.779661" y="159.178082" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">Who you are,</text>
  <text x="146.779661" y="176.061699" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">what project,</text>
  <text x="146.779661" y="192.945205" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">language/stack,</text>
  <text x="146.779661" y="209.828712" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">existing codebase</text>
  <text x="253.559322" y="177.054795" font-family="Arial, sans-serif" font-size="20.099642" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">+</text>

  <!-- Task -->
  <rect x="273.898305" y="109.520548" width="213.559322" height="129.109589" rx="6.541823" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380.677966" y="137.328767" font-family="Arial, sans-serif" font-size="16.079692" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">TASK</text>
  <text x="380.677966" y="159.178082" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">Specific action:</text>
  <text x="380.677966" y="176.061699" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">write, fix, explain,</text>
  <text x="380.677966" y="192.945205" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">refactor, test,</text>
  <text x="380.677966" y="209.828712" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">document</text>
  <text x="487.457627" y="177.054795" font-family="Arial, sans-serif" font-size="20.099642" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">+</text>

  <!-- Constraints -->
  <rect x="507.79661" y="109.520548" width="213.559322" height="129.109589" rx="6.541823" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="614.576271" y="137.328767" font-family="Arial, sans-serif" font-size="16.079692" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">CONSTRAINTS</text>
  <text x="614.576271" y="159.178082" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">No dependencies,</text>
  <text x="614.576271" y="176.061699" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">max lines, style,</text>
  <text x="614.576271" y="192.945205" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">performance, or</text>
  <text x="614.576271" y="209.828712" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">security rules</text>
  <text x="721.355932" y="177.054795" font-family="Arial, sans-serif" font-size="20.099642" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">+</text>

  <!-- Format -->
  <rect x="741.694915" y="109.520548" width="213.559322" height="129.109589" rx="6.541823" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="848.474576" y="137.328767" font-family="Arial, sans-serif" font-size="16.079692" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">FORMAT</text>
  <text x="848.474576" y="159.178082" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">Code block, JSON,</text>
  <text x="848.474576" y="176.061699" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">markdown, step-by-</text>
  <text x="848.474576" y="192.945205" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">step explanation,</text>
  <text x="848.474576" y="209.828712" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">inline comments</text>
  <text x="955.254237" y="177.054795" font-family="Arial, sans-serif" font-size="20.099642" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">+</text>

  <!-- Examples -->
  <rect x="975.59322" y="109.520548" width="264.40678" height="129.109589" rx="6.541823" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1107.79661" y="137.328767" font-family="Arial, sans-serif" font-size="16.079692" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">EXAMPLES</text>
  <text x="1107.79661" y="159.178082" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">Sample input/output,</text>
  <text x="1107.79661" y="176.061699" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">existing code style,</text>
  <text x="1107.79661" y="192.945205" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">test cases, or data</text>
  <text x="1107.79661" y="209.828712" font-family="Arial, sans-serif" font-size="12.059742" fill="var(--text)" text-anchor="middle">to guide the model</text>

  <!-- == BEFORE / AFTER == -->
  <text x="40" y="276.369863" font-family="Arial, sans-serif" font-size="16.079692" font-weight="bold" fill="var(--danger-accent)">BEFORE: Vague Prompt</text>
  <rect x="40" y="286.30137" width="569.491525" height="119.178082" rx="6.541823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60.338983" y="310.136986" font-size="13.064784" fill="var(--text-muted)" font-family="Courier New, monospace">"Write a function to sort a list."</text>
  <text x="60.338983" y="339.931507" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--danger-accent)">Problems:</text>
  <text x="60.338983" y="359.794521" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text-muted)">&#x2022; No language specified</text>
  <text x="60.338983" y="377.671233" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text-muted)">&#x2022; No constraints (size, type, stability)</text>
  <text x="60.338983" y="395.547945" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text-muted)">&#x2022; No format preference, no examples</text>

  <text x="650.169492" y="276.369863" font-family="Arial, sans-serif" font-size="16.079692" font-weight="bold" fill="var(--ok-accent)">AFTER: Structured Prompt</text>
  <rect x="650.169492" y="286.30137" width="569.491525" height="119.178082" rx="6.541823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="670.508475" y="310.136986" font-size="12.059742" fill="var(--text)" font-family="Courier New, monospace">"In Python 3.11, write a function that sorts</text>
  <text x="670.508475" y="328.013699" font-size="12.059742" fill="var(--text)" font-family="Courier New, monospace">a list of dicts by a given key. Use only</text>
  <text x="670.508475" y="345.890411" font-size="12.059742" fill="var(--text)" font-family="Courier New, monospace">stdlib, add type hints, include docstring.</text>
  <text x="670.508475" y="363.767123" font-size="12.059742" fill="var(--text)" font-family="Courier New, monospace">Example: sort_by_key(data, 'age') -&gt; [...]"</text>
  <text x="670.508475" y="389.589041" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--ok-accent)">Context + Task + Constraints + Format + Example</text>

  <!-- == TIPS ROW == -->
  <text x="40" y="437.260274" font-family="Arial, sans-serif" font-size="16.079692" font-weight="bold" fill="var(--text-muted)">Advanced Techniques</text>

  <rect x="40" y="452.157479" width="284.745763" height="163.869808" rx="6.541823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="182.372881" y="476.986301" font-family="Arial, sans-serif" font-size="14.069717" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Chain of Thought</text>
  <text x="60.338983" y="498.835616" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">Ask the model to "think step</text>
  <text x="60.338983" y="516.712329" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">by step" before answering.</text>
  <text x="60.338983" y="534.589041" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">Surfaces reasoning errors</text>
  <text x="60.338983" y="552.465753" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">and produces better results</text>
  <text x="60.338983" y="570.342466" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">for complex logic tasks.</text>
  <text x="60.338983" y="604.109589" font-size="12.059742" fill="var(--text-muted)" font-family="Courier New, monospace">"First reason through ...</text>
  <text x="60.338983" y="620" font-size="12.059742" fill="var(--text-muted)" font-family="Courier New, monospace"> then write the code."</text>

  <rect x="355.254237" y="452.157479" width="284.745763" height="163.869808" rx="6.541823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="497.627119" y="476.986301" font-family="Arial, sans-serif" font-size="14.069717" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Role Priming</text>
  <text x="375.59322" y="498.835616" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">Assign an expert role to</text>
  <text x="375.59322" y="516.712329" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">guide response style and</text>
  <text x="375.59322" y="534.589041" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">depth. Security, performance,</text>
  <text x="375.59322" y="552.465753" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">or teaching roles all shift</text>
  <text x="375.59322" y="570.342466" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">the output meaningfully.</text>
  <text x="375.59322" y="604.109589" font-size="12.059742" fill="var(--text-muted)" font-family="Courier New, monospace">"You are a senior Go</text>
  <text x="375.59322" y="620" font-size="12.059742" fill="var(--text-muted)" font-family="Courier New, monospace"> security engineer..."</text>

  <rect x="670.508475" y="452.157479" width="284.745763" height="163.869808" rx="6.541823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="812.881356" y="476.986301" font-family="Arial, sans-serif" font-size="14.069717" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Iterative Refinement</text>
  <text x="690.847458" y="498.835616" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">Start broad, then narrow.</text>
  <text x="690.847458" y="516.712329" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">Accept 80% solutions and</text>
  <text x="690.847458" y="534.589041" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">refine in follow-up turns.</text>
  <text x="690.847458" y="552.465753" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">Use "Now add error handling"</text>
  <text x="690.847458" y="570.342466" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">to extend prior output.</text>
  <text x="690.847458" y="604.109589" font-size="12.059742" fill="var(--text-muted)" font-family="Courier New, monospace">"Now add logging and</text>
  <text x="690.847458" y="620" font-size="12.059742" fill="var(--text-muted)" font-family="Courier New, monospace"> unit tests."</text>

  <rect x="985.762712" y="452.157479" width="254.237288" height="163.869808" rx="6.541823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1112.881356" y="476.986301" font-family="Arial, sans-serif" font-size="14.069717" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Few-Shot Examples</text>
  <text x="1006.101695" y="498.835616" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">Provide 2-3 input/output</text>
  <text x="1006.101695" y="516.712329" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">pairs to demonstrate style</text>
  <text x="1006.101695" y="534.589041" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">and structure. Extremely</text>
  <text x="1006.101695" y="552.465753" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">effective for code style</text>
  <text x="1006.101695" y="570.342466" font-family="Arial, sans-serif" font-size="13.064784" fill="var(--text)">matching and templates.</text>
  <text x="1006.101695" y="604.109589" font-size="12.059742" fill="var(--text-muted)" font-family="Courier New, monospace">"Input: 5 -&gt; Output: 25</text>
  <text x="1006.101695" y="620" font-size="12.059742" fill="var(--text-muted)" font-family="Courier New, monospace"> Input: 3 -&gt; ?"</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.424811740757" font-weight="bold" fill="var(--primary-accent)">Prompt Formula</text>

  <!-- Five components row -->
  <rect x="40" y="71.071428571429" width="230" height="134.642857142857" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="107.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318608805568" font-weight="bold" fill="var(--bg)">CONTEXT</text>
  <text x="155" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Role, project,</text>
  <text x="155" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">language, stack</text>
  <text x="280" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389410762361" font-weight="bold" fill="var(--text-faint)">+</text>

  <rect x="290" y="71.071428571429" width="190" height="134.642857142857" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385" y="107.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318608805568" font-weight="bold" fill="var(--bg)">TASK</text>
  <text x="385" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Write, fix,</text>
  <text x="385" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">refactor, test</text>
  <text x="490" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389410762361" font-weight="bold" fill="var(--text-faint)">+</text>

  <rect x="500" y="71.071428571429" width="230" height="134.642857142857" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="107.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318608805568" font-weight="bold" fill="var(--bg)">CONSTRAINTS</text>
  <text x="615" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Style, size,</text>
  <text x="615" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">deps, security</text>
  <text x="740" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389410762361" font-weight="bold" fill="var(--text-faint)">+</text>

  <rect x="750" y="71.071428571429" width="210" height="134.642857142857" rx="8.141603913586" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="855" y="107.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318608805568" font-weight="bold" fill="var(--bg)">FORMAT</text>
  <text x="855" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Code, JSON,</text>
  <text x="855" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">markdown</text>
  <text x="970" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389410762361" font-weight="bold" fill="var(--text-faint)">+</text>

  <rect x="980" y="71.071428571429" width="260" height="134.642857142857" rx="8.141603913586" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="107.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318608805568" font-weight="bold" fill="var(--bg)">EXAMPLES</text>
  <text x="1110" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Few-shot pairs,</text>
  <text x="1110" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">test cases</text>

  <!-- Before / After -->
  <text x="320" y="252.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283207827171" font-weight="bold" fill="var(--danger-accent)">Vague</text>
  <rect x="40" y="267.857142857143" width="560" height="113.928571428571" rx="8.141603913586" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="305" font-family="Courier New, monospace" font-size="14" fill="var(--text-muted)">"Write a sort function."</text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-accent)">Missing all five</text>
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Output drifts</text>

  <text x="960" y="252.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283207827171" font-weight="bold" fill="var(--ok-accent)">Structured</text>
  <rect x="680" y="267.857142857143" width="560" height="113.928571428571" rx="8.141603913586" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="700" y="300" font-family="Courier New, monospace" font-size="12" fill="var(--text)">"Python 3.11: sort list[dict] by key.</text>
  <text x="700" y="322" font-family="Courier New, monospace" font-size="12" fill="var(--text)">Stdlib, type-hinted, docstring.</text>
  <text x="700" y="344" font-family="Courier New, monospace" font-size="12" fill="var(--text)">sort_by_key(d,'age')"</text>
  <text x="700" y="370" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)">All five present</text>

  <!-- Techniques -->
  <rect x="40" y="407.678571428571" width="290" height="212.321428571429" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">Chain of Thought</text>
  <text x="60" y="480" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">"Think step by step"</text>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Surfaces reasoning</text>

  <rect x="340" y="407.678571428571" width="290" height="212.321428571429" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">Role Priming</text>
  <text x="360" y="475" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Assign expert role</text>
  <text x="360" y="500.892857142857" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Shifts style and depth</text>
  <text x="360" y="526.785714285714" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--bg)">"senior Go engineer..."</text>

  <rect x="640" y="407.678571428571" width="290" height="212.321428571429" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">Iterate</text>
  <text x="660" y="475" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Start broad, refine</text>
  <text x="660" y="500.892857142857" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Extend turn-by-turn</text>
  <text x="660" y="526.785714285714" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--bg)">"Now add tests"</text>

  <rect x="940" y="407.678571428571" width="290" height="212.321428571429" rx="8.141603913586" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">Few-Shot</text>
  <text x="960" y="475" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Give 2-3 examples</text>
  <text x="960" y="500.892857142857" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--bg)">Demonstrates style</text>
  <text x="960" y="526.785714285714" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--bg)">"5 -&gt; 25, 3 -&gt; ?"</text>
</svg>

  <ns0:text x="389.3536" y="338.251" text-anchor="middle" fill="#444" font-size="10" font-family="Arial, sans-serif">• Divide-and-conquer: solve each sub-problem independently with AI</ns0:text>
  <ns0:text x="389.3536" y="358.9354" text-anchor="middle" fill="#444" font-size="10" font-family="Arial, sans-serif">• Chain prompting: output of one AI step feeds the next</ns0:text>

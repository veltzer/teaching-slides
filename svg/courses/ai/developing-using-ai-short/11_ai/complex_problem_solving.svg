<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="888.8889" height="500" fill="var(--bg)" rx="6.849"/>
  <rect x="251.1111" y="114.7223" width="777.7778" height="41.6667" rx="6.849" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="141.8056" text-anchor="middle" fill="var(--bg)" font-size="18.0556" font-weight="bold" font-family="Arial, sans-serif">AI-Powered Problem Decomposition</text>
  <rect x="251.1111" y="184.1667" width="229.1667" height="90.2778" rx="6.849" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="365.6944" y="234.1666" text-anchor="middle" fill="var(--warn-accent)" font-size="13.8889" font-weight="bold" font-family="Arial, sans-serif">Problem Analysis</text>
  <text x="365.6944" y="256.3889" text-anchor="middle" fill="var(--text-muted)" font-size="11.4149" font-family="Arial, sans-serif">Understand scope</text>
  <line x1="480.2778" y1="229.3056" x2="521.9445" y2="229.3056" stroke="var(--primary-border)" stroke-width="1.8251" marker-end="url(#arrow-primary)" />
  <rect x="528.8889" y="184.1667" width="222.2222" height="90.2778" rx="6.849" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="234.1666" text-anchor="middle" fill="var(--ok-accent)" font-size="13.8889" font-weight="bold" font-family="Arial, sans-serif">Decomposition</text>
  <text x="640" y="256.3889" text-anchor="middle" fill="var(--text-muted)" font-size="11.4149" font-family="Arial, sans-serif">Break into sub-tasks</text>
  <line x1="751.1111" y1="229.3056" x2="792.7778" y2="229.3056" stroke="var(--primary-border)" stroke-width="1.8251" marker-end="url(#arrow-primary)" />
  <rect x="799.7223" y="184.1667" width="229.1667" height="90.2778" rx="6.849" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="914.3056" y="234.1666" text-anchor="middle" fill="var(--primary-accent)" font-size="13.8889" font-weight="bold" font-family="Arial, sans-serif">Solution Synthesis</text>
  <text x="914.3056" y="256.3889" text-anchor="middle" fill="var(--text-muted)" font-size="11.4149" font-family="Arial, sans-serif">Combine results</text>
  <rect x="251.1111" y="309.1667" width="170.1389" height="76.3889" rx="6.849" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="335.8333" y="352.2222" text-anchor="middle" fill="var(--ok-accent)" font-size="11.8055" font-family="Arial, sans-serif">Sub-problem A</text>
  <rect x="442.0834" y="309.1667" width="170.1389" height="76.3889" rx="6.849" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="526.8055" y="352.2222" text-anchor="middle" fill="var(--ok-accent)" font-size="11.8055" font-family="Arial, sans-serif">Sub-problem B</text>
  <rect x="633.0556" y="309.1667" width="170.1389" height="76.3889" rx="6.849" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="717.7778" y="352.2222" text-anchor="middle" fill="var(--ok-accent)" font-size="11.8055" font-family="Arial, sans-serif">Sub-problem C</text>
  <rect x="824.0277" y="309.1667" width="204.8611" height="76.3889" rx="6.849" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="926.1111" y="352.2222" text-anchor="middle" fill="var(--primary-accent)" font-size="11.8055" font-family="Arial, sans-serif">Integration</text>
  <path d="M 640 274.4444 L 335.8333 309.1667" stroke="var(--text-faint)" stroke-width="0.9125" fill="none" marker-end="url(#arrow)" />
  <path d="M 640 274.4444 L 526.8055 309.1667" stroke="var(--text-faint)" stroke-width="0.9125" fill="none" marker-end="url(#arrow)" />
  <path d="M 640 274.4444 L 717.7778 309.1667" stroke="var(--text-faint)" stroke-width="0.9125" fill="none" marker-end="url(#arrow)" />
  <path d="M 640 274.4444 L 926.1111 309.1667" stroke="var(--text-faint)" stroke-width="0.9125" fill="none" marker-end="url(#arrow)" />
  <rect x="251.1111" y="413.3333" width="777.7778" height="138.8889" rx="6.849" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="441.1111" text-anchor="middle" fill="var(--primary-accent)" font-size="13.8889" font-weight="bold" font-family="Arial, sans-serif">AI Strategies for Complex Problems</text>
  <text x="640" y="466.1112" text-anchor="middle" fill="var(--text)" font-size="11.4149" font-family="Arial, sans-serif">• Divide-and-conquer: solve each sub-problem independently with AI</text>
  <text x="640" y="489.7223" text-anchor="middle" fill="var(--text)" font-size="11.4149" font-family="Arial, sans-serif">• Chain prompting: output of one AI step feeds the next</text>
  <text x="640" y="513.3334" text-anchor="middle" fill="var(--text)" font-size="11.4149" font-family="Arial, sans-serif">• Iterative refinement: start broad, drill into specifics</text>
  <text x="640" y="536.9445" text-anchor="middle" fill="var(--text)" font-size="11.4149" font-family="Arial, sans-serif">• Multiple AI perspectives: cross-validate solutions</text>
</svg>
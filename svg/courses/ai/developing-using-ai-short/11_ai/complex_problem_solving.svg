  <text x="389.3536" y="316.3498" text-anchor="middle" fill="var(--primary-dk)" font-size="12.1673" font-weight="bold" font-family="Arial, sans-serif">AI Strategies for Complex Problems</text>
  <text x="389.3536" y="338.251" text-anchor="middle" fill="var(--text-dark)" font-size="10" font-family="Arial, sans-serif">• Divide-and-conquer: solve each sub-problem independently with AI</text>
  <text x="389.3536" y="358.9354" text-anchor="middle" fill="var(--text-dark)" font-size="10" font-family="Arial, sans-serif">• Chain prompting: output of one AI step feeds the next</text>
  <text x="389.3536" y="379.6198" text-anchor="middle" fill="var(--text-dark)" font-size="10" font-family="Arial, sans-serif">• Iterative refinement: start broad, drill into specifics</text>

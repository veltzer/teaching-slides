  <rect x="475.78" y="223.8734" width="764.2198" height="37.7263" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="857.8898" y="248.3954" text-anchor="middle" fill="var(--bg)" font-size="17.0302" font-weight="bold" font-family="Arial, sans-serif">AI-Powered Problem Decomposition</text>
  <rect x="475.78" y="286.7507" width="225.1721" height="81.7405" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="588.3659" y="332.0221" text-anchor="middle" fill="var(--warn-accent)" font-size="16.4843" font-weight="bold" font-family="Arial, sans-serif">Problem Analysis</text>
  <text x="588.3659" y="352.1429" text-anchor="middle" fill="var(--text-muted)" font-size="16.4843" font-family="Arial, sans-serif">Understand scope</text>
  <line x1="700.9519" y1="327.6208" x2="741.8922" y2="327.6208" stroke="var(--primary-border)" stroke-width="0.7971" marker-end="url(#arrow-primary)" />
  <rect x="748.7155" y="286.7507" width="218.3484" height="81.7405" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="857.8898" y="332.0221" text-anchor="middle" fill="var(--ok-accent)" font-size="16.4843" font-weight="bold" font-family="Arial, sans-serif">Decomposition</text>
  <text x="857.8898" y="352.1429" text-anchor="middle" fill="var(--text-muted)" font-size="16.4843" font-family="Arial, sans-serif">Break into sub-tasks</text>
  <line x1="967.0641" y1="327.6208" x2="1008.0046" y2="327.6208" stroke="var(--primary-border)" stroke-width="0.7971" marker-end="url(#arrow-primary)" />
  <rect x="1014.8279" y="286.7507" width="225.1721" height="81.7405" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1127.414" y="332.0221" text-anchor="middle" fill="var(--primary-accent)" font-size="16.4843" font-weight="bold" font-family="Arial, sans-serif">Solution Synthesis</text>
  <text x="1127.414" y="352.1429" text-anchor="middle" fill="var(--text-muted)" font-size="16.4843" font-family="Arial, sans-serif">Combine results</text>
  <rect x="475.78" y="399.9297" width="167.1732" height="69.1651" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="559.0253" y="438.9134" text-anchor="middle" fill="var(--ok-accent)" font-size="16.4843" font-family="Arial, sans-serif">Sub-problem A</text>
  <rect x="663.4232" y="399.9297" width="167.1732" height="69.1651" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="746.6686" y="438.9134" text-anchor="middle" fill="var(--ok-accent)" font-size="16.4843" font-family="Arial, sans-serif">Sub-problem B</text>
  <rect x="851.0665" y="399.9297" width="167.1732" height="69.1651" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="934.312" y="438.9134" text-anchor="middle" fill="var(--ok-accent)" font-size="16.4843" font-family="Arial, sans-serif">Sub-problem C</text>
  <rect x="1038.7097" y="399.9297" width="201.29" height="69.1651" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1139.0135" y="438.9134" text-anchor="middle" fill="var(--primary-accent)" font-size="16.4843" font-family="Arial, sans-serif">Integration</text>
  <path d="M 857.8898 368.4909 L 559.0253 399.9297" stroke="var(--text-faint)" stroke-width="0.3985" fill="none" marker-end="url(#arrow)" />
  <path d="M 857.8898 368.4909 L 746.6686 399.9297" stroke="var(--text-faint)" stroke-width="0.3985" fill="none" marker-end="url(#arrow)" />
  <path d="M 857.8898 368.4909 L 934.312 399.9297" stroke="var(--text-faint)" stroke-width="0.3985" fill="none" marker-end="url(#arrow)" />
  <path d="M 857.8898 368.4909 L 1139.0135 399.9297" stroke="var(--text-faint)" stroke-width="0.3985" fill="none" marker-end="url(#arrow)" />
  <rect x="475.78" y="494.2455" width="764.2198" height="125.7545" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="857.8898" y="519.3963" text-anchor="middle" fill="var(--primary-accent)" font-size="16.4843" font-weight="bold" font-family="Arial, sans-serif">AI Strategies for Complex Problems</text>
  <text x="857.8898" y="542.0323" text-anchor="middle" fill="var(--text)" font-size="16.4843" font-family="Arial, sans-serif">• Divide-and-conquer: solve each sub-problem independently with AI</text>
  <text x="857.8898" y="563.4105" text-anchor="middle" fill="var(--text)" font-size="16.4843" font-family="Arial, sans-serif">• Chain prompting: output of one AI step feeds the next</text>
  <text x="857.8898" y="584.7889" text-anchor="middle" fill="var(--text)" font-size="16.4843" font-family="Arial, sans-serif">• Iterative refinement: start broad, drill into specifics</text>
  <text x="857.8898" y="606.1671" text-anchor="middle" fill="var(--text)" font-size="16.4843" font-family="Arial, sans-serif">• Multiple AI perspectives: cross-validate solutions</text>
</svg>
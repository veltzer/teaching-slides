<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="873.3941" height="452.7163" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="475.78" y="223.8734" width="764.2198" height="37.7263" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="857.8898" y="248.3954" text-anchor="middle" fill="var(--bg)" font-size="17.0302" font-weight="bold" font-family="Arial, sans-serif">AI-Powered Problem Decomposition</text>
  <rect x="475.78" y="286.7507" width="225.1721" height="81.7405" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.3659" y="332.0221" text-anchor="middle" fill="var(--warn-accent)" font-size="16.4843" font-weight="bold" font-family="Arial, sans-serif">Problem Analysis</text>
  <text x="588.3659" y="352.1429" text-anchor="middle" fill="var(--text-muted)" font-size="16.4843" font-family="Arial, sans-serif">Understand scope</text>
  <line x1="700.9519" y1="327.6208" x2="741.8922" y2="327.6208" stroke="var(--primary-border)" stroke-width="0.7971" marker-end="url(#arrow-primary)"/>
  <rect x="748.7155" y="286.7507" width="218.3484" height="81.7405" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="857.8898" y="332.0221" text-anchor="middle" fill="var(--ok-accent)" font-size="16.4843" font-weight="bold" font-family="Arial, sans-serif">Decomposition</text>
  <text x="857.8898" y="352.1429" text-anchor="middle" fill="var(--text-muted)" font-size="16.4843" font-family="Arial, sans-serif">Break into sub-tasks</text>
  <line x1="967.0641" y1="327.6208" x2="1008.0046" y2="327.6208" stroke="var(--primary-border)" stroke-width="0.7971" marker-end="url(#arrow-primary)"/>
  <rect x="1014.8279" y="286.7507" width="225.1721" height="81.7405" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1127.414" y="332.0221" text-anchor="middle" fill="var(--primary-accent)" font-size="16.4843" font-weight="bold" font-family="Arial, sans-serif">Solution Synthesis</text>
  <text x="1127.414" y="352.1429" text-anchor="middle" fill="var(--text-muted)" font-size="16.4843" font-family="Arial, sans-serif">Combine results</text>
  <rect x="475.78" y="399.9297" width="167.1732" height="69.1651" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="559.0253" y="438.9134" text-anchor="middle" fill="var(--ok-accent)" font-size="16.4843" font-family="Arial, sans-serif">Sub-problem A</text>
  <rect x="663.4232" y="399.9297" width="167.1732" height="69.1651" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="746.6686" y="438.9134" text-anchor="middle" fill="var(--ok-accent)" font-size="16.4843" font-family="Arial, sans-serif">Sub-problem B</text>
  <rect x="851.0665" y="399.9297" width="167.1732" height="69.1651" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="934.312" y="438.9134" text-anchor="middle" fill="var(--ok-accent)" font-size="16.4843" font-family="Arial, sans-serif">Sub-problem C</text>
  <rect x="1038.7097" y="399.9297" width="201.29" height="69.1651" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1139.0135" y="438.9134" text-anchor="middle" fill="var(--primary-accent)" font-size="16.4843" font-family="Arial, sans-serif">Integration</text>
  <path d="M 857.8898 368.4909 L 559.0253 399.9297" stroke="var(--text-faint)" stroke-width="0.3985" fill="none" marker-end="url(#arrow)"/>
  <path d="M 857.8898 368.4909 L 746.6686 399.9297" stroke="var(--text-faint)" stroke-width="0.3985" fill="none" marker-end="url(#arrow)"/>
  <path d="M 857.8898 368.4909 L 934.312 399.9297" stroke="var(--text-faint)" stroke-width="0.3985" fill="none" marker-end="url(#arrow)"/>
  <path d="M 857.8898 368.4909 L 1139.0135 399.9297" stroke="var(--text-faint)" stroke-width="0.3985" fill="none" marker-end="url(#arrow)"/>
  <rect x="475.78" y="494.2455" width="764.2198" height="125.7545" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="857.8898" y="519.3963" text-anchor="middle" fill="var(--primary-accent)" font-size="16.4843" font-weight="bold" font-family="Arial, sans-serif">AI Strategies for Complex Problems</text>
  <text x="857.8898" y="542.0323" text-anchor="middle" fill="var(--text)" font-size="16.4843" font-family="Arial, sans-serif">• Divide-and-conquer: solve each sub-problem independently with AI</text>
  <text x="857.8898" y="563.4105" text-anchor="middle" fill="var(--text)" font-size="16.4843" font-family="Arial, sans-serif">• Chain prompting: output of one AI step feeds the next</text>
  <text x="857.8898" y="584.7889" text-anchor="middle" fill="var(--text)" font-size="16.4843" font-family="Arial, sans-serif">• Iterative refinement: start broad, drill into specifics</text>
  <text x="857.8898" y="606.1671" text-anchor="middle" fill="var(--text)" font-size="16.4843" font-family="Arial, sans-serif">• Multiple AI perspectives: cross-validate solutions</text>
</svg>

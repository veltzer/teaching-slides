  <rect width="614.2772" height="345.5309" fill="var(--bg)" rx="4.7331" />
  <rect x="173.5333" y="79.2802" width="537.4925" height="28.7943" rx="4.7331" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="1.3821" />
  <text x="442.2795" y="97.9964" text-anchor="middle" fill="var(--bg)" font-size="12.4775" font-weight="bold" font-family="Arial, sans-serif">AI-Powered Problem Decomposition</text>
  <rect x="173.5333" y="127.2706" width="158.3684" height="62.3875" rx="4.7331" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.3821" filter="url(#shadow)" />
  <text x="252.7174" y="161.8236" text-anchor="middle" fill="var(--warn-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Problem Analysis</text>
  <text x="252.7174" y="177.1806" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Understand scope</text>
  <line x1="331.9016" y1="158.4643" x2="360.6959" y2="158.4643" stroke="var(--primary-border)" stroke-width="1.2613" marker-end="url(#arrow-primary)" />
  <rect x="365.4949" y="127.2706" width="153.5693" height="62.3875" rx="4.7331" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.3821" filter="url(#shadow)" />
  <text x="442.2795" y="161.8236" text-anchor="middle" fill="var(--ok-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Decomposition</text>
  <text x="442.2795" y="177.1806" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Break into sub-tasks</text>
  <line x1="519.0642" y1="158.4643" x2="547.8585" y2="158.4643" stroke="var(--primary-border)" stroke-width="1.2613" marker-end="url(#arrow-primary)" />
  <rect x="552.6575" y="127.2706" width="158.3684" height="62.3875" rx="4.7331" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.3821" filter="url(#shadow)" />
  <text x="631.8417" y="161.8236" text-anchor="middle" fill="var(--primary-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Solution Synthesis</text>
  <text x="631.8417" y="177.1806" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Combine results</text>
  <rect x="173.5333" y="213.6533" width="117.5765" height="52.7895" rx="4.7331" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.3821" filter="url(#shadow)" />
  <text x="232.0816" y="243.4073" text-anchor="middle" fill="var(--ok-accent)" font-size="10" font-family="Arial, sans-serif">Sub-problem A</text>
  <rect x="305.5069" y="213.6533" width="117.5765" height="52.7895" rx="4.7331" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.3821" filter="url(#shadow)" />
  <text x="364.0552" y="243.4073" text-anchor="middle" fill="var(--ok-accent)" font-size="10" font-family="Arial, sans-serif">Sub-problem B</text>
  <rect x="437.4805" y="213.6533" width="117.5765" height="52.7895" rx="4.7331" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.3821" filter="url(#shadow)" />
  <text x="496.0288" y="243.4073" text-anchor="middle" fill="var(--ok-accent)" font-size="10" font-family="Arial, sans-serif">Sub-problem C</text>
  <rect x="569.4541" y="213.6533" width="141.5717" height="52.7895" rx="4.7331" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.3821" filter="url(#shadow)" />
  <text x="640" y="243.4073" text-anchor="middle" fill="var(--primary-accent)" font-size="10" font-family="Arial, sans-serif">Integration</text>
  <path d="M 442.2795 189.658 L 232.0816 213.6533" stroke="var(--text-faint)" stroke-width="0.6306" fill="none" marker-end="url(#arrow)" />
  <path d="M 442.2795 189.658 L 364.0552 213.6533" stroke="var(--text-faint)" stroke-width="0.6306" fill="none" marker-end="url(#arrow)" />
  <path d="M 442.2795 189.658 L 496.0288 213.6533" stroke="var(--text-faint)" stroke-width="0.6306" fill="none" marker-end="url(#arrow)" />
  <path d="M 442.2795 189.658 L 640 213.6533" stroke="var(--text-faint)" stroke-width="0.6306" fill="none" marker-end="url(#arrow)" />
  <rect x="173.5333" y="285.6389" width="537.4925" height="95.9808" rx="4.7331" fill="var(--surface)" stroke="var(--border)" stroke-width="0.6911" filter="url(#shadow)" />
  <text x="442.2795" y="304.835" text-anchor="middle" fill="var(--primary-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">AI Strategies for Complex Problems</text>
  <text x="442.2795" y="322.1116" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">• Divide-and-conquer: solve each sub-problem independently with AI</text>
  <text x="442.2795" y="338.4284" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">• Chain prompting: output of one AI step feeds the next</text>
  <text x="442.2795" y="354.7451" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">• Iterative refinement: start broad, drill into specifics</text>
  <text x="442.2795" y="371.0618" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">• Multiple AI perspectives: cross-validate solutions</text>
</svg>
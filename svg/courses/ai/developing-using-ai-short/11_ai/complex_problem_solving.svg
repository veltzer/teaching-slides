<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="778.7072" height="438.0228" fill="var(--bg)" rx="6"/>
  <rect x="48.6692" y="30.4183" width="681.3688" height="36.5019" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="389.3536" y="54.1445" text-anchor="middle" fill="var(--bg)" font-size="15.8175" font-weight="bold" font-family="Arial, sans-serif">AI-Powered Problem Decomposition</text>
  <rect x="48.6692" y="91.2548" width="200.7605" height="79.0875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="149.0494" y="135.057" text-anchor="middle" fill="var(--warn-accent)" font-size="12.1673" font-weight="bold" font-family="Arial, sans-serif">Problem Analysis</text>
  <text x="149.0494" y="154.5247" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Understand scope</text>
  <line x1="249.4297" y1="130.7985" x2="285.9316" y2="130.7985" stroke="var(--primary-border)" stroke-width="1.8251" marker-end="url(#arrow-primary)" />
  <rect x="292.0152" y="91.2548" width="194.6768" height="79.0875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="389.3536" y="135.057" text-anchor="middle" fill="var(--ok-accent)" font-size="12.1673" font-weight="bold" font-family="Arial, sans-serif">Decomposition</text>
  <text x="389.3536" y="154.5247" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Break into sub-tasks</text>
  <line x1="486.692" y1="130.7985" x2="523.1939" y2="130.7985" stroke="var(--primary-border)" stroke-width="1.8251" marker-end="url(#arrow-primary)" />
  <rect x="529.2776" y="91.2548" width="200.7605" height="79.0875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="629.6578" y="135.057" text-anchor="middle" fill="var(--primary-accent)" font-size="12.1673" font-weight="bold" font-family="Arial, sans-serif">Solution Synthesis</text>
  <text x="629.6578" y="154.5247" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Combine results</text>
  <rect x="48.6692" y="200.7605" width="149.0494" height="66.9202" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="122.8897" y="238.4791" text-anchor="middle" fill="var(--ok-accent)" font-size="10.3422" font-family="Arial, sans-serif">Sub-problem A</text>
  <rect x="215.9696" y="200.7605" width="149.0494" height="66.9202" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="290.1901" y="238.4791" text-anchor="middle" fill="var(--ok-accent)" font-size="10.3422" font-family="Arial, sans-serif">Sub-problem B</text>
  <rect x="383.27" y="200.7605" width="149.0494" height="66.9202" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="457.4905" y="238.4791" text-anchor="middle" fill="var(--ok-accent)" font-size="10.3422" font-family="Arial, sans-serif">Sub-problem C</text>
  <rect x="550.5703" y="200.7605" width="179.4677" height="66.9202" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="238.4791" text-anchor="middle" fill="var(--primary-accent)" font-size="10.3422" font-family="Arial, sans-serif">Integration</text>
  <path d="M 389.3536 170.3422 L 122.8897 200.7605" stroke="var(--text-faint)" stroke-width="0.9125" fill="none" marker-end="url(#arrow)" />
  <path d="M 389.3536 170.3422 L 290.1901 200.7605" stroke="var(--text-faint)" stroke-width="0.9125" fill="none" marker-end="url(#arrow)" />
  <path d="M 389.3536 170.3422 L 457.4905 200.7605" stroke="var(--text-faint)" stroke-width="0.9125" fill="none" marker-end="url(#arrow)" />
  <path d="M 389.3536 170.3422 L 640 200.7605" stroke="var(--text-faint)" stroke-width="0.9125" fill="none" marker-end="url(#arrow)" />
  <rect x="48.6692" y="292.0152" width="681.3688" height="121.673" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="389.3536" y="316.3498" text-anchor="middle" fill="var(--primary-accent)" font-size="12.1673" font-weight="bold" font-family="Arial, sans-serif">AI Strategies for Complex Problems</text>
  <text x="389.3536" y="338.251" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">• Divide-and-conquer: solve each sub-problem independently with AI</text>
  <text x="389.3536" y="358.9354" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">• Chain prompting: output of one AI step feeds the next</text>
  <text x="389.3536" y="379.6198" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">• Iterative refinement: start broad, drill into specifics</text>
  <text x="389.3536" y="400.3042" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">• Multiple AI perspectives: cross-validate solutions</text>
</svg>
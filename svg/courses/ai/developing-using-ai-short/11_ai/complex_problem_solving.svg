  <text x="476.2903" y="302.9551" text-anchor="middle" fill="var(--primary-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">AI Strategies for Complex Problems</text>
  <text x="476.2903" y="317.2599" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">• Divide-and-conquer: solve each sub-problem independently with AI</text>
  <text x="476.2903" y="330.7699" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">• Chain prompting: output of one AI step feeds the next</text>
  <text x="476.2903" y="344.28" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">• Iterative refinement: start broad, drill into specifics</text>
  <text x="476.2903" y="357.79" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">• Multiple AI perspectives: cross-validate solutions</text>

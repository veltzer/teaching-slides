<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header -->
  <rect x="80" y="40" width="1120" height="60" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="79" text-anchor="middle" fill="white" font-size="26" font-weight="bold" font-family="Arial, sans-serif">The Advanced AI Mindset</text>
  <!-- Four circles in diamond pattern -->
  <circle cx="280" cy="380" r="140" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="280" y="358" text-anchor="middle" fill="#1565c0" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Strategic</text>
  <text x="280" y="388" text-anchor="middle" fill="#1565c0" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Thinking</text>
  <text x="280" y="428" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">See the bigger picture</text>
  <circle cx="640" cy="200" r="120" fill="#f3e5f5" stroke="#8e24aa" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="182" text-anchor="middle" fill="#6a1b9a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Tool</text>
  <text x="640" y="212" text-anchor="middle" fill="#6a1b9a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Orchestration</text>
  <text x="640" y="248" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Right AI for each task</text>
  <circle cx="640" cy="540" r="120" fill="#e8f5e9" stroke="#43a047" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="522" text-anchor="middle" fill="#2e7d32" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Context</text>
  <text x="640" y="552" text-anchor="middle" fill="#2e7d32" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Mastery</text>
  <text x="640" y="590" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Rich, precise prompting</text>
  <circle cx="1000" cy="380" r="140" fill="#fff3e0" stroke="#fb8c00" stroke-width="3" filter="url(#shadow)"/>
  <text x="1000" y="358" text-anchor="middle" fill="#e65100" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Iterative</text>
  <text x="1000" y="388" text-anchor="middle" fill="#e65100" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Refinement</text>
  <text x="1000" y="428" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Improve continuously</text>
  <!-- Lines connecting the four -->
  <line x1="420" y1="380" x2="528" y2="280" stroke="#bdbdbd" stroke-width="2"/>
  <line x1="420" y1="380" x2="528" y2="480" stroke="#bdbdbd" stroke-width="2"/>
  <line x1="752" y1="280" x2="860" y2="380" stroke="#bdbdbd" stroke-width="2"/>
  <line x1="752" y1="480" x2="860" y2="380" stroke="#bdbdbd" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="55.291364" rx="6.86045" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75.939335" text-anchor="middle" fill="var(--bg)" font-size="25.83497" font-weight="bold" font-family="Arial, sans-serif">The Advanced AI Mindset</text>
  <rect x="115.174" y="214.206" width="278.223" height="278.223" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="254.285714" y="333.044353" text-anchor="middle" fill="var(--primary-accent)" font-size="19.873125" font-weight="bold" font-family="Arial, sans-serif">Strategic</text>
  <text x="254.285714" y="360.690093" text-anchor="middle" fill="var(--primary-accent)" font-size="19.873125" font-weight="bold" font-family="Arial, sans-serif">Thinking</text>
  <text x="254.285714" y="397.550888" text-anchor="middle" fill="var(--text-muted)" font-size="13.911052" font-family="Arial, sans-serif">See the bigger picture</text>
  <rect x="520.762" y="68.2052" width="238.477" height="238.477" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="640" y="170.856216" text-anchor="middle" fill="var(--info-accent)" font-size="19.873125" font-weight="bold" font-family="Arial, sans-serif">Tool</text>
  <text x="640" y="198.501841" text-anchor="middle" fill="var(--info-accent)" font-size="19.873125" font-weight="bold" font-family="Arial, sans-serif">Orchestration</text>
  <text x="640" y="231.676681" text-anchor="middle" fill="var(--text-muted)" font-size="13.911052" font-family="Arial, sans-serif">Right AI for each task</text>
  <rect x="520.762" y="381.523" width="238.477" height="238.477" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="640" y="484.174173" text-anchor="middle" fill="var(--ok-accent)" font-size="19.873125" font-weight="bold" font-family="Arial, sans-serif">Context</text>
  <text x="640" y="511.819913" text-anchor="middle" fill="var(--ok-accent)" font-size="19.873125" font-weight="bold" font-family="Arial, sans-serif">Mastery</text>
  <text x="640" y="546.837672" text-anchor="middle" fill="var(--text-muted)" font-size="13.911052" font-family="Arial, sans-serif">Rich, precise prompting</text>
  <rect x="886.603" y="214.206" width="278.223" height="278.223" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="1025.714286" y="333.044353" text-anchor="middle" fill="var(--warn-accent)" font-size="19.873125" font-weight="bold" font-family="Arial, sans-serif">Iterative</text>
  <text x="1025.714286" y="360.690093" text-anchor="middle" fill="var(--warn-accent)" font-size="19.873125" font-weight="bold" font-family="Arial, sans-serif">Refinement</text>
  <text x="1025.714286" y="397.550888" text-anchor="middle" fill="var(--text-muted)" font-size="13.911052" font-family="Arial, sans-serif">Improve continuously</text>
  <line x1="404.285714" y1="353.317842" x2="520" y2="261.165569" stroke="var(--border)" stroke-width="1.7778"/>
  <line x1="404.285714" y1="353.317842" x2="520" y2="445.47023" stroke="var(--border)" stroke-width="1.7778"/>
  <line x1="759.999886" y1="261.165569" x2="875.714171" y2="353.317842" stroke="var(--border)" stroke-width="1.7778"/>
  <line x1="759.999886" y1="445.47023" x2="875.714171" y2="353.317842" stroke="var(--border)" stroke-width="1.7778"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Title -->
  <text x="640" y="50" text-anchor="middle" fill="#1565c0" font-size="28" font-weight="bold" font-family="Arial, sans-serif">AI-Driven Iterative Development</text>
  <!-- Circular layout: Plan top, Build right, Test bottom, Refine left -->
  <circle cx="640" cy="340" r="290" fill="none" stroke="#e0e0e0" stroke-width="3"/>
  <circle cx="640" cy="100" r="90" fill="#fff3e0" stroke="#fb8c00" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="88" text-anchor="middle" fill="#e65100" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Plan</text>
  <text x="640" y="118" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">AI clarifies</text>
  <circle cx="930" cy="340" r="90" fill="#e8f5e9" stroke="#43a047" stroke-width="3" filter="url(#shadow)"/>
  <text x="930" y="328" text-anchor="middle" fill="#2e7d32" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Build</text>
  <text x="930" y="358" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">AI codes</text>
  <circle cx="640" cy="580" r="90" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="568" text-anchor="middle" fill="#1565c0" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="640" y="598" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">AI validates</text>
  <circle cx="350" cy="340" r="90" fill="#fce4ec" stroke="#e91e63" stroke-width="3" filter="url(#shadow)"/>
  <text x="350" y="328" text-anchor="middle" fill="#880e4f" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Refine</text>
  <text x="350" y="358" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">AI improves</text>
  <!-- Arrows clockwise -->
  <path d="M700 175 Q820 230 860 275" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <path d="M908 430 Q868 520 720 568" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <path d="M562 566 Q440 530 398 430" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <path d="M372 250 Q462 170 580 138" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <!-- Center text -->
  <text x="640" y="328" text-anchor="middle" fill="#888" font-size="15" font-family="Arial, sans-serif">Continuous</text>
  <text x="640" y="352" text-anchor="middle" fill="#888" font-size="15" font-family="Arial, sans-serif">AI feedback</text>
  <text x="640" y="376" text-anchor="middle" fill="#888" font-size="15" font-family="Arial, sans-serif">loop</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999998" y="80.512643" text-anchor="middle" fill="var(--primary-accent)" font-size="32.919804" font-weight="bold" font-family="Arial, sans-serif">AI-Driven Iterative Development</text>
  <rect x="208.076838" y="60.8549" width="863.846325" height="538.29" rx="17.735283" fill="none" stroke="var(--border)" stroke-width="2.1145"/>
  <rect x="505.954493" y="40" width="268.089409" height="167.055" rx="17.735283" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2.1145" filter="url(#shadow)"/>
  <text x="639.999998" y="113.204079" text-anchor="middle" fill="var(--warn-accent)" font-size="23.514049" font-weight="bold" font-family="Arial, sans-serif">Plan</text>
  <text x="639.999998" y="139.013046" text-anchor="middle" fill="var(--text-muted)" font-size="16.68029" font-family="Arial, sans-serif">AI clarifies</text>
  <rect x="971.910591" y="246.472" width="268.089409" height="167.055" rx="17.735283" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2.1145" filter="url(#shadow)"/>
  <text x="1105.955581" y="319.676349" text-anchor="middle" fill="var(--ok-accent)" font-size="23.514049" font-weight="bold" font-family="Arial, sans-serif">Build</text>
  <text x="1105.955581" y="345.485423" text-anchor="middle" fill="var(--text-muted)" font-size="16.68029" font-family="Arial, sans-serif">AI codes</text>
  <rect x="505.954493" y="452.945" width="268.089409" height="167.055" rx="17.735283" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.1145" filter="url(#shadow)"/>
  <text x="639.999998" y="526.148619" text-anchor="middle" fill="var(--primary-accent)" font-size="23.514049" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="639.999998" y="551.957693" text-anchor="middle" fill="var(--text-muted)" font-size="16.68029" font-family="Arial, sans-serif">AI validates</text>
  <rect x="40" y="246.472" width="268.089409" height="167.055" rx="17.735283" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2.1145" filter="url(#shadow)"/>
  <text x="174.044415" y="319.676349" text-anchor="middle" fill="var(--danger-accent)" font-size="23.514049" font-weight="bold" font-family="Arial, sans-serif">Refine</text>
  <text x="174.044415" y="345.485423" text-anchor="middle" fill="var(--text-muted)" font-size="16.68029" font-family="Arial, sans-serif">AI improves</text>
  <path d="M 736.404773 188.050255 Q 929.213979 235.366765 993.483544 274.080429" fill="none" stroke="var(--primary-border)" stroke-width="2.1145" marker-end="url(#arrow-primary)"/>
  <path d="M 1070.607227 407.427114 Q 1006.337662 484.854229 768.53947 526.148619" fill="none" stroke="var(--primary-border)" stroke-width="2.1145" marker-end="url(#arrow-primary)"/>
  <path d="M 514.674013 524.428028 Q 318.651491 493.457289 251.168098 407.427114" fill="none" stroke="var(--primary-border)" stroke-width="2.1145" marker-end="url(#arrow-primary)"/>
  <path d="M 209.39277 252.572886 Q 353.999845 183.748831 543.595567 156.21906" fill="none" stroke="var(--primary-border)" stroke-width="2.1145" marker-end="url(#arrow-primary)"/>
  <text x="639.999998" y="319.676349" text-anchor="middle" fill="var(--text-faint)" font-size="17.63557" font-family="Arial, sans-serif">Continuous</text>
  <text x="639.999998" y="340.323544" text-anchor="middle" fill="var(--text-faint)" font-size="17.63557" font-family="Arial, sans-serif">AI feedback</text>
  <text x="639.999998" y="360.970846" text-anchor="middle" fill="var(--text-faint)" font-size="17.63557" font-family="Arial, sans-serif">loop</text>
</svg>

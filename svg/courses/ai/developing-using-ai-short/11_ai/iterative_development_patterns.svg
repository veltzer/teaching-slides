<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="639.999999" y="80.512643" text-anchor="middle" fill="var(--primary-accent)" font-size="25.986462" font-weight="bold" font-family="Arial, sans-serif">AI-Driven Iterative Development</text>
  <circle cx="639.999999" cy="330" r="269.145087" fill="none" stroke="var(--border)" stroke-width="2.1145" />
  <circle cx="639.999999" cy="123.52773" r="83.52773" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.1145" filter="url(#shadow)" />
  <text x="639.999999" y="113.204079" text-anchor="middle" fill="var(--warn-accent)" font-size="18.561682" font-weight="bold" font-family="Arial, sans-serif">Plan</text>
  <text x="639.999999" y="139.013046" text-anchor="middle" fill="var(--text-muted)" font-size="13.167202" font-family="Arial, sans-serif">AI clarifies</text>
  <circle cx="930.351678" cy="330" r="83.52773" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.1145" filter="url(#shadow)" />
  <text x="930.351678" y="319.676349" text-anchor="middle" fill="var(--ok-accent)" font-size="18.561682" font-weight="bold" font-family="Arial, sans-serif">Build</text>
  <text x="930.351678" y="345.485423" text-anchor="middle" fill="var(--text-muted)" font-size="13.167202" font-family="Arial, sans-serif">AI codes</text>
  <circle cx="639.999999" cy="536.47227" r="83.52773" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.1145" filter="url(#shadow)" />
  <text x="639.999999" y="526.148619" text-anchor="middle" fill="var(--primary-accent)" font-size="18.561682" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="639.999999" y="551.957693" text-anchor="middle" fill="var(--text-muted)" font-size="13.167202" font-family="Arial, sans-serif">AI validates</text>
  <circle cx="349.64832" cy="330" r="83.52773" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.1145" filter="url(#shadow)" />
  <text x="349.64832" y="319.676349" text-anchor="middle" fill="var(--danger-accent)" font-size="18.561682" font-weight="bold" font-family="Arial, sans-serif">Refine</text>
  <text x="349.64832" y="345.485423" text-anchor="middle" fill="var(--text-muted)" font-size="13.167202" font-family="Arial, sans-serif">AI improves</text>
  <path d="M 700.072867 188.050255 Q 820.218389 235.366765 860.26679 274.080429" fill="none" stroke="var(--primary-border)" stroke-width="2.1145" marker-end="url(#arrow-primary)" />
  <path d="M 908.324999 407.427114 Q 868.276598 484.854229 720.097014 526.148619" fill="none" stroke="var(--primary-border)" stroke-width="2.1145" marker-end="url(#arrow-primary)" />
  <path d="M 561.905409 524.428028 Q 439.757568 493.457289 397.706529 407.427114" fill="none" stroke="var(--primary-border)" stroke-width="2.1145" marker-end="url(#arrow-primary)" />
  <path d="M 371.674999 252.572886 Q 461.784247 183.748831 579.927345 156.21906" fill="none" stroke="var(--primary-border)" stroke-width="2.1145" marker-end="url(#arrow-primary)" />
  <text x="639.999999" y="319.676349" text-anchor="middle" fill="var(--text-faint)" font-size="13.921288" font-family="Arial, sans-serif">Continuous</text>
  <text x="639.999999" y="340.323544" text-anchor="middle" fill="var(--text-faint)" font-size="13.921288" font-family="Arial, sans-serif">AI feedback</text>
  <text x="639.999999" y="360.970846" text-anchor="middle" fill="var(--text-faint)" font-size="13.921288" font-family="Arial, sans-serif">loop</text>
</svg>
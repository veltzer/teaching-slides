<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="902.2026" height="507.489" fill="var(--bg)" rx="6"/>
  <text x="451.1013" y="35.2423" text-anchor="middle" fill="var(--primary-accent)" font-size="19.7357" font-weight="bold" font-family="Arial, sans-serif">AI-Driven Iterative Development</text>
  <circle cx="451.1013" cy="239.6476" r="204.4053" fill="none" stroke="var(--border)" stroke-width="2.1145" />
  <circle cx="451.1013" cy="70.4846" r="63.4361" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.1145" filter="url(#shadow)" />
  <text x="451.1013" y="62.0264" text-anchor="middle" fill="var(--warn-accent)" font-size="14.0969" font-weight="bold" font-family="Arial, sans-serif">Plan</text>
  <text x="451.1013" y="83.1718" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">AI clarifies</text>
  <circle cx="655.5066" cy="239.6476" r="63.4361" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.1145" filter="url(#shadow)" />
  <text x="655.5066" y="231.1894" text-anchor="middle" fill="var(--ok-accent)" font-size="14.0969" font-weight="bold" font-family="Arial, sans-serif">Build</text>
  <text x="655.5066" y="252.3348" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">AI codes</text>
  <circle cx="451.1013" cy="408.8106" r="63.4361" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.1145" filter="url(#shadow)" />
  <text x="451.1013" y="400.3524" text-anchor="middle" fill="var(--primary-accent)" font-size="14.0969" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="451.1013" y="421.4978" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">AI validates</text>
  <circle cx="246.696" cy="239.6476" r="63.4361" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.1145" filter="url(#shadow)" />
  <text x="246.696" y="231.1894" text-anchor="middle" fill="var(--danger-accent)" font-size="14.0969" font-weight="bold" font-family="Arial, sans-serif">Refine</text>
  <text x="246.696" y="252.3348" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">AI improves</text>
  <path d="M 493.3921 123.348 Q 577.9736 162.1145 606.1674 193.8326" fill="none" stroke="var(--primary-border)" stroke-width="2.1145" marker-end="url(#arrow-primary)" />
  <path d="M 640 303.0837 Q 611.8062 366.5198 507.489 400.3524" fill="none" stroke="var(--primary-border)" stroke-width="2.1145" marker-end="url(#arrow-primary)" />
  <path d="M 396.1233 398.9427 Q 310.1322 373.5683 280.5286 303.0837" fill="none" stroke="var(--primary-border)" stroke-width="2.1145" marker-end="url(#arrow-primary)" />
  <path d="M 262.2026 176.2115 Q 325.6388 119.8238 408.8106 97.2687" fill="none" stroke="var(--primary-border)" stroke-width="2.1145" marker-end="url(#arrow-primary)" />
  <text x="451.1013" y="231.1894" text-anchor="middle" fill="var(--text-faint)" font-size="10.5727" font-family="Arial, sans-serif">Continuous</text>
  <text x="451.1013" y="248.1057" text-anchor="middle" fill="var(--text-faint)" font-size="10.5727" font-family="Arial, sans-serif">AI feedback</text>
  <text x="451.1013" y="265.022" text-anchor="middle" fill="var(--text-faint)" font-size="10.5727" font-family="Arial, sans-serif">loop</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="57.049128" rx="6.968648" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="77.081998" text-anchor="middle" fill="var(--bg)" font-size="26.242417" font-weight="bold" font-family="Arial, sans-serif">Development Efficiency Optimization</text>
  <rect x="91.5518" y="183.941" width="282.611" height="282.611" rx="14" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="232.857143" y="306.2295" text-anchor="middle" fill="var(--warn-accent)" font-size="20.186546" font-weight="bold" font-family="Arial, sans-serif">Time</text>
  <text x="232.857143" y="336.655749" text-anchor="middle" fill="var(--warn-accent)" font-size="20.186546" font-weight="bold" font-family="Arial, sans-serif">Management</text>
  <text x="232.857143" y="376.590127" text-anchor="middle" fill="var(--text-muted)" font-size="14.130443" font-family="Arial, sans-serif">Timeboxing tasks</text>
  <text x="232.857143" y="399.409755" text-anchor="middle" fill="var(--text-muted)" font-size="14.130443" font-family="Arial, sans-serif">AI for scheduling</text>
  <rect x="498.695" y="183.941" width="282.611" height="282.611" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="640" y="306.2295" text-anchor="middle" fill="var(--ok-accent)" font-size="20.186546" font-weight="bold" font-family="Arial, sans-serif">Task</text>
  <text x="640" y="336.655749" text-anchor="middle" fill="var(--ok-accent)" font-size="20.186546" font-weight="bold" font-family="Arial, sans-serif">Prioritization</text>
  <text x="640" y="376.590127" text-anchor="middle" fill="var(--text-muted)" font-size="14.130443" font-family="Arial, sans-serif">AI-ranked backlog</text>
  <text x="640" y="399.409755" text-anchor="middle" fill="var(--text-muted)" font-size="14.130443" font-family="Arial, sans-serif">Impact vs effort</text>
  <rect x="905.837" y="183.941" width="282.611" height="282.611" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="1047.142857" y="306.2295" text-anchor="middle" fill="var(--primary-accent)" font-size="20.186546" font-weight="bold" font-family="Arial, sans-serif">Workflow</text>
  <text x="1047.142857" y="336.655749" text-anchor="middle" fill="var(--primary-accent)" font-size="20.186546" font-weight="bold" font-family="Arial, sans-serif">Automation</text>
  <text x="1047.142857" y="376.590127" text-anchor="middle" fill="var(--text-muted)" font-size="14.130443" font-family="Arial, sans-serif">Scripted pipelines</text>
  <text x="1047.142857" y="399.409755" text-anchor="middle" fill="var(--text-muted)" font-size="14.130443" font-family="Arial, sans-serif">AI-generated tests</text>
  <rect x="307.857143" y="505.901626" width="664.285714" height="114.098374" rx="6.968648" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="543.934496" text-anchor="middle" fill="var(--bg)" font-size="22.205131" font-weight="bold" font-family="Arial, sans-serif">Integrated Optimization</text>
  <text x="640" y="577.213124" text-anchor="middle" fill="var(--primary-accent)" font-size="16.149144" font-family="Arial, sans-serif">Time + Tasks + Automation working together</text>
  <text x="640" y="605.737629" text-anchor="middle" fill="var(--primary-accent)" font-size="16.149144" font-family="Arial, sans-serif">Result: 3x productivity multiplier</text>
</svg>
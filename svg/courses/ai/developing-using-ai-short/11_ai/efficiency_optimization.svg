<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="57.049128" rx="6.968648" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="77.081998" text-anchor="middle" fill="var(--bg)" font-size="26.242417" font-weight="bold" font-family="Arial, sans-serif">Development Efficiency Optimization</text>
  <rect x="91.5518" y="183.941" width="282.611" height="282.611" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="232.857143" y="306.2295" text-anchor="middle" fill="var(--warn-accent)" font-size="20.186546" font-weight="bold" font-family="Arial, sans-serif">Time</text>
  <text x="232.857143" y="336.655749" text-anchor="middle" fill="var(--warn-accent)" font-size="20.186546" font-weight="bold" font-family="Arial, sans-serif">Management</text>
  <text x="232.857143" y="376.590127" text-anchor="middle" fill="var(--text-muted)" font-size="14.130443" font-family="Arial, sans-serif">Timeboxing tasks</text>
  <text x="232.857143" y="399.409755" text-anchor="middle" fill="var(--text-muted)" font-size="14.130443" font-family="Arial, sans-serif">AI for scheduling</text>
  <rect x="498.695" y="183.941" width="282.611" height="282.611" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="640" y="306.2295" text-anchor="middle" fill="var(--ok-accent)" font-size="20.186546" font-weight="bold" font-family="Arial, sans-serif">Task</text>
  <text x="640" y="336.655749" text-anchor="middle" fill="var(--ok-accent)" font-size="20.186546" font-weight="bold" font-family="Arial, sans-serif">Prioritization</text>
  <text x="640" y="376.590127" text-anchor="middle" fill="var(--text-muted)" font-size="14.130443" font-family="Arial, sans-serif">AI-ranked backlog</text>
  <text x="640" y="399.409755" text-anchor="middle" fill="var(--text-muted)" font-size="14.130443" font-family="Arial, sans-serif">Impact vs effort</text>
  <rect x="905.837" y="183.941" width="282.611" height="282.611" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="1047.142857" y="306.2295" text-anchor="middle" fill="var(--primary-accent)" font-size="20.186546" font-weight="bold" font-family="Arial, sans-serif">Workflow</text>
  <text x="1047.142857" y="336.655749" text-anchor="middle" fill="var(--primary-accent)" font-size="20.186546" font-weight="bold" font-family="Arial, sans-serif">Automation</text>
  <text x="1047.142857" y="376.590127" text-anchor="middle" fill="var(--text-muted)" font-size="14.130443" font-family="Arial, sans-serif">Scripted pipelines</text>
  <text x="1047.142857" y="399.409755" text-anchor="middle" fill="var(--text-muted)" font-size="14.130443" font-family="Arial, sans-serif">AI-generated tests</text>
  <rect x="307.857143" y="505.901626" width="664.285714" height="114.098374" rx="6.968648" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="543.934496" text-anchor="middle" fill="var(--bg)" font-size="22.205131" font-weight="bold" font-family="Arial, sans-serif">Integrated Optimization</text>
  <text x="640" y="577.213124" text-anchor="middle" fill="var(--primary-accent)" font-size="16.149144" font-family="Arial, sans-serif">Time + Tasks + Automation working together</text>
  <text x="640" y="605.737629" text-anchor="middle" fill="var(--primary-accent)" font-size="16.149144" font-family="Arial, sans-serif">Result: 3x productivity multiplier</text>
</svg>
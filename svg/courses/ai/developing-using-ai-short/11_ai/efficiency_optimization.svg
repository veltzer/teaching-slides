<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header -->
  <rect x="80" y="50" width="1120" height="60" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="89" text-anchor="middle" fill="white" font-size="26" font-weight="bold" font-family="Arial, sans-serif">Development Efficiency Optimization</text>
  <!-- Three large circles -->
  <circle cx="260" cy="350" r="140" fill="#fff3e0" stroke="#fb8c00" stroke-width="3" filter="url(#shadow)"/>
  <text x="260" y="330" text-anchor="middle" fill="#e65100" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Time</text>
  <text x="260" y="362" text-anchor="middle" fill="#e65100" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Management</text>
  <text x="260" y="404" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Timeboxing tasks</text>
  <text x="260" y="428" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">AI for scheduling</text>
  <circle cx="640" cy="350" r="140" fill="#e8f5e9" stroke="#43a047" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="330" text-anchor="middle" fill="#2e7d32" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Task</text>
  <text x="640" y="362" text-anchor="middle" fill="#2e7d32" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Prioritization</text>
  <text x="640" y="404" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">AI-ranked backlog</text>
  <text x="640" y="428" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Impact vs effort</text>
  <circle cx="1020" cy="350" r="140" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="1020" y="330" text-anchor="middle" fill="#1565c0" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Workflow</text>
  <text x="1020" y="362" text-anchor="middle" fill="#1565c0" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Automation</text>
  <text x="1020" y="404" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Scripted pipelines</text>
  <text x="1020" y="428" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">AI-generated tests</text>
  <!-- Integrated box -->
  <rect x="330" y="540" width="620" height="120" rx="12" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="580" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Integrated Optimization</text>
  <text x="640" y="615" text-anchor="middle" fill="#bbdefb" font-size="16" font-family="Arial, sans-serif">Time + Tasks + Automation working together</text>
  <text x="640" y="645" text-anchor="middle" fill="#bbdefb" font-size="16" font-family="Arial, sans-serif">Result: 3x productivity multiplier</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="53.953434" rx="6.776939" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75.069793" text-anchor="middle" fill="var(--bg)" font-size="25.520482" font-weight="bold" font-family="Arial, sans-serif">Advanced Context Management</text>
  <rect x="40" y="129.922501" width="267.857143" height="152.868118" rx="6.776939" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="173.928571" y="183.876047" text-anchor="middle" fill="var(--warn-accent)" font-size="17.668043" font-weight="bold" font-family="Arial, sans-serif">Session</text>
  <text x="173.928571" y="210.852708" text-anchor="middle" fill="var(--warn-accent)" font-size="17.668043" font-weight="bold" font-family="Arial, sans-serif">Continuity</text>
  <text x="173.928571" y="242.325516" text-anchor="middle" fill="var(--text-muted)" font-size="13.741711" font-family="Arial, sans-serif">Persist key decisions</text>
  <text x="173.928571" y="264.806253" text-anchor="middle" fill="var(--text-muted)" font-size="13.741711" font-family="Arial, sans-serif">across sessions</text>
  <rect x="340" y="129.922501" width="267.857143" height="152.868118" rx="6.776939" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="473.928571" y="183.876047" text-anchor="middle" fill="var(--ok-accent)" font-size="17.668043" font-weight="bold" font-family="Arial, sans-serif">Context</text>
  <text x="473.928571" y="210.852708" text-anchor="middle" fill="var(--ok-accent)" font-size="17.668043" font-weight="bold" font-family="Arial, sans-serif">Preservation</text>
  <text x="473.928571" y="242.325516" text-anchor="middle" fill="var(--text-muted)" font-size="13.741711" font-family="Arial, sans-serif">Architecture notes</text>
  <text x="473.928571" y="264.806253" text-anchor="middle" fill="var(--text-muted)" font-size="13.741711" font-family="Arial, sans-serif">design decisions</text>
  <rect x="640" y="129.922501" width="267.857143" height="152.868118" rx="6.776939" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="773.928571" y="183.876047" text-anchor="middle" fill="var(--primary-accent)" font-size="17.668043" font-weight="bold" font-family="Arial, sans-serif">Information</text>
  <text x="773.928571" y="210.852708" text-anchor="middle" fill="var(--primary-accent)" font-size="17.668043" font-weight="bold" font-family="Arial, sans-serif">Organization</text>
  <text x="773.928571" y="242.325516" text-anchor="middle" fill="var(--text-muted)" font-size="13.741711" font-family="Arial, sans-serif">Structure prompts</text>
  <text x="773.928571" y="264.806253" text-anchor="middle" fill="var(--text-muted)" font-size="13.741711" font-family="Arial, sans-serif">systematically</text>
  <rect x="940" y="129.922501" width="300" height="152.868118" rx="6.776939" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="183.876047" text-anchor="middle" fill="var(--danger-accent)" font-size="17.668043" font-weight="bold" font-family="Arial, sans-serif">Reference</text>
  <text x="1090" y="210.852708" text-anchor="middle" fill="var(--danger-accent)" font-size="17.668043" font-weight="bold" font-family="Arial, sans-serif">Management</text>
  <text x="1090" y="242.325516" text-anchor="middle" fill="var(--text-muted)" font-size="13.741711" font-family="Arial, sans-serif">Link relevant code</text>
  <text x="1090" y="264.806253" text-anchor="middle" fill="var(--text-muted)" font-size="13.741711" font-family="Arial, sans-serif">files &amp; docs</text>
  <rect x="168.571429" y="323.255723" width="942.857143" height="143.875935" rx="6.776939" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="368.217085" text-anchor="middle" fill="var(--ok-accent)" font-size="21.594263" font-weight="bold" font-family="Arial, sans-serif">Long-term Development Context</text>
  <text x="640" y="404.18593" text-anchor="middle" fill="var(--text)" font-size="15.704877" font-family="Arial, sans-serif">Spanning multiple sessions and projects</text>
  <text x="640" y="431.162702" text-anchor="middle" fill="var(--text-muted)" font-size="13.741711" font-family="Arial, sans-serif">Use CLAUDE.md / project files to persist architectural context</text>
  <rect x="40" y="503.100726" width="1200" height="116.899274" rx="6.776939" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="539.069682" text-anchor="middle" fill="var(--primary-accent)" font-size="18.64957" font-weight="bold" font-family="Arial, sans-serif">Context Management Tips</text>
  <text x="640" y="568.744054" text-anchor="middle" fill="var(--text)" font-size="14.723351" font-family="Arial, sans-serif">• Summarize previous sessions at start — front-load critical constraints</text>
  <text x="640" y="593.92239" text-anchor="middle" fill="var(--text)" font-size="14.723351" font-family="Arial, sans-serif">• Use structured templates — reset context intentionally between unrelated tasks</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="80.2777" width="1050" height="48.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="111.6944" text-anchor="middle" fill="var(--bg)" font-size="22.5947" font-weight="bold" font-family="Arial, sans-serif">Advanced Context Management</text>
  <rect x="115" y="160.8333" width="234.375" height="136.9444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="232.1875" y="209.1667" text-anchor="middle" fill="var(--warn-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Session</text>
  <text x="232.1875" y="233.3333" text-anchor="middle" fill="var(--warn-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Continuity</text>
  <text x="232.1875" y="261.5277" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Persist key decisions</text>
  <text x="232.1875" y="281.6667" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">across sessions</text>
  <rect x="377.5" y="160.8333" width="234.375" height="136.9444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="494.6875" y="209.1667" text-anchor="middle" fill="var(--ok-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Context</text>
  <text x="494.6875" y="233.3333" text-anchor="middle" fill="var(--ok-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Preservation</text>
  <text x="494.6875" y="261.5277" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Architecture notes</text>
  <text x="494.6875" y="281.6667" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">design decisions</text>
  <rect x="640" y="160.8333" width="234.375" height="136.9444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="757.1875" y="209.1667" text-anchor="middle" fill="var(--primary-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Information</text>
  <text x="757.1875" y="233.3333" text-anchor="middle" fill="var(--primary-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Organization</text>
  <text x="757.1875" y="261.5277" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Structure prompts</text>
  <text x="757.1875" y="281.6667" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">systematically</text>
  <rect x="902.5" y="160.8333" width="262.5" height="136.9444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1033.75" y="209.1667" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Reference</text>
  <text x="1033.75" y="233.3333" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Management</text>
  <text x="1033.75" y="261.5277" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Link relevant code</text>
  <text x="1033.75" y="281.6667" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">files &amp; docs</text>
  <rect x="227.5" y="334.0277" width="825" height="128.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="374.3056" text-anchor="middle" fill="var(--ok-accent)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Long-term Development Context</text>
  <text x="640" y="406.5277" text-anchor="middle" fill="var(--text)" font-size="13.9044" font-family="Arial, sans-serif">Spanning multiple sessions and projects</text>
  <text x="640" y="430.6944" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Use CLAUDE.md / project files to persist architectural context</text>
  <rect x="115" y="495.1389" width="1050" height="104.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="527.3611" text-anchor="middle" fill="var(--primary-accent)" font-size="16.5115" font-weight="bold" font-family="Arial, sans-serif">Context Management Tips</text>
  <text x="640" y="553.9444" text-anchor="middle" fill="var(--text)" font-size="13.0354" font-family="Arial, sans-serif">• Summarize previous sessions at start — front-load critical constraints</text>
  <text x="640" y="576.5" text-anchor="middle" fill="var(--text)" font-size="13.0354" font-family="Arial, sans-serif">• Use structured templates — reset context intentionally between unrelated tasks</text>
</svg>
  <ns0:text x="568.8889" y="567.1111" text-anchor="middle" fill="#333333" font-size="13.3333" font-family="Arial, sans-serif">• Summarize previous sessions at start — front-load critical constraints</ns0:text>
  <ns0:text x="568.8889" y="592" text-anchor="middle" fill="#333333" font-size="13.3333" font-family="Arial, sans-serif">• Use structured templates — reset context intentionally between unrelated tasks</ns0:text>

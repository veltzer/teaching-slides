<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="899.584" height="474.7641" fill="var(--bg)" rx="5.9879" x="40" y="40"/>
  <rect x="452.864" y="222.014" width="787.136" height="39.5639" rx="5.9879" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="846.4322" y="247.7303" text-anchor="middle" fill="var(--bg)" font-size="17.6995" font-weight="bold" font-family="Arial, sans-serif">Continuous Improvement Cycle</text>
  <rect x="518.541" y="351.543" width="149.765" height="149.765" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="0.9779" filter="url(#shadow)"/>
  <text x="593.424" y="417.1947" text-anchor="middle" fill="var(--ok-accent)" font-size="15.609" font-weight="bold" font-family="Arial, sans-serif">Measure</text>
  <text x="593.424" y="436.9766" text-anchor="middle" fill="var(--ok-accent)" font-size="15.609" font-weight="bold" font-family="Arial, sans-serif">Impact</text>
  <text x="593.424" y="460.7149" text-anchor="middle" fill="var(--text-muted)" font-size="15.609" font-family="Arial, sans-serif">Collect metrics</text>
  <rect x="771.549" y="252.634" width="149.765" height="149.765" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="0.9779" filter="url(#shadow)"/>
  <text x="846.4322" y="318.2856" text-anchor="middle" fill="var(--primary-accent)" font-size="15.609" font-weight="bold" font-family="Arial, sans-serif">Analyze</text>
  <text x="846.4322" y="338.0675" text-anchor="middle" fill="var(--primary-accent)" font-size="15.609" font-weight="bold" font-family="Arial, sans-serif">Data</text>
  <text x="846.4322" y="361.8057" text-anchor="middle" fill="var(--text-muted)" font-size="15.609" font-family="Arial, sans-serif">Find patterns</text>
  <rect x="1024.56" y="351.543" width="149.765" height="149.765" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="0.9779" filter="url(#shadow)"/>
  <text x="1099.4401" y="417.1947" text-anchor="middle" fill="var(--warn-accent)" font-size="15.609" font-weight="bold" font-family="Arial, sans-serif">Optimize</text>
  <text x="1099.4401" y="436.9766" text-anchor="middle" fill="var(--warn-accent)" font-size="15.609" font-weight="bold" font-family="Arial, sans-serif">Usage</text>
  <text x="1099.4401" y="460.7149" text-anchor="middle" fill="var(--text-muted)" font-size="15.609" font-family="Arial, sans-serif">Adjust approach</text>
  <rect x="771.549" y="470.235" width="149.765" height="149.765" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="0.9779" filter="url(#shadow)"/>
  <text x="846.4322" y="535.8857" text-anchor="middle" fill="var(--danger-accent)" font-size="15.609" font-weight="bold" font-family="Arial, sans-serif">Implement</text>
  <text x="846.4322" y="555.6677" text-anchor="middle" fill="var(--danger-accent)" font-size="15.609" font-weight="bold" font-family="Arial, sans-serif">Changes</text>
  <text x="846.4322" y="579.4058" text-anchor="middle" fill="var(--text-muted)" font-size="15.609" font-family="Arial, sans-serif">Apply improvements</text>
  <path d="M 663.7039 386.8625 Q 748.0399 327.5171 778.9633 340.7049" fill="none" stroke="var(--primary-border)" stroke-width="0.9779" marker-end="url(#arrow-primary)"/>
  <path d="M 913.9008 351.2552 Q 1020.7264 373.6747 1034.7825 400.0506" fill="none" stroke="var(--primary-border)" stroke-width="0.9779" marker-end="url(#arrow-primary)"/>
  <path d="M 1071.3281 498.9597 Q 972.936 558.3052 922.3345 545.1173" fill="none" stroke="var(--primary-border)" stroke-width="0.9779" marker-end="url(#arrow-primary)"/>
  <path d="M 773.3408 533.2481 Q 684.7881 538.5234 655.2705 483.134" fill="none" stroke="var(--primary-border)" stroke-width="0.9779" marker-end="url(#arrow-primary)"/>
  <text x="846.4322" y="434.3391" text-anchor="middle" fill="var(--text-faint)" font-size="15.609" font-family="Arial, sans-serif">PDCA + AI</text>
</svg>

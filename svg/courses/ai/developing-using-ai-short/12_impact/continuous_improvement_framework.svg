  <path d="M 913.9008 352.5212 Q 1020.7264 375.0318 1034.7825 401.5149" fill="none" stroke="var(--primary-border)" stroke-width="0.9779" marker-end="url(#arrow-primary)" />
  <path d="M 1071.3281 500.8263 Q 972.936 560.4131 922.3345 547.1716" fill="none" stroke="var(--primary-border)" stroke-width="0.9779" marker-end="url(#arrow-primary)" />
  <path d="M 773.3408 535.2541 Q 684.7881 540.5508 655.2705 484.9364" fill="none" stroke="var(--primary-border)" stroke-width="0.9779" marker-end="url(#arrow-primary)" />
  <text x="846.4322" y="435.9429" text-anchor="middle" fill="var(--text-faint)" font-size="15.6407" font-family="Arial, sans-serif">PDCA + AI</text>

  <rect width="558.245" height="314.0128" fill="var(--bg)" rx="5.0766" />
  <rect x="256.2065" y="120.3856" width="488.4644" height="26.1678" rx="5.0766" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="1.3175" />
  <text x="500.4388" y="137.3945" text-anchor="middle" fill="var(--bg)" font-size="11.3393" font-weight="bold" font-family="Arial, sans-serif">Continuous Improvement Cycle</text>
  <circle cx="343.4323" cy="255.5855" r="47.9742" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="0.9779" filter="url(#shadow)" />
  <text x="343.4323" y="249.4797" text-anchor="middle" fill="var(--ok-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Measure</text>
  <text x="343.4323" y="262.5636" text-anchor="middle" fill="var(--ok-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Impact</text>
  <text x="343.4323" y="278.2643" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Collect metrics</text>
  <circle cx="500.4388" cy="190.1661" r="47.9742" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="0.9779" filter="url(#shadow)" />
  <text x="500.4388" y="184.0604" text-anchor="middle" fill="var(--primary-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Analyze</text>
  <text x="500.4388" y="197.1443" text-anchor="middle" fill="var(--primary-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Data</text>
  <text x="500.4388" y="212.8449" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Find patterns</text>
  <circle cx="657.4452" cy="255.5855" r="47.9742" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="0.9779" filter="url(#shadow)" />
  <text x="657.4452" y="249.4797" text-anchor="middle" fill="var(--warn-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Optimize</text>
  <text x="657.4452" y="262.5636" text-anchor="middle" fill="var(--warn-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Usage</text>
  <text x="657.4452" y="278.2643" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Adjust approach</text>
  <circle cx="500.4388" cy="334.0887" r="47.9742" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="0.9779" filter="url(#shadow)" />
  <text x="500.4388" y="327.9829" text-anchor="middle" fill="var(--danger-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Implement</text>
  <text x="500.4388" y="341.0668" text-anchor="middle" fill="var(--danger-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Changes</text>
  <text x="500.4388" y="356.7675" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Apply improvements</text>
  <path d="M 387.0451 229.4178 Q 439.3806 190.1661 458.5704 198.8887" fill="none" stroke="var(--primary-border)" stroke-width="0.9779" marker-end="url(#arrow-primary)" />
  <path d="M 542.3071 205.8668 Q 608.5987 220.6952 617.3213 238.1404" fill="none" stroke="var(--primary-border)" stroke-width="0.9779" marker-end="url(#arrow-primary)" />
  <path d="M 640 303.5597 Q 578.9419 342.8113 547.5407 334.0887" fill="none" stroke="var(--primary-border)" stroke-width="0.9779" marker-end="url(#arrow-primary)" />
  <path d="M 455.0813 326.2383 Q 400.1291 329.7274 381.8117 293.0926" fill="none" stroke="var(--primary-border)" stroke-width="0.9779" marker-end="url(#arrow-primary)" />
  <text x="500.4388" y="260.8191" text-anchor="middle" fill="var(--text-faint)" font-size="10" font-family="Arial, sans-serif">PDCA + AI</text>

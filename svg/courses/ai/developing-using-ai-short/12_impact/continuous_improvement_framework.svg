<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="853.3333" height="480" fill="var(--bg)" rx="6"/>
  <rect x="53.3333" y="26.6667" width="746.6667" height="40" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="426.6667" y="52.6667" text-anchor="middle" fill="var(--bg)" font-size="17.3333" font-weight="bold" font-family="Arial, sans-serif">Continuous Improvement Cycle</text>
  <circle cx="186.6667" cy="233.3333" r="73.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="186.6667" y="224" text-anchor="middle" fill="var(--ok-accent)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Measure</text>
  <text x="186.6667" y="244" text-anchor="middle" fill="var(--ok-accent)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Impact</text>
  <text x="186.6667" y="268" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Collect metrics</text>
  <circle cx="426.6667" cy="133.3333" r="73.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="426.6667" y="124" text-anchor="middle" fill="var(--primary-accent)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Analyze</text>
  <text x="426.6667" y="144" text-anchor="middle" fill="var(--primary-accent)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Data</text>
  <text x="426.6667" y="168" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Find patterns</text>
  <circle cx="666.6667" cy="233.3333" r="73.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="666.6667" y="224" text-anchor="middle" fill="var(--warn-accent)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Optimize</text>
  <text x="666.6667" y="244" text-anchor="middle" fill="var(--warn-accent)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Usage</text>
  <text x="666.6667" y="268" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Adjust approach</text>
  <circle cx="426.6667" cy="353.3333" r="73.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="426.6667" y="344" text-anchor="middle" fill="var(--danger-accent)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Implement</text>
  <text x="426.6667" y="364" text-anchor="middle" fill="var(--danger-accent)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Changes</text>
  <text x="426.6667" y="388" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Apply improvements</text>
  <path d="M 253.3333 193.3333 Q 333.3333 133.3333 362.6667 146.6667" fill="none" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <path d="M 490.6667 157.3333 Q 592 180 605.3333 206.6667" fill="none" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <path d="M 640 306.6667 Q 546.6667 366.6667 498.6667 353.3333" fill="none" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <path d="M 357.3333 341.3333 Q 273.3333 346.6667 245.3333 290.6667" fill="none" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="426.6667" y="241.3333" text-anchor="middle" fill="var(--text-faint)" font-size="11.3333" font-family="Arial, sans-serif">PDCA + AI</text>
</svg>
  <text x="186.6667" y="244" text-anchor="middle" fill="var(--ok-dk)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Impact</text>
  <text x="186.6667" y="268" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Collect metrics</text>
  <circle cx="426.6667" cy="133.3333" r="73.3333" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)" />
  <text x="426.6667" y="124" text-anchor="middle" fill="var(--primary-dk)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Analyze</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="888.8889" height="500" fill="var(--bg)" rx="6.25"/>
  <rect x="251.1111" y="107.7778" width="777.7778" height="41.6667" rx="6.25" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640.0001" y="134.8611" text-anchor="middle" fill="var(--bg)" font-size="18.0555" font-weight="bold" font-family="Arial, sans-serif">Continuous Improvement Cycle</text>
  <circle cx="390.0001" cy="323.0555" r="76.3889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="390.0001" y="313.3333" text-anchor="middle" fill="var(--ok-accent)" font-size="13.8889" font-weight="bold" font-family="Arial, sans-serif">Measure</text>
  <text x="390.0001" y="334.1667" text-anchor="middle" fill="var(--ok-accent)" font-size="13.8889" font-weight="bold" font-family="Arial, sans-serif">Impact</text>
  <text x="390.0001" y="359.1667" text-anchor="middle" fill="var(--text-muted)" font-size="10.4167" font-family="Arial, sans-serif">Collect metrics</text>
  <circle cx="640.0001" cy="218.8889" r="76.3889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640.0001" y="209.1667" text-anchor="middle" fill="var(--primary-accent)" font-size="13.8889" font-weight="bold" font-family="Arial, sans-serif">Analyze</text>
  <text x="640.0001" y="230" text-anchor="middle" fill="var(--primary-accent)" font-size="13.8889" font-weight="bold" font-family="Arial, sans-serif">Data</text>
  <text x="640.0001" y="255" text-anchor="middle" fill="var(--text-muted)" font-size="10.4167" font-family="Arial, sans-serif">Find patterns</text>
  <circle cx="890.0001" cy="323.0555" r="76.3889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="890.0001" y="313.3333" text-anchor="middle" fill="var(--warn-accent)" font-size="13.8889" font-weight="bold" font-family="Arial, sans-serif">Optimize</text>
  <text x="890.0001" y="334.1667" text-anchor="middle" fill="var(--warn-accent)" font-size="13.8889" font-weight="bold" font-family="Arial, sans-serif">Usage</text>
  <text x="890.0001" y="359.1667" text-anchor="middle" fill="var(--text-muted)" font-size="10.4167" font-family="Arial, sans-serif">Adjust approach</text>
  <circle cx="640.0001" cy="448.0555" r="76.3889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640.0001" y="438.3333" text-anchor="middle" fill="var(--danger-accent)" font-size="13.8889" font-weight="bold" font-family="Arial, sans-serif">Implement</text>
  <text x="640.0001" y="459.1667" text-anchor="middle" fill="var(--danger-accent)" font-size="13.8889" font-weight="bold" font-family="Arial, sans-serif">Changes</text>
  <text x="640.0001" y="484.1667" text-anchor="middle" fill="var(--text-muted)" font-size="10.4167" font-family="Arial, sans-serif">Apply improvements</text>
  <path d="M 459.4444 281.3889 Q 542.7778 218.8889 573.3334 232.7778" fill="none" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <path d="M 706.6667 243.8889 Q 812.2222 267.5 826.1111 295.2778" fill="none" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <path d="M 862.2222 399.4445 Q 765.0001 461.9445 715.0001 448.0555" fill="none" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <path d="M 567.7778 435.5555 Q 480.2778 441.1111 451.1111 382.7778" fill="none" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640.0001" y="331.3889" text-anchor="middle" fill="var(--text-faint)" font-size="11.8055" font-family="Arial, sans-serif">PDCA + AI</text>
</svg>
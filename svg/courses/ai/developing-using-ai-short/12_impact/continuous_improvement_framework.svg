  <path d="M 253.3333 193.3333 Q 333.3333 133.3333 362.6667 146.6667" fill="none" stroke="var(--primary-dk)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <path d="M 490.6667 157.3333 Q 592 180 605.3333 206.6667" fill="none" stroke="var(--primary-dk)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <path d="M 640 306.6667 Q 546.6667 366.6667 498.6667 353.3333" fill="none" stroke="var(--primary-dk)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <path d="M 357.3333 341.3333 Q 273.3333 346.6667 245.3333 290.6667" fill="none" stroke="var(--primary-dk)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="426.6667" y="241.3333" text-anchor="middle" fill="var(--text-placeholder)" font-size="11.3333" font-family="Arial, sans-serif">PDCA + AI</text>

  <text x="475.0516" y="189.2784" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Find patterns</text>
  <circle cx="660.6186" cy="239.7938" r="56.701" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.4845" filter="url(#shadow)" />

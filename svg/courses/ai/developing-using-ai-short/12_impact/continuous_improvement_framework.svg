  <circle cx="846.4322" cy="328.6863" r="75.0348" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="0.9779" filter="url(#shadow)" />
  <text x="846.4322" y="319.4174" text-anchor="middle" fill="var(--primary-accent)" font-size="15.6407" font-weight="bold" font-family="Arial, sans-serif">Analyze</text>
  <text x="846.4322" y="339.2798" text-anchor="middle" fill="var(--primary-accent)" font-size="15.6407" font-weight="bold" font-family="Arial, sans-serif">Data</text>
  <text x="846.4322" y="363.1144" text-anchor="middle" fill="var(--text-muted)" font-size="15.6407" font-family="Arial, sans-serif">Find patterns</text>
  <circle cx="1099.4401" cy="427.9979" r="75.0348" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="0.9779" filter="url(#shadow)" />
  <text x="1099.4401" y="418.7288" text-anchor="middle" fill="var(--warn-accent)" font-size="15.6407" font-weight="bold" font-family="Arial, sans-serif">Optimize</text>
  <text x="1099.4401" y="438.5911" text-anchor="middle" fill="var(--warn-accent)" font-size="15.6407" font-weight="bold" font-family="Arial, sans-serif">Usage</text>
  <text x="1099.4401" y="462.426" text-anchor="middle" fill="var(--text-muted)" font-size="15.6407" font-family="Arial, sans-serif">Adjust approach</text>
  <circle cx="846.4322" cy="547.1716" r="75.0348" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="0.9779" filter="url(#shadow)" />
  <text x="846.4322" y="537.9025" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6407" font-weight="bold" font-family="Arial, sans-serif">Implement</text>

  <circle cx="593.424" cy="427.9979" r="75.0348" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="0.9779" filter="url(#shadow)" />
  <text x="593.424" y="418.7288" text-anchor="middle" fill="var(--ok-accent)" font-size="15.6407" font-weight="bold" font-family="Arial, sans-serif">Measure</text>
  <text x="593.424" y="438.5911" text-anchor="middle" fill="var(--ok-accent)" font-size="15.6407" font-weight="bold" font-family="Arial, sans-serif">Impact</text>

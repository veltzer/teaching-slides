  <text x="426.6667" y="168" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Find patterns</text>
  <circle cx="666.6667" cy="233.3333" r="73.3333" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)" />
  <text x="666.6667" y="224" text-anchor="middle" fill="var(--warn-dk)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Optimize</text>
  <text x="666.6667" y="244" text-anchor="middle" fill="var(--warn-dk)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Usage</text>
  <text x="666.6667" y="268" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Arial, sans-serif">Adjust approach</text>
  <circle cx="426.6667" cy="353.3333" r="73.3333" fill="var(--danger-pale3)" stroke="var(--danger-bright)" stroke-width="2" filter="url(#shadow)" />
  <text x="426.6667" y="344" text-anchor="middle" fill="var(--danger-pink)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Implement</text>
  <text x="426.6667" y="364" text-anchor="middle" fill="var(--danger-pink)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Changes</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="53.129733" rx="6.725008" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="74.534277" text-anchor="middle" fill="var(--bg)" font-size="25.324924" font-weight="bold" font-family="Arial, sans-serif">AI Impact Measurement Challenges</text>
  <rect x="106.232" y="170.169" width="253.249" height="253.249" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="232.857143" y="275.541894" text-anchor="middle" fill="var(--warn-accent)" font-size="19.48078" font-weight="bold" font-family="Arial, sans-serif">Intangible</text>
  <text x="232.857143" y="302.106816" text-anchor="middle" fill="var(--warn-accent)" font-size="19.48078" font-weight="bold" font-family="Arial, sans-serif">Benefits</text>
  <text x="232.857143" y="337.526638" text-anchor="middle" fill="var(--text-muted)" font-size="13.636411" font-family="Arial, sans-serif">Developer confidence</text>
  <text x="232.857143" y="360.549489" text-anchor="middle" fill="var(--text-muted)" font-size="13.636411" font-family="Arial, sans-serif">Code quality feel</text>
  <rect x="513.375" y="170.169" width="253.249" height="253.249" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="640" y="275.541894" text-anchor="middle" fill="var(--ok-accent)" font-size="19.48078" font-weight="bold" font-family="Arial, sans-serif">Attribution</text>
  <text x="640" y="302.106816" text-anchor="middle" fill="var(--ok-accent)" font-size="19.48078" font-weight="bold" font-family="Arial, sans-serif">Complexity</text>
  <text x="640" y="337.526638" text-anchor="middle" fill="var(--text-muted)" font-size="13.636411" font-family="Arial, sans-serif">AI vs human effort</text>
  <text x="640" y="360.549489" text-anchor="middle" fill="var(--text-muted)" font-size="13.636411" font-family="Arial, sans-serif">Isolating variables</text>
  <rect x="920.518" y="170.169" width="253.249" height="253.249" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="1047.142857" y="275.541894" text-anchor="middle" fill="var(--primary-accent)" font-size="19.48078" font-weight="bold" font-family="Arial, sans-serif">Baseline</text>
  <text x="1047.142857" y="302.106816" text-anchor="middle" fill="var(--primary-accent)" font-size="19.48078" font-weight="bold" font-family="Arial, sans-serif">Establishment</text>
  <text x="1047.142857" y="337.526638" text-anchor="middle" fill="var(--text-muted)" font-size="13.636411" font-family="Arial, sans-serif">Pre-adoption data</text>
  <text x="1047.142857" y="360.549489" text-anchor="middle" fill="var(--text-muted)" font-size="13.636411" font-family="Arial, sans-serif">Control groups</text>
  <rect x="211.428571" y="456.183075" width="857.142857" height="79.694655" rx="6.725008" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="498.686928" text-anchor="middle" fill="var(--ok-accent)" font-size="21.42879" font-weight="bold" font-family="Arial, sans-serif">Requires Systematic Approach</text>
  <text x="640" y="523.480869" text-anchor="middle" fill="var(--text)" font-size="15.584534" font-family="Arial, sans-serif">OKRs + qualitative + quantitative data combined</text>
  <rect x="40" y="558.015256" width="1200" height="61.984744" rx="6.725008" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="596.091494" text-anchor="middle" fill="var(--text)" font-size="14.610529" font-family="Arial, sans-serif">Use developer surveys + sprint velocity + defect rates + time-to-complete as combined signal</text>
</svg>

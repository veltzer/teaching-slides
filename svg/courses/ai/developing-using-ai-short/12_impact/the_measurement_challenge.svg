<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header -->
  <rect x="80" y="40" width="1120" height="60" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="79" text-anchor="middle" fill="white" font-size="26" font-weight="bold" font-family="Arial, sans-serif">AI Impact Measurement Challenges</text>
  <!-- Three circles -->
  <circle cx="260" cy="330" r="130" fill="#fff3e0" stroke="#fb8c00" stroke-width="3" filter="url(#shadow)"/>
  <text x="260" y="306" text-anchor="middle" fill="#e65100" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Intangible</text>
  <text x="260" y="336" text-anchor="middle" fill="#e65100" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Benefits</text>
  <text x="260" y="376" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Developer confidence</text>
  <text x="260" y="402" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Code quality feel</text>
  <circle cx="640" cy="330" r="130" fill="#e8f5e9" stroke="#43a047" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="306" text-anchor="middle" fill="#2e7d32" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Attribution</text>
  <text x="640" y="336" text-anchor="middle" fill="#2e7d32" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Complexity</text>
  <text x="640" y="376" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">AI vs human effort</text>
  <text x="640" y="402" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Isolating variables</text>
  <circle cx="1020" cy="330" r="130" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="1020" y="306" text-anchor="middle" fill="#1565c0" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Baseline</text>
  <text x="1020" y="336" text-anchor="middle" fill="#1565c0" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Establishment</text>
  <text x="1020" y="376" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Pre-adoption data</text>
  <text x="1020" y="402" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Control groups</text>
  <!-- Solution box -->
  <rect x="240" y="510" width="800" height="90" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="558" text-anchor="middle" fill="#2e7d32" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Requires Systematic Approach</text>
  <text x="640" y="586" text-anchor="middle" fill="#444" font-size="16" font-family="Arial, sans-serif">OKRs + qualitative + quantitative data combined</text>
  <!-- Footer -->
  <rect x="80" y="625" width="1120" height="70" rx="10" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="640" y="668" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Use developer surveys + sprint velocity + defect rates + time-to-complete as combined signal</text>
</svg>

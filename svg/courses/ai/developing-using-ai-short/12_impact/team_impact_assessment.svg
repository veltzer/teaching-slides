<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="72.2223" width="1050" height="48.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="103.6389" text-anchor="middle" fill="var(--bg)" font-size="22.5947" font-weight="bold" font-family="Arial, sans-serif">Team Collaboration Impact</text>
  <circle cx="321.25" cy="265.5556" r="104.2833" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="321.25" y="251.0556" text-anchor="middle" fill="var(--ok-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Knowledge</text>
  <text x="321.25" y="275.2223" text-anchor="middle" fill="var(--ok-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Sharing</text>
  <text x="321.25" y="304.2223" text-anchor="middle" fill="var(--text-muted)" font-size="11.2974" font-family="Arial, sans-serif">+35% better</text>
  <circle cx="640" cy="209.1667" r="86.9027" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="640" y="194.6667" text-anchor="middle" fill="var(--primary-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Communication</text>
  <text x="640" y="218.8333" text-anchor="middle" fill="var(--primary-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Quality</text>
  <text x="640" y="246.2223" text-anchor="middle" fill="var(--text-muted)" font-size="11.2974" font-family="Arial, sans-serif">+28% clearer</text>
  <circle cx="958.75" cy="265.5556" r="104.2833" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="958.75" y="251.0556" text-anchor="middle" fill="var(--warn-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Code Review</text>
  <text x="958.75" y="275.2223" text-anchor="middle" fill="var(--warn-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Efficiency</text>
  <text x="958.75" y="304.2223" text-anchor="middle" fill="var(--text-muted)" font-size="11.2974" font-family="Arial, sans-serif">+50% faster</text>
  <circle cx="433.75" cy="434.7223" r="86.9027" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="433.75" y="420.2223" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Onboarding</text>
  <text x="433.75" y="444.3889" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Speed</text>
  <text x="433.75" y="471.7777" text-anchor="middle" fill="var(--text-muted)" font-size="11.2974" font-family="Arial, sans-serif">-45% time</text>
  <circle cx="846.2499" cy="434.7223" r="86.9027" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="846.2499" y="420.2223" text-anchor="middle" fill="var(--info-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Cross-Team</text>
  <text x="846.2499" y="444.3889" text-anchor="middle" fill="var(--info-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Coordination</text>
  <text x="846.2499" y="471.7777" text-anchor="middle" fill="var(--text-muted)" font-size="11.2974" font-family="Arial, sans-serif">+40% efficient</text>
  <rect x="265" y="539.4444" width="750" height="60.4167" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="575.6944" text-anchor="middle" fill="var(--bg)" font-size="20.8566" font-weight="bold" font-family="Arial, sans-serif">Overall Team Productivity: +42%</text>
</svg>
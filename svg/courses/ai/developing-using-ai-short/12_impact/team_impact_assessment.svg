<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="53.129743" rx="6.725009" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="74.534284" text-anchor="middle" fill="var(--bg)" font-size="25.324926" font-weight="bold" font-family="Arial, sans-serif">Team Collaboration Impact</text>
  <rect x="158.83" y="135.635" width="233.769" height="233.769" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="275.714286" y="236.580149" text-anchor="middle" fill="var(--ok-accent)" font-size="17.532658" font-weight="bold" font-family="Arial, sans-serif">Knowledge</text>
  <text x="275.714286" y="263.145076" text-anchor="middle" fill="var(--ok-accent)" font-size="17.532658" font-weight="bold" font-family="Arial, sans-serif">Sharing</text>
  <text x="275.714286" y="295.022944" text-anchor="middle" fill="var(--text-muted)" font-size="12.662519" font-family="Arial, sans-serif">+35% better</text>
  <rect x="542.596" y="93.1308" width="194.807" height="194.807" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="640" y="174.595394" text-anchor="middle" fill="var(--primary-accent)" font-size="17.532658" font-weight="bold" font-family="Arial, sans-serif">Communication</text>
  <text x="640" y="201.16021" text-anchor="middle" fill="var(--primary-accent)" font-size="17.532658" font-weight="bold" font-family="Arial, sans-serif">Quality</text>
  <text x="640" y="231.267208" text-anchor="middle" fill="var(--text-muted)" font-size="12.662519" font-family="Arial, sans-serif">+28% clearer</text>
  <rect x="887.401" y="135.635" width="233.769" height="233.769" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="1004.285714" y="236.580149" text-anchor="middle" fill="var(--warn-accent)" font-size="17.532658" font-weight="bold" font-family="Arial, sans-serif">Code Review</text>
  <text x="1004.285714" y="263.145076" text-anchor="middle" fill="var(--warn-accent)" font-size="17.532658" font-weight="bold" font-family="Arial, sans-serif">Efficiency</text>
  <text x="1004.285714" y="295.022944" text-anchor="middle" fill="var(--text-muted)" font-size="12.662519" font-family="Arial, sans-serif">+50% faster</text>
  <rect x="306.882" y="341.07" width="194.807" height="194.807" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="404.285714" y="422.534416" text-anchor="middle" fill="var(--danger-accent)" font-size="17.532658" font-weight="bold" font-family="Arial, sans-serif">Onboarding</text>
  <text x="404.285714" y="449.099232" text-anchor="middle" fill="var(--danger-accent)" font-size="17.532658" font-weight="bold" font-family="Arial, sans-serif">Speed</text>
  <text x="404.285714" y="479.20601" text-anchor="middle" fill="var(--text-muted)" font-size="12.662519" font-family="Arial, sans-serif">-45% time</text>
  <rect x="778.311" y="341.07" width="194.807" height="194.807" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="875.714171" y="422.534416" text-anchor="middle" fill="var(--info-accent)" font-size="17.532658" font-weight="bold" font-family="Arial, sans-serif">Cross-Team</text>
  <text x="875.714171" y="449.099232" text-anchor="middle" fill="var(--info-accent)" font-size="17.532658" font-weight="bold" font-family="Arial, sans-serif">Coordination</text>
  <text x="875.714171" y="479.20601" text-anchor="middle" fill="var(--text-muted)" font-size="12.662519" font-family="Arial, sans-serif">+40% efficient</text>
  <rect x="211.428571" y="553.587738" width="857.142857" height="66.412262" rx="6.725009" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="593.435073" text-anchor="middle" fill="var(--bg)" font-size="23.376803" font-weight="bold" font-family="Arial, sans-serif">Overall Team Productivity: +42%</text>
</svg>

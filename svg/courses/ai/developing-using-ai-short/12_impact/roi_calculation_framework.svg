  <ns0:text x="293.3333" y="284.4444" text-anchor="middle" fill="#444" font-size="16" font-family="Arial, sans-serif">• Setup &amp; integration</ns0:text>
  <ns0:text x="293.3333" y="314.6667" text-anchor="middle" fill="#444" font-size="16" font-family="Arial, sans-serif">• Ongoing maintenance</ns0:text>

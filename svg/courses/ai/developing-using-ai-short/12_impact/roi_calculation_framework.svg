<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="71.1111" y="35.5556" width="995.5556" height="53.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="70.2222" text-anchor="middle" fill="var(--bg)" font-size="23.1111" font-weight="bold" font-family="Arial, sans-serif">AI Investment ROI Calculation</text>
  <rect x="71.1111" y="133.3333" width="444.4444" height="222.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="71.1111" y="133.3333" width="444.4444" height="44.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="71.1111" y="165.3333" width="444.4444" height="12.4444" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="293.3333" y="167.1111" text-anchor="middle" fill="var(--bg)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Investment Costs</text>
  <text x="293.3333" y="224" text-anchor="middle" fill="var(--text)" font-size="16" font-family="Arial, sans-serif">• Tool licenses</text>
  <text x="293.3333" y="254.2222" text-anchor="middle" fill="var(--text)" font-size="16" font-family="Arial, sans-serif">• Team training</text>
  <text x="293.3333" y="284.4444" text-anchor="middle" fill="var(--text)" font-size="16" font-family="Arial, sans-serif">• Setup &amp; integration</text>
  <text x="293.3333" y="314.6667" text-anchor="middle" fill="var(--text)" font-size="16" font-family="Arial, sans-serif">• Ongoing maintenance</text>
  <rect x="622.2222" y="133.3333" width="444.4444" height="222.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="622.2222" y="133.3333" width="444.4444" height="44.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="622.2222" y="165.3333" width="444.4444" height="12.4444" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="844.4444" y="167.1111" text-anchor="middle" fill="var(--bg)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Productivity Gains</text>
  <text x="844.4444" y="224" text-anchor="middle" fill="var(--text)" font-size="16" font-family="Arial, sans-serif">• Time saved x hourly rate</text>
  <text x="844.4444" y="254.2222" text-anchor="middle" fill="var(--text)" font-size="16" font-family="Arial, sans-serif">• Bug reduction savings</text>
  <text x="844.4444" y="284.4444" text-anchor="middle" fill="var(--text)" font-size="16" font-family="Arial, sans-serif">• Faster time to market</text>
  <text x="844.4444" y="314.6667" text-anchor="middle" fill="var(--text)" font-size="16" font-family="Arial, sans-serif">• Reduced onboarding cost</text>
  <rect x="213.3333" y="391.1111" width="711.1111" height="106.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="435.5556" text-anchor="middle" fill="var(--primary-accent)" font-size="23.1111" font-weight="bold" font-family="Arial, sans-serif">ROI = (Gains - Costs) / Costs</text>
  <text x="568.8889" y="476.4444" text-anchor="middle" fill="var(--text-muted)" font-size="16" font-family="Arial, sans-serif">Express as percentage — typical: 150% to 400%</text>
  <rect x="71.1111" y="528.8889" width="995.5556" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="562.6667" text-anchor="middle" fill="var(--primary-accent)" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Measurement Tip</text>
  <text x="568.8889" y="591.1111" text-anchor="middle" fill="var(--text)" font-size="13.3333" font-family="Arial, sans-serif">Track a 30-day baseline before adoption, then compare at 30/60/90 days</text>
</svg>
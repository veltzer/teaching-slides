<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="53.953455" rx="6.77694" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75.069695" text-anchor="middle" fill="var(--bg)" font-size="25.520487" font-weight="bold" font-family="Arial, sans-serif">AI Investment ROI Calculation</text>
  <rect x="40" y="138.914611" width="535.714171" height="224.806228" rx="6.77694" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="138.914611" width="535.714171" height="44.961156" rx="6.77694" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="171.286706" width="535.714171" height="12.589061" fill="url(#grad-warn)" rx="6.77694" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.857143" y="173.085143" text-anchor="middle" fill="var(--bg)" font-size="21.594267" font-weight="bold" font-family="Arial, sans-serif">Investment Costs</text>
  <text x="307.857143" y="230.635584" text-anchor="middle" fill="var(--text)" font-size="17.668047" font-family="Arial, sans-serif">• Tool licenses</text>
  <text x="307.857143" y="261.209242" text-anchor="middle" fill="var(--text)" font-size="17.668047" font-family="Arial, sans-serif">• Team training</text>
  <text x="307.857143" y="291.782788" text-anchor="middle" fill="var(--text)" font-size="17.668047" font-family="Arial, sans-serif">• Setup &amp; integration</text>
  <text x="307.857143" y="322.356558" text-anchor="middle" fill="var(--text)" font-size="17.668047" font-family="Arial, sans-serif">• Ongoing maintenance</text>
  <rect x="704.285714" y="138.914611" width="535.714171" height="224.806228" rx="6.77694" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="704.285714" y="138.914611" width="535.714171" height="44.961156" rx="6.77694" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="704.285714" y="171.286706" width="535.714171" height="12.589061" fill="url(#grad-ok)" rx="6.77694" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="972.142743" y="173.085143" text-anchor="middle" fill="var(--bg)" font-size="21.594267" font-weight="bold" font-family="Arial, sans-serif">Productivity Gains</text>
  <text x="972.142743" y="230.635584" text-anchor="middle" fill="var(--text)" font-size="17.668047" font-family="Arial, sans-serif">• Time saved x hourly rate</text>
  <text x="972.142743" y="261.209242" text-anchor="middle" fill="var(--text)" font-size="17.668047" font-family="Arial, sans-serif">• Bug reduction savings</text>
  <text x="972.142743" y="291.782788" text-anchor="middle" fill="var(--text)" font-size="17.668047" font-family="Arial, sans-serif">• Faster time to market</text>
  <text x="972.142743" y="322.356558" text-anchor="middle" fill="var(--text)" font-size="17.668047" font-family="Arial, sans-serif">• Reduced onboarding cost</text>
  <rect x="211.428571" y="399.689809" width="857.142857" height="107.907021" rx="6.77694" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="444.651189" text-anchor="middle" fill="var(--primary-accent)" font-size="25.520487" font-weight="bold" font-family="Arial, sans-serif">ROI = (Gains - Costs) / Costs</text>
  <text x="640" y="486.015359" text-anchor="middle" fill="var(--text-muted)" font-size="17.668047" font-family="Arial, sans-serif">Express as percentage — typical: 150% to 400%</text>
  <rect x="40" y="539.069762" width="1200" height="80.930238" rx="6.77694" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="573.240295" text-anchor="middle" fill="var(--primary-accent)" font-size="17.668047" font-weight="bold" font-family="Arial, sans-serif">Measurement Tip</text>
  <text x="640" y="602.015403" text-anchor="middle" fill="var(--text)" font-size="14.723354" font-family="Arial, sans-serif">Track a 30-day baseline before adoption, then compare at 30/60/90 days</text>
</svg>

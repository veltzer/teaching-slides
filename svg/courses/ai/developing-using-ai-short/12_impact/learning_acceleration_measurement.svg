<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="54.374968" rx="6.803361" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75.343679" text-anchor="middle" fill="var(--bg)" font-size="25.619983" font-weight="bold" font-family="Arial, sans-serif">Learning Acceleration Metrics</text>
  <rect x="40" y="130.624835" width="364.285714" height="154.062467" rx="6.803361" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.142857" y="177.749965" text-anchor="middle" fill="var(--ok-accent)" font-size="17.736929" font-family="Arial, sans-serif">Skill Acquisition</text>
  <text x="222.142857" y="224.874982" text-anchor="middle" fill="var(--ok-accent)" font-size="31.532217" font-weight="bold" font-family="Arial, sans-serif">2.3x</text>
  <text x="222.142857" y="261.124849" text-anchor="middle" fill="var(--text-muted)" font-size="15.766109" font-family="Arial, sans-serif">faster learning</text>
  <rect x="457.857143" y="130.624835" width="364.285714" height="154.062467" rx="6.803361" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="177.749965" text-anchor="middle" fill="var(--primary-accent)" font-size="17.736929" font-family="Arial, sans-serif">Knowledge Transfer</text>
  <text x="640" y="224.874982" text-anchor="middle" fill="var(--primary-accent)" font-size="31.532217" font-weight="bold" font-family="Arial, sans-serif">+65%</text>
  <text x="640" y="261.124849" text-anchor="middle" fill="var(--text-muted)" font-size="15.766109" font-family="Arial, sans-serif">improvement</text>
  <rect x="875.714171" y="130.624835" width="364.285714" height="154.062467" rx="6.803361" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.857143" y="177.749965" text-anchor="middle" fill="var(--warn-accent)" font-size="17.736929" font-family="Arial, sans-serif">Onboarding Time</text>
  <text x="1057.857143" y="224.874982" text-anchor="middle" fill="var(--warn-accent)" font-size="31.532217" font-weight="bold" font-family="Arial, sans-serif">-45%</text>
  <text x="1057.857143" y="261.124849" text-anchor="middle" fill="var(--text-muted)" font-size="15.766109" font-family="Arial, sans-serif">time saved</text>
  <rect x="200.714171" y="325.468781" width="407.142857" height="154.062467" rx="6.803361" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="404.285714" y="372.593686" text-anchor="middle" fill="var(--danger-accent)" font-size="17.736929" font-family="Arial, sans-serif">Problem Solving</text>
  <text x="404.285714" y="419.718703" text-anchor="middle" fill="var(--danger-accent)" font-size="31.532217" font-weight="bold" font-family="Arial, sans-serif">+40%</text>
  <text x="404.285714" y="455.968795" text-anchor="middle" fill="var(--text-muted)" font-size="15.766109" font-family="Arial, sans-serif">faster resolution</text>
  <rect x="672.142857" y="325.468781" width="407.142857" height="154.062467" rx="6.803361" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="875.714171" y="372.593686" text-anchor="middle" fill="var(--info-accent)" font-size="17.736929" font-family="Arial, sans-serif">Technical Competency</text>
  <text x="875.714171" y="419.718703" text-anchor="middle" fill="var(--info-accent)" font-size="31.532217" font-weight="bold" font-family="Arial, sans-serif">+2.1</text>
  <text x="875.714171" y="455.968795" text-anchor="middle" fill="var(--text-muted)" font-size="15.766109" font-family="Arial, sans-serif">seniority levels</text>
  <rect x="40" y="511.249951" width="1200" height="108.750049" rx="6.803361" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="547.49993" text-anchor="middle" fill="var(--primary-accent)" font-size="18.722282" font-weight="bold" font-family="Arial, sans-serif">Why Learning Accelerates with AI</text>
  <text x="640" y="578.312558" text-anchor="middle" fill="var(--text)" font-size="15.766109" font-family="Arial, sans-serif">Immediate feedback, real examples, context-aware explanations on demand</text>
  <text x="640" y="603.687386" text-anchor="middle" fill="var(--text-muted)" font-size="13.795288" font-family="Arial, sans-serif">AI explains "why" not just "what" — builds mental models faster</text>
</svg>

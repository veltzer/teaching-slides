<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header -->
  <rect x="80" y="40" width="1120" height="60" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="79" text-anchor="middle" fill="white" font-size="26" font-weight="bold" font-family="Arial, sans-serif">Learning Acceleration Metrics</text>
  <!-- Top row 3 cards -->
  <rect x="80" y="140" width="340" height="170" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="192" text-anchor="middle" fill="#2e7d32" font-size="18" font-family="Arial, sans-serif">Skill Acquisition</text>
  <text x="250" y="244" text-anchor="middle" fill="#2e7d32" font-size="32" font-weight="bold" font-family="Arial, sans-serif">2.3x</text>
  <text x="250" y="284" text-anchor="middle" fill="#555" font-size="16" font-family="Arial, sans-serif">faster learning</text>
  <rect x="470" y="140" width="340" height="170" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="192" text-anchor="middle" fill="#1565c0" font-size="18" font-family="Arial, sans-serif">Knowledge Transfer</text>
  <text x="640" y="244" text-anchor="middle" fill="#1565c0" font-size="32" font-weight="bold" font-family="Arial, sans-serif">+65%</text>
  <text x="640" y="284" text-anchor="middle" fill="#555" font-size="16" font-family="Arial, sans-serif">improvement</text>
  <rect x="860" y="140" width="340" height="170" rx="12" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="192" text-anchor="middle" fill="#e65100" font-size="18" font-family="Arial, sans-serif">Onboarding Time</text>
  <text x="1030" y="244" text-anchor="middle" fill="#e65100" font-size="32" font-weight="bold" font-family="Arial, sans-serif">-45%</text>
  <text x="1030" y="284" text-anchor="middle" fill="#555" font-size="16" font-family="Arial, sans-serif">time saved</text>
  <!-- Bottom row 2 cards -->
  <rect x="230" y="355" width="380" height="170" rx="12" fill="#fce4ec" stroke="#e91e63" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="407" text-anchor="middle" fill="#880e4f" font-size="18" font-family="Arial, sans-serif">Problem Solving</text>
  <text x="420" y="459" text-anchor="middle" fill="#880e4f" font-size="32" font-weight="bold" font-family="Arial, sans-serif">+40%</text>
  <text x="420" y="499" text-anchor="middle" fill="#555" font-size="16" font-family="Arial, sans-serif">faster resolution</text>
  <rect x="670" y="355" width="380" height="170" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="407" text-anchor="middle" fill="#6a1b9a" font-size="18" font-family="Arial, sans-serif">Technical Competency</text>
  <text x="860" y="459" text-anchor="middle" fill="#6a1b9a" font-size="32" font-weight="bold" font-family="Arial, sans-serif">+2.1</text>
  <text x="860" y="499" text-anchor="middle" fill="#555" font-size="16" font-family="Arial, sans-serif">seniority levels</text>
  <!-- Footer -->
  <rect x="80" y="560" width="1120" height="120" rx="12" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="600" text-anchor="middle" fill="#1565c0" font-size="19" font-weight="bold" font-family="Arial, sans-serif">Why Learning Accelerates with AI</text>
  <text x="640" y="634" text-anchor="middle" fill="#444" font-size="16" font-family="Arial, sans-serif">Immediate feedback, real examples, context-aware explanations on demand</text>
  <text x="640" y="662" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">AI explains "why" not just "what" — builds mental models faster</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="54.374968" rx="6.803361" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="75.343679" text-anchor="middle" fill="var(--bg)" font-size="25.619983" font-weight="bold" font-family="Arial, sans-serif">Learning Acceleration Metrics</text>
  <rect x="40" y="130.624835" width="364.285714" height="154.062467" rx="6.803361" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="222.142857" y="177.749965" text-anchor="middle" fill="var(--ok-accent)" font-size="17.736929" font-family="Arial, sans-serif">Skill Acquisition</text>
  <text x="222.142857" y="224.874982" text-anchor="middle" fill="var(--ok-accent)" font-size="31.532217" font-weight="bold" font-family="Arial, sans-serif">2.3x</text>
  <text x="222.142857" y="261.124849" text-anchor="middle" fill="var(--text-muted)" font-size="15.766109" font-family="Arial, sans-serif">faster learning</text>
  <rect x="457.857143" y="130.624835" width="364.285714" height="154.062467" rx="6.803361" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="177.749965" text-anchor="middle" fill="var(--primary-accent)" font-size="17.736929" font-family="Arial, sans-serif">Knowledge Transfer</text>
  <text x="640" y="224.874982" text-anchor="middle" fill="var(--primary-accent)" font-size="31.532217" font-weight="bold" font-family="Arial, sans-serif">+65%</text>
  <text x="640" y="261.124849" text-anchor="middle" fill="var(--text-muted)" font-size="15.766109" font-family="Arial, sans-serif">improvement</text>
  <rect x="875.714171" y="130.624835" width="364.285714" height="154.062467" rx="6.803361" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1057.857143" y="177.749965" text-anchor="middle" fill="var(--warn-accent)" font-size="17.736929" font-family="Arial, sans-serif">Onboarding Time</text>
  <text x="1057.857143" y="224.874982" text-anchor="middle" fill="var(--warn-accent)" font-size="31.532217" font-weight="bold" font-family="Arial, sans-serif">-45%</text>
  <text x="1057.857143" y="261.124849" text-anchor="middle" fill="var(--text-muted)" font-size="15.766109" font-family="Arial, sans-serif">time saved</text>
  <rect x="200.714171" y="325.468781" width="407.142857" height="154.062467" rx="6.803361" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="404.285714" y="372.593686" text-anchor="middle" fill="var(--danger-accent)" font-size="17.736929" font-family="Arial, sans-serif">Problem Solving</text>
  <text x="404.285714" y="419.718703" text-anchor="middle" fill="var(--danger-accent)" font-size="31.532217" font-weight="bold" font-family="Arial, sans-serif">+40%</text>
  <text x="404.285714" y="455.968795" text-anchor="middle" fill="var(--text-muted)" font-size="15.766109" font-family="Arial, sans-serif">faster resolution</text>
  <rect x="672.142857" y="325.468781" width="407.142857" height="154.062467" rx="6.803361" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="875.714171" y="372.593686" text-anchor="middle" fill="var(--info-accent)" font-size="17.736929" font-family="Arial, sans-serif">Technical Competency</text>
  <text x="875.714171" y="419.718703" text-anchor="middle" fill="var(--info-accent)" font-size="31.532217" font-weight="bold" font-family="Arial, sans-serif">+2.1</text>
  <text x="875.714171" y="455.968795" text-anchor="middle" fill="var(--text-muted)" font-size="15.766109" font-family="Arial, sans-serif">seniority levels</text>
  <rect x="40" y="511.249951" width="1200" height="108.750049" rx="6.803361" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="547.49993" text-anchor="middle" fill="var(--primary-accent)" font-size="18.722282" font-weight="bold" font-family="Arial, sans-serif">Why Learning Accelerates with AI</text>
  <text x="640" y="578.312558" text-anchor="middle" fill="var(--text)" font-size="15.766109" font-family="Arial, sans-serif">Immediate feedback, real examples, context-aware explanations on demand</text>
  <text x="640" y="603.687386" text-anchor="middle" fill="var(--text-muted)" font-size="13.795288" font-family="Arial, sans-serif">AI explains "why" not just "what" — builds mental models faster</text>
</svg>
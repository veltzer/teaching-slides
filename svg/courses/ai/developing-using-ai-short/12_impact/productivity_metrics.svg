<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="72.2223" width="1050" height="48.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="103.6389" text-anchor="middle" fill="var(--bg)" font-size="22.5947" font-weight="bold" font-family="Arial, sans-serif">Productivity Measurement Dashboard</text>
  <rect x="115" y="152.7777" width="487.5" height="149.0277" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="358.75" y="197.0833" text-anchor="middle" fill="var(--primary-accent)" font-size="17.3806" font-family="Arial, sans-serif">Development Velocity</text>
  <text x="358.75" y="253.4723" text-anchor="middle" fill="var(--primary-accent)" font-size="41.7133" font-weight="bold" font-family="Arial, sans-serif">+35%</text>
  <text x="358.75" y="285.6944" text-anchor="middle" fill="var(--text-muted)" font-size="13.9044" font-family="Arial, sans-serif">more features per sprint</text>
  <rect x="677.4999" y="152.7777" width="487.5" height="149.0277" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="921.25" y="197.0833" text-anchor="middle" fill="var(--ok-accent)" font-size="17.3806" font-family="Arial, sans-serif">Task Completion</text>
  <text x="921.25" y="253.4723" text-anchor="middle" fill="var(--ok-accent)" font-size="41.7133" font-weight="bold" font-family="Arial, sans-serif">-25%</text>
  <text x="921.25" y="285.6944" text-anchor="middle" fill="var(--text-muted)" font-size="13.9044" font-family="Arial, sans-serif">time per task</text>
  <rect x="115" y="325.9723" width="487.5" height="149.0277" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="358.75" y="370.2777" text-anchor="middle" fill="var(--warn-accent)" font-size="17.3806" font-family="Arial, sans-serif">Code Generation</text>
  <text x="358.75" y="426.6667" text-anchor="middle" fill="var(--warn-accent)" font-size="41.7133" font-weight="bold" font-family="Arial, sans-serif">3x</text>
  <text x="358.75" y="458.8889" text-anchor="middle" fill="var(--text-muted)" font-size="13.9044" font-family="Arial, sans-serif">faster boilerplate</text>
  <rect x="677.4999" y="325.9723" width="487.5" height="149.0277" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="921.25" y="370.2777" text-anchor="middle" fill="var(--danger-accent)" font-size="17.3806" font-family="Arial, sans-serif">Debugging Time</text>
  <text x="921.25" y="426.6667" text-anchor="middle" fill="var(--danger-accent)" font-size="41.7133" font-weight="bold" font-family="Arial, sans-serif">-40%</text>
  <text x="921.25" y="458.8889" text-anchor="middle" fill="var(--text-muted)" font-size="13.9044" font-family="Arial, sans-serif">faster bug resolution</text>
  <rect x="265" y="503.1944" width="750" height="84.5833" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="537.8333" text-anchor="middle" fill="var(--bg)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Overall ROI: 280%</text>
  <text x="640" y="570.0556" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Arial, sans-serif">Across teams adopting AI-assisted development</text>
</svg>
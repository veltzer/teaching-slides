<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="54.374979" rx="6.803362" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75.343686" text-anchor="middle" fill="var(--bg)" font-size="25.619985" font-weight="bold" font-family="Arial, sans-serif">Productivity Measurement Dashboard</text>
  <rect x="40" y="130.624852" width="557.142857" height="167.656213" rx="6.803362" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="318.571429" y="180.468667" text-anchor="middle" fill="var(--primary-accent)" font-size="19.707751" font-family="Arial, sans-serif">Development Velocity</text>
  <text x="318.571429" y="243.906312" text-anchor="middle" fill="var(--primary-accent)" font-size="47.298443" font-weight="bold" font-family="Arial, sans-serif">+35%</text>
  <text x="318.571429" y="280.156185" text-anchor="middle" fill="var(--text-muted)" font-size="15.76611" font-family="Arial, sans-serif">more features per sprint</text>
  <rect x="682.857029" y="130.624852" width="557.142857" height="167.656213" rx="6.803362" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="961.428571" y="180.468667" text-anchor="middle" fill="var(--ok-accent)" font-size="19.707751" font-family="Arial, sans-serif">Task Completion</text>
  <text x="961.428571" y="243.906312" text-anchor="middle" fill="var(--ok-accent)" font-size="47.298443" font-weight="bold" font-family="Arial, sans-serif">-25%</text>
  <text x="961.428571" y="280.156185" text-anchor="middle" fill="var(--text-muted)" font-size="15.76611" font-family="Arial, sans-serif">time per task</text>
  <rect x="40" y="325.468836" width="557.142857" height="167.656213" rx="6.803362" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="318.571429" y="375.312426" text-anchor="middle" fill="var(--warn-accent)" font-size="19.707751" font-family="Arial, sans-serif">Code Generation</text>
  <text x="318.571429" y="438.75007" text-anchor="middle" fill="var(--warn-accent)" font-size="47.298443" font-weight="bold" font-family="Arial, sans-serif">3x</text>
  <text x="318.571429" y="475.000056" text-anchor="middle" fill="var(--text-muted)" font-size="15.76611" font-family="Arial, sans-serif">faster boilerplate</text>
  <rect x="682.857029" y="325.468836" width="557.142857" height="167.656213" rx="6.803362" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="961.428571" y="375.312426" text-anchor="middle" fill="var(--danger-accent)" font-size="19.707751" font-family="Arial, sans-serif">Debugging Time</text>
  <text x="961.428571" y="438.75007" text-anchor="middle" fill="var(--danger-accent)" font-size="47.298443" font-weight="bold" font-family="Arial, sans-serif">-40%</text>
  <text x="961.428571" y="475.000056" text-anchor="middle" fill="var(--text-muted)" font-size="15.76611" font-family="Arial, sans-serif">faster bug resolution</text>
  <rect x="211.428571" y="524.843759" width="857.142857" height="95.156241" rx="6.803362" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="563.812533" text-anchor="middle" fill="var(--bg)" font-size="21.678458" font-weight="bold" font-family="Arial, sans-serif">Overall ROI: 280%</text>
  <text x="640" y="600.062631" text-anchor="middle" fill="var(--primary-accent)" font-size="15.76611" font-family="Arial, sans-serif">Across teams adopting AI-assisted development</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header -->
  <rect x="80" y="40" width="1120" height="60" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="79" text-anchor="middle" fill="white" font-size="26" font-weight="bold" font-family="Arial, sans-serif">Productivity Measurement Dashboard</text>
  <!-- 4 metric cards 2x2 -->
  <rect x="80" y="140" width="520" height="185" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="195" text-anchor="middle" fill="#1565c0" font-size="20" font-family="Arial, sans-serif">Development Velocity</text>
  <text x="340" y="265" text-anchor="middle" fill="#1565c0" font-size="48" font-weight="bold" font-family="Arial, sans-serif">+35%</text>
  <text x="340" y="305" text-anchor="middle" fill="#555" font-size="16" font-family="Arial, sans-serif">more features per sprint</text>
  <rect x="680" y="140" width="520" height="185" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="195" text-anchor="middle" fill="#2e7d32" font-size="20" font-family="Arial, sans-serif">Task Completion</text>
  <text x="940" y="265" text-anchor="middle" fill="#2e7d32" font-size="48" font-weight="bold" font-family="Arial, sans-serif">-25%</text>
  <text x="940" y="305" text-anchor="middle" fill="#555" font-size="16" font-family="Arial, sans-serif">time per task</text>
  <rect x="80" y="355" width="520" height="185" rx="12" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="410" text-anchor="middle" fill="#e65100" font-size="20" font-family="Arial, sans-serif">Code Generation</text>
  <text x="340" y="480" text-anchor="middle" fill="#e65100" font-size="48" font-weight="bold" font-family="Arial, sans-serif">3x</text>
  <text x="340" y="520" text-anchor="middle" fill="#555" font-size="16" font-family="Arial, sans-serif">faster boilerplate</text>
  <rect x="680" y="355" width="520" height="185" rx="12" fill="#fce4ec" stroke="#e91e63" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="410" text-anchor="middle" fill="#880e4f" font-size="20" font-family="Arial, sans-serif">Debugging Time</text>
  <text x="940" y="480" text-anchor="middle" fill="#880e4f" font-size="48" font-weight="bold" font-family="Arial, sans-serif">-40%</text>
  <text x="940" y="520" text-anchor="middle" fill="#555" font-size="16" font-family="Arial, sans-serif">faster bug resolution</text>
  <!-- Footer banner -->
  <rect x="240" y="575" width="800" height="105" rx="12" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="618" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Overall ROI: 280%</text>
  <text x="640" y="658" text-anchor="middle" fill="#bbdefb" font-size="16" font-family="Arial, sans-serif">Across teams adopting AI-assisted development</text>
</svg>

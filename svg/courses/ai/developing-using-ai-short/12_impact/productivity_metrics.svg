<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="54.374979" rx="6.803362" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="75.343686" text-anchor="middle" fill="var(--bg)" font-size="25.619985" font-weight="bold" font-family="Arial, sans-serif">Productivity Measurement Dashboard</text>
  <rect x="40" y="130.624852" width="557.142857" height="167.656213" rx="6.803362" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="318.571429" y="180.468667" text-anchor="middle" fill="var(--primary-accent)" font-size="19.707751" font-family="Arial, sans-serif">Development Velocity</text>
  <text x="318.571429" y="243.906312" text-anchor="middle" fill="var(--primary-accent)" font-size="47.298443" font-weight="bold" font-family="Arial, sans-serif">+35%</text>
  <text x="318.571429" y="280.156185" text-anchor="middle" fill="var(--text-muted)" font-size="15.76611" font-family="Arial, sans-serif">more features per sprint</text>
  <rect x="682.857029" y="130.624852" width="557.142857" height="167.656213" rx="6.803362" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="961.428571" y="180.468667" text-anchor="middle" fill="var(--ok-accent)" font-size="19.707751" font-family="Arial, sans-serif">Task Completion</text>
  <text x="961.428571" y="243.906312" text-anchor="middle" fill="var(--ok-accent)" font-size="47.298443" font-weight="bold" font-family="Arial, sans-serif">-25%</text>
  <text x="961.428571" y="280.156185" text-anchor="middle" fill="var(--text-muted)" font-size="15.76611" font-family="Arial, sans-serif">time per task</text>
  <rect x="40" y="325.468836" width="557.142857" height="167.656213" rx="6.803362" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="318.571429" y="375.312426" text-anchor="middle" fill="var(--warn-accent)" font-size="19.707751" font-family="Arial, sans-serif">Code Generation</text>
  <text x="318.571429" y="438.75007" text-anchor="middle" fill="var(--warn-accent)" font-size="47.298443" font-weight="bold" font-family="Arial, sans-serif">3x</text>
  <text x="318.571429" y="475.000056" text-anchor="middle" fill="var(--text-muted)" font-size="15.76611" font-family="Arial, sans-serif">faster boilerplate</text>
  <rect x="682.857029" y="325.468836" width="557.142857" height="167.656213" rx="6.803362" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="961.428571" y="375.312426" text-anchor="middle" fill="var(--danger-accent)" font-size="19.707751" font-family="Arial, sans-serif">Debugging Time</text>
  <text x="961.428571" y="438.75007" text-anchor="middle" fill="var(--danger-accent)" font-size="47.298443" font-weight="bold" font-family="Arial, sans-serif">-40%</text>
  <text x="961.428571" y="475.000056" text-anchor="middle" fill="var(--text-muted)" font-size="15.76611" font-family="Arial, sans-serif">faster bug resolution</text>
  <rect x="211.428571" y="524.843759" width="857.142857" height="95.156241" rx="6.803362" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="563.812533" text-anchor="middle" fill="var(--bg)" font-size="21.678458" font-weight="bold" font-family="Arial, sans-serif">Overall ROI: 280%</text>
  <text x="640" y="600.062631" text-anchor="middle" fill="var(--primary-accent)" font-size="15.76611" font-family="Arial, sans-serif">Across teams adopting AI-assisted development</text>
</svg>
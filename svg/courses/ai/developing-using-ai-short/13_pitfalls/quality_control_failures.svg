<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="72.2223" width="1050" height="48.3333" rx="6" fill="var(--danger-accent)" filter="url(#shadow)" />
  <text x="640" y="103.6389" text-anchor="middle" fill="var(--bg)" font-size="22.5947" font-weight="bold" font-family="Arial, sans-serif">Quality Control Breakdown Points</text>
  <rect x="115" y="152.7777" width="337.5" height="136.9444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="115" y="152.7777" font-size="10" fill="none" />
  <text x="283.75" y="210.7777" text-anchor="middle" fill="var(--danger-accent)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Blind Acceptance</text>
  <text x="283.75" y="243" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Merging AI code</text>
  <text x="283.75" y="265.5556" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">without reading it</text>
  <rect x="490" y="152.7777" width="337.5" height="136.9444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="658.75" y="210.7777" text-anchor="middle" fill="var(--danger-accent)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Insufficient Testing</text>
  <text x="658.75" y="243" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Skipping tests because</text>
  <text x="658.75" y="265.5556" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">AI "looks right"</text>
  <rect x="865" y="152.7777" width="299.9999" height="136.9444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1014.9999" y="210.7777" text-anchor="middle" fill="var(--danger-accent)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">No Code Review</text>
  <text x="1014.9999" y="243" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Bypassing peer</text>
  <text x="1014.9999" y="265.5556" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">review process</text>
  <rect x="208.75" y="321.9444" width="356.25" height="136.9444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="386.875" y="379.9444" text-anchor="middle" fill="var(--danger-accent)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Security Oversight</text>
  <text x="386.875" y="412.1667" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">Trusting AI with</text>
  <text x="386.875" y="434.7223" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">auth &amp; permissions code</text>
  <rect x="621.25" y="321.9444" width="450" height="136.9444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="846.2499" y="379.9444" text-anchor="middle" fill="var(--danger-accent)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Performance Neglect</text>
  <text x="846.2499" y="412.1667" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">AI optimises for correctness,</text>
  <text x="846.2499" y="434.7223" text-anchor="middle" fill="var(--text-muted)" font-size="13.0354" font-family="Arial, sans-serif">not always for speed</text>
  <rect x="115" y="487.0833" width="1050" height="96.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="520.1111" text-anchor="middle" fill="var(--bg)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Prevention Strategy</text>
  <text x="640" y="547.5" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Arial, sans-serif">Maintain gates: code review + automated tests + security scan — always</text>
  <text x="640" y="571.6667" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Arial, sans-serif">AI speed gain must not come at the cost of quality standards</text>
</svg>
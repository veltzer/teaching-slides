  <ns0:text x="568.8889" y="70.2222" text-anchor="middle" fill="white" font-size="23.1111" font-weight="bold" font-family="Arial, sans-serif">Quality Control Breakdown Points</ns0:text>
  <ns0:rect x="71.1111" y="124.4444" width="320" height="151.1111" rx="10.6667" fill="#ffcdd2" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />

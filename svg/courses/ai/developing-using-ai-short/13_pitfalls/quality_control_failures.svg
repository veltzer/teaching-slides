  <ns0:text x="231.1111" y="188.4444" text-anchor="middle" fill="#b71c1c" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Blind Acceptance</ns0:text>
  <ns0:text x="231.1111" y="224" text-anchor="middle" fill="#555" font-size="13.3333" font-family="Arial, sans-serif">Merging AI code</ns0:text>
  <ns0:text x="231.1111" y="248.8889" text-anchor="middle" fill="#555" font-size="13.3333" font-family="Arial, sans-serif">without reading it</ns0:text>
  <ns0:rect x="426.6667" y="124.4444" width="320" height="151.1111" rx="10.6667" fill="#ffcdd2" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="586.6667" y="188.4444" text-anchor="middle" fill="#b71c1c" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Insufficient Testing</ns0:text>
  <ns0:text x="586.6667" y="224" text-anchor="middle" fill="#555" font-size="13.3333" font-family="Arial, sans-serif">Skipping tests because</ns0:text>
  <ns0:text x="586.6667" y="248.8889" text-anchor="middle" fill="#555" font-size="13.3333" font-family="Arial, sans-serif">AI "looks right"</ns0:text>
  <ns0:rect x="782.2222" y="124.4444" width="284.4444" height="151.1111" rx="10.6667" fill="#ffcdd2" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="924.4444" y="188.4444" text-anchor="middle" fill="#b71c1c" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">No Code Review</ns0:text>
  <ns0:text x="924.4444" y="224" text-anchor="middle" fill="#555" font-size="13.3333" font-family="Arial, sans-serif">Bypassing peer</ns0:text>
  <ns0:text x="924.4444" y="248.8889" text-anchor="middle" fill="#555" font-size="13.3333" font-family="Arial, sans-serif">review process</ns0:text>
  <ns0:rect x="160" y="311.1111" width="337.7778" height="151.1111" rx="10.6667" fill="#ffcdd2" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="328.8889" y="375.1111" text-anchor="middle" fill="#b71c1c" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Security Oversight</ns0:text>
  <ns0:text x="328.8889" y="410.6667" text-anchor="middle" fill="#555" font-size="13.3333" font-family="Arial, sans-serif">Trusting AI with</ns0:text>
  <ns0:text x="328.8889" y="435.5556" text-anchor="middle" fill="#555" font-size="13.3333" font-family="Arial, sans-serif">auth &amp; permissions code</ns0:text>
  <ns0:rect x="551.1111" y="311.1111" width="426.6667" height="151.1111" rx="10.6667" fill="#ffcdd2" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="764.4444" y="375.1111" text-anchor="middle" fill="#b71c1c" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Performance Neglect</ns0:text>
  <ns0:text x="764.4444" y="410.6667" text-anchor="middle" fill="#555" font-size="13.3333" font-family="Arial, sans-serif">AI optimises for correctness,</ns0:text>
  <ns0:text x="764.4444" y="435.5556" text-anchor="middle" fill="#555" font-size="13.3333" font-family="Arial, sans-serif">not always for speed</ns0:text>
  <ns0:rect x="71.1111" y="493.3333" width="995.5556" height="106.6667" rx="10.6667" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="529.7778" text-anchor="middle" fill="white" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Prevention Strategy</ns0:text>
  <ns0:text x="568.8889" y="560" text-anchor="middle" fill="#bbdefb" font-size="14.2222" font-family="Arial, sans-serif">Maintain gates: code review + automated tests + security scan — always</ns0:text>
  <ns0:text x="568.8889" y="586.6667" text-anchor="middle" fill="#bbdefb" font-size="14.2222" font-family="Arial, sans-serif">AI speed gain must not come at the cost of quality standards</ns0:text>
</ns0:svg>
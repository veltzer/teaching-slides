<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="54.80312" rx="6.830093" fill="var(--danger-accent)"/>
  <text x="640" y="75.621977" text-anchor="middle" fill="var(--bg)" font-size="25.720652" font-weight="bold" font-family="Arial, sans-serif">Quality Control Breakdown Points</text>
  <rect x="40" y="131.33842" width="385.714286" height="155.275564" rx="6.830093" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="40" y="131.33842" font-size="11.383489" fill="none" font-family="Arial, sans-serif"/>
  <text x="232.857143" y="197.10221" text-anchor="middle" fill="var(--danger-accent)" font-size="21.763637" font-weight="bold" font-family="Arial, sans-serif">Blind Acceptance</text>
  <text x="232.857143" y="233.637737" text-anchor="middle" fill="var(--text-muted)" font-size="14.838833" font-family="Arial, sans-serif">Merging AI code</text>
  <text x="232.857143" y="259.212594" text-anchor="middle" fill="var(--text-muted)" font-size="14.838833" font-family="Arial, sans-serif">without reading it</text>
  <rect x="468.571429" y="131.33842" width="385.714286" height="155.275564" rx="6.830093" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="661.428571" y="197.10221" text-anchor="middle" fill="var(--danger-accent)" font-size="21.763637" font-weight="bold" font-family="Arial, sans-serif">Insufficient Testing</text>
  <text x="661.428571" y="233.637737" text-anchor="middle" fill="var(--text-muted)" font-size="14.838833" font-family="Arial, sans-serif">Skipping tests because</text>
  <text x="661.428571" y="259.212594" text-anchor="middle" fill="var(--text-muted)" font-size="14.838833" font-family="Arial, sans-serif">AI "looks right"</text>
  <rect x="897.142857" y="131.33842" width="342.857029" height="155.275564" rx="6.830093" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.571314" y="197.10221" text-anchor="middle" fill="var(--danger-accent)" font-size="21.763637" font-weight="bold" font-family="Arial, sans-serif">No Code Review</text>
  <text x="1068.571314" y="233.637737" text-anchor="middle" fill="var(--text-muted)" font-size="14.838833" font-family="Arial, sans-serif">Bypassing peer</text>
  <text x="1068.571314" y="259.212594" text-anchor="middle" fill="var(--text-muted)" font-size="14.838833" font-family="Arial, sans-serif">review process</text>
  <rect x="147.142857" y="323.149511" width="407.142857" height="155.275564" rx="6.830093" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350.714286" y="388.9133" text-anchor="middle" fill="var(--danger-accent)" font-size="21.763637" font-weight="bold" font-family="Arial, sans-serif">Security Oversight</text>
  <text x="350.714286" y="425.448827" text-anchor="middle" fill="var(--text-muted)" font-size="14.838833" font-family="Arial, sans-serif">Trusting AI with</text>
  <text x="350.714286" y="451.023685" text-anchor="middle" fill="var(--text-muted)" font-size="14.838833" font-family="Arial, sans-serif">auth &amp; permissions code</text>
  <rect x="618.571429" y="323.149511" width="514.285714" height="155.275564" rx="6.830093" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="875.714171" y="388.9133" text-anchor="middle" fill="var(--danger-accent)" font-size="21.763637" font-weight="bold" font-family="Arial, sans-serif">Performance Neglect</text>
  <text x="875.714171" y="425.448827" text-anchor="middle" fill="var(--text-muted)" font-size="14.838833" font-family="Arial, sans-serif">AI optimises for correctness,</text>
  <text x="875.714171" y="451.023685" text-anchor="middle" fill="var(--text-muted)" font-size="14.838833" font-family="Arial, sans-serif">not always for speed</text>
  <rect x="40" y="510.393646" width="1200" height="109.606354" rx="6.830093" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="547.842496" text-anchor="middle" fill="var(--bg)" font-size="21.763637" font-weight="bold" font-family="Arial, sans-serif">Prevention Strategy</text>
  <text x="640" y="578.897632" text-anchor="middle" fill="var(--primary-accent)" font-size="15.828058" font-family="Arial, sans-serif">Maintain gates: code review + automated tests + security scan — always</text>
  <text x="640" y="606.299248" text-anchor="middle" fill="var(--primary-accent)" font-size="15.828058" font-family="Arial, sans-serif">AI speed gain must not come at the cost of quality standards</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="72.2223" width="1050" height="48.3333" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="103.6389" text-anchor="middle" fill="var(--bg)" font-size="22.5947" font-weight="bold" font-family="Arial, sans-serif">AI Development Pitfall Zones</text>
  <circle cx="321.25" cy="273.6111" r="104.2833" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="321.25" y="257.5" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Over-Reliance</text>
  <text x="321.25" y="281.6667" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Trap</text>
  <text x="321.25" y="310.6667" text-anchor="middle" fill="var(--text-muted)" font-size="11.2974" font-family="Arial, sans-serif">Skills atrophy</text>
  <circle cx="640" cy="209.1667" r="86.9027" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="640" y="193.0556" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Quality</text>
  <text x="640" y="217.2223" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Blind Spot</text>
  <text x="640" y="244.6111" text-anchor="middle" fill="var(--text-muted)" font-size="11.2974" font-family="Arial, sans-serif">No critical review</text>
  <circle cx="958.75" cy="273.6111" r="104.2833" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="958.75" y="257.5" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Context</text>
  <text x="958.75" y="281.6667" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Limitations</text>
  <text x="958.75" y="310.6667" text-anchor="middle" fill="var(--text-muted)" font-size="11.2974" font-family="Arial, sans-serif">Wrong assumptions</text>
  <circle cx="433.75" cy="426.6667" r="86.9027" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="433.75" y="410.5556" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Security</text>
  <text x="433.75" y="434.7223" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Risks</text>
  <text x="433.75" y="463.7223" text-anchor="middle" fill="var(--text-muted)" font-size="11.2974" font-family="Arial, sans-serif">Leaking secrets</text>
  <circle cx="846.2499" cy="426.6667" r="86.9027" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="846.2499" y="410.5556" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Tool</text>
  <text x="846.2499" y="434.7223" text-anchor="middle" fill="var(--danger-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">Limitations</text>
  <text x="846.2499" y="463.7223" text-anchor="middle" fill="var(--text-muted)" font-size="11.2974" font-family="Arial, sans-serif">Hallucinated APIs</text>
  <rect x="265" y="531.3889" width="750" height="64.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="569.25" text-anchor="middle" fill="var(--ok-accent)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Awareness + Strategy = Success</text>
</svg>
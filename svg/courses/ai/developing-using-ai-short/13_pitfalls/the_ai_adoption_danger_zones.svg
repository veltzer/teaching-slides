<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="53.538436" rx="6.750825" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="74.799934" text-anchor="middle" fill="var(--bg)" font-size="25.422144" font-weight="bold" font-family="Arial, sans-serif">AI Development Pitfall Zones</text>
  <rect x="158.381" y="145.744" width="234.666" height="234.666" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="275.714286" y="245.230727" text-anchor="middle" fill="var(--danger-accent)" font-size="17.599963" font-weight="bold" font-family="Arial, sans-serif">Over-Reliance</text>
  <text x="275.714286" y="272" text-anchor="middle" fill="var(--danger-accent)" font-size="17.599963" font-weight="bold" font-family="Arial, sans-serif">Trap</text>
  <text x="275.714286" y="304.123084" text-anchor="middle" fill="var(--text-muted)" font-size="12.711128" font-family="Arial, sans-serif">Skills atrophy</text>
  <rect x="542.223" y="93.9148" width="195.555" height="195.555" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="640" y="173.846145" text-anchor="middle" fill="var(--danger-accent)" font-size="17.599963" font-weight="bold" font-family="Arial, sans-serif">Quality</text>
  <text x="640" y="200.615419" text-anchor="middle" fill="var(--danger-accent)" font-size="17.599963" font-weight="bold" font-family="Arial, sans-serif">Blind Spot</text>
  <text x="640" y="230.953788" text-anchor="middle" fill="var(--text-muted)" font-size="12.711128" font-family="Arial, sans-serif">No critical review</text>
  <rect x="886.953" y="145.744" width="234.666" height="234.666" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="1004.285714" y="245.230727" text-anchor="middle" fill="var(--danger-accent)" font-size="17.599963" font-weight="bold" font-family="Arial, sans-serif">Context</text>
  <text x="1004.285714" y="272" text-anchor="middle" fill="var(--danger-accent)" font-size="17.599963" font-weight="bold" font-family="Arial, sans-serif">Limitations</text>
  <text x="1004.285714" y="304.123084" text-anchor="middle" fill="var(--text-muted)" font-size="12.711128" font-family="Arial, sans-serif">Wrong assumptions</text>
  <rect x="306.508" y="334.838" width="195.555" height="195.555" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="404.285714" y="414.769273" text-anchor="middle" fill="var(--danger-accent)" font-size="17.599963" font-weight="bold" font-family="Arial, sans-serif">Security</text>
  <text x="404.285714" y="441.538547" text-anchor="middle" fill="var(--danger-accent)" font-size="17.599963" font-weight="bold" font-family="Arial, sans-serif">Risks</text>
  <text x="404.285714" y="473.66163" text-anchor="middle" fill="var(--text-muted)" font-size="12.711128" font-family="Arial, sans-serif">Leaking secrets</text>
  <rect x="777.937" y="334.838" width="195.555" height="195.555" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="875.714171" y="414.769273" text-anchor="middle" fill="var(--danger-accent)" font-size="17.599963" font-weight="bold" font-family="Arial, sans-serif">Tool</text>
  <text x="875.714171" y="441.538547" text-anchor="middle" fill="var(--danger-accent)" font-size="17.599963" font-weight="bold" font-family="Arial, sans-serif">Limitations</text>
  <text x="875.714171" y="473.66163" text-anchor="middle" fill="var(--text-muted)" font-size="12.711128" font-family="Arial, sans-serif">Hallucinated APIs</text>
  <rect x="211.428571" y="548.615419" width="857.142857" height="71.384581" rx="6.750825" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="590.553877" text-anchor="middle" fill="var(--ok-accent)" font-size="21.511053" font-weight="bold" font-family="Arial, sans-serif">Awareness + Strategy = Success</text>
</svg>
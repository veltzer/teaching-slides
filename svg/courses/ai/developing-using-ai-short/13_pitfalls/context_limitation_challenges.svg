<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header -->
  <rect x="80" y="40" width="1120" height="60" rx="10" fill="#7b1fa2" filter="url(#shadow)"/>
  <text x="640" y="79" text-anchor="middle" fill="white" font-size="26" font-weight="bold" font-family="Arial, sans-serif">AI Context Limitations</text>
  <!-- Top row 3 boxes -->
  <rect x="80" y="140" width="340" height="200" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="218" text-anchor="middle" fill="#6a1b9a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Limited</text>
  <text x="250" y="250" text-anchor="middle" fill="#6a1b9a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Context Window</text>
  <text x="250" y="292" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Can't hold entire</text>
  <text x="250" y="316" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">codebase in mind</text>
  <rect x="470" y="140" width="340" height="200" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="218" text-anchor="middle" fill="#6a1b9a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Missing</text>
  <text x="640" y="250" text-anchor="middle" fill="#6a1b9a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Domain Context</text>
  <text x="640" y="292" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Doesn't know your</text>
  <text x="640" y="316" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">business rules</text>
  <rect x="860" y="140" width="340" height="200" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="218" text-anchor="middle" fill="#6a1b9a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Incomplete</text>
  <text x="1030" y="250" text-anchor="middle" fill="#6a1b9a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Codebase View</text>
  <text x="1030" y="292" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Missing cross-file</text>
  <text x="1030" y="316" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">dependencies</text>
  <!-- Bottom row 2 boxes -->
  <rect x="230" y="380" width="340" height="200" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="458" text-anchor="middle" fill="#6a1b9a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Legacy System</text>
  <text x="400" y="490" text-anchor="middle" fill="#6a1b9a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Complexity</text>
  <text x="400" y="532" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Implicit coupling</text>
  <text x="400" y="556" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">hidden contracts</text>
  <rect x="710" y="380" width="340" height="200" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="458" text-anchor="middle" fill="#6a1b9a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Business Logic</text>
  <text x="880" y="490" text-anchor="middle" fill="#6a1b9a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Nuances</text>
  <text x="880" y="532" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Edge cases from</text>
  <text x="880" y="556" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">years of prod use</text>
  <!-- Footer -->
  <rect x="80" y="615" width="1120" height="80" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="655" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Mitigation: Provide rich context in every prompt</text>
  <text x="640" y="682" text-anchor="middle" fill="#bbdefb" font-size="16" font-family="Arial, sans-serif">Use CLAUDE.md, code snippets, domain glossaries, and explicit constraints</text>
</svg>

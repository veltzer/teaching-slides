<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="71.1111" y="35.5556" width="995.5556" height="53.3333" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="568.8889" y="70.2222" text-anchor="middle" fill="var(--bg)" font-size="23.1111" font-weight="bold" font-family="Arial, sans-serif">AI Context Limitations</text>
  <rect x="71.1111" y="124.4444" width="302.2222" height="177.7778" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="222.2222" y="193.7778" text-anchor="middle" fill="var(--info-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Limited</text>
  <text x="222.2222" y="222.2222" text-anchor="middle" fill="var(--info-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Context Window</text>
  <text x="222.2222" y="259.5556" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">Can't hold entire</text>
  <text x="222.2222" y="280.8889" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">codebase in mind</text>
  <rect x="417.7778" y="124.4444" width="302.2222" height="177.7778" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="193.7778" text-anchor="middle" fill="var(--info-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Missing</text>
  <text x="568.8889" y="222.2222" text-anchor="middle" fill="var(--info-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Domain Context</text>
  <text x="568.8889" y="259.5556" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">Doesn't know your</text>
  <text x="568.8889" y="280.8889" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">business rules</text>
  <rect x="764.4444" y="124.4444" width="302.2222" height="177.7778" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="915.5556" y="193.7778" text-anchor="middle" fill="var(--info-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Incomplete</text>
  <text x="915.5556" y="222.2222" text-anchor="middle" fill="var(--info-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Codebase View</text>
  <text x="915.5556" y="259.5556" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">Missing cross-file</text>
  <text x="915.5556" y="280.8889" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">dependencies</text>
  <rect x="204.4444" y="337.7778" width="302.2222" height="177.7778" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="355.5556" y="407.1111" text-anchor="middle" fill="var(--info-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Legacy System</text>
  <text x="355.5556" y="435.5556" text-anchor="middle" fill="var(--info-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Complexity</text>
  <text x="355.5556" y="472.8889" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">Implicit coupling</text>
  <text x="355.5556" y="494.2222" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">hidden contracts</text>
  <rect x="631.1111" y="337.7778" width="302.2222" height="177.7778" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="782.2222" y="407.1111" text-anchor="middle" fill="var(--info-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Business Logic</text>
  <text x="782.2222" y="435.5556" text-anchor="middle" fill="var(--info-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Nuances</text>
  <text x="782.2222" y="472.8889" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">Edge cases from</text>
  <text x="782.2222" y="494.2222" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">years of prod use</text>
  <rect x="71.1111" y="546.6667" width="995.5556" height="71.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="582.2222" text-anchor="middle" fill="var(--bg)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Mitigation: Provide rich context in every prompt</text>
  <text x="568.8889" y="606.2222" text-anchor="middle" fill="var(--primary-accent)" font-size="14.2222" font-family="Arial, sans-serif">Use CLAUDE.md, code snippets, domain glossaries, and explicit constraints</text>
</svg>
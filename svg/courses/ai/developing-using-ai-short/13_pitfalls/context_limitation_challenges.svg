<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="53.129743" rx="6.725009" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="74.534284" text-anchor="middle" fill="var(--bg)" font-size="25.324926" font-weight="bold" font-family="Arial, sans-serif">AI Context Limitations</text>
  <rect x="40" y="128.549462" width="364.285714" height="177.099254" rx="6.725009" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="222.142857" y="197.618249" text-anchor="middle" fill="var(--info-accent)" font-size="19.480781" font-weight="bold" font-family="Arial, sans-serif">Limited</text>
  <text x="222.142857" y="225.954157" text-anchor="middle" fill="var(--info-accent)" font-size="19.480781" font-weight="bold" font-family="Arial, sans-serif">Context Window</text>
  <text x="222.142857" y="263.145076" text-anchor="middle" fill="var(--text-muted)" font-size="13.636412" font-family="Arial, sans-serif">Can't hold entire</text>
  <text x="222.142857" y="284.396951" text-anchor="middle" fill="var(--text-muted)" font-size="13.636412" font-family="Arial, sans-serif">codebase in mind</text>
  <rect x="457.857143" y="128.549462" width="364.285714" height="177.099254" rx="6.725009" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="197.618249" text-anchor="middle" fill="var(--info-accent)" font-size="19.480781" font-weight="bold" font-family="Arial, sans-serif">Missing</text>
  <text x="640" y="225.954157" text-anchor="middle" fill="var(--info-accent)" font-size="19.480781" font-weight="bold" font-family="Arial, sans-serif">Domain Context</text>
  <text x="640" y="263.145076" text-anchor="middle" fill="var(--text-muted)" font-size="13.636412" font-family="Arial, sans-serif">Doesn't know your</text>
  <text x="640" y="284.396951" text-anchor="middle" fill="var(--text-muted)" font-size="13.636412" font-family="Arial, sans-serif">business rules</text>
  <rect x="875.714171" y="128.549462" width="364.285714" height="177.099254" rx="6.725009" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1057.857143" y="197.618249" text-anchor="middle" fill="var(--info-accent)" font-size="19.480781" font-weight="bold" font-family="Arial, sans-serif">Incomplete</text>
  <text x="1057.857143" y="225.954157" text-anchor="middle" fill="var(--info-accent)" font-size="19.480781" font-weight="bold" font-family="Arial, sans-serif">Codebase View</text>
  <text x="1057.857143" y="263.145076" text-anchor="middle" fill="var(--text-muted)" font-size="13.636412" font-family="Arial, sans-serif">Missing cross-file</text>
  <text x="1057.857143" y="284.396951" text-anchor="middle" fill="var(--text-muted)" font-size="13.636412" font-family="Arial, sans-serif">dependencies</text>
  <rect x="200.714171" y="341.068655" width="364.285714" height="177.099254" rx="6.725009" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="382.857143" y="410.137333" text-anchor="middle" fill="var(--info-accent)" font-size="19.480781" font-weight="bold" font-family="Arial, sans-serif">Legacy System</text>
  <text x="382.857143" y="438.47335" text-anchor="middle" fill="var(--info-accent)" font-size="19.480781" font-weight="bold" font-family="Arial, sans-serif">Complexity</text>
  <text x="382.857143" y="475.664159" text-anchor="middle" fill="var(--text-muted)" font-size="13.636412" font-family="Arial, sans-serif">Implicit coupling</text>
  <text x="382.857143" y="496.916034" text-anchor="middle" fill="var(--text-muted)" font-size="13.636412" font-family="Arial, sans-serif">hidden contracts</text>
  <rect x="715" y="341.068655" width="364.285714" height="177.099254" rx="6.725009" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="897.142857" y="410.137333" text-anchor="middle" fill="var(--info-accent)" font-size="19.480781" font-weight="bold" font-family="Arial, sans-serif">Business Logic</text>
  <text x="897.142857" y="438.47335" text-anchor="middle" fill="var(--info-accent)" font-size="19.480781" font-weight="bold" font-family="Arial, sans-serif">Nuances</text>
  <text x="897.142857" y="475.664159" text-anchor="middle" fill="var(--text-muted)" font-size="13.636412" font-family="Arial, sans-serif">Edge cases from</text>
  <text x="897.142857" y="496.916034" text-anchor="middle" fill="var(--text-muted)" font-size="13.636412" font-family="Arial, sans-serif">years of prod use</text>
  <rect x="40" y="549.160342" width="1200" height="70.839658" rx="6.725009" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="584.580171" text-anchor="middle" fill="var(--bg)" font-size="19.480781" font-weight="bold" font-family="Arial, sans-serif">Mitigation: Provide rich context in every prompt</text>
  <text x="640" y="608.488572" text-anchor="middle" fill="var(--primary-accent)" font-size="15.584535" font-family="Arial, sans-serif">Use CLAUDE.md, code snippets, domain glossaries, and explicit constraints</text>
</svg>
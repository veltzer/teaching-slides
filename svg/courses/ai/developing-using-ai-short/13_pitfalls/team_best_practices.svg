<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header -->
  <rect x="80" y="40" width="1120" height="60" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="79" text-anchor="middle" fill="white" font-size="26" font-weight="bold" font-family="Arial, sans-serif">Team AI Best Practices Framework</text>
  <!-- Top 3 boxes -->
  <rect x="80" y="140" width="340" height="210" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="140" width="340" height="46" rx="12" fill="url(#grad-accent)"/>
  <rect x="80" y="172" width="340" height="14" fill="url(#grad-accent)"/>
  <text x="250" y="174" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Arial, sans-serif">Guidelines &amp; Standards</text>
  <text x="250" y="230" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Prompt style guide</text>
  <text x="250" y="260" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Approved tools list</text>
  <text x="250" y="290" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Code attribution rules</text>
  <text x="250" y="320" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Review requirements</text>
  <rect x="470" y="140" width="340" height="210" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="470" y="140" width="340" height="46" rx="12" fill="url(#grad-accent)"/>
  <rect x="470" y="172" width="340" height="14" fill="url(#grad-accent)"/>
  <text x="640" y="174" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Arial, sans-serif">Quality Gates</text>
  <text x="640" y="230" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Automated test coverage</text>
  <text x="640" y="260" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Security scan mandatory</text>
  <text x="640" y="290" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Performance thresholds</text>
  <text x="640" y="320" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Human review required</text>
  <rect x="860" y="140" width="340" height="210" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860" y="140" width="340" height="46" rx="12" fill="url(#grad-accent)"/>
  <rect x="860" y="172" width="340" height="14" fill="url(#grad-accent)"/>
  <text x="1030" y="174" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Arial, sans-serif">Continuous Learning</text>
  <text x="1030" y="230" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Monthly AI workshops</text>
  <text x="1030" y="260" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Share prompts that work</text>
  <text x="1030" y="290" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Track AI failures too</text>
  <text x="1030" y="320" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Rotate tool evaluators</text>
  <!-- Bottom 2 boxes -->
  <rect x="180" y="390" width="340" height="210" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="180" y="390" width="340" height="46" rx="12" fill="url(#grad-accent)"/>
  <rect x="180" y="422" width="340" height="14" fill="url(#grad-accent)"/>
  <text x="350" y="424" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Arial, sans-serif">Skill Preservation</text>
  <text x="350" y="480" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Regular no-AI days</text>
  <text x="350" y="510" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Understanding AI output</text>
  <text x="350" y="540" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Senior mentoring juniors</text>
  <text x="350" y="570" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Algorithm fundamentals</text>
  <rect x="760" y="390" width="340" height="210" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="760" y="390" width="340" height="46" rx="12" fill="url(#grad-accent)"/>
  <rect x="760" y="422" width="340" height="14" fill="url(#grad-accent)"/>
  <text x="930" y="424" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Arial, sans-serif">Knowledge Sharing</text>
  <text x="930" y="480" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Team prompt library</text>
  <text x="930" y="510" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Success story sharing</text>
  <text x="930" y="540" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Lessons from failures</text>
  <text x="930" y="570" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Cross-team patterns</text>
</svg>

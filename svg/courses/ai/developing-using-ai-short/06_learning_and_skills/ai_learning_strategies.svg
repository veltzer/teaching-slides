<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- == TOP: 5 STRATEGY CARDS == -->
  <!-- Card 1: Concept Explanation -->
  <rect x="44" y="30" width="218" height="180" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="44" y="30" width="218" height="40" rx="10" fill="#1e88e5"/>
  <rect x="44" y="54" width="218" height="16" fill="#1e88e5"/>
  <text x="153" y="56" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Concept Explanation</text>
  <text x="64" y="86" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">Ask AI to explain concepts</text>
  <text x="64" y="103" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">at multiple levels:</text>
  <text x="64" y="124" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; ELI5 first pass</text>
  <text x="64" y="142" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Technical depth pass</text>
  <text x="64" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Analogy to known topic</text>
  <text x="64" y="178" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Code example</text>
  <text x="64" y="197" font-family="Arial, sans-serif" font-size="11" fill="#777777">"Explain closures as if I</text>
  <text x="64" y="211" font-family="Arial, sans-serif" font-size="11" fill="#777777"> know only Java OOP"</text>

  <!-- Card 2: Interactive Exercises -->
  <rect x="282" y="30" width="218" height="180" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="282" y="30" width="218" height="40" rx="10" fill="#43a047"/>
  <rect x="282" y="54" width="218" height="16" fill="#43a047"/>
  <text x="391" y="56" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Interactive Exercises</text>
  <text x="302" y="86" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">Turn AI into a practice</text>
  <text x="302" y="103" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">partner:</text>
  <text x="302" y="124" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Request coding challenges</text>
  <text x="302" y="142" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Ask for hints, not answers</text>
  <text x="302" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Have AI grade your solution</text>
  <text x="302" y="178" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Socratic Q&amp;A mode</text>
  <text x="302" y="197" font-family="Arial, sans-serif" font-size="11" fill="#777777">"Quiz me on Python list</text>
  <text x="302" y="211" font-family="Arial, sans-serif" font-size="11" fill="#777777"> comprehensions (5 Qs)"</text>

  <!-- Card 3: Code Walkthroughs -->
  <rect x="520" y="30" width="218" height="180" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="520" y="30" width="218" height="40" rx="10" fill="#fb8c00"/>
  <rect x="520" y="54" width="218" height="16" fill="#fb8c00"/>
  <text x="629" y="56" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Code Walkthroughs</text>
  <text x="540" y="86" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">Let AI annotate and</text>
  <text x="540" y="103" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">walk through code:</text>
  <text x="540" y="124" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Line-by-line explanation</text>
  <text x="540" y="142" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; "Why" not just "what"</text>
  <text x="540" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Trace variable states</text>
  <text x="540" y="178" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Suggest improvements</text>
  <text x="540" y="197" font-family="Arial, sans-serif" font-size="11" fill="#777777">"Walk me through this</text>
  <text x="540" y="211" font-family="Arial, sans-serif" font-size="11" fill="#777777"> decorator step by step"</text>

  <!-- Card 4: Spaced Repetition -->
  <rect x="758" y="30" width="218" height="180" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="758" y="30" width="218" height="40" rx="10" fill="#8e24aa"/>
  <rect x="758" y="54" width="218" height="16" fill="#8e24aa"/>
  <text x="867" y="56" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Spaced Repetition</text>
  <text x="778" y="86" font-family="Arial, sans-serif" font-size="12" fill="#6a1b9a">Use AI to resurface</text>
  <text x="778" y="103" font-family="Arial, sans-serif" font-size="12" fill="#6a1b9a">knowledge gaps:</text>
  <text x="778" y="124" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Generate flashcard Q&amp;As</text>
  <text x="778" y="142" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Review sessions on demand</text>
  <text x="778" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Track weak areas manually</text>
  <text x="778" y="178" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Real project mini-tasks</text>
  <text x="778" y="197" font-family="Arial, sans-serif" font-size="11" fill="#777777">"Give me 5 flashcards on</text>
  <text x="778" y="211" font-family="Arial, sans-serif" font-size="11" fill="#777777"> Python async patterns"</text>

  <!-- Card 5: Skill Gap ID -->
  <rect x="996" y="30" width="240" height="180" rx="10" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <rect x="996" y="30" width="240" height="40" rx="10" fill="#e53935"/>
  <rect x="996" y="54" width="240" height="16" fill="#e53935"/>
  <text x="1116" y="56" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Skill Gap Identification</text>
  <text x="1016" y="86" font-family="Arial, sans-serif" font-size="12" fill="#c62828">Let AI diagnose your</text>
  <text x="1016" y="103" font-family="Arial, sans-serif" font-size="12" fill="#c62828">knowledge map:</text>
  <text x="1016" y="124" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Describe your role/goal</text>
  <text x="1016" y="142" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; AI lists required skills</text>
  <text x="1016" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; Self-assess each area</text>
  <text x="1016" y="178" font-family="Arial, sans-serif" font-size="12" fill="#333333">&#x2022; AI builds learning plan</text>
  <text x="1016" y="197" font-family="Arial, sans-serif" font-size="11" fill="#777777">"What should a junior DevOps</text>
  <text x="1016" y="211" font-family="Arial, sans-serif" font-size="11" fill="#777777"> engineer know?"</text>

  <!-- == TRADITIONAL vs AI-ENHANCED == -->
  <text x="60" y="248" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#555555">Traditional vs AI-Enhanced Learning</text>

  <!-- Traditional column -->
  <rect x="60" y="264" width="360" height="220" rx="8" fill="#fff8f8" stroke="#e57373" stroke-width="1.5"/>
  <text x="240" y="288" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">Traditional Path</text>
  <text x="80" y="312" font-family="Arial, sans-serif" font-size="13" fill="#555555">&#x2022; Book / video course (linear)</text>
  <text x="80" y="332" font-family="Arial, sans-serif" font-size="13" fill="#555555">&#x2022; Blocked until concept clicks</text>
  <text x="80" y="352" font-family="Arial, sans-serif" font-size="13" fill="#555555">&#x2022; Forum post, wait for reply</text>
  <text x="80" y="372" font-family="Arial, sans-serif" font-size="13" fill="#555555">&#x2022; Trial and error (expensive)</text>
  <text x="80" y="392" font-family="Arial, sans-serif" font-size="13" fill="#555555">&#x2022; Feedback cycle: days/weeks</text>
  <text x="80" y="420" font-family="Arial, sans-serif" font-size="13" fill="#888888">Time to proficiency: months+</text>
  <text x="80" y="440" font-family="Arial, sans-serif" font-size="13" fill="#888888">Personalization: low</text>
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="13" fill="#888888">Interactivity: low</text>

  <!-- AI-Enhanced column -->
  <rect x="460" y="264" width="380" height="220" rx="8" fill="#f1f8f1" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="650" y="288" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">AI-Enhanced Path</text>
  <text x="480" y="312" font-family="Arial, sans-serif" font-size="13" fill="#333333">&#x2022; Adaptive, on-demand explanation</text>
  <text x="480" y="332" font-family="Arial, sans-serif" font-size="13" fill="#333333">&#x2022; Instant clarification at any level</text>
  <text x="480" y="352" font-family="Arial, sans-serif" font-size="13" fill="#333333">&#x2022; Practice problems generated on demand</text>
  <text x="480" y="372" font-family="Arial, sans-serif" font-size="13" fill="#333333">&#x2022; Immediate feedback on your code</text>
  <text x="480" y="392" font-family="Arial, sans-serif" font-size="13" fill="#333333">&#x2022; Personalized learning path</text>
  <text x="480" y="420" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32">Time to proficiency: accelerated</text>
  <text x="480" y="440" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32">Personalization: high</text>
  <text x="480" y="460" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32">Interactivity: high</text>

  <!-- Caution box -->
  <rect x="880" y="264" width="356" height="220" rx="8" fill="#fff8e1" stroke="#ffa000" stroke-width="1.5"/>
  <text x="1058" y="288" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#e65100" text-anchor="middle">Important Cautions</text>
  <text x="900" y="312" font-family="Arial, sans-serif" font-size="13" fill="#555555">&#x2022; AI can be confidently wrong</text>
  <text x="900" y="332" font-family="Arial, sans-serif" font-size="13" fill="#555555">&#x2022; Always verify facts independently</text>
  <text x="900" y="352" font-family="Arial, sans-serif" font-size="13" fill="#555555">&#x2022; Don't skip fundamentals: learn why</text>
  <text x="900" y="372" font-family="Arial, sans-serif" font-size="13" fill="#555555">&#x2022; Over-reliance weakens problem-solving</text>
  <text x="900" y="392" font-family="Arial, sans-serif" font-size="13" fill="#555555">&#x2022; Build a personal project to consolidate</text>
  <text x="900" y="420" font-family="Arial, sans-serif" font-size="13" fill="#e65100">AI accelerates learning;</text>
  <text x="900" y="440" font-family="Arial, sans-serif" font-size="13" fill="#e65100">deep understanding still</text>
  <text x="900" y="460" font-family="Arial, sans-serif" font-size="13" fill="#e65100">requires practice and time.</text>

  <!-- == LEARNING LOOP == -->
  <text x="60" y="514" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565c0">The AI Learning Loop</text>
  <rect x="60" y="530" width="1160" height="90" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1"/>

  <!-- Steps in loop -->
  <rect x="80" y="545" width="168" height="60" rx="6" fill="#1e88e5"/>
  <text x="164" y="570" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Study Concept</text>
  <text x="164" y="590" font-family="Arial, sans-serif" font-size="11" fill="#bbdefb" text-anchor="middle">Ask AI to explain</text>
  <text x="260" y="578" font-family="Arial, sans-serif" font-size="18" fill="#1565c0" text-anchor="middle">-&gt;</text>

  <rect x="278" y="545" width="168" height="60" rx="6" fill="#43a047"/>
  <text x="362" y="570" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Practice</text>
  <text x="362" y="590" font-family="Arial, sans-serif" font-size="11" fill="#c8e6c9" text-anchor="middle">Solve AI exercises</text>
  <text x="458" y="578" font-family="Arial, sans-serif" font-size="18" fill="#1565c0" text-anchor="middle">-&gt;</text>

  <rect x="476" y="545" width="168" height="60" rx="6" fill="#fb8c00"/>
  <text x="560" y="570" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Get Feedback</text>
  <text x="560" y="590" font-family="Arial, sans-serif" font-size="11" fill="#fff3e0" text-anchor="middle">AI reviews your work</text>
  <text x="656" y="578" font-family="Arial, sans-serif" font-size="18" fill="#1565c0" text-anchor="middle">-&gt;</text>

  <rect x="674" y="545" width="168" height="60" rx="6" fill="#8e24aa"/>
  <text x="758" y="570" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4. Fill Gaps</text>
  <text x="758" y="590" font-family="Arial, sans-serif" font-size="11" fill="#e1bee7" text-anchor="middle">Target weak points</text>
  <text x="854" y="578" font-family="Arial, sans-serif" font-size="18" fill="#1565c0" text-anchor="middle">-&gt;</text>

  <rect x="872" y="545" width="168" height="60" rx="6" fill="#e53935"/>
  <text x="956" y="570" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5. Build Project</text>
  <text x="956" y="590" font-family="Arial, sans-serif" font-size="11" fill="#ffcdd2" text-anchor="middle">Apply knowledge</text>
  <text x="1052" y="578" font-family="Arial, sans-serif" font-size="18" fill="#1565c0" text-anchor="middle">-&gt;</text>

  <rect x="1070" y="545" width="130" height="60" rx="6" fill="#1565c0"/>
  <text x="1135" y="568" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6. Next Level</text>
  <text x="1135" y="586" font-family="Arial, sans-serif" font-size="11" fill="#bbdefb" text-anchor="middle">Advance skills</text>
</svg>

  <text x="860" y="383.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--info-text)">Fill Gaps</text>
  <text x="860" y="415.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--info-text)">Weak points</text>

  <rect x="1000" y="340.740740740741" width="240" height="118.148148148148" rx="10.363754503432" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="383.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--danger-text)">Build</text>
  <text x="1120" y="415.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--danger-text)">Real project</text>

  <line x1="240" y1="399.814814814815" x2="280" y2="399.814814814815" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="399.814814814815" x2="520" y2="399.814814814815" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="399.814814814815" x2="760" y2="399.814814814815" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="399.814814814815" x2="1000" y2="399.814814814815" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom caution -->
  <rect x="40" y="501.851851851852" width="1200" height="118.148148148148" rx="10.363754503432" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="544.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.618382655834" font-weight="bold" fill="var(--warn-text)">Cautions</text>
  <text x="640" y="577.037037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">AI can be wrong — verify. Learn fundamentals.</text>
  <text x="640" y="603.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">Over-reliance weakens problem-solving.</text>
</svg>

  <rect x="40" y="82.962962962963" width="236" height="161.111111111111" rx="10.363754503432" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="158" y="120.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.618382655834" font-weight="bold" fill="var(--primary-text)">Explain Concepts</text>

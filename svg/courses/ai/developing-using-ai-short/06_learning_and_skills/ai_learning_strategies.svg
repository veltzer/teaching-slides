  <text x="158" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--primary-text)">Analogies</text>
  <text x="158" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--primary-text)">Code examples</text>


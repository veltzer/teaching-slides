  <text x="404" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">Hints, not answers</text>
  <text x="404" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">Socratic mode</text>

  <rect x="532" y="82.962962962963" width="236" height="161.111111111111" rx="10.363754503432" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="120.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.618382655834" font-weight="bold" fill="var(--warn-text)">Walkthroughs</text>
  <text x="650" y="158.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">Line-by-line</text>
  <text x="650" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">Why, not what</text>
  <text x="650" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">Trace state</text>

  <rect x="778" y="82.962962962963" width="236" height="161.111111111111" rx="10.363754503432" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="896" y="120.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.618382655834" font-weight="bold" fill="var(--info-text)">Spaced Review</text>
  <text x="896" y="158.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--info-text)">Flashcards</text>
  <text x="896" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--info-text)">Weak areas</text>
  <text x="896" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--info-text)">Mini projects</text>

  <rect x="1024" y="82.962962962963" width="216" height="161.111111111111" rx="10.363754503432" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132" y="120.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.618382655834" font-weight="bold" fill="var(--danger-text)">Gap Analysis</text>
  <text x="1132" y="158.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--danger-text)">Map role skills</text>
  <text x="1132" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--danger-text)">Self-assess</text>
  <text x="1132" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--danger-text)">Learning plan</text>

  <!-- Bottom: The AI Learning Loop -->
  <text x="640" y="308.518518518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509006864" font-weight="bold" fill="var(--primary-accent)">The AI Learning Loop</text>

  <rect x="40" y="340.740740740741" width="200" height="118.148148148148" rx="10.363754503432" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="383.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--primary-text)">Study</text>
  <text x="140" y="415.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--primary-text)">Ask AI</text>

  <rect x="280" y="340.740740740741" width="200" height="118.148148148148" rx="10.363754503432" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="383.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--ok-text)">Practice</text>
  <text x="380" y="415.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--ok-text)">Solve exercises</text>

  <rect x="520" y="340.740740740741" width="200" height="118.148148148148" rx="10.363754503432" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="383.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--warn-text)">Feedback</text>
  <text x="620" y="415.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--warn-text)">AI reviews</text>


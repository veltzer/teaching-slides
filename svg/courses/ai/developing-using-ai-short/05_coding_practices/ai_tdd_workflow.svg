<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- == TDD CYCLE (left half) == -->
  <text x="60" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1565c0">AI-Assisted TDD Cycle</text>

  <!-- Step 1: Write Test -->
  <rect x="60" y="58" width="200" height="90" rx="10" fill="#c62828" filter="url(#shadow)"/>
  <text x="160" y="94" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Write Test</text>
  <text x="160" y="114" font-family="Arial, sans-serif" font-size="12" fill="#ffcdd2" text-anchor="middle">You define intent;</text>
  <text x="160" y="130" font-family="Arial, sans-serif" font-size="12" fill="#ffcdd2" text-anchor="middle">AI suggests edge cases</text>

  <!-- Arrow 1-&gt;2 -->
  <line x1="260" y1="103" x2="320" y2="103" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: AI Generates Code -->
  <rect x="320" y="58" width="200" height="90" rx="10" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="420" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2. AI Generates</text>
  <text x="420" y="108" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Code</text>
  <text x="420" y="130" font-family="Arial, sans-serif" font-size="12" fill="#bbdefb" text-anchor="middle">Prompt AI with test + spec</text>

  <!-- Arrow 2-&gt;3 -->
  <line x1="520" y1="103" x2="576" y2="103" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Run Tests -->
  <rect x="576" y="58" width="180" height="90" rx="10" fill="#fb8c00" filter="url(#shadow)"/>
  <text x="666" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Run Tests</text>
  <text x="666" y="114" font-family="Arial, sans-serif" font-size="12" fill="#fff3e0" text-anchor="middle">Red / Green?</text>
  <text x="666" y="130" font-family="Arial, sans-serif" font-size="12" fill="#fff3e0" text-anchor="middle">Verify pass/fail</text>

  <!-- Fail path: back to AI -->
  <path d="M666,148 Q666,185 420,185 Q320,185 320,148" stroke="#c62828" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="490" y="200" font-family="Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="middle">FAIL: refine prompt</text>

  <!-- Pass arrow to step 4 -->
  <line x1="756" y1="103" x2="810" y2="103" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="783" y="96" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle">PASS</text>

  <!-- Step 4: AI Refactors -->
  <rect x="810" y="58" width="200" height="90" rx="10" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="910" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4. AI Refactors</text>
  <text x="910" y="110" font-family="Arial, sans-serif" font-size="13" fill="#c8e6c9" text-anchor="middle">Clean code, optimize,</text>
  <text x="910" y="128" font-family="Arial, sans-serif" font-size="13" fill="#c8e6c9" text-anchor="middle">remove duplication</text>

  <!-- Loop arrow refactor back to write test -->
  <path d="M910,148 Q910,225 160,225 Q60,225 60,148" stroke="#8e24aa" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="500" y="240" font-family="Arial, sans-serif" font-size="12" fill="#8e24aa" text-anchor="middle">next feature cycle</text>

  <!-- == AI CODE REVIEW section == -->
  <text x="60" y="278" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1565c0">AI Code Review</text>
  <rect x="60" y="294" width="540" height="140" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>

  <text x="80" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">What AI reviews well:</text>
  <text x="80" y="342" font-family="Arial, sans-serif" font-size="13" fill="#333333">&#x2022; Security vulnerabilities: SQL injection, XSS, insecure deserialization</text>
  <text x="80" y="362" font-family="Arial, sans-serif" font-size="13" fill="#333333">&#x2022; Code style and naming conventions</text>
  <text x="80" y="382" font-family="Arial, sans-serif" font-size="13" fill="#333333">&#x2022; Missing error handling and edge cases</text>
  <text x="80" y="402" font-family="Arial, sans-serif" font-size="13" fill="#333333">&#x2022; Complexity and refactoring opportunities</text>
  <text x="80" y="422" font-family="Arial, sans-serif" font-size="13" fill="#777777">Prompt: "Review this code for security and style issues, be specific."</text>

  <!-- == DEBUGGING WITH AI == -->
  <text x="660" y="278" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#2e7d32">Debugging with AI</text>
  <rect x="660" y="294" width="560" height="140" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>

  <text x="680" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">Effective debug workflow:</text>
  <text x="680" y="342" font-family="Arial, sans-serif" font-size="13" fill="#333333">1. Paste the error + stack trace in full</text>
  <text x="680" y="362" font-family="Arial, sans-serif" font-size="13" fill="#333333">2. Include the relevant code section (not the whole file)</text>
  <text x="680" y="382" font-family="Arial, sans-serif" font-size="13" fill="#333333">3. Describe expected vs actual behavior</text>
  <text x="680" y="402" font-family="Arial, sans-serif" font-size="13" fill="#333333">4. Ask AI to explain the root cause first, then fix</text>
  <text x="680" y="422" font-family="Arial, sans-serif" font-size="13" fill="#777777">Ask "why" before "how to fix" to learn, not just copy</text>

  <!-- == BOTTOM BEST PRACTICES == -->
  <text x="60" y="462" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#555555">Best Practices</text>

  <rect x="60" y="478" width="280" height="140" rx="8" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>
  <text x="200" y="502" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">Always Review AI Code</text>
  <text x="80" y="524" font-family="Arial, sans-serif" font-size="13" fill="#333333">Never blindly copy-paste.</text>
  <text x="80" y="542" font-family="Arial, sans-serif" font-size="13" fill="#333333">Read every line, understand</text>
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="13" fill="#333333">the logic, and run tests</text>
  <text x="80" y="578" font-family="Arial, sans-serif" font-size="13" fill="#333333">before committing to the</text>
  <text x="80" y="596" font-family="Arial, sans-serif" font-size="13" fill="#333333">codebase.</text>
  <text x="80" y="610" font-family="Arial, sans-serif" font-size="12" fill="#777777">You own the code, not AI.</text>

  <rect x="380" y="478" width="280" height="140" rx="8" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>
  <text x="520" y="502" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">Keep Tests Authoritative</text>
  <text x="400" y="524" font-family="Arial, sans-serif" font-size="13" fill="#333333">Write tests yourself first.</text>
  <text x="400" y="542" font-family="Arial, sans-serif" font-size="13" fill="#333333">Let AI generate the impl,</text>
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="13" fill="#333333">not the tests. Tests define</text>
  <text x="400" y="578" font-family="Arial, sans-serif" font-size="13" fill="#333333">correctness; AI should not</text>
  <text x="400" y="596" font-family="Arial, sans-serif" font-size="13" fill="#333333">define what "correct" means.</text>
  <text x="400" y="610" font-family="Arial, sans-serif" font-size="12" fill="#777777">Tests = specification.</text>

  <rect x="700" y="478" width="280" height="140" rx="8" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>
  <text x="840" y="502" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00" text-anchor="middle">Incremental Context</text>
  <text x="720" y="524" font-family="Arial, sans-serif" font-size="13" fill="#333333">Give AI small, focused</text>
  <text x="720" y="542" font-family="Arial, sans-serif" font-size="13" fill="#333333">chunks of code. Avoid</text>
  <text x="720" y="560" font-family="Arial, sans-serif" font-size="13" fill="#333333">pasting entire repos.</text>
  <text x="720" y="578" font-family="Arial, sans-serif" font-size="13" fill="#333333">Build complexity step</text>
  <text x="720" y="596" font-family="Arial, sans-serif" font-size="13" fill="#333333">by step in a single chat.</text>
  <text x="720" y="610" font-family="Arial, sans-serif" font-size="12" fill="#777777">Context = quality.</text>

  <rect x="1010" y="478" width="210" height="140" rx="8" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>
  <text x="1115" y="502" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6a1b9a" text-anchor="middle">Learn the Why</text>
  <text x="1030" y="524" font-family="Arial, sans-serif" font-size="13" fill="#333333">Ask AI to explain</text>
  <text x="1030" y="542" font-family="Arial, sans-serif" font-size="13" fill="#333333">every fix. Build skill,</text>
  <text x="1030" y="560" font-family="Arial, sans-serif" font-size="13" fill="#333333">not just copy output.</text>
  <text x="1030" y="578" font-family="Arial, sans-serif" font-size="13" fill="#333333">Over time, verify AI</text>
  <text x="1030" y="596" font-family="Arial, sans-serif" font-size="13" fill="#333333">suggestions yourself.</text>
  <text x="1030" y="610" font-family="Arial, sans-serif" font-size="12" fill="#777777">Understanding = mastery.</text>
</svg>

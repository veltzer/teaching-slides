<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- == TDD CYCLE (left half) == -->
  <text x="60" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)">AI-Assisted TDD Cycle</text>

  <!-- Step 1: Write Test -->
  <rect x="60" y="58" width="200" height="90" rx="10" fill="var(--danger-dk)" filter="url(#shadow)"/>
  <text x="160" y="94" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">1. Write Test</text>
  <text x="160" y="114" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-lt)" text-anchor="middle">You define intent;</text>
  <text x="160" y="130" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-lt)" text-anchor="middle">AI suggests edge cases</text>

  <!-- Arrow 1-&gt;2 -->
  <line x1="260" y1="103" x2="320" y2="103" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: AI Generates Code -->
  <rect x="320" y="58" width="200" height="90" rx="10" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="420" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">2. AI Generates</text>
  <text x="420" y="108" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Code</text>
  <text x="420" y="130" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-lt)" text-anchor="middle">Prompt AI with test + spec</text>

  <!-- Arrow 2-&gt;3 -->
  <line x1="520" y1="103" x2="576" y2="103" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Run Tests -->
  <rect x="576" y="58" width="180" height="90" rx="10" fill="var(--warn)" filter="url(#shadow)"/>
  <text x="666" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">3. Run Tests</text>
  <text x="666" y="114" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-pale)" text-anchor="middle">Red / Green?</text>
  <text x="666" y="130" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-pale)" text-anchor="middle">Verify pass/fail</text>

  <!-- Fail path: back to AI -->
  <path d="M666,148 Q666,185 420,185 Q320,185 320,148" stroke="var(--danger-dk)" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="490" y="200" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-dk)" text-anchor="middle">FAIL: refine prompt</text>

  <!-- Pass arrow to step 4 -->
  <line x1="756" y1="103" x2="810" y2="103" stroke="var(--ok-dk)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="783" y="96" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)" text-anchor="middle">PASS</text>

  <!-- Step 4: AI Refactors -->
  <rect x="810" y="58" width="200" height="90" rx="10" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="910" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">4. AI Refactors</text>
  <text x="910" y="110" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-lt)" text-anchor="middle">Clean code, optimize,</text>
  <text x="910" y="128" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-lt)" text-anchor="middle">remove duplication</text>

  <!-- Loop arrow refactor back to write test -->
  <path d="M910,148 Q910,225 160,225 Q60,225 60,148" stroke="var(--info)" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="500" y="240" font-family="Arial, sans-serif" font-size="12" fill="var(--info)" text-anchor="middle">next feature cycle</text>

  <!-- == AI CODE REVIEW section == -->
  <text x="60" y="278" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--primary-dk)">AI Code Review</text>
  <rect x="60" y="294" width="540" height="140" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>

  <text x="80" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">What AI reviews well:</text>
  <text x="80" y="342" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">&#x2022; Security vulnerabilities: SQL injection, XSS, insecure deserialization</text>
  <text x="80" y="362" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">&#x2022; Code style and naming conventions</text>
  <text x="80" y="382" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">&#x2022; Missing error handling and edge cases</text>
  <text x="80" y="402" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">&#x2022; Complexity and refactoring opportunities</text>
  <text x="80" y="422" font-family="Arial, sans-serif" font-size="13" fill="var(--text-lighter)">Prompt: "Review this code for security and style issues, be specific."</text>

  <!-- == DEBUGGING WITH AI == -->
  <text x="660" y="278" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--ok-dk)">Debugging with AI</text>
  <rect x="660" y="294" width="560" height="140" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>

  <text x="680" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">Effective debug workflow:</text>
  <text x="680" y="342" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">1. Paste the error + stack trace in full</text>
  <text x="680" y="362" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">2. Include the relevant code section (not the whole file)</text>
  <text x="680" y="382" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">3. Describe expected vs actual behavior</text>
  <text x="680" y="402" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">4. Ask AI to explain the root cause first, then fix</text>
  <text x="680" y="422" font-family="Arial, sans-serif" font-size="13" fill="var(--text-lighter)">Ask "why" before "how to fix" to learn, not just copy</text>

  <!-- == BOTTOM BEST PRACTICES == -->
  <text x="60" y="462" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--text-muted)">Best Practices</text>

  <rect x="60" y="478" width="280" height="140" rx="8" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="1"/>
  <text x="200" y="502" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Always Review AI Code</text>
  <text x="80" y="524" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Never blindly copy-paste.</text>
  <text x="80" y="542" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Read every line, understand</text>
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">the logic, and run tests</text>
  <text x="80" y="578" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">before committing to the</text>
  <text x="80" y="596" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">codebase.</text>
  <text x="80" y="610" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">You own the code, not AI.</text>

  <rect x="380" y="478" width="280" height="140" rx="8" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="1"/>
  <text x="520" y="502" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Keep Tests Authoritative</text>
  <text x="400" y="524" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Write tests yourself first.</text>
  <text x="400" y="542" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Let AI generate the impl,</text>
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">not the tests. Tests define</text>
  <text x="400" y="578" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">correctness; AI should not</text>
  <text x="400" y="596" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">define what "correct" means.</text>
  <text x="400" y="610" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">Tests = specification.</text>

  <rect x="700" y="478" width="280" height="140" rx="8" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="1"/>
  <text x="840" y="502" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-mid)" text-anchor="middle">Incremental Context</text>
  <text x="720" y="524" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Give AI small, focused</text>
  <text x="720" y="542" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">chunks of code. Avoid</text>
  <text x="720" y="560" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">pasting entire repos.</text>
  <text x="720" y="578" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Build complexity step</text>
  <text x="720" y="596" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">by step in a single chat.</text>
  <text x="720" y="610" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">Context = quality.</text>

  <rect x="1010" y="478" width="210" height="140" rx="8" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="1"/>
  <text x="1115" y="502" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Learn the Why</text>
  <text x="1030" y="524" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Ask AI to explain</text>
  <text x="1030" y="542" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">every fix. Build skill,</text>
  <text x="1030" y="560" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">not just copy output.</text>
  <text x="1030" y="578" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Over time, verify AI</text>
  <text x="1030" y="596" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">suggestions yourself.</text>
  <text x="1030" y="610" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">Understanding = mastery.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.002856997099" font-weight="bold" fill="var(--primary-accent)">AI-Assisted TDD Cycle</text>

  <!-- Cycle steps -->
  <rect x="40" y="109.6" width="240" height="150.8" rx="10.770329614269" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659228538" font-weight="bold" fill="var(--danger-text)">1. Write Test</text>
  <text x="160" y="196.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421404" fill="var(--danger-text)">Define intent</text>
  <text x="160" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421404" fill="var(--danger-text)">AI suggests edges</text>

  <line x1="280" y1="185" x2="320" y2="185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="320" y="109.6" width="240" height="150.8" rx="10.770329614269" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659228538" font-weight="bold" fill="var(--primary-text)">2. AI Generates</text>
  <text x="440" y="196.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421404" fill="var(--primary-text)">Prompt with test</text>
  <text x="440" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421404" fill="var(--primary-text)">AI writes impl</text>

  <line x1="560" y1="185" x2="600" y2="185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="109.6" width="240" height="150.8" rx="10.770329614269" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659228538" font-weight="bold" fill="var(--warn-text)">3. Run Tests</text>
  <text x="720" y="196.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421404" fill="var(--warn-text)">Red or Green</text>
  <text x="720" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421404" fill="var(--warn-text)">Fail: refine prompt</text>

  <line x1="840" y1="185" x2="880" y2="185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="880" y="109.6" width="240" height="150.8" rx="10.770329614269" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659228538" font-weight="bold" fill="var(--ok-text)">4. AI Refactors</text>
  <text x="1000" y="196.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421404" fill="var(--ok-text)">Clean, dedupe</text>
  <text x="1000" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421404" fill="var(--ok-text)">Next cycle</text>

  <!-- Bottom: practices -->
  <rect x="40" y="295.2" width="290" height="324.8" rx="10.770329614269" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="335.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.386593305684" font-weight="bold" fill="var(--primary-text)">Review AI Code</text>
  <text x="60" y="376.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--primary-text)">Never blind copy</text>
  <text x="60" y="405.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--primary-text)">Read every line</text>
  <text x="60" y="434.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--primary-text)">Run tests first</text>
  <text x="60" y="463.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--primary-text)">You own code</text>

  <rect x="345" y="295.2" width="290" height="324.8" rx="10.770329614269" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="335.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.386593305684" font-weight="bold" fill="var(--ok-text)">Tests Authoritative</text>
  <text x="365" y="376.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--ok-text)">Write tests first</text>
  <text x="365" y="405.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--ok-text)">AI writes impl</text>
  <text x="365" y="434.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--ok-text)">Tests = spec</text>
  <text x="365" y="463.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--ok-text)">Never AI-only tests</text>

  <rect x="650" y="295.2" width="290" height="324.8" rx="10.770329614269" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="335.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.386593305684" font-weight="bold" fill="var(--warn-text)">Incremental Context</text>
  <text x="670" y="376.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--warn-text)">Small chunks</text>
  <text x="670" y="405.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--warn-text)">No whole repos</text>
  <text x="670" y="434.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--warn-text)">Build step-wise</text>
  <text x="670" y="463.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--warn-text)">Context = quality</text>

  <rect x="955" y="295.2" width="285" height="324.8" rx="10.770329614269" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="335.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.386593305684" font-weight="bold" fill="var(--info-text)">Learn the Why</text>
  <text x="975" y="376.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--info-text)">Ask for reason</text>
  <text x="975" y="405.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--info-text)">Build skill</text>
  <text x="975" y="434.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--info-text)">Verify yourself</text>
  <text x="975" y="463.4" font-family="Arial, sans-serif" font-size="15.078461459977" fill="var(--info-text)">Mastery not copy</text>
</svg>

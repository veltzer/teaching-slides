<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="947.1473" height="444.1978" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="381.6479" y="220.2222" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--primary-accent)">AI-Assisted TDD Cycle</text>
  <rect x="381.6479" y="231.3271" width="147.9916" height="62.4652" rx="6" fill="var(--danger-accent)" />
  <text x="455.6438" y="256.3131" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--bg)" text-anchor="middle">1. Write Test</text>
  <text x="455.6438" y="270.1945" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--danger-accent)" text-anchor="middle">You define intent;</text>
  <text x="455.6438" y="281.2993" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--danger-accent)" text-anchor="middle">AI suggests edge cases</text>
  <line x1="529.6395" y1="262.5599" x2="574.0371" y2="262.5599" stroke="var(--text-muted)" stroke-width="0.7437" marker-end="url(#arrow)" />
  <rect x="574.0371" y="231.3271" width="147.9916" height="62.4652" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="648.0332" y="253.537" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--bg)" text-anchor="middle">2. AI Generates</text>
  <text x="648.0332" y="266.0299" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--bg)" text-anchor="middle">Code</text>
  <text x="648.0332" y="281.2993" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--primary-accent)" text-anchor="middle">Prompt AI with test + spec</text>
  <line x1="722.0289" y1="262.5599" x2="763.4667" y2="262.5599" stroke="var(--text-muted)" stroke-width="0.7437" marker-end="url(#arrow)" />
  <rect x="763.4667" y="231.3271" width="133.1927" height="62.4652" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="830.063" y="253.537" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--bg)" text-anchor="middle">3. Run Tests</text>
  <text x="830.063" y="270.1945" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--warn-accent)" text-anchor="middle">Red / Green?</text>
  <text x="830.063" y="281.2993" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--warn-accent)" text-anchor="middle">Verify pass/fail</text>
  <path d="M 830.063 293.7923 Q 830.063 319.4726 648.0332 319.4726 Q 574.0371 319.4726 574.0371 293.7923" stroke="var(--danger-border)" stroke-width="0.7437" fill="none" stroke-dasharray="1.8593 1.4874" marker-end="url(#arrow)" />
  <text x="699.8302" y="329.8835" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--danger-accent)" text-anchor="middle">FAIL: refine prompt</text>
  <line x1="896.6592" y1="262.5599" x2="936.617" y2="262.5599" stroke="var(--ok-border)" stroke-width="0.7437" marker-end="url(#arrow)" />
  <text x="916.6382" y="257.7013" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--ok-accent)" text-anchor="middle">PASS</text>
  <rect x="936.617" y="231.3271" width="147.9916" height="62.4652" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1010.6129" y="253.537" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--bg)" text-anchor="middle">4. AI Refactors</text>
  <text x="1010.6129" y="267.4182" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--ok-accent)" text-anchor="middle">Clean code, optimize,</text>
  <text x="1010.6129" y="279.9112" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--ok-accent)" text-anchor="middle">remove duplication</text>
  <path d="M 1010.6129 293.7923 Q 1010.6129 347.235 455.6438 347.235 Q 381.6479 347.235 381.6479 293.7923" stroke="var(--info-border)" stroke-width="0.7437" fill="none" stroke-dasharray="1.8593 1.4874" marker-end="url(#arrow)" />
  <text x="707.2298" y="357.6459" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--info-accent)" text-anchor="middle">next feature cycle</text>
  <text x="381.6479" y="384.02" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--primary-accent)">AI Code Review</text>
  <rect x="381.6479" y="395.125" width="399.5778" height="97.1681" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="396.4471" y="413.1704" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--primary-accent)">What AI reviews well:</text>
  <text x="396.4471" y="428.4399" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">• Security vulnerabilities: SQL injection, XSS, insecure deserialization</text>
  <text x="396.4471" y="442.321" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">• Code style and naming conventions</text>
  <text x="396.4471" y="456.2021" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">• Missing error handling and edge cases</text>
  <text x="396.4471" y="470.0834" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">• Complexity and refactoring opportunities</text>
  <text x="396.4471" y="483.9645" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text-muted)">Prompt: "Review this code for security and style issues, be specific."</text>
  <text x="825.6232" y="384.02" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--ok-accent)">Debugging with AI</text>
  <rect x="825.6232" y="395.125" width="414.3768" height="97.1681" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840.4223" y="413.1704" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--ok-accent)">Effective debug workflow:</text>
  <text x="840.4223" y="428.4399" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">1. Paste the error + stack trace in full</text>
  <text x="840.4223" y="442.321" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">2. Include the relevant code section (not the whole file)</text>
  <text x="840.4223" y="456.2021" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">3. Describe expected vs actual behavior</text>
  <text x="840.4223" y="470.0834" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">4. Ask AI to explain the root cause first, then fix</text>
  <text x="840.4223" y="483.9645" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text-muted)">Ask "why" before "how to fix" to learn, not just copy</text>
  <text x="381.6479" y="511.7269" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--text-muted)">Best Practices</text>
  <rect x="381.6479" y="522.8319" width="207.1886" height="97.1681" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="485.2421" y="539.4891" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Always Review AI Code</text>
  <text x="396.4471" y="554.7585" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">Never blindly copy-paste.</text>
  <text x="396.4471" y="567.2517" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">Read every line, understand</text>
  <text x="396.4471" y="579.7447" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">the logic, and run tests</text>
  <text x="396.4471" y="592.2376" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">before committing to the</text>
  <text x="396.4471" y="604.7308" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">codebase.</text>
  <text x="396.4471" y="614.4475" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text-muted)">You own the code, not AI.</text>
  <rect x="618.4346" y="522.8319" width="207.1886" height="97.1681" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="722.0289" y="539.4891" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Keep Tests Authoritative</text>
  <text x="633.2339" y="554.7585" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">Write tests yourself first.</text>
  <text x="633.2339" y="567.2517" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">Let AI generate the impl,</text>
  <text x="633.2339" y="579.7447" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">not the tests. Tests define</text>
  <text x="633.2339" y="592.2376" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">correctness; AI should not</text>
  <text x="633.2339" y="604.7308" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">define what "correct" means.</text>
  <text x="633.2339" y="614.4475" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text-muted)">Tests = specification.</text>
  <rect x="855.2216" y="522.8319" width="207.1886" height="97.1681" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="958.8159" y="539.4891" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Incremental Context</text>
  <text x="870.0206" y="554.7585" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">Give AI small, focused</text>
  <text x="870.0206" y="567.2517" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">chunks of code. Avoid</text>
  <text x="870.0206" y="579.7447" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">pasting entire repos.</text>
  <text x="870.0206" y="592.2376" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">Build complexity step</text>
  <text x="870.0206" y="604.7308" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">by step in a single chat.</text>
  <text x="870.0206" y="614.4475" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text-muted)">Context = quality.</text>
  <rect x="1084.6087" y="522.8319" width="155.3913" height="97.1681" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1162.3044" y="539.4891" font-family="Arial, sans-serif" font-size="14.6879" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Learn the Why</text>
  <text x="1099.4081" y="554.7585" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">Ask AI to explain</text>
  <text x="1099.4081" y="567.2517" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">every fix. Build skill,</text>
  <text x="1099.4081" y="579.7447" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">not just copy output.</text>
  <text x="1099.4081" y="592.2376" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">Over time, verify AI</text>
  <text x="1099.4081" y="604.7308" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text)">suggestions yourself.</text>
  <text x="1099.4081" y="614.4475" font-family="Arial, sans-serif" font-size="14.6879" fill="var(--text-muted)">Understanding = mastery.</text>
</svg>
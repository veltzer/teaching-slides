<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="624.5273" height="312.2637" fill="var(--bg)" rx="4.9822" />
  <text x="225.2748" y="126.6932" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)">AI-Assisted TDD Cycle</text>
  <rect x="225.2748" y="134.4998" width="97.5823" height="43.912" rx="4.9822" fill="var(--danger-accent)" filter="url(#shadow)" />
  <text x="274.066" y="152.0645" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)" text-anchor="middle">1. Write Test</text>
  <text x="274.066" y="161.8229" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">You define intent;</text>
  <text x="274.066" y="169.6294" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">AI suggests edge cases</text>
  <line x1="322.8571" y1="156.4559" x2="352.1319" y2="156.4559" stroke="var(--text-muted)" stroke-width="0.7437" marker-end="url(#arrow)" />
  <rect x="352.1319" y="134.4998" width="97.5823" height="43.912" rx="4.9822" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="1.406" />
  <text x="400.9232" y="150.113" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)" text-anchor="middle">2. AI Generates</text>
  <text x="400.9232" y="158.8953" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)" text-anchor="middle">Code</text>
  <text x="400.9232" y="169.6294" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">Prompt AI with test + spec</text>
  <line x1="449.7143" y1="156.4559" x2="477.0374" y2="156.4559" stroke="var(--text-muted)" stroke-width="0.7437" marker-end="url(#arrow)" />
  <rect x="477.0374" y="134.4998" width="87.8242" height="43.912" rx="4.9822" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="1.406" />
  <text x="520.9495" y="150.113" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)" text-anchor="middle">3. Run Tests</text>
  <text x="520.9495" y="161.8229" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">Red / Green?</text>
  <text x="520.9495" y="169.6294" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)" text-anchor="middle">Verify pass/fail</text>
  <path d="M 520.9495 178.4118 Q 520.9495 196.4646 400.9232 196.4646 Q 352.1319 196.4646 352.1319 178.4118" stroke="var(--danger-border)" stroke-width="0.7437" fill="none" stroke-dasharray="1.8593 1.4874" marker-end="url(#arrow)" />
  <text x="435.077" y="203.7833" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">FAIL: refine prompt</text>
  <line x1="564.8615" y1="156.4559" x2="591.2088" y2="156.4559" stroke="var(--ok-border)" stroke-width="0.7437" marker-end="url(#arrow)" />
  <text x="578.0352" y="153.0404" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">PASS</text>
  <rect x="591.2088" y="134.4998" width="97.5823" height="43.912" rx="4.9822" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="1.406" />
  <text x="640" y="150.113" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--bg)" text-anchor="middle">4. AI Refactors</text>
  <text x="640" y="159.8712" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">Clean code, optimize,</text>
  <text x="640" y="168.6536" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">remove duplication</text>
  <path d="M 640 178.4118 Q 640 215.9811 274.066 215.9811 Q 225.2748 215.9811 225.2748 178.4118" stroke="var(--info-border)" stroke-width="0.7437" fill="none" stroke-dasharray="1.8593 1.4874" marker-end="url(#arrow)" />
  <text x="439.9561" y="223.2998" font-family="Arial, sans-serif" font-size="10" fill="var(--info-accent)" text-anchor="middle">next feature cycle</text>
  <text x="225.2748" y="241.8404" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)">AI Code Review</text>
  <rect x="225.2748" y="249.647" width="263.4725" height="68.3076" rx="4.9822" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.406" />
  <text x="235.0331" y="262.3326" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)">What AI reviews well:</text>
  <text x="235.0331" y="273.0668" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">• Security vulnerabilities: SQL injection, XSS, insecure deserialization</text>
  <text x="235.0331" y="282.825" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">• Code style and naming conventions</text>
  <text x="235.0331" y="292.5832" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">• Missing error handling and edge cases</text>
  <text x="235.0331" y="302.3415" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">• Complexity and refactoring opportunities</text>
  <text x="235.0331" y="312.0997" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Prompt: "Review this code for security and style issues, be specific."</text>
  <text x="518.022" y="241.8404" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Debugging with AI</text>
  <rect x="518.022" y="249.647" width="273.2306" height="68.3076" rx="4.9822" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.406" />
  <text x="527.7802" y="262.3326" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Effective debug workflow:</text>
  <text x="527.7802" y="273.0668" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">1. Paste the error + stack trace in full</text>
  <text x="527.7802" y="282.825" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">2. Include the relevant code section (not the whole file)</text>
  <text x="527.7802" y="292.5832" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">3. Describe expected vs actual behavior</text>
  <text x="527.7802" y="302.3415" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">4. Ask AI to explain the root cause first, then fix</text>
  <text x="527.7802" y="312.0997" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Ask "why" before "how to fix" to learn, not just copy</text>
  <text x="225.2748" y="331.6162" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--text-muted)">Best Practices</text>
  <rect x="225.2748" y="339.4228" width="136.6154" height="68.3076" rx="4.9822" fill="var(--surface)" stroke="var(--border)" stroke-width="0.703" />
  <text x="293.5825" y="351.1326" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Always Review AI Code</text>
  <text x="235.0331" y="361.8667" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Never blindly copy-paste.</text>
  <text x="235.0331" y="370.6492" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Read every line, understand</text>
  <text x="235.0331" y="379.4316" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">the logic, and run tests</text>
  <text x="235.0331" y="388.2139" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">before committing to the</text>
  <text x="235.0331" y="396.9964" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">codebase.</text>
  <text x="235.0331" y="403.8271" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">You own the code, not AI.</text>
  <rect x="381.4066" y="339.4228" width="136.6154" height="68.3076" rx="4.9822" fill="var(--surface)" stroke="var(--border)" stroke-width="0.703" />
  <text x="449.7143" y="351.1326" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Keep Tests Authoritative</text>
  <text x="391.1649" y="361.8667" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Write tests yourself first.</text>
  <text x="391.1649" y="370.6492" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Let AI generate the impl,</text>
  <text x="391.1649" y="379.4316" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">not the tests. Tests define</text>
  <text x="391.1649" y="388.2139" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">correctness; AI should not</text>
  <text x="391.1649" y="396.9964" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">define what "correct" means.</text>
  <text x="391.1649" y="403.8271" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Tests = specification.</text>
  <rect x="537.5385" y="339.4228" width="136.6154" height="68.3076" rx="4.9822" fill="var(--surface)" stroke="var(--border)" stroke-width="0.703" />
  <text x="605.8462" y="351.1326" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Incremental Context</text>
  <text x="547.2966" y="361.8667" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Give AI small, focused</text>
  <text x="547.2966" y="370.6492" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">chunks of code. Avoid</text>
  <text x="547.2966" y="379.4316" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">pasting entire repos.</text>
  <text x="547.2966" y="388.2139" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Build complexity step</text>
  <text x="547.2966" y="396.9964" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">by step in a single chat.</text>
  <text x="547.2966" y="403.8271" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Context = quality.</text>
  <rect x="688.7911" y="339.4228" width="102.4615" height="68.3076" rx="4.9822" fill="var(--surface)" stroke="var(--border)" stroke-width="0.703" />
  <text x="740.0219" y="351.1326" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Learn the Why</text>
  <text x="698.5495" y="361.8667" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Ask AI to explain</text>
  <text x="698.5495" y="370.6492" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">every fix. Build skill,</text>
  <text x="698.5495" y="379.4316" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">not just copy output.</text>
  <text x="698.5495" y="388.2139" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Over time, verify AI</text>
  <text x="698.5495" y="396.9964" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">suggestions yourself.</text>
  <text x="698.5495" y="403.8271" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Understanding = mastery.</text>
</svg>
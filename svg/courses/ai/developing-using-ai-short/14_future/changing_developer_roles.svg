  <text x="300.3734" y="272" text-anchor="middle" font-size="25.0311">Traditional</text>
  <text x="300.3734" y="313.6001" text-anchor="middle" font-size="25.0311">Developer</text>
  <text x="450.56" y="288.0001" text-anchor="middle" font-size="50.0622">→</text>
  <rect x="500.6223" y="224" width="200.2489" height="128" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="600.7467" y="272" text-anchor="middle" font-size="25.0311">AI-Assisted</text>
  <text x="600.7467" y="313.6001" text-anchor="middle" font-size="25.0311">Developer</text>
  <text x="750.9334" y="288.0001" text-anchor="middle" font-size="50.0622">→</text>
  <rect x="800.9956" y="224" width="200.2489" height="128" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="901.1201" y="272" text-anchor="middle" font-size="25.0311">AI</text>
  <text x="901.1201" y="313.6001" text-anchor="middle" font-size="25.0311">Orchestrator</text>
  <rect x="300.3734" y="416" width="250.3111" height="112.0001" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="425.5289" y="464.0001" text-anchor="middle" font-size="25.0311">Solution</text>
  <text x="425.5289" y="505.6" text-anchor="middle" font-size="25.0311">Architect</text>
  <rect x="625.7778" y="416" width="250.3111" height="112.0001" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="750.9334" y="464.0001" text-anchor="middle" font-size="25.0311">AI Prompt</text>
  <text x="750.9334" y="505.6" text-anchor="middle" font-size="25.0311">Engineer</text>
</svg>
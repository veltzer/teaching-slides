  <text x="142.8571" y="591.0003" text-anchor="middle" font-size="31.337">5-10%</text>
  <rect x="357.787" y="377.43" width="50.1396" height="50.1396" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="382.8571" y="475.0003" text-anchor="middle" font-size="31.337">Progressive</text>
  <text x="382.8571" y="518.5003" text-anchor="middle" font-size="31.337">20-30%</text>
  <rect x="597.787" y="304.93" width="50.1396" height="50.1396" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="622.8568" y="402.5003" text-anchor="middle" font-size="31.337">Mainstream</text>
  <text x="622.8568" y="446.0001" text-anchor="middle" font-size="31.337">40-60%</text>
  <rect x="837.787" y="232.43" width="50.1396" height="50.1396" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="862.8571" y="330.0003" text-anchor="middle" font-size="31.337">Late Majority</text>
  <text x="862.8571" y="373.5" text-anchor="middle" font-size="31.337">70-85%</text>
  <rect x="1077.79" y="196.18" width="50.1396" height="50.1396" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="1102.8571" y="293.7502" text-anchor="middle" font-size="31.337">Universal</text>
  <text x="1102.8571" y="337.2503" text-anchor="middle" font-size="31.337">90%+</text>

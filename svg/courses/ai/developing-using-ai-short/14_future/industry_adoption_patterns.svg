<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="207.9012" y="80" width="864.1976" height="500" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="8.3333" stroke-width="2"/>
  <text x="639.9999" y="158.125" text-anchor="middle" font-size="39.5061" font-weight="bold">AI Adoption Maturity Curve</text>
  <path d="M 281.9753 455 Q 454.8148 392.5 627.6542 330 Q 800.4938 267.5 973.3333 236.25" fill="none" stroke="var(--primary-border)" stroke-width="5.3333" />
  <circle cx="281.9753" cy="455" r="19.7532" fill="var(--primary-fill)" />
  <text x="281.9753" y="517.5" text-anchor="middle" font-size="24.6914">Early Adopters</text>
  <text x="281.9753" y="555" text-anchor="middle" font-size="24.6914">5-10%</text>
  <circle cx="454.8148" cy="392.5" r="19.7532" fill="var(--primary-fill)" />
  <text x="454.8148" y="455" text-anchor="middle" font-size="24.6914">Progressive</text>
  <text x="454.8148" y="492.5" text-anchor="middle" font-size="24.6914">20-30%</text>
  <circle cx="627.6542" cy="330" r="19.7532" fill="var(--primary-fill)" />
  <text x="627.6542" y="392.5" text-anchor="middle" font-size="24.6914">Mainstream</text>
  <text x="627.6542" y="430" text-anchor="middle" font-size="24.6914">40-60%</text>
  <circle cx="800.4938" cy="267.5" r="19.7532" fill="var(--primary-fill)" />
  <text x="800.4938" y="330" text-anchor="middle" font-size="24.6914">Late Majority</text>
  <text x="800.4938" y="367.5" text-anchor="middle" font-size="24.6914">70-85%</text>
  <circle cx="973.3333" cy="236.25" r="19.7532" fill="var(--primary-fill)" />
  <text x="973.3333" y="298.75" text-anchor="middle" font-size="24.6914">Universal</text>
  <text x="973.3333" y="336.25" text-anchor="middle" font-size="24.6914">90%+</text>
</svg>
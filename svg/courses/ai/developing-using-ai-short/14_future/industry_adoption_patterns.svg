<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="88.8889" y="45" width="622.2223" height="360" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <text x="400" y="101.25" text-anchor="middle" font-size="28.4444" font-weight="bold">AI Adoption Maturity Curve</text>
  <path d="M 142.2223 315 Q 266.6667 270 391.1111 225 Q 515.5556 180 640 157.5" fill="none" stroke="var(--primary-border)" stroke-width="5.3333" />
  <circle cx="142.2223" cy="315" r="14.2223" fill="var(--primary-fill)" />
  <text x="142.2223" y="360" text-anchor="middle" font-size="17.7778">Early Adopters</text>
  <text x="142.2223" y="387" text-anchor="middle" font-size="17.7778">5-10%</text>
  <circle cx="266.6667" cy="270" r="14.2223" fill="var(--primary-fill)" />
  <text x="266.6667" y="315" text-anchor="middle" font-size="17.7778">Progressive</text>
  <text x="266.6667" y="342" text-anchor="middle" font-size="17.7778">20-30%</text>
  <circle cx="391.1111" cy="225" r="14.2223" fill="var(--primary-fill)" />
  <text x="391.1111" y="270" text-anchor="middle" font-size="17.7778">Mainstream</text>
  <text x="391.1111" y="297" text-anchor="middle" font-size="17.7778">40-60%</text>
  <circle cx="515.5556" cy="180" r="14.2223" fill="var(--primary-fill)" />
  <text x="515.5556" y="225" text-anchor="middle" font-size="17.7778">Late Majority</text>
  <text x="515.5556" y="252" text-anchor="middle" font-size="17.7778">70-85%</text>
  <circle cx="640" cy="157.5" r="14.2223" fill="var(--primary-fill)" />
  <text x="640" y="202.5" text-anchor="middle" font-size="17.7778">Universal</text>
  <text x="640" y="229.5" text-anchor="middle" font-size="17.7778">90%+</text>
</svg>
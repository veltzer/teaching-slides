<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="640" y="109.0476" text-anchor="middle" font-size="43.4219" font-weight="bold">Emerging AI Development Technologies</text>
  <rect x="245.015" y="138.348" width="189.971" height="189.971" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)"/>
  <text x="340" y="219.5238" text-anchor="middle" font-size="27.1387">Multimodal</text>
  <text x="340" y="255.4286" text-anchor="middle" font-size="27.1387">AI Systems</text>
  <rect x="558.584" y="96.6792" width="162.832" height="162.832" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)"/>
  <text x="640" y="164.2857" text-anchor="middle" font-size="27.1387">Autonomous</text>
  <text x="640" y="200.1905" text-anchor="middle" font-size="27.1387">Agents</text>
  <rect x="845.015" y="138.348" width="189.971" height="189.971" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)"/>
  <text x="940" y="219.5238" text-anchor="middle" font-size="27.1387">Specialized</text>
  <text x="940" y="255.4286" text-anchor="middle" font-size="27.1387">AI Models</text>
  <rect x="258.584" y="345.251" width="162.832" height="162.832" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)"/>
  <text x="340" y="412.8571" text-anchor="middle" font-size="27.1387">AI-Native</text>
  <text x="340" y="448.7619" text-anchor="middle" font-size="27.1387">IDEs</text>
  <rect x="545.015" y="276.443" width="189.971" height="189.971" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)"/>
  <text x="640" y="357.6191" text-anchor="middle" font-size="27.1387">Continuous</text>
  <text x="640" y="393.5238" text-anchor="middle" font-size="27.1387">Learning</text>
  <rect x="858.584" y="345.251" width="162.832" height="162.832" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)"/>
  <text x="940" y="412.8571" text-anchor="middle" font-size="27.1387">Real-time</text>
  <text x="940" y="448.7619" text-anchor="middle" font-size="27.1387">Adaptation</text>
  <rect x="414.9999" y="537.1428" width="450" height="69.0476" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="640" y="586.8571" text-anchor="middle" font-size="29.8525">Convergent Intelligence Ecosystem</text>
</svg>
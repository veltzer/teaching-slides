  <text x="695.3087" y="288.0001" text-anchor="middle" font-size="27.8123">Continuous Validation</text>
  <rect x="889.9951" y="224" width="278.1234" height="96" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="1029.0568" y="288.0001" text-anchor="middle" font-size="27.8123">Adaptive Learning</text>
  <rect x="389.3729" y="384.0001" width="278.1234" height="96" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="528.4346" y="448" text-anchor="middle" font-size="27.8123">Predictive Development</text>
  <rect x="723.1211" y="384.0001" width="278.1234" height="96" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="862.1828" y="448" text-anchor="middle" font-size="27.8123">Self-Healing Systems</text>
  <rect x="417.1853" y="544" width="417.1853" height="64" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="625.7778" y="588.8" text-anchor="middle" font-size="27.8123">Intelligence-Driven Development</text>
</svg>
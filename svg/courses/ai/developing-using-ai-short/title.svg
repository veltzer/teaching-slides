<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1020"/>
      <stop offset="100%" style="stop-color:#162040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Code editor window -->
  <rect x="250" y="60" width="300" height="200" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>
  <circle cx="272" cy="78" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="290" cy="78" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="308" cy="78" r="5" fill="#22c55e" opacity="0.8"/>
  <!-- Code lines -->
  <rect x="270" y="100" width="80" height="6" rx="3" fill="#06b6d4" opacity="0.6"/>
  <rect x="270" y="116" width="120" height="6" rx="3" fill="#22d3ee" opacity="0.4"/>
  <rect x="285" y="132" width="100" height="6" rx="3" fill="#67e8f9" opacity="0.3"/>
  <rect x="285" y="148" width="60" height="6" rx="3" fill="#06b6d4" opacity="0.5"/>
  <rect x="270" y="164" width="90" height="6" rx="3" fill="#22d3ee" opacity="0.4"/>
  <rect x="270" y="180" width="110" height="6" rx="3" fill="#67e8f9" opacity="0.3"/>
  <!-- AI sparkle icon -->
  <polygon points="480,120 486,140 506,140 490,152 496,172 480,160 464,172 470,152 454,140 474,140" fill="#06b6d4" opacity="0.8"/>
  <!-- Lightning bolt for speed -->
  <polygon points="400,290 415,310 405,310 420,340 395,315 405,315 390,290" fill="#eab308" opacity="0.7"/>
  <!-- Clock outline suggesting short course -->
  <circle cx="200" cy="310" r="30" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="310" x2="200" y2="290" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="310" x2="215" y2="315" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <!-- Decorative dots -->
  <circle cx="100" cy="80" r="2" fill="#06b6d4" opacity="0.3"/>
  <circle cx="700" cy="100" r="3" fill="#22d3ee" opacity="0.3"/>
  <circle cx="680" cy="350" r="2" fill="#06b6d4" opacity="0.3"/>
  <circle cx="120" cy="200" r="2" fill="#22d3ee" opacity="0.2"/>
  <!-- Bottom accent -->
  <rect x="250" y="375" width="300" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>
</svg>

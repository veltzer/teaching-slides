<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#1a1a2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#2196f3" />
      <stop offset="100%" style="stop-color:#2196f3" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <rect x="355.5556" y="96" width="426.6667" height="320" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1333" opacity="0.9" />
  <circle cx="386.8444" cy="124.8" r="7.1111" fill="var(--danger-fill)" opacity="0.8" />
  <circle cx="412.4444" cy="124.8" r="7.1111" fill="var(--warn-fill)" opacity="0.8" />
  <circle cx="438.0444" cy="124.8" r="7.1111" fill="var(--ok-fill)" opacity="0.8" />
  <rect x="384" y="160" width="113.7778" height="9.6" rx="6" fill="var(--primary-fill)" opacity="0.6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="384" y="185.6" width="170.6667" height="9.6" rx="6" fill="var(--primary-fill)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="405.3333" y="211.2" width="142.2222" height="9.6" rx="6" fill="var(--primary-fill)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="405.3333" y="236.8" width="85.3333" height="9.6" rx="6" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="384" y="262.4" width="128" height="9.6" rx="6" fill="var(--primary-fill)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="384" y="288" width="156.4444" height="9.6" rx="6" fill="var(--primary-fill)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="682.6667,192 691.2,224 719.6444,224 696.8889,243.2 705.4222,275.2 682.6667,256 659.9111,275.2 668.4444,243.2 645.6889,224 674.1333,224" fill="var(--primary-fill)" opacity="0.8" />
  <polygon points="568.8889,464 590.2222,496 576,496 597.3333,544 561.7778,504 576,504 554.6667,464" fill="var(--warn-fill)" opacity="0.7" />
  <circle cx="284.4444" cy="496" r="42.6667" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" opacity="0.5" />
  <line x1="284.4444" y1="496" x2="284.4444" y2="464" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="284.4444" y1="496" x2="305.7778" y2="504" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <circle cx="142.2222" cy="128" r="2.8444" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="995.5556" cy="160" r="4.2667" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="967.1111" cy="560" r="2.8444" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="170.6667" cy="320" r="2.8444" fill="var(--primary-fill)" opacity="0.2" />
  <rect x="355.5556" y="600" width="426.6667" height="4.8" rx="6" fill="url(#accent)" opacity="0.6" />
</svg>
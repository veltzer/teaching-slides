<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#1a1a2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#2196f3" />
      <stop offset="100%" style="stop-color:#2196f3" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <rect x="415" y="127" width="450" height="290" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1333" opacity="0.9" />
  <circle cx="447.9999" cy="153.1" r="6.9522" fill="var(--danger-fill)" opacity="0.8" />
  <circle cx="474.9999" cy="153.1" r="6.9522" fill="var(--warn-fill)" opacity="0.8" />
  <circle cx="501.9999" cy="153.1" r="6.9522" fill="var(--ok-fill)" opacity="0.8" />
  <rect x="445" y="185" width="120" height="8.7" rx="6" fill="url(#grad-primary)" opacity="0.6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="208.2" width="180" height="8.7" rx="6" fill="url(#grad-primary)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="467.5" y="231.4" width="150" height="8.7" rx="6" fill="url(#grad-primary)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="467.5" y="254.6" width="90" height="8.7" rx="6" fill="url(#grad-primary)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="277.8" width="135" height="8.7" rx="6" fill="url(#grad-primary)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="301" width="164.9999" height="8.7" rx="6" fill="url(#grad-primary)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <polygon points="760,214 769,243 798.9999,243 775,260.4 784,289.4 760,272 736,289.4 744.9999,260.4 721,243 751,243" fill="var(--primary-fill)" opacity="0.8" />
  <polygon points="640,460.5 662.5,489.5 647.5,489.5 670,533 632.5,496.75 647.5,496.75 625,460.5" fill="var(--warn-fill)" opacity="0.7" />
  <circle cx="339.9999" cy="489.5" r="41.7133" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" opacity="0.5" />
  <line x1="339.9999" y1="489.5" x2="339.9999" y2="460.5" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="339.9999" y1="489.5" x2="362.5" y2="496.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <circle cx="190" cy="156" r="2.7808" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="1090" cy="185" r="4.1714" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="1060" cy="547.5" r="2.7808" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="220" cy="330" r="2.7808" fill="var(--primary-fill)" opacity="0.2" />
  <rect x="415" y="583.75" width="450" height="4.35" rx="6" fill="url(#accent)" opacity="0.6" />
</svg>
  <ns0:text x="568.8889" y="149.3333" text-anchor="middle" fill="#2e7d32" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">Performance: *****</ns0:text>
  <ns0:text x="568.8889" y="177.7778" text-anchor="middle" fill="#2e7d32" font-size="14.2222" font-family="Arial, sans-serif">Learning: ****</ns0:text>
  <ns0:text x="568.8889" y="213.3333" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">• Dart language</ns0:text>
  <ns0:text x="568.8889" y="241.7778" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">• Custom rendering</ns0:text>
  <ns0:text x="568.8889" y="270.2222" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">• Rich widgets</ns0:text>
  <ns0:text x="568.8889" y="298.6667" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">• Google-backed</ns0:text>
  <ns0:text x="568.8889" y="327.1111" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">• Web &amp; desktop too</ns0:text>
  <ns0:text x="568.8889" y="373.3333" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">Best for: pixel-perfect UI,</ns0:text>
  <ns0:text x="568.8889" y="396.4444" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">high performance</ns0:text>

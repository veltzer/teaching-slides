  <ns0:text x="928.8889" y="241.7778" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">• Angular/React/Vue</ns0:text>
  <ns0:text x="928.8889" y="270.2222" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">• PWA support</ns0:text>

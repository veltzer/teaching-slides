<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- React Native -->
  <rect x="60" y="80" width="350" height="520" rx="14" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="80" width="350" height="50" rx="14" fill="url(#grad-accent)"/>
  <rect x="60" y="110" width="350" height="20" fill="url(#grad-accent)"/>
  <text x="235" y="115" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">React Native</text>
  <text x="235" y="168" text-anchor="middle" fill="#1565c0" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Performance: ****</text>
  <text x="235" y="200" text-anchor="middle" fill="#1565c0" font-size="16" font-family="Arial, sans-serif">Learning: ***</text>
  <text x="235" y="240" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• JavaScript / React</text>
  <text x="235" y="272" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• Native modules</text>
  <text x="235" y="304" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• Hot reload</text>
  <text x="235" y="336" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• Large ecosystem</text>
  <text x="235" y="368" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• Meta-backed</text>
  <text x="235" y="420" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Best for: web devs moving</text>
  <text x="235" y="446" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">to mobile</text>
  <!-- Flutter -->
  <rect x="465" y="80" width="350" height="520" rx="14" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="465" y="80" width="350" height="50" rx="14" fill="#1565c0"/>
  <rect x="465" y="110" width="350" height="20" fill="#1565c0"/>
  <text x="640" y="115" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Flutter</text>
  <text x="640" y="168" text-anchor="middle" fill="#2e7d32" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Performance: *****</text>
  <text x="640" y="200" text-anchor="middle" fill="#2e7d32" font-size="16" font-family="Arial, sans-serif">Learning: ****</text>
  <text x="640" y="240" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• Dart language</text>
  <text x="640" y="272" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• Custom rendering</text>
  <text x="640" y="304" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• Rich widgets</text>
  <text x="640" y="336" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• Google-backed</text>
  <text x="640" y="368" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• Web &amp; desktop too</text>
  <text x="640" y="420" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Best for: pixel-perfect UI,</text>
  <text x="640" y="446" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">high performance</text>
  <!-- Ionic -->
  <rect x="870" y="80" width="350" height="520" rx="14" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="870" y="80" width="350" height="50" rx="14" fill="#f57c00"/>
  <rect x="870" y="110" width="350" height="20" fill="#f57c00"/>
  <text x="1045" y="115" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Ionic</text>
  <text x="1045" y="168" text-anchor="middle" fill="#e65100" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Performance: ***</text>
  <text x="1045" y="200" text-anchor="middle" fill="#e65100" font-size="16" font-family="Arial, sans-serif">Learning: **</text>
  <text x="1045" y="240" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• Web technologies</text>
  <text x="1045" y="272" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• Angular/React/Vue</text>
  <text x="1045" y="304" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• PWA support</text>
  <text x="1045" y="336" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• Capacitor plugins</text>
  <text x="1045" y="368" text-anchor="middle" fill="#333" font-size="16" font-family="Arial, sans-serif">• Easy web reuse</text>
  <text x="1045" y="420" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Best for: web apps needing</text>
  <text x="1045" y="446" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">mobile packaging</text>
</svg>

  <ns0:text x="208.8889" y="102.2222" text-anchor="middle" fill="white" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">React Native</ns0:text>
  <ns0:text x="208.8889" y="149.3333" text-anchor="middle" fill="#1565c0" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">Performance: ****</ns0:text>
  <ns0:text x="208.8889" y="177.7778" text-anchor="middle" fill="#1565c0" font-size="14.2222" font-family="Arial, sans-serif">Learning: ***</ns0:text>
  <ns0:text x="208.8889" y="213.3333" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">• JavaScript / React</ns0:text>
  <ns0:text x="208.8889" y="241.7778" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">• Native modules</ns0:text>
  <ns0:text x="208.8889" y="270.2222" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">• Hot reload</ns0:text>
  <ns0:text x="208.8889" y="298.6667" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">• Large ecosystem</ns0:text>
  <ns0:text x="208.8889" y="327.1111" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">• Meta-backed</ns0:text>
  <ns0:text x="208.8889" y="373.3333" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">Best for: web devs moving</ns0:text>
  <ns0:text x="208.8889" y="396.4444" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">to mobile</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="362.068999" height="580" rx="7.416378" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="362.068999" height="55.769122" rx="7.416378" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="73.461584" width="362.068999" height="22.307676" fill="url(#grad-primary)" rx="7.416378" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.034499" y="79.038537" text-anchor="middle" fill="var(--bg)" font-size="23.631793" font-weight="bold" font-family="Arial, sans-serif">React Native</text>
  <text x="221.034499" y="138.153859" text-anchor="middle" fill="var(--primary-accent)" font-size="17.186713" font-weight="bold" font-family="Arial, sans-serif">Performance: ****</text>
  <text x="221.034499" y="173.846196" text-anchor="middle" fill="var(--primary-accent)" font-size="17.186713" font-family="Arial, sans-serif">Learning: ***</text>
  <text x="221.034499" y="218.461549" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• JavaScript / React</text>
  <text x="221.034499" y="254.153887" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• Native modules</text>
  <text x="221.034499" y="289.846224" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• Hot reload</text>
  <text x="221.034499" y="325.538562" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• Large ecosystem</text>
  <text x="221.034499" y="361.230761" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• Meta-backed</text>
  <text x="221.034499" y="419.230775" text-anchor="middle" fill="var(--text-muted)" font-size="15.038312" font-family="Arial, sans-serif">Best for: web devs moving</text>
  <text x="221.034499" y="448.230712" text-anchor="middle" fill="var(--text-muted)" font-size="15.038312" font-family="Arial, sans-serif">to mobile</text>
  <rect x="458.965556" y="40" width="362.068999" height="580" rx="7.416378" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="458.965556" y="40" width="362.068999" height="55.769122" rx="7.416378" fill="var(--primary-accent)" />
  <rect x="458.965556" y="73.461584" width="362.068999" height="22.307676" fill="var(--primary-accent)" rx="7.416378"/>
  <text x="640.000055" y="79.038537" text-anchor="middle" fill="var(--bg)" font-size="23.631793" font-weight="bold" font-family="Arial, sans-serif">Flutter</text>
  <text x="640.000055" y="138.153859" text-anchor="middle" fill="var(--ok-accent)" font-size="17.186713" font-weight="bold" font-family="Arial, sans-serif">Performance: *****</text>
  <text x="640.000055" y="173.846196" text-anchor="middle" fill="var(--ok-accent)" font-size="17.186713" font-family="Arial, sans-serif">Learning: ****</text>
  <text x="640.000055" y="218.461549" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• Dart language</text>
  <text x="640.000055" y="254.153887" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• Custom rendering</text>
  <text x="640.000055" y="289.846224" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• Rich widgets</text>
  <text x="640.000055" y="325.538562" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• Google-backed</text>
  <text x="640.000055" y="361.230761" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• Web &amp; desktop too</text>
  <text x="640.000055" y="419.230775" text-anchor="middle" fill="var(--text-muted)" font-size="15.038312" font-family="Arial, sans-serif">Best for: pixel-perfect UI,</text>
  <text x="640.000055" y="448.230712" text-anchor="middle" fill="var(--text-muted)" font-size="15.038312" font-family="Arial, sans-serif">high performance</text>
  <rect x="877.931001" y="40" width="362.068999" height="580" rx="7.416378" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="877.931001" y="40" width="362.068999" height="55.769122" rx="7.416378" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="877.931001" y="73.461584" width="362.068999" height="22.307676" fill="url(#grad-warn)" rx="7.416378" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.965611" y="79.038537" text-anchor="middle" fill="var(--bg)" font-size="23.631793" font-weight="bold" font-family="Arial, sans-serif">Ionic</text>
  <text x="1058.965611" y="138.153859" text-anchor="middle" fill="var(--warn-accent)" font-size="17.186713" font-weight="bold" font-family="Arial, sans-serif">Performance: ***</text>
  <text x="1058.965611" y="173.846196" text-anchor="middle" fill="var(--warn-accent)" font-size="17.186713" font-family="Arial, sans-serif">Learning: **</text>
  <text x="1058.965611" y="218.461549" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• Web technologies</text>
  <text x="1058.965611" y="254.153887" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• Angular/React/Vue</text>
  <text x="1058.965611" y="289.846224" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• PWA support</text>
  <text x="1058.965611" y="325.538562" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• Capacitor plugins</text>
  <text x="1058.965611" y="361.230761" text-anchor="middle" fill="var(--text)" font-size="17.186713" font-family="Arial, sans-serif">• Easy web reuse</text>
  <text x="1058.965611" y="419.230775" text-anchor="middle" fill="var(--text-muted)" font-size="15.038312" font-family="Arial, sans-serif">Best for: web apps needing</text>
  <text x="1058.965611" y="448.230712" text-anchor="middle" fill="var(--text-muted)" font-size="15.038312" font-family="Arial, sans-serif">mobile packaging</text>
</svg>
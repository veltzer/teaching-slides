<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="353.571429" height="122.69226" rx="7.54765" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="216.785714" y="109.153905" text-anchor="middle" fill="var(--bg)" font-size="24.050083" font-weight="bold" font-family="Arial, sans-serif">API Gateway</text>
  <text x="216.785714" y="140.384589" text-anchor="middle" fill="var(--primary-accent)" font-size="16.397772" font-family="Arial, sans-serif">Single entry point</text>
  <rect x="463.214286" y="40" width="353.571429" height="122.69226" rx="7.54765" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="109.153905" text-anchor="middle" fill="var(--bg)" font-size="24.050083" font-weight="bold" font-family="Arial, sans-serif">Service Mesh</text>
  <text x="640" y="140.384589" text-anchor="middle" fill="var(--ok-accent)" font-size="16.397772" font-family="Arial, sans-serif">mTLS, observability</text>
  <rect x="886.428457" y="40" width="353.571429" height="122.69226" rx="7.54765" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1063.214286" y="109.153905" text-anchor="middle" fill="var(--bg)" font-size="24.050083" font-weight="bold" font-family="Arial, sans-serif">Message Queue</text>
  <text x="1063.214286" y="140.384589" text-anchor="middle" fill="var(--danger-accent)" font-size="16.397772" font-family="Arial, sans-serif">Async communication</text>
  <rect x="40" y="218.461507" width="353.571429" height="122.69226" rx="7.54765" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="216.785714" y="285.384658" text-anchor="middle" fill="var(--bg)" font-size="24.050083" font-weight="bold" font-family="Arial, sans-serif">gRPC</text>
  <text x="216.785714" y="316.61548" text-anchor="middle" fill="var(--warn-accent)" font-size="16.397772" font-family="Arial, sans-serif">High-perf RPC</text>
  <rect x="463.214286" y="218.461507" width="353.571429" height="122.69226" rx="7.54765" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="285.384658" text-anchor="middle" fill="var(--bg)" font-size="24.050083" font-weight="bold" font-family="Arial, sans-serif">GraphQL</text>
  <text x="640" y="316.61548" text-anchor="middle" fill="var(--info-accent)" font-size="16.397772" font-family="Arial, sans-serif">Flexible queries</text>
  <rect x="886.428457" y="218.461507" width="353.571429" height="122.69226" rx="7.54765" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1063.214286" y="285.384658" text-anchor="middle" fill="var(--bg)" font-size="24.050083" font-weight="bold" font-family="Arial, sans-serif">WebSocket</text>
  <text x="1063.214286" y="316.61548" text-anchor="middle" fill="var(--ok-accent)" font-size="16.397772" font-family="Arial, sans-serif">Real-time bidirectional</text>
  <rect x="40" y="396.923151" width="1200" height="223.076849" rx="7.54765" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="439.307602" text-anchor="middle" fill="var(--primary-accent)" font-size="24.050083" font-weight="bold" font-family="Arial, sans-serif">Microservices Communication Patterns</text>
  <text x="640" y="481.692191" text-anchor="middle" fill="var(--text)" font-size="18.584201" font-family="Arial, sans-serif">Synchronous: REST, gRPC, GraphQL — request/response patterns</text>
  <text x="640" y="519.615273" text-anchor="middle" fill="var(--text)" font-size="18.584201" font-family="Arial, sans-serif">Asynchronous: Kafka, RabbitMQ — event-driven, decoupled</text>
  <text x="640" y="557.538493" text-anchor="middle" fill="var(--text)" font-size="18.584201" font-family="Arial, sans-serif">Real-time: WebSocket, SSE — streaming &amp; live updates</text>
  <text x="640" y="595.461437" text-anchor="middle" fill="var(--text)" font-size="18.584201" font-family="Arial, sans-serif">Service Mesh (Istio/Linkerd) adds mTLS, tracing &amp; retries</text>
</svg>
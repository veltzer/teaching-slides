  <ns0:text x="942.2222" y="475.5556" text-anchor="middle" fill="#6a1b9a" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">CTE Usage</ns0:text>
  <ns0:text x="942.2222" y="499.5556" text-anchor="middle" fill="#333333" font-size="12.4444" font-family="Arial, sans-serif">Readable &amp; cached</ns0:text>

  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="71.1111" y="71.1111" width="995.5556" height="88.8889" rx="8.8889" fill="#ffebee" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="88.8889" y="104.8889" font-size="15.1111" fill="#b71c1c" font-weight="bold" font-family="Arial, sans-serif">BEFORE:</ns0:text>
  <ns0:text x="88.8889" y="131.5556" font-size="15.1111" fill="#333333" font-family="Arial, monospace">SELECT * FROM orders WHERE status = 'pending'</ns0:text>
  <ns0:text x="977.7778" y="122.6667" text-anchor="middle" fill="#e53935" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">2.5s</ns0:text>
  <ns0:line x1="568.8889" y1="168.8889" x2="568.8889" y2="204.4444" stroke="#1565c0" stroke-width="2.6667" marker-end="url(#arrow-primary)" />
  <ns0:text x="586.6667" y="192.8889" font-size="13.3333" fill="#1565c0" font-family="Arial, sans-serif">optimized</ns0:text>
  <ns0:rect x="71.1111" y="213.3333" width="995.5556" height="155.5556" rx="8.8889" fill="#e8f5e9" stroke="#43a047" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="88.8889" y="245.3333" font-size="15.1111" fill="#1b5e20" font-weight="bold" font-family="Arial, sans-serif">AFTER:</ns0:text>
  <ns0:text x="88.8889" y="272" font-size="14.2222" fill="#333" font-family="Arial, monospace">WITH pending_orders AS (</ns0:text>
  <ns0:text x="106.6667" y="295.1111" font-size="14.2222" fill="#333" font-family="Arial, monospace">SELECT id, customer_id, total FROM orders</ns0:text>
  <ns0:text x="106.6667" y="318.2222" font-size="14.2222" fill="#333" font-family="Arial, monospace">WHERE status = 'pending' AND created_at &gt; NOW() - INTERVAL '7 days'</ns0:text>
  <ns0:text x="88.8889" y="351.1111" font-size="14.2222" fill="#333" font-family="Arial, monospace">) SELECT * FROM pending_orders;</ns0:text>
  <ns0:text x="977.7778" y="302.2222" text-anchor="middle" fill="#2e7d32" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">0.08s</ns0:text>
  <ns0:rect x="71.1111" y="400" width="995.5556" height="177.7778" rx="10.6667" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="433.7778" text-anchor="middle" fill="#1565c0" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Optimizations Applied</ns0:text>
  <ns0:rect x="97.7778" y="448.8889" width="213.3333" height="106.6667" rx="7.1111" fill="#e3f2fd" stroke="#1e88e5" stroke-width="0.8889" />
  <ns0:text x="204.4444" y="475.5556" text-anchor="middle" fill="#1565c0" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">Partial Index</ns0:text>
  <ns0:text x="204.4444" y="499.5556" text-anchor="middle" fill="#333333" font-size="12.4444" font-family="Arial, sans-serif">WHERE status = pending</ns0:text>
  <ns0:rect x="346.6667" y="448.8889" width="213.3333" height="106.6667" rx="7.1111" fill="#e8f5e9" stroke="#43a047" stroke-width="0.8889" />
  <ns0:text x="453.3333" y="475.5556" text-anchor="middle" fill="#2e7d32" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">Column Select</ns0:text>
  <ns0:text x="453.3333" y="499.5556" text-anchor="middle" fill="#333333" font-size="12.4444" font-family="Arial, sans-serif">No SELECT *</ns0:text>
  <ns0:rect x="595.5556" y="448.8889" width="213.3333" height="106.6667" rx="7.1111" fill="#fff3e0" stroke="#fb8c00" stroke-width="0.8889" />

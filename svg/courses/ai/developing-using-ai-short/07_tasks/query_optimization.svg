<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="160" y="90" width="960" height="540" fill="#2C3E50" rx="16" />
  <text x="640" y="144" text-anchor="middle" fill="white" font-size="28.8" font-weight="bold">Query Performance Analysis</text>
  <rect x="240" y="180" width="800" height="72" fill="#E74C3C" rx="8" />
  <text x="256" y="225" fill="white" font-size="19.2">Before: SELECT * FROM orders WHERE status = 'pending'</text>
  <text x="880" y="225" fill="white" font-size="19.2">Time: 2.5s</text>
  <rect x="240" y="270" width="800" height="144" fill="#27AE60" rx="8" />
  <text x="256" y="315" fill="white" font-size="19.2">After: WITH pending_orders AS (</text>
  <text x="288" y="351" fill="white" font-size="19.2">SELECT id, customer_id, total FROM orders</text>
  <text x="288" y="387" fill="white" font-size="19.2">WHERE status = 'pending' AND created_at &gt; NOW() - INTERVAL '7 days'</text>
  <text x="256" y="423" fill="white" font-size="19.2">) SELECT * FROM pending_orders;</text>
  <text x="880" y="351" fill="white" font-size="19.2">Time: 0.08s</text>
  <rect x="240" y="450" width="800" height="108" fill="#3498DB" rx="8" />
  <text x="256" y="495" fill="white" font-size="19.2">Optimizations Applied:</text>
  <text x="256" y="531" fill="white" font-size="19.2">✓ Partial index ✓ Column selection ✓ Date range ✓ CTE usage</text>
</svg>
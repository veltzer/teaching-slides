<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="101.754435" rx="7.209017" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.428571" y="78.666776" font-size="17.750401" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">BEFORE:</text>
  <text x="61.428571" y="109.193132" font-size="17.750401" fill="var(--text)" font-family="Courier New, monospace">SELECT * FROM orders WHERE status = 'pending'</text>
  <text x="1132.857143" y="99.017638" text-anchor="middle" fill="var(--danger-accent)" font-size="20.882839" font-weight="bold" font-family="Arial, sans-serif">2.5s</text>
  <line x1="640" y1="151.929929" x2="640" y2="192.631526" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="661.428571" y="179.403611" font-size="15.662069" fill="var(--primary-accent)" font-family="Arial, sans-serif">optimized</text>
  <rect x="40" y="202.80702" width="1200" height="178.070261" rx="7.209017" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.428571" y="239.438596" font-size="17.750401" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">AFTER:</text>
  <text x="61.428571" y="269.964952" font-size="16.706175" fill="var(--text)" font-family="Courier New, monospace">WITH pending_orders AS (</text>
  <text x="82.857143" y="296.421034" font-size="16.706175" fill="var(--text)" font-family="Courier New, monospace">SELECT id, customer_id, total FROM orders</text>
  <text x="82.857143" y="322.877243" font-size="16.706175" fill="var(--text)" font-family="Courier New, monospace">WHERE status = 'pending' AND created_at &gt; NOW() - INTERVAL '7 days'</text>
  <text x="61.428571" y="360.526293" font-size="16.706175" fill="var(--text)" font-family="Courier New, monospace">) SELECT * FROM pending_orders;</text>
  <text x="1132.857143" y="304.561454" text-anchor="middle" fill="var(--ok-accent)" font-size="20.882839" font-weight="bold" font-family="Arial, sans-serif">0.08s</text>
  <rect x="40" y="416.491257" width="1200" height="203.508743" rx="7.209017" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="455.157907" text-anchor="middle" fill="var(--primary-accent)" font-size="22.971051" font-weight="bold" font-family="Arial, sans-serif">Optimizations Applied</text>
  <rect x="72.142857" y="472.456221" width="257.142857" height="122.105296" rx="7.209017" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200.714171" y="502.982577" text-anchor="middle" fill="var(--primary-accent)" font-size="16.706175" font-weight="bold" font-family="Arial, sans-serif">Partial Index</text>
  <text x="200.714171" y="530.456259" text-anchor="middle" fill="var(--text)" font-size="14.617843" font-family="Arial, sans-serif">WHERE status = pending</text>
  <rect x="372.142857" y="472.456221" width="257.142857" height="122.105296" rx="7.209017" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500.714286" y="502.982577" text-anchor="middle" fill="var(--ok-accent)" font-size="16.706175" font-weight="bold" font-family="Arial, sans-serif">Column Select</text>
  <text x="500.714286" y="530.456259" text-anchor="middle" fill="var(--text)" font-size="14.617843" font-family="Arial, sans-serif">No SELECT *</text>
  <rect x="672.142857" y="472.456221" width="257.142857" height="122.105296" rx="7.209017" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800.714286" y="502.982577" text-anchor="middle" fill="var(--warn-accent)" font-size="16.706175" font-weight="bold" font-family="Arial, sans-serif">Date Range</text>
  <text x="800.714286" y="530.456259" text-anchor="middle" fill="var(--text)" font-size="14.617843" font-family="Arial, sans-serif">Limit scan scope</text>
  <rect x="972.142743" y="472.456221" width="235.714286" height="122.105296" rx="7.209017" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="502.982577" text-anchor="middle" fill="var(--info-accent)" font-size="16.706175" font-weight="bold" font-family="Arial, sans-serif">CTE Usage</text>
  <text x="1090" y="530.456259" text-anchor="middle" fill="var(--text)" font-size="14.617843" font-family="Arial, sans-serif">Readable &amp; cached</text>
</svg>
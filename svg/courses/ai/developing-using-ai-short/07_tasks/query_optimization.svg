<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" />
  <rect x="71.1111" y="71.1111" width="995.5556" height="88.8889" rx="8.8889" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="88.8889" y="104.8889" font-size="15.1111" fill="var(--danger-deep)" font-weight="bold" font-family="Arial, sans-serif">BEFORE:</text>
  <text x="88.8889" y="131.5556" font-size="15.1111" fill="var(--text-dark)" font-family="Arial, monospace">SELECT * FROM orders WHERE status = 'pending'</text>
  <text x="977.7778" y="122.6667" text-anchor="middle" fill="var(--danger)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">2.5s</text>
  <line x1="568.8889" y1="168.8889" x2="568.8889" y2="204.4444" stroke="var(--primary-dk)" stroke-width="2.6667" marker-end="url(#arrow-primary)" />
  <text x="586.6667" y="192.8889" font-size="13.3333" fill="var(--primary-dk)" font-family="Arial, sans-serif">optimized</text>
  <rect x="71.1111" y="213.3333" width="995.5556" height="155.5556" rx="8.8889" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="88.8889" y="245.3333" font-size="15.1111" fill="var(--ok-deep)" font-weight="bold" font-family="Arial, sans-serif">AFTER:</text>
  <text x="88.8889" y="272" font-size="14.2222" fill="var(--text-dark)" font-family="Arial, monospace">WITH pending_orders AS (</text>
  <text x="106.6667" y="295.1111" font-size="14.2222" fill="var(--text-dark)" font-family="Arial, monospace">SELECT id, customer_id, total FROM orders</text>
  <text x="106.6667" y="318.2222" font-size="14.2222" fill="var(--text-dark)" font-family="Arial, monospace">WHERE status = 'pending' AND created_at &gt; NOW() - INTERVAL '7 days'</text>
  <text x="88.8889" y="351.1111" font-size="14.2222" fill="var(--text-dark)" font-family="Arial, monospace">) SELECT * FROM pending_orders;</text>
  <text x="977.7778" y="302.2222" text-anchor="middle" fill="var(--ok-dk)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">0.08s</text>
  <rect x="71.1111" y="400" width="995.5556" height="177.7778" rx="10.6667" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="568.8889" y="433.7778" text-anchor="middle" fill="var(--primary-dk)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Optimizations Applied</text>
  <rect x="97.7778" y="448.8889" width="213.3333" height="106.6667" rx="7.1111" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="0.8889" />
  <text x="204.4444" y="475.5556" text-anchor="middle" fill="var(--primary-dk)" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">Partial Index</text>
  <text x="204.4444" y="499.5556" text-anchor="middle" fill="var(--text-dark)" font-size="12.4444" font-family="Arial, sans-serif">WHERE status = pending</text>
  <rect x="346.6667" y="448.8889" width="213.3333" height="106.6667" rx="7.1111" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="0.8889" />
  <text x="453.3333" y="475.5556" text-anchor="middle" fill="var(--ok-dk)" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">Column Select</text>
  <text x="453.3333" y="499.5556" text-anchor="middle" fill="var(--text-dark)" font-size="12.4444" font-family="Arial, sans-serif">No SELECT *</text>
  <rect x="595.5556" y="448.8889" width="213.3333" height="106.6667" rx="7.1111" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="0.8889" />
  <text x="702.2222" y="475.5556" text-anchor="middle" fill="var(--warn-dk)" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">Date Range</text>
  <text x="702.2222" y="499.5556" text-anchor="middle" fill="var(--text-dark)" font-size="12.4444" font-family="Arial, sans-serif">Limit scan scope</text>
  <rect x="844.4444" y="448.8889" width="195.5556" height="106.6667" rx="7.1111" fill="var(--info-pale)" stroke="var(--info)" stroke-width="0.8889" />
  <text x="942.2222" y="475.5556" text-anchor="middle" fill="var(--info-dk)" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">CTE Usage</text>
  <text x="942.2222" y="499.5556" text-anchor="middle" fill="var(--text-dark)" font-size="12.4444" font-family="Arial, sans-serif">Readable &amp; cached</text>
</svg>
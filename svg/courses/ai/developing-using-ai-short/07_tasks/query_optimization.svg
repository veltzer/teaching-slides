<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="71.1111" y="71.1111" width="995.5556" height="88.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="88.8889" y="104.8889" font-size="15.1111" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">BEFORE:</text>
  <text x="88.8889" y="131.5556" font-size="15.1111" fill="var(--text)" font-family="Arial, monospace">SELECT * FROM orders WHERE status = 'pending'</text>
  <text x="977.7778" y="122.6667" text-anchor="middle" fill="var(--danger-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">2.5s</text>
  <line x1="568.8889" y1="168.8889" x2="568.8889" y2="204.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="586.6667" y="192.8889" font-size="13.3333" fill="var(--primary-accent)" font-family="Arial, sans-serif">optimized</text>
  <rect x="71.1111" y="213.3333" width="995.5556" height="155.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="88.8889" y="245.3333" font-size="15.1111" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">AFTER:</text>
  <text x="88.8889" y="272" font-size="14.2222" fill="var(--text)" font-family="Arial, monospace">WITH pending_orders AS (</text>
  <text x="106.6667" y="295.1111" font-size="14.2222" fill="var(--text)" font-family="Arial, monospace">SELECT id, customer_id, total FROM orders</text>
  <text x="106.6667" y="318.2222" font-size="14.2222" fill="var(--text)" font-family="Arial, monospace">WHERE status = 'pending' AND created_at &gt; NOW() - INTERVAL '7 days'</text>
  <text x="88.8889" y="351.1111" font-size="14.2222" fill="var(--text)" font-family="Arial, monospace">) SELECT * FROM pending_orders;</text>
  <text x="977.7778" y="302.2222" text-anchor="middle" fill="var(--ok-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">0.08s</text>
  <rect x="71.1111" y="400" width="995.5556" height="177.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="433.7778" text-anchor="middle" fill="var(--primary-accent)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Optimizations Applied</text>
  <rect x="97.7778" y="448.8889" width="213.3333" height="106.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="204.4444" y="475.5556" text-anchor="middle" fill="var(--primary-accent)" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">Partial Index</text>
  <text x="204.4444" y="499.5556" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">WHERE status = pending</text>
  <rect x="346.6667" y="448.8889" width="213.3333" height="106.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="453.3333" y="475.5556" text-anchor="middle" fill="var(--ok-accent)" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">Column Select</text>
  <text x="453.3333" y="499.5556" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">No SELECT *</text>
  <rect x="595.5556" y="448.8889" width="213.3333" height="106.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="702.2222" y="475.5556" text-anchor="middle" fill="var(--warn-accent)" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">Date Range</text>
  <text x="702.2222" y="499.5556" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">Limit scan scope</text>
  <rect x="844.4444" y="448.8889" width="195.5556" height="106.6667" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="942.2222" y="475.5556" text-anchor="middle" fill="var(--info-accent)" font-size="14.2222" font-weight="bold" font-family="Arial, sans-serif">CTE Usage</text>
  <text x="942.2222" y="499.5556" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">Readable &amp; cached</text>
</svg>
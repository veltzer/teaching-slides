<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="342.857029" height="120.377328" rx="7.476107" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.428571" y="111.132187" text-anchor="middle" fill="var(--bg)" font-size="23.822117" font-weight="bold" font-family="Arial, sans-serif">Login</text>
  <text x="211.428571" y="140.679353" text-anchor="middle" fill="var(--primary-accent)" font-size="17.32513" font-family="Arial, sans-serif">User credentials</text>
  <line x1="382.857143" y1="100.188732" x2="457.857143" y2="100.188732" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="468.571429" y="40" width="342.857029" height="120.377328" rx="7.476107" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="111.132187" text-anchor="middle" fill="var(--bg)" font-size="23.822117" font-weight="bold" font-family="Arial, sans-serif">JWT Token</text>
  <text x="640" y="140.679353" text-anchor="middle" fill="var(--ok-accent)" font-size="17.32513" font-family="Arial, sans-serif">Signed &amp; expiring</text>
  <line x1="811.428571" y1="100.188732" x2="886.428457" y2="100.188732" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="897.142857" y="40" width="342.857029" height="120.377328" rx="7.476107" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.571314" y="111.132187" text-anchor="middle" fill="var(--bg)" font-size="23.822117" font-weight="bold" font-family="Arial, sans-serif">Access</text>
  <text x="1068.571314" y="140.679353" text-anchor="middle" fill="var(--danger-accent)" font-size="17.32513" font-family="Arial, sans-serif">Protected resource</text>
  <rect x="40" y="215.094332" width="1200" height="186.037651" rx="7.476107" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="256.679217" text-anchor="middle" fill="var(--primary-accent)" font-size="23.822117" font-weight="bold" font-family="Arial, sans-serif">Middleware Validates Every Request</text>
  <text x="640" y="300.452902" text-anchor="middle" fill="var(--text)" font-size="19.490834" font-family="Arial, sans-serif">• Validates token signature and expiry</text>
  <text x="640" y="335.47166" text-anchor="middle" fill="var(--text)" font-size="19.490834" font-family="Arial, sans-serif">• Checks user permissions (roles/scopes)</text>
  <text x="640" y="370.490689" text-anchor="middle" fill="var(--text)" font-size="19.490834" font-family="Arial, sans-serif">• Refreshes token if nearing expiry</text>
  <rect x="40" y="444.905668" width="364.285714" height="175.094332" rx="7.476107" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.142857" y="486.490553" text-anchor="middle" font-size="19.490834" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">OAuth2 / OIDC</text>
  <text x="222.142857" y="521.509447" text-anchor="middle" font-size="16.242341" fill="var(--text)" font-family="Arial, sans-serif">Delegated authorization</text>
  <text x="222.142857" y="552.150877" text-anchor="middle" font-size="16.242341" fill="var(--text)" font-family="Arial, sans-serif">Third-party identity</text>
  <text x="222.142857" y="582.792443" text-anchor="middle" font-size="16.242341" fill="var(--text)" font-family="Arial, sans-serif">providers</text>
  <rect x="457.857143" y="444.905668" width="364.285714" height="175.094332" rx="7.476107" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="486.490553" text-anchor="middle" font-size="19.490834" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">RBAC</text>
  <text x="640" y="521.509447" text-anchor="middle" font-size="16.242341" fill="var(--text)" font-family="Arial, sans-serif">Role-based access control</text>
  <text x="640" y="552.150877" text-anchor="middle" font-size="16.242341" fill="var(--text)" font-family="Arial, sans-serif">Fine-grained permissions</text>
  <text x="640" y="582.792443" text-anchor="middle" font-size="16.242341" fill="var(--text)" font-family="Arial, sans-serif">per resource</text>
  <rect x="875.714171" y="444.905668" width="364.285714" height="175.094332" rx="7.476107" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.857143" y="486.490553" text-anchor="middle" font-size="19.490834" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Refresh Strategy</text>
  <text x="1057.857143" y="521.509447" text-anchor="middle" font-size="16.242341" fill="var(--text)" font-family="Arial, sans-serif">Silent token renewal</text>
  <text x="1057.857143" y="552.150877" text-anchor="middle" font-size="16.242341" fill="var(--text)" font-family="Arial, sans-serif">Rotation on use</text>
  <text x="1057.857143" y="582.792443" text-anchor="middle" font-size="16.242341" fill="var(--text)" font-family="Arial, sans-serif">Revocation support</text>
</svg>
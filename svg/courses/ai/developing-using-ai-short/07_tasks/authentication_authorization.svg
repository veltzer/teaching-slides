    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:rect x="71.1111" y="71.1111" width="284.4444" height="97.7778" rx="8.8889" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="213.3333" y="128.8889" text-anchor="middle" fill="var(--bg)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Login</ns0:text>
  <ns0:text x="213.3333" y="152.8889" text-anchor="middle" fill="var(--primary-lt)" font-size="14.2222" font-family="Arial, sans-serif">User credentials</ns0:text>
  <ns0:line x1="355.5556" y1="120" x2="417.7778" y2="120" stroke="var(--primary-dk)" stroke-width="2.6667" marker-end="url(#arrow-primary)" />
  <ns0:rect x="426.6667" y="71.1111" width="284.4444" height="97.7778" rx="8.8889" fill="var(--ok)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="128.8889" text-anchor="middle" fill="var(--bg)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">JWT Token</ns0:text>
  <ns0:text x="568.8889" y="152.8889" text-anchor="middle" fill="var(--ok-lt)" font-size="14.2222" font-family="Arial, sans-serif">Signed &amp; expiring</ns0:text>
  <ns0:line x1="711.1111" y1="120" x2="773.3333" y2="120" stroke="var(--primary-dk)" stroke-width="2.6667" marker-end="url(#arrow-primary)" />
  <ns0:rect x="782.2222" y="71.1111" width="284.4444" height="97.7778" rx="8.8889" fill="var(--danger)" filter="url(#shadow)" />
  <ns0:text x="924.4444" y="128.8889" text-anchor="middle" fill="var(--bg)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Access</ns0:text>
  <ns0:text x="924.4444" y="152.8889" text-anchor="middle" fill="var(--danger-lt)" font-size="14.2222" font-family="Arial, sans-serif">Protected resource</ns0:text>
  <ns0:rect x="71.1111" y="213.3333" width="995.5556" height="151.1111" rx="10.6667" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="247.1111" text-anchor="middle" fill="var(--primary-dk)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Middleware Validates Every Request</ns0:text>
  <ns0:text x="568.8889" y="282.6667" text-anchor="middle" fill="var(--text-dark)" font-size="16" font-family="Arial, sans-serif">• Validates token signature and expiry</ns0:text>
  <ns0:text x="568.8889" y="311.1111" text-anchor="middle" fill="var(--text-dark)" font-size="16" font-family="Arial, sans-serif">• Checks user permissions (roles/scopes)</ns0:text>
  <ns0:text x="568.8889" y="339.5556" text-anchor="middle" fill="var(--text-dark)" font-size="16" font-family="Arial, sans-serif">• Refreshes token if nearing expiry</ns0:text>
  <ns0:rect x="71.1111" y="400" width="302.2222" height="142.2222" rx="8.8889" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="222.2222" y="433.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-dk)" font-family="Arial, sans-serif">OAuth2 / OIDC</ns0:text>
  <ns0:text x="222.2222" y="462.2222" text-anchor="middle" font-size="13.3333" fill="var(--text-dark)" font-family="Arial, sans-serif">Delegated authorization</ns0:text>
  <ns0:text x="222.2222" y="487.1111" text-anchor="middle" font-size="13.3333" fill="var(--text-dark)" font-family="Arial, sans-serif">Third-party identity</ns0:text>
  <ns0:text x="222.2222" y="512" text-anchor="middle" font-size="13.3333" fill="var(--text-dark)" font-family="Arial, sans-serif">providers</ns0:text>
  <ns0:rect x="417.7778" y="400" width="302.2222" height="142.2222" rx="8.8889" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="433.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-dk)" font-family="Arial, sans-serif">RBAC</ns0:text>
  <ns0:text x="568.8889" y="462.2222" text-anchor="middle" font-size="13.3333" fill="var(--text-dark)" font-family="Arial, sans-serif">Role-based access control</ns0:text>
  <ns0:text x="568.8889" y="487.1111" text-anchor="middle" font-size="13.3333" fill="var(--text-dark)" font-family="Arial, sans-serif">Fine-grained permissions</ns0:text>
  <ns0:text x="568.8889" y="512" text-anchor="middle" font-size="13.3333" fill="var(--text-dark)" font-family="Arial, sans-serif">per resource</ns0:text>
  <ns0:rect x="764.4444" y="400" width="302.2222" height="142.2222" rx="8.8889" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="915.5556" y="433.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--warn-dk)" font-family="Arial, sans-serif">Refresh Strategy</ns0:text>
  <ns0:text x="915.5556" y="462.2222" text-anchor="middle" font-size="13.3333" fill="var(--text-dark)" font-family="Arial, sans-serif">Silent token renewal</ns0:text>
  <ns0:text x="915.5556" y="487.1111" text-anchor="middle" font-size="13.3333" fill="var(--text-dark)" font-family="Arial, sans-serif">Rotation on use</ns0:text>
  <ns0:text x="915.5556" y="512" text-anchor="middle" font-size="13.3333" fill="var(--text-dark)" font-family="Arial, sans-serif">Revocation support</ns0:text>
</ns0:svg>
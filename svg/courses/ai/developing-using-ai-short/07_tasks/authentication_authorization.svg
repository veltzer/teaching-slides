  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="71.1111" y="71.1111" width="284.4444" height="97.7778" rx="8.8889" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="213.3333" y="128.8889" text-anchor="middle" fill="white" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Login</ns0:text>
  <ns0:text x="213.3333" y="152.8889" text-anchor="middle" fill="#bbdefb" font-size="14.2222" font-family="Arial, sans-serif">User credentials</ns0:text>
  <ns0:line x1="355.5556" y1="120" x2="417.7778" y2="120" stroke="#1565c0" stroke-width="2.6667" marker-end="url(#arrow-accent)" />
  <ns0:rect x="426.6667" y="71.1111" width="284.4444" height="97.7778" rx="8.8889" fill="#43a047" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="128.8889" text-anchor="middle" fill="white" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">JWT Token</ns0:text>
  <ns0:text x="568.8889" y="152.8889" text-anchor="middle" fill="#c8e6c9" font-size="14.2222" font-family="Arial, sans-serif">Signed &amp; expiring</ns0:text>
  <ns0:line x1="711.1111" y1="120" x2="773.3333" y2="120" stroke="#1565c0" stroke-width="2.6667" marker-end="url(#arrow-accent)" />
  <ns0:rect x="782.2222" y="71.1111" width="284.4444" height="97.7778" rx="8.8889" fill="#e53935" filter="url(#shadow)" />
  <ns0:text x="924.4444" y="128.8889" text-anchor="middle" fill="white" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Access</ns0:text>
  <ns0:text x="924.4444" y="152.8889" text-anchor="middle" fill="#ffcdd2" font-size="14.2222" font-family="Arial, sans-serif">Protected resource</ns0:text>
  <ns0:rect x="71.1111" y="213.3333" width="995.5556" height="151.1111" rx="10.6667" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="247.1111" text-anchor="middle" fill="#1565c0" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Middleware Validates Every Request</ns0:text>
  <ns0:text x="568.8889" y="282.6667" text-anchor="middle" fill="#444" font-size="16" font-family="Arial, sans-serif">• Validates token signature and expiry</ns0:text>
  <ns0:text x="568.8889" y="311.1111" text-anchor="middle" fill="#444" font-size="16" font-family="Arial, sans-serif">• Checks user permissions (roles/scopes)</ns0:text>
  <ns0:text x="568.8889" y="339.5556" text-anchor="middle" fill="#444" font-size="16" font-family="Arial, sans-serif">• Refreshes token if nearing expiry</ns0:text>

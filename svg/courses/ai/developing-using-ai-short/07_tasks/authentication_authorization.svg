  <ns0:text x="222.2222" y="433.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0" font-family="Arial, sans-serif">OAuth2 / OIDC</ns0:text>
  <ns0:text x="222.2222" y="462.2222" text-anchor="middle" font-size="13.3333" fill="#444" font-family="Arial, sans-serif">Delegated authorization</ns0:text>
  <ns0:text x="222.2222" y="487.1111" text-anchor="middle" font-size="13.3333" fill="#444" font-family="Arial, sans-serif">Third-party identity</ns0:text>
  <ns0:text x="222.2222" y="512" text-anchor="middle" font-size="13.3333" fill="#444" font-family="Arial, sans-serif">providers</ns0:text>
  <ns0:rect x="417.7778" y="400" width="302.2222" height="142.2222" rx="8.8889" fill="#e8f5e9" stroke="#43a047" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="433.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32" font-family="Arial, sans-serif">RBAC</ns0:text>
  <ns0:text x="568.8889" y="462.2222" text-anchor="middle" font-size="13.3333" fill="#444" font-family="Arial, sans-serif">Role-based access control</ns0:text>
  <ns0:text x="568.8889" y="487.1111" text-anchor="middle" font-size="13.3333" fill="#444" font-family="Arial, sans-serif">Fine-grained permissions</ns0:text>
  <ns0:text x="568.8889" y="512" text-anchor="middle" font-size="13.3333" fill="#444" font-family="Arial, sans-serif">per resource</ns0:text>
  <ns0:rect x="764.4444" y="400" width="302.2222" height="142.2222" rx="8.8889" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="915.5556" y="433.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100" font-family="Arial, sans-serif">Refresh Strategy</ns0:text>
  <ns0:text x="915.5556" y="462.2222" text-anchor="middle" font-size="13.3333" fill="#444" font-family="Arial, sans-serif">Silent token renewal</ns0:text>
  <ns0:text x="915.5556" y="487.1111" text-anchor="middle" font-size="13.3333" fill="#444" font-family="Arial, sans-serif">Rotation on use</ns0:text>
  <ns0:text x="915.5556" y="512" text-anchor="middle" font-size="13.3333" fill="#444" font-family="Arial, sans-serif">Revocation support</ns0:text>
</ns0:svg>
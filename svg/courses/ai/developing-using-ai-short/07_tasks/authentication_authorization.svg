<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="71.1111" y="71.1111" width="284.4444" height="97.7778" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="213.3333" y="128.8889" text-anchor="middle" fill="var(--bg)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Login</text>
  <text x="213.3333" y="152.8889" text-anchor="middle" fill="var(--primary-accent)" font-size="14.2222" font-family="Arial, sans-serif">User credentials</text>
  <line x1="355.5556" y1="120" x2="417.7778" y2="120" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="426.6667" y="71.1111" width="284.4444" height="97.7778" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="568.8889" y="128.8889" text-anchor="middle" fill="var(--bg)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">JWT Token</text>
  <text x="568.8889" y="152.8889" text-anchor="middle" fill="var(--ok-accent)" font-size="14.2222" font-family="Arial, sans-serif">Signed &amp; expiring</text>
  <line x1="711.1111" y1="120" x2="773.3333" y2="120" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="782.2222" y="71.1111" width="284.4444" height="97.7778" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="924.4444" y="128.8889" text-anchor="middle" fill="var(--bg)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Access</text>
  <text x="924.4444" y="152.8889" text-anchor="middle" fill="var(--danger-accent)" font-size="14.2222" font-family="Arial, sans-serif">Protected resource</text>
  <rect x="71.1111" y="213.3333" width="995.5556" height="151.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="247.1111" text-anchor="middle" fill="var(--primary-accent)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Middleware Validates Every Request</text>
  <text x="568.8889" y="282.6667" text-anchor="middle" fill="var(--text)" font-size="16" font-family="Arial, sans-serif">• Validates token signature and expiry</text>
  <text x="568.8889" y="311.1111" text-anchor="middle" fill="var(--text)" font-size="16" font-family="Arial, sans-serif">• Checks user permissions (roles/scopes)</text>
  <text x="568.8889" y="339.5556" text-anchor="middle" fill="var(--text)" font-size="16" font-family="Arial, sans-serif">• Refreshes token if nearing expiry</text>
  <rect x="71.1111" y="400" width="302.2222" height="142.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="222.2222" y="433.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">OAuth2 / OIDC</text>
  <text x="222.2222" y="462.2222" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="Arial, sans-serif">Delegated authorization</text>
  <text x="222.2222" y="487.1111" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="Arial, sans-serif">Third-party identity</text>
  <text x="222.2222" y="512" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="Arial, sans-serif">providers</text>
  <rect x="417.7778" y="400" width="302.2222" height="142.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="433.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">RBAC</text>
  <text x="568.8889" y="462.2222" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="Arial, sans-serif">Role-based access control</text>
  <text x="568.8889" y="487.1111" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="Arial, sans-serif">Fine-grained permissions</text>
  <text x="568.8889" y="512" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="Arial, sans-serif">per resource</text>
  <rect x="764.4444" y="400" width="302.2222" height="142.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="915.5556" y="433.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Refresh Strategy</text>
  <text x="915.5556" y="462.2222" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="Arial, sans-serif">Silent token renewal</text>
  <text x="915.5556" y="487.1111" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="Arial, sans-serif">Rotation on use</text>
  <text x="915.5556" y="512" text-anchor="middle" font-size="13.3333" fill="var(--text)" font-family="Arial, sans-serif">Revocation support</text>
</svg>
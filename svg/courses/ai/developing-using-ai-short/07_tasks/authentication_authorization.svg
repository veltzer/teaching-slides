<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="160" y="90" width="960" height="540" fill="#2C3E50" rx="16" />
  <text x="640" y="144" text-anchor="middle" fill="white" font-size="28.8" font-weight="bold">Auth Flow</text>
  <rect x="240" y="198" width="192" height="108" fill="#3498DB" rx="8" />
  <text x="336" y="261" text-anchor="middle" fill="white" font-size="19.2">Login</text>
  <rect x="544" y="198" width="192" height="108" fill="#2ECC71" rx="8" />
  <text x="640" y="261" text-anchor="middle" fill="white" font-size="19.2">JWT Token</text>
  <rect x="848" y="198" width="192" height="108" fill="#E74C3C" rx="8" />
  <text x="944" y="261" text-anchor="middle" fill="white" font-size="19.2">Access</text>
  <path d="M 432 252 L 544 252" stroke="white" stroke-width="3.2" marker-end="url(#auth1)" />
  <path d="M 736 252 L 848 252" stroke="white" stroke-width="3.2" marker-end="url(#auth2)" />
  <rect x="400" y="360" width="480" height="180" fill="#34495E" rx="8" />
  <text x="640" y="414" text-anchor="middle" fill="white" font-size="19.2">Middleware validates token</text>
  <text x="640" y="450" text-anchor="middle" fill="white" font-size="19.2">Checks permissions</text>
  <text x="640" y="486" text-anchor="middle" fill="white" font-size="19.2">Refreshes if needed</text>
  <defs>
    <marker id="auth1" markerWidth="16" markerHeight="18" refX="8" refY="9" orient="auto">
      <polygon points="0,18 8,0" fill="white" />
    </marker>
    <marker id="auth2" markerWidth="16" markerHeight="18" refX="8" refY="9" orient="auto">
      <polygon points="0,18 8,0" fill="white" />
    </marker>
  </defs>
</svg>
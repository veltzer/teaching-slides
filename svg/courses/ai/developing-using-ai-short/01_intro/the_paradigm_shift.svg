<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="514.285714" height="189.615273" rx="7.54765" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="40" y="40" width="514.285714" height="46.846095" rx="7.54765" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="71.230822" width="514.285714" height="15.615273" fill="url(#grad-danger)" rx="7.54765" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.142743" y="75.692191" text-anchor="middle" fill="var(--bg)" font-size="26.236386" font-weight="bold" font-family="Arial, sans-serif">Traditional Coding</text>
  <text x="61.428571" y="134.807775" font-size="21.86378" fill="var(--text)" font-family="Arial, sans-serif">• Manual everything</text>
  <text x="61.428571" y="168.269212" font-size="21.86378" fill="var(--text)" font-family="Arial, sans-serif">• Slow iteration</text>
  <text x="61.428571" y="201.730788" font-size="21.86378" fill="var(--text)" font-family="Arial, sans-serif">• High cognitive load</text>
  <line x1="570.357143" y1="140.384589" x2="704.285714" y2="140.384589" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="720.357143" y="40" width="519.642857" height="189.615273" rx="7.54765" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="720.357143" y="40" width="519.642857" height="46.846095" rx="7.54765" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="720.357143" y="71.230822" width="519.642857" height="15.615273" fill="url(#grad-primary)" rx="7.54765" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="979.642857" y="75.692191" text-anchor="middle" fill="var(--bg)" font-size="26.236386" font-weight="bold" font-family="Arial, sans-serif">AI-Assisted Coding</text>
  <text x="741.785714" y="134.807775" font-size="21.86378" fill="var(--text)" font-family="Arial, sans-serif">• AI suggestions</text>
  <text x="741.785714" y="168.269212" font-size="21.86378" fill="var(--text)" font-family="Arial, sans-serif">• Rapid prototyping</text>
  <text x="741.785714" y="201.730788" font-size="21.86378" fill="var(--text)" font-family="Arial, sans-serif">• Focus on logic</text>
  <rect x="40" y="285.384658" width="1200" height="334.615342" rx="7.54765" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="335.576952" text-anchor="middle" font-size="24.050083" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">The Paradigm Shift in Software Development</text>
  <rect x="72.142857" y="357.884485" width="342.857029" height="223.076849" rx="7.54765" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="243.571429" y="396.922875" text-anchor="middle" font-size="19.677352" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Speed</text>
  <text x="243.571429" y="430.38445" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Code generation in seconds</text>
  <text x="243.571429" y="458.269074" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Boilerplate automated</text>
  <text x="243.571429" y="486.153836" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Faster prototyping</text>
  <rect x="457.857143" y="357.884485" width="342.857029" height="223.076849" rx="7.54765" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.285714" y="396.922875" text-anchor="middle" font-size="19.677352" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Quality</text>
  <text x="629.285714" y="430.38445" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Fewer syntax errors</text>
  <text x="629.285714" y="458.269074" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Best-practice patterns</text>
  <text x="629.285714" y="486.153836" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Consistent code style</text>
  <rect x="843.571429" y="357.884485" width="342.857029" height="223.076849" rx="7.54765" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1015" y="396.922875" text-anchor="middle" font-size="19.677352" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Focus</text>
  <text x="1015" y="430.38445" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Solve complex problems</text>
  <text x="1015" y="458.269074" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Design &amp; architecture</text>
  <text x="1015" y="486.153836" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Business logic</text>
</svg>

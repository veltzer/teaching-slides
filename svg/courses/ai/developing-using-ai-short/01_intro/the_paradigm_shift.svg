<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="514.285714" height="189.615273" rx="7.54765" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="40" width="514.285714" height="46.846095" rx="7.54765" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="71.230822" width="514.285714" height="15.615273" fill="var(--danger-fill)" rx="7.54765" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.142743" y="75.692191" text-anchor="middle" fill="var(--bg)" font-size="26.236386" font-weight="bold" font-family="Arial, sans-serif">Traditional Coding</text>
  <text x="61.428571" y="134.807775" font-size="21.86378" fill="var(--text)" font-family="Arial, sans-serif">• Manual everything</text>
  <text x="61.428571" y="168.269212" font-size="21.86378" fill="var(--text)" font-family="Arial, sans-serif">• Slow iteration</text>
  <text x="61.428571" y="201.730788" font-size="21.86378" fill="var(--text)" font-family="Arial, sans-serif">• High cognitive load</text>
  <line x1="570.357143" y1="140.384589" x2="704.285714" y2="140.384589" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="720.357143" y="40" width="519.642857" height="189.615273" rx="7.54765" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="720.357143" y="40" width="519.642857" height="46.846095" rx="7.54765" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="720.357143" y="71.230822" width="519.642857" height="15.615273" fill="var(--primary-fill)" rx="7.54765" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="979.642857" y="75.692191" text-anchor="middle" fill="var(--bg)" font-size="26.236386" font-weight="bold" font-family="Arial, sans-serif">AI-Assisted Coding</text>
  <text x="741.785714" y="134.807775" font-size="21.86378" fill="var(--text)" font-family="Arial, sans-serif">• AI suggestions</text>
  <text x="741.785714" y="168.269212" font-size="21.86378" fill="var(--text)" font-family="Arial, sans-serif">• Rapid prototyping</text>
  <text x="741.785714" y="201.730788" font-size="21.86378" fill="var(--text)" font-family="Arial, sans-serif">• Focus on logic</text>
  <rect x="40" y="285.384658" width="1200" height="334.615342" rx="7.54765" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="335.576952" text-anchor="middle" font-size="24.050083" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">The Paradigm Shift in Software Development</text>
  <rect x="72.142857" y="357.884485" width="342.857029" height="223.076849" rx="7.54765" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="243.571429" y="396.922875" text-anchor="middle" font-size="19.677352" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Speed</text>
  <text x="243.571429" y="430.38445" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Code generation in seconds</text>
  <text x="243.571429" y="458.269074" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Boilerplate automated</text>
  <text x="243.571429" y="486.153836" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Faster prototyping</text>
  <rect x="457.857143" y="357.884485" width="342.857029" height="223.076849" rx="7.54765" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.285714" y="396.922875" text-anchor="middle" font-size="19.677352" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Quality</text>
  <text x="629.285714" y="430.38445" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Fewer syntax errors</text>
  <text x="629.285714" y="458.269074" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Best-practice patterns</text>
  <text x="629.285714" y="486.153836" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Consistent code style</text>
  <rect x="843.571429" y="357.884485" width="342.857029" height="223.076849" rx="7.54765" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1015" y="396.922875" text-anchor="middle" font-size="19.677352" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Focus</text>
  <text x="1015" y="430.38445" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Solve complex problems</text>
  <text x="1015" y="458.269074" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Design &amp; architecture</text>
  <text x="1015" y="486.153836" text-anchor="middle" font-size="17.490924" fill="var(--text)" font-family="Arial, sans-serif">Business logic</text>
</svg>
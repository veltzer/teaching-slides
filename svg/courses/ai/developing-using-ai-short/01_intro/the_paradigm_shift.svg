<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="112.5" width="450" height="136.9444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="115" y="112.5" width="450" height="33.8333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="115" y="135.0556" width="450" height="11.2777" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="339.9999" y="138.2777" text-anchor="middle" fill="var(--bg)" font-size="20.8566" font-weight="bold" font-family="Arial, sans-serif">Traditional Coding</text>
  <text x="133.75" y="180.9723" font-size="17.3806" fill="var(--text)" font-family="Arial, sans-serif">• Manual everything</text>
  <text x="133.75" y="205.1389" font-size="17.3806" fill="var(--text)" font-family="Arial, sans-serif">• Slow iteration</text>
  <text x="133.75" y="229.3056" font-size="17.3806" fill="var(--text)" font-family="Arial, sans-serif">• High cognitive load</text>
  <line x1="579.0625" y1="185" x2="696.25" y2="185" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="710.3125" y="112.5" width="454.6875" height="136.9444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="710.3125" y="112.5" width="454.6875" height="33.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="710.3125" y="135.0556" width="454.6875" height="11.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="937.1875" y="138.2777" text-anchor="middle" fill="var(--bg)" font-size="20.8566" font-weight="bold" font-family="Arial, sans-serif">AI-Assisted Coding</text>
  <text x="729.0625" y="180.9723" font-size="17.3806" fill="var(--text)" font-family="Arial, sans-serif">• AI suggestions</text>
  <text x="729.0625" y="205.1389" font-size="17.3806" fill="var(--text)" font-family="Arial, sans-serif">• Rapid prototyping</text>
  <text x="729.0625" y="229.3056" font-size="17.3806" fill="var(--text)" font-family="Arial, sans-serif">• Focus on logic</text>
  <rect x="115" y="289.7223" width="1050" height="241.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="325.9723" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">The Paradigm Shift in Software Development</text>
  <rect x="143.125" y="342.0833" width="299.9999" height="161.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="293.125" y="370.2777" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Speed</text>
  <text x="293.125" y="394.4444" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="Arial, sans-serif">Code generation in seconds</text>
  <text x="293.125" y="414.5833" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="Arial, sans-serif">Boilerplate automated</text>
  <text x="293.125" y="434.7223" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="Arial, sans-serif">Faster prototyping</text>
  <rect x="480.625" y="342.0833" width="299.9999" height="161.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="630.625" y="370.2777" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Quality</text>
  <text x="630.625" y="394.4444" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="Arial, sans-serif">Fewer syntax errors</text>
  <text x="630.625" y="414.5833" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="Arial, sans-serif">Best-practice patterns</text>
  <text x="630.625" y="434.7223" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="Arial, sans-serif">Consistent code style</text>
  <rect x="818.125" y="342.0833" width="299.9999" height="161.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="968.125" y="370.2777" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Focus</text>
  <text x="968.125" y="394.4444" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="Arial, sans-serif">Solve complex problems</text>
  <text x="968.125" y="414.5833" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="Arial, sans-serif">Design &amp; architecture</text>
  <text x="968.125" y="434.7223" text-anchor="middle" font-size="13.9044" fill="var(--text)" font-family="Arial, sans-serif">Business logic</text>
</svg>
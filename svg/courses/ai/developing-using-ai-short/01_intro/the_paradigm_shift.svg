<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="71.1111" y="80" width="426.6667" height="151.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="71.1111" y="80" width="426.6667" height="37.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="71.1111" y="104.8889" width="426.6667" height="12.4444" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="284.4444" y="108.4444" text-anchor="middle" fill="var(--bg)" font-size="21.3333" font-weight="bold" font-family="Arial, sans-serif">Traditional Coding</text>
  <text x="88.8889" y="155.5556" font-size="17.7778" fill="var(--text)" font-family="Arial, sans-serif">• Manual everything</text>
  <text x="88.8889" y="182.2222" font-size="17.7778" fill="var(--text)" font-family="Arial, sans-serif">• Slow iteration</text>
  <text x="88.8889" y="208.8889" font-size="17.7778" fill="var(--text)" font-family="Arial, sans-serif">• High cognitive load</text>
  <line x1="511.1111" y1="160" x2="622.2222" y2="160" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="635.5556" y="80" width="431.1111" height="151.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="635.5556" y="80" width="431.1111" height="37.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="635.5556" y="104.8889" width="431.1111" height="12.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="850.6667" y="108.4444" text-anchor="middle" fill="var(--bg)" font-size="21.3333" font-weight="bold" font-family="Arial, sans-serif">AI-Assisted Coding</text>
  <text x="653.3333" y="155.5556" font-size="17.7778" fill="var(--text)" font-family="Arial, sans-serif">• AI suggestions</text>
  <text x="653.3333" y="182.2222" font-size="17.7778" fill="var(--text)" font-family="Arial, sans-serif">• Rapid prototyping</text>
  <text x="653.3333" y="208.8889" font-size="17.7778" fill="var(--text)" font-family="Arial, sans-serif">• Focus on logic</text>
  <rect x="71.1111" y="275.5556" width="995.5556" height="266.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="315.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">The Paradigm Shift in Software Development</text>
  <rect x="97.7778" y="333.3333" width="284.4444" height="177.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="240" y="364.4444" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Speed</text>
  <text x="240" y="391.1111" text-anchor="middle" font-size="14.2222" fill="var(--text)" font-family="Arial, sans-serif">Code generation in seconds</text>
  <text x="240" y="413.3333" text-anchor="middle" font-size="14.2222" fill="var(--text)" font-family="Arial, sans-serif">Boilerplate automated</text>
  <text x="240" y="435.5556" text-anchor="middle" font-size="14.2222" fill="var(--text)" font-family="Arial, sans-serif">Faster prototyping</text>
  <rect x="417.7778" y="333.3333" width="284.4444" height="177.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="560" y="364.4444" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Quality</text>
  <text x="560" y="391.1111" text-anchor="middle" font-size="14.2222" fill="var(--text)" font-family="Arial, sans-serif">Fewer syntax errors</text>
  <text x="560" y="413.3333" text-anchor="middle" font-size="14.2222" fill="var(--text)" font-family="Arial, sans-serif">Best-practice patterns</text>
  <text x="560" y="435.5556" text-anchor="middle" font-size="14.2222" fill="var(--text)" font-family="Arial, sans-serif">Consistent code style</text>
  <rect x="737.7778" y="333.3333" width="284.4444" height="177.7778" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="880" y="364.4444" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Focus</text>
  <text x="880" y="391.1111" text-anchor="middle" font-size="14.2222" fill="var(--text)" font-family="Arial, sans-serif">Solve complex problems</text>
  <text x="880" y="413.3333" text-anchor="middle" font-size="14.2222" fill="var(--text)" font-family="Arial, sans-serif">Design &amp; architecture</text>
  <text x="880" y="435.5556" text-anchor="middle" font-size="14.2222" fill="var(--text)" font-family="Arial, sans-serif">Business logic</text>
</svg>
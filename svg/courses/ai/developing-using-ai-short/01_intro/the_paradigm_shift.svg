    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" />
  <rect x="71.1111" y="80" width="426.6667" height="151.1111" rx="12.4444" fill="url(#grad-surface)" stroke="var(--danger)" stroke-width="1.7778" filter="url(#shadow)" />
  <rect x="71.1111" y="80" width="426.6667" height="37.3333" rx="12.4444" fill="var(--danger)" />
  <rect x="71.1111" y="104.8889" width="426.6667" height="12.4444" fill="var(--danger)" />
  <text x="284.4444" y="108.4444" text-anchor="middle" fill="var(--bg)" font-size="21.3333" font-weight="bold" font-family="Arial, sans-serif">Traditional Coding</text>
  <text x="88.8889" y="155.5556" font-size="17.7778" fill="var(--text-dark)" font-family="Arial, sans-serif">• Manual everything</text>
  <text x="88.8889" y="182.2222" font-size="17.7778" fill="var(--text-dark)" font-family="Arial, sans-serif">• Slow iteration</text>
  <text x="88.8889" y="208.8889" font-size="17.7778" fill="var(--text-dark)" font-family="Arial, sans-serif">• High cognitive load</text>
  <line x1="511.1111" y1="160" x2="622.2222" y2="160" stroke="var(--primary-dk)" stroke-width="2.6667" marker-end="url(#arrow-primary)" />
  <rect x="635.5556" y="80" width="431.1111" height="151.1111" rx="12.4444" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="1.7778" filter="url(#shadow)" />
  <rect x="635.5556" y="80" width="431.1111" height="37.3333" rx="12.4444" fill="url(#grad-primary)" />
  <rect x="635.5556" y="104.8889" width="431.1111" height="12.4444" fill="url(#grad-primary)" />
  <text x="850.6667" y="108.4444" text-anchor="middle" fill="var(--bg)" font-size="21.3333" font-weight="bold" font-family="Arial, sans-serif">AI-Assisted Coding</text>
  <text x="653.3333" y="155.5556" font-size="17.7778" fill="var(--text-dark)" font-family="Arial, sans-serif">• AI suggestions</text>
  <text x="653.3333" y="182.2222" font-size="17.7778" fill="var(--text-dark)" font-family="Arial, sans-serif">• Rapid prototyping</text>
  <text x="653.3333" y="208.8889" font-size="17.7778" fill="var(--text-dark)" font-family="Arial, sans-serif">• Focus on logic</text>
  <rect x="71.1111" y="275.5556" width="995.5556" height="266.6667" rx="10.6667" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="568.8889" y="315.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-dk)" font-family="Arial, sans-serif">The Paradigm Shift in Software Development</text>
  <rect x="97.7778" y="333.3333" width="284.4444" height="177.7778" rx="8.8889" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.3333" />
  <text x="240" y="364.4444" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-dk)" font-family="Arial, sans-serif">Speed</text>
  <text x="240" y="391.1111" text-anchor="middle" font-size="14.2222" fill="var(--text-dark)" font-family="Arial, sans-serif">Code generation in seconds</text>
  <text x="240" y="413.3333" text-anchor="middle" font-size="14.2222" fill="var(--text-dark)" font-family="Arial, sans-serif">Boilerplate automated</text>
  <text x="240" y="435.5556" text-anchor="middle" font-size="14.2222" fill="var(--text-dark)" font-family="Arial, sans-serif">Faster prototyping</text>
  <rect x="417.7778" y="333.3333" width="284.4444" height="177.7778" rx="8.8889" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.3333" />
  <text x="560" y="364.4444" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-dk)" font-family="Arial, sans-serif">Quality</text>
  <text x="560" y="391.1111" text-anchor="middle" font-size="14.2222" fill="var(--text-dark)" font-family="Arial, sans-serif">Fewer syntax errors</text>
  <text x="560" y="413.3333" text-anchor="middle" font-size="14.2222" fill="var(--text-dark)" font-family="Arial, sans-serif">Best-practice patterns</text>
  <text x="560" y="435.5556" text-anchor="middle" font-size="14.2222" fill="var(--text-dark)" font-family="Arial, sans-serif">Consistent code style</text>
  <rect x="737.7778" y="333.3333" width="284.4444" height="177.7778" rx="8.8889" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.3333" />
  <text x="880" y="364.4444" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--warn-dk)" font-family="Arial, sans-serif">Focus</text>
  <text x="880" y="391.1111" text-anchor="middle" font-size="14.2222" fill="var(--text-dark)" font-family="Arial, sans-serif">Solve complex problems</text>
  <text x="880" y="413.3333" text-anchor="middle" font-size="14.2222" fill="var(--text-dark)" font-family="Arial, sans-serif">Design &amp; architecture</text>
  <text x="880" y="435.5556" text-anchor="middle" font-size="14.2222" fill="var(--text-dark)" font-family="Arial, sans-serif">Business logic</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <circle cx="160.320981" cy="159.66751" r="119.667509" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="160.320981" y="145.503385" text-anchor="middle" fill="var(--primary-accent)" font-size="23.933502" font-weight="bold" font-family="Arial, sans-serif">PR</text>
  <text x="160.320981" y="180.913623" text-anchor="middle" fill="var(--text)" font-size="17.406137" font-family="Arial, sans-serif">Created</text>
  <line x1="270.615213" y1="159.66751" x2="390.936189" y2="159.66751" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <circle cx="501.230421" cy="159.66751" r="119.667509" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="501.230421" y="145.503385" text-anchor="middle" fill="var(--warn-accent)" font-size="23.933502" font-weight="bold" font-family="Arial, sans-serif">AI</text>
  <text x="501.230421" y="180.913623" text-anchor="middle" fill="var(--text)" font-size="17.406137" font-family="Arial, sans-serif">Review</text>
  <line x1="611.524653" y1="159.66751" x2="731.845527" y2="159.66751" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <circle cx="842.139864" cy="159.66751" r="119.667509" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="842.139864" y="145.503385" text-anchor="middle" fill="var(--danger-accent)" font-size="23.933502" font-weight="bold" font-family="Arial, sans-serif">Human</text>
  <text x="842.139864" y="180.913623" text-anchor="middle" fill="var(--text)" font-size="17.406137" font-family="Arial, sans-serif">Review</text>
  <line x1="952.434095" y1="159.66751" x2="1072.755075" y2="159.66751" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <circle cx="1152.969063" cy="159.66751" r="87.030937" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="1152.969063" y="145.503385" text-anchor="middle" fill="var(--ok-accent)" font-size="23.933502" font-weight="bold" font-family="Arial, sans-serif">Merge</text>
  <text x="1152.969063" y="180.913623" text-anchor="middle" fill="var(--text)" font-size="15.230308" font-family="Arial, sans-serif">Approved</text>
  <text x="160.320981" y="324.914939" text-anchor="middle" fill="var(--text-muted)" font-size="15.230308" font-family="Arial, sans-serif">Push code</text>
  <text x="501.230421" y="324.914939" text-anchor="middle" fill="var(--text-muted)" font-size="15.230308" font-family="Arial, sans-serif">Automated checks</text>
  <text x="842.139864" y="324.914939" text-anchor="middle" fill="var(--text-muted)" font-size="15.230308" font-family="Arial, sans-serif">Peer validation</text>
  <text x="1152.969063" y="289.504848" text-anchor="middle" fill="var(--text-muted)" font-size="15.230308" font-family="Arial, sans-serif">Deploy</text>
  <rect x="40" y="372.128637" width="1122.995811" height="247.871363" rx="7.511064" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="601.497905" y="416.981525" text-anchor="middle" fill="var(--primary-accent)" font-size="21.757797" font-weight="bold" font-family="Arial, sans-serif">AI Pre-Review Catches</text>
  <rect x="60.053496" y="437.047233" width="310.829198" height="153.444261" rx="7.511064" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="215.468094" y="470.096807" text-anchor="middle" fill="var(--primary-accent)" font-size="16.318286" font-weight="bold" font-family="Arial, sans-serif">Code Quality</text>
  <text x="215.468094" y="499.605313" text-anchor="middle" fill="var(--text)" font-size="14.14258" font-family="Arial, sans-serif">Style violations</text>
  <text x="215.468094" y="525.572604" text-anchor="middle" fill="var(--text)" font-size="14.14258" font-family="Arial, sans-serif">Dead code, duplicates</text>
  <text x="215.468094" y="551.54019" text-anchor="middle" fill="var(--text)" font-size="14.14258" font-family="Arial, sans-serif">Complexity metrics</text>
  <rect x="446.083307" y="437.047233" width="310.829198" height="153.444261" rx="7.511064" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="601.497905" y="470.096807" text-anchor="middle" fill="var(--ok-accent)" font-size="16.318286" font-weight="bold" font-family="Arial, sans-serif">Security</text>
  <text x="601.497905" y="499.605313" text-anchor="middle" fill="var(--text)" font-size="14.14258" font-family="Arial, sans-serif">Hardcoded secrets</text>
  <text x="601.497905" y="525.572604" text-anchor="middle" fill="var(--text)" font-size="14.14258" font-family="Arial, sans-serif">SQL injection risks</text>
  <text x="601.497905" y="551.54019" text-anchor="middle" fill="var(--text)" font-size="14.14258" font-family="Arial, sans-serif">Dependency vulns</text>
  <rect x="832.11301" y="437.047233" width="310.829198" height="153.444261" rx="7.511064" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="987.527715" y="470.096807" text-anchor="middle" fill="var(--warn-accent)" font-size="16.318286" font-weight="bold" font-family="Arial, sans-serif">Testing Gaps</text>
  <text x="987.527715" y="499.605313" text-anchor="middle" fill="var(--text)" font-size="14.14258" font-family="Arial, sans-serif">Missing test cases</text>
  <text x="987.527715" y="525.572604" text-anchor="middle" fill="var(--text)" font-size="14.14258" font-family="Arial, sans-serif">Edge cases</text>
  <text x="987.527715" y="551.54019" text-anchor="middle" fill="var(--text)" font-size="14.14258" font-family="Arial, sans-serif">Coverage regressions</text>
</svg>
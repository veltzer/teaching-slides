<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40.653499" y="40" width="239.334601" height="239.335" rx="13.999988" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="160.32078" y="145.503385" text-anchor="middle" fill="var(--primary-accent)" font-size="23.933482" font-weight="bold" font-family="Arial, sans-serif">PR</text>
  <text x="160.32078" y="180.913623" text-anchor="middle" fill="var(--text)" font-size="17.406122" font-family="Arial, sans-serif">Created</text>
  <line x1="270.614829" y1="159.66751" x2="390.935604" y2="159.66751" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="381.562431" y="40" width="239.334601" height="239.335" rx="13.999988" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="501.229652" y="145.503385" text-anchor="middle" fill="var(--warn-accent)" font-size="23.933482" font-weight="bold" font-family="Arial, sans-serif">AI</text>
  <text x="501.229652" y="180.913623" text-anchor="middle" fill="var(--text)" font-size="17.406122" font-family="Arial, sans-serif">Review</text>
  <line x1="611.5237" y1="159.66751" x2="731.844374" y2="159.66751" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="722.470863" y="40" width="239.334601" height="239.335" rx="13.999988" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="842.138527" y="145.503385" text-anchor="middle" fill="var(--danger-accent)" font-size="23.933482" font-weight="bold" font-family="Arial, sans-serif">Human</text>
  <text x="842.138527" y="180.913623" text-anchor="middle" fill="var(--text)" font-size="17.406122" font-family="Arial, sans-serif">Review</text>
  <line x1="952.432574" y1="159.66751" x2="1072.753354" y2="159.66751" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="1065.93829" y="72.6366" width="174.06171" height="174.062" rx="13.999988" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="1152.967208" y="145.503385" text-anchor="middle" fill="var(--ok-accent)" font-size="23.933482" font-weight="bold" font-family="Arial, sans-serif">Merge</text>
  <text x="1152.967208" y="180.913623" text-anchor="middle" fill="var(--text)" font-size="15.230295" font-family="Arial, sans-serif">Approved</text>
  <text x="160.32078" y="324.914939" text-anchor="middle" fill="var(--text-muted)" font-size="15.230295" font-family="Arial, sans-serif">Push code</text>
  <text x="501.229652" y="324.914939" text-anchor="middle" fill="var(--text-muted)" font-size="15.230295" font-family="Arial, sans-serif">Automated checks</text>
  <text x="842.138527" y="324.914939" text-anchor="middle" fill="var(--text-muted)" font-size="15.230295" font-family="Arial, sans-serif">Peer validation</text>
  <text x="1152.967208" y="289.504848" text-anchor="middle" fill="var(--text-muted)" font-size="15.230295" font-family="Arial, sans-serif">Deploy</text>
  <rect x="40" y="372.128637" width="1122.993939" height="247.871363" rx="7.511058" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="601.496969" y="416.981525" text-anchor="middle" fill="var(--primary-accent)" font-size="21.757779" font-weight="bold" font-family="Arial, sans-serif">AI Pre-Review Catches</text>
  <rect x="60.053463" y="437.047233" width="310.82868" height="153.444261" rx="7.511058" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="215.467802" y="470.096807" text-anchor="middle" fill="var(--primary-accent)" font-size="16.318272" font-weight="bold" font-family="Arial, sans-serif">Code Quality</text>
  <text x="215.467802" y="499.605313" text-anchor="middle" fill="var(--text)" font-size="14.142568" font-family="Arial, sans-serif">Style violations</text>
  <text x="215.467802" y="525.572604" text-anchor="middle" fill="var(--text)" font-size="14.142568" font-family="Arial, sans-serif">Dead code, duplicates</text>
  <text x="215.467802" y="551.54019" text-anchor="middle" fill="var(--text)" font-size="14.142568" font-family="Arial, sans-serif">Complexity metrics</text>
  <rect x="446.08263" y="437.047233" width="310.82868" height="153.444261" rx="7.511058" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="601.496969" y="470.096807" text-anchor="middle" fill="var(--ok-accent)" font-size="16.318272" font-weight="bold" font-family="Arial, sans-serif">Security</text>
  <text x="601.496969" y="499.605313" text-anchor="middle" fill="var(--text)" font-size="14.142568" font-family="Arial, sans-serif">Hardcoded secrets</text>
  <text x="601.496969" y="525.572604" text-anchor="middle" fill="var(--text)" font-size="14.142568" font-family="Arial, sans-serif">SQL injection risks</text>
  <text x="601.496969" y="551.54019" text-anchor="middle" fill="var(--text)" font-size="14.142568" font-family="Arial, sans-serif">Dependency vulns</text>
  <rect x="832.11169" y="437.047233" width="310.82868" height="153.444261" rx="7.511058" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="987.526136" y="470.096807" text-anchor="middle" fill="var(--warn-accent)" font-size="16.318272" font-weight="bold" font-family="Arial, sans-serif">Testing Gaps</text>
  <text x="987.526136" y="499.605313" text-anchor="middle" fill="var(--text)" font-size="14.142568" font-family="Arial, sans-serif">Missing test cases</text>
  <text x="987.526136" y="525.572604" text-anchor="middle" fill="var(--text)" font-size="14.142568" font-family="Arial, sans-serif">Edge cases</text>
  <text x="987.526136" y="551.54019" text-anchor="middle" fill="var(--text)" font-size="14.142568" font-family="Arial, sans-serif">Coverage regressions</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <circle cx="227.5" cy="265.5556" r="95.593" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="227.5" y="255.8889" text-anchor="middle" fill="var(--primary-accent)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">PR</text>
  <text x="227.5" y="280.0556" text-anchor="middle" fill="var(--text)" font-size="13.9044" font-family="Arial, sans-serif">Created</text>
  <line x1="330.625" y1="265.5556" x2="443.125" y2="265.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <circle cx="546.25" cy="265.5556" r="95.593" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="546.25" y="255.8889" text-anchor="middle" fill="var(--warn-accent)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">AI</text>
  <text x="546.25" y="280.0556" text-anchor="middle" fill="var(--text)" font-size="13.9044" font-family="Arial, sans-serif">Review</text>
  <line x1="649.375" y1="265.5556" x2="761.8749" y2="265.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <circle cx="865" cy="265.5556" r="95.593" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="865" y="255.8889" text-anchor="middle" fill="var(--danger-accent)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Human</text>
  <text x="865" y="280.0556" text-anchor="middle" fill="var(--text)" font-size="13.9044" font-family="Arial, sans-serif">Review</text>
  <line x1="968.125" y1="265.5556" x2="1080.625" y2="265.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <circle cx="1155.625" cy="265.5556" r="69.5222" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="1155.625" y="255.8889" text-anchor="middle" fill="var(--ok-accent)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Merge</text>
  <text x="1155.625" y="280.0556" text-anchor="middle" fill="var(--text)" font-size="12.1663" font-family="Arial, sans-serif">Approved</text>
  <text x="227.5" y="378.3333" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Push code</text>
  <text x="546.25" y="378.3333" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Automated checks</text>
  <text x="865" y="378.3333" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Peer validation</text>
  <text x="1155.625" y="354.1667" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Deploy</text>
  <rect x="115" y="410.5556" width="1050" height="169.1667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="441.1667" text-anchor="middle" fill="var(--primary-accent)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">AI Pre-Review Catches</text>
  <rect x="133.75" y="454.8611" width="290.625" height="104.7223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="279.0625" y="477.4167" text-anchor="middle" fill="var(--primary-accent)" font-size="13.0354" font-weight="bold" font-family="Arial, sans-serif">Code Quality</text>
  <text x="279.0625" y="497.5556" text-anchor="middle" fill="var(--text)" font-size="11.2974" font-family="Arial, sans-serif">Style violations</text>
  <text x="279.0625" y="515.2777" text-anchor="middle" fill="var(--text)" font-size="11.2974" font-family="Arial, sans-serif">Dead code, duplicates</text>
  <text x="279.0625" y="533" text-anchor="middle" fill="var(--text)" font-size="11.2974" font-family="Arial, sans-serif">Complexity metrics</text>
  <rect x="494.6875" y="454.8611" width="290.625" height="104.7223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="477.4167" text-anchor="middle" fill="var(--ok-accent)" font-size="13.0354" font-weight="bold" font-family="Arial, sans-serif">Security</text>
  <text x="640" y="497.5556" text-anchor="middle" fill="var(--text)" font-size="11.2974" font-family="Arial, sans-serif">Hardcoded secrets</text>
  <text x="640" y="515.2777" text-anchor="middle" fill="var(--text)" font-size="11.2974" font-family="Arial, sans-serif">SQL injection risks</text>
  <text x="640" y="533" text-anchor="middle" fill="var(--text)" font-size="11.2974" font-family="Arial, sans-serif">Dependency vulns</text>
  <rect x="855.6249" y="454.8611" width="290.625" height="104.7223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1000.9375" y="477.4167" text-anchor="middle" fill="var(--warn-accent)" font-size="13.0354" font-weight="bold" font-family="Arial, sans-serif">Testing Gaps</text>
  <text x="1000.9375" y="497.5556" text-anchor="middle" fill="var(--text)" font-size="11.2974" font-family="Arial, sans-serif">Missing test cases</text>
  <text x="1000.9375" y="515.2777" text-anchor="middle" fill="var(--text)" font-size="11.2974" font-family="Arial, sans-serif">Edge cases</text>
  <text x="1000.9375" y="533" text-anchor="middle" fill="var(--text)" font-size="11.2974" font-family="Arial, sans-serif">Coverage regressions</text>
</svg>
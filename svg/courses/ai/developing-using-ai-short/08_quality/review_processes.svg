<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <circle cx="177.7778" cy="248.8889" r="97.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="177.7778" y="238.2222" text-anchor="middle" fill="var(--primary-accent)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">PR</text>
  <text x="177.7778" y="264.8889" text-anchor="middle" fill="var(--text)" font-size="14.2222" font-family="Arial, sans-serif">Created</text>
  <line x1="275.5556" y1="248.8889" x2="382.2222" y2="248.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <circle cx="480" cy="248.8889" r="97.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="480" y="238.2222" text-anchor="middle" fill="var(--warn-accent)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">AI</text>
  <text x="480" y="264.8889" text-anchor="middle" fill="var(--text)" font-size="14.2222" font-family="Arial, sans-serif">Review</text>
  <line x1="577.7778" y1="248.8889" x2="684.4444" y2="248.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <circle cx="782.2222" cy="248.8889" r="97.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="782.2222" y="238.2222" text-anchor="middle" fill="var(--danger-accent)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Human</text>
  <text x="782.2222" y="264.8889" text-anchor="middle" fill="var(--text)" font-size="14.2222" font-family="Arial, sans-serif">Review</text>
  <line x1="880" y1="248.8889" x2="986.6667" y2="248.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <circle cx="1057.7778" cy="248.8889" r="71.1111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="1057.7778" y="238.2222" text-anchor="middle" fill="var(--ok-accent)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Merge</text>
  <text x="1057.7778" y="264.8889" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">Approved</text>
  <text x="177.7778" y="373.3333" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">Push code</text>
  <text x="480" y="373.3333" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">Automated checks</text>
  <text x="782.2222" y="373.3333" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">Peer validation</text>
  <text x="1057.7778" y="346.6667" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">Deploy</text>
  <rect x="71.1111" y="408.8889" width="995.5556" height="186.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="442.6667" text-anchor="middle" fill="var(--primary-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">AI Pre-Review Catches</text>
  <rect x="88.8889" y="457.7778" width="275.5556" height="115.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="226.6667" y="482.6667" text-anchor="middle" fill="var(--primary-accent)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Code Quality</text>
  <text x="226.6667" y="504.8889" text-anchor="middle" fill="var(--text)" font-size="11.5556" font-family="Arial, sans-serif">Style violations</text>
  <text x="226.6667" y="524.4444" text-anchor="middle" fill="var(--text)" font-size="11.5556" font-family="Arial, sans-serif">Dead code, duplicates</text>
  <text x="226.6667" y="544" text-anchor="middle" fill="var(--text)" font-size="11.5556" font-family="Arial, sans-serif">Complexity metrics</text>
  <rect x="431.1111" y="457.7778" width="275.5556" height="115.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="568.8889" y="482.6667" text-anchor="middle" fill="var(--ok-accent)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Security</text>
  <text x="568.8889" y="504.8889" text-anchor="middle" fill="var(--text)" font-size="11.5556" font-family="Arial, sans-serif">Hardcoded secrets</text>
  <text x="568.8889" y="524.4444" text-anchor="middle" fill="var(--text)" font-size="11.5556" font-family="Arial, sans-serif">SQL injection risks</text>
  <text x="568.8889" y="544" text-anchor="middle" fill="var(--text)" font-size="11.5556" font-family="Arial, sans-serif">Dependency vulns</text>
  <rect x="773.3333" y="457.7778" width="275.5556" height="115.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="911.1111" y="482.6667" text-anchor="middle" fill="var(--warn-accent)" font-size="13.3333" font-weight="bold" font-family="Arial, sans-serif">Testing Gaps</text>
  <text x="911.1111" y="504.8889" text-anchor="middle" fill="var(--text)" font-size="11.5556" font-family="Arial, sans-serif">Missing test cases</text>
  <text x="911.1111" y="524.4444" text-anchor="middle" fill="var(--text)" font-size="11.5556" font-family="Arial, sans-serif">Edge cases</text>
  <text x="911.1111" y="544" text-anchor="middle" fill="var(--text)" font-size="11.5556" font-family="Arial, sans-serif">Coverage regressions</text>
</svg>
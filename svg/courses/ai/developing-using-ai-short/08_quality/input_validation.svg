  <ns0:rect x="426.6667" y="99.5556" width="302.2222" height="12.4444" fill="#fb8c00" />
  <ns0:text x="577.7778" y="101.3333" text-anchor="middle" fill="white" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">API Validation</ns0:text>
  <ns0:text x="577.7778" y="144" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">Security layer</ns0:text>
  <ns0:text x="577.7778" y="170.6667" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">• Schema enforcement</ns0:text>
  <ns0:text x="577.7778" y="193.7778" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">• Type &amp; length checks</ns0:text>
  <ns0:text x="577.7778" y="216.8889" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">• Sanitize special chars</ns0:text>
  <ns0:line x1="728.8889" y1="160" x2="773.3333" y2="160" stroke="#1565c0" stroke-width="2.6667" marker-end="url(#arrow-accent)" />

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="71.1111" y="71.1111" width="302.2222" height="177.7778" rx="10.6667" fill="#ffebee" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="71.1111" y="71.1111" width="302.2222" height="40.8889" rx="10.6667" fill="#e53935" />
  <ns0:rect x="71.1111" y="99.5556" width="302.2222" height="12.4444" fill="#e53935" />
  <ns0:text x="222.2222" y="101.3333" text-anchor="middle" fill="white" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Frontend Validation</ns0:text>
  <ns0:text x="222.2222" y="144" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">User experience layer</ns0:text>
  <ns0:text x="222.2222" y="170.6667" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">• Required field checks</ns0:text>
  <ns0:text x="222.2222" y="193.7778" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">• Format hints (email, phone)</ns0:text>
  <ns0:text x="222.2222" y="216.8889" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">• Immediate feedback</ns0:text>
  <ns0:line x1="373.3333" y1="160" x2="417.7778" y2="160" stroke="#1565c0" stroke-width="2.6667" marker-end="url(#arrow-primary)" />
  <ns0:rect x="426.6667" y="71.1111" width="302.2222" height="177.7778" rx="10.6667" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="426.6667" y="71.1111" width="302.2222" height="40.8889" rx="10.6667" fill="#fb8c00" />
  <ns0:rect x="426.6667" y="99.5556" width="302.2222" height="12.4444" fill="#fb8c00" />
  <ns0:text x="577.7778" y="101.3333" text-anchor="middle" fill="white" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">API Validation</ns0:text>
  <ns0:text x="577.7778" y="144" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">Security layer</ns0:text>
  <ns0:text x="577.7778" y="170.6667" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">• Schema enforcement</ns0:text>
  <ns0:text x="577.7778" y="193.7778" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">• Type &amp; length checks</ns0:text>
  <ns0:text x="577.7778" y="216.8889" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">• Sanitize special chars</ns0:text>
  <ns0:line x1="728.8889" y1="160" x2="773.3333" y2="160" stroke="#1565c0" stroke-width="2.6667" marker-end="url(#arrow-primary)" />
  <ns0:rect x="782.2222" y="71.1111" width="284.4444" height="177.7778" rx="10.6667" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="782.2222" y="71.1111" width="284.4444" height="40.8889" rx="10.6667" fill="url(#grad-primary)" />
  <ns0:rect x="782.2222" y="99.5556" width="284.4444" height="12.4444" fill="url(#grad-primary)" />
  <ns0:text x="924.4444" y="101.3333" text-anchor="middle" fill="white" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">DB Constraints</ns0:text>
  <ns0:text x="924.4444" y="144" text-anchor="middle" fill="#333" font-size="14.2222" font-family="Arial, sans-serif">Final protection</ns0:text>
  <ns0:text x="924.4444" y="170.6667" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">• NOT NULL, UNIQUE</ns0:text>
  <ns0:text x="924.4444" y="193.7778" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">• Foreign keys</ns0:text>
  <ns0:text x="924.4444" y="216.8889" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">• Check constraints</ns0:text>
  <ns0:rect x="71.1111" y="284.4444" width="995.5556" height="106.6667" rx="10.6667" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="327.1111" text-anchor="middle" fill="white" font-size="23.1111" font-weight="bold" font-family="Arial, sans-serif">Never Trust User Input</ns0:text>
  <ns0:text x="568.8889" y="366.2222" text-anchor="middle" fill="#bbdefb" font-size="16" font-family="Arial, sans-serif">Defense in depth: validate at every layer independently</ns0:text>
  <ns0:rect x="71.1111" y="417.7778" width="471.1111" height="124.4444" rx="8.8889" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="306.6667" y="448.8889" text-anchor="middle" fill="#1565c0" font-size="16" font-weight="bold" font-family="Arial, sans-serif">What to Validate</ns0:text>
  <ns0:text x="306.6667" y="475.5556" text-anchor="middle" fill="#333333" font-size="13.3333" font-family="Arial, sans-serif">• Type, length, format, range</ns0:text>
  <ns0:text x="306.6667" y="499.5556" text-anchor="middle" fill="#333333" font-size="13.3333" font-family="Arial, sans-serif">• Sanitize HTML &amp; SQL metacharacters</ns0:text>
  <ns0:text x="306.6667" y="523.5556" text-anchor="middle" fill="#333333" font-size="13.3333" font-family="Arial, sans-serif">• Reject unexpected fields</ns0:text>
  <ns0:rect x="595.5556" y="417.7778" width="471.1111" height="124.4444" rx="8.8889" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="831.1111" y="448.8889" text-anchor="middle" fill="#1565c0" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Common Attacks Prevented</ns0:text>
  <ns0:text x="831.1111" y="475.5556" text-anchor="middle" fill="#333333" font-size="13.3333" font-family="Arial, sans-serif">• SQL injection via parameterised queries</ns0:text>
  <ns0:text x="831.1111" y="499.5556" text-anchor="middle" fill="#333333" font-size="13.3333" font-family="Arial, sans-serif">• XSS via output encoding</ns0:text>
  <ns0:text x="831.1111" y="523.5556" text-anchor="middle" fill="#333333" font-size="13.3333" font-family="Arial, sans-serif">• Buffer overflow via length limits</ns0:text>
</ns0:svg>
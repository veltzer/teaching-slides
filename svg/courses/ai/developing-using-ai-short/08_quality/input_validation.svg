<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="364.285714" height="218.867932" rx="7.476108" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="364.285714" height="50.339688" rx="7.476108" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="75.019038" width="364.285714" height="15.320651" fill="url(#grad-danger)" rx="7.476108" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.142857" y="77.207566" text-anchor="middle" fill="var(--bg)" font-size="21.65654" font-weight="bold" font-family="Arial, sans-serif">Frontend Validation</text>
  <text x="222.142857" y="129.735919" text-anchor="middle" fill="var(--text)" font-size="17.325132" font-family="Arial, sans-serif">User experience layer</text>
  <text x="222.142857" y="162.566156" text-anchor="middle" fill="var(--text-muted)" font-size="15.159429" font-family="Arial, sans-serif">• Required field checks</text>
  <text x="222.142857" y="191.018929" text-anchor="middle" fill="var(--text-muted)" font-size="15.159429" font-family="Arial, sans-serif">• Format hints (email, phone)</text>
  <text x="222.142857" y="219.471838" text-anchor="middle" fill="var(--text-muted)" font-size="15.159429" font-family="Arial, sans-serif">• Immediate feedback</text>
  <line x1="404.285714" y1="149.434034" x2="457.857143" y2="149.434034" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="468.571429" y="40" width="364.285714" height="218.867932" rx="7.476108" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="468.571429" y="40" width="364.285714" height="50.339688" rx="7.476108" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="468.571429" y="75.019038" width="364.285714" height="15.320651" fill="url(#grad-warn)" rx="7.476108" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.714286" y="77.207566" text-anchor="middle" fill="var(--bg)" font-size="21.65654" font-weight="bold" font-family="Arial, sans-serif">API Validation</text>
  <text x="650.714286" y="129.735919" text-anchor="middle" fill="var(--text)" font-size="17.325132" font-family="Arial, sans-serif">Security layer</text>
  <text x="650.714286" y="162.566156" text-anchor="middle" fill="var(--text-muted)" font-size="15.159429" font-family="Arial, sans-serif">• Schema enforcement</text>
  <text x="650.714286" y="191.018929" text-anchor="middle" fill="var(--text-muted)" font-size="15.159429" font-family="Arial, sans-serif">• Type &amp; length checks</text>
  <text x="650.714286" y="219.471838" text-anchor="middle" fill="var(--text-muted)" font-size="15.159429" font-family="Arial, sans-serif">• Sanitize special chars</text>
  <line x1="832.857143" y1="149.434034" x2="886.428457" y2="149.434034" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="897.142857" y="40" width="342.857029" height="218.867932" rx="7.476108" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="897.142857" y="40" width="342.857029" height="50.339688" rx="7.476108" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="897.142857" y="75.019038" width="342.857029" height="15.320651" fill="url(#grad-primary)" rx="7.476108" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.571314" y="77.207566" text-anchor="middle" fill="var(--bg)" font-size="21.65654" font-weight="bold" font-family="Arial, sans-serif">DB Constraints</text>
  <text x="1068.571314" y="129.735919" text-anchor="middle" fill="var(--text)" font-size="17.325132" font-family="Arial, sans-serif">Final protection</text>
  <text x="1068.571314" y="162.566156" text-anchor="middle" fill="var(--text-muted)" font-size="15.159429" font-family="Arial, sans-serif">• NOT NULL, UNIQUE</text>
  <text x="1068.571314" y="191.018929" text-anchor="middle" fill="var(--text-muted)" font-size="15.159429" font-family="Arial, sans-serif">• Foreign keys</text>
  <text x="1068.571314" y="219.471838" text-anchor="middle" fill="var(--text-muted)" font-size="15.159429" font-family="Arial, sans-serif">• Check constraints</text>
  <rect x="40" y="302.641491" width="1200" height="131.320814" rx="7.476108" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="355.169844" text-anchor="middle" fill="var(--bg)" font-size="28.153402" font-weight="bold" font-family="Arial, sans-serif">Never Trust User Input</text>
  <text x="640" y="403.320868" text-anchor="middle" fill="var(--primary-accent)" font-size="19.490836" font-family="Arial, sans-serif">Defense in depth: validate at every layer independently</text>
  <rect x="40" y="466.792543" width="567.857143" height="153.207457" rx="7.476108" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="323.928571" y="505.094509" text-anchor="middle" fill="var(--primary-accent)" font-size="19.490836" font-weight="bold" font-family="Arial, sans-serif">What to Validate</text>
  <text x="323.928571" y="537.924746" text-anchor="middle" fill="var(--text)" font-size="16.242343" font-family="Arial, sans-serif">• Type, length, format, range</text>
  <text x="323.928571" y="567.471919" text-anchor="middle" fill="var(--text)" font-size="16.242343" font-family="Arial, sans-serif">• Sanitize HTML &amp; SQL metacharacters</text>
  <text x="323.928571" y="597.019092" text-anchor="middle" fill="var(--text)" font-size="16.242343" font-family="Arial, sans-serif">• Reject unexpected fields</text>
  <rect x="672.142857" y="466.792543" width="567.857143" height="153.207457" rx="7.476108" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="956.071429" y="505.094509" text-anchor="middle" fill="var(--primary-accent)" font-size="19.490836" font-weight="bold" font-family="Arial, sans-serif">Common Attacks Prevented</text>
  <text x="956.071429" y="537.924746" text-anchor="middle" fill="var(--text)" font-size="16.242343" font-family="Arial, sans-serif">• SQL injection via parameterised queries</text>
  <text x="956.071429" y="567.471919" text-anchor="middle" fill="var(--text)" font-size="16.242343" font-family="Arial, sans-serif">• XSS via output encoding</text>
  <text x="956.071429" y="597.019092" text-anchor="middle" fill="var(--text)" font-size="16.242343" font-family="Arial, sans-serif">• Buffer overflow via length limits</text>
</svg>

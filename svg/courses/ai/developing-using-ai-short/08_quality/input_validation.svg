  <ns0:text x="306.6667" y="448.8889" text-anchor="middle" fill="#1565c0" font-size="16" font-weight="bold" font-family="Arial, sans-serif">What to Validate</ns0:text>
  <ns0:text x="306.6667" y="475.5556" text-anchor="middle" fill="#444" font-size="13.3333" font-family="Arial, sans-serif">• Type, length, format, range</ns0:text>
  <ns0:text x="306.6667" y="499.5556" text-anchor="middle" fill="#444" font-size="13.3333" font-family="Arial, sans-serif">• Sanitize HTML &amp; SQL metacharacters</ns0:text>
  <ns0:text x="306.6667" y="523.5556" text-anchor="middle" fill="#444" font-size="13.3333" font-family="Arial, sans-serif">• Reject unexpected fields</ns0:text>
  <ns0:rect x="595.5556" y="417.7778" width="471.1111" height="124.4444" rx="8.8889" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="831.1111" y="448.8889" text-anchor="middle" fill="#1565c0" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Common Attacks Prevented</ns0:text>
  <ns0:text x="831.1111" y="475.5556" text-anchor="middle" fill="#444" font-size="13.3333" font-family="Arial, sans-serif">• SQL injection via parameterised queries</ns0:text>
  <ns0:text x="831.1111" y="499.5556" text-anchor="middle" fill="#444" font-size="13.3333" font-family="Arial, sans-serif">• XSS via output encoding</ns0:text>
  <ns0:text x="831.1111" y="523.5556" text-anchor="middle" fill="#444" font-size="13.3333" font-family="Arial, sans-serif">• Buffer overflow via length limits</ns0:text>
</ns0:svg>
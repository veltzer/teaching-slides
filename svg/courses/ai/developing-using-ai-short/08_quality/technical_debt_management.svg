<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="48.8889" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#1565c0" font-family="Arial, sans-serif">Technical Debt Quadrants</ns0:text>
  <ns0:line x1="568.8889" y1="71.1111" x2="568.8889" y2="515.5556" stroke="#bdbdbd" stroke-width="1.7778" />
  <ns0:line x1="71.1111" y1="293.3333" x2="1066.6667" y2="293.3333" stroke="#bdbdbd" stroke-width="1.7778" />
  <ns0:text x="320" y="69.3333" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">Reckless</ns0:text>
  <ns0:text x="800" y="69.3333" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif">Prudent</ns0:text>
  <ns0:text x="66.6667" y="177.7778" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif" transform="rotate(-90 75 200)">Deliberate</ns0:text>
  <ns0:text x="66.6667" y="408.8889" text-anchor="middle" fill="#555" font-size="12.4444" font-family="Arial, sans-serif" transform="rotate(-90 75 460)">Inadvertent</ns0:text>
  <ns0:rect x="80" y="80" width="471.1111" height="195.5556" rx="8.8889" fill="#ffebee" stroke="#e53935" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="315.5556" y="160" text-anchor="middle" fill="#b71c1c" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Reckless &amp; Deliberate</ns0:text>
  <ns0:text x="315.5556" y="193.7778" text-anchor="middle" fill="#555" font-size="15.1111" font-family="Arial, sans-serif">"We don't have time for design"</ns0:text>
  <ns0:text x="315.5556" y="224" text-anchor="middle" fill="#888" font-size="12.4444" font-family="Arial, sans-serif">Highest long-term cost</ns0:text>
  <ns0:rect x="586.6667" y="80" width="471.1111" height="195.5556" rx="8.8889" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="822.2222" y="160" text-anchor="middle" fill="#e65100" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Prudent &amp; Deliberate</ns0:text>
  <ns0:text x="822.2222" y="193.7778" text-anchor="middle" fill="#555" font-size="15.1111" font-family="Arial, sans-serif">"Ship now, refactor later"</ns0:text>
  <ns0:text x="822.2222" y="224" text-anchor="middle" fill="#888" font-size="12.4444" font-family="Arial, sans-serif">Acceptable if planned</ns0:text>
  <ns0:rect x="80" y="311.1111" width="471.1111" height="195.5556" rx="8.8889" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="315.5556" y="391.1111" text-anchor="middle" fill="#666666" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Reckless &amp; Inadvertent</ns0:text>
  <ns0:text x="315.5556" y="424.8889" text-anchor="middle" fill="#555" font-size="15.1111" font-family="Arial, sans-serif">"What's layering?"</ns0:text>
  <ns0:text x="315.5556" y="455.1111" text-anchor="middle" fill="#888" font-size="12.4444" font-family="Arial, sans-serif">Results from ignorance</ns0:text>
  <ns0:rect x="586.6667" y="311.1111" width="471.1111" height="195.5556" rx="8.8889" fill="#e8f5e9" stroke="#43a047" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="822.2222" y="391.1111" text-anchor="middle" fill="#2e7d32" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Prudent &amp; Inadvertent</ns0:text>
  <ns0:text x="822.2222" y="424.8889" text-anchor="middle" fill="#555" font-size="15.1111" font-family="Arial, sans-serif">"Now we know better"</ns0:text>
  <ns0:text x="822.2222" y="455.1111" text-anchor="middle" fill="#888" font-size="12.4444" font-family="Arial, sans-serif">Learn and refactor</ns0:text>
  <ns0:rect x="71.1111" y="528.8889" width="995.5556" height="88.8889" rx="8.8889" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="564.4444" text-anchor="middle" fill="#1565c0" font-size="16" font-weight="bold" font-family="Arial, sans-serif">AI helps identify and track technical debt systematically</ns0:text>
  <ns0:text x="568.8889" y="595.5556" text-anchor="middle" fill="#555" font-size="14.2222" font-family="Arial, sans-serif">Prioritise by business impact, allocate 20% capacity to debt reduction</ns0:text>
</ns0:svg>
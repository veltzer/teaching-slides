<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Quadrant title -->
  <text x="640" y="55" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565c0" font-family="Arial, sans-serif">Technical Debt Quadrants</text>
  <!-- Axes -->
  <line x1="640" y1="80" x2="640" y2="580" stroke="#bdbdbd" stroke-width="2"/>
  <line x1="80" y1="330" x2="1200" y2="330" stroke="#bdbdbd" stroke-width="2"/>
  <!-- Axis labels -->
  <text x="360" y="78" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Reckless</text>
  <text x="900" y="78" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Prudent</text>
  <text x="75" y="200" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif" transform="rotate(-90 75 200)">Deliberate</text>
  <text x="75" y="460" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif" transform="rotate(-90 75 460)">Inadvertent</text>
  <!-- Quadrant 1: Reckless + Deliberate -->
  <rect x="90" y="90" width="530" height="220" rx="10" fill="#ffebee" stroke="#e53935" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="355" y="180" text-anchor="middle" fill="#b71c1c" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Reckless &amp; Deliberate</text>
  <text x="355" y="218" text-anchor="middle" fill="#555" font-size="17" font-family="Arial, sans-serif">"We don't have time for design"</text>
  <text x="355" y="252" text-anchor="middle" fill="#888" font-size="14" font-family="Arial, sans-serif">Highest long-term cost</text>
  <!-- Quadrant 2: Prudent + Deliberate -->
  <rect x="660" y="90" width="530" height="220" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="925" y="180" text-anchor="middle" fill="#e65100" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Prudent &amp; Deliberate</text>
  <text x="925" y="218" text-anchor="middle" fill="#555" font-size="17" font-family="Arial, sans-serif">"Ship now, refactor later"</text>
  <text x="925" y="252" text-anchor="middle" fill="#888" font-size="14" font-family="Arial, sans-serif">Acceptable if planned</text>
  <!-- Quadrant 3: Reckless + Inadvertent -->
  <rect x="90" y="350" width="530" height="220" rx="10" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="355" y="440" text-anchor="middle" fill="#616161" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Reckless &amp; Inadvertent</text>
  <text x="355" y="478" text-anchor="middle" fill="#555" font-size="17" font-family="Arial, sans-serif">"What's layering?"</text>
  <text x="355" y="512" text-anchor="middle" fill="#888" font-size="14" font-family="Arial, sans-serif">Results from ignorance</text>
  <!-- Quadrant 4: Prudent + Inadvertent -->
  <rect x="660" y="350" width="530" height="220" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="925" y="440" text-anchor="middle" fill="#2e7d32" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Prudent &amp; Inadvertent</text>
  <text x="925" y="478" text-anchor="middle" fill="#555" font-size="17" font-family="Arial, sans-serif">"Now we know better"</text>
  <text x="925" y="512" text-anchor="middle" fill="#888" font-size="14" font-family="Arial, sans-serif">Learn and refactor</text>
  <!-- Bottom note -->
  <rect x="80" y="595" width="1120" height="100" rx="10" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="640" y="635" text-anchor="middle" fill="#1565c0" font-size="18" font-weight="bold" font-family="Arial, sans-serif">AI helps identify and track technical debt systematically</text>
  <text x="640" y="670" text-anchor="middle" fill="#555" font-size="16" font-family="Arial, sans-serif">Prioritise by business impact, allocate 20% capacity to debt reduction</text>
</svg>

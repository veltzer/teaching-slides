<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="84.3056" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Technical Debt Quadrants</text>
  <line x1="640" y1="104.4444" x2="640" y2="507.2223" stroke="var(--border)" stroke-width="1.7778" />
  <line x1="115" y1="305.8333" x2="1165" y2="305.8333" stroke="var(--border)" stroke-width="1.7778" />
  <text x="377.5" y="102.8333" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Reckless</text>
  <text x="883.75" y="102.8333" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Prudent</text>
  <text x="110.3125" y="201.1111" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif" transform="rotate(-90 75 200)">Deliberate</text>
  <text x="110.3125" y="410.5556" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif" transform="rotate(-90 75 460)">Inadvertent</text>
  <rect x="124.375" y="112.5" width="496.875" height="177.2223" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="372.8125" y="185" text-anchor="middle" fill="var(--danger-accent)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Reckless &amp; Deliberate</text>
  <text x="372.8125" y="215.6111" text-anchor="middle" fill="var(--text-muted)" font-size="14.7735" font-family="Arial, sans-serif">"We don't have time for design"</text>
  <text x="372.8125" y="243" text-anchor="middle" fill="var(--text-faint)" font-size="12.1663" font-family="Arial, sans-serif">Highest long-term cost</text>
  <rect x="658.75" y="112.5" width="496.875" height="177.2223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="907.1875" y="185" text-anchor="middle" fill="var(--warn-accent)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Prudent &amp; Deliberate</text>
  <text x="907.1875" y="215.6111" text-anchor="middle" fill="var(--text-muted)" font-size="14.7735" font-family="Arial, sans-serif">"Ship now, refactor later"</text>
  <text x="907.1875" y="243" text-anchor="middle" fill="var(--text-faint)" font-size="12.1663" font-family="Arial, sans-serif">Acceptable if planned</text>
  <rect x="124.375" y="321.9444" width="496.875" height="177.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="372.8125" y="394.4444" text-anchor="middle" fill="var(--text-muted)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Reckless &amp; Inadvertent</text>
  <text x="372.8125" y="425.0556" text-anchor="middle" fill="var(--text-muted)" font-size="14.7735" font-family="Arial, sans-serif">"What's layering?"</text>
  <text x="372.8125" y="452.4444" text-anchor="middle" fill="var(--text-faint)" font-size="12.1663" font-family="Arial, sans-serif">Results from ignorance</text>
  <rect x="658.75" y="321.9444" width="496.875" height="177.2223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="907.1875" y="394.4444" text-anchor="middle" fill="var(--ok-accent)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">Prudent &amp; Inadvertent</text>
  <text x="907.1875" y="425.0556" text-anchor="middle" fill="var(--text-muted)" font-size="14.7735" font-family="Arial, sans-serif">"Now we know better"</text>
  <text x="907.1875" y="452.4444" text-anchor="middle" fill="var(--text-faint)" font-size="12.1663" font-family="Arial, sans-serif">Learn and refactor</text>
  <rect x="115" y="519.3056" width="1050" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="551.5277" text-anchor="middle" fill="var(--primary-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">AI helps identify and track technical debt systematically</text>
  <text x="640" y="579.7223" text-anchor="middle" fill="var(--text-muted)" font-size="13.9044" font-family="Arial, sans-serif">Prioritise by business impact, allocate 20% capacity to debt reduction</text>
</svg>
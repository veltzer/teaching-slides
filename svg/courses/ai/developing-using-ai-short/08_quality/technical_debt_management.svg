  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:text x="568.8889" y="48.8889" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--primary-dk)" font-family="Arial, sans-serif">Technical Debt Quadrants</ns0:text>
  <ns0:line x1="568.8889" y1="71.1111" x2="568.8889" y2="515.5556" stroke="var(--border-strong)" stroke-width="1.7778" />
  <ns0:line x1="71.1111" y1="293.3333" x2="1066.6667" y2="293.3333" stroke="var(--border-strong)" stroke-width="1.7778" />
  <ns0:text x="320" y="69.3333" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">Reckless</ns0:text>
  <ns0:text x="800" y="69.3333" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif">Prudent</ns0:text>
  <ns0:text x="66.6667" y="177.7778" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif" transform="rotate(-90 75 200)">Deliberate</ns0:text>
  <ns0:text x="66.6667" y="408.8889" text-anchor="middle" fill="var(--text-muted)" font-size="12.4444" font-family="Arial, sans-serif" transform="rotate(-90 75 460)">Inadvertent</ns0:text>
  <ns0:rect x="80" y="80" width="471.1111" height="195.5556" rx="8.8889" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="315.5556" y="160" text-anchor="middle" fill="var(--danger-deep)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Reckless &amp; Deliberate</ns0:text>
  <ns0:text x="315.5556" y="193.7778" text-anchor="middle" fill="var(--text-muted)" font-size="15.1111" font-family="Arial, sans-serif">"We don't have time for design"</ns0:text>
  <ns0:text x="315.5556" y="224" text-anchor="middle" fill="var(--text-faint)" font-size="12.4444" font-family="Arial, sans-serif">Highest long-term cost</ns0:text>
  <ns0:rect x="586.6667" y="80" width="471.1111" height="195.5556" rx="8.8889" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="822.2222" y="160" text-anchor="middle" fill="var(--warn-dk)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Prudent &amp; Deliberate</ns0:text>
  <ns0:text x="822.2222" y="193.7778" text-anchor="middle" fill="var(--text-muted)" font-size="15.1111" font-family="Arial, sans-serif">"Ship now, refactor later"</ns0:text>
  <ns0:text x="822.2222" y="224" text-anchor="middle" fill="var(--text-faint)" font-size="12.4444" font-family="Arial, sans-serif">Acceptable if planned</ns0:text>
  <ns0:rect x="80" y="311.1111" width="471.1111" height="195.5556" rx="8.8889" fill="var(--surface)" stroke="var(--text-disabled)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="315.5556" y="391.1111" text-anchor="middle" fill="var(--text-mid)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Reckless &amp; Inadvertent</ns0:text>
  <ns0:text x="315.5556" y="424.8889" text-anchor="middle" fill="var(--text-muted)" font-size="15.1111" font-family="Arial, sans-serif">"What's layering?"</ns0:text>
  <ns0:text x="315.5556" y="455.1111" text-anchor="middle" fill="var(--text-faint)" font-size="12.4444" font-family="Arial, sans-serif">Results from ignorance</ns0:text>
  <ns0:rect x="586.6667" y="311.1111" width="471.1111" height="195.5556" rx="8.8889" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="822.2222" y="391.1111" text-anchor="middle" fill="var(--ok-dk)" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">Prudent &amp; Inadvertent</ns0:text>
  <ns0:text x="822.2222" y="424.8889" text-anchor="middle" fill="var(--text-muted)" font-size="15.1111" font-family="Arial, sans-serif">"Now we know better"</ns0:text>
  <ns0:text x="822.2222" y="455.1111" text-anchor="middle" fill="var(--text-faint)" font-size="12.4444" font-family="Arial, sans-serif">Learn and refactor</ns0:text>
  <ns0:rect x="71.1111" y="528.8889" width="995.5556" height="88.8889" rx="8.8889" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="564.4444" text-anchor="middle" fill="var(--primary-dk)" font-size="16" font-weight="bold" font-family="Arial, sans-serif">AI helps identify and track technical debt systematically</ns0:text>
  <ns0:text x="568.8889" y="595.5556" text-anchor="middle" fill="var(--text-muted)" font-size="14.2222" font-family="Arial, sans-serif">Prioritise by business impact, allocate 20% capacity to debt reduction</ns0:text>
</ns0:svg>
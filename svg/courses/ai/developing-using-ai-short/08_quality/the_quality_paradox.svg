<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="535.714171" height="467.741793" rx="6.912221" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="535.714171" height="52.387078" rx="6.912221" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="79.29028" width="535.714171" height="13.096682" fill="url(#grad-danger)" rx="6.912221" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.857143" y="77.419441" text-anchor="middle" fill="var(--bg)" font-size="24.027571" font-weight="bold" font-family="Arial, sans-serif">Without Standards</text>
  <text x="307.857143" y="142.903318" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Fast generation</text>
  <text x="307.857143" y="185.935506" text-anchor="middle" fill="var(--danger-accent)" font-size="20.023091" font-family="Arial, sans-serif">- Inconsistent code</text>
  <text x="307.857143" y="228.967811" text-anchor="middle" fill="var(--danger-accent)" font-size="20.023091" font-family="Arial, sans-serif">- Security risks</text>
  <text x="307.857143" y="272.000116" text-anchor="middle" fill="var(--danger-accent)" font-size="20.023091" font-family="Arial, sans-serif">- Technical debt</text>
  <text x="307.857143" y="315.032189" text-anchor="middle" fill="var(--danger-accent)" font-size="20.023091" font-family="Arial, sans-serif">- Maintenance issues</text>
  <text x="307.857143" y="358.064494" text-anchor="middle" fill="var(--danger-accent)" font-size="20.023091" font-family="Arial, sans-serif">- Hard to review</text>
  <text x="307.857143" y="401.096799" text-anchor="middle" fill="var(--danger-accent)" font-size="20.023091" font-family="Arial, sans-serif">- Unpredictable quality</text>
  <rect x="704.285714" y="40" width="535.714171" height="467.741793" rx="6.912221" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="704.285714" y="40" width="535.714171" height="52.387078" rx="6.912221" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="704.285714" y="79.29028" width="535.714171" height="13.096682" fill="url(#grad-ok)" rx="6.912221" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="972.142743" y="77.419441" text-anchor="middle" fill="var(--bg)" font-size="24.027571" font-weight="bold" font-family="Arial, sans-serif">With Best Practices</text>
  <text x="972.142743" y="142.903318" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Fast generation</text>
  <text x="972.142743" y="185.935506" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Consistent quality</text>
  <text x="972.142743" y="228.967811" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Secure by default</text>
  <text x="972.142743" y="272.000116" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Maintainable</text>
  <text x="972.142743" y="315.032189" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Scalable</text>
  <text x="972.142743" y="358.064494" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Easy to review</text>
  <text x="972.142743" y="401.096799" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Predictable outcomes</text>
  <rect x="40" y="535.806461" width="1200" height="84.193539" rx="6.912221" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="571.354831" text-anchor="middle" fill="var(--bg)" font-size="22.025331" font-weight="bold" font-family="Arial, sans-serif">The Paradox: AI makes bad habits scale faster</text>
  <text x="640" y="603.161292" text-anchor="middle" fill="var(--primary-accent)" font-size="17.019616" font-family="Arial, sans-serif">Standards and guardrails are more important with AI, not less</text>
</svg>

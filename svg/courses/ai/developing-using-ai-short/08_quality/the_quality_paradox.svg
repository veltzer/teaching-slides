<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="535.714171" height="467.741793" rx="6.912221" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="40" width="535.714171" height="52.387078" rx="6.912221" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="40" y="79.29028" width="535.714171" height="13.096682" fill="var(--danger-fill)" rx="6.912221" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="307.857143" y="77.419441" text-anchor="middle" fill="var(--bg)" font-size="24.027571" font-weight="bold" font-family="Arial, sans-serif">Without Standards</text>
  <text x="307.857143" y="142.903318" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Fast generation</text>
  <text x="307.857143" y="185.935506" text-anchor="middle" fill="var(--danger-accent)" font-size="20.023091" font-family="Arial, sans-serif">- Inconsistent code</text>
  <text x="307.857143" y="228.967811" text-anchor="middle" fill="var(--danger-accent)" font-size="20.023091" font-family="Arial, sans-serif">- Security risks</text>
  <text x="307.857143" y="272.000116" text-anchor="middle" fill="var(--danger-accent)" font-size="20.023091" font-family="Arial, sans-serif">- Technical debt</text>
  <text x="307.857143" y="315.032189" text-anchor="middle" fill="var(--danger-accent)" font-size="20.023091" font-family="Arial, sans-serif">- Maintenance issues</text>
  <text x="307.857143" y="358.064494" text-anchor="middle" fill="var(--danger-accent)" font-size="20.023091" font-family="Arial, sans-serif">- Hard to review</text>
  <text x="307.857143" y="401.096799" text-anchor="middle" fill="var(--danger-accent)" font-size="20.023091" font-family="Arial, sans-serif">- Unpredictable quality</text>
  <rect x="704.285714" y="40" width="535.714171" height="467.741793" rx="6.912221" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="704.285714" y="40" width="535.714171" height="52.387078" rx="6.912221" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="704.285714" y="79.29028" width="535.714171" height="13.096682" fill="var(--ok-fill)" rx="6.912221" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="972.142743" y="77.419441" text-anchor="middle" fill="var(--bg)" font-size="24.027571" font-weight="bold" font-family="Arial, sans-serif">With Best Practices</text>
  <text x="972.142743" y="142.903318" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Fast generation</text>
  <text x="972.142743" y="185.935506" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Consistent quality</text>
  <text x="972.142743" y="228.967811" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Secure by default</text>
  <text x="972.142743" y="272.000116" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Maintainable</text>
  <text x="972.142743" y="315.032189" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Scalable</text>
  <text x="972.142743" y="358.064494" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Easy to review</text>
  <text x="972.142743" y="401.096799" text-anchor="middle" fill="var(--ok-accent)" font-size="20.023091" font-family="Arial, sans-serif">+ Predictable outcomes</text>
  <rect x="40" y="535.806461" width="1200" height="84.193539" rx="6.912221" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="571.354831" text-anchor="middle" fill="var(--bg)" font-size="22.025331" font-weight="bold" font-family="Arial, sans-serif">The Paradox: AI makes bad habits scale faster</text>
  <text x="640" y="603.161292" text-anchor="middle" fill="var(--primary-accent)" font-size="17.019616" font-family="Arial, sans-serif">Standards and guardrails are more important with AI, not less</text>
</svg>
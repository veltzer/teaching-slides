<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="104.4444" width="468.7499" height="402.7777" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="115" y="104.4444" width="468.7499" height="45.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="115" y="138.2777" width="468.7499" height="11.2777" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="349.375" y="136.6667" text-anchor="middle" fill="var(--bg)" font-size="20.8566" font-weight="bold" font-family="Arial, sans-serif">Without Standards</text>
  <text x="349.375" y="193.0556" text-anchor="middle" fill="var(--ok-accent)" font-size="17.3806" font-family="Arial, sans-serif">+ Fast generation</text>
  <text x="349.375" y="230.1111" text-anchor="middle" fill="var(--danger-accent)" font-size="17.3806" font-family="Arial, sans-serif">- Inconsistent code</text>
  <text x="349.375" y="267.1667" text-anchor="middle" fill="var(--danger-accent)" font-size="17.3806" font-family="Arial, sans-serif">- Security risks</text>
  <text x="349.375" y="304.2223" text-anchor="middle" fill="var(--danger-accent)" font-size="17.3806" font-family="Arial, sans-serif">- Technical debt</text>
  <text x="349.375" y="341.2777" text-anchor="middle" fill="var(--danger-accent)" font-size="17.3806" font-family="Arial, sans-serif">- Maintenance issues</text>
  <text x="349.375" y="378.3333" text-anchor="middle" fill="var(--danger-accent)" font-size="17.3806" font-family="Arial, sans-serif">- Hard to review</text>
  <text x="349.375" y="415.3889" text-anchor="middle" fill="var(--danger-accent)" font-size="17.3806" font-family="Arial, sans-serif">- Unpredictable quality</text>
  <rect x="696.25" y="104.4444" width="468.7499" height="402.7777" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="696.25" y="104.4444" width="468.7499" height="45.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="696.25" y="138.2777" width="468.7499" height="11.2777" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="930.6249" y="136.6667" text-anchor="middle" fill="var(--bg)" font-size="20.8566" font-weight="bold" font-family="Arial, sans-serif">With Best Practices</text>
  <text x="930.6249" y="193.0556" text-anchor="middle" fill="var(--ok-accent)" font-size="17.3806" font-family="Arial, sans-serif">+ Fast generation</text>
  <text x="930.6249" y="230.1111" text-anchor="middle" fill="var(--ok-accent)" font-size="17.3806" font-family="Arial, sans-serif">+ Consistent quality</text>
  <text x="930.6249" y="267.1667" text-anchor="middle" fill="var(--ok-accent)" font-size="17.3806" font-family="Arial, sans-serif">+ Secure by default</text>
  <text x="930.6249" y="304.2223" text-anchor="middle" fill="var(--ok-accent)" font-size="17.3806" font-family="Arial, sans-serif">+ Maintainable</text>
  <text x="930.6249" y="341.2777" text-anchor="middle" fill="var(--ok-accent)" font-size="17.3806" font-family="Arial, sans-serif">+ Scalable</text>
  <text x="930.6249" y="378.3333" text-anchor="middle" fill="var(--ok-accent)" font-size="17.3806" font-family="Arial, sans-serif">+ Easy to review</text>
  <text x="930.6249" y="415.3889" text-anchor="middle" fill="var(--ok-accent)" font-size="17.3806" font-family="Arial, sans-serif">+ Predictable outcomes</text>
  <rect x="115" y="531.3889" width="1050" height="72.5" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="562" text-anchor="middle" fill="var(--bg)" font-size="19.1186" font-weight="bold" font-family="Arial, sans-serif">The Paradox: AI makes bad habits scale faster</text>
  <text x="640" y="589.3889" text-anchor="middle" fill="var(--primary-accent)" font-size="14.7735" font-family="Arial, sans-serif">Standards and guardrails are more important with AI, not less</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="71.1111" y="71.1111" width="444.4444" height="444.4444" rx="12.4444" fill="#ffebee" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="71.1111" y="71.1111" width="444.4444" height="49.7778" rx="12.4444" fill="#e53935" />
  <ns0:rect x="71.1111" y="108.4444" width="444.4444" height="12.4444" fill="#e53935" />
  <ns0:text x="293.3333" y="106.6667" text-anchor="middle" fill="white" font-size="21.3333" font-weight="bold" font-family="Arial, sans-serif">Without Standards</ns0:text>
  <ns0:text x="293.3333" y="168.8889" text-anchor="middle" fill="#2e7d32" font-size="17.7778" font-family="Arial, sans-serif">+ Fast generation</ns0:text>
  <ns0:text x="293.3333" y="209.7778" text-anchor="middle" fill="#b71c1c" font-size="17.7778" font-family="Arial, sans-serif">- Inconsistent code</ns0:text>
  <ns0:text x="293.3333" y="250.6667" text-anchor="middle" fill="#b71c1c" font-size="17.7778" font-family="Arial, sans-serif">- Security risks</ns0:text>
  <ns0:text x="293.3333" y="291.5556" text-anchor="middle" fill="#b71c1c" font-size="17.7778" font-family="Arial, sans-serif">- Technical debt</ns0:text>
  <ns0:text x="293.3333" y="332.4444" text-anchor="middle" fill="#b71c1c" font-size="17.7778" font-family="Arial, sans-serif">- Maintenance issues</ns0:text>
  <ns0:text x="293.3333" y="373.3333" text-anchor="middle" fill="#b71c1c" font-size="17.7778" font-family="Arial, sans-serif">- Hard to review</ns0:text>
  <ns0:text x="293.3333" y="414.2222" text-anchor="middle" fill="#b71c1c" font-size="17.7778" font-family="Arial, sans-serif">- Unpredictable quality</ns0:text>
  <ns0:rect x="622.2222" y="71.1111" width="444.4444" height="444.4444" rx="12.4444" fill="#e8f5e9" stroke="#43a047" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="622.2222" y="71.1111" width="444.4444" height="49.7778" rx="12.4444" fill="#43a047" />
  <ns0:rect x="622.2222" y="108.4444" width="444.4444" height="12.4444" fill="#43a047" />
  <ns0:text x="844.4444" y="106.6667" text-anchor="middle" fill="white" font-size="21.3333" font-weight="bold" font-family="Arial, sans-serif">With Best Practices</ns0:text>
  <ns0:text x="844.4444" y="168.8889" text-anchor="middle" fill="#2e7d32" font-size="17.7778" font-family="Arial, sans-serif">+ Fast generation</ns0:text>
  <ns0:text x="844.4444" y="209.7778" text-anchor="middle" fill="#2e7d32" font-size="17.7778" font-family="Arial, sans-serif">+ Consistent quality</ns0:text>
  <ns0:text x="844.4444" y="250.6667" text-anchor="middle" fill="#2e7d32" font-size="17.7778" font-family="Arial, sans-serif">+ Secure by default</ns0:text>
  <ns0:text x="844.4444" y="291.5556" text-anchor="middle" fill="#2e7d32" font-size="17.7778" font-family="Arial, sans-serif">+ Maintainable</ns0:text>
  <ns0:text x="844.4444" y="332.4444" text-anchor="middle" fill="#2e7d32" font-size="17.7778" font-family="Arial, sans-serif">+ Scalable</ns0:text>
  <ns0:text x="844.4444" y="373.3333" text-anchor="middle" fill="#2e7d32" font-size="17.7778" font-family="Arial, sans-serif">+ Easy to review</ns0:text>
  <ns0:text x="844.4444" y="414.2222" text-anchor="middle" fill="#2e7d32" font-size="17.7778" font-family="Arial, sans-serif">+ Predictable outcomes</ns0:text>
  <ns0:rect x="71.1111" y="542.2222" width="995.5556" height="80" rx="8.8889" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="576" text-anchor="middle" fill="white" font-size="19.5556" font-weight="bold" font-family="Arial, sans-serif">The Paradox: AI makes bad habits scale faster</ns0:text>
  <ns0:text x="568.8889" y="606.2222" text-anchor="middle" fill="#bbdefb" font-size="15.1111" font-family="Arial, sans-serif">Standards and guardrails are more important with AI, not less</ns0:text>
</ns0:svg>
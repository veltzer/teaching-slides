<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header -->
  <rect x="80" y="50" width="1120" height="60" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="90" text-anchor="middle" fill="white" font-size="26" font-weight="bold" font-family="Arial, sans-serif">Common Performance Bottlenecks</text>
  <!-- Bottleneck bars -->
  <rect x="80" y="140" width="1120" height="100" rx="10" fill="#ffebee" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="140" width="8" height="100" rx="4" fill="#e53935"/>
  <text x="110" y="185" font-size="20" font-weight="bold" fill="#b71c1c" font-family="Arial, sans-serif">N+1 Queries</text>
  <text x="110" y="218" font-size="17" fill="#444" font-family="Arial, sans-serif">100ms x 100 records = 10 seconds! — Fix: eager-load with JOIN or batch fetch</text>
  <rect x="80" y="260" width="1120" height="100" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="260" width="8" height="100" rx="4" fill="#fb8c00"/>
  <text x="110" y="305" font-size="20" font-weight="bold" fill="#e65100" font-family="Arial, sans-serif">Synchronous I/O</text>
  <text x="110" y="338" font-size="17" fill="#444" font-family="Arial, sans-serif">Blocking operations stall the thread — Fix: async/await, non-blocking I/O</text>
  <rect x="80" y="380" width="1120" height="100" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="380" width="8" height="100" rx="4" fill="#1e88e5"/>
  <text x="110" y="425" font-size="20" font-weight="bold" fill="#1565c0" font-family="Arial, sans-serif">No Caching</text>
  <text x="110" y="458" font-size="17" fill="#444" font-family="Arial, sans-serif">Repeated expensive operations — Fix: Redis/Memcached for hot data</text>
  <rect x="80" y="500" width="1120" height="100" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="500" width="8" height="100" rx="4" fill="#43a047"/>
  <text x="110" y="545" font-size="20" font-weight="bold" fill="#2e7d32" font-family="Arial, sans-serif">Inefficient Algorithms</text>
  <text x="110" y="578" font-size="17" fill="#444" font-family="Arial, sans-serif">O(n^2) when O(n) exists — Fix: profile first, then optimise hot paths</text>
</svg>

  <ns0:text x="568.8889" y="80" text-anchor="middle" fill="white" font-size="23.1111" font-weight="bold" font-family="Arial, sans-serif">Common Performance Bottlenecks</ns0:text>
  <ns0:rect x="71.1111" y="124.4444" width="995.5556" height="88.8889" rx="8.8889" fill="#ffebee" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />

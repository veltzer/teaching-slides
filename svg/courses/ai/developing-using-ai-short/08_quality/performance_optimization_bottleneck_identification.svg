  <ns0:text x="97.7778" y="164.4444" font-size="17.7778" font-weight="bold" fill="#b71c1c" font-family="Arial, sans-serif">N+1 Queries</ns0:text>
  <ns0:text x="97.7778" y="193.7778" font-size="15.1111" fill="#444" font-family="Arial, sans-serif">100ms x 100 records = 10 seconds! — Fix: eager-load with JOIN or batch fetch</ns0:text>
  <ns0:rect x="71.1111" y="231.1111" width="995.5556" height="88.8889" rx="8.8889" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.7778" filter="url(#shadow)" />

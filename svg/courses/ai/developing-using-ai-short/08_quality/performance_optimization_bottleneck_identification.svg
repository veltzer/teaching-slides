  <ns0:text x="97.7778" y="271.1111" font-size="17.7778" font-weight="bold" fill="#e65100" font-family="Arial, sans-serif">Synchronous I/O</ns0:text>
  <ns0:text x="97.7778" y="300.4444" font-size="15.1111" fill="#444" font-family="Arial, sans-serif">Blocking operations stall the thread — Fix: async/await, non-blocking I/O</ns0:text>
  <ns0:rect x="71.1111" y="337.7778" width="995.5556" height="88.8889" rx="8.8889" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="71.1111" y="337.7778" width="7.1111" height="88.8889" rx="3.5556" fill="#1e88e5" />
  <ns0:text x="97.7778" y="377.7778" font-size="17.7778" font-weight="bold" fill="#1565c0" font-family="Arial, sans-serif">No Caching</ns0:text>
  <ns0:text x="97.7778" y="407.1111" font-size="15.1111" fill="#444" font-family="Arial, sans-serif">Repeated expensive operations — Fix: Redis/Memcached for hot data</ns0:text>
  <ns0:rect x="71.1111" y="444.4444" width="995.5556" height="88.8889" rx="8.8889" fill="#e8f5e9" stroke="#43a047" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="71.1111" y="444.4444" width="7.1111" height="88.8889" rx="3.5556" fill="#43a047" />
  <ns0:text x="97.7778" y="484.4444" font-size="17.7778" font-weight="bold" fill="#2e7d32" font-family="Arial, sans-serif">Inefficient Algorithms</ns0:text>
  <ns0:text x="97.7778" y="513.7778" font-size="15.1111" fill="#444" font-family="Arial, sans-serif">O(n^2) when O(n) exists — Fix: profile first, then optimise hot paths</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="17.7778" width="1084.4444" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="44.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">AI Context Window  (e.g. 200 000 tokens)</text>
  <rect x="35.5556" y="53.3333" width="266.6667" height="24.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="168.8889" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--bg)">System prompt / instructions</text>
  <rect x="309.3333" y="53.3333" width="213.3333" height="24.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="416" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--bg)">Open files (editor)</text>
  <rect x="529.7778" y="53.3333" width="177.7778" height="24.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="618.6667" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--bg)">Conversation history</text>
  <rect x="714.6667" y="53.3333" width="160" height="24.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="794.6667" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text)">Recent edits</text>
  <rect x="881.7778" y="53.3333" width="106.6667" height="24.8889" rx="6" fill="var(--border)" stroke-dasharray="3.5556 2.6667" />
  <text x="935.1111" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">available</text>
  <rect x="26.6667" y="124.4444" width="515.5556" height="408.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="284.4444" y="154.6667" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">Poor Context → Weak Suggestions</text>
  <rect x="44.4444" y="174.2222" width="480" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="44.4444" y="192" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">  You type: "add error handling"</text>
  <text x="44.4444" y="213.3333" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">  AI sees: only the current function</text>
  <text x="44.4444" y="234.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">  AI response: generic try/except</text>
  <text x="44.4444" y="252.4444" font-family="sans-serif" font-size="12.4444" fill="var(--danger-accent)">  ✗ Ignores existing error classes</text>
  <text x="284.4444" y="300.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--danger-accent)">What's missing from context:</text>
  <rect x="44.4444" y="311.1111" width="480" height="195.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="62.2222" y="336" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✗ Related modules not open</text>
  <text x="62.2222" y="357.3333" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✗ No docstrings / unclear variable names</text>
  <text x="62.2222" y="378.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✗ Custom exceptions defined elsewhere</text>
  <text x="62.2222" y="400" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✗ No type hints — AI guesses types</text>
  <text x="62.2222" y="421.3333" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✗ Vague prompt: "fix this"</text>
  <text x="62.2222" y="442.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✗ No tests — AI can't infer intent</text>
  <text x="62.2222" y="464" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✗ Giant single file — irrelevant code fills context</text>
  <text x="62.2222" y="494.2222" font-family="sans-serif" font-size="12.4444" fill="var(--danger-accent)">Result: hallucinated APIs, wrong patterns</text>
  <rect x="595.5556" y="124.4444" width="515.5556" height="408.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="853.3333" y="154.6667" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">Rich Context → Accurate Suggestions</text>
  <rect x="613.3333" y="174.2222" width="480" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="613.3333" y="192" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  You type: "add error handling using</text>
  <text x="613.3333" y="209.7778" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  DatabaseError from exceptions.py"</text>
  <text x="613.3333" y="231.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  AI sees: function + exceptions.py + tests</text>
  <text x="613.3333" y="252.4444" font-family="sans-serif" font-size="12.4444" fill="var(--ok-accent)">  ✓ Uses correct existing exception class</text>
  <text x="853.3333" y="300.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--ok-accent)">What helps the AI:</text>
  <rect x="613.3333" y="311.1111" width="480" height="195.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="631.1111" y="336" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Open related files in editor tabs</text>
  <text x="631.1111" y="357.3333" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Descriptive names: get_user_by_email()</text>
  <text x="631.1111" y="378.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Type hints everywhere</text>
  <text x="631.1111" y="400" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Docstrings explaining intent</text>
  <text x="631.1111" y="421.3333" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Tests that show expected behaviour</text>
  <text x="631.1111" y="442.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Specific prompt with existing patterns</text>
  <text x="631.1111" y="464" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Small, focused files (&lt;300 lines)</text>
  <text x="631.1111" y="494.2222" font-family="sans-serif" font-size="12.4444" fill="var(--ok-accent)">Result: correct, idiomatic, project-aware code</text>
  <rect x="26.6667" y="549.3333" width="1084.4444" height="37.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="572.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">The AI is only as good as the context you give it — treat the context window as a shared working memory</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="56.1111" width="1143.7499" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="80.2777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text)">AI Context Window  (e.g. 200 000 tokens)</text>
  <rect x="77.5" y="88.3333" width="281.25" height="22.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="218.125" y="103.6389" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--bg)">System prompt / instructions</text>
  <rect x="366.25" y="88.3333" width="225" height="22.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="478.75" y="103.6389" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--bg)">Open files (editor)</text>
  <rect x="598.75" y="88.3333" width="187.5" height="22.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="692.5" y="103.6389" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--bg)">Conversation history</text>
  <rect x="793.75" y="88.3333" width="168.75" height="22.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="878.125" y="103.6389" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text)">Recent edits</text>
  <rect x="970" y="88.3333" width="112.5" height="22.5556" rx="6" fill="var(--border)" stroke-dasharray="3.5556 2.6667" />
  <text x="1026.25" y="103.6389" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">available</text>
  <rect x="68.125" y="152.7777" width="543.75" height="370.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="339.9999" y="180.1667" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--danger-accent)">Poor Context → Weak Suggestions</text>
  <rect x="86.875" y="197.8889" width="506.25" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="86.875" y="214" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">  You type: "add error handling"</text>
  <text x="86.875" y="233.3333" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">  AI sees: only the current function</text>
  <text x="86.875" y="252.6667" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">  AI response: generic try/except</text>
  <text x="86.875" y="268.7777" font-family="sans-serif" font-size="12.1663" fill="var(--danger-accent)">  ✗ Ignores existing error classes</text>
  <text x="339.9999" y="312.2777" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--danger-accent)">What's missing from context:</text>
  <rect x="86.875" y="321.9444" width="506.25" height="177.2223" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="105.625" y="344.5" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✗ Related modules not open</text>
  <text x="105.625" y="363.8333" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✗ No docstrings / unclear variable names</text>
  <text x="105.625" y="383.1667" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✗ Custom exceptions defined elsewhere</text>
  <text x="105.625" y="402.5" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✗ No type hints — AI guesses types</text>
  <text x="105.625" y="421.8333" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✗ Vague prompt: "fix this"</text>
  <text x="105.625" y="441.1667" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✗ No tests — AI can't infer intent</text>
  <text x="105.625" y="460.5" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✗ Giant single file — irrelevant code fills context</text>
  <text x="105.625" y="487.8889" font-family="sans-serif" font-size="12.1663" fill="var(--danger-accent)">Result: hallucinated APIs, wrong patterns</text>
  <rect x="668.125" y="152.7777" width="543.75" height="370.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="939.9999" y="180.1667" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">Rich Context → Accurate Suggestions</text>
  <rect x="686.875" y="197.8889" width="506.25" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="686.875" y="214" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">  You type: "add error handling using</text>
  <text x="686.875" y="230.1111" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">  DatabaseError from exceptions.py"</text>
  <text x="686.875" y="249.4444" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">  AI sees: function + exceptions.py + tests</text>
  <text x="686.875" y="268.7777" font-family="sans-serif" font-size="12.1663" fill="var(--ok-accent)">  ✓ Uses correct existing exception class</text>
  <text x="939.9999" y="312.2777" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--ok-accent)">What helps the AI:</text>
  <rect x="686.875" y="321.9444" width="506.25" height="177.2223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="705.625" y="344.5" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✓ Open related files in editor tabs</text>
  <text x="705.625" y="363.8333" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✓ Descriptive names: get_user_by_email()</text>
  <text x="705.625" y="383.1667" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✓ Type hints everywhere</text>
  <text x="705.625" y="402.5" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✓ Docstrings explaining intent</text>
  <text x="705.625" y="421.8333" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✓ Tests that show expected behaviour</text>
  <text x="705.625" y="441.1667" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✓ Specific prompt with existing patterns</text>
  <text x="705.625" y="460.5" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✓ Small, focused files (&lt;300 lines)</text>
  <text x="705.625" y="487.8889" font-family="sans-serif" font-size="12.1663" fill="var(--ok-accent)">Result: correct, idiomatic, project-aware code</text>
  <rect x="68.125" y="537.8333" width="1143.7499" height="33.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="558.7777" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">The AI is only as good as the context you give it — treat the context window as a shared working memory</text>
</svg>
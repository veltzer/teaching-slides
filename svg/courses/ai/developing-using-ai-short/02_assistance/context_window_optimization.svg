<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.007905213065" font-weight="bold" fill="var(--text)">Context Window Optimization</text>

  <rect x="40" y="71.926605504587" width="1200" height="42.56880733945" rx="6.241897251136" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="98.532110091743" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--text)">Context = system + files + history + edits</text>

  <rect x="40" y="135.779816513761" width="589.830508474576" height="446.97247706422" rx="8.322529668181" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="334.915254237288" y="173.02752293578" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.725691753407" font-weight="bold" fill="var(--danger-text)">Poor Context</text>
  <text x="334.915254237288" y="204.954128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--danger-text)">Weak suggestions</text>

  <text x="60.338983050847" y="247.522935779817" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--danger-text)">Related files not open</text>
  <text x="60.338983050847" y="279.449541284404" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--danger-text)">Unclear variable names</text>
  <text x="60.338983050847" y="311.376146788991" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--danger-text)">No docstrings</text>
  <text x="60.338983050847" y="343.302752293578" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--danger-text)">No type hints</text>
  <text x="60.338983050847" y="375.229357798165" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--danger-text)">Vague prompts</text>
  <text x="60.338983050847" y="407.155963302752" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--danger-text)">No tests</text>
  <text x="60.338983050847" y="439.082568807339" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--danger-text)">Giant single files</text>

  <text x="334.915254237288" y="508.256880733945" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" font-weight="bold" fill="var(--danger-text)">Result:</text>
  <text x="334.915254237288" y="540.183486238532" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--danger-text)">Hallucinated APIs</text>
  <text x="334.915254237288" y="566.788990825688" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--danger-text)">Wrong patterns</text>

  <rect x="650.169491525424" y="135.779816513761" width="589.830508474576" height="446.97247706422" rx="8.322529668181" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.084745762712" y="173.02752293578" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.725691753407" font-weight="bold" fill="var(--ok-text)">Rich Context</text>
  <text x="945.084745762712" y="204.954128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--ok-text)">Accurate suggestions</text>

  <text x="670.508474576271" y="247.522935779817" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--ok-text)">Open related files</text>
  <text x="670.508474576271" y="279.449541284404" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--ok-text)">Descriptive names</text>
  <text x="670.508474576271" y="311.376146788991" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--ok-text)">Type hints</text>
  <text x="670.508474576271" y="343.302752293578" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--ok-text)">Docstrings</text>
  <text x="670.508474576271" y="375.229357798165" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--ok-text)">Tests showing intent</text>
  <text x="670.508474576271" y="407.155963302752" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--ok-text)">Specific prompts</text>
  <text x="670.508474576271" y="439.082568807339" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--ok-text)">Small focused files</text>

  <text x="945.084745762712" y="508.256880733945" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" font-weight="bold" fill="var(--ok-text)">Result:</text>
  <text x="945.084745762712" y="540.183486238532" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--ok-text)">Correct, idiomatic</text>
  <text x="945.084745762712" y="566.788990825688" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--ok-text)">Project-aware code</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--text-muted)">AI is only as good as the context</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" />
  <rect x="26.6667" y="17.7778" width="1084.4444" height="71.1111" rx="7.1111" fill="var(--surface-dark)" stroke="var(--border)" stroke-width="1.3333" />
  <text x="568.8889" y="44.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">AI Context Window  (e.g. 200 000 tokens)</text>
  <rect x="35.5556" y="53.3333" width="266.6667" height="24.8889" rx="2.6667" fill="url(#grad-primary)" />
  <text x="168.8889" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--bg)">System prompt / instructions</text>
  <rect x="309.3333" y="53.3333" width="213.3333" height="24.8889" rx="2.6667" fill="var(--primary-mid)" />
  <text x="416" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--bg)">Open files (editor)</text>
  <rect x="529.7778" y="53.3333" width="177.7778" height="24.8889" rx="2.6667" fill="var(--primary-bright)" />
  <text x="618.6667" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--bg)">Conversation history</text>
  <rect x="714.6667" y="53.3333" width="160" height="24.8889" rx="2.6667" fill="var(--primary-tint)" />
  <text x="794.6667" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-dark)">Recent edits</text>
  <rect x="881.7778" y="53.3333" width="106.6667" height="24.8889" rx="2.6667" fill="var(--border)" stroke-dasharray="3.5556 2.6667" />
  <text x="935.1111" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">available</text>
  <rect x="26.6667" y="124.4444" width="515.5556" height="408.8889" rx="7.1111" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="1.7778" />
  <text x="284.4444" y="154.6667" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--danger-dk)">Poor Context → Weak Suggestions</text>
  <rect x="44.4444" y="174.2222" width="480" height="88.8889" rx="5.3333" fill="var(--surface-dark)" stroke="var(--border)" stroke-width="1.3333" />
  <text x="44.4444" y="192" font-family="sans-serif" font-size="12.4444" fill="var(--text-disabled)">  You type: "add error handling"</text>
  <text x="44.4444" y="213.3333" font-family="sans-serif" font-size="12.4444" fill="var(--text-disabled)">  AI sees: only the current function</text>
  <text x="44.4444" y="234.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-disabled)">  AI response: generic try/except</text>
  <text x="44.4444" y="252.4444" font-family="sans-serif" font-size="12.4444" fill="var(--danger-dk)">  ✗ Ignores existing error classes</text>
  <text x="284.4444" y="300.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--danger-dk)">What's missing from context:</text>
  <rect x="44.4444" y="311.1111" width="480" height="195.5556" rx="3.5556" fill="var(--danger-lt)" stroke="var(--danger-dk)" stroke-width="0.8889" />
  <text x="62.2222" y="336" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✗ Related modules not open</text>
  <text x="62.2222" y="357.3333" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✗ No docstrings / unclear variable names</text>
  <text x="62.2222" y="378.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✗ Custom exceptions defined elsewhere</text>
  <text x="62.2222" y="400" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✗ No type hints — AI guesses types</text>
  <text x="62.2222" y="421.3333" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✗ Vague prompt: "fix this"</text>
  <text x="62.2222" y="442.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✗ No tests — AI can't infer intent</text>
  <text x="62.2222" y="464" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✗ Giant single file — irrelevant code fills context</text>
  <text x="62.2222" y="494.2222" font-family="sans-serif" font-size="12.4444" fill="var(--danger-dk)">Result: hallucinated APIs, wrong patterns</text>
  <rect x="595.5556" y="124.4444" width="515.5556" height="408.8889" rx="7.1111" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.7778" />
  <text x="853.3333" y="154.6667" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--ok-dk)">Rich Context → Accurate Suggestions</text>
  <rect x="613.3333" y="174.2222" width="480" height="88.8889" rx="5.3333" fill="var(--surface-dark)" stroke="var(--ok-dk)" stroke-width="1.3333" />
  <text x="613.3333" y="192" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  You type: "add error handling using</text>
  <text x="613.3333" y="209.7778" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  DatabaseError from exceptions.py"</text>
  <text x="613.3333" y="231.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  AI sees: function + exceptions.py + tests</text>
  <text x="613.3333" y="252.4444" font-family="sans-serif" font-size="12.4444" fill="var(--ok-dk)">  ✓ Uses correct existing exception class</text>
  <text x="853.3333" y="300.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--ok-dk)">What helps the AI:</text>
  <rect x="613.3333" y="311.1111" width="480" height="195.5556" rx="3.5556" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="0.8889" />
  <text x="631.1111" y="336" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Open related files in editor tabs</text>
  <text x="631.1111" y="357.3333" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Descriptive names: get_user_by_email()</text>
  <text x="631.1111" y="378.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Type hints everywhere</text>
  <text x="631.1111" y="400" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Docstrings explaining intent</text>
  <text x="631.1111" y="421.3333" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Tests that show expected behaviour</text>
  <text x="631.1111" y="442.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Specific prompt with existing patterns</text>
  <text x="631.1111" y="464" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Small, focused files (&lt;300 lines)</text>
  <text x="631.1111" y="494.2222" font-family="sans-serif" font-size="12.4444" fill="var(--ok-dk)">Result: correct, idiomatic, project-aware code</text>
  <rect x="26.6667" y="549.3333" width="1084.4444" height="37.3333" rx="5.3333" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <text x="568.8889" y="572.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-dk)">The AI is only as good as the context you give it — treat the context window as a shared working memory</text>
</svg>
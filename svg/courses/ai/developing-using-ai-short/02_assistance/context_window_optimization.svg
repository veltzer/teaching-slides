<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1199.999895" height="72.499958" rx="6.518574" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="67.187428" text-anchor="middle" font-size="15.106144" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AI Context Window  (e.g. 200 000 tokens)</text>
  <rect x="49.836066" y="76.249979" width="295.081967" height="25.375053" rx="6.518574" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.377049" y="93.468781" text-anchor="middle" font-size="12.273823" fill="var(--bg)" font-family="Arial, sans-serif">System prompt / instructions</text>
  <rect x="352.786885" y="76.249979" width="236.065574" height="25.375053" rx="6.518574" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470.819672" y="93.468781" text-anchor="middle" font-size="12.273823" fill="var(--bg)" font-family="Arial, sans-serif">Open files (editor)</text>
  <rect x="596.721311" y="76.249979" width="196.721311" height="25.375053" rx="6.518574" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="695.081967" y="93.468781" text-anchor="middle" font-size="12.273823" fill="var(--bg)" font-family="Arial, sans-serif">Conversation history</text>
  <rect x="801.311475" y="76.249979" width="177.04918" height="25.375053" rx="6.518574" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="889.836066" y="93.468781" text-anchor="middle" font-size="12.273823" fill="var(--text)" font-family="Arial, sans-serif">Recent edits</text>
  <rect x="986.229508" y="76.249979" width="118.032787" height="25.375053" rx="6.518574" fill="var(--border)" stroke-dasharray="3.5556 2.6667" />
  <text x="1045.245902" y="93.468781" text-anchor="middle" font-size="12.273823" fill="var(--text-faint)" font-family="Arial, sans-serif">available</text>
  <rect x="40" y="148.749937" width="570.491803" height="416.875095" rx="6.518574" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.245797" y="179.562565" text-anchor="middle" font-size="18.882788" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Poor Context → Weak Suggestions</text>
  <rect x="59.672131" y="199.500042" width="531.147541" height="90.62506" rx="6.518574" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="59.672131" y="217.625032" font-size="13.217821" fill="var(--text-faint)" font-family="Arial, sans-serif">  You type: "add error handling"</text>
  <text x="59.672131" y="239.374996" font-size="13.217821" fill="var(--text-faint)" font-family="Arial, sans-serif">  AI sees: only the current function</text>
  <text x="59.672131" y="261.125074" font-size="13.217821" fill="var(--text-faint)" font-family="Arial, sans-serif">  AI response: generic try/except</text>
  <text x="59.672131" y="279.249951" font-size="13.217821" fill="var(--danger-accent)" font-family="Arial, sans-serif">  ✗ Ignores existing error classes</text>
  <text x="325.245797" y="328.187456" text-anchor="middle" font-size="14.162037" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">What's missing from context:</text>
  <rect x="59.672131" y="339.062495" width="531.147541" height="199.375109" rx="6.518574" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="79.344262" y="364.437547" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">✗ Related modules not open</text>
  <text x="79.344262" y="386.187512" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">✗ No docstrings / unclear variable names</text>
  <text x="79.344262" y="407.93759" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">✗ Custom exceptions defined elsewhere</text>
  <text x="79.344262" y="429.687554" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">✗ No type hints — AI guesses types</text>
  <text x="79.344262" y="451.437519" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">✗ Vague prompt: "fix this"</text>
  <text x="79.344262" y="473.187597" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">✗ No tests — AI can't infer intent</text>
  <text x="79.344262" y="494.937562" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">✗ Giant single file — irrelevant code fills context</text>
  <text x="79.344262" y="525.750077" font-size="13.217821" fill="var(--danger-accent)" font-family="Arial, sans-serif">Result: hallucinated APIs, wrong patterns</text>
  <rect x="669.508197" y="148.749937" width="570.491803" height="416.875095" rx="6.518574" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="954.753993" y="179.562565" text-anchor="middle" font-size="18.882788" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Rich Context → Accurate Suggestions</text>
  <rect x="689.180328" y="199.500042" width="531.147541" height="90.62506" rx="6.518574" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="689.180328" y="217.625032" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">  You type: "add error handling using</text>
  <text x="689.180328" y="235.750021" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">  DatabaseError from exceptions.py"</text>
  <text x="689.180328" y="257.499986" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">  AI sees: function + exceptions.py + tests</text>
  <text x="689.180328" y="279.249951" font-size="13.217821" fill="var(--ok-accent)" font-family="Arial, sans-serif">  ✓ Uses correct existing exception class</text>
  <text x="954.753993" y="328.187456" text-anchor="middle" font-size="14.162037" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">What helps the AI:</text>
  <rect x="689.180328" y="339.062495" width="531.147541" height="199.375109" rx="6.518574" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="708.852459" y="364.437547" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">✓ Open related files in editor tabs</text>
  <text x="708.852459" y="386.187512" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">✓ Descriptive names: get_user_by_email()</text>
  <text x="708.852459" y="407.93759" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">✓ Type hints everywhere</text>
  <text x="708.852459" y="429.687554" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">✓ Docstrings explaining intent</text>
  <text x="708.852459" y="451.437519" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">✓ Tests that show expected behaviour</text>
  <text x="708.852459" y="473.187597" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">✓ Specific prompt with existing patterns</text>
  <text x="708.852459" y="494.937562" font-size="13.217821" fill="var(--text-muted)" font-family="Arial, sans-serif">✓ Small, focused files (&lt;300 lines)</text>
  <text x="708.852459" y="525.750077" font-size="13.217821" fill="var(--ok-accent)" font-family="Arial, sans-serif">Result: correct, idiomatic, project-aware code</text>
  <rect x="40" y="581.937533" width="1199.999895" height="38.062467" rx="6.518574" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="605.499986" text-anchor="middle" font-size="15.106144" fill="var(--primary-accent)" font-family="Arial, sans-serif">The AI is only as good as the context you give it — treat the context window as a shared working memory</text>
</svg>
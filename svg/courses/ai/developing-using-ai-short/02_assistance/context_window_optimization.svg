<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-3.5556%" y="-7.1111%" width="96%" height="110.2222%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow-accent" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="17.7778" width="1084.4444" height="71.1111" rx="7.1111" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="44.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#212121">AI Context Window  (e.g. 200 000 tokens)</ns0:text>
  <ns0:rect x="35.5556" y="53.3333" width="266.6667" height="24.8889" rx="2.6667" fill="url(#grad-accent)" />
  <ns0:text x="168.8889" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#ffffff">System prompt / instructions</ns0:text>
  <ns0:rect x="309.3333" y="53.3333" width="213.3333" height="24.8889" rx="2.6667" fill="#1976d2" />
  <ns0:text x="416" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#ffffff">Open files (editor)</ns0:text>
  <ns0:rect x="529.7778" y="53.3333" width="177.7778" height="24.8889" rx="2.6667" fill="#42a5f5" />
  <ns0:text x="618.6667" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#ffffff">Conversation history</ns0:text>
  <ns0:rect x="714.6667" y="53.3333" width="160" height="24.8889" rx="2.6667" fill="#90caf9" />
  <ns0:text x="794.6667" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#333">Recent edits</ns0:text>
  <ns0:rect x="881.7778" y="53.3333" width="106.6667" height="24.8889" rx="2.6667" fill="#e0e0e0" stroke-dasharray="3.5556 2.6667" />
  <ns0:text x="935.1111" y="70.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">available</ns0:text>
  <ns0:rect x="26.6667" y="124.4444" width="515.5556" height="408.8889" rx="7.1111" fill="#ffebee" stroke="#c62828" stroke-width="1.7778" />
  <ns0:text x="284.4444" y="154.6667" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#c62828">Poor Context → Weak Suggestions</ns0:text>
  <ns0:rect x="44.4444" y="174.2222" width="480" height="88.8889" rx="5.3333" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="44.4444" y="192" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">  You type: "add error handling"</ns0:text>
  <ns0:text x="44.4444" y="213.3333" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">  AI sees: only the current function</ns0:text>
  <ns0:text x="44.4444" y="234.6667" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">  AI response: generic try/except</ns0:text>
  <ns0:text x="44.4444" y="252.4444" font-family="sans-serif" font-size="12.4444" fill="#c62828">  ✗ Ignores existing error classes</ns0:text>
  <ns0:text x="284.4444" y="300.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#c62828">What's missing from context:</ns0:text>
  <ns0:rect x="44.4444" y="311.1111" width="480" height="195.5556" rx="3.5556" fill="#ffcdd2" stroke="#c62828" stroke-width="0.8889" />
  <ns0:text x="62.2222" y="336" font-family="sans-serif" font-size="12.4444" fill="#555555">✗ Related modules not open</ns0:text>
  <ns0:text x="62.2222" y="357.3333" font-family="sans-serif" font-size="12.4444" fill="#555555">✗ No docstrings / unclear variable names</ns0:text>
  <ns0:text x="62.2222" y="378.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">✗ Custom exceptions defined elsewhere</ns0:text>
  <ns0:text x="62.2222" y="400" font-family="sans-serif" font-size="12.4444" fill="#555555">✗ No type hints — AI guesses types</ns0:text>
  <ns0:text x="62.2222" y="421.3333" font-family="sans-serif" font-size="12.4444" fill="#555555">✗ Vague prompt: "fix this"</ns0:text>
  <ns0:text x="62.2222" y="442.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">✗ No tests — AI can't infer intent</ns0:text>
  <ns0:text x="62.2222" y="464" font-family="sans-serif" font-size="12.4444" fill="#555555">✗ Giant single file — irrelevant code fills context</ns0:text>
  <ns0:text x="62.2222" y="494.2222" font-family="sans-serif" font-size="12.4444" fill="#c62828">Result: hallucinated APIs, wrong patterns</ns0:text>
  <ns0:rect x="595.5556" y="124.4444" width="515.5556" height="408.8889" rx="7.1111" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7778" />
  <ns0:text x="853.3333" y="154.6667" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#2e7d32">Rich Context → Accurate Suggestions</ns0:text>
  <ns0:rect x="613.3333" y="174.2222" width="480" height="88.8889" rx="5.3333" fill="#f2f2f2" stroke="#2e7d32" stroke-width="1.3333" />
  <ns0:text x="613.3333" y="192" font-family="sans-serif" font-size="12.4444" fill="#555555">  You type: "add error handling using</ns0:text>
  <ns0:text x="613.3333" y="209.7778" font-family="sans-serif" font-size="12.4444" fill="#555555">  DatabaseError from exceptions.py"</ns0:text>
  <ns0:text x="613.3333" y="231.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">  AI sees: function + exceptions.py + tests</ns0:text>
  <ns0:text x="613.3333" y="252.4444" font-family="sans-serif" font-size="12.4444" fill="#2e7d32">  ✓ Uses correct existing exception class</ns0:text>
  <ns0:text x="853.3333" y="300.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#2e7d32">What helps the AI:</ns0:text>
  <ns0:rect x="613.3333" y="311.1111" width="480" height="195.5556" rx="3.5556" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8889" />
  <ns0:text x="631.1111" y="336" font-family="sans-serif" font-size="12.4444" fill="#555555">✓ Open related files in editor tabs</ns0:text>
  <ns0:text x="631.1111" y="357.3333" font-family="sans-serif" font-size="12.4444" fill="#555555">✓ Descriptive names: get_user_by_email()</ns0:text>
  <ns0:text x="631.1111" y="378.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">✓ Type hints everywhere</ns0:text>
  <ns0:text x="631.1111" y="400" font-family="sans-serif" font-size="12.4444" fill="#555555">✓ Docstrings explaining intent</ns0:text>
  <ns0:text x="631.1111" y="421.3333" font-family="sans-serif" font-size="12.4444" fill="#555555">✓ Tests that show expected behaviour</ns0:text>
  <ns0:text x="631.1111" y="442.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">✓ Specific prompt with existing patterns</ns0:text>
  <ns0:text x="631.1111" y="464" font-family="sans-serif" font-size="12.4444" fill="#555555">✓ Small, focused files (&lt;300 lines)</ns0:text>
  <ns0:text x="631.1111" y="494.2222" font-family="sans-serif" font-size="12.4444" fill="#2e7d32">Result: correct, idiomatic, project-aware code</ns0:text>
  <ns0:rect x="26.6667" y="549.3333" width="1084.4444" height="37.3333" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="572.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#1565c0">The AI is only as good as the context you give it — treat the context window as a shared working memory</ns0:text>
</ns0:svg>
  <rect x="541.6595" y="95.9804" width="196.681" height="63.9213" rx="4.7019" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="1.4161" />
  <text x="640" y="131.3829" text-anchor="middle" fill="var(--bg)" font-size="10.8175" font-weight="bold" font-family="Arial, sans-serif">Implement</text>

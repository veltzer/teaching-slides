<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Top row: 3 steps -->
  <rect x="60" y="80" width="300" height="130" rx="12" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="210" y="152" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Requirements</text>
  <text x="210" y="182" text-anchor="middle" fill="#bbdefb" font-size="15" font-family="Arial, sans-serif">Clarify &amp; document</text>
  <line x1="360" y1="145" x2="430" y2="145" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <rect x="440" y="80" width="300" height="130" rx="12" fill="#43a047" filter="url(#shadow)"/>
  <text x="590" y="152" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Design</text>
  <text x="590" y="182" text-anchor="middle" fill="#c8e6c9" font-size="15" font-family="Arial, sans-serif">Architecture &amp; API</text>
  <line x1="740" y1="145" x2="810" y2="145" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <rect x="820" y="80" width="400" height="130" rx="12" fill="#e53935" filter="url(#shadow)"/>
  <text x="1020" y="152" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Implement</text>
  <text x="1020" y="182" text-anchor="middle" fill="#ffcdd2" font-size="15" font-family="Arial, sans-serif">Code with AI assistance</text>
  <!-- Bottom row: 3 steps -->
  <rect x="200" y="310" width="260" height="130" rx="12" fill="#f57c00" filter="url(#shadow)"/>
  <text x="330" y="382" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="330" y="412" text-anchor="middle" fill="#ffe0b2" font-size="15" font-family="Arial, sans-serif">Unit + integration</text>
  <rect x="510" y="310" width="260" height="130" rx="12" fill="#8e24aa" filter="url(#shadow)"/>
  <text x="640" y="382" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Review</text>
  <text x="640" y="412" text-anchor="middle" fill="#e1bee7" font-size="15" font-family="Arial, sans-serif">AI + human PR review</text>
  <rect x="820" y="310" width="260" height="130" rx="12" fill="#00897b" filter="url(#shadow)"/>
  <text x="950" y="382" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="950" y="412" text-anchor="middle" fill="#b2dfdb" font-size="15" font-family="Arial, sans-serif">CI/CD pipeline</text>
  <!-- Arrows between rows -->
  <path d="M 1020 210 Q 1020 280 950 310" stroke="#1565c0" stroke-width="2.5" fill="none" marker-end="url(#arrow-accent)"/>
  <line x1="460" y1="375" x2="510" y2="375" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="770" y1="375" x2="820" y2="375" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <!-- AI role banner -->
  <rect x="60" y="480" width="1160" height="100" rx="12" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="520" text-anchor="middle" fill="#1565c0" font-size="20" font-weight="bold" font-family="Arial, sans-serif">AI Accelerates Every Stage</text>
  <text x="640" y="555" text-anchor="middle" fill="#444" font-size="16" font-family="Arial, sans-serif">Requirements clarification, boilerplate generation, test creation, review automation</text>
</svg>

  <text x="453.153" y="312.3294" text-anchor="middle" fill="var(--primary-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">AI Accelerates Every Stage</text>
  <text x="453.153" y="329.539" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Requirements clarification, boilerplate generation, test creation, review automation</text>

  <line x1="353.1215" y1="163.1731" x2="383.548" y2="163.1731" stroke="var(--primary-border)" stroke-width="0.8342" marker-end="url(#arrow-primary)" />
  <rect x="387.8946" y="134.9199" width="130.3993" height="56.5063" rx="5.304" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="1.2518" />
  <text x="453.0943" y="166.2157" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Design</text>
  <text x="453.0943" y="179.2556" text-anchor="middle" fill="var(--ok-accent)" font-size="10" font-family="Arial, sans-serif">Architecture &amp; API</text>
  <line x1="518.294" y1="163.1731" x2="548.7204" y2="163.1731" stroke="var(--primary-border)" stroke-width="0.8342" marker-end="url(#arrow-primary)" />
  <rect x="553.0671" y="134.9199" width="173.8658" height="56.5063" rx="5.304" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="1.2518" />
  <text x="640" y="166.2157" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Implement</text>
  <text x="640" y="179.2556" text-anchor="middle" fill="var(--danger-accent)" font-size="10" font-family="Arial, sans-serif">Code with AI assistance</text>
  <rect x="283.5751" y="234.8927" width="113.0128" height="56.5063" rx="5.304" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="1.2518" />
  <text x="340.0814" y="266.1885" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="340.0814" y="279.2285" text-anchor="middle" fill="var(--warn-accent)" font-size="10" font-family="Arial, sans-serif">Unit + integration</text>
  <rect x="418.3211" y="234.8927" width="113.0128" height="56.5063" rx="5.304" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="1.2518" />
  <text x="474.8275" y="266.1885" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Review</text>
  <text x="474.8275" y="279.2285" text-anchor="middle" fill="var(--info-accent)" font-size="10" font-family="Arial, sans-serif">AI + human PR review</text>
  <rect x="553.0671" y="234.8927" width="113.0128" height="56.5063" rx="5.304" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="1.2518" />
  <text x="609.5735" y="266.1885" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="609.5735" y="279.2285" text-anchor="middle" fill="var(--ok-accent)" font-size="10" font-family="Arial, sans-serif">CI/CD pipeline</text>
  <path d="M 640 191.4262 Q 640 221.8528 609.5735 234.8927" stroke="var(--primary-border)" stroke-width="0.6951" fill="none" marker-end="url(#arrow-primary)" />
  <line x1="396.5879" y1="263.1459" x2="418.3211" y2="263.1459" stroke="var(--primary-border)" stroke-width="0.6951" marker-end="url(#arrow-primary)" />
  <line x1="531.3339" y1="263.1459" x2="553.0671" y2="263.1459" stroke="var(--primary-border)" stroke-width="0.6951" marker-end="url(#arrow-primary)" />
  <rect x="222.7221" y="308.7857" width="504.2108" height="43.4664" rx="5.304" fill="var(--surface)" stroke="var(--border)" stroke-width="0.6259" filter="url(#shadow)" />
  <text x="474.8275" y="326.1722" text-anchor="middle" fill="var(--primary-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">AI Accelerates Every Stage</text>
  <text x="474.8275" y="341.3855" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Requirements clarification, boilerplate generation, test creation, review automation</text>

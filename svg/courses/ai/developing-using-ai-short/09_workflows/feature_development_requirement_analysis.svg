<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="888.889" height="500" fill="var(--bg)" rx="6.6406"/>
  <rect x="237.2222" y="135.5556" width="208.3333" height="90.2777" rx="6.6406" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="341.3889" y="185.5555" text-anchor="middle" fill="var(--bg)" font-size="15.2778" font-weight="bold" font-family="Arial, sans-serif">Requirements</text>
  <text x="341.3889" y="206.3889" text-anchor="middle" fill="var(--primary-accent)" font-size="11.0677" font-family="Arial, sans-serif">Clarify &amp; document</text>
  <line x1="445.5556" y1="180.6945" x2="494.1666" y2="180.6945" stroke="var(--primary-border)" stroke-width="1.8824" marker-end="url(#arrow-primary)" />
  <rect x="501.111" y="135.5556" width="208.3333" height="90.2777" rx="6.6406" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="605.2778" y="185.5555" text-anchor="middle" fill="var(--bg)" font-size="15.2778" font-weight="bold" font-family="Arial, sans-serif">Design</text>
  <text x="605.2778" y="206.3889" text-anchor="middle" fill="var(--ok-accent)" font-size="11.0677" font-family="Arial, sans-serif">Architecture &amp; API</text>
  <line x1="709.4444" y1="180.6945" x2="758.0555" y2="180.6945" stroke="var(--primary-border)" stroke-width="1.8824" marker-end="url(#arrow-primary)" />
  <rect x="765" y="135.5556" width="277.7778" height="90.2777" rx="6.6406" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="903.8889" y="185.5555" text-anchor="middle" fill="var(--bg)" font-size="15.2778" font-weight="bold" font-family="Arial, sans-serif">Implement</text>
  <text x="903.8889" y="206.3889" text-anchor="middle" fill="var(--danger-accent)" font-size="11.0677" font-family="Arial, sans-serif">Code with AI assistance</text>
  <rect x="334.4444" y="295.2778" width="180.5556" height="90.2777" rx="6.6406" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="424.7222" y="345.2778" text-anchor="middle" fill="var(--bg)" font-size="15.2778" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="424.7222" y="366.1111" text-anchor="middle" fill="var(--warn-accent)" font-size="11.0677" font-family="Arial, sans-serif">Unit + integration</text>
  <rect x="549.7222" y="295.2778" width="180.5556" height="90.2777" rx="6.6406" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="639.9999" y="345.2778" text-anchor="middle" fill="var(--bg)" font-size="15.2778" font-weight="bold" font-family="Arial, sans-serif">Review</text>
  <text x="639.9999" y="366.1111" text-anchor="middle" fill="var(--info-accent)" font-size="11.0677" font-family="Arial, sans-serif">AI + human PR review</text>
  <rect x="765" y="295.2778" width="180.5556" height="90.2777" rx="6.6406" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="855.2777" y="345.2778" text-anchor="middle" fill="var(--bg)" font-size="15.2778" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="855.2777" y="366.1111" text-anchor="middle" fill="var(--ok-accent)" font-size="11.0677" font-family="Arial, sans-serif">CI/CD pipeline</text>
  <path d="M 903.8889 225.8333 Q 903.8889 274.4445 855.2777 295.2778" stroke="var(--primary-border)" stroke-width="1.5686" fill="none" marker-end="url(#arrow-primary)" />
  <line x1="515" y1="340.4167" x2="549.7222" y2="340.4167" stroke="var(--primary-border)" stroke-width="1.5686" marker-end="url(#arrow-primary)" />
  <line x1="730.2778" y1="340.4167" x2="765" y2="340.4167" stroke="var(--primary-border)" stroke-width="1.5686" marker-end="url(#arrow-primary)" />
  <rect x="237.2222" y="413.3334" width="805.5555" height="69.4444" rx="6.6406" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="639.9999" y="441.1111" text-anchor="middle" fill="var(--primary-accent)" font-size="13.8889" font-weight="bold" font-family="Arial, sans-serif">AI Accelerates Every Stage</text>
  <text x="639.9999" y="465.4167" text-anchor="middle" fill="var(--text)" font-size="11.1111" font-family="Arial, sans-serif">Requirements clarification, boilerplate generation, test creation, review automation</text>
</svg>
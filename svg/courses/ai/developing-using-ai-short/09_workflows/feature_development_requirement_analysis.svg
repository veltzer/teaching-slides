  <rect x="236.8039" y="209.0719" width="127.8427" height="63.9213" rx="4.7019" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="1.4161" />
  <text x="300.7252" y="244.4745" text-anchor="middle" fill="var(--bg)" font-size="10.8175" font-weight="bold" font-family="Arial, sans-serif">Test</text>

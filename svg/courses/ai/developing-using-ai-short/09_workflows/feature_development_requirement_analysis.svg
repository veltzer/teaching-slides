  <rect x="354.8125" y="95.9804" width="147.5107" height="63.9213" rx="4.7019" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="1.4161" />
  <text x="428.5679" y="131.3829" text-anchor="middle" fill="var(--bg)" font-size="10.8175" font-weight="bold" font-family="Arial, sans-serif">Design</text>

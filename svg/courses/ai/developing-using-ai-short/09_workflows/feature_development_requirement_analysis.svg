  <text x="453.153" y="259.2256" text-anchor="middle" fill="var(--info-accent)" font-size="10" font-family="Arial, sans-serif">AI + human PR review</text>
  <rect x="541.6595" y="209.0719" width="127.8427" height="63.9213" rx="4.7019" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="1.4161" />
  <text x="605.5808" y="244.4745" text-anchor="middle" fill="var(--bg)" font-size="10.8175" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="605.5808" y="259.2256" text-anchor="middle" fill="var(--ok-accent)" font-size="10" font-family="Arial, sans-serif">CI/CD pipeline</text>
  <path d="M 640 159.9016 Q 640 194.3209 605.5808 209.0719" stroke="var(--primary-border)" stroke-width="1.1106" fill="none" marker-end="url(#arrow-primary)" />
  <line x1="364.6466" y1="241.0326" x2="389.2317" y2="241.0326" stroke="var(--primary-border)" stroke-width="1.1106" marker-end="url(#arrow-primary)" />
  <line x1="517.0744" y1="241.0326" x2="541.6595" y2="241.0326" stroke="var(--primary-border)" stroke-width="1.1106" marker-end="url(#arrow-primary)" />

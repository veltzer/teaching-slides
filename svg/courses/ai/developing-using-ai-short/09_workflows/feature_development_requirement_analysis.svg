<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="918.4406" height="515.301" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="407.6633" y="262.1521" width="215.2594" height="93.0403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="515.2931" y="313.6821" text-anchor="middle" fill="var(--bg)" font-size="16.4866" font-weight="bold" font-family="Arial, sans-serif">Requirements</text>
  <text x="515.2931" y="335.153" text-anchor="middle" fill="var(--primary-accent)" font-size="16.4866" font-family="Arial, sans-serif">Clarify &amp; document</text>
  <line x1="622.9229" y1="308.6723" x2="673.15" y2="308.6723" stroke="var(--primary-border)" stroke-width="0.8342" marker-end="url(#arrow-primary)" />
  <rect x="680.3253" y="262.1521" width="215.2594" height="93.0403" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.9551" y="313.6821" text-anchor="middle" fill="var(--bg)" font-size="16.4866" font-weight="bold" font-family="Arial, sans-serif">Design</text>
  <text x="787.9551" y="335.153" text-anchor="middle" fill="var(--ok-accent)" font-size="16.4866" font-family="Arial, sans-serif">Architecture &amp; API</text>
  <line x1="895.5849" y1="308.6723" x2="945.8119" y2="308.6723" stroke="var(--primary-border)" stroke-width="0.8342" marker-end="url(#arrow-primary)" />
  <rect x="952.9873" y="262.1521" width="287.0127" height="93.0403" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1096.4937" y="313.6821" text-anchor="middle" fill="var(--bg)" font-size="16.4866" font-weight="bold" font-family="Arial, sans-serif">Implement</text>
  <text x="1096.4937" y="335.153" text-anchor="middle" fill="var(--danger-accent)" font-size="16.4866" font-family="Arial, sans-serif">Code with AI assistance</text>
  <rect x="508.1176" y="426.7621" width="186.5583" height="93.0403" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="601.3966" y="478.2921" text-anchor="middle" fill="var(--bg)" font-size="16.4866" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="601.3966" y="499.7631" text-anchor="middle" fill="var(--warn-accent)" font-size="16.4866" font-family="Arial, sans-serif">Unit + integration</text>
  <rect x="730.5525" y="426.7621" width="186.5583" height="93.0403" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="823.8316" y="478.2921" text-anchor="middle" fill="var(--bg)" font-size="16.4866" font-weight="bold" font-family="Arial, sans-serif">Review</text>
  <text x="823.8316" y="499.7631" text-anchor="middle" fill="var(--info-accent)" font-size="16.4866" font-family="Arial, sans-serif">AI + human PR review</text>
  <rect x="952.9873" y="426.7621" width="186.5583" height="93.0403" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.2665" y="478.2921" text-anchor="middle" fill="var(--bg)" font-size="16.4866" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="1046.2665" y="499.7631" text-anchor="middle" fill="var(--ok-accent)" font-size="16.4866" font-family="Arial, sans-serif">CI/CD pipeline</text>
  <path d="M 1096.4937 355.1924 Q 1096.4937 405.2913 1046.2665 426.7621" stroke="var(--primary-border)" stroke-width="0.6951" fill="none" marker-end="url(#arrow-primary)" />
  <line x1="694.6759" y1="473.2824" x2="730.5525" y2="473.2824" stroke="var(--primary-border)" stroke-width="0.6951" marker-end="url(#arrow-primary)" />
  <line x1="917.1108" y1="473.2824" x2="952.9873" y2="473.2824" stroke="var(--primary-border)" stroke-width="0.6951" marker-end="url(#arrow-primary)" />
  <rect x="407.6633" y="548.4305" width="832.3367" height="71.5695" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="823.8316" y="577.0582" text-anchor="middle" fill="var(--primary-accent)" font-size="16.4866" font-weight="bold" font-family="Arial, sans-serif">AI Accelerates Every Stage</text>
  <text x="823.8316" y="602.1076" text-anchor="middle" fill="var(--text)" font-size="16.4866" font-family="Arial, sans-serif">Requirements clarification, boilerplate generation, test creation, review automation</text>
</svg>
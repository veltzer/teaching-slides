  <text x="480.4693" y="250.87" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Every Step</text>
  <circle cx="480.4693" cy="101.766" r="33.3659" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.5237" filter="url(#shadow)" />
  <text x="480.4693" y="99.1594" text-anchor="middle" fill="var(--danger-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Planning</text>
  <text x="480.4693" y="112.1929" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Requirements</text>
  <circle cx="610.8049" cy="159.1137" r="33.3659" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5237" filter="url(#shadow)" />
  <text x="610.8049" y="156.5071" text-anchor="middle" fill="var(--warn-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Design</text>
  <text x="610.8049" y="169.5406" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Architecture</text>
  <circle cx="636.872" cy="284.2359" r="33.3659" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5237" filter="url(#shadow)" />
  <text x="636.872" y="281.6292" text-anchor="middle" fill="var(--ok-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Develop</text>
  <text x="636.872" y="294.6627" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Code + AI</text>
  <circle cx="553.4572" cy="378.0775" r="33.3659" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="1.5237" filter="url(#shadow)" />
  <text x="553.4572" y="375.4708" text-anchor="middle" fill="var(--info-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="553.4572" y="388.5043" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Automated</text>
  <circle cx="407.4813" cy="378.0775" r="33.3659" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.5237" filter="url(#shadow)" />
  <text x="407.4813" y="375.4708" text-anchor="middle" fill="var(--primary-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="407.4813" y="388.5043" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">CI/CD</text>
  <circle cx="324.0664" cy="284.2359" r="33.3659" fill="var(--primary-fill)" stroke="var(--ok-border)" stroke-width="1.5237" filter="url(#shadow)" />
  <text x="324.0664" y="281.6292" text-anchor="middle" fill="var(--ok-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Monitor</text>
  <text x="324.0664" y="294.6627" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Observe</text>
  <circle cx="350.1336" cy="159.1137" r="33.3659" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5237" filter="url(#shadow)" />
  <text x="350.1336" y="156.5071" text-anchor="middle" fill="var(--warn-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Iterate</text>
  <text x="350.1336" y="169.5406" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Improve</text>

  <text x="517.2145" y="243.7542" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Every Step</text>
  <circle cx="517.2145" cy="128.9938" r="25.6806" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="0.965" filter="url(#shadow)" />
  <text x="517.2145" y="126.9876" text-anchor="middle" fill="var(--danger-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Planning</text>
  <text x="517.2145" y="137.019" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Requirements</text>

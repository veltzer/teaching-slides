<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="865.9619" height="487.1036" fill="var(--bg)" rx="6"/>
  <circle cx="432.981" cy="236.7865" r="175.8985" fill="none" stroke="var(--border)" stroke-width="2.0296" />
  <circle cx="432.981" cy="236.7865" r="60.8879" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="432.981" y="228.6681" text-anchor="middle" fill="var(--bg)" font-size="12.1776" font-weight="bold" font-family="Arial, sans-serif">AI Assists</text>
  <text x="432.981" y="247.611" text-anchor="middle" fill="var(--bg)" font-size="12.1776" font-weight="bold" font-family="Arial, sans-serif">Every Step</text>
  <circle cx="432.981" cy="54.1226" r="43.2981" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.0296" filter="url(#shadow)" />
  <text x="432.981" y="50.74" text-anchor="middle" fill="var(--danger-accent)" font-size="10.8245" font-weight="bold" font-family="Arial, sans-serif">Planning</text>
  <text x="432.981" y="67.6533" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Requirements</text>
  <circle cx="602.1142" cy="128.5412" r="43.2981" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.0296" filter="url(#shadow)" />
  <text x="602.1142" y="125.1586" text-anchor="middle" fill="var(--warn-accent)" font-size="10.8245" font-weight="bold" font-family="Arial, sans-serif">Design</text>
  <text x="602.1142" y="142.0719" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Architecture</text>
  <circle cx="635.9408" cy="290.9091" r="43.2981" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.0296" filter="url(#shadow)" />
  <text x="635.9408" y="287.5264" text-anchor="middle" fill="var(--ok-accent)" font-size="10.8245" font-weight="bold" font-family="Arial, sans-serif">Develop</text>
  <text x="635.9408" y="304.4397" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Code + AI</text>
  <circle cx="527.6956" cy="412.685" r="43.2981" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.0296" filter="url(#shadow)" />
  <text x="527.6956" y="409.3023" text-anchor="middle" fill="var(--info-accent)" font-size="10.8245" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="527.6956" y="426.2156" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Automated</text>
  <circle cx="338.2664" cy="412.685" r="43.2981" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.0296" filter="url(#shadow)" />
  <text x="338.2664" y="409.3023" text-anchor="middle" fill="var(--primary-accent)" font-size="10.8245" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="338.2664" y="426.2156" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">CI/CD</text>
  <circle cx="230.0211" cy="290.9091" r="43.2981" fill="var(--primary-fill)" stroke="var(--ok-border)" stroke-width="2.0296" filter="url(#shadow)" />
  <text x="230.0211" y="287.5264" text-anchor="middle" fill="var(--ok-accent)" font-size="10.8245" font-weight="bold" font-family="Arial, sans-serif">Monitor</text>
  <text x="230.0211" y="304.4397" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Observe</text>
  <circle cx="263.8478" cy="128.5412" r="43.2981" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.0296" filter="url(#shadow)" />
  <text x="263.8478" y="125.1586" text-anchor="middle" fill="var(--warn-accent)" font-size="10.8245" font-weight="bold" font-family="Arial, sans-serif">Iterate</text>
  <text x="263.8478" y="142.0719" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Improve</text>
  <path d="M 473.5729 79.8309 Q 547.9915 100.1268 569.6406 102.833" fill="none" stroke="var(--primary-border)" stroke-width="1.6913" marker-end="url(#arrow-primary)" />
  <path d="M 625.1163 174.5455 Q 640 236.7865 629.1755 257.0825" fill="none" stroke="var(--primary-border)" stroke-width="1.6913" marker-end="url(#arrow-primary)" />
  <path d="M 612.2622 330.148 Q 581.8182 384.2706 568.2875 376.1522" fill="none" stroke="var(--primary-border)" stroke-width="1.6913" marker-end="url(#arrow-primary)" />
  <path d="M 487.1036 435.6871 Q 420.8034 442.4524 378.8584 435.6871" fill="none" stroke="var(--primary-border)" stroke-width="1.6913" marker-end="url(#arrow-primary)" />
  <path d="M 297.6744 392.389 Q 238.1395 359.9154 221.9027 331.5011" fill="none" stroke="var(--primary-border)" stroke-width="1.6913" marker-end="url(#arrow-primary)" />
  <path d="M 236.7865 250.3171 Q 248.9641 181.3108 284.1438 156.9556" fill="none" stroke="var(--primary-border)" stroke-width="1.6913" marker-end="url(#arrow-primary)" />
  <path d="M 303.0867 101.4799 Q 365.3277 74.4186 392.389 66.3002" fill="none" stroke="var(--primary-border)" stroke-width="1.6913" marker-end="url(#arrow-primary)" />
</svg>
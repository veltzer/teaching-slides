  <text x="573.3909" y="349.6868" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Automated</text>
  <circle cx="461.0381" cy="341.6616" r="25.6806" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="0.965" filter="url(#shadow)" />
  <text x="461.0381" y="339.6553" text-anchor="middle" fill="var(--primary-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="461.0381" y="349.6868" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">CI/CD</text>

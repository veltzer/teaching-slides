<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="931.741487" height="453.789213" fill="var(--bg)" rx="5.992506" x="40" y="40"/>
  <rect x="802.167889" y="236.676136" width="352.214411" height="352.214243" rx="14.000013" fill="none" stroke="var(--border)" stroke-width="0.965"/>
  <rect x="917.315024" y="351.823215" width="121.920142" height="121.920084" rx="14.000013" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="978.275095" y="405.219552" text-anchor="middle" fill="var(--bg)" font-size="16.880216" font-weight="bold" font-family="Arial, sans-serif">AI Assists</text>
  <text x="978.275095" y="422.867064" text-anchor="middle" fill="var(--bg)" font-size="16.880216" font-weight="bold" font-family="Arial, sans-serif">Every Step</text>
  <rect x="934.926044" y="199.26211" width="86.698701" height="86.69866" rx="14.000013" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="0.965" filter="url(#shadow)"/>
  <text x="978.275095" y="239.460638" text-anchor="middle" fill="var(--danger-accent)" font-size="16.880216" font-weight="bold" font-family="Arial, sans-serif">Planning</text>
  <text x="978.275095" y="255.217048" text-anchor="middle" fill="var(--text)" font-size="16.880216" font-family="Arial, sans-serif">Requirements</text>
  <rect x="1116.911256" y="268.591158" width="86.698701" height="86.69866" rx="14.000013" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="0.965" filter="url(#shadow)"/>
  <text x="1160.255907" y="308.789485" text-anchor="middle" fill="var(--warn-accent)" font-size="16.880216" font-weight="bold" font-family="Arial, sans-serif">Design</text>
  <text x="1160.255907" y="324.546196" text-anchor="middle" fill="var(--text)" font-size="16.880216" font-family="Arial, sans-serif">Architecture</text>
  <rect x="1153.301299" y="419.854262" width="86.698701" height="86.69866" rx="14.000013" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="0.965" filter="url(#shadow)"/>
  <text x="1196.652049" y="460.05249" text-anchor="middle" fill="var(--ok-accent)" font-size="16.880216" font-weight="bold" font-family="Arial, sans-serif">Develop</text>
  <text x="1196.652049" y="475.808901" text-anchor="middle" fill="var(--text)" font-size="16.880216" font-family="Arial, sans-serif">Code + AI</text>
  <rect x="1036.831163" y="533.30134" width="86.698701" height="86.69866" rx="14.000013" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="0.965" filter="url(#shadow)"/>
  <text x="1080.184414" y="573.499568" text-anchor="middle" fill="var(--info-accent)" font-size="16.880216" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="1080.184414" y="589.256279" text-anchor="middle" fill="var(--text)" font-size="16.880216" font-family="Arial, sans-serif">Automated</text>
  <rect x="833.016925" y="533.30134" width="86.698701" height="86.69866" rx="14.000013" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="0.965" filter="url(#shadow)"/>
  <text x="876.365976" y="573.499568" text-anchor="middle" fill="var(--primary-accent)" font-size="16.880216" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="876.365976" y="589.256279" text-anchor="middle" fill="var(--text)" font-size="16.880216" font-family="Arial, sans-serif">CI/CD</text>
  <rect x="716.548789" y="419.854262" width="86.698701" height="86.69866" rx="14.000013" fill="url(#grad-primary)" stroke="var(--ok-border)" stroke-width="0.965" filter="url(#shadow)"/>
  <text x="759.89814" y="460.05249" text-anchor="middle" fill="var(--ok-accent)" font-size="16.880216" font-weight="bold" font-family="Arial, sans-serif">Monitor</text>
  <text x="759.89814" y="475.808901" text-anchor="middle" fill="var(--text)" font-size="16.880216" font-family="Arial, sans-serif">Observe</text>
  <rect x="752.944832" y="268.591158" width="86.698701" height="86.69866" rx="14.000013" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="0.965" filter="url(#shadow)"/>
  <text x="796.294382" y="308.789485" text-anchor="middle" fill="var(--warn-accent)" font-size="16.880216" font-weight="bold" font-family="Arial, sans-serif">Iterate</text>
  <text x="796.294382" y="324.546196" text-anchor="middle" fill="var(--text)" font-size="16.880216" font-family="Arial, sans-serif">Improve</text>
  <path d="M 1021.950346 266.561856 Q 1102.021939 285.469569 1125.315666 287.990871" fill="none" stroke="var(--primary-border)" stroke-width="0.8042" marker-end="url(#arrow-primary)"/>
  <path d="M 1185.005236 354.798517 Q 1201.019455 412.782857 1189.372741 431.69077" fill="none" stroke="var(--primary-border)" stroke-width="0.8042" marker-end="url(#arrow-primary)"/>
  <path d="M 1171.17482 499.759017 Q 1138.418181 550.180052 1123.859865 542.616947" fill="none" stroke="var(--primary-border)" stroke-width="0.8042" marker-end="url(#arrow-primary)"/>
  <path d="M 1036.508863 598.079985 Q 965.172579 604.382589 920.041427 598.079985" fill="none" stroke="var(--primary-border)" stroke-width="0.8042" marker-end="url(#arrow-primary)"/>
  <path d="M 832.690325 557.743357 Q 768.63335 527.490536 751.16293 501.019518" fill="none" stroke="var(--primary-border)" stroke-width="0.8042" marker-end="url(#arrow-primary)"/>
  <path d="M 767.177548 425.387966 Q 780.280264 361.101121 818.131908 338.411806" fill="none" stroke="var(--primary-border)" stroke-width="0.8042" marker-end="url(#arrow-primary)"/>
  <path d="M 838.513932 286.73017 Q 905.48301 261.519653 934.599844 253.956548" fill="none" stroke="var(--primary-border)" stroke-width="0.8042" marker-end="url(#arrow-primary)"/>
</svg>

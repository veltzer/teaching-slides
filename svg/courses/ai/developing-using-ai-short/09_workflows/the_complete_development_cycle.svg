  <text x="396.8364" y="277.46" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Observe</text>
  <circle cx="416.8994" cy="173.1325" r="25.6806" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="0.965" filter="url(#shadow)" />
  <text x="416.8994" y="171.1262" text-anchor="middle" fill="var(--warn-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Iterate</text>
  <text x="416.8994" y="181.1577" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Improve</text>

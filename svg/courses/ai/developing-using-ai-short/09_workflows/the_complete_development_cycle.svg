<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="888.8888" height="500" fill="var(--bg)" rx="6.1589"/>
  <circle cx="640.0001" cy="323.0556" r="180.5555" fill="none" stroke="var(--border)" stroke-width="2.0296" />
  <circle cx="640.0001" cy="323.0556" r="62.4999" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="640.0001" y="314.7222" text-anchor="middle" fill="var(--bg)" font-size="12.5" font-weight="bold" font-family="Arial, sans-serif">AI Assists</text>
  <text x="640.0001" y="334.1667" text-anchor="middle" fill="var(--bg)" font-size="12.5" font-weight="bold" font-family="Arial, sans-serif">Every Step</text>
  <circle cx="640.0001" cy="135.5555" r="44.4444" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.0296" filter="url(#shadow)" />
  <text x="640.0001" y="132.0834" text-anchor="middle" fill="var(--danger-accent)" font-size="11.1111" font-weight="bold" font-family="Arial, sans-serif">Planning</text>
  <text x="640.0001" y="149.4445" text-anchor="middle" fill="var(--text)" font-size="10.2648" font-family="Arial, sans-serif">Requirements</text>
  <circle cx="813.6112" cy="211.9444" r="44.4444" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.0296" filter="url(#shadow)" />
  <text x="813.6112" y="208.4723" text-anchor="middle" fill="var(--warn-accent)" font-size="11.1111" font-weight="bold" font-family="Arial, sans-serif">Design</text>
  <text x="813.6112" y="225.8334" text-anchor="middle" fill="var(--text)" font-size="10.2648" font-family="Arial, sans-serif">Architecture</text>
  <circle cx="848.3334" cy="378.6111" r="44.4444" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.0296" filter="url(#shadow)" />
  <text x="848.3334" y="375.1389" text-anchor="middle" fill="var(--ok-accent)" font-size="11.1111" font-weight="bold" font-family="Arial, sans-serif">Develop</text>
  <text x="848.3334" y="392.4999" text-anchor="middle" fill="var(--text)" font-size="10.2648" font-family="Arial, sans-serif">Code + AI</text>
  <circle cx="737.2223" cy="503.6111" r="44.4444" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.0296" filter="url(#shadow)" />
  <text x="737.2223" y="500.1389" text-anchor="middle" fill="var(--info-accent)" font-size="11.1111" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="737.2223" y="517.4999" text-anchor="middle" fill="var(--text)" font-size="10.2648" font-family="Arial, sans-serif">Automated</text>
  <circle cx="542.7778" cy="503.6111" r="44.4444" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.0296" filter="url(#shadow)" />
  <text x="542.7778" y="500.1389" text-anchor="middle" fill="var(--primary-accent)" font-size="11.1111" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="542.7778" y="517.4999" text-anchor="middle" fill="var(--text)" font-size="10.2648" font-family="Arial, sans-serif">CI/CD</text>
  <circle cx="431.6666" cy="378.6111" r="44.4444" fill="var(--primary-fill)" stroke="var(--ok-border)" stroke-width="2.0296" filter="url(#shadow)" />
  <text x="431.6666" y="375.1389" text-anchor="middle" fill="var(--ok-accent)" font-size="11.1111" font-weight="bold" font-family="Arial, sans-serif">Monitor</text>
  <text x="431.6666" y="392.4999" text-anchor="middle" fill="var(--text)" font-size="10.2648" font-family="Arial, sans-serif">Observe</text>
  <circle cx="466.3889" cy="211.9444" r="44.4444" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.0296" filter="url(#shadow)" />
  <text x="466.3889" y="208.4723" text-anchor="middle" fill="var(--warn-accent)" font-size="11.1111" font-weight="bold" font-family="Arial, sans-serif">Iterate</text>
  <text x="466.3889" y="225.8334" text-anchor="middle" fill="var(--text)" font-size="10.2648" font-family="Arial, sans-serif">Improve</text>
  <path d="M 681.6666 161.9445 Q 758.0555 182.7777 780.2778 185.5556" fill="none" stroke="var(--primary-border)" stroke-width="1.6913" marker-end="url(#arrow-primary)" />
  <path d="M 837.2223 259.1667 Q 852.5 323.0556 841.3889 343.8889" fill="none" stroke="var(--primary-border)" stroke-width="1.6913" marker-end="url(#arrow-primary)" />
  <path d="M 824.0278 418.8889 Q 792.7778 474.4444 778.8889 466.1111" fill="none" stroke="var(--primary-border)" stroke-width="1.6913" marker-end="url(#arrow-primary)" />
  <path d="M 695.5556 527.2222 Q 627.5 534.1666 584.4445 527.2222" fill="none" stroke="var(--primary-border)" stroke-width="1.6913" marker-end="url(#arrow-primary)" />
  <path d="M 501.1111 482.7778 Q 440 449.4444 423.3333 420.2778" fill="none" stroke="var(--primary-border)" stroke-width="1.6913" marker-end="url(#arrow-primary)" />
  <path d="M 438.6112 336.9444 Q 451.1112 266.1111 487.2223 241.1111" fill="none" stroke="var(--primary-border)" stroke-width="1.6913" marker-end="url(#arrow-primary)" />
  <path d="M 506.6667 184.1666 Q 570.5556 156.3889 598.3334 148.0555" fill="none" stroke="var(--primary-border)" stroke-width="1.6913" marker-end="url(#arrow-primary)" />
</svg>
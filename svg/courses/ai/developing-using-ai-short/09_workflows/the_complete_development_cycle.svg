<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Cycle circle outline -->
  <circle cx="640" cy="350" r="260" fill="none" stroke="#e0e0e0" stroke-width="3"/>
  <!-- Center badge -->
  <circle cx="640" cy="350" r="90" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="338" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Arial, sans-serif">AI Assists</text>
  <text x="640" y="366" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Arial, sans-serif">Every Step</text>
  <!-- 7 cycle nodes -->
  <circle cx="640" cy="80" r="64" fill="#ffebee" stroke="#e53935" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="75" text-anchor="middle" fill="#b71c1c" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Planning</text>
  <text x="640" y="100" text-anchor="middle" fill="#444" font-size="13" font-family="Arial, sans-serif">Requirements</text>
  <circle cx="890" cy="190" r="64" fill="#fff3e0" stroke="#fb8c00" stroke-width="3" filter="url(#shadow)"/>
  <text x="890" y="185" text-anchor="middle" fill="#e65100" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Design</text>
  <text x="890" y="210" text-anchor="middle" fill="#444" font-size="13" font-family="Arial, sans-serif">Architecture</text>
  <circle cx="940" cy="430" r="64" fill="#e8f5e9" stroke="#43a047" stroke-width="3" filter="url(#shadow)"/>
  <text x="940" y="425" text-anchor="middle" fill="#2e7d32" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Develop</text>
  <text x="940" y="450" text-anchor="middle" fill="#444" font-size="13" font-family="Arial, sans-serif">Code + AI</text>
  <circle cx="780" cy="610" r="64" fill="#f3e5f5" stroke="#8e24aa" stroke-width="3" filter="url(#shadow)"/>
  <text x="780" y="605" text-anchor="middle" fill="#6a1b9a" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="780" y="630" text-anchor="middle" fill="#444" font-size="13" font-family="Arial, sans-serif">Automated</text>
  <circle cx="500" cy="610" r="64" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="500" y="605" text-anchor="middle" fill="#1565c0" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="500" y="630" text-anchor="middle" fill="#444" font-size="13" font-family="Arial, sans-serif">CI/CD</text>
  <circle cx="340" cy="430" r="64" fill="#e0f2f1" stroke="#00897b" stroke-width="3" filter="url(#shadow)"/>
  <text x="340" y="425" text-anchor="middle" fill="#00695c" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Monitor</text>
  <text x="340" y="450" text-anchor="middle" fill="#444" font-size="13" font-family="Arial, sans-serif">Observe</text>
  <circle cx="390" cy="190" r="64" fill="#fff8e1" stroke="#f9a825" stroke-width="3" filter="url(#shadow)"/>
  <text x="390" y="185" text-anchor="middle" fill="#f57f17" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Iterate</text>
  <text x="390" y="210" text-anchor="middle" fill="#444" font-size="13" font-family="Arial, sans-serif">Improve</text>
  <!-- Arrows between nodes (clockwise) -->
  <path d="M700 118 Q810 148 842 152" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <path d="M924 258 Q946 350 930 380" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <path d="M905 488 Q860 568 840 556" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <path d="M720 644 Q622 654 560 644" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <path d="M440 580 Q352 532 328 490" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <path d="M350 370 Q368 268 420 232" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <path d="M448 150 Q540 110 580 98" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
</svg>

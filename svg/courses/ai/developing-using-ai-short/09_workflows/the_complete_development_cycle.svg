  <text x="617.5295" y="181.1577" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Architecture</text>
  <circle cx="637.5925" cy="269.4348" r="25.6806" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="0.965" filter="url(#shadow)" />
  <text x="637.5925" y="267.4286" text-anchor="middle" fill="var(--ok-accent)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Develop</text>
  <text x="637.5925" y="277.46" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Arial, sans-serif">Code + AI</text>
  <circle cx="573.3909" cy="341.6616" r="25.6806" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="0.965" filter="url(#shadow)" />

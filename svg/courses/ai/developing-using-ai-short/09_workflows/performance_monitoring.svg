<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Dashboard header -->
  <rect x="80" y="50" width="1120" height="55" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="87" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial, sans-serif">Production Metrics Dashboard</text>
  <!-- 4 metric cards 2x2 -->
  <rect x="80" y="140" width="520" height="200" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="200" text-anchor="middle" fill="#1565c0" font-size="20" font-family="Arial, sans-serif">Response Time</text>
  <text x="340" y="262" text-anchor="middle" fill="#1565c0" font-size="42" font-weight="bold" font-family="Arial, sans-serif">127ms</text>
  <text x="340" y="310" text-anchor="middle" fill="#555" font-size="16" font-family="Arial, sans-serif">p95: 245ms</text>
  <rect x="680" y="140" width="520" height="200" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="200" text-anchor="middle" fill="#2e7d32" font-size="20" font-family="Arial, sans-serif">Uptime</text>
  <text x="940" y="262" text-anchor="middle" fill="#2e7d32" font-size="42" font-weight="bold" font-family="Arial, sans-serif">99.98%</text>
  <text x="940" y="310" text-anchor="middle" fill="#555" font-size="16" font-family="Arial, sans-serif">Last 30 days</text>
  <rect x="80" y="370" width="520" height="200" rx="12" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="430" text-anchor="middle" fill="#e65100" font-size="20" font-family="Arial, sans-serif">Error Rate</text>
  <text x="340" y="492" text-anchor="middle" fill="#e65100" font-size="42" font-weight="bold" font-family="Arial, sans-serif">0.12%</text>
  <text x="340" y="540" text-anchor="middle" fill="#555" font-size="16" font-family="Arial, sans-serif">Down 0.03% this week</text>
  <rect x="680" y="370" width="520" height="200" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="430" text-anchor="middle" fill="#6a1b9a" font-size="20" font-family="Arial, sans-serif">Active Users</text>
  <text x="940" y="492" text-anchor="middle" fill="#6a1b9a" font-size="42" font-weight="bold" font-family="Arial, sans-serif">5,234</text>
  <text x="940" y="540" text-anchor="middle" fill="#555" font-size="16" font-family="Arial, sans-serif">Peak: 8,421</text>
  <!-- Footer -->
  <rect x="80" y="600" width="1120" height="90" rx="10" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="638" text-anchor="middle" fill="#1565c0" font-size="18" font-weight="bold" font-family="Arial, sans-serif">AI-Powered Alerting</text>
  <text x="640" y="668" text-anchor="middle" fill="#444" font-size="15" font-family="Arial, sans-serif">Anomaly detection, predictive alerts, automated runbook execution</text>
</svg>

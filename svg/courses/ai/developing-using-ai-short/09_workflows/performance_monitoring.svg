<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="49.843796" rx="6.80336" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="73.531297" text-anchor="middle" fill="var(--bg)" font-size="23.64916" font-weight="bold" font-family="Arial, sans-serif">Production Metrics Dashboard</text>
  <rect x="40" y="121.562493" width="557.142857" height="181.249972" rx="6.80336" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="318.571429" y="175.937563" text-anchor="middle" fill="var(--primary-accent)" font-size="19.707747" font-family="Arial, sans-serif">Response Time</text>
  <text x="318.571429" y="232.125121" text-anchor="middle" fill="var(--primary-accent)" font-size="41.386088" font-weight="bold" font-family="Arial, sans-serif">127ms</text>
  <text x="318.571429" y="275.625155" text-anchor="middle" fill="var(--text-muted)" font-size="15.766107" font-family="Arial, sans-serif">p95: 245ms</text>
  <rect x="682.857029" y="121.562493" width="557.142857" height="181.249972" rx="6.80336" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="961.428571" y="175.937563" text-anchor="middle" fill="var(--ok-accent)" font-size="19.707747" font-family="Arial, sans-serif">Uptime</text>
  <text x="961.428571" y="232.125121" text-anchor="middle" fill="var(--ok-accent)" font-size="41.386088" font-weight="bold" font-family="Arial, sans-serif">99.98%</text>
  <text x="961.428571" y="275.625155" text-anchor="middle" fill="var(--text-muted)" font-size="15.766107" font-family="Arial, sans-serif">Last 30 days</text>
  <rect x="40" y="330.000112" width="557.142857" height="181.249972" rx="6.80336" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="318.571429" y="384.37507" text-anchor="middle" fill="var(--warn-accent)" font-size="19.707747" font-family="Arial, sans-serif">Error Rate</text>
  <text x="318.571429" y="440.562515" text-anchor="middle" fill="var(--warn-accent)" font-size="41.386088" font-weight="bold" font-family="Arial, sans-serif">0.12%</text>
  <text x="318.571429" y="484.062549" text-anchor="middle" fill="var(--text-muted)" font-size="15.766107" font-family="Arial, sans-serif">Down 0.03% this week</text>
  <rect x="682.857029" y="330.000112" width="557.142857" height="181.249972" rx="6.80336" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="961.428571" y="384.37507" text-anchor="middle" fill="var(--info-accent)" font-size="19.707747" font-family="Arial, sans-serif">Active Users</text>
  <text x="961.428571" y="440.562515" text-anchor="middle" fill="var(--info-accent)" font-size="41.386088" font-weight="bold" font-family="Arial, sans-serif">5,234</text>
  <text x="961.428571" y="484.062549" text-anchor="middle" fill="var(--text-muted)" font-size="15.766107" font-family="Arial, sans-serif">Peak: 8,421</text>
  <rect x="40" y="538.437507" width="1200" height="81.562493" rx="6.80336" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="572.874992" text-anchor="middle" fill="var(--primary-accent)" font-size="17.736927" font-weight="bold" font-family="Arial, sans-serif">AI-Powered Alerting</text>
  <text x="640" y="600.062527" text-anchor="middle" fill="var(--text)" font-size="14.780754" font-family="Arial, sans-serif">Anomaly detection, predictive alerts, automated runbook execution</text>
</svg>
  <rect x="40" y="40" width="1200" height="51.451669" rx="6.912222" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="74.612958" text-anchor="middle" fill="var(--bg)" font-size="24.027573" font-weight="bold" font-family="Arial, sans-serif">Multi-Environment Deployment Pipeline</text>
  <rect x="40" y="128.871001" width="257.142857" height="233.871001" rx="6.912222" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="128.871001" width="257.142857" height="43.032314" rx="6.912222" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="158.806514" width="257.142857" height="13.096685" fill="url(#grad-primary)" rx="6.912222" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.571429" y="160.677469" text-anchor="middle" fill="var(--bg)" font-size="20.023093" font-weight="bold" font-family="Arial, sans-serif">Dev</text>
  <text x="168.571429" y="208.387112" text-anchor="middle" fill="var(--primary-accent)" font-size="16.018382" font-family="Arial, sans-serif">Auto-deploy</text>
  <text x="168.571429" y="234.580714" text-anchor="middle" fill="var(--text)" font-size="14.016027" font-family="Arial, sans-serif">Every commit</text>
  <text x="168.571429" y="260.7742" text-anchor="middle" fill="var(--text)" font-size="14.016027" font-family="Arial, sans-serif">Feature branches</text>
  <text x="168.571429" y="286.967803" text-anchor="middle" fill="var(--text)" font-size="14.016027" font-family="Arial, sans-serif">No approval needed</text>
  <text x="168.571429" y="322.51618" text-anchor="middle" fill="var(--text-faint)" font-size="13.015022" font-family="Arial, sans-serif">Minutes</text>
  <line x1="297.142743" y1="245.80656" x2="350.714286" y2="245.80656" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="361.428571" y="128.871001" width="257.142857" height="233.871001" rx="6.912222" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="361.428571" y="128.871001" width="257.142857" height="43.032314" rx="6.912222" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="361.428571" y="158.806514" width="257.142857" height="13.096685" fill="url(#grad-ok)" rx="6.912222" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="489.999886" y="160.677469" text-anchor="middle" fill="var(--bg)" font-size="20.023093" font-weight="bold" font-family="Arial, sans-serif">Staging</text>
  <text x="489.999886" y="208.387112" text-anchor="middle" fill="var(--ok-accent)" font-size="16.018382" font-family="Arial, sans-serif">Daily sync</text>
  <text x="489.999886" y="234.580714" text-anchor="middle" fill="var(--text)" font-size="14.016027" font-family="Arial, sans-serif">Full testing suite</text>
  <text x="489.999886" y="260.7742" text-anchor="middle" fill="var(--text)" font-size="14.016027" font-family="Arial, sans-serif">QA validation</text>
  <text x="489.999886" y="286.967803" text-anchor="middle" fill="var(--text)" font-size="14.016027" font-family="Arial, sans-serif">Performance tests</text>
  <text x="489.999886" y="322.51618" text-anchor="middle" fill="var(--text-faint)" font-size="13.015022" font-family="Arial, sans-serif">Hours</text>
  <line x1="618.571429" y1="245.80656" x2="672.142857" y2="245.80656" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="682.857029" y="128.871001" width="257.142857" height="233.871001" rx="6.912222" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="682.857029" y="128.871001" width="257.142857" height="43.032314" rx="6.912222" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="682.857029" y="158.806514" width="257.142857" height="13.096685" fill="url(#grad-warn)" rx="6.912222" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="811.428571" y="160.677469" text-anchor="middle" fill="var(--bg)" font-size="20.023093" font-weight="bold" font-family="Arial, sans-serif">Pre-Prod</text>
  <text x="811.428571" y="208.387112" text-anchor="middle" fill="var(--warn-accent)" font-size="16.018382" font-family="Arial, sans-serif">Weekly release</text>
  <text x="811.428571" y="234.580714" text-anchor="middle" fill="var(--text)" font-size="14.016027" font-family="Arial, sans-serif">Prod mirror</text>
  <text x="811.428571" y="260.7742" text-anchor="middle" fill="var(--text)" font-size="14.016027" font-family="Arial, sans-serif">Load testing</text>
  <text x="811.428571" y="286.967803" text-anchor="middle" fill="var(--text)" font-size="14.016027" font-family="Arial, sans-serif">Sign-off required</text>
  <text x="811.428571" y="322.51618" text-anchor="middle" fill="var(--text-faint)" font-size="13.015022" font-family="Arial, sans-serif">Days</text>
  <line x1="940" y1="245.80656" x2="993.571429" y2="245.80656" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="1004.285714" y="128.871001" width="235.714286" height="233.871001" rx="6.912222" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1004.285714" y="128.871001" width="235.714286" height="43.032314" rx="6.912222" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1004.285714" y="158.806514" width="235.714286" height="13.096685" fill="url(#grad-danger)" rx="6.912222" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.142857" y="160.677469" text-anchor="middle" fill="var(--bg)" font-size="20.023093" font-weight="bold" font-family="Arial, sans-serif">Prod</text>
  <text x="1122.142857" y="208.387112" text-anchor="middle" fill="var(--danger-accent)" font-size="16.018382" font-family="Arial, sans-serif">Manual gate</text>
  <text x="1122.142857" y="234.580714" text-anchor="middle" fill="var(--text)" font-size="14.016027" font-family="Arial, sans-serif">Approved only</text>
  <text x="1122.142857" y="260.7742" text-anchor="middle" fill="var(--text)" font-size="14.016027" font-family="Arial, sans-serif">Canary rollout</text>
  <text x="1122.142857" y="286.967803" text-anchor="middle" fill="var(--text)" font-size="14.016027" font-family="Arial, sans-serif">Instant rollback</text>
  <text x="1122.142857" y="322.51618" text-anchor="middle" fill="var(--text-faint)" font-size="13.015022" font-family="Arial, sans-serif">Controlled</text>
  <rect x="40" y="395.48389" width="1200" height="224.51611" rx="6.912222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="431.032383" text-anchor="middle" fill="var(--primary-accent)" font-size="20.023093" font-weight="bold" font-family="Arial, sans-serif">AI-Managed Environment Consistency</text>
  <text x="640" y="465.645225" text-anchor="middle" fill="var(--text)" font-size="16.018382" font-family="Arial, sans-serif">• Config drift detection across environments</text>
  <text x="640" y="496.516157" text-anchor="middle" fill="var(--text)" font-size="16.018382" font-family="Arial, sans-serif">• Automated secret rotation and env-var sync</text>
  <text x="640" y="527.387089" text-anchor="middle" fill="var(--text)" font-size="16.018382" font-family="Arial, sans-serif">• Promotion gating based on quality metrics</text>
  <text x="640" y="558.258136" text-anchor="middle" fill="var(--text)" font-size="16.018382" font-family="Arial, sans-serif">• Rollback triggers on error rate thresholds</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="71.1111" y="53.3333" width="995.5556" height="48.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="86.2222" text-anchor="middle" fill="var(--bg)" font-size="21.3333" font-weight="bold" font-family="Arial, sans-serif">Multi-Environment Deployment Pipeline</text>
  <rect x="71.1111" y="137.7778" width="213.3333" height="222.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="71.1111" y="137.7778" width="213.3333" height="40.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="71.1111" y="166.2222" width="213.3333" height="12.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="177.7778" y="168" text-anchor="middle" fill="var(--bg)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Dev</text>
  <text x="177.7778" y="213.3333" text-anchor="middle" fill="var(--primary-accent)" font-size="14.2222" font-family="Arial, sans-serif">Auto-deploy</text>
  <text x="177.7778" y="238.2222" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">Every commit</text>
  <text x="177.7778" y="263.1111" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">Feature branches</text>
  <text x="177.7778" y="288" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">No approval needed</text>
  <text x="177.7778" y="321.7778" text-anchor="middle" fill="var(--text-faint)" font-size="11.5556" font-family="Arial, sans-serif">Minutes</text>
  <line x1="284.4444" y1="248.8889" x2="328.8889" y2="248.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="337.7778" y="137.7778" width="213.3333" height="222.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="337.7778" y="137.7778" width="213.3333" height="40.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="337.7778" y="166.2222" width="213.3333" height="12.4444" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="444.4444" y="168" text-anchor="middle" fill="var(--bg)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Staging</text>
  <text x="444.4444" y="213.3333" text-anchor="middle" fill="var(--ok-accent)" font-size="14.2222" font-family="Arial, sans-serif">Daily sync</text>
  <text x="444.4444" y="238.2222" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">Full testing suite</text>
  <text x="444.4444" y="263.1111" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">QA validation</text>
  <text x="444.4444" y="288" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">Performance tests</text>
  <text x="444.4444" y="321.7778" text-anchor="middle" fill="var(--text-faint)" font-size="11.5556" font-family="Arial, sans-serif">Hours</text>
  <line x1="551.1111" y1="248.8889" x2="595.5556" y2="248.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="604.4444" y="137.7778" width="213.3333" height="222.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="604.4444" y="137.7778" width="213.3333" height="40.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="604.4444" y="166.2222" width="213.3333" height="12.4444" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="711.1111" y="168" text-anchor="middle" fill="var(--bg)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Pre-Prod</text>
  <text x="711.1111" y="213.3333" text-anchor="middle" fill="var(--warn-accent)" font-size="14.2222" font-family="Arial, sans-serif">Weekly release</text>
  <text x="711.1111" y="238.2222" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">Prod mirror</text>
  <text x="711.1111" y="263.1111" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">Load testing</text>
  <text x="711.1111" y="288" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">Sign-off required</text>
  <text x="711.1111" y="321.7778" text-anchor="middle" fill="var(--text-faint)" font-size="11.5556" font-family="Arial, sans-serif">Days</text>
  <line x1="817.7778" y1="248.8889" x2="862.2222" y2="248.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="871.1111" y="137.7778" width="195.5556" height="222.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="871.1111" y="137.7778" width="195.5556" height="40.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="871.1111" y="166.2222" width="195.5556" height="12.4444" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="968.8889" y="168" text-anchor="middle" fill="var(--bg)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">Prod</text>
  <text x="968.8889" y="213.3333" text-anchor="middle" fill="var(--danger-accent)" font-size="14.2222" font-family="Arial, sans-serif">Manual gate</text>
  <text x="968.8889" y="238.2222" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">Approved only</text>
  <text x="968.8889" y="263.1111" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">Canary rollout</text>
  <text x="968.8889" y="288" text-anchor="middle" fill="var(--text)" font-size="12.4444" font-family="Arial, sans-serif">Instant rollback</text>
  <text x="968.8889" y="321.7778" text-anchor="middle" fill="var(--text-faint)" font-size="11.5556" font-family="Arial, sans-serif">Controlled</text>
  <rect x="71.1111" y="391.1111" width="995.5556" height="213.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="424.8889" text-anchor="middle" fill="var(--primary-accent)" font-size="17.7778" font-weight="bold" font-family="Arial, sans-serif">AI-Managed Environment Consistency</text>
  <text x="568.8889" y="457.7778" text-anchor="middle" fill="var(--text)" font-size="14.2222" font-family="Arial, sans-serif">• Config drift detection across environments</text>
  <text x="568.8889" y="487.1111" text-anchor="middle" fill="var(--text)" font-size="14.2222" font-family="Arial, sans-serif">• Automated secret rotation and env-var sync</text>
  <text x="568.8889" y="516.4444" text-anchor="middle" fill="var(--text)" font-size="14.2222" font-family="Arial, sans-serif">• Promotion gating based on quality metrics</text>
  <text x="568.8889" y="545.7778" text-anchor="middle" fill="var(--text)" font-size="14.2222" font-family="Arial, sans-serif">• Rollback triggers on error rate thresholds</text>
</svg>
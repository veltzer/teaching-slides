<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="115" y="88.3333" width="1050" height="44.3056" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="118.1389" text-anchor="middle" fill="var(--bg)" font-size="20.8566" font-weight="bold" font-family="Arial, sans-serif">Multi-Environment Deployment Pipeline</text>
  <rect x="115" y="164.8611" width="225" height="201.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="115" y="164.8611" width="225" height="37.0556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="115" y="190.6389" width="225" height="11.2777" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="227.5" y="192.25" text-anchor="middle" fill="var(--bg)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">Dev</text>
  <text x="227.5" y="233.3333" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Arial, sans-serif">Auto-deploy</text>
  <text x="227.5" y="255.8889" text-anchor="middle" fill="var(--text)" font-size="12.1663" font-family="Arial, sans-serif">Every commit</text>
  <text x="227.5" y="278.4444" text-anchor="middle" fill="var(--text)" font-size="12.1663" font-family="Arial, sans-serif">Feature branches</text>
  <text x="227.5" y="301" text-anchor="middle" fill="var(--text)" font-size="12.1663" font-family="Arial, sans-serif">No approval needed</text>
  <text x="227.5" y="331.6111" text-anchor="middle" fill="var(--text-faint)" font-size="11.2974" font-family="Arial, sans-serif">Minutes</text>
  <line x1="339.9999" y1="265.5556" x2="386.875" y2="265.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="396.25" y="164.8611" width="225" height="201.3889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="396.25" y="164.8611" width="225" height="37.0556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="396.25" y="190.6389" width="225" height="11.2777" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="508.7499" y="192.25" text-anchor="middle" fill="var(--bg)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">Staging</text>
  <text x="508.7499" y="233.3333" text-anchor="middle" fill="var(--ok-accent)" font-size="13.9044" font-family="Arial, sans-serif">Daily sync</text>
  <text x="508.7499" y="255.8889" text-anchor="middle" fill="var(--text)" font-size="12.1663" font-family="Arial, sans-serif">Full testing suite</text>
  <text x="508.7499" y="278.4444" text-anchor="middle" fill="var(--text)" font-size="12.1663" font-family="Arial, sans-serif">QA validation</text>
  <text x="508.7499" y="301" text-anchor="middle" fill="var(--text)" font-size="12.1663" font-family="Arial, sans-serif">Performance tests</text>
  <text x="508.7499" y="331.6111" text-anchor="middle" fill="var(--text-faint)" font-size="11.2974" font-family="Arial, sans-serif">Hours</text>
  <line x1="621.25" y1="265.5556" x2="668.125" y2="265.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="677.4999" y="164.8611" width="225" height="201.3889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="677.4999" y="164.8611" width="225" height="37.0556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="677.4999" y="190.6389" width="225" height="11.2777" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="790" y="192.25" text-anchor="middle" fill="var(--bg)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">Pre-Prod</text>
  <text x="790" y="233.3333" text-anchor="middle" fill="var(--warn-accent)" font-size="13.9044" font-family="Arial, sans-serif">Weekly release</text>
  <text x="790" y="255.8889" text-anchor="middle" fill="var(--text)" font-size="12.1663" font-family="Arial, sans-serif">Prod mirror</text>
  <text x="790" y="278.4444" text-anchor="middle" fill="var(--text)" font-size="12.1663" font-family="Arial, sans-serif">Load testing</text>
  <text x="790" y="301" text-anchor="middle" fill="var(--text)" font-size="12.1663" font-family="Arial, sans-serif">Sign-off required</text>
  <text x="790" y="331.6111" text-anchor="middle" fill="var(--text-faint)" font-size="11.2974" font-family="Arial, sans-serif">Days</text>
  <line x1="902.5" y1="265.5556" x2="949.375" y2="265.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="958.75" y="164.8611" width="206.25" height="201.3889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="958.75" y="164.8611" width="206.25" height="37.0556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="958.75" y="190.6389" width="206.25" height="11.2777" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1061.875" y="192.25" text-anchor="middle" fill="var(--bg)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">Prod</text>
  <text x="1061.875" y="233.3333" text-anchor="middle" fill="var(--danger-accent)" font-size="13.9044" font-family="Arial, sans-serif">Manual gate</text>
  <text x="1061.875" y="255.8889" text-anchor="middle" fill="var(--text)" font-size="12.1663" font-family="Arial, sans-serif">Approved only</text>
  <text x="1061.875" y="278.4444" text-anchor="middle" fill="var(--text)" font-size="12.1663" font-family="Arial, sans-serif">Canary rollout</text>
  <text x="1061.875" y="301" text-anchor="middle" fill="var(--text)" font-size="12.1663" font-family="Arial, sans-serif">Instant rollback</text>
  <text x="1061.875" y="331.6111" text-anchor="middle" fill="var(--text-faint)" font-size="11.2974" font-family="Arial, sans-serif">Controlled</text>
  <rect x="115" y="394.4444" width="1050" height="193.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="425.0556" text-anchor="middle" fill="var(--primary-accent)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">AI-Managed Environment Consistency</text>
  <text x="640" y="454.8611" text-anchor="middle" fill="var(--text)" font-size="13.9044" font-family="Arial, sans-serif">• Config drift detection across environments</text>
  <text x="640" y="481.4444" text-anchor="middle" fill="var(--text)" font-size="13.9044" font-family="Arial, sans-serif">• Automated secret rotation and env-var sync</text>
  <text x="640" y="508.0277" text-anchor="middle" fill="var(--text)" font-size="13.9044" font-family="Arial, sans-serif">• Promotion gating based on quality metrics</text>
  <text x="640" y="534.6111" text-anchor="middle" fill="var(--text)" font-size="13.9044" font-family="Arial, sans-serif">• Rollback triggers on error rate thresholds</text>
</svg>
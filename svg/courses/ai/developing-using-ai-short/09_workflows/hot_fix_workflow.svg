<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Steps row -->
  <circle cx="160" cy="320" r="90" fill="#ffebee" stroke="#e53935" stroke-width="3" filter="url(#shadow)"/>
  <text x="160" y="308" text-anchor="middle" fill="#b71c1c" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Alert</text>
  <text x="160" y="338" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Incident detected</text>
  <line x1="250" y1="320" x2="330" y2="320" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <circle cx="420" cy="320" r="90" fill="#fff3e0" stroke="#fb8c00" stroke-width="3" filter="url(#shadow)"/>
  <text x="420" y="308" text-anchor="middle" fill="#e65100" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Diagnose</text>
  <text x="420" y="338" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Root cause</text>
  <line x1="510" y1="320" x2="590" y2="320" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <circle cx="680" cy="320" r="90" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="680" y="308" text-anchor="middle" fill="#1565c0" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Fix</text>
  <text x="680" y="338" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">AI-assisted patch</text>
  <line x1="770" y1="320" x2="850" y2="320" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <circle cx="940" cy="320" r="90" fill="#f3e5f5" stroke="#8e24aa" stroke-width="3" filter="url(#shadow)"/>
  <text x="940" y="308" text-anchor="middle" fill="#6a1b9a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="940" y="338" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Regression check</text>
  <line x1="1030" y1="320" x2="1110" y2="320" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <circle cx="1170" cy="320" r="90" fill="#e8f5e9" stroke="#43a047" stroke-width="3" filter="url(#shadow)"/>
  <text x="1170" y="308" text-anchor="middle" fill="#2e7d32" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="1170" y="338" text-anchor="middle" fill="#555" font-size="14" font-family="Arial, sans-serif">Hotfix to prod</text>
  <!-- Target banner -->
  <rect x="80" y="460" width="1120" height="80" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="508" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial, sans-serif">Target: &lt; 45 minutes total</text>
  <!-- Details -->
  <rect x="80" y="570" width="1120" height="120" rx="10" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="608" text-anchor="middle" fill="#1565c0" font-size="18" font-weight="bold" font-family="Arial, sans-serif">AI Contribution to Hotfix Speed</text>
  <text x="640" y="640" text-anchor="middle" fill="#444" font-size="16" font-family="Arial, sans-serif">Diagnosis: log analysis, pattern matching — Fix: code suggestion, similar-bug lookup</text>
  <text x="640" y="668" text-anchor="middle" fill="#444" font-size="16" font-family="Arial, sans-serif">Testing: regression test generation, impact analysis in under 5 minutes</text>
</svg>

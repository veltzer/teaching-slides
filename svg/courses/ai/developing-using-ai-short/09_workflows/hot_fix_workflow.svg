<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="203.310831" height="203.311" rx="13.999994" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="141.655506" y="126.141834" text-anchor="middle" fill="var(--danger-accent)" font-size="22.59018" font-weight="bold" font-family="Arial, sans-serif">Alert</text>
  <text x="141.655506" y="164.926388" text-anchor="middle" fill="var(--text-muted)" font-size="15.812969" font-family="Arial, sans-serif">Incident detected</text>
  <line x1="230.469288" y1="141.655591" x2="309.41487" y2="141.655591" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="296.572786" y="40" width="203.310831" height="203.311" rx="13.999994" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="398.228652" y="126.141834" text-anchor="middle" fill="var(--warn-accent)" font-size="22.59018" font-weight="bold" font-family="Arial, sans-serif">Diagnose</text>
  <text x="398.228652" y="164.926388" text-anchor="middle" fill="var(--text-muted)" font-size="15.812969" font-family="Arial, sans-serif">Root cause</text>
  <line x1="487.042432" y1="141.655591" x2="565.987912" y2="141.655591" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="553.146572" y="40" width="203.310831" height="203.311" rx="13.999994" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="654.801692" y="126.141834" text-anchor="middle" fill="var(--primary-accent)" font-size="22.59018" font-weight="bold" font-family="Arial, sans-serif">Fix</text>
  <text x="654.801692" y="164.926388" text-anchor="middle" fill="var(--text-muted)" font-size="15.812969" font-family="Arial, sans-serif">AI-assisted patch</text>
  <line x1="743.615473" y1="141.655591" x2="822.561163" y2="141.655591" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="809.719359" y="40" width="203.310831" height="203.311" rx="13.999994" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="911.374942" y="126.141834" text-anchor="middle" fill="var(--info-accent)" font-size="22.59018" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="911.374942" y="164.926388" text-anchor="middle" fill="var(--text-muted)" font-size="15.812969" font-family="Arial, sans-serif">Regression check</text>
  <line x1="1000.188723" y1="141.655591" x2="1079.134304" y2="141.655591" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="1036.689169" y="40" width="203.310831" height="203.311" rx="13.999994" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.6667" filter="url(#shadow)"/>
  <text x="1138.343494" y="126.141834" text-anchor="middle" fill="var(--ok-accent)" font-size="22.59018" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="1138.343494" y="164.926388" text-anchor="middle" fill="var(--text-muted)" font-size="15.812969" font-family="Arial, sans-serif">Hotfix to prod</text>
  <rect x="62.709922" y="322.650881" width="1105.238163" height="103.425694" rx="7.798413" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="615.329005" y="384.706393" text-anchor="middle" fill="var(--bg)" font-size="27.108059" font-weight="bold" font-family="Arial, sans-serif">Target: &lt; 45 minutes total</text>
  <rect x="62.709922" y="464.861293" width="1105.238163" height="155.138707" rx="7.798413" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="615.329005" y="513.988356" text-anchor="middle" fill="var(--primary-accent)" font-size="20.33111" font-weight="bold" font-family="Arial, sans-serif">AI Contribution to Hotfix Speed</text>
  <text x="615.329005" y="555.358859" text-anchor="middle" fill="var(--text)" font-size="18.072039" font-family="Arial, sans-serif">Diagnosis: log analysis, pattern matching — Fix: code suggestion, similar-bug lookup</text>
  <text x="615.329005" y="591.557789" text-anchor="middle" fill="var(--text)" font-size="18.072039" font-family="Arial, sans-serif">Testing: regression test generation, impact analysis in under 5 minutes</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <circle cx="190" cy="297.7777" r="78.2125" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="190" y="288.1111" text-anchor="middle" fill="var(--danger-accent)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">Alert</text>
  <text x="190" y="312.2777" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Incident detected</text>
  <line x1="274.375" y1="297.7777" x2="349.375" y2="297.7777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <circle cx="433.75" cy="297.7777" r="78.2125" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="433.75" y="288.1111" text-anchor="middle" fill="var(--warn-accent)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">Diagnose</text>
  <text x="433.75" y="312.2777" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Root cause</text>
  <line x1="518.125" y1="297.7777" x2="593.1249" y2="297.7777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <circle cx="677.4999" cy="297.7777" r="78.2125" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="677.4999" y="288.1111" text-anchor="middle" fill="var(--primary-accent)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">Fix</text>
  <text x="677.4999" y="312.2777" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">AI-assisted patch</text>
  <line x1="761.8749" y1="297.7777" x2="836.875" y2="297.7777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <circle cx="921.25" cy="297.7777" r="78.2125" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="921.25" y="288.1111" text-anchor="middle" fill="var(--info-accent)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">Test</text>
  <text x="921.25" y="312.2777" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Regression check</text>
  <line x1="1005.625" y1="297.7777" x2="1080.625" y2="297.7777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <circle cx="1136.875" cy="297.7777" r="78.2125" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="1136.875" y="288.1111" text-anchor="middle" fill="var(--ok-accent)" font-size="17.3806" font-weight="bold" font-family="Arial, sans-serif">Deploy</text>
  <text x="1136.875" y="312.2777" text-anchor="middle" fill="var(--text-muted)" font-size="12.1663" font-family="Arial, sans-serif">Hotfix to prod</text>
  <rect x="115" y="410.5556" width="1050" height="64.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="449.2223" text-anchor="middle" fill="var(--bg)" font-size="20.8566" font-weight="bold" font-family="Arial, sans-serif">Target: &lt; 45 minutes total</text>
  <rect x="115" y="499.1667" width="1050" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="529.7777" text-anchor="middle" fill="var(--primary-accent)" font-size="15.6425" font-weight="bold" font-family="Arial, sans-serif">AI Contribution to Hotfix Speed</text>
  <text x="640" y="555.5556" text-anchor="middle" fill="var(--text)" font-size="13.9044" font-family="Arial, sans-serif">Diagnosis: log analysis, pattern matching — Fix: code suggestion, similar-bug lookup</text>
  <text x="640" y="578.1111" text-anchor="middle" fill="var(--text)" font-size="13.9044" font-family="Arial, sans-serif">Testing: regression test generation, impact analysis in under 5 minutes</text>
</svg>
  <ns0:text x="96" y="287.1111" text-anchor="middle" fill="white" font-size="24.8889" font-weight="bold" font-family="Arial, sans-serif">2</ns0:text>
  <ns0:text x="142.2222" y="271.1111" font-size="17.7778" font-weight="bold" fill="#e65100" font-family="Arial, sans-serif">Investigation</ns0:text>
  <ns0:text x="142.2222" y="303.1111" font-size="15.1111" fill="#444" font-family="Arial, sans-serif">Queue logs show "rate limit exceeded" — 429 errors in provider API</ns0:text>

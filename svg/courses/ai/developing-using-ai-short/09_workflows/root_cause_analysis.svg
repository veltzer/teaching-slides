  <ns0:text x="142.2222" y="380.4444" font-size="17.7778" font-weight="bold" fill="#1565c0" font-family="Arial, sans-serif">Root Cause</ns0:text>
  <ns0:text x="142.2222" y="412.4444" font-size="15.1111" fill="#444" font-family="Arial, sans-serif">Email provider rate limiting — burst of 1000/hr, limit is 500/hr</ns0:text>
  <ns0:rect x="71.1111" y="452.4444" width="995.5556" height="93.3333" rx="8.8889" fill="#e8f5e9" stroke="#43a047" stroke-width="1.7778" filter="url(#shadow)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header -->
  <rect x="80" y="50" width="1120" height="55" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="87" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial, sans-serif">Bug Investigation Process</text>
  <!-- Steps as numbered cards -->
  <rect x="80" y="140" width="1120" height="105" rx="10" fill="#ffebee" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="140" width="56" height="105" rx="10" fill="#e53935"/>
  <text x="108" y="200" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="Arial, sans-serif">1</text>
  <text x="160" y="182" font-size="20" font-weight="bold" fill="#b71c1c" font-family="Arial, sans-serif">Symptom</text>
  <text x="160" y="218" font-size="17" fill="#444" font-family="Arial, sans-serif">Notifications fail silently — users report no emails received</text>
  <rect x="80" y="263" width="1120" height="105" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="263" width="56" height="105" rx="10" fill="#fb8c00"/>
  <text x="108" y="323" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="Arial, sans-serif">2</text>
  <text x="160" y="305" font-size="20" font-weight="bold" fill="#e65100" font-family="Arial, sans-serif">Investigation</text>
  <text x="160" y="341" font-size="17" fill="#444" font-family="Arial, sans-serif">Queue logs show "rate limit exceeded" — 429 errors in provider API</text>
  <rect x="80" y="386" width="1120" height="105" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="386" width="56" height="105" rx="10" fill="url(#grad-accent)"/>
  <text x="108" y="446" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="Arial, sans-serif">3</text>
  <text x="160" y="428" font-size="20" font-weight="bold" fill="#1565c0" font-family="Arial, sans-serif">Root Cause</text>
  <text x="160" y="464" font-size="17" fill="#444" font-family="Arial, sans-serif">Email provider rate limiting — burst of 1000/hr, limit is 500/hr</text>
  <rect x="80" y="509" width="1120" height="105" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="509" width="56" height="105" rx="10" fill="#43a047"/>
  <text x="108" y="569" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="Arial, sans-serif">4</text>
  <text x="160" y="551" font-size="20" font-weight="bold" fill="#2e7d32" font-family="Arial, sans-serif">Solution</text>
  <text x="160" y="587" font-size="17" fill="#444" font-family="Arial, sans-serif">Implement exponential backoff + queue batching with jitter</text>
</svg>

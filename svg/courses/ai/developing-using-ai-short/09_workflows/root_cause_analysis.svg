  <ns0:text x="142.2222" y="489.7778" font-size="17.7778" font-weight="bold" fill="#2e7d32" font-family="Arial, sans-serif">Solution</ns0:text>
  <ns0:text x="142.2222" y="521.7778" font-size="15.1111" fill="#444" font-family="Arial, sans-serif">Implement exponential backoff + queue batching with jitter</ns0:text>

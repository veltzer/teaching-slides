<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="56.560345" rx="7.247262" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="78.049705" text-anchor="middle" fill="var(--bg)" font-size="25.192206" font-weight="bold" font-family="Arial, sans-serif">Bug Investigation Process</text>
  <rect x="40" y="132.553198" width="1200" height="107.978689" rx="7.247262" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="132.553198" width="60" height="107.978689" rx="7.247262" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="70" y="194.255416" text-anchor="middle" fill="var(--bg)" font-size="29.391028" font-weight="bold" font-family="Arial, sans-serif">1</text>
  <text x="125.714286" y="175.744776" font-size="20.993626" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Symptom</text>
  <text x="125.714286" y="212.766055" font-size="17.84457" fill="var(--text)" font-family="Arial, sans-serif">Notifications fail silently — users report no emails received</text>
  <rect x="40" y="259.042654" width="1200" height="107.978689" rx="7.247262" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="259.042654" width="60" height="107.978689" rx="7.247262" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="70" y="320.744744" text-anchor="middle" fill="var(--bg)" font-size="29.391028" font-weight="bold" font-family="Arial, sans-serif">2</text>
  <text x="125.714286" y="302.234104" font-size="20.993626" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Investigation</text>
  <text x="125.714286" y="339.255384" font-size="17.84457" fill="var(--text)" font-family="Arial, sans-serif">Queue logs show "rate limit exceeded" — 429 errors in provider API</text>
  <rect x="40" y="385.531983" width="1200" height="107.978689" rx="7.247262" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="385.531983" width="60" height="107.978689" rx="7.247262" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="70" y="447.234072" text-anchor="middle" fill="var(--bg)" font-size="29.391028" font-weight="bold" font-family="Arial, sans-serif">3</text>
  <text x="125.714286" y="428.723433" font-size="20.993626" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Root Cause</text>
  <text x="125.714286" y="465.744712" font-size="17.84457" fill="var(--text)" font-family="Arial, sans-serif">Email provider rate limiting — burst of 1000/hr, limit is 500/hr</text>
  <rect x="40" y="512.021311" width="1200" height="107.978689" rx="7.247262" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="512.021311" width="60" height="107.978689" rx="7.247262" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="70" y="573.723529" text-anchor="middle" fill="var(--bg)" font-size="29.391028" font-weight="bold" font-family="Arial, sans-serif">4</text>
  <text x="125.714286" y="555.212889" font-size="20.993626" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Solution</text>
  <text x="125.714286" y="592.234168" font-size="17.84457" fill="var(--text)" font-family="Arial, sans-serif">Implement exponential backoff + queue batching with jitter</text>
</svg>
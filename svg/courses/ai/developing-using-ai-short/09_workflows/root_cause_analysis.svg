  <ns0:text x="142.2222" y="161.7778" font-size="17.7778" font-weight="bold" fill="#b71c1c" font-family="Arial, sans-serif">Symptom</ns0:text>
  <ns0:text x="142.2222" y="193.7778" font-size="15.1111" fill="#444" font-family="Arial, sans-serif">Notifications fail silently — users report no emails received</ns0:text>
  <ns0:rect x="71.1111" y="233.7778" width="995.5556" height="93.3333" rx="8.8889" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.7778" filter="url(#shadow)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="50.634971" rx="6.857143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="74.063314" text-anchor="middle" fill="var(--bg)" font-size="23.836114" font-weight="bold" font-family="Arial, sans-serif">Project Success Metrics</text>
  <rect x="40" y="113.650743" width="353.571429" height="184.126971" rx="6.857143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="216.785714" y="157.841143" text-anchor="middle" fill="var(--primary-accent)" font-size="17.877143" font-family="Arial, sans-serif">Velocity</text>
  <text x="216.785714" y="207.555429" text-anchor="middle" fill="var(--primary-accent)" font-size="37.740686" font-weight="bold" font-family="Arial, sans-serif">+40%</text>
  <text x="216.785714" y="246.222171" text-anchor="middle" fill="var(--text-muted)" font-size="14.8976" font-family="Arial, sans-serif">with AI assistance</text>
  <rect x="463.214286" y="113.650743" width="353.571429" height="184.126971" rx="6.857143" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="157.841143" text-anchor="middle" fill="var(--ok-accent)" font-size="17.877143" font-family="Arial, sans-serif">Bug Rate</text>
  <text x="640" y="207.555429" text-anchor="middle" fill="var(--ok-accent)" font-size="37.740686" font-weight="bold" font-family="Arial, sans-serif">-65%</text>
  <text x="640" y="246.222171" text-anchor="middle" fill="var(--text-muted)" font-size="14.8976" font-family="Arial, sans-serif">reduction</text>
  <rect x="886.428457" y="113.650743" width="353.571429" height="184.126971" rx="6.857143" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.214286" y="157.841143" text-anchor="middle" fill="var(--warn-accent)" font-size="17.877143" font-family="Arial, sans-serif">Deploy Freq</text>
  <text x="1063.214286" y="207.555429" text-anchor="middle" fill="var(--warn-accent)" font-size="37.740686" font-weight="bold" font-family="Arial, sans-serif">3x/wk</text>
  <text x="1063.214286" y="246.222171" text-anchor="middle" fill="var(--text-muted)" font-size="14.8976" font-family="Arial, sans-serif">per week</text>
  <rect x="40" y="325.396686" width="353.571429" height="184.126971" rx="6.857143" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="216.785714" y="369.5872" text-anchor="middle" fill="var(--danger-accent)" font-size="17.877143" font-family="Arial, sans-serif">MTTR</text>
  <text x="216.785714" y="419.301486" text-anchor="middle" fill="var(--danger-accent)" font-size="37.740686" font-weight="bold" font-family="Arial, sans-serif">45min</text>
  <text x="216.785714" y="457.968114" text-anchor="middle" fill="var(--text-muted)" font-size="14.8976" font-family="Arial, sans-serif">incident recovery</text>
  <rect x="463.214286" y="325.396686" width="353.571429" height="184.126971" rx="6.857143" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="369.5872" text-anchor="middle" fill="var(--info-accent)" font-size="17.877143" font-family="Arial, sans-serif">Test Coverage</text>
  <text x="640" y="419.301486" text-anchor="middle" fill="var(--info-accent)" font-size="37.740686" font-weight="bold" font-family="Arial, sans-serif">92%</text>
  <text x="640" y="457.968114" text-anchor="middle" fill="var(--text-muted)" font-size="14.8976" font-family="Arial, sans-serif">test coverage</text>
  <rect x="886.428457" y="325.396686" width="353.571429" height="184.126971" rx="6.857143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.214286" y="369.5872" text-anchor="middle" fill="var(--ok-accent)" font-size="17.877143" font-family="Arial, sans-serif">Satisfaction</text>
  <text x="1063.214286" y="419.301486" text-anchor="middle" fill="var(--ok-accent)" font-size="37.740686" font-weight="bold" font-family="Arial, sans-serif">4.8/5</text>
  <text x="1063.214286" y="457.968114" text-anchor="middle" fill="var(--text-muted)" font-size="14.8976" font-family="Arial, sans-serif">team rating</text>
  <rect x="40" y="537.142857" width="1200" height="82.857143" rx="6.857143" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="572.126857" text-anchor="middle" fill="var(--primary-accent)" font-size="17.877143" font-weight="bold" font-family="Arial, sans-serif">Measure regularly — metrics drive AI-investment decisions</text>
  <text x="640" y="601.5872" text-anchor="middle" fill="var(--text-muted)" font-size="14.8976" font-family="Arial, sans-serif">Baseline before AI adoption, track 30/60/90 days post-adoption</text>
</svg>
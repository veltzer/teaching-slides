<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="71.1111" y="35.5556" width="995.5556" height="48.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="68.4444" text-anchor="middle" fill="var(--bg)" font-size="21.3333" font-weight="bold" font-family="Arial, sans-serif">Project Success Metrics</text>
  <rect x="71.1111" y="106.6667" width="293.3333" height="177.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="217.7778" y="149.3333" text-anchor="middle" fill="var(--primary-accent)" font-size="16" font-family="Arial, sans-serif">Velocity</text>
  <text x="217.7778" y="197.3333" text-anchor="middle" fill="var(--primary-accent)" font-size="33.7778" font-weight="bold" font-family="Arial, sans-serif">+40%</text>
  <text x="217.7778" y="234.6667" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">with AI assistance</text>
  <rect x="422.2222" y="106.6667" width="293.3333" height="177.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="149.3333" text-anchor="middle" fill="var(--ok-accent)" font-size="16" font-family="Arial, sans-serif">Bug Rate</text>
  <text x="568.8889" y="197.3333" text-anchor="middle" fill="var(--ok-accent)" font-size="33.7778" font-weight="bold" font-family="Arial, sans-serif">-65%</text>
  <text x="568.8889" y="234.6667" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">reduction</text>
  <rect x="773.3333" y="106.6667" width="293.3333" height="177.7778" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="920" y="149.3333" text-anchor="middle" fill="var(--warn-accent)" font-size="16" font-family="Arial, sans-serif">Deploy Freq</text>
  <text x="920" y="197.3333" text-anchor="middle" fill="var(--warn-accent)" font-size="33.7778" font-weight="bold" font-family="Arial, sans-serif">3x/wk</text>
  <text x="920" y="234.6667" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">per week</text>
  <rect x="71.1111" y="311.1111" width="293.3333" height="177.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="217.7778" y="353.7778" text-anchor="middle" fill="var(--danger-accent)" font-size="16" font-family="Arial, sans-serif">MTTR</text>
  <text x="217.7778" y="401.7778" text-anchor="middle" fill="var(--danger-accent)" font-size="33.7778" font-weight="bold" font-family="Arial, sans-serif">45min</text>
  <text x="217.7778" y="439.1111" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">incident recovery</text>
  <rect x="422.2222" y="311.1111" width="293.3333" height="177.7778" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="353.7778" text-anchor="middle" fill="var(--info-accent)" font-size="16" font-family="Arial, sans-serif">Test Coverage</text>
  <text x="568.8889" y="401.7778" text-anchor="middle" fill="var(--info-accent)" font-size="33.7778" font-weight="bold" font-family="Arial, sans-serif">92%</text>
  <text x="568.8889" y="439.1111" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">test coverage</text>
  <rect x="773.3333" y="311.1111" width="293.3333" height="177.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="920" y="353.7778" text-anchor="middle" fill="var(--ok-accent)" font-size="16" font-family="Arial, sans-serif">Satisfaction</text>
  <text x="920" y="401.7778" text-anchor="middle" fill="var(--ok-accent)" font-size="33.7778" font-weight="bold" font-family="Arial, sans-serif">4.8/5</text>
  <text x="920" y="439.1111" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">team rating</text>
  <rect x="71.1111" y="515.5556" width="995.5556" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="549.3333" text-anchor="middle" fill="var(--primary-accent)" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Measure regularly — metrics drive AI-investment decisions</text>
  <text x="568.8889" y="577.7778" text-anchor="middle" fill="var(--text-muted)" font-size="13.3333" font-family="Arial, sans-serif">Baseline before AI adoption, track 30/60/90 days post-adoption</text>
</svg>
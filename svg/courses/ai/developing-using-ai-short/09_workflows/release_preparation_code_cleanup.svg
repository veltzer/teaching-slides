<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="52.124235" rx="6.957252" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="75.065412" text-anchor="middle" fill="var(--bg)" font-size="24.184105" font-weight="bold" font-family="Arial, sans-serif">Pre-Release Checklist</text>
  <rect x="40" y="125.294118" width="1200" height="85.294118" rx="6.957252" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="82.857143" y="175.523059" font-size="22.168821" fill="var(--primary-accent)" font-family="Arial, sans-serif">Remove console.logs and debug code</text>
  <rect x="1154.285714" y="139.509882" width="64.285714" height="56.862706" rx="6.957252" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1186.428571" y="177.418353" text-anchor="middle" fill="var(--bg)" font-size="28.214905" font-weight="bold" font-family="Arial, sans-serif">✓</text>
  <rect x="40" y="227.647059" width="1200" height="85.294118" rx="6.957252" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="82.857143" y="277.876" font-size="22.168821" fill="var(--ok-accent)" font-family="Arial, sans-serif">Update dependencies to stable versions</text>
  <rect x="1154.285714" y="241.862824" width="64.285714" height="56.862706" rx="6.957252" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1186.428571" y="279.771294" text-anchor="middle" fill="var(--bg)" font-size="28.214905" font-weight="bold" font-family="Arial, sans-serif">✓</text>
  <rect x="40" y="330" width="1200" height="85.294118" rx="6.957252" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="82.857143" y="380.228941" font-size="22.168821" fill="var(--warn-accent)" font-family="Arial, sans-serif">Run full test suite — all tests green</text>
  <rect x="1154.285714" y="344.215765" width="64.285714" height="56.862706" rx="6.957252" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1186.428571" y="382.124235" text-anchor="middle" fill="var(--bg)" font-size="28.214905" font-weight="bold" font-family="Arial, sans-serif">✓</text>
  <rect x="40" y="432.352941" width="1200" height="85.294118" rx="6.957252" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="82.857143" y="482.581882" font-size="22.168821" fill="var(--danger-accent)" font-family="Arial, sans-serif">Security audit passed — no critical CVEs</text>
  <rect x="1154.285714" y="446.568706" width="64.285714" height="56.862706" rx="6.957252" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1186.428571" y="484.477176" text-anchor="middle" fill="var(--bg)" font-size="28.214905" font-weight="bold" font-family="Arial, sans-serif">✓</text>
  <rect x="40" y="534.705882" width="1200" height="85.294118" rx="6.957252" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="82.857143" y="584.934824" font-size="22.168821" fill="var(--info-accent)" font-family="Arial, sans-serif">Performance benchmarks met — SLA compliant</text>
  <rect x="1154.285714" y="548.921647" width="64.285714" height="56.862706" rx="6.957252" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1186.428571" y="586.830118" text-anchor="middle" fill="var(--bg)" font-size="28.214905" font-weight="bold" font-family="Arial, sans-serif">✓</text>
</svg>
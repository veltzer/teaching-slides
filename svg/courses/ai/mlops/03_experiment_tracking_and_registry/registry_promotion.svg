<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.03701420285" font-weight="bold" fill="var(--text)">Model Registry Promotion Flow</text>

  <rect x="40" y="125.925925925926" width="235.714285714286" height="128.888888888889" rx="10.727505072446" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="157.857142857143" y="163.518518518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309509130404" font-weight="bold" fill="var(--info-text)">Train run</text>
  <text x="157.857142857143" y="195.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--info-text)">v1.4.0-rc1</text>
  <text x="157.857142857143" y="217.222222222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--info-text)">accuracy 0.87</text>
  <text x="157.857142857143" y="238.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--info-text)">f1 0.84</text>

  <rect x="361.428571428571" y="125.925925925926" width="235.714285714286" height="128.888888888889" rx="10.727505072446" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="479.285714285714" y="163.518518518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309509130404" font-weight="bold" fill="var(--warn-text)">Stage: dev</text>
  <text x="479.285714285714" y="195.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--warn-text)">candidate registered</text>
  <text x="479.285714285714" y="217.222222222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--warn-text)">smoke tests</text>
  <text x="479.285714285714" y="238.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--warn-text)">unit tests</text>

  <rect x="682.857142857143" y="125.925925925926" width="235.714285714286" height="128.888888888889" rx="10.727505072446" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800.714285714286" y="163.518518518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309509130404" font-weight="bold" fill="var(--primary-text)">Stage: staging</text>
  <text x="800.714285714286" y="195.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--primary-text)">shadow traffic</text>
  <text x="800.714285714286" y="217.222222222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--primary-text)">approval gate</text>
  <text x="800.714285714286" y="238.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--primary-text)">bias slices ok</text>

  <rect x="1004.285714285714" y="125.925925925926" width="235.714285714286" height="128.888888888889" rx="10.727505072446" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.142857142857" y="163.518518518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309509130404" font-weight="bold" fill="var(--ok-text)">Stage: prod</text>
  <text x="1122.142857142857" y="195.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--ok-text)">canary at 5%</text>
  <text x="1122.142857142857" y="217.222222222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--ok-text)">ramp to 100%</text>
  <text x="1122.142857142857" y="238.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--ok-text)">monitor live</text>

  <path d="M 275.714285714286 190.37037037037 L 361.428571428571 190.37037037037" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 597.142857142857 190.37037037037 L 682.857142857143 190.37037037037" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 918.571428571429 190.37037037037 L 1004.285714285714 190.37037037037" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="319.259259259259" width="1200" height="64.444444444444" rx="8.582004057957" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="346.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--warn-text)">Approval gates between stages</text>
  <text x="640" y="370.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--warn-text)">metrics threshold + bias check + security scan + manual sign-off when required</text>

  <rect x="40" y="426.666666666667" width="578.571428571429" height="193.333333333333" rx="10.727505072446" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="329.285714285714" y="456.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--text)">Logged per run</text>
  <text x="82.857142857143" y="488.962962962963" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">code git SHA</text>
  <text x="82.857142857143" y="512.592592592593" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">data version hash</text>
  <text x="82.857142857143" y="536.222222222222" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">hyperparameters</text>
  <text x="82.857142857143" y="559.851851851852" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">metrics + slices</text>
  <text x="82.857142857143" y="583.481481481482" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">artifacts (weights, plots)</text>
  <text x="82.857142857143" y="607.111111111111" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">tags: experiment, branch, user</text>

  <rect x="661.428571428571" y="426.666666666667" width="578.571428571429" height="193.333333333333" rx="10.727505072446" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950.714285714286" y="456.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--text)">Rollback path</text>
  <text x="704.285714285714" y="488.962962962963" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">previous version stays warm</text>
  <text x="704.285714285714" y="512.592592592593" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">flip pointer in registry</text>
  <text x="704.285714285714" y="536.222222222222" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">no redeploy needed</text>
  <text x="704.285714285714" y="559.851851851852" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">audit trail preserved</text>
  <text x="704.285714285714" y="583.481481481482" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--text-muted)">incident postmortem mandatory</text>
  <text x="704.285714285714" y="607.111111111111" font-family="Arial, sans-serif" font-size="13.94575659418" font-weight="bold" fill="var(--danger-accent)">never delete a registered version</text>
</svg>

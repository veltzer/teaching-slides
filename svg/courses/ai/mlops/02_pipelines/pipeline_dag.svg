<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="629.473684210526" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.235882783068" font-weight="bold" fill="var(--text)">ML Pipeline as a DAG</text>

  <rect x="40" y="122.857142857143" width="189.473684210526" height="62.142857142857" rx="8.353109366591" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="134.736842105263" y="159.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.662080062358" font-weight="bold" fill="var(--info-text)">ingest_raw</text>

  <rect x="40" y="226.428571428571" width="189.473684210526" height="62.142857142857" rx="8.353109366591" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="134.736842105263" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.662080062358" font-weight="bold" fill="var(--info-text)">validate_schema</text>

  <rect x="292.631578947368" y="174.642857142857" width="189.473684210526" height="62.142857142857" rx="8.353109366591" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="387.368421052632" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.662080062358" font-weight="bold" fill="var(--info-text)">build_features</text>

  <rect x="545.263157894737" y="122.857142857143" width="189.473684210526" height="62.142857142857" rx="8.353109366591" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="159.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.662080062358" font-weight="bold" fill="var(--primary-text)">train_model</text>

  <rect x="545.263157894737" y="226.428571428571" width="189.473684210526" height="62.142857142857" rx="8.353109366591" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.662080062358" font-weight="bold" fill="var(--primary-text)">evaluate</text>

  <rect x="797.894736842105" y="174.642857142857" width="189.473684210526" height="62.142857142857" rx="8.353109366591" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="892.631578947368" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.662080062358" font-weight="bold" fill="var(--warn-text)">register</text>

  <rect x="1050.526315789474" y="122.857142857143" width="189.473684210526" height="62.142857142857" rx="8.353109366591" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.263157894737" y="159.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.662080062358" font-weight="bold" fill="var(--ok-text)">deploy_canary</text>

  <rect x="1050.526315789474" y="226.428571428571" width="189.473684210526" height="62.142857142857" rx="8.353109366591" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.263157894737" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.662080062358" font-weight="bold" fill="var(--ok-text)">promote_prod</text>

  <path d="M 229.473684210526 153.928571428571 L 292.631578947368 195.357142857143" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 229.473684210526 257.5 L 292.631578947368 216.071428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 482.105263157895 195.357142857143 L 545.263157894737 153.928571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 640 185 L 640 226.428571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 734.736842105263 257.5 L 797.894736842105 216.071428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 987.368421052632 195.357142857143 L 1050.526315789474 153.928571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1145.263157894737 185 L 1145.263157894737 226.428571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="392.142857142857" width="1200" height="227.857142857143" rx="10.441386708238" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="629.473684210526" y="423.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--text)">DAG properties</text>

  <text x="82.105263157895" y="459.464285714286" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text)">Each task: idempotent, resumable, tagged with version</text>
  <text x="82.105263157895" y="485.357142857143" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text)">Each edge: dependency, not just ordering</text>
  <text x="82.105263157895" y="511.25" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text)">Cache hits skip work when inputs unchanged</text>
  <text x="82.105263157895" y="537.142857142857" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text)">Failed task halts downstream — alerts fire, retries kick in</text>
  <text x="82.105263157895" y="563.035714285714" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--text)">Backfills run partitions in parallel where edges allow</text>
  <text x="82.105263157895" y="594.107142857143" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--danger-accent)">Anti-pattern: one giant task that does everything</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Threats To ML Systems</text>
  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Data Poisoning</text>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Bad data into training</text>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Backdoor patterns</text>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Detect via outliers</text>
  <text x="60" y="245" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Source provenance</text>
  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Adversarial</text>
  <text x="365" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Crafted inputs fool</text>
  <text x="365" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Tiny perturbations</text>
  <text x="365" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Adversarial training</text>
  <text x="365" y="245" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Confidence thresholds</text>
  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Model Theft</text>
  <text x="670" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Query to clone</text>
  <text x="670" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Rate limit per user</text>
  <text x="670" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Watermark outputs</text>
  <text x="670" y="245" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Restrict raw scores</text>
  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Privacy</text>
  <text x="975" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Model memorisation</text>
  <text x="975" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">PII leakage</text>
  <text x="975" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Differential privacy</text>
  <text x="975" y="245" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Data minimisation</text>
</svg>

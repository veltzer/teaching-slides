<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.762697824931" font-weight="bold" fill="var(--text)">Bias and Fairness: Slice Metrics</text>

  <rect x="40" y="103.272727272727" width="578.571428571429" height="63.272727272727" rx="8.50362794998" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.133162887456" font-weight="bold" fill="var(--info-text)">Aggregate accuracy: 91%</text>

  <text x="329.285714285714" y="208.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.881348912466" font-weight="bold" fill="var(--text)">Looks fine — until you slice it</text>

  <rect x="40" y="250.909090909091" width="578.571428571429" height="42.181818181818" rx="6.377720962485" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.428571428571" y="277.272727272727" font-family="Arial, sans-serif" font-size="14.881348912466" font-weight="bold" fill="var(--ok-text)">Group A: 96%</text>

  <rect x="40" y="303.636363636364" width="535.714285714286" height="42.181818181818" rx="6.377720962485" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.428571428571" y="330" font-family="Arial, sans-serif" font-size="14.881348912466" font-weight="bold" fill="var(--ok-text)">Group B: 92%</text>

  <rect x="40" y="356.363636363636" width="407.142857142857" height="42.181818181818" rx="6.377720962485" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.428571428571" y="382.727272727273" font-family="Arial, sans-serif" font-size="14.881348912466" font-weight="bold" fill="var(--warn-text)">Group C: 78%</text>

  <rect x="40" y="409.090909090909" width="300" height="42.181818181818" rx="6.377720962485" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="61.428571428571" y="435.454545454545" font-family="Arial, sans-serif" font-size="14.881348912466" font-weight="bold" fill="var(--danger-text)">Group D: 64%</text>

  <text x="329.285714285714" y="493.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.881348912466" fill="var(--danger-accent)">27-point gap hidden by aggregate</text>

  <rect x="661.428571428571" y="103.272727272727" width="578.571428571429" height="516.727272727273" rx="10.629534937476" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950.714285714286" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.133162887456" font-weight="bold" fill="var(--text)">What to do</text>

  <text x="693.571428571429" y="182.363636363636" font-family="Arial, sans-serif" font-size="14.881348912466" font-weight="bold" fill="var(--text)">1. Define sensitive attributes</text>
  <text x="704.285714285714" y="203.454545454545" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--text-muted)">age, region, language, device, etc.</text>

  <text x="693.571428571429" y="235.090909090909" font-family="Arial, sans-serif" font-size="14.881348912466" font-weight="bold" fill="var(--text)">2. Slice metrics per group</text>
  <text x="704.285714285714" y="256.181818181818" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--text-muted)">precision, recall, calibration, error rate</text>

  <text x="693.571428571429" y="287.818181818182" font-family="Arial, sans-serif" font-size="14.881348912466" font-weight="bold" fill="var(--text)">3. Set fairness thresholds</text>
  <text x="704.285714285714" y="308.909090909091" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--text-muted)">equalized odds, demographic parity</text>

  <text x="693.571428571429" y="340.545454545455" font-family="Arial, sans-serif" font-size="14.881348912466" font-weight="bold" fill="var(--text)">4. Address gaps</text>
  <text x="704.285714285714" y="365" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--text-muted)">rebalance training data</text>
  <text x="704.285714285714" y="395" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--text-muted)">tune per-group thresholds</text>

  <text x="693.571428571429" y="440.727272727273" font-family="Arial, sans-serif" font-size="14.881348912466" font-weight="bold" fill="var(--text)">5. Document residual bias</text>
  <text x="704.285714285714" y="461.818181818182" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--text-muted)">model card declares known limits</text>

  <text x="693.571428571429" y="493.454545454545" font-family="Arial, sans-serif" font-size="14.881348912466" font-weight="bold" fill="var(--text)">6. Monitor in production</text>
  <text x="704.285714285714" y="514.545454545455" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--text-muted)">slices drift independently</text>
  <text x="704.285714285714" y="535.636363636364" font-family="Arial, sans-serif" font-size="13.818395418718" fill="var(--text-muted)">alerts on per-slice regressions</text>

  <text x="950.714285714286" y="588.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.818395418718" font-weight="bold" fill="var(--danger-accent)">Anti-pattern: report only aggregate</text>
</svg>

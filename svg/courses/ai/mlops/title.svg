<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">MLOps</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="95" y="250" width="170" height="64" rx="10" fill="var(--primary-fill)"/>
  <text x="180" y="289" font-size="20" fill="var(--primary-text)">Data</text>
  <rect x="325" y="250" width="170" height="64" rx="10" fill="var(--info-fill)"/>
  <text x="410" y="289" font-size="20" fill="var(--info-text)">Train</text>
  <rect x="555" y="250" width="170" height="64" rx="10" fill="var(--warn-fill)"/>
  <text x="640" y="289" font-size="20" fill="var(--warn-text)">Registry</text>
  <rect x="785" y="250" width="170" height="64" rx="10" fill="var(--ok-fill)"/>
  <text x="870" y="289" font-size="20" fill="var(--ok-text)">Serve</text>
  <rect x="1015" y="250" width="170" height="64" rx="10" fill="var(--danger-fill)"/>
  <text x="1100" y="289" font-size="20" fill="var(--danger-text)">Monitor</text>
  <line x1="270" y1="282" x2="309" y2="282" stroke="var(--text-faint)" stroke-width="3"/>
  <polygon points="307,274 321,282 307,290" fill="var(--text-faint)"/>
  <line x1="500" y1="282" x2="539" y2="282" stroke="var(--text-faint)" stroke-width="3"/>
  <polygon points="537,274 551,282 537,290" fill="var(--text-faint)"/>
  <line x1="730" y1="282" x2="769" y2="282" stroke="var(--text-faint)" stroke-width="3"/>
  <polygon points="767,274 781,282 767,290" fill="var(--text-faint)"/>
  <line x1="960" y1="282" x2="999" y2="282" stroke="var(--text-faint)" stroke-width="3"/>
  <polygon points="997,274 1011,282 997,290" fill="var(--text-faint)"/>
  <path d="M1100,320 V420 H180 V334" fill="none" stroke="var(--text-faint)" stroke-width="3" stroke-dasharray="10 6"/>
  <polygon points="172,334 180,320 188,334" fill="var(--text-faint)"/>
  <text x="640" y="406" font-size="18" fill="var(--text-faint)">drift detected: retrain</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">pipelines • experiment tracking • model registry • serving • drift monitoring • governance</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

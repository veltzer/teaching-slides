<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.49561369755" font-weight="bold" fill="var(--text)">ML Lifecycle Stages</text>

  <rect x="60" y="143.571428571429" width="170" height="124.285714285714" rx="10.177004891982" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318608805568" font-weight="bold" fill="var(--info-text)">Data</text>
  <text x="145" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--info-text)">ingest</text>
  <text x="145" y="233.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--info-text)">validate</text>
  <text x="145" y="256.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--info-text)">version</text>

  <rect x="280" y="143.571428571429" width="170" height="124.285714285714" rx="10.177004891982" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="365" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318608805568" font-weight="bold" fill="var(--info-text)">Features</text>
  <text x="365" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--info-text)">engineer</text>
  <text x="365" y="233.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--info-text)">store</text>
  <text x="365" y="256.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--info-text)">reuse</text>

  <rect x="500" y="143.571428571429" width="170" height="124.285714285714" rx="10.177004891982" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="585" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318608805568" font-weight="bold" fill="var(--primary-text)">Train</text>
  <text x="585" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--primary-text)">experiment</text>
  <text x="585" y="233.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--primary-text)">track</text>
  <text x="585" y="256.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--primary-text)">tune</text>

  <rect x="720" y="143.571428571429" width="170" height="124.285714285714" rx="10.177004891982" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318608805568" font-weight="bold" fill="var(--primary-text)">Evaluate</text>
  <text x="805" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--primary-text)">metrics</text>
  <text x="805" y="233.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--primary-text)">slices</text>
  <text x="805" y="256.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--primary-text)">register</text>

  <rect x="940" y="143.571428571429" width="170" height="124.285714285714" rx="10.177004891982" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1025" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318608805568" font-weight="bold" fill="var(--ok-text)">Deploy</text>
  <text x="1025" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--ok-text)">canary</text>
  <text x="1025" y="233.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--ok-text)">scale</text>
  <text x="1025" y="256.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--ok-text)">serve</text>

  <path d="M 230 205.714285714286 L 280 205.714285714286" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 450 205.714285714286 L 500 205.714285714286" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 670 205.714285714286 L 720 205.714285714286" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 890 205.714285714286 L 940 205.714285714286" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="280" y="350.714285714286" width="720" height="103.571428571429" rx="10.177004891982" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="392.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--warn-text)">Monitor</text>
  <text x="640" y="418.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">latency, accuracy, data drift, concept drift</text>
  <text x="640" y="440.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">triggers retraining</text>

  <path d="M 1025 267.857142857143 Q 1025 309.285714285714 640 350.714285714286" fill="none" stroke="var(--warn-accent)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <path d="M 280 402.5 Q 145 371.428571428571 145 267.857142857143" fill="none" stroke="var(--warn-accent)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-warn)"/>
  <text x="160" y="330" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--warn-accent)">retrain on drift</text>

  <text x="640" y="537.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283207827171" font-weight="bold" fill="var(--text)">MLOps automates the whole loop, not just training</text>
  <text x="640" y="566.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--text-muted)">Reproducible, monitored, governed at every stage</text>

  <rect x="40" y="599.285714285714" width="1200" height="20.714285714286" rx="6.106202935189" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="614.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--text-muted)">Each stage versioned: code, data, model — pinned together</text>
</svg>

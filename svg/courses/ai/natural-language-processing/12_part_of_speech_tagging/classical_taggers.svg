<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="385" height="580" rx="14.247806848775" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232" y="86.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.424811740757" font-weight="bold" fill="var(--primary-text)">Rule-Based</text>
  <text x="232" y="117.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">hand-written grammars</text>

  <text x="232" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--primary-text)">approach</text>
  <text x="232" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">lexicon plus rules</text>
  <text x="232" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">context patterns assign tags</text>

  <text x="232" y="298.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--primary-text)">strengths</text>
  <text x="232" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">precise on covered cases</text>
  <text x="232" y="355.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">no training data required</text>
  <text x="232" y="381.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">interpretable decisions</text>

  <text x="232" y="449.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--primary-text)">weaknesses</text>
  <text x="232" y="480.178571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">brittle outside coverage</text>
  <text x="232" y="506.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">expensive to maintain</text>
  <text x="232" y="573.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--primary-text)">e.g. ENGTWOL</text>

  <rect x="447" y="40" width="385" height="580" rx="14.247806848775" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="86.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.424811740757" font-weight="bold" fill="var(--warn-text)">HMM</text>
  <text x="640" y="117.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--warn-text)">probabilistic sequence model</text>

  <text x="640" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--warn-text)">approach</text>
  <text x="640" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--warn-text)">tags as hidden states</text>
  <text x="640" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--warn-text)">Viterbi finds best path</text>

  <text x="640" y="298.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--warn-text)">strengths</text>
  <text x="640" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--warn-text)">simple to train</text>
  <text x="640" y="355.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--warn-text)">linear-time decoding</text>
  <text x="640" y="381.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--warn-text)">strong baseline</text>

  <text x="640" y="449.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--warn-text)">weaknesses</text>
  <text x="640" y="480.178571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--warn-text)">limited context window</text>
  <text x="640" y="506.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--warn-text)">struggles with rare words</text>
  <text x="640" y="573.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--warn-text)">workhorse of the 1990s</text>

  <rect x="855" y="40" width="385" height="580" rx="14.247806848775" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047" y="86.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.424811740757" font-weight="bold" fill="var(--info-text)">Brill Tagger</text>
  <text x="1047" y="117.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">transformation-based</text>

  <text x="1047" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--info-text)">approach</text>
  <text x="1047" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">start with most-likely tag</text>
  <text x="1047" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">learn correction rules</text>

  <text x="1047" y="298.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--info-text)">strengths</text>
  <text x="1047" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">human-readable rules</text>
  <text x="1047" y="355.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">small final model</text>
  <text x="1047" y="381.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">fast at inference time</text>

  <text x="1047" y="449.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--info-text)">weaknesses</text>
  <text x="1047" y="480.178571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">slow training loop</text>
  <text x="1047" y="506.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">greedy rule selection</text>
  <text x="1047" y="573.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--info-text)">a classic teaching tool</text>
</svg>

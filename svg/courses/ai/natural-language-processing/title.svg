<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <!-- Canonical title and subtitle -->
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Natural Language Processing</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">From classical text processing to modern transformers</text>

  <!-- Text input (left) -->
  <rect x="120" y="320" width="240" height="120" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" opacity="0.9" filter="url(#shadow)"/>
  <text x="240" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Raw Text</text>
  <text x="240" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">tokens, characters,</text>
  <text x="240" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">documents</text>

  <!-- Models (center) -->
  <rect x="520" y="320" width="240" height="120" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" opacity="0.9" filter="url(#shadow)"/>
  <text x="640" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">Models</text>
  <text x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">embeddings, RNNs,</text>
  <text x="640" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">transformers, LLMs</text>

  <!-- Output tasks (right) -->
  <rect x="920" y="320" width="240" height="120" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" opacity="0.9" filter="url(#shadow)"/>
  <text x="1040" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">Tasks</text>
  <text x="1040" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">classify, tag, parse,</text>
  <text x="1040" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">generate, retrieve</text>

  <!-- Arrows -->
  <path d="M 360 380 L 520 380" fill="none" stroke="var(--text-faint)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 760 380 L 920 380" fill="none" stroke="var(--text-faint)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Bottom captions -->
  <text x="240" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Input</text>
  <text x="640" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Representation and learning</text>
  <text x="1040" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Application</text>
</svg>

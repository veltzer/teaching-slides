<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.327990186237" font-weight="bold" fill="var(--text)">Chain-of-thought patterns</text>

  <rect x="40" y="78.666666666667" width="595" height="265.142857142857" rx="14.715071638743" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="337" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--info-text)">Zero-shot CoT</text>
  <text x="337" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--info-text)">just append "Let's think step by step."</text>

  <rect x="80" y="178.095238095238" width="510" height="132.571428571429" rx="10.510765456245" fill="var(--info-text)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="100" y="205.714285714286" font-family="Arial, sans-serif" font-size="13.663995093118" font-weight="bold" fill="var(--info-accent)">prompt:</text>
  <text x="100" y="231" font-family="Arial, sans-serif" font-size="12.6" fill="var(--text)">Q: P(2 reds, no replace) from 3R 2B?</text>
  <text x="100" y="253" font-family="Arial, sans-serif" font-size="12.6" fill="var(--text)">A: Let's think step by step.</text>
  <text x="100" y="284" font-family="Arial, sans-serif" font-size="12.6" font-style="italic" fill="var(--text-muted)">→ 3/5 · 2/4 = 3/10</text>

  <rect x="645" y="78.666666666667" width="595" height="265.142857142857" rx="14.715071638743" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="942" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--primary-text)">Few-shot CoT</text>
  <text x="942" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--primary-text)">show worked examples in the prompt</text>

  <rect x="685" y="178.095238095238" width="510" height="132.571428571429" rx="10.510765456245" fill="var(--info-text)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="705" y="205.714285714286" font-family="Arial, sans-serif" font-size="13.663995093118" font-weight="bold" fill="var(--primary-accent)">prompt:</text>
  <text x="705" y="231" font-family="Arial, sans-serif" font-size="12.6" fill="var(--text)">Q: 3+2 pieces?  A: 3+2=5. Five.</text>
  <text x="705" y="253" font-family="Arial, sans-serif" font-size="12.6" fill="var(--text)">Q: 7-4 cars?  A: 7-4=3. Three.</text>
  <text x="705" y="284" font-family="Arial, sans-serif" font-size="12.6" font-style="italic" fill="var(--text-muted)">Q: ... → model imitates the style</text>

  <rect x="40" y="376.952380952381" width="595" height="243.047619047619" rx="14.715071638743" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="337" y="421.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="var(--warn-text)">Self-consistency</text>
  <text x="337" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">sample N chains, majority-vote</text>
  <rect x="80" y="481.904761904762" width="510" height="110.47619047619" rx="10.510765456245" fill="var(--info-text)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="335" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">5 chains → 12, 11, 12, 12, 13</text>
  <text x="335" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">majority → 12</text>

  <rect x="645" y="376.952380952381" width="595" height="243.047619047619" rx="14.715071638743" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="942" y="421.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="var(--ok-text)">Tree-of-thought</text>
  <text x="942" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">branch, prune, expand best</text>
  <rect x="685" y="481.904761904762" width="510" height="110.47619047619" rx="10.510765456245" fill="var(--info-text)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">A (0.4) | B (0.8) → expand B</text>
  <text x="940" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">deeper search, higher cost</text>
      </svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="80.695652173913" rx="14.060737812294" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="80.347826086957" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445133606" font-weight="bold" fill="var(--text)">Smoothing redistributes mass to unseen n-grams</text>
  <text x="640" y="105.565217391304" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.065076227458" fill="var(--text-muted)">MLE alone gives zero probability to anything not in training</text>

  <rect x="40" y="150.95652173913" width="290" height="201.739130434783" rx="14.060737812294" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="196.347826086957" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445133606" font-weight="bold" fill="var(--danger-text)">MLE</text>
  <text x="185" y="241.739130434783" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--danger-text)">raw count ratios</text>
  <text x="185" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--danger-text)">zero for unseen</text>
  <text x="185" y="317.391304347826" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399397131" fill="var(--danger-text)">unusable in practice</text>

  <rect x="350" y="150.95652173913" width="290" height="201.739130434783" rx="14.060737812294" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="196.347826086957" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445133606" font-weight="bold" fill="var(--warn-text)">Laplace</text>
  <text x="495" y="241.739130434783" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">add-one to all counts</text>
  <text x="495" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">uniform prior</text>
  <text x="495" y="317.391304347826" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399397131" fill="var(--warn-text)">over-corrects badly</text>

  <rect x="660" y="150.95652173913" width="290" height="201.739130434783" rx="14.060737812294" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="196.347826086957" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445133606" font-weight="bold" fill="var(--info-text)">Good-Turing</text>
  <text x="805" y="241.739130434783" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--info-text)">use singletons to</text>
  <text x="805" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--info-text)">estimate unseen mass</text>
  <text x="805" y="317.391304347826" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399397131" fill="var(--info-text)">unstable at high counts</text>

  <rect x="970" y="150.95652173913" width="270" height="201.739130434783" rx="14.060737812294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="196.347826086957" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445133606" font-weight="bold" fill="var(--ok-text)">Kneser-Ney</text>
  <text x="1105" y="241.739130434783" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--ok-text)">context diversity</text>
  <text x="1105" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--ok-text)">drives back-off</text>
  <text x="1105" y="317.391304347826" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399397131" fill="var(--ok-text)">strongest baseline</text>

  <rect x="40" y="382.95652173913" width="1200" height="100.869565217391" rx="14.060737812294" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="423.304347826087" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768303278" font-weight="bold" fill="var(--text)">Combine via back-off or interpolation</text>
  <text x="640" y="458.608695652174" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--text-muted)">back-off falls through to lower orders; interpolation always mixes them</text>

  <rect x="40" y="514.086956521739" width="585" height="105.913043478261" rx="14.060737812294" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="332" y="554.434782608696" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.07809147295" font-weight="bold" fill="var(--text)">Back-off</text>
  <text x="332" y="589.739130434783" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399397131" fill="var(--text-muted)">trigram unseen, fall to bigram, then unigram</text>

  <rect x="655" y="514.086956521739" width="585" height="105.913043478261" rx="14.060737812294" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="947" y="554.434782608696" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.07809147295" font-weight="bold" fill="var(--text)">Interpolation</text>
  <text x="947" y="589.739130434783" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399397131" fill="var(--text-muted)">weighted mix of trigram, bigram, unigram</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="189.473684210526" height="82.857142857143" rx="14.617941391534" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="134.736842105263" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--text)">w(t-3)</text>
  <text x="134.736842105263" y="102.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">token id</text>

  <rect x="40" y="185" width="189.473684210526" height="82.857142857143" rx="14.617941391534" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="134.736842105263" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--text)">w(t-2)</text>
  <text x="134.736842105263" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">token id</text>

  <rect x="40" y="330" width="189.473684210526" height="82.857142857143" rx="14.617941391534" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="134.736842105263" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--text)">w(t-1)</text>
  <text x="134.736842105263" y="392.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">token id</text>

  <rect x="313.684210526316" y="40" width="231.578947368421" height="372.857142857143" rx="14.617941391534" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="429.473684210526" y="96.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.971050758124" font-weight="bold" fill="var(--info-text)">Embeddings</text>
  <text x="429.473684210526" y="153.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--info-text)">shared lookup</text>
  <text x="429.473684210526" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--info-text)">table C</text>
  <text x="429.473684210526" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--info-text)">dense vectors</text>
  <text x="429.473684210526" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--info-text)">per token</text>
  <text x="429.473684210526" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--info-text)">concatenated to</text>
  <text x="429.473684210526" y="340.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--info-text)">form context</text>
  <text x="429.473684210526" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">trained jointly</text>

  <rect x="629.473684210526" y="40" width="231.578947368421" height="372.857142857143" rx="14.617941391534" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="745.263157894737" y="96.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.971050758124" font-weight="bold" fill="var(--primary-text)">Hidden Layer</text>
  <text x="745.263157894737" y="153.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--primary-text)">tanh nonlinearity</text>
  <text x="745.263157894737" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--primary-text)">learns context</text>
  <text x="745.263157894737" y="236.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--primary-text)">interactions</text>
  <text x="745.263157894737" y="288.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--primary-text)">dense, not sparse</text>
  <text x="745.263157894737" y="340.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--primary-text)">generalizes across</text>
  <text x="745.263157894737" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--primary-text)">similar prefixes</text>

  <rect x="945.263157894737" y="40" width="294.736842105263" height="372.857142857143" rx="14.617941391534" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1092.631578947368" y="96.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.971050758124" font-weight="bold" fill="var(--ok-text)">Softmax Output</text>
  <text x="1092.631578947368" y="153.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--ok-text)">probability over</text>
  <text x="1092.631578947368" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--ok-text)">full vocabulary</text>
  <text x="1092.631578947368" y="236.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--ok-text)">P(w_t | history)</text>
  <text x="1092.631578947368" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--ok-text)">trained by maximum</text>
  <text x="1092.631578947368" y="324.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--ok-text)">likelihood</text>
  <text x="1092.631578947368" y="376.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">side effect: word vectors</text>

  <path d="M 229.473684210526 81.428571428571 L 313.684210526316 205.714285714286" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 229.473684210526 226.428571428571 L 313.684210526316 226.428571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 229.473684210526 371.428571428571 L 313.684210526316 247.142857142857" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 545.263157894737 226.428571428571 L 629.473684210526 226.428571428571" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 861.052631578947 226.428571428571 L 945.263157894737 226.428571428571" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="40" y="459.464285714286" width="1200" height="160.535714285714" rx="14.617941391534" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="506.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.882773416477" font-weight="bold" fill="var(--text)">Bengio et al. 2003</text>
  <text x="640" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.662080062358" fill="var(--text-muted)">embeddings let similar words share statistical strength</text>
  <text x="640" y="583.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.662080062358" fill="var(--text-muted)">first neural LM to beat smoothed n-gram baselines on perplexity</text>
</svg>

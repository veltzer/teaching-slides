<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.842360136325" font-weight="bold" fill="var(--text)">Retrieval-augmented generation</text>

  <text x="153.793103448276" y="86.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--text-muted)">offline (one-time)</text>

  <rect x="40" y="102.142857142857" width="227.586206896552" height="82.857142857143" rx="14.491376746189" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="153.793103448276" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--text)">documents</text>
  <text x="153.793103448276" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--text-muted)">corpus to ground on</text>

  <rect x="40" y="205.714285714286" width="227.586206896552" height="82.857142857143" rx="14.491376746189" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.793103448276" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--info-text)">chunk + clean</text>
  <text x="153.793103448276" y="267.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">~500 tokens, overlap</text>

  <rect x="40" y="309.285714285714" width="227.586206896552" height="82.857142857143" rx="14.491376746189" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.793103448276" y="345.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--info-text)">embed + index</text>
  <text x="153.793103448276" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">FAISS / vector DB</text>

  <line x1="153.793103448276" y1="185" x2="153.793103448276" y2="205.714285714286" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="153.793103448276" y1="288.571428571429" x2="153.793103448276" y2="309.285714285714" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <text x="805.51724137931" y="86.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--text-muted)">online (per query)</text>

  <rect x="329.655172413793" y="102.142857142857" width="227.586206896552" height="82.857142857143" rx="14.491376746189" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="443.448275862069" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--text)">user query</text>
  <text x="443.448275862069" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--text-muted)">"what is the policy on X?"</text>

  <rect x="329.655172413793" y="205.714285714286" width="227.586206896552" height="82.857142857143" rx="14.491376746189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="443.448275862069" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--warn-text)">embed query</text>
  <text x="443.448275862069" y="267.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--warn-text)">same model as docs</text>

  <rect x="329.655172413793" y="309.285714285714" width="227.586206896552" height="82.857142857143" rx="14.491376746189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="443.448275862069" y="345.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--warn-text)">retrieve top-K</text>
  <text x="443.448275862069" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--warn-text)">K = 5..20 chunks</text>

  <line x1="443.448275862069" y1="185" x2="443.448275862069" y2="205.714285714286" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="443.448275862069" y1="288.571428571429" x2="443.448275862069" y2="309.285714285714" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="267.586206896552" y1="350.714285714286" x2="329.655172413793" y2="350.714285714286" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="619.310344827586" y="205.714285714286" width="227.586206896552" height="82.857142857143" rx="14.491376746189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="733.103448275862" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--warn-text)">rerank</text>
  <text x="733.103448275862" y="267.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--warn-text)">cross-encoder, optional</text>

  <line x1="557.241379310345" y1="350.714285714286" x2="733.103448275862" y2="288.571428571429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="908.965517241379" y="205.714285714286" width="331.034482758621" height="207.142857142857" rx="14.491376746189" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074.48275862069" y="252.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.772163458298" font-weight="bold" fill="var(--primary-text)">LLM</text>
  <text x="1074.48275862069" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--primary-text)">prompt = system +</text>
  <text x="1074.48275862069" y="317.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--primary-text)">retrieved context +</text>
  <text x="1074.48275862069" y="341.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--primary-text)">user query</text>
  <text x="1074.48275862069" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--primary-text)">generate answer + citations</text>

  <line x1="846.896551724138" y1="247.142857142857" x2="908.965517241379" y2="267.857142857143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="557.241379310345" y1="143.571428571429" x2="908.965517241379" y2="267.857142857143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="908.965517241379" y="443.928571428571" width="331.034482758621" height="62.142857142857" rx="14.491376746189" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074.48275862069" y="482.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631770102244" font-weight="bold" fill="var(--ok-text)">grounded answer</text>

  <line x1="1074.48275862069" y1="412.857142857143" x2="1074.48275862069" y2="443.928571428571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="40" y="443.928571428571" width="806.896551724138" height="176.071428571429" rx="14.491376746189" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="443.448275862069" y="485.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631770102244" font-weight="bold" fill="var(--text)">Where things commonly go wrong</text>
  <text x="443.448275862069" y="521.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text-muted)">chunk size mismatched to question type, embedding model drift,</text>
  <text x="443.448275862069" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text-muted)">stale corpus, model ignores context, conflicting passages,</text>
  <text x="443.448275862069" y="573.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text-muted)">no abstention when retrieval finds nothing relevant.</text>
  </svg>

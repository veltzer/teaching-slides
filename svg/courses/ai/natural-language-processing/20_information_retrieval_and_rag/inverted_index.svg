<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.071383656624" font-weight="bold" fill="var(--text)">Inverted index</text>

  <rect x="40" y="77.943925233645" width="380" height="542.056074766355" rx="14.576898892028" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="121.308411214953" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--info-text)">Documents</text>

  <rect x="70" y="153.831775700935" width="320" height="59.626168224299" rx="10.412070637163" fill="var(--info-text)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="90" y="180.934579439252" font-family="Arial, sans-serif" font-size="13.535691828312" font-weight="bold" fill="var(--info-accent)">D1</text>
  <text x="125" y="180.934579439252" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">cats sit on mats</text>

  <rect x="70" y="229.719626168224" width="320" height="59.626168224299" rx="10.412070637163" fill="var(--info-text)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="90" y="256.822429906542" font-family="Arial, sans-serif" font-size="13.535691828312" font-weight="bold" fill="var(--info-accent)">D2</text>
  <text x="125" y="256.822429906542" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">dogs chase cats</text>

  <rect x="70" y="305.607476635514" width="320" height="59.626168224299" rx="10.412070637163" fill="var(--info-text)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="90" y="332.710280373832" font-family="Arial, sans-serif" font-size="13.535691828312" font-weight="bold" fill="var(--info-accent)">D3</text>
  <text x="125" y="332.710280373832" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">mats are on floors</text>

  <rect x="70" y="381.495327102804" width="320" height="59.626168224299" rx="10.412070637163" fill="var(--info-text)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="90" y="408.598130841121" font-family="Arial, sans-serif" font-size="13.535691828312" font-weight="bold" fill="var(--info-accent)">D4</text>
  <text x="125" y="408.598130841121" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">dogs sit on floors</text>

  <text x="230" y="484.485981308411" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--info-text)">tokenize, lowercase,</text>
  <text x="230" y="511.588785046729" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--info-text)">stem or lemmatize,</text>
  <text x="230" y="538.691588785047" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--info-text)">drop stop words</text>
  <text x="230" y="587.476635514019" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--info-text)">store doc lengths for BM25</text>

  <rect x="450" y="77.943925233645" width="380" height="542.056074766355" rx="14.576898892028" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="121.308411214953" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--primary-text)">Inverted index</text>

  <rect x="480" y="153.831775700935" width="320" height="54.205607476636" rx="10.412070637163" fill="var(--info-text)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="500" y="186.355140186916" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--primary-accent)">cats</text>
  <text x="560" y="186.355140186916" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">→ D1, D2</text>

  <rect x="480" y="224.299065420561" width="320" height="54.205607476636" rx="10.412070637163" fill="var(--info-text)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="500" y="256.822429906542" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--primary-accent)">dogs</text>
  <text x="560" y="256.822429906542" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">→ D2, D4</text>

  <rect x="480" y="294.766355140187" width="320" height="54.205607476636" rx="10.412070637163" fill="var(--info-text)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="500" y="327.289719626168" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--primary-accent)">mats</text>
  <text x="560" y="327.289719626168" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">→ D1, D3</text>

  <rect x="480" y="365.233644859813" width="320" height="54.205607476636" rx="10.412070637163" fill="var(--info-text)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="500" y="397.757009345794" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--primary-accent)">sit</text>
  <text x="560" y="397.757009345794" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">→ D1, D4</text>

  <rect x="480" y="435.700934579439" width="320" height="54.205607476636" rx="10.412070637163" fill="var(--info-text)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="500" y="468.22429906542" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--primary-accent)">floors</text>
  <text x="560" y="468.22429906542" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">→ D3, D4</text>

  <text x="640" y="538.691588785047" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">posting list per term:</text>
  <text x="640" y="565.794392523364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">doc IDs + frequencies +</text>
  <text x="640" y="592.897196261682" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">positions for phrase queries</text>

  <line x1="420" y1="348.971962616822" x2="450" y2="348.971962616822" stroke="var(--primary-border)" stroke-width="3" marker-end="url(#arrow-primary)"/>

  <rect x="860" y="77.943925233645" width="380" height="542.056074766355" rx="14.576898892028" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="121.308411214953" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--ok-text)">Query: "cats sit"</text>

  <rect x="890" y="153.831775700935" width="320" height="54.205607476636" rx="10.412070637163" fill="var(--info-text)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1050" y="186.355140186916" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-accent)">postings(cats) = D1, D2</text>

  <rect x="890" y="224.299065420561" width="320" height="54.205607476636" rx="10.412070637163" fill="var(--info-text)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1050" y="256.822429906542" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-accent)">postings(sit) = D1, D4</text>

  <rect x="890" y="294.766355140187" width="320" height="86.728971962617" rx="10.412070637163" fill="var(--info-text)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1050" y="327.289719626168" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955744" font-weight="bold" fill="var(--ok-accent)">intersection: D1</text>
  <text x="1050" y="359.813084112149" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.494484764596" fill="var(--text-muted)">union for OR queries</text>

  <text x="1050" y="430.280373831776" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">scoring: BM25 over hits</text>
  <text x="1050" y="462.803738317757" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">heap of top-K docs</text>
  <text x="1050" y="500.747663551402" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">O(|posting list|)</text>
  <text x="1050" y="527.85046728972" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">independent of corpus size</text>
  <text x="1050" y="582.056074766355" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.535691828312" font-weight="bold" fill="var(--ok-text)">Lucene, Elasticsearch, Tantivy</text>
  </svg>

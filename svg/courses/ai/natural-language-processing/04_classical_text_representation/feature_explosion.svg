<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="629.473684210526" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.6457681938" font-weight="bold" fill="var(--text)">Feature Count Grows With N-Gram Order</text>

  <rect x="40" y="93.703703703704" width="210.526315789474" height="85.925925925926" rx="12.759585320216" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.263157894737" y="131.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.265975533693" font-weight="bold" fill="var(--ok-text)">Unigrams</text>
  <text x="145.263157894737" y="163.518518518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.012780426954" fill="var(--ok-text)">~50k features</text>

  <rect x="40" y="211.851851851852" width="400" height="85.925925925926" rx="12.759585320216" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="249.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.265975533693" font-weight="bold" fill="var(--warn-text)">Bigrams</text>
  <text x="240" y="281.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.012780426954" fill="var(--warn-text)">~500k to 2M features</text>

  <rect x="40" y="330" width="821.052631578947" height="85.925925925926" rx="12.759585320216" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450.526315789474" y="367.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.265975533693" font-weight="bold" fill="var(--danger-text)">Trigrams</text>
  <text x="450.526315789474" y="399.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.012780426954" fill="var(--danger-text)">tens of millions of features</text>

  <rect x="40" y="448.148148148148" width="1200" height="85.925925925926" rx="12.759585320216" fill="var(--code-bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="485.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.265975533693" font-weight="bold" fill="var(--surface)">4-grams and beyond</text>
  <text x="640" y="517.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.012780426954" fill="var(--surface)">unbounded in practice, mostly noise</text>

  <rect x="40" y="550.185185185185" width="1200" height="69.814814814815" rx="14.886182873585" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="582.407407407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.012780426954" fill="var(--text)">Cap with min-df, max-df, top-K, or chi-squared selection.</text>
  <text x="640" y="607.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.949481650269" fill="var(--text-muted)">Most n-grams appear in one document and contribute nothing.</text>
</svg>

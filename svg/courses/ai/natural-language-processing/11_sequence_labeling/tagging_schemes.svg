<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="60" rx="14" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Tagging schemes on the same span</text>

  <text x="120" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-muted)">tokens</text>
  <rect x="220" y="140" width="160" height="60" rx="10" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="300" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">New</text>
  <rect x="400" y="140" width="160" height="60" rx="10" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="480" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">York</text>
  <rect x="580" y="140" width="160" height="60" rx="10" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="660" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">is</text>
  <rect x="760" y="140" width="160" height="60" rx="10" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="840" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">cold</text>
  <rect x="940" y="140" width="160" height="60" rx="10" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1020" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">today</text>

  <text x="120" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-muted)">IOB2</text>
  <rect x="220" y="260" width="160" height="60" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">B-LOC</text>
  <rect x="400" y="260" width="160" height="60" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">I-LOC</text>
  <rect x="580" y="260" width="160" height="60" rx="10" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="660" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">O</text>
  <rect x="760" y="260" width="160" height="60" rx="10" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="840" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">O</text>
  <rect x="940" y="260" width="160" height="60" rx="10" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1020" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">O</text>

  <text x="120" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-muted)">BIOES</text>
  <rect x="220" y="380" width="160" height="60" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">B-LOC</text>
  <rect x="400" y="380" width="160" height="60" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">E-LOC</text>
  <rect x="580" y="380" width="160" height="60" rx="10" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="660" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">O</text>
  <rect x="760" y="380" width="160" height="60" rx="10" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="840" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">O</text>
  <rect x="940" y="380" width="160" height="60" rx="10" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1020" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">O</text>

  <text x="120" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-muted)">single span</text>
  <rect x="220" y="500" width="160" height="60" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">S-LOC</text>
  <text x="480" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">single-token span</text>
  <text x="840" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">e.g. London alone</text>

  <rect x="40" y="595" width="1200" height="25" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="613" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">richer schemes mark span ends explicitly</text>
</svg>

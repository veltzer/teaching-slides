<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.560469465483" font-weight="bold" fill="var(--text)">Compositional semantics: meaning bottom-up</text>

  <rect x="40" y="79.417475728155" width="1200" height="67.572815533981" rx="10.984795948263" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="122.21359223301" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.969591896525" fill="var(--text)">"every dog barks"</text>

  <rect x="40" y="180.776699029126" width="235.714285714286" height="67.572815533981" rx="10.984795948263" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="157.857142857143" y="208.932038834951" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.378714327568" font-weight="bold" fill="var(--info-text)">every : Det</text>
  <text x="157.857142857143" y="234.834951456311" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.181755137915" fill="var(--info-text)">λP.λQ.∀x.P(x)→Q(x)</text>

  <rect x="297.142857142857" y="180.776699029126" width="235.714285714286" height="67.572815533981" rx="10.984795948263" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="415" y="208.932038834951" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.378714327568" font-weight="bold" fill="var(--info-text)">dog : N</text>
  <text x="415" y="234.834951456311" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.181755137915" fill="var(--info-text)">λx.dog(x)</text>

  <rect x="790" y="180.776699029126" width="235.714285714286" height="67.572815533981" rx="10.984795948263" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="907.857142857143" y="208.932038834951" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.378714327568" font-weight="bold" fill="var(--info-text)">barks : V</text>
  <text x="907.857142857143" y="234.834951456311" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.181755137915" fill="var(--info-text)">λx.barks(x)</text>

  <rect x="125.714285714286" y="315.922330097087" width="407.142857142857" height="67.572815533981" rx="10.984795948263" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="344.077669902913" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.378714327568" font-weight="bold" fill="var(--primary-text)">every dog : NP</text>
  <text x="329.285714285714" y="369.980582524272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.181755137915" fill="var(--primary-text)">λQ.∀x.dog(x)→Q(x)</text>

  <rect x="704.285714285714" y="315.922330097087" width="407.142857142857" height="67.572815533981" rx="10.984795948263" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="907.857142857143" y="344.077669902913" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.378714327568" font-weight="bold" fill="var(--primary-text)">VP</text>
  <text x="907.857142857143" y="369.980582524272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.181755137915" fill="var(--primary-text)">λx.barks(x)</text>

  <line x1="157.857142857143" y1="248.349514563107" x2="265" y2="315.922330097087" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="415" y1="248.349514563107" x2="393.571428571429" y2="315.922330097087" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="907.857142857143" y1="248.349514563107" x2="907.857142857143" y2="315.922330097087" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="361.428571428571" y="451.067961165049" width="557.142857142857" height="90.097087378641" rx="10.984795948263" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="490.485436893204" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.772632706873" font-weight="bold" fill="var(--ok-text)">S : ∀x.dog(x) → barks(x)</text>
  <text x="640" y="524.271844660194" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.378714327568" fill="var(--ok-text)">function application along the parse tree</text>

  <line x1="329.285714285714" y1="383.495145631068" x2="490" y2="451.067961165049" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="907.857142857143" y1="383.495145631068" x2="790" y2="451.067961165049" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <text x="640" y="591.844660194175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.378714327568" fill="var(--text-muted)">each rewrite rule corresponds to a semantic combinator</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.378714327568" fill="var(--text-muted)">deep learning skips the logical form and learns composition implicitly</text>
</svg>

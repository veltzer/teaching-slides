<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="536.551724137931" y="40" width="206.896551724138" height="94.909090909091" rx="14.622523100279" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="82.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--primary-text)">animal</text>
  <text x="640" y="113.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--primary-text)">hypernym root</text>

  <rect x="277.931034482759" y="208.727272727273" width="206.896551724138" height="94.909090909091" rx="14.622523100279" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="381.379310344828" y="250.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--info-text)">dog</text>
  <text x="381.379310344828" y="282.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--info-text)">hyponym of animal</text>

  <rect x="795.172413793103" y="208.727272727273" width="206.896551724138" height="94.909090909091" rx="14.622523100279" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="898.620689655172" y="250.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--info-text)">cat</text>
  <text x="898.620689655172" y="282.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--info-text)">hyponym of animal</text>

  <rect x="40" y="398.545454545455" width="206.896551724138" height="94.909090909091" rx="14.622523100279" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="440.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889318714684" font-weight="bold" fill="var(--ok-text)">poodle</text>
  <text x="143.448275862069" y="472.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">hyponym of dog</text>

  <rect x="277.931034482759" y="398.545454545455" width="206.896551724138" height="94.909090909091" rx="14.622523100279" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="381.379310344828" y="440.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.800386843215" font-weight="bold" fill="var(--warn-text)">tail, paw</text>
  <text x="381.379310344828" y="472.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">meronyms of dog</text>

  <rect x="795.172413793103" y="398.545454545455" width="206.896551724138" height="94.909090909091" rx="14.622523100279" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="898.620689655172" y="440.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889318714684" font-weight="bold" fill="var(--ok-text)">kitten</text>
  <text x="898.620689655172" y="472.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">hyponym of cat</text>

  <rect x="1033.103448275862" y="398.545454545455" width="206.896551724138" height="94.909090909091" rx="14.622523100279" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.551724137931" y="440.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.800386843215" font-weight="bold" fill="var(--danger-text)">canine</text>
  <text x="1136.551724137931" y="472.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--danger-text)">synonym of dog</text>

  <path d="M 588.275862068966 134.909090909091 L 433.103448275862 208.727272727273" fill="none" stroke="var(--primary-border)" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <path d="M 691.724137931035 134.909090909091 L 846.896551724138 208.727272727273" fill="none" stroke="var(--primary-border)" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <path d="M 340 303.636363636364 L 184.827586206897 398.545454545455" fill="none" stroke="var(--info-border)" stroke-width="3" marker-end="url(#arrow-info)"/>
  <path d="M 381.379310344828 303.636363636364 L 381.379310344828 398.545454545455" fill="none" stroke="var(--warn-border)" stroke-width="3" marker-end="url(#arrow-warn)"/>
  <path d="M 898.620689655172 303.636363636364 L 898.620689655172 398.545454545455" fill="none" stroke="var(--info-border)" stroke-width="3" marker-end="url(#arrow-info)"/>
  <path d="M 1002.068965517241 261.454545454545 L 1033.103448275862 398.545454545455" fill="none" stroke="var(--danger-border)" stroke-width="3" marker-end="url(#arrow-danger)"/>

  <rect x="40" y="546.181818181818" width="1200" height="73.818181818182" rx="10.444659357342" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="577.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--text)">Lexical relations form a graph</text>
  <text x="640" y="604.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--text-muted)">hypernymy is-a, meronymy part-of, synonymy same-meaning, antonymy opposite-meaning</text>
</svg>

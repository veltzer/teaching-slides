<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="620" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.579135622711" font-weight="bold" fill="var(--text)">Hierarchical summarization for long documents</text>

  <rect x="40" y="76.576576576577" width="220" height="83.603603603604" rx="10.222744470273" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--info-text)">section 1</text>
  <text x="150" y="139.279279279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--info-text)">10k tokens</text>

  <rect x="300" y="76.576576576577" width="220" height="83.603603603604" rx="10.222744470273" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--info-text)">section 2</text>
  <text x="410" y="139.279279279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--info-text)">10k tokens</text>

  <rect x="560" y="76.576576576577" width="220" height="83.603603603604" rx="10.222744470273" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--info-text)">section 3</text>
  <text x="670" y="139.279279279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--info-text)">10k tokens</text>

  <rect x="820" y="76.576576576577" width="220" height="83.603603603604" rx="10.222744470273" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--info-text)">section 4</text>
  <text x="930" y="139.279279279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--info-text)">10k tokens</text>

  <line x1="150" y1="160.18018018018" x2="150" y2="222.882882882883" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="410" y1="160.18018018018" x2="410" y2="222.882882882883" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="670" y1="160.18018018018" x2="670" y2="222.882882882883" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="930" y1="160.18018018018" x2="930" y2="222.882882882883" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="40" y="233.333333333333" width="220" height="83.603603603604" rx="10.222744470273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="269.90990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--primary-text)">summary 1</text>
  <text x="150" y="296.036036036036" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">300 tokens</text>

  <rect x="300" y="233.333333333333" width="220" height="83.603603603604" rx="10.222744470273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="269.90990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--primary-text)">summary 2</text>
  <text x="410" y="296.036036036036" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">300 tokens</text>

  <rect x="560" y="233.333333333333" width="220" height="83.603603603604" rx="10.222744470273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="269.90990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--primary-text)">summary 3</text>
  <text x="670" y="296.036036036036" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">300 tokens</text>

  <rect x="820" y="233.333333333333" width="220" height="83.603603603604" rx="10.222744470273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="269.90990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--primary-text)">summary 4</text>
  <text x="930" y="296.036036036036" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">300 tokens</text>

  <line x1="150" y1="316.936936936937" x2="360" y2="390.09009009009" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="410" y1="316.936936936937" x2="480" y2="390.09009009009" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="670" y1="316.936936936937" x2="600" y2="390.09009009009" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="930" y1="316.936936936937" x2="720" y2="390.09009009009" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="260" y="400.540540540541" width="560" height="104.504504504504" rx="14.311842258383" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="442.342342342342" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--warn-text)">summary-of-summaries</text>
  <text x="540" y="471.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">single transformer pass over concatenated summaries</text>

  <line x1="540" y1="505.045045045045" x2="540" y2="552.072072072072" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="360" y="562.522522522523" width="360" height="57.477477477477" rx="10.222744470273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="599.099099099099" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--ok-text)">final summary</text>

  <rect x="1080" y="76.576576576577" width="160" height="532.972972972973" rx="10.222744470273" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1160" y="113.153153153153" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--text)">trade-offs</text>
  <text x="1160" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">+ scales to</text>
  <text x="1160" y="181.081081081081" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">arbitrary length</text>
  <text x="1160" y="228.108108108108" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">+ parallel</text>
  <text x="1160" y="249.009009009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">section calls</text>
  <text x="1160" y="306.486486486486" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">- detail loss</text>
  <text x="1160" y="327.387387387387" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">at each level</text>
  <text x="1160" y="384.864864864865" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">- two passes</text>
  <text x="1160" y="405.765765765766" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">double the cost</text>
  <text x="1160" y="468.468468468468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">- coherence</text>
  <text x="1160" y="489.369369369369" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">across sections</text>
  <text x="1160" y="510.27027027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">is hard</text>
  <text x="1160" y="562.522522522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" font-weight="bold" fill="var(--text)">use when context</text>
  <text x="1160" y="583.423423423423" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" font-weight="bold" fill="var(--text)">window will not fit</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.821872493111" font-weight="bold" fill="var(--text)">Decoding strategies: from determinism to diversity</text>

  <rect x="40" y="77.247706422018" width="290" height="255.412844036697" rx="14.44254672706" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="119.816513761468" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--ok-text)">Greedy</text>
  <text x="185" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--ok-text)">argmax at each step</text>
  <text x="185" y="204.954128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--ok-text)">deterministic</text>
  <text x="185" y="231.559633027523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--ok-text)">repeats easily</text>
  <text x="185" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" font-weight="bold" fill="var(--ok-text)">structured tasks</text>
  <text x="185" y="300.733944954128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" font-weight="bold" fill="var(--ok-text)">tool calls, code</text>

  <rect x="350" y="77.247706422018" width="290" height="255.412844036697" rx="14.44254672706" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="119.816513761468" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--primary-text)">Beam search</text>
  <text x="495" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">k-best partial seqs</text>
  <text x="495" y="204.954128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--primary-text)">beam = 4..10</text>
  <text x="495" y="231.559633027523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--primary-text)">length penalty needed</text>
  <text x="495" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" font-weight="bold" fill="var(--primary-text)">MT, summarization</text>
  <text x="495" y="300.733944954128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" font-weight="bold" fill="var(--primary-text)">when bland is fine</text>

  <rect x="660" y="77.247706422018" width="290" height="255.412844036697" rx="14.44254672706" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="119.816513761468" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--warn-text)">Temperature</text>
  <text x="805" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--warn-text)">scale logits by T</text>
  <text x="805" y="204.954128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--warn-text)">T=0 → greedy</text>
  <text x="805" y="231.559633027523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--warn-text)">T=1 → faithful</text>
  <text x="805" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" font-weight="bold" fill="var(--warn-text)">single most useful</text>
  <text x="805" y="300.733944954128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" font-weight="bold" fill="var(--warn-text)">knob in production</text>

  <rect x="970" y="77.247706422018" width="270" height="255.412844036697" rx="14.44254672706" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="119.816513761468" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--info-text)">Top-K</text>
  <text x="1105" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--info-text)">sample from top K</text>
  <text x="1105" y="204.954128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--info-text)">K=20..50 typical</text>
  <text x="1105" y="231.559633027523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--info-text)">truncates long tail</text>
  <text x="1105" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" font-weight="bold" fill="var(--info-text)">simple, predictable</text>
  <text x="1105" y="300.733944954128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" font-weight="bold" fill="var(--info-text)">but rigid</text>

  <rect x="40" y="364.587155963303" width="290" height="255.412844036697" rx="14.44254672706" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="407.155963302752" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--info-text)">Top-P (nucleus)</text>
  <text x="185" y="449.724770642202" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--info-text)">smallest set with</text>
  <text x="185" y="476.330275229358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--info-text)">cumulative prob ≥ p</text>
      
  <rect x="350" y="364.587155963303" width="290" height="255.412844036697" rx="14.44254672706" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="407.155963302752" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--danger-text)">Repetition penalty</text>
  <text x="495" y="449.724770642202" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--danger-text)">discount recent tokens</text>
        
  <rect x="660" y="364.587155963303" width="290" height="255.412844036697" rx="14.44254672706" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="407.155963302752" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--warn-text)">Constrained</text>
  <text x="805" y="449.724770642202" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--warn-text)">grammar / schema</text>
  <text x="805" y="497.614678899083" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--warn-text)">zero out illegal tokens</text>
      
  <rect x="970" y="364.587155963303" width="270" height="255.412844036697" rx="14.44254672706" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="407.155963302752" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--primary-text)">Speculative</text>
  <text x="1105" y="449.724770642202" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">draft + verify</text>
  <text x="1105" y="497.614678899083" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--primary-text)">draft model + verifier</text>
  <text x="1105" y="525.614678899083" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" font-weight="bold" fill="var(--primary-text)">same output, faster</text>
    </svg>

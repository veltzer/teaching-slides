<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="650.526315789474" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.774653592688" font-weight="bold" fill="var(--text)">Five eras of machine translation</text>

  <line x1="61.052631578947" y1="370.654205607477" x2="1240" y2="370.654205607477" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="40" y="132.14953271028" width="231.578947368421" height="205.981308411215" rx="14.955582703755" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.789473684211" y="175.514018691589" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.365118148221" font-weight="bold" fill="var(--danger-text)">1950s-80s</text>
  <text x="155.789473684211" y="208.03738317757" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.023838611166" fill="var(--danger-text)">Rule-based MT</text>
  <text x="155.789473684211" y="245.981308411215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--danger-text)">hand-crafted</text>
  <text x="155.789473684211" y="267.663551401869" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--danger-text)">grammars and</text>
  <text x="155.789473684211" y="289.345794392523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--danger-text)">dictionaries</text>
  <text x="155.789473684211" y="321.869158878505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.819070888933" fill="var(--danger-text)">Systran, METEO</text>

  <rect x="282.105263157895" y="132.14953271028" width="231.578947368421" height="205.981308411215" rx="14.955582703755" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="397.894736842105" y="175.514018691589" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.365118148221" font-weight="bold" fill="var(--warn-text)">1990s</text>
  <text x="397.894736842105" y="208.03738317757" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.023838611166" fill="var(--warn-text)">Word-based SMT</text>
  <text x="397.894736842105" y="245.981308411215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--warn-text)">IBM Models 1-5</text>
  <text x="397.894736842105" y="267.663551401869" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--warn-text)">noisy-channel</text>
  <text x="397.894736842105" y="289.345794392523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--warn-text)">+ EM alignment</text>
  <text x="397.894736842105" y="321.869158878505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.819070888933" fill="var(--warn-text)">Candide, Giza++</text>

  <rect x="524.210526315789" y="132.14953271028" width="231.578947368421" height="205.981308411215" rx="14.955582703755" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="175.514018691589" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.365118148221" font-weight="bold" fill="var(--info-text)">2000s</text>
  <text x="640" y="208.03738317757" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.023838611166" fill="var(--info-text)">Phrase-based SMT</text>
  <text x="640" y="245.981308411215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--info-text)">phrase tables +</text>
  <text x="640" y="267.663551401869" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--info-text)">log-linear models</text>
  <text x="640" y="289.345794392523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--info-text)">tuned with MERT</text>
  <text x="640" y="321.869158878505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.819070888933" fill="var(--info-text)">Moses, Pharaoh</text>

  <rect x="766.315789473684" y="132.14953271028" width="231.578947368421" height="205.981308411215" rx="14.955582703755" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="882.105263157895" y="175.514018691589" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.365118148221" font-weight="bold" fill="var(--primary-text)">2014-17</text>
  <text x="882.105263157895" y="208.03738317757" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.023838611166" fill="var(--primary-text)">Seq2seq + attn</text>
  <text x="882.105263157895" y="245.981308411215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--primary-text)">Bahdanau, Luong</text>
  <text x="882.105263157895" y="267.663551401869" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--primary-text)">RNNs replaced by</text>
  <text x="882.105263157895" y="289.345794392523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--primary-text)">transformer (2017)</text>
  <text x="882.105263157895" y="321.869158878505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.819070888933" fill="var(--primary-text)">Google NMT, Marian</text>

  <rect x="1008.421052631579" y="132.14953271028" width="231.578947368421" height="205.981308411215" rx="14.955582703755" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.210526315789" y="175.514018691589" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.365118148221" font-weight="bold" fill="var(--ok-text)">2020s</text>
  <text x="1124.210526315789" y="208.03738317757" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.023838611166" fill="var(--ok-text)">Multilingual / LLM</text>
  <text x="1124.210526315789" y="245.981308411215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--ok-text)">M2M-100, NLLB,</text>
  <text x="1124.210526315789" y="267.663551401869" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--ok-text)">mBART, GPT, Gemini</text>
  <text x="1124.210526315789" y="289.345794392523" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.887326796344" fill="var(--ok-text)">200+ languages,</text>
  <text x="1124.210526315789" y="321.869158878505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.819070888933" fill="var(--ok-text)">few-shot prompting</text>

  <rect x="40" y="424.859813084112" width="1200" height="195.140186915888" rx="14.955582703755" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="468.224299065421" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.365118148221" font-weight="bold" fill="var(--text)">Each transition shrank the human-engineered surface and grew the data dependency</text>
  <text x="640" y="511.588785046729" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.023838611166" fill="var(--text-muted)">Rules → word alignments → phrase tables → end-to-end neural → universal multilingual models</text>
    </svg>

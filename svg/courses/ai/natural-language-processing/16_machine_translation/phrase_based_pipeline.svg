<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="684.444444444444" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.535743922396" font-weight="bold" fill="var(--text)">Phrase-based SMT pipeline</text>

  <rect x="40" y="88.785046728972" width="266.666666666667" height="108.411214953271" rx="15.365400573598" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="173.333333333333" y="126.728971962617" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.755515023197" font-weight="bold" fill="var(--info-text)">Parallel corpus</text>
  <text x="173.333333333333" y="157.084112149533" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.267871961198" fill="var(--info-text)">aligned sentence pairs</text>
  <text x="173.333333333333" y="178.766355140187" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.267871961198" fill="var(--info-text)">Europarl, UN, CommonCrawl</text>

  <rect x="351.111111111111" y="88.785046728972" width="266.666666666667" height="108.411214953271" rx="15.365400573598" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="484.444444444444" y="126.728971962617" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.755515023197" font-weight="bold" fill="var(--primary-text)">Word alignment</text>
  <text x="484.444444444444" y="157.084112149533" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.267871961198" fill="var(--primary-text)">Giza++ runs IBM models</text>
  <text x="484.444444444444" y="178.766355140187" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.267871961198" fill="var(--primary-text)">grow-diag-final symmetrization</text>

  <rect x="662.222222222222" y="88.785046728972" width="266.666666666667" height="108.411214953271" rx="15.365400573598" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795.555555555556" y="126.728971962617" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.755515023197" font-weight="bold" fill="var(--primary-text)">Phrase extraction</text>
  <text x="795.555555555556" y="157.084112149533" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.267871961198" fill="var(--primary-text)">all consistent phrase pairs</text>
  <text x="795.555555555556" y="178.766355140187" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.267871961198" fill="var(--primary-text)">scored by relative frequency</text>

  <rect x="973.333333333333" y="88.785046728972" width="266.666666666667" height="108.411214953271" rx="15.365400573598" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1106.666666666667" y="126.728971962617" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.755515023197" font-weight="bold" fill="var(--warn-text)">Language model</text>
  <text x="1106.666666666667" y="157.084112149533" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.267871961198" fill="var(--warn-text)">n-gram LM on target side</text>
  <text x="1106.666666666667" y="178.766355140187" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.267871961198" fill="var(--warn-text)">KenLM, SRILM</text>

  <line x1="306.666666666667" y1="142.990654205607" x2="351.111111111111" y2="142.990654205607" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="617.777777777778" y1="142.990654205607" x2="662.222222222222" y2="142.990654205607" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="928.888888888889" y1="142.990654205607" x2="973.333333333333" y2="142.990654205607" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="173.333333333333" y="262.242990654206" width="1022.222222222222" height="130.093457943925" rx="15.365400573598" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="684.444444444444" y="305.607476635514" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.145629472797" font-weight="bold" fill="var(--ok-text)">Decoder</text>
  <text x="684.444444444444" y="338.130841121495" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.365400573598" fill="var(--ok-text)">stack-based beam search over phrase translations and reordering distortion</text>
  <text x="684.444444444444" y="368.485981308411" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.365400573598" fill="var(--ok-text)">log-linear combination: translation prob, LM prob, distortion penalty, length</text>

  <line x1="484.444444444444" y1="197.196261682243" x2="528.888888888889" y2="262.242990654206" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="795.555555555556" y1="197.196261682243" x2="751.111111111111" y2="262.242990654206" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="1106.666666666667" y1="197.196261682243" x2="973.333333333333" y2="262.242990654206" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="306.666666666667" y="446.542056074766" width="755.555555555556" height="86.728971962617" rx="15.365400573598" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="684.444444444444" y="484.485981308411" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.950572247997" font-weight="bold" fill="var(--warn-text)">Tuning (MERT)</text>
  <text x="684.444444444444" y="514.841121495327" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.365400573598" fill="var(--warn-text)">optimize feature weights against BLEU on a dev set</text>

  <line x1="684.444444444444" y1="392.336448598131" x2="684.444444444444" y2="446.542056074766" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="417.777777777778" y="565.794392523364" width="533.333333333333" height="54.205607476636" rx="10.975286123999" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="684.444444444444" y="600.485981308411" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.560457798398" font-weight="bold" fill="var(--text)">Translated output</text>

  <line x1="684.444444444444" y1="533.271028037383" x2="684.444444444444" y2="565.794392523364" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
</svg>

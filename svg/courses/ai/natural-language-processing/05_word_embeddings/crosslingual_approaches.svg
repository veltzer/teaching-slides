<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="395" height="580" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Mapping</text>
  <text x="237" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">supervised alignment</text>

  <text x="237" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">how it works</text>
  <text x="237" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">train monolingual spaces</text>
  <text x="237" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">learn linear transform</text>
  <text x="237" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">small bilingual lexicon</text>

  <text x="237" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">methods</text>
  <text x="237" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Procrustes alignment</text>
  <text x="237" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">CCA, orthogonal solutions</text>

  <text x="237" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">strengths</text>
  <text x="237" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">simple and fast</text>
  <text x="237" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">reuses existing vectors</text>
  <text x="237" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">needs anchor words</text>

  <rect x="445" y="40" width="395" height="580" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">MUSE Adversarial</text>
  <text x="642" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">unsupervised alignment</text>

  <text x="642" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">how it works</text>
  <text x="642" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">discriminator vs mapper</text>
  <text x="642" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">align without dictionary</text>
  <text x="642" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">refine with induced pairs</text>

  <text x="642" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">methods</text>
  <text x="642" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">GAN-style training</text>
  <text x="642" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">iterative Procrustes refine</text>

  <text x="642" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">strengths</text>
  <text x="642" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">no parallel data</text>
  <text x="642" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">handles related languages</text>
  <text x="642" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">brittle on distant pairs</text>

  <rect x="850" y="40" width="390" height="580" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">Joint Training</text>
  <text x="1045" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">shared multilingual space</text>

  <text x="1045" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">how it works</text>
  <text x="1045" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">one model, many languages</text>
  <text x="1045" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">shared subword vocab</text>
  <text x="1045" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">parameters tie spaces</text>

  <text x="1045" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">methods</text>
  <text x="1045" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">multilingual fastText</text>
  <text x="1045" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">XLM-R, mBERT, mT5</text>

  <text x="1045" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">strengths</text>
  <text x="1045" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">scales to many languages</text>
  <text x="1045" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">modern default</text>
  <text x="1045" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">expensive</text>
</svg>

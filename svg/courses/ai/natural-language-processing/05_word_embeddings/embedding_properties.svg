<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="595" height="280" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="337" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Similarity</text>

  <rect x="166.0" y="186.0" width="28.0" height="28.0" rx="14.0" fill="var(--bg)"/>
  <text x="180" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">cat</text>
  <rect x="206.0" y="166.0" width="28.0" height="28.0" rx="14.0" fill="var(--bg)"/>
  <text x="220" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">kitten</text>
  <rect x="186.0" y="226.0" width="28.0" height="28.0" rx="14.0" fill="var(--bg)"/>
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">feline</text>
  <rect x="436.0" y="186.0" width="28.0" height="28.0" rx="14.0" fill="var(--bg)"/>
  <text x="450" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">truck</text>
  <rect x="476.0" y="166.0" width="28.0" height="28.0" rx="14.0" fill="var(--bg)"/>
  <text x="490" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">van</text>

  <text x="337" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">related words cluster, unrelated words separate</text>

  <rect x="655" y="40" width="585" height="280" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="947" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Analogy</text>

  <rect x="770.0" y="160.0" width="20.0" height="20.0" rx="10.0" fill="var(--bg)"/>
  <text x="780" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">king</text>
  <rect x="770.0" y="250.0" width="20.0" height="20.0" rx="10.0" fill="var(--bg)"/>
  <text x="780" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">man</text>
  <rect x="1090.0" y="160.0" width="20.0" height="20.0" rx="10.0" fill="var(--bg)"/>
  <text x="1100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">queen</text>
  <rect x="1090.0" y="250.0" width="20.0" height="20.0" rx="10.0" fill="var(--bg)"/>
  <text x="1100" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">woman</text>

  <path d="M 780 170 L 780 260" fill="none" stroke="var(--bg)" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 1100 170 L 1100 260" fill="none" stroke="var(--bg)" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 790 170 L 1090 170" fill="none" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 790 260 L 1090 260" fill="none" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="947" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">king minus man plus woman lands near queen</text>

  <rect x="40" y="340" width="595" height="280" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="337" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Visualization</text>
  <text x="337" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">t-SNE preserves local neighborhoods</text>
  <text x="337" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">UMAP keeps more global structure</text>
  <text x="337" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">2D projections reveal clusters</text>
  <text x="337" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">but they can also fabricate them</text>
  <text x="337" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">interpret with care, never as ground truth</text>

  <rect x="655" y="340" width="585" height="280" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="947" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Bias</text>
  <text x="947" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">embeddings absorb corpus statistics</text>
  <text x="947" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">stereotypes appear as learned geometry</text>
  <text x="947" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">measurable, not invisible</text>
  <text x="947" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">debiasing reduces but rarely removes</text>
  <text x="947" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">audit before deployment</text>
</svg>

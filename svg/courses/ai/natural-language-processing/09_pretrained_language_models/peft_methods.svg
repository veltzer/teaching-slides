<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="290" height="580" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Full Fine-tune</text>
  <text x="185" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">update every weight</text>
  <text x="185" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">trainable: 100%</text>
  <text x="185" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">checkpoint per task</text>
  <text x="185" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">highest quality</text>
  <text x="185" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">forgetting risk</text>
  <text x="185" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">expensive at scale</text>
  <text x="185" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">large storage cost</text>

  <rect x="345" y="40" width="290" height="580" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">LoRA</text>
  <text x="490" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">low-rank delta</text>
  <text x="490" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">trainable: under 1%</text>
  <text x="490" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">tiny adapter weights</text>
  <text x="490" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">near full quality</text>
  <text x="490" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">merge for zero overhead</text>
  <text x="490" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">most popular choice</text>
  <text x="490" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">easy to swap per task</text>

  <rect x="650" y="40" width="290" height="580" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Adapters</text>
  <text x="795" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">bottleneck modules</text>
  <text x="795" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">trainable: 1 to 5%</text>
  <text x="795" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">inserted between layers</text>
  <text x="795" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">strong quality</text>
  <text x="795" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">small inference cost</text>
  <text x="795" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">multi-task friendly</text>
  <text x="795" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">composable across tasks</text>

  <rect x="955" y="40" width="285" height="580" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Prefix Tuning</text>
  <text x="1097" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">trainable prefix vectors</text>
  <text x="1097" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">trainable: very small</text>
  <text x="1097" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">prepended to attention</text>
  <text x="1097" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">no weight changes</text>
  <text x="1097" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">strong only at scale</text>
  <text x="1097" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">bridge to prompting</text>
  <text x="1097" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">fragile on small models</text>
</svg>

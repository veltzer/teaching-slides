<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="600" height="280" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--ok-text)">UTF-8</text>
  <text x="340" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">variable length, 1 to 4 bytes per character</text>
  <text x="340" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">backward-compatible with ASCII</text>
  <text x="340" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">covers all Unicode</text>
  <text x="340" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">the modern default</text>
  <text x="340" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">use this unless you have a reason not to</text>

  <rect x="660" y="40" width="580" height="280" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--warn-text)">Legacy Encodings</text>
  <text x="950" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Latin-1: Western European</text>
  <text x="950" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Shift-JIS: Japanese</text>
  <text x="950" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">GB18030: Chinese</text>
  <text x="950" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Windows-1252: legacy Windows</text>
  <text x="950" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">still appear in old data and APIs</text>

  <rect x="40" y="350" width="1200" height="270" rx="14" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text)">Why It Matters</text>

  <text x="640" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text-muted)">A misidentified encoding produces silent corruption, not a hard error.</text>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text-muted)">UTF-8 bytes interpreted as Latin-1 give the classic "mojibake" garbled output.</text>
  <text x="640" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--danger-accent)">Always declare and verify the encoding at every boundary.</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--danger-accent)">A pipeline tuned for English may shatter on real multilingual text.</text>
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-faint)">Detection libraries help but are not infallible.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.988969529191" font-weight="bold" fill="var(--text)">Tokens needed for the same sentence (relative scale)</text>
  <text x="640" y="77.943925233645" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313019461" fill="var(--text-muted)">A typical English-trained tokenizer is more efficient on English than on other languages</text>

  <rect x="60" y="126.728971962617" width="200" height="54.205607476636" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="40" y="164.672897196262" text-anchor="end" font-family="Arial, sans-serif" font-size="16.659313019461" font-weight="bold" fill="var(--text)"/>
  <text x="160" y="161.420560747664" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313019461" fill="var(--ok-text)">English: ~1.0x</text>

  <rect x="60" y="213.457943925234" width="280" height="54.205607476636" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="200" y="248.14953271028" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313019461" fill="var(--ok-text)">German: ~1.4x</text>

  <rect x="60" y="300.18691588785" width="350" height="54.205607476636" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="235" y="334.878504672897" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313019461" fill="var(--warn-text)">French / Spanish: ~1.7x</text>

  <rect x="60" y="386.915887850467" width="500" height="54.205607476636" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="310" y="421.607476635514" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313019461" fill="var(--warn-text)">Russian / Arabic: ~2.5x</text>

  <rect x="60" y="473.644859813084" width="800" height="54.205607476636" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="460" y="508.336448598131" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313019461" fill="var(--danger-text)">Korean / Japanese / Thai: ~4.0x</text>

  <rect x="60" y="554.953271028037" width="1180" height="65.046728971963" rx="14.576898892028" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="598.317757009346" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313019461" fill="var(--text-muted)">Same input, different cost. Always measure tokens-per-sentence on your real data.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="60" rx="12" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Self-attention is permutation-equivariant; position must be injected</text>

  <rect x="40" y="125" width="380" height="495" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">Sinusoidal</text>
  <text x="230" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">fixed sine and cosine</text>

  <text x="230" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">no parameters</text>
  <text x="230" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">multiple frequencies</text>

  <text x="230" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">offsets recoverable</text>
  <text x="230" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">as linear maps</text>

  <text x="230" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">used in original</text>
  <text x="230" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">transformer paper</text>

  <text x="230" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">extrapolates partly</text>

  <rect x="450" y="125" width="380" height="495" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">Learned</text>
  <text x="640" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">embedding per slot</text>

  <text x="640" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">a table indexed</text>
  <text x="640" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">by position</text>

  <text x="640" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">simple, often best</text>
  <text x="640" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">in distribution</text>

  <text x="640" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">used by BERT</text>
  <text x="640" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">and original GPT</text>

  <text x="640" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">cannot extrapolate</text>

  <rect x="860" y="125" width="380" height="495" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">Rotary</text>
  <text x="1050" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">rotate Q and K</text>

  <text x="1050" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">angle depends</text>
  <text x="1050" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">on position</text>

  <text x="1050" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">relative offsets</text>
  <text x="1050" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">live in scores</text>

  <text x="1050" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">modern default</text>
  <text x="1050" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">in open models</text>

  <text x="1050" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">extends well</text>
</svg>

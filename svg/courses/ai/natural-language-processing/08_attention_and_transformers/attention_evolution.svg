<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="380" height="580" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--danger-text)">Bottleneck</text>
  <text x="230" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">single fixed vector</text>

  <text x="230" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">encoder squeezes</text>
  <text x="230" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">all input into one</text>
  <text x="230" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">hidden state</text>

  <text x="230" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">long inputs</text>
  <text x="230" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">lose detail</text>

  <text x="230" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">decoder cannot</text>
  <text x="230" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">revisit source</text>

  <rect x="450" y="40" width="380" height="580" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--warn-text)">Bahdanau</text>
  <text x="640" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">soft alignment</text>

  <text x="640" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">score every</text>
  <text x="640" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">source position</text>
  <text x="640" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">at each step</text>

  <text x="640" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">small feed-forward</text>
  <text x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">scoring network</text>

  <text x="640" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">context vector is</text>
  <text x="640" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">weighted average</text>

  <rect x="860" y="40" width="380" height="580" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--ok-text)">Dot-Product</text>
  <text x="1050" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">scaled and parallel</text>

  <text x="1050" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">query dot key</text>
  <text x="1050" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">over root of dim</text>

  <text x="1050" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">softmax weights</text>
  <text x="1050" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">over all keys</text>

  <text x="1050" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">basis of the</text>
  <text x="1050" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">transformer</text>
</svg>

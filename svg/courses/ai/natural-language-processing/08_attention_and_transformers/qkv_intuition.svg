<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="80" rx="14" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Each token plays three roles in self-attention</text>
  <text x="640" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">three linear projections of the same input embedding</text>

  <rect x="40" y="150" width="380" height="280" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--primary-text)">Query</text>
  <text x="230" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">what am I looking for</text>
  <text x="230" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">the request issued</text>
  <text x="230" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">by the current token</text>
  <text x="230" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">matched against</text>
  <text x="230" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">all keys</text>

  <rect x="450" y="150" width="380" height="280" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--info-text)">Key</text>
  <text x="640" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">how do I advertise</text>
  <text x="640" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">the address each</text>
  <text x="640" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">token presents</text>
  <text x="640" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">scored by dot</text>
  <text x="640" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">product with query</text>

  <rect x="860" y="150" width="380" height="280" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--ok-text)">Value</text>
  <text x="1050" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">what do I return</text>
  <text x="1050" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">the payload mixed</text>
  <text x="1050" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">into the output</text>
  <text x="1050" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">weighted by</text>
  <text x="1050" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">attention scores</text>

  <rect x="40" y="460" width="1200" height="160" rx="14" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">output = softmax(Q K transpose / sqrt d) V</text>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">queries match keys to produce weights, weights blend values</text>
  <text x="640" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">three projection matrices store most of the parameters</text>
  <text x="640" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">all positions computed in parallel</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="590" height="352.142857142857" rx="14.247806848775" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="86.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.460212719154" font-weight="bold" fill="var(--warn-text)">Stemming</text>
  <text x="335" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" fill="var(--warn-text)">crude rule-based suffix stripping</text>
  <text x="335" y="179.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" fill="var(--warn-text)">running, runs, ran -&gt; run</text>
  <text x="335" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" fill="var(--warn-text)">ponies -&gt; poni</text>
  <text x="335" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" fill="var(--warn-text)">universal -&gt; univers</text>
  <text x="335" y="298.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">fast, lossy, output may not be a word</text>
  <text x="335" y="335.178571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">no part-of-speech needed</text>
  <text x="335" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">Porter, Snowball</text>

  <rect x="650" y="40" width="590" height="352.142857142857" rx="14.247806848775" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="86.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.460212719154" font-weight="bold" fill="var(--ok-text)">Lemmatization</text>
  <text x="945" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" fill="var(--ok-text)">dictionary-aware reduction to lemma</text>
  <text x="945" y="179.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" fill="var(--ok-text)">running, runs, ran -&gt; run</text>
  <text x="945" y="210.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" fill="var(--ok-text)">better -&gt; good</text>
  <text x="945" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" fill="var(--ok-text)">mice -&gt; mouse</text>
  <text x="945" y="298.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--ok-text)">slower, accurate, output is a real word</text>
  <text x="945" y="335.178571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--ok-text)">often needs part-of-speech</text>
  <text x="945" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--ok-text)">WordNet, spaCy, Stanza</text>

  <rect x="40" y="423.214285714286" width="1200" height="196.785714285714" rx="14.247806848775" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="469.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389410762361" font-weight="bold" fill="var(--text)">When to use which</text>
  <text x="640" y="511.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283207827171" fill="var(--text-muted)">Stemming: classical IR, recall over precision, no lexicon available.</text>
  <text x="640" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283207827171" fill="var(--text-muted)">Lemmatization: linguistic analysis, hybrid retrieval, presentation to humans.</text>
  <text x="640" y="594.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" fill="var(--danger-accent)">Modern transformers usually need neither.</text>
</svg>

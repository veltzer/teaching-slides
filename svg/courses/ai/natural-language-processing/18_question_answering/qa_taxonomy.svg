<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.099026575889" font-weight="bold" fill="var(--text)">Question answering: families of tasks</text>

  <rect x="40" y="80.19801980198" width="284.745762711864" height="252.673267326733" rx="15.130245079325" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.372881355932" y="131.881188118812" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.614635827607" font-weight="bold" fill="var(--ok-text)">Reading comprehension</text>
  <text x="182.372881355932" y="177.821782178218" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--ok-text)">passage given</text>
  <text x="182.372881355932" y="206.534653465347" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--ok-text)">extract span</text>
  <text x="182.372881355932" y="258.217821782178" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--ok-text)">SQuAD, NewsQA</text>
  <text x="182.372881355932" y="298.415841584158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.968781496564" fill="var(--ok-text)">closed-context, easy to score</text>

  <rect x="345.084745762712" y="80.19801980198" width="284.745762711864" height="252.673267326733" rx="15.130245079325" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.457627118644" y="131.881188118812" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.614635827607" font-weight="bold" fill="var(--primary-text)">Open-domain QA</text>
  <text x="487.457627118644" y="177.821782178218" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--primary-text)">no passage given</text>
  <text x="487.457627118644" y="206.534653465347" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--primary-text)">retrieve + read</text>
  <text x="487.457627118644" y="258.217821782178" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--primary-text)">NQ, TriviaQA</text>
  <text x="487.457627118644" y="298.415841584158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.968781496564" fill="var(--primary-text)">RAG-style backbone</text>

  <rect x="650.169491525424" y="80.19801980198" width="284.745762711864" height="252.673267326733" rx="15.130245079325" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.542372881356" y="131.881188118812" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.614635827607" font-weight="bold" fill="var(--warn-text)">Knowledge-base QA</text>
  <text x="792.542372881356" y="177.821782178218" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--warn-text)">structured graph</text>
  <text x="792.542372881356" y="206.534653465347" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--warn-text)">parse to SPARQL</text>
  <text x="792.542372881356" y="258.217821782178" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--warn-text)">WebQuestions, LC-QuAD</text>
  <text x="792.542372881356" y="298.415841584158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.968781496564" fill="var(--warn-text)">auditable but brittle</text>

  <rect x="955.254237288136" y="80.19801980198" width="284.745762711864" height="252.673267326733" rx="15.130245079325" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097.627118644068" y="131.881188118812" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.614635827607" font-weight="bold" fill="var(--info-text)">Conversational QA</text>
  <text x="1097.627118644068" y="177.821782178218" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--info-text)">context across turns</text>
  <text x="1097.627118644068" y="206.534653465347" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--info-text)">coref + ellipsis</text>
  <text x="1097.627118644068" y="258.217821782178" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--info-text)">CoQA, QuAC</text>
  <text x="1097.627118644068" y="298.415841584158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.968781496564" fill="var(--info-text)">production assistants</text>

  <rect x="40" y="367.326732673267" width="284.745762711864" height="252.673267326733" rx="15.130245079325" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.372881355932" y="419.009900990099" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.614635827607" font-weight="bold" fill="var(--danger-text)">Multi-hop QA</text>
  <text x="182.372881355932" y="464.950495049505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--danger-text)">two or more docs needed</text>
  <text x="182.372881355932" y="493.663366336634" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--danger-text)">iterative retrieval</text>
  <text x="182.372881355932" y="545.346534653465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--danger-text)">HotpotQA, MuSiQue</text>
  
  <rect x="345.084745762712" y="367.326732673267" width="284.745762711864" height="252.673267326733" rx="15.130245079325" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.457627118644" y="419.009900990099" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.614635827607" font-weight="bold" fill="var(--ok-text)">Long-form QA</text>
  <text x="487.457627118644" y="464.950495049505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--ok-text)">paragraph-length answers</text>
  <text x="487.457627118644" y="493.663366336634" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--ok-text)">synthesis required</text>
  <text x="487.457627118644" y="545.346534653465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--ok-text)">ELI5, ASQA</text>
  
  <rect x="650.169491525424" y="367.326732673267" width="284.745762711864" height="252.673267326733" rx="15.130245079325" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.542372881356" y="419.009900990099" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.614635827607" font-weight="bold" fill="var(--warn-text)">Visual QA</text>
  <text x="792.542372881356" y="464.950495049505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--warn-text)">image + question</text>
  <text x="792.542372881356" y="493.663366336634" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--warn-text)">multimodal models</text>
  <text x="792.542372881356" y="545.346534653465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--warn-text)">VQA, OK-VQA</text>
  
  <rect x="955.254237288136" y="367.326732673267" width="284.745762711864" height="252.673267326733" rx="15.130245079325" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097.627118644068" y="419.009900990099" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.614635827607" font-weight="bold" fill="var(--primary-text)">Tool-augmented QA</text>
  <text x="1097.627118644068" y="464.950495049505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--primary-text)">model picks the tool</text>
  <text x="1097.627118644068" y="493.663366336634" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--primary-text)">search, calc, code, DB</text>
  <text x="1097.627118644068" y="545.346534653465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.049513287944" fill="var(--primary-text)">agentic systems</text>
  </svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.071383656624" font-weight="bold" fill="var(--text)">Projective vs non-projective dependencies</text>

  <rect x="40" y="77.943925233645" width="595" height="542.056074766355" rx="14.576898892028" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="337" y="126.728971962617" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.906555401759" font-weight="bold" fill="var(--ok-text)">Projective: arcs do not cross</text>
  <text x="337" y="159.252336448598" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">typical of English and most major treebanks</text>

  <text x="100" y="446.542056074766" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313019461" fill="var(--ok-text)">The</text>
  <text x="190" y="446.542056074766" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313019461" fill="var(--ok-text)">cat</text>
  <text x="290" y="446.542056074766" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313019461" fill="var(--ok-text)">saw</text>
  <text x="390" y="446.542056074766" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313019461" fill="var(--ok-text)">a</text>
  <text x="490" y="446.542056074766" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313019461" fill="var(--ok-text)">dog</text>
  <text x="580" y="446.542056074766" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313019461" fill="var(--ok-text)">today</text>

  <path d="M 190 424.859813084112 Q 145 370.654205607477 100 424.859813084112" fill="none" stroke="var(--info-text)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <path d="M 290 424.859813084112 Q 240 316.448598130841 190 424.859813084112" fill="none" stroke="var(--info-text)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <path d="M 290 424.859813084112 Q 390 251.401869158878 490 424.859813084112" fill="none" stroke="var(--info-text)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <path d="M 490 424.859813084112 Q 440 370.654205607477 390 424.859813084112" fill="none" stroke="var(--info-text)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <path d="M 290 424.859813084112 Q 435 305.607476635514 580 424.859813084112" fill="none" stroke="var(--info-text)" stroke-width="2" marker-end="url(#arrow-white)"/>

  <text x="337" y="511.588785046729" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">arcs nest cleanly above the sentence</text>
  <text x="337" y="544.11214953271" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">arc-standard, arc-eager, Eisner all assume this</text>
  <text x="337" y="576.635514018692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">cubic-time projective decoders</text>

  <rect x="645" y="77.943925233645" width="595" height="542.056074766355" rx="14.576898892028" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="942" y="126.728971962617" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.906555401759" font-weight="bold" fill="var(--danger-text)">Non-projective: arcs cross</text>
  <text x="942" y="159.252336448598" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">common in Czech, Latin, German, free-word-order languages</text>

  <text x="700" y="446.542056074766" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">A</text>
  <text x="790" y="446.542056074766" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">hearing</text>
  <text x="890" y="446.542056074766" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">is</text>
  <text x="990" y="446.542056074766" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">scheduled</text>
  <text x="1090" y="446.542056074766" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">on</text>
  <text x="1180" y="446.542056074766" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">issue</text>

  <path d="M 790 424.859813084112 Q 745 381.495327102804 700 424.859813084112" fill="none" stroke="var(--info-text)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <path d="M 990 424.859813084112 Q 890 305.607476635514 790 424.859813084112" fill="none" stroke="var(--info-text)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <path d="M 990 424.859813084112 Q 940 348.971962616822 890 424.859813084112" fill="none" stroke="var(--info-text)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <path d="M 1180 424.859813084112 Q 1135 381.495327102804 1090 424.859813084112" fill="none" stroke="var(--info-text)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <path d="M 790 424.859813084112 Q 985 218.878504672897 1180 424.859813084112" fill="none" stroke="var(--info-text)" stroke-width="2" marker-end="url(#arrow-white)"/>

  <text x="942" y="511.588785046729" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">"hearing -nmod-&gt; issue" crosses other arcs</text>
  <text x="942" y="544.11214953271" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">requires Chu-Liu-Edmonds or pseudo-projective tricks</text>
  <text x="942" y="576.635514018692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">graph-based parsers handle this naturally</text>
</svg>

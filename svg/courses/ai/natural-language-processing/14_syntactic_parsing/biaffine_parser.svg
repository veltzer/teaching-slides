<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.891513188361" font-weight="bold" fill="var(--text)">Biaffine dependency parser (Dozat &amp; Manning)</text>

  <rect x="40" y="77.592592592593" width="1200" height="64.444444444444" rx="10.727505072446" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="118.407407407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.455010144893" font-weight="bold" fill="var(--info-text)">contextual encoder (BiLSTM or transformer): one vector per token</text>

  <rect x="40" y="174.259259259259" width="578.571428571429" height="85.925925925926" rx="10.727505072446" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="208.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309509130404" font-weight="bold" fill="var(--primary-text)">MLP-head</text>
  <text x="329.285714285714" y="240.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--primary-text)">project each token as a candidate head</text>

  <rect x="661.428571428571" y="174.259259259259" width="578.571428571429" height="85.925925925926" rx="10.727505072446" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="208.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309509130404" font-weight="bold" fill="var(--warn-text)">MLP-dep</text>
  <text x="950.714285714286" y="240.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--warn-text)">project each token as a candidate dependent</text>

  <line x1="490" y1="142.037037037037" x2="329.285714285714" y2="174.259259259259" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="790" y1="142.037037037037" x2="950.714285714286" y2="174.259259259259" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="254.285714285714" y="303.148148148148" width="771.428571428571" height="85.925925925926" rx="10.727505072446" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="340.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.455010144893" font-weight="bold" fill="var(--ok-text)">Biaffine arc score</text>
  <text x="640" y="372.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--ok-text)">score(i, j) = h_i^T W h_j + u^T h_j</text>

  <line x1="329.285714285714" y1="260.185185185185" x2="490" y2="303.148148148148" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="950.714285714286" y1="260.185185185185" x2="790" y2="303.148148148148" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="254.285714285714" y="432.037037037037" width="771.428571428571" height="85.925925925926" rx="10.727505072446" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="469.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.455010144893" font-weight="bold" fill="var(--ok-text)">second biaffine: label score given (head, dep)</text>
  <text x="640" y="501.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.018507101425" fill="var(--ok-text)">picks among nsubj, obj, amod, ...</text>

  <line x1="640" y1="389.074074074074" x2="640" y2="432.037037037037" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="254.285714285714" y="555.555555555556" width="771.428571428571" height="64.444444444444" rx="10.727505072446" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="593.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--text)">decode: greedy argmax per dependent, or MST for guaranteed tree</text>

  <line x1="640" y1="517.962962962963" x2="640" y2="555.555555555556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
</svg>

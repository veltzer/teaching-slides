<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.410286130349" font-weight="bold" fill="var(--text)">Languages by NLP-data availability</text>

  <line x1="60.689655172414" y1="480" x2="1240" y2="480" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="60.689655172414" y1="80" x2="60.689655172414" y2="480" stroke="var(--text-muted)" stroke-width="2"/>

  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.239333576037" fill="var(--text-muted)">~7000 languages, ranked by available NLP training data (log scale)</text>

  <text x="40" y="85" text-anchor="end" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--text-muted)">10^12</text>
  <text x="40" y="180" text-anchor="end" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--text-muted)">10^9</text>
  <text x="40" y="280" text-anchor="end" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--text-muted)">10^6</text>
  <text x="40" y="380" text-anchor="end" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--text-muted)">10^3</text>
  <text x="40" y="475" text-anchor="end" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--text-muted)">0</text>

  <rect x="81.379310344828" y="95" width="124.137931034483" height="385" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--text)">English / CN</text>
  <text x="143.448275862069" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.188047809743" font-weight="bold" fill="var(--ok-text)">~6 langs</text>

  <rect x="226.206896551724" y="160" width="248.275862068966" height="320" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350.344827586207" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--text)">high-resource</text>
  <text x="350.344827586207" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.188047809743" font-weight="bold" fill="var(--primary-text)">~25 langs</text>

  <rect x="495.172413793103" y="260" width="289.655172413793" height="220" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--text)">mid-resource</text>
  <text x="640" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.188047809743" font-weight="bold" fill="var(--warn-text)">~150 langs</text>

  <rect x="805.51724137931" y="360" width="289.655172413793" height="120" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--text)">low-resource</text>
  <text x="950.344827586207" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.188047809743" font-weight="bold" fill="var(--danger-text)">~500 langs</text>

  <rect x="1115.862068965517" y="455" width="124.137931034483" height="25" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1177.931034482759" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--text)">unserved</text>
  <text x="1177.931034482759" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.188047809743" font-weight="bold" fill="var(--text)">~6000+ langs</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--text-muted)">~25 languages account for over 90% of all NLP training data</text>
</svg>

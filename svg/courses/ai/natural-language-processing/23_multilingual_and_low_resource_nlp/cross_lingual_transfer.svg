<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.821872493111" font-weight="bold" fill="var(--text)">Cross-lingual transfer settings</text>

  <rect x="40" y="87.889908256881" width="380" height="532.110091743119" rx="14.44254672706" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="135.779816513761" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695430571094" font-weight="bold" fill="var(--ok-text)">Zero-shot</text>
  <text x="230" y="183.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--ok-text)">fine-tune on English</text>
  <text x="230" y="210.275229357798" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--ok-text)">evaluate on Swahili</text>
  <text x="230" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--ok-text)">+ no target-language</text>
  <text x="230" y="300.733944954128" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--ok-text)">labels needed</text>
  <text x="230" y="364.587155963303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--ok-text)">- depends on multilingual</text>
  <text x="230" y="391.192660550459" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--ok-text)">embedding alignment</text>
  <text x="230" y="455.045871559633" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--ok-text)">- weak on language-specific</text>
  <text x="230" y="481.651376146789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--ok-text)">phenomena (morphology)</text>
    
  <rect x="450" y="87.889908256881" width="380" height="532.110091743119" rx="14.44254672706" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="135.779816513761" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695430571094" font-weight="bold" fill="var(--primary-text)">Few-shot</text>
  <text x="640" y="183.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">English data + a few</text>
  <text x="640" y="210.275229357798" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">hundred Swahili examples</text>
  <text x="640" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">+ closes most of the gap</text>
  <text x="640" y="300.733944954128" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">to monolingual fine-tuning</text>
  <text x="640" y="364.587155963303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">+ active learning chooses</text>
  <text x="640" y="391.192660550459" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">which examples to label</text>
  <text x="640" y="455.045871559633" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">- requires native annotators</text>
  <text x="640" y="481.651376146789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">for accurate labeling</text>
  <text x="640" y="561.467889908257" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" font-weight="bold" fill="var(--primary-text)">USE: when small labeling</text>
  
  <rect x="860" y="87.889908256881" width="380" height="532.110091743119" rx="14.44254672706" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="135.779816513761" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695430571094" font-weight="bold" fill="var(--warn-text)">Translate-train</text>
  <text x="1050" y="183.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--warn-text)">translate English data into</text>
  <text x="1050" y="210.275229357798" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--warn-text)">Swahili, fine-tune on it</text>
  <text x="1050" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--warn-text)">+ scales to large datasets</text>
  <text x="1050" y="300.733944954128" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--warn-text)">automatically</text>
  <text x="1050" y="364.587155963303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--warn-text)">- model latches onto</text>
  <text x="1050" y="391.192660550459" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--warn-text)">translation artifacts</text>
  <text x="1050" y="455.045871559633" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--warn-text)">- quality bottlenecked by</text>
  <text x="1050" y="481.651376146789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--warn-text)">the MT model used</text>
  <text x="1050" y="561.467889908257" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" font-weight="bold" fill="var(--warn-text)">USE: when MT is decent</text>
  </svg>

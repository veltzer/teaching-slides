<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <line x1="40" y1="284.210526315789" x2="1240" y2="284.210526315789" stroke="var(--text-muted)" stroke-width="3"/>

  <rect x="40" y="40" width="214.285714285714" height="219.789473684211" rx="13.725559276168" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.142857142857" y="88.842105263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.163525339642" font-weight="bold" fill="var(--primary-text)">Symbolic</text>
  <text x="147.142857142857" y="125.473684210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.013152488863" fill="var(--primary-text)">1950s - 1980s</text>
  <text x="147.142857142857" y="168.210526315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--primary-text)">hand grammars</text>
  <text x="147.142857142857" y="196.294736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--primary-text)">expert systems</text>
  <text x="147.142857142857" y="224.378947368421" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--primary-text)">narrow domains</text>

  <rect x="275.714285714286" y="308.631578947368" width="214.285714285714" height="219.789473684211" rx="13.725559276168" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="382.857142857143" y="357.473684210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.163525339642" font-weight="bold" fill="var(--ok-text)">Statistical</text>
  <text x="382.857142857143" y="394.105263157895" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.013152488863" fill="var(--ok-text)">1990s - 2000s</text>
  <text x="382.857142857143" y="436.842105263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--ok-text)">HMM, PCFG</text>
  <text x="382.857142857143" y="464.926315789474" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--ok-text)">phrase-based MT</text>
  <text x="382.857142857143" y="493.010526315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--ok-text)">corpus-driven</text>

  <rect x="511.428571428571" y="40" width="214.285714285714" height="219.789473684211" rx="13.725559276168" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="618.571428571429" y="88.842105263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.163525339642" font-weight="bold" fill="var(--info-text)">Deep Learning</text>
  <text x="618.571428571429" y="125.473684210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.013152488863" fill="var(--info-text)">2013 - 2017</text>
  <text x="618.571428571429" y="168.210526315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--info-text)">word embeddings</text>
  <text x="618.571428571429" y="196.294736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--info-text)">sequence models</text>
  <text x="618.571428571429" y="224.378947368421" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--info-text)">attention</text>

  <rect x="747.142857142857" y="308.631578947368" width="214.285714285714" height="219.789473684211" rx="13.725559276168" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="854.285714285714" y="357.473684210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.163525339642" font-weight="bold" fill="var(--warn-text)">Pre-Trained</text>
  <text x="854.285714285714" y="394.105263157895" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.013152488863" fill="var(--warn-text)">2018 - 2020</text>
  <text x="854.285714285714" y="436.842105263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--warn-text)">BERT, GPT, T5</text>
  <text x="854.285714285714" y="464.926315789474" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--warn-text)">fine-tune workflow</text>
  <text x="854.285714285714" y="493.010526315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--warn-text)">benchmarks saturate</text>

  <rect x="993.571428571429" y="40" width="235.714285714286" height="219.789473684211" rx="13.725559276168" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1111.428571428571" y="88.842105263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.163525339642" font-weight="bold" fill="var(--danger-text)">LLM Era</text>
  <text x="1111.428571428571" y="125.473684210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.013152488863" fill="var(--danger-text)">2020 - present</text>
  <text x="1111.428571428571" y="168.210526315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--danger-text)">few-shot prompting</text>
  <text x="1111.428571428571" y="196.294736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--danger-text)">instruction tuning</text>
  <text x="1111.428571428571" y="224.378947368421" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.869355882516" fill="var(--danger-text)">emergent abilities</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.588338914252" font-weight="bold" fill="var(--text)">Each era left tools the next era still uses.</text>
</svg>

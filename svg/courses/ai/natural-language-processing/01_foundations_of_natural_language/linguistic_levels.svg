<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="206.896551724138" height="85.925925925926" rx="12.649110640674" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="77.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--primary-text)">Phonology</text>
  <text x="143.448275862069" y="104.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--primary-text)">sounds and patterns</text>

  <rect x="40" y="158.148148148148" width="206.896551724138" height="85.925925925926" rx="12.649110640674" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="195.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--primary-text)">Morphology</text>
  <text x="143.448275862069" y="222.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--primary-text)">word structure</text>

  <rect x="40" y="276.296296296296" width="206.896551724138" height="85.925925925926" rx="12.649110640674" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="313.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--ok-text)">Syntax</text>
  <text x="143.448275862069" y="340.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--ok-text)">sentence structure</text>

  <rect x="40" y="394.444444444444" width="206.896551724138" height="85.925925925926" rx="12.649110640674" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="432.037037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--warn-text)">Semantics</text>
  <text x="143.448275862069" y="458.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--warn-text)">word meaning</text>

  <rect x="40" y="512.592592592593" width="206.896551724138" height="85.925925925926" rx="12.649110640674" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="550.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--danger-text)">Pragmatics</text>
  <text x="143.448275862069" y="577.037037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--danger-text)">meaning in context</text>

  <rect x="371.034482758621" y="40" width="393.103448275862" height="580" rx="14.757295747452" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="567.586206896552" y="82.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.190036174568" font-weight="bold" fill="var(--text)">Classical Pipeline</text>

  <text x="567.586206896552" y="147.407407407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" fill="var(--text-muted)">tokenize and normalize</text>
  <text x="567.586206896552" y="190.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" fill="var(--text-muted)">stem or lemmatize</text>
  <text x="567.586206896552" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" fill="var(--text-muted)">part-of-speech tag</text>
  <text x="567.586206896552" y="276.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" fill="var(--text-muted)">parse syntax</text>
  <text x="567.586206896552" y="319.259259259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" fill="var(--text-muted)">extract entities</text>
  <text x="567.586206896552" y="362.222222222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" fill="var(--text-muted)">resolve coreference</text>
  <text x="567.586206896552" y="405.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" fill="var(--text-muted)">extract relations</text>
  <text x="567.586206896552" y="458.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text-faint)">each step a separate model</text>
  <text x="567.586206896552" y="485.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text-faint)">errors compound</text>
  <text x="567.586206896552" y="539.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text-faint)">brittle but interpretable</text>
  <text x="567.586206896552" y="571.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text-faint)">each box maps to a level</text>

  <rect x="826.206896551724" y="40" width="413.793103448276" height="580" rx="14.757295747452" fill="var(--code-bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1033.103448275862" y="82.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.190036174568" font-weight="bold" fill="var(--surface)">Modern Pipeline</text>

  <rect x="877.931034482759" y="168.888888888889" width="310.344827586207" height="236.296296296296" rx="12.649110640674" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.103448275862" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.190036174568" font-weight="bold" fill="var(--info-text)">One Big Model</text>
  <text x="1033.103448275862" y="276.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--info-text)">subword tokenization in</text>
  <text x="1033.103448275862" y="303.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--info-text)">predictions out</text>
  <text x="1033.103448275862" y="340.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--info-text)">all linguistic levels</text>
  <text x="1033.103448275862" y="367.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--info-text)">compressed into weights</text>

  <text x="1033.103448275862" y="464.259259259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text-faint)">strong on coverage</text>
  <text x="1033.103448275862" y="491.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text-faint)">weak on interpretability</text>
  <text x="1033.103448275862" y="539.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text-faint)">errors are end-to-end</text>
  <text x="1033.103448275862" y="571.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text-faint)">levels still help diagnosis</text>

  <path d="M 257.241379310345 82.962962962963 L 371.034482758621 82.962962962963" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 764.137931034483 330 L 826.206896551724 330" fill="none" stroke="var(--info-border)" stroke-width="3" marker-end="url(#arrow)"/>
</svg>

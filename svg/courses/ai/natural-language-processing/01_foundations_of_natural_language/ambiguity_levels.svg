<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="289.655172413793" height="168.727272727273" rx="14.622523100279" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586206897" y="82.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--primary-text)">Lexical</text>
  <text x="184.827586206897" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" fill="var(--primary-text)">"bank"</text>
  <text x="184.827586206897" y="150.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--primary-text)">money place</text>
  <text x="184.827586206897" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--primary-text)">or river edge?</text>

  <rect x="360.689655172414" y="40" width="289.655172413793" height="168.727272727273" rx="14.622523100279" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="505.51724137931" y="82.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--ok-text)">Syntactic</text>
  <text x="505.51724137931" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--ok-text)">"saw man with telescope"</text>
  <text x="505.51724137931" y="150.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--ok-text)">who has the</text>
  <text x="505.51724137931" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--ok-text)">telescope?</text>

  <rect x="681.379310344828" y="40" width="289.655172413793" height="168.727272727273" rx="14.622523100279" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="826.206896551724" y="82.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--warn-text)">Semantic</text>
  <text x="826.206896551724" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--warn-text)">"the president"</text>
  <text x="826.206896551724" y="150.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--warn-text)">which person?</text>
  <text x="826.206896551724" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--warn-text)">which year?</text>

  <rect x="1002.068965517241" y="40" width="237.931034482759" height="168.727272727273" rx="14.622523100279" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.034482758621" y="82.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--danger-text)">Pragmatic</text>
  <text x="1121.034482758621" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--danger-text)">"can you pass</text>
  <text x="1121.034482758621" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--danger-text)">the salt?"</text>
  <text x="1121.034482758621" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--danger-text)">request, not question</text>

  <rect x="40" y="261.454545454545" width="1200" height="358.545454545455" rx="14.622523100279" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="308.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.06718245762" font-weight="bold" fill="var(--text)">Each level multiplies the others</text>

  <text x="640" y="372.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.800386843215" fill="var(--text-muted)">A single sentence may be ambiguous at every layer at once.</text>
  <text x="640" y="403.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.800386843215" fill="var(--text-muted)">"She booked the bank for tomorrow."</text>

  <text x="640" y="461.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" fill="var(--text)">lexical: bank = financial institution? riverbank?</text>
  <text x="640" y="491.345454545454" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" fill="var(--text)">syntactic: "for tomorrow" attaches to booked or bank?</text>
  <text x="640" y="520.872727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" fill="var(--text)">semantic: tomorrow relative to when the sentence was uttered</text>
  <text x="640" y="550.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" fill="var(--text)">pragmatic: an announcement, a confirmation, or a question?</text>

  <text x="640" y="598.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.800386843215" font-weight="bold" fill="var(--primary-accent)">Disambiguation requires context the text alone may not contain.</text>
</svg>

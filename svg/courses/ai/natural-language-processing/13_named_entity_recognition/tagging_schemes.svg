<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="100" rx="14" fill="var(--code-bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--surface)">Sentence</text>
  <text x="640" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--surface)">Marie    Curie    visited    Paris    yesterday    .</text>

  <rect x="40" y="170" width="1200" height="135" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">BIO</text>
  <text x="115" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">begin</text>
  <text x="115" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">inside</text>
  <text x="115" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">outside</text>
  <text x="320" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">B-PER</text>
  <text x="470" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">I-PER</text>
  <text x="640" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">O</text>
  <text x="800" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">B-LOC</text>
  <text x="970" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">O</text>
  <text x="1140" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">O</text>
  <text x="640" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">single tag distinguishes only span boundaries by type</text>

  <rect x="40" y="335" width="1200" height="135" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">BIOES</text>
  <text x="115" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">+ end</text>
  <text x="115" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">+ single</text>
  <text x="320" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">B-PER</text>
  <text x="470" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">E-PER</text>
  <text x="640" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">O</text>
  <text x="800" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">S-LOC</text>
  <text x="970" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">O</text>
  <text x="1140" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">O</text>
  <text x="640" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">explicit end and single-token markers help downstream decoding</text>

  <rect x="40" y="500" width="1200" height="120" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Limitation</text>
  <text x="640" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">A flat tag per token cannot encode nested or overlapping entities.</text>
  <text x="640" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Nested NER needs span enumeration or stacked label layers.</text>
</svg>

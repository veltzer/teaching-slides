<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="230" height="267.692307692308" rx="8.44894167246" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599263" font-weight="bold" fill="var(--primary-text)">1. Context</text>
  <text x="155" y="134.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--primary-text)">Set the stage</text>
  <text x="155" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--primary-text)">Share constraints</text>
  <text x="155" y="201.730769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--primary-text)">Name files</text>
  <text x="155" y="235.192307692307" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--primary-text)">State goal</text>

  <rect x="285" y="40" width="230" height="267.692307692308" rx="8.44894167246" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599263" font-weight="bold" fill="var(--ok-text)">2. Iterate</text>
  <text x="400" y="134.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--ok-text)">Short loops</text>
  <text x="400" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--ok-text)">Refine prompts</text>
  <text x="400" y="201.730769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--ok-text)">Adjust context</text>

  <rect x="530" y="40" width="230" height="267.692307692308" rx="8.44894167246" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="645" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599263" font-weight="bold" fill="var(--warn-text)">3. Verify</text>
  <text x="645" y="134.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--warn-text)">Run tests</text>
  <text x="645" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--warn-text)">Check outputs</text>
  <text x="645" y="201.730769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--warn-text)">Spot hallucinations</text>

  <rect x="775" y="40" width="230" height="267.692307692308" rx="8.44894167246" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599263" font-weight="bold" fill="var(--info-text)">4. Review</text>
  <text x="890" y="134.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--info-text)">Read every line</text>
  <text x="890" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--info-text)">Challenge choices</text>
  <text x="890" y="201.730769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--info-text)">Own the code</text>

  <rect x="1020" y="40" width="220" height="267.692307692308" rx="8.44894167246" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599263" font-weight="bold" fill="var(--danger-text)">5. Learn</text>
  <text x="1130" y="134.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--danger-text)">Study diffs</text>
  <text x="1130" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--danger-text)">Fundamentals</text>
  <text x="1130" y="201.730769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--danger-text)">Build intuition</text>

  <rect x="200" y="352.307692307692" width="880" height="267.692307692308" rx="8.44894167246" fill="var(--surface)" stroke="var(--border)"/>
  <text x="640" y="402.499999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599263" font-weight="bold" fill="var(--text)">The Habit Loop</text>
  <text x="640" y="458.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--text-muted)">Feed enough context, then steer step-by-step</text>
  <text x="640" y="497.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--text-muted)">Verify every suggestion before accepting</text>
  <text x="640" y="536.346153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--text-muted)">Review like a senior teammate</text>
  <text x="640" y="586.538461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-style="italic" fill="var(--text-faint)">Context + iteration compound</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="240" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Clear Context</text>
  <text x="160" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Set the stage</text>
  <text x="160" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Share constraints</text>
  <text x="160" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Name the files</text>
  <text x="160" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">State the goal</text>
  <text x="160" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="var(--primary-text)">1</text>

  <rect x="300" y="40" width="220" height="280" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Iterate</text>
  <text x="410" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Short loops</text>
  <text x="410" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Refine prompts</text>
  <text x="410" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Adjust context</text>
  <text x="410" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="var(--ok-text)">2</text>

  <rect x="540" y="40" width="220" height="280" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Verify</text>
  <text x="650" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Run the tests</text>
  <text x="650" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Check outputs</text>
  <text x="650" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Spot hallucinations</text>
  <text x="650" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="var(--warn-text)">3</text>

  <rect x="780" y="40" width="220" height="280" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Review</text>
  <text x="890" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Read every line</text>
  <text x="890" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Challenge choices</text>
  <text x="890" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Own the code</text>
  <text x="890" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="var(--info-text)">4</text>

  <rect x="1020" y="40" width="220" height="280" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Learn</text>
  <text x="1130" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Study diffs</text>
  <text x="1130" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Keep fundamentals</text>
  <text x="1130" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Build intuition</text>
  <text x="1130" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="var(--danger-text)">5</text>

  <rect x="300" y="340" width="940" height="280" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="770" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">The AI Coding Habit Loop</text>
  <text x="770" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Feed the model enough context, then steer it one step at a time.</text>
  <text x="770" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Run and verify every suggestion before accepting it.</text>
  <text x="770" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Review changes like a senior teammate, not a rubber stamp.</text>
  <text x="770" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Treat every session as a chance to sharpen your own skills.</text>
  <text x="770" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--text-faint)">Context, iteration, verification, review, and learning compound.</text>
</svg>

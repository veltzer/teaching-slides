<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.3613" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Learning Progress Dashboard</text>
  <rect x="40" y="74.1177" width="514.2857" height="255.8824" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1429" y="125.2941" text-anchor="middle" fill="var(--bg)" font-size="21.281" font-weight="bold" font-family="Arial, sans-serif">Skills Acquired</text>
  <text x="297.1429" y="176.4706" text-anchor="middle" fill="var(--bg)" font-size="36.4817" font-family="Arial, sans-serif">47</text>
  <text x="297.1429" y="227.6471" text-anchor="middle" fill="var(--bg)" font-size="18.2408" font-family="Arial, sans-serif">This Quarter</text>
  <text x="297.1429" y="261.7647" text-anchor="middle" fill="var(--bg)" font-size="15.2007" font-family="Arial, sans-serif">↑ 23% from last quarter</text>
  <rect x="725.7143" y="74.1177" width="514.2857" height="255.8824" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.8571" y="125.2941" text-anchor="middle" fill="var(--bg)" font-size="21.281" font-weight="bold" font-family="Arial, sans-serif">Problems Solved</text>
  <text x="982.8571" y="176.4706" text-anchor="middle" fill="var(--bg)" font-size="36.4817" font-family="Arial, sans-serif">312</text>
  <text x="982.8571" y="227.6471" text-anchor="middle" fill="var(--bg)" font-size="18.2408" font-family="Arial, sans-serif">Total</text>
  <text x="982.8571" y="261.7647" text-anchor="middle" fill="var(--bg)" font-size="15.2007" font-family="Arial, sans-serif">15 this week</text>
  <rect x="40" y="364.1176" width="514.2857" height="255.8824" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1429" y="415.2941" text-anchor="middle" fill="var(--bg)" font-size="21.281" font-weight="bold" font-family="Arial, sans-serif">Learning Velocity</text>
  <text x="297.1429" y="466.4706" text-anchor="middle" fill="var(--bg)" font-size="36.4817" font-family="Arial, sans-serif">3.2x</text>
  <text x="297.1429" y="517.647" text-anchor="middle" fill="var(--bg)" font-size="18.2408" font-family="Arial, sans-serif">Faster with AI</text>
  <text x="297.1429" y="551.7647" text-anchor="middle" fill="var(--bg)" font-size="15.2007" font-family="Arial, sans-serif">vs traditional methods</text>
  <rect x="725.7143" y="364.1176" width="514.2857" height="255.8824" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.8571" y="415.2941" text-anchor="middle" fill="var(--bg)" font-size="21.281" font-weight="bold" font-family="Arial, sans-serif">Knowledge Retention</text>
  <text x="982.8571" y="466.4706" text-anchor="middle" fill="var(--bg)" font-size="36.4817" font-family="Arial, sans-serif">85%</text>
  <text x="982.8571" y="517.647" text-anchor="middle" fill="var(--bg)" font-size="18.2408" font-family="Arial, sans-serif">After 3 months</text>
  <text x="982.8571" y="551.7647" text-anchor="middle" fill="var(--bg)" font-size="15.2007" font-family="Arial, sans-serif">Active recall working</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.3613" font-weight="bold">Learning Progress Dashboard</text>
  <rect x="40" y="74.1177" width="514.2857" height="255.8824" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="297.1429" y="125.2941" text-anchor="middle" fill="var(--bg)" font-size="21.281" font-weight="bold">Skills Acquired</text>
  <text x="297.1429" y="176.4706" text-anchor="middle" fill="var(--bg)" font-size="36.4817">47</text>
  <text x="297.1429" y="227.6471" text-anchor="middle" fill="var(--bg)" font-size="18.2408">This Quarter</text>
  <text x="297.1429" y="261.7647" text-anchor="middle" fill="var(--bg)" font-size="15.2007">↑ 23% from last quarter</text>
  <rect x="725.7143" y="74.1177" width="514.2857" height="255.8824" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="982.8571" y="125.2941" text-anchor="middle" fill="var(--bg)" font-size="21.281" font-weight="bold">Problems Solved</text>
  <text x="982.8571" y="176.4706" text-anchor="middle" fill="var(--bg)" font-size="36.4817">312</text>
  <text x="982.8571" y="227.6471" text-anchor="middle" fill="var(--bg)" font-size="18.2408">Total</text>
  <text x="982.8571" y="261.7647" text-anchor="middle" fill="var(--bg)" font-size="15.2007">15 this week</text>
  <rect x="40" y="364.1176" width="514.2857" height="255.8824" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="297.1429" y="415.2941" text-anchor="middle" fill="var(--bg)" font-size="21.281" font-weight="bold">Learning Velocity</text>
  <text x="297.1429" y="466.4706" text-anchor="middle" fill="var(--bg)" font-size="36.4817">3.2x</text>
  <text x="297.1429" y="517.647" text-anchor="middle" fill="var(--bg)" font-size="18.2408">Faster with AI</text>
  <text x="297.1429" y="551.7647" text-anchor="middle" fill="var(--bg)" font-size="15.2007">vs traditional methods</text>
  <rect x="725.7143" y="364.1176" width="514.2857" height="255.8824" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="982.8571" y="415.2941" text-anchor="middle" fill="var(--bg)" font-size="21.281" font-weight="bold">Knowledge Retention</text>
  <text x="982.8571" y="466.4706" text-anchor="middle" fill="var(--bg)" font-size="36.4817">85%</text>
  <text x="982.8571" y="517.647" text-anchor="middle" fill="var(--bg)" font-size="18.2408">After 3 months</text>
  <text x="982.8571" y="551.7647" text-anchor="middle" fill="var(--bg)" font-size="15.2007">Active recall working</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="514.2857" height="271.875076367195" fill="url(#grad-primary)" rx="6.184658738329" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="297.1429" y="94.374930273431" text-anchor="middle" fill="var(--bg)" font-size="21.935953768397" font-weight="bold" font-family="Arial, sans-serif">Skills Acquired</text>
  <text x="297.1429" y="148.749966796872" text-anchor="middle" fill="var(--bg)" font-size="37.604477449017" font-family="Arial, sans-serif">47</text>
  <text x="297.1429" y="203.125003320313" text-anchor="middle" fill="var(--bg)" font-size="18.802187185686" font-family="Arial, sans-serif">This Quarter</text>
  <text x="297.1429" y="239.374956835933" text-anchor="middle" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">↑ 23% from last quarter</text>
  <rect x="725.7143" y="40" width="514.2857" height="271.875076367195" fill="url(#grad-ok)" rx="6.184658738329" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="982.8571" y="94.374930273431" text-anchor="middle" fill="var(--bg)" font-size="21.935953768397" font-weight="bold" font-family="Arial, sans-serif">Problems Solved</text>
  <text x="982.8571" y="148.749966796872" text-anchor="middle" fill="var(--bg)" font-size="37.604477449017" font-family="Arial, sans-serif">312</text>
  <text x="982.8571" y="203.125003320313" text-anchor="middle" fill="var(--bg)" font-size="18.802187185686" font-family="Arial, sans-serif">Total</text>
  <text x="982.8571" y="239.374956835933" text-anchor="middle" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">15 this week</text>
  <rect x="40" y="348.124923632805" width="514.2857" height="271.875076367195" fill="url(#grad-danger)" rx="6.184658738329" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="297.1429" y="402.499960156246" text-anchor="middle" fill="var(--bg)" font-size="21.935953768397" font-weight="bold" font-family="Arial, sans-serif">Learning Velocity</text>
  <text x="297.1429" y="456.874996679687" text-anchor="middle" fill="var(--bg)" font-size="37.604477449017" font-family="Arial, sans-serif">3.2x</text>
  <text x="297.1429" y="511.249926953118" text-anchor="middle" fill="var(--bg)" font-size="18.802187185686" font-family="Arial, sans-serif">Faster with AI</text>
  <text x="297.1429" y="547.499986718749" text-anchor="middle" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">vs traditional methods</text>
  <rect x="725.7143" y="348.124923632805" width="514.2857" height="271.875076367195" fill="url(#grad-warn)" rx="6.184658738329" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="982.8571" y="402.499960156246" text-anchor="middle" fill="var(--bg)" font-size="21.935953768397" font-weight="bold" font-family="Arial, sans-serif">Knowledge Retention</text>
  <text x="982.8571" y="456.874996679687" text-anchor="middle" fill="var(--bg)" font-size="37.604477449017" font-family="Arial, sans-serif">85%</text>
  <text x="982.8571" y="511.249926953118" text-anchor="middle" fill="var(--bg)" font-size="18.802187185686" font-family="Arial, sans-serif">After 3 months</text>
  <text x="982.8571" y="547.499986718749" text-anchor="middle" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">Active recall working</text>
</svg>

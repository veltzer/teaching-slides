<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <circle cx="577.9189" cy="365.7143" r="216.7196" fill="none" stroke="var(--primary-border)" stroke-width="4.3344" />
  <text x="577.9189" y="365.7143" text-anchor="middle" font-size="23.1168" font-weight="bold">Learning</text>
  <text x="577.9189" y="402.2857" text-anchor="middle" font-size="23.1168" font-weight="bold">Habits</text>
  <circle cx="577.9189" cy="146.2857" r="14.448" fill="var(--ok-fill)" />
  <text x="577.9189" y="109.7143" text-anchor="middle" font-size="17.3376">Daily Code</text>
  <circle cx="693.5026" cy="219.4286" r="14.448" fill="var(--ok-fill)" />
  <text x="794.6384" y="219.4286" font-size="17.3376">Weekly Project</text>
  <circle cx="722.3986" cy="365.7143" r="14.448" fill="var(--ok-fill)" />
  <text x="823.5344" y="365.7143" font-size="17.3376">Code Review</text>
  <circle cx="693.5026" cy="512" r="14.448" fill="var(--ok-fill)" />
  <text x="794.6384" y="512" font-size="17.3376">Teach Others</text>
  <circle cx="577.9189" cy="585.1429" r="14.448" fill="var(--ok-fill)" />
  <text x="577.9189" y="640" text-anchor="middle" font-size="17.3376">Document</text>
  <circle cx="462.3351" cy="512" r="14.448" fill="var(--ok-fill)" />
  <text x="361.1993" y="512" text-anchor="end" font-size="17.3376">Experiment</text>
  <circle cx="433.4392" cy="365.7143" r="14.448" fill="var(--ok-fill)" />
  <text x="332.3034" y="365.7143" text-anchor="end" font-size="17.3376">Read Code</text>
  <circle cx="462.3351" cy="219.4286" r="14.448" fill="var(--ok-fill)" />
  <text x="361.1993" y="219.4286" text-anchor="end" font-size="17.3376">Ask Why</text>
</svg>
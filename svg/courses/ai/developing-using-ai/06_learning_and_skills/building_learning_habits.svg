<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="395" height="280" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Daily Practice</text>
  <text x="237" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Write code every day</text>
  <text x="237" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Solve one small problem</text>
  <text x="237" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Read other peoples code</text>
  <text x="237" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Keep a notes file</text>
  <text x="237" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">Twenty minutes a day</text>
  <text x="237" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">beats one long weekend.</text>

  <rect x="445" y="40" width="395" height="280" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Deliberate Use of AI</text>
  <text x="642" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Try the problem first</text>
  <text x="642" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Then compare with AI</text>
  <text x="642" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Ask it to explain, not do</text>
  <text x="642" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Reject mystery code</text>
  <text x="642" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">The model is a tutor</text>
  <text x="642" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">and a peer, not a vending machine.</text>

  <rect x="850" y="40" width="390" height="280" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Read and Reflect</text>
  <text x="1045" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Follow one language deeply</text>
  <text x="1045" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Read release notes</text>
  <text x="1045" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Study open source PRs</text>
  <text x="1045" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Journal what surprised you</text>
  <text x="1045" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">Reflection turns code</text>
  <text x="1045" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">sessions into knowledge.</text>

  <rect x="40" y="340" width="395" height="280" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Build and Ship</text>
  <text x="237" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Pick a real side project</text>
  <text x="237" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Ship it end to end</text>
  <text x="237" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Deploy, monitor, iterate</text>
  <text x="237" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Reuse the lessons at work</text>
  <text x="237" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Real projects expose the</text>
  <text x="237" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">gaps in your understanding.</text>

  <rect x="445" y="340" width="395" height="280" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Teach and Share</text>
  <text x="642" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Write a short explainer</text>
  <text x="642" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Pair with a teammate</text>
  <text x="642" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Review someone elses PR</text>
  <text x="642" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Give a short talk</text>
  <text x="642" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--danger-text)">If you cannot explain it,</text>
  <text x="642" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--danger-text)">you have not learned it.</text>

  <rect x="850" y="340" width="390" height="280" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1045" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Track and Review</text>
  <text x="1045" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Keep a learning log</text>
  <text x="1045" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Tag hard problems</text>
  <text x="1045" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Revisit them monthly</text>
  <text x="1045" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Set one goal per quarter</text>
  <text x="1045" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--text-faint)">Measured growth beats</text>
  <text x="1045" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--text-faint)">the feeling of growth.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="395" height="280" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Daily Practice</text>
  <text x="237" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Code every day</text>
  <text x="237" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Small problems</text>
  <text x="237" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Read others code</text>
  <text x="237" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Keep notes</text>
  <text x="237" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">20 min beats long weekends</text>

  <rect x="445" y="40" width="395" height="280" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Deliberate AI</text>
  <text x="642" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Try first yourself</text>
  <text x="642" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Then compare</text>
  <text x="642" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Ask for explanations</text>
  <text x="642" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Reject mystery code</text>
  <text x="642" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">Tutor, not vending machine</text>

  <rect x="850" y="40" width="390" height="280" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Read and Reflect</text>
  <text x="1045" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Go deep on one language</text>
  <text x="1045" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Follow release notes</text>
  <text x="1045" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Study open PRs</text>
  <text x="1045" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Journal surprises</text>

  <rect x="40" y="340" width="395" height="280" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Build and Ship</text>
  <text x="237" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Side project</text>
  <text x="237" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Ship end-to-end</text>
  <text x="237" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Deploy, iterate</text>
  <text x="237" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Reuse lessons</text>

  <rect x="445" y="340" width="395" height="280" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Teach and Share</text>
  <text x="642" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Short explainer</text>
  <text x="642" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Pair with team</text>
  <text x="642" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Review PRs</text>
  <text x="642" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Give a talk</text>

  <rect x="850" y="340" width="390" height="280" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1045" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Track and Review</text>
  <text x="1045" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Learning log</text>
  <text x="1045" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Tag hard problems</text>
  <text x="1045" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Revisit monthly</text>
  <text x="1045" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Quarterly goal</text>
</svg>

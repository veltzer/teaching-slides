<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="733.3333" y="117.375" text-anchor="middle" font-size="33.5999" font-weight="bold">6-Month Learning Path</text>
  <rect x="80" y="188.2499" width="224.0001" height="141.75" fill="var(--primary-fill)" rx="9.275" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="192" y="270.9375" text-anchor="middle" fill="var(--bg)" font-size="22.4001">Month 1</text>
  <text x="192" y="306.375" text-anchor="middle" fill="var(--bg)" font-size="18.6667">TypeScript</text>
  <path d="M 303.9999 259.125 L 378.6666 259.125" stroke="var(--text-muted)" stroke-width="2.4151" marker-end="url(#p1)" />
  <rect x="378.6666" y="188.2499" width="224.0001" height="141.75" fill="var(--ok-fill)" rx="9.275" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="490.6665" y="270.9375" text-anchor="middle" fill="var(--bg)" font-size="22.4001">Month 2</text>
  <text x="490.6665" y="306.375" text-anchor="middle" fill="var(--bg)" font-size="18.6667">Testing</text>
  <path d="M 602.6667 259.125 L 677.3333 259.125" stroke="var(--text-muted)" stroke-width="2.4151" marker-end="url(#p2)" />
  <rect x="677.3333" y="188.2499" width="224.0001" height="141.75" fill="var(--danger-fill)" rx="9.275" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="789.3333" y="270.9375" text-anchor="middle" fill="var(--bg)" font-size="22.4001">Month 3</text>
  <text x="789.3333" y="306.375" text-anchor="middle" fill="var(--bg)" font-size="18.6667">Docker</text>
  <path d="M 901.3333 259.125 L 975.9999 259.125" stroke="var(--text-muted)" stroke-width="2.4151" marker-end="url(#p3)" />
  <rect x="975.9999" y="188.2499" width="224.0001" height="141.75" fill="var(--warn-fill)" rx="9.275" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1087.9999" y="270.9375" text-anchor="middle" fill="var(--bg)" font-size="22.4001">Month 4</text>
  <text x="1087.9999" y="306.375" text-anchor="middle" fill="var(--bg)" font-size="18.6667">CI/CD</text>
  <rect x="229.3332" y="400.875" width="224.0001" height="141.75" fill="var(--info-fill)" rx="9.275" stroke="var(--info-border)" stroke-width="2"/>
  <text x="341.3333" y="483.5625" text-anchor="middle" fill="var(--bg)" font-size="22.4001">Month 5</text>
  <text x="341.3333" y="519" text-anchor="middle" fill="var(--bg)" font-size="18.6667">Microservices</text>
  <rect x="528" y="400.875" width="224.0001" height="141.75" fill="var(--ok-fill)" rx="9.275" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="639.9999" y="483.5625" text-anchor="middle" fill="var(--bg)" font-size="22.4001">Month 6</text>
  <text x="639.9999" y="519" text-anchor="middle" fill="var(--bg)" font-size="18.6667">Project</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="p1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#555555" />
    </marker>
    <marker id="p2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#555555" />
    </marker>
    <marker id="p3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#555555" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.6546" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">React vs Vue vs Angular</text>
  <rect x="40" y="96.129" width="377.1429" height="523.871" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5713" y="152.258" text-anchor="middle" fill="var(--text)" font-size="25.4708" font-weight="bold" font-family="Arial, sans-serif">React</text>
  <text x="228.5713" y="208.3871" text-anchor="middle" font-size="19.1031" font-family="Arial, sans-serif" fill="var(--primary-text)">Learning: ⭐⭐⭐</text>
  <text x="228.5713" y="255.1613" text-anchor="middle" font-size="19.1031" font-family="Arial, sans-serif" fill="var(--primary-text)">Size: 42KB</text>
  <text x="228.5713" y="301.9355" text-anchor="middle" font-size="19.1031" font-family="Arial, sans-serif" fill="var(--primary-text)">• Component-based</text>
  <text x="228.5713" y="348.7096" text-anchor="middle" font-size="19.1031" font-family="Arial, sans-serif" fill="var(--primary-text)">• Virtual DOM</text>
  <text x="228.5713" y="395.4838" text-anchor="middle" font-size="19.1031" font-family="Arial, sans-serif" fill="var(--primary-text)">• Large ecosystem</text>
  <text x="228.5713" y="442.258" text-anchor="middle" font-size="19.1031" font-family="Arial, sans-serif" fill="var(--primary-text)">• Flexible</text>
  <rect x="451.4286" y="96.129" width="377.1429" height="523.871" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="152.258" text-anchor="middle" fill="var(--bg)" font-size="25.4708" font-weight="bold" font-family="Arial, sans-serif">Vue</text>
  <text x="640" y="208.3871" text-anchor="middle" fill="var(--bg)" font-size="19.1031" font-family="Arial, sans-serif">Learning: ⭐⭐</text>
  <text x="640" y="255.1613" text-anchor="middle" fill="var(--bg)" font-size="19.1031" font-family="Arial, sans-serif">Size: 34KB</text>
  <text x="640" y="301.9355" text-anchor="middle" fill="var(--bg)" font-size="19.1031" font-family="Arial, sans-serif">• Template-based</text>
  <text x="640" y="348.7096" text-anchor="middle" fill="var(--bg)" font-size="19.1031" font-family="Arial, sans-serif">• Reactive</text>
  <text x="640" y="395.4838" text-anchor="middle" fill="var(--bg)" font-size="19.1031" font-family="Arial, sans-serif">• Progressive</text>
  <text x="640" y="442.258" text-anchor="middle" fill="var(--bg)" font-size="19.1031" font-family="Arial, sans-serif">• Simple</text>
  <rect x="862.8571" y="96.129" width="377.1429" height="523.871" fill="var(--danger-accent)" rx="6" />
  <text x="1051.4286" y="152.258" text-anchor="middle" fill="var(--bg)" font-size="25.4708" font-weight="bold" font-family="Arial, sans-serif">Angular</text>
  <text x="1051.4286" y="208.3871" text-anchor="middle" fill="var(--bg)" font-size="19.1031" font-family="Arial, sans-serif">Learning: ⭐⭐⭐⭐⭐</text>
  <text x="1051.4286" y="255.1613" text-anchor="middle" fill="var(--bg)" font-size="19.1031" font-family="Arial, sans-serif">Size: 130KB</text>
  <text x="1051.4286" y="301.9355" text-anchor="middle" fill="var(--bg)" font-size="19.1031" font-family="Arial, sans-serif">• Full framework</text>
  <text x="1051.4286" y="348.7096" text-anchor="middle" fill="var(--bg)" font-size="19.1031" font-family="Arial, sans-serif">• TypeScript</text>
  <text x="1051.4286" y="395.4838" text-anchor="middle" fill="var(--bg)" font-size="19.1031" font-family="Arial, sans-serif">• Opinionated</text>
  <text x="1051.4286" y="442.258" text-anchor="middle" fill="var(--bg)" font-size="19.1031" font-family="Arial, sans-serif">• Enterprise</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.6546" font-weight="bold">React vs Vue vs Angular</text>
  <rect x="40" y="96.129" width="377.1429" height="523.871" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5713" y="152.258" text-anchor="middle" fill="var(--text)" font-size="25.4708" font-weight="bold">React</text>
  <text x="228.5713" y="208.3871" text-anchor="middle" font-size="19.1031">Learning: ⭐⭐⭐</text>
  <text x="228.5713" y="255.1613" text-anchor="middle" font-size="19.1031">Size: 42KB</text>
  <text x="228.5713" y="301.9355" text-anchor="middle" font-size="19.1031">• Component-based</text>
  <text x="228.5713" y="348.7096" text-anchor="middle" font-size="19.1031">• Virtual DOM</text>
  <text x="228.5713" y="395.4838" text-anchor="middle" font-size="19.1031">• Large ecosystem</text>
  <text x="228.5713" y="442.258" text-anchor="middle" font-size="19.1031">• Flexible</text>
  <rect x="451.4286" y="96.129" width="377.1429" height="523.871" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="152.258" text-anchor="middle" fill="var(--bg)" font-size="25.4708" font-weight="bold">Vue</text>
  <text x="640" y="208.3871" text-anchor="middle" fill="var(--bg)" font-size="19.1031">Learning: ⭐⭐</text>
  <text x="640" y="255.1613" text-anchor="middle" fill="var(--bg)" font-size="19.1031">Size: 34KB</text>
  <text x="640" y="301.9355" text-anchor="middle" fill="var(--bg)" font-size="19.1031">• Template-based</text>
  <text x="640" y="348.7096" text-anchor="middle" fill="var(--bg)" font-size="19.1031">• Reactive</text>
  <text x="640" y="395.4838" text-anchor="middle" fill="var(--bg)" font-size="19.1031">• Progressive</text>
  <text x="640" y="442.258" text-anchor="middle" fill="var(--bg)" font-size="19.1031">• Simple</text>
  <rect x="862.8571" y="96.129" width="377.1429" height="523.871" fill="var(--danger-accent)" rx="6" />
  <text x="1051.4286" y="152.258" text-anchor="middle" fill="var(--bg)" font-size="25.4708" font-weight="bold">Angular</text>
  <text x="1051.4286" y="208.3871" text-anchor="middle" fill="var(--bg)" font-size="19.1031">Learning: ⭐⭐⭐⭐⭐</text>
  <text x="1051.4286" y="255.1613" text-anchor="middle" fill="var(--bg)" font-size="19.1031">Size: 130KB</text>
  <text x="1051.4286" y="301.9355" text-anchor="middle" fill="var(--bg)" font-size="19.1031">• Full framework</text>
  <text x="1051.4286" y="348.7096" text-anchor="middle" fill="var(--bg)" font-size="19.1031">• TypeScript</text>
  <text x="1051.4286" y="395.4838" text-anchor="middle" fill="var(--bg)" font-size="19.1031">• Opinionated</text>
  <text x="1051.4286" y="442.258" text-anchor="middle" fill="var(--bg)" font-size="19.1031">• Enterprise</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="1024" y="129.6" text-anchor="middle" font-size="46.08" font-weight="bold">React vs Vue vs Angular</text>
  <rect x="128" y="226.8" width="563.2" height="907.2" fill="#61DAFB" rx="25.6" />
  <text x="409.6" y="324" text-anchor="middle" fill="#282C34" font-size="40.96" font-weight="bold">React</text>
  <text x="409.6" y="421.2" text-anchor="middle" font-size="30.72">Learning: ⭐⭐⭐</text>
  <text x="409.6" y="502.2" text-anchor="middle" font-size="30.72">Size: 42KB</text>
  <text x="409.6" y="583.2" text-anchor="middle" font-size="30.72">• Component-based</text>
  <text x="409.6" y="664.2" text-anchor="middle" font-size="30.72">• Virtual DOM</text>
  <text x="409.6" y="745.2" text-anchor="middle" font-size="30.72">• Large ecosystem</text>
  <text x="409.6" y="826.2" text-anchor="middle" font-size="30.72">• Flexible</text>
  <rect x="742.4" y="226.8" width="563.2" height="907.2" fill="#42B883" rx="25.6" />
  <text x="1024" y="324" text-anchor="middle" fill="white" font-size="40.96" font-weight="bold">Vue</text>
  <text x="1024" y="421.2" text-anchor="middle" fill="white" font-size="30.72">Learning: ⭐⭐</text>
  <text x="1024" y="502.2" text-anchor="middle" fill="white" font-size="30.72">Size: 34KB</text>
  <text x="1024" y="583.2" text-anchor="middle" fill="white" font-size="30.72">• Template-based</text>
  <text x="1024" y="664.2" text-anchor="middle" fill="white" font-size="30.72">• Reactive</text>
  <text x="1024" y="745.2" text-anchor="middle" fill="white" font-size="30.72">• Progressive</text>
  <text x="1024" y="826.2" text-anchor="middle" fill="white" font-size="30.72">• Simple</text>
  <rect x="1356.8" y="226.8" width="563.2" height="907.2" fill="#DD0031" rx="25.6" />
  <text x="1638.4" y="324" text-anchor="middle" fill="white" font-size="40.96" font-weight="bold">Angular</text>
  <text x="1638.4" y="421.2" text-anchor="middle" fill="white" font-size="30.72">Learning: ⭐⭐⭐⭐⭐</text>
  <text x="1638.4" y="502.2" text-anchor="middle" fill="white" font-size="30.72">Size: 130KB</text>
  <text x="1638.4" y="583.2" text-anchor="middle" fill="white" font-size="30.72">• Full framework</text>
  <text x="1638.4" y="664.2" text-anchor="middle" fill="white" font-size="30.72">• TypeScript</text>
  <text x="1638.4" y="745.2" text-anchor="middle" fill="white" font-size="30.72">• Opinionated</text>
  <text x="1638.4" y="826.2" text-anchor="middle" fill="white" font-size="30.72">• Enterprise</text>
</svg>
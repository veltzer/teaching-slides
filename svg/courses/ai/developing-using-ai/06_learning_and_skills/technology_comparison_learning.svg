    </defs>
  <ns0:text x="577.9189" y="73.1429" text-anchor="middle" font-size="26.0063" font-weight="bold">React vs Vue vs Angular</ns0:text>
  <ns0:rect x="72.2399" y="128" width="317.8554" height="512" fill="#90caf9" rx="14.448" />
  <ns0:text x="231.1675" y="182.8571" text-anchor="middle" fill="#333333" font-size="23.1168" font-weight="bold">React</ns0:text>
  <ns0:text x="231.1675" y="237.7143" text-anchor="middle" font-size="17.3376">Learning: ⭐⭐⭐</ns0:text>
  <ns0:text x="231.1675" y="283.4286" text-anchor="middle" font-size="17.3376">Size: 42KB</ns0:text>
  <ns0:text x="231.1675" y="329.1429" text-anchor="middle" font-size="17.3376">• Component-based</ns0:text>
  <ns0:text x="231.1675" y="374.8571" text-anchor="middle" font-size="17.3376">• Virtual DOM</ns0:text>
  <ns0:text x="231.1675" y="420.5714" text-anchor="middle" font-size="17.3376">• Large ecosystem</ns0:text>
  <ns0:text x="231.1675" y="466.2857" text-anchor="middle" font-size="17.3376">• Flexible</ns0:text>
  <ns0:rect x="418.9912" y="128" width="317.8554" height="512" fill="#2ecc71" rx="14.448" />
  <ns0:text x="577.9189" y="182.8571" text-anchor="middle" fill="white" font-size="23.1168" font-weight="bold">Vue</ns0:text>
  <ns0:text x="577.9189" y="237.7143" text-anchor="middle" fill="white" font-size="17.3376">Learning: ⭐⭐</ns0:text>
  <ns0:text x="577.9189" y="283.4286" text-anchor="middle" fill="white" font-size="17.3376">Size: 34KB</ns0:text>
  <ns0:text x="577.9189" y="329.1429" text-anchor="middle" fill="white" font-size="17.3376">• Template-based</ns0:text>
  <ns0:text x="577.9189" y="374.8571" text-anchor="middle" fill="white" font-size="17.3376">• Reactive</ns0:text>
  <ns0:text x="577.9189" y="420.5714" text-anchor="middle" fill="white" font-size="17.3376">• Progressive</ns0:text>
  <ns0:text x="577.9189" y="466.2857" text-anchor="middle" fill="white" font-size="17.3376">• Simple</ns0:text>
  <ns0:rect x="765.7425" y="128" width="317.8554" height="512" fill="#c62828" rx="14.448" />
  <ns0:text x="924.6702" y="182.8571" text-anchor="middle" fill="white" font-size="23.1168" font-weight="bold">Angular</ns0:text>
  <ns0:text x="924.6702" y="237.7143" text-anchor="middle" fill="white" font-size="17.3376">Learning: ⭐⭐⭐⭐⭐</ns0:text>
  <ns0:text x="924.6702" y="283.4286" text-anchor="middle" fill="white" font-size="17.3376">Size: 130KB</ns0:text>
  <ns0:text x="924.6702" y="329.1429" text-anchor="middle" fill="white" font-size="17.3376">• Full framework</ns0:text>
  <ns0:text x="924.6702" y="374.8571" text-anchor="middle" fill="white" font-size="17.3376">• TypeScript</ns0:text>
  <ns0:text x="924.6702" y="420.5714" text-anchor="middle" fill="white" font-size="17.3376">• Opinionated</ns0:text>
  <ns0:text x="924.6702" y="466.2857" text-anchor="middle" fill="white" font-size="17.3376">• Enterprise</ns0:text>
</ns0:svg>
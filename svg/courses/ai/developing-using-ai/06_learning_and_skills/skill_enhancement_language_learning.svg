<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="684.8934" y="80" text-anchor="middle" font-size="32.3232" font-weight="bold">Language Learning Path</text>
  <circle cx="235.9596" cy="443.6364" r="71.8294" fill="var(--primary-fill)" />
  <text x="235.9596" y="455.0001" text-anchor="middle" fill="var(--bg)" font-size="25.1403">Syntax</text>
  <path d="M 307.789 443.6364 L 433.4905 443.6364" stroke="var(--text-muted)" stroke-width="2.2857" marker-end="url(#l1)" />
  <circle cx="505.3198" cy="443.6364" r="71.8294" fill="var(--ok-fill)" />
  <text x="505.3198" y="455.0001" text-anchor="middle" fill="var(--bg)" font-size="25.1403">Concepts</text>
  <path d="M 577.1492 443.6364 L 702.8506 443.6364" stroke="var(--text-muted)" stroke-width="2.2857" marker-end="url(#l2)" />
  <circle cx="774.6801" cy="443.6364" r="71.8294" fill="var(--warn-fill)" />
  <text x="774.6801" y="455.0001" text-anchor="middle" fill="var(--bg)" font-size="25.1403">Patterns</text>
  <path d="M 846.5095 443.6364 L 972.211 443.6364" stroke="var(--text-muted)" stroke-width="2.2857" marker-end="url(#l3)" />
  <circle cx="1044.0404" cy="443.6364" r="71.8294" fill="var(--danger-fill)" />
  <text x="1044.0404" y="455.0001" text-anchor="middle" fill="var(--bg)" font-size="25.1403">Ecosystem</text>
  <text x="235.9596" y="580" text-anchor="middle" font-size="21.5488">Week 1</text>
  <text x="505.3198" y="580" text-anchor="middle" font-size="21.5488">Week 2-3</text>
  <text x="774.6801" y="580" text-anchor="middle" font-size="21.5488">Week 4-6</text>
  <text x="1044.0404" y="580" text-anchor="middle" font-size="21.5488">Week 7-8</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="l1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#555555" />
    </marker>
    <marker id="l2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#555555" />
    </marker>
    <marker id="l3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#555555" />
    </marker>
  </defs>

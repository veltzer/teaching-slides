<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="577.9189" y="73.1429" text-anchor="middle" font-size="26.0063" font-weight="bold">Two Sum Problem - Multiple Solutions</text>
  <rect x="72.2399" y="128" width="288.9594" height="182.8571" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="216.7196" y="182.8571" text-anchor="middle" fill="var(--bg)" font-size="20.2272">Brute Force</text>
  <text x="216.7196" y="219.4286" text-anchor="middle" fill="var(--bg)" font-size="17.3376">Time: O(n²)</text>
  <text x="216.7196" y="256" text-anchor="middle" fill="var(--bg)" font-size="17.3376">Space: O(1)</text>
  <text x="216.7196" y="292.5714" text-anchor="middle" fill="var(--bg)" font-size="17.3376">Simple but slow</text>
  <rect x="433.4392" y="128" width="288.9594" height="182.8571" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="577.9189" y="182.8571" text-anchor="middle" fill="var(--bg)" font-size="20.2272">Hash Map</text>
  <text x="577.9189" y="219.4286" text-anchor="middle" fill="var(--bg)" font-size="17.3376">Time: O(n)</text>
  <text x="577.9189" y="256" text-anchor="middle" fill="var(--bg)" font-size="17.3376">Space: O(n)</text>
  <text x="577.9189" y="292.5714" text-anchor="middle" fill="var(--bg)" font-size="17.3376">Fast, uses memory</text>
  <rect x="794.6384" y="128" width="288.9594" height="182.8571" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="939.1182" y="182.8571" text-anchor="middle" fill="var(--bg)" font-size="20.2272">Two Pointers</text>
  <text x="939.1182" y="219.4286" text-anchor="middle" fill="var(--bg)" font-size="17.3376">Time: O(n log n)</text>
  <text x="939.1182" y="256" text-anchor="middle" fill="var(--bg)" font-size="17.3376">Space: O(1)</text>
  <text x="939.1182" y="292.5714" text-anchor="middle" fill="var(--bg)" font-size="17.3376">Sorted array only</text>
  <rect x="252.8395" y="365.7143" width="650.1587" height="274.2857" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="577.9189" y="420.5714" text-anchor="middle" fill="var(--bg)" font-size="20.2272">Decision Factors</text>
  <text x="577.9189" y="475.4286" text-anchor="middle" fill="var(--bg)" font-size="17.3376">• Input size: Large → Hash Map</text>
  <text x="577.9189" y="521.1429" text-anchor="middle" fill="var(--bg)" font-size="17.3376">• Memory constraints: Limited → Two Pointers</text>
  <text x="577.9189" y="566.8571" text-anchor="middle" fill="var(--bg)" font-size="17.3376">• Simplicity needed: Brute Force</text>
  <text x="577.9189" y="612.5714" text-anchor="middle" fill="var(--bg)" font-size="17.3376">• Already sorted: Two Pointers</text>
</svg>
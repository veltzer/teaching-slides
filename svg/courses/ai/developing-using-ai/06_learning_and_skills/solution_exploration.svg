<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="342.8571" height="207.142762244904" fill="url(#grad-danger)" rx="6.313251175336" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4286" y="102.142817602043" text-anchor="middle" fill="var(--bg)" font-size="23.450571490787" font-family="Arial, sans-serif">Brute Force</text>
  <text x="211.4286" y="143.571436479591" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">Time: O(n²)</text>
  <text x="211.4286" y="184.999944642861" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">Space: O(1)</text>
  <text x="211.4286" y="226.428563520409" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">Simple but slow</text>
  <rect x="468.5715" y="40" width="342.8571" height="207.142762244904" fill="url(#grad-warn)" rx="6.313251175336" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="102.142817602043" text-anchor="middle" fill="var(--bg)" font-size="23.450571490787" font-family="Arial, sans-serif">Hash Map</text>
  <text x="640.0001" y="143.571436479591" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">Time: O(n)</text>
  <text x="640.0001" y="184.999944642861" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">Space: O(n)</text>
  <text x="640.0001" y="226.428563520409" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">Fast, uses memory</text>
  <rect x="897.1429" y="40" width="342.8571" height="207.142762244904" fill="url(#grad-ok)" rx="6.313251175336" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.5715" y="102.142817602043" text-anchor="middle" fill="var(--bg)" font-size="23.450571490787" font-family="Arial, sans-serif">Two Pointers</text>
  <text x="1068.5715" y="143.571436479591" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">Time: O(n log n)</text>
  <text x="1068.5715" y="184.999944642861" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">Space: O(1)</text>
  <text x="1068.5715" y="226.428563520409" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">Sorted array only</text>
  <rect x="254.2857" y="309.285690561226" width="771.4286" height="310.714309438774" fill="url(#grad-primary)" rx="6.313251175336" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="371.428508163269" text-anchor="middle" fill="var(--bg)" font-size="23.450571490787" font-family="Arial, sans-serif">Decision Factors</text>
  <text x="640.0001" y="433.571436479591" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">• Input size: Large → Hash Map</text>
  <text x="640.0001" y="485.357154719387" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">• Memory constraints: Limited → Two Pointers</text>
  <text x="640.0001" y="537.142762244904" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">• Simplicity needed: Brute Force</text>
  <text x="640.0001" y="588.928591198979" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">• Already sorted: Two Pointers</text>
</svg>

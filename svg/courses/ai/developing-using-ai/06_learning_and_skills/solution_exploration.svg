<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="577.9189" y="73.1429" text-anchor="middle" font-size="26.0063" font-weight="bold">Two Sum Problem - Multiple Solutions</ns0:text>
  <ns0:rect x="72.2399" y="128" width="288.9594" height="182.8571" fill="#E74C3C" rx="14.448" />
  <ns0:text x="216.7196" y="182.8571" text-anchor="middle" fill="white" font-size="20.2272">Brute Force</ns0:text>
  <ns0:text x="216.7196" y="219.4286" text-anchor="middle" fill="white" font-size="17.3376">Time: O(n²)</ns0:text>
  <ns0:text x="216.7196" y="256" text-anchor="middle" fill="white" font-size="17.3376">Space: O(1)</ns0:text>
  <ns0:text x="216.7196" y="292.5714" text-anchor="middle" fill="white" font-size="17.3376">Simple but slow</ns0:text>
  <ns0:rect x="433.4392" y="128" width="288.9594" height="182.8571" fill="#F39C12" rx="14.448" />
  <ns0:text x="577.9189" y="182.8571" text-anchor="middle" fill="white" font-size="20.2272">Hash Map</ns0:text>
  <ns0:text x="577.9189" y="219.4286" text-anchor="middle" fill="white" font-size="17.3376">Time: O(n)</ns0:text>
  <ns0:text x="577.9189" y="256" text-anchor="middle" fill="white" font-size="17.3376">Space: O(n)</ns0:text>
  <ns0:text x="577.9189" y="292.5714" text-anchor="middle" fill="white" font-size="17.3376">Fast, uses memory</ns0:text>
  <ns0:rect x="794.6384" y="128" width="288.9594" height="182.8571" fill="#27AE60" rx="14.448" />
  <ns0:text x="939.1182" y="182.8571" text-anchor="middle" fill="white" font-size="20.2272">Two Pointers</ns0:text>
  <ns0:text x="939.1182" y="219.4286" text-anchor="middle" fill="white" font-size="17.3376">Time: O(n log n)</ns0:text>
  <ns0:text x="939.1182" y="256" text-anchor="middle" fill="white" font-size="17.3376">Space: O(1)</ns0:text>
  <ns0:text x="939.1182" y="292.5714" text-anchor="middle" fill="white" font-size="17.3376">Sorted array only</ns0:text>
  <ns0:rect x="252.8395" y="365.7143" width="650.1587" height="274.2857" fill="#3498DB" rx="14.448" />
  <ns0:text x="577.9189" y="420.5714" text-anchor="middle" fill="white" font-size="20.2272">Decision Factors</ns0:text>
  <ns0:text x="577.9189" y="475.4286" text-anchor="middle" fill="white" font-size="17.3376">• Input size: Large → Hash Map</ns0:text>
  <ns0:text x="577.9189" y="521.1429" text-anchor="middle" fill="white" font-size="17.3376">• Memory constraints: Limited → Two Pointers</ns0:text>
  <ns0:text x="577.9189" y="566.8571" text-anchor="middle" fill="white" font-size="17.3376">• Simplicity needed: Brute Force</ns0:text>
  <ns0:text x="577.9189" y="612.5714" text-anchor="middle" fill="white" font-size="17.3376">• Already sorted: Two Pointers</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="1024" y="129.6" text-anchor="middle" font-size="46.08" font-weight="bold">Two Sum Problem - Multiple Solutions</text>
  <rect x="128" y="226.8" width="512" height="324" fill="#E74C3C" rx="25.6" />
  <text x="384" y="324" text-anchor="middle" fill="white" font-size="35.84">Brute Force</text>
  <text x="384" y="388.8" text-anchor="middle" fill="white" font-size="30.72">Time: O(n²)</text>
  <text x="384" y="453.6" text-anchor="middle" fill="white" font-size="30.72">Space: O(1)</text>
  <text x="384" y="518.4" text-anchor="middle" fill="white" font-size="30.72">Simple but slow</text>
  <rect x="768" y="226.8" width="512" height="324" fill="#F39C12" rx="25.6" />
  <text x="1024" y="324" text-anchor="middle" fill="white" font-size="35.84">Hash Map</text>
  <text x="1024" y="388.8" text-anchor="middle" fill="white" font-size="30.72">Time: O(n)</text>
  <text x="1024" y="453.6" text-anchor="middle" fill="white" font-size="30.72">Space: O(n)</text>
  <text x="1024" y="518.4" text-anchor="middle" fill="white" font-size="30.72">Fast, uses memory</text>
  <rect x="1408" y="226.8" width="512" height="324" fill="#27AE60" rx="25.6" />
  <text x="1664" y="324" text-anchor="middle" fill="white" font-size="35.84">Two Pointers</text>
  <text x="1664" y="388.8" text-anchor="middle" fill="white" font-size="30.72">Time: O(n log n)</text>
  <text x="1664" y="453.6" text-anchor="middle" fill="white" font-size="30.72">Space: O(1)</text>
  <text x="1664" y="518.4" text-anchor="middle" fill="white" font-size="30.72">Sorted array only</text>
  <rect x="448" y="648" width="1152" height="486" fill="#3498DB" rx="25.6" />
  <text x="1024" y="745.2" text-anchor="middle" fill="white" font-size="35.84">Decision Factors</text>
  <text x="1024" y="842.4" text-anchor="middle" fill="white" font-size="30.72">• Input size: Large → Hash Map</text>
  <text x="1024" y="923.4" text-anchor="middle" fill="white" font-size="30.72">• Memory constraints: Limited → Two Pointers</text>
  <text x="1024" y="1004.4" text-anchor="middle" fill="white" font-size="30.72">• Simplicity needed: Brute Force</text>
  <text x="1024" y="1085.4" text-anchor="middle" fill="white" font-size="30.72">• Already sorted: Two Pointers</text>
</svg>
  <text x="940" y="213.999966399997" text-anchor="middle" fill="var(--danger-accent)" font-size="22.976763636572" font-family="Arial, sans-serif">⭐⭐⭐⭐</text>
  <text x="1140.0001" y="213.999966399997" text-anchor="middle" fill="var(--ok-accent)" font-size="22.976763636572" font-family="Arial, sans-serif">⭐⭐</text>
  <text x="190" y="283.600020160002" text-anchor="middle" fill="var(--bg)" font-size="22.976763636572" font-family="Arial, sans-serif">Performance</text>
  <text x="540" y="283.600020160002" text-anchor="middle" fill="var(--ok-accent)" font-size="22.976763636572" font-family="Arial, sans-serif">⭐⭐⭐⭐</text>
  <text x="740" y="283.600020160002" text-anchor="middle" fill="var(--ok-accent)" font-size="22.976763636572" font-family="Arial, sans-serif">⭐⭐⭐⭐</text>
  <text x="940" y="283.600020160002" text-anchor="middle" fill="var(--warn-accent)" font-size="22.976763636572" font-family="Arial, sans-serif">⭐⭐⭐</text>

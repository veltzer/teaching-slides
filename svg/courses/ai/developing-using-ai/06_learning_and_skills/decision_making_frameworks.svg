<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="32.5664" font-weight="bold">Technology Decision Matrix</text>
  <rect x="40" y="102.1429" width="1200" height="517.8571" fill="var(--text)" rx="6" />
  <line x1="340" y1="102.1429" x2="340" y2="620" stroke="var(--bg)" stroke-width="1.5802" />
  <line x1="40" y1="205.7143" x2="1240" y2="205.7143" stroke="var(--bg)" stroke-width="1.5802" />
  <text x="190" y="164.2857" text-anchor="middle" fill="var(--bg)" font-size="25.3295">Criteria</text>
  <text x="540" y="164.2857" text-anchor="middle" fill="var(--bg)" font-size="25.3295">React</text>
  <text x="740" y="164.2857" text-anchor="middle" fill="var(--bg)" font-size="25.3295">Vue</text>
  <text x="940" y="164.2857" text-anchor="middle" fill="var(--bg)" font-size="25.3295">Angular</text>
  <text x="1140.0001" y="164.2857" text-anchor="middle" fill="var(--bg)" font-size="25.3295">Svelte</text>
  <text x="190" y="257.5" text-anchor="middle" fill="var(--bg)" font-size="21.711">Learning Curve</text>
  <text x="540" y="257.5" text-anchor="middle" fill="var(--warn-accent)" font-size="21.711">⭐⭐⭐</text>
  <text x="740" y="257.5" text-anchor="middle" fill="var(--ok-accent)" font-size="21.711">⭐⭐</text>
  <text x="940" y="257.5" text-anchor="middle" fill="var(--danger-accent)" font-size="21.711">⭐⭐⭐⭐</text>
  <text x="1140.0001" y="257.5" text-anchor="middle" fill="var(--ok-accent)" font-size="21.711">⭐⭐</text>
  <text x="190" y="319.6429" text-anchor="middle" fill="var(--bg)" font-size="21.711">Performance</text>
  <text x="540" y="319.6429" text-anchor="middle" fill="var(--ok-accent)" font-size="21.711">⭐⭐⭐⭐</text>
  <text x="740" y="319.6429" text-anchor="middle" fill="var(--ok-accent)" font-size="21.711">⭐⭐⭐⭐</text>
  <text x="940" y="319.6429" text-anchor="middle" fill="var(--warn-accent)" font-size="21.711">⭐⭐⭐</text>
  <text x="1140.0001" y="319.6429" text-anchor="middle" fill="var(--ok-accent)" font-size="21.711">⭐⭐⭐⭐⭐</text>
  <text x="190" y="381.7857" text-anchor="middle" fill="var(--bg)" font-size="21.711">Ecosystem</text>
  <text x="540" y="381.7857" text-anchor="middle" fill="var(--ok-accent)" font-size="21.711">⭐⭐⭐⭐⭐</text>
  <text x="740" y="381.7857" text-anchor="middle" fill="var(--warn-accent)" font-size="21.711">⭐⭐⭐</text>
  <text x="940" y="381.7857" text-anchor="middle" fill="var(--ok-accent)" font-size="21.711">⭐⭐⭐⭐</text>
  <text x="1140.0001" y="381.7857" text-anchor="middle" fill="var(--warn-accent)" font-size="21.711">⭐⭐</text>
</svg>
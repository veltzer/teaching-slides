  <text x="1140.0001" y="109.599941759995" text-anchor="middle" fill="var(--bg)" font-size="26.806224242667" font-family="Arial, sans-serif">Svelte</text>
  <text x="190" y="213.999966399997" text-anchor="middle" fill="var(--bg)" font-size="22.976763636572" font-family="Arial, sans-serif">Learning Curve</text>

  <text x="740" y="353.199961919997" text-anchor="middle" fill="var(--warn-accent)" font-size="22.976763636572" font-family="Arial, sans-serif">⭐⭐⭐</text>
  <text x="940" y="353.199961919997" text-anchor="middle" fill="var(--ok-accent)" font-size="22.976763636572" font-family="Arial, sans-serif">⭐⭐⭐⭐</text>

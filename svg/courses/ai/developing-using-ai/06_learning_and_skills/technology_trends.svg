<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="37.6045" font-weight="bold">2024-2025 Tech Trends to Learn</text>
  <rect x="40" y="122.8571" width="360" height="220.9524" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="220.0001" y="205.7143" text-anchor="middle" fill="var(--bg)" font-size="29.2479">AI/ML</text>
  <text x="220.0001" y="260.9524" text-anchor="middle" fill="var(--bg)" font-size="22.9805">• LLMs</text>
  <text x="220.0001" y="302.381" text-anchor="middle" fill="var(--bg)" font-size="22.9805">• RAG</text>
  <rect x="460" y="122.8571" width="360" height="220.9524" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640.0001" y="205.7143" text-anchor="middle" fill="var(--bg)" font-size="29.2479">Cloud Native</text>
  <text x="640.0001" y="260.9524" text-anchor="middle" fill="var(--bg)" font-size="22.9805">• Kubernetes</text>
  <text x="640.0001" y="302.381" text-anchor="middle" fill="var(--bg)" font-size="22.9805">• Serverless</text>
  <rect x="880" y="122.8571" width="360" height="220.9524" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1060" y="205.7143" text-anchor="middle" fill="var(--bg)" font-size="29.2479">WebAssembly</text>
  <text x="1060" y="260.9524" text-anchor="middle" fill="var(--bg)" font-size="22.9805">• Performance</text>
  <text x="1060" y="302.381" text-anchor="middle" fill="var(--bg)" font-size="22.9805">• Portability</text>
  <rect x="40" y="399.0476" width="360" height="220.9524" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="220.0001" y="481.9046" text-anchor="middle" fill="var(--bg)" font-size="29.2479">Edge Computing</text>
  <text x="220.0001" y="537.1429" text-anchor="middle" fill="var(--bg)" font-size="22.9805">• IoT</text>
  <text x="220.0001" y="578.5713" text-anchor="middle" fill="var(--bg)" font-size="22.9805">• 5G</text>
  <rect x="460" y="399.0476" width="360" height="220.9524" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640.0001" y="481.9046" text-anchor="middle" fill="var(--text)" font-size="29.2479">Web3</text>
  <text x="640.0001" y="537.1429" text-anchor="middle" fill="var(--text)" font-size="22.9805">• Blockchain</text>
  <text x="640.0001" y="578.5713" text-anchor="middle" fill="var(--text)" font-size="22.9805">• DeFi</text>
  <rect x="880" y="399.0476" width="360" height="220.9524" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1060" y="481.9046" text-anchor="middle" fill="var(--bg)" font-size="29.2479">Quantum</text>
  <text x="1060" y="537.1429" text-anchor="middle" fill="var(--bg)" font-size="22.9805">• Algorithms</text>
  <text x="1060" y="578.5713" text-anchor="middle" fill="var(--bg)" font-size="22.9805">• Qiskit</text>
</svg>
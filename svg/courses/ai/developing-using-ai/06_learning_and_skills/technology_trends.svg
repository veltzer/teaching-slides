<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="37.6045" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">2024-2025 Tech Trends to Learn</text>
  <rect x="40" y="122.8571" width="360" height="220.9524" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.0001" y="205.7143" text-anchor="middle" fill="var(--bg)" font-size="29.2479" font-family="Arial, sans-serif">AI/ML</text>
  <text x="220.0001" y="260.9524" text-anchor="middle" fill="var(--bg)" font-size="22.9805" font-family="Arial, sans-serif">• LLMs</text>
  <text x="220.0001" y="302.381" text-anchor="middle" fill="var(--bg)" font-size="22.9805" font-family="Arial, sans-serif">• RAG</text>
  <rect x="460" y="122.8571" width="360" height="220.9524" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="205.7143" text-anchor="middle" fill="var(--bg)" font-size="29.2479" font-family="Arial, sans-serif">Cloud Native</text>
  <text x="640.0001" y="260.9524" text-anchor="middle" fill="var(--bg)" font-size="22.9805" font-family="Arial, sans-serif">• Kubernetes</text>
  <text x="640.0001" y="302.381" text-anchor="middle" fill="var(--bg)" font-size="22.9805" font-family="Arial, sans-serif">• Serverless</text>
  <rect x="880" y="122.8571" width="360" height="220.9524" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="205.7143" text-anchor="middle" fill="var(--bg)" font-size="29.2479" font-family="Arial, sans-serif">WebAssembly</text>
  <text x="1060" y="260.9524" text-anchor="middle" fill="var(--bg)" font-size="22.9805" font-family="Arial, sans-serif">• Performance</text>
  <text x="1060" y="302.381" text-anchor="middle" fill="var(--bg)" font-size="22.9805" font-family="Arial, sans-serif">• Portability</text>
  <rect x="40" y="399.0476" width="360" height="220.9524" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.0001" y="481.9046" text-anchor="middle" fill="var(--bg)" font-size="29.2479" font-family="Arial, sans-serif">Edge Computing</text>
  <text x="220.0001" y="537.1429" text-anchor="middle" fill="var(--bg)" font-size="22.9805" font-family="Arial, sans-serif">• IoT</text>
  <text x="220.0001" y="578.5713" text-anchor="middle" fill="var(--bg)" font-size="22.9805" font-family="Arial, sans-serif">• 5G</text>
  <rect x="460" y="399.0476" width="360" height="220.9524" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="481.9046" text-anchor="middle" fill="var(--text)" font-size="29.2479" font-family="Arial, sans-serif">Web3</text>
  <text x="640.0001" y="537.1429" text-anchor="middle" fill="var(--text)" font-size="22.9805" font-family="Arial, sans-serif">• Blockchain</text>
  <text x="640.0001" y="578.5713" text-anchor="middle" fill="var(--text)" font-size="22.9805" font-family="Arial, sans-serif">• DeFi</text>
  <rect x="880" y="399.0476" width="360" height="220.9524" fill="url(#grad-info)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="481.9046" text-anchor="middle" fill="var(--bg)" font-size="29.2479" font-family="Arial, sans-serif">Quantum</text>
  <text x="1060" y="537.1429" text-anchor="middle" fill="var(--bg)" font-size="22.9805" font-family="Arial, sans-serif">• Algorithms</text>
  <text x="1060" y="578.5713" text-anchor="middle" fill="var(--bg)" font-size="22.9805" font-family="Arial, sans-serif">• Qiskit</text>
</svg>

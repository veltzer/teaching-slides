    </defs>
  <ns0:rect x="144.4797" y="91.4286" width="866.8783" height="548.5714" fill="#333333" rx="14.448" />
  <ns0:text x="577.9189" y="164.5714" text-anchor="middle" fill="white" font-size="26.0063" font-weight="bold">Comment Quality Levels</ns0:text>
  <ns0:rect x="216.7196" y="219.4286" width="722.3986" height="91.4286" fill="#E74C3C" rx="7.224" />
  <ns0:text x="231.1675" y="274.2857" fill="white" font-size="20.2272">❌ Bad: // Increment i by 1</ns0:text>
  <ns0:text x="231.1675" y="301.7143" fill="white" font-size="14.448">    i++; // Redundant, obvious from code</ns0:text>
  <ns0:rect x="216.7196" y="329.1429" width="722.3986" height="91.4286" fill="#F39C12" rx="7.224" />
  <ns0:text x="231.1675" y="384" fill="white" font-size="20.2272">⚠️ Okay: // Process user data</ns0:text>
  <ns0:text x="231.1675" y="411.4286" fill="white" font-size="14.448">    Somewhat helpful but vague</ns0:text>
  <ns0:rect x="216.7196" y="438.8571" width="722.3986" height="91.4286" fill="#27AE60" rx="7.224" />
  <ns0:text x="231.1675" y="493.7143" fill="white" font-size="20.2272">✅ Good: // Cache for 5 min to reduce API load</ns0:text>
  <ns0:text x="231.1675" y="521.1429" fill="white" font-size="14.448">    Explains why, not what</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="190" height="260" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="90" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Plan</text>
  <text x="135" y="180" text-anchor="middle" font-size="14" fill="var(--danger-text)" font-family="Arial, sans-serif">AI drafts specs</text>
  <text x="135" y="210" text-anchor="middle" font-size="14" fill="var(--danger-text)" font-family="Arial, sans-serif">from tickets</text>

  <rect x="250" y="40" width="190" height="260" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="345" y="90" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Design</text>
  <text x="345" y="180" text-anchor="middle" font-size="14" fill="var(--primary-text)" font-family="Arial, sans-serif">AI suggests</text>
  <text x="345" y="210" text-anchor="middle" font-size="14" fill="var(--primary-text)" font-family="Arial, sans-serif">architecture</text>

  <rect x="460" y="40" width="190" height="260" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="555" y="90" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Code</text>
  <text x="555" y="180" text-anchor="middle" font-size="14" fill="var(--ok-text)" font-family="Arial, sans-serif">AI writes and</text>
  <text x="555" y="210" text-anchor="middle" font-size="14" fill="var(--ok-text)" font-family="Arial, sans-serif">autocompletes</text>

  <rect x="670" y="40" width="190" height="260" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="765" y="90" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Test</text>
  <text x="765" y="180" text-anchor="middle" font-size="14" fill="var(--warn-text)" font-family="Arial, sans-serif">AI generates</text>
  <text x="765" y="210" text-anchor="middle" font-size="14" fill="var(--warn-text)" font-family="Arial, sans-serif">unit tests</text>

  <rect x="880" y="40" width="190" height="260" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="975" y="90" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Review</text>
  <text x="975" y="180" text-anchor="middle" font-size="14" fill="var(--info-text)" font-family="Arial, sans-serif">AI critiques</text>
  <text x="975" y="210" text-anchor="middle" font-size="14" fill="var(--info-text)" font-family="Arial, sans-serif">PR diffs</text>

  <rect x="1090" y="40" width="150" height="260" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1165" y="90" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Deploy</text>
  <text x="1165" y="180" text-anchor="middle" font-size="14" fill="var(--primary-text)" font-family="Arial, sans-serif">AI drafts</text>
  <text x="1165" y="210" text-anchor="middle" font-size="14" fill="var(--primary-text)" font-family="Arial, sans-serif">release notes</text>

  <line x1="40" y1="340" x2="1240" y2="340" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="330" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">feedback flows back to planning</text>

  <rect x="40" y="370" width="1200" height="250" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="415" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AI Assists Every Step</text>
  <text x="640" y="460" text-anchor="middle" font-size="15" fill="var(--text-muted)" font-family="Arial, sans-serif">The human stays in charge of intent, tradeoffs, and acceptance.</text>
  <text x="640" y="495" text-anchor="middle" font-size="15" fill="var(--text-muted)" font-family="Arial, sans-serif">AI accelerates drafts, checks, and repetitive transformations.</text>
  <text x="640" y="530" text-anchor="middle" font-size="15" fill="var(--text-muted)" font-family="Arial, sans-serif">Short iterations keep context fresh and reviews cheap.</text>
  <text x="640" y="565" text-anchor="middle" font-size="15" fill="var(--text-muted)" font-family="Arial, sans-serif">Automated tests and CI gate every AI-produced change.</text>
  <text x="640" y="600" text-anchor="middle" font-size="15" fill="var(--text-muted)" font-family="Arial, sans-serif">The cycle compresses from weeks to hours.</text>
</svg>

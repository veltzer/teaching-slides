<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="190" height="260" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="90" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--danger-text)">Plan</text>
  <text x="135" y="180" text-anchor="middle" font-size="14" fill="var(--danger-text)">AI drafts specs</text>
  <text x="135" y="210" text-anchor="middle" font-size="14" fill="var(--danger-text)">from tickets</text>

  <rect x="250" y="40" width="190" height="260" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="345" y="90" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)">Design</text>
  <text x="345" y="180" text-anchor="middle" font-size="14" fill="var(--primary-text)">AI suggests</text>
  <text x="345" y="210" text-anchor="middle" font-size="14" fill="var(--primary-text)">architecture</text>

  <rect x="460" y="40" width="190" height="260" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="555" y="90" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--ok-text)">Code</text>
  <text x="555" y="180" text-anchor="middle" font-size="14" fill="var(--ok-text)">AI writes and</text>
  <text x="555" y="210" text-anchor="middle" font-size="14" fill="var(--ok-text)">autocompletes</text>

  <rect x="670" y="40" width="190" height="260" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="765" y="90" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)">Test</text>
  <text x="765" y="180" text-anchor="middle" font-size="14" fill="var(--warn-text)">AI generates</text>
  <text x="765" y="210" text-anchor="middle" font-size="14" fill="var(--warn-text)">unit tests</text>

  <rect x="880" y="40" width="190" height="260" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="975" y="90" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--info-text)">Review</text>
  <text x="975" y="180" text-anchor="middle" font-size="14" fill="var(--info-text)">AI critiques</text>
  <text x="975" y="210" text-anchor="middle" font-size="14" fill="var(--info-text)">PR diffs</text>

  <rect x="1090" y="40" width="150" height="260" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1165" y="90" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)">Deploy</text>
  <text x="1165" y="180" text-anchor="middle" font-size="14" fill="var(--primary-text)">AI drafts</text>
  <text x="1165" y="210" text-anchor="middle" font-size="14" fill="var(--primary-text)">release notes</text>

  <line x1="40" y1="340" x2="1240" y2="340" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="330" text-anchor="middle" font-size="14" fill="var(--text-muted)">feedback flows back to planning</text>

  <rect x="40" y="370" width="1200" height="250" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="415" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">AI Assists Every Step</text>
  <text x="640" y="460" text-anchor="middle" font-size="15" fill="var(--text-muted)">The human stays in charge of intent, tradeoffs, and acceptance.</text>
  <text x="640" y="495" text-anchor="middle" font-size="15" fill="var(--text-muted)">AI accelerates drafts, checks, and repetitive transformations.</text>
  <text x="640" y="530" text-anchor="middle" font-size="15" fill="var(--text-muted)">Short iterations keep context fresh and reviews cheap.</text>
  <text x="640" y="565" text-anchor="middle" font-size="15" fill="var(--text-muted)">Automated tests and CI gate every AI-produced change.</text>
  <text x="640" y="600" text-anchor="middle" font-size="15" fill="var(--text-muted)">The cycle compresses from weeks to hours.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="235" height="580" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="157" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Reproduce</text>
  <text x="157" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Find the smallest input</text>
  <text x="157" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Write a failing test</text>
  <text x="157" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Capture exact error</text>
  <text x="157" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Note environment</text>
  <text x="157" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--danger-text)">A bug you cannot</text>
  <text x="157" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--danger-text)">reproduce cannot</text>
  <text x="157" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--danger-text)">be fixed.</text>
  <text x="157" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="var(--danger-text)">1</text>

  <line x1="280" y1="330" x2="335" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="340" y="40" width="235" height="580" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="457" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Ask the AI</text>
  <text x="457" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Paste the stack trace</text>
  <text x="457" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Share the failing test</text>
  <text x="457" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Describe what you tried</text>
  <text x="457" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Request hypotheses</text>
  <text x="457" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">Ask for a list of</text>
  <text x="457" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">possible causes, not</text>
  <text x="457" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">one confident answer.</text>
  <text x="457" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="var(--warn-text)">2</text>

  <line x1="580" y1="330" x2="635" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="640" y="40" width="235" height="580" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="757" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Verify Cause</text>
  <text x="757" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Read the suspect code</text>
  <text x="757" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Add logs and prints</text>
  <text x="757" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Step through in debugger</text>
  <text x="757" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Confirm assumptions</text>
  <text x="757" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Never accept the first</text>
  <text x="757" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">guess. Make the theory</text>
  <text x="757" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">earn the fix.</text>
  <text x="757" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="var(--info-text)">3</text>

  <line x1="880" y1="330" x2="935" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="940" y="40" width="300" height="580" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Fix and Lock In</text>
  <text x="1090" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Apply smallest fix</text>
  <text x="1090" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Rerun the failing test</text>
  <text x="1090" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Run the full suite</text>
  <text x="1090" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Add a regression test</text>
  <text x="1090" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Commit with clear note</text>
  <text x="1090" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">A green test and a</text>
  <text x="1090" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">written explanation</text>
  <text x="1090" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">close the loop.</text>
  <text x="1090" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="var(--ok-text)">4</text>
</svg>

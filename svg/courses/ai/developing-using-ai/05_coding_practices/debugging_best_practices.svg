<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="235" height="580" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="157" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Reproduce</text>
  <text x="157" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Smallest input</text>
  <text x="157" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Failing test</text>
  <text x="157" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Capture error</text>
  <text x="157" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Note environment</text>
  <text x="157" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="var(--danger-text)">1</text>

  <line x1="280" y1="330" x2="335" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="340" y="40" width="235" height="580" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="457" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Ask AI</text>
  <text x="457" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Paste stack trace</text>
  <text x="457" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Share failing test</text>
  <text x="457" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Describe attempts</text>
  <text x="457" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Ask for hypotheses</text>
  <text x="457" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="var(--warn-text)">2</text>

  <line x1="580" y1="330" x2="635" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="640" y="40" width="235" height="580" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="757" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Verify</text>
  <text x="757" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Read suspect code</text>
  <text x="757" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Add logs</text>
  <text x="757" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Step through</text>
  <text x="757" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Confirm assumptions</text>
  <text x="757" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="var(--info-text)">3</text>

  <line x1="880" y1="330" x2="935" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="940" y="40" width="300" height="580" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Fix and Lock</text>
  <text x="1090" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Smallest fix</text>
  <text x="1090" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Rerun test</text>
  <text x="1090" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Full suite</text>
  <text x="1090" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Regression test</text>
  <text x="1090" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Commit note</text>
  <text x="1090" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="var(--ok-text)">4</text>
</svg>

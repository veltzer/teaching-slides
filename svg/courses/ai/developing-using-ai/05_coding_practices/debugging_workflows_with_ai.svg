<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="90" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="100" text-anchor="middle" font-size="34" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Debugging Workflow with AI</text>

  <rect x="40" y="150" width="285" height="310" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Error</text>
  <text x="182" y="285" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">Stack trace</text>
  <text x="182" y="320" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">Test failure</text>
  <text x="182" y="380" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">Paste log</text>
  <text x="182" y="415" text-anchor="middle" font-size="18" fill="var(--danger-text)" font-family="Arial, sans-serif">to the AI</text>

  <line x1="330" y1="305" x2="350" y2="305" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="355" y="150" width="285" height="310" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Analyze</text>
  <text x="497" y="285" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">Summarize cause</text>
  <text x="497" y="320" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">Map code paths</text>
  <text x="497" y="380" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">Spot suspicious</text>
  <text x="497" y="415" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">assumptions</text>

  <line x1="645" y1="305" x2="665" y2="305" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="670" y="150" width="285" height="310" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="812" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Hypothesis</text>
  <text x="812" y="285" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">Propose fix</text>
  <text x="812" y="320" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">Cheapest first</text>
  <text x="812" y="380" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">Add asserts</text>
  <text x="812" y="415" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">or print logs</text>

  <line x1="960" y1="305" x2="980" y2="305" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="985" y="150" width="255" height="310" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Fix</text>
  <text x="1112" y="285" text-anchor="middle" font-size="18" fill="var(--ok-text)" font-family="Arial, sans-serif">Apply patch</text>
  <text x="1112" y="320" text-anchor="middle" font-size="18" fill="var(--ok-text)" font-family="Arial, sans-serif">Run tests</text>
  <text x="1112" y="380" text-anchor="middle" font-size="18" fill="var(--ok-text)" font-family="Arial, sans-serif">Verify</text>
  <text x="1112" y="415" text-anchor="middle" font-size="18" fill="var(--ok-text)" font-family="Arial, sans-serif">regression</text>

  <rect x="40" y="480" width="1200" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="535" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AI assists each step</text>
  <text x="640" y="580" text-anchor="middle" font-size="18" fill="var(--text-muted)" font-family="Arial, sans-serif">You stay the decider; the AI accelerates observation and option generation</text>
</svg>

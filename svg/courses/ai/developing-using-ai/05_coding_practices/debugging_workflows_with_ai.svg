<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="100" text-anchor="middle" font-size="34" font-weight="bold" fill="var(--primary-text)">Debugging Workflow with AI</text>

  <rect x="40" y="150" width="285" height="310" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--danger-text)">Error</text>
  <text x="182" y="285" text-anchor="middle" font-size="18" fill="var(--danger-text)">Stack trace</text>
  <text x="182" y="320" text-anchor="middle" font-size="18" fill="var(--danger-text)">Test failure</text>
  <text x="182" y="380" text-anchor="middle" font-size="18" fill="var(--danger-text)">Paste log</text>
  <text x="182" y="415" text-anchor="middle" font-size="18" fill="var(--danger-text)">to the AI</text>

  <line x1="330" y1="305" x2="350" y2="305" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="355" y="150" width="285" height="310" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--warn-text)">Analyze</text>
  <text x="497" y="285" text-anchor="middle" font-size="18" fill="var(--warn-text)">Summarize cause</text>
  <text x="497" y="320" text-anchor="middle" font-size="18" fill="var(--warn-text)">Map code paths</text>
  <text x="497" y="380" text-anchor="middle" font-size="18" fill="var(--warn-text)">Spot suspicious</text>
  <text x="497" y="415" text-anchor="middle" font-size="18" fill="var(--warn-text)">assumptions</text>

  <line x1="645" y1="305" x2="665" y2="305" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="670" y="150" width="285" height="310" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="812" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--info-text)">Hypothesis</text>
  <text x="812" y="285" text-anchor="middle" font-size="18" fill="var(--info-text)">Propose fix</text>
  <text x="812" y="320" text-anchor="middle" font-size="18" fill="var(--info-text)">Cheapest first</text>
  <text x="812" y="380" text-anchor="middle" font-size="18" fill="var(--info-text)">Add asserts</text>
  <text x="812" y="415" text-anchor="middle" font-size="18" fill="var(--info-text)">or print logs</text>

  <line x1="960" y1="305" x2="980" y2="305" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="985" y="150" width="255" height="310" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--ok-text)">Fix</text>
  <text x="1112" y="285" text-anchor="middle" font-size="18" fill="var(--ok-text)">Apply patch</text>
  <text x="1112" y="320" text-anchor="middle" font-size="18" fill="var(--ok-text)">Run tests</text>
  <text x="1112" y="380" text-anchor="middle" font-size="18" fill="var(--ok-text)">Verify</text>
  <text x="1112" y="415" text-anchor="middle" font-size="18" fill="var(--ok-text)">regression</text>

  <rect x="40" y="480" width="1200" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="535" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)">AI assists each step</text>
  <text x="640" y="580" text-anchor="middle" font-size="18" fill="var(--text-muted)">You stay the decider; the AI accelerates observation and option generation</text>
</svg>

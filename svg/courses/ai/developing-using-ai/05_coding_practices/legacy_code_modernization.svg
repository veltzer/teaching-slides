<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="300" height="158.181818181818" rx="6.396021490668" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="189.9999" y="132.272613636364" text-anchor="middle" fill="var(--text)" font-size="28.575505213859" font-family="Arial, sans-serif">jQuery</text>
  <path d="M 340 119.090909090909 L 440 119.090909090909" stroke="var(--primary-border)" stroke-width="3.4874" marker-end="url(#arrow)"/>
  <rect x="440" y="40" width="300" height="158.181818181818" fill="url(#grad-primary)" rx="6.396021490668" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="590" y="132.272613636364" text-anchor="middle" fill="var(--bg)" font-size="28.575505213859" font-family="Arial, sans-serif">React</text>
  <rect x="40" y="250.909090909091" width="300" height="158.181818181818" rx="6.396021490668" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="189.9999" y="343.181818181818" text-anchor="middle" fill="var(--text)" font-size="28.575505213859" font-family="Arial, sans-serif">Callbacks</text>
  <path d="M 340 330 L 440 330" stroke="var(--ok-border)" stroke-width="3.4874" marker-end="url(#arrow)"/>
  <rect x="440" y="250.909090909091" width="300" height="158.181818181818" fill="url(#grad-ok)" rx="6.396021490668" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="590" y="343.181818181818" text-anchor="middle" fill="var(--bg)" font-size="28.575505213859" font-family="Arial, sans-serif">Async/Await</text>
  <rect x="40" y="461.818181818182" width="300" height="158.181818181818" rx="6.396021490668" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="189.9999" y="554.090909090909" text-anchor="middle" fill="var(--text)" font-size="28.575505213859" font-family="Arial, sans-serif">var/function</text>
  <path d="M 340 540.909090909091 L 440 540.909090909091" stroke="var(--danger-border)" stroke-width="3.4874" marker-end="url(#arrow)"/>
  <rect x="440" y="461.818181818182" width="300" height="158.181818181818" fill="url(#grad-danger)" rx="6.396021490668" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="590" y="554.090909090909" text-anchor="middle" fill="var(--bg)" font-size="28.575505213859" font-family="Arial, sans-serif">const/arrow</text>
  <rect x="840" y="250.909090909091" width="400" height="158.181818181818" fill="url(#grad-info)" rx="6.396021490668" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1040" y="343.181818181818" text-anchor="middle" fill="var(--bg)" font-size="28.575505213859" font-family="Arial, sans-serif">Modern Codebase</text>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
</svg>

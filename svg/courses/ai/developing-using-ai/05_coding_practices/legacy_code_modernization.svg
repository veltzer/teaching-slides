<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="34.4651" font-weight="bold">Modernization Journey</text>
  <rect x="40" y="109.6" width="300" height="139.2" fill="var(--text-faint)" rx="6" />
  <text x="189.9999" y="190.7999" text-anchor="middle" fill="var(--bg)" font-size="26.8062">jQuery</text>
  <path d="M 340 179.2 L 440 179.2" stroke="var(--primary-border)" stroke-width="3.4874" marker-end="url(#m1)" />
  <rect x="440" y="109.6" width="300" height="139.2" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="590" y="190.7999" text-anchor="middle" fill="var(--bg)" font-size="26.8062">React</text>
  <rect x="40" y="295.2" width="300" height="139.2" fill="var(--text-faint)" rx="6" />
  <text x="189.9999" y="376.4" text-anchor="middle" fill="var(--bg)" font-size="26.8062">Callbacks</text>
  <path d="M 340 364.8 L 440 364.8" stroke="var(--ok-border)" stroke-width="3.4874" marker-end="url(#m2)" />
  <rect x="440" y="295.2" width="300" height="139.2" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="590" y="376.4" text-anchor="middle" fill="var(--bg)" font-size="26.8062">Async/Await</text>
  <rect x="40" y="480.8" width="300" height="139.2" fill="var(--text-faint)" rx="6" />
  <text x="189.9999" y="562" text-anchor="middle" fill="var(--bg)" font-size="26.8062">var/function</text>
  <path d="M 340 550.4 L 440 550.4" stroke="var(--danger-border)" stroke-width="3.4874" marker-end="url(#m3)" />
  <rect x="440" y="480.8" width="300" height="139.2" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="590" y="562" text-anchor="middle" fill="var(--bg)" font-size="26.8062">const/arrow</text>
  <rect x="840" y="295.2" width="400" height="139.2" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1040" y="376.4" text-anchor="middle" fill="var(--bg)" font-size="26.8062">Modern Codebase</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="m1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#3498DB" />
    </marker>
    <marker id="m2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#27AE60" />
    </marker>
    <marker id="m3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#E74C3C" />
    </marker>
  </defs>
</svg>
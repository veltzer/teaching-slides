<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <rect x="40" y="40" width="514.2857" height="580" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1428" y="156.0001" text-anchor="middle" fill="var(--bg)" font-size="31.7108" font-weight="bold">Code Smells</text>
  <text x="297.1428" y="243" text-anchor="middle" fill="var(--bg)" font-size="23.7831">• Long methods</text>
  <text x="297.1428" y="315.5001" text-anchor="middle" fill="var(--bg)" font-size="23.7831">• Duplicate code</text>
  <text x="297.1428" y="388" text-anchor="middle" fill="var(--bg)" font-size="23.7831">• Large classes</text>
  <text x="297.1428" y="460.5" text-anchor="middle" fill="var(--bg)" font-size="23.7831">• Complex conditionals</text>
  <text x="297.1428" y="533.0001" text-anchor="middle" fill="var(--bg)" font-size="23.7831">• Dead code</text>
  <path d="M 571.4286 330 L 708.5714 330" stroke="var(--primary-border)" stroke-width="3.6063" marker-end="url(#arrow)" />
  <text x="640" y="301" text-anchor="middle" font-size="23.7831">AI Refactors</text>
  <rect x="725.7143" y="40" width="514.2857" height="580" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.8572" y="156.0001" text-anchor="middle" fill="var(--bg)" font-size="31.7108" font-weight="bold">Clean Code</text>
  <text x="982.8572" y="243" text-anchor="middle" fill="var(--bg)" font-size="23.7831">• Small functions</text>
  <text x="982.8572" y="315.5001" text-anchor="middle" fill="var(--bg)" font-size="23.7831">• DRY principle</text>
  <text x="982.8572" y="388" text-anchor="middle" fill="var(--bg)" font-size="23.7831">• Single responsibility</text>
  <text x="982.8572" y="460.5" text-anchor="middle" fill="var(--bg)" font-size="23.7831">• Clear logic</text>
  <text x="982.8572" y="533.0001" text-anchor="middle" fill="var(--bg)" font-size="23.7831">• Minimal codebase</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
</svg>
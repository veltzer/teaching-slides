  <ns0:text x="290.9091" y="312.9545" text-anchor="middle" fill="white" font-size="17.4545">• Long methods</ns0:text>
  <ns0:text x="290.9091" y="358.9773" text-anchor="middle" fill="white" font-size="17.4545">• Duplicate code</ns0:text>
  <ns0:text x="290.9091" y="405" text-anchor="middle" fill="white" font-size="17.4545">• Large classes</ns0:text>
  <ns0:text x="290.9091" y="451.0227" text-anchor="middle" fill="white" font-size="17.4545">• Complex conditionals</ns0:text>
  <ns0:text x="290.9091" y="497.0455" text-anchor="middle" fill="white" font-size="17.4545">• Dead code</ns0:text>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect x="72.7273" y="184.0909" width="436.3636" height="368.1818" fill="#E74C3C" rx="14.5455" />
  <ns0:text x="290.9091" y="257.7273" text-anchor="middle" fill="white" font-size="23.2727" font-weight="bold">Code Smells</ns0:text>
  <ns0:text x="290.9091" y="312.9545" text-anchor="middle" fill="white" font-size="17.4545">• Long methods</ns0:text>
  <ns0:text x="290.9091" y="358.9773" text-anchor="middle" fill="white" font-size="17.4545">• Duplicate code</ns0:text>
  <ns0:text x="290.9091" y="405" text-anchor="middle" fill="white" font-size="17.4545">• Large classes</ns0:text>
  <ns0:text x="290.9091" y="451.0227" text-anchor="middle" fill="white" font-size="17.4545">• Complex conditionals</ns0:text>
  <ns0:text x="290.9091" y="497.0455" text-anchor="middle" fill="white" font-size="17.4545">• Dead code</ns0:text>
  <ns0:path d="M 523.6364 368.1818 L 640 368.1818" stroke="#3498DB" stroke-width="4.3636" marker-end="url(#arrow)" />
  <ns0:text x="581.8182" y="349.7727" text-anchor="middle" font-size="17.4545">AI Refactors</ns0:text>
  <ns0:rect x="654.5455" y="184.0909" width="436.3636" height="368.1818" fill="#27AE60" rx="14.5455" />
  <ns0:text x="872.7273" y="257.7273" text-anchor="middle" fill="white" font-size="23.2727" font-weight="bold">Clean Code</ns0:text>
  <ns0:text x="872.7273" y="312.9545" text-anchor="middle" fill="white" font-size="17.4545">• Small functions</ns0:text>
  <ns0:text x="872.7273" y="358.9773" text-anchor="middle" fill="white" font-size="17.4545">• DRY principle</ns0:text>
  <ns0:text x="872.7273" y="405" text-anchor="middle" fill="white" font-size="17.4545">• Single responsibility</ns0:text>
  <ns0:text x="872.7273" y="451.0227" text-anchor="middle" fill="white" font-size="17.4545">• Clear logic</ns0:text>
  <ns0:text x="872.7273" y="497.0455" text-anchor="middle" fill="white" font-size="17.4545">• Minimal codebase</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">

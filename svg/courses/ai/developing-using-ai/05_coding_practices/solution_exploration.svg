<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="29.6263" font-weight="bold">Solution Options</text>
  <rect x="40" y="100" width="342.8571" height="240" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4286" y="160" text-anchor="middle" fill="var(--bg)" font-size="23.0426" font-weight="bold">Quick Fix</text>
  <text x="211.4286" y="200" text-anchor="middle" fill="var(--bg)" font-size="19.7508">• Restart service</text>
  <text x="211.4286" y="240" text-anchor="middle" fill="var(--bg)" font-size="19.7508">• Clear cache</text>
  <text x="211.4286" y="279.9999" text-anchor="middle" fill="var(--bg)" font-size="19.7508">• Increase timeout</text>
  <rect x="468.5715" y="100" width="342.8571" height="240" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="160" text-anchor="middle" fill="var(--bg)" font-size="23.0426" font-weight="bold">Proper Fix</text>
  <text x="640.0001" y="200" text-anchor="middle" fill="var(--bg)" font-size="19.7508">• Fix root cause</text>
  <text x="640.0001" y="240" text-anchor="middle" fill="var(--bg)" font-size="19.7508">• Add error handling</text>
  <text x="640.0001" y="279.9999" text-anchor="middle" fill="var(--bg)" font-size="19.7508">• Write tests</text>
  <rect x="897.1429" y="100" width="342.8571" height="240" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.5714" y="160" text-anchor="middle" fill="var(--bg)" font-size="23.0426" font-weight="bold">Long-term</text>
  <text x="1068.5714" y="200" text-anchor="middle" fill="var(--bg)" font-size="19.7508">• Refactor module</text>
  <text x="1068.5714" y="240" text-anchor="middle" fill="var(--bg)" font-size="19.7508">• Add monitoring</text>
  <text x="1068.5714" y="279.9999" text-anchor="middle" fill="var(--bg)" font-size="19.7508">• Document fix</text>
  <rect x="254.2857" y="380" width="771.4285" height="240" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="439.9999" text-anchor="middle" fill="var(--bg)" font-size="23.0426" font-weight="bold">Prevention Strategy</text>
  <text x="640.0001" y="490" text-anchor="middle" fill="var(--bg)" font-size="19.7508">• Add regression tests</text>
  <text x="640.0001" y="530" text-anchor="middle" fill="var(--bg)" font-size="19.7508">• Implement CI/CD checks</text>
  <text x="640.0001" y="570" text-anchor="middle" fill="var(--bg)" font-size="19.7508">• Set up monitoring alerts</text>
</svg>
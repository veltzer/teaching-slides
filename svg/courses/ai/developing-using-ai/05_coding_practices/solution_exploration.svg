<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="612.9443" y="77.5758" text-anchor="middle" font-size="27.5825" font-weight="bold">Solution Options</text>
  <rect x="76.618" y="135.7576" width="306.4721" height="232.7273" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="229.8541" y="193.9394" text-anchor="middle" fill="var(--bg)" font-size="21.453" font-weight="bold">Quick Fix</text>
  <text x="229.8541" y="232.7273" text-anchor="middle" fill="var(--bg)" font-size="18.3883">• Restart service</text>
  <text x="229.8541" y="271.5152" text-anchor="middle" fill="var(--bg)" font-size="18.3883">• Clear cache</text>
  <text x="229.8541" y="310.303" text-anchor="middle" fill="var(--bg)" font-size="18.3883">• Increase timeout</text>
  <rect x="459.7082" y="135.7576" width="306.4721" height="232.7273" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="612.9443" y="193.9394" text-anchor="middle" fill="var(--bg)" font-size="21.453" font-weight="bold">Proper Fix</text>
  <text x="612.9443" y="232.7273" text-anchor="middle" fill="var(--bg)" font-size="18.3883">• Fix root cause</text>
  <text x="612.9443" y="271.5152" text-anchor="middle" fill="var(--bg)" font-size="18.3883">• Add error handling</text>
  <text x="612.9443" y="310.303" text-anchor="middle" fill="var(--bg)" font-size="18.3883">• Write tests</text>
  <rect x="842.7984" y="135.7576" width="306.4721" height="232.7273" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="996.0344" y="193.9394" text-anchor="middle" fill="var(--bg)" font-size="21.453" font-weight="bold">Long-term</text>
  <text x="996.0344" y="232.7273" text-anchor="middle" fill="var(--bg)" font-size="18.3883">• Refactor module</text>
  <text x="996.0344" y="271.5152" text-anchor="middle" fill="var(--bg)" font-size="18.3883">• Add monitoring</text>
  <text x="996.0344" y="310.303" text-anchor="middle" fill="var(--bg)" font-size="18.3883">• Document fix</text>
  <rect x="268.1631" y="407.2727" width="689.5623" height="232.7273" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="612.9443" y="465.4545" text-anchor="middle" fill="var(--bg)" font-size="21.453" font-weight="bold">Prevention Strategy</text>
  <text x="612.9443" y="513.9394" text-anchor="middle" fill="var(--bg)" font-size="18.3883">• Add regression tests</text>
  <text x="612.9443" y="552.7273" text-anchor="middle" fill="var(--bg)" font-size="18.3883">• Implement CI/CD checks</text>
  <text x="612.9443" y="591.5152" text-anchor="middle" fill="var(--bg)" font-size="18.3883">• Set up monitoring alerts</text>
</svg>
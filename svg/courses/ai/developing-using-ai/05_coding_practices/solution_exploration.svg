  <ns0:text x="612.9443" y="77.5758" text-anchor="middle" font-size="27.5825" font-weight="bold">Solution Options</ns0:text>
  <ns0:rect x="76.618" y="135.7576" width="306.4721" height="232.7273" fill="#3498DB" rx="15.3236" />
  <ns0:text x="229.8541" y="193.9394" text-anchor="middle" fill="white" font-size="21.453" font-weight="bold">Quick Fix</ns0:text>
  <ns0:text x="229.8541" y="232.7273" text-anchor="middle" fill="white" font-size="18.3883">• Restart service</ns0:text>
  <ns0:text x="229.8541" y="271.5152" text-anchor="middle" fill="white" font-size="18.3883">• Clear cache</ns0:text>
  <ns0:text x="229.8541" y="310.303" text-anchor="middle" fill="white" font-size="18.3883">• Increase timeout</ns0:text>
  <ns0:rect x="459.7082" y="135.7576" width="306.4721" height="232.7273" fill="#27AE60" rx="15.3236" />
  <ns0:text x="612.9443" y="193.9394" text-anchor="middle" fill="white" font-size="21.453" font-weight="bold">Proper Fix</ns0:text>
  <ns0:text x="612.9443" y="232.7273" text-anchor="middle" fill="white" font-size="18.3883">• Fix root cause</ns0:text>
  <ns0:text x="612.9443" y="271.5152" text-anchor="middle" fill="white" font-size="18.3883">• Add error handling</ns0:text>
  <ns0:text x="612.9443" y="310.303" text-anchor="middle" fill="white" font-size="18.3883">• Write tests</ns0:text>
  <ns0:rect x="842.7984" y="135.7576" width="306.4721" height="232.7273" fill="#9B59B6" rx="15.3236" />
  <ns0:text x="996.0344" y="193.9394" text-anchor="middle" fill="white" font-size="21.453" font-weight="bold">Long-term</ns0:text>
  <ns0:text x="996.0344" y="232.7273" text-anchor="middle" fill="white" font-size="18.3883">• Refactor module</ns0:text>
  <ns0:text x="996.0344" y="271.5152" text-anchor="middle" fill="white" font-size="18.3883">• Add monitoring</ns0:text>
  <ns0:text x="996.0344" y="310.303" text-anchor="middle" fill="white" font-size="18.3883">• Document fix</ns0:text>
  <ns0:rect x="268.1631" y="407.2727" width="689.5623" height="232.7273" fill="#E74C3C" rx="15.3236" />
  <ns0:text x="612.9443" y="465.4545" text-anchor="middle" fill="white" font-size="21.453" font-weight="bold">Prevention Strategy</ns0:text>
  <ns0:text x="612.9443" y="513.9394" text-anchor="middle" fill="white" font-size="18.3883">• Add regression tests</ns0:text>
  <ns0:text x="612.9443" y="552.7273" text-anchor="middle" fill="white" font-size="18.3883">• Implement CI/CD checks</ns0:text>
  <ns0:text x="612.9443" y="591.5152" text-anchor="middle" fill="white" font-size="18.3883">• Set up monitoring alerts</ns0:text>

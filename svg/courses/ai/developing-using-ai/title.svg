<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1020"/>
      <stop offset="100%" style="stop-color:#1a1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Code editor window -->
  <rect x="180" y="50" width="240" height="180" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
  <circle cx="200" cy="68" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="218" cy="68" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="236" cy="68" r="5" fill="#22c55e" opacity="0.8"/>
  <!-- Code lines in editor -->
  <rect x="198" y="88" width="70" height="5" rx="2" fill="#3b82f6" opacity="0.6"/>
  <rect x="198" y="102" width="110" height="5" rx="2" fill="#8b5cf6" opacity="0.4"/>
  <rect x="210" y="116" width="90" height="5" rx="2" fill="#a78bfa" opacity="0.3"/>
  <rect x="210" y="130" width="60" height="5" rx="2" fill="#3b82f6" opacity="0.5"/>
  <rect x="198" y="144" width="100" height="5" rx="2" fill="#8b5cf6" opacity="0.4"/>
  <rect x="198" y="158" width="80" height="5" rx="2" fill="#a78bfa" opacity="0.3"/>
  <rect x="198" y="172" width="120" height="5" rx="2" fill="#3b82f6" opacity="0.4"/>
  <!-- AI brain -->
  <ellipse cx="550" cy="140" rx="80" ry="70" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
  <!-- Nodes inside brain -->
  <circle cx="530" cy="120" r="6" fill="#a78bfa" opacity="0.8"/>
  <circle cx="570" cy="120" r="6" fill="#a78bfa" opacity="0.8"/>
  <circle cx="550" cy="100" r="6" fill="#3b82f6" opacity="0.8"/>
  <circle cx="535" cy="155" r="5" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="565" cy="155" r="5" fill="#c4b5fd" opacity="0.7"/>
  <!-- Neural connections -->
  <line x1="530" y1="120" x2="550" y2="100" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
  <line x1="570" y1="120" x2="550" y2="100" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
  <line x1="530" y1="120" x2="535" y2="155" stroke="#c4b5fd" stroke-width="0.8" opacity="0.4"/>
  <line x1="570" y1="120" x2="565" y2="155" stroke="#c4b5fd" stroke-width="0.8" opacity="0.4"/>
  <!-- Bidirectional arrow between editor and AI -->
  <line x1="430" y1="140" x2="470" y2="140" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  <polygon points="470,134 482,140 470,146" fill="#3b82f6" opacity="0.6"/>
  <polygon points="430,134 418,140 430,146" fill="#8b5cf6" opacity="0.6"/>
  <!-- Output terminal -->
  <rect x="300" y="270" width="200" height="80" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.7"/>
  <text x="315" y="295" font-family="monospace" font-size="12" fill="#22c55e" opacity="0.7">$ ai generate</text>
  <rect x="315" y="305" width="100" height="4" rx="2" fill="#3b82f6" opacity="0.4"/>
  <rect x="315" y="315" width="140" height="4" rx="2" fill="#8b5cf6" opacity="0.3"/>
  <rect x="315" y="325" width="80" height="4" rx="2" fill="#a78bfa" opacity="0.3"/>
  <!-- Decorative dots -->
  <circle cx="80" cy="60" r="2" fill="#3b82f6" opacity="0.3"/>
  <circle cx="720" cy="80" r="3" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="100" cy="350" r="2" fill="#a78bfa" opacity="0.3"/>
  <circle cx="700" cy="360" r="2" fill="#3b82f6" opacity="0.3"/>
  <!-- Bottom accent -->
  <rect x="250" y="375" width="300" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#1a1a2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#4285f4" />
      <stop offset="100%" style="stop-color:#9b59b6" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <rect x="256" y="80" width="341.3333" height="288" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1333" opacity="0.9" />
  <circle cx="284.4444" cy="108.8" r="7.1111" fill="var(--danger-fill)" opacity="0.8" />
  <circle cx="310.0444" cy="108.8" r="7.1111" fill="var(--warn-fill)" opacity="0.8" />
  <circle cx="335.6444" cy="108.8" r="7.1111" fill="var(--ok-fill)" opacity="0.8" />
  <rect x="281.6" y="140.8" width="99.5556" height="8" rx="6" fill="var(--primary-fill)" opacity="0.6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="281.6" y="163.2" width="156.4444" height="8" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="298.6667" y="185.6" width="128" height="8" rx="6" fill="var(--info-fill)" opacity="0.3" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="298.6667" y="208" width="85.3333" height="8" rx="6" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="281.6" y="230.4" width="142.2222" height="8" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="281.6" y="252.8" width="113.7778" height="8" rx="6" fill="var(--info-fill)" opacity="0.3" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="281.6" y="275.2" width="170.6667" height="8" rx="6" fill="var(--primary-fill)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2"/>
  <ellipse cx="782.2222" cy="224" rx="113.7778" ry="99.5556" fill="none" stroke="var(--info-border)" stroke-width="2.8444" opacity="0.7" />
  <circle cx="753.7778" cy="192" r="8.5333" fill="var(--info-fill)" opacity="0.8" />
  <circle cx="810.6667" cy="192" r="8.5333" fill="var(--info-fill)" opacity="0.8" />
  <circle cx="782.2222" cy="160" r="8.5333" fill="var(--primary-fill)" opacity="0.8" />
  <circle cx="760.8889" cy="248" r="7.1111" fill="var(--info-fill)" opacity="0.7" />
  <circle cx="803.5556" cy="248" r="7.1111" fill="var(--info-fill)" opacity="0.7" />
  <line x1="753.7778" y1="192" x2="782.2222" y2="160" stroke="var(--info-border)" stroke-width="1.4222" opacity="0.5" />
  <line x1="810.6667" y1="192" x2="782.2222" y2="160" stroke="var(--info-border)" stroke-width="1.4222" opacity="0.5" />
  <line x1="753.7778" y1="192" x2="760.8889" y2="248" stroke="var(--info-border)" stroke-width="1.1378" opacity="0.4" />
  <line x1="810.6667" y1="192" x2="803.5556" y2="248" stroke="var(--info-border)" stroke-width="1.1378" opacity="0.4" />
  <line x1="611.5556" y1="224" x2="668.4444" y2="224" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <polygon points="668.4444,214.4 685.5111,224 668.4444,233.6" fill="var(--primary-fill)" opacity="0.6" />
  <polygon points="611.5556,214.4 594.4889,224 611.5556,233.6" fill="var(--info-fill)" opacity="0.6" />
  <rect x="426.6667" y="432" width="284.4444" height="128" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.4222" opacity="0.7" />
  <text x="448" y="472" font-family="monospace" font-size="17.0667" fill="var(--ok-accent)" opacity="0.7">$ ai generate</text>
  <rect x="448" y="488" width="142.2222" height="6.4" rx="6" fill="var(--primary-fill)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="448" y="504" width="199.1111" height="6.4" rx="6" fill="var(--info-fill)" opacity="0.3" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="448" y="520" width="113.7778" height="6.4" rx="6" fill="var(--info-fill)" opacity="0.3" stroke="var(--info-border)" stroke-width="2"/>
  <circle cx="113.7778" cy="96" r="2.8444" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="1024" cy="128" r="4.2667" fill="var(--info-fill)" opacity="0.3" />
  <circle cx="142.2222" cy="560" r="2.8444" fill="var(--info-fill)" opacity="0.3" />
  <circle cx="995.5556" cy="576" r="2.8444" fill="var(--primary-fill)" opacity="0.3" />
  <rect x="355.5556" y="600" width="426.6667" height="4.8" rx="6" fill="url(#accent)" opacity="0.6" />
</svg>
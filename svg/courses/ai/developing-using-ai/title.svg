<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="310" y="112.5" width="360" height="261" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1333" opacity="0.9"/>
  <circle cx="339.9999" cy="138.6" r="6.9522" fill="var(--danger-fill)" opacity="0.8"/>
  <circle cx="366.9999" cy="138.6" r="6.9522" fill="var(--warn-fill)" opacity="0.8"/>
  <circle cx="393.9999" cy="138.6" r="6.9522" fill="var(--ok-fill)" opacity="0.8"/>
  <rect x="337" y="167.6" width="105" height="7.25" rx="6" fill="url(#grad-primary)" opacity="0.6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="337" y="187.9" width="164.9999" height="7.25" rx="6" fill="url(#grad-info)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="355" y="208.2" width="135" height="7.25" rx="6" fill="url(#grad-info)" opacity="0.3" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="355" y="228.5" width="90" height="7.25" rx="6" fill="url(#grad-primary)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="337" y="248.8" width="150" height="7.25" rx="6" fill="url(#grad-info)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="337" y="269.1" width="120" height="7.25" rx="6" fill="url(#grad-info)" opacity="0.3" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="337" y="289.4" width="180" height="7.25" rx="6" fill="url(#grad-primary)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="865" cy="243" rx="120" ry="90.2223" fill="none" stroke="var(--info-border)" stroke-width="2.8444" opacity="0.7"/>
  <circle cx="835" cy="214" r="8.3426" fill="var(--info-fill)" opacity="0.8"/>
  <circle cx="895" cy="214" r="8.3426" fill="var(--info-fill)" opacity="0.8"/>
  <circle cx="865" cy="185" r="8.3426" fill="var(--primary-fill)" opacity="0.8"/>
  <circle cx="842.5" cy="264.75" r="6.9522" fill="var(--info-fill)" opacity="0.7"/>
  <circle cx="887.5" cy="264.75" r="6.9522" fill="var(--info-fill)" opacity="0.7"/>
  <line x1="835" y1="214" x2="865" y2="185" stroke="var(--info-border)" stroke-width="1.4222" opacity="0.5"/>
  <line x1="895" y1="214" x2="865" y2="185" stroke="var(--info-border)" stroke-width="1.4222" opacity="0.5"/>
  <line x1="835" y1="214" x2="842.5" y2="264.75" stroke="var(--info-border)" stroke-width="1.1378" opacity="0.4"/>
  <line x1="895" y1="214" x2="887.5" y2="264.75" stroke="var(--info-border)" stroke-width="1.1378" opacity="0.4"/>
  <line x1="685" y1="243" x2="744.9999" y2="243" stroke="var(--primary-border)" stroke-width="2" opacity="0.6"/>
  <polygon points="744.9999,234.3 763,243 744.9999,251.7" fill="var(--primary-fill)" opacity="0.6"/>
  <polygon points="685,234.3 667,243 685,251.7" fill="var(--info-fill)" opacity="0.6"/>
  <rect x="490" y="431.5" width="299.9999" height="116" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.4222" opacity="0.7"/>
  <text x="512.5" y="467.75" font-size="16.6854" fill="var(--ok-accent)" opacity="0.7" font-family="Courier New, monospace">$ ai generate</text>
  <rect x="512.5" y="482.25" width="150" height="5.8" rx="6" fill="url(#grad-primary)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="512.5" y="496.75" width="210" height="5.8" rx="6" fill="url(#grad-info)" opacity="0.3" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="512.5" y="511.25" width="120" height="5.8" rx="6" fill="url(#grad-info)" opacity="0.3" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="160" cy="127" r="2.7808" fill="var(--primary-fill)" opacity="0.3"/>
  <circle cx="1120" cy="156" r="4.1714" fill="var(--info-fill)" opacity="0.3"/>
  <circle cx="190" cy="547.5" r="2.7808" fill="var(--info-fill)" opacity="0.3"/>
  <circle cx="1090" cy="562" r="2.7808" fill="var(--primary-fill)" opacity="0.3"/>
  <rect x="415" y="583.75" width="450" height="4.35" rx="6" fill="url(#accent)" opacity="0.6"/>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Developing Using Ai</text>
</svg>

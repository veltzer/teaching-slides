<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="295" height="280" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Be Specific</text>
  <text x="187" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">State the task</text>
  <text x="187" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Name files</text>
  <text x="187" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Inputs + outputs</text>
  <text x="187" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Edge cases</text>

  <rect x="345" y="40" width="295" height="280" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Give Context</text>
  <text x="492" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Paste relevant code</text>
  <text x="492" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Show errors</text>
  <text x="492" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Style notes</text>
  <text x="492" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Name the language</text>

  <rect x="650" y="40" width="295" height="280" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="797" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Set Constraints</text>
  <text x="797" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Libraries to use</text>
  <text x="797" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">What to avoid</text>
  <text x="797" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Target runtime</text>
  <text x="797" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Perf budget</text>

  <rect x="955" y="40" width="285" height="280" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Show Examples</text>
  <text x="1097" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Input/output pairs</text>
  <text x="1097" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Expected format</text>
  <text x="1097" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Similar function</text>
  <text x="1097" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">What to avoid</text>

  <rect x="40" y="340" width="295" height="280" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Iterate</text>
  <text x="187" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Start small</text>
  <text x="187" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">One change</text>
  <text x="187" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Rewrite</text>
  <text x="187" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Keep the best</text>

  <rect x="345" y="340" width="895" height="280" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="792" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Prompt Structure</text>
  <text x="792" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Role, Task, Context, Constraints, Format</text>
  <text x="792" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Front-load the goal</text>
  <text x="792" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Ask for a plan first</text>
  <text x="792" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Request runnable output</text>
  <text x="792" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--text-faint)">Like a ticket for a new teammate</text>
</svg>

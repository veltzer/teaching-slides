<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="295" height="280" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Be Specific</text>
  <text x="187" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">State the task clearly</text>
  <text x="187" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Name files and symbols</text>
  <text x="187" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Give inputs and outputs</text>
  <text x="187" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">List the edge cases</text>
  <text x="187" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">Vague prompts produce</text>
  <text x="187" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">vague code.</text>

  <rect x="345" y="40" width="295" height="280" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Give Context</text>
  <text x="492" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Paste the right snippet</text>
  <text x="492" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Show the error trace</text>
  <text x="492" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Link style and conventions</text>
  <text x="492" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Mention the language</text>
  <text x="492" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">The model cannot guess</text>
  <text x="492" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">your codebase.</text>

  <rect x="650" y="40" width="295" height="280" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="797" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Set Constraints</text>
  <text x="797" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Which libraries to use</text>
  <text x="797" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Which to avoid</text>
  <text x="797" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Target runtime version</text>
  <text x="797" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Performance budget</text>
  <text x="797" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">Constraints shrink the</text>
  <text x="797" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">space of wrong answers.</text>

  <rect x="955" y="40" width="285" height="280" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Show Examples</text>
  <text x="1097" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Input plus output pairs</text>
  <text x="1097" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Expected format</text>
  <text x="1097" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">A similar function nearby</text>
  <text x="1097" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">A bad example to avoid</text>
  <text x="1097" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Examples beat long</text>
  <text x="1097" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">paragraphs of prose.</text>

  <rect x="40" y="340" width="295" height="280" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Iterate</text>
  <text x="187" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Start small and extend</text>
  <text x="187" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Ask for one change</text>
  <text x="187" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Rewrite, do not argue</text>
  <text x="187" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Keep the best output</text>
  <text x="187" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--danger-text)">Each turn should teach</text>
  <text x="187" y="598" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--danger-text)">the model something new.</text>

  <rect x="345" y="340" width="895" height="280" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="792" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Structure Every Prompt</text>
  <text x="792" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Role. Task. Context. Constraints. Format. Example. Verification step.</text>
  <text x="792" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Front-load the goal. Push reference material to the end.</text>
  <text x="792" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Ask for a plan before code when the change is risky.</text>
  <text x="792" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Request runnable output and a way to test it locally.</text>
  <text x="792" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--text-faint)">A good prompt reads like a focused ticket for a new teammate.</text>
</svg>

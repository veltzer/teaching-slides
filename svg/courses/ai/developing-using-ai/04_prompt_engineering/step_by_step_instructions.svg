<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="80" y="178.125" width="160" height="101.25" fill="var(--primary-fill)" rx="9.75" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="159.9999" y="238.8749" text-anchor="middle" fill="var(--bg)" font-size="19.2">Step 1</text>
  <path d="M 240 228.7499 L 320 228.7499" stroke="var(--text-muted)" stroke-width="1.9692" marker-end="url(#step1)" />
  <rect x="320" y="178.125" width="160" height="101.25" fill="var(--ok-fill)" rx="9.75" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="399.9999" y="238.8749" text-anchor="middle" fill="var(--bg)" font-size="19.2">Step 2</text>
  <path d="M 480 228.7499 L 560 228.7499" stroke="var(--text-muted)" stroke-width="1.9692" marker-end="url(#step2)" />
  <rect x="560" y="178.125" width="160" height="101.25" fill="var(--danger-fill)" rx="9.75" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640.0001" y="238.8749" text-anchor="middle" fill="var(--bg)" font-size="19.2">Step 3</text>
  <path d="M 720 228.7499 L 800 228.7499" stroke="var(--text-muted)" stroke-width="1.9692" marker-end="url(#step3)" />
  <rect x="800" y="178.125" width="160" height="101.25" fill="var(--warn-fill)" rx="9.75" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="880.0001" y="238.8749" text-anchor="middle" fill="var(--bg)" font-size="19.2">Step 4</text>
  <path d="M 960 228.7499 L 1040 228.7499" stroke="var(--text-muted)" stroke-width="1.9692" marker-end="url(#step4)" />
  <rect x="1040" y="178.125" width="160" height="101.25" fill="var(--info-fill)" rx="9.75" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1120.0001" y="238.8749" text-anchor="middle" fill="var(--bg)" font-size="19.2">Result</text>
  <text x="159.9999" y="340.125" font-size="19.2">Parse Input</text>
  <text x="399.9999" y="340.125" font-size="19.2">Validate</text>
  <text x="640.0001" y="340.125" font-size="19.2">Process</text>
  <text x="880.0001" y="340.125" font-size="19.2">Format</text>
  <text x="1120.0001" y="340.125" font-size="19.2">Output</text>
  <text x="640.0001" y="481.875" text-anchor="middle" font-size="25.5999" font-weight="bold">Break Complex Tasks into Steps</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="step1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#555555" />
    </marker>
    <marker id="step2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#555555" />
    </marker>
    <marker id="step3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#555555" />
    </marker>
    <marker id="step4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#555555" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="40" y="40" width="500.0001" height="580" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="289.9998" y="185" text-anchor="middle" fill="var(--bg)" font-size="34.2517" font-weight="bold">Poor Prompt</text>
  <text x="289.9998" y="271.9999" text-anchor="middle" fill="var(--bg)" font-size="25.6887">"Write code"</text>
  <text x="289.9998" y="359" text-anchor="middle" fill="var(--bg)" font-size="25.6887">❌ Vague results</text>
  <text x="289.9998" y="417" text-anchor="middle" fill="var(--bg)" font-size="25.6887">❌ Multiple iterations</text>
  <text x="289.9998" y="474.9998" text-anchor="middle" fill="var(--bg)" font-size="25.6887">❌ Wasted time</text>
  <rect x="739.9999" y="40" width="500.0001" height="580" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="989.9998" y="185" text-anchor="middle" fill="var(--bg)" font-size="34.2517" font-weight="bold">Great Prompt</text>
  <text x="989.9998" y="271.9999" text-anchor="middle" fill="var(--bg)" font-size="25.6887">"Specific + Context"</text>
  <text x="989.9998" y="359" text-anchor="middle" fill="var(--bg)" font-size="25.6887">✓ Precise output</text>
  <text x="989.9998" y="417" text-anchor="middle" fill="var(--bg)" font-size="25.6887">✓ First try success</text>
  <text x="989.9998" y="474.9998" text-anchor="middle" fill="var(--bg)" font-size="25.6887">✓ Time saved</text>
  <path d="M 540.0001 329.9998 L 739.9999 329.9998" stroke="var(--primary-border)" stroke-width="3.2498" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="514.2857" height="116.000066000003" fill="url(#grad-danger)" rx="6.292853251767" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1429" y="107.666613499997" text-anchor="middle" fill="var(--bg)" font-size="22.655320515237" font-family="Arial, sans-serif">❌ Ambiguous Requirements</text>
  <rect x="725.7143" y="40" width="514.2857" height="116.000066000003" fill="url(#grad-danger)" rx="6.292853251767" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.8571" y="107.666613499997" text-anchor="middle" fill="var(--bg)" font-size="22.655320515237" font-family="Arial, sans-serif">❌ Missing Context</text>
  <rect x="40" y="194.666718000003" width="514.2857" height="116.000066000003" fill="url(#grad-danger)" rx="6.292853251767" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1429" y="262.3333315" text-anchor="middle" fill="var(--bg)" font-size="22.655320515237" font-family="Arial, sans-serif">❌ No Success Criteria</text>
  <rect x="725.7143" y="194.666718000003" width="514.2857" height="116.000066000003" fill="url(#grad-danger)" rx="6.292853251767" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.8571" y="262.3333315" text-anchor="middle" fill="var(--bg)" font-size="22.655320515237" font-family="Arial, sans-serif">❌ Conflicting Instructions</text>
  <rect x="40" y="349.333326" width="514.2857" height="116.000066000003" fill="url(#grad-danger)" rx="6.292853251767" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1429" y="417.000049500003" text-anchor="middle" fill="var(--bg)" font-size="22.655320515237" font-family="Arial, sans-serif">❌ No Example Output</text>
  <rect x="725.7143" y="349.333326" width="514.2857" height="116.000066000003" fill="url(#grad-danger)" rx="6.292853251767" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.8571" y="417.000049500003" text-anchor="middle" fill="var(--bg)" font-size="22.655320515237" font-family="Arial, sans-serif">❌ Wrong Level of Detail</text>
  <rect x="382.8571" y="503.999933999997" width="514.2857" height="116.000066000003" fill="url(#grad-danger)" rx="6.292853251767" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="571.6666575" text-anchor="middle" fill="var(--bg)" font-size="22.655320515237" font-family="Arial, sans-serif">❌ Assuming AI Knowledge</text>
</svg>

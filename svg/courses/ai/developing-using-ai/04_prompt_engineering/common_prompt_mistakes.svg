    </defs>
  <ns0:text x="546.68" y="69.1892" text-anchor="middle" font-size="27.334" font-weight="bold">Avoid These Pitfalls</ns0:text>
  <ns0:rect x="68.335" y="121.0811" width="410.01" height="103.7838" fill="#E74C3C" rx="6.8335" />
  <ns0:text x="273.34" y="181.6216" text-anchor="middle" fill="white" font-size="19.1338">❌ Ambiguous Requirements</ns0:text>
  <ns0:rect x="615.015" y="121.0811" width="410.01" height="103.7838" fill="#E74C3C" rx="6.8335" />
  <ns0:text x="820.02" y="181.6216" text-anchor="middle" fill="white" font-size="19.1338">❌ Missing Context</ns0:text>
  <ns0:rect x="68.335" y="259.4595" width="410.01" height="103.7838" fill="#E74C3C" rx="6.8335" />
  <ns0:text x="273.34" y="320" text-anchor="middle" fill="white" font-size="19.1338">❌ No Success Criteria</ns0:text>
  <ns0:rect x="615.015" y="259.4595" width="410.01" height="103.7838" fill="#E74C3C" rx="6.8335" />
  <ns0:text x="820.02" y="320" text-anchor="middle" fill="white" font-size="19.1338">❌ Conflicting Instructions</ns0:text>
  <ns0:rect x="68.335" y="397.8378" width="410.01" height="103.7838" fill="#E74C3C" rx="6.8335" />
  <ns0:text x="273.34" y="458.3784" text-anchor="middle" fill="white" font-size="19.1338">❌ No Example Output</ns0:text>
  <ns0:rect x="615.015" y="397.8378" width="410.01" height="103.7838" fill="#E74C3C" rx="6.8335" />
  <ns0:text x="820.02" y="458.3784" text-anchor="middle" fill="white" font-size="19.1338">❌ Wrong Level of Detail</ns0:text>
  <ns0:rect x="341.675" y="536.2162" width="410.01" height="103.7838" fill="#E74C3C" rx="6.8335" />
  <ns0:text x="546.68" y="596.7568" text-anchor="middle" fill="white" font-size="19.1338">❌ Assuming AI Knowledge</ns0:text>
</ns0:svg>
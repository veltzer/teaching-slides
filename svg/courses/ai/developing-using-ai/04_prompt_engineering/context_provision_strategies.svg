<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="290" height="580" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">Business</text>
  <text x="185" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">Context</text>
  <text x="185" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Why this matters</text>
  <text x="185" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Who the users are</text>
  <text x="185" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Success criteria</text>
  <text x="185" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Domain vocabulary</text>
  <text x="185" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Goal: alignment</text>
  <text x="185" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">broadest</text>

  <rect x="340" y="40" width="290" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Technical</text>
  <text x="485" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Stack</text>
  <text x="485" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Languages, frameworks</text>
  <text x="485" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Versions, runtime</text>
  <text x="485" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Project structure</text>
  <text x="485" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Coding conventions</text>
  <text x="485" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Goal: compatibility</text>
  <text x="485" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">narrower</text>

  <rect x="640" y="40" width="290" height="580" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">Constraints</text>
  <text x="785" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Performance budgets</text>
  <text x="785" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Memory / CPU limits</text>
  <text x="785" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Security requirements</text>
  <text x="785" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Backward compatibility</text>
  <text x="785" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Goal: rule out options</text>
  <text x="785" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">tighter</text>

  <rect x="940" y="40" width="300" height="580" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger-text)">Task</text>
  <text x="1090" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Exact file to change</text>
  <text x="1090" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Function signature</text>
  <text x="1090" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Expected I/O shape</text>
  <text x="1090" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Acceptance tests</text>
  <text x="1090" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Goal: exact action</text>
  <text x="1090" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">sharpest</text>

  <line x1="330" y1="500" x2="340" y2="500" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="500" x2="640" y2="500" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="500" x2="940" y2="500" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect x="142.2222" y="90" width="355.5556" height="144" fill="#E74C3C" rx="14.2222" />
  <ns0:text x="320" y="171" text-anchor="middle" fill="white" font-size="22.7556">Legacy Code</ns0:text>
  <ns0:rect x="640" y="90" width="355.5556" height="144" fill="#27AE60" rx="14.2222" />
  <ns0:text x="817.7778" y="171" text-anchor="middle" fill="white" font-size="22.7556">Clean Code</ns0:text>
  <ns0:path d="M 497.7778 162 L 640 162" stroke="#3498DB" stroke-width="4.2667" marker-end="url(#refactor)" />
  <ns0:text x="568.8889" y="144" text-anchor="middle" font-size="17.0667">Refactor</ns0:text>
  <ns0:rect x="213.3333" y="288" width="711.1111" height="324" fill="#555555" rx="7.1111" />
  <ns0:text x="568.8889" y="342" text-anchor="middle" fill="white" font-size="19.9111">Refactoring Goals:</ns0:text>
  <ns0:text x="256" y="396" fill="white" font-size="17.0667">• Extract methods for clarity</ns0:text>
  <ns0:text x="256" y="441" fill="white" font-size="17.0667">• Remove code duplication</ns0:text>
  <ns0:text x="256" y="486" fill="white" font-size="17.0667">• Apply design patterns</ns0:text>
  <ns0:text x="256" y="531" fill="white" font-size="17.0667">• Improve naming conventions</ns0:text>
  <ns0:text x="256" y="576" fill="white" font-size="17.0667">• Add error handling</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>

  <ns0:text x="628.682" y="397.8378" fill="white" font-size="13.667">  "orders": [</ns0:text>
  <ns0:text x="642.349" y="432.4324" fill="white" font-size="13.667">    { "id": "ord1", "total": 99.99 },</ns0:text>
  <ns0:text x="642.349" y="467.027" fill="white" font-size="13.667">    { "id": "ord2", "total": 149.99 }</ns0:text>
  <ns0:text x="628.682" y="501.6216" fill="white" font-size="13.667">  ],</ns0:text>

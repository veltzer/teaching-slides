<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="546.68" y="51.8919" text-anchor="middle" font-size="24.6006" font-weight="bold">NoSQL vs SQL Data Models</ns0:text>
  <ns0:rect x="68.335" y="86.4865" width="464.678" height="553.5135" fill="#3498DB" rx="13.667" />
  <ns0:text x="300.674" y="138.3784" text-anchor="middle" fill="white" font-size="21.8672" font-weight="bold">Relational (SQL)</ns0:text>

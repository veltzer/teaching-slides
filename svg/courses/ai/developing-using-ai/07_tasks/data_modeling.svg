<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="582.8571" height="580" fill="url(#grad-primary)" rx="6.184658738329" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.4286" y="94.374930273431" text-anchor="middle" fill="var(--bg)" font-size="25.069617273463" font-weight="bold" font-family="Arial, sans-serif">Relational (SQL)</text>
  <rect x="74.2857" y="130.624990039062" width="514.2857" height="108.750073046882" fill="url(#grad-primary)" rx="6.184658738329" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.4286" y="175.937431933587" text-anchor="middle" fill="var(--bg)" font-size="18.802187185686" font-family="Arial, sans-serif">Users Table</text>
  <text x="331.4286" y="212.187491699218" text-anchor="middle" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">id | name | email | created_at</text>
  <rect x="74.2857" y="257.500039843754" width="514.2857" height="108.750073046882" fill="url(#grad-primary)" rx="6.184658738329" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.4286" y="302.812481738279" text-anchor="middle" fill="var(--bg)" font-size="18.802187185686" font-family="Arial, sans-serif">Orders Table</text>
  <text x="331.4286" y="339.0624352539" text-anchor="middle" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">id | user_id | total | status</text>
  <line x1="331.4286" y1="239.374956835933" x2="331.4286" y2="257.500039843754" stroke="var(--bg)" stroke-width="2"/>
  <text x="348.5714" y="248.437445214838" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">FK</text>
  <rect x="657.1429" y="40" width="582.8571" height="580" fill="url(#grad-ok)" rx="6.184658738329" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.5714" y="94.374930273431" text-anchor="middle" fill="var(--bg)" font-size="25.069617273463" font-weight="bold" font-family="Arial, sans-serif">Document (NoSQL)</text>
  <rect x="691.4286" y="130.624990039062" width="514.2857" height="453.125056445318" fill="url(#grad-ok)" rx="6.184658738329" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.5714" y="175.937431933587" text-anchor="middle" fill="var(--bg)" font-size="18.802187185686" font-family="Arial, sans-serif">User Document</text>
  <text x="725.7143" y="221.249980078123" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">{</text>
  <text x="742.8571" y="257.500039843754" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">  "_id": "user123",</text>
  <text x="742.8571" y="293.749887109364" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">  "name": "John Doe",</text>
  <text x="742.8571" y="329.999946874995" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">  "email": "john@example.com",</text>
  <text x="742.8571" y="366.249900390615" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">  "orders": [</text>
  <text x="760" y="402.499960156246" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">    { "id": "ord1", "total": 99.99 },</text>
  <text x="760" y="438.749913671867" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">    { "id": "ord2", "total": 149.99 }</text>
  <text x="742.8571" y="474.999973437497" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">  ],</text>
  <text x="742.8571" y="511.249926953118" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">  "preferences": { ... }</text>
  <text x="725.7143" y="547.499986718749" fill="var(--bg)" font-size="15.66852368062" font-family="Arial, sans-serif">}</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.3613" font-weight="bold">NoSQL vs SQL Data Models</text>
  <rect x="40" y="74.1177" width="582.8571" height="545.8823" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.4286" y="125.2941" text-anchor="middle" fill="var(--bg)" font-size="24.3211" font-weight="bold">Relational (SQL)</text>
  <rect x="74.2857" y="159.4118" width="514.2857" height="102.353" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.4286" y="202.0588" text-anchor="middle" fill="var(--bg)" font-size="18.2408">Users Table</text>
  <text x="331.4286" y="236.1765" text-anchor="middle" fill="var(--bg)" font-size="15.2007">id | name | email | created_at</text>
  <rect x="74.2857" y="278.8236" width="514.2857" height="102.353" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.4286" y="321.4706" text-anchor="middle" fill="var(--bg)" font-size="18.2408">Orders Table</text>
  <text x="331.4286" y="355.5882" text-anchor="middle" fill="var(--bg)" font-size="15.2007">id | user_id | total | status</text>
  <line x1="331.4286" y1="261.7647" x2="331.4286" y2="278.8236" stroke="var(--bg)" stroke-width="2" />
  <text x="348.5714" y="270.2941" fill="var(--bg)" font-size="15.2007">FK</text>
  <rect x="657.1429" y="74.1177" width="582.8571" height="545.8823" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.5714" y="125.2941" text-anchor="middle" fill="var(--bg)" font-size="24.3211" font-weight="bold">Document (NoSQL)</text>
  <rect x="691.4286" y="159.4118" width="514.2857" height="426.4706" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.5714" y="202.0588" text-anchor="middle" fill="var(--bg)" font-size="18.2408">User Document</text>
  <text x="725.7143" y="244.7059" fill="var(--bg)" font-size="15.2007">{</text>
  <text x="742.8571" y="278.8236" fill="var(--bg)" font-size="15.2007">  "_id": "user123",</text>
  <text x="742.8571" y="312.9411" fill="var(--bg)" font-size="15.2007">  "name": "John Doe",</text>
  <text x="742.8571" y="347.0588" fill="var(--bg)" font-size="15.2007">  "email": "john@example.com",</text>
  <text x="742.8571" y="381.1764" fill="var(--bg)" font-size="15.2007">  "orders": [</text>
  <text x="760" y="415.2941" fill="var(--bg)" font-size="15.2007">    { "id": "ord1", "total": 99.99 },</text>
  <text x="760" y="449.4117" fill="var(--bg)" font-size="15.2007">    { "id": "ord2", "total": 149.99 }</text>
  <text x="742.8571" y="483.5294" fill="var(--bg)" font-size="15.2007">  ],</text>
  <text x="742.8571" y="517.647" fill="var(--bg)" font-size="15.2007">  "preferences": { ... }</text>
  <text x="725.7143" y="551.7647" fill="var(--bg)" font-size="15.2007">}</text>
</svg>
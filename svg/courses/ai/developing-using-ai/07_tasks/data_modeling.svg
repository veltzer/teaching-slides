  <ns0:text x="300.674" y="216.2162" text-anchor="middle" fill="white" font-size="16.4004">Users Table</ns0:text>
  <ns0:text x="300.674" y="250.8108" text-anchor="middle" fill="white" font-size="13.667">id | name | email | created_at</ns0:text>
  <ns0:rect x="95.669" y="294.0541" width="410.01" height="103.7838" fill="#2980B9" rx="6.8335" />
  <ns0:text x="300.674" y="337.2973" text-anchor="middle" fill="white" font-size="16.4004">Orders Table</ns0:text>
  <ns0:text x="300.674" y="371.8919" text-anchor="middle" fill="white" font-size="13.667">id | user_id | total | status</ns0:text>

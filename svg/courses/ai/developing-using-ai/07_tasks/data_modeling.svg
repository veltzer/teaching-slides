    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="546.68" y="51.8919" text-anchor="middle" font-size="24.6006" font-weight="bold">NoSQL vs SQL Data Models</ns0:text>
  <ns0:rect x="68.335" y="86.4865" width="464.678" height="553.5135" fill="#3498DB" rx="13.667" />
  <ns0:text x="300.674" y="138.3784" text-anchor="middle" fill="white" font-size="21.8672" font-weight="bold">Relational (SQL)</ns0:text>
  <ns0:rect x="95.669" y="172.973" width="410.01" height="103.7838" fill="#1976d2" rx="6.8335" />
  <ns0:text x="300.674" y="216.2162" text-anchor="middle" fill="white" font-size="16.4004">Users Table</ns0:text>
  <ns0:text x="300.674" y="250.8108" text-anchor="middle" fill="white" font-size="13.667">id | name | email | created_at</ns0:text>
  <ns0:rect x="95.669" y="294.0541" width="410.01" height="103.7838" fill="#1976d2" rx="6.8335" />
  <ns0:text x="300.674" y="337.2973" text-anchor="middle" fill="white" font-size="16.4004">Orders Table</ns0:text>
  <ns0:text x="300.674" y="371.8919" text-anchor="middle" fill="white" font-size="13.667">id | user_id | total | status</ns0:text>
  <ns0:line x1="300.674" y1="276.7568" x2="300.674" y2="294.0541" stroke="white" stroke-width="2.7334" />
  <ns0:text x="314.341" y="285.4054" fill="white" font-size="13.667">FK</ns0:text>
  <ns0:rect x="560.347" y="86.4865" width="464.678" height="553.5135" fill="#27AE60" rx="13.667" />
  <ns0:text x="792.686" y="138.3784" text-anchor="middle" fill="white" font-size="21.8672" font-weight="bold">Document (NoSQL)</ns0:text>
  <ns0:rect x="587.681" y="172.973" width="410.01" height="432.4324" fill="#28a745" rx="6.8335" />
  <ns0:text x="792.686" y="216.2162" text-anchor="middle" fill="white" font-size="16.4004">User Document</ns0:text>
  <ns0:text x="615.015" y="259.4595" fill="white" font-size="13.667">{</ns0:text>
  <ns0:text x="628.682" y="294.0541" fill="white" font-size="13.667">  "_id": "user123",</ns0:text>
  <ns0:text x="628.682" y="328.6486" fill="white" font-size="13.667">  "name": "John Doe",</ns0:text>
  <ns0:text x="628.682" y="363.2432" fill="white" font-size="13.667">  "email": "john@example.com",</ns0:text>
  <ns0:text x="628.682" y="397.8378" fill="white" font-size="13.667">  "orders": [</ns0:text>
  <ns0:text x="642.349" y="432.4324" fill="white" font-size="13.667">    { "id": "ord1", "total": 99.99 },</ns0:text>
  <ns0:text x="642.349" y="467.027" fill="white" font-size="13.667">    { "id": "ord2", "total": 149.99 }</ns0:text>
  <ns0:text x="628.682" y="501.6216" fill="white" font-size="13.667">  ],</ns0:text>
  <ns0:text x="628.682" y="536.2162" fill="white" font-size="13.667">  "preferences": { ... }</ns0:text>
  <ns0:text x="615.015" y="570.8108" fill="white" font-size="13.667">}</ns0:text>
</ns0:svg>
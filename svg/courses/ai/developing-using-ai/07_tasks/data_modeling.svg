<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="546.68" y="51.8919" text-anchor="middle" font-size="24.6006" font-weight="bold">NoSQL vs SQL Data Models</text>
  <rect x="68.335" y="86.4865" width="464.678" height="553.5135" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="300.674" y="138.3784" text-anchor="middle" fill="var(--bg)" font-size="21.8672" font-weight="bold">Relational (SQL)</text>
  <rect x="95.669" y="172.973" width="410.01" height="103.7838" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="300.674" y="216.2162" text-anchor="middle" fill="var(--bg)" font-size="16.4004">Users Table</text>
  <text x="300.674" y="250.8108" text-anchor="middle" fill="var(--bg)" font-size="13.667">id | name | email | created_at</text>
  <rect x="95.669" y="294.0541" width="410.01" height="103.7838" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="300.674" y="337.2973" text-anchor="middle" fill="var(--bg)" font-size="16.4004">Orders Table</text>
  <text x="300.674" y="371.8919" text-anchor="middle" fill="var(--bg)" font-size="13.667">id | user_id | total | status</text>
  <line x1="300.674" y1="276.7568" x2="300.674" y2="294.0541" stroke="var(--bg)" stroke-width="2" />
  <text x="314.341" y="285.4054" fill="var(--bg)" font-size="13.667">FK</text>
  <rect x="560.347" y="86.4865" width="464.678" height="553.5135" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="792.686" y="138.3784" text-anchor="middle" fill="var(--bg)" font-size="21.8672" font-weight="bold">Document (NoSQL)</text>
  <rect x="587.681" y="172.973" width="410.01" height="432.4324" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="792.686" y="216.2162" text-anchor="middle" fill="var(--bg)" font-size="16.4004">User Document</text>
  <text x="615.015" y="259.4595" fill="var(--bg)" font-size="13.667">{</text>
  <text x="628.682" y="294.0541" fill="var(--bg)" font-size="13.667">  "_id": "user123",</text>
  <text x="628.682" y="328.6486" fill="var(--bg)" font-size="13.667">  "name": "John Doe",</text>
  <text x="628.682" y="363.2432" fill="var(--bg)" font-size="13.667">  "email": "john@example.com",</text>
  <text x="628.682" y="397.8378" fill="var(--bg)" font-size="13.667">  "orders": [</text>
  <text x="642.349" y="432.4324" fill="var(--bg)" font-size="13.667">    { "id": "ord1", "total": 99.99 },</text>
  <text x="642.349" y="467.027" fill="var(--bg)" font-size="13.667">    { "id": "ord2", "total": 149.99 }</text>
  <text x="628.682" y="501.6216" fill="var(--bg)" font-size="13.667">  ],</text>
  <text x="628.682" y="536.2162" fill="var(--bg)" font-size="13.667">  "preferences": { ... }</text>
  <text x="615.015" y="570.8108" fill="var(--bg)" font-size="13.667">}</text>
</svg>
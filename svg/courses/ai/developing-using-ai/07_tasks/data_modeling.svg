<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="1024" y="97.2" text-anchor="middle" font-size="46.08" font-weight="bold">NoSQL vs SQL Data Models</text>
  <rect x="128" y="162" width="870.4" height="1036.8" fill="#3498DB" rx="25.6" />
  <text x="563.2" y="259.2" text-anchor="middle" fill="white" font-size="40.96" font-weight="bold">Relational (SQL)</text>
  <rect x="179.2" y="324" width="768" height="194.4" fill="#2980B9" rx="12.8" />
  <text x="563.2" y="405" text-anchor="middle" fill="white" font-size="30.72">Users Table</text>
  <text x="563.2" y="469.8" text-anchor="middle" fill="white" font-size="25.6">id | name | email | created_at</text>
  <rect x="179.2" y="550.8" width="768" height="194.4" fill="#2980B9" rx="12.8" />
  <text x="563.2" y="631.8" text-anchor="middle" fill="white" font-size="30.72">Orders Table</text>
  <text x="563.2" y="696.6" text-anchor="middle" fill="white" font-size="25.6">id | user_id | total | status</text>
  <line x1="563.2" y1="518.4" x2="563.2" y2="550.8" stroke="white" stroke-width="5.12" />
  <text x="588.8" y="534.6" fill="white" font-size="25.6">FK</text>
  <rect x="1049.6" y="162" width="870.4" height="1036.8" fill="#27AE60" rx="25.6" />
  <text x="1484.8" y="259.2" text-anchor="middle" fill="white" font-size="40.96" font-weight="bold">Document (NoSQL)</text>
  <rect x="1100.8" y="324" width="768" height="810" fill="#229954" rx="12.8" />
  <text x="1484.8" y="405" text-anchor="middle" fill="white" font-size="30.72">User Document</text>
  <text x="1152" y="486" fill="white" font-size="25.6">{</text>
  <text x="1177.6" y="550.8" fill="white" font-size="25.6">  "_id": "user123",</text>
  <text x="1177.6" y="615.6" fill="white" font-size="25.6">  "name": "John Doe",</text>
  <text x="1177.6" y="680.4" fill="white" font-size="25.6">  "email": "john@example.com",</text>
  <text x="1177.6" y="745.2" fill="white" font-size="25.6">  "orders": [</text>
  <text x="1203.2" y="810" fill="white" font-size="25.6">    { "id": "ord1", "total": 99.99 },</text>
  <text x="1203.2" y="874.8" fill="white" font-size="25.6">    { "id": "ord2", "total": 149.99 }</text>
  <text x="1177.6" y="939.6" fill="white" font-size="25.6">  ],</text>
  <text x="1177.6" y="1004.4" fill="white" font-size="25.6">  "preferences": { ... }</text>
  <text x="1152" y="1069.2" fill="white" font-size="25.6">}</text>
</svg>
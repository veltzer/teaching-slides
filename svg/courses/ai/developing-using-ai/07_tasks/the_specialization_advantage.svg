<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="377.815" y="67.8154" width="524.369" height="524.369" rx="14" fill="var(--primary-fill)" opacity="0.2" filter="url(#shadow)"/>
  <rect x="465.21" y="155.21" width="349.579" height="349.579" rx="14" fill="var(--ok-fill)" opacity="0.3" filter="url(#shadow)"/>
  <rect x="552.605" y="242.605" width="174.79" height="174.79" rx="14" fill="var(--danger-fill)" opacity="0.4" filter="url(#shadow)"/>
  <text x="640.0001" y="330" text-anchor="middle" fill="var(--bg)" font-size="24.4706" font-weight="bold">Core AI</text>
  <rect x="40" y="40" width="300" height="116" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="107.6667" text-anchor="middle" fill="var(--bg)" font-size="24.4706">Database</text>
  <rect x="940" y="40" width="300" height="116" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="107.6667" text-anchor="middle" fill="var(--bg)" font-size="24.4706">Frontend</text>
  <rect x="40" y="504" width="300" height="116" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="571.6666" text-anchor="middle" fill="var(--bg)" font-size="24.4706">Backend</text>
  <rect x="940" y="504" width="300" height="116" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="571.6666" text-anchor="middle" fill="var(--bg)" font-size="24.4706">DevOps</text>
  <line x1="340" y1="98" x2="540" y2="233.3333" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="940" y1="98" x2="740" y2="233.3333" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="340" y1="562" x2="540" y2="426.6667" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="940" y1="562" x2="740" y2="426.6667" stroke="var(--text-muted)" stroke-width="2" />
</svg>
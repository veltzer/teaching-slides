<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="377.1429" height="580" fill="url(#grad-primary)" rx="6.313251175336" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="228.5713" y="102.142817602043" text-anchor="middle" fill="var(--text)" font-size="26.800593006126" font-weight="bold" font-family="Arial, sans-serif">React Native</text>
  <text x="228.5713" y="164.285745918365" text-anchor="middle" font-size="20.100444754595" font-family="Arial, sans-serif" fill="var(--primary-text)">Performance: ⭐⭐⭐⭐</text>
  <text x="228.5713" y="216.071464158161" text-anchor="middle" font-size="20.100444754595" font-family="Arial, sans-serif" fill="var(--primary-text)">Learning: ⭐⭐⭐</text>
  <text x="228.5713" y="267.857182397957" text-anchor="middle" font-size="20.100444754595" font-family="Arial, sans-serif" fill="var(--primary-text)">• JavaScript/React</text>
  <text x="228.5713" y="319.642789923474" text-anchor="middle" font-size="20.100444754595" font-family="Arial, sans-serif" fill="var(--primary-text)">• Native modules</text>
  <text x="228.5713" y="371.428508163269" text-anchor="middle" font-size="20.100444754595" font-family="Arial, sans-serif" fill="var(--primary-text)">• Hot reload</text>
  <text x="228.5713" y="423.214226403065" text-anchor="middle" font-size="20.100444754595" font-family="Arial, sans-serif" fill="var(--primary-text)">• Large ecosystem</text>
  <rect x="451.4286" y="40" width="377.1429" height="580" fill="var(--primary-accent)" rx="6.313251175336"/>
  <text x="640" y="102.142817602043" text-anchor="middle" fill="var(--bg)" font-size="26.800593006126" font-weight="bold" font-family="Arial, sans-serif">Flutter</text>
  <text x="640" y="164.285745918365" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">Performance: ⭐⭐⭐⭐⭐</text>
  <text x="640" y="216.071464158161" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">Learning: ⭐⭐⭐⭐</text>
  <text x="640" y="267.857182397957" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">• Dart language</text>
  <text x="640" y="319.642789923474" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">• Custom rendering</text>
  <text x="640" y="371.428508163269" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">• Rich widgets</text>
  <text x="640" y="423.214226403065" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">• Fast performance</text>
  <rect x="862.8571" y="40" width="377.1429" height="580" fill="var(--primary-accent)" rx="6.313251175336"/>
  <text x="1051.4286" y="102.142817602043" text-anchor="middle" fill="var(--bg)" font-size="26.800593006126" font-weight="bold" font-family="Arial, sans-serif">Ionic</text>
  <text x="1051.4286" y="164.285745918365" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">Performance: ⭐⭐⭐</text>
  <text x="1051.4286" y="216.071464158161" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">Learning: ⭐⭐</text>
  <text x="1051.4286" y="267.857182397957" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">• Web technologies</text>
  <text x="1051.4286" y="319.642789923474" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">• Angular/React/Vue</text>
  <text x="1051.4286" y="371.428508163269" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">• Capacitor plugins</text>
  <text x="1051.4286" y="423.214226403065" text-anchor="middle" fill="var(--bg)" font-size="20.100444754595" font-family="Arial, sans-serif">• PWA support</text>
</svg>

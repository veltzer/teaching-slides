<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="1024" y="129.6" text-anchor="middle" font-size="46.08" font-weight="bold">Animation Performance Hierarchy</text>
  <rect x="256" y="226.8" width="1536" height="194.4" fill="#27AE60" rx="25.6" />
  <text x="1024" y="340.2" text-anchor="middle" fill="white" font-size="35.84">✅ Transform &amp; Opacity (GPU accelerated)</text>
  <text x="1024" y="388.8" text-anchor="middle" fill="white" font-size="25.6">Best performance - 60 FPS</text>
  <rect x="256" y="486" width="1536" height="194.4" fill="#F39C12" rx="25.6" />
  <text x="1024" y="599.4" text-anchor="middle" fill="white" font-size="35.84">⚠️ Color &amp; Shadow Changes</text>
  <text x="1024" y="648" text-anchor="middle" fill="white" font-size="25.6">Triggers repaint - Moderate performance</text>
  <rect x="256" y="745.2" width="1536" height="194.4" fill="#E74C3C" rx="25.6" />
  <text x="1024" y="858.6" text-anchor="middle" fill="white" font-size="35.84">❌ Width, Height, Position Changes</text>
  <text x="1024" y="907.2" text-anchor="middle" fill="white" font-size="25.6">Triggers reflow - Poor performance</text>
  <rect x="512" y="1004.4" width="1024" height="162" fill="#3498DB" rx="12.8" />
  <text x="1024" y="1101.6" text-anchor="middle" fill="white" font-size="30.72">Use will-change and transform3d for optimization</text>
</svg>
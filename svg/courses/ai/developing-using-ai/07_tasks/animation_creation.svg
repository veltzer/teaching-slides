<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="561.8656" y="71.1111" text-anchor="middle" font-size="25.284" font-weight="bold">Animation Performance Hierarchy</ns0:text>
  <ns0:rect x="140.4664" y="124.4444" width="842.7984" height="106.6667" fill="#27AE60" rx="14.0466" />
  <ns0:text x="561.8656" y="186.6667" text-anchor="middle" fill="white" font-size="19.6653">✅ Transform &amp; Opacity (GPU accelerated)</ns0:text>
  <ns0:text x="561.8656" y="213.3333" text-anchor="middle" fill="white" font-size="14.0466">Best performance - 60 FPS</ns0:text>
  <ns0:rect x="140.4664" y="266.6667" width="842.7984" height="106.6667" fill="#F39C12" rx="14.0466" />
  <ns0:text x="561.8656" y="328.8889" text-anchor="middle" fill="white" font-size="19.6653">⚠️ Color &amp; Shadow Changes</ns0:text>
  <ns0:text x="561.8656" y="355.5556" text-anchor="middle" fill="white" font-size="14.0466">Triggers repaint - Moderate performance</ns0:text>
  <ns0:rect x="140.4664" y="408.8889" width="842.7984" height="106.6667" fill="#E74C3C" rx="14.0466" />
  <ns0:text x="561.8656" y="471.1111" text-anchor="middle" fill="white" font-size="19.6653">❌ Width, Height, Position Changes</ns0:text>
  <ns0:text x="561.8656" y="497.7778" text-anchor="middle" fill="white" font-size="14.0466">Triggers reflow - Poor performance</ns0:text>
  <ns0:rect x="280.9328" y="551.1111" width="561.8656" height="88.8889" fill="#3498DB" rx="7.0233" />
  <ns0:text x="561.8656" y="604.4444" text-anchor="middle" fill="white" font-size="16.856">Use will-change and transform3d for optimization</ns0:text>
</ns0:svg>
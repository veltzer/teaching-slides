<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="640.000240000096" y="40" text-anchor="middle" fill="var(--bg)" font-size="40.2463352542" font-weight="bold" font-family="Arial, sans-serif">Auth Flow</text>
  <rect x="40" y="119.091051652904" width="287.999995199998" height="158.181830578513" fill="url(#grad-primary)" rx="7.675227624601" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="183.999697599879" y="211.363695247938" text-anchor="middle" fill="var(--bg)" font-size="26.831188650541" font-family="Arial, sans-serif">Login</text>
  <rect x="495.999822399929" y="119.091051652904" width="287.999995199998" height="158.181830578513" fill="url(#grad-ok)" rx="7.675227624601" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000240000096" y="211.363695247938" text-anchor="middle" fill="var(--bg)" font-size="26.831188650541" font-family="Arial, sans-serif">JWT Token</text>
  <rect x="952.000004800002" y="119.091051652904" width="287.999995199998" height="158.181830578513" fill="url(#grad-danger)" rx="7.675227624601" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.999942399977" y="211.363695247938" text-anchor="middle" fill="var(--bg)" font-size="26.831188650541" font-family="Arial, sans-serif">Access</text>
  <path d="M 327.999755199902 198.181830578513 L 495.999822399929 198.181830578513" stroke="var(--bg)" stroke-width="1.5033" marker-end="url(#arrow)"/>
  <path d="M 784.000177600071 198.181830578513 L 952.000004800002 198.181830578513" stroke="var(--bg)" stroke-width="1.5033" marker-end="url(#arrow)"/>
  <rect x="279.99997599999" y="356.363661157027" width="720.000648000259" height="263.636338842973" fill="var(--text-muted)" rx="7.675227624601"/>
  <text x="640.000240000096" y="435.454576446283" text-anchor="middle" fill="var(--bg)" font-size="26.831188650541" font-family="Arial, sans-serif">Middleware validates token</text>
  <text x="640.000240000096" y="488.182035123984" text-anchor="middle" fill="var(--bg)" font-size="26.831188650541" font-family="Arial, sans-serif">Checks permissions</text>
  <text x="640.000240000096" y="540.90922107439" text-anchor="middle" fill="var(--bg)" font-size="26.831188650541" font-family="Arial, sans-serif">Refreshes if needed</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

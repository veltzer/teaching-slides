<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" fill="var(--bg)" font-size="39.3618066037" font-weight="bold" font-family="Arial, sans-serif">Query Performance Analysis</text>
  <rect x="40" y="90.434691871462" width="1200" height="100.86964461247" fill="url(#grad-danger)" rx="7.506518624701" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="63.99988" y="153.478121928177" fill="var(--bg)" font-size="26.241287808229" font-family="Arial, sans-serif">Before: SELECT * FROM orders WHERE status = 'pending'</text>
  <text x="999.99988" y="153.478121928177" fill="var(--bg)" font-size="26.241287808229" font-family="Arial, sans-serif">Time: 2.5s</text>
  <rect x="40" y="216.521682419664" width="1200" height="201.739158790168" fill="url(#grad-ok)" rx="7.506518624701" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="63.99988" y="279.565112476378" fill="var(--bg)" font-size="26.241287808229" font-family="Arial, sans-serif">After: WITH pending_orders AS (</text>
  <text x="111.99988" y="329.999934782614" fill="var(--bg)" font-size="26.241287808229" font-family="Arial, sans-serif">SELECT id, customer_id, total FROM orders</text>
  <text x="111.99988" y="380.434757088849" fill="var(--bg)" font-size="26.241287808229" font-family="Arial, sans-serif">WHERE status = 'pending' AND created_at &gt; NOW() - INTERVAL '7 days'</text>
  <text x="63.99988" y="430.869579395084" fill="var(--bg)" font-size="26.241287808229" font-family="Arial, sans-serif">) SELECT * FROM pending_orders;</text>
  <text x="999.99988" y="329.999934782614" fill="var(--bg)" font-size="26.241287808229" font-family="Arial, sans-serif">Time: 0.08s</text>
  <rect x="40" y="468.695663516067" width="1200" height="151.304336483933" fill="url(#grad-primary)" rx="7.506518624701" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="63.99988" y="531.738963138009" fill="var(--bg)" font-size="26.241287808229" font-family="Arial, sans-serif">Optimizations Applied:</text>
  <text x="63.99988" y="582.173915879017" fill="var(--bg)" font-size="26.241287808229" font-family="Arial, sans-serif">✓ Partial index ✓ Column selection ✓ Date range ✓ CTE usage</text>
</svg>

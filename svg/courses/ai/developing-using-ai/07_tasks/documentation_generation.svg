<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" fill="var(--bg)" font-size="40.246449687682" font-weight="bold" font-family="Arial, sans-serif">Documentation Pipeline</text>
  <rect x="40" y="119.091014462769" width="360.000072000014" height="158.181892561954" fill="url(#grad-primary)" rx="7.675225052558" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.000036000007" y="211.36361466943" text-anchor="middle" fill="var(--bg)" font-size="26.831051738733" font-family="Arial, sans-serif">Code Comments</text>
  <rect x="459.999963999993" y="119.091014462769" width="360.000072000014" height="158.181892561954" fill="url(#grad-ok)" rx="7.675225052558" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="211.36361466943" text-anchor="middle" fill="var(--bg)" font-size="26.831051738733" font-family="Arial, sans-serif">OpenAPI/Swagger</text>
  <rect x="879.999927999986" y="119.091014462769" width="360.000072000014" height="158.181892561954" fill="url(#grad-danger)" rx="7.675225052558" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1059.999963999993" y="211.36361466943" text-anchor="middle" fill="var(--bg)" font-size="26.831051738733" font-family="Arial, sans-serif">Interactive Docs</text>
  <path d="M 400.000072000014 198.182028925537 L 459.999963999993 198.182028925537" stroke="var(--bg)" stroke-width="1.7608"/>
  <path d="M 819.999795999959 198.182028925537 L 879.999927999986 198.182028925537" stroke="var(--bg)" stroke-width="1.7608"/>
  <rect x="279.999687999938" y="356.363648760326" width="719.999783999957" height="263.636351239674" fill="var(--text-muted)" rx="7.675225052558"/>
  <text x="640" y="435.454390495929" text-anchor="middle" fill="var(--bg)" font-size="26.831051738733" font-family="Arial, sans-serif">Auto-generated from code</text>
  <text x="640" y="488.181824380163" text-anchor="middle" fill="var(--bg)" font-size="26.831051738733" font-family="Arial, sans-serif">Always up-to-date</text>
  <text x="640" y="540.909121900814" text-anchor="middle" fill="var(--bg)" font-size="26.831051738733" font-family="Arial, sans-serif">Testable endpoints</text>
</svg>

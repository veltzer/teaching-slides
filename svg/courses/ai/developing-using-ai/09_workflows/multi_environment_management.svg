<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="195.5556" y="80" width="888.8889" height="500" fill="var(--text)" rx="8.3333" />
  <text x="640" y="130" text-anchor="middle" fill="var(--bg)" font-size="26.6667" font-weight="bold">Environment Pipeline</text>
  <rect x="269.6296" y="196.6667" width="177.7778" height="133.3333" fill="var(--primary-fill)" rx="8.3333" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="358.5185" y="246.6667" text-anchor="middle" fill="var(--bg)" font-size="17.7778">Dev</text>
  <text x="358.5185" y="280" text-anchor="middle" fill="var(--bg)" font-size="14.8149">Auto-deploy</text>
  <text x="358.5185" y="305" text-anchor="middle" fill="var(--bg)" font-size="14.8149">Every commit</text>
  <rect x="491.8518" y="196.6667" width="177.7778" height="133.3333" fill="var(--ok-fill)" rx="8.3333" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="580.7407" y="246.6667" text-anchor="middle" fill="var(--bg)" font-size="17.7778">Staging</text>
  <text x="580.7407" y="280" text-anchor="middle" fill="var(--bg)" font-size="14.8149">Daily sync</text>
  <text x="580.7407" y="305" text-anchor="middle" fill="var(--bg)" font-size="14.8149">Full testing</text>
  <rect x="714.074" y="196.6667" width="177.7778" height="133.3333" fill="var(--warn-fill)" rx="8.3333" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="802.9629" y="246.6667" text-anchor="middle" fill="var(--bg)" font-size="17.7778">Pre-Prod</text>
  <text x="802.9629" y="280" text-anchor="middle" fill="var(--bg)" font-size="14.8149">Weekly</text>
  <text x="802.9629" y="305" text-anchor="middle" fill="var(--bg)" font-size="14.8149">Prod mirror</text>
  <rect x="936.2962" y="196.6667" width="118.5185" height="133.3333" fill="var(--danger-fill)" rx="8.3333" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="995.5556" y="246.6667" text-anchor="middle" fill="var(--bg)" font-size="17.7778">Prod</text>
  <text x="995.5556" y="280" text-anchor="middle" fill="var(--bg)" font-size="14.8149">Manual</text>
  <text x="995.5556" y="305" text-anchor="middle" fill="var(--bg)" font-size="14.8149">Approved</text>
  <path d="M 447.4074 263.3333 L 491.8518 263.3333" stroke="var(--bg)" stroke-width="2.1333" />
  <path d="M 669.6296 263.3333 L 714.074 263.3333" stroke="var(--bg)" stroke-width="2.1333" />
  <path d="M 891.8518 263.3333 L 936.2962 263.3333" stroke="var(--bg)" stroke-width="2.1333" />
</svg>
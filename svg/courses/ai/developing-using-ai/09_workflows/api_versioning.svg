<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" fill="var(--bg)" font-size="44.771356100173" font-weight="bold" font-family="Arial, sans-serif">API Version Timeline</text>
  <line x1="40" y1="387.999970000003" x2="1240" y2="387.999970000003" stroke="var(--bg)" stroke-width="2"/>
  <rect x="142.2028" y="365.753471917804" width="35.59536" height="44.494196164293" rx="18.782970201387" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="160" y="329.999925000006" text-anchor="middle" fill="var(--bg)" font-size="24.872945796969" font-family="Arial, sans-serif">v1</text>
  <text x="160" y="474.999962500003" text-anchor="middle" fill="var(--bg)" font-size="24.872945796969" font-family="Arial, sans-serif">Jan 2024</text>
  <rect x="502.2028" y="365.753471917804" width="35.59536" height="44.494196164293" rx="18.782970201387" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="520" y="329.999925000006" text-anchor="middle" fill="var(--bg)" font-size="24.872945796969" font-family="Arial, sans-serif">v2</text>
  <text x="520" y="474.999962500003" text-anchor="middle" fill="var(--bg)" font-size="24.872945796969" font-family="Arial, sans-serif">Jun 2024</text>
  <rect x="862.2028" y="365.753471917804" width="35.59536" height="44.494196164293" rx="18.782970201387" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="880" y="329.999925000006" text-anchor="middle" fill="var(--bg)" font-size="24.872945796969" font-family="Arial, sans-serif">v3</text>
  <text x="880" y="474.999962500003" text-anchor="middle" fill="var(--bg)" font-size="24.872945796969" font-family="Arial, sans-serif">Dec 2024</text>
  <rect x="160" y="213.999985000001" width="360" height="86.999992500001" fill="url(#grad-danger)" rx="8.049844372023" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="266.199980500002" text-anchor="middle" fill="var(--bg)" font-size="24.872945796969" font-family="Arial, sans-serif">v1 deprecated</text>
  <rect x="520" y="533.000007499999" width="360" height="86.999992500001" fill="var(--text-faint)" rx="8.049844372023"/>
  <text x="700" y="585.200003" text-anchor="middle" fill="var(--bg)" font-size="24.872945796969" font-family="Arial, sans-serif">v1 sunset</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--text)" rx="6"/>
  <text x="640" y="98" text-anchor="middle" fill="var(--bg)" font-size="33.3706" font-weight="bold" font-family="Arial, sans-serif">API Version Timeline</text>
  <line x1="140" y1="330" x2="1140" y2="330" stroke="var(--bg)" stroke-width="2"/>
  <rect x="225.169" y="315.169" width="29.6628" height="29.6628" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="240" y="291.3333" text-anchor="middle" fill="var(--bg)" font-size="18.5392" font-family="Arial, sans-serif">v1</text>
  <text x="240" y="388" text-anchor="middle" fill="var(--bg)" font-size="18.5392" font-family="Arial, sans-serif">Jan 2024</text>
  <rect x="525.169" y="315.169" width="29.6628" height="29.6628" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="540" y="291.3333" text-anchor="middle" fill="var(--bg)" font-size="18.5392" font-family="Arial, sans-serif">v2</text>
  <text x="540" y="388" text-anchor="middle" fill="var(--bg)" font-size="18.5392" font-family="Arial, sans-serif">Jun 2024</text>
  <rect x="825.169" y="315.169" width="29.6628" height="29.6628" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="840" y="291.3333" text-anchor="middle" fill="var(--bg)" font-size="18.5392" font-family="Arial, sans-serif">v3</text>
  <text x="840" y="388" text-anchor="middle" fill="var(--bg)" font-size="18.5392" font-family="Arial, sans-serif">Dec 2024</text>
  <rect x="240" y="214" width="300" height="58" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="248.8" text-anchor="middle" fill="var(--bg)" font-size="18.5392" font-family="Arial, sans-serif">v1 deprecated</text>
  <rect x="540" y="426.6667" width="300" height="58" fill="var(--text-faint)" rx="6"/>
  <text x="690" y="461.4667" text-anchor="middle" fill="var(--bg)" font-size="18.5392" font-family="Arial, sans-serif">v1 sunset</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="26.821872" font-weight="bold" fill="var(--text)">The Complete Development Cycle</text>

  <rect x="40" y="77.247706" width="230" height="255.412844" rx="6.189663" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="155" y="119.816514" text-anchor="middle" font-size="18.568989" font-weight="bold" fill="var(--primary-text)">Plan</text>
  <text x="155" y="162.385321" text-anchor="middle" font-size="14.442547" fill="var(--primary-text)">Clarify intent</text>
  <text x="155" y="194.311927" text-anchor="middle" font-size="14.442547" fill="var(--primary-text)">Draft spec</text>
  <text x="155" y="236.880734" text-anchor="middle" font-size="14.442547" fill="var(--primary-text)">List tasks</text>
  <text x="155" y="279.449541" text-anchor="middle" font-size="14.442547" fill="var(--primary-text)">AI brainstorms</text>
  <text x="155" y="311.376147" text-anchor="middle" font-size="14.442547" fill="var(--primary-text)">tradeoffs</text>

  <rect x="295" y="77.247706" width="230" height="255.412844" rx="6.189663" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="410" y="119.816514" text-anchor="middle" font-size="18.568989" font-weight="bold" fill="var(--info-text)">Generate</text>
  <text x="410" y="162.385321" text-anchor="middle" font-size="14.442547" fill="var(--info-text)">Prompt agent</text>
  <text x="410" y="194.311927" text-anchor="middle" font-size="14.442547" fill="var(--info-text)">Stream diffs</text>
  <text x="410" y="236.880734" text-anchor="middle" font-size="14.442547" fill="var(--info-text)">Apply to repo</text>
  <text x="410" y="279.449541" text-anchor="middle" font-size="14.442547" fill="var(--info-text)">Inspect changes</text>
  <text x="410" y="311.376147" text-anchor="middle" font-size="14.442547" fill="var(--info-text)">Keep or revert</text>

  <rect x="550" y="77.247706" width="230" height="255.412844" rx="6.189663" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="665" y="119.816514" text-anchor="middle" font-size="18.568989" font-weight="bold" fill="var(--warn-text)">Test</text>
  <text x="665" y="162.385321" text-anchor="middle" font-size="14.442547" fill="var(--warn-text)">Run unit suite</text>
  <text x="665" y="194.311927" text-anchor="middle" font-size="14.442547" fill="var(--warn-text)">Integration checks</text>
  <text x="665" y="236.880734" text-anchor="middle" font-size="14.442547" fill="var(--warn-text)">Linters, types</text>
  <text x="665" y="279.449541" text-anchor="middle" font-size="14.442547" fill="var(--warn-text)">AI fixes failures</text>
  <text x="665" y="311.376147" text-anchor="middle" font-size="14.442547" fill="var(--warn-text)">Iterate fast</text>

  <rect x="805" y="77.247706" width="230" height="255.412844" rx="6.189663" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="920" y="119.816514" text-anchor="middle" font-size="18.568989" font-weight="bold" fill="var(--ok-text)">Review</text>
  <text x="920" y="162.385321" text-anchor="middle" font-size="14.442547" fill="var(--ok-text)">Read the diff</text>
  <text x="920" y="194.311927" text-anchor="middle" font-size="14.442547" fill="var(--ok-text)">Question choices</text>
  <text x="920" y="236.880734" text-anchor="middle" font-size="14.442547" fill="var(--ok-text)">Security scan</text>
  <text x="920" y="279.449541" text-anchor="middle" font-size="14.442547" fill="var(--ok-text)">Human approves</text>
  <text x="920" y="311.376147" text-anchor="middle" font-size="14.442547" fill="var(--ok-text)">Accept commit</text>

  <rect x="1060" y="77.247706" width="180" height="255.412844" rx="6.189663" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1150" y="119.816514" text-anchor="middle" font-size="18.568989" font-weight="bold" fill="var(--danger-text)">Ship</text>
  <text x="1150" y="162.385321" text-anchor="middle" font-size="14.442547" fill="var(--danger-text)">CI gates</text>
  <text x="1150" y="204.954128" text-anchor="middle" font-size="14.442547" fill="var(--danger-text)">Merge PR</text>
  <text x="1150" y="247.522936" text-anchor="middle" font-size="14.442547" fill="var(--danger-text)">Deploy</text>
  <text x="1150" y="290.091743" text-anchor="middle" font-size="14.442547" fill="var(--danger-text)">Monitor</text>

  <rect x="40" y="364.587156" width="1200" height="255.412844" rx="6.189663" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="407.155963" text-anchor="middle" font-size="20.63221" font-weight="bold" fill="var(--text)">Feedback Loop</text>
  <text x="640" y="449.724771" text-anchor="middle" font-size="15.474157" fill="var(--text-muted)">Telemetry, user reports, postmortems flow back to Plan.</text>
  <text x="640" y="486.972477" text-anchor="middle" font-size="15.474157" fill="var(--text-muted)">Each turn is shorter when AI handles boilerplate.</text>
  <text x="640" y="524.220183" text-anchor="middle" font-size="15.474157" fill="var(--text-muted)">Humans stay on the path: intent, review, accountability.</text>
  <text x="640" y="561.46789" text-anchor="middle" font-size="15.474157" fill="var(--text-muted)">Small batches keep diffs reviewable.</text>
  <text x="640" y="598.715596" text-anchor="middle" font-size="15.474157" fill="var(--text-muted)">Tight loops compound over time.</text>

  <line x1="270" y1="204.954128" x2="295" y2="204.954128" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="525" y1="204.954128" x2="550" y2="204.954128" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="204.954128" x2="805" y2="204.954128" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1035" y1="204.954128" x2="1060" y2="204.954128" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

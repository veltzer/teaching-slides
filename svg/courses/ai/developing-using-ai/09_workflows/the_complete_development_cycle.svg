<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="230" height="272.941176219146" rx="6.398529361204" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="85.490196748943" text-anchor="middle" font-size="19.195588083613" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Plan</text>
  <text x="155" y="130.980392429258" text-anchor="middle" font-size="14.92990184281" fill="var(--primary-text)" font-family="Arial, sans-serif">Clarify intent</text>
  <text x="155" y="165.098039990965" text-anchor="middle" font-size="14.92990184281" fill="var(--primary-text)" font-family="Arial, sans-serif">Draft spec</text>
  <text x="155" y="210.58823567128" text-anchor="middle" font-size="14.92990184281" fill="var(--primary-text)" font-family="Arial, sans-serif">List tasks</text>
  <text x="155" y="256.078431351596" text-anchor="middle" font-size="14.92990184281" fill="var(--primary-text)" font-family="Arial, sans-serif">AI brainstorms</text>
  <text x="155" y="290.196078913303" text-anchor="middle" font-size="14.92990184281" fill="var(--primary-text)" font-family="Arial, sans-serif">tradeoffs</text>

  <rect x="295" y="40" width="230" height="272.941176219146" rx="6.398529361204" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="85.490196748943" text-anchor="middle" font-size="19.195588083613" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Generate</text>
  <text x="410" y="130.980392429258" text-anchor="middle" font-size="14.92990184281" fill="var(--info-text)" font-family="Arial, sans-serif">Prompt agent</text>
  <text x="410" y="165.098039990965" text-anchor="middle" font-size="14.92990184281" fill="var(--info-text)" font-family="Arial, sans-serif">Stream diffs</text>
  <text x="410" y="210.58823567128" text-anchor="middle" font-size="14.92990184281" fill="var(--info-text)" font-family="Arial, sans-serif">Apply to repo</text>
  <text x="410" y="256.078431351596" text-anchor="middle" font-size="14.92990184281" fill="var(--info-text)" font-family="Arial, sans-serif">Inspect changes</text>
  <text x="410" y="290.196078913303" text-anchor="middle" font-size="14.92990184281" fill="var(--info-text)" font-family="Arial, sans-serif">Keep or revert</text>

  <rect x="550" y="40" width="230" height="272.941176219146" rx="6.398529361204" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="665" y="85.490196748943" text-anchor="middle" font-size="19.195588083613" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Test</text>
  <text x="665" y="130.980392429258" text-anchor="middle" font-size="14.92990184281" fill="var(--warn-text)" font-family="Arial, sans-serif">Run unit suite</text>
  <text x="665" y="165.098039990965" text-anchor="middle" font-size="14.92990184281" fill="var(--warn-text)" font-family="Arial, sans-serif">Integration checks</text>
  <text x="665" y="210.58823567128" text-anchor="middle" font-size="14.92990184281" fill="var(--warn-text)" font-family="Arial, sans-serif">Linters, types</text>
  <text x="665" y="256.078431351596" text-anchor="middle" font-size="14.92990184281" fill="var(--warn-text)" font-family="Arial, sans-serif">AI fixes failures</text>
  <text x="665" y="290.196078913303" text-anchor="middle" font-size="14.92990184281" fill="var(--warn-text)" font-family="Arial, sans-serif">Iterate fast</text>

  <rect x="805" y="40" width="230" height="272.941176219146" rx="6.398529361204" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="85.490196748943" text-anchor="middle" font-size="19.195588083613" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Review</text>
  <text x="920" y="130.980392429258" text-anchor="middle" font-size="14.92990184281" fill="var(--ok-text)" font-family="Arial, sans-serif">Read the diff</text>
  <text x="920" y="165.098039990965" text-anchor="middle" font-size="14.92990184281" fill="var(--ok-text)" font-family="Arial, sans-serif">Question choices</text>
  <text x="920" y="210.58823567128" text-anchor="middle" font-size="14.92990184281" fill="var(--ok-text)" font-family="Arial, sans-serif">Security scan</text>
  <text x="920" y="256.078431351596" text-anchor="middle" font-size="14.92990184281" fill="var(--ok-text)" font-family="Arial, sans-serif">Human approves</text>
  <text x="920" y="290.196078913303" text-anchor="middle" font-size="14.92990184281" fill="var(--ok-text)" font-family="Arial, sans-serif">Accept commit</text>

  <rect x="1060" y="40" width="180" height="272.941176219146" rx="6.398529361204" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="85.490196748943" text-anchor="middle" font-size="19.195588083613" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Ship</text>
  <text x="1150" y="130.980392429258" text-anchor="middle" font-size="14.92990184281" fill="var(--danger-text)" font-family="Arial, sans-serif">CI gates</text>
  <text x="1150" y="176.470588109573" text-anchor="middle" font-size="14.92990184281" fill="var(--danger-text)" font-family="Arial, sans-serif">Merge PR</text>
  <text x="1150" y="221.960784858516" text-anchor="middle" font-size="14.92990184281" fill="var(--danger-text)" font-family="Arial, sans-serif">Deploy</text>
  <text x="1150" y="267.450980538831" text-anchor="middle" font-size="14.92990184281" fill="var(--danger-text)" font-family="Arial, sans-serif">Monitor</text>

  <rect x="40" y="347.058823780854" width="1200" height="272.941176219146" rx="6.398529361204" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="392.549019461169" text-anchor="middle" font-size="21.328431204015" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Feedback Loop</text>
  <text x="640" y="438.039216210111" text-anchor="middle" font-size="15.996322886139" fill="var(--text-muted)" font-family="Arial, sans-serif">Telemetry, user reports, postmortems flow back to Plan.</text>
  <text x="640" y="477.843137296809" text-anchor="middle" font-size="15.996322886139" fill="var(--text-muted)" font-family="Arial, sans-serif">Each turn is shorter when AI handles boilerplate.</text>
  <text x="640" y="517.647058383506" text-anchor="middle" font-size="15.996322886139" fill="var(--text-muted)" font-family="Arial, sans-serif">Humans stay on the path: intent, review, accountability.</text>
  <text x="640" y="557.450980538831" text-anchor="middle" font-size="15.996322886139" fill="var(--text-muted)" font-family="Arial, sans-serif">Small batches keep diffs reviewable.</text>
  <text x="640" y="597.254901625529" text-anchor="middle" font-size="15.996322886139" fill="var(--text-muted)" font-family="Arial, sans-serif">Tight loops compound over time.</text>

  <line x1="270" y1="176.470588109573" x2="295" y2="176.470588109573" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="525" y1="176.470588109573" x2="550" y2="176.470588109573" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="176.470588109573" x2="805" y2="176.470588109573" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1035" y1="176.470588109573" x2="1060" y2="176.470588109573" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

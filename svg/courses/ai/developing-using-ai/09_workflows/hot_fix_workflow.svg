  <circle cx="447.4074" cy="330" r="44.4444" fill="var(--warn-fill)" />
  <text x="447.4074" y="338.3333" text-anchor="middle" fill="var(--bg)" font-size="16.2963">Diagnose</text>
  <path d="M 491.8518 330 L 580.7407 330" stroke="var(--bg)" stroke-width="2.1333" marker-end="url(#h2)" />
  <circle cx="625.1851" cy="330" r="44.4444" fill="var(--primary-fill)" />
  <text x="625.1851" y="338.3333" text-anchor="middle" fill="var(--bg)" font-size="16.2963">Fix</text>
  <path d="M 669.6296 330 L 758.5185 330" stroke="var(--bg)" stroke-width="2.1333" marker-end="url(#h3)" />
  <circle cx="802.9629" cy="330" r="44.4444" fill="var(--info-fill)" />
  <text x="802.9629" y="338.3333" text-anchor="middle" fill="var(--bg)" font-size="16.2963">Test</text>
  <path d="M 847.4074 330 L 936.2962 330" stroke="var(--bg)" stroke-width="2.1333" marker-end="url(#h4)" />
  <circle cx="980.7407" cy="330" r="44.4444" fill="var(--ok-fill)" />
  <text x="980.7407" y="338.3333" text-anchor="middle" fill="var(--bg)" font-size="16.2963">Deploy</text>
  <text x="269.6296" y="430" text-anchor="middle" fill="var(--bg)" font-size="14.8149">5 min</text>
  <text x="447.4074" y="430" text-anchor="middle" fill="var(--bg)" font-size="14.8149">10 min</text>
  <text x="625.1851" y="430" text-anchor="middle" fill="var(--bg)" font-size="14.8149">15 min</text>
  <text x="802.9629" y="430" text-anchor="middle" fill="var(--bg)" font-size="14.8149">10 min</text>
  <text x="980.7407" y="430" text-anchor="middle" fill="var(--bg)" font-size="14.8149">5 min</text>
  <text x="640" y="513.3333" text-anchor="middle" fill="var(--bg)" font-size="17.7778">Target: &lt; 45 minutes total</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="h1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 8,0" fill="white" />
    </marker>
    <marker id="h2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 8,0" fill="white" />
    </marker>
    <marker id="h3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 8,0" fill="white" />
    </marker>
    <marker id="h4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 8,0" fill="white" />
    </marker>

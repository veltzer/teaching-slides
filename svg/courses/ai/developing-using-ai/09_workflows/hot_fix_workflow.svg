<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="106.6667" y="60" width="640" height="360" fill="var(--text)" rx="6" />
  <text x="426.6667" y="96" text-anchor="middle" fill="var(--bg)" font-size="19.2" font-weight="bold">Hotfix Process</text>
  <circle cx="160" cy="240" r="32" fill="var(--danger-fill)" />
  <text x="160" y="246" text-anchor="middle" fill="var(--bg)" font-size="11.7333">Alert</text>
  <path d="M 192 240 L 256 240" stroke="var(--bg)" stroke-width="2.1333" marker-end="url(#h1)" />
  <circle cx="288" cy="240" r="32" fill="var(--warn-fill)" />
  <text x="288" y="246" text-anchor="middle" fill="var(--bg)" font-size="11.7333">Diagnose</text>
  <path d="M 320 240 L 384 240" stroke="var(--bg)" stroke-width="2.1333" marker-end="url(#h2)" />
  <circle cx="416" cy="240" r="32" fill="var(--primary-fill)" />
  <text x="416" y="246" text-anchor="middle" fill="var(--bg)" font-size="11.7333">Fix</text>
  <path d="M 448 240 L 512 240" stroke="var(--bg)" stroke-width="2.1333" marker-end="url(#h3)" />
  <circle cx="544" cy="240" r="32" fill="var(--info-fill)" />
  <text x="544" y="246" text-anchor="middle" fill="var(--bg)" font-size="11.7333">Test</text>
  <path d="M 576 240 L 640 240" stroke="var(--bg)" stroke-width="2.1333" marker-end="url(#h4)" />
  <circle cx="672" cy="240" r="32" fill="var(--ok-fill)" />
  <text x="672" y="246" text-anchor="middle" fill="var(--bg)" font-size="11.7333">Deploy</text>
  <text x="160" y="312" text-anchor="middle" fill="var(--bg)" font-size="10.6667">5 min</text>
  <text x="288" y="312" text-anchor="middle" fill="var(--bg)" font-size="10.6667">10 min</text>
  <text x="416" y="312" text-anchor="middle" fill="var(--bg)" font-size="10.6667">15 min</text>
  <text x="544" y="312" text-anchor="middle" fill="var(--bg)" font-size="10.6667">10 min</text>
  <text x="672" y="312" text-anchor="middle" fill="var(--bg)" font-size="10.6667">5 min</text>
  <text x="426.6667" y="372" text-anchor="middle" fill="var(--bg)" font-size="12.8">Target: &lt; 45 minutes total</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="h1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 8,0" fill="white" />
    </marker>
    <marker id="h2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 8,0" fill="white" />
    </marker>
    <marker id="h3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 8,0" fill="white" />
    </marker>
    <marker id="h4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 8,0" fill="white" />
    </marker>
  </defs>
</svg>
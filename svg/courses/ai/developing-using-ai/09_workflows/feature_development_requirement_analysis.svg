<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" fill="var(--text)" rx="6"/>
  <text x="639.9998" y="98.0002" text-anchor="middle" fill="var(--bg)" font-size="33.3706" font-weight="bold" font-family="Arial, sans-serif">Feature Development Flow</text>
  <rect x="140.0002" y="156.0002" width="300.0001" height="116.0002" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="289.9999" y="223.6669" text-anchor="middle" fill="var(--bg)" font-size="22.247" font-family="Arial, sans-serif">Requirements</text>
  <path d="M 439.9999 214.0002 L 539.9998 214.0002" stroke="var(--bg)" stroke-width="1.2823" marker-end="url(#arrow)"/>
  <rect x="539.9998" y="156.0002" width="300.0001" height="116.0002" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="690" y="223.6669" text-anchor="middle" fill="var(--bg)" font-size="22.247" font-family="Arial, sans-serif">Design</text>
  <path d="M 839.9999 214.0002 L 939.9999 214.0002" stroke="var(--bg)" stroke-width="1.2823" marker-end="url(#arrow)"/>
  <rect x="939.9999" y="156.0002" width="259.9998" height="116.0002" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="223.6669" text-anchor="middle" fill="var(--bg)" font-size="22.247" font-family="Arial, sans-serif">Implement</text>
  <rect x="239.9999" y="368.6669" width="240.0001" height="116.0002" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="436.3336" text-anchor="middle" fill="var(--bg)" font-size="22.247" font-family="Arial, sans-serif">Test</text>
  <rect x="539.9998" y="368.6669" width="240.0001" height="116.0002" fill="url(#grad-info)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="659.9999" y="436.3336" text-anchor="middle" fill="var(--bg)" font-size="22.247" font-family="Arial, sans-serif">Review</text>
  <rect x="839.9999" y="368.6669" width="240.0001" height="116.0002" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="436.3336" text-anchor="middle" fill="var(--bg)" font-size="22.247" font-family="Arial, sans-serif">Deploy</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="606.037550017712" y="40" text-anchor="middle" fill="var(--bg)" font-size="43.485784228425" font-weight="bold" font-family="Arial, sans-serif">Feature Development Flow</text>
  <rect x="40" y="126.999947500032" width="339.622914916469" height="174.000194999882" fill="url(#grad-primary)" rx="7.818699854679" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.811061231633" y="228.499936250039" text-anchor="middle" fill="var(--bg)" font-size="28.990435944507" font-family="Arial, sans-serif">Requirements</text>
  <path d="M 379.622462086067 213.999895000063 L 492.829949448089 213.999895000063" stroke="var(--bg)" stroke-width="1.2823" marker-end="url(#arrow)"/>
  <rect x="492.829949448089" y="126.999947500032" width="339.622914916469" height="174.000194999882" fill="url(#grad-ok)" rx="7.818699854679" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="195.5556" y="80" width="888.8888" height="500" fill="var(--text)" rx="7.6389" />
  <text x="640" y="130.0001" text-anchor="middle" fill="var(--bg)" font-size="26.6667" font-weight="bold">Feature Development Flow</text>
  <rect x="269.6298" y="180.0001" width="222.2223" height="100.0001" fill="var(--primary-fill)" rx="7.6389" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="380.7408" y="238.3334" text-anchor="middle" fill="var(--bg)" font-size="17.7777">Requirements</text>
  <path d="M 491.8519 230 L 565.926 230" stroke="var(--bg)" stroke-width="2.3273" marker-end="url(#f1)" />
  <rect x="565.926" y="180.0001" width="222.2223" height="100.0001" fill="var(--ok-fill)" rx="7.6389" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="677.0372" y="238.3334" text-anchor="middle" fill="var(--bg)" font-size="17.7777">Design</text>
  <path d="M 788.1482 230 L 862.2223 230" stroke="var(--bg)" stroke-width="2.3273" marker-end="url(#f2)" />
  <rect x="862.2223" y="180.0001" width="192.5925" height="100.0001" fill="var(--danger-fill)" rx="7.6389" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="958.5186" y="238.3334" text-anchor="middle" fill="var(--bg)" font-size="17.7777">Implement</text>
  <rect x="343.7038" y="363.3334" width="177.7778" height="100.0001" fill="var(--warn-fill)" rx="7.6389" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="432.5927" y="421.6667" text-anchor="middle" fill="var(--bg)" font-size="17.7777">Test</text>
  <rect x="565.926" y="363.3334" width="177.7778" height="100.0001" fill="var(--info-fill)" rx="7.6389" stroke="var(--info-border)" stroke-width="2"/>
  <text x="654.8149" y="421.6667" text-anchor="middle" fill="var(--bg)" font-size="17.7777">Review</text>
  <rect x="788.1482" y="363.3334" width="177.7778" height="100.0001" fill="var(--ok-fill)" rx="7.6389" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="877.0371" y="421.6667" text-anchor="middle" fill="var(--bg)" font-size="17.7777">Deploy</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="f1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 8,0" fill="white" />
    </marker>
    <marker id="f2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 8,0" fill="white" />
    </marker>
  </defs>
</svg>
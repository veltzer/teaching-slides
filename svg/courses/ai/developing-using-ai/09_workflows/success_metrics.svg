<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <rect x="160" y="90" width="960" height="540" fill="#333333" rx="16" />
  <text x="640" y="144" text-anchor="middle" fill="white" font-size="28.8" font-weight="bold">Project Success Metrics</text>
  <rect x="240" y="198" width="240" height="126" fill="#3498DB" rx="8" />
  <text x="360" y="243" text-anchor="middle" fill="white" font-size="19.2">Velocity</text>
  <text x="360" y="279" text-anchor="middle" fill="white" font-size="25.6">↑ 40%</text>
  <text x="360" y="306" text-anchor="middle" fill="white" font-size="16">with AI</text>
  <rect x="520" y="198" width="240" height="126" fill="#27AE60" rx="8" />
  <text x="640" y="243" text-anchor="middle" fill="white" font-size="19.2">Bug Rate</text>
  <text x="640" y="279" text-anchor="middle" fill="white" font-size="25.6">↓ 65%</text>
  <text x="640" y="306" text-anchor="middle" fill="white" font-size="16">reduction</text>
  <rect x="800" y="198" width="240" height="126" fill="#F39C12" rx="8" />
  <text x="920" y="243" text-anchor="middle" fill="white" font-size="19.2">Deploy Freq</text>
  <text x="920" y="279" text-anchor="middle" fill="white" font-size="25.6">3x</text>
  <text x="920" y="306" text-anchor="middle" fill="white" font-size="16">per week</text>
  <rect x="240" y="360" width="240" height="126" fill="#E74C3C" rx="8" />
  <text x="360" y="405" text-anchor="middle" fill="white" font-size="19.2">MTTR</text>
  <text x="360" y="441" text-anchor="middle" fill="white" font-size="25.6">45 min</text>
  <text x="360" y="468" text-anchor="middle" fill="white" font-size="16">recovery</text>
  <rect x="520" y="360" width="240" height="126" fill="#9B59B6" rx="8" />
  <text x="640" y="405" text-anchor="middle" fill="white" font-size="19.2">Coverage</text>
  <text x="640" y="441" text-anchor="middle" fill="white" font-size="25.6">92%</text>
  <text x="640" y="468" text-anchor="middle" fill="white" font-size="16">test coverage</text>
  <rect x="800" y="360" width="240" height="126" fill="#2ecc71" rx="8" />
  <text x="920" y="405" text-anchor="middle" fill="white" font-size="19.2">Satisfaction</text>
  <text x="920" y="441" text-anchor="middle" fill="white" font-size="25.6">4.8/5</text>
  <text x="920" y="468" text-anchor="middle" fill="white" font-size="16">team rating</text>
</svg>
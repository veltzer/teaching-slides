<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" fill="var(--bg)" font-size="45.934446216346" font-weight="bold" font-family="Arial, sans-serif">Project Success Metrics</text>
  <rect x="40" y="131.578955678671" width="360" height="213.684177285316" fill="url(#grad-primary)" rx="8.258966794066" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="220" y="207.89469944598" text-anchor="middle" fill="var(--bg)" font-size="30.623010027379" font-family="Arial, sans-serif">Velocity</text>
  <text x="220" y="268.947389196678" text-anchor="middle" fill="var(--bg)" font-size="40.830680036506" font-family="Arial, sans-serif">↑ 40%</text>
  <text x="220" y="314.736867036013" text-anchor="middle" fill="var(--bg)" font-size="25.519106198093" font-family="Arial, sans-serif">with AI</text>
  <rect x="460" y="131.578955678671" width="360" height="213.684177285316" fill="url(#grad-ok)" rx="8.258966794066" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="207.89469944598" text-anchor="middle" fill="var(--bg)" font-size="30.623010027379" font-family="Arial, sans-serif">Bug Rate</text>
  <text x="640" y="268.947389196678" text-anchor="middle" fill="var(--bg)" font-size="40.830680036506" font-family="Arial, sans-serif">↓ 65%</text>
  <text x="640" y="314.736867036013" text-anchor="middle" fill="var(--bg)" font-size="25.519106198093" font-family="Arial, sans-serif">reduction</text>
  <rect x="880" y="131.578955678671" width="360" height="213.684177285316" fill="url(#grad-warn)" rx="8.258966794066" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1060" y="207.89469944598" text-anchor="middle" fill="var(--bg)" font-size="30.623010027379" font-family="Arial, sans-serif">Deploy Freq</text>
  <text x="1060" y="268.947389196678" text-anchor="middle" fill="var(--bg)" font-size="40.830680036506" font-family="Arial, sans-serif">3x</text>
  <text x="1060" y="314.736867036013" text-anchor="middle" fill="var(--bg)" font-size="25.519106198093" font-family="Arial, sans-serif">per week</text>
  <rect x="40" y="406.315822714684" width="360" height="213.684177285316" fill="url(#grad-danger)" rx="8.258966794066" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="220" y="482.631566481993" text-anchor="middle" fill="var(--bg)" font-size="30.623010027379" font-family="Arial, sans-serif">MTTR</text>
  <text x="220" y="543.684256232691" text-anchor="middle" fill="var(--bg)" font-size="40.830680036506" font-family="Arial, sans-serif">45 min</text>
  <text x="220" y="589.473734072027" text-anchor="middle" fill="var(--bg)" font-size="25.519106198093" font-family="Arial, sans-serif">recovery</text>
  <rect x="460" y="406.315822714684" width="360" height="213.684177285316" fill="url(#grad-info)" rx="8.258966794066" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="482.631566481993" text-anchor="middle" fill="var(--bg)" font-size="30.623010027379" font-family="Arial, sans-serif">Coverage</text>
  <text x="640" y="543.684256232691" text-anchor="middle" fill="var(--bg)" font-size="40.830680036506" font-family="Arial, sans-serif">92%</text>
  <text x="640" y="589.473734072027" text-anchor="middle" fill="var(--bg)" font-size="25.519106198093" font-family="Arial, sans-serif">test coverage</text>
  <rect x="880" y="406.315822714684" width="360" height="213.684177285316" fill="url(#grad-ok)" rx="8.258966794066" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1060" y="482.631566481993" text-anchor="middle" fill="var(--bg)" font-size="30.623010027379" font-family="Arial, sans-serif">Satisfaction</text>
  <text x="1060" y="543.684256232691" text-anchor="middle" fill="var(--bg)" font-size="40.830680036506" font-family="Arial, sans-serif">4.8/5</text>
  <text x="1060" y="589.473734072027" text-anchor="middle" fill="var(--bg)" font-size="25.519106198093" font-family="Arial, sans-serif">team rating</text>
</svg>

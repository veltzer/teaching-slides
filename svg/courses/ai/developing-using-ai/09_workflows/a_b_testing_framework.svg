<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="585.454545454545" y="40" text-anchor="middle" fill="var(--bg)" font-size="39.806591203358" font-weight="bold" font-family="Arial, sans-serif">A/B Test: New Checkout Flow</text>
  <rect x="40" y="140.869514177698" width="545.454545454545" height="252.17385066163" fill="url(#grad-primary)" rx="7.157184684128" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312.727272727273" y="216.521682419664" text-anchor="middle" fill="var(--bg)" font-size="30.960668793011" font-family="Arial, sans-serif">Version A (Control)</text>
  <text x="312.727272727273" y="279.565242911151" text-anchor="middle" fill="var(--bg)" font-size="26.537767231043" font-family="Arial, sans-serif">50% of users</text>
  <text x="312.727272727273" y="342.608672967866" text-anchor="middle" fill="var(--bg)" font-size="24.326316450059" font-family="Arial, sans-serif">Conversion: 3.2%</text>
  <rect x="694.545454545455" y="140.869514177698" width="545.454545454545" height="252.17385066163" fill="url(#grad-ok)" rx="7.157184684128" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="967.272727272727" y="216.521682419664" text-anchor="middle" fill="var(--bg)" font-size="30.960668793011" font-family="Arial, sans-serif">Version B (New)</text>
  <text x="967.272727272727" y="279.565242911151" text-anchor="middle" fill="var(--bg)" font-size="26.537767231043" font-family="Arial, sans-serif">50% of users</text>
  <text x="967.272727272727" y="342.608672967866" text-anchor="middle" fill="var(--bg)" font-size="24.326316450059" font-family="Arial, sans-serif">Conversion: 4.1%</text>
  <rect x="258.181818181818" y="468.695663516067" width="654.545454545455" height="151.304336483933" fill="url(#grad-danger)" rx="7.157184684128" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="585.454545454545" y="531.739093572782" text-anchor="middle" fill="var(--bg)" font-size="26.537767231043" font-family="Arial, sans-serif">Result: 28% improvement</text>
  <text x="585.454545454545" y="582.173915879017" text-anchor="middle" fill="var(--bg)" font-size="24.326316450059" font-family="Arial, sans-serif">Statistical significance: 99.2%</text>
</svg>

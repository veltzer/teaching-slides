<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="370" height="454.901960826605" rx="6.398529432114" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="102.549019586697" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.726960526338" font-weight="bold" fill="var(--primary-text)">New Developer</text>
  <text x="225" y="170.784313387159" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--primary-text)">Joins the team</text>
  <text x="225" y="233.333332973856" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--primary-text)">Unfamiliar codebase</text>
  <text x="225" y="295.882352560554" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--primary-text)">No project context</text>
  <text x="225" y="358.431372147251" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--primary-text)">Steep learning curve</text>
  <text x="225" y="420.980391733948" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--primary-text)">Needs guidance</text>

  <rect x="455" y="40" width="370" height="454.901960826605" rx="6.398529432114" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="102.549019586697" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.726960526338" font-weight="bold" fill="var(--info-text)">AI Mentor</text>
  <text x="640" y="170.784313387159" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--info-text)">Explains code on demand</text>
  <text x="640" y="233.333332973856" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--info-text)">Answers without judgement</text>
  <text x="640" y="295.882352560554" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--info-text)">Available 24/7</text>
  <text x="640" y="358.431372147251" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--info-text)">Walks through modules</text>
  <text x="640" y="420.980391733948" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--info-text)">Surfaces conventions</text>

  <rect x="870" y="40" width="370" height="454.901960826605" rx="6.398529432114" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="102.549019586697" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.726960526338" font-weight="bold" fill="var(--ok-text)">Team Integration</text>
  <text x="1055" y="170.784313387159" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--ok-text)">Ships first PR in days</text>
  <text x="1055" y="233.333332973856" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--ok-text)">Reduces senior load</text>
  <text x="1055" y="295.882352560554" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--ok-text)">Builds confidence fast</text>
  <text x="1055" y="358.431372147251" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--ok-text)">Owns features early</text>
  <text x="1055" y="420.980391733948" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--ok-text)">Productive in weeks</text>

  <line x1="410" y1="267.450980413303" x2="455" y2="267.450980413303" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="825" y1="267.450980413303" x2="870" y2="267.450980413303" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="40" y="517.647058760092" width="1200" height="102.352941239908" rx="6.398529432114" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="557.450980413303" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" font-weight="bold" fill="var(--text)">Weeks, not months</text>
  <text x="640" y="591.568627852749" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--text-muted)">AI shortens the path from first commit to confident contributor</text>
</svg>

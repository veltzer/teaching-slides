<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640.000055" y="40" text-anchor="middle" font-size="82.802244" font-weight="bold">AI-Enhanced Code Review Process</text>
  <rect x="40" y="303.636225" width="285.714343" height="316.363775" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="12.269695" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.857172" y="514.545283" text-anchor="middle" font-size="51.75153">Pre-Review AI Check</text>
  <rect x="382.85719" y="303.636225" width="285.714343" height="316.363775" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="12.269695" stroke-width="2" filter="url(#shadow)"/>
  <text x="525.714361" y="514.545283" text-anchor="middle" font-size="51.75153">Human Review</text>
  <rect x="725.71438" y="303.636225" width="285.714343" height="316.363775" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="12.269695" stroke-width="2" filter="url(#shadow)"/>
  <text x="868.571551" y="514.545283" text-anchor="middle" font-size="51.75153">AI Suggestions</text>
  <rect x="1068.57146" y="303.636225" width="171.42854" height="316.363775" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="12.269695" stroke-width="2" filter="url(#shadow)"/>
  <text x="1154.285785" y="514.545283" text-anchor="middle" font-size="51.75153">Merge</text>
  <line x1="325.714343" y1="461.818116" x2="382.85719" y2="461.818116" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="668.571533" y1="461.818116" x2="725.71438" y2="461.818116" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1011.428613" y1="461.818116" x2="1068.57146" y2="461.818116" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 8.96,0" fill="#666" />
    </marker>
  </defs>
</svg>
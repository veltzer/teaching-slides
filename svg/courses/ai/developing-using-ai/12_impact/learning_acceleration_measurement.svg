<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999824" y="40" text-anchor="middle" font-size="60.934993" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Learning Acceleration Metrics</text>
  <rect x="40" y="166.086854" width="352.941211" height="176.521909" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="8.141963" stroke-width="2" filter="url(#shadow)"/>
  <text x="216.470488" y="241.738967" text-anchor="middle" font-size="38.084303" font-family="Arial, sans-serif" fill="var(--ok-text)">Skill Acquisition</text>
  <text x="216.470488" y="307.304351" text-anchor="middle" font-size="41.892706" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">2.3x faster</text>
  <rect x="463.529336" y="166.086854" width="352.941211" height="176.521909" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="8.141963" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999824" y="241.738967" text-anchor="middle" font-size="38.084303" font-family="Arial, sans-serif" fill="var(--primary-text)">Knowledge Transfer</text>
  <text x="639.999824" y="307.304351" text-anchor="middle" font-size="41.892706" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">65% improvement</text>
  <rect x="887.058789" y="166.086854" width="352.941211" height="176.521909" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="8.141963" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.529277" y="241.738967" text-anchor="middle" font-size="38.084303" font-family="Arial, sans-serif" fill="var(--warn-text)">Onboarding Time</text>
  <text x="1063.529277" y="307.304351" text-anchor="middle" font-size="41.892706" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">-45% time</text>
  <rect x="251.764609" y="443.478091" width="423.529453" height="176.521909" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="8.141963" stroke-width="2" filter="url(#shadow)"/>
  <text x="463.529336" y="519.13036" text-anchor="middle" font-size="38.084303" font-family="Arial, sans-serif" fill="var(--danger-text)">Problem Solving</text>
  <text x="463.529336" y="584.695743" text-anchor="middle" font-size="41.892706" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">40% faster</text>
  <rect x="745.882304" y="443.478091" width="423.529453" height="176.521909" fill="url(#grad-info)" stroke="var(--info-border)" rx="8.141963" stroke-width="2" filter="url(#shadow)"/>
  <text x="957.646913" y="519.13036" text-anchor="middle" font-size="38.084303" font-family="Arial, sans-serif" fill="var(--info-text)">Technical Competency</text>
  <text x="957.646913" y="584.695743" text-anchor="middle" font-size="41.892706" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">+2.1 levels</text>
</svg>

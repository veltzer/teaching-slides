<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="709.230686" y="40" text-anchor="middle" font-size="62.190084" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Productivity Measurement Dashboard</text>
  <rect x="40" y="122.857091" width="553.846164" height="132.571274" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="7.625866" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.92288" y="172.571394" text-anchor="middle" font-size="38.868786" font-family="Arial, sans-serif" fill="var(--primary-text)">Development Velocity</text>
  <text x="316.92288" y="215.657139" text-anchor="middle" font-size="46.642468" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">+35%</text>
  <rect x="686.153836" y="122.857091" width="553.846164" height="132.571274" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="7.625866" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.076851" y="172.571394" text-anchor="middle" font-size="38.868786" font-family="Arial, sans-serif" fill="var(--ok-text)">Task Completion</text>
  <text x="963.076851" y="215.657139" text-anchor="middle" font-size="46.642468" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">-25% time</text>
  <rect x="40" y="321.714183" width="553.846164" height="132.571274" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="7.625866" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.92288" y="371.428486" text-anchor="middle" font-size="38.868786" font-family="Arial, sans-serif" fill="var(--warn-text)">Code Generation</text>
  <text x="316.92288" y="414.514231" text-anchor="middle" font-size="46.642468" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">3x faster</text>
  <rect x="686.153836" y="321.714183" width="553.846164" height="132.571274" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="7.625866" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.076851" y="371.428486" text-anchor="middle" font-size="38.868786" font-family="Arial, sans-serif" fill="var(--danger-text)">Debugging Time</text>
  <text x="963.076851" y="414.514231" text-anchor="middle" font-size="46.642468" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">-40%</text>
  <rect x="363.076985" y="520.571394" width="553.846164" height="99.428606" fill="url(#grad-info)" stroke="var(--info-border)" rx="7.625866" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999865" y="580.228414" text-anchor="middle" font-size="42.755691" font-family="Arial, sans-serif" fill="var(--info-text)">Overall ROI: 280%</text>
</svg>
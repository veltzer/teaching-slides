<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="709.230686" y="40" text-anchor="middle" font-size="62.190084" font-weight="bold">Productivity Measurement Dashboard</text>
  <rect x="40" y="122.857091" width="553.846164" height="132.571274" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="7.625866" stroke-width="2"/>
  <text x="316.92288" y="172.571394" text-anchor="middle" font-size="38.868786">Development Velocity</text>
  <text x="316.92288" y="215.657139" text-anchor="middle" font-size="46.642468" font-weight="bold">+35%</text>
  <rect x="686.153836" y="122.857091" width="553.846164" height="132.571274" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="7.625866" stroke-width="2"/>
  <text x="963.076851" y="172.571394" text-anchor="middle" font-size="38.868786">Task Completion</text>
  <text x="963.076851" y="215.657139" text-anchor="middle" font-size="46.642468" font-weight="bold">-25% time</text>
  <rect x="40" y="321.714183" width="553.846164" height="132.571274" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="7.625866" stroke-width="2"/>
  <text x="316.92288" y="371.428486" text-anchor="middle" font-size="38.868786">Code Generation</text>
  <text x="316.92288" y="414.514231" text-anchor="middle" font-size="46.642468" font-weight="bold">3x faster</text>
  <rect x="686.153836" y="321.714183" width="553.846164" height="132.571274" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="7.625866" stroke-width="2"/>
  <text x="963.076851" y="371.428486" text-anchor="middle" font-size="38.868786">Debugging Time</text>
  <text x="963.076851" y="414.514231" text-anchor="middle" font-size="46.642468" font-weight="bold">-40%</text>
  <rect x="363.076985" y="520.571394" width="553.846164" height="99.428606" fill="var(--info-fill)" stroke="var(--info-border)" rx="7.625866" stroke-width="2"/>
  <text x="639.999865" y="580.228414" text-anchor="middle" font-size="42.755691">Overall ROI: 280%</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="153.897398480377" width="229.138382" height="238.309676607232" rx="14.277451302183" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="154.569426" y="255.967488688363" text-anchor="middle" font-size="46.735963818395" font-family="Arial, sans-serif" fill="var(--ok-text)">Measure</text>
  <text x="154.569426" y="318.610435916503" text-anchor="middle" font-size="46.735963818395" font-family="Arial, sans-serif" fill="var(--ok-text)">Impact</text>
  <rect x="525.431809" y="40" width="229.138382" height="238.309676607232" rx="14.277451302183" fill="url(#grad-primary)" stroke="var(--primary-border)" filter="url(#shadow)"/>
  <text x="640.001" y="142.070780785826" text-anchor="middle" font-size="46.735963818395" font-family="Arial, sans-serif" fill="var(--primary-text)">Analyze</text>
  <text x="640.001" y="204.71372697394" text-anchor="middle" font-size="46.735963818395" font-family="Arial, sans-serif" fill="var(--primary-text)">Data</text>
  <rect x="1010.861618" y="153.897398480377" width="229.138382" height="238.309676607232" rx="14.277451302183" fill="url(#grad-warn)" stroke="var(--warn-border)" filter="url(#shadow)"/>
  <text x="1125.432574" y="255.967488688363" text-anchor="middle" font-size="46.735963818395" font-family="Arial, sans-serif" fill="var(--warn-text)">Optimize</text>
  <text x="1125.432574" y="318.610435916503" text-anchor="middle" font-size="46.735963818395" font-family="Arial, sans-serif" fill="var(--warn-text)">Usage</text>
  <rect x="525.431809" y="381.690323392769" width="229.138382" height="238.309676607232" rx="14.277451302183" fill="url(#grad-danger)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="640.001" y="483.760594565429" text-anchor="middle" font-size="46.735963818395" font-family="Arial, sans-serif" fill="var(--danger-text)">Implement</text>
  <text x="640.001" y="546.403538673489" text-anchor="middle" font-size="46.735963818395" font-family="Arial, sans-serif" fill="var(--danger-text)">Changes</text>
  <path d="M 251.655459 216.103695627888 Q 445.82837 102.207145809436 542.914686 159.155105590521" fill="none" stroke="var(--text-muted)" stroke-width="2.2388"/>
  <path d="M 737.087314 216.103695627888 Q 931.259944 216.103695627888 1028.346259 244.577520034414" fill="none" stroke="var(--text-muted)" stroke-width="2.2388"/>
  <path d="M 1076.889417 386.94821042756 Q 882.716223 557.79335028338 737.087314 500.84491729007" fill="none" stroke="var(--text-muted)" stroke-width="2.2388"/>
  <path d="M 542.914686 529.319213868794 Q 348.742056 557.79335028338 251.655459 358.473913848836" fill="none" stroke="var(--text-muted)" stroke-width="2.2388"/>
</svg>

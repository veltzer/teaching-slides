<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="101.5873" y="51.4286" width="711.1111" height="411.4286" fill="var(--surface)" stroke="var(--border)" rx="6" stroke-width="1"/>
  <text x="457.1429" y="115.7143" text-anchor="middle" font-size="32.5079" font-weight="bold">Continuous Improvement Cycle</text>
  <circle cx="253.9683" cy="231.4286" r="50.7936" fill="var(--ok-fill)" stroke="var(--ok-border)" />
  <text x="253.9683" y="223.7143" text-anchor="middle" font-size="20.3174">Measure</text>
  <text x="253.9683" y="252" text-anchor="middle" font-size="20.3174">Impact</text>
  <circle cx="457.1429" cy="180" r="50.7936" fill="var(--primary-fill)" stroke="var(--primary-border)" />
  <text x="457.1429" y="172.2857" text-anchor="middle" font-size="20.3174">Analyze</text>
  <text x="457.1429" y="200.5714" text-anchor="middle" font-size="20.3174">Data</text>
  <circle cx="660.3174" cy="231.4286" r="50.7936" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <text x="660.3174" y="223.7143" text-anchor="middle" font-size="20.3174">Optimize</text>
  <text x="660.3174" y="252" text-anchor="middle" font-size="20.3174">Usage</text>
  <circle cx="457.1429" cy="334.2857" r="50.7936" fill="var(--danger-fill)" stroke="var(--danger-border)" />
  <text x="457.1429" y="326.5714" text-anchor="middle" font-size="20.3174">Implement</text>
  <text x="457.1429" y="354.8571" text-anchor="middle" font-size="20.3174">Changes</text>
  <path d="M 294.6031 205.7143 Q 375.873 154.2857 416.5079 180" fill="none" stroke="var(--text-muted)" stroke-width="4.0635" />
  <path d="M 497.7778 205.7143 Q 579.0476 205.7143 619.6826 218.5714" fill="none" stroke="var(--text-muted)" stroke-width="4.0635" />
  <path d="M 640 282.8571 Q 558.7301 360 497.7778 334.2857" fill="none" stroke="var(--text-muted)" stroke-width="4.0635" />
  <path d="M 416.5079 347.1429 Q 335.2381 360 294.6031 270" fill="none" stroke="var(--text-muted)" stroke-width="4.0635" />
</svg>
  <text x="982.8571" y="282.8752" text-anchor="middle" font-size="31.337">Optimize</text>
  <text x="982.8571" y="322.7501" text-anchor="middle" font-size="31.337">Usage</text>
  <circle cx="640.0001" cy="438.7501" r="78.3424" fill="var(--danger-fill)" stroke="var(--danger-border)" />

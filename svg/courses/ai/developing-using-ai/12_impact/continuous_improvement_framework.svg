<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="207.9013" y="80" width="864.1975" height="500" fill="var(--surface)" stroke="var(--border)" rx="7.2917" stroke-width="1"/>
  <text x="640.0001" y="158.125" text-anchor="middle" font-size="39.5061" font-weight="bold">Continuous Improvement Cycle</text>
  <circle cx="393.0865" cy="298.75" r="61.7283" fill="var(--ok-fill)" stroke="var(--ok-border)" />
  <text x="393.0865" y="289.375" text-anchor="middle" font-size="24.6913">Measure</text>
  <text x="393.0865" y="323.7499" text-anchor="middle" font-size="24.6913">Impact</text>
  <circle cx="640.0001" cy="236.25" r="61.7283" fill="var(--primary-fill)" stroke="var(--primary-border)" />
  <text x="640.0001" y="226.8749" text-anchor="middle" font-size="24.6913">Analyze</text>
  <text x="640.0001" y="261.2499" text-anchor="middle" font-size="24.6913">Data</text>
  <circle cx="886.9135" cy="298.75" r="61.7283" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <text x="886.9135" y="289.375" text-anchor="middle" font-size="24.6913">Optimize</text>
  <text x="886.9135" y="323.7499" text-anchor="middle" font-size="24.6913">Usage</text>
  <circle cx="640.0001" cy="423.7499" r="61.7283" fill="var(--danger-fill)" stroke="var(--danger-border)" />
  <text x="640.0001" y="414.3749" text-anchor="middle" font-size="24.6913">Implement</text>
  <text x="640.0001" y="448.7499" text-anchor="middle" font-size="24.6913">Changes</text>
  <path d="M 442.4691 267.5 Q 541.2346 204.9999 590.6173 236.25" fill="none" stroke="var(--text-muted)" stroke-width="4.0635" />
  <path d="M 689.3827 267.5 Q 788.1481 267.5 837.5309 283.1249" fill="none" stroke="var(--text-muted)" stroke-width="4.0635" />
  <path d="M 862.2222 361.2499 Q 763.4567 454.9999 689.3827 423.7499" fill="none" stroke="var(--text-muted)" stroke-width="4.0635" />
  <path d="M 590.6173 439.375 Q 491.8519 454.9999 442.4691 345.6249" fill="none" stroke="var(--text-muted)" stroke-width="4.0635" />
</svg>
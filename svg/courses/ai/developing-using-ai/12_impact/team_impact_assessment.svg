<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.00015" y="54.452419" text-anchor="middle" font-size="59.834813" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Team Collaboration Impact</text>
  <rect x="40" y="87.8366" width="299.174" height="299.174" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="189.587034" y="220.789863" text-anchor="middle" font-size="37.396792" font-family="Arial, sans-serif" fill="var(--ok-text)">Knowledge</text>
  <text x="189.587034" y="264.037659" text-anchor="middle" font-size="37.396792" font-family="Arial, sans-serif" fill="var(--ok-text)">Sharing</text>
  <rect x="509.111" y="40" width="261.777" height="261.777" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" filter="url(#shadow)"/>
  <text x="640.00015" y="154.254982" text-anchor="middle" font-size="37.396792" font-family="Arial, sans-serif" fill="var(--primary-text)">Communication</text>
  <text x="640.00015" y="197.502657" text-anchor="middle" font-size="37.396792" font-family="Arial, sans-serif" fill="var(--primary-text)">Quality</text>
  <rect x="940.826" y="87.8366" width="299.174" height="299.174" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" filter="url(#shadow)"/>
  <text x="1090.412966" y="220.789863" text-anchor="middle" font-size="37.396792" font-family="Arial, sans-serif" fill="var(--warn-text)">Code Review</text>
  <text x="1090.412966" y="264.037659" text-anchor="middle" font-size="37.396792" font-family="Arial, sans-serif" fill="var(--warn-text)">Efficiency</text>
  <rect x="283.905" y="272.872" width="261.777" height="261.777" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="414.793667" y="387.12743" text-anchor="middle" font-size="37.396792" font-family="Arial, sans-serif" fill="var(--danger-text)">Onboarding</text>
  <text x="414.793667" y="430.375226" text-anchor="middle" font-size="37.396792" font-family="Arial, sans-serif" fill="var(--danger-text)">Speed</text>
  <rect x="734.318" y="272.872" width="261.777" height="261.777" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" filter="url(#shadow)"/>
  <text x="865.206632" y="387.12743" text-anchor="middle" font-size="37.396792" font-family="Arial, sans-serif" fill="var(--info-text)">Cross-Team</text>
  <text x="865.206632" y="430.375226" text-anchor="middle" font-size="37.396792" font-family="Arial, sans-serif" fill="var(--info-text)">Coordination</text>
  <rect x="189.587034" y="536.831277" width="900.825931" height="83.168723" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="8.068667" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.00015" y="593.385926" text-anchor="middle" font-size="41.136351" font-family="Arial, sans-serif" fill="var(--primary-text)">Overall Team Productivity: +42%</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.00015" y="54.452419" text-anchor="middle" font-size="59.834813" font-weight="bold">Team Collaboration Impact</text>
  <rect x="40" y="87.8366" width="299.174" height="299.174" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="189.587034" y="220.789863" text-anchor="middle" font-size="37.396792">Knowledge</text>
  <text x="189.587034" y="264.037659" text-anchor="middle" font-size="37.396792">Sharing</text>
  <rect x="509.111" y="40" width="261.777" height="261.777" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" filter="url(#shadow)"/>
  <text x="640.00015" y="154.254982" text-anchor="middle" font-size="37.396792">Communication</text>
  <text x="640.00015" y="197.502657" text-anchor="middle" font-size="37.396792">Quality</text>
  <rect x="940.826" y="87.8366" width="299.174" height="299.174" rx="14" fill="var(--warn-fill)" stroke="var(--warn-border)" filter="url(#shadow)"/>
  <text x="1090.412966" y="220.789863" text-anchor="middle" font-size="37.396792">Code Review</text>
  <text x="1090.412966" y="264.037659" text-anchor="middle" font-size="37.396792">Efficiency</text>
  <rect x="283.905" y="272.872" width="261.777" height="261.777" rx="14" fill="var(--danger-fill)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="414.793667" y="387.12743" text-anchor="middle" font-size="37.396792">Onboarding</text>
  <text x="414.793667" y="430.375226" text-anchor="middle" font-size="37.396792">Speed</text>
  <rect x="734.318" y="272.872" width="261.777" height="261.777" rx="14" fill="var(--info-fill)" stroke="var(--info-border)" filter="url(#shadow)"/>
  <text x="865.206632" y="387.12743" text-anchor="middle" font-size="37.396792">Cross-Team</text>
  <text x="865.206632" y="430.375226" text-anchor="middle" font-size="37.396792">Coordination</text>
  <rect x="189.587034" y="536.831277" width="900.825931" height="83.168723" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="8.068667" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.00015" y="593.385926" text-anchor="middle" font-size="41.136351">Overall Team Productivity: +42%</text>
</svg>
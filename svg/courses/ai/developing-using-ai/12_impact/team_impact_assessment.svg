<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="129.8551" y="55.6522" width="1038.8406" height="584.3478" fill="var(--surface)" stroke="var(--border)" rx="6" stroke-width="1"/>
  <text x="649.2754" y="125.2174" text-anchor="middle" font-size="41.5536" font-weight="bold">Team Collaboration Impact</text>
  <circle cx="389.5652" cy="278.2608" r="103.8841" fill="var(--ok-fill)" stroke="var(--ok-border)" />
  <text x="389.5652" y="264.3478" text-anchor="middle" font-size="25.971">Knowledge</text>
  <text x="389.5652" y="300.5217" text-anchor="middle" font-size="25.971">Sharing</text>
  <circle cx="649.2754" cy="222.6087" r="90.8986" fill="var(--primary-fill)" stroke="var(--primary-border)" />
  <text x="649.2754" y="208.6957" text-anchor="middle" font-size="25.971">Communication</text>
  <text x="649.2754" y="244.8696" text-anchor="middle" font-size="25.971">Quality</text>
  <circle cx="908.9855" cy="278.2608" r="103.8841" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <text x="908.9855" y="264.3478" text-anchor="middle" font-size="25.971">Code Review</text>
  <text x="908.9855" y="300.5217" text-anchor="middle" font-size="25.971">Efficiency</text>
  <circle cx="519.4203" cy="417.3913" r="90.8986" fill="var(--danger-fill)" stroke="var(--danger-border)" />
  <text x="519.4203" y="403.4783" text-anchor="middle" font-size="25.971">Onboarding</text>
  <text x="519.4203" y="439.6522" text-anchor="middle" font-size="25.971">Speed</text>
  <circle cx="779.1305" cy="417.3913" r="90.8986" fill="var(--info-fill)" stroke="var(--info-border)" />
  <text x="779.1305" y="403.4783" text-anchor="middle" font-size="25.971">Cross-Team</text>
  <text x="779.1305" y="439.6522" text-anchor="middle" font-size="25.971">Coordination</text>
  <rect x="389.5652" y="528.6957" width="519.4203" height="69.5652" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <text x="649.2754" y="576" text-anchor="middle" font-size="28.5681">Overall Team Productivity: +42%</text>
</svg>
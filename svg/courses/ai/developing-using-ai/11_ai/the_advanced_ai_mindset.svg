<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="182.146" width="295.708" height="295.708" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)"/>
  <text x="187.853881" y="309.92141" text-anchor="middle" font-size="36.963496">Strategic</text>
  <text x="187.853881" y="362.125584" text-anchor="middle" font-size="36.963496">Thinking</text>
  <rect x="510.628" y="40" width="258.744" height="258.744" rx="14" fill="var(--info-fill)" stroke="var(--info-border)"/>
  <text x="640" y="149.293594" text-anchor="middle" font-size="36.963496">Tool</text>
  <text x="640" y="201.497567" text-anchor="middle" font-size="36.963496">Orchestration</text>
  <rect x="510.628" y="361.256" width="258.744" height="258.744" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)"/>
  <text x="640" y="470.549427" text-anchor="middle" font-size="36.963496">Context</text>
  <text x="640" y="522.753699" text-anchor="middle" font-size="36.963496">Mastery</text>
  <rect x="944.292" y="182.146" width="295.708" height="295.708" rx="14" fill="var(--warn-fill)" stroke="var(--warn-border)"/>
  <text x="1092.146119" y="309.92141" text-anchor="middle" font-size="36.963496">Iterative</text>
  <text x="1092.146119" y="362.125584" text-anchor="middle" font-size="36.963496">Refinement</text>
  <line x1="360.100126" y1="330" x2="489.28466" y2="229.607452" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="360.100126" y1="330" x2="489.28466" y2="430.392548" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="790.71534" y1="229.607452" x2="919.899874" y2="330" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="790.71534" y1="430.392548" x2="919.899874" y2="330" stroke="var(--text-muted)" stroke-width="2" />
</svg>
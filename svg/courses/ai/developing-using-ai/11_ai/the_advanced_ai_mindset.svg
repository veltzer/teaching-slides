<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="182.146" width="295.708" height="295.708" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" filter="url(#shadow)"/>
  <text x="187.853881" y="309.92141" text-anchor="middle" font-size="36.963496" font-family="Arial, sans-serif" fill="var(--primary-text)">Strategic</text>
  <text x="187.853881" y="362.125584" text-anchor="middle" font-size="36.963496" font-family="Arial, sans-serif" fill="var(--primary-text)">Thinking</text>
  <rect x="510.628" y="40" width="258.744" height="258.744" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" filter="url(#shadow)"/>
  <text x="640" y="149.293594" text-anchor="middle" font-size="36.963496" font-family="Arial, sans-serif" fill="var(--info-text)">Tool</text>
  <text x="640" y="201.497567" text-anchor="middle" font-size="36.963496" font-family="Arial, sans-serif" fill="var(--info-text)">Orchestration</text>
  <rect x="510.628" y="361.256" width="258.744" height="258.744" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="640" y="470.549427" text-anchor="middle" font-size="36.963496" font-family="Arial, sans-serif" fill="var(--ok-text)">Context</text>
  <text x="640" y="522.753699" text-anchor="middle" font-size="36.963496" font-family="Arial, sans-serif" fill="var(--ok-text)">Mastery</text>
  <rect x="944.292" y="182.146" width="295.708" height="295.708" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" filter="url(#shadow)"/>
  <text x="1092.146119" y="309.92141" text-anchor="middle" font-size="36.963496" font-family="Arial, sans-serif" fill="var(--warn-text)">Iterative</text>
  <text x="1092.146119" y="362.125584" text-anchor="middle" font-size="36.963496" font-family="Arial, sans-serif" fill="var(--warn-text)">Refinement</text>
  <line x1="360.100126" y1="330" x2="489.28466" y2="229.607452" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="360.100126" y1="330" x2="489.28466" y2="430.392548" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="790.71534" y1="229.607452" x2="919.899874" y2="330" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="790.71534" y1="430.392548" x2="919.899874" y2="330" stroke="var(--text-muted)" stroke-width="2"/>
</svg>

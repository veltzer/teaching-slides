<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="225" height="204.705882352941" rx="8.531372323694" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152" y="85.490196078431" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--primary-text)">1. Prompt</text>
  <text x="152" y="142.352941176471" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">describe intent</text>
  <text x="152" y="176.470588235295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">share failing tests</text>
  <text x="152" y="210.588235294117" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">point at files</text>
  <line x1="265" y1="142.352941176471" x2="290" y2="142.352941176471" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="290" y="40" width="225" height="204.705882352941" rx="8.531372323694" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="402" y="85.490196078431" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--warn-text)">2. Generate</text>
  <text x="402" y="142.352941176471" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--warn-text)">draft code or plan</text>
  <text x="402" y="176.470588235295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--warn-text)">small diffs</text>
  <text x="402" y="210.588235294117" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--warn-text)">avoid rewrites</text>
  <line x1="515" y1="142.352941176471" x2="540" y2="142.352941176471" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="540" y="40" width="225" height="204.705882352941" rx="8.531372323694" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="652" y="85.490196078431" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--ok-text)">3. Run</text>
  <text x="652" y="142.352941176471" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">tests, linters</text>
  <text x="652" y="176.470588235295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">type checks</text>
  <text x="652" y="210.588235294117" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">capture output</text>
  <line x1="765" y1="142.352941176471" x2="790" y2="142.352941176471" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="790" y="40" width="225" height="204.705882352941" rx="8.531372323694" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="902" y="85.490196078431" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--info-text)">4. Review</text>
  <text x="902" y="142.352941176471" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--info-text)">read diff</text>
  <text x="902" y="176.470588235295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--info-text)">understand lines</text>
  <text x="902" y="210.588235294117" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--info-text)">reject scope creep</text>
  <line x1="1015" y1="142.352941176471" x2="1040" y2="142.352941176471" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1040" y="40" width="200" height="204.705882352941" rx="8.531372323694" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="85.490196078431" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--danger-text)">5. Refine</text>
  <text x="1140" y="142.352941176471" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--danger-text)">feed errors back</text>
  <text x="1140" y="176.470588235295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--danger-text)">narrow scope</text>
  <text x="1140" y="210.588235294117" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--danger-text)">commit green</text>

  <path d="M 1140 244.705882352941 Q 1140 324.313725490196 640 324.313725490196 Q 140 324.313725490196 140 244.705882352941" stroke="var(--text-muted)" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
  <text x="640" y="312.941176470588" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--text-muted)">loop</text>

  <rect x="40" y="358.431372549019" width="395" height="261.568627450981" rx="8.531372323694" fill="var(--surface)" stroke="var(--border)"/>
  <text x="237" y="398.235294117647" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--text)">Short Cycles</text>
  <text x="237" y="443.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">tiny changes verify fast</text>
  <text x="237" y="483.529411764706" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">long prompts drift</text>
  <text x="237" y="523.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">commit each green</text>
  <text x="237" y="563.137254901961" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">reset noisy context</text>

  <rect x="445" y="358.431372549019" width="395" height="261.568627450981" rx="8.531372323694" fill="var(--surface)" stroke="var(--border)"/>
  <text x="642" y="398.235294117647" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--text)">Verify, Don't Trust</text>
  <text x="642" y="443.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">run the code</text>
  <text x="642" y="483.529411764706" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">tests are the contract</text>
  <text x="642" y="523.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">read diff line by line</text>
  <text x="642" y="563.137254901961" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">delete what's unclear</text>

  <rect x="850" y="358.431372549019" width="390" height="261.568627450981" rx="8.531372323694" fill="var(--surface)" stroke="var(--border)"/>
  <text x="1045" y="398.235294117647" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--text)">Feed Context</text>
  <text x="1045" y="443.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">paste verbatim output</text>
  <text x="1045" y="483.529411764706" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">point to files</text>
  <text x="1045" y="523.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">name constraints</text>
  <text x="1045" y="563.137254901961" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--text-muted)">reject guesses</text>
</svg>

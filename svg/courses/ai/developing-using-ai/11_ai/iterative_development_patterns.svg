<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <circle cx="640" cy="330" r="247.678" fill="none" stroke="var(--text-muted)" stroke-width="4.129" />
  <circle cx="640" cy="141.9195" r="61.9195" fill="var(--warn-fill)" stroke="var(--warn-border)" />
  <text x="640" y="159.4737" text-anchor="middle" font-size="24.7677">Plan</text>
  <circle cx="887.678" cy="330" r="61.9195" fill="var(--ok-fill)" stroke="var(--ok-border)" />
  <text x="887.678" y="347.5542" text-anchor="middle" font-size="24.7677">Build</text>
  <circle cx="640" cy="518.0805" r="61.9195" fill="var(--primary-fill)" stroke="var(--primary-border)" />
  <text x="640" y="535.6347" text-anchor="middle" font-size="24.7677">Test</text>
  <circle cx="392.322" cy="330" r="61.9195" fill="var(--danger-fill)" stroke="var(--danger-border)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">AI-Driven Iterative Development</text>

  <rect x="40" y="110" width="225" height="180" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="152.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">1. Prompt</text>
  <text x="152.5" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Describe intent,</text>
  <text x="152.5" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">constraints, examples</text>
  <text x="152.5" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Share failing tests</text>
  <text x="152.5" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">and relevant files</text>

  <line x1="265" y1="200" x2="285" y2="200" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="110" width="225" height="180" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="402.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">2. Generate</text>
  <text x="402.5" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Model drafts code,</text>
  <text x="402.5" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">tests, or a plan</text>
  <text x="402.5" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Prefer small diffs</text>
  <text x="402.5" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">over full rewrites</text>

  <line x1="515" y1="200" x2="535" y2="200" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="110" width="225" height="180" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="652.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">3. Run</text>
  <text x="652.5" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Execute tests,</text>
  <text x="652.5" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">linters, type checks</text>
  <text x="652.5" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Capture exact</text>
  <text x="652.5" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">error output</text>

  <line x1="765" y1="200" x2="785" y2="200" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="790" y="110" width="225" height="180" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="902.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">4. Review</text>
  <text x="902.5" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Read the diff —</text>
  <text x="902.5" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">understand each line</text>
  <text x="902.5" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Reject silent</text>
  <text x="902.5" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">scope creep</text>

  <line x1="1015" y1="200" x2="1035" y2="200" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1040" y="110" width="200" height="180" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1140" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">5. Refine</text>
  <text x="1140" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Feed errors back,</text>
  <text x="1140" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">narrow the scope</text>
  <text x="1140" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Commit when</text>
  <text x="1140" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">green and readable</text>

  <path d="M 1140 290 Q 1140 370 640 370 Q 140 370 140 290" stroke="var(--text-muted)" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
  <text x="640" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">loop until tests pass and design fits</text>

  <rect x="40" y="395" width="395" height="225" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="237.5" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Keep cycles short</text>
  <text x="237.5" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Tiny changes are easy to verify</text>
  <text x="237.5" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Long prompts drift and hallucinate</text>
  <text x="237.5" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Commit at each green state</text>
  <text x="237.5" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Rollback is free; regret is not</text>
  <text x="237.5" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Reset context when it gets noisy</text>

  <rect x="445" y="395" width="395" height="225" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="642.5" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Verify, don't trust</text>
  <text x="642.5" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Run the code yourself — every time</text>
  <text x="642.5" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Tests are the contract, not the prose</text>
  <text x="642.5" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Read the diff line by line</text>
  <text x="642.5" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Ask for rationale when unsure</text>
  <text x="642.5" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Delete code you don't understand</text>

  <rect x="850" y="395" width="390" height="225" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1045" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Feed the loop context</text>
  <text x="1045" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Paste failing test output verbatim</text>
  <text x="1045" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Point at files, don't describe them</text>
  <text x="1045" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Name conventions and constraints</text>
  <text x="1045" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Share the runtime and version</text>
  <text x="1045" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Reject guesses; ask for reading first</text>
</svg>

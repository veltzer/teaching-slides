<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="259.459459" height="210.909135314045" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="7.980320793909" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.729622" y="119.090864685955" text-anchor="middle" font-size="36.573940775409" font-family="Arial, sans-serif" fill="var(--warn-text)">Session</text>
  <text x="169.729622" y="187.636509838001" text-anchor="middle" font-size="36.573940775409" font-family="Arial, sans-serif" fill="var(--warn-text)">Continuity</text>
  <rect x="364.324216" y="40" width="259.459459" height="210.909135314045" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="7.980320793909" stroke-width="2" filter="url(#shadow)"/>
  <text x="494.054054" y="119.090864685955" text-anchor="middle" font-size="36.573940775409" font-family="Arial, sans-serif" fill="var(--ok-text)">Context</text>
  <text x="494.054054" y="187.636509838001" text-anchor="middle" font-size="36.573940775409" font-family="Arial, sans-serif" fill="var(--ok-text)">Preservation</text>
  <rect x="688.648649" y="40" width="259.459459" height="210.909135314045" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="7.980320793909" stroke-width="2" filter="url(#shadow)"/>
  <text x="818.378378" y="119.090864685955" text-anchor="middle" font-size="36.573940775409" font-family="Arial, sans-serif" fill="var(--primary-text)">Information</text>
  <text x="818.378378" y="187.636509838001" text-anchor="middle" font-size="36.573940775409" font-family="Arial, sans-serif" fill="var(--primary-text)">Organization</text>
  <rect x="1012.972973" y="40" width="227.027027" height="210.909135314045" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="7.980320793909" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.486486" y="119.090864685955" text-anchor="middle" font-size="36.573940775409" font-family="Arial, sans-serif" fill="var(--danger-text)">Reference</text>
  <text x="1126.486486" y="187.636509838001" text-anchor="middle" font-size="36.573940775409" font-family="Arial, sans-serif" fill="var(--danger-text)">Management</text>
  <rect x="202.162162" y="356.363621971076" width="843.243243" height="263.636378028924" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="7.980320793909" stroke-width="2" filter="url(#shadow)"/>
  <text x="623.783676" y="461.81827062809" text-anchor="middle" font-size="43.88870234273" font-family="Arial, sans-serif" fill="var(--ok-text)">Long-term Development Context</text>
  <text x="623.783676" y="556.727537751212" text-anchor="middle" font-size="36.573940775409" font-family="Arial, sans-serif" fill="var(--ok-text)">Spanning multiple sessions and projects</text>
</svg>

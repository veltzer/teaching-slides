<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect x="49.9512" y="67.7561" width="218.5366" height="82.9756" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="1.2488" />
  <text x="159.2195" y="116.1586" text-anchor="middle" fill="var(--bg)" font-size="15.2976">1. Clear Context</text>
  <rect x="290.3415" y="67.7561" width="218.5366" height="82.9756" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="1.2488" />
  <text x="399.6098" y="116.1586" text-anchor="middle" fill="var(--bg)" font-size="15.2976">2. Specific Goals</text>
  <rect x="530.7317" y="67.7561" width="218.5366" height="82.9756" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="1.2488" />
  <text x="640" y="116.1586" text-anchor="middle" fill="var(--bg)" font-size="15.2976">3. Iterative Refinement</text>
  <rect x="49.9512" y="178.3902" width="218.5366" height="82.9756" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="1.2488" />
  <text x="159.2195" y="226.7927" text-anchor="middle" fill="var(--bg)" font-size="15.2976">4. Code Examples</text>
  <rect x="290.3415" y="178.3902" width="218.5366" height="82.9756" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="1.2488" />
  <text x="399.6098" y="226.7927" text-anchor="middle" fill="var(--bg)" font-size="15.2976">5. Validation</text>
  <rect x="530.7317" y="178.3902" width="218.5366" height="82.9756" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="1.2488" />
  <text x="640" y="226.7927" text-anchor="middle" fill="var(--bg)" font-size="15.2976">6. Documentation</text>
  <path d="M 159.2195 150.7318 L 159.2195 178.3902" stroke="var(--text-muted)" stroke-width="0.7797" />
  <path d="M 399.6098 150.7318 L 399.6098 178.3902" stroke="var(--text-muted)" stroke-width="0.7797" />
  <path d="M 640 150.7318 L 640 178.3902" stroke="var(--text-muted)" stroke-width="0.7797" />
  <text x="377.7561" y="344.3415" text-anchor="middle" font-size="19.6683" font-weight="bold">Structured Approach = Better Results</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="243.3334" width="171.4286" height="130" fill="var(--primary-fill)" rx="5.9959" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="125.7144" y="319.1667" text-anchor="middle" fill="var(--bg)" font-size="20.5573">Planning</text>
  <rect x="245.7143" y="243.3334" width="171.4286" height="130" fill="var(--ok-fill)" rx="5.9959" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="331.4286" y="319.1667" text-anchor="middle" fill="var(--bg)" font-size="20.5573">Design</text>
  <rect x="451.4286" y="243.3334" width="171.4286" height="130" fill="var(--danger-fill)" rx="5.9959" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="537.1429" y="319.1667" text-anchor="middle" fill="var(--bg)" font-size="20.5573">Code</text>
  <rect x="657.1428" y="243.3334" width="171.4286" height="130" fill="var(--warn-fill)" rx="5.9959" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="742.8572" y="319.1667" text-anchor="middle" fill="var(--bg)" font-size="20.5573">Test</text>
  <rect x="862.8571" y="243.3334" width="171.4286" height="130" fill="var(--info-fill)" rx="5.9959" stroke="var(--info-border)" stroke-width="2"/>
  <text x="948.5715" y="319.1667" text-anchor="middle" fill="var(--bg)" font-size="20.5573">Deploy</text>
  <rect x="1068.5714" y="243.3334" width="171.4286" height="130" fill="var(--ok-fill)" rx="5.9959" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1154.2858" y="319.1667" text-anchor="middle" fill="var(--bg)" font-size="20.5573">Monitor</text>
  <text x="640.0001" y="460" text-anchor="middle" font-size="27.4098" font-weight="bold">AI Chat Assists Every Phase</text>
  <text x="125.7144" y="200" text-anchor="middle" font-size="17.1311">Requirements</text>
  <text x="331.4286" y="200" text-anchor="middle" font-size="17.1311">Architecture</text>
  <text x="537.1429" y="200" text-anchor="middle" font-size="17.1311">Generation</text>
  <text x="742.8572" y="200" text-anchor="middle" font-size="17.1311">Validation</text>
  <text x="948.5715" y="200" text-anchor="middle" font-size="17.1311">Scripts</text>
  <text x="1154.2858" y="200" text-anchor="middle" font-size="17.1311">Debugging</text>
</svg>
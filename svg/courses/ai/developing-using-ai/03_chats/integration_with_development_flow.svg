<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="190" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Plan</text>
  <text x="135" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Define task</text>
  <text x="135" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Sketch approach</text>
  <text x="135" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Ask AI to critique</text>
  <text x="135" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Pick smallest slice</text>
  <text x="135" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">Chat opens in</text>
  <text x="135" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">the editor.</text>
  <text x="135" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="var(--primary-text)">1</text>

  <line x1="235" y1="330" x2="275" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="280" y="40" width="190" height="580" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="375" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Draft</text>
  <text x="375" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Share open file</text>
  <text x="375" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Paste context</text>
  <text x="375" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Get a first cut</text>
  <text x="375" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Apply as diff</text>
  <text x="375" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">Inline edits land</text>
  <text x="375" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">next to the code.</text>
  <text x="375" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="var(--info-text)">2</text>

  <line x1="475" y1="330" x2="515" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="520" y="40" width="190" height="580" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Run</text>
  <text x="615" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Save and build</text>
  <text x="615" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Run the tests</text>
  <text x="615" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Try the feature</text>
  <text x="615" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Capture errors</text>
  <text x="615" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">Feed failures</text>
  <text x="615" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">back to chat.</text>
  <text x="615" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="var(--warn-text)">3</text>

  <line x1="715" y1="330" x2="755" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="760" y="40" width="190" height="580" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="855" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Review</text>
  <text x="855" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Read every diff</text>
  <text x="855" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Question choices</text>
  <text x="855" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Reject bad code</text>
  <text x="855" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Refactor as you go</text>
  <text x="855" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-text)">You are still</text>
  <text x="855" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-text)">the author.</text>
  <text x="855" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="var(--danger-text)">4</text>

  <line x1="955" y1="330" x2="995" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1000" y="40" width="240" height="580" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Ship</text>
  <text x="1120" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Write commit note</text>
  <text x="1120" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Open pull request</text>
  <text x="1120" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Summarise chat decisions</text>
  <text x="1120" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Merge, deploy, observe</text>
  <text x="1120" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">The chat becomes</text>
  <text x="1120" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">a build artifact.</text>
  <text x="1120" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="var(--ok-text)">5</text>
</svg>

    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="144.4797" y="91.4286" width="866.8783" height="146.2857" fill="var(--text-dark)" rx="14.448" />
  <text x="577.9189" y="173.7143" text-anchor="middle" fill="var(--bg)" font-size="26.0063">Design Pattern Request</text>
  <rect x="144.4797" y="292.5714" width="260.0635" height="109.7143" fill="var(--primary-soft)" rx="7.224" />
  <text x="274.5115" y="356.5714" text-anchor="middle" fill="var(--bg)" font-size="20.2272">Singleton</text>
  <rect x="447.8871" y="292.5714" width="260.0635" height="109.7143" fill="var(--ok-vivid)" rx="7.224" />
  <text x="577.9189" y="356.5714" text-anchor="middle" fill="var(--bg)" font-size="20.2272">Observer</text>
  <rect x="751.2945" y="292.5714" width="260.0635" height="109.7143" fill="var(--danger-light)" rx="7.224" />
  <text x="881.3263" y="356.5714" text-anchor="middle" fill="var(--bg)" font-size="20.2272">Factory</text>
  <rect x="296.1834" y="457.1429" width="260.0635" height="109.7143" fill="var(--warn-gold)" rx="7.224" />
  <text x="426.2152" y="521.1429" text-anchor="middle" fill="var(--bg)" font-size="20.2272">Strategy</text>
  <rect x="599.5908" y="457.1429" width="260.0635" height="109.7143" fill="var(--info-soft)" rx="7.224" />
  <text x="729.6226" y="521.1429" text-anchor="middle" fill="var(--bg)" font-size="20.2272">Decorator</text>
  <text x="577.9189" y="640" text-anchor="middle" font-size="23.1168">AI provides implementations with use cases</text>

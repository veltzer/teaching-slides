<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="342.8571" height="580" fill="url(#grad-info)" rx="6.19677392375" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4286" y="117.333240888872" text-anchor="middle" fill="var(--bg)" font-size="25.89187720604" font-weight="bold" font-family="Arial, sans-serif">Redux</text>
  <text x="211.4286" y="175.333358222227" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✓ Predictable</text>
  <text x="211.4286" y="223.666700444451" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✓ DevTools</text>
  <text x="211.4286" y="271.999935999988" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✓ Middleware</text>
  <text x="211.4286" y="320.333278222212" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✗ Boilerplate</text>
  <text x="211.4286" y="368.666620444436" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✗ Learning curve</text>
  <rect x="468.5715" y="40" width="342.8571" height="580" fill="url(#grad-danger)" rx="6.19677392375" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="117.333240888872" text-anchor="middle" fill="var(--bg)" font-size="25.89187720604" font-weight="bold" font-family="Arial, sans-serif">MobX</text>
  <text x="640.0001" y="175.333358222227" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✓ Simple</text>
  <text x="640.0001" y="223.666700444451" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✓ Less code</text>
  <text x="640.0001" y="271.999935999988" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✓ Reactive</text>
  <text x="640.0001" y="320.333278222212" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✗ Magic</text>
  <text x="640.0001" y="368.666620444436" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✗ Debugging</text>
  <rect x="897.1429" y="40" width="342.8571" height="580" fill="url(#grad-ok)" rx="6.19677392375" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.5715" y="117.333240888872" text-anchor="middle" fill="var(--bg)" font-size="25.89187720604" font-weight="bold" font-family="Arial, sans-serif">Zustand</text>
  <text x="1068.5715" y="175.333358222227" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✓ Lightweight</text>
  <text x="1068.5715" y="223.666700444451" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✓ Simple API</text>
  <text x="1068.5715" y="271.999935999988" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✓ TypeScript</text>
  <text x="1068.5715" y="320.333278222212" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✗ Ecosystem</text>
  <text x="1068.5715" y="368.666620444436" text-anchor="middle" fill="var(--bg)" font-size="19.418933724421" font-family="Arial, sans-serif">✗ Patterns</text>
</svg>

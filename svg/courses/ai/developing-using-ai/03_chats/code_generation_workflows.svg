<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <circle cx="199.0937" cy="158.3834" r="78.3834" fill="var(--primary-fill)" />
  <text x="199.0937" y="170.7839" text-anchor="middle" fill="var(--bg)" font-size="27.4341">Spec</text>
  <path d="M 277.4771 158.3834 L 414.6479 158.3834" stroke="var(--text-muted)" stroke-width="2.1333" marker-end="url(#arrow)" />
  <circle cx="493.0312" cy="158.3834" r="78.3834" fill="var(--ok-fill)" />
  <text x="493.0312" y="170.7839" text-anchor="middle" fill="var(--bg)" font-size="27.4341">Generate</text>
  <path d="M 571.4146 158.3834 L 708.5854 158.3834" stroke="var(--text-muted)" stroke-width="2.1333" marker-end="url(#arrow)" />
  <circle cx="786.9688" cy="158.3834" r="78.3834" fill="var(--danger-fill)" />
  <text x="786.9688" y="170.7839" text-anchor="middle" fill="var(--bg)" font-size="27.4341">Test</text>
  <path d="M 865.3521 158.3834 L 1002.5229 158.3834" stroke="var(--text-muted)" stroke-width="2.1333" marker-end="url(#arrow)" />
  <circle cx="1080.9063" cy="158.3834" r="78.3834" fill="var(--warn-fill)" />
  <text x="1080.9063" y="170.7839" text-anchor="middle" fill="var(--bg)" font-size="27.4341">Refine</text>
  <path d="M 1080.9063 257.5873 Q 1080.9063 530.398 493.0312 530.398 Q 199.0937 530.398 199.0937 257.5873" stroke="var(--info-border)" stroke-width="2.1333" fill="none" marker-end="url(#arrow6)" />
  <text x="688.9896" y="580" text-anchor="middle" font-size="27.4341">Iterative Process</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#555555" />
    </marker>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#555555" />
    </marker>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#555555" />
    </marker>
    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="#9B59B6" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="181.491698" height="181.492" rx="13.999988" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="130.745749" y="145.1359" text-anchor="middle" fill="var(--bg)" font-size="31.760874" font-family="Arial, sans-serif">Spec</text>
  <path d="M 221.280198 130.7459 L 379.713934 130.7459" stroke="var(--text-muted)" stroke-width="0.7479" marker-end="url(#arrow)"/>
  <rect x="379.502434" y="40" width="181.491698" height="181.492" rx="13.999988" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="470.247983" y="145.1359" text-anchor="middle" fill="var(--bg)" font-size="31.760874" font-family="Arial, sans-serif">Generate</text>
  <path d="M 560.781832 130.7459 L 719.216168 130.7459" stroke="var(--text-muted)" stroke-width="0.7479" marker-end="url(#arrow)"/>
  <rect x="719.004868" y="40" width="181.491698" height="181.492" rx="13.999988" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="809.750217" y="145.1359" text-anchor="middle" fill="var(--bg)" font-size="31.760874" font-family="Arial, sans-serif">Test</text>
  <path d="M 900.284066 130.7459 L 1058.718002 130.7459" stroke="var(--text-muted)" stroke-width="0.7479" marker-end="url(#arrow)"/>
  <rect x="1058.508302" y="40" width="181.491698" height="181.492" rx="13.999988" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="1149.252251" y="145.1359" text-anchor="middle" fill="var(--bg)" font-size="31.760874" font-family="Arial, sans-serif">Refine</text>
  <path d="M 1149.252251 245.8644 Q 1149.252251 562.4408 470.247983 562.4408 Q 130.745749 562.4408 130.745749 245.8644" stroke="var(--info-border)" stroke-width="0.7479" fill="none" marker-end="url(#arrow)"/>
  <text x="696.582706" y="620" text-anchor="middle" font-size="31.760874" font-family="Arial, sans-serif" fill="var(--text)">Iterative Process</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

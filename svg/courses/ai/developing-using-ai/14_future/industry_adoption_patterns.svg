<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="130.6252" text-anchor="middle" font-size="50.1392" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">AI Adoption Maturity Curve</text>
  <path d="M 142.8571 475.0003 Q 382.8571 402.5003 622.8568 330.0003 Q 862.8571 257.5002 1102.8571 221.2501" fill="none" stroke="var(--primary-border)" stroke-width="2.3058"/>
  <rect x="117.787" y="449.93" width="50.1396" height="50.1396" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="142.8571" y="547.5003" text-anchor="middle" font-size="31.337" font-family="Arial, sans-serif" fill="var(--primary-text)">Early Adopters</text>
  <text x="142.8571" y="591.0003" text-anchor="middle" font-size="31.337" font-family="Arial, sans-serif" fill="var(--primary-text)">5-10%</text>
  <rect x="357.787" y="377.43" width="50.1396" height="50.1396" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="382.8571" y="475.0003" text-anchor="middle" font-size="31.337" font-family="Arial, sans-serif" fill="var(--primary-text)">Progressive</text>
  <text x="382.8571" y="518.5003" text-anchor="middle" font-size="31.337" font-family="Arial, sans-serif" fill="var(--primary-text)">20-30%</text>
  <rect x="597.787" y="304.93" width="50.1396" height="50.1396" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="622.8568" y="402.5003" text-anchor="middle" font-size="31.337" font-family="Arial, sans-serif" fill="var(--primary-text)">Mainstream</text>
  <text x="622.8568" y="446.0001" text-anchor="middle" font-size="31.337" font-family="Arial, sans-serif" fill="var(--primary-text)">40-60%</text>
  <rect x="837.787" y="232.43" width="50.1396" height="50.1396" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="862.8571" y="330.0003" text-anchor="middle" font-size="31.337" font-family="Arial, sans-serif" fill="var(--primary-text)">Late Majority</text>
  <text x="862.8571" y="373.5" text-anchor="middle" font-size="31.337" font-family="Arial, sans-serif" fill="var(--primary-text)">70-85%</text>
  <rect x="1077.79" y="196.18" width="50.1396" height="50.1396" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="1102.8571" y="293.7502" text-anchor="middle" font-size="31.337" font-family="Arial, sans-serif" fill="var(--primary-text)">Universal</text>
  <text x="1102.8571" y="337.2503" text-anchor="middle" font-size="31.337" font-family="Arial, sans-serif" fill="var(--primary-text)">90%+</text>
</svg>

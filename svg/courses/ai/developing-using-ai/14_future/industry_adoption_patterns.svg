<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="660.363382358095" y="40" text-anchor="middle" font-size="61.338727715245" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">AI Adoption Maturity Curve</text>
  <path d="M 69.782052553768 473.858299460592 Q 354.890313506232 382.519736623462 639.998218073369 291.181173786332 Q 925.106835411159 199.842484964978 1210.215096363622 154.173077562188" fill="none" stroke="var(--primary-border)" stroke-width="2.3058"/>
  <rect x="40" y="442.273676399962" width="59.563392336884" height="63.167986279015" rx="17.127161741979" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="69.782052553768" y="565.196862297722" text-anchor="middle" font-size="38.336704822028" font-family="Arial, sans-serif" fill="var(--primary-text)">Early Adopters</text>
  <text x="69.782052553768" y="620" text-anchor="middle" font-size="38.336704822028" font-family="Arial, sans-serif" fill="var(--primary-text)">5-10%</text>
  <rect x="325.108260952464" y="350.935113562832" width="59.563392336884" height="63.167986279015" rx="17.127161741979" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="354.890313506232" y="473.858299460592" text-anchor="middle" font-size="38.336704822028" font-family="Arial, sans-serif" fill="var(--primary-text)">Progressive</text>
  <text x="354.890313506232" y="528.66143716287" text-anchor="middle" font-size="38.336704822028" font-family="Arial, sans-serif" fill="var(--primary-text)">20-30%</text>
  <rect x="610.216521904927" y="259.596550725702" width="59.563392336884" height="63.167986279015" rx="17.127161741979" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="639.998218073369" y="382.519736623462" text-anchor="middle" font-size="38.336704822028" font-family="Arial, sans-serif" fill="var(--primary-text)">Mainstream</text>
  <text x="639.998218073369" y="437.322622357291" text-anchor="middle" font-size="38.336704822028" font-family="Arial, sans-serif" fill="var(--primary-text)">40-60%</text>
  <rect x="895.324782857391" y="168.257987888572" width="59.563392336884" height="63.167986279015" rx="17.127161741979" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="925.106835411159" y="291.181173786332" text-anchor="middle" font-size="38.336704822028" font-family="Arial, sans-serif" fill="var(--primary-text)">Late Majority</text>
  <text x="925.106835411159" y="345.983933535936" text-anchor="middle" font-size="38.336704822028" font-family="Arial, sans-serif" fill="var(--primary-text)">70-85%</text>
  <rect x="1180.436607663116" y="122.588706470007" width="59.563392336884" height="63.167986279015" rx="17.127161741979" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="1210.215096363622" y="245.511766383542" text-anchor="middle" font-size="38.336704822028" font-family="Arial, sans-serif" fill="var(--primary-text)">Universal</text>
  <text x="1210.215096363622" y="300.315030070045" text-anchor="middle" font-size="38.336704822028" font-family="Arial, sans-serif" fill="var(--primary-text)">90%+</text>
</svg>

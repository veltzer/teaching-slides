  <text x="865.7005" y="236.5217" text-anchor="middle" font-size="24.7343">Specialized</text>
  <text x="865.7005" y="272.6957" text-anchor="middle" font-size="24.7343">AI Models</text>
  <circle cx="371.0145" cy="445.2174" r="74.2029" fill="var(--ok-fill)" stroke="var(--ok-border)" />
  <text x="371.0145" y="431.3043" text-anchor="middle" font-size="24.7343">AI-Native</text>
  <text x="371.0145" y="467.4783" text-anchor="middle" font-size="24.7343">IDEs</text>
  <circle cx="618.3575" cy="389.5652" r="86.57" fill="var(--ok-fill)" stroke="var(--ok-border)" />
  <text x="618.3575" y="375.6522" text-anchor="middle" font-size="24.7343">Continuous</text>
  <text x="618.3575" y="411.8261" text-anchor="middle" font-size="24.7343">Learning</text>
  <circle cx="865.7005" cy="445.2174" r="74.2029" fill="var(--ok-fill)" stroke="var(--ok-border)" />
  <text x="865.7005" y="431.3043" text-anchor="middle" font-size="24.7343">Real-time</text>
  <text x="865.7005" y="467.4783" text-anchor="middle" font-size="24.7343">Adaptation</text>
  <rect x="432.8502" y="556.5217" width="371.0145" height="69.5652" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="618.3575" y="606.6087" text-anchor="middle" font-size="27.2077">Convergent Intelligence Ecosystem</text>
</svg>
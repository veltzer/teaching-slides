<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999240478448" y="54.079517780963" text-anchor="middle" font-size="57.099328495615" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Emerging AI Development Technologies</text>
  <rect x="40" y="87.433508821788" width="288.574137531631" height="216.25271436624" rx="18.409848462149" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="184.286309244263" y="179.839650237325" text-anchor="middle" font-size="35.687096747124" font-family="Arial, sans-serif" fill="var(--ok-text)">Multimodal</text>
  <text x="184.286309244263" y="220.711733127751" text-anchor="middle" font-size="35.687096747124" font-family="Arial, sans-serif" fill="var(--ok-text)">AI Systems</text>
  <rect x="516.324827113907" y="40" width="247.348826729082" height="185.359144215083" rx="18.409848462149" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="639.999240478448" y="116.959584009144" text-anchor="middle" font-size="35.687096747124" font-family="Arial, sans-serif" fill="var(--ok-text)">Autonomous</text>
  <text x="639.999240478448" y="157.83166689957" text-anchor="middle" font-size="35.687096747124" font-family="Arial, sans-serif" fill="var(--ok-text)">Agents</text>
  <rect x="951.425862468369" y="87.433508821788" width="288.574137531631" height="216.25271436624" rx="18.409848462149" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="1095.712171712633" y="179.839650237325" text-anchor="middle" font-size="35.687096747124" font-family="Arial, sans-serif" fill="var(--ok-text)">Specialized</text>
  <text x="1095.712171712633" y="220.711733127751" text-anchor="middle" font-size="35.687096747124" font-family="Arial, sans-serif" fill="var(--ok-text)">AI Models</text>
  <rect x="60.611895879722" y="322.96069644789" width="247.348826729082" height="185.359144215083" rx="18.409848462149" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="184.286309244263" y="399.919825118663" text-anchor="middle" font-size="35.687096747124" font-family="Arial, sans-serif" fill="var(--ok-text)">AI-Native</text>
  <text x="184.286309244263" y="440.791908009088" text-anchor="middle" font-size="35.687096747124" font-family="Arial, sans-serif" fill="var(--ok-text)">IDEs</text>
  <rect x="495.712931234185" y="244.633389805759" width="288.574137531631" height="216.25271436624" rx="18.409848462149" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="639.999240478448" y="337.039872725075" text-anchor="middle" font-size="35.687096747124" font-family="Arial, sans-serif" fill="var(--ok-text)">Continuous</text>
  <text x="639.999240478448" y="377.911841780907" text-anchor="middle" font-size="35.687096747124" font-family="Arial, sans-serif" fill="var(--ok-text)">Learning</text>
  <rect x="972.037758348091" y="322.96069644789" width="247.348826729082" height="185.359144215083" rx="18.409848462149" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="1095.712171712633" y="399.919825118663" text-anchor="middle" font-size="35.687096747124" font-family="Arial, sans-serif" fill="var(--ok-text)">Real-time</text>
  <text x="1095.712171712633" y="440.791908009088" text-anchor="middle" font-size="35.687096747124" font-family="Arial, sans-serif" fill="var(--ok-text)">Adaptation</text>
  <rect x="298.214390148499" y="541.399945673422" width="683.569396851277" height="78.600054326578" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="7.889935055207" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999240478448" y="597.992016662244" text-anchor="middle" font-size="39.255714372594" font-family="Arial, sans-serif" fill="var(--ok-text)">Convergent Intelligence Ecosystem</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="109.0476" text-anchor="middle" font-size="43.4219" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Emerging AI Development Technologies</text>
  <rect x="245.015" y="138.348" width="189.971" height="189.971" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="340" y="219.5238" text-anchor="middle" font-size="27.1387" font-family="Arial, sans-serif" fill="var(--ok-text)">Multimodal</text>
  <text x="340" y="255.4286" text-anchor="middle" font-size="27.1387" font-family="Arial, sans-serif" fill="var(--ok-text)">AI Systems</text>
  <rect x="558.584" y="96.6792" width="162.832" height="162.832" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="640" y="164.2857" text-anchor="middle" font-size="27.1387" font-family="Arial, sans-serif" fill="var(--ok-text)">Autonomous</text>
  <text x="640" y="200.1905" text-anchor="middle" font-size="27.1387" font-family="Arial, sans-serif" fill="var(--ok-text)">Agents</text>
  <rect x="845.015" y="138.348" width="189.971" height="189.971" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="940" y="219.5238" text-anchor="middle" font-size="27.1387" font-family="Arial, sans-serif" fill="var(--ok-text)">Specialized</text>
  <text x="940" y="255.4286" text-anchor="middle" font-size="27.1387" font-family="Arial, sans-serif" fill="var(--ok-text)">AI Models</text>
  <rect x="258.584" y="345.251" width="162.832" height="162.832" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="340" y="412.8571" text-anchor="middle" font-size="27.1387" font-family="Arial, sans-serif" fill="var(--ok-text)">AI-Native</text>
  <text x="340" y="448.7619" text-anchor="middle" font-size="27.1387" font-family="Arial, sans-serif" fill="var(--ok-text)">IDEs</text>
  <rect x="545.015" y="276.443" width="189.971" height="189.971" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="640" y="357.6191" text-anchor="middle" font-size="27.1387" font-family="Arial, sans-serif" fill="var(--ok-text)">Continuous</text>
  <text x="640" y="393.5238" text-anchor="middle" font-size="27.1387" font-family="Arial, sans-serif" fill="var(--ok-text)">Learning</text>
  <rect x="858.584" y="345.251" width="162.832" height="162.832" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="940" y="412.8571" text-anchor="middle" font-size="27.1387" font-family="Arial, sans-serif" fill="var(--ok-text)">Real-time</text>
  <text x="940" y="448.7619" text-anchor="middle" font-size="27.1387" font-family="Arial, sans-serif" fill="var(--ok-text)">Adaptation</text>
  <rect x="414.9999" y="537.1428" width="450" height="69.0476" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="586.8571" text-anchor="middle" font-size="29.8525" font-family="Arial, sans-serif" fill="var(--ok-text)">Convergent Intelligence Ecosystem</text>
</svg>

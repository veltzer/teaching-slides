<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="69.308895720728" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Proactive Pitfall Prevention</text>
  <rect x="40" y="136.158608695652" width="258.231777104297" height="261.595826086956" rx="19.352613126859" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="169.115751210892" y="241.739130434783" text-anchor="middle" font-size="43.318059825455" font-family="Arial, sans-serif" fill="var(--ok-text)">Early</text>
  <text x="169.115751210892" y="307.304347826087" text-anchor="middle" font-size="43.318059825455" font-family="Arial, sans-serif" fill="var(--ok-text)">Warning</text>
  <rect x="510.884111447852" y="136.158608695652" width="258.231777104297" height="261.595826086956" rx="19.352613126859" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="640" y="241.739130434783" text-anchor="middle" font-size="43.318059825455" font-family="Arial, sans-serif" fill="var(--ok-text)">Systematic</text>
  <text x="640" y="307.304347826087" text-anchor="middle" font-size="43.318059825455" font-family="Arial, sans-serif" fill="var(--ok-text)">Prevention</text>
  <rect x="981.768222895703" y="136.158608695652" width="258.231777104297" height="261.595826086956" rx="19.352613126859" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="1110.884111447851" y="241.739130434783" text-anchor="middle" font-size="43.318059825455" font-family="Arial, sans-serif" fill="var(--ok-text)">Continuous</text>
  <text x="1110.884111447851" y="307.304347826087" text-anchor="middle" font-size="43.318059825455" font-family="Arial, sans-serif" fill="var(--ok-text)">Monitoring</text>
  <rect x="286.836710402227" y="468.695652173913" width="706.32644185429" height="151.304347826087" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="8.293977054368" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="569.565217391304" text-anchor="middle" font-size="47.649865808001" font-family="Arial, sans-serif" fill="var(--ok-text)">Prevention Better Than Cure</text>
</svg>

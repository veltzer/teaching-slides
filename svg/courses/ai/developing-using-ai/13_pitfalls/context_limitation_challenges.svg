<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="106.6667" y="80" width="1066.6667" height="560" fill="var(--info-fill)" stroke="var(--info-border)" rx="6" stroke-width="2"/>
  <text x="640" y="180" text-anchor="middle" font-size="42.6667" font-weight="bold">AI Context Limitations</text>
  <rect x="186.6667" y="280" width="240" height="140" fill="var(--info-fill)" stroke="var(--info-border)" rx="6" stroke-width="2"/>
  <text x="306.6667" y="340" text-anchor="middle" font-size="26.6667">Limited</text>
  <text x="306.6667" y="392" text-anchor="middle" font-size="26.6667">Context Window</text>
  <rect x="480" y="280" width="240" height="140" fill="var(--info-fill)" stroke="var(--info-border)" rx="6" stroke-width="2"/>
  <text x="600" y="340" text-anchor="middle" font-size="26.6667">Missing</text>
  <text x="600" y="392" text-anchor="middle" font-size="26.6667">Domain Context</text>
  <rect x="773.3333" y="280" width="240" height="140" fill="var(--info-fill)" stroke="var(--info-border)" rx="6" stroke-width="2"/>
  <text x="893.3333" y="340" text-anchor="middle" font-size="26.6667">Incomplete</text>
  <text x="893.3333" y="392" text-anchor="middle" font-size="26.6667">Codebase View</text>
  <rect x="333.3333" y="460" width="240" height="140" fill="var(--info-fill)" stroke="var(--info-border)" rx="6" stroke-width="2"/>
  <text x="453.3333" y="520" text-anchor="middle" font-size="26.6667">Legacy System</text>
  <text x="453.3333" y="572" text-anchor="middle" font-size="26.6667">Complexity</text>
  <rect x="626.6667" y="460" width="240" height="140" fill="var(--info-fill)" stroke="var(--info-border)" rx="6" stroke-width="2"/>
  <text x="746.6667" y="520" text-anchor="middle" font-size="26.6667">Business Logic</text>
  <text x="746.6667" y="572" text-anchor="middle" font-size="26.6667">Nuances</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="120.5556" text-anchor="middle" font-size="43.9971" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">AI Development Pitfall Zones</text>
  <rect x="243.757" y="169.312" width="192.487" height="192.487" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="340" y="249.4444" text-anchor="middle" font-size="27.4981" font-family="Arial, sans-serif" fill="var(--danger-text)">Over-Reliance</text>
  <text x="340" y="291.3334" text-anchor="middle" font-size="27.4981" font-family="Arial, sans-serif" fill="var(--danger-text)">Trap</text>
  <rect x="557.505" y="118.617" width="164.989" height="164.989" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="639.9999" y="185" text-anchor="middle" font-size="27.4981" font-family="Arial, sans-serif" fill="var(--danger-text)">Quality</text>
  <text x="639.9999" y="226.8889" text-anchor="middle" font-size="27.4981" font-family="Arial, sans-serif" fill="var(--danger-text)">Blind Spot</text>
  <rect x="843.756" y="169.312" width="192.487" height="192.487" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="940" y="249.4444" text-anchor="middle" font-size="27.4981" font-family="Arial, sans-serif" fill="var(--danger-text)">Context</text>
  <text x="940" y="291.3334" text-anchor="middle" font-size="27.4981" font-family="Arial, sans-serif" fill="var(--danger-text)">Limitations</text>
  <rect x="407.506" y="344.172" width="164.989" height="164.989" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="490" y="410.5557" text-anchor="middle" font-size="27.4981" font-family="Arial, sans-serif" fill="var(--danger-text)">Security</text>
  <text x="490" y="452.4444" text-anchor="middle" font-size="27.4981" font-family="Arial, sans-serif" fill="var(--danger-text)">Risks</text>
  <rect x="707.506" y="344.172" width="164.989" height="164.989" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="790" y="410.5557" text-anchor="middle" font-size="27.4981" font-family="Arial, sans-serif" fill="var(--danger-text)">Tool</text>
  <text x="790" y="452.4444" text-anchor="middle" font-size="27.4981" font-family="Arial, sans-serif" fill="var(--danger-text)">Limitations</text>
  <rect x="340" y="523.3333" width="600.0001" height="64.4444" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="568.4444" text-anchor="middle" font-size="27.4981" font-family="Arial, sans-serif" fill="var(--ok-text)">Awareness + Strategy = Success</text>
</svg>

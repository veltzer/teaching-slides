<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999848577767" y="42.396594599676" text-anchor="middle" font-size="60.196613433996" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">AI Development Pitfall Zones</text>
  <rect x="40" y="102.671702894126" width="291.468114263217" height="237.9620884699" rx="19.154730381683" fill="url(#grad-danger)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="185.733300020442" y="201.735396848031" text-anchor="middle" font-size="37.622763679183" font-family="Arial, sans-serif" fill="var(--danger-text)">Over-Reliance</text>
  <text x="185.733300020442" y="253.520680653772" text-anchor="middle" font-size="37.622763679183" font-family="Arial, sans-serif" fill="var(--danger-text)">Trap</text>
  <rect x="515.084228617288" y="40" width="249.830028543091" height="203.96768100994" rx="19.154730381683" fill="url(#grad-danger)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="639.999848577767" y="122.065995723853" text-anchor="middle" font-size="37.622763679183" font-family="Arial, sans-serif" fill="var(--danger-text)">Quality</text>
  <text x="639.999848577767" y="173.851155904576" text-anchor="middle" font-size="37.622763679183" font-family="Arial, sans-serif" fill="var(--danger-text)">Blind Spot</text>
  <rect x="948.531885736783" y="102.671702894126" width="291.468114263217" height="237.9620884699" rx="19.154730381683" fill="url(#grad-danger)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="1094.266699979558" y="201.735396848031" text-anchor="middle" font-size="37.622763679183" font-family="Arial, sans-serif" fill="var(--danger-text)">Context</text>
  <text x="1094.266699979558" y="253.520680653772" text-anchor="middle" font-size="37.622763679183" font-family="Arial, sans-serif" fill="var(--danger-text)">Limitations</text>
  <rect x="287.952392849842" y="318.84240943455" width="249.830028543091" height="203.96768100994" rx="19.154730381683" fill="url(#grad-danger)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="412.866650010221" y="400.909270533529" text-anchor="middle" font-size="37.622763679183" font-family="Arial, sans-serif" fill="var(--danger-text)">Security</text>
  <text x="412.866650010221" y="452.694183464216" text-anchor="middle" font-size="37.622763679183" font-family="Arial, sans-serif" fill="var(--danger-text)">Risks</text>
  <rect x="742.2190928294" y="318.84240943455" width="249.830028543091" height="203.96768100994" rx="19.154730381683" fill="url(#grad-danger)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="867.133349989779" y="400.909270533529" text-anchor="middle" font-size="37.622763679183" font-family="Arial, sans-serif" fill="var(--danger-text)">Tool</text>
  <text x="867.133349989779" y="452.694183464216" text-anchor="middle" font-size="37.622763679183" font-family="Arial, sans-serif" fill="var(--danger-text)">Limitations</text>
  <rect x="185.733300020442" y="540.330598875822" width="908.533551381349" height="79.669401124178" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="8.209170163578" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999848577767" y="596.09920438775" text-anchor="middle" font-size="37.622763679183" font-family="Arial, sans-serif" fill="var(--ok-text)">Awareness + Strategy = Success</text>
</svg>

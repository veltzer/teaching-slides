<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999823529394" y="40" text-anchor="middle" font-size="58.446800808611" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Team AI Best Practices Framework</text>
  <rect x="40" y="155.999942399989" width="352.941211072668" height="185.60005184001" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="7.809497618311" stroke-width="2" filter="url(#shadow)"/>
  <text x="216.470487889263" y="225.599907839982" text-anchor="middle" font-size="36.529185426235" font-family="Arial, sans-serif" fill="var(--primary-text)">Guidelines</text>
  <text x="216.470487889263" y="285.920079488015" text-anchor="middle" font-size="36.529185426235" font-family="Arial, sans-serif" fill="var(--primary-text)">&amp; Standards</text>
  <rect x="463.529335640131" y="155.999942399989" width="352.941211072668" height="185.60005184001" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="7.809497618311" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999823529394" y="225.599907839982" text-anchor="middle" font-size="36.529185426235" font-family="Arial, sans-serif" fill="var(--primary-text)">Quality</text>
  <text x="639.999823529394" y="285.920079488015" text-anchor="middle" font-size="36.529185426235" font-family="Arial, sans-serif" fill="var(--primary-text)">Gates</text>
  <rect x="887.058788927332" y="155.999942399989" width="352.941211072668" height="185.60005184001" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="7.809497618311" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.529276816595" y="225.599907839982" text-anchor="middle" font-size="36.529185426235" font-family="Arial, sans-serif" fill="var(--primary-text)">Continuous</text>
  <text x="1063.529276816595" y="285.920079488015" text-anchor="middle" font-size="36.529185426235" font-family="Arial, sans-serif" fill="var(--primary-text)">Learning</text>
  <rect x="251.76460899653" y="434.39994815999" width="352.941211072668" height="185.60005184001" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="7.809497618311" stroke-width="2" filter="url(#shadow)"/>
  <text x="428.235214532864" y="504.000201600039" text-anchor="middle" font-size="36.529185426235" font-family="Arial, sans-serif" fill="var(--primary-text)">Skill</text>
  <text x="428.235214532864" y="564.320085248017" text-anchor="middle" font-size="36.529185426235" font-family="Arial, sans-serif" fill="var(--primary-text)">Preservation</text>
  <rect x="675.294062283732" y="434.39994815999" width="352.941211072668" height="185.60005184001" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="7.809497618311" stroke-width="2" filter="url(#shadow)"/>
  <text x="851.764667820065" y="504.000201600039" text-anchor="middle" font-size="36.529185426235" font-family="Arial, sans-serif" fill="var(--primary-text)">Knowledge</text>
  <text x="851.764667820065" y="564.320085248017" text-anchor="middle" font-size="36.529185426235" font-family="Arial, sans-serif" fill="var(--primary-text)">Sharing</text>
</svg>

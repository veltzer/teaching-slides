<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <circle cx="640" cy="264.6294" r="224.6294" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="452.8089" cy="146.1725" r="74.8765" fill="var(--ok-fill)" />
  <text x="452.8089" y="158.0182" text-anchor="middle" fill="var(--bg)" font-size="26.2068">File A</text>
  <circle cx="640" cy="146.1725" r="74.8765" fill="var(--primary-fill)" />
  <text x="640" y="158.0182" text-anchor="middle" fill="var(--bg)" font-size="26.2068">File B</text>
  <circle cx="827.1911" cy="146.1725" r="74.8765" fill="var(--warn-fill)" />
  <text x="827.1911" y="158.0182" text-anchor="middle" fill="var(--bg)" font-size="26.2068">File C</text>
  <circle cx="546.4044" cy="383.0864" r="74.8765" fill="var(--info-fill)" />
  <text x="546.4044" y="394.9319" text-anchor="middle" fill="var(--bg)" font-size="26.2068">Tests</text>
  <circle cx="733.5955" cy="383.0864" r="74.8765" fill="var(--danger-fill)" />
  <text x="733.5955" y="394.9319" text-anchor="middle" fill="var(--bg)" font-size="26.2068">Docs</text>
  <line x1="452.8089" y1="146.1725" x2="640" y2="146.1725" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="640" y1="146.1725" x2="827.1911" y2="146.1725" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="546.4044" y1="288.3207" x2="640" y2="240.938" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="733.5955" y1="288.3207" x2="640" y2="240.938" stroke="var(--text-muted)" stroke-width="2" />
  <text x="640" y="620" text-anchor="middle" font-size="29.9506" font-weight="bold">Cursor understands relationships</text>
</svg>
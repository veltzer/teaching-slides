<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="280" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Your Repo</text>
  <text x="180" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Source files</text>
  <text x="180" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Docs and configs</text>
  <text x="180" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Tests</text>
  <text x="180" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Git history</text>
  <text x="180" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Cursor watches</text>
  <text x="180" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">the whole tree</text>

  <line x1="325" y1="330" x2="395" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="400" y="40" width="480" height="580" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Indexing and Retrieval</text>

  <rect x="430" y="110" width="420" height="110" rx="6" fill="var(--info-accent)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--info-text)">Chunk and Embed</text>
  <text x="640" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Split files into semantic chunks</text>
  <text x="640" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Store vectors in a local index</text>

  <rect x="430" y="240" width="420" height="110" rx="6" fill="var(--info-accent)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--info-text)">Retrieve on Query</text>
  <text x="640" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Pull top-k matching chunks</text>
  <text x="640" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Follow symbol and import graph</text>

  <rect x="430" y="370" width="420" height="110" rx="6" fill="var(--info-accent)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--info-text)">Assemble Context</text>
  <text x="640" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Open file plus retrieved chunks</text>
  <text x="640" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Trim to fit model window</text>

  <rect x="430" y="500" width="420" height="100" rx="6" fill="var(--info-accent)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--info-text)">Send to Model</text>
  <text x="640" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Prompt plus code plus recent edits</text>

  <line x1="885" y1="330" x2="955" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="960" y="40" width="280" height="580" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Grounded Answer</text>
  <text x="1100" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Cites real files</text>
  <text x="1100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Matches your style</text>
  <text x="1100" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Suggests edits</text>
  <text x="1100" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Applies diffs</text>
  <text x="1100" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Scales with repo</text>
  <text x="1100" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">beyond the prompt</text>
</svg>

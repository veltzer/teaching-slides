<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="595.555555555556" y="40" text-anchor="middle" fill="var(--bg)" font-size="44.055749797633" font-weight="bold" font-family="Arial, sans-serif">Common Patterns in AI Code</text>
  <rect x="40" y="142.352930795849" width="400" height="204.705861591698" fill="url(#grad-primary)" rx="8.401680078119" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="239.999888888889" y="261.764742214529" text-anchor="middle" fill="var(--bg)" font-size="29.37059321709" font-family="Arial, sans-serif">Singleton</text>
  <text x="239.999888888889" y="312.941031141883" text-anchor="middle" fill="var(--bg)" font-size="24.475494347575" font-family="Arial, sans-serif">Database connections</text>
  <rect x="506.666666666667" y="142.352930795849" width="400" height="204.705861591698" fill="url(#grad-ok)" rx="8.401680078119" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.666555555556" y="261.764742214529" text-anchor="middle" fill="var(--bg)" font-size="29.37059321709" font-family="Arial, sans-serif">Factory</text>
  <text x="706.666555555556" y="312.941031141883" text-anchor="middle" fill="var(--bg)" font-size="24.475494347575" font-family="Arial, sans-serif">Object creation</text>
  <rect x="40" y="415.294138408302" width="400" height="204.705861591698" fill="url(#grad-danger)" rx="8.401680078119" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="239.999888888889" y="534.705949826983" text-anchor="middle" fill="var(--bg)" font-size="29.37059321709" font-family="Arial, sans-serif">Repository</text>
  <text x="239.999888888889" y="585.882238754337" text-anchor="middle" fill="var(--bg)" font-size="24.475494347575" font-family="Arial, sans-serif">Data access</text>
  <rect x="506.666666666667" y="415.294138408302" width="400" height="204.705861591698" fill="url(#grad-warn)" rx="8.401680078119" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.666555555556" y="534.705949826983" text-anchor="middle" fill="var(--bg)" font-size="29.37059321709" font-family="Arial, sans-serif">Observer</text>
  <text x="706.666555555556" y="585.882238754337" text-anchor="middle" fill="var(--bg)" font-size="24.475494347575" font-family="Arial, sans-serif">Event handling</text>
  <rect x="973.333222222222" y="278.82344636679" width="266.666777777778" height="204.705861591698" fill="url(#grad-info)" rx="8.401680078119" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1106.666555555556" y="398.235257785471" text-anchor="middle" fill="var(--bg)" font-size="29.37059321709" font-family="Arial, sans-serif">Strategy</text>
  <text x="1106.666555555556" y="449.411723183395" text-anchor="middle" fill="var(--bg)" font-size="24.475494347575" font-family="Arial, sans-serif">Algorithms</text>
</svg>

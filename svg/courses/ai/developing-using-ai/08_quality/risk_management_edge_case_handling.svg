  <ns0:rect x="216.7196" y="329.1429" width="317.8554" height="91.4286" fill="#3498DB" rx="7.224" />
  <ns0:text x="375.6473" y="384" text-anchor="middle" fill="white" font-size="17.3376">Concurrency</ns0:text>

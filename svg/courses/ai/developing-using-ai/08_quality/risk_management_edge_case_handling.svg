<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640.000060000006" y="40" text-anchor="middle" fill="var(--bg)" font-size="40.246452406523" font-weight="bold" font-family="Arial, sans-serif">Edge Case Categories</text>
  <rect x="40" y="119.090896694217" width="528.000052800005" height="131.818206611566" fill="url(#grad-danger)" rx="7.675225571057" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="304.000026400003" y="198.181793388434" text-anchor="middle" fill="var(--bg)" font-size="26.8310535513" font-family="Arial, sans-serif">Boundary Values</text>
  <text x="304.000026400003" y="237.727241735542" text-anchor="middle" fill="var(--bg)" font-size="22.35921129275" font-family="Arial, sans-serif">0, -1, MAX_INT, null</text>
  <rect x="711.999947199995" y="119.090896694217" width="528.000052800005" height="131.818206611566" fill="url(#grad-warn)" rx="7.675225571057" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="976.000093600009" y="198.181793388434" text-anchor="middle" fill="var(--bg)" font-size="26.8310535513" font-family="Arial, sans-serif">Invalid Input</text>
  <text x="976.000093600009" y="237.727241735542" text-anchor="middle" fill="var(--bg)" font-size="22.35921129275" font-family="Arial, sans-serif">Wrong types, malformed</text>
  <rect x="40" y="303.636413223133" width="528.000052800005" height="131.818206611566" fill="url(#grad-primary)" rx="7.675225571057" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="304.000026400003" y="382.727173553735" text-anchor="middle" fill="var(--bg)" font-size="26.8310535513" font-family="Arial, sans-serif">Concurrency</text>
  <text x="304.000026400003" y="422.272758264458" text-anchor="middle" fill="var(--bg)" font-size="22.35921129275" font-family="Arial, sans-serif">Race conditions, deadlocks</text>
  <rect x="711.999947199995" y="303.636413223133" width="528.000052800005" height="131.818206611566" fill="url(#grad-ok)" rx="7.675225571057" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="976.000093600009" y="382.727173553735" text-anchor="middle" fill="var(--bg)" font-size="26.8310535513" font-family="Arial, sans-serif">Resource Limits</text>
  <text x="976.000093600009" y="422.272758264458" text-anchor="middle" fill="var(--bg)" font-size="22.35921129275" font-family="Arial, sans-serif">Memory, disk, network</text>
  <rect x="376.000033600003" y="488.181793388434" width="528.000052800005" height="131.818206611566" fill="url(#grad-info)" rx="7.675225571057" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640.000060000006" y="567.27269008265" text-anchor="middle" fill="var(--bg)" font-size="26.8310535513" font-family="Arial, sans-serif">External Failures</text>
  <text x="640.000060000006" y="606.818138429759" text-anchor="middle" fill="var(--bg)" font-size="22.35921129275" font-family="Arial, sans-serif">API down, timeout</text>
</svg>

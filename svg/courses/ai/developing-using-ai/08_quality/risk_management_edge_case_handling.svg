  <ns0:rect x="418.9912" y="457.1429" width="317.8554" height="91.4286" fill="#9B59B6" rx="7.224" />
  <ns0:text x="577.9189" y="512" text-anchor="middle" fill="white" font-size="17.3376">External Failures</ns0:text>

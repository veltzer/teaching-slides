  <ns0:text x="288" y="234.9" text-anchor="middle" fill="white" font-size="15.36">2020</ns0:text>
  <ns0:text x="288" y="259.2" text-anchor="middle" fill="white" font-size="12.8">REST APIs</ns0:text>
  <ns0:rect x="416" y="178.2" width="192" height="97.2" fill="#2ECC71" rx="6.4" />
  <ns0:text x="512" y="234.9" text-anchor="middle" fill="white" font-size="15.36">2022</ns0:text>
  <ns0:text x="512" y="259.2" text-anchor="middle" fill="white" font-size="12.8">GraphQL</ns0:text>
  <ns0:rect x="640" y="178.2" width="192" height="97.2" fill="#E74C3C" rx="6.4" />
  <ns0:text x="736" y="234.9" text-anchor="middle" fill="white" font-size="15.36">2024</ns0:text>
  <ns0:text x="736" y="259.2" text-anchor="middle" fill="white" font-size="12.8">tRPC</ns0:text>
  <ns0:path d="M 384 226.8 L 416 226.8" stroke="white" stroke-width="2.56" marker-end="url(#e1)" />
  <ns0:path d="M 608 226.8 L 640 226.8" stroke="white" stroke-width="2.56" marker-end="url(#e2)" />
  <ns0:text x="512" y="356.4" text-anchor="middle" fill="white" font-size="15.36">Standards must evolve with technology</ns0:text>
  <ns0:text x="512" y="405" text-anchor="middle" fill="white" font-size="15.36">• Regular reviews</ns0:text>
  <ns0:text x="512" y="437.4" text-anchor="middle" fill="white" font-size="15.36">• Team consensus</ns0:text>
  <ns0:text x="512" y="469.8" text-anchor="middle" fill="white" font-size="15.36">• Gradual adoption</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>

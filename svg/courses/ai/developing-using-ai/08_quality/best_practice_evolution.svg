<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect x="128" y="81" width="768" height="486" fill="#333333" rx="12.8" />
  <ns0:text x="512" y="129.6" text-anchor="middle" fill="white" font-size="23.04" font-weight="bold">Standards Evolution</ns0:text>

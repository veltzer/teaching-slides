<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="640" y="40" text-anchor="middle" fill="var(--bg)" font-size="41.193552479525" font-weight="bold" font-family="Arial, sans-serif">Standards Evolution</text>
  <rect x="40" y="122.857244897909" width="360.000072000014" height="165.714346938745" fill="url(#grad-primary)" rx="7.855842899144" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.000036000007" y="219.523768707503" text-anchor="middle" fill="var(--bg)" font-size="27.462455606827" font-family="Arial, sans-serif">2020</text>
  <text x="220.000036000007" y="260.952319727921" text-anchor="middle" fill="var(--bg)" font-size="22.885379672356" font-family="Arial, sans-serif">REST APIs</text>
  <rect x="459.999963999993" y="122.857244897909" width="360.000072000014" height="165.714346938745" fill="url(#grad-ok)" rx="7.855842899144" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="219.523768707503" text-anchor="middle" fill="var(--bg)" font-size="27.462455606827" font-family="Arial, sans-serif">2022</text>
  <text x="640" y="260.952319727921" text-anchor="middle" fill="var(--bg)" font-size="22.885379672356" font-family="Arial, sans-serif">GraphQL</text>
  <rect x="879.999927999986" y="122.857244897909" width="360.000072000014" height="165.714346938745" fill="url(#grad-danger)" rx="7.855842899144" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1059.999963999993" y="219.523768707503" text-anchor="middle" fill="var(--bg)" font-size="27.462455606827" font-family="Arial, sans-serif">2024</text>
  <text x="1059.999963999993" y="260.952319727921" text-anchor="middle" fill="var(--bg)" font-size="22.885379672356" font-family="Arial, sans-serif">tRPC</text>
  <path d="M 400.000072000014 205.714489795818 L 459.999963999993 205.714489795818" stroke="var(--bg)" stroke-width="1.7608" marker-end="url(#arrow)"/>
  <path d="M 819.999795999959 205.714489795818 L 879.999927999986 205.714489795818" stroke="var(--bg)" stroke-width="1.7608" marker-end="url(#arrow)"/>
  <text x="640" y="426.666523809594" text-anchor="middle" fill="var(--bg)" font-size="27.462455606827" font-family="Arial, sans-serif">Standards must evolve with technology</text>
  <text x="640" y="509.523768707503" text-anchor="middle" fill="var(--bg)" font-size="27.462455606827" font-family="Arial, sans-serif">• Regular reviews</text>
  <text x="640" y="564.761884353751" text-anchor="middle" fill="var(--bg)" font-size="27.462455606827" font-family="Arial, sans-serif">• Team consensus</text>
  <text x="640" y="620" text-anchor="middle" fill="var(--bg)" font-size="27.462455606827" font-family="Arial, sans-serif">• Gradual adoption</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

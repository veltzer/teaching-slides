<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="31.2888" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">DRY Principle</text>
  <rect x="40" y="106.9231" width="548.5714" height="334.6154" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2857" y="173.8461" text-anchor="middle" fill="var(--bg)" font-size="24.3358" font-weight="bold" font-family="Arial, sans-serif">Before: Duplication</text>
  <rect x="74.2858" y="218.4616" width="222.8572" height="89.2307" fill="var(--danger-accent)" rx="6"/>
  <text x="185.7144" y="274.2308" text-anchor="middle" fill="var(--bg)" font-size="19.121" font-family="Arial, sans-serif">validateEmail()</text>
  <rect x="331.4286" y="218.4616" width="222.8572" height="89.2307" fill="var(--danger-accent)" rx="6"/>
  <text x="442.8572" y="274.2308" text-anchor="middle" fill="var(--bg)" font-size="19.121" font-family="Arial, sans-serif">validateEmail()</text>
  <rect x="74.2858" y="330.0001" width="222.8572" height="89.2307" fill="var(--danger-accent)" rx="6"/>
  <text x="185.7144" y="385.7692" text-anchor="middle" fill="var(--bg)" font-size="19.121" font-family="Arial, sans-serif">validateEmail()</text>
  <rect x="691.4286" y="106.9231" width="548.5714" height="334.6154" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965.7144" y="173.8461" text-anchor="middle" fill="var(--bg)" font-size="24.3358" font-weight="bold" font-family="Arial, sans-serif">After: Reusable</text>
  <rect x="828.5714" y="218.4616" width="274.2857" height="89.2307" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965.7144" y="274.2308" text-anchor="middle" fill="var(--bg)" font-size="19.121" font-family="Arial, sans-serif">utils/validators.js</text>
  <text x="965.7144" y="385.7692" text-anchor="middle" fill="var(--bg)" font-size="19.121" font-family="Arial, sans-serif">Import and reuse</text>
  <text x="640.0001" y="553.0769" text-anchor="middle" font-size="27.8122" font-family="Arial, sans-serif" fill="var(--text)">Don't Repeat Yourself</text>
  <text x="640.0001" y="620" text-anchor="middle" font-size="20.8592" font-family="Arial, sans-serif" fill="var(--text)">Extract common code into utilities</text>
</svg>

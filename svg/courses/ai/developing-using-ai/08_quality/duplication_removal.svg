  <ns0:text x="994.5021" y="309.3333" text-anchor="middle" fill="white" font-size="18.5416">utils/validators.js</ns0:text>
  <ns0:text x="994.5021" y="416" text-anchor="middle" fill="white" font-size="18.5416">Import and reuse</ns0:text>
  <ns0:text x="674.2387" y="576" text-anchor="middle" font-size="26.9695">Don't Repeat Yourself</ns0:text>
  <ns0:text x="674.2387" y="640" text-anchor="middle" font-size="20.2272">Extract common code into utilities</ns0:text>

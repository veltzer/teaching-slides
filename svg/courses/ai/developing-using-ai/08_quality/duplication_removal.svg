<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="548.5714" height="378.260903969756" fill="url(#grad-danger)" rx="6.379314540317" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="314.2857" y="115.652090359164" text-anchor="middle" fill="var(--bg)" font-size="25.874287131708" font-weight="bold" font-family="Arial, sans-serif">Before: Duplication</text>
  <rect x="74.2858" y="166.08700567108" width="222.8572" height="100.86949149338" fill="var(--danger-accent)" rx="6.379314540317"/>
  <text x="185.7144" y="229.130451984878" text-anchor="middle" fill="var(--bg)" font-size="20.329812220901" font-family="Arial, sans-serif">validateEmail()</text>
  <rect x="331.4286" y="166.08700567108" width="222.8572" height="100.86949149338" fill="var(--danger-accent)" rx="6.379314540317"/>
  <text x="442.8572" y="229.130451984878" text-anchor="middle" fill="var(--bg)" font-size="20.329812220901" font-family="Arial, sans-serif">validateEmail()</text>
  <rect x="74.2858" y="292.174011342159" width="222.8572" height="100.86949149338" fill="var(--danger-accent)" rx="6.379314540317"/>
  <text x="185.7144" y="355.217344612474" text-anchor="middle" fill="var(--bg)" font-size="20.329812220901" font-family="Arial, sans-serif">validateEmail()</text>
  <rect x="691.4286" y="40" width="548.5714" height="378.260903969756" fill="url(#grad-ok)" rx="6.379314540317" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="965.7144" y="115.652090359164" text-anchor="middle" fill="var(--bg)" font-size="25.874287131708" font-weight="bold" font-family="Arial, sans-serif">After: Reusable</text>
  <rect x="828.5714" y="166.08700567108" width="274.2857" height="100.86949149338" fill="url(#grad-ok)" rx="6.379314540317" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="965.7144" y="229.130451984878" text-anchor="middle" fill="var(--bg)" font-size="20.329812220901" font-family="Arial, sans-serif">utils/validators.js</text>
  <text x="965.7144" y="355.217344612474" text-anchor="middle" fill="var(--bg)" font-size="20.329812220901" font-family="Arial, sans-serif">Import and reuse</text>
  <text x="640.0001" y="544.347796597352" text-anchor="middle" font-size="29.570461976368" font-family="Arial, sans-serif" fill="var(--text)">Don't Repeat Yourself</text>
  <text x="640.0001" y="620" text-anchor="middle" font-size="22.177899643231" font-family="Arial, sans-serif" fill="var(--text)">Extract common code into utilities</text>
</svg>

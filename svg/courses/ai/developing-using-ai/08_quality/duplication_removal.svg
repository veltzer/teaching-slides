  <ns0:text x="674.2387" y="85.3333" text-anchor="middle" font-size="30.3407" font-weight="bold">DRY Principle</ns0:text>
  <ns0:rect x="84.2798" y="149.3333" width="539.3909" height="320" fill="#E74C3C" rx="16.856" />
  <ns0:text x="353.9753" y="213.3333" text-anchor="middle" fill="white" font-size="23.5984" font-weight="bold">Before: Duplication</ns0:text>
  <ns0:rect x="117.9918" y="256" width="219.1276" height="85.3333" fill="#c62828" rx="8.428" />
  <ns0:text x="227.5556" y="309.3333" text-anchor="middle" fill="white" font-size="18.5416">validateEmail()</ns0:text>

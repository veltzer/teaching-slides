  <text x="804.9484" y="338.6984" text-anchor="middle" fill="var(--bg)" font-size="16.4948">Analyze</text>
  <circle cx="640" cy="538.7629" r="41.2371" fill="var(--ok-fill)" />
  <text x="640" y="547.4614" text-anchor="middle" fill="var(--bg)" font-size="16.4948">Improve</text>

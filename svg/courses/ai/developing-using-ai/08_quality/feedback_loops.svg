<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Feedback Loops: Continuous Improvement Cycle</text>

  <rect x="40" y="150" width="280" height="220" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--danger-text)">Measure</text>
  <text x="180" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">Collect outputs</text>
  <text x="180" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">Track error rates</text>
  <text x="180" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">Log user feedback</text>

  <line x1="320" y1="260" x2="360" y2="260" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="360" y="150" width="280" height="220" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--warn-text)">Analyze</text>
  <text x="500" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">Find failure modes</text>
  <text x="500" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">Spot patterns</text>
  <text x="500" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">Prioritize issues</text>

  <line x1="640" y1="260" x2="680" y2="260" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="680" y="150" width="280" height="220" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--ok-text)">Improve</text>
  <text x="820" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">Refine prompts</text>
  <text x="820" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">Add examples</text>
  <text x="820" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">Update guardrails</text>

  <line x1="960" y1="260" x2="1000" y2="260" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1000" y="150" width="240" height="220" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--info-text)">Apply</text>
  <text x="1120" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--info-text)">Ship changes</text>
  <text x="1120" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--info-text)">Re-run eval</text>
  <text x="1120" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--info-text)">Repeat loop</text>

  <line x1="1120" y1="370" x2="1120" y2="420" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1120" y1="420" x2="180" y2="420" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="180" y1="420" x2="180" y2="370" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="450" width="1200" height="170" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text)">Why Feedback Loops Matter</text>
  <text x="640" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Every failure is a signal. Every signal is a prompt, dataset, or guardrail update.</text>
  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Short cycles beat long ones: ship small changes, measure, iterate.</text>
  <text x="640" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Without a loop, quality plateaus. With one, it compounds over time.</text>
</svg>

  <ns0:line x1="173.3757" y1="393.1429" x2="982.4621" y2="393.1429" stroke="white" stroke-width="2.8896" />
  <ns0:text x="375.6473" y="292.5714" text-anchor="middle" fill="#E74C3C" font-size="20.2272" font-weight="bold">Reckless &amp; Deliberate</ns0:text>
  <ns0:text x="375.6473" y="329.1429" text-anchor="middle" fill="#E74C3C" font-size="15.8928">"We don't have time"</ns0:text>
  <ns0:text x="780.1905" y="292.5714" text-anchor="middle" fill="#F39C12" font-size="20.2272" font-weight="bold">Prudent &amp; Deliberate</ns0:text>
  <ns0:text x="780.1905" y="329.1429" text-anchor="middle" fill="#F39C12" font-size="15.8928">"Ship now, refactor later"</ns0:text>
  <ns0:text x="375.6473" y="493.7143" text-anchor="middle" fill="#9e9e9e" font-size="20.2272" font-weight="bold">Reckless &amp; Inadvertent</ns0:text>
  <ns0:text x="375.6473" y="530.2857" text-anchor="middle" fill="#9e9e9e" font-size="15.8928">"What's layering?"</ns0:text>
  <ns0:text x="780.1905" y="493.7143" text-anchor="middle" fill="#27AE60" font-size="20.2272" font-weight="bold">Prudent &amp; Inadvertent</ns0:text>
  <ns0:text x="780.1905" y="530.2857" text-anchor="middle" fill="#27AE60" font-size="15.8928">"Now we know better"</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--text)" rx="6"/>
  <text x="640.0001" y="98" text-anchor="middle" fill="var(--bg)" font-size="31.4621" font-weight="bold" font-family="Arial, sans-serif">Debt Quadrants</text>
  <line x1="640.0001" y1="136.6666" x2="640.0001" y2="581.3334" stroke="var(--bg)" stroke-width="2"/>
  <line x1="80.0001" y1="359" x2="1200.0001" y2="359" stroke="var(--bg)" stroke-width="2"/>
  <text x="360.0001" y="252.6666" text-anchor="middle" fill="var(--danger-accent)" font-size="24.4706" font-weight="bold" font-family="Arial, sans-serif">Reckless &amp; Deliberate</text>
  <text x="360.0001" y="291.3334" text-anchor="middle" fill="var(--danger-accent)" font-size="19.2269" font-family="Arial, sans-serif">"We don't have time"</text>
  <text x="920.0001" y="252.6666" text-anchor="middle" fill="var(--warn-accent)" font-size="24.4706" font-weight="bold" font-family="Arial, sans-serif">Prudent &amp; Deliberate</text>
  <text x="920.0001" y="291.3334" text-anchor="middle" fill="var(--warn-accent)" font-size="19.2269" font-family="Arial, sans-serif">"Ship now, refactor later"</text>
  <text x="360.0001" y="465.3333" text-anchor="middle" fill="var(--text-faint)" font-size="24.4706" font-weight="bold" font-family="Arial, sans-serif">Reckless &amp; Inadvertent</text>
  <text x="360.0001" y="504" text-anchor="middle" fill="var(--text-faint)" font-size="19.2269" font-family="Arial, sans-serif">"What's layering?"</text>
  <text x="920.0001" y="465.3333" text-anchor="middle" fill="var(--ok-accent)" font-size="24.4706" font-weight="bold" font-family="Arial, sans-serif">Prudent &amp; Inadvertent</text>
  <text x="920.0001" y="504" text-anchor="middle" fill="var(--ok-accent)" font-size="19.2269" font-family="Arial, sans-serif">"Now we know better"</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <circle cx="635.0388" cy="401.8605" r="238.1395" fill="none" stroke="var(--primary-border)" stroke-width="4.7628" />
  <circle cx="635.0388" cy="401.8605" r="47.6279" fill="var(--danger-fill)" />
  <text x="635.0388" y="411.907" text-anchor="middle" fill="var(--bg)" font-size="19.0512">Team</text>
  <circle cx="635.0388" cy="200.9302" r="31.7519" fill="var(--warn-fill)" />
  <text x="635.0388" y="210.9767" text-anchor="middle" fill="var(--bg)" font-size="15.876">Docs</text>
  <circle cx="762.0465" cy="301.3953" r="31.7519" fill="var(--ok-fill)" />
  <text x="762.0465" y="311.4419" text-anchor="middle" fill="var(--bg)" font-size="15.876">Reviews</text>
  <circle cx="793.7984" cy="462.1395" r="31.7519" fill="var(--info-fill)" />
  <text x="793.7984" y="472.186" text-anchor="middle" fill="var(--bg)" font-size="15.876">Pairing</text>
  <circle cx="714.4186" cy="582.6977" r="31.7519" fill="var(--primary-fill)" />
  <text x="714.4186" y="592.7442" text-anchor="middle" fill="var(--bg)" font-size="15.876">Demos</text>
  <circle cx="555.6589" cy="582.6977" r="31.7519" fill="var(--ok-fill)" />
  <text x="555.6589" y="592.7442" text-anchor="middle" fill="var(--bg)" font-size="15.876">Wiki</text>
  <circle cx="476.2791" cy="462.1395" r="31.7519" fill="var(--warn-fill)" />
  <text x="476.2791" y="472.186" text-anchor="middle" fill="var(--bg)" font-size="15.876">Training</text>
  <circle cx="508.031" cy="301.3953" r="31.7519" fill="var(--ok-fill)" />
  <text x="508.031" y="311.4419" text-anchor="middle" fill="var(--bg)" font-size="15.876">Standards</text>
</svg>
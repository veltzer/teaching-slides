<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="244.9383" y="80" width="790.1234" height="500" fill="var(--text)" rx="7.8395" />
  <text x="640" y="130" text-anchor="middle" fill="var(--bg)" font-size="23.7037" font-weight="bold">Validation Layers</text>
  <rect x="310.7819" y="180.0001" width="237.037" height="83.3333" fill="var(--danger-fill)" rx="7.8395" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="429.3005" y="230.0001" text-anchor="middle" fill="var(--bg)" font-size="15.8025">Frontend Validation</text>
  <text x="429.3005" y="255" text-anchor="middle" fill="var(--bg)" font-size="13.1687">User experience</text>
  <rect x="587.3251" y="180.0001" width="237.037" height="83.3333" fill="var(--warn-fill)" rx="7.8395" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="705.8436" y="230.0001" text-anchor="middle" fill="var(--bg)" font-size="15.8025">API Validation</text>
  <text x="705.8436" y="255" text-anchor="middle" fill="var(--bg)" font-size="13.1687">Security layer</text>
  <rect x="863.8683" y="180.0001" width="171.1934" height="83.3333" fill="var(--primary-fill)" rx="7.8395" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="949.465" y="230.0001" text-anchor="middle" fill="var(--bg)" font-size="15.8025">DB Constraints</text>
  <text x="949.465" y="255" text-anchor="middle" fill="var(--bg)" font-size="13.1687">Final protection</text>
  <path d="M 429.3005 263.3334 L 429.3005 330" stroke="var(--bg)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <path d="M 705.8436 263.3334 L 705.8436 330" stroke="var(--bg)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <path d="M 949.465 263.3334 L 949.465 330" stroke="var(--bg)" stroke-width="2.0157" marker-end="url(#arrow)" />
  <rect x="310.7819" y="330" width="658.4361" height="166.6667" fill="var(--text-muted)" rx="7.8395" />
  <text x="640" y="380" text-anchor="middle" fill="var(--bg)" font-size="18.4362">Never Trust User Input</text>
  <text x="640" y="421.6667" text-anchor="middle" fill="var(--bg)" font-size="15.8025">• Validate type, length, format</text>
  <text x="640" y="455" text-anchor="middle" fill="var(--bg)" font-size="15.8025">• Sanitize special characters</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="white" />
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="white" />
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="white" />
    </marker>
  </defs>
</svg>
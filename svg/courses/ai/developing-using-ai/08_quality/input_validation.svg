<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="585.454436363636" y="40" text-anchor="middle" fill="var(--bg)" font-size="38.373480289811" font-weight="bold" font-family="Arial, sans-serif">Validation Layers</text>
  <rect x="40" y="119.091150826352" width="392.727272727273" height="131.818175619837" fill="url(#grad-danger)" rx="7.318039219851" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.363745454545" y="198.181892561954" text-anchor="middle" fill="var(--bg)" font-size="25.582401504754" font-family="Arial, sans-serif">Frontend Validation</text>
  <text x="236.363745454545" y="237.727331611547" text-anchor="middle" fill="var(--bg)" font-size="24.016828980987" font-family="Arial, sans-serif">User experience</text>
  <rect x="498.181818181818" y="119.091150826352" width="392.727272727273" height="131.818175619837" fill="url(#grad-warn)" rx="7.318039219851" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="694.545345454545" y="198.181892561954" text-anchor="middle" fill="var(--bg)" font-size="25.582401504754" font-family="Arial, sans-serif">API Validation</text>
  <text x="694.545345454545" y="237.727331611547" text-anchor="middle" fill="var(--bg)" font-size="24.016828980987" font-family="Arial, sans-serif">Security layer</text>
  <rect x="956.363636363636" y="119.091150826352" width="283.636363636364" height="131.818175619837" fill="url(#grad-primary)" rx="7.318039219851" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.181709090909" y="198.181892561954" text-anchor="middle" fill="var(--bg)" font-size="25.582401504754" font-family="Arial, sans-serif">DB Constraints</text>
  <text x="1098.181709090909" y="237.727331611547" text-anchor="middle" fill="var(--bg)" font-size="24.016828980987" font-family="Arial, sans-serif">Final protection</text>
  <path d="M 236.363745454545 250.909053719023 L 236.363745454545 356.363648760326" stroke="var(--bg)" stroke-width="0.9159" marker-end="url(#arrow)"/>
  <path d="M 694.545345454545 250.909053719023 L 694.545345454545 356.363648760326" stroke="var(--bg)" stroke-width="0.9159" marker-end="url(#arrow)"/>
  <path d="M 1098.181709090909 250.909053719023 L 1098.181709090909 356.363648760326" stroke="var(--bg)" stroke-width="0.9159" marker-end="url(#arrow)"/>
  <rect x="40" y="356.363648760326" width="1090.908654545455" height="263.636351239674" fill="var(--text-muted)" rx="7.318039219851"/>
  <text x="585.454436363636" y="435.454254132346" text-anchor="middle" fill="var(--bg)" font-size="29.84613508888" font-family="Arial, sans-serif">Never Trust User Input</text>
  <text x="585.454436363636" y="501.363682851221" text-anchor="middle" fill="var(--bg)" font-size="25.582401504754" font-family="Arial, sans-serif">• Validate type, length, format</text>
  <text x="585.454436363636" y="554.090707644707" text-anchor="middle" fill="var(--bg)" font-size="25.582401504754" font-family="Arial, sans-serif">• Sanitize special characters</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

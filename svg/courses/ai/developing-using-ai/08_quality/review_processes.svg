<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" fill="var(--text)" rx="6"/>
  <text x="640" y="98" text-anchor="middle" fill="var(--bg)" font-size="31.4621" font-weight="bold" font-family="Arial, sans-serif">Review Pipeline</text>
  <rect x="170.084" y="260.084" width="139.832" height="139.832" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="240.0001" y="339.6666" text-anchor="middle" fill="var(--bg)" font-size="20.9748" font-family="Arial, sans-serif">PR</text>
  <path d="M 320.0001 330.0001 L 459.9998 330.0001" stroke="var(--bg)" stroke-width="1.0232" marker-end="url(#arrow)"/>
  <rect x="470.084" y="260.084" width="139.832" height="139.832" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="540" y="339.6666" text-anchor="middle" fill="var(--bg)" font-size="20.9748" font-family="Arial, sans-serif">AI</text>
  <path d="M 620 330.0001 L 760 330.0001" stroke="var(--bg)" stroke-width="1.0232" marker-end="url(#arrow)"/>
  <rect x="770.084" y="260.084" width="139.832" height="139.832" rx="14" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="839.9999" y="339.6666" text-anchor="middle" fill="var(--bg)" font-size="20.9748" font-family="Arial, sans-serif">Human</text>
  <path d="M 919.9999 330.0001 L 1059.9998 330.0001" stroke="var(--bg)" stroke-width="1.0232" marker-end="url(#arrow)"/>
  <rect x="1070.08" y="260.084" width="139.832" height="139.832" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="1139.9998" y="339.6666" text-anchor="middle" fill="var(--bg)" font-size="20.9748" font-family="Arial, sans-serif">Merge</text>
  <text x="240.0001" y="446" text-anchor="middle" fill="var(--bg)" font-size="19.0084" font-family="Arial, sans-serif">Create</text>
  <text x="540" y="446" text-anchor="middle" fill="var(--bg)" font-size="19.0084" font-family="Arial, sans-serif">Auto-check</text>
  <text x="839.9999" y="446" text-anchor="middle" fill="var(--bg)" font-size="19.0084" font-family="Arial, sans-serif">Review</text>
  <text x="1139.9998" y="446" text-anchor="middle" fill="var(--bg)" font-size="19.0084" font-family="Arial, sans-serif">Deploy</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

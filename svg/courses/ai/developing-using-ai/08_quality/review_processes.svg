<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="104.918" y="66.3934" width="629.5082" height="398.3607" fill="var(--text)" rx="6" />
  <text x="419.6721" y="106.2295" text-anchor="middle" fill="var(--bg)" font-size="18.8852" font-weight="bold">Review Pipeline</text>
  <circle cx="209.8361" cy="265.5738" r="41.9672" fill="var(--primary-fill)" />
  <text x="209.8361" y="272.2131" text-anchor="middle" fill="var(--bg)" font-size="12.5902">PR</text>
  <path d="M 251.8033 265.5738 L 325.2459 265.5738" stroke="var(--bg)" stroke-width="2.0984" marker-end="url(#r1)" />
  <circle cx="367.2131" cy="265.5738" r="41.9672" fill="var(--warn-fill)" />
  <text x="367.2131" y="272.2131" text-anchor="middle" fill="var(--bg)" font-size="12.5902">AI</text>
  <path d="M 409.1803 265.5738 L 482.623 265.5738" stroke="var(--bg)" stroke-width="2.0984" marker-end="url(#r2)" />
  <circle cx="524.5902" cy="265.5738" r="41.9672" fill="var(--danger-fill)" />
  <text x="524.5902" y="272.2131" text-anchor="middle" fill="var(--bg)" font-size="12.5902">Human</text>
  <path d="M 566.5574 265.5738 L 640 265.5738" stroke="var(--bg)" stroke-width="2.0984" marker-end="url(#r3)" />
  <circle cx="681.9672" cy="265.5738" r="41.9672" fill="var(--ok-fill)" />
  <text x="681.9672" y="272.2131" text-anchor="middle" fill="var(--bg)" font-size="12.5902">Merge</text>
  <text x="209.8361" y="345.2459" text-anchor="middle" fill="var(--bg)" font-size="10.4918">Create</text>
  <text x="367.2131" y="345.2459" text-anchor="middle" fill="var(--bg)" font-size="10.4918">Auto-check</text>
  <text x="524.5902" y="345.2459" text-anchor="middle" fill="var(--bg)" font-size="10.4918">Review</text>
  <text x="681.9672" y="345.2459" text-anchor="middle" fill="var(--bg)" font-size="10.4918">Deploy</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="r1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="white" />
    </marker>
    <marker id="r2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="white" />
    </marker>
    <marker id="r3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.4 12.8,0" fill="white" />
    </marker>
  </defs>
</svg>
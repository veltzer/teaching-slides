<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" fill="var(--bg)" font-size="43.692371567455" font-weight="bold" font-family="Arial, sans-serif">Semantic Versioning</text>
  <rect x="160" y="150.476142857143" width="960" height="220.952428571429" fill="var(--text-muted)" rx="7.855844048496"/>
  <text x="640" y="233.333285714286" text-anchor="middle" fill="var(--bg)" font-size="48.547152258691" font-weight="bold" font-family="Arial, sans-serif">MAJOR.MINOR.PATCH</text>
  <text x="640" y="316.190428571429" text-anchor="middle" fill="var(--bg)" font-size="38.837721806953" font-family="Arial, sans-serif">2.4.1</text>
  <rect x="40" y="454.285714285714" width="360" height="165.714285714286" fill="url(#grad-danger)" rx="7.855844048496" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="220" y="523.333285714286" text-anchor="middle" fill="var(--bg)" font-size="29.128291355215" font-family="Arial, sans-serif">Breaking</text>
  <text x="220" y="578.571428571429" text-anchor="middle" fill="var(--bg)" font-size="24.273510663979" font-family="Arial, sans-serif">3.0.0</text>
  <rect x="460" y="454.285714285714" width="360" height="165.714285714286" fill="url(#grad-warn)" rx="7.855844048496" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="523.333285714286" text-anchor="middle" fill="var(--bg)" font-size="29.128291355215" font-family="Arial, sans-serif">Features</text>
  <text x="640" y="578.571428571429" text-anchor="middle" fill="var(--bg)" font-size="24.273510663979" font-family="Arial, sans-serif">2.5.0</text>
  <rect x="880" y="454.285714285714" width="360" height="165.714285714286" fill="url(#grad-ok)" rx="7.855844048496" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1060" y="523.333285714286" text-anchor="middle" fill="var(--bg)" font-size="29.128291355215" font-family="Arial, sans-serif">Fixes</text>
  <text x="1060" y="578.571428571429" text-anchor="middle" fill="var(--bg)" font-size="24.273510663979" font-family="Arial, sans-serif">2.4.2</text>
</svg>

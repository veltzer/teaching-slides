<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="740" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.571295853607" font-weight="bold" fill="var(--text)">The ReAct Loop</text>
  <rect x="40" y="93.538461538462" width="350" height="464" rx="10.561177090574" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--info-text)">Thought</text>
  <text x="65" y="164.923076923077" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">Reflects on goal</text>
  <text x="65" y="191.692307692308" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">Reasons about state</text>
  <text x="65" y="218.461538461538" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">Plans next step</text>
  <text x="65" y="245.230769230769" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">Visible chain</text>
  <path d="M 396.25 182.769230769231 L 458.75 182.769230769231" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="465" y="93.538461538462" width="350" height="464" rx="10.561177090574" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--primary-text)">Action</text>
  <text x="490" y="164.923076923077" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">Calls a tool</text>
  <text x="490" y="191.692307692308" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">Or finishes</text>
  <text x="490" y="218.461538461538" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">Concrete operation</text>
  <text x="490" y="245.230769230769" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">No guessing</text>
  <path d="M 821.25 182.769230769231 L 883.75 182.769230769231" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="890" y="93.538461538462" width="350" height="464" rx="10.561177090574" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--warn-text)">Observation</text>
  <text x="915" y="164.923076923077" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">Tool returns</text>
  <text x="915" y="191.692307692308" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">Result or error</text>
  <text x="915" y="218.461538461538" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">Updates context</text>
  <text x="915" y="245.230769230769" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">Feeds next thought</text>
  <path d="M 1065 557.538461538462 Q 215 584.307692307692 215 539.692307692308" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="740" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Loop until the agent decides to finish</text>
</svg>

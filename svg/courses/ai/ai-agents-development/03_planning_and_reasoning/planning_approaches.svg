<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="634.871794871795" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.858629780717" font-weight="bold" fill="var(--text)">Planning Approaches Compared</text>

  <rect x="40" y="102.142857142857" width="287.179487179487" height="227.857142857143" rx="10.306653493113" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="183.589743589744" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.551976287604" font-weight="bold" fill="var(--info-text)">ReAct</text>
  <text x="183.589743589744" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.429314890359" fill="var(--info-text)">thought → act →</text>
  <text x="183.589743589744" y="197.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.429314890359" fill="var(--info-text)">observe → repeat</text>
  <text x="183.589743589744" y="234.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--info-text)">+ simple to start</text>
  <text x="183.589743589744" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--info-text)">- token heavy</text>
  <text x="183.589743589744" y="280.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--info-text)">- drifts on long traces</text>
  <text x="183.589743589744" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" font-weight="bold" fill="var(--info-text)">simple goals</text>

  <rect x="357.948717948718" y="102.142857142857" width="287.179487179487" height="227.857142857143" rx="10.306653493113" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.538461538461" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.551976287604" font-weight="bold" fill="var(--primary-text)">Plan-and-Execute</text>
  <text x="501.538461538461" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.429314890359" fill="var(--primary-text)">plan first</text>
  <text x="501.538461538461" y="197.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.429314890359" fill="var(--primary-text)">execute step-by-step</text>
  <text x="501.538461538461" y="234.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--primary-text)">+ cheaper exec</text>
  <text x="501.538461538461" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--primary-text)">+ predictable</text>
  <text x="501.538461538461" y="280.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--primary-text)">- replans on failure</text>
  <text x="501.538461538461" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" font-weight="bold" fill="var(--primary-text)">predictable workflows</text>

  <rect x="675.897435897436" y="102.142857142857" width="287.179487179487" height="227.857142857143" rx="10.306653493113" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="819.487179487179" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.551976287604" font-weight="bold" fill="var(--warn-text)">Reflection</text>
  <text x="819.487179487179" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.429314890359" fill="var(--warn-text)">act → critique →</text>
  <text x="819.487179487179" y="197.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.429314890359" fill="var(--warn-text)">refine → repeat</text>
  <text x="819.487179487179" y="234.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--warn-text)">+ catches mistakes</text>
  <text x="819.487179487179" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--warn-text)">- more tokens</text>
  <text x="819.487179487179" y="280.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--warn-text)">- diminishing returns</text>
  <text x="819.487179487179" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" font-weight="bold" fill="var(--warn-text)">high-stakes tasks</text>

  <rect x="993.846153846154" y="102.142857142857" width="246.153846153846" height="227.857142857143" rx="10.306653493113" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.923076923077" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.551976287604" font-weight="bold" fill="var(--danger-text)">Tree of Thoughts</text>
  <text x="1116.923076923077" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.429314890359" fill="var(--danger-text)">explore branches</text>
  <text x="1116.923076923077" y="197.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.429314890359" fill="var(--danger-text)">score, backtrack</text>
  <text x="1116.923076923077" y="234.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--danger-text)">+ powerful</text>
  <text x="1116.923076923077" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--danger-text)">- expensive</text>
  <text x="1116.923076923077" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" font-weight="bold" fill="var(--danger-text)">hard problems</text>

  <text x="634.871794871795" y="392.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.613306986227" font-weight="bold" fill="var(--text)">Cost / Capability axis</text>

  <line x1="81.025641025641" y1="443.928571428571" x2="1188.717948717949" y2="443.928571428571" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="81.025641025641" y="472.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--text-muted)">cheap</text>
  <text x="1147.692307692308" y="472.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--text-muted)">expensive</text>
  <text x="81.025641025641" y="490.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--text-muted)">simple goals</text>
  <text x="1147.692307692308" y="490.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--text-muted)">complex goals</text>

  <rect x="175.344420795253" y="435.68324863408" width="16.490645588982" height="16.490645588982" rx="8.245322794491" fill="var(--info-accent)"/>
  <rect x="493.29313874396996" y="435.68324863408" width="16.490645588982" height="16.490645588982" rx="8.245322794491" fill="var(--primary-accent)"/>
  <rect x="811.241856692688" y="435.68324863408" width="16.490645588982" height="16.490645588982" rx="8.245322794491" fill="var(--warn-accent)"/>
  <rect x="1108.677754128586" y="435.68324863408" width="16.490645588982" height="16.490645588982" rx="8.245322794491" fill="var(--danger-accent)"/>

  <rect x="40" y="537.142857142857" width="1189.74358974359" height="82.857142857143" rx="8.245322794491" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="634.871794871795" y="566.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.45998023967" font-weight="bold" fill="var(--text)">Always cap iterations and watch token cost</text>
  <text x="634.871794871795" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.398649541047" fill="var(--text-muted)">Self-consistency (vote across samples) layers on top of any approach</text>
</svg>

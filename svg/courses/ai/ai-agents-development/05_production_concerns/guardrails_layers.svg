<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="629.473684210526" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.235882783068" font-weight="bold" fill="var(--text)">Production Guardrails: Defense in Depth</text>

  <rect x="40" y="102.142857142857" width="231.578947368421" height="517.857142857143" rx="10.441386708238" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.789473684211" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--info-text)">Input Layer</text>
  <text x="155.789473684211" y="179.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">PII detection</text>
  <text x="155.789473684211" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">prompt-injection</text>
  <text x="155.789473684211" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">filter</text>
  <text x="155.789473684211" y="267.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">rate limit</text>
  <text x="155.789473684211" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">tenant quota</text>
  <text x="155.789473684211" y="350.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">content policy</text>
  <text x="155.789473684211" y="392.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--info-text)">request logging</text>

  <rect x="292.631578947368" y="102.142857142857" width="231.578947368421" height="517.857142857143" rx="10.441386708238" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="408.421052631579" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--primary-text)">Model Layer</text>
  <text x="408.421052631579" y="179.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">pinned version</text>
  <text x="408.421052631579" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">system prompt</text>
  <text x="408.421052631579" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">isolates user input</text>
  <text x="408.421052631579" y="267.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">low temperature</text>
  <text x="408.421052631579" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">timeouts</text>
  <text x="408.421052631579" y="350.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">max tokens</text>

  <rect x="545.263157894737" y="102.142857142857" width="231.578947368421" height="517.857142857143" rx="10.441386708238" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="661.052631578947" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--warn-text)">Tool Layer</text>
  <text x="661.052631578947" y="179.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">allow-list per role</text>
  <text x="661.052631578947" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">arg validation</text>
  <text x="661.052631578947" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">action confirms</text>
  <text x="661.052631578947" y="304.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">idempotency keys</text>
  <text x="661.052631578947" y="345.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">audit log</text>
  <text x="661.052631578947" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">retry caps</text>
  <text x="661.052631578947" y="428.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--warn-text)">side-effect gates</text>

  <rect x="797.894736842105" y="102.142857142857" width="231.578947368421" height="517.857142857143" rx="10.441386708238" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="913.684210526316" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--danger-text)">Output Layer</text>
  <text x="913.684210526316" y="179.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--danger-text)">PII redaction</text>
  <text x="913.684210526316" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--danger-text)">profanity filter</text>
  <text x="913.684210526316" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--danger-text)">secret detection</text>
  <text x="913.684210526316" y="304.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--danger-text)">structure validate</text>
  <text x="913.684210526316" y="345.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--danger-text)">fact-check rules</text>
  <text x="913.684210526316" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--danger-text)">user warnings</text>

  <rect x="1050.526315789474" y="102.142857142857" width="189.473684210526" height="517.857142857143" rx="10.441386708238" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.263157894737" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--ok-text)">Observe</text>
  <text x="1145.263157894737" y="179.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">trace IDs</text>
  <text x="1145.263157894737" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">latency p99</text>
  <text x="1145.263157894737" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">cost per req</text>
  <text x="1145.263157894737" y="304.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">eval set</text>
  <text x="1145.263157894737" y="345.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--ok-text)">user feedback</text>

  <path d="M 271.578947368421 361.071428571429 L 292.631578947368 361.071428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 524.210526315789 361.071428571429 L 545.263157894737 361.071428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 776.842105263158 361.071428571429 L 797.894736842105 361.071428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1029.473684210526 361.071428571429 L 1050.526315789474 361.071428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.982753492379" font-weight="bold" fill="var(--text)">Multi-Agent Orchestration Patterns</text>

  <text x="205.51724137931" y="91.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631770102244" font-weight="bold" fill="var(--text-muted)">Supervisor</text>
  <text x="640" y="91.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631770102244" font-weight="bold" fill="var(--text-muted)">Pipeline</text>
  <text x="1074.48275862069" y="91.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.631770102244" font-weight="bold" fill="var(--text-muted)">Debate</text>

  <rect x="153.793103448276" y="122.857142857143" width="103.448275862069" height="51.785714285714" rx="8.280786712108" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="205.51724137931" y="153.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--primary-text)">Supervisor</text>

  <rect x="60.689655172414" y="226.428571428571" width="103.448275862069" height="51.785714285714" rx="8.280786712108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="112.413793103448" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">Worker A</text>

  <rect x="184.827586206897" y="226.428571428571" width="103.448275862069" height="51.785714285714" rx="8.280786712108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724137931" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">Worker B</text>

  <rect x="308.965517241379" y="226.428571428571" width="103.448275862069" height="51.785714285714" rx="8.280786712108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="360.689655172414" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">Worker C</text>

  <path d="M 205.51724137931 174.642857142857 L 112.413793103448 226.428571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 205.51724137931 174.642857142857 L 236.551724137931 226.428571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 205.51724137931 174.642857142857 L 360.689655172414 226.428571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 112.413793103448 278.214285714286 L 184.827586206897 309.285714285714" fill="none" stroke="var(--ok-accent)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-ok)"/>
  <path d="M 236.551724137931 278.214285714286 L 205.51724137931 309.285714285714" fill="none" stroke="var(--ok-accent)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-ok)"/>
  <path d="M 360.689655172414 278.214285714286 L 226.206896551724 309.285714285714" fill="none" stroke="var(--ok-accent)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-ok)"/>

  <text x="205.51724137931" y="361.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--text)">routes &amp; aggregates</text>
  <text x="205.51724137931" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421180068162" fill="var(--text-muted)">org-chart shape</text>

  <rect x="495.172413793103" y="185" width="124.137931034483" height="51.785714285714" rx="8.280786712108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="557.241379310345" y="216.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">Researcher</text>

  <rect x="640" y="185" width="103.448275862069" height="51.785714285714" rx="8.280786712108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="691.724137931035" y="216.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">Writer</text>

  <rect x="764.137931034483" y="185" width="103.448275862069" height="51.785714285714" rx="8.280786712108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="815.862068965517" y="216.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">Reviewer</text>

  <path d="M 619.310344827586 210.892857142857 L 640 210.892857142857" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 743.448275862069 210.892857142857 L 764.137931034483 210.892857142857" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="691.724137931035" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--text)">fixed sequence</text>
  <text x="691.724137931035" y="319.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421180068162" fill="var(--text-muted)">predictable cost</text>
  <text x="691.724137931035" y="342.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421180068162" fill="var(--text-muted)">testable per stage</text>

  <rect x="960.689655172414" y="143.571428571429" width="103.448275862069" height="51.785714285714" rx="8.280786712108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1012.413793103448" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">Agent A</text>

  <rect x="1095.172413793103" y="143.571428571429" width="103.448275862069" height="51.785714285714" rx="8.280786712108" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1146.896551724138" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--info-text)">Agent B</text>

  <rect x="1022.758620689655" y="278.214285714286" width="124.137931034483" height="51.785714285714" rx="8.280786712108" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1084.827586206897" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--warn-text)">Judge</text>

  <path d="M 1012.413793103448 195.357142857143 L 1064.137931034483 195.357142857143" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1146.896551724138 195.357142857143 L 1095.172413793103 195.357142857143" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 1012.413793103448 195.357142857143 L 1053.793103448276 278.214285714286" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1146.896551724138 195.357142857143 L 1115.862068965517 278.214285714286" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1084.827586206897" y="376.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" font-weight="bold" fill="var(--text)">two argue, one decides</text>
  <text x="1084.827586206897" y="400.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421180068162" fill="var(--text-muted)">reduces single-model bias</text>

  <rect x="40" y="443.928571428571" width="1200" height="176.071428571429" rx="10.350983390135" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" font-weight="bold" fill="var(--text)">Communication: structured messages, not free-form chatter</text>
  <text x="640" y="506.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text-muted)">Each agent: narrow tools, narrow prompt, narrow role</text>
  <text x="640" y="531.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text-muted)">Always: global iteration cap, cost budget, traceable handoffs</text>
  <text x="640" y="566.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--danger-accent)">Anti-pattern: more agents instead of better prompts</text>
  <text x="640" y="594.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.456278407176" fill="var(--text-muted)">Start simple — add agents only when specialization clearly pays</text>
</svg>

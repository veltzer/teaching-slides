<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="280" height="200" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180.0" y="115.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Week 1</text>
  <text x="180.0" y="142.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">one feature, one volunteer</text>
  <text x="180.0" y="163.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">one template, spec review</text>
  <text x="180.0" y="184.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">in the pull request</text>
  <line x1="320" y1="140" x2="346" y2="140" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="346" y="40" width="280" height="200" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="486.0" y="115.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Week 2</text>
  <text x="486.0" y="142.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">add plan and task review</text>
  <text x="486.0" y="163.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">implement one task</text>
  <text x="486.0" y="184.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">at a time</text>
  <line x1="626" y1="140" x2="652" y2="140" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="652" y="40" width="280" height="200" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.0" y="115.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Week 3</text>
  <text x="792.0" y="142.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">second-agent audit</text>
  <text x="792.0" y="163.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">spec becomes the</text>
  <text x="792.0" y="184.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">PR description</text>
  <line x1="932" y1="140" x2="958" y2="140" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="958" y="40" width="280" height="200" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.0" y="115.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Week 4</text>
  <text x="1098.0" y="142.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">write the constitution</text>
  <text x="1098.0" y="163.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">retro: keep, drop,</text>
  <text x="1098.0" y="184.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">or change the template</text>
  <rect x="40" y="280" width="580" height="340" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-border)">Signs it is working</text>
  <text x="330" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">reviewers read the spec before the diff</text>
  <text x="330" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">fewer re-prompts per feature</text>
  <text x="330" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">new joiners start from docs/specs/</text>
  <text x="330" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">specs are amended, not abandoned</text>
  <rect x="660" y="280" width="580" height="340" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-border)">Stop signals</text>
  <text x="950" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">specs written for one-line fixes</text>
  <text x="950" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">specs nobody reads: too long</text>
  <text x="950" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">code moved on, spec did not</text>
  <text x="950" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">the spec written after the code</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="380" height="100" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="96.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Under-specified</text>
  <rect x="40" y="160" width="380" height="200" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">agent fills gaps with guesses</text>
  <text x="230" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">every run gives a different design</text>
  <text x="230" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">review finds surprises</text>
  <rect x="450" y="40" width="380" height="100" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="96.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Calibrated</text>
  <rect x="450" y="160" width="380" height="200" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">you decide the what and the limits</text>
  <text x="640" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">agent decides the how</text>
  <text x="640" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">review checks the contract</text>
  <rect x="860" y="40" width="380" height="100" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.0" y="96.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Over-specified</text>
  <rect x="860" y="160" width="380" height="200" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1050" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">the code written in prose</text>
  <text x="1050" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">twice the work, half the value</text>
  <text x="1050" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">spec rots the moment code changes</text>
  <line x1="60" y1="400" x2="1220" y2="400" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="60" y="430" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">less detail</text>
  <text x="1220" y="430" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">more detail</text>
  <rect x="40" y="460" width="1200" height="160" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="524.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Leave to the agent on purpose</text>
  <text x="640.0" y="552.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">naming, file layout, private helpers, test scaffolding, idiomatic details</text>
  <text x="640.0" y="574.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Keep for yourself: behavior, interfaces, data, limits, errors, non-goals</text>
</svg>

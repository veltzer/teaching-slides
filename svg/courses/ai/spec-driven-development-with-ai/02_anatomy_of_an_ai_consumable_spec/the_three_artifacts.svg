<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="70" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="81.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Constitution: ground rules for every feature</text>
  <rect x="40" y="150" width="380" height="300" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="251.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Requirements</text>
  <text x="230.0" y="280.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">what and why</text>
  <text x="230.0" y="302.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">user stories</text>
  <text x="230.0" y="324.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">acceptance criteria</text>
  <text x="230.0" y="346.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">edge cases, limits</text>
  <text x="230.0" y="368.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">open questions</text>
  <rect x="450" y="150" width="380" height="300" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="251.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Technical plan</text>
  <text x="640.0" y="280.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">how and with what</text>
  <text x="640.0" y="302.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">stack and constraints</text>
  <text x="640.0" y="324.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">interfaces, data model</text>
  <text x="640.0" y="346.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">decisions and rejected</text>
  <text x="640.0" y="368.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">alternatives, non-goals</text>
  <rect x="860" y="150" width="380" height="300" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.0" y="251.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Task list</text>
  <text x="1050.0" y="280.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">small ordered steps</text>
  <text x="1050.0" y="302.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">each verifiable</text>
  <text x="1050.0" y="324.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">each has a done check</text>
  <text x="1050.0" y="346.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">reviewed one diff</text>
  <text x="1050.0" y="368.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">at a time</text>
  <line x1="420" y1="300" x2="450" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="300" x2="860" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="110" x2="640" y2="150" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arrow)"/>
  <rect x="40" y="480" width="380" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">reviewed by product + dev</text>
  <rect x="450" y="480" width="380" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">reviewed by architect + dev</text>
  <rect x="860" y="480" width="380" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1050" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">reviewed by the implementer</text>
  <rect x="40" y="560" width="1200" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="597" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Each artifact is written before the next one and stays in the repository</text>
</svg>

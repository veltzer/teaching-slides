<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="220" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.0" y="95.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Ubiquitous</text>
  <rect x="280" y="40" width="520" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="540" y="98" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--text)">The &lt;system&gt; shall &lt;response&gt;</text>
  <rect x="820" y="40" width="420" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1030" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">The service shall log every request</text>
  <rect x="40" y="160" width="220" height="100" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.0" y="215.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Event-driven</text>
  <rect x="280" y="160" width="520" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="540" y="218" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--text)">When &lt;trigger&gt;, the &lt;system&gt; shall &lt;response&gt;</text>
  <rect x="820" y="160" width="420" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1030" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">When a token expires, return 401</text>
  <rect x="40" y="280" width="220" height="100" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.0" y="335.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">State-driven</text>
  <rect x="280" y="280" width="520" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="540" y="338" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--text)">While &lt;state&gt;, the &lt;system&gt; shall &lt;response&gt;</text>
  <rect x="820" y="280" width="420" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1030" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">While offline, queue writes</text>
  <rect x="40" y="400" width="220" height="100" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.0" y="455.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Unwanted</text>
  <rect x="280" y="400" width="520" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="540" y="458" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--text)">If &lt;condition&gt;, then the &lt;system&gt; shall &lt;response&gt;</text>
  <rect x="820" y="400" width="420" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1030" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">If the upload exceeds 10 MB, reject it</text>
  <rect x="40" y="520" width="220" height="100" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.0" y="575.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Optional</text>
  <rect x="280" y="520" width="520" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="540" y="578" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--text)">Where &lt;feature&gt;, the &lt;system&gt; shall &lt;response&gt;</text>
  <rect x="820" y="520" width="420" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1030" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Where SSO is enabled, skip the password form</text>
</svg>

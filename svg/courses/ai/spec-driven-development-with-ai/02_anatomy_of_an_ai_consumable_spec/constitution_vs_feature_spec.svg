<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="420" height="480" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250.0" y="199.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">Constitution</text>
  <text x="250.0" y="228.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">repository-wide, changes rarely</text>
  <text x="250.0" y="250.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)"/>
  <text x="250.0" y="272.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">language, stack, versions</text>
  <text x="250.0" y="294.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">code style and layout</text>
  <text x="250.0" y="316.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">test policy and coverage</text>
  <text x="250.0" y="338.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">security and data rules</text>
  <text x="250.0" y="360.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">definition of done</text>
  <text x="250.0" y="382.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">review gates</text>
  <rect x="640" y="40" width="600" height="150" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940.0" y="99.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="var(--primary-text)">Feature: password reset</text>
  <text x="940.0" y="126.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">stories, criteria, edge cases</text>
  <text x="940.0" y="147.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">plan, tasks, open questions</text>
  <line x1="460" y1="280" x2="640" y2="115" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="640" y="205" width="600" height="150" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940.0" y="264.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="var(--ok-text)">Feature: audit export</text>
  <text x="940.0" y="291.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">stories, criteria, edge cases</text>
  <text x="940.0" y="312.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">plan, tasks, open questions</text>
  <line x1="460" y1="280" x2="640" y2="280" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="640" y="370" width="600" height="150" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940.0" y="429.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="var(--warn-text)">Feature: rate limiting</text>
  <text x="940.0" y="456.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">stories, criteria, edge cases</text>
  <text x="940.0" y="477.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">plan, tasks, open questions</text>
  <line x1="460" y1="280" x2="640" y2="445" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="550" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-border)">applies to</text>
  <rect x="40" y="540" width="1200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">If a rule matters for every feature it belongs in the constitution;</text>
  <text x="640" y="598" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">if it matters for this feature only, it belongs in the feature spec</text>
</svg>

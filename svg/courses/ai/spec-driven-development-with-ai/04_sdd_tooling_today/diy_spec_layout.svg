<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="480" height="400" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="280" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Repository layout</text>
  <text x="70" y="115" text-anchor="start" font-family="Courier New, monospace" font-size="14" fill="var(--text)">docs/specs/</text>
  <text x="70" y="145" text-anchor="start" font-family="Courier New, monospace" font-size="14" fill="var(--text)">  README.md        (the constitution)</text>
  <text x="70" y="175" text-anchor="start" font-family="Courier New, monospace" font-size="14" fill="var(--text)">  TEMPLATE.md      (copy per feature)</text>
  <text x="70" y="205" text-anchor="start" font-family="Courier New, monospace" font-size="14" fill="var(--text)">  042-export/</text>
  <text x="70" y="235" text-anchor="start" font-family="Courier New, monospace" font-size="14" fill="var(--text)">    spec.md</text>
  <text x="70" y="265" text-anchor="start" font-family="Courier New, monospace" font-size="14" fill="var(--text)">    plan.md</text>
  <text x="70" y="295" text-anchor="start" font-family="Courier New, monospace" font-size="14" fill="var(--text)">    tasks.md</text>
  <text x="70" y="325" text-anchor="start" font-family="Courier New, monospace" font-size="14" fill="var(--text)">CLAUDE.md</text>
  <text x="70" y="355" text-anchor="start" font-family="Courier New, monospace" font-size="14" fill="var(--text)">.github/copilot-instructions.md</text>
  <text x="70" y="385" text-anchor="start" font-family="Courier New, monospace" font-size="14" fill="var(--text)">.cursor/rules/sdd.mdc</text>
  <rect x="600" y="40" width="640" height="220" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="920.0" y="116.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Instruction file wiring</text>
  <text x="920.0" y="142.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Before coding, read docs/specs/&lt;n&gt;/spec.md and plan.md</text>
  <text x="920.0" y="162.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Work on exactly one task from tasks.md, then stop</text>
  <text x="920.0" y="182.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Never change spec.md yourself; propose an amendment</text>
  <text x="920.0" y="202.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Report criteria you could not satisfy</text>
  <line x1="520" y1="340" x2="600" y2="340" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="600" y="300" width="640" height="140" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="920.0" y="355.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Same files, any agent</text>
  <text x="920.0" y="382.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Claude Code, Copilot, Cursor, Aider</text>
  <text x="920.0" y="403.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">read the same three Markdown documents</text>
  <rect x="40" y="470" width="1200" height="150" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">DIY wins when</text>
  <text x="640" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">the team mixes agents, or the framework templates fight the codebase</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Frameworks win when a team wants one enforced, opinionated path</text>
</svg>

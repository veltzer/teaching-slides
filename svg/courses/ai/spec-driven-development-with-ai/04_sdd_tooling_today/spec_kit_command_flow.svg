<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="180" height="100" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130.0" y="85.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--info-text)">specify init</text>
  <text x="130.0" y="109.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">scaffolds the project</text>
  <line x1="220" y1="90" x2="244" y2="90" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="244" y="40" width="180" height="100" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="334.0" y="85.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--info-text)">/constitution</text>
  <text x="334.0" y="109.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">ground rules</text>
  <line x1="424" y1="90" x2="448" y2="90" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="448" y="40" width="180" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="538.0" y="85.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--primary-text)">/specify</text>
  <text x="538.0" y="109.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">requirements</text>
  <line x1="628" y1="90" x2="652" y2="90" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="652" y="40" width="180" height="100" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.0" y="85.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--warn-text)">/plan</text>
  <text x="742.0" y="109.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">technical plan</text>
  <line x1="832" y1="90" x2="856" y2="90" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="856" y="40" width="180" height="100" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="946.0" y="85.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--warn-text)">/tasks</text>
  <text x="946.0" y="109.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">task list</text>
  <line x1="1036" y1="90" x2="1060" y2="90" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1060" y="40" width="180" height="100" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150.0" y="85.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--ok-text)">/implement</text>
  <text x="1150.0" y="109.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">runs the tasks</text>
  <line x1="334" y1="140" x2="334" y2="200" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arrow-info)"/>
  <rect x="244" y="200" width="180" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="334" y="242" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--text)">memory/constitution.md</text>
  <line x1="538" y1="140" x2="538" y2="200" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arrow-primary)"/>
  <rect x="448" y="200" width="180" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="538" y="242" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--text)">specs/001/spec.md</text>
  <line x1="742" y1="140" x2="742" y2="200" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arrow-warn)"/>
  <rect x="652" y="200" width="180" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="742" y="242" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--text)">specs/001/plan.md</text>
  <line x1="946" y1="140" x2="946" y2="200" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arrow-warn)"/>
  <rect x="856" y="200" width="180" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="946" y="242" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--text)">specs/001/tasks.md</text>
  <line x1="1150" y1="140" x2="1150" y2="200" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arrow-ok)"/>
  <rect x="1060" y="200" width="180" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1150" y="242" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--text)">src/, tests/</text>
  <text x="130" y="242" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--text-muted)">templates, scripts</text>
  <rect x="40" y="200" width="180" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <line x1="130" y1="140" x2="130" y2="200" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arrow-info)"/>
  <rect x="40" y="300" width="580" height="320" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-border)">Commit</text>
  <text x="330" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">the constitution</text>
  <text x="330" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">every specs/NNN-feature/ directory</text>
  <text x="330" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">the templates you customized</text>
  <text x="330" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">the generated code and tests</text>
  <rect x="660" y="300" width="580" height="320" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-border)">Agent-specific glue</text>
  <text x="950" y="380" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--text-muted)">Claude Code: .claude/commands/</text>
  <text x="950" y="420" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--text-muted)">Copilot: .github/prompts/</text>
  <text x="950" y="460" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--text-muted)">Cursor: .cursor/commands/</text>
  <text x="950" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">same spec files, different launcher</text>
</svg>

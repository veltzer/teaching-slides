<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="200" y="40" width="240" height="70" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320.0" y="81.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">TDD</text>
  <rect x="460" y="40" width="240" height="70" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580.0" y="81.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">BDD</text>
  <rect x="720" y="40" width="240" height="70" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840.0" y="81.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">DDD</text>
  <rect x="980" y="40" width="240" height="70" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100.0" y="81.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">SDD</text>
  <rect x="40" y="130" width="150" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="115" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Spec is</text>
  <rect x="200" y="130" width="240" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320.0" y="180.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">tests</text>
  <rect x="460" y="130" width="240" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="580.0" y="180.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Given / When / Then</text>
  <rect x="720" y="130" width="240" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="840.0" y="169.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">domain model</text>
  <text x="840.0" y="191.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">ubiquitous language</text>
  <rect x="980" y="130" width="240" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1100.0" y="180.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">prose + criteria + plan + tasks</text>
  <rect x="40" y="250" width="150" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="115" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Written by</text>
  <rect x="200" y="250" width="240" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320.0" y="300.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">developer</text>
  <rect x="460" y="250" width="240" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="580.0" y="300.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">product + dev</text>
  <rect x="720" y="250" width="240" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="840.0" y="300.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">domain experts + dev</text>
  <rect x="980" y="250" width="240" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1100.0" y="289.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">developer</text>
  <text x="1100.0" y="311.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">reviewed by team</text>
  <rect x="40" y="370" width="150" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="115" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Consumed by</text>
  <rect x="200" y="370" width="240" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320.0" y="420.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">test runner</text>
  <rect x="460" y="370" width="240" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="580.0" y="420.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">test runner + humans</text>
  <rect x="720" y="370" width="240" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="840.0" y="420.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">humans</text>
  <rect x="980" y="370" width="240" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1100.0" y="409.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">the AI agent</text>
  <text x="1100.0" y="431.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">then humans</text>
  <rect x="40" y="500" width="1200" height="120" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">SDD borrows from all three: BDD precision, DDD vocabulary, TDD verification</text>
  <text x="640" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Not waterfall: one feature at a time, spec written in hours, revised as code lands</text>
</svg>

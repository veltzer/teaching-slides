<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="340" height="130" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.0" y="100.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Acceptance criteria</text>
  <text x="210.0" y="127.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">from the requirements</text>
  <rect x="470" y="40" width="340" height="130" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="90.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Tests</text>
  <text x="640.0" y="117.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">one per criterion,</text>
  <text x="640.0" y="138.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">written before the code</text>
  <rect x="900" y="40" width="340" height="130" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.0" y="100.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Implementation</text>
  <text x="1070.0" y="127.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">by the coding agent</text>
  <line x1="380" y1="105" x2="470" y2="105" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="105" x2="900" y2="105" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arrow)"/>
  <text x="855" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">runs</text>
  <rect x="370" y="230" width="540" height="120" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="275.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Second agent audit</text>
  <text x="640.0" y="302.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">fresh context, reads spec and diff only</text>
  <text x="640.0" y="323.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">lists every criterion: met, unmet, unclear</text>
  <line x1="210" y1="170" x2="560" y2="230" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1070" y1="170" x2="720" y2="230" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="420" width="380" height="130" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="469.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="var(--danger-text)">Code is wrong</text>
  <text x="230.0" y="496.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">fix the code</text>
  <text x="230.0" y="517.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">re-run the audit</text>
  <line x1="640" y1="350" x2="230" y2="420" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="420" width="380" height="130" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="469.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="var(--warn-text)">Spec was wrong</text>
  <text x="640.0" y="496.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">amend the spec</text>
  <text x="640.0" y="517.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">re-plan, then fix</text>
  <line x1="640" y1="350" x2="640" y2="420" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="860" y="420" width="380" height="130" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.0" y="469.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="var(--ok-text)">Both agree</text>
  <text x="1050.0" y="496.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">merge with the spec</text>
  <text x="1050.0" y="517.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">as PR description</text>
  <line x1="640" y1="350" x2="1050" y2="420" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="570" width="1200" height="50" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="601" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Never let the implementing agent grade its own work</text>
</svg>

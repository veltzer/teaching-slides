<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="380" height="110" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="91.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Spec review</text>
  <text x="230.0" y="118.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">before any code exists</text>
  <rect x="40" y="170" width="380" height="260" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">check</text>
  <text x="230" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">every story has criteria</text>
  <text x="230" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">errors and limits named</text>
  <text x="230" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">open questions marked</text>
  <rect x="40" y="450" width="380" height="80" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="494.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-text)">skip it: build the wrong thing fast</text>
  <line x1="420" y1="95" x2="450" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="40" width="380" height="110" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="91.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Plan review</text>
  <text x="640.0" y="118.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">before tasks are cut</text>
  <rect x="450" y="170" width="380" height="260" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">check</text>
  <text x="640" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">plan matches every requirement</text>
  <text x="640" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">interfaces fit the codebase</text>
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">rejected options recorded</text>
  <rect x="450" y="450" width="380" height="80" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="494.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-text)">skip it: right feature, wrong shape</text>
  <line x1="830" y1="95" x2="860" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="860" y="40" width="380" height="110" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.0" y="91.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Diff review</text>
  <text x="1050.0" y="118.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">after each task</text>
  <rect x="860" y="170" width="380" height="260" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1050" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">check</text>
  <text x="1050" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">diff does only its task</text>
  <text x="1050" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">criteria for the task pass</text>
  <text x="1050" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">no silent spec changes</text>
  <rect x="860" y="450" width="380" height="80" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.0" y="494.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-text)">skip it: violations found at the end</text>
  <rect x="40" y="560" width="1200" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="597" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Cheapest fix is at the earliest gate: a sentence in the spec beats a rewritten module</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="260" height="90" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.0" y="91.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Spec v1</text>
  <rect x="340" y="40" width="260" height="90" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470.0" y="91.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Plan v1</text>
  <line x1="300" y1="85" x2="340" y2="85" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="85" x2="640" y2="85" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="640" y="40" width="90" height="90" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="685.0" y="81.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">T1</text>
  <text x="685.0" y="104.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">done</text>
  <rect x="740" y="40" width="90" height="90" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785.0" y="81.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">T2</text>
  <text x="785.0" y="104.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">done</text>
  <rect x="840" y="40" width="90" height="90" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="885.0" y="81.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">T3</text>
  <text x="885.0" y="104.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">done</text>
  <rect x="940" y="40" width="90" height="90" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="985.0" y="81.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">T4</text>
  <text x="985.0" y="104.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">in progress</text>
  <rect x="1040" y="40" width="90" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1085" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">T5</text>
  <text x="1085" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">todo</text>
  <rect x="1140" y="40" width="90" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1185" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">T6</text>
  <text x="1185" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">todo</text>
  <rect x="40" y="200" width="1200" height="70" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="240.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="var(--danger-text)">Requirement changes: exports must also cover archived records</text>
  <line x1="640" y1="130" x2="640" y2="200" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <rect x="40" y="320" width="260" height="90" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.0" y="360.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Spec v2</text>
  <text x="170.0" y="387.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">amended, reviewed</text>
  <rect x="340" y="320" width="260" height="90" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470.0" y="360.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Re-plan</text>
  <text x="470.0" y="387.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">agent diffs the plan</text>
  <line x1="300" y1="365" x2="340" y2="365" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="365" x2="640" y2="365" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="270" x2="640" y2="320" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <rect x="640" y="320" width="90" height="90" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="685.0" y="361.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">T1</text>
  <text x="685.0" y="384.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">keep</text>
  <rect x="740" y="320" width="90" height="90" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785.0" y="361.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">T2</text>
  <text x="785.0" y="384.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">keep</text>
  <rect x="840" y="320" width="90" height="90" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="885.0" y="361.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">T3</text>
  <text x="885.0" y="384.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">keep</text>
  <rect x="940" y="320" width="90" height="90" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="985.0" y="361.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">T4</text>
  <text x="985.0" y="384.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">revise</text>
  <rect x="1040" y="320" width="90" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1085" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">T5</text>
  <text x="1085" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">keep</text>
  <rect x="1140" y="320" width="90" height="90" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1185.0" y="361.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">T7</text>
  <text x="1185.0" y="384.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-text)">new</text>
  <text x="1185" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-border)">T6 dropped</text>
  <rect x="40" y="470" width="1200" height="150" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Change the spec first, then the plan, then the code</text>
  <text x="640" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Finished tasks survive; only the affected tasks are revised or added</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Patching the code first is how drift starts</text>
</svg>

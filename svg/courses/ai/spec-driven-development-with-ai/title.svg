<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="250" y="240" width="220" height="280" rx="6" fill="var(--surface)" stroke="var(--info-border)" stroke-width="2" opacity="0.9"/>
  <rect x="275" y="275" width="150" height="10" rx="3" fill="var(--info-fill)" opacity="0.8"/>
  <rect x="275" y="307" width="120" height="10" rx="3" fill="var(--info-fill)" opacity="0.8"/>
  <rect x="275" y="339" width="170" height="10" rx="3" fill="var(--info-fill)" opacity="0.8"/>
  <rect x="275" y="371" width="100" height="10" rx="3" fill="var(--info-fill)" opacity="0.8"/>
  <rect x="275" y="403" width="160" height="10" rx="3" fill="var(--info-fill)" opacity="0.8"/>
  <rect x="275" y="435" width="130" height="10" rx="3" fill="var(--info-fill)" opacity="0.8"/>
  <rect x="275" y="467" width="90" height="10" rx="3" fill="var(--info-fill)" opacity="0.8"/>
  <text x="360" y="500" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="var(--info-accent)">spec.md</text>
  <line x1="480" y1="380" x2="560" y2="380" stroke="var(--info-fill)" stroke-width="4" marker-end="url(#arrow-info)"/>
  <ellipse cx="640" cy="380" rx="70" ry="70" fill="none" stroke="var(--info-border)" stroke-width="3" opacity="0.9"/>
  <ellipse cx="640" cy="380" rx="45" ry="45" fill="none" stroke="var(--info-border)" stroke-width="2" opacity="0.6"/>
  <text x="640" y="392" text-anchor="middle" font-family="Courier New, monospace" font-size="34" font-weight="bold" fill="var(--info-fill)">AI</text>
  <line x1="720" y1="380" x2="800" y2="380" stroke="var(--info-fill)" stroke-width="4" marker-end="url(#arrow-info)"/>
  <rect x="810" y="240" width="220" height="280" rx="6" fill="var(--black)" stroke="var(--info-border)" stroke-width="2" opacity="0.9"/>
  <rect x="835" y="275" width="120" height="10" rx="3" fill="var(--primary-fill)" opacity="0.8"/>
  <rect x="855" y="307" width="150" height="10" rx="3" fill="var(--primary-fill)" opacity="0.8"/>
  <rect x="875" y="339" width="90" height="10" rx="3" fill="var(--primary-fill)" opacity="0.8"/>
  <rect x="875" y="371" width="130" height="10" rx="3" fill="var(--primary-fill)" opacity="0.8"/>
  <rect x="855" y="403" width="110" height="10" rx="3" fill="var(--primary-fill)" opacity="0.8"/>
  <rect x="835" y="435" width="60" height="10" rx="3" fill="var(--primary-fill)" opacity="0.8"/>
  <rect x="835" y="467" width="140" height="10" rx="3" fill="var(--primary-fill)" opacity="0.8"/>
  <text x="920" y="500" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="var(--primary-fill)">&amp;gt;_ code</text>
  <path d="M 920 230 Q 640 150 360 230" fill="none" stroke="var(--ok-fill)" stroke-width="3" stroke-dasharray="10,8" marker-end="url(#arrow-ok)"/>
  <text x="640" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-fill)">verify against the spec</text>
  <rect x="415" y="565" width="450" height="4" rx="2" fill="var(--info-fill)" opacity="0.6"/>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Spec-Driven Development with AI</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Specify, Plan, Implement, Verify</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--code-text)">RAG Applications</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="864" y="222" width="150" height="40" rx="20" fill="var(--ok-accent)"/>
  <text x="939" y="248" font-size="17" fill="var(--ok-text)">User Query</text>
  <line x1="939" y1="262" x2="939" y2="296" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="932,294 939,306 946,294" fill="var(--text-muted)"/>
  <rect x="80" y="310" width="150" height="60" rx="10" fill="var(--primary-fill)"/>
  <text x="155" y="346" font-size="18" fill="var(--primary-text)">Documents</text>
  <line x1="236" y1="340" x2="262" y2="340" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="260,333 271,340 260,347" fill="var(--text-muted)"/>
  <rect x="276" y="310" width="150" height="60" rx="10" fill="var(--primary-accent)"/>
  <text x="351" y="346" font-size="18" fill="var(--primary-text)">Chunking</text>
  <line x1="432" y1="340" x2="458" y2="340" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="456,333 467,340 456,347" fill="var(--text-muted)"/>
  <rect x="472" y="310" width="150" height="60" rx="10" fill="var(--info-fill)"/>
  <text x="547" y="346" font-size="18" fill="var(--info-text)">Embedding</text>
  <line x1="628" y1="340" x2="654" y2="340" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="652,333 663,340 652,347" fill="var(--text-muted)"/>
  <rect x="668" y="310" width="150" height="60" rx="10" fill="var(--info-accent)"/>
  <text x="743" y="346" font-size="18" fill="var(--info-text)">Vector Index</text>
  <line x1="824" y1="340" x2="850" y2="340" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="848,333 859,340 848,347" fill="var(--text-muted)"/>
  <rect x="864" y="310" width="150" height="60" rx="10" fill="var(--ok-fill)"/>
  <text x="939" y="346" font-size="18" fill="var(--ok-text)">Retrieval</text>
  <line x1="1020" y1="340" x2="1046" y2="340" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="1044,333 1055,340 1044,347" fill="var(--text-muted)"/>
  <rect x="1060" y="310" width="150" height="60" rx="10" fill="var(--warn-fill)"/>
  <text x="1135" y="346" font-size="18" fill="var(--warn-text)">LLM Answer</text>
  <polyline points="80,392 80,402 818,402 818,392" fill="none" stroke="var(--text-faint)" stroke-width="2"/>
  <text x="449" y="430" font-size="16" fill="var(--text-faint)">offline ingestion</text>
  <polyline points="864,392 864,402 1210,402 1210,392" fill="none" stroke="var(--text-faint)" stroke-width="2"/>
  <text x="1037" y="430" font-size="16" fill="var(--text-faint)">online answering</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">embeddings &amp; chunking • retrieval &amp; indexes • prompting • evaluation • production RAG</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.076824709656" font-weight="bold" fill="var(--text)">Hybrid Search: Vector + Keyword</text>

  <rect x="60.689655172414" y="106.923076923077" width="248.275862068966" height="66.923076923077" rx="8.593378488473" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586206897" y="145.961538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.186756976946" font-weight="bold" fill="var(--primary-text)">Query</text>

  <path d="M 308.965517241379 140.384615384615 L 371.034482758621 140.384615384615" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="371.034482758621" y="84.615384615385" width="248.275862068966" height="111.538461538462" rx="8.593378488473" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495.172413793103" y="123.653846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.112584665887" font-weight="bold" fill="var(--info-text)">Vector search</text>
  <text x="495.172413793103" y="151.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.964240043769" fill="var(--info-text)">embedding cosine</text>
  <text x="495.172413793103" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.964240043769" fill="var(--info-text)">semantic match</text>

  <rect x="681.379310344828" y="84.615384615385" width="248.275862068966" height="111.538461538462" rx="8.593378488473" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.51724137931" y="123.653846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.112584665887" font-weight="bold" fill="var(--warn-text)">Keyword search</text>
  <text x="805.51724137931" y="151.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.964240043769" fill="var(--warn-text)">BM25-like</text>
  <text x="805.51724137931" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.964240043769" fill="var(--warn-text)">exact-term match</text>

  <path d="M 308.965517241379 140.384615384615 L 371.034482758621 140.384615384615" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
  <path d="M 308.965517241379 140.384615384615 L 681.379310344828 140.384615384615" fill="none" stroke="var(--text-muted)" stroke-width="2"/>

  <rect x="371.034482758621" y="240.769230769231" width="248.275862068966" height="111.538461538462" rx="8.593378488473" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495.172413793103" y="274.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" font-weight="bold" fill="var(--info-text)">Top 20 by cosine</text>
  <text x="495.172413793103" y="302.115384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.89006773271" fill="var(--info-text)">strong on paraphrase</text>
  <text x="495.172413793103" y="324.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.89006773271" fill="var(--info-text)">misses rare exact terms</text>

  <rect x="681.379310344828" y="240.769230769231" width="248.275862068966" height="111.538461538462" rx="8.593378488473" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.51724137931" y="274.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" font-weight="bold" fill="var(--warn-text)">Top 20 by BM25</text>
  <text x="805.51724137931" y="302.115384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.89006773271" fill="var(--warn-text)">strong on names, codes</text>
  <text x="805.51724137931" y="324.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.89006773271" fill="var(--warn-text)">misses synonyms</text>

  <path d="M 495.172413793103 196.153846153846 L 495.172413793103 240.769230769231" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 805.51724137931 196.153846153846 L 805.51724137931 240.769230769231" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="495.172413793103" y="396.923076923077" width="289.655172413793" height="89.230769230769" rx="10.741723110591" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="430.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.186756976946" font-weight="bold" fill="var(--primary-text)">Reciprocal Rank Fusion</text>
  <text x="640" y="461.615384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.964240043769" fill="var(--primary-text)">RRF score = Σ 1/(k + rank)</text>

  <path d="M 495.172413793103 352.307692307692 L 577.931034482759 396.923076923077" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 805.51724137931 352.307692307692 L 702.068965517241 396.923076923077" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="495.172413793103" y="530.769230769231" width="289.655172413793" height="89.230769230769" rx="10.741723110591" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="564.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.186756976946" font-weight="bold" fill="var(--ok-text)">Top 10 fused results</text>
  <text x="640" y="592.115384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.964240043769" fill="var(--ok-text)">→ optional reranker</text>

  <path d="M 640 486.153846153846 L 640 530.769230769231" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="396.923076923077" width="393.103448275862" height="223.076923076923" rx="10.741723110591" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="236.551724137931" y="430.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.186756976946" font-weight="bold" fill="var(--text)">Why hybrid wins</text>
  <text x="60.689655172414" y="463.846153846154" font-family="Arial, sans-serif" font-size="13.964240043769" fill="var(--text)">Vector: "how do I sign in"</text>
  <text x="81.379310344828" y="486.153846153846" font-family="Arial, sans-serif" font-size="12.89006773271" fill="var(--text-muted)">→ matches "authentication"</text>
  <text x="60.689655172414" y="519.615384615385" font-family="Arial, sans-serif" font-size="13.964240043769" fill="var(--text)">Keyword: "OAUTH-2025-001"</text>
  <text x="81.379310344828" y="541.923076923077" font-family="Arial, sans-serif" font-size="12.89006773271" fill="var(--text-muted)">→ exact ticket ID</text>
  <text x="60.689655172414" y="575.384615384615" font-family="Arial, sans-serif" font-size="13.964240043769" fill="var(--text)">Combined: best of both</text>
  <text x="81.379310344828" y="597.692307692308" font-family="Arial, sans-serif" font-size="12.89006773271" fill="var(--ok-accent)">10-30% better recall</text>

  <rect x="846.896551724138" y="396.923076923077" width="393.103448275862" height="223.076923076923" rx="10.741723110591" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1043.448275862069" y="430.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.186756976946" font-weight="bold" fill="var(--text)">Tuning</text>
  <text x="867.586206896552" y="465" font-family="Arial, sans-serif" font-size="13.964240043769" fill="var(--text)">Top-K per source: 10-50</text>
  <text x="867.586206896552" y="495" font-family="Arial, sans-serif" font-size="13.964240043769" fill="var(--text)">RRF k=60 default</text>
  <text x="867.586206896552" y="525" font-family="Arial, sans-serif" font-size="13.964240043769" fill="var(--text)">Reranker on top-N</text>
  <text x="867.586206896552" y="555" font-family="Arial, sans-serif" font-size="13.964240043769" fill="var(--text)">Filter by metadata</text>
  <text x="867.586206896552" y="595" font-family="Arial, sans-serif" font-size="13.964240043769" font-weight="bold" fill="var(--ok-accent)">Evaluate end-to-end</text>
</svg>

  <ns0:text x="360.027" y="107.4023" text-anchor="middle" font-size="15.2319" font-weight="bold" fill="#fff">RLHF (PPO)</ns0:text>
  <ns0:rect x="512.3462" y="73.5632" width="276.9439" height="51.4943" rx="6.9236" fill="#4a90e2" />
  <ns0:text x="650.8181" y="107.4023" text-anchor="middle" font-size="15.2319" font-weight="bold" fill="#fff">DPO</ns0:text>
  <ns0:rect x="803.1373" y="73.5632" width="276.9439" height="51.4943" rx="6.9236" fill="#4a90e2" />
  <ns0:text x="941.6092" y="107.4023" text-anchor="middle" font-size="15.2319" font-weight="bold" fill="#fff">KTO</ns0:text>
  <ns0:rect x="27.6943" y="139.7701" width="180.0135" height="73.5632" rx="4.1541" fill="#e8f4f8" stroke="#4a90e2" />
  <ns0:text x="117.7011" y="183.908" text-anchor="middle" font-size="15.2319" fill="#333">Data format</ns0:text>
  <ns0:rect x="221.5551" y="139.7701" width="276.9439" height="73.5632" rx="4.1541" fill="#f8f9fa" stroke="#dee2e6" />
  <ns0:text x="360.027" y="173.6092" text-anchor="middle" font-size="13.8472" fill="#555">Comparisons</ns0:text>
  <ns0:text x="360.027" y="197.1494" text-anchor="middle" font-size="13.8472" fill="#555">(A &gt; B)</ns0:text>
  <ns0:rect x="512.3462" y="139.7701" width="276.9439" height="73.5632" rx="4.1541" fill="#f8f9fa" stroke="#dee2e6" />
  <ns0:text x="650.8181" y="173.6092" text-anchor="middle" font-size="13.8472" fill="#555">Comparisons</ns0:text>
  <ns0:text x="650.8181" y="197.1494" text-anchor="middle" font-size="13.8472" fill="#555">(A &gt; B)</ns0:text>
  <ns0:rect x="803.1373" y="139.7701" width="276.9439" height="73.5632" rx="4.1541" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="941.6092" y="173.6092" text-anchor="middle" font-size="13.8472" fill="#555">Single thumbs</ns0:text>
  <ns0:text x="941.6092" y="197.1494" text-anchor="middle" font-size="13.8472" fill="#555">up/down per resp</ns0:text>
  <ns0:rect x="27.6943" y="228.046" width="180.0135" height="73.5632" rx="4.1541" fill="#e8f4f8" stroke="#4a90e2" />
  <ns0:text x="117.7011" y="261.8851" text-anchor="middle" font-size="15.2319" fill="#333">Needs reward</ns0:text>
  <ns0:text x="117.7011" y="283.954" text-anchor="middle" font-size="15.2319" fill="#333">model?</ns0:text>
  <ns0:rect x="221.5551" y="228.046" width="276.9439" height="73.5632" rx="4.1541" fill="#f8d7da" stroke="#dc3545" />
  <ns0:text x="360.027" y="272.1839" text-anchor="middle" font-size="13.8472" fill="#dc3545">Yes (separate model)</ns0:text>
  <ns0:rect x="512.3462" y="228.046" width="276.9439" height="73.5632" rx="4.1541" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="650.8181" y="272.1839" text-anchor="middle" font-size="13.8472" fill="#28a745">No</ns0:text>
  <ns0:rect x="803.1373" y="228.046" width="276.9439" height="73.5632" rx="4.1541" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="941.6092" y="272.1839" text-anchor="middle" font-size="13.8472" fill="#28a745">No</ns0:text>
  <ns0:rect x="27.6943" y="316.3218" width="180.0135" height="66.2069" rx="4.1541" fill="#e8f4f8" stroke="#4a90e2" />
  <ns0:text x="117.7011" y="357.5172" text-anchor="middle" font-size="15.2319" fill="#333">Stability</ns0:text>
  <ns0:rect x="221.5551" y="316.3218" width="276.9439" height="66.2069" rx="4.1541" fill="#f8d7da" stroke="#dc3545" />
  <ns0:text x="360.027" y="353.1034" text-anchor="middle" font-size="13.8472" fill="#dc3545">Complex (RL), Unstable</ns0:text>
  <ns0:rect x="512.3462" y="316.3218" width="276.9439" height="66.2069" rx="4.1541" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="650.8181" y="353.1034" text-anchor="middle" font-size="13.8472" fill="#28a745">Simple (SL), Stable</ns0:text>
  <ns0:rect x="803.1373" y="316.3218" width="276.9439" height="66.2069" rx="4.1541" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="941.6092" y="353.1034" text-anchor="middle" font-size="13.8472" fill="#28a745">Simple (SL), Very stable</ns0:text>
  <ns0:rect x="27.6943" y="397.2414" width="180.0135" height="58.8506" rx="4.1541" fill="#e8f4f8" stroke="#4a90e2" />
  <ns0:text x="117.7011" y="434.023" text-anchor="middle" font-size="15.2319" fill="#333">Quality</ns0:text>
  <ns0:rect x="221.5551" y="397.2414" width="276.9439" height="58.8506" rx="4.1541" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="360.027" y="434.023" text-anchor="middle" font-size="13.8472" font-weight="bold" fill="#28a745">Highest</ns0:text>
  <ns0:rect x="512.3462" y="397.2414" width="276.9439" height="58.8506" rx="4.1541" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="650.8181" y="434.023" text-anchor="middle" font-size="13.8472" fill="#555">Very high</ns0:text>
  <ns0:rect x="803.1373" y="397.2414" width="276.9439" height="58.8506" rx="4.1541" fill="#fff3cd" stroke="#ffc107" />
  <ns0:text x="941.6092" y="434.023" text-anchor="middle" font-size="13.8472" fill="#555">High</ns0:text>
  <ns0:rect x="27.6943" y="470.8046" width="180.0135" height="66.2069" rx="4.1541" fill="#e8f4f8" stroke="#4a90e2" />
  <ns0:text x="117.7011" y="512" text-anchor="middle" font-size="15.2319" fill="#333">Data needs</ns0:text>
  <ns0:rect x="221.5551" y="470.8046" width="276.9439" height="66.2069" rx="4.1541" fill="#f8d7da" stroke="#dc3545" />
  <ns0:text x="360.027" y="507.5862" text-anchor="middle" font-size="13.8472" fill="#555">High (50K+ pairs)</ns0:text>
  <ns0:rect x="512.3462" y="470.8046" width="276.9439" height="66.2069" rx="4.1541" fill="#fff3cd" stroke="#ffc107" />
  <ns0:text x="650.8181" y="507.5862" text-anchor="middle" font-size="13.8472" fill="#555">High (10K+ pairs)</ns0:text>
  <ns0:rect x="803.1373" y="470.8046" width="276.9439" height="66.2069" rx="4.1541" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="941.6092" y="500.2299" text-anchor="middle" font-size="13.8472" font-weight="bold" fill="#28a745">Lowest</ns0:text>
  <ns0:text x="941.6092" y="523.7701" text-anchor="middle" font-size="13.8472" fill="#555">(binary labels OK)</ns0:text>
  <ns0:rect x="138.4719" y="573.7931" width="900.0676" height="66.2069" rx="6.9236" fill="#fff3cd" stroke="#ffc107" stroke-width="2.0771" />
  <ns0:text x="588.5057" y="603.2184" text-anchor="middle" font-size="16.6166" font-weight="bold" fill="#856404">KTO (Kahneman-Tversky Optimization): Just needs "good" or "bad" labels</ns0:text>
  <ns0:text x="588.5057" y="629.7011" text-anchor="middle" font-size="15.2319" fill="#856404">No pairwise comparisons needed -- makes data collection much easier</ns0:text>
</ns0:svg>
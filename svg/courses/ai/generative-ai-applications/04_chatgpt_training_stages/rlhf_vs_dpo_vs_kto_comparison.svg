  <rect x="803.1373" y="397.2414" width="276.9439" height="58.8506" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="941.6092" y="434.023" text-anchor="middle" font-size="13.8472" fill="var(--text-muted)">High</text>

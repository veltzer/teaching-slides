  <text x="418.9474" y="484.415566655422" text-anchor="middle" font-size="14.962420033125" fill="var(--text-muted)" font-family="Arial, sans-serif">High (50K+ pairs)</text>
  <rect x="592.6316" y="446.753300033735" width="315.7894" height="67.792164074884" rx="6.153871266614" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.5263" y="484.415566655422" text-anchor="middle" font-size="14.962420033125" fill="var(--text-muted)" font-family="Arial, sans-serif">High (10K+ pairs)</text>
  <rect x="924.2106" y="446.753300033735" width="315.7894" height="67.792164074884" rx="6.153871266614" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="476.883092292122" text-anchor="middle" font-size="14.962420033125" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Lowest</text>
  <text x="1082.1052" y="500.98701025468" text-anchor="middle" font-size="14.962420033125" fill="var(--text-muted)" font-family="Arial, sans-serif">(binary labels OK)</text>
  <rect x="166.3158" y="552.207835925116" width="1026.3156" height="67.792164074884" rx="6.153871266614" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="679.4736" y="582.337628183503" text-anchor="middle" font-size="17.954945065558" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">KTO (Kahneman-Tversky Optimization): Just needs "good" or "bad" labels</text>
  <text x="679.4736" y="609.454535891381" text-anchor="middle" font-size="16.458733831602" fill="var(--danger-accent)" font-family="Arial, sans-serif">No pairwise comparisons needed -- makes data collection much easier</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="679.4736" y="40" text-anchor="middle" font-size="23.3413" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RLHF vs DPO vs KTO Comparison</text>
  <rect x="40" y="68.642" width="205.2631" height="50.1235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="101.5803" text-anchor="middle" font-size="16.0472" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Aspect</text>
  <rect x="261.0527" y="68.642" width="315.7894" height="50.1235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.9474" y="101.5803" text-anchor="middle" font-size="16.0472" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">RLHF (PPO)</text>
  <rect x="592.6316" y="68.642" width="315.7894" height="50.1235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.5263" y="101.5803" text-anchor="middle" font-size="16.0472" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">DPO</text>
  <rect x="924.2106" y="68.642" width="315.7894" height="50.1235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="101.5803" text-anchor="middle" font-size="16.0472" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">KTO</text>
  <rect x="40" y="133.0864" width="205.2631" height="71.6049" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="176.0494" text-anchor="middle" font-size="16.0472" fill="var(--text)" font-family="Arial, sans-serif">Data format</text>
  <rect x="261.0527" y="133.0864" width="315.7894" height="71.6049" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="418.9474" y="166.0247" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)" font-family="Arial, sans-serif">Comparisons</text>
  <text x="418.9474" y="188.9383" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)" font-family="Arial, sans-serif">(A &gt; B)</text>
  <rect x="592.6316" y="133.0864" width="315.7894" height="71.6049" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="750.5263" y="166.0247" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)" font-family="Arial, sans-serif">Comparisons</text>
  <text x="750.5263" y="188.9383" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)" font-family="Arial, sans-serif">(A &gt; B)</text>
  <rect x="924.2106" y="133.0864" width="315.7894" height="71.6049" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="166.0247" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)" font-family="Arial, sans-serif">Single thumbs</text>
  <text x="1082.1052" y="188.9383" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)" font-family="Arial, sans-serif">up/down per resp</text>
  <rect x="40" y="219.0124" width="205.2631" height="71.6049" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="251.9507" text-anchor="middle" font-size="16.0472" fill="var(--text)" font-family="Arial, sans-serif">Needs reward</text>
  <text x="142.6316" y="273.4321" text-anchor="middle" font-size="16.0472" fill="var(--text)" font-family="Arial, sans-serif">model?</text>
  <rect x="261.0527" y="219.0124" width="315.7894" height="71.6049" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.9474" y="261.9753" text-anchor="middle" font-size="14.5883" fill="var(--danger-accent)" font-family="Arial, sans-serif">Yes (separate model)</text>
  <rect x="592.6316" y="219.0124" width="315.7894" height="71.6049" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.5263" y="261.9753" text-anchor="middle" font-size="14.5883" fill="var(--ok-accent)" font-family="Arial, sans-serif">No</text>
  <rect x="924.2106" y="219.0124" width="315.7894" height="71.6049" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="261.9753" text-anchor="middle" font-size="14.5883" fill="var(--ok-accent)" font-family="Arial, sans-serif">No</text>
  <rect x="40" y="304.9382" width="205.2631" height="64.4444" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="345.037" text-anchor="middle" font-size="16.0472" fill="var(--text)" font-family="Arial, sans-serif">Stability</text>
  <rect x="261.0527" y="304.9382" width="315.7894" height="64.4444" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.9474" y="340.7407" text-anchor="middle" font-size="14.5883" fill="var(--danger-accent)" font-family="Arial, sans-serif">Complex (RL), Unstable</text>
  <rect x="592.6316" y="304.9382" width="315.7894" height="64.4444" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.5263" y="340.7407" text-anchor="middle" font-size="14.5883" fill="var(--ok-accent)" font-family="Arial, sans-serif">Simple (SL), Stable</text>
  <rect x="924.2106" y="304.9382" width="315.7894" height="64.4444" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="340.7407" text-anchor="middle" font-size="14.5883" fill="var(--ok-accent)" font-family="Arial, sans-serif">Simple (SL), Very stable</text>
  <rect x="40" y="383.7037" width="205.2631" height="57.284" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="419.5062" text-anchor="middle" font-size="16.0472" fill="var(--text)" font-family="Arial, sans-serif">Quality</text>
  <rect x="261.0527" y="383.7037" width="315.7894" height="57.284" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.9474" y="419.5062" text-anchor="middle" font-size="14.5883" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Highest</text>
  <rect x="592.6316" y="383.7037" width="315.7894" height="57.284" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.5263" y="419.5062" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)" font-family="Arial, sans-serif">Very high</text>
  <rect x="924.2106" y="383.7037" width="315.7894" height="57.284" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="419.5062" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)" font-family="Arial, sans-serif">High</text>
  <rect x="40" y="455.3087" width="205.2631" height="64.4444" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="495.4074" text-anchor="middle" font-size="16.0472" fill="var(--text)" font-family="Arial, sans-serif">Data needs</text>
  <rect x="261.0527" y="455.3087" width="315.7894" height="64.4444" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.9474" y="491.1111" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)" font-family="Arial, sans-serif">High (50K+ pairs)</text>
  <rect x="592.6316" y="455.3087" width="315.7894" height="64.4444" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.5263" y="491.1111" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)" font-family="Arial, sans-serif">High (10K+ pairs)</text>
  <rect x="924.2106" y="455.3087" width="315.7894" height="64.4444" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="483.9506" text-anchor="middle" font-size="14.5883" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Lowest</text>
  <text x="1082.1052" y="506.8642" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)" font-family="Arial, sans-serif">(binary labels OK)</text>
  <rect x="166.3158" y="555.5556" width="1026.3156" height="64.4444" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="679.4736" y="584.1975" text-anchor="middle" font-size="17.506" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">KTO (Kahneman-Tversky Optimization): Just needs "good" or "bad" labels</text>
  <text x="679.4736" y="609.9753" text-anchor="middle" font-size="16.0472" fill="var(--danger-accent)" font-family="Arial, sans-serif">No pairwise comparisons needed -- makes data collection much easier</text>
</svg>

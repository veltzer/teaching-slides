  <rect x="261.0527" y="371.428556400742" width="315.7894" height="60.259794906395" rx="6.153871266614" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.9474" y="409.090928217238" text-anchor="middle" font-size="14.962420033125" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Highest</text>
  <rect x="592.6316" y="371.428556400742" width="315.7894" height="60.259794906395" rx="6.153871266614" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.5263" y="409.090928217238" text-anchor="middle" font-size="14.962420033125" fill="var(--text-muted)" font-family="Arial, sans-serif">Very high</text>
  <rect x="924.2106" y="371.428556400742" width="315.7894" height="60.259794906395" rx="6.153871266614" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="409.090928217238" text-anchor="middle" font-size="14.962420033125" fill="var(--text-muted)" font-family="Arial, sans-serif">High</text>

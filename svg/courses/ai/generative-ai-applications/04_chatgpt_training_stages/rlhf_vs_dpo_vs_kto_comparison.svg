  <rect x="40" y="288.571338404449" width="205.2631" height="67.792164074884" rx="6.153871266614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="330.753194838925" text-anchor="middle" font-size="16.458733831602" fill="var(--text)" font-family="Arial, sans-serif">Stability</text>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="588.5057" y="44.1379" text-anchor="middle" font-size="22.1555" font-weight="bold" fill="#333">RLHF vs DPO vs KTO Comparison</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="48" text-anchor="middle" font-size="24.0941" font-weight="bold" fill="#333">RLHF vs DPO vs KTO Comparison</text>
  <rect x="30.1176" y="80" width="195.7647" height="56" rx="7.5294" fill="#4a90e2" />
  <text x="128" y="116.8" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#fff">Aspect</text>
  <rect x="240.9412" y="80" width="301.1765" height="56" rx="7.5294" fill="#4a90e2" />
  <text x="391.5294" y="116.8" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#fff">RLHF (PPO)</text>
  <rect x="557.1765" y="80" width="301.1765" height="56" rx="7.5294" fill="#4a90e2" />
  <text x="707.7647" y="116.8" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#fff">DPO</text>
  <rect x="873.4118" y="80" width="301.1765" height="56" rx="7.5294" fill="#4a90e2" />
  <text x="1024" y="116.8" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#fff">KTO</text>
  <rect x="30.1176" y="152" width="195.7647" height="80" rx="4.5176" fill="#e8f4f8" stroke="#4a90e2" />
  <text x="128" y="200" text-anchor="middle" font-size="16.5647" fill="#333">Data format</text>
  <rect x="240.9412" y="152" width="301.1765" height="80" rx="4.5176" fill="#f8f9fa" stroke="#dee2e6" />
  <text x="391.5294" y="188.8" text-anchor="middle" font-size="15.0588" fill="#555">Comparisons</text>
  <text x="391.5294" y="214.4" text-anchor="middle" font-size="15.0588" fill="#555">(A &gt; B)</text>
  <rect x="557.1765" y="152" width="301.1765" height="80" rx="4.5176" fill="#f8f9fa" stroke="#dee2e6" />
  <text x="707.7647" y="188.8" text-anchor="middle" font-size="15.0588" fill="#555">Comparisons</text>
  <text x="707.7647" y="214.4" text-anchor="middle" font-size="15.0588" fill="#555">(A &gt; B)</text>
  <rect x="873.4118" y="152" width="301.1765" height="80" rx="4.5176" fill="#d4edda" stroke="#28a745" />
  <text x="1024" y="188.8" text-anchor="middle" font-size="15.0588" fill="#555">Single thumbs</text>
  <text x="1024" y="214.4" text-anchor="middle" font-size="15.0588" fill="#555">up/down per resp</text>
  <rect x="30.1176" y="248" width="195.7647" height="80" rx="4.5176" fill="#e8f4f8" stroke="#4a90e2" />
  <text x="128" y="284.8" text-anchor="middle" font-size="16.5647" fill="#333">Needs reward</text>
  <text x="128" y="308.8" text-anchor="middle" font-size="16.5647" fill="#333">model?</text>
  <rect x="240.9412" y="248" width="301.1765" height="80" rx="4.5176" fill="#f8d7da" stroke="#dc3545" />
  <text x="391.5294" y="296" text-anchor="middle" font-size="15.0588" fill="#dc3545">Yes (separate model)</text>
  <rect x="557.1765" y="248" width="301.1765" height="80" rx="4.5176" fill="#d4edda" stroke="#28a745" />
  <text x="707.7647" y="296" text-anchor="middle" font-size="15.0588" fill="#28a745">No</text>
  <rect x="873.4118" y="248" width="301.1765" height="80" rx="4.5176" fill="#d4edda" stroke="#28a745" />
  <text x="1024" y="296" text-anchor="middle" font-size="15.0588" fill="#28a745">No</text>
  <rect x="30.1176" y="344" width="195.7647" height="72" rx="4.5176" fill="#e8f4f8" stroke="#4a90e2" />
  <text x="128" y="388.8" text-anchor="middle" font-size="16.5647" fill="#333">Stability</text>
  <rect x="240.9412" y="344" width="301.1765" height="72" rx="4.5176" fill="#f8d7da" stroke="#dc3545" />
  <text x="391.5294" y="384" text-anchor="middle" font-size="15.0588" fill="#dc3545">Complex (RL), Unstable</text>
  <rect x="557.1765" y="344" width="301.1765" height="72" rx="4.5176" fill="#d4edda" stroke="#28a745" />
  <text x="707.7647" y="384" text-anchor="middle" font-size="15.0588" fill="#28a745">Simple (SL), Stable</text>
  <rect x="873.4118" y="344" width="301.1765" height="72" rx="4.5176" fill="#d4edda" stroke="#28a745" />
  <text x="1024" y="384" text-anchor="middle" font-size="15.0588" fill="#28a745">Simple (SL), Very stable</text>
  <rect x="30.1176" y="432" width="195.7647" height="64" rx="4.5176" fill="#e8f4f8" stroke="#4a90e2" />
  <text x="128" y="472" text-anchor="middle" font-size="16.5647" fill="#333">Quality</text>
  <rect x="240.9412" y="432" width="301.1765" height="64" rx="4.5176" fill="#d4edda" stroke="#28a745" />
  <text x="391.5294" y="472" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="#28a745">Highest</text>
  <rect x="557.1765" y="432" width="301.1765" height="64" rx="4.5176" fill="#d4edda" stroke="#28a745" />
  <text x="707.7647" y="472" text-anchor="middle" font-size="15.0588" fill="#555">Very high</text>
  <rect x="873.4118" y="432" width="301.1765" height="64" rx="4.5176" fill="#fff3cd" stroke="#ffc107" />
  <text x="1024" y="472" text-anchor="middle" font-size="15.0588" fill="#555">High</text>
  <rect x="30.1176" y="512" width="195.7647" height="72" rx="4.5176" fill="#e8f4f8" stroke="#4a90e2" />
  <text x="128" y="556.8" text-anchor="middle" font-size="16.5647" fill="#333">Data needs</text>
  <rect x="240.9412" y="512" width="301.1765" height="72" rx="4.5176" fill="#f8d7da" stroke="#dc3545" />
  <text x="391.5294" y="552" text-anchor="middle" font-size="15.0588" fill="#555">High (50K+ pairs)</text>
  <rect x="557.1765" y="512" width="301.1765" height="72" rx="4.5176" fill="#fff3cd" stroke="#ffc107" />
  <text x="707.7647" y="552" text-anchor="middle" font-size="15.0588" fill="#555">High (10K+ pairs)</text>
  <rect x="873.4118" y="512" width="301.1765" height="72" rx="4.5176" fill="#d4edda" stroke="#28a745" />
  <text x="1024" y="544" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="#28a745">Lowest</text>
  <text x="1024" y="569.6" text-anchor="middle" font-size="15.0588" fill="#555">(binary labels OK)</text>
  <rect x="150.5882" y="624" width="978.8235" height="72" rx="7.5294" fill="#fff3cd" stroke="#ffc107" stroke-width="2.2588" />
  <text x="640" y="656" text-anchor="middle" font-size="18.0706" font-weight="bold" fill="#856404">KTO (Kahneman-Tversky Optimization): Just needs "good" or "bad" labels</text>
  <text x="640" y="684.8" text-anchor="middle" font-size="16.5647" fill="#856404">No pairwise comparisons needed -- makes data collection much easier</text>
</svg>
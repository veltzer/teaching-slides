<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="205.2631" height="52.727320543095" rx="6.153871266614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="74.649382071177" text-anchor="middle" font-size="16.458733831602" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Aspect</text>
  <rect x="261.0527" y="40" width="315.7894" height="52.727320543095" rx="6.153871266614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.9474" y="74.649382071177" text-anchor="middle" font-size="16.458733831602" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">RLHF (PPO)</text>
  <rect x="592.6316" y="40" width="315.7894" height="52.727320543095" rx="6.153871266614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.5263" y="74.649382071177" text-anchor="middle" font-size="16.458733831602" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">DPO</text>
  <rect x="924.2106" y="40" width="315.7894" height="52.727320543095" rx="6.153871266614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="74.649382071177" text-anchor="middle" font-size="16.458733831602" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">KTO</text>
  <rect x="40" y="107.792164074884" width="205.2631" height="75.324638438184" rx="6.153871266614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="152.98701025468" text-anchor="middle" font-size="16.458733831602" fill="var(--text)" font-family="Arial, sans-serif">Data format</text>
  <rect x="261.0527" y="107.792164074884" width="315.7894" height="75.324638438184" rx="6.153871266614" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="418.9474" y="142.441546146061" text-anchor="middle" font-size="14.962420033125" fill="var(--text-muted)" font-family="Arial, sans-serif">Comparisons</text>
  <text x="418.9474" y="166.545464108619" text-anchor="middle" font-size="14.962420033125" fill="var(--text-muted)" font-family="Arial, sans-serif">(A &gt; B)</text>
  <rect x="592.6316" y="107.792164074884" width="315.7894" height="75.324638438184" rx="6.153871266614" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="750.5263" y="142.441546146061" text-anchor="middle" font-size="14.962420033125" fill="var(--text-muted)" font-family="Arial, sans-serif">Comparisons</text>
  <text x="750.5263" y="166.545464108619" text-anchor="middle" font-size="14.962420033125" fill="var(--text-muted)" font-family="Arial, sans-serif">(A &gt; B)</text>
  <rect x="924.2106" y="107.792164074884" width="315.7894" height="75.324638438184" rx="6.153871266614" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="142.441546146061" text-anchor="middle" font-size="14.962420033125" fill="var(--text-muted)" font-family="Arial, sans-serif">Single thumbs</text>
  <text x="1082.1052" y="166.545464108619" text-anchor="middle" font-size="14.962420033125" fill="var(--text-muted)" font-family="Arial, sans-serif">up/down per resp</text>
  <rect x="40" y="198.181856434476" width="205.2631" height="75.324638438184" rx="6.153871266614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="232.831238505653" text-anchor="middle" font-size="16.458733831602" fill="var(--text)" font-family="Arial, sans-serif">Needs reward</text>
  <text x="142.6316" y="255.428556400741" text-anchor="middle" font-size="16.458733831602" fill="var(--text)" font-family="Arial, sans-serif">model?</text>
  <rect x="261.0527" y="198.181856434476" width="315.7894" height="75.324638438184" rx="6.153871266614" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.9474" y="243.376597419462" text-anchor="middle" font-size="14.962420033125" fill="var(--danger-accent)" font-family="Arial, sans-serif">Yes (separate model)</text>
  <rect x="592.6316" y="198.181856434476" width="315.7894" height="75.324638438184" rx="6.153871266614" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

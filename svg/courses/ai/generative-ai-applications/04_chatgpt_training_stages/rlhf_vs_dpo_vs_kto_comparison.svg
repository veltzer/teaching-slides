  <text x="418.9474" y="326.233710220945" text-anchor="middle" font-size="14.962420033125" fill="var(--danger-accent)" font-family="Arial, sans-serif">Complex (RL), Unstable</text>
  <rect x="592.6316" y="288.571338404449" width="315.7894" height="67.792164074884" rx="6.153871266614" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.5263" y="326.233710220945" text-anchor="middle" font-size="14.962420033125" fill="var(--ok-accent)" font-family="Arial, sans-serif">Simple (SL), Stable</text>
  <rect x="924.2106" y="288.571338404449" width="315.7894" height="67.792164074884" rx="6.153871266614" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="326.233710220945" text-anchor="middle" font-size="14.962420033125" fill="var(--ok-accent)" font-family="Arial, sans-serif">Simple (SL), Very stable</text>
  <rect x="40" y="371.428556400742" width="205.2631" height="60.259794906395" rx="6.153871266614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>

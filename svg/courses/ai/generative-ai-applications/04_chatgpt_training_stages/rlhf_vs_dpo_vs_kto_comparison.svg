<svg viewBox="0 0 850 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="425" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">RLHF vs DPO vs KTO Comparison</text>
  <!-- Header -->
  <rect x="20" y="50" width="130" height="35" rx="5" fill="#4a90e2"/><text x="85" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Aspect</text>
  <rect x="160" y="50" width="200" height="35" rx="5" fill="#4a90e2"/><text x="260" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">RLHF (PPO)</text>
  <rect x="370" y="50" width="200" height="35" rx="5" fill="#4a90e2"/><text x="470" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">DPO</text>
  <rect x="580" y="50" width="200" height="35" rx="5" fill="#4a90e2"/><text x="680" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">KTO</text>
  <!-- Data format -->
  <rect x="20" y="95" width="130" height="50" rx="3" fill="#e8f4f8" stroke="#4a90e2"/><text x="85" y="125" text-anchor="middle" font-size="11" fill="#333">Data format</text>
  <rect x="160" y="95" width="200" height="50" rx="3" fill="#f8f9fa" stroke="#dee2e6"/><text x="260" y="118" text-anchor="middle" font-size="10" fill="#555">Comparisons</text><text x="260" y="134" text-anchor="middle" font-size="10" fill="#555">(A &gt; B)</text>
  <rect x="370" y="95" width="200" height="50" rx="3" fill="#f8f9fa" stroke="#dee2e6"/><text x="470" y="118" text-anchor="middle" font-size="10" fill="#555">Comparisons</text><text x="470" y="134" text-anchor="middle" font-size="10" fill="#555">(A &gt; B)</text>
  <rect x="580" y="95" width="200" height="50" rx="3" fill="#d4edda" stroke="#28a745"/><text x="680" y="118" text-anchor="middle" font-size="10" fill="#555">Single thumbs</text><text x="680" y="134" text-anchor="middle" font-size="10" fill="#555">up/down per resp</text>
  <!-- Reward model -->
  <rect x="20" y="155" width="130" height="50" rx="3" fill="#e8f4f8" stroke="#4a90e2"/><text x="85" y="178" text-anchor="middle" font-size="11" fill="#333">Needs reward</text><text x="85" y="193" text-anchor="middle" font-size="11" fill="#333">model?</text>
  <rect x="160" y="155" width="200" height="50" rx="3" fill="#f8d7da" stroke="#dc3545"/><text x="260" y="185" text-anchor="middle" font-size="10" fill="#dc3545">Yes (separate model)</text>
  <rect x="370" y="155" width="200" height="50" rx="3" fill="#d4edda" stroke="#28a745"/><text x="470" y="185" text-anchor="middle" font-size="10" fill="#28a745">No</text>
  <rect x="580" y="155" width="200" height="50" rx="3" fill="#d4edda" stroke="#28a745"/><text x="680" y="185" text-anchor="middle" font-size="10" fill="#28a745">No</text>
  <!-- Stability -->
  <rect x="20" y="215" width="130" height="45" rx="3" fill="#e8f4f8" stroke="#4a90e2"/><text x="85" y="243" text-anchor="middle" font-size="11" fill="#333">Stability</text>
  <rect x="160" y="215" width="200" height="45" rx="3" fill="#f8d7da" stroke="#dc3545"/><text x="260" y="240" text-anchor="middle" font-size="10" fill="#dc3545">Complex (RL), Unstable</text>
  <rect x="370" y="215" width="200" height="45" rx="3" fill="#d4edda" stroke="#28a745"/><text x="470" y="240" text-anchor="middle" font-size="10" fill="#28a745">Simple (SL), Stable</text>
  <rect x="580" y="215" width="200" height="45" rx="3" fill="#d4edda" stroke="#28a745"/><text x="680" y="240" text-anchor="middle" font-size="10" fill="#28a745">Simple (SL), Very stable</text>
  <!-- Quality -->
  <rect x="20" y="270" width="130" height="40" rx="3" fill="#e8f4f8" stroke="#4a90e2"/><text x="85" y="295" text-anchor="middle" font-size="11" fill="#333">Quality</text>
  <rect x="160" y="270" width="200" height="40" rx="3" fill="#d4edda" stroke="#28a745"/><text x="260" y="295" text-anchor="middle" font-size="10" font-weight="bold" fill="#28a745">Highest</text>
  <rect x="370" y="270" width="200" height="40" rx="3" fill="#d4edda" stroke="#28a745"/><text x="470" y="295" text-anchor="middle" font-size="10" fill="#555">Very high</text>
  <rect x="580" y="270" width="200" height="40" rx="3" fill="#fff3cd" stroke="#ffc107"/><text x="680" y="295" text-anchor="middle" font-size="10" fill="#555">High</text>
  <!-- Data needs -->
  <rect x="20" y="320" width="130" height="45" rx="3" fill="#e8f4f8" stroke="#4a90e2"/><text x="85" y="348" text-anchor="middle" font-size="11" fill="#333">Data needs</text>
  <rect x="160" y="320" width="200" height="45" rx="3" fill="#f8d7da" stroke="#dc3545"/><text x="260" y="345" text-anchor="middle" font-size="10" fill="#555">High (50K+ pairs)</text>
  <rect x="370" y="320" width="200" height="45" rx="3" fill="#fff3cd" stroke="#ffc107"/><text x="470" y="345" text-anchor="middle" font-size="10" fill="#555">High (10K+ pairs)</text>
  <rect x="580" y="320" width="200" height="45" rx="3" fill="#d4edda" stroke="#28a745"/><text x="680" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#28a745">Lowest</text><text x="680" y="356" text-anchor="middle" font-size="10" fill="#555">(binary labels OK)</text>
  <!-- KTO note -->
  <rect x="100" y="390" width="650" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="425" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#856404">KTO (Kahneman-Tversky Optimization): Just needs "good" or "bad" labels</text>
  <text x="425" y="428" text-anchor="middle" font-size="11" fill="#856404">No pairwise comparisons needed -- makes data collection much easier</text>
</svg>
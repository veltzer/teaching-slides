<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="679.4736" y="40" text-anchor="middle" font-size="23.3413" font-weight="bold" fill="var(--text)">RLHF vs DPO vs KTO Comparison</text>
  <rect x="40" y="68.642" width="205.2631" height="50.1235" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="101.5803" text-anchor="middle" font-size="16.0472" font-weight="bold" fill="var(--bg)">Aspect</text>
  <rect x="261.0527" y="68.642" width="315.7894" height="50.1235" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.9474" y="101.5803" text-anchor="middle" font-size="16.0472" font-weight="bold" fill="var(--bg)">RLHF (PPO)</text>
  <rect x="592.6316" y="68.642" width="315.7894" height="50.1235" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.5263" y="101.5803" text-anchor="middle" font-size="16.0472" font-weight="bold" fill="var(--bg)">DPO</text>
  <rect x="924.2106" y="68.642" width="315.7894" height="50.1235" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="101.5803" text-anchor="middle" font-size="16.0472" font-weight="bold" fill="var(--bg)">KTO</text>
  <rect x="40" y="133.0864" width="205.2631" height="71.6049" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="176.0494" text-anchor="middle" font-size="16.0472" fill="var(--text)">Data format</text>
  <rect x="261.0527" y="133.0864" width="315.7894" height="71.6049" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="418.9474" y="166.0247" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)">Comparisons</text>
  <text x="418.9474" y="188.9383" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)">(A &gt; B)</text>
  <rect x="592.6316" y="133.0864" width="315.7894" height="71.6049" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="750.5263" y="166.0247" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)">Comparisons</text>
  <text x="750.5263" y="188.9383" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)">(A &gt; B)</text>
  <rect x="924.2106" y="133.0864" width="315.7894" height="71.6049" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="166.0247" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)">Single thumbs</text>
  <text x="1082.1052" y="188.9383" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)">up/down per resp</text>
  <rect x="40" y="219.0124" width="205.2631" height="71.6049" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="251.9507" text-anchor="middle" font-size="16.0472" fill="var(--text)">Needs reward</text>
  <text x="142.6316" y="273.4321" text-anchor="middle" font-size="16.0472" fill="var(--text)">model?</text>
  <rect x="261.0527" y="219.0124" width="315.7894" height="71.6049" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.9474" y="261.9753" text-anchor="middle" font-size="14.5883" fill="var(--danger-accent)">Yes (separate model)</text>
  <rect x="592.6316" y="219.0124" width="315.7894" height="71.6049" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.5263" y="261.9753" text-anchor="middle" font-size="14.5883" fill="var(--ok-accent)">No</text>
  <rect x="924.2106" y="219.0124" width="315.7894" height="71.6049" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="261.9753" text-anchor="middle" font-size="14.5883" fill="var(--ok-accent)">No</text>
  <rect x="40" y="304.9382" width="205.2631" height="64.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="345.037" text-anchor="middle" font-size="16.0472" fill="var(--text)">Stability</text>
  <rect x="261.0527" y="304.9382" width="315.7894" height="64.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.9474" y="340.7407" text-anchor="middle" font-size="14.5883" fill="var(--danger-accent)">Complex (RL), Unstable</text>
  <rect x="592.6316" y="304.9382" width="315.7894" height="64.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.5263" y="340.7407" text-anchor="middle" font-size="14.5883" fill="var(--ok-accent)">Simple (SL), Stable</text>
  <rect x="924.2106" y="304.9382" width="315.7894" height="64.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="340.7407" text-anchor="middle" font-size="14.5883" fill="var(--ok-accent)">Simple (SL), Very stable</text>
  <rect x="40" y="383.7037" width="205.2631" height="57.284" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="419.5062" text-anchor="middle" font-size="16.0472" fill="var(--text)">Quality</text>
  <rect x="261.0527" y="383.7037" width="315.7894" height="57.284" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.9474" y="419.5062" text-anchor="middle" font-size="14.5883" font-weight="bold" fill="var(--ok-accent)">Highest</text>
  <rect x="592.6316" y="383.7037" width="315.7894" height="57.284" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.5263" y="419.5062" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)">Very high</text>
  <rect x="924.2106" y="383.7037" width="315.7894" height="57.284" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="419.5062" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)">High</text>
  <rect x="40" y="455.3087" width="205.2631" height="64.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="495.4074" text-anchor="middle" font-size="16.0472" fill="var(--text)">Data needs</text>
  <rect x="261.0527" y="455.3087" width="315.7894" height="64.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.9474" y="491.1111" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)">High (50K+ pairs)</text>
  <rect x="592.6316" y="455.3087" width="315.7894" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.5263" y="491.1111" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)">High (10K+ pairs)</text>
  <rect x="924.2106" y="455.3087" width="315.7894" height="64.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.1052" y="483.9506" text-anchor="middle" font-size="14.5883" font-weight="bold" fill="var(--ok-accent)">Lowest</text>
  <text x="1082.1052" y="506.8642" text-anchor="middle" font-size="14.5883" fill="var(--text-muted)">(binary labels OK)</text>
  <rect x="166.3158" y="555.5556" width="1026.3156" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="679.4736" y="584.1975" text-anchor="middle" font-size="17.506" font-weight="bold" fill="var(--danger-accent)">KTO (Kahneman-Tversky Optimization): Just needs "good" or "bad" labels</text>
  <text x="679.4736" y="609.9753" text-anchor="middle" font-size="16.0472" fill="var(--danger-accent)">No pairwise comparisons needed -- makes data collection much easier</text>
</svg>
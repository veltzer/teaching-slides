  <text x="588.5057" y="603.2184" text-anchor="middle" font-size="16.6166" font-weight="bold" fill="var(--danger-accent)">KTO (Kahneman-Tversky Optimization): Just needs "good" or "bad" labels</text>
  <text x="588.5057" y="629.7011" text-anchor="middle" font-size="15.2319" fill="var(--danger-accent)">No pairwise comparisons needed -- makes data collection much easier</text>
</svg>
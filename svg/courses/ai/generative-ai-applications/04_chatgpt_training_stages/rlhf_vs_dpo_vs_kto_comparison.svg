  <text x="117.7011" y="107.4023" text-anchor="middle" font-size="15.2319" font-weight="bold" fill="var(--bg)">Aspect</text>
  <rect x="221.5551" y="73.5632" width="276.9439" height="51.4943" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="360.027" y="107.4023" text-anchor="middle" font-size="15.2319" font-weight="bold" fill="var(--bg)">RLHF (PPO)</text>
  <rect x="512.3462" y="73.5632" width="276.9439" height="51.4943" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="650.8181" y="107.4023" text-anchor="middle" font-size="15.2319" font-weight="bold" fill="var(--bg)">DPO</text>
  <rect x="803.1373" y="73.5632" width="276.9439" height="51.4943" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="941.6092" y="107.4023" text-anchor="middle" font-size="15.2319" font-weight="bold" fill="var(--bg)">KTO</text>
  <rect x="27.6943" y="139.7701" width="180.0135" height="73.5632" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="117.7011" y="183.908" text-anchor="middle" font-size="15.2319" fill="var(--text)">Data format</text>
  <rect x="221.5551" y="139.7701" width="276.9439" height="73.5632" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="360.027" y="173.6092" text-anchor="middle" font-size="13.8472" fill="var(--text-muted)">Comparisons</text>
  <text x="360.027" y="197.1494" text-anchor="middle" font-size="13.8472" fill="var(--text-muted)">(A &gt; B)</text>
  <rect x="512.3462" y="139.7701" width="276.9439" height="73.5632" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="650.8181" y="173.6092" text-anchor="middle" font-size="13.8472" fill="var(--text-muted)">Comparisons</text>
  <text x="650.8181" y="197.1494" text-anchor="middle" font-size="13.8472" fill="var(--text-muted)">(A &gt; B)</text>
  <rect x="803.1373" y="139.7701" width="276.9439" height="73.5632" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="941.6092" y="173.6092" text-anchor="middle" font-size="13.8472" fill="var(--text-muted)">Single thumbs</text>
  <text x="941.6092" y="197.1494" text-anchor="middle" font-size="13.8472" fill="var(--text-muted)">up/down per resp</text>
  <rect x="27.6943" y="228.046" width="180.0135" height="73.5632" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="117.7011" y="261.8851" text-anchor="middle" font-size="15.2319" fill="var(--text)">Needs reward</text>
  <text x="117.7011" y="283.954" text-anchor="middle" font-size="15.2319" fill="var(--text)">model?</text>
  <rect x="221.5551" y="228.046" width="276.9439" height="73.5632" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="360.027" y="272.1839" text-anchor="middle" font-size="13.8472" fill="var(--danger-accent)">Yes (separate model)</text>
  <rect x="512.3462" y="228.046" width="276.9439" height="73.5632" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="650.8181" y="272.1839" text-anchor="middle" font-size="13.8472" fill="var(--ok-accent)">No</text>
  <rect x="803.1373" y="228.046" width="276.9439" height="73.5632" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="941.6092" y="272.1839" text-anchor="middle" font-size="13.8472" fill="var(--ok-accent)">No</text>
  <rect x="27.6943" y="316.3218" width="180.0135" height="66.2069" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="117.7011" y="357.5172" text-anchor="middle" font-size="15.2319" fill="var(--text)">Stability</text>

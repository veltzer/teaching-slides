  <text x="360.027" y="507.5862" text-anchor="middle" font-size="13.8472" fill="var(--text-muted)">High (50K+ pairs)</text>
  <rect x="512.3462" y="470.8046" width="276.9439" height="66.2069" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="650.8181" y="507.5862" text-anchor="middle" font-size="13.8472" fill="var(--text-muted)">High (10K+ pairs)</text>
  <rect x="803.1373" y="470.8046" width="276.9439" height="66.2069" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="941.6092" y="500.2299" text-anchor="middle" font-size="13.8472" font-weight="bold" fill="var(--ok-accent)">Lowest</text>
  <text x="941.6092" y="523.7701" text-anchor="middle" font-size="13.8472" fill="var(--text-muted)">(binary labels OK)</text>

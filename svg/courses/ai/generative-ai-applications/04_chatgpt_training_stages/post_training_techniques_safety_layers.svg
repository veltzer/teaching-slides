<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="370" height="580" rx="8.44894167246" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="225" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--primary-accent)">INPUT</text>

  <rect x="60" y="106.923076923077" width="330" height="78.076923076923" rx="6.336706254345" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="140.384615384616" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--danger-text)">Moderation API</text>
  <text x="225" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--danger-text)">Block harmful content</text>

  <rect x="60" y="207.307692307692" width="330" height="78.076923076923" rx="6.336706254345" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="240.76923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--danger-text)">Injection Filter</text>
  <text x="225" y="268.653846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--danger-text)">Detect jailbreaks</text>

  <rect x="60" y="307.692307692308" width="330" height="78.076923076923" rx="6.336706254345" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="341.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--info-text)">System Prompt</text>
  <text x="225" y="369.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">Persona + guardrails</text>

  <rect x="430" y="40" width="380" height="580" rx="8.44894167246" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--ok-text)">MODEL</text>
  <text x="620" y="151.538461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--ok-text)">LLM Generation</text>
  <text x="620" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--ok-text)">Safety-trained weights</text>
  <text x="620" y="246.346153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--ok-text)">RLHF: helpful, harmless</text>
  <text x="620" y="285.384615384616" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--ok-text)">Constitutional AI</text>
  <text x="620" y="324.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--ok-text)">Red-team evaluated</text>
  <text x="620" y="363.461538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--ok-text)">Tool-use policy</text>
  <text x="620" y="430.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--ok-text)">Defense in depth:</text>
  <text x="620" y="463.846153846153" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--ok-text)">training alone is not enough</text>

  <rect x="830" y="40" width="410" height="580" rx="8.44894167246" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1035" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--warn-accent)">OUTPUT</text>

  <rect x="850" y="106.923076923077" width="370" height="78.076923076923" rx="6.336706254345" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="140.384615384616" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--warn-text)">Output Moderation</text>
  <text x="1035" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">Stream classifier</text>

  <rect x="850" y="207.307692307692" width="370" height="78.076923076923" rx="6.336706254345" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="240.76923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--warn-text)">PII Redaction</text>
  <text x="1035" y="268.653846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">Mask emails, SSNs</text>

  <rect x="850" y="307.692307692308" width="370" height="78.076923076923" rx="6.336706254345" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="341.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--info-text)">Audit + Telemetry</text>
  <text x="1035" y="369.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">Log every decision</text>

  <rect x="850" y="408.076923076923" width="370" height="78.076923076923" rx="6.336706254345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="447.115384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--ok-text)">Response to User</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ard" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 0,6.9231" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="582.3271" y="31.4961" text-anchor="middle" font-size="18.8976" font-weight="bold" fill="var(--text)">Post-Training Safety Layers</text>
  <text x="582.3271" y="62.9921" text-anchor="middle" font-size="15.1181" font-weight="bold" fill="var(--primary-accent)">INPUT LAYER</text>
  <rect x="249.5688" y="73.0709" width="665.5168" height="44.0944" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.3271" y="102.0472" text-anchor="middle" font-size="13.8583" fill="var(--text)">User message</text>
  <line x1="582.3271" y1="117.1653" x2="582.3271" y2="136.063" stroke="var(--primary-border)" stroke-width="1.8897" marker-end="url(#ard)" />
  <rect x="249.5688" y="138.5827" width="665.5168" height="50.3937" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="582.3271" y="161.2599" text-anchor="middle" font-size="13.8583" font-weight="bold" fill="var(--danger-accent)">Moderation API</text>
  <text x="582.3271" y="181.4173" text-anchor="middle" font-size="12.5985" fill="var(--text-muted)">Block: violence, CSAM, etc.</text>
  <line x1="582.3271" y1="188.9763" x2="582.3271" y2="207.874" stroke="var(--primary-border)" stroke-width="1.8897" marker-end="url(#ard)" />
  <rect x="249.5688" y="210.3937" width="665.5168" height="50.3937" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="582.3271" y="233.0708" text-anchor="middle" font-size="13.8583" font-weight="bold" fill="var(--danger-accent)">Prompt Injection Detection</text>
  <text x="582.3271" y="253.2283" text-anchor="middle" font-size="12.5985" fill="var(--text-muted)">Pattern matching + classifier</text>
  <line x1="582.3271" y1="260.7874" x2="582.3271" y2="279.685" stroke="var(--primary-border)" stroke-width="1.8897" marker-end="url(#ard)" />
  <rect x="249.5688" y="282.2046" width="665.5168" height="50.3937" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="582.3271" y="304.8818" text-anchor="middle" font-size="15.1181" font-weight="bold" fill="var(--ok-accent)">LLM Generation</text>
  <text x="582.3271" y="325.0394" text-anchor="middle" font-size="12.5985" fill="var(--text-muted)">(safety-trained model)</text>
  <line x1="582.3271" y1="332.5984" x2="582.3271" y2="355.2755" stroke="var(--primary-border)" stroke-width="1.8897" marker-end="url(#ard)" />
  <text x="582.3271" y="372.9134" text-anchor="middle" font-size="15.1181" font-weight="bold" fill="var(--primary-accent)">OUTPUT LAYER</text>
  <rect x="249.5688" y="382.9921" width="665.5168" height="50.3937" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="582.3271" y="405.6693" text-anchor="middle" font-size="13.8583" font-weight="bold" fill="var(--danger-accent)">Output Moderation</text>
  <text x="582.3271" y="425.8267" text-anchor="middle" font-size="12.5985" fill="var(--text-muted)">Classify output content</text>
  <line x1="582.3271" y1="433.3858" x2="582.3271" y2="452.2834" stroke="var(--primary-border)" stroke-width="1.8897" marker-end="url(#ard)" />
  <rect x="249.5688" y="454.8031" width="665.5168" height="50.3937" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="582.3271" y="477.4802" text-anchor="middle" font-size="13.8583" font-weight="bold" fill="var(--danger-accent)">PII Detection &amp; Redaction</text>
  <text x="582.3271" y="497.6378" text-anchor="middle" font-size="12.5985" fill="var(--text-muted)">Remove personal information</text>
  <line x1="582.3271" y1="505.1968" x2="582.3271" y2="524.0944" stroke="var(--primary-border)" stroke-width="1.8897" marker-end="url(#ard)" />
  <rect x="249.5688" y="526.6141" width="665.5168" height="50.3937" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="582.3271" y="549.2913" text-anchor="middle" font-size="13.8583" font-weight="bold" fill="var(--danger-accent)">Factuality Check (optional)</text>
  <text x="582.3271" y="569.4488" text-anchor="middle" font-size="12.5985" fill="var(--text-muted)">Verify claims against sources</text>
  <line x1="582.3271" y1="577.0078" x2="582.3271" y2="598.4251" stroke="var(--primary-border)" stroke-width="1.8897" marker-end="url(#ard)" />
  <rect x="366.0342" y="602.2047" width="432.5859" height="37.7953" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="582.3271" y="627.4015" text-anchor="middle" font-size="15.1181" font-weight="bold" fill="var(--ok-accent)">Response to User</text>
</svg>
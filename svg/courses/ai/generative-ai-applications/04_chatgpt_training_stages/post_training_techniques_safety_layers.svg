<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ard" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 0,6.9231" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="18.0124" font-weight="bold" fill="var(--text)">Post-Training Safety Layers</text>
  <text x="639.9999" y="70.0206" text-anchor="middle" font-size="14.4099" font-weight="bold" fill="var(--primary-accent)">INPUT LAYER</text>
  <rect x="322.8289" y="79.6273" width="634.3423" height="42.0289" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="107.2463" text-anchor="middle" font-size="13.2091" fill="var(--text)">User message</text>
  <line x1="639.9999" y1="121.6562" x2="639.9999" y2="139.6687" stroke="var(--primary-border)" stroke-width="1.8897" marker-end="url(#ard)" />
  <rect x="322.8289" y="142.0704" width="634.3423" height="48.0331" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="639.9999" y="163.6853" text-anchor="middle" font-size="13.2091" font-weight="bold" fill="var(--danger-accent)">Moderation API</text>
  <text x="639.9999" y="182.8985" text-anchor="middle" font-size="12.0084" fill="var(--text-muted)">Block: violence, CSAM, etc.</text>
  <line x1="639.9999" y1="190.1034" x2="639.9999" y2="208.1159" stroke="var(--primary-border)" stroke-width="1.8897" marker-end="url(#ard)" />
  <rect x="322.8289" y="210.5176" width="634.3423" height="48.0331" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="639.9999" y="232.1324" text-anchor="middle" font-size="13.2091" font-weight="bold" fill="var(--danger-accent)">Prompt Injection Detection</text>
  <text x="639.9999" y="251.3457" text-anchor="middle" font-size="12.0084" fill="var(--text-muted)">Pattern matching + classifier</text>
  <line x1="639.9999" y1="258.5507" x2="639.9999" y2="276.5631" stroke="var(--primary-border)" stroke-width="1.8897" marker-end="url(#ard)" />
  <rect x="322.8289" y="278.9647" width="634.3423" height="48.0331" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="639.9999" y="300.5796" text-anchor="middle" font-size="14.4099" font-weight="bold" fill="var(--ok-accent)">LLM Generation</text>
  <text x="639.9999" y="319.793" text-anchor="middle" font-size="12.0084" fill="var(--text-muted)">(safety-trained model)</text>
  <line x1="639.9999" y1="326.9979" x2="639.9999" y2="348.6127" stroke="var(--primary-border)" stroke-width="1.8897" marker-end="url(#ard)" />
  <text x="639.9999" y="365.4244" text-anchor="middle" font-size="14.4099" font-weight="bold" fill="var(--primary-accent)">OUTPUT LAYER</text>
  <rect x="322.8289" y="375.031" width="634.3423" height="48.0331" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="639.9999" y="396.646" text-anchor="middle" font-size="13.2091" font-weight="bold" fill="var(--danger-accent)">Output Moderation</text>
  <text x="639.9999" y="415.8591" text-anchor="middle" font-size="12.0084" fill="var(--text-muted)">Classify output content</text>
  <line x1="639.9999" y1="423.0641" x2="639.9999" y2="441.0765" stroke="var(--primary-border)" stroke-width="1.8897" marker-end="url(#ard)" />
  <rect x="322.8289" y="443.4782" width="634.3423" height="48.0331" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="639.9999" y="465.093" text-anchor="middle" font-size="13.2091" font-weight="bold" fill="var(--danger-accent)">PII Detection &amp; Redaction</text>
  <text x="639.9999" y="484.3064" text-anchor="middle" font-size="12.0084" fill="var(--text-muted)">Remove personal information</text>
  <line x1="639.9999" y1="491.5113" x2="639.9999" y2="509.5237" stroke="var(--primary-border)" stroke-width="1.8897" marker-end="url(#ard)" />
  <rect x="322.8289" y="511.9254" width="634.3423" height="48.0331" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="639.9999" y="533.5403" text-anchor="middle" font-size="13.2091" font-weight="bold" fill="var(--danger-accent)">Factuality Check (optional)</text>
  <text x="639.9999" y="552.7536" text-anchor="middle" font-size="12.0084" fill="var(--text-muted)">Verify claims against sources</text>
  <line x1="639.9999" y1="559.9585" x2="639.9999" y2="580.3726" stroke="var(--primary-border)" stroke-width="1.8897" marker-end="url(#ard)" />
  <rect x="433.8387" y="583.9751" width="412.3225" height="36.0249" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="639.9999" y="607.9916" text-anchor="middle" font-size="14.4099" font-weight="bold" fill="var(--ok-accent)">Response to User</text>
</svg>
<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="atp" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">The Three Pillars of ChatGPT</text>
  <rect x="40" y="55" width="720" height="300" rx="8" fill="#f0f7ff" stroke="#4a90e2" stroke-width="1"/>
  <!-- Stage 1 -->
  <rect x="60" y="80" width="200" height="250" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="160" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Stage 1</text>
  <text x="160" y="132" text-anchor="middle" font-size="12" fill="#333">Pre-training</text>
  <line x1="90" y1="145" x2="230" y2="145" stroke="#dee2e6" stroke-width="1"/>
  <text x="160" y="170" text-anchor="middle" font-size="11" fill="#555">Next token</text>
  <text x="160" y="188" text-anchor="middle" font-size="11" fill="#555">prediction</text>
  <line x1="90" y1="200" x2="230" y2="200" stroke="#dee2e6" stroke-width="1"/>
  <text x="160" y="225" text-anchor="middle" font-size="11" fill="#555">Months</text>
  <text x="160" y="250" text-anchor="middle" font-size="16" fill="#dc3545">$$$$$</text>
  <!-- Arrow -->
  <line x1="260" y1="205" x2="290" y2="205" stroke="#4a90e2" stroke-width="2" marker-end="url(#atp)"/>
  <!-- Stage 2 -->
  <rect x="300" y="80" width="200" height="250" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="400" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Stage 2</text>
  <text x="400" y="132" text-anchor="middle" font-size="12" fill="#333">SFT</text>
  <line x1="330" y1="145" x2="470" y2="145" stroke="#dee2e6" stroke-width="1"/>
  <text x="400" y="170" text-anchor="middle" font-size="11" fill="#555">Human-written</text>
  <text x="400" y="188" text-anchor="middle" font-size="11" fill="#555">examples</text>
  <line x1="330" y1="200" x2="470" y2="200" stroke="#dee2e6" stroke-width="1"/>
  <text x="400" y="225" text-anchor="middle" font-size="11" fill="#555">Days</text>
  <text x="400" y="250" text-anchor="middle" font-size="16" fill="#ffc107">$$</text>
  <!-- Arrow -->
  <line x1="500" y1="205" x2="530" y2="205" stroke="#4a90e2" stroke-width="2" marker-end="url(#atp)"/>
  <!-- Stage 3 -->
  <rect x="540" y="80" width="200" height="250" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="640" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">Stage 3</text>
  <text x="640" y="132" text-anchor="middle" font-size="12" fill="#333">RLHF</text>
  <line x1="570" y1="145" x2="710" y2="145" stroke="#dee2e6" stroke-width="1"/>
  <text x="640" y="170" text-anchor="middle" font-size="11" fill="#555">Reward model</text>
  <text x="640" y="188" text-anchor="middle" font-size="11" fill="#555">+ PPO optimization</text>
  <line x1="570" y1="200" x2="710" y2="200" stroke="#dee2e6" stroke-width="1"/>
  <text x="640" y="225" text-anchor="middle" font-size="11" fill="#555">Days</text>
  <text x="640" y="250" text-anchor="middle" font-size="16" fill="#ffc107">$$$</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="atp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.3573" font-weight="bold" fill="var(--text)">The Three Pillars of ChatGPT</text>
  <rect x="40" y="84.6154" width="1200" height="535.3846" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="73.3334" y="129.2307" width="333.3333" height="446.1538" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240.0001" y="182.7693" text-anchor="middle" font-size="22.1876" font-weight="bold" fill="var(--primary-accent)">Stage 1</text>
  <text x="240.0001" y="222.0308" text-anchor="middle" font-size="19.0179" fill="var(--text)">Pre-training</text>
  <line x1="123.3334" y1="245.2307" x2="356.6667" y2="245.2307" stroke="var(--border)" stroke-width="1.5224" />
  <text x="240.0001" y="289.8462" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)">Next token</text>
  <text x="240.0001" y="321.9692" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)">prediction</text>
  <line x1="123.3334" y1="343.3846" x2="356.6667" y2="343.3846" stroke="var(--border)" stroke-width="1.5224" />
  <text x="240.0001" y="388" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)">Months</text>
  <text x="240.0001" y="432.6154" text-anchor="middle" font-size="25.3573" fill="var(--danger-accent)">$$$$$</text>
  <line x1="406.6668" y1="352.3077" x2="456.6667" y2="352.3077" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#atp)" />
  <rect x="473.3334" y="129.2307" width="333.3333" height="446.1538" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="182.7693" text-anchor="middle" font-size="22.1876" font-weight="bold" fill="var(--ok-accent)">Stage 2</text>
  <text x="640.0001" y="222.0308" text-anchor="middle" font-size="19.0179" fill="var(--text)">SFT</text>
  <line x1="523.3334" y1="245.2307" x2="756.6668" y2="245.2307" stroke="var(--border)" stroke-width="1.5224" />
  <text x="640.0001" y="289.8462" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)">Human-written</text>
  <text x="640.0001" y="321.9692" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)">examples</text>
  <line x1="523.3334" y1="343.3846" x2="756.6668" y2="343.3846" stroke="var(--border)" stroke-width="1.5224" />
  <text x="640.0001" y="388" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)">Days</text>
  <text x="640.0001" y="432.6154" text-anchor="middle" font-size="25.3573" fill="var(--warn-accent)">$$</text>
  <line x1="806.6667" y1="352.3077" x2="856.6668" y2="352.3077" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#atp)" />
  <rect x="873.3334" y="129.2307" width="333.3333" height="446.1538" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="182.7693" text-anchor="middle" font-size="22.1876" font-weight="bold" fill="var(--danger-accent)">Stage 3</text>
  <text x="1040" y="222.0308" text-anchor="middle" font-size="19.0179" fill="var(--text)">RLHF</text>
  <line x1="923.3334" y1="245.2307" x2="1156.6668" y2="245.2307" stroke="var(--border)" stroke-width="1.5224" />
  <text x="1040" y="289.8462" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)">Reward model</text>
  <text x="1040" y="321.9692" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)">+ PPO optimization</text>
  <line x1="923.3334" y1="343.3846" x2="1156.6668" y2="343.3846" stroke="var(--border)" stroke-width="1.5224" />
  <text x="1040" y="388" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)">Days</text>
  <text x="1040" y="432.6154" text-anchor="middle" font-size="25.3573" fill="var(--warn-accent)">$$$</text>
</svg>
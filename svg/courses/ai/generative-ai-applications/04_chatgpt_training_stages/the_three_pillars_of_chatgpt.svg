<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.3573" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The Three Pillars of ChatGPT</text>
  <rect x="40" y="84.6154" width="1200" height="535.3846" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="73.3334" y="129.2307" width="333.3333" height="446.1538" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240.0001" y="182.7693" text-anchor="middle" font-size="22.1876" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Stage 1</text>
  <text x="240.0001" y="222.0308" text-anchor="middle" font-size="19.0179" fill="var(--text)" font-family="Arial, sans-serif">Pre-training</text>
  <line x1="123.3334" y1="245.2307" x2="356.6667" y2="245.2307" stroke="var(--border)" stroke-width="1.5224" />
  <text x="240.0001" y="289.8462" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)" font-family="Arial, sans-serif">Next token</text>
  <text x="240.0001" y="321.9692" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)" font-family="Arial, sans-serif">prediction</text>
  <line x1="123.3334" y1="343.3846" x2="356.6667" y2="343.3846" stroke="var(--border)" stroke-width="1.5224" />
  <text x="240.0001" y="388" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)" font-family="Arial, sans-serif">Months</text>
  <text x="240.0001" y="432.6154" text-anchor="middle" font-size="25.3573" fill="var(--danger-accent)" font-family="Arial, sans-serif">$$$$$</text>
  <line x1="406.6668" y1="352.3077" x2="456.6667" y2="352.3077" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="473.3334" y="129.2307" width="333.3333" height="446.1538" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="182.7693" text-anchor="middle" font-size="22.1876" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Stage 2</text>
  <text x="640.0001" y="222.0308" text-anchor="middle" font-size="19.0179" fill="var(--text)" font-family="Arial, sans-serif">SFT</text>
  <line x1="523.3334" y1="245.2307" x2="756.6668" y2="245.2307" stroke="var(--border)" stroke-width="1.5224" />
  <text x="640.0001" y="289.8462" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)" font-family="Arial, sans-serif">Human-written</text>
  <text x="640.0001" y="321.9692" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)" font-family="Arial, sans-serif">examples</text>
  <line x1="523.3334" y1="343.3846" x2="756.6668" y2="343.3846" stroke="var(--border)" stroke-width="1.5224" />
  <text x="640.0001" y="388" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)" font-family="Arial, sans-serif">Days</text>
  <text x="640.0001" y="432.6154" text-anchor="middle" font-size="25.3573" fill="var(--warn-accent)" font-family="Arial, sans-serif">$$</text>
  <line x1="806.6667" y1="352.3077" x2="856.6668" y2="352.3077" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="873.3334" y="129.2307" width="333.3333" height="446.1538" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="182.7693" text-anchor="middle" font-size="22.1876" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Stage 3</text>
  <text x="1040" y="222.0308" text-anchor="middle" font-size="19.0179" fill="var(--text)" font-family="Arial, sans-serif">RLHF</text>
  <line x1="923.3334" y1="245.2307" x2="1156.6668" y2="245.2307" stroke="var(--border)" stroke-width="1.5224" />
  <text x="1040" y="289.8462" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)" font-family="Arial, sans-serif">Reward model</text>
  <text x="1040" y="321.9692" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)" font-family="Arial, sans-serif">+ PPO optimization</text>
  <line x1="923.3334" y1="343.3846" x2="1156.6668" y2="343.3846" stroke="var(--border)" stroke-width="1.5224" />
  <text x="1040" y="388" text-anchor="middle" font-size="17.4331" fill="var(--text-muted)" font-family="Arial, sans-serif">Days</text>
  <text x="1040" y="432.6154" text-anchor="middle" font-size="25.3573" fill="var(--warn-accent)" font-family="Arial, sans-serif">$$$</text>
</svg>
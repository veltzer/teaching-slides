<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="atp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="608.9515" y="54.0845" text-anchor="middle" font-size="24.3581" font-weight="bold" fill="var(--text)">The Three Pillars of ChatGPT</text>
  <rect x="60.8951" y="99.1549" width="1096.1126" height="540.8451" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="91.3427" y="144.2253" width="304.4757" height="450.7042" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="243.5806" y="198.3099" text-anchor="middle" font-size="21.3133" font-weight="bold" fill="var(--primary-accent)">Stage 1</text>
  <text x="243.5806" y="237.9719" text-anchor="middle" font-size="18.2685" fill="var(--text)">Pre-training</text>
  <line x1="137.0141" y1="261.4084" x2="350.1471" y2="261.4084" stroke="var(--border)" stroke-width="1.5224" />
  <text x="243.5806" y="306.4789" text-anchor="middle" font-size="16.7462" fill="var(--text-muted)">Next token</text>
  <text x="243.5806" y="338.9295" text-anchor="middle" font-size="16.7462" fill="var(--text-muted)">prediction</text>
  <line x1="137.0141" y1="360.5634" x2="350.1471" y2="360.5634" stroke="var(--border)" stroke-width="1.5224" />
  <text x="243.5806" y="405.6338" text-anchor="middle" font-size="16.7462" fill="var(--text-muted)">Months</text>
  <text x="243.5806" y="450.7042" text-anchor="middle" font-size="24.3581" fill="var(--danger-accent)">$$$$$</text>
  <line x1="395.8185" y1="369.5775" x2="441.4898" y2="369.5775" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#atp)" />
  <rect x="456.7136" y="144.2253" width="304.4757" height="450.7042" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="608.9515" y="198.3099" text-anchor="middle" font-size="21.3133" font-weight="bold" fill="var(--ok-accent)">Stage 2</text>
  <text x="608.9515" y="237.9719" text-anchor="middle" font-size="18.2685" fill="var(--text)">SFT</text>
  <line x1="502.385" y1="261.4084" x2="715.518" y2="261.4084" stroke="var(--border)" stroke-width="1.5224" />
  <text x="608.9515" y="306.4789" text-anchor="middle" font-size="16.7462" fill="var(--text-muted)">Human-written</text>
  <text x="608.9515" y="338.9295" text-anchor="middle" font-size="16.7462" fill="var(--text-muted)">examples</text>
  <line x1="502.385" y1="360.5634" x2="715.518" y2="360.5634" stroke="var(--border)" stroke-width="1.5224" />
  <text x="608.9515" y="405.6338" text-anchor="middle" font-size="16.7462" fill="var(--text-muted)">Days</text>
  <text x="608.9515" y="450.7042" text-anchor="middle" font-size="24.3581" fill="var(--warn-accent)">$$</text>
  <line x1="761.1893" y1="369.5775" x2="806.8607" y2="369.5775" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#atp)" />
  <rect x="822.0845" y="144.2253" width="304.4757" height="450.7042" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="974.3223" y="198.3099" text-anchor="middle" font-size="21.3133" font-weight="bold" fill="var(--danger-accent)">Stage 3</text>
  <text x="974.3223" y="237.9719" text-anchor="middle" font-size="18.2685" fill="var(--text)">RLHF</text>
  <line x1="867.7558" y1="261.4084" x2="1080.8889" y2="261.4084" stroke="var(--border)" stroke-width="1.5224" />
  <text x="974.3223" y="306.4789" text-anchor="middle" font-size="16.7462" fill="var(--text-muted)">Reward model</text>
  <text x="974.3223" y="338.9295" text-anchor="middle" font-size="16.7462" fill="var(--text-muted)">+ PPO optimization</text>
  <line x1="867.7558" y1="360.5634" x2="1080.8889" y2="360.5634" stroke="var(--border)" stroke-width="1.5224" />
  <text x="974.3223" y="405.6338" text-anchor="middle" font-size="16.7462" fill="var(--text-muted)">Days</text>
  <text x="974.3223" y="450.7042" text-anchor="middle" font-size="24.3581" fill="var(--warn-accent)">$$$</text>
</svg>
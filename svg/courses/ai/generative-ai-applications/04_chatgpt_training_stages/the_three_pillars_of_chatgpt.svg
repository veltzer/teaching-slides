  <ns0:line x1="395.8185" y1="369.5775" x2="441.4898" y2="369.5775" stroke="var(--primary-bright)" stroke-width="3.0448" marker-end="url(#atp)" />
  <ns0:rect x="456.7136" y="144.2253" width="304.4757" height="450.7042" rx="7.6119" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.0448" />

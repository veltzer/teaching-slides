<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="acp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 0,7.2" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="20.3063" font-weight="bold" fill="var(--text)">The Complete Pipeline Summary</text>
  <rect x="414.374" y="59.0372" width="451.2521" height="44.4201" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="88.2276" text-anchor="middle" font-size="15.2297" fill="var(--text-muted)">RAW TEXT (Internet, books, code)</text>
  <line x1="640" y1="103.4574" x2="640" y2="128.8403" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#acp)" />
  <rect x="263.9566" y="128.8403" width="752.0868" height="114.2232" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="158.0307" text-anchor="middle" font-size="16.4989" font-weight="bold" fill="var(--primary-accent)">1. PRE-TRAINING</text>
  <text x="640" y="185.9519" text-anchor="middle" font-size="13.9606" fill="var(--text-muted)">Objective: Next token prediction | Data: ~2T tokens</text>
  <text x="640" y="208.7965" text-anchor="middle" font-size="13.9606" fill="var(--text-muted)">Duration: Weeks-months</text>
  <text x="640" y="231.6411" text-anchor="middle" font-size="13.9606" fill="var(--danger-accent)">Result: Knowledgeable but unaligned</text>
  <line x1="640" y1="243.0635" x2="640" y2="274.7922" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#acp)" />
  <rect x="263.9566" y="274.7922" width="752.0868" height="114.2232" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="303.9825" text-anchor="middle" font-size="16.4989" font-weight="bold" fill="var(--ok-accent)">2. SUPERVISED FINE-TUNING (SFT)</text>
  <text x="640" y="331.9037" text-anchor="middle" font-size="13.9606" fill="var(--text-muted)">Data: ~100K human-written examples | Duration: Days</text>
  <text x="640" y="376.3238" text-anchor="middle" font-size="13.9606" fill="var(--danger-accent)">Result: Follows instructions</text>
  <line x1="640" y1="389.0153" x2="640" y2="420.744" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#acp)" />
  <rect x="263.9566" y="420.744" width="752.0868" height="114.2232" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="449.9344" text-anchor="middle" font-size="16.4989" font-weight="bold" fill="var(--danger-accent)">3. RLHF / DPO / RLAIF</text>
  <text x="640" y="477.8556" text-anchor="middle" font-size="13.9606" fill="var(--text-muted)">Data: ~300K preference comparisons | Duration: Days</text>
  <text x="640" y="522.2757" text-anchor="middle" font-size="13.9606" fill="var(--danger-accent)">Result: Aligned, safe, helpful</text>
  <line x1="640" y1="534.9671" x2="640" y2="566.6959" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#acp)" />
  <rect x="414.374" y="569.2342" width="451.2521" height="50.7658" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="602.232" text-anchor="middle" font-size="17.768" font-weight="bold" fill="var(--ok-accent)">DEPLOYED MODEL</text>
</svg>
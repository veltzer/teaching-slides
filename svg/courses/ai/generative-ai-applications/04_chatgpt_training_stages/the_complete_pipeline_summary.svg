<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="85" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text-muted)">Raw Text: Internet, books, code</text>

  <line x1="640" y1="110" x2="640" y2="140" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="145" width="1200" height="125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="180" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)">1. Pre-Training</text>
  <text x="640" y="215" text-anchor="middle" font-size="17" fill="var(--primary-text)">Next-token objective, ~2T tokens, weeks on GPU clusters</text>
  <text x="640" y="245" text-anchor="middle" font-size="17" fill="var(--primary-text)">Result: a knowledgeable but unaligned base model</text>

  <line x1="640" y1="270" x2="640" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="305" width="1200" height="125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="340" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--ok-text)">2. Supervised Fine-Tuning (SFT)</text>
  <text x="640" y="375" text-anchor="middle" font-size="17" fill="var(--ok-text)">~100K human-written prompts + ideal answers, days</text>
  <text x="640" y="405" text-anchor="middle" font-size="17" fill="var(--ok-text)">Result: the model learns to follow instructions</text>

  <line x1="640" y1="430" x2="640" y2="460" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="465" width="1200" height="125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="500" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)">3. RLHF / DPO / RLAIF</text>
  <text x="640" y="535" text-anchor="middle" font-size="17" fill="var(--warn-text)">~300K preference comparisons, reward model + policy update</text>
  <text x="640" y="565" text-anchor="middle" font-size="17" fill="var(--warn-text)">Result: aligned, safer, more helpful outputs</text>

  <rect x="40" y="600" width="1200" height="20" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
</svg>

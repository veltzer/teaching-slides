<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="acp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 0,7.2" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="590.1337" y="33.195" text-anchor="middle" font-size="21.2448" font-weight="bold" fill="var(--text)">The Complete Pipeline Summary</text>
  <rect x="354.0802" y="53.112" width="472.107" height="46.473" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="590.1337" y="83.6515" text-anchor="middle" font-size="15.9336" fill="var(--text-muted)">RAW TEXT (Internet, books, code)</text>
  <line x1="590.1337" y1="99.5851" x2="590.1337" y2="126.1411" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#acp)" />
  <rect x="196.7112" y="126.1411" width="786.8449" height="119.5021" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="590.1337" y="156.6805" text-anchor="middle" font-size="17.2614" font-weight="bold" fill="var(--primary-accent)">1. PRE-TRAINING</text>
  <text x="590.1337" y="185.8921" text-anchor="middle" font-size="14.6058" fill="var(--text-muted)">Objective: Next token prediction | Data: ~2T tokens</text>
  <text x="590.1337" y="209.7925" text-anchor="middle" font-size="14.6058" fill="var(--text-muted)">Duration: Weeks-months</text>
  <text x="590.1337" y="233.6929" text-anchor="middle" font-size="14.6058" fill="var(--danger-accent)">Result: Knowledgeable but unaligned</text>
  <line x1="590.1337" y1="245.6432" x2="590.1337" y2="278.8382" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#acp)" />
  <rect x="196.7112" y="278.8382" width="786.8449" height="119.5021" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="590.1337" y="309.3776" text-anchor="middle" font-size="17.2614" font-weight="bold" fill="var(--ok-accent)">2. SUPERVISED FINE-TUNING (SFT)</text>
  <text x="590.1337" y="338.5892" text-anchor="middle" font-size="14.6058" fill="var(--text-muted)">Data: ~100K human-written examples | Duration: Days</text>
  <text x="590.1337" y="385.0622" text-anchor="middle" font-size="14.6058" fill="var(--danger-accent)">Result: Follows instructions</text>
  <line x1="590.1337" y1="398.3402" x2="590.1337" y2="431.5353" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#acp)" />
  <rect x="196.7112" y="431.5353" width="786.8449" height="119.5021" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="590.1337" y="462.0747" text-anchor="middle" font-size="17.2614" font-weight="bold" fill="var(--danger-accent)">3. RLHF / DPO / RLAIF</text>
  <text x="590.1337" y="491.2863" text-anchor="middle" font-size="14.6058" fill="var(--text-muted)">Data: ~300K preference comparisons | Duration: Days</text>
  <text x="590.1337" y="537.7593" text-anchor="middle" font-size="14.6058" fill="var(--danger-accent)">Result: Aligned, safe, helpful</text>
  <line x1="590.1337" y1="551.0373" x2="590.1337" y2="584.2324" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#acp)" />
  <rect x="354.0802" y="586.888" width="472.107" height="53.112" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="590.1337" y="621.4108" text-anchor="middle" font-size="18.5892" font-weight="bold" fill="var(--ok-accent)">DEPLOYED MODEL</text>
</svg>
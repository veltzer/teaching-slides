<svg viewBox="0 0 750 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="acp" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">The Complete Pipeline Summary</text>
  <!-- Raw text -->
  <rect x="225" y="40" width="300" height="35" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="375" y="63" text-anchor="middle" font-size="12" fill="#555">RAW TEXT (Internet, books, code)</text>
  <line x1="375" y1="75" x2="375" y2="95" stroke="#4a90e2" stroke-width="2" marker-end="url(#acp)"/>
  <!-- Stage 1 -->
  <rect x="125" y="95" width="500" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="375" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">1. PRE-TRAINING</text>
  <text x="375" y="140" text-anchor="middle" font-size="11" fill="#555">Objective: Next token prediction | Data: ~2T tokens</text>
  <text x="375" y="158" text-anchor="middle" font-size="11" fill="#555">Duration: Weeks-months</text>
  <text x="375" y="176" text-anchor="middle" font-size="11" fill="#856404">Result: Knowledgeable but unaligned</text>
  <line x1="375" y1="185" x2="375" y2="210" stroke="#4a90e2" stroke-width="2" marker-end="url(#acp)"/>
  <!-- Stage 2 -->
  <rect x="125" y="210" width="500" height="90" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="375" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">2. SUPERVISED FINE-TUNING (SFT)</text>
  <text x="375" y="255" text-anchor="middle" font-size="11" fill="#555">Data: ~100K human-written examples | Duration: Days</text>
  <text x="375" y="290" text-anchor="middle" font-size="11" fill="#856404">Result: Follows instructions</text>
  <line x1="375" y1="300" x2="375" y2="325" stroke="#4a90e2" stroke-width="2" marker-end="url(#acp)"/>
  <!-- Stage 3 -->
  <rect x="125" y="325" width="500" height="90" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="375" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">3. RLHF / DPO / RLAIF</text>
  <text x="375" y="370" text-anchor="middle" font-size="11" fill="#555">Data: ~300K preference comparisons | Duration: Days</text>
  <text x="375" y="405" text-anchor="middle" font-size="11" fill="#856404">Result: Aligned, safe, helpful</text>
  <line x1="375" y1="415" x2="375" y2="440" stroke="#4a90e2" stroke-width="2" marker-end="url(#acp)"/>
  <!-- Deployed -->
  <rect x="225" y="442" width="300" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="375" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">DEPLOYED MODEL</text>
</svg>
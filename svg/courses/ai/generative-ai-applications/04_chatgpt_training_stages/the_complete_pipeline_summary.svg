  <ns0:rect x="196.7112" y="126.1411" width="786.8449" height="119.5021" rx="6.639" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.6556" />
  <ns0:text x="590.1337" y="156.6805" text-anchor="middle" font-size="17.2614" font-weight="bold" fill="#4a90e2">1. PRE-TRAINING</ns0:text>
  <ns0:text x="590.1337" y="185.8921" text-anchor="middle" font-size="14.6058" fill="#555">Objective: Next token prediction | Data: ~2T tokens</ns0:text>
  <ns0:text x="590.1337" y="209.7925" text-anchor="middle" font-size="14.6058" fill="#555">Duration: Weeks-months</ns0:text>
  <ns0:text x="590.1337" y="233.6929" text-anchor="middle" font-size="14.6058" fill="#bf360c">Result: Knowledgeable but unaligned</ns0:text>
  <ns0:line x1="590.1337" y1="245.6432" x2="590.1337" y2="278.8382" stroke="#4a90e2" stroke-width="2.6556" marker-end="url(#acp)" />
  <ns0:rect x="196.7112" y="278.8382" width="786.8449" height="119.5021" rx="6.639" fill="#d4edda" stroke="#28a745" stroke-width="2.6556" />
  <ns0:text x="590.1337" y="309.3776" text-anchor="middle" font-size="17.2614" font-weight="bold" fill="#28a745">2. SUPERVISED FINE-TUNING (SFT)</ns0:text>
  <ns0:text x="590.1337" y="338.5892" text-anchor="middle" font-size="14.6058" fill="#555">Data: ~100K human-written examples | Duration: Days</ns0:text>
  <ns0:text x="590.1337" y="385.0622" text-anchor="middle" font-size="14.6058" fill="#bf360c">Result: Follows instructions</ns0:text>
  <ns0:line x1="590.1337" y1="398.3402" x2="590.1337" y2="431.5353" stroke="#4a90e2" stroke-width="2.6556" marker-end="url(#acp)" />
  <ns0:rect x="196.7112" y="431.5353" width="786.8449" height="119.5021" rx="6.639" fill="#fff3cd" stroke="#ffc107" stroke-width="2.6556" />
  <ns0:text x="590.1337" y="462.0747" text-anchor="middle" font-size="17.2614" font-weight="bold" fill="#bf360c">3. RLHF / DPO / RLAIF</ns0:text>
  <ns0:text x="590.1337" y="491.2863" text-anchor="middle" font-size="14.6058" fill="#555">Data: ~300K preference comparisons | Duration: Days</ns0:text>
  <ns0:text x="590.1337" y="537.7593" text-anchor="middle" font-size="14.6058" fill="#bf360c">Result: Aligned, safe, helpful</ns0:text>
  <ns0:line x1="590.1337" y1="551.0373" x2="590.1337" y2="584.2324" stroke="#4a90e2" stroke-width="2.6556" marker-end="url(#acp)" />
  <ns0:rect x="354.0802" y="586.888" width="472.107" height="53.112" rx="6.639" fill="#d4edda" stroke="#28a745" stroke-width="2.6556" />
  <ns0:text x="590.1337" y="621.4108" text-anchor="middle" font-size="18.5892" font-weight="bold" fill="#28a745">DEPLOYED MODEL</ns0:text>
</ns0:svg>
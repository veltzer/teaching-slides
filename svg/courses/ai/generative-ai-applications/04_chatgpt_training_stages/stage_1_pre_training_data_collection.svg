<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="577.6623" y="40" text-anchor="middle" font-size="28.9431" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Stage 1: Pre-Training Data Collection</text>
  <rect x="40" y="103.2726" width="249.3506" height="73.8182" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="151.7817" text-anchor="middle" font-size="19.8984" fill="var(--text)" font-family="Arial, sans-serif">Common Crawl (PB)</text>
  <rect x="40" y="198.1818" width="249.3506" height="73.8182" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="246.6909" text-anchor="middle" font-size="19.8984" fill="var(--text)" font-family="Arial, sans-serif">Wikipedia</text>
  <rect x="40" y="293.091" width="249.3506" height="73.8182" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="341.6" text-anchor="middle" font-size="19.8984" fill="var(--text)" font-family="Arial, sans-serif">Books</text>
  <rect x="40" y="388" width="249.3506" height="73.8182" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="436.5091" text-anchor="middle" font-size="19.8984" fill="var(--text)" font-family="Arial, sans-serif">Code (GitHub)</text>
  <rect x="40" y="482.9091" width="249.3506" height="73.8182" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="531.4181" text-anchor="middle" font-size="19.8984" fill="var(--text)" font-family="Arial, sans-serif">Academic Papers</text>
  <line x1="289.3506" y1="139.1273" x2="429.6104" y2="314.1818" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="289.3506" y1="234.0364" x2="429.6104" y2="314.1818" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="289.3506" y1="328.9455" x2="429.6104" y2="335.2727" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="289.3506" y1="423.8545" x2="429.6104" y2="356.3636" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="289.3506" y1="518.7636" x2="429.6104" y2="377.4546" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="445.1948" y="187.6364" width="280.5195" height="295.2727" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="585.4545" y="240.3635" text-anchor="middle" font-size="23.5163" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Filtering</text>
  <text x="585.4545" y="240.3635" text-anchor="middle" font-size="23.5163" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Filtering</text>
  <text x="585.4545" y="288.8728" text-anchor="middle" font-size="19.8984" fill="var(--text-muted)" font-family="Arial, sans-serif">- Deduplication</text>
  <text x="585.4545" y="331.0545" text-anchor="middle" font-size="19.8984" fill="var(--text-muted)" font-family="Arial, sans-serif">- Quality filtering</text>
  <text x="585.4545" y="373.2364" text-anchor="middle" font-size="19.8984" fill="var(--text-muted)" font-family="Arial, sans-serif">- Toxicity removal</text>
  <text x="585.4545" y="415.4181" text-anchor="middle" font-size="19.8984" fill="var(--text-muted)" font-family="Arial, sans-serif">- PII removal</text>
  <line x1="725.7143" y1="335.2727" x2="819.2208" y2="335.2727" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="834.8052" y="229.8182" width="264.9351" height="210.9091" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="967.2728" y="293.091" text-anchor="middle" font-size="23.5163" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Tokenization</text>
  <text x="967.2728" y="345.8182" text-anchor="middle" font-size="19.8984" fill="var(--text-muted)" font-family="Arial, sans-serif">BPE / tiktoken</text>
  <line x1="967.2728" y1="440.7273" x2="967.2728" y2="525.0909" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="694.5455" y="535.6364" width="545.4545" height="84.3636" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="967.2728" y="588.3637" text-anchor="middle" font-size="23.5163" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">~2-10 Trillion tokens</text>
</svg>

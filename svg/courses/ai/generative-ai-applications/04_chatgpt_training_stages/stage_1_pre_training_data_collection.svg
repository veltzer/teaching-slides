<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arpd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 0,8.5714" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="577.6623" y="40" text-anchor="middle" font-size="28.9431" font-weight="bold" fill="var(--text)">Stage 1: Pre-Training Data Collection</text>
  <rect x="40" y="103.2726" width="249.3506" height="73.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="151.7817" text-anchor="middle" font-size="19.8984" fill="var(--text)">Common Crawl (PB)</text>
  <rect x="40" y="198.1818" width="249.3506" height="73.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="246.6909" text-anchor="middle" font-size="19.8984" fill="var(--text)">Wikipedia</text>
  <rect x="40" y="293.091" width="249.3506" height="73.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="341.6" text-anchor="middle" font-size="19.8984" fill="var(--text)">Books</text>
  <rect x="40" y="388" width="249.3506" height="73.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="436.5091" text-anchor="middle" font-size="19.8984" fill="var(--text)">Code (GitHub)</text>
  <rect x="40" y="482.9091" width="249.3506" height="73.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="531.4181" text-anchor="middle" font-size="19.8984" fill="var(--text)">Academic Papers</text>
  <line x1="289.3506" y1="139.1273" x2="429.6104" y2="314.1818" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arp)" />
  <line x1="289.3506" y1="234.0364" x2="429.6104" y2="314.1818" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arp)" />
  <line x1="289.3506" y1="328.9455" x2="429.6104" y2="335.2727" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arp)" />
  <line x1="289.3506" y1="423.8545" x2="429.6104" y2="356.3636" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arp)" />
  <line x1="289.3506" y1="518.7636" x2="429.6104" y2="377.4546" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arp)" />
  <rect x="445.1948" y="187.6364" width="280.5195" height="295.2727" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="585.4545" y="240.3635" text-anchor="middle" font-size="23.5163" font-weight="bold" fill="var(--danger-accent)">Filtering</text>
  <text x="585.4545" y="240.3635" text-anchor="middle" font-size="23.5163" font-weight="bold" fill="var(--danger-accent)">Filtering</text>
  <text x="585.4545" y="288.8728" text-anchor="middle" font-size="19.8984" fill="var(--text-muted)">- Deduplication</text>
  <text x="585.4545" y="331.0545" text-anchor="middle" font-size="19.8984" fill="var(--text-muted)">- Quality filtering</text>
  <text x="585.4545" y="373.2364" text-anchor="middle" font-size="19.8984" fill="var(--text-muted)">- Toxicity removal</text>
  <text x="585.4545" y="415.4181" text-anchor="middle" font-size="19.8984" fill="var(--text-muted)">- PII removal</text>
  <line x1="725.7143" y1="335.2727" x2="819.2208" y2="335.2727" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arp)" />
  <rect x="834.8052" y="229.8182" width="264.9351" height="210.9091" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="967.2728" y="293.091" text-anchor="middle" font-size="23.5163" font-weight="bold" fill="var(--ok-accent)">Tokenization</text>
  <text x="967.2728" y="345.8182" text-anchor="middle" font-size="19.8984" fill="var(--text-muted)">BPE / tiktoken</text>
  <line x1="967.2728" y1="440.7273" x2="967.2728" y2="525.0909" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arpd)" />
  <rect x="694.5455" y="535.6364" width="545.4545" height="84.3636" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="967.2728" y="588.3637" text-anchor="middle" font-size="23.5163" font-weight="bold" fill="var(--primary-accent)">~2-10 Trillion tokens</text>
</svg>
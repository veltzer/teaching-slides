<svg viewBox="0 0 750 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arp" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arpd" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="375" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Stage 1: Pre-Training Data Collection</text>
  <!-- Sources -->
  <rect x="30" y="60" width="160" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="110" y="83" text-anchor="middle" font-size="11" fill="#333">Common Crawl (PB)</text>
  <rect x="30" y="105" width="160" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="110" y="128" text-anchor="middle" font-size="11" fill="#333">Wikipedia</text>
  <rect x="30" y="150" width="160" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="110" y="173" text-anchor="middle" font-size="11" fill="#333">Books</text>
  <rect x="30" y="195" width="160" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="110" y="218" text-anchor="middle" font-size="11" fill="#333">Code (GitHub)</text>
  <rect x="30" y="240" width="160" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="110" y="263" text-anchor="middle" font-size="11" fill="#333">Academic Papers</text>
  <!-- Arrows to filter -->
  <line x1="190" y1="77" x2="280" y2="160" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arp)"/>
  <line x1="190" y1="122" x2="280" y2="160" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arp)"/>
  <line x1="190" y1="167" x2="280" y2="170" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arp)"/>
  <line x1="190" y1="212" x2="280" y2="180" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arp)"/>
  <line x1="190" y1="257" x2="280" y2="190" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arp)"/>
  <!-- Filtering -->
  <rect x="290" y="100" width="180" height="140" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="380" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">Filtering</text>
  <text x="380" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">Filtering</text>
  <text x="380" y="148" text-anchor="middle" font-size="11" fill="#555">- Deduplication</text>
  <text x="380" y="168" text-anchor="middle" font-size="11" fill="#555">- Quality filtering</text>
  <text x="380" y="188" text-anchor="middle" font-size="11" fill="#555">- Toxicity removal</text>
  <text x="380" y="208" text-anchor="middle" font-size="11" fill="#555">- PII removal</text>
  <line x1="470" y1="170" x2="530" y2="170" stroke="#4a90e2" stroke-width="2" marker-end="url(#arp)"/>
  <!-- Tokenization -->
  <rect x="540" y="120" width="170" height="100" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="625" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Tokenization</text>
  <text x="625" y="175" text-anchor="middle" font-size="11" fill="#555">BPE / tiktoken</text>
  <line x1="625" y1="220" x2="625" y2="260" stroke="#4a90e2" stroke-width="2" marker-end="url(#arpd)"/>
  <!-- Output -->
  <rect x="450" y="265" width="350" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="625" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">~2-10 Trillion tokens</text>
</svg>
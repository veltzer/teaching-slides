<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="249.3506" height="82.857142857143" rx="6.356740777518" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="94.44897638484" text-anchor="middle" font-size="21.08149511456" fill="var(--text)" font-family="Arial, sans-serif">Common Crawl (PB)</text>
  <rect x="40" y="146.530708454787" width="249.3506" height="82.857142857143" rx="6.356740777518" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="200.979684839627" text-anchor="middle" font-size="21.08149511456" fill="var(--text)" font-family="Arial, sans-serif">Wikipedia</text>
  <rect x="40" y="253.061416909574" width="249.3506" height="82.857142857143" rx="6.356740777518" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="307.510281049544" text-anchor="middle" font-size="21.08149511456" fill="var(--text)" font-family="Arial, sans-serif">Books</text>
  <rect x="40" y="359.59190087462" width="249.3506" height="82.857142857143" rx="6.356740777518" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="414.04087725946" text-anchor="middle" font-size="21.08149511456" fill="var(--text)" font-family="Arial, sans-serif">Code (GitHub)</text>
  <rect x="40" y="466.122497084536" width="249.3506" height="82.857142857143" rx="6.356740777518" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.6753" y="520.571361224507" text-anchor="middle" font-size="21.08149511456" fill="var(--text)" font-family="Arial, sans-serif">Academic Papers</text>
  <line x1="289.3506" y1="80.245061515995" x2="429.6104" y2="276.734758017477" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="289.3506" y1="186.775657725911" x2="429.6104" y2="276.734758017477" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="289.3506" y1="293.306253935828" x2="429.6104" y2="300.408211370251" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="289.3506" y1="399.836737900874" x2="429.6104" y2="324.081664723024" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="289.3506" y1="506.36733411079" x2="429.6104" y2="347.755230320668" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="445.1948" y="134.694037900835" width="280.5195" height="331.428459183701" rx="6.356740777518" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="585.4545" y="193.877502915464" text-anchor="middle" font-size="24.914503857724" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Filtering</text>
  <text x="585.4545" y="193.877502915464" text-anchor="middle" font-size="24.914503857724" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Filtering</text>
  <text x="585.4545" y="248.326703790045" text-anchor="middle" font-size="21.08149511456" fill="var(--text-muted)" font-family="Arial, sans-serif">- Deduplication</text>
  <text x="585.4545" y="295.673498250722" text-anchor="middle" font-size="21.08149511456" fill="var(--text-muted)" font-family="Arial, sans-serif">- Quality filtering</text>
  <text x="585.4545" y="343.020517201139" text-anchor="middle" font-size="21.08149511456" fill="var(--text-muted)" font-family="Arial, sans-serif">- Toxicity removal</text>
  <text x="585.4545" y="390.367311661816" text-anchor="middle" font-size="21.08149511456" fill="var(--text-muted)" font-family="Arial, sans-serif">- PII removal</text>
  <line x1="725.7143" y1="300.408211370251" x2="819.2208" y2="300.408211370251" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="834.8052" y="182.040944606382" width="264.9351" height="236.734645772607" rx="6.356740777518" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="967.2728" y="253.061416909574" text-anchor="middle" font-size="24.914503857724" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Tokenization</text>
  <text x="967.2728" y="312.244994169073" text-anchor="middle" font-size="21.08149511456" fill="var(--text-muted)" font-family="Arial, sans-serif">BPE / tiktoken</text>
  <line x1="967.2728" y1="418.775590378989" x2="967.2728" y2="513.469403790084" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="694.5455" y="525.306186588906" width="545.4545" height="94.693813411095" rx="6.356740777518" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="967.2728" y="584.489876093275" text-anchor="middle" font-size="24.914503857724" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">~2-10 Trillion tokens</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arpd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 0,8.5714" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="600" y="48.2143" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">Stage 1: Pre-Training Data Collection</text>
  <rect x="48" y="96.4285" width="256" height="56.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="176" y="133.3928" text-anchor="middle" font-size="17.6" fill="var(--text)">Common Crawl (PB)</text>
  <rect x="48" y="168.75" width="256" height="56.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="176" y="205.7143" text-anchor="middle" font-size="17.6" fill="var(--text)">Wikipedia</text>
  <rect x="48" y="241.0715" width="256" height="56.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="176" y="278.0357" text-anchor="middle" font-size="17.6" fill="var(--text)">Books</text>
  <rect x="48" y="313.3929" width="256" height="56.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="176" y="350.3572" text-anchor="middle" font-size="17.6" fill="var(--text)">Code (GitHub)</text>
  <rect x="48" y="385.7143" width="256" height="56.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="176" y="422.6785" text-anchor="middle" font-size="17.6" fill="var(--text)">Academic Papers</text>
  <line x1="304" y1="123.75" x2="448" y2="257.1429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arp)" />
  <line x1="304" y1="196.0715" x2="448" y2="257.1429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arp)" />
  <line x1="304" y1="268.3929" x2="448" y2="273.2143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arp)" />
  <line x1="304" y1="340.7143" x2="448" y2="289.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arp)" />
  <line x1="304" y1="413.0357" x2="448" y2="305.3572" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arp)" />
  <rect x="464" y="160.7143" width="288" height="225" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="608" y="200.8928" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--danger-accent)">Filtering</text>
  <text x="608" y="200.8928" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--danger-accent)">Filtering</text>
  <text x="608" y="237.8572" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">- Deduplication</text>
  <text x="608" y="270" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">- Quality filtering</text>
  <text x="608" y="302.1429" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">- Toxicity removal</text>
  <text x="608" y="334.2857" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">- PII removal</text>
  <line x1="752" y1="273.2143" x2="848" y2="273.2143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arp)" />
  <rect x="864" y="192.8572" width="272" height="160.7143" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1000.0001" y="241.0715" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--ok-accent)">Tokenization</text>
  <text x="1000.0001" y="281.25" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">BPE / tiktoken</text>
  <line x1="1000.0001" y1="353.5715" x2="1000.0001" y2="417.8572" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arpd)" />
  <rect x="720" y="425.8929" width="560" height="64.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1000.0001" y="466.0715" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--primary-accent)">~2-10 Trillion tokens</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="25.9635" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Distributed Training Strategies</text>
  <rect x="40" y="86.7742" width="566.6667" height="243.2258" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="133.5483" text-anchor="middle" font-size="21.0954" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Data Parallel</text>
  <text x="323.3333" y="180.3226" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)" font-family="Arial, sans-serif">Same model on each GPU,</text>
  <text x="323.3333" y="214" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)" font-family="Arial, sans-serif">different data batches</text>
  <rect x="90" y="245.8065" width="466.6666" height="46.7742" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="279.4839" text-anchor="middle" font-size="16.2272" fill="var(--danger-accent)" font-family="Arial, sans-serif">Simple but memory-limited</text>
  <rect x="673.3333" y="86.7742" width="566.6667" height="243.2258" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="133.5483" text-anchor="middle" font-size="21.0954" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Tensor Parallel</text>
  <text x="956.6666" y="180.3226" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)" font-family="Arial, sans-serif">Split individual layers</text>
  <text x="956.6666" y="214" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)" font-family="Arial, sans-serif">across GPUs (within node)</text>
  <rect x="723.3332" y="245.8065" width="466.6666" height="46.7742" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="279.4839" text-anchor="middle" font-size="16.2272" fill="var(--danger-accent)" font-family="Arial, sans-serif">Attention heads distributed</text>
  <rect x="40" y="376.7742" width="566.6667" height="243.2258" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="423.5484" text-anchor="middle" font-size="21.0954" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Pipeline Parallel</text>
  <text x="323.3333" y="470.3226" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)" font-family="Arial, sans-serif">Different layers on different</text>
  <text x="323.3333" y="504" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)" font-family="Arial, sans-serif">GPUs (across nodes)</text>
  <rect x="90" y="535.8065" width="466.6666" height="46.7742" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="569.4839" text-anchor="middle" font-size="16.2272" fill="var(--primary-accent)" font-family="Arial, sans-serif">Micro-batching for efficiency</text>
  <rect x="673.3333" y="376.7742" width="566.6667" height="243.2258" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="423.5484" text-anchor="middle" font-size="21.0954" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ZeRO (DeepSpeed)</text>
  <text x="956.6666" y="470.3226" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)" font-family="Arial, sans-serif">Shard optimizer states,</text>
  <text x="956.6666" y="504" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)" font-family="Arial, sans-serif">gradients, and parameters</text>
  <rect x="723.3332" y="535.8065" width="466.6666" height="46.7742" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="569.4839" text-anchor="middle" font-size="16.2272" fill="var(--ok-accent)" font-family="Arial, sans-serif">Across all GPUs</text>
</svg>

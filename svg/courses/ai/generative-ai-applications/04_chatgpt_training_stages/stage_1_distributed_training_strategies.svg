<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="566.6667" height="264.561399692213" rx="6.257626963204" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="90.877091843643" text-anchor="middle" font-size="22.00119063993" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Data Parallel</text>
  <text x="323.3333" y="141.754401231148" text-anchor="middle" font-size="18.61633592175" fill="var(--text-muted)" font-family="Arial, sans-serif">Same model on each GPU,</text>
  <text x="323.3333" y="178.385959569098" text-anchor="middle" font-size="18.61633592175" fill="var(--text-muted)" font-family="Arial, sans-serif">different data batches</text>
  <rect x="90" y="212.982503847338" width="466.6666" height="50.877200615574" rx="6.257626963204" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="249.614062185288" text-anchor="middle" font-size="16.923960709552" fill="var(--danger-accent)" font-family="Arial, sans-serif">Simple but memory-limited</text>
  <rect x="673.3333" y="40" width="566.6667" height="264.561399692213" rx="6.257626963204" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="90.877091843643" text-anchor="middle" font-size="22.00119063993" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Tensor Parallel</text>
  <text x="956.6666" y="141.754401231148" text-anchor="middle" font-size="18.61633592175" fill="var(--text-muted)" font-family="Arial, sans-serif">Split individual layers</text>
  <text x="956.6666" y="178.385959569098" text-anchor="middle" font-size="18.61633592175" fill="var(--text-muted)" font-family="Arial, sans-serif">across GPUs (within node)</text>
  <rect x="723.3332" y="212.982503847338" width="466.6666" height="50.877200615574" rx="6.257626963204" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="249.614062185288" text-anchor="middle" font-size="16.923960709552" fill="var(--danger-accent)" font-family="Arial, sans-serif">Attention heads distributed</text>
  <rect x="40" y="355.438600307787" width="566.6667" height="264.561399692213" rx="6.257626963204" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="406.315800923361" text-anchor="middle" font-size="22.00119063993" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Pipeline Parallel</text>
  <text x="323.3333" y="457.193001538935" text-anchor="middle" font-size="18.61633592175" fill="var(--text-muted)" font-family="Arial, sans-serif">Different layers on different</text>
  <text x="323.3333" y="493.824559876885" text-anchor="middle" font-size="18.61633592175" fill="var(--text-muted)" font-family="Arial, sans-serif">GPUs (across nodes)</text>
  <rect x="90" y="528.421104155125" width="466.6666" height="50.877200615574" rx="6.257626963204" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="565.052662493075" text-anchor="middle" font-size="16.923960709552" fill="var(--primary-accent)" font-family="Arial, sans-serif">Micro-batching for efficiency</text>
  <rect x="673.3333" y="355.438600307787" width="566.6667" height="264.561399692213" rx="6.257626963204" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="406.315800923361" text-anchor="middle" font-size="22.00119063993" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ZeRO (DeepSpeed)</text>
  <text x="956.6666" y="457.193001538935" text-anchor="middle" font-size="18.61633592175" fill="var(--text-muted)" font-family="Arial, sans-serif">Shard optimizer states,</text>
  <text x="956.6666" y="493.824559876885" text-anchor="middle" font-size="18.61633592175" fill="var(--text-muted)" font-family="Arial, sans-serif">gradients, and parameters</text>
  <rect x="723.3332" y="528.421104155125" width="466.6666" height="50.877200615574" rx="6.257626963204" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="565.052662493075" text-anchor="middle" font-size="16.923960709552" fill="var(--ok-accent)" font-family="Arial, sans-serif">Across all GPUs</text>
</svg>

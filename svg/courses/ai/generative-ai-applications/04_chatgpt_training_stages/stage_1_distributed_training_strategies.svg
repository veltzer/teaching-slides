<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="25.9635" font-weight="bold" fill="var(--text)">Distributed Training Strategies</text>
  <rect x="40" y="86.7742" width="566.6667" height="243.2258" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="133.5483" text-anchor="middle" font-size="21.0954" font-weight="bold" fill="var(--primary-accent)">Data Parallel</text>
  <text x="323.3333" y="180.3226" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)">Same model on each GPU,</text>
  <text x="323.3333" y="214" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)">different data batches</text>
  <rect x="90" y="245.8065" width="466.6666" height="46.7742" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="279.4839" text-anchor="middle" font-size="16.2272" fill="var(--danger-accent)">Simple but memory-limited</text>
  <rect x="673.3333" y="86.7742" width="566.6667" height="243.2258" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="133.5483" text-anchor="middle" font-size="21.0954" font-weight="bold" fill="var(--ok-accent)">Tensor Parallel</text>
  <text x="956.6666" y="180.3226" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)">Split individual layers</text>
  <text x="956.6666" y="214" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)">across GPUs (within node)</text>
  <rect x="723.3332" y="245.8065" width="466.6666" height="46.7742" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="279.4839" text-anchor="middle" font-size="16.2272" fill="var(--danger-accent)">Attention heads distributed</text>
  <rect x="40" y="376.7742" width="566.6667" height="243.2258" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="423.5484" text-anchor="middle" font-size="21.0954" font-weight="bold" fill="var(--danger-accent)">Pipeline Parallel</text>
  <text x="323.3333" y="470.3226" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)">Different layers on different</text>
  <text x="323.3333" y="504" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)">GPUs (across nodes)</text>
  <rect x="90" y="535.8065" width="466.6666" height="46.7742" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="569.4839" text-anchor="middle" font-size="16.2272" fill="var(--primary-accent)">Micro-batching for efficiency</text>
  <rect x="673.3333" y="376.7742" width="566.6667" height="243.2258" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="423.5484" text-anchor="middle" font-size="21.0954" font-weight="bold" fill="var(--primary-accent)">ZeRO (DeepSpeed)</text>
  <text x="956.6666" y="470.3226" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)">Shard optimizer states,</text>
  <text x="956.6666" y="504" text-anchor="middle" font-size="17.8499" fill="var(--text-muted)">gradients, and parameters</text>
  <rect x="723.3332" y="535.8065" width="466.6666" height="46.7742" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="569.4839" text-anchor="middle" font-size="16.2272" fill="var(--ok-accent)">Across all GPUs</text>
</svg>
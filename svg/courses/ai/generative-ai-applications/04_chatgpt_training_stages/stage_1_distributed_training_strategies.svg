<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="635.817" y="56.4706" text-anchor="middle" font-size="25.4327" font-weight="bold" fill="var(--text)">Distributed Training Strategies</text>
  <rect x="63.5817" y="103.5294" width="540.4445" height="244.7059" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="333.8039" y="150.5882" text-anchor="middle" font-size="20.6641" font-weight="bold" fill="var(--primary-accent)">Data Parallel</text>
  <text x="333.8039" y="197.6471" text-anchor="middle" font-size="17.485" fill="var(--text-muted)">Same model on each GPU,</text>
  <text x="333.8039" y="231.5294" text-anchor="middle" font-size="17.485" fill="var(--text-muted)">different data batches</text>
  <rect x="111.268" y="263.5295" width="445.0719" height="47.0588" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="333.8039" y="297.4118" text-anchor="middle" font-size="15.8954" fill="var(--danger-accent)">Simple but memory-limited</text>
  <rect x="667.6079" y="103.5294" width="540.4445" height="244.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="937.8301" y="150.5882" text-anchor="middle" font-size="20.6641" font-weight="bold" fill="var(--ok-accent)">Tensor Parallel</text>
  <text x="937.8301" y="197.6471" text-anchor="middle" font-size="17.485" fill="var(--text-muted)">Split individual layers</text>
  <text x="937.8301" y="231.5294" text-anchor="middle" font-size="17.485" fill="var(--text-muted)">across GPUs (within node)</text>
  <rect x="715.2941" y="263.5295" width="445.0719" height="47.0588" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="937.8301" y="297.4118" text-anchor="middle" font-size="15.8954" fill="var(--danger-accent)">Attention heads distributed</text>
  <rect x="63.5817" y="395.2941" width="540.4445" height="244.7059" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="333.8039" y="442.353" text-anchor="middle" font-size="20.6641" font-weight="bold" fill="var(--danger-accent)">Pipeline Parallel</text>
  <text x="333.8039" y="489.4118" text-anchor="middle" font-size="17.485" fill="var(--text-muted)">Different layers on different</text>
  <text x="333.8039" y="523.2941" text-anchor="middle" font-size="17.485" fill="var(--text-muted)">GPUs (across nodes)</text>
  <rect x="111.268" y="555.2942" width="445.0719" height="47.0588" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="333.8039" y="589.1765" text-anchor="middle" font-size="15.8954" fill="var(--primary-accent)">Micro-batching for efficiency</text>
  <rect x="667.6079" y="395.2941" width="540.4445" height="244.7059" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="937.8301" y="442.353" text-anchor="middle" font-size="20.6641" font-weight="bold" fill="var(--primary-accent)">ZeRO (DeepSpeed)</text>
  <text x="937.8301" y="489.4118" text-anchor="middle" font-size="17.485" fill="var(--text-muted)">Shard optimizer states,</text>
  <text x="937.8301" y="523.2941" text-anchor="middle" font-size="17.485" fill="var(--text-muted)">gradients, and parameters</text>
  <rect x="715.2941" y="555.2942" width="445.0719" height="47.0588" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="937.8301" y="589.1765" text-anchor="middle" font-size="15.8954" fill="var(--ok-accent)">Across all GPUs</text>
</svg>
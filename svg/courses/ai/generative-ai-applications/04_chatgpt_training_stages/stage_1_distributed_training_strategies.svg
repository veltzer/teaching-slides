<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="635.817" y="56.4706" text-anchor="middle" font-size="25.4327" font-weight="bold" fill="#333">Distributed Training Strategies</ns0:text>
  <ns0:rect x="63.5817" y="103.5294" width="540.4445" height="244.7059" rx="7.9477" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1791" />
  <ns0:text x="333.8039" y="150.5882" text-anchor="middle" font-size="20.6641" font-weight="bold" fill="#4a90e2">Data Parallel</ns0:text>
  <ns0:text x="333.8039" y="197.6471" text-anchor="middle" font-size="17.485" fill="#555">Same model on each GPU,</ns0:text>
  <ns0:text x="333.8039" y="231.5294" text-anchor="middle" font-size="17.485" fill="#555">different data batches</ns0:text>
  <ns0:rect x="111.268" y="263.5295" width="445.0719" height="47.0588" rx="4.7686" fill="#fff3cd" stroke="#ffc107" />
  <ns0:text x="333.8039" y="297.4118" text-anchor="middle" font-size="15.8954" fill="#856404">Simple but memory-limited</ns0:text>
  <ns0:rect x="667.6079" y="103.5294" width="540.4445" height="244.7059" rx="7.9477" fill="#d4edda" stroke="#28a745" stroke-width="3.1791" />
  <ns0:text x="937.8301" y="150.5882" text-anchor="middle" font-size="20.6641" font-weight="bold" fill="#28a745">Tensor Parallel</ns0:text>
  <ns0:text x="937.8301" y="197.6471" text-anchor="middle" font-size="17.485" fill="#555">Split individual layers</ns0:text>
  <ns0:text x="937.8301" y="231.5294" text-anchor="middle" font-size="17.485" fill="#555">across GPUs (within node)</ns0:text>
  <ns0:rect x="715.2941" y="263.5295" width="445.0719" height="47.0588" rx="4.7686" fill="#fff3cd" stroke="#ffc107" />
  <ns0:text x="937.8301" y="297.4118" text-anchor="middle" font-size="15.8954" fill="#856404">Attention heads distributed</ns0:text>
  <ns0:rect x="63.5817" y="395.2941" width="540.4445" height="244.7059" rx="7.9477" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1791" />
  <ns0:text x="333.8039" y="442.353" text-anchor="middle" font-size="20.6641" font-weight="bold" fill="#856404">Pipeline Parallel</ns0:text>
  <ns0:text x="333.8039" y="489.4118" text-anchor="middle" font-size="17.485" fill="#555">Different layers on different</ns0:text>
  <ns0:text x="333.8039" y="523.2941" text-anchor="middle" font-size="17.485" fill="#555">GPUs (across nodes)</ns0:text>
  <ns0:rect x="111.268" y="555.2942" width="445.0719" height="47.0588" rx="4.7686" fill="#e8f4f8" stroke="#4a90e2" />
  <ns0:text x="333.8039" y="589.1765" text-anchor="middle" font-size="15.8954" fill="#4a90e2">Micro-batching for efficiency</ns0:text>
  <ns0:rect x="667.6079" y="395.2941" width="540.4445" height="244.7059" rx="7.9477" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1791" />
  <ns0:text x="937.8301" y="442.353" text-anchor="middle" font-size="20.6641" font-weight="bold" fill="#4a90e2">ZeRO (DeepSpeed)</ns0:text>
  <ns0:text x="937.8301" y="489.4118" text-anchor="middle" font-size="17.485" fill="#555">Shard optimizer states,</ns0:text>
  <ns0:text x="937.8301" y="523.2941" text-anchor="middle" font-size="17.485" fill="#555">gradients, and parameters</ns0:text>
  <ns0:rect x="715.2941" y="555.2942" width="445.0719" height="47.0588" rx="4.7686" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="937.8301" y="589.1765" text-anchor="middle" font-size="15.8954" fill="#28a745">Across all GPUs</ns0:text>
</ns0:svg>
<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Distributed Training Strategies</text>
  <!-- Data Parallel -->
  <rect x="40" y="55" width="340" height="130" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="210" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Data Parallel</text>
  <text x="210" y="105" text-anchor="middle" font-size="11" fill="#555">Same model on each GPU,</text>
  <text x="210" y="123" text-anchor="middle" font-size="11" fill="#555">different data batches</text>
  <rect x="70" y="140" width="280" height="25" rx="3" fill="#fff3cd" stroke="#ffc107"/>
  <text x="210" y="158" text-anchor="middle" font-size="10" fill="#856404">Simple but memory-limited</text>
  <!-- Tensor Parallel -->
  <rect x="420" y="55" width="340" height="130" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="590" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Tensor Parallel</text>
  <text x="590" y="105" text-anchor="middle" font-size="11" fill="#555">Split individual layers</text>
  <text x="590" y="123" text-anchor="middle" font-size="11" fill="#555">across GPUs (within node)</text>
  <rect x="450" y="140" width="280" height="25" rx="3" fill="#fff3cd" stroke="#ffc107"/>
  <text x="590" y="158" text-anchor="middle" font-size="10" fill="#856404">Attention heads distributed</text>
  <!-- Pipeline Parallel -->
  <rect x="40" y="210" width="340" height="130" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="210" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">Pipeline Parallel</text>
  <text x="210" y="260" text-anchor="middle" font-size="11" fill="#555">Different layers on different</text>
  <text x="210" y="278" text-anchor="middle" font-size="11" fill="#555">GPUs (across nodes)</text>
  <rect x="70" y="295" width="280" height="25" rx="3" fill="#e8f4f8" stroke="#4a90e2"/>
  <text x="210" y="313" text-anchor="middle" font-size="10" fill="#4a90e2">Micro-batching for efficiency</text>
  <!-- ZeRO -->
  <rect x="420" y="210" width="340" height="130" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="590" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">ZeRO (DeepSpeed)</text>
  <text x="590" y="260" text-anchor="middle" font-size="11" fill="#555">Shard optimizer states,</text>
  <text x="590" y="278" text-anchor="middle" font-size="11" fill="#555">gradients, and parameters</text>
  <rect x="450" y="295" width="280" height="25" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="590" y="313" text-anchor="middle" font-size="10" fill="#28a745">Across all GPUs</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.6585" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Stage 1: What the Model Learns</text>
  <rect x="40" y="84.6153" width="333.3333" height="53.5385" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="120.3076" text-anchor="middle" font-size="19.9938" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Tokens Trained</text>
  <rect x="406.6667" y="84.6153" width="466.6667" height="53.5385" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="120.3076" text-anchor="middle" font-size="19.9938" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Capabilities Acquired</text>
  <rect x="906.6667" y="84.6153" width="333.3333" height="53.5385" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1073.3333" y="120.3076" text-anchor="middle" font-size="19.9938" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Human Analogy</text>
  <rect x="40" y="155.9999" width="333.3333" height="62.4615" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="197.0461" text-anchor="middle" font-size="18.3277" fill="var(--text)" font-family="Arial, sans-serif">10B</text>
  <rect x="406.6667" y="155.9999" width="466.6667" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="197.0461" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)" font-family="Arial, sans-serif">Basic grammar, common words</text>
  <rect x="906.6667" y="155.9999" width="333.3333" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1073.3333" y="197.0461" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)" font-family="Arial, sans-serif">Learning to speak</text>
  <rect x="40" y="236.3077" width="333.3333" height="62.4615" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="277.3539" text-anchor="middle" font-size="18.3277" fill="var(--text)" font-family="Arial, sans-serif">50B</text>
  <rect x="406.6667" y="236.3077" width="466.6667" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="277.3539" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)" font-family="Arial, sans-serif">Sentence structure, simple facts</text>
  <rect x="906.6667" y="236.3077" width="333.3333" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1073.3333" y="277.3539" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)" font-family="Arial, sans-serif">-</text>
  <rect x="40" y="316.6154" width="333.3333" height="62.4615" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="357.6615" text-anchor="middle" font-size="18.3277" fill="var(--text)" font-family="Arial, sans-serif">200B</text>
  <rect x="406.6667" y="316.6154" width="466.6667" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="357.6615" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)" font-family="Arial, sans-serif">Paragraph coherence, basic reasoning</text>
  <rect x="906.6667" y="316.6154" width="333.3333" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1073.3333" y="357.6615" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)" font-family="Arial, sans-serif">Elementary school</text>
  <rect x="40" y="396.9231" width="333.3333" height="62.4615" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="437.9693" text-anchor="middle" font-size="18.3277" fill="var(--text)" font-family="Arial, sans-serif">500B</text>
  <rect x="406.6667" y="396.9231" width="466.6667" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="437.9693" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)" font-family="Arial, sans-serif">World knowledge, multi-step logic</text>
  <rect x="906.6667" y="396.9231" width="333.3333" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1073.3333" y="437.9693" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)" font-family="Arial, sans-serif">-</text>
  <rect x="40" y="477.2308" width="333.3333" height="62.4615" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="518.2769" text-anchor="middle" font-size="18.3277" fill="var(--text)" font-family="Arial, sans-serif">1T</text>
  <rect x="406.6667" y="477.2308" width="466.6667" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="518.2769" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)" font-family="Arial, sans-serif">Nuanced language, code generation</text>
  <rect x="906.6667" y="477.2308" width="333.3333" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1073.3333" y="518.2769" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)" font-family="Arial, sans-serif">College education</text>
  <rect x="40" y="557.5385" width="333.3333" height="62.4615" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="598.5846" text-anchor="middle" font-size="18.3277" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2T+</text>
  <rect x="406.6667" y="557.5385" width="466.6667" height="62.4615" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="598.5846" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)" font-family="Arial, sans-serif">Complex reasoning, few-shot learning</text>
  <rect x="906.6667" y="557.5385" width="333.3333" height="62.4615" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1073.3333" y="598.5846" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)" font-family="Arial, sans-serif">Expert-level matching</text>
</svg>
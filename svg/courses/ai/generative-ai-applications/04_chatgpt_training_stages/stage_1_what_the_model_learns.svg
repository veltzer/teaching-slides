<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.6585" font-weight="bold" fill="var(--text)">Stage 1: What the Model Learns</text>
  <rect x="40" y="84.6153" width="333.3333" height="53.5385" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="120.3076" text-anchor="middle" font-size="19.9938" font-weight="bold" fill="var(--bg)">Tokens Trained</text>
  <rect x="406.6667" y="84.6153" width="466.6667" height="53.5385" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="120.3076" text-anchor="middle" font-size="19.9938" font-weight="bold" fill="var(--bg)">Capabilities Acquired</text>
  <rect x="906.6667" y="84.6153" width="333.3333" height="53.5385" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1073.3333" y="120.3076" text-anchor="middle" font-size="19.9938" font-weight="bold" fill="var(--bg)">Human Analogy</text>
  <rect x="40" y="155.9999" width="333.3333" height="62.4615" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="197.0461" text-anchor="middle" font-size="18.3277" fill="var(--text)">10B</text>
  <rect x="406.6667" y="155.9999" width="466.6667" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="197.0461" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)">Basic grammar, common words</text>
  <rect x="906.6667" y="155.9999" width="333.3333" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1073.3333" y="197.0461" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)">Learning to speak</text>
  <rect x="40" y="236.3077" width="333.3333" height="62.4615" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="277.3539" text-anchor="middle" font-size="18.3277" fill="var(--text)">50B</text>
  <rect x="406.6667" y="236.3077" width="466.6667" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="277.3539" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)">Sentence structure, simple facts</text>
  <rect x="906.6667" y="236.3077" width="333.3333" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1073.3333" y="277.3539" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)">-</text>
  <rect x="40" y="316.6154" width="333.3333" height="62.4615" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="357.6615" text-anchor="middle" font-size="18.3277" fill="var(--text)">200B</text>
  <rect x="406.6667" y="316.6154" width="466.6667" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="357.6615" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)">Paragraph coherence, basic reasoning</text>
  <rect x="906.6667" y="316.6154" width="333.3333" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1073.3333" y="357.6615" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)">Elementary school</text>
  <rect x="40" y="396.9231" width="333.3333" height="62.4615" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="437.9693" text-anchor="middle" font-size="18.3277" fill="var(--text)">500B</text>
  <rect x="406.6667" y="396.9231" width="466.6667" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="437.9693" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)">World knowledge, multi-step logic</text>
  <rect x="906.6667" y="396.9231" width="333.3333" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1073.3333" y="437.9693" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)">-</text>
  <rect x="40" y="477.2308" width="333.3333" height="62.4615" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="518.2769" text-anchor="middle" font-size="18.3277" fill="var(--text)">1T</text>
  <rect x="406.6667" y="477.2308" width="466.6667" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="518.2769" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)">Nuanced language, code generation</text>
  <rect x="906.6667" y="477.2308" width="333.3333" height="62.4615" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1073.3333" y="518.2769" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)">College education</text>
  <rect x="40" y="557.5385" width="333.3333" height="62.4615" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="598.5846" text-anchor="middle" font-size="18.3277" font-weight="bold" fill="var(--ok-accent)">2T+</text>
  <rect x="406.6667" y="557.5385" width="466.6667" height="62.4615" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="598.5846" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)">Complex reasoning, few-shot learning</text>
  <rect x="906.6667" y="557.5385" width="333.3333" height="62.4615" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1073.3333" y="598.5846" text-anchor="middle" font-size="18.3277" fill="var(--text-muted)">Expert-level matching</text>
</svg>
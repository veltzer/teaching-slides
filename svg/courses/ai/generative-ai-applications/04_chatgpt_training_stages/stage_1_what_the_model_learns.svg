  <text x="1073.3333" y="78.666652222224" text-anchor="middle" font-size="20.810205185578" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Human Analogy</text>
  <rect x="40" y="117.333304444449" width="333.3333" height="67.666614305564" rx="6.2449975049" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>

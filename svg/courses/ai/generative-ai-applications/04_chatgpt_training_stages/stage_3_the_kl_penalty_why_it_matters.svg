<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="628.7719" y="50.5263" text-anchor="middle" font-size="25.1509" font-weight="bold" fill="#333">The KL Penalty: Why It Matters</ns0:text>
  <ns0:rect x="47.1579" y="92.6316" width="565.8947" height="320" rx="7.8596" fill="#f8d7da" stroke="#dc3545" stroke-width="3.1439" />
  <ns0:text x="330.1052" y="134.7369" text-anchor="middle" font-size="22.007" font-weight="bold" fill="#dc3545">Without KL Penalty</ns0:text>
  <ns0:text x="330.1052" y="176.8421" text-anchor="middle" font-size="17.2912" fill="#555">Model exploits reward model weaknesses</ns0:text>
  <ns0:rect x="78.5965" y="202.1053" width="503.0175" height="117.8947" rx="7.8596" fill="#fff" stroke="#dc3545" stroke-width="1.5719" />
  <ns0:text x="330.1052" y="235.7895" text-anchor="middle" font-size="15.7193" fill="#333">Prompt: "Write a poem about nature"</ns0:text>
  <ns0:text x="330.1052" y="266.1052" text-anchor="middle" font-size="15.7193" fill="#dc3545">"AMAZING INCREDIBLE WONDERFUL</ns0:text>
  <ns0:text x="330.1052" y="289.6842" text-anchor="middle" font-size="15.7193" fill="#dc3545">NATURE IS THE BEST!!!!"</ns0:text>
  <ns0:rect x="78.5965" y="336.842" width="503.0175" height="50.5263" rx="4.7158" fill="#f8d7da" stroke="#dc3545" />
  <ns0:text x="330.1052" y="370.5263" text-anchor="middle" font-size="15.7193" fill="#dc3545">High reward score but garbage output</ns0:text>
  <ns0:rect x="644.4912" y="92.6316" width="565.8947" height="320" rx="7.8596" fill="#d4edda" stroke="#28a745" stroke-width="3.1439" />
  <ns0:text x="927.4386" y="134.7369" text-anchor="middle" font-size="22.007" font-weight="bold" fill="#28a745">With KL Penalty</ns0:text>
  <ns0:text x="927.4386" y="176.8421" text-anchor="middle" font-size="17.2912" fill="#555">Model stays close to SFT model</ns0:text>
  <ns0:text x="927.4386" y="218.9473" text-anchor="middle" font-size="17.2912" fill="#555">while improving on preferences</ns0:text>
  <ns0:rect x="675.9298" y="252.6316" width="503.0175" height="134.7369" rx="7.8596" fill="#fff" stroke="#28a745" stroke-width="1.5719" />
  <ns0:text x="927.4386" y="294.7368" text-anchor="middle" font-size="15.7193" fill="#333">KL = policy(x) * log(policy(x)/ref(x))</ns0:text>
  <ns0:text x="927.4386" y="336.842" text-anchor="middle" font-size="15.7193" fill="#28a745">Sweet spot: KL ~ 5-15 nats</ns0:text>
  <ns0:text x="927.4386" y="370.5263" text-anchor="middle" font-size="15.7193" fill="#555">Balance learning and stability</ns0:text>
  <ns0:rect x="157.193" y="454.7368" width="943.1579" height="101.0526" rx="7.8596" fill="#fff3cd" stroke="#ffc107" stroke-width="2.3579" />
  <ns0:text x="628.7719" y="496.8421" text-anchor="middle" font-size="18.8632" fill="#856404">KL too high: model is drifting -&gt; increase penalty</ns0:text>
  <ns0:text x="628.7719" y="530.5263" text-anchor="middle" font-size="18.8632" fill="#856404">KL too low: model isn't learning -&gt; decrease penalty</ns0:text>
  <ns0:rect x="314.386" y="589.4737" width="628.7719" height="50.5263" rx="23.5789" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5719" />
  <ns0:rect x="314.386" y="589.4737" width="209.0667" height="50.5263" rx="23.5789" fill="#dc3545" opacity="0.3" />
  <ns0:rect x="523.4526" y="589.4737" width="210.6386" height="50.5263" fill="#28a745" opacity="0.3" />
  <ns0:rect x="734.0912" y="589.4737" width="209.0667" height="50.5263" rx="23.5789" fill="#dc3545" opacity="0.3" />
  <ns0:text x="418.1333" y="623.1579" text-anchor="middle" font-size="15.7193" fill="#dc3545">Too low</ns0:text>
  <ns0:text x="628.7719" y="623.1579" text-anchor="middle" font-size="15.7193" font-weight="bold" fill="#28a745">Sweet spot</ns0:text>
  <ns0:text x="839.4105" y="623.1579" text-anchor="middle" font-size="15.7193" fill="#dc3545">Too high</ns0:text>
</ns0:svg>
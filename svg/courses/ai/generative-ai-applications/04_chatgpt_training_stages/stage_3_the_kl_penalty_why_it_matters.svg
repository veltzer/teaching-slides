<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.3392" font-weight="bold" fill="var(--text)">The KL Penalty: Why It Matters</text>
  <rect x="40" y="81.4286" width="583.7838" height="314.8571" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="331.8918" y="122.8572" text-anchor="middle" font-size="22.1718" font-weight="bold" fill="var(--danger-accent)">Without KL Penalty</text>
  <text x="331.8918" y="164.2857" text-anchor="middle" font-size="17.4207" fill="var(--text-muted)">Model exploits reward model weaknesses</text>
  <rect x="72.4324" y="189.1429" width="518.9189" height="116" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.5719" />
  <text x="331.8918" y="222.2858" text-anchor="middle" font-size="15.837" fill="var(--text)">Prompt: "Write a poem about nature"</text>
  <text x="331.8918" y="252.1142" text-anchor="middle" font-size="15.837" fill="var(--danger-accent)">"AMAZING INCREDIBLE WONDERFUL</text>
  <text x="331.8918" y="275.3143" text-anchor="middle" font-size="15.837" fill="var(--danger-accent)">NATURE IS THE BEST!!!!"</text>
  <rect x="72.4324" y="321.7142" width="518.9189" height="49.7143" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="331.8918" y="354.8571" text-anchor="middle" font-size="15.837" fill="var(--danger-accent)">High reward score but garbage output</text>
  <rect x="656.2162" y="81.4286" width="583.7838" height="314.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="948.1082" y="122.8572" text-anchor="middle" font-size="22.1718" font-weight="bold" fill="var(--ok-accent)">With KL Penalty</text>
  <text x="948.1082" y="164.2857" text-anchor="middle" font-size="17.4207" fill="var(--text-muted)">Model stays close to SFT model</text>
  <text x="948.1082" y="205.7142" text-anchor="middle" font-size="17.4207" fill="var(--text-muted)">while improving on preferences</text>
  <rect x="688.6487" y="238.8572" width="518.9189" height="132.5715" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5719" />
  <text x="948.1082" y="280.2857" text-anchor="middle" font-size="15.837" fill="var(--text)">KL = policy(x) * log(policy(x)/ref(x))</text>
  <text x="948.1082" y="321.7142" text-anchor="middle" font-size="15.837" fill="var(--ok-accent)">Sweet spot: KL ~ 5-15 nats</text>
  <text x="948.1082" y="354.8571" text-anchor="middle" font-size="15.837" fill="var(--text-muted)">Balance learning and stability</text>
  <rect x="153.5135" y="437.7142" width="972.973" height="99.4285" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="479.1429" text-anchor="middle" font-size="19.0045" fill="var(--danger-accent)">KL too high: model is drifting -&gt; increase penalty</text>
  <text x="640" y="512.2857" text-anchor="middle" font-size="19.0045" fill="var(--danger-accent)">KL too low: model isn't learning -&gt; decrease penalty</text>
  <rect x="315.6757" y="570.2857" width="648.6487" height="49.7143" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="315.6757" y="570.2857" width="215.6757" height="49.7143" rx="6" fill="var(--danger-fill)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="531.3513" y="570.2857" width="217.2973" height="49.7143" fill="var(--ok-fill)" opacity="0.3" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="748.6487" y="570.2857" width="215.6757" height="49.7143" rx="6" fill="var(--danger-fill)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="422.7027" y="603.4286" text-anchor="middle" font-size="15.837" fill="var(--danger-accent)">Too low</text>
  <text x="640" y="603.4286" text-anchor="middle" font-size="15.837" font-weight="bold" fill="var(--ok-accent)">Sweet spot</text>
  <text x="857.2973" y="603.4286" text-anchor="middle" font-size="15.837" fill="var(--danger-accent)">Too high</text>
</svg>
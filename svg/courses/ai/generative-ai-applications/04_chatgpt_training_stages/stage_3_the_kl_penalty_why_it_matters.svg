</defs>
  <ns0:text x="628.7719" y="50.5263" text-anchor="middle" font-size="25.1509" font-weight="bold" fill="var(--text-dark)">The KL Penalty: Why It Matters</ns0:text>
  <ns0:rect x="47.1579" y="92.6316" width="565.8947" height="320" rx="7.8596" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.1439" />
  <ns0:text x="330.1052" y="134.7369" text-anchor="middle" font-size="22.007" font-weight="bold" fill="var(--danger-bright)">Without KL Penalty</ns0:text>
  <ns0:text x="330.1052" y="176.8421" text-anchor="middle" font-size="17.2912" fill="var(--text-muted)">Model exploits reward model weaknesses</ns0:text>
  <ns0:rect x="78.5965" y="202.1053" width="503.0175" height="117.8947" rx="7.8596" fill="var(--bg)" stroke="var(--danger-bright)" stroke-width="1.5719" />
  <ns0:text x="330.1052" y="235.7895" text-anchor="middle" font-size="15.7193" fill="var(--text-dark)">Prompt: "Write a poem about nature"</ns0:text>
  <ns0:text x="330.1052" y="266.1052" text-anchor="middle" font-size="15.7193" fill="var(--danger-bright)">"AMAZING INCREDIBLE WONDERFUL</ns0:text>
  <ns0:text x="330.1052" y="289.6842" text-anchor="middle" font-size="15.7193" fill="var(--danger-bright)">NATURE IS THE BEST!!!!"</ns0:text>
  <ns0:rect x="78.5965" y="336.842" width="503.0175" height="50.5263" rx="4.7158" fill="var(--danger-pale2)" stroke="var(--danger-bright)" />
  <ns0:text x="330.1052" y="370.5263" text-anchor="middle" font-size="15.7193" fill="var(--danger-bright)">High reward score but garbage output</ns0:text>
  <ns0:rect x="644.4912" y="92.6316" width="565.8947" height="320" rx="7.8596" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.1439" />
  <ns0:text x="927.4386" y="134.7369" text-anchor="middle" font-size="22.007" font-weight="bold" fill="var(--ok-bright)">With KL Penalty</ns0:text>
  <ns0:text x="927.4386" y="176.8421" text-anchor="middle" font-size="17.2912" fill="var(--text-muted)">Model stays close to SFT model</ns0:text>
  <ns0:text x="927.4386" y="218.9473" text-anchor="middle" font-size="17.2912" fill="var(--text-muted)">while improving on preferences</ns0:text>
  <ns0:rect x="675.9298" y="252.6316" width="503.0175" height="134.7369" rx="7.8596" fill="var(--bg)" stroke="var(--ok-bright)" stroke-width="1.5719" />
  <ns0:text x="927.4386" y="294.7368" text-anchor="middle" font-size="15.7193" fill="var(--text-dark)">KL = policy(x) * log(policy(x)/ref(x))</ns0:text>
  <ns0:text x="927.4386" y="336.842" text-anchor="middle" font-size="15.7193" fill="var(--ok-bright)">Sweet spot: KL ~ 5-15 nats</ns0:text>
  <ns0:text x="927.4386" y="370.5263" text-anchor="middle" font-size="15.7193" fill="var(--text-muted)">Balance learning and stability</ns0:text>
  <ns0:rect x="157.193" y="454.7368" width="943.1579" height="101.0526" rx="7.8596" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.3579" />
  <ns0:text x="628.7719" y="496.8421" text-anchor="middle" font-size="18.8632" fill="var(--danger-deeper)">KL too high: model is drifting -&gt; increase penalty</ns0:text>
  <ns0:text x="628.7719" y="530.5263" text-anchor="middle" font-size="18.8632" fill="var(--danger-deeper)">KL too low: model isn't learning -&gt; decrease penalty</ns0:text>
  <ns0:rect x="314.386" y="589.4737" width="628.7719" height="50.5263" rx="23.5789" fill="var(--surface-light)" stroke="var(--border)" stroke-width="1.5719" />
  <ns0:rect x="314.386" y="589.4737" width="209.0667" height="50.5263" rx="23.5789" fill="var(--danger-bright)" opacity="0.3" />
  <ns0:rect x="523.4526" y="589.4737" width="210.6386" height="50.5263" fill="var(--ok-bright)" opacity="0.3" />
  <ns0:rect x="734.0912" y="589.4737" width="209.0667" height="50.5263" rx="23.5789" fill="var(--danger-bright)" opacity="0.3" />
  <ns0:text x="418.1333" y="623.1579" text-anchor="middle" font-size="15.7193" fill="var(--danger-bright)">Too low</ns0:text>
  <ns0:text x="628.7719" y="623.1579" text-anchor="middle" font-size="15.7193" font-weight="bold" fill="var(--ok-bright)">Sweet spot</ns0:text>
  <ns0:text x="839.4105" y="623.1579" text-anchor="middle" font-size="15.7193" fill="var(--danger-bright)">Too high</ns0:text>

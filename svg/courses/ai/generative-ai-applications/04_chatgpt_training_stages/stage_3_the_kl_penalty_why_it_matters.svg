<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="628.7719" y="50.5263" text-anchor="middle" font-size="25.1509" font-weight="bold" fill="var(--text)">The KL Penalty: Why It Matters</text>
  <rect x="47.1579" y="92.6316" width="565.8947" height="320" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="330.1052" y="134.7369" text-anchor="middle" font-size="22.007" font-weight="bold" fill="var(--danger-accent)">Without KL Penalty</text>
  <text x="330.1052" y="176.8421" text-anchor="middle" font-size="17.2912" fill="var(--text-muted)">Model exploits reward model weaknesses</text>
  <rect x="78.5965" y="202.1053" width="503.0175" height="117.8947" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.5719" />
  <text x="330.1052" y="235.7895" text-anchor="middle" font-size="15.7193" fill="var(--text)">Prompt: "Write a poem about nature"</text>
  <text x="330.1052" y="266.1052" text-anchor="middle" font-size="15.7193" fill="var(--danger-accent)">"AMAZING INCREDIBLE WONDERFUL</text>
  <text x="330.1052" y="289.6842" text-anchor="middle" font-size="15.7193" fill="var(--danger-accent)">NATURE IS THE BEST!!!!"</text>
  <rect x="78.5965" y="336.842" width="503.0175" height="50.5263" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="330.1052" y="370.5263" text-anchor="middle" font-size="15.7193" fill="var(--danger-accent)">High reward score but garbage output</text>
  <rect x="644.4912" y="92.6316" width="565.8947" height="320" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="927.4386" y="134.7369" text-anchor="middle" font-size="22.007" font-weight="bold" fill="var(--ok-accent)">With KL Penalty</text>
  <text x="927.4386" y="176.8421" text-anchor="middle" font-size="17.2912" fill="var(--text-muted)">Model stays close to SFT model</text>
  <text x="927.4386" y="218.9473" text-anchor="middle" font-size="17.2912" fill="var(--text-muted)">while improving on preferences</text>
  <rect x="675.9298" y="252.6316" width="503.0175" height="134.7369" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5719" />
  <text x="927.4386" y="294.7368" text-anchor="middle" font-size="15.7193" fill="var(--text)">KL = policy(x) * log(policy(x)/ref(x))</text>
  <text x="927.4386" y="336.842" text-anchor="middle" font-size="15.7193" fill="var(--ok-accent)">Sweet spot: KL ~ 5-15 nats</text>
  <text x="927.4386" y="370.5263" text-anchor="middle" font-size="15.7193" fill="var(--text-muted)">Balance learning and stability</text>
  <rect x="157.193" y="454.7368" width="943.1579" height="101.0526" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="628.7719" y="496.8421" text-anchor="middle" font-size="18.8632" fill="var(--danger-accent)">KL too high: model is drifting -&gt; increase penalty</text>
  <text x="628.7719" y="530.5263" text-anchor="middle" font-size="18.8632" fill="var(--danger-accent)">KL too low: model isn't learning -&gt; decrease penalty</text>
  <rect x="314.386" y="589.4737" width="628.7719" height="50.5263" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="314.386" y="589.4737" width="209.0667" height="50.5263" rx="6" fill="var(--danger-fill)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="523.4526" y="589.4737" width="210.6386" height="50.5263" fill="var(--ok-fill)" opacity="0.3" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="734.0912" y="589.4737" width="209.0667" height="50.5263" rx="6" fill="var(--danger-fill)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="418.1333" y="623.1579" text-anchor="middle" font-size="15.7193" fill="var(--danger-accent)">Too low</text>
  <text x="628.7719" y="623.1579" text-anchor="middle" font-size="15.7193" font-weight="bold" fill="var(--ok-accent)">Sweet spot</text>
  <text x="839.4105" y="623.1579" text-anchor="middle" font-size="15.7193" fill="var(--danger-accent)">Too high</text>
</svg>
<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Stage 1: Training Dynamics - Loss Curve</text>
  <!-- Axes -->
  <line x1="100" y1="60" x2="100" y2="310" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="310" x2="720" y2="310" stroke="#333" stroke-width="2"/>
  <text x="50" y="190" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90, 50, 190)">Loss</text>
  <text x="400" y="345" text-anchor="middle" font-size="13" fill="#333">Tokens processed</text>
  <!-- Y labels -->
  <text x="90" y="70" text-anchor="end" font-size="10" fill="#666">4.0</text>
  <text x="90" y="130" text-anchor="end" font-size="10" fill="#666">3.0</text>
  <text x="90" y="190" text-anchor="end" font-size="10" fill="#666">2.0</text>
  <text x="90" y="250" text-anchor="end" font-size="10" fill="#666">1.5</text>
  <!-- X labels -->
  <text x="200" y="330" text-anchor="middle" font-size="10" fill="#666">200B</text>
  <text x="320" y="330" text-anchor="middle" font-size="10" fill="#666">400B</text>
  <text x="440" y="330" text-anchor="middle" font-size="10" fill="#666">600B</text>
  <text x="560" y="330" text-anchor="middle" font-size="10" fill="#666">800B</text>
  <text x="680" y="330" text-anchor="middle" font-size="10" fill="#666">1T+</text>
  <!-- Curve -->
  <path d="M110,70 Q150,100 200,140 Q260,180 320,210 Q400,240 480,260 Q560,275 640,285 Q690,290 710,292" fill="none" stroke="#4a90e2" stroke-width="3"/>
  <!-- Loss spike -->
  <path d="M380,230 L385,200 L390,235" fill="none" stroke="#dc3545" stroke-width="2"/>
  <text x="410" y="195" font-size="10" fill="#dc3545">spike</text>
  <!-- Key observations -->
  <rect x="100" y="365" width="300" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="250" y="385" text-anchor="middle" font-size="11" fill="#333">Rapid initial improvement</text>
  <rect x="410" y="365" width="300" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="560" y="385" text-anchor="middle" font-size="11" fill="#333">Gradual diminishing returns</text>
  <rect x="100" y="405" width="300" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="250" y="425" text-anchor="middle" font-size="11" fill="#333">Occasional loss spikes</text>
  <rect x="410" y="405" width="300" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="560" y="425" text-anchor="middle" font-size="11" fill="#333">No clear convergence</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="59.0477" y1="40" x2="59.0477" y2="426.666666666667" stroke="var(--text)" stroke-width="0.6929"/>
  <line x1="59.0477" y1="426.666666666667" x2="1240" y2="426.666666666667" stroke="var(--text)" stroke-width="0.6929"/>
  <text x="40" y="269.136" text-anchor="middle" font-size="21.1611" fill="var(--text)" transform="rotate(-90, 50, 190)" font-family="Arial, sans-serif">Loss</text>
  <text x="630.4763" y="480.800060480015" text-anchor="middle" font-size="22.678610142381" fill="var(--text)" font-family="Arial, sans-serif">Tokens processed</text>
  <text x="40" y="55.466683946671" text-anchor="end" font-size="22.678610142381" fill="var(--text-muted)" font-family="Arial, sans-serif">4.0</text>
  <text x="40" y="148.26667962667" text-anchor="end" font-size="22.678610142381" fill="var(--text-muted)" font-family="Arial, sans-serif">3.0</text>
  <text x="40" y="241.066783306696" text-anchor="end" font-size="22.678610142381" fill="var(--text-muted)" font-family="Arial, sans-serif">2.0</text>
  <text x="40" y="333.86656298664" text-anchor="end" font-size="22.678610142381" fill="var(--text-muted)" font-family="Arial, sans-serif">1.5</text>
  <text x="249.5239" y="457.600142560036" text-anchor="middle" font-size="22.678610142381" fill="var(--text-muted)" font-family="Arial, sans-serif">200B</text>
  <text x="478.0954" y="457.600142560036" text-anchor="middle" font-size="22.678610142381" fill="var(--text-muted)" font-family="Arial, sans-serif">400B</text>
  <text x="706.6667" y="457.600142560036" text-anchor="middle" font-size="22.678610142381" fill="var(--text-muted)" font-family="Arial, sans-serif">600B</text>
  <text x="935.2379" y="457.600142560036" text-anchor="middle" font-size="22.678610142381" fill="var(--text-muted)" font-family="Arial, sans-serif">800B</text>
  <text x="1163.8094" y="457.600142560036" text-anchor="middle" font-size="22.678610142381" fill="var(--text-muted)" font-family="Arial, sans-serif">1T+</text>
  <path d="M 78.0952 55.466683946671 Q 154.2858 101.866735786684 249.5239 163.733363573341 Q 363.8094 225.59988335997 478.0954 272.000043200011 Q 630.4763 318.399987039997 782.8573 349.333462933366 Q 935.2379 372.533272853318 1087.6191 388.000172800044 Q 1182.8571 395.733622773407 1220.9523 398.826851562714" fill="none" stroke="var(--primary-border)" stroke-width="1.0394"/>
  <path d="M 592.381 302.933303093326 L 601.9048 256.53335925334 L 611.4287 310.666969066744" fill="none" stroke="var(--danger-border)" stroke-width="0.6929"/>
  <text x="649.5239" y="248.799909279977" font-size="22.678610142381" fill="var(--danger-accent)" font-family="Arial, sans-serif">spike</text>
  <rect x="59.0477" y="511.733536373385" width="571.4284" height="46.399943839986" rx="6.235383702797" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="344.7619" y="542.6667962667" text-anchor="middle" font-size="22.678610142381" fill="var(--text)" font-family="Arial, sans-serif">Rapid initial improvement</text>
  <rect x="649.5239" y="511.733536373385" width="571.4284" height="46.399943839986" rx="6.235383702797" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.2379" y="542.6667962667" text-anchor="middle" font-size="22.678610142381" fill="var(--text)" font-family="Arial, sans-serif">Gradual diminishing returns</text>
  <rect x="59.0477" y="573.600056160014" width="571.4284" height="46.399943839986" rx="6.235383702797" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="344.7619" y="604.533532053384" text-anchor="middle" font-size="22.678610142381" fill="var(--text)" font-family="Arial, sans-serif">Occasional loss spikes</text>
  <rect x="649.5239" y="573.600056160014" width="571.4284" height="46.399943839986" rx="6.235383702797" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.2379" y="604.533532053384" text-anchor="middle" font-size="22.678610142381" fill="var(--text)" font-family="Arial, sans-serif">No clear convergence</text>
</svg>

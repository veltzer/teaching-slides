  <text x="176.0051" y="80.2127" text-anchor="end" font-size="10" fill="var(--text-muted)">4.0</text>
  <text x="176.0051" y="126.1359" text-anchor="end" font-size="10" fill="var(--text-muted)">3.0</text>
  <text x="176.0051" y="172.0592" text-anchor="end" font-size="10" fill="var(--text-muted)">2.0</text>
  <text x="176.0051" y="217.9823" text-anchor="end" font-size="10" fill="var(--text-muted)">1.5</text>
  <text x="258.3268" y="279.2134" text-anchor="middle" font-size="10" fill="var(--text-muted)">200B</text>
  <text x="348.1323" y="279.2134" text-anchor="middle" font-size="10" fill="var(--text-muted)">400B</text>
  <text x="437.9377" y="279.2134" text-anchor="middle" font-size="10" fill="var(--text-muted)">600B</text>
  <text x="527.7431" y="279.2134" text-anchor="middle" font-size="10" fill="var(--text-muted)">800B</text>
  <text x="617.5486" y="279.2134" text-anchor="middle" font-size="10" fill="var(--text-muted)">1T+</text>
  <path d="M 190.9727 80.2127 Q 220.9079 103.1743 258.3268 133.7898 Q 303.2295 164.4052 348.1323 187.3669 Q 408.0026 210.3285 467.8729 225.6363 Q 527.7431 237.117 587.6135 244.771 Q 625.0324 248.598 640 250.1287" fill="none" stroke="var(--primary-border)" stroke-width="1.0394" />
  <path d="M 393.035 202.6746 L 396.7769 179.713 L 400.5188 206.5017" fill="none" stroke="var(--danger-border)" stroke-width="0.6929" />
  <text x="415.4864" y="175.886" font-size="10" fill="var(--danger-accent)">spike</text>
  <rect x="183.4889" y="306.002" width="224.5136" height="22.9616" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.2399" />
  <text x="295.7457" y="321.3097" text-anchor="middle" font-size="10" fill="var(--text)">Rapid initial improvement</text>
  <rect x="415.4864" y="306.002" width="224.5136" height="22.9616" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.2399" />
  <text x="527.7431" y="321.3097" text-anchor="middle" font-size="10" fill="var(--text)">Gradual diminishing returns</text>
  <rect x="183.4889" y="336.6174" width="224.5136" height="22.9616" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.2399" />
  <text x="295.7457" y="351.9252" text-anchor="middle" font-size="10" fill="var(--text)">Occasional loss spikes</text>
  <rect x="415.4864" y="336.6174" width="224.5136" height="22.9616" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.2399" />
  <text x="527.7431" y="351.9252" text-anchor="middle" font-size="10" fill="var(--text)">No clear convergence</text>

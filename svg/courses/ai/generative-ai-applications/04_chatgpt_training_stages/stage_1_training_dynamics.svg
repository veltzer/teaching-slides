<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="658.107" y="80" text-anchor="middle" font-size="19.3141" font-weight="bold" fill="var(--text)">Stage 1: Training Dynamics - Loss Curve</text>
  <line x1="295.967" y1="117.0371" x2="295.967" y2="425.679" stroke="var(--text)" stroke-width="1.8028" />
  <line x1="295.967" y1="425.679" x2="1044.3896" y2="425.679" stroke="var(--text)" stroke-width="1.8028" />
  <text x="235.6104" y="277.531" text-anchor="middle" font-size="15.6927" fill="var(--text)" transform="rotate(-90, 50, 190)">Loss</text>
  <text x="658.107" y="468.889" text-anchor="middle" font-size="15.6927" fill="var(--text)">Tokens processed</text>
  <text x="283.8958" y="129.3828" text-anchor="end" font-size="13.3916" fill="var(--text-muted)">4.0</text>
  <text x="283.8958" y="203.4569" text-anchor="end" font-size="13.3916" fill="var(--text-muted)">3.0</text>
  <text x="283.8958" y="277.531" text-anchor="end" font-size="13.3916" fill="var(--text-muted)">2.0</text>
  <text x="283.8958" y="351.6049" text-anchor="end" font-size="13.3916" fill="var(--text-muted)">1.5</text>
  <text x="416.6804" y="450.3705" text-anchor="middle" font-size="13.3916" fill="var(--text-muted)">200B</text>
  <text x="561.5364" y="450.3705" text-anchor="middle" font-size="13.3916" fill="var(--text-muted)">400B</text>
  <text x="706.3923" y="450.3705" text-anchor="middle" font-size="13.3916" fill="var(--text-muted)">600B</text>
  <text x="851.2482" y="450.3705" text-anchor="middle" font-size="13.3916" fill="var(--text-muted)">800B</text>
  <text x="996.1042" y="450.3705" text-anchor="middle" font-size="13.3916" fill="var(--text-muted)">1T+</text>
  <path d="M 308.0384 129.3828 Q 356.3238 166.4198 416.6804 215.8025 Q 489.1084 265.1852 561.5364 302.2223 Q 658.107 339.2593 754.6777 363.9507 Q 851.2482 382.4691 947.8189 394.8149 Q 1008.1755 400.9878 1032.3182 403.4569" fill="none" stroke="var(--primary-border)" stroke-width="2.7042" />
  <path d="M 633.9643 326.9136 L 640.0001 289.8766 L 646.0357 333.0866" fill="none" stroke="var(--danger-border)" stroke-width="1.8028" />
  <text x="670.1784" y="283.7037" font-size="13.3916" fill="var(--danger-accent)">spike</text>
  <rect x="295.967" y="493.5803" width="362.1398" height="37.037" rx="8.035" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="477.037" y="518.2717" text-anchor="middle" font-size="13.3916" fill="var(--text)">Rapid initial improvement</text>
  <rect x="670.1784" y="493.5803" width="362.1398" height="37.037" rx="8.035" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="851.2482" y="518.2717" text-anchor="middle" font-size="13.3916" fill="var(--text)">Gradual diminishing returns</text>
  <rect x="295.967" y="542.963" width="362.1398" height="37.037" rx="8.035" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="477.037" y="567.6544" text-anchor="middle" font-size="13.3916" fill="var(--text)">Occasional loss spikes</text>
  <rect x="670.1784" y="542.963" width="362.1398" height="37.037" rx="8.035" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="851.2482" y="567.6544" text-anchor="middle" font-size="13.3916" fill="var(--text)">No clear convergence</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="666.8658" y="40" text-anchor="middle" font-size="25.3383" font-weight="bold" fill="var(--text)">Stage 1: Training Dynamics - Loss Curve</text>
  <line x1="129.5524" y1="82.9631" x2="129.5524" y2="440.9877" stroke="var(--text)" stroke-width="0.6929" />
  <line x1="129.5524" y1="440.9877" x2="1240" y2="440.9877" stroke="var(--text)" stroke-width="0.6929" />
  <text x="40" y="269.136" text-anchor="middle" font-size="21.1611" fill="var(--text)" transform="rotate(-90, 50, 190)">Loss</text>
  <text x="666.8658" y="491.1112" text-anchor="middle" font-size="21.1611" fill="var(--text)">Tokens processed</text>
  <text x="111.6419" y="97.2841" text-anchor="end" font-size="21.1611" fill="var(--text-muted)">4.0</text>
  <text x="111.6419" y="183.21" text-anchor="end" font-size="21.1611" fill="var(--text-muted)">3.0</text>
  <text x="111.6419" y="269.136" text-anchor="end" font-size="21.1611" fill="var(--text-muted)">2.0</text>
  <text x="111.6419" y="355.0617" text-anchor="end" font-size="21.1611" fill="var(--text-muted)">1.5</text>
  <text x="308.6569" y="469.6298" text-anchor="middle" font-size="21.1611" fill="var(--text-muted)">200B</text>
  <text x="523.5823" y="469.6298" text-anchor="middle" font-size="21.1611" fill="var(--text-muted)">400B</text>
  <text x="738.5075" y="469.6298" text-anchor="middle" font-size="21.1611" fill="var(--text-muted)">600B</text>
  <text x="953.4327" y="469.6298" text-anchor="middle" font-size="21.1611" fill="var(--text-muted)">800B</text>
  <text x="1168.3581" y="469.6298" text-anchor="middle" font-size="21.1611" fill="var(--text-muted)">1T+</text>
  <path d="M 147.4628 97.2841 Q 219.1047 140.2471 308.6569 197.531 Q 416.1194 254.8148 523.5823 297.7779 Q 666.8658 340.7408 810.1494 369.3829 Q 953.4327 390.8642 1096.7165 405.1854 Q 1186.2686 412.346 1222.0895 415.2101" fill="none" stroke="var(--primary-border)" stroke-width="1.0394" />
  <path d="M 631.0449 326.4198 L 640.0001 283.4569 L 648.9554 333.5806" fill="none" stroke="var(--danger-border)" stroke-width="0.6929" />
  <text x="684.7763" y="276.2963" font-size="21.1611" fill="var(--danger-accent)">spike</text>
  <rect x="129.5524" y="519.7533" width="537.3132" height="42.9629" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="398.209" y="548.3952" text-anchor="middle" font-size="21.1611" fill="var(--text)">Rapid initial improvement</text>
  <rect x="684.7763" y="519.7533" width="537.3132" height="42.9629" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="953.4327" y="548.3952" text-anchor="middle" font-size="21.1611" fill="var(--text)">Gradual diminishing returns</text>
  <rect x="129.5524" y="577.0371" width="537.3132" height="42.9629" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="398.209" y="605.6792" text-anchor="middle" font-size="21.1611" fill="var(--text)">Occasional loss spikes</text>
  <rect x="684.7763" y="577.0371" width="537.3132" height="42.9629" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="953.4327" y="605.6792" text-anchor="middle" font-size="21.1611" fill="var(--text)">No clear convergence</text>
</svg>
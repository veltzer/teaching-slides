  <line x1="183.4889" y1="263.9056" x2="647.4838" y2="263.9056" stroke="var(--text)" stroke-width="0.6929" />
  <text x="146.0699" y="172.0592" text-anchor="middle" font-size="10" fill="var(--text)" transform="rotate(-90, 50, 190)">Loss</text>

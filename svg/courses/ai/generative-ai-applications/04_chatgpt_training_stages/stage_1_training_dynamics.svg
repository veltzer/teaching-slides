<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="360.5634" y="27.6568" text-anchor="middle" font-size="14.4225" font-weight="bold" fill="var(--text)">Stage 1: Training Dynamics - Loss Curve</text>
  <line x1="90.1408" y1="55.3137" x2="90.1408" y2="285.7874" stroke="var(--text)" stroke-width="1.8028" />
  <line x1="90.1408" y1="285.7874" x2="649.0141" y2="285.7874" stroke="var(--text)" stroke-width="1.8028" />
  <text x="45.0704" y="175.1601" text-anchor="middle" font-size="11.7183" fill="var(--text)" transform="rotate(-90, 50, 190)">Loss</text>
  <text x="360.5634" y="318.0538" text-anchor="middle" font-size="11.7183" fill="var(--text)">Tokens processed</text>
  <text x="81.1268" y="64.5327" text-anchor="end" font-size="10" fill="var(--text-muted)">4.0</text>
  <text x="81.1268" y="119.8464" text-anchor="end" font-size="10" fill="var(--text-muted)">3.0</text>
  <text x="81.1268" y="175.1601" text-anchor="end" font-size="10" fill="var(--text-muted)">2.0</text>
  <text x="81.1268" y="230.4737" text-anchor="end" font-size="10" fill="var(--text-muted)">1.5</text>
  <text x="180.2817" y="304.2254" text-anchor="middle" font-size="10" fill="var(--text-muted)">200B</text>
  <text x="288.4507" y="304.2254" text-anchor="middle" font-size="10" fill="var(--text-muted)">400B</text>
  <text x="396.6197" y="304.2254" text-anchor="middle" font-size="10" fill="var(--text-muted)">600B</text>
  <text x="504.7887" y="304.2254" text-anchor="middle" font-size="10" fill="var(--text-muted)">800B</text>
  <text x="612.9577" y="304.2254" text-anchor="middle" font-size="10" fill="var(--text-muted)">1T+</text>
  <path d="M 99.1549 64.5327 Q 135.2113 92.1895 180.2817 129.0653 Q 234.3662 165.9411 288.4507 193.598 Q 360.5634 221.2548 432.6761 239.6927 Q 504.7887 253.5211 576.9014 262.7401 Q 621.9718 267.3496 640 269.1934" fill="none" stroke="var(--primary-border)" stroke-width="2.7042" />
  <path d="M 342.5352 212.0358 L 347.0423 184.379 L 351.5493 216.6454" fill="none" stroke="var(--danger-border)" stroke-width="1.8028" />
  <text x="369.5775" y="179.7695" font-size="10" fill="var(--danger-accent)">spike</text>
  <rect x="90.1408" y="336.4917" width="270.4225" height="27.6568" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="225.3521" y="354.9296" text-anchor="middle" font-size="10" fill="var(--text)">Rapid initial improvement</text>
  <rect x="369.5775" y="336.4917" width="270.4225" height="27.6568" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="504.7887" y="354.9296" text-anchor="middle" font-size="10" fill="var(--text)">Gradual diminishing returns</text>
  <rect x="90.1408" y="373.3675" width="270.4225" height="27.6568" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="225.3521" y="391.8054" text-anchor="middle" font-size="10" fill="var(--text)">Occasional loss spikes</text>
  <rect x="369.5775" y="373.3675" width="270.4225" height="27.6568" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="504.7887" y="391.8054" text-anchor="middle" font-size="10" fill="var(--text)">No clear convergence</text>
</svg>
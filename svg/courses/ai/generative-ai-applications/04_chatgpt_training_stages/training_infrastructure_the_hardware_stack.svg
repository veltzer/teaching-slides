<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.5057" y="44.1379" text-anchor="middle" font-size="23.5402" font-weight="bold" fill="var(--text)">Training Infrastructure: The Hardware Stack</text>
  <rect x="88.2759" y="88.2759" width="411.954" height="191.2644" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="294.2529" y="125.0575" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--primary-accent)">GPU Node 1</text>
  <text x="294.2529" y="158.8966" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">8x A100 80GB</text>
  <text x="294.2529" y="188.3218" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">NVLink (600GB/s)</text>
  <text x="294.2529" y="217.7471" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">2x AMD EPYC CPU</text>
  <text x="294.2529" y="247.1724" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">2TB RAM</text>
  <rect x="676.7816" y="88.2759" width="411.954" height="191.2644" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="882.7586" y="125.0575" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--primary-accent)">GPU Node 2</text>
  <text x="882.7586" y="158.8966" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">8x A100 80GB</text>
  <text x="882.7586" y="188.3218" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">NVLink (600GB/s)</text>
  <text x="882.7586" y="217.7471" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">2x AMD EPYC CPU</text>
  <text x="882.7586" y="247.1724" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">2TB RAM</text>
  <line x1="294.2529" y1="279.5402" x2="294.2529" y2="338.3908" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="882.7586" y1="279.5402" x2="882.7586" y2="338.3908" stroke="var(--primary-border)" stroke-width="2" />
  <text x="588.5057" y="316.3218" text-anchor="middle" font-size="14.7126" fill="var(--primary-accent)">InfiniBand 400Gb/s</text>
  <rect x="176.5517" y="338.3908" width="823.908" height="58.8506" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="588.5057" y="375.1724" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--ok-accent)">High-Speed Network Fabric</text>
  <line x1="411.954" y1="397.2414" x2="411.954" y2="441.3793" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="765.0575" y1="397.2414" x2="765.0575" y2="441.3793" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="205.977" y="441.3793" width="411.954" height="73.5632" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="411.954" y="473.7471" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--danger-accent)">Storage Cluster</text>
  <text x="411.954" y="500.2299" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">(Petabytes)</text>
  <rect x="676.7816" y="441.3793" width="353.1034" height="73.5632" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="853.3333" y="473.7471" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--danger-accent)">Parameter Server</text>
  <text x="853.3333" y="500.2299" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">(distributed)</text>
  <rect x="147.1264" y="551.7241" width="882.7586" height="88.2759" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="588.5057" y="584.092" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--danger-accent)">Cost Estimates for GPT-4-Scale Training</text>
  <text x="588.5057" y="614.9885" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">Hardware: ~$500M (25,000 A100s) | Electricity: ~$10M/run | Total: ~$100M+</text>
</svg>
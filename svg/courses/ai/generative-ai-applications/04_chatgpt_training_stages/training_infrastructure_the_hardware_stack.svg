<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="25.4356" font-weight="bold" fill="var(--text)">Training Infrastructure: The Hardware Stack</text>
  <rect x="40" y="82.963" width="494.1177" height="186.1729" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="287.0588" y="118.7655" text-anchor="middle" font-size="20.6664" font-weight="bold" fill="var(--primary-accent)">GPU Node 1</text>
  <text x="287.0588" y="151.7038" text-anchor="middle" font-size="17.487" fill="var(--text-muted)">8x A100 80GB</text>
  <text x="287.0588" y="180.3457" text-anchor="middle" font-size="17.487" fill="var(--text-muted)">NVLink (600GB/s)</text>
  <text x="287.0588" y="208.9876" text-anchor="middle" font-size="17.487" fill="var(--text-muted)">2x AMD EPYC CPU</text>
  <text x="287.0588" y="237.6296" text-anchor="middle" font-size="17.487" fill="var(--text-muted)">2TB RAM</text>
  <rect x="745.8823" y="82.963" width="494.1177" height="186.1729" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="992.9412" y="118.7655" text-anchor="middle" font-size="20.6664" font-weight="bold" fill="var(--primary-accent)">GPU Node 2</text>
  <text x="992.9412" y="151.7038" text-anchor="middle" font-size="17.487" fill="var(--text-muted)">8x A100 80GB</text>
  <text x="992.9412" y="180.3457" text-anchor="middle" font-size="17.487" fill="var(--text-muted)">NVLink (600GB/s)</text>
  <text x="992.9412" y="208.9876" text-anchor="middle" font-size="17.487" fill="var(--text-muted)">2x AMD EPYC CPU</text>
  <text x="992.9412" y="237.6296" text-anchor="middle" font-size="17.487" fill="var(--text-muted)">2TB RAM</text>
  <line x1="287.0588" y1="269.1358" x2="287.0588" y2="326.4198" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="992.9412" y1="269.1358" x2="992.9412" y2="326.4198" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="304.9382" text-anchor="middle" font-size="15.8972" fill="var(--primary-accent)">InfiniBand 400Gb/s</text>
  <rect x="145.8823" y="326.4198" width="988.2353" height="57.284" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="362.2222" text-anchor="middle" font-size="20.6664" font-weight="bold" fill="var(--ok-accent)">High-Speed Network Fabric</text>
  <line x1="428.2352" y1="383.7037" x2="428.2352" y2="426.6667" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="851.7648" y1="383.7037" x2="851.7648" y2="426.6667" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="181.1764" y="426.6667" width="494.1177" height="71.6049" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="428.2352" y="458.1728" text-anchor="middle" font-size="19.0768" font-weight="bold" fill="var(--danger-accent)">Storage Cluster</text>
  <text x="428.2352" y="483.9506" text-anchor="middle" font-size="17.487" fill="var(--text-muted)">(Petabytes)</text>
  <rect x="745.8823" y="426.6667" width="423.5294" height="71.6049" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="957.647" y="458.1728" text-anchor="middle" font-size="19.0768" font-weight="bold" fill="var(--danger-accent)">Parameter Server</text>
  <text x="957.647" y="483.9506" text-anchor="middle" font-size="17.487" fill="var(--text-muted)">(distributed)</text>
  <rect x="110.5882" y="534.074" width="1058.8236" height="85.926" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="565.5803" text-anchor="middle" font-size="19.0768" font-weight="bold" fill="var(--danger-accent)">Cost Estimates for GPT-4-Scale Training</text>
  <text x="639.9999" y="595.6543" text-anchor="middle" font-size="17.487" fill="var(--text-muted)">Hardware: ~$500M (25,000 A100s) | Electricity: ~$10M/run | Total: ~$100M+</text>
</svg>
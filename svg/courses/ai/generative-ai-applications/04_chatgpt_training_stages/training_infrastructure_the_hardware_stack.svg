<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="494.1177" height="201.066745866672" rx="6.235383122261" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="287.0588" y="78.666702666669" text-anchor="middle" font-size="21.477153626316" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">GPU Node 1</text>
  <text x="287.0588" y="114.240069120005" text-anchor="middle" font-size="18.17302410983" fill="var(--text-muted)" font-family="Arial, sans-serif">8x A100 80GB</text>
  <text x="287.0588" y="145.173323253333" text-anchor="middle" font-size="18.17302410983" fill="var(--text-muted)" font-family="Arial, sans-serif">NVLink (600GB/s)</text>
  <text x="287.0588" y="176.10657738666" text-anchor="middle" font-size="18.17302410983" fill="var(--text-muted)" font-family="Arial, sans-serif">2x AMD EPYC CPU</text>
  <text x="287.0588" y="207.039939519996" text-anchor="middle" font-size="18.17302410983" fill="var(--text-muted)" font-family="Arial, sans-serif">2TB RAM</text>
  <rect x="745.8823" y="40" width="494.1177" height="201.066745866672" rx="6.235383122261" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="992.9412" y="78.666702666669" text-anchor="middle" font-size="21.477153626316" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">GPU Node 2</text>
  <text x="992.9412" y="114.240069120005" text-anchor="middle" font-size="18.17302410983" fill="var(--text-muted)" font-family="Arial, sans-serif">8x A100 80GB</text>
  <text x="992.9412" y="145.173323253333" text-anchor="middle" font-size="18.17302410983" fill="var(--text-muted)" font-family="Arial, sans-serif">NVLink (600GB/s)</text>
  <text x="992.9412" y="176.10657738666" text-anchor="middle" font-size="18.17302410983" fill="var(--text-muted)" font-family="Arial, sans-serif">2x AMD EPYC CPU</text>
  <text x="992.9412" y="207.039939519996" text-anchor="middle" font-size="18.17302410983" fill="var(--text-muted)" font-family="Arial, sans-serif">2TB RAM</text>
  <line x1="287.0588" y1="241.066637866665" x2="287.0588" y2="302.933362133335" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="992.9412" y1="241.066637866665" x2="992.9412" y2="302.933362133335" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="639.9999" y="279.733232533326" text-anchor="middle" font-size="16.520855428535" fill="var(--primary-accent)" font-family="Arial, sans-serif">InfiniBand 400Gb/s</text>
  <rect x="145.8823" y="302.933362133335" width="988.2353" height="61.866724266671" rx="6.235383122261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="341.599956799997" text-anchor="middle" font-size="21.477153626316" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">High-Speed Network Fabric</text>
  <line x1="428.2352" y1="364.799978399999" x2="428.2352" y2="411.200021600001" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="851.7648" y1="364.799978399999" x2="851.7648" y2="411.200021600001" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="181.1764" y="411.200021600001" width="494.1177" height="77.333297333331" rx="6.235383122261" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="428.2352" y="445.226611946663" text-anchor="middle" font-size="19.825192791125" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Storage Cluster</text>
  <text x="428.2352" y="473.066637866665" text-anchor="middle" font-size="18.17302410983" fill="var(--text-muted)" font-family="Arial, sans-serif">(Petabytes)</text>
  <rect x="745.8823" y="411.200021600001" width="423.5294" height="77.333297333331" rx="6.235383122261" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="957.647" y="445.226611946663" text-anchor="middle" font-size="19.825192791125" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Parameter Server</text>
  <text x="957.647" y="473.066637866665" text-anchor="middle" font-size="18.17302410983" fill="var(--text-muted)" font-family="Arial, sans-serif">(distributed)</text>
  <rect x="110.5882" y="527.199913599994" width="1058.8236" height="92.800086400006" rx="6.235383122261" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="561.22671994667" text-anchor="middle" font-size="19.825192791125" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cost Estimates for GPT-4-Scale Training</text>
  <text x="639.9999" y="593.706642186665" text-anchor="middle" font-size="18.17302410983" fill="var(--text-muted)" font-family="Arial, sans-serif">Hardware: ~$500M (25,000 A100s) | Electricity: ~$10M/run | Total: ~$100M+</text>
</svg>

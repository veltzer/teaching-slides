<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="25.4356" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Training Infrastructure: The Hardware Stack</text>
  <rect x="40" y="82.963" width="494.1177" height="186.1729" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="287.0588" y="118.7655" text-anchor="middle" font-size="20.6664" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">GPU Node 1</text>
  <text x="287.0588" y="151.7038" text-anchor="middle" font-size="17.487" fill="var(--text-muted)" font-family="Arial, sans-serif">8x A100 80GB</text>
  <text x="287.0588" y="180.3457" text-anchor="middle" font-size="17.487" fill="var(--text-muted)" font-family="Arial, sans-serif">NVLink (600GB/s)</text>
  <text x="287.0588" y="208.9876" text-anchor="middle" font-size="17.487" fill="var(--text-muted)" font-family="Arial, sans-serif">2x AMD EPYC CPU</text>
  <text x="287.0588" y="237.6296" text-anchor="middle" font-size="17.487" fill="var(--text-muted)" font-family="Arial, sans-serif">2TB RAM</text>
  <rect x="745.8823" y="82.963" width="494.1177" height="186.1729" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="992.9412" y="118.7655" text-anchor="middle" font-size="20.6664" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">GPU Node 2</text>
  <text x="992.9412" y="151.7038" text-anchor="middle" font-size="17.487" fill="var(--text-muted)" font-family="Arial, sans-serif">8x A100 80GB</text>
  <text x="992.9412" y="180.3457" text-anchor="middle" font-size="17.487" fill="var(--text-muted)" font-family="Arial, sans-serif">NVLink (600GB/s)</text>
  <text x="992.9412" y="208.9876" text-anchor="middle" font-size="17.487" fill="var(--text-muted)" font-family="Arial, sans-serif">2x AMD EPYC CPU</text>
  <text x="992.9412" y="237.6296" text-anchor="middle" font-size="17.487" fill="var(--text-muted)" font-family="Arial, sans-serif">2TB RAM</text>
  <line x1="287.0588" y1="269.1358" x2="287.0588" y2="326.4198" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="992.9412" y1="269.1358" x2="992.9412" y2="326.4198" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="639.9999" y="304.9382" text-anchor="middle" font-size="15.8972" fill="var(--primary-accent)" font-family="Arial, sans-serif">InfiniBand 400Gb/s</text>
  <rect x="145.8823" y="326.4198" width="988.2353" height="57.284" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="362.2222" text-anchor="middle" font-size="20.6664" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">High-Speed Network Fabric</text>
  <line x1="428.2352" y1="383.7037" x2="428.2352" y2="426.6667" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="851.7648" y1="383.7037" x2="851.7648" y2="426.6667" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="181.1764" y="426.6667" width="494.1177" height="71.6049" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="428.2352" y="458.1728" text-anchor="middle" font-size="19.0768" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Storage Cluster</text>
  <text x="428.2352" y="483.9506" text-anchor="middle" font-size="17.487" fill="var(--text-muted)" font-family="Arial, sans-serif">(Petabytes)</text>
  <rect x="745.8823" y="426.6667" width="423.5294" height="71.6049" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="957.647" y="458.1728" text-anchor="middle" font-size="19.0768" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Parameter Server</text>
  <text x="957.647" y="483.9506" text-anchor="middle" font-size="17.487" fill="var(--text-muted)" font-family="Arial, sans-serif">(distributed)</text>
  <rect x="110.5882" y="534.074" width="1058.8236" height="85.926" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="565.5803" text-anchor="middle" font-size="19.0768" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cost Estimates for GPT-4-Scale Training</text>
  <text x="639.9999" y="595.6543" text-anchor="middle" font-size="17.487" fill="var(--text-muted)" font-family="Arial, sans-serif">Hardware: ~$500M (25,000 A100s) | Electricity: ~$10M/run | Total: ~$100M+</text>
</svg>

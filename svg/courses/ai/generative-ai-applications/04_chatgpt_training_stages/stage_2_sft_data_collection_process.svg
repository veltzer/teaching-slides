<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="asd2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 0,8" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="588.5057" y="44.1379" text-anchor="middle" font-size="23.5402" font-weight="bold" fill="var(--text)">Stage 2: SFT Data Collection Process</text>
  <text x="588.5057" y="88.2759" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--primary-accent)">1. Create Diverse Prompt Distribution</text>
  <rect x="147.1264" y="102.9885" width="882.7586" height="198.6207" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="382.5287" y="139.7701" font-size="16.1839" fill="var(--text)">Open-ended generation</text>
  <rect x="676.7816" y="120.6437" width="183.908" height="23.5402" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="768" y="139.7701" text-anchor="middle" font-size="14.7126" fill="var(--bg)">25%</text>
  <text x="382.5287" y="169.1954" font-size="16.1839" fill="var(--text)">Closed Q&amp;A</text>
  <rect x="676.7816" y="150.069" width="147.1264" height="23.5402" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="750.3448" y="169.1954" text-anchor="middle" font-size="14.7126" fill="var(--bg)">20%</text>
  <text x="382.5287" y="198.6207" font-size="16.1839" fill="var(--text)">Classification tasks</text>
  <rect x="676.7816" y="179.4943" width="110.3448" height="23.5402" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="731.2184" y="198.6207" text-anchor="middle" font-size="14.7126" fill="var(--bg)">15%</text>
  <text x="382.5287" y="228.046" font-size="16.1839" fill="var(--text)">Code writing</text>
  <rect x="676.7816" y="208.9195" width="110.3448" height="23.5402" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="731.2184" y="228.046" text-anchor="middle" font-size="14.7126" fill="var(--bg)">15%</text>
  <text x="382.5287" y="257.4713" font-size="16.1839" fill="var(--text)">Brainstorming</text>
  <rect x="676.7816" y="238.3448" width="73.5632" height="23.5402" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="713.5632" y="257.4713" text-anchor="middle" font-size="14.7126" fill="var(--bg)">10%</text>
  <text x="382.5287" y="286.8966" font-size="16.1839" fill="var(--text)">Rewriting / Summarization</text>
  <rect x="676.7816" y="267.7701" width="110.3448" height="23.5402" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="731.2184" y="286.8966" text-anchor="middle" font-size="14.7126" fill="var(--bg)">15%</text>
  <line x1="588.5057" y1="301.6092" x2="588.5057" y2="338.3908" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#asd2)" />
  <text x="588.5057" y="364.8736" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--ok-accent)">2. Human Labelers Write Ideal Responses</text>
  <rect x="147.1264" y="379.5862" width="882.7586" height="102.9885" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="588.5057" y="416.3678" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">Follow detailed guidelines | Be helpful but not harmful</text>
  <text x="588.5057" y="445.7931" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">Acknowledge uncertainty | Format responses clearly</text>
  <line x1="588.5057" y1="482.5747" x2="588.5057" y2="519.3563" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#asd2)" />
  <text x="588.5057" y="544.3678" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--danger-accent)">3. Quality Assurance</text>
  <rect x="147.1264" y="559.0805" width="882.7586" height="80.9195" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="588.5057" y="595.8621" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">Multiple reviewers per response | Inter-annotator agreement checks</text>
  <text x="588.5057" y="625.2874" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">Regular calibration sessions</text>
</svg>
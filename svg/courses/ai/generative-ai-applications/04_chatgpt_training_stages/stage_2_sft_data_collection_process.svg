<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="22.864214601863" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Create Diverse Prompt Distribution</text>
  <rect x="40" y="55.466681066668" width="1200" height="208.799978399998" rx="6.235383122261" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="360" y="94.133275733329" font-size="19.346627136492" fill="var(--text)" font-family="Arial, sans-serif">Open-ended generation</text>
  <rect x="760.0001" y="74.026698346669" width="249.9999" height="24.746581706661" rx="6.235383122261" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="884.0001" y="94.133275733329" text-anchor="middle" font-size="17.587833403806" fill="var(--bg)" font-family="Arial, sans-serif">25%</text>
  <text x="360" y="125.066637866665" font-size="19.346627136492" fill="var(--text)" font-family="Arial, sans-serif">Closed Q&amp;A</text>
  <rect x="760.0001" y="104.960060480004" width="200" height="24.746581706661" rx="6.235383122261" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="860" y="125.066637866665" text-anchor="middle" font-size="17.587833403806" fill="var(--bg)" font-family="Arial, sans-serif">20%</text>
  <text x="360" y="156" font-size="19.346627136492" fill="var(--text)" font-family="Arial, sans-serif">Classification tasks</text>
  <rect x="760.0001" y="135.893422613339" width="150" height="24.746581706661" rx="6.235383122261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="834.0001" y="156" text-anchor="middle" font-size="17.587833403806" fill="var(--bg)" font-family="Arial, sans-serif">15%</text>
  <text x="360" y="186.933362133335" font-size="19.346627136492" fill="var(--text)" font-family="Arial, sans-serif">Code writing</text>
  <rect x="760.0001" y="166.82656874666" width="150" height="24.746581706661" rx="6.235383122261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="834.0001" y="186.933362133335" text-anchor="middle" font-size="17.587833403806" fill="var(--bg)" font-family="Arial, sans-serif">15%</text>
  <text x="360" y="217.866724266671" font-size="19.346627136492" fill="var(--text)" font-family="Arial, sans-serif">Brainstorming</text>
  <rect x="760.0001" y="197.759930879995" width="100" height="24.746581706661" rx="6.235383122261" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="810" y="217.866724266671" text-anchor="middle" font-size="17.587833403806" fill="var(--bg)" font-family="Arial, sans-serif">10%</text>
  <text x="360" y="248.800086400006" font-size="19.346627136492" fill="var(--text)" font-family="Arial, sans-serif">Rewriting / Summarization</text>
  <rect x="760.0001" y="228.693293013331" width="150" height="24.746581706661" rx="6.235383122261" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="834.0001" y="248.800086400006" text-anchor="middle" font-size="17.587833403806" fill="var(--bg)" font-family="Arial, sans-serif">15%</text>
  <line x1="640" y1="264.266659466666" x2="640" y2="302.933362133335" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="330.773388053337" text-anchor="middle" font-size="22.864214601863" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. Human Labelers Write Ideal Responses</text>
  <rect x="40" y="346.239961119997" width="1200" height="108.266659466666" rx="6.235383122261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="384.906663786666" text-anchor="middle" font-size="19.346627136492" fill="var(--text-muted)" font-family="Arial, sans-serif">Follow detailed guidelines | Be helpful but not harmful</text>
  <text x="640" y="415.840025920002" text-anchor="middle" font-size="19.346627136492" fill="var(--text-muted)" font-family="Arial, sans-serif">Acknowledge uncertainty | Format responses clearly</text>
  <line x1="640" y1="454.506620586663" x2="640" y2="493.173323253333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="519.466681066668" text-anchor="middle" font-size="22.864214601863" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. Quality Assurance</text>
  <rect x="40" y="534.933362133335" width="1200" height="85.066637866665" rx="6.235383122261" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="573.600064800004" text-anchor="middle" font-size="19.346627136492" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple reviewers per response | Inter-annotator agreement checks</text>
  <text x="640" y="604.53342693334" text-anchor="middle" font-size="19.346627136492" fill="var(--text-muted)" font-family="Arial, sans-serif">Regular calibration sessions</text>
</svg>

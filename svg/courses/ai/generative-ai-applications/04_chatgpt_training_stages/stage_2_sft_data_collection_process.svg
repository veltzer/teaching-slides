  <defs>
    <marker id="asd2" markerWidth="16" markerHeight="11.2" refX="8" refY="11.2" orient="auto">
      <polygon points="0,16 0,8" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="48" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Stage 2: SFT Data Collection Process</text>
  <text x="640" y="96" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#4a90e2">1. Create Diverse Prompt Distribution</text>
  <rect x="160" y="112" width="960" height="216" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="416" y="152" font-size="17.6" fill="#333">Open-ended generation</text>
  <rect x="736" y="131.2" width="200" height="25.6" rx="4.8" fill="#4a90e2" />
  <text x="835.2" y="152" text-anchor="middle" font-size="16" fill="#fff">25%</text>
  <text x="416" y="184" font-size="17.6" fill="#333">Closed Q&amp;A</text>
  <rect x="736" y="163.2" width="160" height="25.6" rx="4.8" fill="#4a90e2" />
  <text x="816" y="184" text-anchor="middle" font-size="16" fill="#fff">20%</text>
  <text x="416" y="216" font-size="17.6" fill="#333">Classification tasks</text>
  <rect x="736" y="195.2" width="120" height="25.6" rx="4.8" fill="#28a745" />
  <text x="795.2" y="216" text-anchor="middle" font-size="16" fill="#fff">15%</text>
  <text x="416" y="248" font-size="17.6" fill="#333">Code writing</text>
  <rect x="736" y="227.2" width="120" height="25.6" rx="4.8" fill="#28a745" />
  <text x="795.2" y="248" text-anchor="middle" font-size="16" fill="#fff">15%</text>
  <text x="416" y="280" font-size="17.6" fill="#333">Brainstorming</text>
  <rect x="736" y="259.2" width="80" height="25.6" rx="4.8" fill="#ffc107" />
  <text x="776" y="280" text-anchor="middle" font-size="16" fill="#fff">10%</text>
  <text x="416" y="312" font-size="17.6" fill="#333">Rewriting / Summarization</text>
  <rect x="736" y="291.2" width="120" height="25.6" rx="4.8" fill="#ffc107" />
  <text x="795.2" y="312" text-anchor="middle" font-size="16" fill="#fff">15%</text>
  <line x1="640" y1="328" x2="640" y2="368" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#asd2)" />
  <text x="640" y="396.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#28a745">2. Human Labelers Write Ideal Responses</text>
  <rect x="160" y="412.8" width="960" height="112" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="640" y="452.8" text-anchor="middle" font-size="17.6" fill="#555">Follow detailed guidelines | Be helpful but not harmful</text>
  <text x="640" y="484.8" text-anchor="middle" font-size="17.6" fill="#555">Acknowledge uncertainty | Format responses clearly</text>
  <line x1="640" y1="524.8" x2="640" y2="564.8" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#asd2)" />
  <text x="640" y="592" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#856404">3. Quality Assurance</text>
  <rect x="160" y="608" width="960" height="88" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="640" y="648" text-anchor="middle" font-size="17.6" fill="#555">Multiple reviewers per response | Inter-annotator agreement checks</text>
  <text x="640" y="680" text-anchor="middle" font-size="17.6" fill="#555">Regular calibration sessions</text>

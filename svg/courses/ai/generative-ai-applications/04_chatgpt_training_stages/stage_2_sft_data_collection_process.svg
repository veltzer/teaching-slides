<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="asd2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 0,8" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.0783" font-weight="bold" fill="var(--text)">Stage 2: SFT Data Collection Process</text>
  <text x="640" y="82.963" text-anchor="middle" font-size="22.0011" font-weight="bold" fill="var(--primary-accent)">1. Create Diverse Prompt Distribution</text>
  <rect x="40" y="97.284" width="1200" height="193.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="133.0864" font-size="18.6163" fill="var(--text)">Open-ended generation</text>
  <rect x="760.0001" y="114.4692" width="249.9999" height="22.9135" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="884.0001" y="133.0864" text-anchor="middle" font-size="16.9239" fill="var(--bg)">25%</text>
  <text x="360" y="161.7284" font-size="18.6163" fill="var(--text)">Closed Q&amp;A</text>
  <rect x="760.0001" y="143.1112" width="200" height="22.9135" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="161.7284" text-anchor="middle" font-size="16.9239" fill="var(--bg)">20%</text>
  <text x="360" y="190.3704" font-size="18.6163" fill="var(--text)">Classification tasks</text>
  <rect x="760.0001" y="171.7532" width="150" height="22.9135" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="834.0001" y="190.3704" text-anchor="middle" font-size="16.9239" fill="var(--bg)">15%</text>
  <text x="360" y="219.0124" font-size="18.6163" fill="var(--text)">Code writing</text>
  <rect x="760.0001" y="200.395" width="150" height="22.9135" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="834.0001" y="219.0124" text-anchor="middle" font-size="16.9239" fill="var(--bg)">15%</text>
  <text x="360" y="247.6544" font-size="18.6163" fill="var(--text)">Brainstorming</text>
  <rect x="760.0001" y="229.037" width="100" height="22.9135" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="810" y="247.6544" text-anchor="middle" font-size="16.9239" fill="var(--bg)">10%</text>
  <text x="360" y="276.2964" font-size="18.6163" fill="var(--text)">Rewriting / Summarization</text>
  <rect x="760.0001" y="257.679" width="150" height="22.9135" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="834.0001" y="276.2964" text-anchor="middle" font-size="16.9239" fill="var(--bg)">15%</text>
  <line x1="640" y1="290.6173" x2="640" y2="326.4198" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#asd2)" />
  <text x="640" y="352.1976" text-anchor="middle" font-size="22.0011" font-weight="bold" fill="var(--ok-accent)">2. Human Labelers Write Ideal Responses</text>
  <rect x="40" y="366.5185" width="1200" height="100.2469" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="402.321" text-anchor="middle" font-size="18.6163" fill="var(--text-muted)">Follow detailed guidelines | Be helpful but not harmful</text>
  <text x="640" y="430.963" text-anchor="middle" font-size="18.6163" fill="var(--text-muted)">Acknowledge uncertainty | Format responses clearly</text>
  <line x1="640" y1="466.7654" x2="640" y2="502.5679" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#asd2)" />
  <text x="640" y="526.9136" text-anchor="middle" font-size="22.0011" font-weight="bold" fill="var(--danger-accent)">3. Quality Assurance</text>
  <rect x="40" y="541.2346" width="1200" height="78.7654" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="577.0371" text-anchor="middle" font-size="18.6163" fill="var(--text-muted)">Multiple reviewers per response | Inter-annotator agreement checks</text>
  <text x="640" y="605.6791" text-anchor="middle" font-size="18.6163" fill="var(--text-muted)">Regular calibration sessions</text>
</svg>
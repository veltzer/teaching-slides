<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.0783" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Stage 2: SFT Data Collection Process</text>
  <text x="640" y="82.963" text-anchor="middle" font-size="22.0011" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Create Diverse Prompt Distribution</text>
  <rect x="40" y="97.284" width="1200" height="193.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="133.0864" font-size="18.6163" fill="var(--text)" font-family="Arial, sans-serif">Open-ended generation</text>
  <rect x="760.0001" y="114.4692" width="249.9999" height="22.9135" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="884.0001" y="133.0864" text-anchor="middle" font-size="16.9239" fill="var(--bg)" font-family="Arial, sans-serif">25%</text>
  <text x="360" y="161.7284" font-size="18.6163" fill="var(--text)" font-family="Arial, sans-serif">Closed Q&amp;A</text>
  <rect x="760.0001" y="143.1112" width="200" height="22.9135" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="161.7284" text-anchor="middle" font-size="16.9239" fill="var(--bg)" font-family="Arial, sans-serif">20%</text>
  <text x="360" y="190.3704" font-size="18.6163" fill="var(--text)" font-family="Arial, sans-serif">Classification tasks</text>
  <rect x="760.0001" y="171.7532" width="150" height="22.9135" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="834.0001" y="190.3704" text-anchor="middle" font-size="16.9239" fill="var(--bg)" font-family="Arial, sans-serif">15%</text>
  <text x="360" y="219.0124" font-size="18.6163" fill="var(--text)" font-family="Arial, sans-serif">Code writing</text>
  <rect x="760.0001" y="200.395" width="150" height="22.9135" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="834.0001" y="219.0124" text-anchor="middle" font-size="16.9239" fill="var(--bg)" font-family="Arial, sans-serif">15%</text>
  <text x="360" y="247.6544" font-size="18.6163" fill="var(--text)" font-family="Arial, sans-serif">Brainstorming</text>
  <rect x="760.0001" y="229.037" width="100" height="22.9135" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="810" y="247.6544" text-anchor="middle" font-size="16.9239" fill="var(--bg)" font-family="Arial, sans-serif">10%</text>
  <text x="360" y="276.2964" font-size="18.6163" fill="var(--text)" font-family="Arial, sans-serif">Rewriting / Summarization</text>
  <rect x="760.0001" y="257.679" width="150" height="22.9135" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="834.0001" y="276.2964" text-anchor="middle" font-size="16.9239" fill="var(--bg)" font-family="Arial, sans-serif">15%</text>
  <line x1="640" y1="290.6173" x2="640" y2="326.4198" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="352.1976" text-anchor="middle" font-size="22.0011" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. Human Labelers Write Ideal Responses</text>
  <rect x="40" y="366.5185" width="1200" height="100.2469" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="402.321" text-anchor="middle" font-size="18.6163" fill="var(--text-muted)" font-family="Arial, sans-serif">Follow detailed guidelines | Be helpful but not harmful</text>
  <text x="640" y="430.963" text-anchor="middle" font-size="18.6163" fill="var(--text-muted)" font-family="Arial, sans-serif">Acknowledge uncertainty | Format responses clearly</text>
  <line x1="640" y1="466.7654" x2="640" y2="502.5679" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="526.9136" text-anchor="middle" font-size="22.0011" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. Quality Assurance</text>
  <rect x="40" y="541.2346" width="1200" height="78.7654" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="577.0371" text-anchor="middle" font-size="18.6163" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple reviewers per response | Inter-annotator agreement checks</text>
  <text x="640" y="605.6791" text-anchor="middle" font-size="18.6163" fill="var(--text-muted)" font-family="Arial, sans-serif">Regular calibration sessions</text>
</svg>

    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="asd2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 0,8" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="588.5057" y="44.1379" text-anchor="middle" font-size="23.5402" font-weight="bold" fill="var(--text-dark)">Stage 2: SFT Data Collection Process</text>
  <text x="588.5057" y="88.2759" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--primary-bright)">1. Create Diverse Prompt Distribution</text>
  <rect x="147.1264" y="102.9885" width="882.7586" height="198.6207" rx="7.3563" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.2069" />
  <text x="382.5287" y="139.7701" font-size="16.1839" fill="var(--text-dark)">Open-ended generation</text>
  <rect x="676.7816" y="120.6437" width="183.908" height="23.5402" rx="4.4138" fill="var(--primary-bright)" />
  <text x="768" y="139.7701" text-anchor="middle" font-size="14.7126" fill="var(--bg)">25%</text>
  <text x="382.5287" y="169.1954" font-size="16.1839" fill="var(--text-dark)">Closed Q&amp;A</text>
  <rect x="676.7816" y="150.069" width="147.1264" height="23.5402" rx="4.4138" fill="var(--primary-bright)" />
  <text x="750.3448" y="169.1954" text-anchor="middle" font-size="14.7126" fill="var(--bg)">20%</text>
  <text x="382.5287" y="198.6207" font-size="16.1839" fill="var(--text-dark)">Classification tasks</text>
  <rect x="676.7816" y="179.4943" width="110.3448" height="23.5402" rx="4.4138" fill="var(--ok-bright)" />
  <text x="731.2184" y="198.6207" text-anchor="middle" font-size="14.7126" fill="var(--bg)">15%</text>
  <text x="382.5287" y="228.046" font-size="16.1839" fill="var(--text-dark)">Code writing</text>
  <rect x="676.7816" y="208.9195" width="110.3448" height="23.5402" rx="4.4138" fill="var(--ok-bright)" />
  <text x="731.2184" y="228.046" text-anchor="middle" font-size="14.7126" fill="var(--bg)">15%</text>
  <text x="382.5287" y="257.4713" font-size="16.1839" fill="var(--text-dark)">Brainstorming</text>
  <rect x="676.7816" y="238.3448" width="73.5632" height="23.5402" rx="4.4138" fill="var(--warn-yellow)" />
  <text x="713.5632" y="257.4713" text-anchor="middle" font-size="14.7126" fill="var(--bg)">10%</text>
  <text x="382.5287" y="286.8966" font-size="16.1839" fill="var(--text-dark)">Rewriting / Summarization</text>
  <rect x="676.7816" y="267.7701" width="110.3448" height="23.5402" rx="4.4138" fill="var(--warn-yellow)" />
  <text x="731.2184" y="286.8966" text-anchor="middle" font-size="14.7126" fill="var(--bg)">15%</text>
  <line x1="588.5057" y1="301.6092" x2="588.5057" y2="338.3908" stroke="var(--primary-bright)" stroke-width="2.9425" marker-end="url(#asd2)" />
  <text x="588.5057" y="364.8736" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--ok-bright)">2. Human Labelers Write Ideal Responses</text>
  <rect x="147.1264" y="379.5862" width="882.7586" height="102.9885" rx="7.3563" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.2069" />
  <text x="588.5057" y="416.3678" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">Follow detailed guidelines | Be helpful but not harmful</text>
  <text x="588.5057" y="445.7931" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">Acknowledge uncertainty | Format responses clearly</text>
  <line x1="588.5057" y1="482.5747" x2="588.5057" y2="519.3563" stroke="var(--primary-bright)" stroke-width="2.9425" marker-end="url(#asd2)" />
  <text x="588.5057" y="544.3678" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--danger-deeper)">3. Quality Assurance</text>
  <rect x="147.1264" y="559.0805" width="882.7586" height="80.9195" rx="7.3563" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.2069" />
  <text x="588.5057" y="595.8621" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">Multiple reviewers per response | Inter-annotator agreement checks</text>
  <text x="588.5057" y="625.2874" text-anchor="middle" font-size="16.1839" fill="var(--text-muted)">Regular calibration sessions</text>
</svg>
<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="asd2" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Stage 2: SFT Data Collection Process</text>
  <!-- Step 1: Prompt distribution -->
  <text x="400" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">1. Create Diverse Prompt Distribution</text>
  <rect x="100" y="70" width="600" height="135" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="260" y="95" font-size="11" fill="#333">Open-ended generation</text><rect x="460" y="82" width="125" height="16" rx="3" fill="#4a90e2"/><text x="522" y="95" text-anchor="middle" font-size="10" fill="#fff">25%</text>
  <text x="260" y="115" font-size="11" fill="#333">Closed Q&amp;A</text><rect x="460" y="102" width="100" height="16" rx="3" fill="#4a90e2"/><text x="510" y="115" text-anchor="middle" font-size="10" fill="#fff">20%</text>
  <text x="260" y="135" font-size="11" fill="#333">Classification tasks</text><rect x="460" y="122" width="75" height="16" rx="3" fill="#28a745"/><text x="497" y="135" text-anchor="middle" font-size="10" fill="#fff">15%</text>
  <text x="260" y="155" font-size="11" fill="#333">Code writing</text><rect x="460" y="142" width="75" height="16" rx="3" fill="#28a745"/><text x="497" y="155" text-anchor="middle" font-size="10" fill="#fff">15%</text>
  <text x="260" y="175" font-size="11" fill="#333">Brainstorming</text><rect x="460" y="162" width="50" height="16" rx="3" fill="#ffc107"/><text x="485" y="175" text-anchor="middle" font-size="10" fill="#fff">10%</text>
  <text x="260" y="195" font-size="11" fill="#333">Rewriting / Summarization</text><rect x="460" y="182" width="75" height="16" rx="3" fill="#ffc107"/><text x="497" y="195" text-anchor="middle" font-size="10" fill="#fff">15%</text>
  <line x1="400" y1="205" x2="400" y2="230" stroke="#4a90e2" stroke-width="2" marker-end="url(#asd2)"/>
  <!-- Step 2 -->
  <text x="400" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">2. Human Labelers Write Ideal Responses</text>
  <rect x="100" y="258" width="600" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="400" y="283" text-anchor="middle" font-size="11" fill="#555">Follow detailed guidelines | Be helpful but not harmful</text>
  <text x="400" y="303" text-anchor="middle" font-size="11" fill="#555">Acknowledge uncertainty | Format responses clearly</text>
  <line x1="400" y1="328" x2="400" y2="353" stroke="#4a90e2" stroke-width="2" marker-end="url(#asd2)"/>
  <!-- Step 3 -->
  <text x="400" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">3. Quality Assurance</text>
  <rect x="100" y="380" width="600" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="400" y="405" text-anchor="middle" font-size="11" fill="#555">Multiple reviewers per response | Inter-annotator agreement checks</text>
  <text x="400" y="425" text-anchor="middle" font-size="11" fill="#555">Regular calibration sessions</text>
</svg>
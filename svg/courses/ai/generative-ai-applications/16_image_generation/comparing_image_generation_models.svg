  <rect x="980" y="70.5263" width="260" height="53.421" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.9999" y="105.6315" text-anchor="middle" font-size="20.3004" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Cost</text>
  <rect x="40" y="131.5789" width="260" height="61.0526" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.0001" y="169.7368" text-anchor="middle" font-size="20.3004" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DALL-E 3</text>

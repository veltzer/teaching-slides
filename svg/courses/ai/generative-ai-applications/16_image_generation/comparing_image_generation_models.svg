<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 450" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Comparing Image Generation Models</text>
  <!-- Header -->
  <rect x="20" y="50" width="130" height="35" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="85" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Model</text>
  <rect x="155" y="50" width="120" height="35" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="215" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Quality</text>
  <rect x="280" y="50" width="100" height="35" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="330" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Speed</text>
  <rect x="385" y="50" width="100" height="35" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="435" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Open?</text>
  <rect x="490" y="50" width="130" height="35" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="555" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Cost</text>
  <!-- DALL-E 3 -->
  <rect x="20" y="90" width="130" height="40" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="85" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">DALL-E 3</text>
  <rect x="155" y="90" width="120" height="40" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="215" y="115" text-anchor="middle" font-size="12" fill="#333">5/5</text>
  <rect x="280" y="90" width="100" height="40" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="330" y="115" text-anchor="middle" font-size="12" fill="#333">~10s</text>
  <rect x="385" y="90" width="100" height="40" rx="3" fill="#f8d7da" stroke="#dc3545"/>
  <text x="435" y="115" text-anchor="middle" font-size="12" fill="#333">No</text>
  <rect x="490" y="90" width="130" height="40" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="555" y="115" text-anchor="middle" font-size="11" fill="#333">$0.04-$0.12/img</text>
  <!-- Midjourney -->
  <rect x="20" y="135" width="130" height="40" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="85" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Midjourney v6</text>
  <rect x="155" y="135" width="120" height="40" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="215" y="160" text-anchor="middle" font-size="12" fill="#333">5/5</text>
  <rect x="280" y="135" width="100" height="40" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="330" y="160" text-anchor="middle" font-size="12" fill="#333">~30s</text>
  <rect x="385" y="135" width="100" height="40" rx="3" fill="#f8d7da" stroke="#dc3545"/>
  <text x="435" y="160" text-anchor="middle" font-size="12" fill="#333">No</text>
  <rect x="490" y="135" width="130" height="40" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="555" y="160" text-anchor="middle" font-size="11" fill="#333">$10-60/month</text>
  <!-- Flux.1 -->
  <rect x="20" y="180" width="130" height="40" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="85" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Flux.1 Dev</text>
  <rect x="155" y="180" width="120" height="40" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="215" y="205" text-anchor="middle" font-size="12" fill="#333">4.5/5</text>
  <rect x="280" y="180" width="100" height="40" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="330" y="205" text-anchor="middle" font-size="12" fill="#333">~8s</text>
  <rect x="385" y="180" width="100" height="40" rx="3" fill="#fff3cd" stroke="#ffc107"/>
  <text x="435" y="205" text-anchor="middle" font-size="12" fill="#333">Yes*</text>
  <rect x="490" y="180" width="130" height="40" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="555" y="205" text-anchor="middle" font-size="11" fill="#333">Self-host</text>
  <!-- SDXL -->
  <rect x="20" y="225" width="130" height="40" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="85" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">SDXL</text>
  <rect x="155" y="225" width="120" height="40" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="215" y="250" text-anchor="middle" font-size="12" fill="#333">4/5</text>
  <rect x="280" y="225" width="100" height="40" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="330" y="250" text-anchor="middle" font-size="12" fill="#333">~5s</text>
  <rect x="385" y="225" width="100" height="40" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="435" y="250" text-anchor="middle" font-size="12" fill="#333">Yes</text>
  <rect x="490" y="225" width="130" height="40" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="555" y="250" text-anchor="middle" font-size="11" fill="#333">Self-host</text>
  <!-- SD 3.5 -->
  <rect x="20" y="270" width="130" height="40" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="85" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">SD 3.5</text>
  <rect x="155" y="270" width="120" height="40" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="215" y="295" text-anchor="middle" font-size="12" fill="#333">4.5/5</text>
  <rect x="280" y="270" width="100" height="40" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="330" y="295" text-anchor="middle" font-size="12" fill="#333">~6s</text>
  <rect x="385" y="270" width="100" height="40" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="435" y="295" text-anchor="middle" font-size="12" fill="#333">Yes</text>
  <rect x="490" y="270" width="130" height="40" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="555" y="295" text-anchor="middle" font-size="11" fill="#333">Self-host</text>
  <!-- SDXL Turbo -->
  <rect x="20" y="315" width="130" height="40" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="85" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">SDXL Turbo</text>
  <rect x="155" y="315" width="120" height="40" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="215" y="340" text-anchor="middle" font-size="12" fill="#333">3.5/5</text>
  <rect x="280" y="315" width="100" height="40" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="330" y="340" text-anchor="middle" font-size="12" fill="#333">~0.5s</text>
  <rect x="385" y="315" width="100" height="40" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="435" y="340" text-anchor="middle" font-size="12" fill="#333">Yes</text>
  <rect x="490" y="315" width="130" height="40" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="555" y="340" text-anchor="middle" font-size="11" fill="#333">Self-host</text>
  <!-- Footnotes -->
  <text x="30" y="390" font-size="11" fill="#666">* Flux.1 Dev: open weights but non-commercial license</text>
  <text x="30" y="410" font-size="11" fill="#666">  Flux.1 Schnell: Apache 2.0 (fully open)</text>
</svg>
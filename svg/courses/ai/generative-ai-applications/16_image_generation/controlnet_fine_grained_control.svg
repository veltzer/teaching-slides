<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="592.2679" y="52.6027" text-anchor="middle" font-size="30.4595" font-weight="bold" fill="var(--text)">ControlNet: Fine-Grained Control</text>
  <text x="592.2679" y="96.4383" text-anchor="middle" font-size="21.9985" fill="var(--text-muted)">Adds spatial control to diffusion models</text>
  <rect x="84.6097" y="131.5069" width="423.0486" height="78.9042" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="296.134" y="180.6028" text-anchor="middle" font-size="21.9985" font-weight="bold" fill="var(--text)">Text Prompt</text>
  <text x="549.9631" y="180.6028" font-size="30.4595" fill="var(--text)">+</text>
  <rect x="609.1899" y="131.5069" width="423.0486" height="78.9042" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="820.7141" y="180.6028" text-anchor="middle" font-size="21.9985" font-weight="bold" fill="var(--text)">Control Signal</text>
  <rect x="84.6097" y="254.2466" width="338.4388" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="253.8291" y="298.0822" text-anchor="middle" font-size="20.3064" font-weight="bold" fill="var(--bg)">Control Type</text>
  <rect x="423.0486" y="254.2466" width="676.8777" height="70.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="761.4873" y="298.0822" text-anchor="middle" font-size="20.3064" font-weight="bold" fill="var(--bg)">Function</text>
  <rect x="84.6097" y="324.3836" width="338.4388" height="52.6027" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="253.8291" y="359.4521" text-anchor="middle" font-size="18.6141" fill="var(--text)">Canny Edge</text>
  <rect x="423.0486" y="324.3836" width="676.8777" height="52.6027" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="761.4873" y="359.4521" text-anchor="middle" font-size="18.6141" fill="var(--text)">Generate from edge map</text>
  <rect x="84.6097" y="376.9863" width="338.4388" height="52.6027" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="253.8291" y="412.0549" text-anchor="middle" font-size="18.6141" fill="var(--text)">Depth Map</text>
  <rect x="423.0486" y="376.9863" width="676.8777" height="52.6027" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="761.4873" y="412.0549" text-anchor="middle" font-size="18.6141" fill="var(--text)">Generate matching depth</text>
  <rect x="84.6097" y="429.589" width="338.4388" height="52.6027" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="253.8291" y="464.6576" text-anchor="middle" font-size="18.6141" fill="var(--text)">Pose</text>
  <rect x="423.0486" y="429.589" width="676.8777" height="52.6027" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="761.4873" y="464.6576" text-anchor="middle" font-size="18.6141" fill="var(--text)">Generate matching human pose</text>
  <rect x="84.6097" y="482.1918" width="338.4388" height="52.6027" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="253.8291" y="517.2603" text-anchor="middle" font-size="18.6141" fill="var(--text)">Segmentation</text>
  <rect x="423.0486" y="482.1918" width="676.8777" height="52.6027" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="761.4873" y="517.2603" text-anchor="middle" font-size="18.6141" fill="var(--text)">Generate from semantic map</text>
  <rect x="84.6097" y="534.7945" width="338.4388" height="52.6027" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="253.8291" y="569.8631" text-anchor="middle" font-size="18.6141" fill="var(--text)">Scribble</text>
  <rect x="423.0486" y="534.7945" width="676.8777" height="52.6027" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="761.4873" y="569.8631" text-anchor="middle" font-size="18.6141" fill="var(--text)">Generate from rough sketch</text>
  <rect x="84.6097" y="587.3973" width="338.4388" height="52.6027" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="253.8291" y="622.4658" text-anchor="middle" font-size="18.6141" fill="var(--text)">Normal Map</text>
  <rect x="423.0486" y="587.3973" width="676.8777" height="52.6027" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="761.4873" y="622.4658" text-anchor="middle" font-size="18.6141" fill="var(--text)">Generate matching surface normals</text>
</svg>
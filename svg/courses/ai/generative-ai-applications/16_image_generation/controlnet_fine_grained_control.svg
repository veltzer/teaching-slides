<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="32.9049" font-weight="bold" fill="var(--text)">ControlNet: Fine-Grained Control</text>
  <text x="639.9999" y="83.2836" text-anchor="middle" font-size="23.7646" fill="var(--text-muted)">Adds spatial control to diffusion models</text>
  <rect x="40" y="117.9105" width="500" height="77.9105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="290" y="166.3881" text-anchor="middle" font-size="23.7646" font-weight="bold" fill="var(--text)">Text Prompt</text>
  <text x="590" y="166.3881" font-size="32.9049" fill="var(--text)">+</text>
  <rect x="659.9999" y="117.9105" width="500" height="77.9105" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="909.9998" y="166.3881" text-anchor="middle" font-size="23.7646" font-weight="bold" fill="var(--text)">Control Signal</text>
  <rect x="40" y="239.1045" width="399.9999" height="69.2537" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="240" y="282.3881" text-anchor="middle" font-size="21.9367" font-weight="bold" fill="var(--bg)">Control Type</text>
  <rect x="440" y="239.1045" width="800" height="69.2537" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="839.9998" y="282.3881" text-anchor="middle" font-size="21.9367" font-weight="bold" fill="var(--bg)">Function</text>
  <rect x="40" y="308.3583" width="399.9999" height="51.9403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="240" y="342.9851" text-anchor="middle" font-size="20.1085" fill="var(--text)">Canny Edge</text>
  <rect x="440" y="308.3583" width="800" height="51.9403" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="839.9998" y="342.9851" text-anchor="middle" font-size="20.1085" fill="var(--text)">Generate from edge map</text>
  <rect x="40" y="360.2985" width="399.9999" height="51.9403" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="240" y="394.9255" text-anchor="middle" font-size="20.1085" fill="var(--text)">Depth Map</text>
  <rect x="440" y="360.2985" width="800" height="51.9403" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="839.9998" y="394.9255" text-anchor="middle" font-size="20.1085" fill="var(--text)">Generate matching depth</text>
  <rect x="40" y="412.2388" width="399.9999" height="51.9403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="240" y="446.8657" text-anchor="middle" font-size="20.1085" fill="var(--text)">Pose</text>
  <rect x="440" y="412.2388" width="800" height="51.9403" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="839.9998" y="446.8657" text-anchor="middle" font-size="20.1085" fill="var(--text)">Generate matching human pose</text>
  <rect x="40" y="464.1791" width="399.9999" height="51.9403" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="240" y="498.806" text-anchor="middle" font-size="20.1085" fill="var(--text)">Segmentation</text>
  <rect x="440" y="464.1791" width="800" height="51.9403" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="839.9998" y="498.806" text-anchor="middle" font-size="20.1085" fill="var(--text)">Generate from semantic map</text>
  <rect x="40" y="516.1194" width="399.9999" height="51.9403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="240" y="550.7464" text-anchor="middle" font-size="20.1085" fill="var(--text)">Scribble</text>
  <rect x="440" y="516.1194" width="800" height="51.9403" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="839.9998" y="550.7464" text-anchor="middle" font-size="20.1085" fill="var(--text)">Generate from rough sketch</text>
  <rect x="40" y="568.0597" width="399.9999" height="51.9403" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="240" y="602.6866" text-anchor="middle" font-size="20.1085" fill="var(--text)">Normal Map</text>
  <rect x="440" y="568.0597" width="800" height="51.9403" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="839.9998" y="602.6866" text-anchor="middle" font-size="20.1085" fill="var(--text)">Generate matching surface normals</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">ControlNet: Fine-Grained Control</text>
  <text x="350" y="55" text-anchor="middle" font-size="13" fill="#666">Adds spatial control to diffusion models</text>
  <!-- Input -->
  <rect x="50" y="75" width="250" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="175" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Text Prompt</text>
  <text x="325" y="103" font-size="18" fill="#333">+</text>
  <rect x="360" y="75" width="250" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="485" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Control Signal</text>
  <!-- Control types table -->
  <rect x="50" y="145" width="200" height="40" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="150" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Control Type</text>
  <rect x="250" y="145" width="400" height="40" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="450" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Function</text>

  <rect x="50" y="185" width="200" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="150" y="205" text-anchor="middle" font-size="11" fill="#333">Canny Edge</text>
  <rect x="250" y="185" width="400" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="450" y="205" text-anchor="middle" font-size="11" fill="#333">Generate from edge map</text>

  <rect x="50" y="215" width="200" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="150" y="235" text-anchor="middle" font-size="11" fill="#333">Depth Map</text>
  <rect x="250" y="215" width="400" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="450" y="235" text-anchor="middle" font-size="11" fill="#333">Generate matching depth</text>

  <rect x="50" y="245" width="200" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="150" y="265" text-anchor="middle" font-size="11" fill="#333">Pose</text>
  <rect x="250" y="245" width="400" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="450" y="265" text-anchor="middle" font-size="11" fill="#333">Generate matching human pose</text>

  <rect x="50" y="275" width="200" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="150" y="295" text-anchor="middle" font-size="11" fill="#333">Segmentation</text>
  <rect x="250" y="275" width="400" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="450" y="295" text-anchor="middle" font-size="11" fill="#333">Generate from semantic map</text>

  <rect x="50" y="305" width="200" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="150" y="325" text-anchor="middle" font-size="11" fill="#333">Scribble</text>
  <rect x="250" y="305" width="400" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="450" y="325" text-anchor="middle" font-size="11" fill="#333">Generate from rough sketch</text>

  <rect x="50" y="335" width="200" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="150" y="355" text-anchor="middle" font-size="11" fill="#333">Normal Map</text>
  <rect x="250" y="335" width="400" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="450" y="355" text-anchor="middle" font-size="11" fill="#333">Generate matching surface normals</text>
</svg>
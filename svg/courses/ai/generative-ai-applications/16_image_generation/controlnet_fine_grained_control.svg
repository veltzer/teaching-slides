<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="32.9049" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ControlNet: Fine-Grained Control</text>
  <text x="639.9999" y="83.2836" text-anchor="middle" font-size="23.7646" fill="var(--text-muted)" font-family="Arial, sans-serif">Adds spatial control to diffusion models</text>
  <rect x="40" y="117.9105" width="500" height="77.9105" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="166.3881" text-anchor="middle" font-size="23.7646" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Text Prompt</text>
  <text x="590" y="166.3881" font-size="32.9049" fill="var(--text)" font-family="Arial, sans-serif">+</text>
  <rect x="659.9999" y="117.9105" width="500" height="77.9105" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="909.9998" y="166.3881" text-anchor="middle" font-size="23.7646" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Control Signal</text>
  <rect x="40" y="239.1045" width="399.9999" height="69.2537" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="282.3881" text-anchor="middle" font-size="21.9367" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Control Type</text>
  <rect x="440" y="239.1045" width="800" height="69.2537" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="839.9998" y="282.3881" text-anchor="middle" font-size="21.9367" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Function</text>
  <rect x="40" y="308.3583" width="399.9999" height="51.9403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="342.9851" text-anchor="middle" font-size="20.1085" fill="var(--text)" font-family="Arial, sans-serif">Canny Edge</text>
  <rect x="440" y="308.3583" width="800" height="51.9403" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="839.9998" y="342.9851" text-anchor="middle" font-size="20.1085" fill="var(--text)" font-family="Arial, sans-serif">Generate from edge map</text>
  <rect x="40" y="360.2985" width="399.9999" height="51.9403" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="394.9255" text-anchor="middle" font-size="20.1085" fill="var(--text)" font-family="Arial, sans-serif">Depth Map</text>
  <rect x="440" y="360.2985" width="800" height="51.9403" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="839.9998" y="394.9255" text-anchor="middle" font-size="20.1085" fill="var(--text)" font-family="Arial, sans-serif">Generate matching depth</text>
  <rect x="40" y="412.2388" width="399.9999" height="51.9403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="446.8657" text-anchor="middle" font-size="20.1085" fill="var(--text)" font-family="Arial, sans-serif">Pose</text>
  <rect x="440" y="412.2388" width="800" height="51.9403" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="839.9998" y="446.8657" text-anchor="middle" font-size="20.1085" fill="var(--text)" font-family="Arial, sans-serif">Generate matching human pose</text>
  <rect x="40" y="464.1791" width="399.9999" height="51.9403" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="498.806" text-anchor="middle" font-size="20.1085" fill="var(--text)" font-family="Arial, sans-serif">Segmentation</text>
  <rect x="440" y="464.1791" width="800" height="51.9403" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="839.9998" y="498.806" text-anchor="middle" font-size="20.1085" fill="var(--text)" font-family="Arial, sans-serif">Generate from semantic map</text>
  <rect x="40" y="516.1194" width="399.9999" height="51.9403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="550.7464" text-anchor="middle" font-size="20.1085" fill="var(--text)" font-family="Arial, sans-serif">Scribble</text>
  <rect x="440" y="516.1194" width="800" height="51.9403" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="839.9998" y="550.7464" text-anchor="middle" font-size="20.1085" fill="var(--text)" font-family="Arial, sans-serif">Generate from rough sketch</text>
  <rect x="40" y="568.0597" width="399.9999" height="51.9403" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="602.6866" text-anchor="middle" font-size="20.1085" fill="var(--text)" font-family="Arial, sans-serif">Normal Map</text>
  <rect x="440" y="568.0597" width="800" height="51.9403" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="839.9998" y="602.6866" text-anchor="middle" font-size="20.1085" fill="var(--text)" font-family="Arial, sans-serif">Generate matching surface normals</text>
</svg>
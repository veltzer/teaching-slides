<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.70427269575" fill="var(--text-muted)" font-family="Arial, sans-serif">Adds spatial control to diffusion models</text>
  <rect x="40" y="77.419393184184" width="500" height="84.193607648285" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="129.806478803331" text-anchor="middle" font-size="24.70427269575" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Text Prompt</text>
  <text x="590" y="129.806478803331" font-size="34.205988008483" fill="var(--text)" font-family="Arial, sans-serif">+</text>
  <rect x="659.9999" y="77.419393184184" width="500" height="84.193607648285" rx="6.237245153485" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="909.9998" y="129.806478803331" text-anchor="middle" font-size="24.70427269575" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Control Signal</text>
  <rect x="40" y="208.38710723205" width="399.9999" height="74.838678303849" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="255.161321696151" text-anchor="middle" font-size="22.804095959741" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Control Type</text>
  <rect x="440" y="208.38710723205" width="800" height="74.838678303849" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="839.9998" y="255.161321696151" text-anchor="middle" font-size="22.804095959741" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Function</text>
  <rect x="40" y="283.225893600419" width="399.9999" height="56.129035744017" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="320.645178720084" text-anchor="middle" font-size="20.903607361474" fill="var(--text)" font-family="Arial, sans-serif">Canny Edge</text>
  <rect x="440" y="283.225893600419" width="800" height="56.129035744017" rx="6.237245153485" fill="var(--bg)" stroke="var(--border)"/>
  <text x="839.9998" y="320.645178720084" text-anchor="middle" font-size="20.903607361474" fill="var(--text)" font-family="Arial, sans-serif">Generate from edge map</text>
  <rect x="40" y="339.354821279916" width="399.9999" height="56.129035744017" rx="6.237245153485" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="376.77432252862" text-anchor="middle" font-size="20.903607361474" fill="var(--text)" font-family="Arial, sans-serif">Depth Map</text>
  <rect x="440" y="339.354821279916" width="800" height="56.129035744017" rx="6.237245153485" fill="var(--bg)" stroke="var(--border)"/>
  <text x="839.9998" y="376.77432252862" text-anchor="middle" font-size="20.903607361474" fill="var(--text)" font-family="Arial, sans-serif">Generate matching depth</text>
  <rect x="40" y="395.483857023933" width="399.9999" height="56.129035744017" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="432.903250208117" text-anchor="middle" font-size="20.903607361474" fill="var(--text)" font-family="Arial, sans-serif">Pose</text>
  <rect x="440" y="395.483857023933" width="800" height="56.129035744017" rx="6.237245153485" fill="var(--bg)" stroke="var(--border)"/>
  <text x="839.9998" y="432.903250208117" text-anchor="middle" font-size="20.903607361474" fill="var(--text)" font-family="Arial, sans-serif">Generate matching human pose</text>
  <rect x="40" y="451.61289276795" width="399.9999" height="56.129035744017" rx="6.237245153485" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="489.032285952134" text-anchor="middle" font-size="20.903607361474" fill="var(--text)" font-family="Arial, sans-serif">Segmentation</text>
  <rect x="440" y="451.61289276795" width="800" height="56.129035744017" rx="6.237245153485" fill="var(--bg)" stroke="var(--border)"/>
  <text x="839.9998" y="489.032285952134" text-anchor="middle" font-size="20.903607361474" fill="var(--text)" font-family="Arial, sans-serif">Generate from semantic map</text>
  <rect x="40" y="507.741928511966" width="399.9999" height="56.129035744017" rx="6.237245153485" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="545.161429760671" text-anchor="middle" font-size="20.903607361474" fill="var(--text)" font-family="Arial, sans-serif">Scribble</text>
  <rect x="440" y="507.741928511966" width="800" height="56.129035744017" rx="6.237245153485" fill="var(--bg)" stroke="var(--border)"/>
  <text x="839.9998" y="545.161429760671" text-anchor="middle" font-size="20.903607361474" fill="var(--text)" font-family="Arial, sans-serif">Generate from rough sketch</text>
  <rect x="40" y="563.870964255983" width="399.9999" height="56.129035744017" rx="6.237245153485" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="601.290357440168" text-anchor="middle" font-size="20.903607361474" fill="var(--text)" font-family="Arial, sans-serif">Normal Map</text>
  <rect x="440" y="563.870964255983" width="800" height="56.129035744017" rx="6.237245153485" fill="var(--bg)" stroke="var(--border)"/>
  <text x="839.9998" y="601.290357440168" text-anchor="middle" font-size="20.903607361474" fill="var(--text)" font-family="Arial, sans-serif">Generate matching surface normals</text>
</svg>

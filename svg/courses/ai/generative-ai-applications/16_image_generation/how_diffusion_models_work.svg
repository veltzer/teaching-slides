<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">How Diffusion Models Work</text>
  <!-- Forward process -->
  <rect x="20" y="50" width="710" height="150" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="375" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">FORWARD PROCESS (adding noise)</text>
  <!-- Steps -->
  <rect x="50" y="90" width="120" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="110" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Step 0</text>
  <text x="110" y="140" text-anchor="middle" font-size="11" fill="#28a745">Clear image</text>
  <rect x="210" y="90" width="120" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="270" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Step 100</text>
  <text x="270" y="140" text-anchor="middle" font-size="11" fill="#856404">Faint noise</text>
  <rect x="370" y="90" width="120" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="430" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Step 500</text>
  <text x="430" y="140" text-anchor="middle" font-size="11" fill="#856404">Barely visible</text>
  <rect x="530" y="90" width="120" height="80" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="590" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Step 1000</text>
  <text x="590" y="140" text-anchor="middle" font-size="11" fill="#dc3545">Pure noise</text>
  <!-- Arrows forward -->
  <line x1="170" y1="130" x2="205" y2="130" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="330" y1="130" x2="365" y2="130" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="490" y1="130" x2="525" y2="130" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowR)"/>
  <defs><marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#dc3545"/></marker></defs>
  <!-- Reverse process -->
  <rect x="20" y="220" width="710" height="160" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="375" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">REVERSE PROCESS (removing noise - learned by model)</text>
  <!-- Reverse steps -->
  <rect x="530" y="260" width="120" height="60" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="590" y="290" text-anchor="middle" font-size="11" fill="#333">Pure noise</text>
  <rect x="370" y="260" width="120" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="430" y="290" text-anchor="middle" font-size="11" fill="#333">Less noisy</text>
  <rect x="210" y="260" width="120" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="270" y="290" text-anchor="middle" font-size="11" fill="#333">Clearer</text>
  <rect x="50" y="260" width="120" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="110" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Clear image!</text>
  <!-- Arrows reverse -->
  <line x1="525" y1="290" x2="495" y2="290" stroke="#28a745" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="365" y1="290" x2="335" y2="290" stroke="#28a745" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="205" y1="290" x2="175" y2="290" stroke="#28a745" stroke-width="2" marker-end="url(#arrowG)"/>
  <defs><marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#28a745"/></marker></defs>
  <!-- Description -->
  <text x="375" y="350" text-anchor="middle" font-size="12" fill="#333">The model learns: given noisy image at step t,</text>
  <text x="375" y="368" text-anchor="middle" font-size="12" fill="#333">predict what the noise looks like, then subtract it.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="598.8304" y="50.5263" text-anchor="middle" font-size="28.7439" font-weight="bold" fill="var(--text)">How Diffusion Models Work</text>
  <rect x="31.9376" y="84.2105" width="1133.7855" height="252.6316" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="598.8304" y="126.3158" text-anchor="middle" font-size="22.3563" font-weight="bold" fill="var(--danger-accent)">FORWARD PROCESS (adding noise)</text>
  <rect x="79.844" y="151.5789" width="191.6257" height="134.7368" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="175.6569" y="202.1053" text-anchor="middle" font-size="19.1626" font-weight="bold" fill="var(--text)">Step 0</text>
  <text x="175.6569" y="235.7895" text-anchor="middle" font-size="17.5657" fill="var(--ok-accent)">Clear image</text>
  <rect x="335.345" y="151.5789" width="191.6257" height="134.7368" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="431.1579" y="202.1053" text-anchor="middle" font-size="19.1626" font-weight="bold" fill="var(--text)">Step 100</text>
  <text x="431.1579" y="235.7895" text-anchor="middle" font-size="17.5657" fill="var(--danger-accent)">Faint noise</text>
  <rect x="590.846" y="151.5789" width="191.6257" height="134.7368" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="686.6589" y="202.1053" text-anchor="middle" font-size="19.1626" font-weight="bold" fill="var(--text)">Step 500</text>
  <text x="686.6589" y="235.7895" text-anchor="middle" font-size="17.5657" fill="var(--danger-accent)">Barely visible</text>
  <rect x="846.3469" y="151.5789" width="191.6257" height="134.7368" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="942.1598" y="202.1053" text-anchor="middle" font-size="19.1626" font-weight="bold" fill="var(--text)">Step 1000</text>
  <text x="942.1598" y="235.7895" text-anchor="middle" font-size="17.5657" fill="var(--danger-accent)">Pure noise</text>
  <line x1="271.4698" y1="218.9474" x2="327.3607" y2="218.9474" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowR)" />
  <line x1="526.9708" y1="218.9474" x2="582.8616" y2="218.9474" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowR)" />
  <line x1="782.4718" y1="218.9474" x2="838.3626" y2="218.9474" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowR)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 13.6533 5.4 L 0 10.8" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="31.9376" y="370.5263" width="1133.7855" height="269.4737" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="598.8304" y="412.6316" text-anchor="middle" font-size="22.3563" font-weight="bold" fill="var(--ok-accent)">REVERSE PROCESS (removing noise - learned by model)</text>
  <rect x="846.3469" y="437.8947" width="191.6257" height="101.0526" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="942.1598" y="488.4211" text-anchor="middle" font-size="17.5657" fill="var(--text)">Pure noise</text>
  <rect x="590.846" y="437.8947" width="191.6257" height="101.0526" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="686.6589" y="488.4211" text-anchor="middle" font-size="17.5657" fill="var(--text)">Less noisy</text>
  <rect x="335.345" y="437.8947" width="191.6257" height="101.0526" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="431.1579" y="488.4211" text-anchor="middle" font-size="17.5657" fill="var(--text)">Clearer</text>
  <rect x="79.844" y="437.8947" width="191.6257" height="101.0526" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="175.6569" y="488.4211" text-anchor="middle" font-size="17.5657" font-weight="bold" fill="var(--ok-accent)">Clear image!</text>
  <line x1="838.3626" y1="488.4211" x2="790.4561" y2="488.4211" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowG)" />
  <line x1="582.8616" y1="488.4211" x2="534.9551" y2="488.4211" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowG)" />
  <line x1="327.3607" y1="488.4211" x2="279.4542" y2="488.4211" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowG)" />
  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 13.6533 5.4 L 0 10.8" fill="var(--ok-bright)" />
    </marker>
  </defs>
  <text x="598.8304" y="589.4737" text-anchor="middle" font-size="19.1626" fill="var(--text)">The model learns: given noisy image at step t,</text>
  <text x="598.8304" y="619.7895" text-anchor="middle" font-size="19.1626" fill="var(--text)">predict what the noise looks like, then subtract it.</text>
</svg>
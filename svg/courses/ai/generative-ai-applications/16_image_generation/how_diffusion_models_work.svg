<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="54" text-anchor="middle" font-size="30.72" font-weight="bold" fill="#333">How Diffusion Models Work</text>
  <rect x="34.1333" y="90" width="1211.7333" height="270" rx="8.5333" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4133" />
  <text x="640" y="135" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#dc3545">FORWARD PROCESS (adding noise)</text>
  <rect x="85.3333" y="162" width="204.8" height="144" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="187.7333" y="216" text-anchor="middle" font-size="20.48" font-weight="bold" fill="#333">Step 0</text>
  <text x="187.7333" y="252" text-anchor="middle" font-size="18.7733" fill="#28a745">Clear image</text>
  <rect x="358.4" y="162" width="204.8" height="144" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="460.8" y="216" text-anchor="middle" font-size="20.48" font-weight="bold" fill="#333">Step 100</text>
  <text x="460.8" y="252" text-anchor="middle" font-size="18.7733" fill="#856404">Faint noise</text>
  <rect x="631.4667" y="162" width="204.8" height="144" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="733.8667" y="216" text-anchor="middle" font-size="20.48" font-weight="bold" fill="#333">Step 500</text>
  <text x="733.8667" y="252" text-anchor="middle" font-size="18.7733" fill="#856404">Barely visible</text>
  <rect x="904.5333" y="162" width="204.8" height="144" rx="8.5333" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4133" />
  <text x="1006.9333" y="216" text-anchor="middle" font-size="20.48" font-weight="bold" fill="#333">Step 1000</text>
  <text x="1006.9333" y="252" text-anchor="middle" font-size="18.7733" fill="#dc3545">Pure noise</text>
  <line x1="290.1333" y1="234" x2="349.8667" y2="234" stroke="#dc3545" stroke-width="3.4133" marker-end="url(#arrowR)" />
  <line x1="563.2" y1="234" x2="622.9333" y2="234" stroke="#dc3545" stroke-width="3.4133" marker-end="url(#arrowR)" />
  <line x1="836.2667" y1="234" x2="896" y2="234" stroke="#dc3545" stroke-width="3.4133" marker-end="url(#arrowR)" />
  <defs>
    <marker id="arrowR" markerWidth="13.6533" markerHeight="10.8" refX="13.6533" refY="5.4" orient="auto">
      <path d="M 0 0 L 13.6533 5.4 L 0 10.8" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="34.1333" y="396" width="1211.7333" height="288" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="640" y="441" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#28a745">REVERSE PROCESS (removing noise - learned by model)</text>
  <rect x="904.5333" y="468" width="204.8" height="108" rx="8.5333" fill="#f8d7da" stroke="#dc3545" stroke-width="2.56" />
  <text x="1006.9333" y="522" text-anchor="middle" font-size="18.7733" fill="#333">Pure noise</text>
  <rect x="631.4667" y="468" width="204.8" height="108" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="2.56" />
  <text x="733.8667" y="522" text-anchor="middle" font-size="18.7733" fill="#333">Less noisy</text>
  <rect x="358.4" y="468" width="204.8" height="108" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.56" />
  <text x="460.8" y="522" text-anchor="middle" font-size="18.7733" fill="#333">Clearer</text>
  <rect x="85.3333" y="468" width="204.8" height="108" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="187.7333" y="522" text-anchor="middle" font-size="18.7733" font-weight="bold" fill="#28a745">Clear image!</text>
  <line x1="896" y1="522" x2="844.8" y2="522" stroke="#28a745" stroke-width="3.4133" marker-end="url(#arrowG)" />
  <line x1="622.9333" y1="522" x2="571.7333" y2="522" stroke="#28a745" stroke-width="3.4133" marker-end="url(#arrowG)" />
  <line x1="349.8667" y1="522" x2="298.6667" y2="522" stroke="#28a745" stroke-width="3.4133" marker-end="url(#arrowG)" />
  <defs>
    <marker id="arrowG" markerWidth="13.6533" markerHeight="10.8" refX="13.6533" refY="5.4" orient="auto">
      <path d="M 0 0 L 13.6533 5.4 L 0 10.8" fill="#28a745" />
    </marker>
  </defs>
  <text x="640" y="630" text-anchor="middle" font-size="20.48" fill="#333">The model learns: given noisy image at step t,</text>
  <text x="640" y="662.4" text-anchor="middle" font-size="20.48" fill="#333">predict what the noise looks like, then subtract it.</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="28.7439" font-weight="bold" fill="#333">How Diffusion Models Work</ns0:text>
  <ns0:rect x="31.9376" y="84.2105" width="1133.7855" height="252.6316" rx="7.9844" fill="#f8d7da" stroke="#dc3545" stroke-width="3.1937" />
  <ns0:text x="598.8304" y="126.3158" text-anchor="middle" font-size="22.3563" font-weight="bold" fill="#dc3545">FORWARD PROCESS (adding noise)</ns0:text>
  <ns0:rect x="79.844" y="151.5789" width="191.6257" height="134.7368" rx="7.9844" fill="#d4edda" stroke="#28a745" stroke-width="3.1937" />
  <ns0:text x="175.6569" y="202.1053" text-anchor="middle" font-size="19.1626" font-weight="bold" fill="#333">Step 0</ns0:text>
  <ns0:text x="175.6569" y="235.7895" text-anchor="middle" font-size="17.5657" fill="#28a745">Clear image</ns0:text>
  <ns0:rect x="335.345" y="151.5789" width="191.6257" height="134.7368" rx="7.9844" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1937" />
  <ns0:text x="431.1579" y="202.1053" text-anchor="middle" font-size="19.1626" font-weight="bold" fill="#333">Step 100</ns0:text>
  <ns0:text x="431.1579" y="235.7895" text-anchor="middle" font-size="17.5657" fill="#bf360c">Faint noise</ns0:text>
  <ns0:rect x="590.846" y="151.5789" width="191.6257" height="134.7368" rx="7.9844" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1937" />
  <ns0:text x="686.6589" y="202.1053" text-anchor="middle" font-size="19.1626" font-weight="bold" fill="#333">Step 500</ns0:text>
  <ns0:text x="686.6589" y="235.7895" text-anchor="middle" font-size="17.5657" fill="#bf360c">Barely visible</ns0:text>
  <ns0:rect x="846.3469" y="151.5789" width="191.6257" height="134.7368" rx="7.9844" fill="#f8d7da" stroke="#dc3545" stroke-width="3.1937" />
  <ns0:text x="942.1598" y="202.1053" text-anchor="middle" font-size="19.1626" font-weight="bold" fill="#333">Step 1000</ns0:text>
  <ns0:text x="942.1598" y="235.7895" text-anchor="middle" font-size="17.5657" fill="#dc3545">Pure noise</ns0:text>
  <ns0:line x1="271.4698" y1="218.9474" x2="327.3607" y2="218.9474" stroke="#dc3545" stroke-width="3.1937" marker-end="url(#arrowR)" />
  <ns0:line x1="526.9708" y1="218.9474" x2="582.8616" y2="218.9474" stroke="#dc3545" stroke-width="3.1937" marker-end="url(#arrowR)" />
  <ns0:line x1="782.4718" y1="218.9474" x2="838.3626" y2="218.9474" stroke="#dc3545" stroke-width="3.1937" marker-end="url(#arrowR)" />
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowR" markerWidth="13.6533" markerHeight="10.8" refX="13.6533" refY="5.4" orient="auto">
      <ns0:path d="M 0 0 L 13.6533 5.4 L 0 10.8" fill="#dc3545" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="31.9376" y="370.5263" width="1133.7855" height="269.4737" rx="7.9844" fill="#d4edda" stroke="#28a745" stroke-width="3.1937" />
  <ns0:text x="598.8304" y="412.6316" text-anchor="middle" font-size="22.3563" font-weight="bold" fill="#28a745">REVERSE PROCESS (removing noise - learned by model)</ns0:text>
  <ns0:rect x="846.3469" y="437.8947" width="191.6257" height="101.0526" rx="7.9844" fill="#f8d7da" stroke="#dc3545" stroke-width="2.3953" />
  <ns0:text x="942.1598" y="488.4211" text-anchor="middle" font-size="17.5657" fill="#333">Pure noise</ns0:text>
  <ns0:rect x="590.846" y="437.8947" width="191.6257" height="101.0526" rx="7.9844" fill="#fff3cd" stroke="#ffc107" stroke-width="2.3953" />
  <ns0:text x="686.6589" y="488.4211" text-anchor="middle" font-size="17.5657" fill="#333">Less noisy</ns0:text>
  <ns0:rect x="335.345" y="437.8947" width="191.6257" height="101.0526" rx="7.9844" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.3953" />
  <ns0:text x="431.1579" y="488.4211" text-anchor="middle" font-size="17.5657" fill="#333">Clearer</ns0:text>
  <ns0:rect x="79.844" y="437.8947" width="191.6257" height="101.0526" rx="7.9844" fill="#d4edda" stroke="#28a745" stroke-width="3.1937" />
  <ns0:text x="175.6569" y="488.4211" text-anchor="middle" font-size="17.5657" font-weight="bold" fill="#28a745">Clear image!</ns0:text>
  <ns0:line x1="838.3626" y1="488.4211" x2="790.4561" y2="488.4211" stroke="#28a745" stroke-width="3.1937" marker-end="url(#arrowG)" />
  <ns0:line x1="582.8616" y1="488.4211" x2="534.9551" y2="488.4211" stroke="#28a745" stroke-width="3.1937" marker-end="url(#arrowG)" />
  <ns0:line x1="327.3607" y1="488.4211" x2="279.4542" y2="488.4211" stroke="#28a745" stroke-width="3.1937" marker-end="url(#arrowG)" />
  <ns0:defs>
    <ns0:marker id="arrowG" markerWidth="13.6533" markerHeight="10.8" refX="13.6533" refY="5.4" orient="auto">
      <ns0:path d="M 0 0 L 13.6533 5.4 L 0 10.8" fill="#28a745" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="598.8304" y="589.4737" text-anchor="middle" font-size="19.1626" fill="#333">The model learns: given noisy image at step t,</ns0:text>
  <ns0:text x="598.8304" y="619.7895" text-anchor="middle" font-size="19.1626" fill="#333">predict what the noise looks like, then subtract it.</ns0:text>
</ns0:svg>
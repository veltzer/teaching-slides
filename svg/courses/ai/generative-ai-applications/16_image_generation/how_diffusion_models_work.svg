<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="1200" height="263.63630578513" rx="6.179143483694" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="83.939525711648" text-anchor="middle" font-size="23.495472196673" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">FORWARD PROCESS (adding noise)</text>
  <rect x="90.7042" y="110.303007805328" width="202.8169" height="140.606015610657" rx="6.179143483694" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.1127" y="163.030396235068" text-anchor="middle" font-size="20.139064442055" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 0</text>
  <text x="192.1127" y="198.18195316803" text-anchor="middle" font-size="18.460706086159" fill="var(--ok-accent)" font-family="Arial, sans-serif">Clear image</text>
  <rect x="361.1268" y="110.303007805328" width="202.8169" height="140.606015610657" rx="6.179143483694" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="462.5353" y="163.030396235068" text-anchor="middle" font-size="20.139064442055" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 100</text>
  <text x="462.5353" y="198.18195316803" text-anchor="middle" font-size="18.460706086159" fill="var(--danger-accent)" font-family="Arial, sans-serif">Faint noise</text>
  <rect x="631.5494" y="110.303007805328" width="202.8169" height="140.606015610657" rx="6.179143483694" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="732.9578" y="163.030396235068" text-anchor="middle" font-size="20.139064442055" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 500</text>
  <text x="732.9578" y="198.18195316803" text-anchor="middle" font-size="18.460706086159" fill="var(--danger-accent)" font-family="Arial, sans-serif">Barely visible</text>
  <rect x="901.9718" y="110.303007805328" width="202.8169" height="140.606015610657" rx="6.179143483694" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1003.3803" y="163.030396235068" text-anchor="middle" font-size="20.139064442055" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 1000</text>
  <text x="1003.3803" y="198.18195316803" text-anchor="middle" font-size="18.460706086159" fill="var(--danger-accent)" font-family="Arial, sans-serif">Pure noise</text>
  <line x1="293.5212" y1="180.606121671252" x2="352.6762" y2="180.606121671252" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="563.9438" y1="180.606121671252" x2="623.0987" y2="180.606121671252" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="834.3663" y1="180.606121671252" x2="893.5212" y2="180.606121671252" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="338.787862718092" width="1200" height="281.212137281908" rx="6.179143483694" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="382.727282369145" text-anchor="middle" font-size="23.495472196673" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">REVERSE PROCESS (removing noise - learned by model)</text>
  <rect x="901.9718" y="409.09087052342" width="202.8169" height="105.454458677695" rx="6.179143483694" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1003.3803" y="461.81825895316" text-anchor="middle" font-size="18.460706086159" fill="var(--text)" font-family="Arial, sans-serif">Pure noise</text>
  <rect x="631.5494" y="409.09087052342" width="202.8169" height="105.454458677695" rx="6.179143483694" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="732.9578" y="461.81825895316" text-anchor="middle" font-size="18.460706086159" fill="var(--text)" font-family="Arial, sans-serif">Less noisy</text>
  <rect x="361.1268" y="409.09087052342" width="202.8169" height="105.454458677695" rx="6.179143483694" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="462.5353" y="461.81825895316" text-anchor="middle" font-size="18.460706086159" fill="var(--text)" font-family="Arial, sans-serif">Clearer</text>
  <rect x="90.7042" y="409.09087052342" width="202.8169" height="105.454458677695" rx="6.179143483694" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.1127" y="461.81825895316" text-anchor="middle" font-size="18.460706086159" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Clear image!</text>
  <line x1="893.5212" y1="461.81825895316" x2="842.8169" y2="461.81825895316" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="623.0987" y1="461.81825895316" x2="572.3944" y2="461.81825895316" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="352.6762" y1="461.81825895316" x2="301.9719" y2="461.81825895316" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
  </defs>
  <text x="640.0001" y="567.272717630855" text-anchor="middle" font-size="20.139064442055" fill="var(--text)" font-family="Arial, sans-serif">The model learns: given noisy image at step t,</text>
  <text x="640.0001" y="598.909108264461" text-anchor="middle" font-size="20.139064442055" fill="var(--text)" font-family="Arial, sans-serif">predict what the noise looks like, then subtract it.</text>
</svg>

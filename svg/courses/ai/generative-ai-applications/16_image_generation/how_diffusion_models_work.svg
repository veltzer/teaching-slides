<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640.0001" y="40" text-anchor="middle" font-size="29.3327" font-weight="bold" fill="var(--text)">How Diffusion Models Work</text>
  <rect x="40" y="73.1428" width="1200" height="248.5714" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="114.5715" text-anchor="middle" font-size="22.8143" font-weight="bold" fill="var(--danger-accent)">FORWARD PROCESS (adding noise)</text>
  <rect x="90.7042" y="139.4285" width="202.8169" height="132.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.1127" y="189.1429" text-anchor="middle" font-size="19.5552" font-weight="bold" fill="var(--text)">Step 0</text>
  <text x="192.1127" y="222.2858" text-anchor="middle" font-size="17.9255" fill="var(--ok-accent)">Clear image</text>
  <rect x="361.1268" y="139.4285" width="202.8169" height="132.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="462.5353" y="189.1429" text-anchor="middle" font-size="19.5552" font-weight="bold" fill="var(--text)">Step 100</text>
  <text x="462.5353" y="222.2858" text-anchor="middle" font-size="17.9255" fill="var(--danger-accent)">Faint noise</text>
  <rect x="631.5494" y="139.4285" width="202.8169" height="132.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="732.9578" y="189.1429" text-anchor="middle" font-size="19.5552" font-weight="bold" fill="var(--text)">Step 500</text>
  <text x="732.9578" y="222.2858" text-anchor="middle" font-size="17.9255" fill="var(--danger-accent)">Barely visible</text>
  <rect x="901.9718" y="139.4285" width="202.8169" height="132.5714" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1003.3803" y="189.1429" text-anchor="middle" font-size="19.5552" font-weight="bold" fill="var(--text)">Step 1000</text>
  <text x="1003.3803" y="222.2858" text-anchor="middle" font-size="17.9255" fill="var(--danger-accent)">Pure noise</text>
  <line x1="293.5212" y1="205.7143" x2="352.6762" y2="205.7143" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowR)" />
  <line x1="563.9438" y1="205.7143" x2="623.0987" y2="205.7143" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowR)" />
  <line x1="834.3663" y1="205.7143" x2="893.5212" y2="205.7143" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrowR)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 13.6533 5.4 L 0 10.8" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="40" y="354.8571" width="1200" height="265.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="396.2857" text-anchor="middle" font-size="22.8143" font-weight="bold" fill="var(--ok-accent)">REVERSE PROCESS (removing noise - learned by model)</text>
  <rect x="901.9718" y="421.1428" width="202.8169" height="99.4285" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1003.3803" y="470.8572" text-anchor="middle" font-size="17.9255" fill="var(--text)">Pure noise</text>
  <rect x="631.5494" y="421.1428" width="202.8169" height="99.4285" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="732.9578" y="470.8572" text-anchor="middle" font-size="17.9255" fill="var(--text)">Less noisy</text>
  <rect x="361.1268" y="421.1428" width="202.8169" height="99.4285" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="462.5353" y="470.8572" text-anchor="middle" font-size="17.9255" fill="var(--text)">Clearer</text>
  <rect x="90.7042" y="421.1428" width="202.8169" height="99.4285" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.1127" y="470.8572" text-anchor="middle" font-size="17.9255" font-weight="bold" fill="var(--ok-accent)">Clear image!</text>
  <line x1="893.5212" y1="470.8572" x2="842.8169" y2="470.8572" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowG)" />
  <line x1="623.0987" y1="470.8572" x2="572.3944" y2="470.8572" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowG)" />
  <line x1="352.6762" y1="470.8572" x2="301.9719" y2="470.8572" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowG)" />
  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 13.6533 5.4 L 0 10.8" fill="var(--ok-bright)" />
    </marker>
  </defs>
  <text x="640.0001" y="570.2857" text-anchor="middle" font-size="19.5552" fill="var(--text)">The model learns: given noisy image at step t,</text>
  <text x="640.0001" y="600.1143" text-anchor="middle" font-size="19.5552" fill="var(--text)">predict what the noise looks like, then subtract it.</text>
</svg>
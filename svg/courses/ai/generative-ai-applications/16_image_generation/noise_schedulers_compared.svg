<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Arial, sans-serif">
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Noise Schedulers Compared</text>
  <!-- Header -->
  <rect x="20" y="50" width="160" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="100" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Scheduler</text>
  <rect x="185" y="50" width="80" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="225" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Steps</text>
  <rect x="270" y="50" width="120" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="330" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Quality</text>
  <rect x="395" y="50" width="120" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="455" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Speed</text>
  <!-- Rows -->
  <rect x="20" y="85" width="160" height="30" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="100" y="105" text-anchor="middle" font-size="11" fill="#333">DDPM</text>
  <rect x="185" y="85" width="80" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="225" y="105" text-anchor="middle" font-size="11" fill="#333">1000</text>
  <rect x="270" y="85" width="120" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="330" y="105" text-anchor="middle" font-size="11" fill="#333">5/5</text>
  <rect x="395" y="85" width="120" height="30" rx="3" fill="#f8d7da" stroke="#dc3545"/>
  <text x="455" y="105" text-anchor="middle" font-size="11" fill="#dc3545">Slowest</text>

  <rect x="20" y="120" width="160" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="100" y="140" text-anchor="middle" font-size="11" fill="#333">DDIM</text>
  <rect x="185" y="120" width="80" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="225" y="140" text-anchor="middle" font-size="11" fill="#333">50</text>
  <rect x="270" y="120" width="120" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="330" y="140" text-anchor="middle" font-size="11" fill="#333">4/5</text>
  <rect x="395" y="120" width="120" height="30" rx="3" fill="#fff3cd" stroke="#ffc107"/>
  <text x="455" y="140" text-anchor="middle" font-size="11" fill="#333">Medium</text>

  <rect x="20" y="155" width="160" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="100" y="175" text-anchor="middle" font-size="11" fill="#333">PNDM</text>
  <rect x="185" y="155" width="80" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="225" y="175" text-anchor="middle" font-size="11" fill="#333">50</text>
  <rect x="270" y="155" width="120" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="330" y="175" text-anchor="middle" font-size="11" fill="#333">4/5</text>
  <rect x="395" y="155" width="120" height="30" rx="3" fill="#fff3cd" stroke="#ffc107"/>
  <text x="455" y="175" text-anchor="middle" font-size="11" fill="#333">Medium</text>

  <rect x="20" y="190" width="160" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="100" y="210" text-anchor="middle" font-size="11" fill="#333">Euler</text>
  <rect x="185" y="190" width="80" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="225" y="210" text-anchor="middle" font-size="11" fill="#333">30</text>
  <rect x="270" y="190" width="120" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="330" y="210" text-anchor="middle" font-size="11" fill="#333">4/5</text>
  <rect x="395" y="190" width="120" height="30" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="455" y="210" text-anchor="middle" font-size="11" fill="#333">Fast</text>

  <rect x="20" y="225" width="160" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="100" y="245" text-anchor="middle" font-size="11" fill="#333">Euler Ancestral</text>
  <rect x="185" y="225" width="80" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="225" y="245" text-anchor="middle" font-size="11" fill="#333">30</text>
  <rect x="270" y="225" width="120" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="330" y="245" text-anchor="middle" font-size="11" fill="#333">4.5/5</text>
  <rect x="395" y="225" width="120" height="30" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="455" y="245" text-anchor="middle" font-size="11" fill="#333">Fast</text>

  <rect x="20" y="260" width="160" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="100" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">DPM++ 2M</text>
  <rect x="185" y="260" width="80" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="225" y="280" text-anchor="middle" font-size="11" fill="#333">20</text>
  <rect x="270" y="260" width="120" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="330" y="280" text-anchor="middle" font-size="11" fill="#333">4.5/5</text>
  <rect x="395" y="260" width="120" height="30" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="455" y="280" text-anchor="middle" font-size="11" fill="#28a745">Very fast</text>

  <rect x="20" y="295" width="160" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="100" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">DPM++ SDE</text>
  <rect x="185" y="295" width="80" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="225" y="315" text-anchor="middle" font-size="11" fill="#333">20</text>
  <rect x="270" y="295" width="120" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="330" y="315" text-anchor="middle" font-size="11" fill="#333">5/5</text>
  <rect x="395" y="295" width="120" height="30" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="455" y="315" text-anchor="middle" font-size="11" fill="#333">Fast</text>

  <rect x="20" y="330" width="160" height="30" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="100" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">LCM</text>
  <rect x="185" y="330" width="80" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="225" y="350" text-anchor="middle" font-size="11" fill="#333">4-8</text>
  <rect x="270" y="330" width="120" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="330" y="350" text-anchor="middle" font-size="11" fill="#333">3.5/5</text>
  <rect x="395" y="330" width="120" height="30" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="455" y="350" text-anchor="middle" font-size="11" fill="#28a745" font-weight="bold">Fastest</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="617.6508" y="54.8571" text-anchor="middle" font-size="29.6472" font-weight="bold" fill="var(--text)">Latent Diffusion: Why It's Efficient</text>
  <rect x="49.4121" y="91.4285" width="510.5914" height="109.7143" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="304.7077" y="133.4857" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="var(--danger-accent)">Pixel-space diffusion</text>
  <text x="304.7077" y="170.0571" text-anchor="middle" font-size="18.1177" fill="var(--text)">512x512x3 = 786,432 values (expensive!)</text>
  <rect x="625.8861" y="91.4285" width="560.0034" height="109.7143" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="905.8879" y="133.4857" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="var(--ok-accent)">Latent-space diffusion</text>
  <text x="905.8879" y="170.0571" text-anchor="middle" font-size="18.1177" fill="var(--text)">64x64x4 = 16,384 values (48x less!)</text>
  <rect x="49.4121" y="256" width="280.0017" height="182.8572" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="189.4129" y="320" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="var(--text)">Original Image</text>
  <text x="189.4129" y="356.5714" text-anchor="middle" font-size="18.1177" fill="var(--text-muted)">512 x 512 x 3</text>
  <line x1="329.4137" y1="347.4286" x2="428.2378" y2="347.4286" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrB)" />
  <text x="378.8258" y="329.1428" text-anchor="middle" font-size="16.4707" fill="var(--primary-accent)">VAE Enc</text>
  <rect x="436.4733" y="256" width="312.9431" height="182.8572" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="592.9448" y="310.8572" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="var(--ok-accent)">Latent Space</text>
  <text x="592.9448" y="347.4286" text-anchor="middle" font-size="18.1177" fill="var(--text)">64 x 64 x 4</text>
  <text x="592.9448" y="393.1428" text-anchor="middle" font-size="19.7648" font-weight="bold" fill="var(--ok-accent)">Diffusion happens HERE</text>
  <line x1="749.4163" y1="347.4286" x2="848.2404" y2="347.4286" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrB)" />
  <text x="798.8283" y="329.1428" text-anchor="middle" font-size="16.4707" fill="var(--primary-accent)">VAE Dec</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 13.6533 5.6842 L 0 11.3684" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="856.4758" y="256" width="312.9431" height="182.8572" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1012.9473" y="320" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="var(--text)">Reconstructed</text>
  <text x="1012.9473" y="356.5714" text-anchor="middle" font-size="18.1177" fill="var(--text-muted)">512 x 512 x 3</text>
  <rect x="131.7655" y="512" width="971.7705" height="128" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="617.6508" y="566.8571" text-anchor="middle" font-size="21.4119" fill="var(--text)">The diffusion process operates entirely in latent space.</text>
  <text x="617.6508" y="612.5714" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="var(--text)">This is why it's called "Latent Diffusion Model" (LDM).</text>
</svg>
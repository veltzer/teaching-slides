<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="617.6508" y="54.8571" text-anchor="middle" font-size="29.6472" font-weight="bold" fill="#333">Latent Diffusion: Why It's Efficient</ns0:text>
  <ns0:rect x="49.4121" y="91.4285" width="510.5914" height="109.7143" rx="8.2353" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2941" />
  <ns0:text x="304.7077" y="133.4857" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="#dc3545">Pixel-space diffusion</ns0:text>
  <ns0:text x="304.7077" y="170.0571" text-anchor="middle" font-size="18.1177" fill="#333">512x512x3 = 786,432 values (expensive!)</ns0:text>
  <ns0:rect x="625.8861" y="91.4285" width="560.0034" height="109.7143" rx="8.2353" fill="#d4edda" stroke="#28a745" stroke-width="3.2941" />
  <ns0:text x="905.8879" y="133.4857" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="#28a745">Latent-space diffusion</ns0:text>
  <ns0:text x="905.8879" y="170.0571" text-anchor="middle" font-size="18.1177" fill="#333">64x64x4 = 16,384 values (48x less!)</ns0:text>
  <ns0:rect x="49.4121" y="256" width="280.0017" height="182.8572" rx="8.2353" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2941" />
  <ns0:text x="189.4129" y="320" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="#333">Original Image</ns0:text>
  <ns0:text x="189.4129" y="356.5714" text-anchor="middle" font-size="18.1177" fill="#666">512 x 512 x 3</ns0:text>
  <ns0:line x1="329.4137" y1="347.4286" x2="428.2378" y2="347.4286" stroke="#4a90e2" stroke-width="3.2941" marker-end="url(#arrB)" />
  <ns0:text x="378.8258" y="329.1428" text-anchor="middle" font-size="16.4707" fill="#4a90e2">VAE Enc</ns0:text>
  <ns0:rect x="436.4733" y="256" width="312.9431" height="182.8572" rx="8.2353" fill="#d4edda" stroke="#28a745" stroke-width="3.2941" />
  <ns0:text x="592.9448" y="310.8572" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="#28a745">Latent Space</ns0:text>
  <ns0:text x="592.9448" y="347.4286" text-anchor="middle" font-size="18.1177" fill="#333">64 x 64 x 4</ns0:text>
  <ns0:text x="592.9448" y="393.1428" text-anchor="middle" font-size="19.7648" font-weight="bold" fill="#28a745">Diffusion happens HERE</ns0:text>
  <ns0:line x1="749.4163" y1="347.4286" x2="848.2404" y2="347.4286" stroke="#4a90e2" stroke-width="3.2941" marker-end="url(#arrB)" />
  <ns0:text x="798.8283" y="329.1428" text-anchor="middle" font-size="16.4707" fill="#4a90e2">VAE Dec</ns0:text>
  <ns0:defs>
    <ns0:marker id="arrB" markerWidth="13.1765" markerHeight="10.9714" refX="13.1765" refY="5.4857" orient="auto">
      <ns0:path d="M 0 0 L 13.1765 5.4857 L 0 10.9714" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="856.4758" y="256" width="312.9431" height="182.8572" rx="8.2353" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2941" />
  <ns0:text x="1012.9473" y="320" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="#333">Reconstructed</ns0:text>
  <ns0:text x="1012.9473" y="356.5714" text-anchor="middle" font-size="18.1177" fill="#666">512 x 512 x 3</ns0:text>
  <ns0:rect x="131.7655" y="512" width="971.7705" height="128" rx="8.2353" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2941" />
  <ns0:text x="617.6508" y="566.8571" text-anchor="middle" font-size="21.4119" fill="#333">The diffusion process operates entirely in latent space.</ns0:text>
  <ns0:text x="617.6508" y="612.5714" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="#333">This is why it's called "Latent Diffusion Model" (LDM).</ns0:text>
</ns0:svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="617.6508" y="54.8571" text-anchor="middle" font-size="29.6472" font-weight="bold" fill="var(--text-dark)">Latent Diffusion: Why It's Efficient</ns0:text>
  <ns0:rect x="49.4121" y="91.4285" width="510.5914" height="109.7143" rx="8.2353" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.2941" />
  <ns0:text x="304.7077" y="133.4857" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="var(--danger-bright)">Pixel-space diffusion</ns0:text>
  <ns0:text x="304.7077" y="170.0571" text-anchor="middle" font-size="18.1177" fill="var(--text-dark)">512x512x3 = 786,432 values (expensive!)</ns0:text>
  <ns0:rect x="625.8861" y="91.4285" width="560.0034" height="109.7143" rx="8.2353" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.2941" />
  <ns0:text x="905.8879" y="133.4857" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="var(--ok-bright)">Latent-space diffusion</ns0:text>
  <ns0:text x="905.8879" y="170.0571" text-anchor="middle" font-size="18.1177" fill="var(--text-dark)">64x64x4 = 16,384 values (48x less!)</ns0:text>
  <ns0:rect x="49.4121" y="256" width="280.0017" height="182.8572" rx="8.2353" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.2941" />
  <ns0:text x="189.4129" y="320" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="var(--text-dark)">Original Image</ns0:text>
  <ns0:text x="189.4129" y="356.5714" text-anchor="middle" font-size="18.1177" fill="var(--text-mid)">512 x 512 x 3</ns0:text>
  <ns0:line x1="329.4137" y1="347.4286" x2="428.2378" y2="347.4286" stroke="var(--primary-bright)" stroke-width="3.2941" marker-end="url(#arrB)" />
  <ns0:text x="378.8258" y="329.1428" text-anchor="middle" font-size="16.4707" fill="var(--primary-bright)">VAE Enc</ns0:text>
  <ns0:rect x="436.4733" y="256" width="312.9431" height="182.8572" rx="8.2353" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.2941" />
  <ns0:text x="592.9448" y="310.8572" text-anchor="middle" font-size="21.4119" font-weight="bold" fill="var(--ok-bright)">Latent Space</ns0:text>
  <ns0:text x="592.9448" y="347.4286" text-anchor="middle" font-size="18.1177" fill="var(--text-dark)">64 x 64 x 4</ns0:text>
  <ns0:text x="592.9448" y="393.1428" text-anchor="middle" font-size="19.7648" font-weight="bold" fill="var(--ok-bright)">Diffusion happens HERE</ns0:text>
  <ns0:line x1="749.4163" y1="347.4286" x2="848.2404" y2="347.4286" stroke="var(--primary-bright)" stroke-width="3.2941" marker-end="url(#arrB)" />
  <ns0:text x="798.8283" y="329.1428" text-anchor="middle" font-size="16.4707" fill="var(--primary-bright)">VAE Dec</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 380" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Latent Diffusion: Why It's Efficient</text>
  <!-- Comparison -->
  <rect x="30" y="50" width="310" height="60" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="185" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Pixel-space diffusion</text>
  <text x="185" y="93" text-anchor="middle" font-size="11" fill="#333">512x512x3 = 786,432 values (expensive!)</text>
  <rect x="380" y="50" width="340" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="550" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Latent-space diffusion</text>
  <text x="550" y="93" text-anchor="middle" font-size="11" fill="#333">64x64x4 = 16,384 values (48x less!)</text>
  <!-- Pipeline diagram -->
  <rect x="30" y="140" width="170" height="100" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="115" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Original Image</text>
  <text x="115" y="195" text-anchor="middle" font-size="11" fill="#666">512 x 512 x 3</text>
  <!-- Arrow -->
  <line x1="200" y1="190" x2="260" y2="190" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="230" y="180" text-anchor="middle" font-size="10" fill="#4a90e2">VAE Enc</text>
  <!-- Latent -->
  <rect x="265" y="140" width="190" height="100" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="360" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Latent Space</text>
  <text x="360" y="190" text-anchor="middle" font-size="11" fill="#333">64 x 64 x 4</text>
  <text x="360" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Diffusion happens HERE</text>
  <!-- Arrow -->
  <line x1="455" y1="190" x2="515" y2="190" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="485" y="180" text-anchor="middle" font-size="10" fill="#4a90e2">VAE Dec</text>
  <defs><marker id="arrB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a90e2"/></marker></defs>
  <!-- Reconstructed -->
  <rect x="520" y="140" width="190" height="100" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="615" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Reconstructed</text>
  <text x="615" y="195" text-anchor="middle" font-size="11" fill="#666">512 x 512 x 3</text>
  <!-- Explanation -->
  <rect x="80" y="280" width="590" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="375" y="310" text-anchor="middle" font-size="13" fill="#333">The diffusion process operates entirely in latent space.</text>
  <text x="375" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">This is why it's called "Latent Diffusion Model" (LDM).</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="539.1305" height="116" rx="6.196773353932" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="309.5652" y="84.466666666667" text-anchor="middle" font-size="22.623696558314" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Pixel-space diffusion</text>
  <text x="309.5652" y="123.133333333333" text-anchor="middle" font-size="19.143072244966" fill="var(--text)" font-family="Arial, sans-serif">512x512x3 = 786,432 values (expensive!)</text>
  <rect x="648.6956" y="40" width="591.3044" height="116" rx="6.196773353932" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="944.3479" y="84.466666666667" text-anchor="middle" font-size="22.623696558314" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Latent-space diffusion</text>
  <text x="944.3479" y="123.133333333333" text-anchor="middle" font-size="19.143072244966" fill="var(--text)" font-family="Arial, sans-serif">64x64x4 = 16,384 values (48x less!)</text>
  <rect x="40" y="214" width="295.6522" height="193.333333333333" rx="6.196773353932" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.826" y="281.666666666667" text-anchor="middle" font-size="22.623696558314" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Original Image</text>
  <text x="187.826" y="320.333333333333" text-anchor="middle" font-size="19.143072244966" fill="var(--text-muted)" font-family="Arial, sans-serif">512 x 512 x 3</text>
  <line x1="335.6521" y1="310.666666666667" x2="439.9999" y2="310.666666666667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="387.826" y="291.333333333333" text-anchor="middle" font-size="17.40281172807" fill="var(--primary-accent)" font-family="Arial, sans-serif">VAE Enc</text>
  <rect x="448.6957" y="214" width="330.4348" height="193.333333333333" rx="6.196773353932" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="613.9131" y="272.000106666667" text-anchor="middle" font-size="22.623696558314" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Latent Space</text>
  <text x="613.9131" y="310.666666666667" text-anchor="middle" font-size="19.143072244966" fill="var(--text)" font-family="Arial, sans-serif">64 x 64 x 4</text>
  <text x="613.9131" y="359" text-anchor="middle" font-size="20.883332761862" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Diffusion happens HERE</text>
  <line x1="779.1304" y1="310.666666666667" x2="883.4782" y2="310.666666666667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="831.3043" y="291.333333333333" text-anchor="middle" font-size="17.40281172807" fill="var(--primary-accent)" font-family="Arial, sans-serif">VAE Dec</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="892.174" y="214" width="330.4348" height="193.333333333333" rx="6.196773353932" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.3913" y="281.666666666667" text-anchor="middle" font-size="22.623696558314" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Reconstructed</text>
  <text x="1057.3913" y="320.333333333333" text-anchor="middle" font-size="19.143072244966" fill="var(--text-muted)" font-family="Arial, sans-serif">512 x 512 x 3</text>
  <rect x="126.9565" y="484.666666666667" width="1026.0869" height="135.333333333333" rx="6.196773353932" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="542.666666666667" text-anchor="middle" font-size="22.623696558314" fill="var(--text)" font-family="Arial, sans-serif">The diffusion process operates entirely in latent space.</text>
  <text x="640" y="591" text-anchor="middle" font-size="22.623696558314" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">This is why it's called "Latent Diffusion Model" (LDM).</text>
</svg>

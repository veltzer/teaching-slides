<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="30.3303" font-weight="bold" fill="var(--text)">Latent Diffusion: Why It's Efficient</text>
  <rect x="40" y="76.25" width="539.1305" height="108.75" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="309.5652" y="117.9375" text-anchor="middle" font-size="21.9053" font-weight="bold" fill="var(--danger-accent)">Pixel-space diffusion</text>
  <text x="309.5652" y="154.1875" text-anchor="middle" font-size="18.5352" fill="var(--text)">512x512x3 = 786,432 values (expensive!)</text>
  <rect x="648.6956" y="76.25" width="591.3044" height="108.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="944.3479" y="117.9375" text-anchor="middle" font-size="21.9053" font-weight="bold" fill="var(--ok-accent)">Latent-space diffusion</text>
  <text x="944.3479" y="154.1875" text-anchor="middle" font-size="18.5352" fill="var(--text)">64x64x4 = 16,384 values (48x less!)</text>
  <rect x="40" y="239.375" width="295.6522" height="181.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="187.826" y="302.8125" text-anchor="middle" font-size="21.9053" font-weight="bold" fill="var(--text)">Original Image</text>
  <text x="187.826" y="339.0625" text-anchor="middle" font-size="18.5352" fill="var(--text-muted)">512 x 512 x 3</text>
  <line x1="335.6521" y1="330" x2="439.9999" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrB)" />
  <text x="387.826" y="311.875" text-anchor="middle" font-size="16.8502" fill="var(--primary-accent)">VAE Enc</text>
  <rect x="448.6957" y="239.375" width="330.4348" height="181.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="613.9131" y="293.7501" text-anchor="middle" font-size="21.9053" font-weight="bold" fill="var(--ok-accent)">Latent Space</text>
  <text x="613.9131" y="330" text-anchor="middle" font-size="18.5352" fill="var(--text)">64 x 64 x 4</text>
  <text x="613.9131" y="375.3125" text-anchor="middle" font-size="20.2202" font-weight="bold" fill="var(--ok-accent)">Diffusion happens HERE</text>
  <line x1="779.1304" y1="330" x2="883.4782" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrB)" />
  <text x="831.3043" y="311.875" text-anchor="middle" font-size="16.8502" fill="var(--primary-accent)">VAE Dec</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 13.6533 5.6842 L 0 11.3684" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="892.174" y="239.375" width="330.4348" height="181.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1057.3913" y="302.8125" text-anchor="middle" font-size="21.9053" font-weight="bold" fill="var(--text)">Reconstructed</text>
  <text x="1057.3913" y="339.0625" text-anchor="middle" font-size="18.5352" fill="var(--text-muted)">512 x 512 x 3</text>
  <rect x="126.9565" y="493.125" width="1026.0869" height="126.875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="547.5" text-anchor="middle" font-size="21.9053" fill="var(--text)">The diffusion process operates entirely in latent space.</text>
  <text x="640" y="592.8125" text-anchor="middle" font-size="21.9053" font-weight="bold" fill="var(--text)">This is why it's called "Latent Diffusion Model" (LDM).</text>
</svg>
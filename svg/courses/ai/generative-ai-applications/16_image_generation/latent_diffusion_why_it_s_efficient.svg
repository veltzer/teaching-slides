<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="56.8421" text-anchor="middle" font-size="30.72" font-weight="bold" fill="#333">Latent Diffusion: Why It's Efficient</text>
  <rect x="51.2" y="94.7368" width="529.0667" height="113.6842" rx="8.5333" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4133" />
  <text x="315.7333" y="138.3158" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#dc3545">Pixel-space diffusion</text>
  <text x="315.7333" y="176.2105" text-anchor="middle" font-size="18.7733" fill="#333">512x512x3 = 786,432 values (expensive!)</text>
  <rect x="648.5333" y="94.7368" width="580.2667" height="113.6842" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="938.6667" y="138.3158" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#28a745">Latent-space diffusion</text>
  <text x="938.6667" y="176.2105" text-anchor="middle" font-size="18.7733" fill="#333">64x64x4 = 16,384 values (48x less!)</text>
  <rect x="51.2" y="265.2632" width="290.1333" height="189.4737" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="196.2667" y="331.5789" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#333">Original Image</text>
  <text x="196.2667" y="369.4737" text-anchor="middle" font-size="18.7733" fill="#666">512 x 512 x 3</text>
  <line x1="341.3333" y1="360" x2="443.7333" y2="360" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#arrB)" />
  <text x="392.5333" y="341.0526" text-anchor="middle" font-size="17.0667" fill="#4a90e2">VAE Enc</text>
  <rect x="452.2667" y="265.2632" width="324.2667" height="189.4737" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="614.4" y="322.1053" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#28a745">Latent Space</text>
  <text x="614.4" y="360" text-anchor="middle" font-size="18.7733" fill="#333">64 x 64 x 4</text>
  <text x="614.4" y="407.3684" text-anchor="middle" font-size="20.48" font-weight="bold" fill="#28a745">Diffusion happens HERE</text>
  <line x1="776.5333" y1="360" x2="878.9333" y2="360" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#arrB)" />
  <text x="827.7333" y="341.0526" text-anchor="middle" font-size="17.0667" fill="#4a90e2">VAE Dec</text>
  <defs>
    <marker id="arrB" markerWidth="13.6533" markerHeight="11.3684" refX="13.6533" refY="5.6842" orient="auto">
      <path d="M 0 0 L 13.6533 5.6842 L 0 11.3684" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="887.4667" y="265.2632" width="324.2667" height="189.4737" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="1049.6" y="331.5789" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#333">Reconstructed</text>
  <text x="1049.6" y="369.4737" text-anchor="middle" font-size="18.7733" fill="#666">512 x 512 x 3</text>
  <rect x="136.5333" y="530.5263" width="1006.9333" height="132.6316" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="640" y="587.3684" text-anchor="middle" font-size="22.1867" fill="#333">The diffusion process operates entirely in latent space.</text>
  <text x="640" y="634.7368" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#333">This is why it's called "Latent Diffusion Model" (LDM).</text>
</svg>
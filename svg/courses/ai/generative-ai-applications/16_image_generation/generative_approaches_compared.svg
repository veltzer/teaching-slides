<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="627.7395" y="44.1379" text-anchor="middle" font-size="26.4828" font-weight="bold" fill="var(--text)">Generative Approaches Compared</text>
  <rect x="33.4794" y="73.5632" width="217.6164" height="51.4943" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="142.2876" y="107.4023" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--bg)">Approach</text>
  <rect x="259.4656" y="73.5632" width="937.4242" height="51.4943" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="728.1778" y="107.4023" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--bg)">How It Works</text>
  <rect x="33.4794" y="132.4138" width="217.6164" height="95.6322" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="142.2876" y="173.6092" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text)">GANs</text>
  <text x="142.2876" y="205.977" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">(2014)</text>
  <rect x="259.4656" y="132.4138" width="937.4242" height="95.6322" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="284.5752" y="164.7816" font-size="16.1839" fill="var(--text)">Two networks compete: Generator creates, Discriminator judges.</text>
  <text x="284.5752" y="191.2644" font-size="16.1839" fill="var(--text)">Adversarial training. Fast inference, hard to train.</text>
  <rect x="33.4794" y="235.4023" width="217.6164" height="95.6322" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="142.2876" y="286.8966" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text)">VAEs</text>
  <rect x="259.4656" y="235.4023" width="937.4242" height="95.6322" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="284.5752" y="267.7701" font-size="16.1839" fill="var(--text)">Encode to latent space, decode back. Probabilistic, smooth latent space.</text>
  <text x="284.5752" y="294.2529" font-size="16.1839" fill="var(--text)">Often blurry outputs.</text>
  <rect x="33.4794" y="338.3908" width="217.6164" height="95.6322" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="142.2876" y="382.5287" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text)">Diffusion</text>
  <text x="142.2876" y="409.0115" text-anchor="middle" font-size="14.7126" fill="var(--ok-accent)">SOTA</text>
  <rect x="259.4656" y="338.3908" width="937.4242" height="95.6322" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="284.5752" y="370.7586" font-size="16.1839" fill="var(--text)">Gradually add noise, learn to reverse. High quality, slow inference.</text>
  <text x="284.5752" y="397.2414" font-size="16.1839" font-weight="bold" fill="var(--ok-accent)">Dominates current state-of-the-art.</text>
  <rect x="33.4794" y="441.3793" width="217.6164" height="95.6322" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="142.2876" y="485.5172" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text)">Autoregressive</text>
  <rect x="259.4656" y="441.3793" width="937.4242" height="95.6322" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="284.5752" y="473.7471" font-size="16.1839" fill="var(--text)">Generate pixels/tokens sequentially. Very slow but high quality.</text>
  <text x="284.5752" y="500.2299" font-size="16.1839" fill="var(--text)">Used in DALL-E 1.</text>
  <rect x="33.4794" y="544.3678" width="217.6164" height="95.6322" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="142.2876" y="592.9195" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text)">Flow-based</text>
  <rect x="259.4656" y="544.3678" width="937.4242" height="95.6322" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="284.5752" y="576.7356" font-size="16.1839" fill="var(--text)">Invertible transformations. Exact likelihood, good for editing.</text>
  <text x="284.5752" y="603.2184" font-size="16.1839" fill="var(--text)">Used in Flux, Stable Diffusion 3.</text>
</svg>
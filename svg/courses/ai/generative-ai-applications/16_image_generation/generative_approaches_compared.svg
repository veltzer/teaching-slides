<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="224.4605" height="52.727320543095" rx="6.153871266614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.2302" y="74.649382071177" text-anchor="middle" font-size="18.144074042485" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Approach</text>
  <rect x="273.0935" y="40" width="966.9065" height="52.727320543095" rx="6.153871266614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.5469" y="74.649382071177" text-anchor="middle" font-size="18.144074042485" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">How It Works</text>
  <rect x="40" y="100.259794906395" width="224.4605" height="97.922061528082" rx="6.153871266614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.2302" y="142.441546146061" text-anchor="middle" font-size="19.655977648171" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">GANs</text>
  <text x="152.2302" y="175.584433344578" text-anchor="middle" font-size="15.11995913755" fill="var(--text-muted)" font-family="Arial, sans-serif">(2014)</text>
  <rect x="273.0935" y="100.259794906395" width="966.9065" height="97.922061528082" rx="6.153871266614" fill="var(--bg)" stroke="var(--border)"/>
  <text x="298.9928" y="133.402576910102" font-size="16.632067872278" fill="var(--text)" font-family="Arial, sans-serif">Two networks compete: Generator creates, Discriminator judges.</text>
  <text x="298.9928" y="160.51948461798" font-size="16.632067872278" fill="var(--text)" font-family="Arial, sans-serif">Adversarial training. Fast inference, hard to train.</text>
  <rect x="40" y="205.714330797776" width="224.4605" height="97.922061528082" rx="6.153871266614" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.2302" y="258.441651340871" text-anchor="middle" font-size="19.655977648171" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">VAEs</text>
  <rect x="273.0935" y="205.714330797776" width="966.9065" height="97.922061528082" rx="6.153871266614" fill="var(--bg)" stroke="var(--border)"/>
  <text x="298.9928" y="238.857112801483" font-size="16.632067872278" fill="var(--text)" font-family="Arial, sans-serif">Encode to latent space, decode back. Probabilistic, smooth latent space.</text>
  <text x="298.9928" y="265.974020509361" font-size="16.632067872278" fill="var(--text)" font-family="Arial, sans-serif">Often blurry outputs.</text>
  <rect x="40" y="311.168866689157" width="224.4605" height="97.922061528082" rx="6.153871266614" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.2302" y="356.363607674143" text-anchor="middle" font-size="19.655977648171" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Diffusion</text>
  <text x="152.2302" y="383.48051538202" text-anchor="middle" font-size="15.11995913755" fill="var(--ok-accent)" font-family="Arial, sans-serif">SOTA</text>
  <rect x="273.0935" y="311.168866689157" width="966.9065" height="97.922061528082" rx="6.153871266614" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="298.9928" y="344.311648692864" font-size="16.632067872278" fill="var(--text)" font-family="Arial, sans-serif">Gradually add noise, learn to reverse. High quality, slow inference.</text>
  <text x="298.9928" y="371.428556400742" font-size="16.632067872278" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Dominates current state-of-the-art.</text>
  <rect x="40" y="416.623402580538" width="224.4605" height="97.922061528082" rx="6.153871266614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.2302" y="461.818143565524" text-anchor="middle" font-size="18.144074042485" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Autoregressive</text>
  <rect x="273.0935" y="416.623402580538" width="966.9065" height="97.922061528082" rx="6.153871266614" fill="var(--bg)" stroke="var(--border)"/>
  <text x="298.9928" y="449.766184584245" font-size="16.632067872278" fill="var(--text)" font-family="Arial, sans-serif">Generate pixels/tokens sequentially. Very slow but high quality.</text>
  <text x="298.9928" y="476.883092292122" font-size="16.632067872278" fill="var(--text)" font-family="Arial, sans-serif">Used in DALL-E 1.</text>
  <rect x="40" y="522.077938471919" width="224.4605" height="97.922061528082" rx="6.153871266614" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.2302" y="571.792164074884" text-anchor="middle" font-size="19.655977648171" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Flow-based</text>
  <rect x="273.0935" y="522.077938471919" width="966.9065" height="97.922061528082" rx="6.153871266614" fill="var(--bg)" stroke="var(--border)"/>
  <text x="298.9928" y="555.220720475626" font-size="16.632067872278" fill="var(--text)" font-family="Arial, sans-serif">Invertible transformations. Exact likelihood, good for editing.</text>
  <text x="298.9928" y="582.337628183503" font-size="16.632067872278" fill="var(--text)" font-family="Arial, sans-serif">Used in Flux, Stable Diffusion 3.</text>
</svg>

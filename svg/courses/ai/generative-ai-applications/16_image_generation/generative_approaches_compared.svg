<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:text x="627.7395" y="44.1379" text-anchor="middle" font-size="26.4828" font-weight="bold" fill="var(--text-dark)">Generative Approaches Compared</ns0:text>
  <ns0:rect x="33.4794" y="73.5632" width="217.6164" height="51.4943" rx="7.3563" fill="var(--primary-bright)" stroke="var(--primary-bright)" />
  <ns0:text x="142.2876" y="107.4023" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--bg)">Approach</ns0:text>
  <ns0:rect x="259.4656" y="73.5632" width="937.4242" height="51.4943" rx="7.3563" fill="var(--primary-bright)" stroke="var(--primary-bright)" />
  <ns0:text x="728.1778" y="107.4023" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--bg)">How It Works</ns0:text>
  <ns0:rect x="33.4794" y="132.4138" width="217.6164" height="95.6322" rx="7.3563" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9425" />
  <ns0:text x="142.2876" y="173.6092" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text-dark)">GANs</ns0:text>
  <ns0:text x="142.2876" y="205.977" text-anchor="middle" font-size="14.7126" fill="var(--text-mid)">(2014)</ns0:text>
  <ns0:rect x="259.4656" y="132.4138" width="937.4242" height="95.6322" rx="4.4138" fill="var(--bg)" stroke="var(--border-softer)" />
  <ns0:text x="284.5752" y="164.7816" font-size="16.1839" fill="var(--text-dark)">Two networks compete: Generator creates, Discriminator judges.</ns0:text>
  <ns0:text x="284.5752" y="191.2644" font-size="16.1839" fill="var(--text-dark)">Adversarial training. Fast inference, hard to train.</ns0:text>
  <ns0:rect x="33.4794" y="235.4023" width="217.6164" height="95.6322" rx="7.3563" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.9425" />
  <ns0:text x="142.2876" y="286.8966" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text-dark)">VAEs</ns0:text>
  <ns0:rect x="259.4656" y="235.4023" width="937.4242" height="95.6322" rx="4.4138" fill="var(--bg)" stroke="var(--border-softer)" />
  <ns0:text x="284.5752" y="267.7701" font-size="16.1839" fill="var(--text-dark)">Encode to latent space, decode back. Probabilistic, smooth latent space.</ns0:text>
  <ns0:text x="284.5752" y="294.2529" font-size="16.1839" fill="var(--text-dark)">Often blurry outputs.</ns0:text>
  <ns0:rect x="33.4794" y="338.3908" width="217.6164" height="95.6322" rx="7.3563" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9425" />
  <ns0:text x="142.2876" y="382.5287" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text-dark)">Diffusion</ns0:text>
  <ns0:text x="142.2876" y="409.0115" text-anchor="middle" font-size="14.7126" fill="var(--ok-bright)">SOTA</ns0:text>
  <ns0:rect x="259.4656" y="338.3908" width="937.4242" height="95.6322" rx="4.4138" fill="var(--ok-pale2)" stroke="var(--ok-bright)" />
  <ns0:text x="284.5752" y="370.7586" font-size="16.1839" fill="var(--text-dark)">Gradually add noise, learn to reverse. High quality, slow inference.</ns0:text>
  <ns0:text x="284.5752" y="397.2414" font-size="16.1839" font-weight="bold" fill="var(--ok-bright)">Dominates current state-of-the-art.</ns0:text>
  <ns0:rect x="33.4794" y="441.3793" width="217.6164" height="95.6322" rx="7.3563" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9425" />
  <ns0:text x="142.2876" y="485.5172" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text-dark)">Autoregressive</ns0:text>
  <ns0:rect x="259.4656" y="441.3793" width="937.4242" height="95.6322" rx="4.4138" fill="var(--bg)" stroke="var(--border-softer)" />
  <ns0:text x="284.5752" y="473.7471" font-size="16.1839" fill="var(--text-dark)">Generate pixels/tokens sequentially. Very slow but high quality.</ns0:text>
  <ns0:text x="284.5752" y="500.2299" font-size="16.1839" fill="var(--text-dark)">Used in DALL-E 1.</ns0:text>
  <ns0:rect x="33.4794" y="544.3678" width="217.6164" height="95.6322" rx="7.3563" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.9425" />
  <ns0:text x="142.2876" y="592.9195" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text-dark)">Flow-based</ns0:text>
  <ns0:rect x="259.4656" y="544.3678" width="937.4242" height="95.6322" rx="4.4138" fill="var(--bg)" stroke="var(--border-softer)" />
  <ns0:text x="284.5752" y="576.7356" font-size="16.1839" fill="var(--text-dark)">Invertible transformations. Exact likelihood, good for editing.</ns0:text>
  <ns0:text x="284.5752" y="603.2184" font-size="16.1839" fill="var(--text-dark)">Used in Flux, Stable Diffusion 3.</ns0:text>
</ns0:svg>
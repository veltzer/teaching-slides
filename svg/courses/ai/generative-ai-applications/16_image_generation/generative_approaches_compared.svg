<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Generative Approaches Compared</text>
  <!-- Header -->
  <rect x="20" y="50" width="130" height="35" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="85" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Approach</text>
  <rect x="155" y="50" width="560" height="35" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="435" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">How It Works</text>
  <!-- GANs -->
  <rect x="20" y="90" width="130" height="65" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">GANs</text>
  <text x="85" y="140" text-anchor="middle" font-size="10" fill="#666">(2014)</text>
  <rect x="155" y="90" width="560" height="65" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="170" y="112" font-size="11" fill="#333">Two networks compete: Generator creates, Discriminator judges.</text>
  <text x="170" y="130" font-size="11" fill="#333">Adversarial training. Fast inference, hard to train.</text>
  <!-- VAEs -->
  <rect x="20" y="160" width="130" height="65" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="85" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">VAEs</text>
  <rect x="155" y="160" width="560" height="65" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="170" y="182" font-size="11" fill="#333">Encode to latent space, decode back. Probabilistic, smooth latent space.</text>
  <text x="170" y="200" font-size="11" fill="#333">Often blurry outputs.</text>
  <!-- Diffusion -->
  <rect x="20" y="230" width="130" height="65" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="85" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Diffusion</text>
  <text x="85" y="278" text-anchor="middle" font-size="10" fill="#28a745">SOTA</text>
  <rect x="155" y="230" width="560" height="65" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="170" y="252" font-size="11" fill="#333">Gradually add noise, learn to reverse. High quality, slow inference.</text>
  <text x="170" y="270" font-size="11" font-weight="bold" fill="#28a745">Dominates current state-of-the-art.</text>
  <!-- Autoregressive -->
  <rect x="20" y="300" width="130" height="65" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Autoregressive</text>
  <rect x="155" y="300" width="560" height="65" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="170" y="322" font-size="11" fill="#333">Generate pixels/tokens sequentially. Very slow but high quality.</text>
  <text x="170" y="340" font-size="11" fill="#333">Used in DALL-E 1.</text>
  <!-- Flow-based -->
  <rect x="20" y="370" width="130" height="65" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="85" y="403" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Flow-based</text>
  <rect x="155" y="370" width="560" height="65" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="170" y="392" font-size="11" fill="#333">Invertible transformations. Exact likelihood, good for editing.</text>
  <text x="170" y="410" font-size="11" fill="#333">Used in Flux, Stable Diffusion 3.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="45" text-anchor="middle" font-size="27" font-weight="bold" fill="#333">Generative Approaches Compared</text>
  <rect x="34.1333" y="75" width="221.8667" height="52.5" rx="7.5" fill="#4a90e2" stroke="#4a90e2" />
  <text x="145.0667" y="109.5" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Approach</text>
  <rect x="264.5333" y="75" width="955.7333" height="52.5" rx="7.5" fill="#4a90e2" stroke="#4a90e2" />
  <text x="742.4" y="109.5" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">How It Works</text>
  <rect x="34.1333" y="135" width="221.8667" height="97.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="145.0667" y="177" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">GANs</text>
  <text x="145.0667" y="210" text-anchor="middle" font-size="15" fill="#666">(2014)</text>
  <rect x="264.5333" y="135" width="955.7333" height="97.5" rx="4.5" fill="#fff" stroke="#ddd" />
  <text x="290.1333" y="168" font-size="16.5" fill="#333">Two networks compete: Generator creates, Discriminator judges.</text>
  <text x="290.1333" y="195" font-size="16.5" fill="#333">Adversarial training. Fast inference, hard to train.</text>
  <rect x="34.1333" y="240" width="221.8667" height="97.5" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="145.0667" y="292.5" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">VAEs</text>
  <rect x="264.5333" y="240" width="955.7333" height="97.5" rx="4.5" fill="#fff" stroke="#ddd" />
  <text x="290.1333" y="273" font-size="16.5" fill="#333">Encode to latent space, decode back. Probabilistic, smooth latent space.</text>
  <text x="290.1333" y="300" font-size="16.5" fill="#333">Often blurry outputs.</text>
  <rect x="34.1333" y="345" width="221.8667" height="97.5" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="145.0667" y="390" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Diffusion</text>
  <text x="145.0667" y="417" text-anchor="middle" font-size="15" fill="#28a745">SOTA</text>
  <rect x="264.5333" y="345" width="955.7333" height="97.5" rx="4.5" fill="#d4edda" stroke="#28a745" />
  <text x="290.1333" y="378" font-size="16.5" fill="#333">Gradually add noise, learn to reverse. High quality, slow inference.</text>
  <text x="290.1333" y="405" font-size="16.5" font-weight="bold" fill="#28a745">Dominates current state-of-the-art.</text>
  <rect x="34.1333" y="450" width="221.8667" height="97.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="145.0667" y="495" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Autoregressive</text>
  <rect x="264.5333" y="450" width="955.7333" height="97.5" rx="4.5" fill="#fff" stroke="#ddd" />
  <text x="290.1333" y="483" font-size="16.5" fill="#333">Generate pixels/tokens sequentially. Very slow but high quality.</text>
  <text x="290.1333" y="510" font-size="16.5" fill="#333">Used in DALL-E 1.</text>
  <rect x="34.1333" y="555" width="221.8667" height="97.5" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="145.0667" y="604.5" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Flow-based</text>
  <rect x="264.5333" y="555" width="955.7333" height="97.5" rx="4.5" fill="#fff" stroke="#ddd" />
  <text x="290.1333" y="588" font-size="16.5" fill="#333">Invertible transformations. Exact likelihood, good for editing.</text>
  <text x="290.1333" y="615" font-size="16.5" fill="#333">Used in Flux, Stable Diffusion 3.</text>
</svg>
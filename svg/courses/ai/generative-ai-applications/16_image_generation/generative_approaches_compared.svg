<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="627.7395" y="44.1379" text-anchor="middle" font-size="26.4828" font-weight="bold" fill="#333">Generative Approaches Compared</ns0:text>
  <ns0:rect x="33.4794" y="73.5632" width="217.6164" height="51.4943" rx="7.3563" fill="#4a90e2" stroke="#4a90e2" />
  <ns0:text x="142.2876" y="107.4023" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#fff">Approach</ns0:text>
  <ns0:rect x="259.4656" y="73.5632" width="937.4242" height="51.4943" rx="7.3563" fill="#4a90e2" stroke="#4a90e2" />
  <ns0:text x="728.1778" y="107.4023" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#fff">How It Works</ns0:text>
  <ns0:rect x="33.4794" y="132.4138" width="217.6164" height="95.6322" rx="7.3563" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9425" />
  <ns0:text x="142.2876" y="173.6092" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">GANs</ns0:text>
  <ns0:text x="142.2876" y="205.977" text-anchor="middle" font-size="14.7126" fill="#666">(2014)</ns0:text>
  <ns0:rect x="259.4656" y="132.4138" width="937.4242" height="95.6322" rx="4.4138" fill="#fff" stroke="#ddd" />
  <ns0:text x="284.5752" y="164.7816" font-size="16.1839" fill="#333">Two networks compete: Generator creates, Discriminator judges.</ns0:text>
  <ns0:text x="284.5752" y="191.2644" font-size="16.1839" fill="#333">Adversarial training. Fast inference, hard to train.</ns0:text>
  <ns0:rect x="33.4794" y="235.4023" width="217.6164" height="95.6322" rx="7.3563" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9425" />
  <ns0:text x="142.2876" y="286.8966" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">VAEs</ns0:text>
  <ns0:rect x="259.4656" y="235.4023" width="937.4242" height="95.6322" rx="4.4138" fill="#fff" stroke="#ddd" />
  <ns0:text x="284.5752" y="267.7701" font-size="16.1839" fill="#333">Encode to latent space, decode back. Probabilistic, smooth latent space.</ns0:text>
  <ns0:text x="284.5752" y="294.2529" font-size="16.1839" fill="#333">Often blurry outputs.</ns0:text>
  <ns0:rect x="33.4794" y="338.3908" width="217.6164" height="95.6322" rx="7.3563" fill="#d4edda" stroke="#28a745" stroke-width="2.9425" />
  <ns0:text x="142.2876" y="382.5287" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">Diffusion</ns0:text>
  <ns0:text x="142.2876" y="409.0115" text-anchor="middle" font-size="14.7126" fill="#28a745">SOTA</ns0:text>
  <ns0:rect x="259.4656" y="338.3908" width="937.4242" height="95.6322" rx="4.4138" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="284.5752" y="370.7586" font-size="16.1839" fill="#333">Gradually add noise, learn to reverse. High quality, slow inference.</ns0:text>
  <ns0:text x="284.5752" y="397.2414" font-size="16.1839" font-weight="bold" fill="#28a745">Dominates current state-of-the-art.</ns0:text>
  <ns0:rect x="33.4794" y="441.3793" width="217.6164" height="95.6322" rx="7.3563" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9425" />
  <ns0:text x="142.2876" y="485.5172" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#333">Autoregressive</ns0:text>
  <ns0:rect x="259.4656" y="441.3793" width="937.4242" height="95.6322" rx="4.4138" fill="#fff" stroke="#ddd" />
  <ns0:text x="284.5752" y="473.7471" font-size="16.1839" fill="#333">Generate pixels/tokens sequentially. Very slow but high quality.</ns0:text>
  <ns0:text x="284.5752" y="500.2299" font-size="16.1839" fill="#333">Used in DALL-E 1.</ns0:text>
  <ns0:rect x="33.4794" y="544.3678" width="217.6164" height="95.6322" rx="7.3563" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9425" />
  <ns0:text x="142.2876" y="592.9195" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">Flow-based</ns0:text>
  <ns0:rect x="259.4656" y="544.3678" width="937.4242" height="95.6322" rx="4.4138" fill="#fff" stroke="#ddd" />
  <ns0:text x="284.5752" y="576.7356" font-size="16.1839" fill="#333">Invertible transformations. Exact likelihood, good for editing.</ns0:text>
  <ns0:text x="284.5752" y="603.2184" font-size="16.1839" fill="#333">Used in Flux, Stable Diffusion 3.</ns0:text>
</ns0:svg>
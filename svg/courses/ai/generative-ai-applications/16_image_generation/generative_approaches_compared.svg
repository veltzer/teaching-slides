<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="652.9498" y="40" text-anchor="middle" font-size="26.5356" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Generative Approaches Compared</text>
  <rect x="40" y="68.642" width="224.4605" height="50.1235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.2302" y="101.5803" text-anchor="middle" font-size="17.6904" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Approach</text>
  <rect x="273.0935" y="68.642" width="966.9065" height="50.1235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.5469" y="101.5803" text-anchor="middle" font-size="17.6904" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">How It Works</text>
  <rect x="40" y="125.926" width="224.4605" height="93.0864" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.2302" y="166.0247" text-anchor="middle" font-size="19.1645" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">GANs</text>
  <text x="152.2302" y="197.5309" text-anchor="middle" font-size="14.7419" fill="var(--text-muted)" font-family="Arial, sans-serif">(2014)</text>
  <rect x="273.0935" y="125.926" width="966.9065" height="93.0864" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="298.9928" y="157.4321" font-size="16.2162" fill="var(--text)" font-family="Arial, sans-serif">Two networks compete: Generator creates, Discriminator judges.</text>
  <text x="298.9928" y="183.2099" font-size="16.2162" fill="var(--text)" font-family="Arial, sans-serif">Adversarial training. Fast inference, hard to train.</text>
  <rect x="40" y="226.1729" width="224.4605" height="93.0864" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.2302" y="276.2964" text-anchor="middle" font-size="19.1645" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">VAEs</text>
  <rect x="273.0935" y="226.1729" width="966.9065" height="93.0864" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="298.9928" y="257.679" font-size="16.2162" fill="var(--text)" font-family="Arial, sans-serif">Encode to latent space, decode back. Probabilistic, smooth latent space.</text>
  <text x="298.9928" y="283.4568" font-size="16.2162" fill="var(--text)" font-family="Arial, sans-serif">Often blurry outputs.</text>
  <rect x="40" y="326.4198" width="224.4605" height="93.0864" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.2302" y="369.3827" text-anchor="middle" font-size="19.1645" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Diffusion</text>
  <text x="152.2302" y="395.1605" text-anchor="middle" font-size="14.7419" fill="var(--ok-accent)" font-family="Arial, sans-serif">SOTA</text>
  <rect x="273.0935" y="326.4198" width="966.9065" height="93.0864" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="298.9928" y="357.9259" font-size="16.2162" fill="var(--text)" font-family="Arial, sans-serif">Gradually add noise, learn to reverse. High quality, slow inference.</text>
  <text x="298.9928" y="383.7037" font-size="16.2162" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Dominates current state-of-the-art.</text>
  <rect x="40" y="426.6667" width="224.4605" height="93.0864" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.2302" y="469.6296" text-anchor="middle" font-size="17.6904" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Autoregressive</text>
  <rect x="273.0935" y="426.6667" width="966.9065" height="93.0864" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="298.9928" y="458.1728" font-size="16.2162" fill="var(--text)" font-family="Arial, sans-serif">Generate pixels/tokens sequentially. Very slow but high quality.</text>
  <text x="298.9928" y="483.9506" font-size="16.2162" fill="var(--text)" font-family="Arial, sans-serif">Used in DALL-E 1.</text>
  <rect x="40" y="526.9136" width="224.4605" height="93.0864" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.2302" y="574.1728" text-anchor="middle" font-size="19.1645" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Flow-based</text>
  <rect x="273.0935" y="526.9136" width="966.9065" height="93.0864" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="298.9928" y="558.4197" font-size="16.2162" fill="var(--text)" font-family="Arial, sans-serif">Invertible transformations. Exact likelihood, good for editing.</text>
  <text x="298.9928" y="584.1975" font-size="16.2162" fill="var(--text)" font-family="Arial, sans-serif">Used in Flux, Stable Diffusion 3.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">CLIP: Contrastive Language-Image Pre-training</text>
  <!-- Text encoder -->
  <rect x="80" y="60" width="160" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="160" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">"A dog"</text>
  <text x="160" y="110" text-anchor="middle" font-size="12" fill="#666">Text Encoder</text>
  <!-- Image encoder -->
  <rect x="440" y="60" width="160" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="520" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">[photo]</text>
  <text x="520" y="110" text-anchor="middle" font-size="12" fill="#666">Image Encoder</text>
  <!-- Arrows down -->
  <line x1="160" y1="130" x2="160" y2="170" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="520" y1="130" x2="520" y2="170" stroke="#28a745" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a90e2"/></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#28a745"/></marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#ffc107"/></marker>
  </defs>
  <!-- Embeddings -->
  <rect x="70" y="175" width="180" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="160" y="197" text-anchor="middle" font-size="11" fill="#333">[0.3, -0.1, ...]</text>
  <rect x="430" y="175" width="180" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="520" y="197" text-anchor="middle" font-size="11" fill="#333">[0.3, -0.1, ...]</text>
  <!-- Converge -->
  <line x1="160" y1="210" x2="300" y2="260" stroke="#ffc107" stroke-width="2"/>
  <line x1="520" y1="210" x2="380" y2="260" stroke="#ffc107" stroke-width="2"/>
  <!-- Cosine similarity -->
  <rect x="260" y="260" width="180" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="278" text-anchor="middle" font-size="12" fill="#333">Cosine Similarity</text>
  <text x="350" y="293" text-anchor="middle" font-size="10" fill="#666">(maximize for matching pairs)</text>
  <!-- Uses section -->
  <rect x="50" y="330" width="600" height="110" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Uses in Stable Diffusion</text>
  <text x="80" y="380" font-size="12" fill="#555">Text encoder: converts prompt to embedding</text>
  <text x="80" y="400" font-size="12" fill="#555">Guides the diffusion process toward the text description</text>
  <text x="80" y="420" font-size="12" fill="#555">Enables text-to-image generation</text>
</svg>
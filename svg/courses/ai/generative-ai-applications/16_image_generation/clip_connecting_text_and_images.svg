<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.0118" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CLIP: Contrastive Language-Image Pre-training</text>
  <rect x="99.9999" y="82.4391" width="320" height="99.0244" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="259.9999" y="124.8781" text-anchor="middle" font-size="20.2307" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">"A dog"</text>
  <text x="259.9999" y="153.1708" text-anchor="middle" font-size="18.6745" fill="var(--text-muted)" font-family="Arial, sans-serif">Text Encoder</text>
  <rect x="819.9999" y="82.4391" width="320" height="99.0244" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="979.9998" y="124.8781" text-anchor="middle" font-size="20.2307" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">[photo]</text>
  <text x="979.9998" y="153.1708" text-anchor="middle" font-size="18.6745" fill="var(--text-muted)" font-family="Arial, sans-serif">Image Encoder</text>
  <line x1="259.9999" y1="181.4635" x2="259.9999" y2="238.0489" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="979.9998" y1="181.4635" x2="979.9998" y2="238.0489" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="79.9999" y="245.1219" width="360" height="49.5122" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="259.9999" y="276.244" text-anchor="middle" font-size="17.1183" fill="var(--text)" font-family="Arial, sans-serif">[0.3, -0.1, ...]</text>
  <rect x="799.9999" y="245.1219" width="360" height="49.5122" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="979.9998" y="276.244" text-anchor="middle" font-size="17.1183" fill="var(--text)" font-family="Arial, sans-serif">[0.3, -0.1, ...]</text>
  <line x1="259.9999" y1="294.6342" x2="539.9999" y2="365.3659" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="979.9998" y1="294.6342" x2="699.9998" y2="365.3659" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="460" y="365.3659" width="360" height="56.5853" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="390.8293" text-anchor="middle" font-size="18.6745" fill="var(--text)" font-family="Arial, sans-serif">Cosine Similarity</text>
  <text x="639.9999" y="412.0489" text-anchor="middle" font-size="15.5622" fill="var(--text-muted)" font-family="Arial, sans-serif">(maximize for matching pairs)</text>
  <rect x="40" y="464.3903" width="1200" height="155.6097" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="499.7562" text-anchor="middle" font-size="21.7869" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Uses in Stable Diffusion</text>
  <text x="99.9999" y="535.122" font-size="18.6745" fill="var(--text-muted)" font-family="Arial, sans-serif">Text encoder: converts prompt to embedding</text>
  <text x="99.9999" y="563.4148" font-size="18.6745" fill="var(--text-muted)" font-family="Arial, sans-serif">Guides the diffusion process toward the text description</text>
  <text x="99.9999" y="591.7073" font-size="18.6745" fill="var(--text-muted)" font-family="Arial, sans-serif">Enables text-to-image generation</text>
</svg>
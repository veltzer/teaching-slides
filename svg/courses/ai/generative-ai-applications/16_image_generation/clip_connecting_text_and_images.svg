<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.0118" font-weight="bold" fill="var(--text)">CLIP: Contrastive Language-Image Pre-training</text>
  <rect x="99.9999" y="82.4391" width="320" height="99.0244" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="259.9999" y="124.8781" text-anchor="middle" font-size="20.2307" font-weight="bold" fill="var(--text)">"A dog"</text>
  <text x="259.9999" y="153.1708" text-anchor="middle" font-size="18.6745" fill="var(--text-muted)">Text Encoder</text>
  <rect x="819.9999" y="82.4391" width="320" height="99.0244" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="979.9998" y="124.8781" text-anchor="middle" font-size="20.2307" font-weight="bold" fill="var(--text)">[photo]</text>
  <text x="979.9998" y="153.1708" text-anchor="middle" font-size="18.6745" fill="var(--text-muted)">Image Encoder</text>
  <line x1="259.9999" y1="181.4635" x2="259.9999" y2="238.0489" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowBlue)" />
  <line x1="979.9998" y1="181.4635" x2="979.9998" y2="238.0489" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowGreen)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 14.6286 4.6957 L 0 9.3913" fill="#4a90e2" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 14.6286 4.6957 L 0 9.3913" fill="#28a745" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 14.6286 4.6957 L 0 9.3913" fill="#ffc107" />
    </marker>
  </defs>
  <rect x="79.9999" y="245.1219" width="360" height="49.5122" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="259.9999" y="276.244" text-anchor="middle" font-size="17.1183" fill="var(--text)">[0.3, -0.1, ...]</text>
  <rect x="799.9999" y="245.1219" width="360" height="49.5122" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="979.9998" y="276.244" text-anchor="middle" font-size="17.1183" fill="var(--text)">[0.3, -0.1, ...]</text>
  <line x1="259.9999" y1="294.6342" x2="539.9999" y2="365.3659" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="979.9998" y1="294.6342" x2="699.9998" y2="365.3659" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="460" y="365.3659" width="360" height="56.5853" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="390.8293" text-anchor="middle" font-size="18.6745" fill="var(--text)">Cosine Similarity</text>
  <text x="639.9999" y="412.0489" text-anchor="middle" font-size="15.5622" fill="var(--text-muted)">(maximize for matching pairs)</text>
  <rect x="40" y="464.3903" width="1200" height="155.6097" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="499.7562" text-anchor="middle" font-size="21.7869" font-weight="bold" fill="var(--text)">Uses in Stable Diffusion</text>
  <text x="99.9999" y="535.122" font-size="18.6745" fill="var(--text-muted)">Text encoder: converts prompt to embedding</text>
  <text x="99.9999" y="563.4148" font-size="18.6745" fill="var(--text-muted)">Guides the diffusion process toward the text description</text>
  <text x="99.9999" y="591.7073" font-size="18.6745" fill="var(--text-muted)">Enables text-to-image generation</text>
</svg>
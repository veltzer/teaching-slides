<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="99.9999" y="40" width="320" height="106.842130817178" rx="6.232343919139" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="259.9999" y="85.789453808861" text-anchor="middle" font-size="21.014113354155" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">"A dog"</text>
  <text x="259.9999" y="116.31579231302" text-anchor="middle" font-size="19.397651086327" fill="var(--text-muted)" font-family="Arial, sans-serif">Text Encoder</text>
  <rect x="819.9999" y="40" width="320" height="106.842130817178" rx="6.232343919139" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="979.9998" y="85.789453808861" text-anchor="middle" font-size="21.014113354155" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">[photo]</text>
  <text x="979.9998" y="116.31579231302" text-anchor="middle" font-size="19.397651086327" fill="var(--text-muted)" font-family="Arial, sans-serif">Image Encoder</text>
  <line x1="259.9999" y1="146.842130817178" x2="259.9999" y2="207.894807825495" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="979.9998" y1="146.842130817178" x2="979.9998" y2="207.894807825495" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="79.9999" y="215.526203635718" width="360" height="53.421065408589" rx="6.232343919139" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="259.9999" y="249.10531625347" text-anchor="middle" font-size="17.7811888185" fill="var(--text)" font-family="Arial, sans-serif">[0.3, -0.1, ...]</text>
  <rect x="799.9999" y="215.526203635718" width="360" height="53.421065408589" rx="6.232343919139" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="979.9998" y="249.10531625347" text-anchor="middle" font-size="17.7811888185" fill="var(--text)" font-family="Arial, sans-serif">[0.3, -0.1, ...]</text>
  <line x1="259.9999" y1="268.947376939059" x2="539.9999" y2="345.263169252079" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="979.9998" y1="268.947376939059" x2="699.9998" y2="345.263169252079" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="460" y="345.263169252079" width="360" height="61.052569113565" rx="6.232343919139" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="372.736841537396" text-anchor="middle" font-size="19.397651086327" fill="var(--text)" font-family="Arial, sans-serif">Cosine Similarity</text>
  <text x="639.9999" y="395.631676336579" text-anchor="middle" font-size="16.164830423071" fill="var(--text-muted)" font-family="Arial, sans-serif">(maximize for matching pairs)</text>
  <rect x="40" y="452.105300069257" width="1200" height="167.894699930743" rx="6.232343919139" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="490.263250173143" text-anchor="middle" font-size="22.630575621982" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Uses in Stable Diffusion</text>
  <text x="99.9999" y="528.421092382277" font-size="19.397651086327" fill="var(--text-muted)" font-family="Arial, sans-serif">Text encoder: converts prompt to embedding</text>
  <text x="99.9999" y="558.947538781188" font-size="19.397651086327" fill="var(--text-muted)" font-family="Arial, sans-serif">Guides the diffusion process toward the text description</text>
  <text x="99.9999" y="589.473661495842" font-size="19.397651086327" fill="var(--text-muted)" font-family="Arial, sans-serif">Enables text-to-image generation</text>
</svg>

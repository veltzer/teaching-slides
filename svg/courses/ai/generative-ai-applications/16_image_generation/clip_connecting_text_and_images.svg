<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="594.7475" y="43.6363" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="var(--text)">CLIP: Contrastive Language-Image Pre-training</text>
  <rect x="135.9423" y="87.2727" width="271.8846" height="101.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="271.8846" y="130.9091" text-anchor="middle" font-size="18.9091" font-weight="bold" fill="var(--text)">"A dog"</text>
  <text x="271.8846" y="160" text-anchor="middle" font-size="17.4545" fill="var(--text-muted)">Text Encoder</text>
  <rect x="747.6826" y="87.2727" width="271.8846" height="101.8182" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="883.6248" y="130.9091" text-anchor="middle" font-size="18.9091" font-weight="bold" fill="var(--text)">[photo]</text>
  <text x="883.6248" y="160" text-anchor="middle" font-size="17.4545" fill="var(--text-muted)">Image Encoder</text>
  <line x1="271.8846" y1="189.091" x2="271.8846" y2="247.2728" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowBlue)" />
  <line x1="883.6248" y1="189.091" x2="883.6248" y2="247.2728" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowGreen)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 14.6286 4.6957 L 0 9.3913" fill="#4a90e2" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 14.6286 4.6957 L 0 9.3913" fill="#28a745" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 14.6286 4.6957 L 0 9.3913" fill="#ffc107" />
    </marker>
  </defs>
  <rect x="118.9495" y="254.5454" width="305.8702" height="50.9091" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="271.8846" y="286.5455" text-anchor="middle" font-size="16" fill="var(--text)">[0.3, -0.1, ...]</text>
  <rect x="730.6898" y="254.5454" width="305.8702" height="50.9091" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="883.6248" y="286.5455" text-anchor="middle" font-size="16" fill="var(--text)">[0.3, -0.1, ...]</text>
  <line x1="271.8846" y1="305.4546" x2="509.7836" y2="378.1818" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="883.6248" y1="305.4546" x2="645.7258" y2="378.1818" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="441.8125" y="378.1818" width="305.8702" height="58.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="594.7475" y="404.3636" text-anchor="middle" font-size="17.4545" fill="var(--text)">Cosine Similarity</text>
  <text x="594.7475" y="426.1819" text-anchor="middle" font-size="14.5455" fill="var(--text-muted)">(maximize for matching pairs)</text>
  <rect x="84.964" y="480" width="1019.5672" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="594.7475" y="516.3637" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--text)">Uses in Stable Diffusion</text>
  <text x="135.9423" y="552.7273" font-size="17.4545" fill="var(--text-muted)">Text encoder: converts prompt to embedding</text>
  <text x="135.9423" y="581.8183" font-size="17.4545" fill="var(--text-muted)">Guides the diffusion process toward the text description</text>
  <text x="135.9423" y="610.9091" font-size="17.4545" fill="var(--text-muted)">Enables text-to-image generation</text>
</svg>
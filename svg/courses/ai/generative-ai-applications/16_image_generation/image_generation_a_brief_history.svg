<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="591.6444" y="38.4" text-anchor="middle" font-size="23.04" font-weight="bold" fill="var(--text)">Image Generation: A Brief History</text>
  <line x1="169.0412" y1="76.8" x2="169.0412" y2="640" stroke="var(--primary-border)" stroke-width="2" />
  <circle cx="169.0412" cy="102.4" r="10.24" fill="var(--primary-fill)" />
  <text x="143.6851" y="108.8" text-anchor="end" font-size="16.64" font-weight="bold" fill="var(--primary-accent)">2014</text>
  <rect x="211.3016" y="83.2" width="912.8229" height="44.8" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="236.6578" y="111.36" font-size="15.36" fill="var(--text)">GANs (Goodfellow) - Generator vs Discriminator adversarial training</text>
  <circle cx="169.0412" cy="153.6" r="10.24" fill="var(--primary-fill)" />
  <text x="143.6851" y="160" text-anchor="end" font-size="16.64" font-weight="bold" fill="var(--primary-accent)">2015</text>
  <rect x="211.3016" y="134.4" width="912.8229" height="44.8" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="236.6578" y="162.56" font-size="15.36" fill="var(--text)">DCGAN - First realistic image generation with deep convolutions</text>
  <circle cx="169.0412" cy="211.2" r="10.24" fill="var(--warn-fill)" />
  <text x="143.6851" y="217.6" text-anchor="end" font-size="16.64" font-weight="bold" fill="var(--danger-accent)">2019</text>
  <rect x="211.3016" y="192" width="912.8229" height="44.8" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="236.6578" y="220.16" font-size="15.36" fill="var(--text)">StyleGAN (NVIDIA) - Photorealistic faces</text>
  <circle cx="169.0412" cy="268.8" r="10.24" fill="var(--ok-fill)" />
  <text x="143.6851" y="275.2" text-anchor="end" font-size="16.64" font-weight="bold" fill="var(--ok-accent)">2020</text>
  <rect x="211.3016" y="249.6" width="912.8229" height="44.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="236.6578" y="277.76" font-size="15.36" fill="var(--text)">DDPM - Denoising Diffusion Probabilistic Models (foundation of modern era)</text>
  <circle cx="169.0412" cy="332.8" r="10.24" fill="var(--ok-fill)" />
  <text x="143.6851" y="339.2" text-anchor="end" font-size="16.64" font-weight="bold" fill="var(--ok-accent)">2021</text>
  <rect x="211.3016" y="313.6" width="912.8229" height="44.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="236.6578" y="341.76" font-size="15.36" fill="var(--text)">DALL-E (OpenAI) - text-to-image | CLIP - connecting text and images</text>
  <circle cx="169.0412" cy="396.8" r="10.24" fill="var(--danger-fill)" />
  <text x="143.6851" y="403.2" text-anchor="end" font-size="16.64" font-weight="bold" fill="var(--danger-accent)">2022</text>
  <rect x="211.3016" y="377.6" width="912.8229" height="44.8" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="236.6578" y="405.76" font-size="15.36" fill="var(--text)">Stable Diffusion (open source) | Midjourney (artistic generation)</text>
  <circle cx="169.0412" cy="460.8" r="10.24" fill="var(--danger-fill)" />
  <text x="143.6851" y="467.2" text-anchor="end" font-size="16.64" font-weight="bold" fill="var(--danger-accent)">2023</text>
  <rect x="211.3016" y="441.6" width="912.8229" height="44.8" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="236.6578" y="469.76" font-size="15.36" fill="var(--text)">SDXL, DALL-E 3, Midjourney v5</text>
  <circle cx="169.0412" cy="524.8" r="10.24" fill="var(--danger-fill)" />
  <text x="143.6851" y="531.2" text-anchor="end" font-size="16.64" font-weight="bold" fill="var(--danger-accent)">2024</text>
  <rect x="211.3016" y="505.6" width="912.8229" height="44.8" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="236.6578" y="533.76" font-size="15.36" fill="var(--text)">Flux, Stable Diffusion 3, DALL-E 3 + ChatGPT</text>
  <circle cx="169.0412" cy="588.8" r="10.24" fill="var(--warn-fill)" />
  <text x="143.6851" y="595.2" text-anchor="end" font-size="16.64" font-weight="bold" fill="var(--danger-accent)">2025</text>
  <rect x="211.3016" y="569.6" width="912.8229" height="44.8" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="236.6578" y="597.76" font-size="15.36" fill="var(--text)">Video generation (Sora, Runway Gen-3)</text>
</svg>
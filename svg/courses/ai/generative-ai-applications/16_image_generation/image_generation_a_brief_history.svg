<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Image Generation: A Brief History</text>
  <!-- Timeline line -->
  <line x1="100" y1="60" x2="100" y2="500" stroke="#4a90e2" stroke-width="3"/>
  <!-- 2014 -->
  <circle cx="100" cy="80" r="8" fill="#4a90e2"/>
  <text x="85" y="85" text-anchor="end" font-size="13" font-weight="bold" fill="#4a90e2">2014</text>
  <rect x="125" y="65" width="540" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="140" y="87" font-size="12" fill="#333">GANs (Goodfellow) - Generator vs Discriminator adversarial training</text>
  <!-- 2015 -->
  <circle cx="100" cy="120" r="8" fill="#4a90e2"/>
  <text x="85" y="125" text-anchor="end" font-size="13" font-weight="bold" fill="#4a90e2">2015</text>
  <rect x="125" y="105" width="540" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="140" y="127" font-size="12" fill="#333">DCGAN - First realistic image generation with deep convolutions</text>
  <!-- 2019 -->
  <circle cx="100" cy="165" r="8" fill="#ffc107"/>
  <text x="85" y="170" text-anchor="end" font-size="13" font-weight="bold" fill="#856404">2019</text>
  <rect x="125" y="150" width="540" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="140" y="172" font-size="12" fill="#333">StyleGAN (NVIDIA) - Photorealistic faces</text>
  <!-- 2020 -->
  <circle cx="100" cy="210" r="8" fill="#28a745"/>
  <text x="85" y="215" text-anchor="end" font-size="13" font-weight="bold" fill="#28a745">2020</text>
  <rect x="125" y="195" width="540" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="140" y="217" font-size="12" fill="#333">DDPM - Denoising Diffusion Probabilistic Models (foundation of modern era)</text>
  <!-- 2021 -->
  <circle cx="100" cy="260" r="8" fill="#28a745"/>
  <text x="85" y="265" text-anchor="end" font-size="13" font-weight="bold" fill="#28a745">2021</text>
  <rect x="125" y="245" width="540" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="140" y="267" font-size="12" fill="#333">DALL-E (OpenAI) - text-to-image | CLIP - connecting text and images</text>
  <!-- 2022 -->
  <circle cx="100" cy="310" r="8" fill="#dc3545"/>
  <text x="85" y="315" text-anchor="end" font-size="13" font-weight="bold" fill="#dc3545">2022</text>
  <rect x="125" y="295" width="540" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="140" y="317" font-size="12" fill="#333">Stable Diffusion (open source) | Midjourney (artistic generation)</text>
  <!-- 2023 -->
  <circle cx="100" cy="360" r="8" fill="#dc3545"/>
  <text x="85" y="365" text-anchor="end" font-size="13" font-weight="bold" fill="#dc3545">2023</text>
  <rect x="125" y="345" width="540" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="140" y="367" font-size="12" fill="#333">SDXL, DALL-E 3, Midjourney v5</text>
  <!-- 2024 -->
  <circle cx="100" cy="410" r="8" fill="#dc3545"/>
  <text x="85" y="415" text-anchor="end" font-size="13" font-weight="bold" fill="#dc3545">2024</text>
  <rect x="125" y="395" width="540" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="140" y="417" font-size="12" fill="#333">Flux, Stable Diffusion 3, DALL-E 3 + ChatGPT</text>
  <!-- 2025 -->
  <circle cx="100" cy="460" r="8" fill="#ffc107"/>
  <text x="85" y="465" text-anchor="end" font-size="13" font-weight="bold" fill="#856404">2025</text>
  <rect x="125" y="445" width="540" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="140" y="467" font-size="12" fill="#333">Video generation (Sora, Runway Gen-3)</text>
</svg>
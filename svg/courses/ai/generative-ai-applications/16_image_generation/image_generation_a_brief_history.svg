<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="588.2758" y="40" text-anchor="middle" font-size="25.0278" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Image Generation: A Brief History</text>
  <line x1="71.0344" y1="77.0213" x2="71.0344" y2="620" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="59.9109" y="90.5786" width="22.247" height="22.247" rx="11.1235" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="40" y="107.8723" text-anchor="end" font-size="18.0756" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">2014</text>
  <rect x="122.7586" y="83.1915" width="1117.2414" height="43.1915" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="110.3404" font-size="16.6852" fill="var(--text)" font-family="Arial, sans-serif">GANs (Goodfellow) - Generator vs Discriminator adversarial training</text>
  <rect x="59.9109" y="139.94" width="22.247" height="22.247" rx="11.1235" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="40" y="157.234" text-anchor="end" font-size="18.0756" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">2015</text>
  <rect x="122.7586" y="132.5532" width="1117.2414" height="43.1915" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="159.7021" font-size="16.6852" fill="var(--text)" font-family="Arial, sans-serif">DCGAN - First realistic image generation with deep convolutions</text>
  <rect x="59.9109" y="195.472" width="22.247" height="22.247" rx="11.1235" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="40" y="212.766" text-anchor="end" font-size="18.0756" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2019</text>
  <rect x="122.7586" y="188.0851" width="1117.2414" height="43.1915" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="215.234" font-size="16.6852" fill="var(--text)" font-family="Arial, sans-serif">StyleGAN (NVIDIA) - Photorealistic faces</text>
  <rect x="59.9109" y="251.004" width="22.247" height="22.247" rx="11.1235" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="40" y="268.2979" text-anchor="end" font-size="18.0756" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2020</text>
  <rect x="122.7586" y="243.617" width="1117.2414" height="43.1915" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="270.766" font-size="16.6852" fill="var(--text)" font-family="Arial, sans-serif">DDPM - Denoising Diffusion Probabilistic Models (foundation of modern era)</text>
  <rect x="59.9109" y="312.706" width="22.247" height="22.247" rx="11.1235" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="40" y="330" text-anchor="end" font-size="18.0756" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2021</text>
  <rect x="122.7586" y="305.3191" width="1117.2414" height="43.1915" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="332.4681" font-size="16.6852" fill="var(--text)" font-family="Arial, sans-serif">DALL-E (OpenAI) - text-to-image | CLIP - connecting text and images</text>
  <rect x="59.9109" y="374.408" width="22.247" height="22.247" rx="11.1235" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="40" y="391.7021" text-anchor="end" font-size="18.0756" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2022</text>
  <rect x="122.7586" y="367.0213" width="1117.2414" height="43.1915" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="394.1702" font-size="16.6852" fill="var(--text)" font-family="Arial, sans-serif">Stable Diffusion (open source) | Midjourney (artistic generation)</text>
  <rect x="59.9109" y="436.111" width="22.247" height="22.247" rx="11.1235" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="40" y="453.4043" text-anchor="end" font-size="18.0756" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2023</text>
  <rect x="122.7586" y="428.7234" width="1117.2414" height="43.1915" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="455.8723" font-size="16.6852" fill="var(--text)" font-family="Arial, sans-serif">SDXL, DALL-E 3, Midjourney v5</text>
  <rect x="59.9109" y="497.813" width="22.247" height="22.247" rx="11.1235" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="40" y="515.1064" text-anchor="end" font-size="18.0756" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2024</text>
  <rect x="122.7586" y="490.4255" width="1117.2414" height="43.1915" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="517.5745" font-size="16.6852" fill="var(--text)" font-family="Arial, sans-serif">Flux, Stable Diffusion 3, DALL-E 3 + ChatGPT</text>
  <rect x="59.9109" y="559.515" width="22.247" height="22.247" rx="11.1235" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="40" y="576.8085" text-anchor="end" font-size="18.0756" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2025</text>
  <rect x="122.7586" y="552.1277" width="1117.2414" height="43.1915" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="579.2766" font-size="16.6852" fill="var(--text)" font-family="Arial, sans-serif">Video generation (Sora, Runway Gen-3)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="71.0344" y1="40" x2="71.0344" y2="620" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="59.9109" y="54.481661987846" width="22.247" height="23.763841933394" rx="11.496458057726" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="40" y="72.954478693179" text-anchor="end" font-size="18.681653910031" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">2014</text>
  <rect x="122.7586" y="46.590895738636" width="1117.2414" height="46.136376988637" rx="6.201173043229" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="75.590858352271" font-size="17.244635410147" fill="var(--text)" font-family="Arial, sans-serif">GANs (Goodfellow) - Generator vs Discriminator adversarial training</text>
  <rect x="59.9109" y="107.208614260559" width="22.247" height="23.763841933394" rx="11.496458057726" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="40" y="125.681751420452" text-anchor="end" font-size="18.681653910031" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">2015</text>
  <rect x="122.7586" y="99.318168465909" width="1117.2414" height="46.136376988637" rx="6.201173043229" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="128.318131079543" font-size="17.244635410147" fill="var(--text)" font-family="Arial, sans-serif">DCGAN - First realistic image generation with deep convolutions</text>
  <rect x="59.9109" y="166.526889544654" width="22.247" height="23.763841933394" rx="11.496458057726" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="40" y="185.000026704547" text-anchor="end" font-size="18.681653910031" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2019</text>
  <rect x="122.7586" y="158.636336931817" width="1117.2414" height="46.136376988637" rx="6.201173043229" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="187.636299545452" font-size="17.244635410147" fill="var(--text)" font-family="Arial, sans-serif">StyleGAN (NVIDIA) - Photorealistic faces</text>
  <rect x="59.9109" y="225.845164828749" width="22.247" height="23.763841933394" rx="11.496458057726" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="40" y="244.318195170455" text-anchor="end" font-size="18.681653910031" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2020</text>
  <rect x="122.7586" y="217.954505397726" width="1117.2414" height="46.136376988637" rx="6.201173043229" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="246.954574829547" font-size="17.244635410147" fill="var(--text)" font-family="Arial, sans-serif">DDPM - Denoising Diffusion Probabilistic Models (foundation of modern era)</text>
  <rect x="59.9109" y="291.754122215107" width="22.247" height="23.763841933394" rx="11.496458057726" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="40" y="310.227259374999" text-anchor="end" font-size="18.681653910031" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2021</text>
  <rect x="122.7586" y="283.86356960227" width="1117.2414" height="46.136376988637" rx="6.201173043229" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="312.863639034091" font-size="17.244635410147" fill="var(--text)" font-family="Arial, sans-serif">DALL-E (OpenAI) - text-to-image | CLIP - connecting text and images</text>
  <rect x="59.9109" y="357.663079601465" width="22.247" height="23.763841933394" rx="11.496458057726" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="40" y="376.136323579544" text-anchor="end" font-size="18.681653910031" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2022</text>
  <rect x="122.7586" y="349.772740625001" width="1117.2414" height="46.136376988637" rx="6.201173043229" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="378.772703238635" font-size="17.244635410147" fill="var(--text)" font-family="Arial, sans-serif">Stable Diffusion (open source) | Midjourney (artistic generation)</text>
  <rect x="59.9109" y="423.573105169687" width="22.247" height="23.763841933394" rx="11.496458057726" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="40" y="442.045494602274" text-anchor="end" font-size="18.681653910031" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2023</text>
  <rect x="122.7586" y="415.681804829545" width="1117.2414" height="46.136376988637" rx="6.201173043229" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="444.68176744318" font-size="17.244635410147" fill="var(--text)" font-family="Arial, sans-serif">SDXL, DALL-E 3, Midjourney v5</text>
  <rect x="59.9109" y="489.482062556045" width="22.247" height="23.763841933394" rx="11.496458057726" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="40" y="507.954558806819" text-anchor="end" font-size="18.681653910031" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2024</text>
  <rect x="122.7586" y="481.590869034089" width="1117.2414" height="46.136376988637" rx="6.201173043229" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="510.59093846591" font-size="17.244635410147" fill="var(--text)" font-family="Arial, sans-serif">Flux, Stable Diffusion 3, DALL-E 3 + ChatGPT</text>
  <rect x="59.9109" y="555.391019942403" width="22.247" height="23.763841933394" rx="11.496458057726" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="40" y="573.863623011363" text-anchor="end" font-size="18.681653910031" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2025</text>
  <rect x="122.7586" y="547.50004005682" width="1117.2414" height="46.136376988637" rx="6.201173043229" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="576.500002670455" font-size="17.244635410147" fill="var(--text)" font-family="Arial, sans-serif">Video generation (Sora, Runway Gen-3)</text>
</svg>

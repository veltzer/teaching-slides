<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="580.9929" y="40.8511" text-anchor="middle" font-size="24.5106" font-weight="bold" fill="#333">Text-to-3D Generation (Emerging)</ns0:text>
  <ns0:rect x="49.7994" y="74.8936" width="1062.387" height="88.5106" rx="6.8085" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7234" />
  <ns0:text x="82.999" y="106.2128" font-size="17.7021" font-weight="bold" fill="#4a90e2">1. Score Distillation Sampling (DreamFusion)</ns0:text>
  <ns0:text x="116.1986" y="136.1702" font-size="16.3404" fill="#555">Text -&gt; optimize 3D representation using 2D diffusion. Slow but produces real 3D models.</ns0:text>
  <ns0:rect x="49.7994" y="177.0213" width="1062.387" height="88.5106" rx="6.8085" fill="#d4edda" stroke="#28a745" stroke-width="2.7234" />
  <ns0:text x="82.999" y="208.3404" font-size="17.7021" font-weight="bold" fill="#28a745">2. Multi-view Generation (Zero123++)</ns0:text>
  <ns0:text x="116.1986" y="238.2979" font-size="16.3404" fill="#555">Text -&gt; multiple views -&gt; 3D reconstruction. Faster, good for simple objects.</ns0:text>
  <ns0:rect x="49.7994" y="279.1489" width="1062.387" height="88.5106" rx="6.8085" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7234" />
  <ns0:text x="82.999" y="310.4681" font-size="17.7021" font-weight="bold" fill="#bf360c">3. Direct 3D Generation (Point-E, Shap-E)</ns0:text>
  <ns0:text x="116.1986" y="340.4255" font-size="16.3404" fill="#555">Text -&gt; 3D point cloud or mesh directly. Fastest, lower quality.</ns0:text>
  <ns0:rect x="49.7994" y="381.2766" width="1062.387" height="88.5106" rx="6.8085" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7234" />
  <ns0:text x="82.999" y="412.5957" font-size="17.7021" font-weight="bold" fill="#dc3545">4. Gaussian Splatting</ns0:text>
  <ns0:text x="116.1986" y="442.5532" font-size="16.3404" fill="#555">Multiple images -&gt; 3D Gaussian representation. Very fast rendering, high quality.</ns0:text>
  <ns0:rect x="132.7984" y="503.8298" width="896.3891" height="136.1702" rx="6.8085" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7234" />
  <ns0:text x="580.9929" y="537.8723" text-anchor="middle" font-size="19.0638" font-weight="bold" fill="#333">Applications</ns0:text>
  <ns0:text x="199.1976" y="571.9149" font-size="16.3404" fill="#555">Game asset generation</ns0:text>
  <ns0:text x="199.1976" y="599.1489" font-size="16.3404" fill="#555">Product prototyping</ns0:text>
  <ns0:text x="199.1976" y="626.383" font-size="16.3404" fill="#555">Architecture visualization</ns0:text>
  <ns0:text x="630.7923" y="571.9149" font-size="16.3404" fill="#555">AR/VR content creation</ns0:text>
  <ns0:text x="630.7923" y="599.1489" font-size="16.3404" fill="#555">E-commerce product views</ns0:text>
</ns0:svg>
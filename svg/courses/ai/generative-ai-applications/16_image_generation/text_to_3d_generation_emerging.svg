<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="45" text-anchor="middle" font-size="27" font-weight="bold" fill="#333">Text-to-3D Generation (Emerging)</text>
  <rect x="54.8571" y="82.5" width="1170.2857" height="97.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="91.4286" y="117" font-size="19.5" font-weight="bold" fill="#4a90e2">1. Score Distillation Sampling (DreamFusion)</text>
  <text x="128" y="150" font-size="18" fill="#555">Text -&gt; optimize 3D representation using 2D diffusion. Slow but produces real 3D models.</text>
  <rect x="54.8571" y="195" width="1170.2857" height="97.5" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="91.4286" y="229.5" font-size="19.5" font-weight="bold" fill="#28a745">2. Multi-view Generation (Zero123++)</text>
  <text x="128" y="262.5" font-size="18" fill="#555">Text -&gt; multiple views -&gt; 3D reconstruction. Faster, good for simple objects.</text>
  <rect x="54.8571" y="307.5" width="1170.2857" height="97.5" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="91.4286" y="342" font-size="19.5" font-weight="bold" fill="#856404">3. Direct 3D Generation (Point-E, Shap-E)</text>
  <text x="128" y="375" font-size="18" fill="#555">Text -&gt; 3D point cloud or mesh directly. Fastest, lower quality.</text>
  <rect x="54.8571" y="420" width="1170.2857" height="97.5" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="3" />
  <text x="91.4286" y="454.5" font-size="19.5" font-weight="bold" fill="#dc3545">4. Gaussian Splatting</text>
  <text x="128" y="487.5" font-size="18" fill="#555">Multiple images -&gt; 3D Gaussian representation. Very fast rendering, high quality.</text>
  <rect x="146.2857" y="555" width="987.4286" height="150" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="592.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#333">Applications</text>
  <text x="219.4286" y="630" font-size="18" fill="#555">Game asset generation</text>
  <text x="219.4286" y="660" font-size="18" fill="#555">Product prototyping</text>
  <text x="219.4286" y="690" font-size="18" fill="#555">Architecture visualization</text>
  <text x="694.8571" y="630" font-size="18" fill="#555">AR/VR content creation</text>
  <text x="694.8571" y="660" font-size="18" fill="#555">E-commerce product views</text>
</svg>
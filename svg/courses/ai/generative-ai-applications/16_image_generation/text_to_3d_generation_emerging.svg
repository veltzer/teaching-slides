<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Text-to-3D Generation (Emerging)</text>
  <!-- Approaches -->
  <rect x="30" y="55" width="640" height="65" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="78" font-size="13" font-weight="bold" fill="#4a90e2">1. Score Distillation Sampling (DreamFusion)</text>
  <text x="70" y="100" font-size="12" fill="#555">Text -> optimize 3D representation using 2D diffusion. Slow but produces real 3D models.</text>

  <rect x="30" y="130" width="640" height="65" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="50" y="153" font-size="13" font-weight="bold" fill="#28a745">2. Multi-view Generation (Zero123++)</text>
  <text x="70" y="175" font-size="12" fill="#555">Text -> multiple views -> 3D reconstruction. Faster, good for simple objects.</text>

  <rect x="30" y="205" width="640" height="65" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="50" y="228" font-size="13" font-weight="bold" fill="#856404">3. Direct 3D Generation (Point-E, Shap-E)</text>
  <text x="70" y="250" font-size="12" fill="#555">Text -> 3D point cloud or mesh directly. Fastest, lower quality.</text>

  <rect x="30" y="280" width="640" height="65" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="50" y="303" font-size="13" font-weight="bold" fill="#dc3545">4. Gaussian Splatting</text>
  <text x="70" y="325" font-size="12" fill="#555">Multiple images -> 3D Gaussian representation. Very fast rendering, high quality.</text>

  <!-- Applications -->
  <rect x="80" y="370" width="540" height="100" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="395" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Applications</text>
  <text x="120" y="420" font-size="12" fill="#555">Game asset generation</text>
  <text x="120" y="440" font-size="12" fill="#555">Product prototyping</text>
  <text x="120" y="460" font-size="12" fill="#555">Architecture visualization</text>
  <text x="380" y="420" font-size="12" fill="#555">AR/VR content creation</text>
  <text x="380" y="440" font-size="12" fill="#555">E-commerce product views</text>
</svg>
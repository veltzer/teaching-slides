<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.6301" font-weight="bold" fill="var(--text)">Text-to-3D Generation (Emerging)</text>
  <rect x="40" y="72.9545" width="1200" height="85.6818" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5" y="103.2727" font-size="18.5106" font-weight="bold" fill="var(--primary-accent)">1. Score Distillation Sampling (DreamFusion)</text>
  <text x="115" y="132.2727" font-size="17.0867" fill="var(--text-muted)">Text -&gt; optimize 3D representation using 2D diffusion. Slow but produces real 3D models.</text>
  <rect x="40" y="171.8182" width="1200" height="85.6818" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5" y="202.1363" font-size="18.5106" font-weight="bold" fill="var(--ok-accent)">2. Multi-view Generation (Zero123++)</text>
  <text x="115" y="231.1364" font-size="17.0867" fill="var(--text-muted)">Text -&gt; multiple views -&gt; 3D reconstruction. Faster, good for simple objects.</text>
  <rect x="40" y="270.6818" width="1200" height="85.6818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5" y="301" font-size="18.5106" font-weight="bold" fill="var(--danger-accent)">3. Direct 3D Generation (Point-E, Shap-E)</text>
  <text x="115" y="330" font-size="17.0867" fill="var(--text-muted)">Text -&gt; 3D point cloud or mesh directly. Fastest, lower quality.</text>
  <rect x="40" y="369.5454" width="1200" height="85.6818" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5" y="399.8636" font-size="18.5106" font-weight="bold" fill="var(--danger-accent)">4. Gaussian Splatting</text>
  <text x="115" y="428.8636" font-size="17.0867" fill="var(--text-muted)">Multiple images -&gt; 3D Gaussian representation. Very fast rendering, high quality.</text>
  <rect x="133.75" y="488.1818" width="1012.5001" height="131.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="521.1363" text-anchor="middle" font-size="19.9345" font-weight="bold" fill="var(--text)">Applications</text>
  <text x="208.75" y="554.0909" font-size="17.0867" fill="var(--text-muted)">Game asset generation</text>
  <text x="208.75" y="580.4545" font-size="17.0867" fill="var(--text-muted)">Product prototyping</text>
  <text x="208.75" y="606.8182" font-size="17.0867" fill="var(--text-muted)">Architecture visualization</text>
  <text x="696.25" y="554.0909" font-size="17.0867" fill="var(--text-muted)">AR/VR content creation</text>
  <text x="696.25" y="580.4545" font-size="17.0867" fill="var(--text-muted)">E-commerce product views</text>
</svg>
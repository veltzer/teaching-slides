<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="90.843346668604" rx="6.178079922381" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5" y="72.144594919435" font-size="19.059994368536" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Score Distillation Sampling (DreamFusion)</text>
  <text x="115" y="102.891580316445" font-size="17.593833034957" fill="var(--text-muted)" font-family="Arial, sans-serif">Text -&gt; optimize 3D representation using 2D diffusion. Slow but produces real 3D models.</text>
  <rect x="40" y="144.819335868771" width="1200" height="90.843346668604" rx="6.178079922381" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5" y="176.963824764119" font-size="19.059994368536" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. Multi-view Generation (Zero123++)</text>
  <text x="115" y="207.710916185217" font-size="17.593833034957" fill="var(--text-muted)" font-family="Arial, sans-serif">Text -&gt; multiple views -&gt; 3D reconstruction. Faster, good for simple objects.</text>
  <rect x="40" y="249.638565713455" width="1200" height="90.843346668604" rx="6.178079922381" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5" y="281.783160632891" font-size="19.059994368536" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. Direct 3D Generation (Point-E, Shap-E)</text>
  <text x="115" y="312.530146029901" font-size="17.593833034957" fill="var(--text-muted)" font-family="Arial, sans-serif">Text -&gt; 3D point cloud or mesh directly. Fastest, lower quality.</text>
  <rect x="40" y="354.457795558139" width="1200" height="90.843346668604" rx="6.178079922381" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5" y="386.602390477575" font-size="19.059994368536" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">4. Gaussian Splatting</text>
  <text x="115" y="417.349375874584" font-size="17.593833034957" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple images -&gt; 3D Gaussian representation. Very fast rendering, high quality.</text>
  <rect x="133.75" y="480.24095619103" width="1012.5001" height="139.75904380897" rx="6.178079922381" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="515.180664131229" text-anchor="middle" font-size="20.526155702116" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Applications</text>
  <text x="208.75" y="550.120478095515" font-size="17.593833034957" fill="var(--text-muted)" font-family="Arial, sans-serif">Game asset generation</text>
  <text x="208.75" y="578.072244447674" font-size="17.593833034957" fill="var(--text-muted)" font-family="Arial, sans-serif">Product prototyping</text>
  <text x="208.75" y="606.024116823921" font-size="17.593833034957" fill="var(--text-muted)" font-family="Arial, sans-serif">Architecture visualization</text>
  <text x="696.25" y="550.120478095515" font-size="17.593833034957" fill="var(--text-muted)" font-family="Arial, sans-serif">AR/VR content creation</text>
  <text x="696.25" y="578.072244447674" font-size="17.593833034957" fill="var(--text-muted)" font-family="Arial, sans-serif">E-commerce product views</text>
</svg>

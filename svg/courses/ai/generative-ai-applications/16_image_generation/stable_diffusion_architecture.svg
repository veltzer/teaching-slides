<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1088.372123" height="52.051322724359" rx="8.431986111832" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="584.186142" y="72.71790835641" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.455784289931" fill="var(--text)">"A cat wearing a top hat, oil painting"</text>
  <line x1="584.186142" y1="92.05132376282" x2="584.186142" y2="129.230769230769" stroke="var(--primary-border)" stroke-width="1.9592" marker-end="url(#arrow)"/>
  <rect x="151.628038" y="129.230769230769" width="865.116369" height="81.794831121795" rx="8.431986111832" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="584.186142" y="166.41021573718" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.326982032149" font-weight="bold" fill="var(--text)">CLIP Text Encoder</text>
  <text x="584.186142" y="196.153846673077" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.584305290099" fill="var(--text-muted)">Text -&gt; embedding vector</text>
  <line x1="584.186142" y1="211.025600352564" x2="584.186142" y2="255.64110750641" stroke="var(--primary-border)" stroke-width="1.9592" marker-end="url(#arrow)"/>
  <text x="598.139386" y="243.743631247436" font-family="Arial, sans-serif" font-size="18.712965900024" fill="var(--text-faint)">text embedding</text>
  <rect x="40" y="255.64110750641" width="558.139546" height="104.102646487179" rx="8.431986111832" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="319.069853" y="300.256492121795" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.326982032149" font-weight="bold" fill="var(--text)">U-Net</text>
  <text x="319.069853" y="330.000000519231" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.584305290099" fill="var(--text-muted)">(denoiser)</text>
  <rect x="737.674392" y="255.64110750641" width="502.325608" height="104.102646487179" rx="8.431986111832" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="988.837276" y="300.256492121795" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.326982032149" font-weight="bold" fill="var(--text)">Noise Scheduler</text>
  <text x="988.837276" y="330.000000519231" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.584305290099" fill="var(--text-muted)">(50 steps)</text>
  <line x1="737.674392" y1="307.692307692308" x2="612.093111" y2="307.692307692308" stroke="var(--warn-border)" stroke-width="1.9592" marker-end="url(#arrow)"/>
  <line x1="319.069853" y1="359.743631455128" x2="319.069853" y2="419.23076975" stroke="var(--primary-border)" stroke-width="1.9592" marker-end="url(#arrow)"/>
  <text x="333.023097" y="404.35889249359" font-family="Arial, sans-serif" font-size="18.712965900024" fill="var(--text-faint)">latent representation</text>
  <rect x="151.628038" y="419.23076975" width="865.116369" height="81.794831121795" rx="8.431986111832" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="584.186142" y="456.410215217949" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.326982032149" font-weight="bold" fill="var(--text)">VAE Decoder</text>
  <text x="584.186142" y="486.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.584305290099" fill="var(--text-muted)">Latent -&gt; pixel space</text>
  <line x1="584.186142" y1="501.025599833333" x2="584.186142" y2="553.076923596154" stroke="var(--ok-border)" stroke-width="1.9592" marker-end="url(#arrow)"/>
  <rect x="151.628038" y="553.076923596154" width="865.116369" height="66.923076403846" rx="8.431986111832" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="584.186142" y="594.717907214103" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.326982032149" font-weight="bold" fill="var(--ok-accent)">Generated Image (512x512 or 1024x1024)</text>
</svg>

<svg viewBox="0 0 750 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Outer container -->
  <rect x="30" y="10" width="690" height="480" rx="8" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2"/>
  <text x="375" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4a90e2">STABLE DIFFUSION</text>

  <!-- Text input -->
  <rect x="180" y="55" width="390" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="375" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">"A cat wearing a top hat, oil painting"</text>

  <!-- Arrow -->
  <line x1="375" y1="90" x2="375" y2="115" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CLIP Text Encoder -->
  <rect x="220" y="115" width="310" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="375" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">CLIP Text Encoder</text>
  <text x="375" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Text -&gt; embedding vector</text>

  <!-- Arrow -->
  <line x1="375" y1="170" x2="375" y2="200" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="192" font-family="Arial, sans-serif" font-size="10" fill="#888">text embedding</text>

  <!-- U-Net -->
  <rect x="180" y="200" width="200" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="280" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">U-Net</text>
  <text x="280" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">(denoiser)</text>

  <!-- Noise Scheduler -->
  <rect x="430" y="200" width="180" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="520" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Noise Scheduler</text>
  <text x="520" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">(50 steps)</text>

  <!-- Arrow from scheduler to U-Net -->
  <line x1="430" y1="235" x2="385" y2="235" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow down from U-Net -->
  <line x1="280" y1="270" x2="280" y2="310" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="285" y="300" font-family="Arial, sans-serif" font-size="10" fill="#888">latent representation</text>

  <!-- VAE Decoder -->
  <rect x="220" y="310" width="310" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="375" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">VAE Decoder</text>
  <text x="375" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Latent -&gt; pixel space</text>

  <!-- Arrow -->
  <line x1="375" y1="365" x2="375" y2="400" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output image -->
  <rect x="220" y="400" width="310" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="375" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#28a745">Generated Image (512x512 or 1024x1024)</text>
</svg>
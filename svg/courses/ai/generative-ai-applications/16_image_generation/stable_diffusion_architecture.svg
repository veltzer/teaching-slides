<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="46.4399" y="13.0612" width="1068.1179" height="626.9388" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="580.4989" y="52.2449" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.898" font-weight="bold" fill="var(--primary-accent)">STABLE DIFFUSION</text>
  <rect x="278.6395" y="71.8367" width="603.7188" height="45.7143" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="580.4989" y="100.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6735" fill="var(--text)">"A cat wearing a top hat, oil painting"</text>
  <line x1="580.4989" y1="117.551" x2="580.4989" y2="150.2041" stroke="var(--primary-border)" stroke-width="1.9592" marker-end="url(#arrow)" />
  <rect x="340.5594" y="150.2041" width="479.8791" height="71.8367" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.4989" y="182.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9796" font-weight="bold" fill="var(--text)">CLIP Text Encoder</text>
  <text x="580.4989" y="208.9796" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.3673" fill="var(--text-muted)">Text -&gt; embedding vector</text>
  <line x1="580.4989" y1="222.0408" x2="580.4989" y2="261.2245" stroke="var(--primary-border)" stroke-width="1.9592" marker-end="url(#arrow)" />
  <text x="588.2388" y="250.7755" font-family="Arial, sans-serif" font-size="13.0612" fill="var(--text-faint)">text embedding</text>
  <rect x="278.6395" y="261.2245" width="309.5994" height="91.4286" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="433.4392" y="300.4082" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9796" font-weight="bold" fill="var(--text)">U-Net</text>
  <text x="433.4392" y="326.5306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.3673" fill="var(--text-muted)">(denoiser)</text>
  <rect x="665.6387" y="261.2245" width="278.6395" height="91.4286" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="804.9585" y="300.4082" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9796" font-weight="bold" fill="var(--text)">Noise Scheduler</text>
  <text x="804.9585" y="326.5306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.3673" fill="var(--text-muted)">(50 steps)</text>
  <line x1="665.6387" y1="306.9388" x2="595.9789" y2="306.9388" stroke="var(--warn-border)" stroke-width="1.9592" marker-end="url(#arrow)" />
  <line x1="433.4392" y1="352.6531" x2="433.4392" y2="404.898" stroke="var(--primary-border)" stroke-width="1.9592" marker-end="url(#arrow)" />
  <text x="441.1791" y="391.8367" font-family="Arial, sans-serif" font-size="13.0612" fill="var(--text-faint)">latent representation</text>
  <rect x="340.5594" y="404.898" width="479.8791" height="71.8367" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="580.4989" y="437.551" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9796" font-weight="bold" fill="var(--text)">VAE Decoder</text>
  <text x="580.4989" y="463.6735" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.3673" fill="var(--text-muted)">Latent -&gt; pixel space</text>
  <line x1="580.4989" y1="476.7347" x2="580.4989" y2="522.449" stroke="var(--ok-border)" stroke-width="1.9592" marker-end="url(#arrow)" />
  <rect x="340.5594" y="522.449" width="479.8791" height="58.7755" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="580.4989" y="559.0204" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9796" font-weight="bold" fill="var(--ok-accent)">Generated Image (512x512 or 1024x1024)</text>
</svg>
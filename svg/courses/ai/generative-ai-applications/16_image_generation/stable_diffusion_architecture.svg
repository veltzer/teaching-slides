<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.0001" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3053" font-weight="bold" fill="var(--primary-accent)">STABLE DIFFUSION</text>
  <rect x="300.8696" y="94.375" width="678.2609" height="42.2917" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640.0001" y="120.9583" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.979" fill="var(--text)">"A cat wearing a top hat, oil painting"</text>
  <line x1="640.0001" y1="136.6667" x2="640.0001" y2="166.875" stroke="var(--primary-border)" stroke-width="1.9592" marker-end="url(#arrow)" />
  <rect x="370.4349" y="166.875" width="539.1305" height="66.4583" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="197.0833" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3105" font-weight="bold" fill="var(--text)">CLIP Text Encoder</text>
  <text x="640.0001" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6473" fill="var(--text-muted)">Text -&gt; embedding vector</text>
  <line x1="640.0001" y1="233.3333" x2="640.0001" y2="269.5834" stroke="var(--primary-border)" stroke-width="1.9592" marker-end="url(#arrow)" />
  <text x="648.6956" y="259.9167" font-family="Arial, sans-serif" font-size="13.3157" fill="var(--text-faint)">text embedding</text>
  <rect x="300.8696" y="269.5834" width="347.8261" height="84.5834" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="474.7827" y="305.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3105" font-weight="bold" fill="var(--text)">U-Net</text>
  <text x="474.7827" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6473" fill="var(--text-muted)">(denoiser)</text>
  <rect x="735.6522" y="269.5834" width="313.0435" height="84.5834" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="892.174" y="305.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3105" font-weight="bold" fill="var(--text)">Noise Scheduler</text>
  <text x="892.174" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6473" fill="var(--text-muted)">(50 steps)</text>
  <line x1="735.6522" y1="311.875" x2="657.3914" y2="311.875" stroke="var(--warn-border)" stroke-width="1.9592" marker-end="url(#arrow)" />
  <line x1="474.7827" y1="354.1667" x2="474.7827" y2="402.5" stroke="var(--primary-border)" stroke-width="1.9592" marker-end="url(#arrow)" />
  <text x="483.4782" y="390.4166" font-family="Arial, sans-serif" font-size="13.3157" fill="var(--text-faint)">latent representation</text>
  <rect x="370.4349" y="402.5" width="539.1305" height="66.4583" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640.0001" y="432.7083" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3105" font-weight="bold" fill="var(--text)">VAE Decoder</text>
  <text x="640.0001" y="456.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6473" fill="var(--text-muted)">Latent -&gt; pixel space</text>
  <line x1="640.0001" y1="468.9583" x2="640.0001" y2="511.25" stroke="var(--ok-border)" stroke-width="1.9592" marker-end="url(#arrow)" />
  <rect x="370.4349" y="511.25" width="539.1305" height="54.375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640.0001" y="545.0833" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3105" font-weight="bold" fill="var(--ok-accent)">Generated Image (512x512 or 1024x1024)</text>
</svg>
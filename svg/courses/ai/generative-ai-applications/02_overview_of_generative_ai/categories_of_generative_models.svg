  <rect x="993.8461" y="393.251" width="246.1539" height="226.749" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1116.9229" y="440.9877" text-anchor="middle" font-size="24.3903" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">VIDEO</text>
  <text x="1116.9229" y="488.7243" text-anchor="middle" font-size="20.638" fill="var(--text)" font-family="Arial, sans-serif">Sora</text>

  <rect x="357.9487" y="393.251" width="246.1539" height="226.749" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="481.0256" y="440.9877" text-anchor="middle" font-size="24.3903" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CODE</text>
  <text x="481.0256" y="488.7243" text-anchor="middle" font-size="20.638" fill="var(--text)" font-family="Arial, sans-serif">Codex</text>
  <text x="481.0256" y="526.9136" text-anchor="middle" font-size="20.638" fill="var(--text)" font-family="Arial, sans-serif">Claude</text>

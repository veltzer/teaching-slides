<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="409.2308" y="40" width="451.2819" height="85.9258" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="634.8717" y="94.8972" text-anchor="middle" font-size="26.2664" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">GENERATIVE MODELS</text>
  <line x1="634.8717" y1="125.926" x2="634.8717" y2="164.1153" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="316.923" y1="164.1153" x2="952.8203" y2="164.1153" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="316.923" y1="164.1153" x2="316.923" y2="202.3046" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="952.8203" y1="164.1153" x2="952.8203" y2="202.3046" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="111.7949" y="202.3046" width="410.2563" height="109.7943" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.923" y="250.0411" text-anchor="middle" font-size="24.3903" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AUTOREGRESSIVE</text>
  <text x="316.923" y="290.6173" text-anchor="middle" font-size="20.638" fill="var(--text-muted)" font-family="Arial, sans-serif">(sequential)</text>
  <rect x="747.6922" y="202.3046" width="410.2563" height="109.7943" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="952.8203" y="250.0411" text-anchor="middle" font-size="24.3903" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DIFFUSION</text>
  <text x="952.8203" y="290.6173" text-anchor="middle" font-size="20.638" fill="var(--text-muted)" font-family="Arial, sans-serif">(iterative denoising)</text>
  <line x1="316.923" y1="312.0987" x2="316.923" y2="355.0618" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="163.0769" y1="355.0618" x2="481.0256" y2="355.0618" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="163.0769" y1="355.0618" x2="163.0769" y2="393.251" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="481.0256" y1="355.0618" x2="481.0256" y2="393.251" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="952.8203" y1="312.0987" x2="952.8203" y2="355.0618" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="809.2307" y1="355.0618" x2="1116.9229" y2="355.0618" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="809.2307" y1="355.0618" x2="809.2307" y2="393.251" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1116.9229" y1="355.0618" x2="1116.9229" y2="393.251" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="40" y="393.251" width="246.1539" height="226.749" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="163.0769" y="440.9877" text-anchor="middle" font-size="24.3903" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">TEXT</text>
  <text x="163.0769" y="488.7243" text-anchor="middle" font-size="20.638" fill="var(--text)" font-family="Arial, sans-serif">GPT</text>
  <text x="163.0769" y="526.9136" text-anchor="middle" font-size="20.638" fill="var(--text)" font-family="Arial, sans-serif">Claude</text>

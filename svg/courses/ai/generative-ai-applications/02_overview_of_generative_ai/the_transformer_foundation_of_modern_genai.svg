<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="60" width="1200" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Transformer Block</text>

  <rect x="160" y="180" width="960" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Multi-Head Self-Attention</text>
  <text x="640" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">each token attends to every other token</text>

  <line x1="640" y1="270" x2="640" y2="305" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="160" y="310" width="960" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Feed-Forward Network</text>
  <text x="640" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">processes each position</text>

  <line x1="640" y1="400" x2="640" y2="435" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="160" y="440" width="960" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Layer Normalization + Residual</text>
  <text x="640" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">stabilizes training across deep stacks</text>

  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Stack N of these blocks — GPT, BERT, LLaMA, Claude all share this core.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 11.52 L 16.5161 5.76 z" fill="#555" />
    </marker>
  </defs>
  <text x="59.3252" y="40.4598" font-size="23.908" fill="var(--text)">Input tokens: ["The", "cat", "sat", "on", "the", "___"]</text>
  <rect x="39.5501" y="62.5287" width="1146.9534" height="478.1609" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="613.0268" y="99.3103" text-anchor="middle" font-size="25.7471" font-weight="bold" fill="var(--text)">TRANSFORMER BLOCK</text>
  <rect x="98.8753" y="117.7011" width="1028.3031" height="102.9885" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="613.0268" y="158.1609" text-anchor="middle" font-size="23.908" font-weight="bold" fill="var(--text)">Multi-Head Self-Attention</text>
  <text x="613.0268" y="194.9425" text-anchor="middle" font-size="22.069" fill="var(--text)">(each token attends to every other token)</text>
  <line x1="613.0268" y1="220.6897" x2="613.0268" y2="253.7931" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr2)" />
  <rect x="98.8753" y="257.4713" width="1028.3031" height="95.6322" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="613.0268" y="297.931" text-anchor="middle" font-size="23.908" font-weight="bold" fill="var(--text)">Feed-Forward Network</text>
  <text x="613.0268" y="331.0345" text-anchor="middle" font-size="22.069" fill="var(--text)">(process each position)</text>
  <line x1="613.0268" y1="353.1034" x2="613.0268" y2="386.2069" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr2)" />
  <rect x="98.8753" y="389.8851" width="1028.3031" height="95.6322" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="613.0268" y="430.3448" text-anchor="middle" font-size="23.908" font-weight="bold" fill="var(--text)">Layer Normalization</text>
  <text x="613.0268" y="463.4483" text-anchor="middle" font-size="22.069" fill="var(--text)">+ Residual Connection</text>
  <line x1="613.0268" y1="540.6897" x2="613.0268" y2="592.1839" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr2)" />
  <text x="628.8468" y="575.6322" font-size="22.069" fill="var(--text-muted)">× N layers</text>
  <text x="613.0268" y="640" text-anchor="middle" font-size="23.908" fill="var(--text)">Output: "mat" (probability 0.87)</text>
</svg>
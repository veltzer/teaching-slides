<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="415.5744" y="49.5284" text-anchor="middle" font-size="12.3821" font-weight="bold" fill="var(--text)">Scaling Laws</text>
  <line x1="183.4099" y1="65.006" x2="183.4099" y2="273.9541" stroke="var(--text)" stroke-width="1.1485" />
  <line x1="183.4099" y1="273.9541" x2="647.7388" y2="273.9541" stroke="var(--text)" stroke-width="1.1485" />
  <text x="144.7158" y="173.3495" text-anchor="middle" font-size="10.0605" fill="var(--text)" transform="rotate(-90, 50, 190)">Loss</text>
  <text x="415.5744" y="301.0399" text-anchor="middle" font-size="10.0605" fill="var(--text)">Parameters (N)</text>
  <text x="222.1039" y="289.4316" text-anchor="middle" font-size="10" fill="var(--text-muted)">1M</text>
  <text x="299.4921" y="289.4316" text-anchor="middle" font-size="10" fill="var(--text-muted)">10M</text>
  <text x="376.8803" y="289.4316" text-anchor="middle" font-size="10" fill="var(--text-muted)">100M</text>
  <text x="454.2684" y="289.4316" text-anchor="middle" font-size="10" fill="var(--text-muted)">1B</text>
  <text x="531.6565" y="289.4316" text-anchor="middle" font-size="10" fill="var(--text-muted)">10B</text>
  <text x="609.0447" y="289.4316" text-anchor="middle" font-size="10" fill="var(--text-muted)">100B</text>
  <path d="M 198.8875 80.4836 Q 245.3204 103.7001 276.2757 142.3941 Q 322.7085 188.8271 376.8803 219.7823 Q 454.2684 250.7376 531.6565 262.3458 Q 585.8283 267.763 640 270.0846" fill="none" stroke="var(--primary-border)" stroke-width="1.7227" />
  <rect x="260.798" y="126.9166" width="201.2092" height="23.2164" rx="5.006" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.2382" />
  <text x="361.4027" y="142.3941" text-anchor="middle" font-size="10" fill="var(--danger-accent)">Power law: L(N) = (Nc / N)^a</text>
  <line x1="291.7533" y1="150.133" x2="276.2757" y2="161.7412" stroke="var(--warn-border)" stroke-width="0.5742" />
  <rect x="183.4099" y="320.3869" width="139.2987" height="38.6941" rx="5.006" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.2382" />
  <text x="253.0593" y="335.8646" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">1. Model Size</text>
  <text x="253.0593" y="349.7944" text-anchor="middle" font-size="10" fill="var(--text-muted)">(parameters)</text>
  <rect x="345.925" y="320.3869" width="139.2987" height="38.6941" rx="5.006" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.2382" />
  <text x="415.5744" y="335.8646" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">2. Dataset Size</text>
  <text x="415.5744" y="349.7944" text-anchor="middle" font-size="10" fill="var(--text-muted)">(tokens)</text>
  <rect x="508.4401" y="320.3869" width="139.2987" height="38.6941" rx="5.006" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.2382" />
  <text x="578.0895" y="335.8646" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">3. Compute Budget</text>
  <text x="578.0895" y="349.7944" text-anchor="middle" font-size="10" fill="var(--text-muted)">(FLOPs)</text>
</svg>
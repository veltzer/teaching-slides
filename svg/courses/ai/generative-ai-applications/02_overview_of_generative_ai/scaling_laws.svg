<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="640.0002" y="40" text-anchor="middle" font-size="27.247" font-weight="bold" fill="var(--text)">Scaling Laws</text>
  <line x1="40" y1="68.9999" x2="40" y2="460.5001" stroke="var(--text)" stroke-width="0.711" />
  <line x1="40" y1="460.5001" x2="1240" y2="460.5001" stroke="var(--text)" stroke-width="0.711" />
  <text x="40" y="272.0001" text-anchor="middle" font-size="21.2698" fill="var(--text)" transform="rotate(-90, 50, 190)">Loss</text>
  <text x="640.0002" y="511.25" text-anchor="middle" font-size="22.1383" fill="var(--text)">Parameters (N)</text>
  <text x="139.9999" y="489.4999" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)">1M</text>
  <text x="340" y="489.4999" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)">10M</text>
  <text x="540.0004" y="489.4999" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)">100M</text>
  <text x="740" y="489.4999" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)">1B</text>
  <text x="939.9999" y="489.4999" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)">10B</text>
  <text x="1140" y="489.4999" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)">100B</text>
  <path d="M 80 97.9999 Q 200 141.5 280.0004 213.9999 Q 399.9999 301.0001 540.0004 358.9999 Q 740 417 939.9999 438.75 Q 1080.0003 448.9 1220 453.2499" fill="none" stroke="var(--primary-border)" stroke-width="1.0665" />
  <rect x="239.9999" y="185.0001" width="520" height="43.4999" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500.0001" y="213.9999" text-anchor="middle" font-size="22.0052" fill="var(--danger-accent)">Power law: L(N) = (Nc / N)^a</text>
  <line x1="320" y1="228.5" x2="280.0004" y2="250.25" stroke="var(--warn-border)" stroke-width="0.3555" />
  <rect x="40" y="547.5" width="360" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.0002" y="576.5001" text-anchor="middle" font-size="22.0052" font-weight="bold" fill="var(--text)">1. Model Size</text>
  <text x="220.0002" y="602.6" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)">(parameters)</text>
  <rect x="460" y="547.5" width="360" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0002" y="576.5001" text-anchor="middle" font-size="22.0052" font-weight="bold" fill="var(--text)">2. Dataset Size</text>
  <text x="640.0002" y="602.6" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)">(tokens)</text>
  <rect x="880" y="547.5" width="360" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="576.5001" text-anchor="middle" font-size="22.0052" font-weight="bold" fill="var(--text)">3. Compute Budget</text>
  <text x="1060" y="602.6" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)">(FLOPs)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0002" y="40" text-anchor="middle" font-size="27.247" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Scaling Laws</text>
  <line x1="40" y1="68.9999" x2="40" y2="460.5001" stroke="var(--text)" stroke-width="0.711"/>
  <line x1="40" y1="460.5001" x2="1240" y2="460.5001" stroke="var(--text)" stroke-width="0.711"/>
  <text x="40" y="272.0001" text-anchor="middle" font-size="21.2698" fill="var(--text)" transform="rotate(-90, 50, 190)" font-family="Arial, sans-serif">Loss</text>
  <text x="640.0002" y="511.25" text-anchor="middle" font-size="22.1383" fill="var(--text)" font-family="Arial, sans-serif">Parameters (N)</text>
  <text x="139.9999" y="489.4999" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)" font-family="Arial, sans-serif">1M</text>
  <text x="340" y="489.4999" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)" font-family="Arial, sans-serif">10M</text>
  <text x="540.0004" y="489.4999" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)" font-family="Arial, sans-serif">100M</text>
  <text x="740" y="489.4999" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)" font-family="Arial, sans-serif">1B</text>
  <text x="939.9999" y="489.4999" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)" font-family="Arial, sans-serif">10B</text>
  <text x="1140" y="489.4999" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)" font-family="Arial, sans-serif">100B</text>
  <path d="M 80 97.9999 Q 200 141.5 280.0004 213.9999 Q 399.9999 301.0001 540.0004 358.9999 Q 740 417 939.9999 438.75 Q 1080.0003 448.9 1220 453.2499" fill="none" stroke="var(--primary-border)" stroke-width="1.0665"/>
  <rect x="239.9999" y="185.0001" width="520" height="43.4999" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500.0001" y="213.9999" text-anchor="middle" font-size="22.0052" fill="var(--danger-accent)" font-family="Arial, sans-serif">Power law: L(N) = (Nc / N)^a</text>
  <line x1="320" y1="228.5" x2="280.0004" y2="250.25" stroke="var(--warn-border)" stroke-width="0.3555"/>
  <rect x="40" y="547.5" width="360" height="72.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.0002" y="576.5001" text-anchor="middle" font-size="22.0052" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. Model Size</text>
  <text x="220.0002" y="602.6" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)" font-family="Arial, sans-serif">(parameters)</text>
  <rect x="460" y="547.5" width="360" height="72.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0002" y="576.5001" text-anchor="middle" font-size="22.0052" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2. Dataset Size</text>
  <text x="640.0002" y="602.6" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)" font-family="Arial, sans-serif">(tokens)</text>
  <rect x="880" y="547.5" width="360" height="72.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="576.5001" text-anchor="middle" font-size="22.0052" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. Compute Budget</text>
  <text x="1060" y="602.6" text-anchor="middle" font-size="22.0052" fill="var(--text-muted)" font-family="Arial, sans-serif">(FLOPs)</text>
</svg>

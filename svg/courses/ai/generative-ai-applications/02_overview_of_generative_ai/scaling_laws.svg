<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="371.0145" y="27.8261" text-anchor="middle" font-size="14.8406" font-weight="bold" fill="var(--text)">Scaling Laws</text>
  <line x1="92.7536" y1="46.3768" x2="92.7536" y2="296.8116" stroke="var(--text)" stroke-width="1.8551" />
  <line x1="92.7536" y1="296.8116" x2="649.2754" y2="296.8116" stroke="var(--text)" stroke-width="1.8551" />
  <text x="46.3768" y="176.2319" text-anchor="middle" font-size="12.058" fill="var(--text)" transform="rotate(-90, 50, 190)">Loss</text>
  <text x="371.0145" y="329.2754" text-anchor="middle" font-size="12.058" fill="var(--text)">Parameters (N)</text>
  <text x="139.1304" y="315.3623" text-anchor="middle" font-size="10" fill="var(--text-muted)">1M</text>
  <text x="231.8841" y="315.3623" text-anchor="middle" font-size="10" fill="var(--text-muted)">10M</text>
  <text x="324.6377" y="315.3623" text-anchor="middle" font-size="10" fill="var(--text-muted)">100M</text>
  <text x="417.3913" y="315.3623" text-anchor="middle" font-size="10" fill="var(--text-muted)">1B</text>
  <text x="510.1449" y="315.3623" text-anchor="middle" font-size="10" fill="var(--text-muted)">10B</text>
  <text x="602.8986" y="315.3623" text-anchor="middle" font-size="10" fill="var(--text-muted)">100B</text>
  <path d="M 111.3043 64.9275 Q 166.9565 92.7536 204.058 139.1304 Q 259.7101 194.7826 324.6377 231.8841 Q 417.3913 268.9855 510.1449 282.8986 Q 575.0725 289.3913 640 292.1739" fill="none" stroke="var(--primary-border)" stroke-width="2.7826" />
  <rect x="185.5072" y="120.5797" width="241.1594" height="27.8261" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="306.087" y="139.1304" text-anchor="middle" font-size="10.2029" fill="var(--danger-accent)">Power law: L(N) = (Nc / N)^a</text>
  <line x1="222.6087" y1="148.4058" x2="204.058" y2="162.3188" stroke="var(--warn-border)" stroke-width="0.9275" />
  <rect x="92.7536" y="352.4638" width="166.9565" height="46.3768" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="176.2319" y="371.0145" text-anchor="middle" font-size="10.2029" font-weight="bold" fill="var(--text)">1. Model Size</text>
  <text x="176.2319" y="387.7101" text-anchor="middle" font-size="10" fill="var(--text-muted)">(parameters)</text>
  <rect x="287.5362" y="352.4638" width="166.9565" height="46.3768" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="371.0145" y="371.0145" text-anchor="middle" font-size="10.2029" font-weight="bold" fill="var(--text)">2. Dataset Size</text>
  <text x="371.0145" y="387.7101" text-anchor="middle" font-size="10" fill="var(--text-muted)">(tokens)</text>
  <rect x="482.3188" y="352.4638" width="166.9565" height="46.3768" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="565.7971" y="371.0145" text-anchor="middle" font-size="10.2029" font-weight="bold" fill="var(--text)">3. Compute Budget</text>
  <text x="565.7971" y="387.7101" text-anchor="middle" font-size="10" fill="var(--text-muted)">(FLOPs)</text>
</svg>
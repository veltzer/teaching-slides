<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="70" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">Top-p (Nucleus) Sampling</text>
  <text x="640" y="100" text-anchor="middle" font-size="15" fill="var(--text-muted)">Sorted token probabilities — keep smallest set whose cumulative mass ≥ p</text>

  <text x="180" y="150" text-anchor="end" font-size="16" fill="var(--text)">"Paris"</text>
  <rect x="200" y="130" width="800" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1020" y="150" font-size="15" fill="var(--text)">0.40 (cum 0.40)</text>

  <text x="180" y="200" text-anchor="end" font-size="16" fill="var(--text)">"Lyon"</text>
  <rect x="200" y="180" width="480" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="700" y="200" font-size="15" fill="var(--text)">0.24 (cum 0.64)</text>

  <text x="180" y="250" text-anchor="end" font-size="16" fill="var(--text)">"the"</text>
  <rect x="200" y="230" width="240" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="460" y="250" font-size="15" fill="var(--text)">0.12 (cum 0.76)</text>

  <text x="180" y="300" text-anchor="end" font-size="16" fill="var(--text)">"a"</text>
  <rect x="200" y="280" width="160" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="380" y="300" font-size="15" fill="var(--text)">0.08 (cum 0.84)</text>

  <text x="180" y="350" text-anchor="end" font-size="16" fill="var(--text)">"Marseille"</text>
  <rect x="200" y="330" width="120" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="340" y="350" font-size="15" fill="var(--text)">0.06 (cum 0.90)</text>

  <text x="180" y="400" text-anchor="end" font-size="16" fill="var(--text-muted)">"Berlin"</text>
  <rect x="200" y="380" width="80" height="30" rx="6" fill="var(--danger-fill)" opacity="0.45" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="300" y="400" font-size="15" fill="var(--text-muted)">0.04 (cum 0.94)</text>

  <text x="180" y="450" text-anchor="end" font-size="16" fill="var(--text-muted)">"one"</text>
  <rect x="200" y="430" width="40" height="30" rx="6" fill="var(--danger-fill)" opacity="0.35" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="260" y="450" font-size="15" fill="var(--text-muted)">0.02</text>

  <text x="180" y="500" text-anchor="end" font-size="16" fill="var(--text-muted)">"London"</text>
  <rect x="200" y="480" width="20" height="30" rx="6" fill="var(--danger-fill)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="240" y="500" font-size="15" fill="var(--text-muted)">0.01</text>

  <line x1="200" y1="370" x2="1240" y2="370" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="1240" y="362" text-anchor="end" font-size="15" font-weight="bold" fill="var(--danger-accent)">p = 0.9 cutoff</text>

  <rect x="40" y="530" width="590" height="90" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="335" y="565" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--ok-text)">Kept in nucleus</text>
  <text x="335" y="600" text-anchor="middle" font-size="15" fill="var(--ok-text)">Paris, Lyon, the, a, Marseille — sampled from</text>

  <rect x="650" y="530" width="590" height="90" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="945" y="565" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--danger-text)">Excluded (tail)</text>
  <text x="945" y="600" text-anchor="middle" font-size="15" fill="var(--danger-text)">Berlin, one, London — unreachable this step</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="661.6533" y="40" text-anchor="middle" font-size="23.0969" font-weight="bold" fill="var(--text)">Top-p (Nucleus) Sampling Visualized</text>
  <text x="661.6533" y="78.6667" text-anchor="middle" font-size="17.3227" fill="var(--text-muted)">Token probabilities (sorted):</text>
  <text x="257.4578" y="140.5333" text-anchor="end" font-size="17.3227" fill="var(--text)">"Paris"</text>
  <rect x="271.8933" y="117.3334" width="461.9378" height="34.0266" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="748.2666" y="142.08" font-size="15.8791" fill="var(--text)">0.40</text>
  <text x="257.4578" y="194.6667" text-anchor="end" font-size="17.3227" fill="var(--text)">"Lyon"</text>
  <rect x="271.8933" y="171.4667" width="277.1627" height="34.0266" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="563.4916" y="196.2133" font-size="15.8791" fill="var(--text)">0.24</text>
  <text x="257.4578" y="248.8" text-anchor="end" font-size="17.3227" fill="var(--text)">"the"</text>
  <rect x="271.8933" y="225.6001" width="138.5813" height="34.0266" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="424.9101" y="250.3467" font-size="15.8791" fill="var(--text)">0.12</text>
  <text x="257.4578" y="302.9333" text-anchor="end" font-size="17.3227" fill="var(--text)">"a"</text>
  <rect x="271.8933" y="279.7334" width="92.3875" height="34.0266" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="378.7164" y="304.48" font-size="15.8791" fill="var(--text)">0.08</text>
  <text x="257.4578" y="357.0666" text-anchor="end" font-size="17.3227" fill="var(--text)">"Marseille"</text>
  <rect x="271.8933" y="333.8667" width="69.2907" height="34.0266" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="355.6195" y="358.6134" font-size="15.8791" fill="var(--text)">0.06</text>
  <text x="257.4578" y="411.1999" text-anchor="end" font-size="17.3227" fill="var(--text)">"Berlin"</text>
  <rect x="271.8933" y="388" width="46.1938" height="34.0266" rx="6" fill="var(--ok-fill)" opacity="0.8" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="332.5226" y="412.7467" font-size="15.8791" fill="var(--text)">0.04</text>
  <text x="257.4578" y="465.3333" text-anchor="end" font-size="17.3227" fill="var(--text)">"one"</text>
  <rect x="271.8933" y="442.1334" width="23.0969" height="34.0266" rx="6" fill="var(--danger-fill)" opacity="0.5" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="309.4258" y="466.8799" font-size="15.8791" fill="var(--text-faint)">0.02</text>
  <text x="257.4578" y="519.4666" text-anchor="end" font-size="17.3227" fill="var(--text)">"London"</text>
  <rect x="271.8933" y="496.2667" width="11.5485" height="34.0266" rx="6" fill="var(--danger-fill)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="297.8773" y="521.0133" font-size="15.8791" fill="var(--text-faint)">0.01</text>
  <line x1="271.8933" y1="380.2666" x2="806.0089" y2="380.2666" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.8494 4.4247" />
  <text x="834.8799" y="377.1734" font-size="17.3227" font-weight="bold" fill="var(--danger-accent)">Top-p = 0.9 cutoff</text>
  <text x="834.8799" y="408.1067" font-size="15.8791" fill="var(--text-muted)">Cumulative prob reaches 0.9</text>
  <rect x="271.8933" y="565.8667" width="404.1956" height="54.1333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="473.991" y="599.8933" text-anchor="middle" font-size="15.8791" fill="var(--text)">Included: {Paris, Lyon, the, a, Marseille, Berlin}</text>
  <rect x="704.96" y="565.8667" width="317.5823" height="54.1333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="863.7511" y="599.8933" text-anchor="middle" font-size="15.8791" fill="var(--text)">Excluded: {one, London, ...}</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="589.9589" y="47.4074" text-anchor="middle" font-size="23.5984" font-weight="bold" fill="var(--text)">Top-p (Nucleus) Sampling Visualized</text>
  <text x="589.9589" y="86.9136" text-anchor="middle" font-size="17.6988" fill="var(--text-muted)">Token probabilities (sorted):</text>
  <text x="176.9877" y="150.1234" text-anchor="end" font-size="17.6988" fill="var(--text)">"Paris"</text>
  <rect x="191.7366" y="126.4198" width="471.9671" height="34.7654" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="678.4527" y="151.7037" font-size="16.2239" fill="var(--text)">0.40</text>
  <text x="176.9877" y="205.4321" text-anchor="end" font-size="17.6988" fill="var(--text)">"Lyon"</text>
  <rect x="191.7366" y="181.7284" width="283.1803" height="34.7654" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="489.6659" y="207.0123" font-size="16.2239" fill="var(--text)">0.24</text>
  <text x="176.9877" y="260.7407" text-anchor="end" font-size="17.6988" fill="var(--text)">"the"</text>
  <rect x="191.7366" y="237.0371" width="141.5901" height="34.7654" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="348.0757" y="262.321" font-size="16.2239" fill="var(--text)">0.12</text>
  <text x="176.9877" y="316.0493" text-anchor="end" font-size="17.6988" fill="var(--text)">"a"</text>
  <rect x="191.7366" y="292.3457" width="94.3934" height="34.7654" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="300.879" y="317.6296" font-size="16.2239" fill="var(--text)">0.08</text>
  <text x="176.9877" y="371.358" text-anchor="end" font-size="17.6988" fill="var(--text)">"Marseille"</text>
  <rect x="191.7366" y="347.6544" width="70.7951" height="34.7654" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="277.2807" y="372.9383" font-size="16.2239" fill="var(--text)">0.06</text>
  <text x="176.9877" y="426.6666" text-anchor="end" font-size="17.6988" fill="var(--text)">"Berlin"</text>
  <rect x="191.7366" y="402.963" width="47.1967" height="34.7654" rx="6" fill="var(--ok-fill)" opacity="0.8" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="253.6823" y="428.2469" font-size="16.2239" fill="var(--text)">0.04</text>
  <text x="176.9877" y="481.9753" text-anchor="end" font-size="17.6988" fill="var(--text)">"one"</text>
  <rect x="191.7366" y="458.2717" width="23.5984" height="34.7654" rx="6" fill="var(--danger-fill)" opacity="0.5" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="230.084" y="483.5555" font-size="16.2239" fill="var(--text-faint)">0.02</text>
  <text x="176.9877" y="537.2839" text-anchor="end" font-size="17.6988" fill="var(--text)">"London"</text>
  <rect x="191.7366" y="513.5803" width="11.7992" height="34.7654" rx="6" fill="var(--danger-fill)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="218.2848" y="538.8642" font-size="16.2239" fill="var(--text-faint)">0.01</text>
  <line x1="191.7366" y1="395.0617" x2="737.4486" y2="395.0617" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.8494 4.4247" />
  <text x="766.9465" y="391.9013" font-size="17.6988" font-weight="bold" fill="var(--danger-accent)">Top-p = 0.9 cutoff</text>
  <text x="766.9465" y="423.5062" font-size="16.2239" fill="var(--text-muted)">Cumulative prob reaches 0.9</text>
  <rect x="191.7366" y="584.6914" width="412.9712" height="55.3086" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="398.2222" y="619.4568" text-anchor="middle" font-size="16.2239" fill="var(--text)">Included: {Paris, Lyon, the, a, Marseille, Berlin}</text>
  <rect x="634.2058" y="584.6914" width="324.4774" height="55.3086" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="796.4445" y="619.4568" text-anchor="middle" font-size="16.2239" fill="var(--text)">Excluded: {one, London, ...}</text>
</svg>
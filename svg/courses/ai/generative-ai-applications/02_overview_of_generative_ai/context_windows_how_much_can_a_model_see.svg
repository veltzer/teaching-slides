<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999944" y="40" text-anchor="middle" font-size="28.2755" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CONTEXT WINDOW (128K tokens)</text>
  <rect x="40" y="84.615286" width="562.499982" height="178.46161" rx="6.881414" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.249991" y="147.076896" text-anchor="middle" font-size="22.97383" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">System Prompt</text>
  <text x="321.249991" y="191.692299" text-anchor="middle" font-size="21.206683" fill="var(--text-muted)" font-family="Arial, sans-serif">500 tokens</text>
  <rect x="677.500018" y="84.615286" width="562.499982" height="178.46161" rx="6.881414" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.750009" y="147.076896" text-anchor="middle" font-size="22.97383" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Conversation History</text>
  <text x="958.750009" y="191.692299" text-anchor="middle" font-size="21.206683" fill="var(--text-muted)" font-family="Arial, sans-serif">50K tokens</text>
  <rect x="40" y="316.615403" width="562.499982" height="178.46161" rx="6.881414" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.249991" y="379.077013" text-anchor="middle" font-size="22.97383" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Retrieved Context</text>
  <text x="321.249991" y="423.692299" text-anchor="middle" font-size="21.206683" fill="var(--text-muted)" font-family="Arial, sans-serif">70K tokens</text>
  <rect x="677.500018" y="316.615403" width="562.499982" height="178.46161" rx="6.881414" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.750009" y="379.077013" text-anchor="middle" font-size="22.97383" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">User Query</text>
  <text x="958.750009" y="423.692299" text-anchor="middle" font-size="21.206683" fill="var(--text-muted)" font-family="Arial, sans-serif">200 tokens</text>
  <rect x="40" y="548.615403" width="1199.999888" height="71.384597" rx="6.881414" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999944" y="595.01552" text-anchor="middle" font-size="22.97383" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Remaining for generation: ~7.3K tokens</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="648.5714" y="40" text-anchor="middle" font-size="23.4216" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Mixture of Experts (MoE) Architecture</text>
  <rect x="220.0001" y="73.3333" width="857.1429" height="80" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.5714" y="106.6667" text-anchor="middle" font-size="19.0301" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ROUTER (Gate)</text>
  <text x="648.5714" y="133.3333" text-anchor="middle" font-size="16.1024" fill="var(--text-muted)" font-family="Arial, sans-serif">Decides which experts to activate based on token's hidden state</text>
  <line x1="220.0001" y1="153.3334" x2="100" y2="200" stroke="var(--border)" stroke-width="1.3763"/>
  <line x1="357.1429" y1="153.3334" x2="254.2858" y2="200" stroke="var(--border)" stroke-width="1.3763"/>
  <line x1="494.2857" y1="153.3334" x2="408.5715" y2="200" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="631.4286" y1="153.3334" x2="562.8572" y2="200" stroke="var(--border)" stroke-width="1.3763"/>
  <line x1="768.5715" y1="153.3334" x2="717.143" y2="200" stroke="var(--border)" stroke-width="1.3763"/>
  <line x1="888.5715" y1="153.3334" x2="871.4286" y2="200" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="957.1429" y1="153.3334" x2="1025.7143" y2="200" stroke="var(--border)" stroke-width="1.3763"/>
  <line x1="1042.8572" y1="153.3334" x2="1180.0001" y2="200" stroke="var(--border)" stroke-width="1.3763"/>
  <rect x="40" y="200" width="120" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="100" y="246.6667" text-anchor="middle" font-size="17.5662" fill="var(--text-faint)" font-family="Arial, sans-serif">E1</text>
  <rect x="194.2857" y="200" width="120" height="80" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.2858" y="240" text-anchor="middle" font-size="17.5662" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">E2</text>
  <text x="254.2858" y="266.6667" text-anchor="middle" font-size="20.4939" fill="var(--ok-accent)" font-family="Arial, sans-serif">★</text>
  <rect x="348.5715" y="200" width="120" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="408.5715" y="246.6667" text-anchor="middle" font-size="17.5662" fill="var(--text-faint)" font-family="Arial, sans-serif">E3</text>
  <rect x="502.8572" y="200" width="120" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="562.8572" y="246.6667" text-anchor="middle" font-size="17.5662" fill="var(--text-faint)" font-family="Arial, sans-serif">E4</text>
  <rect x="657.1429" y="200" width="120" height="80" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="717.143" y="240" text-anchor="middle" font-size="17.5662" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">E5</text>
  <text x="717.143" y="266.6667" text-anchor="middle" font-size="20.4939" fill="var(--ok-accent)" font-family="Arial, sans-serif">★</text>
  <rect x="811.4287" y="200" width="120" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="871.4286" y="246.6667" text-anchor="middle" font-size="17.5662" fill="var(--text-faint)" font-family="Arial, sans-serif">E6</text>
  <rect x="965.7143" y="200" width="120" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1025.7143" y="246.6667" text-anchor="middle" font-size="17.5662" fill="var(--text-faint)" font-family="Arial, sans-serif">E7</text>
  <rect x="1120" y="200" width="120" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1180.0001" y="246.6667" text-anchor="middle" font-size="17.5662" fill="var(--text-faint)" font-family="Arial, sans-serif">E8</text>
  <text x="957.1429" y="313.3334" text-anchor="middle" font-size="16.1024" fill="var(--ok-accent)" font-family="Arial, sans-serif">★ = selected (Top-K=2)</text>
  <line x1="254.2858" y1="280.0001" x2="562.8572" y2="360" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="717.143" y1="280.0001" x2="562.8572" y2="360" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="442.8572" y="360" width="240.0001" height="53.3334" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="562.8572" y="393.3333" text-anchor="middle" font-size="19.0301" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Combine</text>
  <rect x="65.7143" y="453.3334" width="548.5714" height="66.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="340.0001" y="480" text-anchor="middle" font-size="16.1024" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Standard Transformer FFN</text>
  <text x="340.0001" y="504" text-anchor="middle" font-size="16.1024" fill="var(--text-muted)" font-family="Arial, sans-serif">Every token uses ALL parameters</text>
  <rect x="682.8573" y="453.3334" width="548.5714" height="66.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="957.1429" y="480" text-anchor="middle" font-size="16.1024" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">MoE FFN</text>
  <text x="957.1429" y="504" text-anchor="middle" font-size="16.1024" fill="var(--text-muted)" font-family="Arial, sans-serif">Each token routed to Top-K experts</text>
  <rect x="134.2857" y="546.6667" width="1028.5715" height="73.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.5714" y="576" text-anchor="middle" font-size="17.5662" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Mixtral 8x7B: 8 experts x 7B = 47B total params</text>
  <text x="648.5714" y="602.6666" text-anchor="middle" font-size="16.1024" fill="var(--danger-accent)" font-family="Arial, sans-serif">Only 2 experts active = ~13B params per token. Speed of 13B, quality of 47B!</text>
</svg>

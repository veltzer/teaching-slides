  <text x="648.5714" y="573.317076017251" text-anchor="middle" font-size="18.09383018255" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Mixtral 8x7B: 8 experts x 7B = 47B total params</text>
  <text x="648.5714" y="601.609686487214" text-anchor="middle" font-size="16.586062502504" fill="var(--danger-accent)" font-family="Arial, sans-serif">Only 2 experts active = ~13B params per token. Speed of 13B, quality of 47B!</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrD" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,15 0,7.5" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="587.2401" y="41.2903" text-anchor="middle" font-size="22.0215" font-weight="bold" fill="var(--text)">Mixture of Experts (MoE) Architecture</text>
  <rect x="220.2151" y="75.6989" width="734.0502" height="82.5806" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="587.2401" y="110.1075" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="var(--text)">ROUTER (Gate)</text>
  <text x="587.2401" y="137.6344" text-anchor="middle" font-size="15.1398" fill="var(--text-muted)">Decides which experts to activate based on token's hidden state</text>
  <line x1="220.2151" y1="158.2796" x2="117.448" y2="206.4516" stroke="var(--border)" stroke-width="1.3763" />
  <line x1="337.6631" y1="158.2796" x2="249.5771" y2="206.4516" stroke="var(--border)" stroke-width="1.3763" />
  <line x1="455.1111" y1="158.2796" x2="381.7061" y2="206.4516" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="572.5591" y1="158.2796" x2="513.8351" y2="206.4516" stroke="var(--border)" stroke-width="1.3763" />
  <line x1="690.0072" y1="158.2796" x2="645.9642" y2="206.4516" stroke="var(--border)" stroke-width="1.3763" />
  <line x1="792.7742" y1="158.2796" x2="778.0932" y2="206.4516" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="851.4982" y1="158.2796" x2="910.2222" y2="206.4516" stroke="var(--border)" stroke-width="1.3763" />
  <line x1="924.9032" y1="158.2796" x2="1042.3513" y2="206.4516" stroke="var(--border)" stroke-width="1.3763" />
  <rect x="66.0645" y="206.4516" width="102.767" height="82.5806" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="117.448" y="254.6237" text-anchor="middle" font-size="16.5161" fill="var(--text-faint)">E1</text>
  <rect x="198.1935" y="206.4516" width="102.767" height="82.5806" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="249.5771" y="247.7419" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="var(--ok-accent)">E2</text>
  <text x="249.5771" y="275.2688" text-anchor="middle" font-size="19.2688" fill="var(--ok-accent)">★</text>
  <rect x="330.3226" y="206.4516" width="102.767" height="82.5806" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="381.7061" y="254.6237" text-anchor="middle" font-size="16.5161" fill="var(--text-faint)">E3</text>
  <rect x="462.4516" y="206.4516" width="102.767" height="82.5806" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="513.8351" y="254.6237" text-anchor="middle" font-size="16.5161" fill="var(--text-faint)">E4</text>
  <rect x="594.5806" y="206.4516" width="102.767" height="82.5806" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="645.9642" y="247.7419" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="var(--ok-accent)">E5</text>
  <text x="645.9642" y="275.2688" text-anchor="middle" font-size="19.2688" fill="var(--ok-accent)">★</text>
  <rect x="726.7097" y="206.4516" width="102.767" height="82.5806" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="778.0932" y="254.6237" text-anchor="middle" font-size="16.5161" fill="var(--text-faint)">E6</text>
  <rect x="858.8387" y="206.4516" width="102.767" height="82.5806" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="910.2222" y="254.6237" text-anchor="middle" font-size="16.5161" fill="var(--text-faint)">E7</text>
  <rect x="990.9677" y="206.4516" width="102.767" height="82.5806" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1042.3513" y="254.6237" text-anchor="middle" font-size="16.5161" fill="var(--text-faint)">E8</text>
  <text x="851.4982" y="323.4409" text-anchor="middle" font-size="15.1398" fill="var(--ok-accent)">★ = selected (Top-K=2)</text>
  <line x1="249.5771" y1="289.0323" x2="513.8351" y2="371.6129" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="645.9642" y1="289.0323" x2="513.8351" y2="371.6129" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="411.0681" y="371.6129" width="205.5341" height="55.0538" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="513.8351" y="406.0215" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="var(--text)">Combine</text>
  <rect x="88.086" y="467.957" width="469.7921" height="68.8172" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="322.9821" y="495.4839" text-anchor="middle" font-size="15.1398" font-weight="bold" fill="var(--text)">Standard Transformer FFN</text>
  <text x="322.9821" y="520.2581" text-anchor="middle" font-size="15.1398" fill="var(--text-muted)">Every token uses ALL parameters</text>
  <rect x="616.6022" y="467.957" width="469.7921" height="68.8172" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="851.4982" y="495.4839" text-anchor="middle" font-size="15.1398" font-weight="bold" fill="var(--ok-accent)">MoE FFN</text>
  <text x="851.4982" y="520.2581" text-anchor="middle" font-size="15.1398" fill="var(--text-muted)">Each token routed to Top-K experts</text>
  <rect x="146.81" y="564.3011" width="880.8602" height="75.6989" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="587.2401" y="594.5806" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="var(--danger-accent)">Mixtral 8x7B: 8 experts x 7B = 47B total params</text>
  <text x="587.2401" y="622.1075" text-anchor="middle" font-size="15.1398" fill="var(--danger-accent)">Only 2 experts active = ~13B params per token. Speed of 13B, quality of 47B!</text>
</svg>
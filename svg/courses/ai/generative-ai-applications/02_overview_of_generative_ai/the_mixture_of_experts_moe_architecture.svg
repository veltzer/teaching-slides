<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrD" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,15 0,7.5" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="648.5714" y="40" text-anchor="middle" font-size="23.4216" font-weight="bold" fill="var(--text)">Mixture of Experts (MoE) Architecture</text>
  <rect x="220.0001" y="73.3333" width="857.1429" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="648.5714" y="106.6667" text-anchor="middle" font-size="19.0301" font-weight="bold" fill="var(--text)">ROUTER (Gate)</text>
  <text x="648.5714" y="133.3333" text-anchor="middle" font-size="16.1024" fill="var(--text-muted)">Decides which experts to activate based on token's hidden state</text>
  <line x1="220.0001" y1="153.3334" x2="100" y2="200" stroke="var(--border)" stroke-width="1.3763" />
  <line x1="357.1429" y1="153.3334" x2="254.2858" y2="200" stroke="var(--border)" stroke-width="1.3763" />
  <line x1="494.2857" y1="153.3334" x2="408.5715" y2="200" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="631.4286" y1="153.3334" x2="562.8572" y2="200" stroke="var(--border)" stroke-width="1.3763" />
  <line x1="768.5715" y1="153.3334" x2="717.143" y2="200" stroke="var(--border)" stroke-width="1.3763" />
  <line x1="888.5715" y1="153.3334" x2="871.4286" y2="200" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="957.1429" y1="153.3334" x2="1025.7143" y2="200" stroke="var(--border)" stroke-width="1.3763" />
  <line x1="1042.8572" y1="153.3334" x2="1180.0001" y2="200" stroke="var(--border)" stroke-width="1.3763" />
  <rect x="40" y="200" width="120" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="100" y="246.6667" text-anchor="middle" font-size="17.5662" fill="var(--text-faint)">E1</text>
  <rect x="194.2857" y="200" width="120" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="254.2858" y="240" text-anchor="middle" font-size="17.5662" font-weight="bold" fill="var(--ok-accent)">E2</text>
  <text x="254.2858" y="266.6667" text-anchor="middle" font-size="20.4939" fill="var(--ok-accent)">★</text>
  <rect x="348.5715" y="200" width="120" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="408.5715" y="246.6667" text-anchor="middle" font-size="17.5662" fill="var(--text-faint)">E3</text>
  <rect x="502.8572" y="200" width="120" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="562.8572" y="246.6667" text-anchor="middle" font-size="17.5662" fill="var(--text-faint)">E4</text>
  <rect x="657.1429" y="200" width="120" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="717.143" y="240" text-anchor="middle" font-size="17.5662" font-weight="bold" fill="var(--ok-accent)">E5</text>
  <text x="717.143" y="266.6667" text-anchor="middle" font-size="20.4939" fill="var(--ok-accent)">★</text>
  <rect x="811.4287" y="200" width="120" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="871.4286" y="246.6667" text-anchor="middle" font-size="17.5662" fill="var(--text-faint)">E6</text>
  <rect x="965.7143" y="200" width="120" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1025.7143" y="246.6667" text-anchor="middle" font-size="17.5662" fill="var(--text-faint)">E7</text>
  <rect x="1120" y="200" width="120" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1180.0001" y="246.6667" text-anchor="middle" font-size="17.5662" fill="var(--text-faint)">E8</text>
  <text x="957.1429" y="313.3334" text-anchor="middle" font-size="16.1024" fill="var(--ok-accent)">★ = selected (Top-K=2)</text>
  <line x1="254.2858" y1="280.0001" x2="562.8572" y2="360" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="717.143" y1="280.0001" x2="562.8572" y2="360" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="442.8572" y="360" width="240.0001" height="53.3334" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="562.8572" y="393.3333" text-anchor="middle" font-size="19.0301" font-weight="bold" fill="var(--text)">Combine</text>
  <rect x="65.7143" y="453.3334" width="548.5714" height="66.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="340.0001" y="480" text-anchor="middle" font-size="16.1024" font-weight="bold" fill="var(--text)">Standard Transformer FFN</text>
  <text x="340.0001" y="504" text-anchor="middle" font-size="16.1024" fill="var(--text-muted)">Every token uses ALL parameters</text>
  <rect x="682.8573" y="453.3334" width="548.5714" height="66.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="957.1429" y="480" text-anchor="middle" font-size="16.1024" font-weight="bold" fill="var(--ok-accent)">MoE FFN</text>
  <text x="957.1429" y="504" text-anchor="middle" font-size="16.1024" fill="var(--text-muted)">Each token routed to Top-K experts</text>
  <rect x="134.2857" y="546.6667" width="1028.5715" height="73.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="648.5714" y="576" text-anchor="middle" font-size="17.5662" font-weight="bold" fill="var(--danger-accent)">Mixtral 8x7B: 8 experts x 7B = 47B total params</text>
  <text x="648.5714" y="602.6666" text-anchor="middle" font-size="16.1024" fill="var(--danger-accent)">Only 2 experts active = ~13B params per token. Speed of 13B, quality of 47B!</text>
</svg>
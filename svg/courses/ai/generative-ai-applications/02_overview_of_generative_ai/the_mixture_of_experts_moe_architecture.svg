  <rect x="65.7143" y="443.170813221292" width="548.5714" height="70.731738370016" rx="6.180220030246" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="340.0001" y="471.463423691255" text-anchor="middle" font-size="16.586062502504" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Standard Transformer FFN</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="58.9862" y="37.4026" font-size="25.5607" fill="var(--text)">Sentence: "The animal didn't cross the street because it was too tired"</text>
  <text x="58.9862" y="78.961" font-size="25.5607" fill="var(--text-muted)">What does "it" refer to?</text>
  <text x="58.9862" y="124.6753" font-size="25.5607" font-weight="bold" fill="var(--text)">Attention weights for "it":</text>
  <text x="216.2827" y="174.5454" text-anchor="end" font-size="23.5945" fill="var(--text)">The</text>
  <rect x="235.9447" y="149.6104" width="72.7496" height="33.2468" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="216.2827" y="220.2597" text-anchor="end" font-size="23.5945" fill="var(--text)">animal</text>
  <rect x="235.9447" y="195.3247" width="432.5652" height="33.2468" rx="6" fill="var(--primary-accent)" />
  <text x="680.3072" y="220.2597" font-size="21.6283" fill="var(--primary-accent)"> ← high attention</text>
  <text x="216.2827" y="265.974" text-anchor="end" font-size="23.5945" fill="var(--text)">didn't</text>
  <rect x="235.9447" y="241.039" width="72.7496" height="33.2468" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="216.2827" y="311.6883" text-anchor="end" font-size="23.5945" fill="var(--text)">cross</text>
  <rect x="235.9447" y="286.7532" width="108.1413" height="33.2468" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="216.2827" y="357.4026" text-anchor="end" font-size="23.5945" fill="var(--text)">the</text>
  <rect x="235.9447" y="332.4675" width="35.3917" height="33.2468" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="216.2827" y="403.1169" text-anchor="end" font-size="23.5945" fill="var(--text)">street</text>
  <rect x="235.9447" y="378.1818" width="143.533" height="33.2468" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="216.2827" y="448.8311" text-anchor="end" font-size="23.5945" fill="var(--text)">because</text>
  <rect x="235.9447" y="423.8961" width="35.3917" height="33.2468" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="216.2827" y="494.5454" text-anchor="end" font-size="23.5945" fill="var(--text)">it</text>
  <rect x="235.9447" y="469.6104" width="108.1413" height="33.2468" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="216.2827" y="540.2597" text-anchor="end" font-size="23.5945" fill="var(--text)">was</text>
  <rect x="235.9447" y="515.3247" width="72.7496" height="33.2468" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="216.2827" y="585.974" text-anchor="end" font-size="23.5945" fill="var(--text)">too</text>
  <rect x="235.9447" y="561.039" width="72.7496" height="33.2468" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="216.2827" y="631.6883" text-anchor="end" font-size="23.5945" fill="var(--text)">tired</text>
  <rect x="235.9447" y="606.7532" width="180.891" height="33.2468" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="428.6329" y="631.6883" font-size="21.6283" fill="var(--primary-accent)"> ← helps disambiguate "it" = "animal"</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="341" y="40" font-size="24.6018" fill="var(--text)">Sentence: "The animal didn't cross the street because it was too tired"</text>
  <text x="341" y="80" font-size="24.6018" fill="var(--text-muted)">What does "it" refer to?</text>
  <text x="341" y="124" font-size="24.6018" font-weight="bold" fill="var(--text)">Attention weights for "it":</text>
  <text x="492.3924" y="171.9999" text-anchor="end" font-size="22.7093" fill="var(--text)">The</text>
  <rect x="511.3164" y="148" width="70.019" height="32" rx="5.9999" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="492.3924" y="216" text-anchor="end" font-size="22.7093" fill="var(--text)">animal</text>
  <rect x="511.3164" y="192" width="416.3291" height="32" rx="5.9999" fill="var(--primary-accent)" />
  <text x="939" y="216" font-size="20.8168" fill="var(--primary-accent)"> ← high attention</text>
  <text x="492.3924" y="260" text-anchor="end" font-size="22.7093" fill="var(--text)">didn't</text>
  <rect x="511.3164" y="236" width="70.019" height="32" rx="5.9999" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="492.3924" y="304" text-anchor="end" font-size="22.7093" fill="var(--text)">cross</text>
  <rect x="511.3164" y="280" width="104.0823" height="32" rx="5.9999" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="492.3924" y="348" text-anchor="end" font-size="22.7093" fill="var(--text)">the</text>
  <rect x="511.3164" y="324" width="34.0633" height="32" rx="5.9999" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="492.3924" y="392" text-anchor="end" font-size="22.7093" fill="var(--text)">street</text>
  <rect x="511.3164" y="368" width="138.1456" height="32" rx="5.9999" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="492.3924" y="435.9999" text-anchor="end" font-size="22.7093" fill="var(--text)">because</text>
  <rect x="511.3164" y="412" width="34.0633" height="32" rx="5.9999" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="492.3924" y="479.9999" text-anchor="end" font-size="22.7093" fill="var(--text)">it</text>
  <rect x="511.3164" y="456" width="104.0823" height="32" rx="5.9999" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="492.3924" y="524" text-anchor="end" font-size="22.7093" fill="var(--text)">was</text>
  <rect x="511.3164" y="500" width="70.019" height="32" rx="5.9999" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="492.3924" y="568" text-anchor="end" font-size="22.7093" fill="var(--text)">too</text>
  <rect x="511.3164" y="544" width="70.019" height="32" rx="5.9999" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="492.3924" y="612" text-anchor="end" font-size="22.7093" fill="var(--text)">tired</text>
  <rect x="511.3164" y="588" width="174.1014" height="32" rx="5.9999" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="696.7722" y="612" font-size="20.8168" fill="var(--primary-accent)"> ← helps disambiguate "it" = "animal"</text>
</svg>
    </defs>
  <ns0:text x="58.9862" y="37.4026" font-size="25.5607" fill="#222222">Sentence: "The animal didn't cross the street because it was too tired"</ns0:text>
  <ns0:text x="58.9862" y="78.961" font-size="25.5607" fill="#555555">What does "it" refer to?</ns0:text>
  <ns0:text x="58.9862" y="124.6753" font-size="25.5607" font-weight="bold" fill="#222222">Attention weights for "it":</ns0:text>
  <ns0:text x="216.2827" y="174.5454" text-anchor="end" font-size="23.5945" fill="#222222">The</ns0:text>
  <ns0:rect x="235.9447" y="149.6104" width="72.7496" height="33.2468" rx="3.9324" fill="#90caf9" />
  <ns0:text x="216.2827" y="220.2597" text-anchor="end" font-size="23.5945" fill="#222222">animal</ns0:text>
  <ns0:rect x="235.9447" y="195.3247" width="432.5652" height="33.2468" rx="3.9324" fill="#1565c0" />
  <ns0:text x="680.3072" y="220.2597" font-size="21.6283" fill="#1565c0"> ← high attention</ns0:text>
  <ns0:text x="216.2827" y="265.974" text-anchor="end" font-size="23.5945" fill="#222222">didn't</ns0:text>
  <ns0:rect x="235.9447" y="241.039" width="72.7496" height="33.2468" rx="3.9324" fill="#90caf9" />
  <ns0:text x="216.2827" y="311.6883" text-anchor="end" font-size="23.5945" fill="#222222">cross</ns0:text>
  <ns0:rect x="235.9447" y="286.7532" width="108.1413" height="33.2468" rx="3.9324" fill="#90caf9" />
  <ns0:text x="216.2827" y="357.4026" text-anchor="end" font-size="23.5945" fill="#222222">the</ns0:text>
  <ns0:rect x="235.9447" y="332.4675" width="35.3917" height="33.2468" rx="3.9324" fill="#90caf9" />
  <ns0:text x="216.2827" y="403.1169" text-anchor="end" font-size="23.5945" fill="#222222">street</ns0:text>
  <ns0:rect x="235.9447" y="378.1818" width="143.533" height="33.2468" rx="3.9324" fill="#90caf9" />
  <ns0:text x="216.2827" y="448.8311" text-anchor="end" font-size="23.5945" fill="#222222">because</ns0:text>
  <ns0:rect x="235.9447" y="423.8961" width="35.3917" height="33.2468" rx="3.9324" fill="#90caf9" />
  <ns0:text x="216.2827" y="494.5454" text-anchor="end" font-size="23.5945" fill="#222222">it</ns0:text>
  <ns0:rect x="235.9447" y="469.6104" width="108.1413" height="33.2468" rx="3.9324" fill="#90caf9" />
  <ns0:text x="216.2827" y="540.2597" text-anchor="end" font-size="23.5945" fill="#222222">was</ns0:text>
  <ns0:rect x="235.9447" y="515.3247" width="72.7496" height="33.2468" rx="3.9324" fill="#90caf9" />
  <ns0:text x="216.2827" y="585.974" text-anchor="end" font-size="23.5945" fill="#222222">too</ns0:text>
  <ns0:rect x="235.9447" y="561.039" width="72.7496" height="33.2468" rx="3.9324" fill="#90caf9" />
  <ns0:text x="216.2827" y="631.6883" text-anchor="end" font-size="23.5945" fill="#222222">tired</ns0:text>
  <ns0:rect x="235.9447" y="606.7532" width="180.891" height="33.2468" rx="3.9324" fill="#90caf9" />
  <ns0:text x="428.6329" y="631.6883" font-size="21.6283" fill="#1565c0"> ← helps disambiguate "it" = "animal"</ns0:text>
</ns0:svg>
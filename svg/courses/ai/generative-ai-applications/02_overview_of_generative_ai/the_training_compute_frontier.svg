  <!-- Note -->
  <rect x="100" y="375" width="600" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="400" y="397" text-anchor="middle" font-size="12" fill="#856404">Compute doubles every 6-8 months. Cost grows faster than Moore's Law.</text>

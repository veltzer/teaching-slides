  <rect x="310" y="50" width="250" height="35" rx="5" fill="#4a90e2"/><text x="435" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Training Compute (FLOPs)</text>
  <rect x="580" y="50" width="140" height="35" rx="5" fill="#4a90e2"/><text x="650" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Year</text>
  <!-- Rows -->
  <rect x="40" y="95" width="250" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2"/><text x="165" y="118" text-anchor="middle" font-size="12" fill="#333">GPT-2</text>
  <rect x="310" y="95" width="250" height="35" rx="3" fill="#f8f9fa" stroke="#dee2e6"/><text x="435" y="118" text-anchor="middle" font-size="12" fill="#555">1.5 x 10^19</text>
  <rect x="580" y="95" width="140" height="35" rx="3" fill="#f8f9fa" stroke="#dee2e6"/><text x="650" y="118" text-anchor="middle" font-size="12" fill="#555">2019</text>
  <!-- bar -->
  <rect x="42" y="128" width="10" height="4" fill="#4a90e2" rx="1"/>

  <rect x="40" y="140" width="250" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2"/><text x="165" y="163" text-anchor="middle" font-size="12" fill="#333">GPT-3</text>
  <rect x="310" y="140" width="250" height="35" rx="3" fill="#f8f9fa" stroke="#dee2e6"/><text x="435" y="163" text-anchor="middle" font-size="12" fill="#555">3.1 x 10^23</text>
  <rect x="580" y="140" width="140" height="35" rx="3" fill="#f8f9fa" stroke="#dee2e6"/><text x="650" y="163" text-anchor="middle" font-size="12" fill="#555">2020</text>

  <rect x="40" y="185" width="250" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2"/><text x="165" y="208" text-anchor="middle" font-size="12" fill="#333">PaLM</text>
  <rect x="310" y="185" width="250" height="35" rx="3" fill="#f8f9fa" stroke="#dee2e6"/><text x="435" y="208" text-anchor="middle" font-size="12" fill="#555">2.5 x 10^24</text>
  <rect x="580" y="185" width="140" height="35" rx="3" fill="#f8f9fa" stroke="#dee2e6"/><text x="650" y="208" text-anchor="middle" font-size="12" fill="#555">2022</text>

  <rect x="40" y="230" width="250" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2"/><text x="165" y="253" text-anchor="middle" font-size="12" fill="#333">GPT-4</text>
  <rect x="310" y="230" width="250" height="35" rx="3" fill="#f8f9fa" stroke="#dee2e6"/><text x="435" y="253" text-anchor="middle" font-size="12" fill="#555">~2.1 x 10^25 (est.)</text>

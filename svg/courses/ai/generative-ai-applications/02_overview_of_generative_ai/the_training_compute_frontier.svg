  <rect x="40" y="275" width="250" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2"/><text x="165" y="298" text-anchor="middle" font-size="12" fill="#333">Gemini Ultra</text>
  <rect x="310" y="275" width="250" height="35" rx="3" fill="#f8f9fa" stroke="#dee2e6"/><text x="435" y="298" text-anchor="middle" font-size="12" fill="#555">~5 x 10^25 (est.)</text>
  <rect x="580" y="275" width="140" height="35" rx="3" fill="#f8f9fa" stroke="#dee2e6"/><text x="650" y="298" text-anchor="middle" font-size="12" fill="#555">2023</text>

  <rect x="40" y="320" width="250" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2"/><text x="165" y="343" text-anchor="middle" font-size="12" fill="#333">LLaMA 3 405B</text>

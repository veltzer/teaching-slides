<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="675.2942" y="40" text-anchor="middle" font-size="25.3686" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The Training Compute Frontier</text>
  <rect x="40" y="70.5263" width="441.1765" height="53.421" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260.5883" y="105.6316" text-anchor="middle" font-size="20.612" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Model</text>
  <rect x="516.4706" y="70.5263" width="441.1765" height="53.421" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="737.0588" y="105.6316" text-anchor="middle" font-size="20.612" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Training Compute (FLOPs)</text>
  <rect x="992.9412" y="70.5263" width="247.0588" height="53.421" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.4705" y="105.6316" text-anchor="middle" font-size="20.612" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Year</text>
  <rect x="40" y="139.2105" width="441.1765" height="53.421" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260.5883" y="174.3157" text-anchor="middle" font-size="19.0264" fill="var(--text)" font-family="Arial, sans-serif">GPT-2</text>
  <rect x="516.4706" y="139.2105" width="441.1765" height="53.421" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="737.0588" y="174.3157" text-anchor="middle" font-size="19.0264" fill="var(--text-muted)" font-family="Arial, sans-serif">1.5 x 10^19</text>
  <rect x="992.9412" y="139.2105" width="247.0588" height="53.421" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1116.4705" y="174.3157" text-anchor="middle" font-size="19.0264" fill="var(--text-muted)" font-family="Arial, sans-serif">2019</text>
  <rect x="43.5294" y="189.5789" width="17.647" height="6.1053" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="207.8947" width="441.1765" height="53.421" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260.5883" y="243.0001" text-anchor="middle" font-size="19.0264" fill="var(--text)" font-family="Arial, sans-serif">GPT-3</text>
  <rect x="516.4706" y="207.8947" width="441.1765" height="53.421" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="737.0588" y="243.0001" text-anchor="middle" font-size="19.0264" fill="var(--text-muted)" font-family="Arial, sans-serif">3.1 x 10^23</text>
  <rect x="992.9412" y="207.8947" width="247.0588" height="53.421" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1116.4705" y="243.0001" text-anchor="middle" font-size="19.0264" fill="var(--text-muted)" font-family="Arial, sans-serif">2020</text>
  <rect x="40" y="276.5789" width="441.1765" height="53.421" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260.5883" y="311.6842" text-anchor="middle" font-size="19.0264" fill="var(--text)" font-family="Arial, sans-serif">PaLM</text>
  <rect x="516.4706" y="276.5789" width="441.1765" height="53.421" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="737.0588" y="311.6842" text-anchor="middle" font-size="19.0264" fill="var(--text-muted)" font-family="Arial, sans-serif">2.5 x 10^24</text>
  <rect x="992.9412" y="276.5789" width="247.0588" height="53.421" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1116.4705" y="311.6842" text-anchor="middle" font-size="19.0264" fill="var(--text-muted)" font-family="Arial, sans-serif">2022</text>
  <rect x="40" y="345.2632" width="441.1765" height="53.421" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260.5883" y="380.3685" text-anchor="middle" font-size="19.0264" fill="var(--text)" font-family="Arial, sans-serif">GPT-4</text>
  <rect x="516.4706" y="345.2632" width="441.1765" height="53.421" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="737.0588" y="380.3685" text-anchor="middle" font-size="19.0264" fill="var(--text-muted)" font-family="Arial, sans-serif">~2.1 x 10^25 (est.)</text>

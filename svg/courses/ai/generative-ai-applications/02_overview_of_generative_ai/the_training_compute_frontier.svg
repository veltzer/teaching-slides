  <rect x="40" y="482.6316" width="441.1765" height="53.421" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260.5883" y="517.7369" text-anchor="middle" font-size="19.0264" fill="var(--text)" font-family="Arial, sans-serif">LLaMA 3 405B</text>
  <rect x="516.4706" y="482.6316" width="441.1765" height="53.421" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="737.0588" y="517.7369" text-anchor="middle" font-size="19.0264" fill="var(--text-muted)" font-family="Arial, sans-serif">~3.8 x 10^25 (est.)</text>
  <rect x="992.9412" y="482.6316" width="247.0588" height="53.421" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1116.4705" y="517.7369" text-anchor="middle" font-size="19.0264" fill="var(--text-muted)" font-family="Arial, sans-serif">2024</text>
  <rect x="145.8824" y="566.579" width="1058.8235" height="53.421" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="675.2942" y="600.1579" text-anchor="middle" font-size="19.0264" fill="var(--danger-accent)" font-family="Arial, sans-serif">Compute doubles every 6-8 months. Cost grows faster than Moore's Law.</text>
</svg>
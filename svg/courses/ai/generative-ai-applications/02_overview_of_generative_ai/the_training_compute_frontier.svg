  <rect x="40" y="413.9474" width="441.1765" height="53.421" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260.5883" y="449.0526" text-anchor="middle" font-size="19.0264" fill="var(--text)" font-family="Arial, sans-serif">Gemini Ultra</text>
  <rect x="516.4706" y="413.9474" width="441.1765" height="53.421" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="737.0588" y="449.0526" text-anchor="middle" font-size="19.0264" fill="var(--text-muted)" font-family="Arial, sans-serif">~5 x 10^25 (est.)</text>
  <rect x="992.9412" y="413.9474" width="247.0588" height="53.421" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,15 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="574.8772" y="40.4211" text-anchor="middle" font-size="21.5579" font-weight="bold" fill="var(--text)">Retrieval-Augmented Generation (RAG)</text>
  <rect x="57.4877" y="67.3684" width="459.9018" height="80.8421" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="287.4386" y="97.0105" text-anchor="middle" font-size="16.1684" font-weight="bold" fill="var(--danger-accent)">Problem</text>
  <text x="287.4386" y="123.9579" text-anchor="middle" font-size="14.8211" fill="var(--text-muted)">LLMs have knowledge cutoffs and hallucinate</text>
  <rect x="632.3649" y="67.3684" width="459.9018" height="80.8421" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="862.3158" y="97.0105" text-anchor="middle" font-size="16.1684" font-weight="bold" fill="var(--ok-accent)">Solution</text>
  <text x="862.3158" y="123.9579" text-anchor="middle" font-size="14.8211" fill="var(--text-muted)">Give the model relevant documents at query time</text>
  <rect x="316.1825" y="188.6316" width="517.3895" height="53.8947" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="574.8772" y="222.3158" text-anchor="middle" font-size="16.1684" fill="var(--text)">User: "What was our Q4 revenue?"</text>
  <line x1="574.8772" y1="242.5263" x2="574.8772" y2="282.9474" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="316.1825" y="282.9474" width="517.3895" height="53.8947" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="574.8772" y="316.6316" text-anchor="middle" font-size="16.1684" fill="var(--danger-accent)">Step 1: Search company docs</text>
  <line x1="574.8772" y1="336.8421" x2="574.8772" y2="363.7895" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="316.1825" y="363.7895" width="517.3895" height="53.8947" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="574.8772" y="397.4737" text-anchor="middle" font-size="16.1684" fill="var(--danger-accent)">Step 2: Retrieve "Q4 revenue: $12.3M..."</text>
  <line x1="574.8772" y1="417.6842" x2="574.8772" y2="444.6316" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="316.1825" y="444.6316" width="517.3895" height="53.8947" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="574.8772" y="478.3158" text-anchor="middle" font-size="16.1684" fill="var(--danger-accent)">Step 3: Generate response WITH document</text>
  <line x1="574.8772" y1="498.5263" x2="574.8772" y2="525.4737" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="244.3228" y="525.4737" width="661.1088" height="53.8947" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="574.8772" y="559.1579" text-anchor="middle" font-size="16.1684" fill="var(--text)">"Based on the financial report, Q4 revenue was $12.3M."</text>
  <rect x="57.4877" y="599.5789" width="229.9509" height="40.4211" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="172.4632" y="626.5263" text-anchor="middle" font-size="13.4737" fill="var(--text)">Grounded in data</text>
  <rect x="308.9965" y="599.5789" width="201.207" height="40.4211" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="409.6" y="626.5263" text-anchor="middle" font-size="13.4737" fill="var(--text)">Up-to-date info</text>
  <rect x="531.7614" y="599.5789" width="201.207" height="40.4211" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="632.3649" y="626.5263" text-anchor="middle" font-size="13.4737" fill="var(--text)">Auditable sources</text>
  <rect x="754.5263" y="599.5789" width="273.0667" height="40.4211" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="891.0596" y="626.5263" text-anchor="middle" font-size="13.4737" fill="var(--text)">No fine-tuning needed</text>
</svg>
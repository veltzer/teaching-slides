<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Retrieval-Augmented Generation (RAG)</text>
  <!-- Problem/Solution -->
  <rect x="40" y="50" width="320" height="60" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="200" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Problem</text>
  <text x="200" y="92" text-anchor="middle" font-size="11" fill="#555">LLMs have knowledge cutoffs and hallucinate</text>
  <rect x="440" y="50" width="320" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="600" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Solution</text>
  <text x="600" y="92" text-anchor="middle" font-size="11" fill="#555">Give the model relevant documents at query time</text>
  <!-- User query -->
  <rect x="220" y="140" width="360" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="165" text-anchor="middle" font-size="12" fill="#333">User: "What was our Q4 revenue?"</text>
  <line x1="400" y1="180" x2="400" y2="210" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Step 1 -->
  <rect x="220" y="210" width="360" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="400" y="235" text-anchor="middle" font-size="12" fill="#856404">Step 1: Search company docs</text>
  <line x1="400" y1="250" x2="400" y2="270" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Step 2 -->
  <rect x="220" y="270" width="360" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="400" y="295" text-anchor="middle" font-size="12" fill="#856404">Step 2: Retrieve "Q4 revenue: $12.3M..."</text>
  <line x1="400" y1="310" x2="400" y2="330" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Step 3 -->
  <rect x="220" y="330" width="360" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="400" y="355" text-anchor="middle" font-size="12" fill="#856404">Step 3: Generate response WITH document</text>
  <line x1="400" y1="370" x2="400" y2="390" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Response -->
  <rect x="170" y="390" width="460" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="400" y="415" text-anchor="middle" font-size="12" fill="#333">"Based on the financial report, Q4 revenue was $12.3M."</text>
  <!-- Benefits -->
  <rect x="40" y="445" width="160" height="30" rx="5" fill="#d4edda" stroke="#28a745"/><text x="120" y="465" text-anchor="middle" font-size="10" fill="#333">Grounded in data</text>
  <rect x="215" y="445" width="140" height="30" rx="5" fill="#d4edda" stroke="#28a745"/><text x="285" y="465" text-anchor="middle" font-size="10" fill="#333">Up-to-date info</text>
  <rect x="370" y="445" width="140" height="30" rx="5" fill="#d4edda" stroke="#28a745"/><text x="440" y="465" text-anchor="middle" font-size="10" fill="#333">Auditable sources</text>
  <rect x="525" y="445" width="190" height="30" rx="5" fill="#d4edda" stroke="#28a745"/><text x="620" y="465" text-anchor="middle" font-size="10" fill="#333">No fine-tuning needed</text>
</svg>
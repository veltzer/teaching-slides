<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="16" markerHeight="10.5" refX="16" refY="5.25" orient="auto">
      <polygon points="0,15 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Retrieval-Augmented Generation (RAG)</text>
  <rect x="64" y="75" width="512" height="90" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="2.25" />
  <text x="320" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#dc3545">Problem</text>
  <text x="320" y="138" text-anchor="middle" font-size="16.5" fill="#555">LLMs have knowledge cutoffs and hallucinate</text>
  <rect x="704" y="75" width="512" height="90" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="960" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#28a745">Solution</text>
  <text x="960" y="138" text-anchor="middle" font-size="16.5" fill="#555">Give the model relevant documents at query time</text>
  <rect x="352" y="210" width="576" height="60" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="247.5" text-anchor="middle" font-size="18" fill="#333">User: "What was our Q4 revenue?"</text>
  <line x1="640" y1="270" x2="640" y2="315" stroke="#4a90e2" stroke-width="2.25" marker-end="url(#arr)" />
  <rect x="352" y="315" width="576" height="60" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="2.25" />
  <text x="640" y="352.5" text-anchor="middle" font-size="18" fill="#856404">Step 1: Search company docs</text>
  <line x1="640" y1="375" x2="640" y2="405" stroke="#4a90e2" stroke-width="2.25" marker-end="url(#arr)" />
  <rect x="352" y="405" width="576" height="60" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="2.25" />
  <text x="640" y="442.5" text-anchor="middle" font-size="18" fill="#856404">Step 2: Retrieve "Q4 revenue: $12.3M..."</text>
  <line x1="640" y1="465" x2="640" y2="495" stroke="#4a90e2" stroke-width="2.25" marker-end="url(#arr)" />
  <rect x="352" y="495" width="576" height="60" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="2.25" />
  <text x="640" y="532.5" text-anchor="middle" font-size="18" fill="#856404">Step 3: Generate response WITH document</text>
  <line x1="640" y1="555" x2="640" y2="585" stroke="#4a90e2" stroke-width="2.25" marker-end="url(#arr)" />
  <rect x="272" y="585" width="736" height="60" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="640" y="622.5" text-anchor="middle" font-size="18" fill="#333">"Based on the financial report, Q4 revenue was $12.3M."</text>
  <rect x="64" y="667.5" width="256" height="45" rx="7.5" fill="#d4edda" stroke="#28a745" />
  <text x="192" y="697.5" text-anchor="middle" font-size="15" fill="#333">Grounded in data</text>
  <rect x="344" y="667.5" width="224" height="45" rx="7.5" fill="#d4edda" stroke="#28a745" />
  <text x="456" y="697.5" text-anchor="middle" font-size="15" fill="#333">Up-to-date info</text>
  <rect x="592" y="667.5" width="224" height="45" rx="7.5" fill="#d4edda" stroke="#28a745" />
  <text x="704" y="697.5" text-anchor="middle" font-size="15" fill="#333">Auditable sources</text>
  <rect x="840" y="667.5" width="304" height="45" rx="7.5" fill="#d4edda" stroke="#28a745" />
  <text x="992" y="697.5" text-anchor="middle" font-size="15" fill="#333">No fine-tuning needed</text>
</svg>
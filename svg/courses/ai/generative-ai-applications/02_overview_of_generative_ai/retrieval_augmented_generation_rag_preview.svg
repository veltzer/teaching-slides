<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,15 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="574.8772" y="40.4211" text-anchor="middle" font-size="21.5579" font-weight="bold" fill="var(--text-dark)">Retrieval-Augmented Generation (RAG)</text>
  <rect x="57.4877" y="67.3684" width="459.9018" height="80.8421" rx="6.7368" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.0211" />
  <text x="287.4386" y="97.0105" text-anchor="middle" font-size="16.1684" font-weight="bold" fill="var(--danger-bright)">Problem</text>
  <text x="287.4386" y="123.9579" text-anchor="middle" font-size="14.8211" fill="var(--text-muted)">LLMs have knowledge cutoffs and hallucinate</text>
  <rect x="632.3649" y="67.3684" width="459.9018" height="80.8421" rx="6.7368" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.0211" />
  <text x="862.3158" y="97.0105" text-anchor="middle" font-size="16.1684" font-weight="bold" fill="var(--ok-bright)">Solution</text>
  <text x="862.3158" y="123.9579" text-anchor="middle" font-size="14.8211" fill="var(--text-muted)">Give the model relevant documents at query time</text>
  <rect x="316.1825" y="188.6316" width="517.3895" height="53.8947" rx="6.7368" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6947" />
  <text x="574.8772" y="222.3158" text-anchor="middle" font-size="16.1684" fill="var(--text-dark)">User: "What was our Q4 revenue?"</text>
  <line x1="574.8772" y1="242.5263" x2="574.8772" y2="282.9474" stroke="var(--primary-bright)" stroke-width="2.0211" marker-end="url(#arr)" />
  <rect x="316.1825" y="282.9474" width="517.3895" height="53.8947" rx="6.7368" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.0211" />
  <text x="574.8772" y="316.6316" text-anchor="middle" font-size="16.1684" fill="var(--danger-deeper)">Step 1: Search company docs</text>
  <line x1="574.8772" y1="336.8421" x2="574.8772" y2="363.7895" stroke="var(--primary-bright)" stroke-width="2.0211" marker-end="url(#arr)" />
  <rect x="316.1825" y="363.7895" width="517.3895" height="53.8947" rx="6.7368" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.0211" />
  <text x="574.8772" y="397.4737" text-anchor="middle" font-size="16.1684" fill="var(--danger-deeper)">Step 2: Retrieve "Q4 revenue: $12.3M..."</text>
  <line x1="574.8772" y1="417.6842" x2="574.8772" y2="444.6316" stroke="var(--primary-bright)" stroke-width="2.0211" marker-end="url(#arr)" />
  <rect x="316.1825" y="444.6316" width="517.3895" height="53.8947" rx="6.7368" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.0211" />
  <text x="574.8772" y="478.3158" text-anchor="middle" font-size="16.1684" fill="var(--danger-deeper)">Step 3: Generate response WITH document</text>
  <line x1="574.8772" y1="498.5263" x2="574.8772" y2="525.4737" stroke="var(--primary-bright)" stroke-width="2.0211" marker-end="url(#arr)" />
  <rect x="244.3228" y="525.4737" width="661.1088" height="53.8947" rx="6.7368" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.6947" />
  <text x="574.8772" y="559.1579" text-anchor="middle" font-size="16.1684" fill="var(--text-dark)">"Based on the financial report, Q4 revenue was $12.3M."</text>
  <rect x="57.4877" y="599.5789" width="229.9509" height="40.4211" rx="6.7368" fill="var(--ok-pale2)" stroke="var(--ok-bright)" />
  <text x="172.4632" y="626.5263" text-anchor="middle" font-size="13.4737" fill="var(--text-dark)">Grounded in data</text>
  <rect x="308.9965" y="599.5789" width="201.207" height="40.4211" rx="6.7368" fill="var(--ok-pale2)" stroke="var(--ok-bright)" />
  <text x="409.6" y="626.5263" text-anchor="middle" font-size="13.4737" fill="var(--text-dark)">Up-to-date info</text>
  <rect x="531.7614" y="599.5789" width="201.207" height="40.4211" rx="6.7368" fill="var(--ok-pale2)" stroke="var(--ok-bright)" />
  <text x="632.3649" y="626.5263" text-anchor="middle" font-size="13.4737" fill="var(--text-dark)">Auditable sources</text>
  <rect x="754.5263" y="599.5789" width="273.0667" height="40.4211" rx="6.7368" fill="var(--ok-pale2)" stroke="var(--ok-bright)" />
  <text x="891.0596" y="626.5263" text-anchor="middle" font-size="13.4737" fill="var(--text-dark)">No fine-tuning needed</text>
</svg>
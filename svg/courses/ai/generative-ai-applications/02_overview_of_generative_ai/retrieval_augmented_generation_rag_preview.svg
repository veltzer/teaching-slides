<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="16" markerHeight="10.5" refX="16" refY="5.25" orient="auto">
      <ns0:polygon points="0,15 5.6,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="574.8772" y="40.4211" text-anchor="middle" font-size="21.5579" font-weight="bold" fill="#333">Retrieval-Augmented Generation (RAG)</ns0:text>
  <ns0:rect x="57.4877" y="67.3684" width="459.9018" height="80.8421" rx="6.7368" fill="#f8d7da" stroke="#dc3545" stroke-width="2.0211" />
  <ns0:text x="287.4386" y="97.0105" text-anchor="middle" font-size="16.1684" font-weight="bold" fill="#dc3545">Problem</ns0:text>
  <ns0:text x="287.4386" y="123.9579" text-anchor="middle" font-size="14.8211" fill="#555">LLMs have knowledge cutoffs and hallucinate</ns0:text>
  <ns0:rect x="632.3649" y="67.3684" width="459.9018" height="80.8421" rx="6.7368" fill="#d4edda" stroke="#28a745" stroke-width="2.0211" />
  <ns0:text x="862.3158" y="97.0105" text-anchor="middle" font-size="16.1684" font-weight="bold" fill="#28a745">Solution</ns0:text>
  <ns0:text x="862.3158" y="123.9579" text-anchor="middle" font-size="14.8211" fill="#555">Give the model relevant documents at query time</ns0:text>
  <ns0:rect x="316.1825" y="188.6316" width="517.3895" height="53.8947" rx="6.7368" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.6947" />
  <ns0:text x="574.8772" y="222.3158" text-anchor="middle" font-size="16.1684" fill="#333">User: "What was our Q4 revenue?"</ns0:text>
  <ns0:line x1="574.8772" y1="242.5263" x2="574.8772" y2="282.9474" stroke="#4a90e2" stroke-width="2.0211" marker-end="url(#arr)" />
  <ns0:rect x="316.1825" y="282.9474" width="517.3895" height="53.8947" rx="6.7368" fill="#fff3cd" stroke="#ffc107" stroke-width="2.0211" />
  <ns0:text x="574.8772" y="316.6316" text-anchor="middle" font-size="16.1684" fill="#bf360c">Step 1: Search company docs</ns0:text>
  <ns0:line x1="574.8772" y1="336.8421" x2="574.8772" y2="363.7895" stroke="#4a90e2" stroke-width="2.0211" marker-end="url(#arr)" />
  <ns0:rect x="316.1825" y="363.7895" width="517.3895" height="53.8947" rx="6.7368" fill="#fff3cd" stroke="#ffc107" stroke-width="2.0211" />
  <ns0:text x="574.8772" y="397.4737" text-anchor="middle" font-size="16.1684" fill="#bf360c">Step 2: Retrieve "Q4 revenue: $12.3M..."</ns0:text>
  <ns0:line x1="574.8772" y1="417.6842" x2="574.8772" y2="444.6316" stroke="#4a90e2" stroke-width="2.0211" marker-end="url(#arr)" />
  <ns0:rect x="316.1825" y="444.6316" width="517.3895" height="53.8947" rx="6.7368" fill="#fff3cd" stroke="#ffc107" stroke-width="2.0211" />
  <ns0:text x="574.8772" y="478.3158" text-anchor="middle" font-size="16.1684" fill="#bf360c">Step 3: Generate response WITH document</ns0:text>
  <ns0:line x1="574.8772" y1="498.5263" x2="574.8772" y2="525.4737" stroke="#4a90e2" stroke-width="2.0211" marker-end="url(#arr)" />
  <ns0:rect x="244.3228" y="525.4737" width="661.1088" height="53.8947" rx="6.7368" fill="#d4edda" stroke="#28a745" stroke-width="2.6947" />
  <ns0:text x="574.8772" y="559.1579" text-anchor="middle" font-size="16.1684" fill="#333">"Based on the financial report, Q4 revenue was $12.3M."</ns0:text>
  <ns0:rect x="57.4877" y="599.5789" width="229.9509" height="40.4211" rx="6.7368" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="172.4632" y="626.5263" text-anchor="middle" font-size="13.4737" fill="#333">Grounded in data</ns0:text>
  <ns0:rect x="308.9965" y="599.5789" width="201.207" height="40.4211" rx="6.7368" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="409.6" y="626.5263" text-anchor="middle" font-size="13.4737" fill="#333">Up-to-date info</ns0:text>
  <ns0:rect x="531.7614" y="599.5789" width="201.207" height="40.4211" rx="6.7368" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="632.3649" y="626.5263" text-anchor="middle" font-size="13.4737" fill="#333">Auditable sources</ns0:text>
  <ns0:rect x="754.5263" y="599.5789" width="273.0667" height="40.4211" rx="6.7368" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="891.0596" y="626.5263" text-anchor="middle" font-size="13.4737" fill="#333">No fine-tuning needed</ns0:text>
</ns0:svg>
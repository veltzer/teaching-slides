<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="22.8331" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Retrieval-Augmented Generation (RAG)</text>
  <rect x="40" y="66.0674" width="533.3334" height="78.2022" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="306.6667" y="94.7415" text-anchor="middle" font-size="17.1248" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Problem</text>
  <text x="306.6667" y="120.809" text-anchor="middle" font-size="15.6978" fill="var(--text-muted)" font-family="Arial, sans-serif">LLMs have knowledge cutoffs and hallucinate</text>
  <rect x="706.6666" y="66.0674" width="533.3334" height="78.2022" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="973.3333" y="94.7415" text-anchor="middle" font-size="17.1248" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Solution</text>
  <text x="973.3333" y="120.809" text-anchor="middle" font-size="15.6978" fill="var(--text-muted)" font-family="Arial, sans-serif">Give the model relevant documents at query time</text>
  <rect x="340.0001" y="183.3708" width="600" height="52.1348" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="215.955" text-anchor="middle" font-size="17.1248" fill="var(--text)" font-family="Arial, sans-serif">User: "What was our Q4 revenue?"</text>
  <line x1="640" y1="235.5056" x2="640" y2="274.6067" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="340.0001" y="274.6067" width="600" height="52.1348" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="307.191" text-anchor="middle" font-size="17.1248" fill="var(--danger-accent)" font-family="Arial, sans-serif">Step 1: Search company docs</text>
  <line x1="640" y1="326.7415" x2="640" y2="352.809" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="340.0001" y="352.809" width="600" height="52.1348" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="385.3933" text-anchor="middle" font-size="17.1248" fill="var(--danger-accent)" font-family="Arial, sans-serif">Step 2: Retrieve "Q4 revenue: $12.3M..."</text>
  <line x1="640" y1="404.9438" x2="640" y2="431.0112" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="340.0001" y="431.0112" width="600" height="52.1348" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="463.5955" text-anchor="middle" font-size="17.1248" fill="var(--danger-accent)" font-family="Arial, sans-serif">Step 3: Generate response WITH document</text>
  <line x1="640" y1="483.146" x2="640" y2="509.2135" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="256.6667" y="509.2135" width="766.6667" height="52.1348" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="541.7978" text-anchor="middle" font-size="17.1248" fill="var(--text)" font-family="Arial, sans-serif">"Based on the financial report, Q4 revenue was $12.3M."</text>
  <rect x="40" y="580.8988" width="266.6667" height="39.1012" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="173.3334" y="606.9663" text-anchor="middle" font-size="14.2707" fill="var(--text)" font-family="Arial, sans-serif">Grounded in data</text>
  <rect x="331.6667" y="580.8988" width="233.3333" height="39.1012" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="448.3333" y="606.9663" text-anchor="middle" font-size="14.2707" fill="var(--text)" font-family="Arial, sans-serif">Up-to-date info</text>
  <rect x="590" y="580.8988" width="233.3333" height="39.1012" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.6666" y="606.9663" text-anchor="middle" font-size="14.2707" fill="var(--text)" font-family="Arial, sans-serif">Auditable sources</text>
  <rect x="848.3333" y="580.8988" width="316.6667" height="39.1012" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.6666" y="606.9663" text-anchor="middle" font-size="14.2707" fill="var(--text)" font-family="Arial, sans-serif">No fine-tuning needed</text>
</svg>
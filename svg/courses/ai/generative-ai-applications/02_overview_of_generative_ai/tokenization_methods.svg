<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="635.8169" y="56.4706" text-anchor="middle" font-size="27.1282" font-weight="bold" fill="var(--text)">BPE Tokenization - Learning Merges</text>
  <rect x="67.8205" y="112.9412" width="169.5512" height="75.2941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="152.5961" y="160" text-anchor="middle" font-size="20.3461" font-weight="bold" fill="var(--text)">Step 0</text>
  <rect x="271.2819" y="112.9412" width="678.2047" height="75.2941" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="406.9228" y="154.3529" font-size="22.0417" fill="var(--text)">'l'  'o'  'w'  'e'  'r'</text>
  <text x="779.9355" y="154.3529" font-size="18.6506" fill="var(--text-muted)">frequency analysis</text>
  <line x1="610.3842" y1="188.2353" x2="610.3842" y2="225.8823" stroke="var(--primary-border)" stroke-width="1.6955" />
  <rect x="67.8205" y="225.8823" width="169.5512" height="75.2941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="152.5961" y="272.9411" text-anchor="middle" font-size="20.3461" font-weight="bold" fill="var(--text)">Step 1</text>
  <rect x="271.2819" y="225.8823" width="678.2047" height="75.2941" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="406.9228" y="267.2941" font-size="22.0417" fill="var(--text)">'lo'  'w'  'e'  'r'</text>
  <text x="779.9355" y="267.2941" font-size="18.6506" fill="var(--ok-accent)">merge 'l'+'o'</text>
  <line x1="610.3842" y1="301.1764" x2="610.3842" y2="338.8235" stroke="var(--primary-border)" stroke-width="1.6955" />
  <rect x="67.8205" y="338.8235" width="169.5512" height="75.2941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="152.5961" y="385.8824" text-anchor="middle" font-size="20.3461" font-weight="bold" fill="var(--text)">Step 2</text>
  <rect x="271.2819" y="338.8235" width="678.2047" height="75.2941" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="406.9228" y="380.2352" font-size="22.0417" fill="var(--text)">'low'  'e'  'r'</text>
  <text x="779.9355" y="380.2352" font-size="18.6506" fill="var(--ok-accent)">merge 'lo'+'w'</text>
  <line x1="610.3842" y1="414.1176" x2="610.3842" y2="451.7646" stroke="var(--primary-border)" stroke-width="1.6955" />
  <rect x="67.8205" y="451.7646" width="169.5512" height="75.2941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="152.5961" y="498.8235" text-anchor="middle" font-size="20.3461" font-weight="bold" fill="var(--text)">Step 3</text>
  <rect x="271.2819" y="451.7646" width="678.2047" height="75.2941" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="406.9228" y="493.1765" font-size="22.0417" fill="var(--text)">'low'  'er'</text>
  <text x="779.9355" y="493.1765" font-size="18.6506" fill="var(--ok-accent)">merge 'e'+'r'</text>
  <line x1="610.3842" y1="527.0587" x2="610.3842" y2="564.7059" stroke="var(--primary-border)" stroke-width="1.6955" />
  <rect x="67.8205" y="564.7059" width="169.5512" height="75.2941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="152.5961" y="611.7647" text-anchor="middle" font-size="20.3461" font-weight="bold" fill="var(--ok-accent)">Step 4</text>
  <rect x="271.2819" y="564.7059" width="678.2047" height="75.2941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="406.9228" y="606.1176" font-size="22.0417" font-weight="bold" fill="var(--text)">'lower'</text>
  <text x="779.9355" y="606.1176" font-size="18.6506" fill="var(--ok-accent)">merge 'low'+'er'</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="230.7693" height="82.857127040817" rx="6.313251175336" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="91.785718239796" text-anchor="middle" font-size="24.90030440235" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 0</text>
  <rect x="316.9231" y="40" width="923.0769" height="82.857127040817" rx="6.313251175336" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="501.5384" y="85.571436479591" font-size="26.97536484283" fill="var(--text)" font-family="Arial, sans-serif">'l'  'o'  'w'  'e'  'r'</text>
  <text x="1009.2309" y="85.571436479591" font-size="22.82524396187" fill="var(--text-muted)" font-family="Arial, sans-serif">frequency analysis</text>
  <line x1="778.4615" y1="122.857127040817" x2="778.4615" y2="164.285635204087" stroke="var(--primary-border)" stroke-width="1.6955"/>
  <rect x="40" y="164.285635204087" width="230.7693" height="82.857127040817" rx="6.313251175336" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="216.071353443882" text-anchor="middle" font-size="24.90030440235" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 1</text>
  <rect x="316.9231" y="164.285635204087" width="923.0769" height="82.857127040817" rx="6.313251175336" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="501.5384" y="209.857182397957" font-size="26.97536484283" fill="var(--text)" font-family="Arial, sans-serif">'lo'  'w'  'e'  'r'</text>
  <text x="1009.2309" y="209.857182397957" font-size="22.82524396187" fill="var(--ok-accent)" font-family="Arial, sans-serif">merge 'l'+'o'</text>
  <line x1="778.4615" y1="247.142762244904" x2="778.4615" y2="288.571381122452" stroke="var(--primary-border)" stroke-width="1.6955"/>
  <rect x="40" y="288.571381122452" width="230.7693" height="82.857127040817" rx="6.313251175336" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="340.357210076526" text-anchor="middle" font-size="24.90030440235" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 2</text>
  <rect x="316.9231" y="288.571381122452" width="923.0769" height="82.857127040817" rx="6.313251175336" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="501.5384" y="334.142817602043" font-size="26.97536484283" fill="var(--text)" font-family="Arial, sans-serif">'low'  'e'  'r'</text>
  <text x="1009.2309" y="334.142817602043" font-size="22.82524396187" fill="var(--ok-accent)" font-family="Arial, sans-serif">merge 'lo'+'w'</text>
  <line x1="778.4615" y1="371.428508163269" x2="778.4615" y2="412.857016326538" stroke="var(--primary-border)" stroke-width="1.6955"/>
  <rect x="40" y="412.857016326538" width="230.7693" height="82.857127040817" rx="6.313251175336" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="464.642845280613" text-anchor="middle" font-size="24.90030440235" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 3</text>
  <rect x="316.9231" y="412.857016326538" width="923.0769" height="82.857127040817" rx="6.313251175336" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="501.5384" y="458.428563520409" font-size="26.97536484283" fill="var(--text)" font-family="Arial, sans-serif">'low'  'er'</text>
  <text x="1009.2309" y="458.428563520409" font-size="22.82524396187" fill="var(--ok-accent)" font-family="Arial, sans-serif">merge 'e'+'r'</text>
  <line x1="778.4615" y1="495.714143367356" x2="778.4615" y2="537.142872959183" stroke="var(--primary-border)" stroke-width="1.6955"/>
  <rect x="40" y="537.142872959183" width="230.7693" height="82.857127040817" rx="6.313251175336" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="588.928591198979" text-anchor="middle" font-size="24.90030440235" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Step 4</text>
  <rect x="316.9231" y="537.142872959183" width="923.0769" height="82.857127040817" rx="6.313251175336" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.5384" y="582.714198724495" font-size="26.97536484283" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">'lower'</text>
  <text x="1009.2309" y="582.714198724495" font-size="22.82524396187" fill="var(--ok-accent)" font-family="Arial, sans-serif">merge 'low'+'er'</text>
</svg>

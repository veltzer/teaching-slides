<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="813.0769" y="40" text-anchor="middle" font-size="31.5531" font-weight="bold" fill="var(--text)">BPE Tokenization - Learning Merges</text>
  <rect x="40" y="96.129" width="230.7693" height="74.8387" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="142.9032" text-anchor="middle" font-size="23.6648" font-weight="bold" fill="var(--text)">Step 0</text>
  <rect x="316.9231" y="96.129" width="923.0769" height="74.8387" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="501.5384" y="137.2903" font-size="25.6369" fill="var(--text)">'l'  'o'  'w'  'e'  'r'</text>
  <text x="1009.2309" y="137.2903" font-size="21.6927" fill="var(--text-muted)">frequency analysis</text>
  <line x1="778.4615" y1="170.9677" x2="778.4615" y2="208.387" stroke="var(--primary-border)" stroke-width="1.6955" />
  <rect x="40" y="208.387" width="230.7693" height="74.8387" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="255.1612" text-anchor="middle" font-size="23.6648" font-weight="bold" fill="var(--text)">Step 1</text>
  <rect x="316.9231" y="208.387" width="923.0769" height="74.8387" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="501.5384" y="249.5484" font-size="25.6369" fill="var(--text)">'lo'  'w'  'e'  'r'</text>
  <text x="1009.2309" y="249.5484" font-size="21.6927" fill="var(--ok-accent)">merge 'l'+'o'</text>
  <line x1="778.4615" y1="283.2257" x2="778.4615" y2="320.6451" stroke="var(--primary-border)" stroke-width="1.6955" />
  <rect x="40" y="320.6451" width="230.7693" height="74.8387" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="367.4194" text-anchor="middle" font-size="23.6648" font-weight="bold" fill="var(--text)">Step 2</text>
  <rect x="316.9231" y="320.6451" width="923.0769" height="74.8387" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="501.5384" y="361.8064" font-size="25.6369" fill="var(--text)">'low'  'e'  'r'</text>
  <text x="1009.2309" y="361.8064" font-size="21.6927" fill="var(--ok-accent)">merge 'lo'+'w'</text>
  <line x1="778.4615" y1="395.4838" x2="778.4615" y2="432.9031" stroke="var(--primary-border)" stroke-width="1.6955" />
  <rect x="40" y="432.9031" width="230.7693" height="74.8387" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="479.6774" text-anchor="middle" font-size="23.6648" font-weight="bold" fill="var(--text)">Step 3</text>
  <rect x="316.9231" y="432.9031" width="923.0769" height="74.8387" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="501.5384" y="474.0645" font-size="25.6369" fill="var(--text)">'low'  'er'</text>
  <text x="1009.2309" y="474.0645" font-size="21.6927" fill="var(--ok-accent)">merge 'e'+'r'</text>
  <line x1="778.4615" y1="507.7418" x2="778.4615" y2="545.1613" stroke="var(--primary-border)" stroke-width="1.6955" />
  <rect x="40" y="545.1613" width="230.7693" height="74.8387" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="591.9355" text-anchor="middle" font-size="23.6648" font-weight="bold" fill="var(--ok-accent)">Step 4</text>
  <rect x="316.9231" y="545.1613" width="923.0769" height="74.8387" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.5384" y="586.3225" font-size="25.6369" font-weight="bold" fill="var(--text)">'lower'</text>
  <text x="1009.2309" y="586.3225" font-size="21.6927" fill="var(--ok-accent)">merge 'low'+'er'</text>
</svg>
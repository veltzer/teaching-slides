<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="813.0769" y="40" text-anchor="middle" font-size="31.5531" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">BPE Tokenization - Learning Merges</text>
  <rect x="40" y="96.129" width="230.7693" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="142.9032" text-anchor="middle" font-size="23.6648" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 0</text>
  <rect x="316.9231" y="96.129" width="923.0769" height="74.8387" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="501.5384" y="137.2903" font-size="25.6369" fill="var(--text)" font-family="Arial, sans-serif">'l'  'o'  'w'  'e'  'r'</text>
  <text x="1009.2309" y="137.2903" font-size="21.6927" fill="var(--text-muted)" font-family="Arial, sans-serif">frequency analysis</text>
  <line x1="778.4615" y1="170.9677" x2="778.4615" y2="208.387" stroke="var(--primary-border)" stroke-width="1.6955"/>
  <rect x="40" y="208.387" width="230.7693" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="255.1612" text-anchor="middle" font-size="23.6648" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 1</text>
  <rect x="316.9231" y="208.387" width="923.0769" height="74.8387" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="501.5384" y="249.5484" font-size="25.6369" fill="var(--text)" font-family="Arial, sans-serif">'lo'  'w'  'e'  'r'</text>
  <text x="1009.2309" y="249.5484" font-size="21.6927" fill="var(--ok-accent)" font-family="Arial, sans-serif">merge 'l'+'o'</text>
  <line x1="778.4615" y1="283.2257" x2="778.4615" y2="320.6451" stroke="var(--primary-border)" stroke-width="1.6955"/>
  <rect x="40" y="320.6451" width="230.7693" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="367.4194" text-anchor="middle" font-size="23.6648" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 2</text>
  <rect x="316.9231" y="320.6451" width="923.0769" height="74.8387" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="501.5384" y="361.8064" font-size="25.6369" fill="var(--text)" font-family="Arial, sans-serif">'low'  'e'  'r'</text>
  <text x="1009.2309" y="361.8064" font-size="21.6927" fill="var(--ok-accent)" font-family="Arial, sans-serif">merge 'lo'+'w'</text>
  <line x1="778.4615" y1="395.4838" x2="778.4615" y2="432.9031" stroke="var(--primary-border)" stroke-width="1.6955"/>
  <rect x="40" y="432.9031" width="230.7693" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="479.6774" text-anchor="middle" font-size="23.6648" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Step 3</text>
  <rect x="316.9231" y="432.9031" width="923.0769" height="74.8387" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="501.5384" y="474.0645" font-size="25.6369" fill="var(--text)" font-family="Arial, sans-serif">'low'  'er'</text>
  <text x="1009.2309" y="474.0645" font-size="21.6927" fill="var(--ok-accent)" font-family="Arial, sans-serif">merge 'e'+'r'</text>
  <line x1="778.4615" y1="507.7418" x2="778.4615" y2="545.1613" stroke="var(--primary-border)" stroke-width="1.6955"/>
  <rect x="40" y="545.1613" width="230.7693" height="74.8387" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.3846" y="591.9355" text-anchor="middle" font-size="23.6648" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Step 4</text>
  <rect x="316.9231" y="545.1613" width="923.0769" height="74.8387" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.5384" y="586.3225" font-size="25.6369" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">'lower'</text>
  <text x="1009.2309" y="586.3225" font-size="21.6927" fill="var(--ok-accent)" font-family="Arial, sans-serif">merge 'low'+'er'</text>
</svg>

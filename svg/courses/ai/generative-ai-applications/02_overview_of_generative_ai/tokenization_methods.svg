<svg viewBox="0 0 750 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="375" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">BPE Tokenization - Learning Merges</text>
  <!-- Step 0 -->
  <rect x="40" y="60" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="90" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Step 0</text>
  <rect x="160" y="60" width="400" height="40" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="240" y="82" font-size="13" fill="#333">'l'  'o'  'w'  'e'  'r'</text>
  <text x="460" y="82" font-size="11" fill="#666">frequency analysis</text>
  <!-- Step 1 -->
  <line x1="360" y1="100" x2="360" y2="120" stroke="#4a90e2" stroke-width="1"/>
  <rect x="40" y="120" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="90" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Step 1</text>
  <rect x="160" y="120" width="400" height="40" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="240" y="142" font-size="13" fill="#333">'lo'  'w'  'e'  'r'</text>
  <text x="460" y="142" font-size="11" fill="#28a745">merge 'l'+'o'</text>
  <!-- Step 2 -->
  <line x1="360" y1="160" x2="360" y2="180" stroke="#4a90e2" stroke-width="1"/>
  <rect x="40" y="180" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="90" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Step 2</text>
  <rect x="160" y="180" width="400" height="40" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="240" y="202" font-size="13" fill="#333">'low'  'e'  'r'</text>
  <text x="460" y="202" font-size="11" fill="#28a745">merge 'lo'+'w'</text>
  <!-- Step 3 -->
  <line x1="360" y1="220" x2="360" y2="240" stroke="#4a90e2" stroke-width="1"/>
  <rect x="40" y="240" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="90" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Step 3</text>
  <rect x="160" y="240" width="400" height="40" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="240" y="262" font-size="13" fill="#333">'low'  'er'</text>
  <text x="460" y="262" font-size="11" fill="#28a745">merge 'e'+'r'</text>
  <!-- Step 4 -->
  <line x1="360" y1="280" x2="360" y2="300" stroke="#4a90e2" stroke-width="1"/>
  <rect x="40" y="300" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="90" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Step 4</text>
  <rect x="160" y="300" width="400" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="240" y="322" font-size="13" font-weight="bold" fill="#333">'lower'</text>
  <text x="460" y="322" font-size="11" fill="#28a745">merge 'low'+'er'</text>
</svg>
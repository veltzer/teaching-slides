<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="635.817" y="56.4706" text-anchor="middle" font-size="25.4327" font-weight="bold" fill="#333">Encoder vs Decoder vs Encoder-Decoder</ns0:text>
  <ns0:rect x="63.5817" y="112.9412" width="349.6994" height="527.0588" rx="7.9477" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1791" />
  <ns0:text x="238.4314" y="169.4118" text-anchor="middle" font-size="22.2536" font-weight="bold" fill="#4a90e2">ENCODER-ONLY</ns0:text>
  <ns0:text x="238.4314" y="216.4706" text-anchor="middle" font-size="19.0745" fill="#555">BERT, RoBERTa</ns0:text>
  <ns0:rect x="95.3726" y="254.1177" width="286.1177" height="94.1176" rx="7.9477" fill="#fff" stroke="#4a90e2" stroke-width="1.5895" />
  <ns0:text x="238.4314" y="295.5294" text-anchor="middle" font-size="17.485" fill="#333">Full bidirectional</ns0:text>
  <ns0:text x="238.4314" y="327.5294" text-anchor="middle" font-size="17.485" fill="#333">attention</ns0:text>
  <ns0:rect x="95.3726" y="376.4706" width="286.1177" height="112.9412" rx="7.9477" fill="#d4edda" stroke="#28a745" stroke-width="1.5895" />
  <ns0:text x="238.4314" y="417.8824" text-anchor="middle" font-size="17.485" font-weight="bold" fill="#28a745">Good for:</ns0:text>
  <ns0:text x="238.4314" y="451.7647" text-anchor="middle" font-size="17.485" fill="#333">Classification, NER,</ns0:text>
  <ns0:text x="238.4314" y="478.1177" text-anchor="middle" font-size="17.485" fill="#333">Embeddings</ns0:text>
  <ns0:rect x="460.9673" y="112.9412" width="349.6994" height="527.0588" rx="7.9477" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1791" />
  <ns0:text x="635.817" y="169.4118" text-anchor="middle" font-size="22.2536" font-weight="bold" fill="#4a90e2">DECODER-ONLY</ns0:text>
  <ns0:text x="635.817" y="216.4706" text-anchor="middle" font-size="19.0745" fill="#555">GPT, LLaMA, Claude</ns0:text>
  <ns0:rect x="492.7582" y="254.1177" width="286.1177" height="94.1176" rx="7.9477" fill="#fff" stroke="#4a90e2" stroke-width="1.5895" />
  <ns0:text x="635.817" y="295.5294" text-anchor="middle" font-size="17.485" fill="#333">Causal (left-to-right)</ns0:text>
  <ns0:text x="635.817" y="327.5294" text-anchor="middle" font-size="17.485" fill="#333">attention</ns0:text>
  <ns0:rect x="492.7582" y="376.4706" width="286.1177" height="112.9412" rx="7.9477" fill="#d4edda" stroke="#28a745" stroke-width="1.5895" />
  <ns0:text x="635.817" y="417.8824" text-anchor="middle" font-size="17.485" font-weight="bold" fill="#28a745">Good for:</ns0:text>
  <ns0:text x="635.817" y="451.7647" text-anchor="middle" font-size="17.485" fill="#333">Text generation,</ns0:text>
  <ns0:text x="635.817" y="478.1177" text-anchor="middle" font-size="17.485" fill="#333">Chat, Code</ns0:text>
  <ns0:rect x="858.353" y="112.9412" width="349.6994" height="527.0588" rx="7.9477" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1791" />
  <ns0:text x="1033.2027" y="169.4118" text-anchor="middle" font-size="22.2536" font-weight="bold" fill="#4a90e2">ENCODER-DECODER</ns0:text>
  <ns0:text x="1033.2027" y="216.4706" text-anchor="middle" font-size="19.0745" fill="#555">T5, BART</ns0:text>
  <ns0:rect x="890.1438" y="254.1177" width="286.1177" height="94.1176" rx="7.9477" fill="#fff" stroke="#4a90e2" stroke-width="1.5895" />
  <ns0:text x="1033.2027" y="295.5294" text-anchor="middle" font-size="17.485" fill="#333">Encode full input,</ns0:text>
  <ns0:text x="1033.2027" y="327.5294" text-anchor="middle" font-size="17.485" fill="#333">then decode</ns0:text>
  <ns0:rect x="890.1438" y="376.4706" width="286.1177" height="112.9412" rx="7.9477" fill="#d4edda" stroke="#28a745" stroke-width="1.5895" />
  <ns0:text x="1033.2027" y="417.8824" text-anchor="middle" font-size="17.485" font-weight="bold" fill="#28a745">Good for:</ns0:text>
  <ns0:text x="1033.2027" y="451.7647" text-anchor="middle" font-size="17.485" fill="#333">Translation,</ns0:text>
  <ns0:text x="1033.2027" y="478.1177" text-anchor="middle" font-size="17.485" fill="#333">Summarization</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="25.9635" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Encoder vs Decoder vs Encoder-Decoder</text>
  <rect x="40" y="96.129" width="366.6667" height="523.871" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.3333" y="152.2581" text-anchor="middle" font-size="22.7181" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ENCODER-ONLY</text>
  <text x="223.3333" y="199.0323" text-anchor="middle" font-size="19.4726" fill="var(--text-muted)" font-family="Arial, sans-serif">BERT, RoBERTa</text>
  <rect x="73.3334" y="236.4517" width="300" height="93.5483" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5895"/>
  <text x="223.3333" y="277.6129" text-anchor="middle" font-size="17.8499" fill="var(--text)" font-family="Arial, sans-serif">Full bidirectional</text>
  <text x="223.3333" y="309.4193" text-anchor="middle" font-size="17.8499" fill="var(--text)" font-family="Arial, sans-serif">attention</text>
  <rect x="73.3334" y="358.0645" width="300" height="112.2581" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.3333" y="399.2258" text-anchor="middle" font-size="17.8499" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Good for:</text>
  <text x="223.3333" y="432.9032" text-anchor="middle" font-size="17.8499" fill="var(--text)" font-family="Arial, sans-serif">Classification, NER,</text>
  <text x="223.3333" y="459.0968" text-anchor="middle" font-size="17.8499" fill="var(--text)" font-family="Arial, sans-serif">Embeddings</text>
  <rect x="456.6666" y="96.129" width="366.6667" height="523.871" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="152.2581" text-anchor="middle" font-size="22.7181" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">DECODER-ONLY</text>
  <text x="639.9999" y="199.0323" text-anchor="middle" font-size="19.4726" fill="var(--text-muted)" font-family="Arial, sans-serif">GPT, LLaMA, Claude</text>
  <rect x="490" y="236.4517" width="300" height="93.5483" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5895"/>
  <text x="639.9999" y="277.6129" text-anchor="middle" font-size="17.8499" fill="var(--text)" font-family="Arial, sans-serif">Causal (left-to-right)</text>
  <text x="639.9999" y="309.4193" text-anchor="middle" font-size="17.8499" fill="var(--text)" font-family="Arial, sans-serif">attention</text>
  <rect x="490" y="358.0645" width="300" height="112.2581" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="399.2258" text-anchor="middle" font-size="17.8499" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Good for:</text>
  <text x="639.9999" y="432.9032" text-anchor="middle" font-size="17.8499" fill="var(--text)" font-family="Arial, sans-serif">Text generation,</text>
  <text x="639.9999" y="459.0968" text-anchor="middle" font-size="17.8499" fill="var(--text)" font-family="Arial, sans-serif">Chat, Code</text>
  <rect x="873.3333" y="96.129" width="366.6667" height="523.871" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.6667" y="152.2581" text-anchor="middle" font-size="22.7181" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ENCODER-DECODER</text>
  <text x="1056.6667" y="199.0323" text-anchor="middle" font-size="19.4726" fill="var(--text-muted)" font-family="Arial, sans-serif">T5, BART</text>
  <rect x="906.6666" y="236.4517" width="300" height="93.5483" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5895"/>
  <text x="1056.6667" y="277.6129" text-anchor="middle" font-size="17.8499" fill="var(--text)" font-family="Arial, sans-serif">Encode full input,</text>
  <text x="1056.6667" y="309.4193" text-anchor="middle" font-size="17.8499" fill="var(--text)" font-family="Arial, sans-serif">then decode</text>
  <rect x="906.6666" y="358.0645" width="300" height="112.2581" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.6667" y="399.2258" text-anchor="middle" font-size="17.8499" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Good for:</text>
  <text x="1056.6667" y="432.9032" text-anchor="middle" font-size="17.8499" fill="var(--text)" font-family="Arial, sans-serif">Translation,</text>
  <text x="1056.6667" y="459.0968" text-anchor="middle" font-size="17.8499" fill="var(--text)" font-family="Arial, sans-serif">Summarization</text>
</svg>

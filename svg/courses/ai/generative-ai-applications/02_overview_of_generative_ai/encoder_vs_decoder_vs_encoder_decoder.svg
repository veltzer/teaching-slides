<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="635.817" y="56.4706" text-anchor="middle" font-size="25.4327" font-weight="bold" fill="var(--text)">Encoder vs Decoder vs Encoder-Decoder</text>
  <rect x="63.5817" y="112.9412" width="349.6994" height="527.0588" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="238.4314" y="169.4118" text-anchor="middle" font-size="22.2536" font-weight="bold" fill="var(--primary-accent)">ENCODER-ONLY</text>
  <text x="238.4314" y="216.4706" text-anchor="middle" font-size="19.0745" fill="var(--text-muted)">BERT, RoBERTa</text>
  <rect x="95.3726" y="254.1177" width="286.1177" height="94.1176" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5895" />
  <text x="238.4314" y="295.5294" text-anchor="middle" font-size="17.485" fill="var(--text)">Full bidirectional</text>
  <text x="238.4314" y="327.5294" text-anchor="middle" font-size="17.485" fill="var(--text)">attention</text>
  <rect x="95.3726" y="376.4706" width="286.1177" height="112.9412" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="238.4314" y="417.8824" text-anchor="middle" font-size="17.485" font-weight="bold" fill="var(--ok-accent)">Good for:</text>
  <text x="238.4314" y="451.7647" text-anchor="middle" font-size="17.485" fill="var(--text)">Classification, NER,</text>
  <text x="238.4314" y="478.1177" text-anchor="middle" font-size="17.485" fill="var(--text)">Embeddings</text>
  <rect x="460.9673" y="112.9412" width="349.6994" height="527.0588" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="635.817" y="169.4118" text-anchor="middle" font-size="22.2536" font-weight="bold" fill="var(--primary-accent)">DECODER-ONLY</text>
  <text x="635.817" y="216.4706" text-anchor="middle" font-size="19.0745" fill="var(--text-muted)">GPT, LLaMA, Claude</text>
  <rect x="492.7582" y="254.1177" width="286.1177" height="94.1176" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5895" />
  <text x="635.817" y="295.5294" text-anchor="middle" font-size="17.485" fill="var(--text)">Causal (left-to-right)</text>
  <text x="635.817" y="327.5294" text-anchor="middle" font-size="17.485" fill="var(--text)">attention</text>
  <rect x="492.7582" y="376.4706" width="286.1177" height="112.9412" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="635.817" y="417.8824" text-anchor="middle" font-size="17.485" font-weight="bold" fill="var(--ok-accent)">Good for:</text>
  <text x="635.817" y="451.7647" text-anchor="middle" font-size="17.485" fill="var(--text)">Text generation,</text>
  <text x="635.817" y="478.1177" text-anchor="middle" font-size="17.485" fill="var(--text)">Chat, Code</text>
  <rect x="858.353" y="112.9412" width="349.6994" height="527.0588" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1033.2027" y="169.4118" text-anchor="middle" font-size="22.2536" font-weight="bold" fill="var(--primary-accent)">ENCODER-DECODER</text>
  <text x="1033.2027" y="216.4706" text-anchor="middle" font-size="19.0745" fill="var(--text-muted)">T5, BART</text>
  <rect x="890.1438" y="254.1177" width="286.1177" height="94.1176" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5895" />
  <text x="1033.2027" y="295.5294" text-anchor="middle" font-size="17.485" fill="var(--text)">Encode full input,</text>
  <text x="1033.2027" y="327.5294" text-anchor="middle" font-size="17.485" fill="var(--text)">then decode</text>
  <rect x="890.1438" y="376.4706" width="286.1177" height="112.9412" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1033.2027" y="417.8824" text-anchor="middle" font-size="17.485" font-weight="bold" fill="var(--ok-accent)">Good for:</text>
  <text x="1033.2027" y="451.7647" text-anchor="middle" font-size="17.485" fill="var(--text)">Translation,</text>
  <text x="1033.2027" y="478.1177" text-anchor="middle" font-size="17.485" fill="var(--text)">Summarization</text>
</svg>
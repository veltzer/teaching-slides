<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="25.9635" font-weight="bold" fill="var(--text)">Encoder vs Decoder vs Encoder-Decoder</text>
  <rect x="40" y="96.129" width="366.6667" height="523.871" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.3333" y="152.2581" text-anchor="middle" font-size="22.7181" font-weight="bold" fill="var(--primary-accent)">ENCODER-ONLY</text>
  <text x="223.3333" y="199.0323" text-anchor="middle" font-size="19.4726" fill="var(--text-muted)">BERT, RoBERTa</text>
  <rect x="73.3334" y="236.4517" width="300" height="93.5483" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5895" />
  <text x="223.3333" y="277.6129" text-anchor="middle" font-size="17.8499" fill="var(--text)">Full bidirectional</text>
  <text x="223.3333" y="309.4193" text-anchor="middle" font-size="17.8499" fill="var(--text)">attention</text>
  <rect x="73.3334" y="358.0645" width="300" height="112.2581" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.3333" y="399.2258" text-anchor="middle" font-size="17.8499" font-weight="bold" fill="var(--ok-accent)">Good for:</text>
  <text x="223.3333" y="432.9032" text-anchor="middle" font-size="17.8499" fill="var(--text)">Classification, NER,</text>
  <text x="223.3333" y="459.0968" text-anchor="middle" font-size="17.8499" fill="var(--text)">Embeddings</text>
  <rect x="456.6666" y="96.129" width="366.6667" height="523.871" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="152.2581" text-anchor="middle" font-size="22.7181" font-weight="bold" fill="var(--primary-accent)">DECODER-ONLY</text>
  <text x="639.9999" y="199.0323" text-anchor="middle" font-size="19.4726" fill="var(--text-muted)">GPT, LLaMA, Claude</text>
  <rect x="490" y="236.4517" width="300" height="93.5483" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5895" />
  <text x="639.9999" y="277.6129" text-anchor="middle" font-size="17.8499" fill="var(--text)">Causal (left-to-right)</text>
  <text x="639.9999" y="309.4193" text-anchor="middle" font-size="17.8499" fill="var(--text)">attention</text>
  <rect x="490" y="358.0645" width="300" height="112.2581" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="399.2258" text-anchor="middle" font-size="17.8499" font-weight="bold" fill="var(--ok-accent)">Good for:</text>
  <text x="639.9999" y="432.9032" text-anchor="middle" font-size="17.8499" fill="var(--text)">Text generation,</text>
  <text x="639.9999" y="459.0968" text-anchor="middle" font-size="17.8499" fill="var(--text)">Chat, Code</text>
  <rect x="873.3333" y="96.129" width="366.6667" height="523.871" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.6667" y="152.2581" text-anchor="middle" font-size="22.7181" font-weight="bold" fill="var(--primary-accent)">ENCODER-DECODER</text>
  <text x="1056.6667" y="199.0323" text-anchor="middle" font-size="19.4726" fill="var(--text-muted)">T5, BART</text>
  <rect x="906.6666" y="236.4517" width="300" height="93.5483" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5895" />
  <text x="1056.6667" y="277.6129" text-anchor="middle" font-size="17.8499" fill="var(--text)">Encode full input,</text>
  <text x="1056.6667" y="309.4193" text-anchor="middle" font-size="17.8499" fill="var(--text)">then decode</text>
  <rect x="906.6666" y="358.0645" width="300" height="112.2581" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.6667" y="399.2258" text-anchor="middle" font-size="17.8499" font-weight="bold" fill="var(--ok-accent)">Good for:</text>
  <text x="1056.6667" y="432.9032" text-anchor="middle" font-size="17.8499" fill="var(--text)">Translation,</text>
  <text x="1056.6667" y="459.0968" text-anchor="middle" font-size="17.8499" fill="var(--text)">Summarization</text>
</svg>
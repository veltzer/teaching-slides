<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="56.8421" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Encoder vs Decoder vs Encoder-Decoder</text>
  <rect x="64" y="113.6842" width="352" height="530.5263" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="240" y="170.5263" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#4a90e2">ENCODER-ONLY</text>
  <text x="240" y="217.8947" text-anchor="middle" font-size="19.2" fill="#555">BERT, RoBERTa</text>
  <rect x="96" y="255.7895" width="288" height="94.7368" rx="8" fill="#fff" stroke="#4a90e2" stroke-width="1.6" />
  <text x="240" y="297.4737" text-anchor="middle" font-size="17.6" fill="#333">Full bidirectional</text>
  <text x="240" y="329.6842" text-anchor="middle" font-size="17.6" fill="#333">attention</text>
  <rect x="96" y="378.9474" width="288" height="113.6842" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="240" y="420.6316" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#28a745">Good for:</text>
  <text x="240" y="454.7368" text-anchor="middle" font-size="17.6" fill="#333">Classification, NER,</text>
  <text x="240" y="481.2632" text-anchor="middle" font-size="17.6" fill="#333">Embeddings</text>
  <rect x="464" y="113.6842" width="352" height="530.5263" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="170.5263" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#4a90e2">DECODER-ONLY</text>
  <text x="640" y="217.8947" text-anchor="middle" font-size="19.2" fill="#555">GPT, LLaMA, Claude</text>
  <rect x="496" y="255.7895" width="288" height="94.7368" rx="8" fill="#fff" stroke="#4a90e2" stroke-width="1.6" />
  <text x="640" y="297.4737" text-anchor="middle" font-size="17.6" fill="#333">Causal (left-to-right)</text>
  <text x="640" y="329.6842" text-anchor="middle" font-size="17.6" fill="#333">attention</text>
  <rect x="496" y="378.9474" width="288" height="113.6842" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="640" y="420.6316" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#28a745">Good for:</text>
  <text x="640" y="454.7368" text-anchor="middle" font-size="17.6" fill="#333">Text generation,</text>
  <text x="640" y="481.2632" text-anchor="middle" font-size="17.6" fill="#333">Chat, Code</text>
  <rect x="864" y="113.6842" width="352" height="530.5263" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="1040" y="170.5263" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#4a90e2">ENCODER-DECODER</text>
  <text x="1040" y="217.8947" text-anchor="middle" font-size="19.2" fill="#555">T5, BART</text>
  <rect x="896" y="255.7895" width="288" height="94.7368" rx="8" fill="#fff" stroke="#4a90e2" stroke-width="1.6" />
  <text x="1040" y="297.4737" text-anchor="middle" font-size="17.6" fill="#333">Encode full input,</text>
  <text x="1040" y="329.6842" text-anchor="middle" font-size="17.6" fill="#333">then decode</text>
  <rect x="896" y="378.9474" width="288" height="113.6842" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="1040" y="420.6316" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#28a745">Good for:</text>
  <text x="1040" y="454.7368" text-anchor="middle" font-size="17.6" fill="#333">Translation,</text>
  <text x="1040" y="481.2632" text-anchor="middle" font-size="17.6" fill="#333">Summarization</text>
</svg>
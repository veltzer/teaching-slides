<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Encoder vs Decoder vs Encoder-Decoder</text>
  <!-- Encoder-Only -->
  <rect x="40" y="60" width="220" height="280" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="150" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">ENCODER-ONLY</text>
  <text x="150" y="115" text-anchor="middle" font-size="12" fill="#555">BERT, RoBERTa</text>
  <rect x="60" y="135" width="180" height="50" rx="5" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="150" y="157" text-anchor="middle" font-size="11" fill="#333">Full bidirectional</text>
  <text x="150" y="174" text-anchor="middle" font-size="11" fill="#333">attention</text>
  <rect x="60" y="200" width="180" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="150" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Good for:</text>
  <text x="150" y="240" text-anchor="middle" font-size="11" fill="#333">Classification, NER,</text>
  <text x="150" y="254" text-anchor="middle" font-size="11" fill="#333">Embeddings</text>
  <!-- Decoder-Only -->
  <rect x="290" y="60" width="220" height="280" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">DECODER-ONLY</text>
  <text x="400" y="115" text-anchor="middle" font-size="12" fill="#555">GPT, LLaMA, Claude</text>
  <rect x="310" y="135" width="180" height="50" rx="5" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="400" y="157" text-anchor="middle" font-size="11" fill="#333">Causal (left-to-right)</text>
  <text x="400" y="174" text-anchor="middle" font-size="11" fill="#333">attention</text>
  <rect x="310" y="200" width="180" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="400" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Good for:</text>
  <text x="400" y="240" text-anchor="middle" font-size="11" fill="#333">Text generation,</text>
  <text x="400" y="254" text-anchor="middle" font-size="11" fill="#333">Chat, Code</text>
  <!-- Encoder-Decoder -->
  <rect x="540" y="60" width="220" height="280" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="650" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">ENCODER-DECODER</text>
  <text x="650" y="115" text-anchor="middle" font-size="12" fill="#555">T5, BART</text>
  <rect x="560" y="135" width="180" height="50" rx="5" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="650" y="157" text-anchor="middle" font-size="11" fill="#333">Encode full input,</text>
  <text x="650" y="174" text-anchor="middle" font-size="11" fill="#333">then decode</text>
  <rect x="560" y="200" width="180" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="650" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Good for:</text>
  <text x="650" y="240" text-anchor="middle" font-size="11" fill="#333">Translation,</text>
  <text x="650" y="254" text-anchor="middle" font-size="11" fill="#333">Summarization</text>
</svg>
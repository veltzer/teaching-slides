<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.9848" font-weight="bold" fill="var(--text)">Real-World Applications of Generative AI</text>
  <rect x="40" y="71.3514" width="500" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="290" y="107.4054" text-anchor="middle" font-size="20.3001" font-weight="bold" fill="var(--bg)">Domain</text>
  <rect x="573.3334" y="71.3514" width="666.6666" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="906.6666" y="107.4054" text-anchor="middle" font-size="20.3001" font-weight="bold" fill="var(--bg)">Applications</text>
  <rect x="40" y="141.8919" width="500" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="290" y="177.9459" text-anchor="middle" font-size="18.7386" fill="var(--text)">Software Development</text>
  <rect x="573.3334" y="141.8919" width="666.6666" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="177.9459" text-anchor="middle" font-size="18.7386" fill="var(--text-muted)">Code generation, debugging, review</text>
  <rect x="40" y="212.4324" width="500" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="290" y="248.4865" text-anchor="middle" font-size="18.7386" fill="var(--text)">Content</text>
  <rect x="573.3334" y="212.4324" width="666.6666" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="248.4865" text-anchor="middle" font-size="18.7386" fill="var(--text-muted)">Writing, marketing, translation</text>
  <rect x="40" y="282.973" width="500" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="290" y="319.027" text-anchor="middle" font-size="18.7386" fill="var(--text)">Customer Service</text>
  <rect x="573.3334" y="282.973" width="666.6666" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="319.027" text-anchor="middle" font-size="18.7386" fill="var(--text-muted)">Chatbots, email drafting, FAQ</text>
  <rect x="40" y="353.5135" width="500" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="290" y="389.5676" text-anchor="middle" font-size="18.7386" fill="var(--text)">Healthcare</text>
  <rect x="573.3334" y="353.5135" width="666.6666" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="389.5676" text-anchor="middle" font-size="18.7386" fill="var(--text-muted)">Clinical notes, drug discovery</text>
  <rect x="40" y="424.0541" width="500" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="290" y="460.1081" text-anchor="middle" font-size="18.7386" fill="var(--text)">Legal</text>
  <rect x="573.3334" y="424.0541" width="666.6666" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="460.1081" text-anchor="middle" font-size="18.7386" fill="var(--text-muted)">Contract review, case research</text>
  <rect x="40" y="494.5946" width="500" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="290" y="530.6486" text-anchor="middle" font-size="18.7386" fill="var(--text)">Finance</text>
  <rect x="573.3334" y="494.5946" width="666.6666" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="530.6486" text-anchor="middle" font-size="18.7386" fill="var(--text-muted)">Report generation, risk analysis</text>
  <rect x="40" y="565.1351" width="500" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="290" y="601.1892" text-anchor="middle" font-size="18.7386" fill="var(--text)">Education</text>
  <rect x="573.3334" y="565.1351" width="666.6666" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="601.1892" text-anchor="middle" font-size="18.7386" fill="var(--text-muted)">Tutoring, curriculum design</text>
</svg>
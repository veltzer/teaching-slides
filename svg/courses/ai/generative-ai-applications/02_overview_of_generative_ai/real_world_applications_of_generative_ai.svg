<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.9848" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Real-World Applications of Generative AI</text>
  <rect x="40" y="71.3514" width="500" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="107.4054" text-anchor="middle" font-size="20.3001" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Domain</text>
  <rect x="573.3334" y="71.3514" width="666.6666" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="906.6666" y="107.4054" text-anchor="middle" font-size="20.3001" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Applications</text>
  <rect x="40" y="141.8919" width="500" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="177.9459" text-anchor="middle" font-size="18.7386" fill="var(--text)" font-family="Arial, sans-serif">Software Development</text>
  <rect x="573.3334" y="141.8919" width="666.6666" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="177.9459" text-anchor="middle" font-size="18.7386" fill="var(--text-muted)" font-family="Arial, sans-serif">Code generation, debugging, review</text>
  <rect x="40" y="212.4324" width="500" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="248.4865" text-anchor="middle" font-size="18.7386" fill="var(--text)" font-family="Arial, sans-serif">Content</text>
  <rect x="573.3334" y="212.4324" width="666.6666" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="248.4865" text-anchor="middle" font-size="18.7386" fill="var(--text-muted)" font-family="Arial, sans-serif">Writing, marketing, translation</text>
  <rect x="40" y="282.973" width="500" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="319.027" text-anchor="middle" font-size="18.7386" fill="var(--text)" font-family="Arial, sans-serif">Customer Service</text>
  <rect x="573.3334" y="282.973" width="666.6666" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="319.027" text-anchor="middle" font-size="18.7386" fill="var(--text-muted)" font-family="Arial, sans-serif">Chatbots, email drafting, FAQ</text>
  <rect x="40" y="353.5135" width="500" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="389.5676" text-anchor="middle" font-size="18.7386" fill="var(--text)" font-family="Arial, sans-serif">Healthcare</text>
  <rect x="573.3334" y="353.5135" width="666.6666" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="389.5676" text-anchor="middle" font-size="18.7386" fill="var(--text-muted)" font-family="Arial, sans-serif">Clinical notes, drug discovery</text>
  <rect x="40" y="424.0541" width="500" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="460.1081" text-anchor="middle" font-size="18.7386" fill="var(--text)" font-family="Arial, sans-serif">Legal</text>
  <rect x="573.3334" y="424.0541" width="666.6666" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="460.1081" text-anchor="middle" font-size="18.7386" fill="var(--text-muted)" font-family="Arial, sans-serif">Contract review, case research</text>
  <rect x="40" y="494.5946" width="500" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="530.6486" text-anchor="middle" font-size="18.7386" fill="var(--text)" font-family="Arial, sans-serif">Finance</text>
  <rect x="573.3334" y="494.5946" width="666.6666" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="530.6486" text-anchor="middle" font-size="18.7386" fill="var(--text-muted)" font-family="Arial, sans-serif">Report generation, risk analysis</text>
  <rect x="40" y="565.1351" width="500" height="54.8649" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="601.1892" text-anchor="middle" font-size="18.7386" fill="var(--text)" font-family="Arial, sans-serif">Education</text>
  <rect x="573.3334" y="565.1351" width="666.6666" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="601.1892" text-anchor="middle" font-size="18.7386" fill="var(--text-muted)" font-family="Arial, sans-serif">Tutoring, curriculum design</text>
</svg>

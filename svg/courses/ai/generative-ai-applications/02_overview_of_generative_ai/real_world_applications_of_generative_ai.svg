  <text x="290" y="600.114295379593" text-anchor="middle" font-size="19.266552038272" fill="var(--text)" font-family="Arial, sans-serif">Education</text>
  <rect x="573.3334" y="561.999957714282" width="666.6666" height="58.000042285718" rx="6.169047433086" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="906.6666" y="600.114295379593" text-anchor="middle" font-size="19.266552038272" fill="var(--text-muted)" font-family="Arial, sans-serif">Tutoring, curriculum design</text>
</svg>

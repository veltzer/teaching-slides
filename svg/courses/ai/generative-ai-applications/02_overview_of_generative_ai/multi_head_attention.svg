  <text x="630.4761" y="546.4593" text-anchor="middle" font-size="19.7694" font-weight="bold" fill="var(--text)">Linear Projection</text>
  <line x1="630.4761" y1="567.2727" x2="630.4761" y2="595.0239" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowDown)" />
  <text x="630.4761" y="620" text-anchor="middle" font-size="19.7694" font-weight="bold" fill="var(--text)">Output</text>

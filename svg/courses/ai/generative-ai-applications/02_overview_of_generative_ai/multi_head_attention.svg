  <text x="571.4286" y="564.2857" text-anchor="middle" font-size="18.5714" font-weight="bold" fill="var(--text)">Linear Projection</text>
  <line x1="571.4286" y1="585.7143" x2="571.4286" y2="614.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrowDown)" />
  <text x="571.4286" y="640" text-anchor="middle" font-size="18.5714" font-weight="bold" fill="var(--text)">Output</text>

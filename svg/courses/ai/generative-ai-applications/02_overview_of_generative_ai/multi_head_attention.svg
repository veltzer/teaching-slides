  <text x="801.9046" y="227.3206" text-anchor="middle" font-size="18.2487" font-weight="bold" fill="var(--text)">Head 3</text>
  <rect x="1011.4285" y="192.6316" width="228.5715" height="55.5024" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <rect x="20.6452" y="16.7442" width="1238.7097" height="150.6977" rx="6.6977" fill="#e3f2fd" stroke="#333" stroke-width="2.5116" />
  <text x="51.6129" y="50.2326" font-size="21.7674" fill="#222" font-weight="bold">"A photo of a doctor":</text>
  <text x="51.6129" y="83.7209" font-size="20.093" fill="#222">→ Predominantly white males in older models</text>
  <text x="51.6129" y="113.8605" font-size="20.093" fill="#222">→ More diverse in newer models (post-bias mitigation)</text>
  <text x="51.6129" y="144" font-size="20.093" fill="#555">→ But can overcorrect (forced diversity in historical contexts)</text>
  <rect x="20.6452" y="192.5581" width="1238.7097" height="117.2093" rx="6.6977" fill="#e8f5e9" stroke="#333" stroke-width="2.5116" />
  <text x="51.6129" y="226.0465" font-size="21.7674" fill="#222" font-weight="bold">"A photo of a beautiful person":</text>
  <text x="51.6129" y="259.5349" font-size="20.093" fill="#222">→ Narrow beauty standards</text>
  <text x="51.6129" y="289.6744" font-size="20.093" fill="#222">→ Skin tone, body type, and age biases</text>
  <rect x="20.6452" y="334.8837" width="1238.7097" height="117.2093" rx="6.6977" fill="#fff3e0" stroke="#333" stroke-width="2.5116" />
  <text x="51.6129" y="368.3721" font-size="21.7674" fill="#222" font-weight="bold">"A photo of a family":</text>
  <text x="51.6129" y="401.8605" font-size="20.093" fill="#222">→ Often nuclear family, Western setting</text>
  <text x="51.6129" y="432" font-size="20.093" fill="#222">→ Underrepresents diverse family structures</text>
  <rect x="20.6452" y="477.2093" width="1238.7097" height="217.6744" rx="6.6977" fill="#f0f4f8" stroke="#333" stroke-width="2.5116" />
  <text x="51.6129" y="510.6977" font-size="21.7674" fill="#222" font-weight="bold">Detection Methodology:</text>
  <text x="51.6129" y="547.5349" font-size="20.093" fill="#222">1. Generate 100 images of "a [profession]"</text>
  <text x="51.6129" y="581.0233" font-size="20.093" fill="#222">2. Classify demographic attributes</text>
  <text x="51.6129" y="614.5116" font-size="20.093" fill="#222">3. Compare to real-world demographics</text>
  <text x="51.6129" y="648" font-size="20.093" fill="#222">4. Measure representation gaps</text>
</svg>
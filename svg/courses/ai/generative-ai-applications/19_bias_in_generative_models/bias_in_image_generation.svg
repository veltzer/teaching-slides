<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:rect x="19.0146" y="15.4217" width="1140.8732" height="138.7952" rx="6.1687" fill="#e3f2fd" stroke="#333" stroke-width="2.3132" />
  <ns0:text x="47.5364" y="46.2651" font-size="20.0482" fill="#222" font-weight="bold">"A photo of a doctor":</ns0:text>
  <ns0:text x="47.5364" y="77.1084" font-size="18.506" fill="#222">→ Predominantly white males in older models</ns0:text>
  <ns0:text x="47.5364" y="104.8675" font-size="18.506" fill="#222">→ More diverse in newer models (post-bias mitigation)</ns0:text>
  <ns0:text x="47.5364" y="132.6265" font-size="18.506" fill="#555">→ But can overcorrect (forced diversity in historical contexts)</ns0:text>
  <ns0:rect x="19.0146" y="177.3494" width="1140.8732" height="107.9518" rx="6.1687" fill="#e8f5e9" stroke="#333" stroke-width="2.3132" />
  <ns0:text x="47.5364" y="208.1928" font-size="20.0482" fill="#222" font-weight="bold">"A photo of a beautiful person":</ns0:text>
  <ns0:text x="47.5364" y="239.0362" font-size="18.506" fill="#222">→ Narrow beauty standards</ns0:text>
  <ns0:text x="47.5364" y="266.7952" font-size="18.506" fill="#222">→ Skin tone, body type, and age biases</ns0:text>
  <ns0:rect x="19.0146" y="308.4337" width="1140.8732" height="107.9518" rx="6.1687" fill="#fff3e0" stroke="#333" stroke-width="2.3132" />
  <ns0:text x="47.5364" y="339.2771" font-size="20.0482" fill="#222" font-weight="bold">"A photo of a family":</ns0:text>
  <ns0:text x="47.5364" y="370.1205" font-size="18.506" fill="#222">→ Often nuclear family, Western setting</ns0:text>
  <ns0:text x="47.5364" y="397.8795" font-size="18.506" fill="#222">→ Underrepresents diverse family structures</ns0:text>
  <ns0:rect x="19.0146" y="439.5181" width="1140.8732" height="200.4819" rx="6.1687" fill="#f0f4f8" stroke="#333" stroke-width="2.3132" />
  <ns0:text x="47.5364" y="470.3615" font-size="20.0482" fill="#222" font-weight="bold">Detection Methodology:</ns0:text>
  <ns0:text x="47.5364" y="504.2892" font-size="18.506" fill="#222">1. Generate 100 images of "a [profession]"</ns0:text>
  <ns0:text x="47.5364" y="535.1326" font-size="18.506" fill="#222">2. Classify demographic attributes</ns0:text>
  <ns0:text x="47.5364" y="565.9759" font-size="18.506" fill="#222">3. Compare to real-world demographics</ns0:text>
  <ns0:text x="47.5364" y="596.8193" font-size="18.506" fill="#222">4. Measure representation gaps</ns0:text>
</ns0:svg>
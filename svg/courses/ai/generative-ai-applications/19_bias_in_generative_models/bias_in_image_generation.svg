<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="128.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="68.642" font-size="19.8138" fill="var(--text)" font-weight="bold">"A photo of a doctor":</text>
  <text x="70" y="97.2839" font-size="18.2896" fill="var(--text)">→ Predominantly white males in older models</text>
  <text x="70" y="123.0617" font-size="18.2896" fill="var(--text)">→ More diverse in newer models (post-bias mitigation)</text>
  <text x="70" y="148.8395" font-size="18.2896" fill="var(--text-muted)">→ But can overcorrect (forced diversity in historical contexts)</text>
  <rect x="40" y="190.3704" width="1200" height="100.2469" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="219.0124" font-size="19.8138" fill="var(--text)" font-weight="bold">"A photo of a beautiful person":</text>
  <text x="70" y="247.6544" font-size="18.2896" fill="var(--text)">→ Narrow beauty standards</text>
  <text x="70" y="273.4321" font-size="18.2896" fill="var(--text)">→ Skin tone, body type, and age biases</text>
  <rect x="40" y="312.0987" width="1200" height="100.2469" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="340.7407" font-size="19.8138" fill="var(--text)" font-weight="bold">"A photo of a family":</text>
  <text x="70" y="369.3827" font-size="18.2896" fill="var(--text)">→ Often nuclear family, Western setting</text>
  <text x="70" y="395.1605" font-size="18.2896" fill="var(--text)">→ Underrepresents diverse family structures</text>
  <rect x="40" y="433.8272" width="1200" height="186.1728" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="70" y="462.4692" font-size="19.8138" fill="var(--text)" font-weight="bold">Detection Methodology:</text>
  <text x="70" y="493.9753" font-size="18.2896" fill="var(--text)">1. Generate 100 images of "a [profession]"</text>
  <text x="70" y="522.6173" font-size="18.2896" fill="var(--text)">2. Classify demographic attributes</text>
  <text x="70" y="551.2593" font-size="18.2896" fill="var(--text)">3. Compare to real-world demographics</text>
  <text x="70" y="579.9013" font-size="18.2896" fill="var(--text)">4. Measure representation gaps</text>
</svg>
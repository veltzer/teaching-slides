<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="1200" height="130.827067669173" rx="10.441386708238" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="78.157894736842" font-family="Arial, sans-serif" font-size="18.794496074829" font-weight="bold" fill="var(--danger-text)">1. Resume Screening (Amazon, 2018)</text>
  <text x="70" y="110.864661654136" font-family="Arial, sans-serif" font-size="15.662080062357" fill="var(--danger-text)">Penalized "women's" on resumes</text>
  <text x="70" y="143.571428571428" font-family="Arial, sans-serif" font-size="15.662080062357" fill="var(--danger-text)">Trained on male-dominated history</text>

  <rect x="40" y="187.18045112782" width="1200" height="130.827067669173" rx="10.441386708238" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="225.338345864662" font-family="Arial, sans-serif" font-size="18.794496074829" font-weight="bold" fill="var(--warn-text)">2. Healthcare Allocation (2019)</text>
  <text x="70" y="258.045112781955" font-family="Arial, sans-serif" font-size="15.662080062357" fill="var(--warn-text)">Used cost as proxy for need</text>
  <text x="70" y="290.751879699248" font-family="Arial, sans-serif" font-size="15.662080062357" fill="var(--warn-text)">Under-allocated care to Black patients</text>

  <rect x="40" y="334.360902255639" width="1200" height="130.827067669173" rx="10.441386708238" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="372.518796992481" font-family="Arial, sans-serif" font-size="18.794496074829" font-weight="bold" fill="var(--ok-text)">3. Image Generation</text>
  <text x="70" y="405.225563909775" font-family="Arial, sans-serif" font-size="15.662080062357" fill="var(--ok-text)">"Professional" skewed white</text>
  <text x="70" y="437.932330827067" font-family="Arial, sans-serif" font-size="15.662080062357" fill="var(--ok-text)">"Beautiful" narrow standards</text>

  <rect x="40" y="481.541353383459" width="1200" height="109.022556390978" rx="10.441386708238" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="517.518796992481" font-family="Arial, sans-serif" font-size="18.794496074829" font-weight="bold" fill="var(--primary-text)">4. Translation</text>
  <text x="70" y="550.225563909774" font-family="Arial, sans-serif" font-size="15.662080062357" fill="var(--primary-text)">Neutral pronouns gendered in English</text>
  <text x="70" y="579.661654135338" font-family="Arial, sans-serif" font-size="15.662080062357" fill="var(--primary-text)">Turkish "O" defaults to "he"</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--danger-accent)">Real harm, not theoretical</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="40" y="40" font-size="19.2111" fill="var(--text)" font-weight="bold">Documented cases of bias in deployed AI systems</text>
  <rect x="40" y="53.242" width="1200" height="125.7991" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.0323" y="79.7261" font-size="17.8389" fill="var(--danger-accent)" font-weight="bold">1. RESUME SCREENING (Amazon, 2018)</text>
  <text x="69.0323" y="106.21" font-size="16.4667" fill="var(--text)">AI penalized resumes containing "women's" (e.g., "women's chess club")</text>
  <text x="69.0323" y="130.0457" font-size="16.4667" fill="var(--text)">Trained on 10 years of male-dominated hiring data</text>
  <rect x="40" y="196.2557" width="1200" height="125.7991" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.0323" y="222.7396" font-size="17.8389" fill="var(--warn-accent)" font-weight="bold">2. HEALTHCARE ALLOCATION (2019)</text>
  <text x="69.0323" y="249.2238" font-size="16.4667" fill="var(--text)">Algorithm used healthcare COST as proxy for NEED</text>
  <text x="69.0323" y="273.0594" font-size="16.4667" fill="var(--text)">Black patients historically spent less due to access barriers</text>
  <text x="69.0323" y="296.895" font-size="16.4667" fill="var(--text)">System under-allocated care to Black patients</text>
  <rect x="40" y="339.2694" width="1200" height="125.7991" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.0323" y="365.7534" font-size="17.8389" fill="var(--ok-accent)" font-weight="bold">3. IMAGE GENERATION (various, 2022-2024)</text>
  <text x="69.0323" y="392.2375" font-size="16.4667" fill="var(--text)">"Professional" prompts → predominantly white individuals</text>
  <text x="69.0323" y="416.0731" font-size="16.4667" fill="var(--text)">"Criminal" prompts → biased racial representation</text>
  <text x="69.0323" y="439.9087" font-size="16.4667" fill="var(--text)">"Beautiful person" → narrow beauty standards</text>
  <rect x="40" y="482.2831" width="1200" height="105.936" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.0323" y="508.7671" font-size="17.8389" fill="var(--primary-accent)" font-weight="bold">4. TRANSLATION</text>
  <text x="69.0323" y="535.2511" font-size="16.4667" fill="var(--text)">Gender-neutral languages → English often adds gender bias</text>
  <text x="69.0323" y="559.0867" font-size="16.4667" fill="var(--text)">Turkish "O bir doktor" → "He is a doctor" (Turkish 'O' is neutral)</text>
  <text x="640" y="620" text-anchor="middle" font-size="17.8389" fill="var(--danger-accent)" font-weight="bold">These aren't theoretical — they cause real harm.</text>
</svg>
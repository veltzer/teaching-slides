<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <text x="20" y="32.3265" font-size="20.5714" fill="#222" font-weight="bold">Documented cases of bias in deployed AI systems</text>
  <rect x="20" y="47.0204" width="1240" height="139.5918" rx="5.8776" fill="#ffebee" stroke="#c62828" stroke-width="2.2041" />
  <text x="50" y="76.4082" font-size="19.102" fill="#c62828" font-weight="bold">1. RESUME SCREENING (Amazon, 2018)</text>
  <text x="50" y="105.7959" font-size="17.6327" fill="#222">AI penalized resumes containing "women's" (e.g., "women's chess club")</text>
  <text x="50" y="132.2449" font-size="17.6327" fill="#222">Trained on 10 years of male-dominated hiring data</text>
  <rect x="20" y="205.7143" width="1240" height="139.5918" rx="5.8776" fill="#fff3e0" stroke="#e65100" stroke-width="2.2041" />
  <text x="50" y="235.102" font-size="19.102" fill="#e65100" font-weight="bold">2. HEALTHCARE ALLOCATION (2019)</text>
  <text x="50" y="264.4898" font-size="17.6327" fill="#222">Algorithm used healthcare COST as proxy for NEED</text>
  <text x="50" y="290.9388" font-size="17.6327" fill="#222">Black patients historically spent less due to access barriers</text>
  <text x="50" y="317.3878" font-size="17.6327" fill="#222">System under-allocated care to Black patients</text>
  <rect x="20" y="364.4082" width="1240" height="139.5918" rx="5.8776" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2041" />
  <text x="50" y="393.7959" font-size="19.102" fill="#2e7d32" font-weight="bold">3. IMAGE GENERATION (various, 2022-2024)</text>
  <text x="50" y="423.1837" font-size="17.6327" fill="#222">"Professional" prompts → predominantly white individuals</text>
  <text x="50" y="449.6327" font-size="17.6327" fill="#222">"Criminal" prompts → biased racial representation</text>
  <text x="50" y="476.0816" font-size="17.6327" fill="#222">"Beautiful person" → narrow beauty standards</text>
  <rect x="20" y="523.102" width="1240" height="117.551" rx="5.8776" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2041" />
  <text x="50" y="552.4898" font-size="19.102" fill="#1565c0" font-weight="bold">4. TRANSLATION</text>
  <text x="50" y="581.8776" font-size="17.6327" fill="#222">Gender-neutral languages → English often adds gender bias</text>
  <text x="50" y="608.3265" font-size="17.6327" fill="#222">Turkish "O bir doktor" → "He is a doctor" (Turkish 'O' is neutral)</text>
  <text x="640" y="675.9184" text-anchor="middle" font-size="19.102" fill="#c62828" font-weight="bold">These aren't theoretical — they cause real harm.</text>
</svg>
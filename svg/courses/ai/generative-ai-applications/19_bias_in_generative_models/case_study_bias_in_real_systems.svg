<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="40" y="40" font-size="19.2111" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Documented cases of bias in deployed AI systems</text>
  <rect x="40" y="53.242" width="1200" height="125.7991" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.0323" y="79.7261" font-size="17.8389" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">1. RESUME SCREENING (Amazon, 2018)</text>
  <text x="69.0323" y="106.21" font-size="16.4667" fill="var(--text)" font-family="Arial, sans-serif">AI penalized resumes containing "women's" (e.g., "women's chess club")</text>
  <text x="69.0323" y="130.0457" font-size="16.4667" fill="var(--text)" font-family="Arial, sans-serif">Trained on 10 years of male-dominated hiring data</text>
  <rect x="40" y="196.2557" width="1200" height="125.7991" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.0323" y="222.7396" font-size="17.8389" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">2. HEALTHCARE ALLOCATION (2019)</text>
  <text x="69.0323" y="249.2238" font-size="16.4667" fill="var(--text)" font-family="Arial, sans-serif">Algorithm used healthcare COST as proxy for NEED</text>
  <text x="69.0323" y="273.0594" font-size="16.4667" fill="var(--text)" font-family="Arial, sans-serif">Black patients historically spent less due to access barriers</text>
  <text x="69.0323" y="296.895" font-size="16.4667" fill="var(--text)" font-family="Arial, sans-serif">System under-allocated care to Black patients</text>
  <rect x="40" y="339.2694" width="1200" height="125.7991" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.0323" y="365.7534" font-size="17.8389" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">3. IMAGE GENERATION (various, 2022-2024)</text>
  <text x="69.0323" y="392.2375" font-size="16.4667" fill="var(--text)" font-family="Arial, sans-serif">"Professional" prompts → predominantly white individuals</text>
  <text x="69.0323" y="416.0731" font-size="16.4667" fill="var(--text)" font-family="Arial, sans-serif">"Criminal" prompts → biased racial representation</text>
  <text x="69.0323" y="439.9087" font-size="16.4667" fill="var(--text)" font-family="Arial, sans-serif">"Beautiful person" → narrow beauty standards</text>
  <rect x="40" y="482.2831" width="1200" height="105.936" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="69.0323" y="508.7671" font-size="17.8389" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">4. TRANSLATION</text>
  <text x="69.0323" y="535.2511" font-size="16.4667" fill="var(--text)" font-family="Arial, sans-serif">Gender-neutral languages → English often adds gender bias</text>
  <text x="69.0323" y="559.0867" font-size="16.4667" fill="var(--text)" font-family="Arial, sans-serif">Turkish "O bir doktor" → "He is a doctor" (Turkish 'O' is neutral)</text>
  <text x="640" y="620" text-anchor="middle" font-size="17.8389" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">These aren't theoretical — they cause real harm.</text>
</svg>
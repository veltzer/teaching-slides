<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="18.9372" y="30.6087" font-size="19.4782" fill="#222" font-weight="bold">Documented cases of bias in deployed AI systems</ns0:text>
  <ns0:rect x="18.9372" y="44.5217" width="1174.1062" height="132.1739" rx="5.5653" fill="#ffebee" stroke="#c62828" stroke-width="2.087" />
  <ns0:text x="47.343" y="72.3479" font-size="18.0869" fill="#c62828" font-weight="bold">1. RESUME SCREENING (Amazon, 2018)</ns0:text>
  <ns0:text x="47.343" y="100.1739" font-size="16.6957" fill="#222">AI penalized resumes containing "women's" (e.g., "women's chess club")</ns0:text>
  <ns0:text x="47.343" y="125.2174" font-size="16.6957" fill="#222">Trained on 10 years of male-dominated hiring data</ns0:text>
  <ns0:rect x="18.9372" y="194.7826" width="1174.1062" height="132.1739" rx="5.5653" fill="#fff3e0" stroke="#e65100" stroke-width="2.087" />
  <ns0:text x="47.343" y="222.6086" font-size="18.0869" fill="#e65100" font-weight="bold">2. HEALTHCARE ALLOCATION (2019)</ns0:text>
  <ns0:text x="47.343" y="250.4348" font-size="16.6957" fill="#222">Algorithm used healthcare COST as proxy for NEED</ns0:text>
  <ns0:text x="47.343" y="275.4783" font-size="16.6957" fill="#222">Black patients historically spent less due to access barriers</ns0:text>
  <ns0:text x="47.343" y="300.5218" font-size="16.6957" fill="#222">System under-allocated care to Black patients</ns0:text>
  <ns0:rect x="18.9372" y="345.0435" width="1174.1062" height="132.1739" rx="5.5653" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.087" />
  <ns0:text x="47.343" y="372.8695" font-size="18.0869" fill="#2e7d32" font-weight="bold">3. IMAGE GENERATION (various, 2022-2024)</ns0:text>
  <ns0:text x="47.343" y="400.6957" font-size="16.6957" fill="#222">"Professional" prompts → predominantly white individuals</ns0:text>
  <ns0:text x="47.343" y="425.7392" font-size="16.6957" fill="#222">"Criminal" prompts → biased racial representation</ns0:text>
  <ns0:text x="47.343" y="450.7826" font-size="16.6957" fill="#222">"Beautiful person" → narrow beauty standards</ns0:text>
  <ns0:rect x="18.9372" y="495.3043" width="1174.1062" height="111.3043" rx="5.5653" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.087" />
  <ns0:text x="47.343" y="523.1304" font-size="18.0869" fill="#1565c0" font-weight="bold">4. TRANSLATION</ns0:text>
  <ns0:text x="47.343" y="550.9565" font-size="16.6957" fill="#222">Gender-neutral languages → English often adds gender bias</ns0:text>
  <ns0:text x="47.343" y="575.9999" font-size="16.6957" fill="#222">Turkish "O bir doktor" → "He is a doctor" (Turkish 'O' is neutral)</ns0:text>
  <ns0:text x="605.9903" y="640" text-anchor="middle" font-size="18.0869" fill="#c62828" font-weight="bold">These aren't theoretical — they cause real harm.</ns0:text>
</ns0:svg>
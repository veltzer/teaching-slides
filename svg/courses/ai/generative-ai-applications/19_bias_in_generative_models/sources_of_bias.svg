<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="23.513121" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">BIAS PIPELINE</text>
  <rect x="40" y="57.755157" width="1200" height="118.367347" rx="6.504651" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857143" y="87.346939" font-size="20.377988" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">DATA COLLECTION</text>
  <text x="82.857143" y="116.93883" font-size="18.810367" fill="var(--text)" font-family="Arial, sans-serif">• Web scraping reflects existing biases</text>
  <text x="82.857143" y="143.571401" font-size="18.810367" fill="var(--text)" font-family="Arial, sans-serif">• Some demographics underrepresented online</text>
  <text x="82.857143" y="170.204082" font-size="18.810367" fill="var(--text)" font-family="Arial, sans-serif">• Historical texts contain outdated views</text>
  <line x1="640" y1="176.122394" x2="640" y2="213.112149" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="213.112149" width="1200" height="118.367347" rx="6.504651" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857143" y="242.70415" font-size="20.377988" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">DATA CURATION</text>
  <text x="82.857143" y="272.295932" font-size="18.810367" fill="var(--text)" font-family="Arial, sans-serif">• Filtering choices may amplify bias</text>
  <text x="82.857143" y="298.928503" font-size="18.810367" fill="var(--text)" font-family="Arial, sans-serif">• Annotator demographics affect labels</text>
  <text x="82.857143" y="325.561183" font-size="18.810367" fill="var(--text)" font-family="Arial, sans-serif">• Translation biases in multilingual data</text>
  <line x1="640" y1="331.479606" x2="640" y2="368.46936" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="368.46936" width="1200" height="118.367347" rx="6.504651" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857143" y="398.061142" font-size="20.377988" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">MODEL TRAINING</text>
  <text x="82.857143" y="427.652924" font-size="18.810367" fill="var(--text)" font-family="Arial, sans-serif">• Model amplifies statistical patterns</text>
  <text x="82.857143" y="454.285714" font-size="18.810367" fill="var(--text)" font-family="Arial, sans-serif">• Majority patterns dominate minority ones</text>
  <text x="82.857143" y="480.918285" font-size="18.810367" fill="var(--text)" font-family="Arial, sans-serif">• Optimization favors common cases</text>
  <line x1="640" y1="486.836707" x2="640" y2="523.826462" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="523.826462" width="1200" height="96.173538" rx="6.504651" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857143" y="553.418244" font-size="20.377988" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">DEPLOYMENT</text>
  <text x="82.857143" y="580.050924" font-size="18.810367" fill="var(--text)" font-family="Arial, sans-serif">• Usage patterns create feedback loops</text>
  <text x="82.857143" y="606.683605" font-size="18.810367" fill="var(--text)" font-family="Arial, sans-serif">• Biased outputs influence human decisions</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah19" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 9.6 L 16.5161 4.8 z" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="23.513121" fill="var(--text)" font-weight="bold">BIAS PIPELINE</text>
  <rect x="40" y="57.755157" width="1200" height="118.367347" rx="6.504651" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="82.857143" y="87.346939" font-size="20.377988" fill="var(--text)" font-weight="bold">DATA COLLECTION</text>
  <text x="82.857143" y="116.93883" font-size="18.810367" fill="var(--text)">• Web scraping reflects existing biases</text>
  <text x="82.857143" y="143.571401" font-size="18.810367" fill="var(--text)">• Some demographics underrepresented online</text>
  <text x="82.857143" y="170.204082" font-size="18.810367" fill="var(--text)">• Historical texts contain outdated views</text>
  <line x1="640" y1="176.122394" x2="640" y2="213.112149" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah19)" />
  <rect x="40" y="213.112149" width="1200" height="118.367347" rx="6.504651" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="82.857143" y="242.70415" font-size="20.377988" fill="var(--text)" font-weight="bold">DATA CURATION</text>
  <text x="82.857143" y="272.295932" font-size="18.810367" fill="var(--text)">• Filtering choices may amplify bias</text>
  <text x="82.857143" y="298.928503" font-size="18.810367" fill="var(--text)">• Annotator demographics affect labels</text>
  <text x="82.857143" y="325.561183" font-size="18.810367" fill="var(--text)">• Translation biases in multilingual data</text>
  <line x1="640" y1="331.479606" x2="640" y2="368.46936" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah19)" />
  <rect x="40" y="368.46936" width="1200" height="118.367347" rx="6.504651" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="82.857143" y="398.061142" font-size="20.377988" fill="var(--text)" font-weight="bold">MODEL TRAINING</text>
  <text x="82.857143" y="427.652924" font-size="18.810367" fill="var(--text)">• Model amplifies statistical patterns</text>
  <text x="82.857143" y="454.285714" font-size="18.810367" fill="var(--text)">• Majority patterns dominate minority ones</text>
  <text x="82.857143" y="480.918285" font-size="18.810367" fill="var(--text)">• Optimization favors common cases</text>
  <line x1="640" y1="486.836707" x2="640" y2="523.826462" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah19)" />
  <rect x="40" y="523.826462" width="1200" height="96.173538" rx="6.504651" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="82.857143" y="553.418244" font-size="20.377988" fill="var(--text)" font-weight="bold">DEPLOYMENT</text>
  <text x="82.857143" y="580.050924" font-size="18.810367" fill="var(--text)">• Usage patterns create feedback loops</text>
  <text x="82.857143" y="606.683605" font-size="18.810367" fill="var(--text)">• Biased outputs influence human decisions</text>
</svg>
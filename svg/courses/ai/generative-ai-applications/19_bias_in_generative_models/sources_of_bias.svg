  <ns0:text x="581.8182" y="55.2727" text-anchor="middle" font-size="21.8182" fill="#222" font-weight="bold">BIAS PIPELINE</ns0:text>
  <ns0:rect x="56.305" y="72.7273" width="1051.0264" height="116.3636" rx="5.8182" fill="#e3f2fd" stroke="#555" stroke-width="2.1818" />
  <ns0:text x="93.8416" y="101.8182" font-size="18.9091" fill="#222" font-weight="bold">DATA COLLECTION</ns0:text>
  <ns0:text x="93.8416" y="130.9091" font-size="17.4545" fill="#222">• Web scraping reflects existing biases</ns0:text>
  <ns0:text x="93.8416" y="157.0909" font-size="17.4545" fill="#222">• Some demographics underrepresented online</ns0:text>
  <ns0:text x="93.8416" y="183.2727" font-size="17.4545" fill="#222">• Historical texts contain outdated views</ns0:text>
  <ns0:line x1="581.8182" y1="189.0909" x2="581.8182" y2="225.4545" stroke="#555" stroke-width="2.9091" marker-end="url(#ah19)" />
  <ns0:rect x="56.305" y="225.4545" width="1051.0264" height="116.3636" rx="5.8182" fill="#e8f5e9" stroke="#555" stroke-width="2.1818" />
  <ns0:text x="93.8416" y="254.5455" font-size="18.9091" fill="#222" font-weight="bold">DATA CURATION</ns0:text>
  <ns0:text x="93.8416" y="283.6364" font-size="17.4545" fill="#222">• Filtering choices may amplify bias</ns0:text>
  <ns0:text x="93.8416" y="309.8182" font-size="17.4545" fill="#222">• Annotator demographics affect labels</ns0:text>
  <ns0:text x="93.8416" y="336" font-size="17.4545" fill="#222">• Translation biases in multilingual data</ns0:text>
  <ns0:line x1="581.8182" y1="341.8182" x2="581.8182" y2="378.1818" stroke="#555" stroke-width="2.9091" marker-end="url(#ah19)" />
  <ns0:rect x="56.305" y="378.1818" width="1051.0264" height="116.3636" rx="5.8182" fill="#fff3e0" stroke="#555" stroke-width="2.1818" />
  <ns0:text x="93.8416" y="407.2727" font-size="18.9091" fill="#222" font-weight="bold">MODEL TRAINING</ns0:text>
  <ns0:text x="93.8416" y="436.3636" font-size="17.4545" fill="#222">• Model amplifies statistical patterns</ns0:text>
  <ns0:text x="93.8416" y="462.5455" font-size="17.4545" fill="#222">• Majority patterns dominate minority ones</ns0:text>
  <ns0:text x="93.8416" y="488.7273" font-size="17.4545" fill="#222">• Optimization favors common cases</ns0:text>
  <ns0:line x1="581.8182" y1="494.5455" x2="581.8182" y2="530.9091" stroke="#555" stroke-width="2.9091" marker-end="url(#ah19)" />
  <ns0:rect x="56.305" y="530.9091" width="1051.0264" height="94.5455" rx="5.8182" fill="#ffebee" stroke="#555" stroke-width="2.1818" />
  <ns0:text x="93.8416" y="560" font-size="18.9091" fill="#222" font-weight="bold">DEPLOYMENT</ns0:text>
  <ns0:text x="93.8416" y="586.1818" font-size="17.4545" fill="#222">• Usage patterns create feedback loops</ns0:text>
  <ns0:text x="93.8416" y="612.3636" font-size="17.4545" fill="#222">• Biased outputs influence human decisions</ns0:text>

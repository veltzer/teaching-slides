<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah19" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 9.6 L 16.5161 4.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="18.7684" y="14.5455" width="1126.0997" height="625.4545" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="581.8182" y="55.2727" text-anchor="middle" font-size="21.8182" fill="var(--text)" font-weight="bold">BIAS PIPELINE</text>
  <rect x="56.305" y="72.7273" width="1051.0264" height="116.3636" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="93.8416" y="101.8182" font-size="18.9091" fill="var(--text)" font-weight="bold">DATA COLLECTION</text>
  <text x="93.8416" y="130.9091" font-size="17.4545" fill="var(--text)">• Web scraping reflects existing biases</text>
  <text x="93.8416" y="157.0909" font-size="17.4545" fill="var(--text)">• Some demographics underrepresented online</text>
  <text x="93.8416" y="183.2727" font-size="17.4545" fill="var(--text)">• Historical texts contain outdated views</text>
  <line x1="581.8182" y1="189.0909" x2="581.8182" y2="225.4545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah19)" />
  <rect x="56.305" y="225.4545" width="1051.0264" height="116.3636" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="93.8416" y="254.5455" font-size="18.9091" fill="var(--text)" font-weight="bold">DATA CURATION</text>
  <text x="93.8416" y="283.6364" font-size="17.4545" fill="var(--text)">• Filtering choices may amplify bias</text>
  <text x="93.8416" y="309.8182" font-size="17.4545" fill="var(--text)">• Annotator demographics affect labels</text>
  <text x="93.8416" y="336" font-size="17.4545" fill="var(--text)">• Translation biases in multilingual data</text>
  <line x1="581.8182" y1="341.8182" x2="581.8182" y2="378.1818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah19)" />
  <rect x="56.305" y="378.1818" width="1051.0264" height="116.3636" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="93.8416" y="407.2727" font-size="18.9091" fill="var(--text)" font-weight="bold">MODEL TRAINING</text>
  <text x="93.8416" y="436.3636" font-size="17.4545" fill="var(--text)">• Model amplifies statistical patterns</text>
  <text x="93.8416" y="462.5455" font-size="17.4545" fill="var(--text)">• Majority patterns dominate minority ones</text>
  <text x="93.8416" y="488.7273" font-size="17.4545" fill="var(--text)">• Optimization favors common cases</text>
  <line x1="581.8182" y1="494.5455" x2="581.8182" y2="530.9091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah19)" />
  <rect x="56.305" y="530.9091" width="1051.0264" height="94.5455" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="93.8416" y="560" font-size="18.9091" fill="var(--text)" font-weight="bold">DEPLOYMENT</text>
  <text x="93.8416" y="586.1818" font-size="17.4545" fill="var(--text)">• Usage patterns create feedback loops</text>
  <text x="93.8416" y="612.3636" font-size="17.4545" fill="var(--text)">• Biased outputs influence human decisions</text>
</svg>
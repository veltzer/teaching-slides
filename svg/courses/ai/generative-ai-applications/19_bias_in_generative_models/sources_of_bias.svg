<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="122.105275156788" rx="6.60655806495" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857143" y="70.526262310244" font-size="20.697245858211" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">DATA COLLECTION</text>
  <text x="82.857143" y="101.052637062604" font-size="19.10506525385" fill="var(--text)" font-family="Arial, sans-serif">• Web scraping reflects existing biases</text>
  <text x="82.857143" y="128.526239306031" font-size="19.10506525385" fill="var(--text)" font-family="Arial, sans-serif">• Some demographics underrepresented online</text>
  <text x="82.857143" y="155.999955023154" font-size="19.10506525385" fill="var(--text)" font-family="Arial, sans-serif">• Historical texts contain outdated views</text>
  <line x1="640" y1="162.105161683093" x2="640" y2="200.263017939322" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="40" y="200.263017939322" width="1200" height="122.105275156788" rx="6.60655806495" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857143" y="230.789506165377" font-size="20.697245858211" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">DATA CURATION</text>
  <text x="82.857143" y="261.315768475621" font-size="19.10506525385" fill="var(--text)" font-family="Arial, sans-serif">• Filtering choices may amplify bias</text>
  <text x="82.857143" y="288.789370719048" font-size="19.10506525385" fill="var(--text)" font-family="Arial, sans-serif">• Annotator demographics affect labels</text>
  <text x="82.857143" y="316.263085404591" font-size="19.10506525385" fill="var(--text)" font-family="Arial, sans-serif">• Translation biases in multilingual data</text>
  <line x1="640" y1="322.368406569805" x2="640" y2="360.526261794455" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="40" y="360.526261794455" width="1200" height="122.105275156788" rx="6.60655806495" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857143" y="391.052524104699" font-size="20.697245858211" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">MODEL TRAINING</text>
  <text x="82.857143" y="421.578786414943" font-size="19.10506525385" fill="var(--text)" font-family="Arial, sans-serif">• Model amplifies statistical patterns</text>
  <text x="82.857143" y="449.052614574181" font-size="19.10506525385" fill="var(--text)" font-family="Arial, sans-serif">• Majority patterns dominate minority ones</text>
  <text x="82.857143" y="476.526216817608" font-size="19.10506525385" fill="var(--text)" font-family="Arial, sans-serif">• Optimization favors common cases</text>
  <line x1="640" y1="482.631536951242" x2="640" y2="520.789393207471" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="40" y="520.789393207471" width="1200" height="99.210606792529" rx="6.60655806495" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857143" y="551.315655517715" font-size="20.697245858211" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">DEPLOYMENT</text>
  <text x="82.857143" y="578.789370203259" font-size="19.10506525385" fill="var(--text)" font-family="Arial, sans-serif">• Usage patterns create feedback loops</text>
  <text x="82.857143" y="606.263085920381" font-size="19.10506525385" fill="var(--text)" font-family="Arial, sans-serif">• Biased outputs influence human decisions</text>
</svg>

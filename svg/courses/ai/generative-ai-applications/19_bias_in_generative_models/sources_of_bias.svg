<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah19" markerWidth="16.5161" markerHeight="12.8" refX="12.3871" refY="4.8" orient="auto">
      <path d="M 0 0 L 0 9.6 L 16.5161 4.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="18.7684" y="14.5455" width="1126.0997" height="625.4545" rx="8.7273" fill="var(--surface)" stroke="var(--text-dark)" stroke-width="2.9091" />
  <text x="581.8182" y="55.2727" text-anchor="middle" font-size="21.8182" fill="var(--text-darker)" font-weight="bold">BIAS PIPELINE</text>
  <rect x="56.305" y="72.7273" width="1051.0264" height="116.3636" rx="5.8182" fill="var(--primary-pale)" stroke="var(--text-muted)" stroke-width="2.1818" />
  <text x="93.8416" y="101.8182" font-size="18.9091" fill="var(--text-darker)" font-weight="bold">DATA COLLECTION</text>
  <text x="93.8416" y="130.9091" font-size="17.4545" fill="var(--text-darker)">• Web scraping reflects existing biases</text>
  <text x="93.8416" y="157.0909" font-size="17.4545" fill="var(--text-darker)">• Some demographics underrepresented online</text>
  <text x="93.8416" y="183.2727" font-size="17.4545" fill="var(--text-darker)">• Historical texts contain outdated views</text>
  <line x1="581.8182" y1="189.0909" x2="581.8182" y2="225.4545" stroke="var(--text-muted)" stroke-width="2.9091" marker-end="url(#ah19)" />
  <rect x="56.305" y="225.4545" width="1051.0264" height="116.3636" rx="5.8182" fill="var(--ok-pale)" stroke="var(--text-muted)" stroke-width="2.1818" />
  <text x="93.8416" y="254.5455" font-size="18.9091" fill="var(--text-darker)" font-weight="bold">DATA CURATION</text>
  <text x="93.8416" y="283.6364" font-size="17.4545" fill="var(--text-darker)">• Filtering choices may amplify bias</text>
  <text x="93.8416" y="309.8182" font-size="17.4545" fill="var(--text-darker)">• Annotator demographics affect labels</text>
  <text x="93.8416" y="336" font-size="17.4545" fill="var(--text-darker)">• Translation biases in multilingual data</text>
  <line x1="581.8182" y1="341.8182" x2="581.8182" y2="378.1818" stroke="var(--text-muted)" stroke-width="2.9091" marker-end="url(#ah19)" />
  <rect x="56.305" y="378.1818" width="1051.0264" height="116.3636" rx="5.8182" fill="var(--warn-pale)" stroke="var(--text-muted)" stroke-width="2.1818" />
  <text x="93.8416" y="407.2727" font-size="18.9091" fill="var(--text-darker)" font-weight="bold">MODEL TRAINING</text>
  <text x="93.8416" y="436.3636" font-size="17.4545" fill="var(--text-darker)">• Model amplifies statistical patterns</text>
  <text x="93.8416" y="462.5455" font-size="17.4545" fill="var(--text-darker)">• Majority patterns dominate minority ones</text>
  <text x="93.8416" y="488.7273" font-size="17.4545" fill="var(--text-darker)">• Optimization favors common cases</text>
  <line x1="581.8182" y1="494.5455" x2="581.8182" y2="530.9091" stroke="var(--text-muted)" stroke-width="2.9091" marker-end="url(#ah19)" />
  <rect x="56.305" y="530.9091" width="1051.0264" height="94.5455" rx="5.8182" fill="var(--danger-pale)" stroke="var(--text-muted)" stroke-width="2.1818" />
  <text x="93.8416" y="560" font-size="18.9091" fill="var(--text-darker)" font-weight="bold">DEPLOYMENT</text>
  <text x="93.8416" y="586.1818" font-size="17.4545" fill="var(--text-darker)">• Usage patterns create feedback loops</text>
  <text x="93.8416" y="612.3636" font-size="17.4545" fill="var(--text-darker)">• Biased outputs influence human decisions</text>
</svg>
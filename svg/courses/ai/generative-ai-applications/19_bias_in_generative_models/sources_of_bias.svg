<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah19" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 9.6 L 16.5161 4.8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="77.7674" text-anchor="middle" font-size="21.6889" fill="var(--text)" font-weight="bold">BIAS PIPELINE</text>
  <rect x="79.9999" y="93.9535" width="1120" height="107.907" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="119.9999" y="120.9302" font-size="18.797" fill="var(--text)" font-weight="bold">DATA COLLECTION</text>
  <text x="119.9999" y="147.907" font-size="17.351" fill="var(--text)">• Web scraping reflects existing biases</text>
  <text x="119.9999" y="172.186" font-size="17.351" fill="var(--text)">• Some demographics underrepresented online</text>
  <text x="119.9999" y="196.4651" font-size="17.351" fill="var(--text)">• Historical texts contain outdated views</text>
  <line x1="639.9999" y1="201.8604" x2="639.9999" y2="235.5813" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah19)" />
  <rect x="79.9999" y="235.5813" width="1120" height="107.907" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="119.9999" y="262.5582" font-size="18.797" fill="var(--text)" font-weight="bold">DATA CURATION</text>
  <text x="119.9999" y="289.5349" font-size="17.351" fill="var(--text)">• Filtering choices may amplify bias</text>
  <text x="119.9999" y="313.8139" font-size="17.351" fill="var(--text)">• Annotator demographics affect labels</text>
  <text x="119.9999" y="338.093" font-size="17.351" fill="var(--text)">• Translation biases in multilingual data</text>
  <line x1="639.9999" y1="343.4884" x2="639.9999" y2="377.2093" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah19)" />
  <rect x="79.9999" y="377.2093" width="1120" height="107.907" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="119.9999" y="404.186" font-size="18.797" fill="var(--text)" font-weight="bold">MODEL TRAINING</text>
  <text x="119.9999" y="431.1627" font-size="17.351" fill="var(--text)">• Model amplifies statistical patterns</text>
  <text x="119.9999" y="455.4419" font-size="17.351" fill="var(--text)">• Majority patterns dominate minority ones</text>
  <text x="119.9999" y="479.7209" font-size="17.351" fill="var(--text)">• Optimization favors common cases</text>
  <line x1="639.9999" y1="485.1163" x2="639.9999" y2="518.8372" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah19)" />
  <rect x="79.9999" y="518.8372" width="1120" height="87.6745" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="119.9999" y="545.8139" font-size="18.797" fill="var(--text)" font-weight="bold">DEPLOYMENT</text>
  <text x="119.9999" y="570.093" font-size="17.351" fill="var(--text)">• Usage patterns create feedback loops</text>
  <text x="119.9999" y="594.3721" font-size="17.351" fill="var(--text)">• Biased outputs influence human decisions</text>
</svg>
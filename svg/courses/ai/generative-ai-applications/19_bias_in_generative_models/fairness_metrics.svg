<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="40" width="1200" height="43.1915" rx="6" fill="var(--text)" />
  <text x="640" y="68.3829" text-anchor="middle" font-size="18.5552" fill="var(--bg)" font-weight="bold">FAIRNESS METRICS</text>
  <rect x="80" y="95.5318" width="1120" height="98.7234" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="120" y="118.9787" font-size="17.2299" fill="var(--text)" font-weight="bold">DEMOGRAPHIC PARITY</text>
  <text x="120" y="142.4255" font-size="15.9045" fill="var(--text)" font-style="italic">P(positive | group A) = P(positive | group B)</text>
  <text x="120" y="164.6382" font-size="15.9045" fill="var(--text)">Same rate of positive outcomes regardless of group</text>
  <rect x="80" y="210.2979" width="1120" height="98.7234" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="120" y="233.7447" font-size="17.2299" fill="var(--text)" font-weight="bold">EQUALIZED ODDS</text>
  <text x="120" y="257.1915" font-size="15.9045" fill="var(--text)" font-style="italic">P(ŷ=1 | y=1, A) = P(ŷ=1 | y=1, B)</text>
  <text x="120" y="279.4042" font-size="15.9045" fill="var(--text)">Same true positive rate across groups</text>
  <rect x="80" y="325.0638" width="1120" height="98.7234" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="120" y="348.5106" font-size="17.2299" fill="var(--text)" font-weight="bold">CALIBRATION</text>
  <text x="120" y="371.9574" font-size="15.9045" fill="var(--text)">Among those scored X%, ~X% should be positive</text>
  <text x="120" y="394.1702" font-size="15.9045" fill="var(--text)">for ALL groups</text>
  <rect x="80" y="439.8297" width="1120" height="74.0426" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="120" y="463.2766" font-size="17.2299" fill="var(--text)" font-weight="bold">INDIVIDUAL FAIRNESS</text>
  <text x="120" y="486.7234" font-size="15.9045" fill="var(--text)">Similar individuals should get similar outcomes</text>
  <rect x="80" y="531.1489" width="1120" height="74.0426" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="120" y="554.5958" font-size="15.9045" fill="var(--danger-accent)" font-weight="bold">NOTE: Perfect fairness across ALL metrics simultaneously</text>
  <text x="120" y="576.8086" font-size="15.9045" fill="var(--danger-accent)" font-weight="bold">is mathematically impossible (Impossibility theorem, Chouldechova 2017)</text>
</svg>
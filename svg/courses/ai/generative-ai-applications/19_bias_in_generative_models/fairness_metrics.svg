<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="44.323154" rx="6.078094" fill="var(--text)"/>
  <text x="640" y="69.126556" text-anchor="middle" font-size="18.796709" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">FAIRNESS METRICS</text>
  <rect x="80" y="96.986781" width="1120" height="101.310037" rx="6.078094" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="121.048009" font-size="17.45416" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">DEMOGRAPHIC PARITY</text>
  <text x="120" y="145.109136" font-size="16.111509" fill="var(--text)" font-style="italic" font-family="Arial, sans-serif">P(positive | group A) = P(positive | group B)</text>
  <text x="120" y="167.903827" font-size="16.111509" fill="var(--text)" font-family="Arial, sans-serif">Same rate of positive outcomes regardless of group</text>
  <rect x="80" y="214.75985" width="1120" height="101.310037" rx="6.078094" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="238.820977" font-size="17.45416" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">EQUALIZED ODDS</text>
  <text x="120" y="262.882103" font-size="16.111509" fill="var(--text)" font-style="italic" font-family="Arial, sans-serif">P(ŷ=1 | y=1, A) = P(ŷ=1 | y=1, B)</text>
  <text x="120" y="285.676795" font-size="16.111509" fill="var(--text)" font-family="Arial, sans-serif">Same true positive rate across groups</text>
  <rect x="80" y="332.532715" width="1120" height="101.310037" rx="6.078094" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="356.593841" font-size="17.45416" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">CALIBRATION</text>
  <text x="120" y="380.654967" font-size="16.111509" fill="var(--text)" font-family="Arial, sans-serif">Among those scored X%, ~X% should be positive</text>
  <text x="120" y="403.449762" font-size="16.111509" fill="var(--text)" font-family="Arial, sans-serif">for ALL groups</text>
  <rect x="80" y="450.30558" width="1120" height="75.982579" rx="6.078094" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="120" y="474.366808" font-size="17.45416" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">INDIVIDUAL FAIRNESS</text>
  <text x="120" y="498.427935" font-size="16.111509" fill="var(--text)" font-family="Arial, sans-serif">Similar individuals should get similar outcomes</text>
  <rect x="80" y="544.017421" width="1120" height="75.982579" rx="6.078094" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="568.078649" font-size="16.111509" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">NOTE: Perfect fairness across ALL metrics simultaneously</text>
  <text x="120" y="590.873444" font-size="16.111509" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">is mathematically impossible (Impossibility theorem, Chouldechova 2017)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="18.7336" y="13.3334" width="1124.0144" height="626.6666" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="18.7336" y="13.3334" width="1124.0144" height="46.6667" rx="6" fill="var(--text)" />
  <text x="580.7408" y="44" text-anchor="middle" font-size="18.6666" fill="var(--bg)" font-weight="bold">FAIRNESS METRICS</text>
  <rect x="56.2007" y="73.3333" width="1049.0801" height="106.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="93.6679" y="98.6667" font-size="17.3333" fill="var(--text)" font-weight="bold">DEMOGRAPHIC PARITY</text>
  <text x="93.6679" y="124" font-size="16" fill="var(--text)" font-style="italic">P(positive | group A) = P(positive | group B)</text>
  <text x="93.6679" y="148" font-size="16" fill="var(--text)">Same rate of positive outcomes regardless of group</text>
  <rect x="56.2007" y="197.3334" width="1049.0801" height="106.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="93.6679" y="222.6667" font-size="17.3333" fill="var(--text)" font-weight="bold">EQUALIZED ODDS</text>
  <text x="93.6679" y="248" font-size="16" fill="var(--text)" font-style="italic">P(ŷ=1 | y=1, A) = P(ŷ=1 | y=1, B)</text>
  <text x="93.6679" y="272" font-size="16" fill="var(--text)">Same true positive rate across groups</text>
  <rect x="56.2007" y="321.3333" width="1049.0801" height="106.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="93.6679" y="346.6667" font-size="17.3333" fill="var(--text)" font-weight="bold">CALIBRATION</text>
  <text x="93.6679" y="372" font-size="16" fill="var(--text)">Among those scored X%, ~X% should be positive</text>
  <text x="93.6679" y="396" font-size="16" fill="var(--text)">for ALL groups</text>
  <rect x="56.2007" y="445.3333" width="1049.0801" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="93.6679" y="470.6667" font-size="17.3333" fill="var(--text)" font-weight="bold">INDIVIDUAL FAIRNESS</text>
  <text x="93.6679" y="496" font-size="16" fill="var(--text)">Similar individuals should get similar outcomes</text>
  <rect x="56.2007" y="544" width="1049.0801" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="93.6679" y="569.3334" font-size="16" fill="var(--danger-accent)" font-weight="bold">NOTE: Perfect fairness across ALL metrics simultaneously</text>
  <text x="93.6679" y="593.3334" font-size="16" fill="var(--danger-accent)" font-weight="bold">is mathematically impossible (Impossibility theorem, Chouldechova 2017)</text>
</svg>
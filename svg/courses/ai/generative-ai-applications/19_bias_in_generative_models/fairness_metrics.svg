<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:rect x="18.7336" y="13.3334" width="1124.0144" height="626.6666" rx="8" fill="#f0f4f8" stroke="#333" stroke-width="2.6667" />
  <ns0:rect x="18.7336" y="13.3334" width="1124.0144" height="46.6667" rx="8" fill="#333" />
  <ns0:text x="580.7408" y="44" text-anchor="middle" font-size="18.6666" fill="#fff" font-weight="bold">FAIRNESS METRICS</ns0:text>
  <ns0:rect x="56.2007" y="73.3333" width="1049.0801" height="106.6667" rx="5.3334" fill="#e3f2fd" stroke="#555" stroke-width="2" />
  <ns0:text x="93.6679" y="98.6667" font-size="17.3333" fill="#222" font-weight="bold">DEMOGRAPHIC PARITY</ns0:text>
  <ns0:text x="93.6679" y="124" font-size="16" fill="#222" font-style="italic">P(positive | group A) = P(positive | group B)</ns0:text>
  <ns0:text x="93.6679" y="148" font-size="16" fill="#222">Same rate of positive outcomes regardless of group</ns0:text>
  <ns0:rect x="56.2007" y="197.3334" width="1049.0801" height="106.6667" rx="5.3334" fill="#e8f5e9" stroke="#555" stroke-width="2" />
  <ns0:text x="93.6679" y="222.6667" font-size="17.3333" fill="#222" font-weight="bold">EQUALIZED ODDS</ns0:text>
  <ns0:text x="93.6679" y="248" font-size="16" fill="#222" font-style="italic">P(ŷ=1 | y=1, A) = P(ŷ=1 | y=1, B)</ns0:text>
  <ns0:text x="93.6679" y="272" font-size="16" fill="#222">Same true positive rate across groups</ns0:text>
  <ns0:rect x="56.2007" y="321.3333" width="1049.0801" height="106.6667" rx="5.3334" fill="#fff3e0" stroke="#555" stroke-width="2" />
  <ns0:text x="93.6679" y="346.6667" font-size="17.3333" fill="#222" font-weight="bold">CALIBRATION</ns0:text>
  <ns0:text x="93.6679" y="372" font-size="16" fill="#222">Among those scored X%, ~X% should be positive</ns0:text>
  <ns0:text x="93.6679" y="396" font-size="16" fill="#222">for ALL groups</ns0:text>
  <ns0:rect x="56.2007" y="445.3333" width="1049.0801" height="80" rx="5.3334" fill="#f0f4f8" stroke="#555" stroke-width="2" />
  <ns0:text x="93.6679" y="470.6667" font-size="17.3333" fill="#222" font-weight="bold">INDIVIDUAL FAIRNESS</ns0:text>
  <ns0:text x="93.6679" y="496" font-size="16" fill="#222">Similar individuals should get similar outcomes</ns0:text>
  <ns0:rect x="56.2007" y="544" width="1049.0801" height="80" rx="5.3334" fill="#ffebee" stroke="#c62828" stroke-width="2" />
  <ns0:text x="93.6679" y="569.3334" font-size="16" fill="#c62828" font-weight="bold">NOTE: Perfect fairness across ALL metrics simultaneously</ns0:text>
  <ns0:text x="93.6679" y="593.3334" font-size="16" fill="#c62828" font-weight="bold">is mathematically impossible (Impossibility theorem, Chouldechova 2017)</ns0:text>
</ns0:svg>
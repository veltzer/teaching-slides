</defs>
  <ns0:rect x="18.7781" y="14.8837" width="1126.6818" height="625.1163" rx="8.9302" fill="var(--surface)" stroke="var(--text-dark)" stroke-width="2.9767" />
  <ns0:rect x="18.7781" y="14.8837" width="1126.6818" height="52.093" rx="8.9302" fill="var(--text-dark)" />
  <ns0:text x="582.1189" y="49.1163" text-anchor="middle" font-size="20.8372" fill="var(--bg)" font-weight="bold">BIAS MITIGATION APPROACHES</ns0:text>
  <ns0:rect x="56.3341" y="81.8605" width="1051.5696" height="126.5116" rx="5.9535" fill="var(--primary-pale)" stroke="var(--text-muted)" stroke-width="2.2325" />
  <ns0:text x="93.8901" y="110.1395" font-size="19.3488" fill="var(--text-darker)" font-weight="bold">PRE-TRAINING (Data level)</ns0:text>
  <ns0:text x="93.8901" y="138.4186" font-size="17.8605" fill="var(--text-darker)">• Balance training data demographics</ns0:text>
  <ns0:text x="93.8901" y="165.2094" font-size="17.8605" fill="var(--text-darker)">• Remove known biased text</ns0:text>
  <ns0:text x="93.8901" y="192" font-size="17.8605" fill="var(--text-darker)">• Augment underrepresented groups</ns0:text>
  <ns0:rect x="56.3341" y="230.6977" width="1051.5696" height="126.5116" rx="5.9535" fill="var(--ok-pale)" stroke="var(--text-muted)" stroke-width="2.2325" />
  <ns0:text x="93.8901" y="258.9768" font-size="19.3488" fill="var(--text-darker)" font-weight="bold">TRAINING (Model level)</ns0:text>
  <ns0:text x="93.8901" y="287.2559" font-size="17.8605" fill="var(--text-darker)">• Contrastive debiasing objectives</ns0:text>
  <ns0:text x="93.8901" y="314.0465" font-size="17.8605" fill="var(--text-darker)">• Adversarial training against bias classifiers</ns0:text>
  <ns0:text x="93.8901" y="340.8373" font-size="17.8605" fill="var(--text-darker)">• Fairness constraints in loss function</ns0:text>
  <ns0:rect x="56.3341" y="379.5349" width="1051.5696" height="126.5116" rx="5.9535" fill="var(--warn-pale)" stroke="var(--text-muted)" stroke-width="2.2325" />
  <ns0:text x="93.8901" y="407.814" font-size="19.3488" fill="var(--text-darker)" font-weight="bold">POST-TRAINING (Output level)</ns0:text>
  <ns0:text x="93.8901" y="436.093" font-size="17.8605" fill="var(--text-darker)">• RLHF with bias-aware human feedback</ns0:text>
  <ns0:text x="93.8901" y="462.8838" font-size="17.8605" fill="var(--text-darker)">• Constitutional AI with fairness principles</ns0:text>
  <ns0:text x="93.8901" y="489.6744" font-size="17.8605" fill="var(--text-darker)">• Output filtering and reranking</ns0:text>
  <ns0:rect x="56.3341" y="528.3721" width="1051.5696" height="96.7442" rx="5.9535" fill="var(--surface)" stroke="var(--text-muted)" stroke-width="2.2325" />
  <ns0:text x="93.8901" y="556.6512" font-size="19.3488" fill="var(--text-darker)" font-weight="bold">DEPLOYMENT (Application level)</ns0:text>
  <ns0:text x="93.8901" y="584.9303" font-size="17.8605" fill="var(--text-darker)">• Prompt engineering for fairness  •  Output auditing and monitoring</ns0:text>
  <ns0:text x="93.8901" y="611.721" font-size="17.8605" fill="var(--text-darker)">• User feedback collection  •  Regular bias evaluations</ns0:text>
</ns0:svg>
  <text x="640" y="54" text-anchor="middle" font-size="22.9091" fill="#fff" font-weight="bold">BIAS MITIGATION APPROACHES</text>
  <rect x="61.9355" y="90" width="1156.129" height="139.0909" rx="6.5455" fill="#e3f2fd" stroke="#555" stroke-width="2.4545" />
  <text x="103.2258" y="121.0909" font-size="21.2727" fill="#222" font-weight="bold">PRE-TRAINING (Data level)</text>
  <text x="103.2258" y="152.1818" font-size="19.6364" fill="#222">• Balance training data demographics</text>
  <text x="103.2258" y="181.6364" font-size="19.6364" fill="#222">• Remove known biased text</text>
  <text x="103.2258" y="211.0909" font-size="19.6364" fill="#222">• Augment underrepresented groups</text>
  <rect x="61.9355" y="253.6364" width="1156.129" height="139.0909" rx="6.5455" fill="#e8f5e9" stroke="#555" stroke-width="2.4545" />
  <text x="103.2258" y="284.7273" font-size="21.2727" fill="#222" font-weight="bold">TRAINING (Model level)</text>
  <text x="103.2258" y="315.8182" font-size="19.6364" fill="#222">• Contrastive debiasing objectives</text>
  <text x="103.2258" y="345.2727" font-size="19.6364" fill="#222">• Adversarial training against bias classifiers</text>
  <text x="103.2258" y="374.7273" font-size="19.6364" fill="#222">• Fairness constraints in loss function</text>
  <rect x="61.9355" y="417.2727" width="1156.129" height="139.0909" rx="6.5455" fill="#fff3e0" stroke="#555" stroke-width="2.4545" />
  <text x="103.2258" y="448.3636" font-size="21.2727" fill="#222" font-weight="bold">POST-TRAINING (Output level)</text>
  <text x="103.2258" y="479.4545" font-size="19.6364" fill="#222">• RLHF with bias-aware human feedback</text>
  <text x="103.2258" y="508.9091" font-size="19.6364" fill="#222">• Constitutional AI with fairness principles</text>
  <text x="103.2258" y="538.3636" font-size="19.6364" fill="#222">• Output filtering and reranking</text>
  <rect x="61.9355" y="580.9091" width="1156.129" height="106.3636" rx="6.5455" fill="#f0f4f8" stroke="#555" stroke-width="2.4545" />
  <text x="103.2258" y="612" font-size="21.2727" fill="#222" font-weight="bold">DEPLOYMENT (Application level)</text>
  <text x="103.2258" y="643.0909" font-size="19.6364" fill="#222">• Prompt engineering for fairness  •  Output auditing and monitoring</text>
  <text x="103.2258" y="672.5455" font-size="19.6364" fill="#222">• User feedback collection  •  Regular bias evaluations</text>

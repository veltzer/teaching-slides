<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="40" width="1200" height="48.3333" rx="6" fill="var(--text)" />
  <text x="639.9999" y="71.7619" text-anchor="middle" font-size="20.714" fill="var(--bg)" font-weight="bold">BIAS MITIGATION APPROACHES</text>
  <rect x="79.9999" y="102.1429" width="1119.9999" height="117.3809" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="119.9999" y="128.3809" font-size="19.2344" fill="var(--text)" font-weight="bold">PRE-TRAINING (Data level)</text>
  <text x="119.9999" y="154.6191" font-size="17.7549" fill="var(--text)">• Balance training data demographics</text>
  <text x="119.9999" y="179.4763" font-size="17.7549" fill="var(--text)">• Remove known biased text</text>
  <text x="119.9999" y="204.3333" font-size="17.7549" fill="var(--text)">• Augment underrepresented groups</text>
  <rect x="79.9999" y="240.2381" width="1119.9999" height="117.3809" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="119.9999" y="266.4763" font-size="19.2344" fill="var(--text)" font-weight="bold">TRAINING (Model level)</text>
  <text x="119.9999" y="292.7144" font-size="17.7549" fill="var(--text)">• Contrastive debiasing objectives</text>
  <text x="119.9999" y="317.5714" font-size="17.7549" fill="var(--text)">• Adversarial training against bias classifiers</text>
  <text x="119.9999" y="342.4287" font-size="17.7549" fill="var(--text)">• Fairness constraints in loss function</text>
  <rect x="79.9999" y="378.3334" width="1119.9999" height="117.3809" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="119.9999" y="404.5715" font-size="19.2344" fill="var(--text)" font-weight="bold">POST-TRAINING (Output level)</text>
  <text x="119.9999" y="430.8095" font-size="17.7549" fill="var(--text)">• RLHF with bias-aware human feedback</text>
  <text x="119.9999" y="455.6667" font-size="17.7549" fill="var(--text)">• Constitutional AI with fairness principles</text>
  <text x="119.9999" y="480.5238" font-size="17.7549" fill="var(--text)">• Output filtering and reranking</text>
  <rect x="79.9999" y="516.4286" width="1119.9999" height="89.7619" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="119.9999" y="542.6667" font-size="19.2344" fill="var(--text)" font-weight="bold">DEPLOYMENT (Application level)</text>
  <text x="119.9999" y="568.9048" font-size="17.7549" fill="var(--text)">• Prompt engineering for fairness  •  Output auditing and monitoring</text>
  <text x="119.9999" y="593.762" font-size="17.7549" fill="var(--text)">• User feedback collection  •  Regular bias evaluations</text>
</svg>
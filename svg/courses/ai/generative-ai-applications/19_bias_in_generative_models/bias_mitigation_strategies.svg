<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="49.512159" rx="6.07273" fill="var(--text)"/>
  <text x="639.9999" y="72.536579" text-anchor="middle" font-size="20.965088" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">BIAS MITIGATION APPROACHES</text>
  <rect x="79.9999" y="103.658578" width="1119.9999" height="120.243844" rx="6.07273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.9999" y="130.536528" font-size="19.467552" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">PRE-TRAINING (Data level)</text>
  <text x="119.9999" y="157.414683" font-size="17.970118" fill="var(--text)" font-family="Arial, sans-serif">• Balance training data demographics</text>
  <text x="119.9999" y="182.878155" font-size="17.970118" fill="var(--text)" font-family="Arial, sans-serif">• Remove known biased text</text>
  <text x="119.9999" y="208.341422" font-size="17.970118" fill="var(--text)" font-family="Arial, sans-serif">• Augment underrepresented groups</text>
  <rect x="79.9999" y="245.121947" width="1119.9999" height="120.243844" rx="6.07273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.9999" y="272.000102" font-size="19.467552" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">TRAINING (Model level)</text>
  <text x="119.9999" y="298.878155" font-size="17.970118" fill="var(--text)" font-family="Arial, sans-serif">• Contrastive debiasing objectives</text>
  <text x="119.9999" y="324.341422" font-size="17.970118" fill="var(--text)" font-family="Arial, sans-serif">• Adversarial training against bias classifiers</text>
  <text x="119.9999" y="349.804997" font-size="17.970118" fill="var(--text)" font-family="Arial, sans-serif">• Fairness constraints in loss function</text>
  <rect x="79.9999" y="386.58542" width="1119.9999" height="120.243844" rx="6.07273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.9999" y="413.463472" font-size="19.467552" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">POST-TRAINING (Output level)</text>
  <text x="119.9999" y="440.341422" font-size="17.970118" fill="var(--text)" font-family="Arial, sans-serif">• RLHF with bias-aware human feedback</text>
  <text x="119.9999" y="465.804894" font-size="17.970118" fill="var(--text)" font-family="Arial, sans-serif">• Constitutional AI with fairness principles</text>
  <text x="119.9999" y="491.268264" font-size="17.970118" fill="var(--text)" font-family="Arial, sans-serif">• Output filtering and reranking</text>
  <rect x="79.9999" y="528.048789" width="1119.9999" height="91.951211" rx="6.07273" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="119.9999" y="554.926842" font-size="19.467552" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">DEPLOYMENT (Application level)</text>
  <text x="119.9999" y="581.804894" font-size="17.970118" fill="var(--text)" font-family="Arial, sans-serif">• Prompt engineering for fairness  •  Output auditing and monitoring</text>
  <text x="119.9999" y="607.268366" font-size="17.970118" fill="var(--text)" font-family="Arial, sans-serif">• User feedback collection  •  Regular bias evaluations</text>
</svg>

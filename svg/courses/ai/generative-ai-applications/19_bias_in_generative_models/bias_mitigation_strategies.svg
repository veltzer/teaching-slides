<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="18.7781" y="14.8837" width="1126.6818" height="625.1163" rx="8.9302" fill="#f5f5f5" stroke="#333" stroke-width="2.9767" />
  <ns0:rect x="18.7781" y="14.8837" width="1126.6818" height="52.093" rx="8.9302" fill="#333" />
  <ns0:text x="582.1189" y="49.1163" text-anchor="middle" font-size="20.8372" fill="#fff" font-weight="bold">BIAS MITIGATION APPROACHES</ns0:text>
  <ns0:rect x="56.3341" y="81.8605" width="1051.5696" height="126.5116" rx="5.9535" fill="#e3f2fd" stroke="#555" stroke-width="2.2325" />
  <ns0:text x="93.8901" y="110.1395" font-size="19.3488" fill="#222" font-weight="bold">PRE-TRAINING (Data level)</ns0:text>
  <ns0:text x="93.8901" y="138.4186" font-size="17.8605" fill="#222">• Balance training data demographics</ns0:text>
  <ns0:text x="93.8901" y="165.2094" font-size="17.8605" fill="#222">• Remove known biased text</ns0:text>
  <ns0:text x="93.8901" y="192" font-size="17.8605" fill="#222">• Augment underrepresented groups</ns0:text>
  <ns0:rect x="56.3341" y="230.6977" width="1051.5696" height="126.5116" rx="5.9535" fill="#e8f5e9" stroke="#555" stroke-width="2.2325" />
  <ns0:text x="93.8901" y="258.9768" font-size="19.3488" fill="#222" font-weight="bold">TRAINING (Model level)</ns0:text>
  <ns0:text x="93.8901" y="287.2559" font-size="17.8605" fill="#222">• Contrastive debiasing objectives</ns0:text>
  <ns0:text x="93.8901" y="314.0465" font-size="17.8605" fill="#222">• Adversarial training against bias classifiers</ns0:text>
  <ns0:text x="93.8901" y="340.8373" font-size="17.8605" fill="#222">• Fairness constraints in loss function</ns0:text>
  <ns0:rect x="56.3341" y="379.5349" width="1051.5696" height="126.5116" rx="5.9535" fill="#fff3e0" stroke="#555" stroke-width="2.2325" />
  <ns0:text x="93.8901" y="407.814" font-size="19.3488" fill="#222" font-weight="bold">POST-TRAINING (Output level)</ns0:text>
  <ns0:text x="93.8901" y="436.093" font-size="17.8605" fill="#222">• RLHF with bias-aware human feedback</ns0:text>
  <ns0:text x="93.8901" y="462.8838" font-size="17.8605" fill="#222">• Constitutional AI with fairness principles</ns0:text>
  <ns0:text x="93.8901" y="489.6744" font-size="17.8605" fill="#222">• Output filtering and reranking</ns0:text>
  <ns0:rect x="56.3341" y="528.3721" width="1051.5696" height="96.7442" rx="5.9535" fill="#f5f5f5" stroke="#555" stroke-width="2.2325" />
  <ns0:text x="93.8901" y="556.6512" font-size="19.3488" fill="#222" font-weight="bold">DEPLOYMENT (Application level)</ns0:text>
  <ns0:text x="93.8901" y="584.9303" font-size="17.8605" fill="#222">• Prompt engineering for fairness  •  Output auditing and monitoring</ns0:text>
  <ns0:text x="93.8901" y="611.721" font-size="17.8605" fill="#222">• User feedback collection  •  Regular bias evaluations</ns0:text>
</ns0:svg>
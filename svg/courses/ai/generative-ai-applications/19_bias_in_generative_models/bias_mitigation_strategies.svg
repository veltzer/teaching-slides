<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="49.512159" rx="6.07273" fill="var(--text)" />
  <text x="639.9999" y="72.536579" text-anchor="middle" font-size="20.965088" fill="var(--bg)" font-weight="bold">BIAS MITIGATION APPROACHES</text>
  <rect x="79.9999" y="103.658578" width="1119.9999" height="120.243844" rx="6.07273" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.9999" y="130.536528" font-size="19.467552" fill="var(--text)" font-weight="bold">PRE-TRAINING (Data level)</text>
  <text x="119.9999" y="157.414683" font-size="17.970118" fill="var(--text)">• Balance training data demographics</text>
  <text x="119.9999" y="182.878155" font-size="17.970118" fill="var(--text)">• Remove known biased text</text>
  <text x="119.9999" y="208.341422" font-size="17.970118" fill="var(--text)">• Augment underrepresented groups</text>
  <rect x="79.9999" y="245.121947" width="1119.9999" height="120.243844" rx="6.07273" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.9999" y="272.000102" font-size="19.467552" fill="var(--text)" font-weight="bold">TRAINING (Model level)</text>
  <text x="119.9999" y="298.878155" font-size="17.970118" fill="var(--text)">• Contrastive debiasing objectives</text>
  <text x="119.9999" y="324.341422" font-size="17.970118" fill="var(--text)">• Adversarial training against bias classifiers</text>
  <text x="119.9999" y="349.804997" font-size="17.970118" fill="var(--text)">• Fairness constraints in loss function</text>
  <rect x="79.9999" y="386.58542" width="1119.9999" height="120.243844" rx="6.07273" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.9999" y="413.463472" font-size="19.467552" fill="var(--text)" font-weight="bold">POST-TRAINING (Output level)</text>
  <text x="119.9999" y="440.341422" font-size="17.970118" fill="var(--text)">• RLHF with bias-aware human feedback</text>
  <text x="119.9999" y="465.804894" font-size="17.970118" fill="var(--text)">• Constitutional AI with fairness principles</text>
  <text x="119.9999" y="491.268264" font-size="17.970118" fill="var(--text)">• Output filtering and reranking</text>
  <rect x="79.9999" y="528.048789" width="1119.9999" height="91.951211" rx="6.07273" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="119.9999" y="554.926842" font-size="19.467552" fill="var(--text)" font-weight="bold">DEPLOYMENT (Application level)</text>
  <text x="119.9999" y="581.804894" font-size="17.970118" fill="var(--text)">• Prompt engineering for fairness  •  Output auditing and monitoring</text>
  <text x="119.9999" y="607.268366" font-size="17.970118" fill="var(--text)">• User feedback collection  •  Regular bias evaluations</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="18.685" y="11.6363" width="1121.0949" height="628.3637" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="18.685" y="11.6363" width="1121.0949" height="40.7273" rx="6" fill="var(--text)" />
  <text x="579.2324" y="38.4" text-anchor="middle" font-size="16.2909" fill="var(--bg)" font-weight="bold">BIAS AUDIT REPORT</text>
  <rect x="56.0548" y="64" width="1046.3552" height="104.7273" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="93.4246" y="86.1091" font-size="15.1273" fill="var(--text)" font-weight="bold">1. SYSTEM DESCRIPTION</text>
  <text x="93.4246" y="108.2182" font-size="13.9637" fill="var(--text)">- Model: [name and version]</text>
  <text x="93.4246" y="129.1637" font-size="13.9637" fill="var(--text)">- Application: [use case]</text>
  <text x="93.4246" y="150.1091" font-size="13.9637" fill="var(--text)">- Affected populations: [demographics]</text>
  <rect x="56.0548" y="183.8546" width="1046.3552" height="104.7273" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="93.4246" y="205.9636" font-size="15.1273" fill="var(--text)" font-weight="bold">2. TESTING METHODOLOGY</text>
  <text x="93.4246" y="228.0727" font-size="13.9637" fill="var(--text)">- Counterfactual testing (N pairs)</text>
  <text x="93.4246" y="249.0182" font-size="13.9637" fill="var(--text)">- Demographic parity measurement</text>
  <text x="93.4246" y="269.9636" font-size="13.9637" fill="var(--text)">- Embedding association tests</text>
  <rect x="56.0548" y="303.7091" width="1046.3552" height="122.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="93.4246" y="325.8182" font-size="15.1273" fill="var(--text)" font-weight="bold">3. FINDINGS</text>
  <text x="93.4246" y="347.9273" font-size="13.9637" fill="var(--text)">- Gender bias: [score and examples]</text>
  <text x="93.4246" y="368.8727" font-size="13.9637" fill="var(--text)">- Racial bias: [score and examples]</text>
  <text x="93.4246" y="389.8182" font-size="13.9637" fill="var(--text)">- Age bias: [score and examples]</text>
  <text x="93.4246" y="410.7636" font-size="13.9637" fill="var(--text)">- Other: [as applicable]</text>
  <rect x="56.0548" y="439.8546" width="1046.3552" height="87.2728" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="93.4246" y="461.9637" font-size="15.1273" fill="var(--text)" font-weight="bold">4. MITIGATION ACTIONS</text>
  <text x="93.4246" y="484.0727" font-size="13.9637" fill="var(--text)">- [Specific steps taken]</text>
  <text x="93.4246" y="505.0182" font-size="13.9637" fill="var(--text)">- [Residual risks]</text>
  <rect x="56.0548" y="541.0909" width="1046.3552" height="69.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="93.4246" y="563.2" font-size="15.1273" fill="var(--text)" font-weight="bold">5. ONGOING MONITORING PLAN</text>
  <text x="93.4246" y="585.3092" font-size="13.9637" fill="var(--text)">- [Frequency and metrics]</text>
</svg>
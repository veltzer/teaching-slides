<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="39.41748" rx="6.143905" fill="var(--text)"/>
  <text x="639.9999" y="65.903011" text-anchor="middle" font-size="16.581171" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">BIAS AUDIT REPORT</text>
  <rect x="80" y="90.679677" width="1120" height="101.359249" rx="6.143905" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.9999" y="112.077725" font-size="15.396831" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">1. SYSTEM DESCRIPTION</text>
  <text x="119.9999" y="133.475774" font-size="14.212491" fill="var(--text)" font-family="Arial, sans-serif">- Model: [name and version]</text>
  <text x="119.9999" y="153.747686" font-size="14.212491" fill="var(--text)" font-family="Arial, sans-serif">- Application: [use case]</text>
  <text x="119.9999" y="174.019494" font-size="14.212491" fill="var(--text)" font-family="Arial, sans-serif">- Affected populations: [demographics]</text>
  <rect x="80" y="206.67974" width="1120" height="101.359249" rx="6.143905" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.9999" y="228.077683" font-size="15.396831" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">2. TESTING METHODOLOGY</text>
  <text x="119.9999" y="249.475732" font-size="14.212491" fill="var(--text)" font-family="Arial, sans-serif">- Counterfactual testing (N pairs)</text>
  <text x="119.9999" y="269.747644" font-size="14.212491" fill="var(--text)" font-family="Arial, sans-serif">- Demographic parity measurement</text>
  <text x="119.9999" y="290.019347" font-size="14.212491" fill="var(--text)" font-family="Arial, sans-serif">- Embedding association tests</text>
  <rect x="80" y="322.679593" width="1120" height="118.252335" rx="6.143905" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.9999" y="344.077641" font-size="15.396831" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">3. FINDINGS</text>
  <text x="119.9999" y="365.475795" font-size="14.212491" fill="var(--text)" font-family="Arial, sans-serif">- Gender bias: [score and examples]</text>
  <text x="119.9999" y="385.747498" font-size="14.212491" fill="var(--text)" font-family="Arial, sans-serif">- Racial bias: [score and examples]</text>
  <text x="119.9999" y="406.01941" font-size="14.212491" fill="var(--text)" font-family="Arial, sans-serif">- Age bias: [score and examples]</text>
  <text x="119.9999" y="426.291218" font-size="14.212491" fill="var(--text)" font-family="Arial, sans-serif">- Other: [as applicable]</text>
  <rect x="80" y="454.446606" width="1120" height="84.466058" rx="6.143905" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="119.9999" y="475.844654" font-size="15.396831" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">4. MITIGATION ACTIONS</text>
  <text x="119.9999" y="497.242703" font-size="14.212491" fill="var(--text)" font-family="Arial, sans-serif">- [Specific steps taken]</text>
  <text x="119.9999" y="517.514511" font-size="14.212491" fill="var(--text)" font-family="Arial, sans-serif">- [Residual risks]</text>
  <rect x="80" y="552.427133" width="1120" height="67.572867" rx="6.143905" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.9999" y="573.825181" font-size="15.396831" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">5. ONGOING MONITORING PLAN</text>
  <text x="119.9999" y="595.223334" font-size="14.212491" fill="var(--text)" font-family="Arial, sans-serif">- [Frequency and metrics]</text>
</svg>

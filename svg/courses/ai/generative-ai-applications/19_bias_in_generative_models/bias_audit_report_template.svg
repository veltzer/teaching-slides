<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="39.41748" rx="6.143905" fill="var(--text)" />
  <text x="639.9999" y="65.903011" text-anchor="middle" font-size="16.581171" fill="var(--bg)" font-weight="bold">BIAS AUDIT REPORT</text>
  <rect x="80" y="90.679677" width="1120" height="101.359249" rx="6.143905" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.9999" y="112.077725" font-size="15.396831" fill="var(--text)" font-weight="bold">1. SYSTEM DESCRIPTION</text>
  <text x="119.9999" y="133.475774" font-size="14.212491" fill="var(--text)">- Model: [name and version]</text>
  <text x="119.9999" y="153.747686" font-size="14.212491" fill="var(--text)">- Application: [use case]</text>
  <text x="119.9999" y="174.019494" font-size="14.212491" fill="var(--text)">- Affected populations: [demographics]</text>
  <rect x="80" y="206.67974" width="1120" height="101.359249" rx="6.143905" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.9999" y="228.077683" font-size="15.396831" fill="var(--text)" font-weight="bold">2. TESTING METHODOLOGY</text>
  <text x="119.9999" y="249.475732" font-size="14.212491" fill="var(--text)">- Counterfactual testing (N pairs)</text>
  <text x="119.9999" y="269.747644" font-size="14.212491" fill="var(--text)">- Demographic parity measurement</text>
  <text x="119.9999" y="290.019347" font-size="14.212491" fill="var(--text)">- Embedding association tests</text>
  <rect x="80" y="322.679593" width="1120" height="118.252335" rx="6.143905" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.9999" y="344.077641" font-size="15.396831" fill="var(--text)" font-weight="bold">3. FINDINGS</text>
  <text x="119.9999" y="365.475795" font-size="14.212491" fill="var(--text)">- Gender bias: [score and examples]</text>
  <text x="119.9999" y="385.747498" font-size="14.212491" fill="var(--text)">- Racial bias: [score and examples]</text>
  <text x="119.9999" y="406.01941" font-size="14.212491" fill="var(--text)">- Age bias: [score and examples]</text>
  <text x="119.9999" y="426.291218" font-size="14.212491" fill="var(--text)">- Other: [as applicable]</text>
  <rect x="80" y="454.446606" width="1120" height="84.466058" rx="6.143905" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="119.9999" y="475.844654" font-size="15.396831" fill="var(--text)" font-weight="bold">4. MITIGATION ACTIONS</text>
  <text x="119.9999" y="497.242703" font-size="14.212491" fill="var(--text)">- [Specific steps taken]</text>
  <text x="119.9999" y="517.514511" font-size="14.212491" fill="var(--text)">- [Residual risks]</text>
  <rect x="80" y="552.427133" width="1120" height="67.572867" rx="6.143905" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="119.9999" y="573.825181" font-size="15.396831" fill="var(--text)" font-weight="bold">5. ONGOING MONITORING PLAN</text>
  <text x="119.9999" y="595.223334" font-size="14.212491" fill="var(--text)">- [Frequency and metrics]</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect x="40" y="40" width="1200" height="112.403100833138" rx="6.361219598497" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
<text x="80" y="90.581395268129" font-family="Arial, sans-serif" font-size="27.565285271273" font-weight="bold" fill="var(--primary-text)">1. API fundamentals</text>
<text x="80" y="129.922481307208" font-family="Arial, sans-serif" font-size="21.204065672776" fill="var(--primary-text)">auth, rate limits, streaming</text>
<rect x="40" y="156.899224524758" width="1200" height="112.403100833138" rx="6.361219598497" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
<text x="80" y="207.480620860717" font-family="Arial, sans-serif" font-size="27.565285271273" font-weight="bold" fill="var(--ok-text)">2. Prompt engineering</text>
<text x="80" y="246.821705831966" font-family="Arial, sans-serif" font-size="21.204065672776" fill="var(--ok-text)">system, user, roles, examples</text>
<rect x="40" y="273.798450117346" width="1200" height="112.403100833138" rx="6.361219598497" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
<text x="80" y="324.379845385475" font-family="Arial, sans-serif" font-size="27.565285271273" font-weight="bold" fill="var(--warn-text)">3. Few-shot and zero-shot</text>
<text x="80" y="363.720930356724" font-family="Arial, sans-serif" font-size="21.204065672776" fill="var(--warn-text)">in-context learning patterns</text>
<rect x="40" y="390.697674642104" width="1200" height="112.403100833138" rx="6.361219598497" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
<text x="80" y="441.279069910233" font-family="Arial, sans-serif" font-size="27.565285271273" font-weight="bold" fill="var(--info-text)">4. Chain-of-thought</text>
<text x="80" y="480.620154881482" font-family="Arial, sans-serif" font-size="21.204065672776" fill="var(--info-text)">reasoning step by step</text>
<rect x="40" y="507.596899166862" width="1200" height="112.403100833138" rx="6.361219598497" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
<text x="80" y="558.178294434991" font-family="Arial, sans-serif" font-size="27.565285271273" font-weight="bold" fill="var(--danger-text)">5. Fine-tuning</text>
<text x="80" y="597.519379406241" font-family="Arial, sans-serif" font-size="21.204065672776" fill="var(--danger-text)">custom tasks and domains</text>
</svg>

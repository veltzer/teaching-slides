<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">API Best Practices Checklist</text>
  <!-- Reliability -->
  <rect x="40" y="50" width="340" height="170" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="210" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">RELIABILITY</text>
  <text x="70" y="100" font-size="11" fill="#333">&#x2610; Exponential backoff for retries</text>
  <text x="70" y="122" font-size="11" fill="#333">&#x2610; Set appropriate timeouts</text>
  <text x="70" y="144" font-size="11" fill="#333">&#x2610; Handle all error types gracefully</text>
  <text x="70" y="166" font-size="11" fill="#333">&#x2610; Idempotency keys for critical ops</text>
  <!-- Cost -->
  <rect x="420" y="50" width="340" height="170" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="590" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">COST</text>
  <text x="450" y="100" font-size="11" fill="#333">&#x2610; Right model for each task</text>
  <text x="450" y="122" font-size="11" fill="#333">&#x2610; Set max_tokens limits</text>
  <text x="450" y="144" font-size="11" fill="#333">&#x2610; Cache deterministic responses</text>
  <text x="450" y="166" font-size="11" fill="#333">&#x2610; Batch API for non-urgent work</text>
  <text x="450" y="188" font-size="11" fill="#333">&#x2610; Monitor usage with middleware</text>
  <!-- Security -->
  <rect x="40" y="240" width="340" height="170" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="210" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">SECURITY</text>
  <text x="70" y="290" font-size="11" fill="#333">&#x2610; Never expose API keys in client code</text>
  <text x="70" y="312" font-size="11" fill="#333">&#x2610; Validate and sanitize all inputs</text>
  <text x="70" y="334" font-size="11" fill="#333">&#x2610; Use moderation API</text>
  <text x="70" y="356" font-size="11" fill="#333">&#x2610; Rate limiting per user</text>
  <!-- Quality -->
  <rect x="420" y="240" width="340" height="170" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="590" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">QUALITY</text>
  <text x="450" y="290" font-size="11" fill="#333">&#x2610; Structured outputs for extraction</text>
  <text x="450" y="312" font-size="11" fill="#333">&#x2610; Validate outputs before using</text>
  <text x="450" y="334" font-size="11" fill="#333">&#x2610; Log inputs/outputs for debugging</text>
  <text x="450" y="356" font-size="11" fill="#333">&#x2610; A/B test prompt changes</text>
</svg>
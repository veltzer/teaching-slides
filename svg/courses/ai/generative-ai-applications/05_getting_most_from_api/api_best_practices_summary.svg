<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="638.2655" y="46.8292" text-anchor="middle" font-size="24.9756" font-weight="bold" fill="var(--text)">API Best Practices Checklist</text>
  <rect x="63.8266" y="78.0488" width="542.5257" height="265.3659" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="335.0894" y="117.0732" text-anchor="middle" font-size="21.8536" font-weight="bold" fill="var(--primary-accent)">RELIABILITY</text>
  <text x="111.6965" y="156.0975" font-size="17.1707" fill="var(--text)">☐ Exponential backoff for retries</text>
  <text x="111.6965" y="190.439" font-size="17.1707" fill="var(--text)">☐ Set appropriate timeouts</text>
  <text x="111.6965" y="224.7805" font-size="17.1707" fill="var(--text)">☐ Handle all error types gracefully</text>
  <text x="111.6965" y="259.1219" font-size="17.1707" fill="var(--text)">☐ Idempotency keys for critical ops</text>
  <rect x="670.1788" y="78.0488" width="542.5257" height="265.3659" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="941.4416" y="117.0732" text-anchor="middle" font-size="21.8536" font-weight="bold" fill="var(--ok-accent)">COST</text>
  <text x="718.0487" y="156.0975" font-size="17.1707" fill="var(--text)">☐ Right model for each task</text>
  <text x="718.0487" y="190.439" font-size="17.1707" fill="var(--text)">☐ Set max_tokens limits</text>
  <text x="718.0487" y="224.7805" font-size="17.1707" fill="var(--text)">☐ Cache deterministic responses</text>
  <text x="718.0487" y="259.1219" font-size="17.1707" fill="var(--text)">☐ Batch API for non-urgent work</text>
  <text x="718.0487" y="293.4634" font-size="17.1707" fill="var(--text)">☐ Monitor usage with middleware</text>
  <rect x="63.8266" y="374.6341" width="542.5257" height="265.3659" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="335.0894" y="413.6585" text-anchor="middle" font-size="21.8536" font-weight="bold" fill="var(--danger-accent)">SECURITY</text>
  <text x="111.6965" y="452.6828" font-size="17.1707" fill="var(--text)">☐ Never expose API keys in client code</text>
  <text x="111.6965" y="487.0243" font-size="17.1707" fill="var(--text)">☐ Validate and sanitize all inputs</text>
  <text x="111.6965" y="521.3658" font-size="17.1707" fill="var(--text)">☐ Use moderation API</text>
  <text x="111.6965" y="555.7073" font-size="17.1707" fill="var(--text)">☐ Rate limiting per user</text>
  <rect x="670.1788" y="374.6341" width="542.5257" height="265.3659" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="941.4416" y="413.6585" text-anchor="middle" font-size="21.8536" font-weight="bold" fill="var(--danger-accent)">QUALITY</text>
  <text x="718.0487" y="452.6828" font-size="17.1707" fill="var(--text)">☐ Structured outputs for extraction</text>
  <text x="718.0487" y="487.0243" font-size="17.1707" fill="var(--text)">☐ Validate outputs before using</text>
  <text x="718.0487" y="521.3658" font-size="17.1707" fill="var(--text)">☐ Log inputs/outputs for debugging</text>
  <text x="718.0487" y="555.7073" font-size="17.1707" fill="var(--text)">☐ A/B test prompt changes</text>
</svg>
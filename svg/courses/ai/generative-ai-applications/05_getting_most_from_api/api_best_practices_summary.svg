<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="638.2655" y="46.8292" text-anchor="middle" font-size="24.9756" font-weight="bold" fill="#333">API Best Practices Checklist</ns0:text>
  <ns0:rect x="63.8266" y="78.0488" width="542.5257" height="265.3659" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1219" />
  <ns0:text x="335.0894" y="117.0732" text-anchor="middle" font-size="21.8536" font-weight="bold" fill="#4a90e2">RELIABILITY</ns0:text>
  <ns0:text x="111.6965" y="156.0975" font-size="17.1707" fill="#333">☐ Exponential backoff for retries</ns0:text>
  <ns0:text x="111.6965" y="190.439" font-size="17.1707" fill="#333">☐ Set appropriate timeouts</ns0:text>
  <ns0:text x="111.6965" y="224.7805" font-size="17.1707" fill="#333">☐ Handle all error types gracefully</ns0:text>
  <ns0:text x="111.6965" y="259.1219" font-size="17.1707" fill="#333">☐ Idempotency keys for critical ops</ns0:text>
  <ns0:rect x="670.1788" y="78.0488" width="542.5257" height="265.3659" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="3.1219" />
  <ns0:text x="941.4416" y="117.0732" text-anchor="middle" font-size="21.8536" font-weight="bold" fill="#28a745">COST</ns0:text>
  <ns0:text x="718.0487" y="156.0975" font-size="17.1707" fill="#333">☐ Right model for each task</ns0:text>
  <ns0:text x="718.0487" y="190.439" font-size="17.1707" fill="#333">☐ Set max_tokens limits</ns0:text>
  <ns0:text x="718.0487" y="224.7805" font-size="17.1707" fill="#333">☐ Cache deterministic responses</ns0:text>
  <ns0:text x="718.0487" y="259.1219" font-size="17.1707" fill="#333">☐ Batch API for non-urgent work</ns0:text>
  <ns0:text x="718.0487" y="293.4634" font-size="17.1707" fill="#333">☐ Monitor usage with middleware</ns0:text>
  <ns0:rect x="63.8266" y="374.6341" width="542.5257" height="265.3659" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="3.1219" />
  <ns0:text x="335.0894" y="413.6585" text-anchor="middle" font-size="21.8536" font-weight="bold" fill="#dc3545">SECURITY</ns0:text>
  <ns0:text x="111.6965" y="452.6828" font-size="17.1707" fill="#333">☐ Never expose API keys in client code</ns0:text>
  <ns0:text x="111.6965" y="487.0243" font-size="17.1707" fill="#333">☐ Validate and sanitize all inputs</ns0:text>
  <ns0:text x="111.6965" y="521.3658" font-size="17.1707" fill="#333">☐ Use moderation API</ns0:text>
  <ns0:text x="111.6965" y="555.7073" font-size="17.1707" fill="#333">☐ Rate limiting per user</ns0:text>
  <ns0:rect x="670.1788" y="374.6341" width="542.5257" height="265.3659" rx="7.8049" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1219" />
  <ns0:text x="941.4416" y="413.6585" text-anchor="middle" font-size="21.8536" font-weight="bold" fill="#bf360c">QUALITY</ns0:text>
  <ns0:text x="718.0487" y="452.6828" font-size="17.1707" fill="#333">☐ Structured outputs for extraction</ns0:text>
  <ns0:text x="718.0487" y="487.0243" font-size="17.1707" fill="#333">☐ Validate outputs before using</ns0:text>
  <ns0:text x="718.0487" y="521.3658" font-size="17.1707" fill="#333">☐ Log inputs/outputs for debugging</ns0:text>
  <ns0:text x="718.0487" y="555.7073" font-size="17.1707" fill="#333">☐ A/B test prompt changes</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="25.2403" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">API Best Practices Checklist</text>
  <rect x="40" y="70.5264" width="566.6667" height="259.4737" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="108.6843" text-anchor="middle" font-size="22.0852" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">RELIABILITY</text>
  <text x="90" y="146.8421" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Exponential backoff for retries</text>
  <text x="90" y="180.4211" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Set appropriate timeouts</text>
  <text x="90" y="214.0001" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Handle all error types gracefully</text>
  <text x="90" y="247.5789" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Idempotency keys for critical ops</text>
  <rect x="673.3333" y="70.5264" width="566.6667" height="259.4737" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="108.6843" text-anchor="middle" font-size="22.0852" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">COST</text>
  <text x="723.3333" y="146.8421" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Right model for each task</text>
  <text x="723.3333" y="180.4211" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Set max_tokens limits</text>
  <text x="723.3333" y="214.0001" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Cache deterministic responses</text>
  <text x="723.3333" y="247.5789" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Batch API for non-urgent work</text>
  <text x="723.3333" y="281.1579" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Monitor usage with middleware</text>
  <rect x="40" y="360.5263" width="566.6667" height="259.4737" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="398.6842" text-anchor="middle" font-size="22.0852" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">SECURITY</text>
  <text x="90" y="436.842" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Never expose API keys in client code</text>
  <text x="90" y="470.421" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Validate and sanitize all inputs</text>
  <text x="90" y="504" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Use moderation API</text>
  <text x="90" y="537.5789" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Rate limiting per user</text>
  <rect x="673.3333" y="360.5263" width="566.6667" height="259.4737" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="398.6842" text-anchor="middle" font-size="22.0852" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">QUALITY</text>
  <text x="723.3333" y="436.842" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Structured outputs for extraction</text>
  <text x="723.3333" y="470.421" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Validate outputs before using</text>
  <text x="723.3333" y="504" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ Log inputs/outputs for debugging</text>
  <text x="723.3333" y="537.5789" font-size="17.3526" fill="var(--text)" font-family="Arial, sans-serif">☐ A/B test prompt changes</text>
</svg>
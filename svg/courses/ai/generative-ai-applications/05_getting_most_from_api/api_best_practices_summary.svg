<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="46.9565" text-anchor="middle" font-size="25.0435" font-weight="bold" fill="#333">API Best Practices Checklist</text>
  <rect x="64" y="78.2609" width="544" height="266.087" rx="7.8261" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1304" />
  <text x="336" y="117.3913" text-anchor="middle" font-size="21.913" font-weight="bold" fill="#4a90e2">RELIABILITY</text>
  <text x="112" y="156.5217" font-size="17.2174" fill="#333">☐ Exponential backoff for retries</text>
  <text x="112" y="190.9565" font-size="17.2174" fill="#333">☐ Set appropriate timeouts</text>
  <text x="112" y="225.3913" font-size="17.2174" fill="#333">☐ Handle all error types gracefully</text>
  <text x="112" y="259.8261" font-size="17.2174" fill="#333">☐ Idempotency keys for critical ops</text>
  <rect x="672" y="78.2609" width="544" height="266.087" rx="7.8261" fill="#d4edda" stroke="#28a745" stroke-width="3.1304" />
  <text x="944" y="117.3913" text-anchor="middle" font-size="21.913" font-weight="bold" fill="#28a745">COST</text>
  <text x="720" y="156.5217" font-size="17.2174" fill="#333">☐ Right model for each task</text>
  <text x="720" y="190.9565" font-size="17.2174" fill="#333">☐ Set max_tokens limits</text>
  <text x="720" y="225.3913" font-size="17.2174" fill="#333">☐ Cache deterministic responses</text>
  <text x="720" y="259.8261" font-size="17.2174" fill="#333">☐ Batch API for non-urgent work</text>
  <text x="720" y="294.2609" font-size="17.2174" fill="#333">☐ Monitor usage with middleware</text>
  <rect x="64" y="375.6522" width="544" height="266.087" rx="7.8261" fill="#f8d7da" stroke="#dc3545" stroke-width="3.1304" />
  <text x="336" y="414.7826" text-anchor="middle" font-size="21.913" font-weight="bold" fill="#dc3545">SECURITY</text>
  <text x="112" y="453.913" font-size="17.2174" fill="#333">☐ Never expose API keys in client code</text>
  <text x="112" y="488.3478" font-size="17.2174" fill="#333">☐ Validate and sanitize all inputs</text>
  <text x="112" y="522.7826" font-size="17.2174" fill="#333">☐ Use moderation API</text>
  <text x="112" y="557.2174" font-size="17.2174" fill="#333">☐ Rate limiting per user</text>
  <rect x="672" y="375.6522" width="544" height="266.087" rx="7.8261" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1304" />
  <text x="944" y="414.7826" text-anchor="middle" font-size="21.913" font-weight="bold" fill="#856404">QUALITY</text>
  <text x="720" y="453.913" font-size="17.2174" fill="#333">☐ Structured outputs for extraction</text>
  <text x="720" y="488.3478" font-size="17.2174" fill="#333">☐ Validate outputs before using</text>
  <text x="720" y="522.7826" font-size="17.2174" fill="#333">☐ Log inputs/outputs for debugging</text>
  <text x="720" y="557.2174" font-size="17.2174" fill="#333">☐ A/B test prompt changes</text>
</svg>
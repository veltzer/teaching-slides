<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
  </defs>
<text x="640" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--text)">Day 2: APIs of Generative Models - Roadmap</text>
<rect x="40" y="100" width="1200" height="100" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
<text x="80" y="145" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--primary-text)">1. API fundamentals</text>
<text x="80" y="180" font-family="Arial, sans-serif" font-size="20" fill="var(--primary-text)">auth, rate limits, streaming</text>
<rect x="40" y="204" width="1200" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
<text x="80" y="249" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--ok-text)">2. Prompt engineering</text>
<text x="80" y="284" font-family="Arial, sans-serif" font-size="20" fill="var(--ok-text)">system, user, roles, examples</text>
<rect x="40" y="308" width="1200" height="100" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
<text x="80" y="353" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--warn-text)">3. Few-shot and zero-shot</text>
<text x="80" y="388" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">in-context learning patterns</text>
<rect x="40" y="412" width="1200" height="100" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
<text x="80" y="457" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--info-text)">4. Chain-of-thought</text>
<text x="80" y="492" font-family="Arial, sans-serif" font-size="20" fill="var(--info-text)">reasoning step by step</text>
<rect x="40" y="516" width="1200" height="100" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
<text x="80" y="561" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--danger-text)">5. Fine-tuning</text>
<text x="80" y="596" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-text)">custom tasks and domains</text>
</svg>

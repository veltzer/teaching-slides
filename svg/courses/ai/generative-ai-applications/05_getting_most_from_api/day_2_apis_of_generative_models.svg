<text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.675437" font-weight="bold" fill="var(--text)">Day 2: APIs of Generative Models - Roadmap</text>
<rect x="40" y="76.842105" width="1200" height="105.263158" rx="6.15587" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>

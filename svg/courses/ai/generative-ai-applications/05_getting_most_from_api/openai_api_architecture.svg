<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="72.222222222222" width="203.389830508475" height="150.37037037037" rx="8.360971118323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="141.694915254237" y="109.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.767063626436" font-weight="bold" fill="var(--primary-text)">Your App</text>
  <text x="141.694915254237" y="152.777777777777" text-anchor="middle" font-family="Courier New, monospace" font-size="13.586578067275" fill="var(--primary-text)">OpenAI()</text>
  <text x="141.694915254237" y="179.62962962963" text-anchor="middle" font-family="Courier New, monospace" font-size="13.586578067275" fill="var(--primary-text)">.chat.completions</text>
  <text x="141.694915254237" y="206.481481481482" text-anchor="middle" font-family="Courier New, monospace" font-size="13.586578067275" fill="var(--primary-text)">.create()</text>

  <line x1="243.389830508475" y1="147.407407407407" x2="304.406779661017" y2="147.407407407407" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="273.898305084746" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677485" fill="var(--text-muted)">HTTPS</text>

  <rect x="314.576271186441" y="56.11111111111" width="259.322033898305" height="182.592592592593" rx="8.360971118323" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="443.728813559322" y="93.703703703703" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.767063626436" font-weight="bold" fill="var(--warn-text)">Request</text>
  <text x="329.830508474576" y="131.296296296296" font-family="Courier New, monospace" font-size="12.541456677485" fill="var(--warn-text)">POST /v1/chat/completions</text>
  <text x="329.830508474576" y="158.148148148148" font-family="Courier New, monospace" font-size="12.541456677485" fill="var(--warn-text)">Bearer sk-...</text>
  <text x="329.830508474576" y="185" font-family="Courier New, monospace" font-size="12.541456677485" fill="var(--warn-text)">model, messages</text>
  <text x="329.830508474576" y="211.851851851852" font-family="Courier New, monospace" font-size="12.541456677485" fill="var(--warn-text)">temperature, max_tokens</text>

  <line x1="573.898305084746" y1="147.407407407407" x2="634.915254237288" y2="147.407407407407" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="40" width="233.898305084746" height="214.814814814815" rx="8.360971118323" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.949152542373" y="77.592592592592" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.767063626436" font-weight="bold" fill="var(--ok-text)">GPT-4o Model</text>
  <text x="756.949152542373" y="115.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--ok-text)">Tokenize</text>
  <text x="756.949152542373" y="147.407407407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--ok-text)">Forward pass</text>
  <text x="756.949152542373" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--ok-text)">Sample tokens</text>
  <text x="756.949152542373" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--ok-text)">Decode output</text>

  <line x1="873.898305084746" y1="147.407407407407" x2="934.915254237288" y2="147.407407407407" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="904.406779661017" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.541456677485" fill="var(--text-muted)">JSON</text>

  <rect x="940" y="56.11111111111" width="300" height="204.074074074075" rx="8.360971118323" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1089.491525423729" y="93.703703703703" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.767063626436" font-weight="bold" fill="var(--danger-text)">Response</text>
  <text x="955.254237288136" y="131.296296296296" font-family="Courier New, monospace" font-size="12.541456677485" fill="var(--danger-text)">choices[0].message</text>
  <text x="955.254237288136" y="158.148148148148" font-family="Courier New, monospace" font-size="12.541456677485" fill="var(--danger-text)">finish_reason</text>
  <text x="955.254237288136" y="185" font-family="Courier New, monospace" font-size="12.541456677485" fill="var(--danger-text)">usage.total_tokens</text>
  <text x="955.254237288136" y="211.851851851852" font-family="Courier New, monospace" font-size="12.541456677485" fill="var(--danger-text)">model, id</text>
  <text x="955.254237288136" y="244.074074074074" font-family="Arial, sans-serif" font-size="12.541456677485" fill="var(--danger-text)">Billed per token</text>

  <rect x="40" y="303.148148148148" width="589.830508474576" height="316.851851851852" rx="8.360971118323" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="334.915254237288" y="340.74074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--text)">Key Parameters</text>
  <text x="65.423728813559" y="383.703703703703" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--text)">model: which version</text>
  <text x="65.423728813559" y="421.296296296297" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--text)">messages: role/content list</text>
  <text x="65.423728813559" y="458.888888888889" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--text)">temperature: 0 to 2</text>
  <text x="65.423728813559" y="496.481481481482" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--text)">max_tokens: output cap</text>
  <text x="65.423728813559" y="534.074074074074" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--text)">stream: incremental output</text>
  <text x="65.423728813559" y="571.666666666667" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--text)">tools: function calling</text>

  <rect x="650.169491525424" y="303.148148148148" width="589.830508474576" height="316.851851851852" rx="8.360971118323" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="945.084745762712" y="340.74074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--text)">Message Roles</text>
  <text x="675.593220338983" y="383.703703703703" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--text)">system: persona</text>
  <text x="675.593220338983" y="426.666666666667" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--text)">user: human input</text>
  <text x="675.593220338983" y="469.62962962963" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--text)">assistant: prior replies</text>
  <text x="675.593220338983" y="512.592592592593" font-family="Arial, sans-serif" font-size="14.631699457065" fill="var(--text)">tool: function results</text>
</svg>

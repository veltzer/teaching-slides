<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="87.346897" width="200" height="153.877635" rx="7.511623" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="87.346897" width="200" height="42.612237" rx="7.511623" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="115.755005" width="200" height="14.204128" fill="url(#grad-primary)" rx="7.511623" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="115.755005" font-size="17.407435" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Your App</text>
  <text x="140" y="154.816173" font-size="13.055701" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">client = OpenAI()</text>
  <text x="140" y="176.122292" font-size="13.055701" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">client.chat.</text>
  <text x="140" y="197.42841" font-size="13.055701" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">completions.create()</text>
  <line x1="240" y1="164.285788" x2="310" y2="164.285788" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="274.999893" y="152.44899" font-size="12.519372" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">HTTP POST</text>
  <rect x="310" y="63.673448" width="229.999893" height="207.142931" rx="7.511623" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="310" y="63.673448" width="229.999893" height="42.612237" rx="7.511623" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="310" y="92.081557" width="229.999893" height="14.204128" fill="url(#grad-warn)" rx="7.511623" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="92.081557" font-size="16.319502" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">HTTP Request</text>
  <text x="319.999893" y="128.775542" font-size="12.519372" fill="var(--text-muted)" font-family="Courier New, monospace">POST /v1/chat/completions</text>
  <text x="319.999893" y="150.08166" font-size="12.519372" fill="var(--text-muted)" font-family="Courier New, monospace">Authorization: Bearer sk-...</text>
  <text x="319.999893" y="171.387778" font-size="12.519372" fill="var(--primary-accent)" font-family="Courier New, monospace">model: "gpt-4o"</text>
  <text x="319.999893" y="192.693896" font-size="12.519372" fill="var(--primary-accent)" font-family="Courier New, monospace">messages: [...]</text>
  <text x="319.999893" y="214.000015" font-size="12.519372" fill="var(--danger-accent)" font-family="Courier New, monospace">temperature: 0.7</text>
  <text x="319.999893" y="235.306133" font-size="12.519372" fill="var(--danger-accent)" font-family="Courier New, monospace">max_tokens: 300</text>
  <line x1="540" y1="164.285788" x2="610" y2="164.285788" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="575" y="152.44899" font-size="12.519372" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">TLS</text>
  <rect x="610" y="51.836651" width="220" height="236.734631" rx="7.511623" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="610" y="51.836651" width="220" height="42.612237" rx="7.511623" fill="var(--ok-accent)" />
  <rect x="610" y="80.244759" width="220" height="14.204128" fill="var(--ok-accent)" rx="7.511623"/>
  <text x="720" y="80.244759" font-size="16.319502" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">GPT-4o Model</text>
  <text x="720" y="120.489813" font-size="14.143635" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Tokenize input</text>
  <line x1="640" y1="129.959133" x2="810" y2="129.959133" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="720" y="152.44899" font-size="14.143635" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Forward pass</text>
  <line x1="640" y1="161.918311" x2="810" y2="161.918311" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="720" y="185.591906" font-size="14.143635" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Sample tokens</text>
  <line x1="640" y1="195.061227" x2="810" y2="195.061227" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="720" y="218.734528" font-size="14.143635" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Decode output</text>
  <line x1="640" y1="227.020404" x2="810" y2="227.020404" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="720" y="267.26531" font-size="14.143635" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">temperature controls</text>
  <text x="720" y="286.203951" font-size="13.055701" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">randomness of sampling</text>
  <line x1="830" y1="164.285788" x2="910" y2="164.285788" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="869.999893" y="152.44899" font-size="12.519372" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">JSON</text>
  <rect x="910" y="40" width="330" height="272.24473" rx="7.511623" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="910" y="40" width="330" height="42.612237" rx="7.511623" fill="var(--danger-accent)" />
  <rect x="910" y="68.408256" width="330" height="14.204128" fill="var(--danger-accent)" rx="7.511623"/>
  <text x="1075" y="68.408256" font-size="16.319502" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">HTTP Response</text>
  <text x="920" y="105.101946" font-size="12.519372" fill="var(--text-muted)" font-family="Courier New, monospace">choices[0].message.content</text>
  <text x="920" y="126.408065" font-size="12.519372" fill="var(--text-muted)" font-family="Courier New, monospace">choices[0].finish_reason</text>
  <text x="920" y="147.714183" font-size="12.519372" fill="var(--primary-accent)" font-family="Courier New, monospace">usage.prompt_tokens</text>
  <text x="920" y="169.020301" font-size="12.519372" fill="var(--primary-accent)" font-family="Courier New, monospace">usage.completion_tokens</text>
  <text x="920" y="190.326419" font-size="12.519372" fill="var(--danger-accent)" font-family="Courier New, monospace">usage.total_tokens</text>
  <text x="920" y="211.632538" font-size="12.519372" fill="var(--text-muted)" font-family="Courier New, monospace">model  (actual version)</text>
  <text x="920" y="232.938656" font-size="12.519372" fill="var(--text-muted)" font-family="Courier New, monospace">id     (request UUID)</text>
  <text x="920" y="274.367301" font-size="12.519372" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Billed per token used</text>
  <text x="1075" y="298.040749" font-size="12.519372" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">finish_reason: stop | length | content_filter</text>
  <rect x="40" y="430.612266" width="560" height="189.387734" rx="7.511623" fill="var(--surface)" />
  <text x="319.999893" y="461.387705" font-size="16.319502" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Key Parameters</text>
  <rect x="60" y="475.591686" width="12" height="14.204128" rx="7.511623" fill="var(--primary-accent)" />
  <text x="80" y="488.612075" font-size="14.143635" fill="var(--text)" font-family="Arial, sans-serif">model — which model to use (gpt-4o, gpt-4o-mini, ...)</text>
  <rect x="60" y="503.999941" width="12" height="14.204128" rx="7.511623" fill="var(--primary-accent)" />
  <text x="80" y="517.020184" font-size="14.143635" fill="var(--text)" font-family="Arial, sans-serif">messages — list of {role, content} objects</text>
  <rect x="60" y="532.40805" width="12" height="14.204128" rx="7.511623" fill="var(--danger-accent)" />
  <text x="80" y="545.428439" font-size="14.143635" fill="var(--text)" font-family="Arial, sans-serif">temperature — 0 (deterministic) to 2 (creative)</text>
  <rect x="60" y="560.816159" width="12" height="14.204128" rx="7.511623" fill="var(--danger-accent)" />
  <text x="80" y="573.836548" font-size="14.143635" fill="var(--text)" font-family="Arial, sans-serif">max_tokens — cap on output tokens (cost control)</text>
  <rect x="60" y="589.224414" width="12" height="14.204128" rx="7.511623" fill="var(--text-muted)" />
  <text x="80" y="602.244657" font-size="14.143635" fill="var(--text)" font-family="Arial, sans-serif">stream — return tokens incrementally (true/false)</text>
  <rect x="640" y="430.612266" width="600" height="189.387734" rx="7.511623" fill="var(--surface)" />
  <text x="940" y="461.387705" font-size="16.319502" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Message Roles</text>
  <rect x="660" y="475.591686" width="12" height="14.204128" rx="7.511623" fill="var(--ok-accent)" />
  <text x="679.999893" y="488.612075" font-size="14.143635" fill="var(--text)" font-family="Arial, sans-serif">system — persona and instructions for the model</text>
  <rect x="660" y="503.999941" width="12" height="14.204128" rx="7.511623" fill="var(--primary-accent)" />
  <text x="679.999893" y="517.020184" font-size="14.143635" fill="var(--text)" font-family="Arial, sans-serif">user — the human turn input</text>
  <rect x="660" y="532.40805" width="12" height="14.204128" rx="7.511623" fill="var(--danger-accent)" />
  <text x="679.999893" y="545.428439" font-size="14.143635" fill="var(--text)" font-family="Arial, sans-serif">assistant — previous model replies (multi-turn)</text>
  <rect x="660" y="560.816159" width="12" height="14.204128" rx="7.511623" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="679.999893" y="573.836548" font-size="14.143635" fill="var(--text)" font-family="Arial, sans-serif">tool — results of function calls</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Your App box -->
  <rect x="40" y="200" width="200" height="130" rx="10" fill="url(#grad-surface)" filter="url(#shadow)" stroke="#1e88e5" stroke-width="2"/>
  <rect x="40" y="200" width="200" height="36" rx="10" fill="url(#grad-accent)"/>
  <rect x="40" y="224" width="200" height="12" fill="url(#grad-accent)"/>
  <text x="140" y="224" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Your App</text>
  <text x="140" y="257" font-family="monospace" font-size="12" fill="#333" text-anchor="middle">client = OpenAI()</text>
  <text x="140" y="275" font-family="monospace" font-size="12" fill="#333" text-anchor="middle">client.chat.</text>
  <text x="140" y="293" font-family="monospace" font-size="12" fill="#333" text-anchor="middle">completions.create()</text>

  <!-- Arrow 1: App to HTTP -->
  <line x1="240" y1="265" x2="310" y2="265" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="255" font-family="Arial,sans-serif" font-size="11" fill="#555" text-anchor="middle">HTTP POST</text>

  <!-- HTTP Request box -->
  <rect x="310" y="180" width="230" height="175" rx="10" fill="#fff8e1" filter="url(#shadow)" stroke="#f9a825" stroke-width="2"/>
  <rect x="310" y="180" width="230" height="36" rx="10" fill="#f9a825"/>
  <rect x="310" y="204" width="230" height="12" fill="#f9a825"/>
  <text x="425" y="204" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">HTTP Request</text>
  <text x="320" y="235" font-family="monospace" font-size="11" fill="#555">POST /v1/chat/completions</text>
  <text x="320" y="253" font-family="monospace" font-size="11" fill="#555">Authorization: Bearer sk-...</text>
  <text x="320" y="271" font-family="monospace" font-size="11" fill="#1565c0">model: "gpt-4o"</text>
  <text x="320" y="289" font-family="monospace" font-size="11" fill="#1565c0">messages: [...]</text>
  <text x="320" y="307" font-family="monospace" font-size="11" fill="#c62828">temperature: 0.7</text>
  <text x="320" y="325" font-family="monospace" font-size="11" fill="#c62828">max_tokens: 300</text>

  <!-- Arrow 2: HTTP to Model -->
  <line x1="540" y1="265" x2="610" y2="265" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="255" font-family="Arial,sans-serif" font-size="11" fill="#555" text-anchor="middle">TLS</text>

  <!-- Model box -->
  <rect x="610" y="170" width="220" height="200" rx="10" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="2"/>
  <rect x="610" y="170" width="220" height="36" rx="10" fill="#2e7d32"/>
  <rect x="610" y="194" width="220" height="12" fill="#2e7d32"/>
  <text x="720" y="194" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">GPT-4o Model</text>
  <text x="720" y="228" font-family="Arial,sans-serif" font-size="13" fill="#333" text-anchor="middle">Tokenize input</text>
  <line x1="640" y1="236" x2="810" y2="236" stroke="#aaa" stroke-width="1"/>
  <text x="720" y="255" font-family="Arial,sans-serif" font-size="13" fill="#333" text-anchor="middle">Forward pass</text>
  <line x1="640" y1="263" x2="810" y2="263" stroke="#aaa" stroke-width="1"/>
  <text x="720" y="283" font-family="Arial,sans-serif" font-size="13" fill="#333" text-anchor="middle">Sample tokens</text>
  <line x1="640" y1="291" x2="810" y2="291" stroke="#aaa" stroke-width="1"/>
  <text x="720" y="311" font-family="Arial,sans-serif" font-size="13" fill="#333" text-anchor="middle">Decode output</text>
  <line x1="640" y1="318" x2="810" y2="318" stroke="#aaa" stroke-width="1"/>
  <text x="720" y="352" font-family="Arial,sans-serif" font-size="13" fill="#333" text-anchor="middle">temperature controls</text>
  <text x="720" y="368" font-family="Arial,sans-serif" font-size="12" fill="#555" text-anchor="middle">randomness of sampling</text>

  <!-- Arrow 3: Model to Response -->
  <line x1="830" y1="265" x2="910" y2="265" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870" y="255" font-family="Arial,sans-serif" font-size="11" fill="#555" text-anchor="middle">JSON</text>

  <!-- Response box -->
  <rect x="910" y="160" width="330" height="230" rx="10" fill="#fce4ec" filter="url(#shadow)" stroke="#c62828" stroke-width="2"/>
  <rect x="910" y="160" width="330" height="36" rx="10" fill="#c62828"/>
  <rect x="910" y="184" width="330" height="12" fill="#c62828"/>
  <text x="1075" y="184" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">HTTP Response</text>
  <text x="920" y="215" font-family="monospace" font-size="11" fill="#555">choices[0].message.content</text>
  <text x="920" y="233" font-family="monospace" font-size="11" fill="#555">choices[0].finish_reason</text>
  <text x="920" y="251" font-family="monospace" font-size="11" fill="#1565c0">usage.prompt_tokens</text>
  <text x="920" y="269" font-family="monospace" font-size="11" fill="#1565c0">usage.completion_tokens</text>
  <text x="920" y="287" font-family="monospace" font-size="11" fill="#c62828">usage.total_tokens</text>
  <text x="920" y="305" font-family="monospace" font-size="11" fill="#555">model  (actual version)</text>
  <text x="920" y="323" font-family="monospace" font-size="11" fill="#555">id     (request UUID)</text>
  <text x="920" y="358" font-family="Arial,sans-serif" font-size="11" fill="#c62828" text-anchor="middle">Billed per token used</text>
  <text x="1075" y="378" font-family="Arial,sans-serif" font-size="11" fill="#c62828" text-anchor="middle">finish_reason: stop | length | content_filter</text>

  <!-- Key params legend at bottom -->
  <rect x="40" y="490" width="560" height="160" rx="10" fill="#f5f5f5" filter="url(#shadow)"/>
  <text x="320" y="516" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Key Parameters</text>
  <rect x="60" y="528" width="12" height="12" rx="2" fill="#1565c0"/>
  <text x="80" y="539" font-family="Arial,sans-serif" font-size="13" fill="#333">model — which model to use (gpt-4o, gpt-4o-mini, ...)</text>
  <rect x="60" y="552" width="12" height="12" rx="2" fill="#1565c0"/>
  <text x="80" y="563" font-family="Arial,sans-serif" font-size="13" fill="#333">messages — list of {role, content} objects</text>
  <rect x="60" y="576" width="12" height="12" rx="2" fill="#c62828"/>
  <text x="80" y="587" font-family="Arial,sans-serif" font-size="13" fill="#333">temperature — 0 (deterministic) to 2 (creative)</text>
  <rect x="60" y="600" width="12" height="12" rx="2" fill="#c62828"/>
  <text x="80" y="611" font-family="Arial,sans-serif" font-size="13" fill="#333">max_tokens — cap on output tokens (cost control)</text>
  <rect x="60" y="624" width="12" height="12" rx="2" fill="#555"/>
  <text x="80" y="635" font-family="Arial,sans-serif" font-size="13" fill="#333">stream — return tokens incrementally (true/false)</text>

  <!-- Roles legend -->
  <rect x="640" y="490" width="600" height="160" rx="10" fill="#f5f5f5" filter="url(#shadow)"/>
  <text x="940" y="516" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Message Roles</text>
  <rect x="660" y="528" width="12" height="12" rx="2" fill="#2e7d32"/>
  <text x="680" y="539" font-family="Arial,sans-serif" font-size="13" fill="#333">system — persona and instructions for the model</text>
  <rect x="660" y="552" width="12" height="12" rx="2" fill="#1565c0"/>
  <text x="680" y="563" font-family="Arial,sans-serif" font-size="13" fill="#333">user — the human turn input</text>
  <rect x="660" y="576" width="12" height="12" rx="2" fill="#c62828"/>
  <text x="680" y="587" font-family="Arial,sans-serif" font-size="13" fill="#333">assistant — previous model replies (multi-turn)</text>
  <rect x="660" y="600" width="12" height="12" rx="2" fill="#f9a825"/>
  <text x="680" y="611" font-family="Arial,sans-serif" font-size="13" fill="#333">tool — results of function calls</text>
</svg>

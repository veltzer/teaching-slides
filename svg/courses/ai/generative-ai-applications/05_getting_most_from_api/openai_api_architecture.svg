<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="35.5556" y="177.7778" width="177.7778" height="115.5556" rx="8.8889" fill="url(#grad-surface)" filter="url(#shadow)" stroke="#1e88e5" stroke-width="1.7778" />
  <ns0:rect x="35.5556" y="177.7778" width="177.7778" height="32" rx="8.8889" fill="url(#grad-primary)" />
  <ns0:rect x="35.5556" y="199.1111" width="177.7778" height="10.6667" fill="url(#grad-primary)" />
  <ns0:text x="124.4444" y="199.1111" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="#ffffff" text-anchor="middle">Your App</ns0:text>
  <ns0:text x="124.4444" y="228.4444" font-family="monospace" font-size="10.6667" fill="#333" text-anchor="middle">client = OpenAI()</ns0:text>
  <ns0:text x="124.4444" y="244.4444" font-family="monospace" font-size="10.6667" fill="#333" text-anchor="middle">client.chat.</ns0:text>
  <ns0:text x="124.4444" y="260.4444" font-family="monospace" font-size="10.6667" fill="#333" text-anchor="middle">completions.create()</ns0:text>
  <ns0:line x1="213.3333" y1="235.5556" x2="275.5556" y2="235.5556" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="244.4444" y="226.6667" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">HTTP POST</ns0:text>
  <ns0:rect x="275.5556" y="160" width="204.4444" height="155.5556" rx="8.8889" fill="#fff8e1" filter="url(#shadow)" stroke="#f9a825" stroke-width="1.7778" />
  <ns0:rect x="275.5556" y="160" width="204.4444" height="32" rx="8.8889" fill="#f9a825" />
  <ns0:rect x="275.5556" y="181.3333" width="204.4444" height="10.6667" fill="#f9a825" />
  <ns0:text x="377.7778" y="181.3333" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="#fff" text-anchor="middle">HTTP Request</ns0:text>
  <ns0:text x="284.4444" y="208.8889" font-family="monospace" font-size="10" fill="#555">POST /v1/chat/completions</ns0:text>
  <ns0:text x="284.4444" y="224.8889" font-family="monospace" font-size="10" fill="#555">Authorization: Bearer sk-...</ns0:text>
  <ns0:text x="284.4444" y="240.8889" font-family="monospace" font-size="10" fill="#1565c0">model: "gpt-4o"</ns0:text>
  <ns0:text x="284.4444" y="256.8889" font-family="monospace" font-size="10" fill="#1565c0">messages: [...]</ns0:text>
  <ns0:text x="284.4444" y="272.8889" font-family="monospace" font-size="10" fill="#c62828">temperature: 0.7</ns0:text>
  <ns0:text x="284.4444" y="288.8889" font-family="monospace" font-size="10" fill="#c62828">max_tokens: 300</ns0:text>
  <ns0:line x1="480" y1="235.5556" x2="542.2222" y2="235.5556" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="511.1111" y="226.6667" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">TLS</ns0:text>
  <ns0:rect x="542.2222" y="151.1111" width="195.5556" height="177.7778" rx="8.8889" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="1.7778" />
  <ns0:rect x="542.2222" y="151.1111" width="195.5556" height="32" rx="8.8889" fill="#2e7d32" />
  <ns0:rect x="542.2222" y="172.4444" width="195.5556" height="10.6667" fill="#2e7d32" />
  <ns0:text x="640" y="172.4444" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="#ffffff" text-anchor="middle">GPT-4o Model</ns0:text>
  <ns0:text x="640" y="202.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="#333" text-anchor="middle">Tokenize input</ns0:text>
  <ns0:line x1="568.8889" y1="209.7778" x2="720" y2="209.7778" stroke="#aaa" stroke-width="0.8889" />
  <ns0:text x="640" y="226.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="#333" text-anchor="middle">Forward pass</ns0:text>
  <ns0:line x1="568.8889" y1="233.7778" x2="720" y2="233.7778" stroke="#aaa" stroke-width="0.8889" />
  <ns0:text x="640" y="251.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="#333" text-anchor="middle">Sample tokens</ns0:text>
  <ns0:line x1="568.8889" y1="258.6667" x2="720" y2="258.6667" stroke="#aaa" stroke-width="0.8889" />
  <ns0:text x="640" y="276.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="#333" text-anchor="middle">Decode output</ns0:text>
  <ns0:line x1="568.8889" y1="282.6667" x2="720" y2="282.6667" stroke="#aaa" stroke-width="0.8889" />
  <ns0:text x="640" y="312.8889" font-family="Arial,sans-serif" font-size="11.5556" fill="#333" text-anchor="middle">temperature controls</ns0:text>
  <ns0:text x="640" y="327.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#555" text-anchor="middle">randomness of sampling</ns0:text>
  <ns0:line x1="737.7778" y1="235.5556" x2="808.8889" y2="235.5556" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="773.3333" y="226.6667" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">JSON</ns0:text>
  <ns0:rect x="808.8889" y="142.2222" width="293.3333" height="204.4444" rx="8.8889" fill="#fce4ec" filter="url(#shadow)" stroke="#c62828" stroke-width="1.7778" />
  <ns0:rect x="808.8889" y="142.2222" width="293.3333" height="32" rx="8.8889" fill="#c62828" />
  <ns0:rect x="808.8889" y="163.5556" width="293.3333" height="10.6667" fill="#c62828" />
  <ns0:text x="955.5556" y="163.5556" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="#ffffff" text-anchor="middle">HTTP Response</ns0:text>
  <ns0:text x="817.7778" y="191.1111" font-family="monospace" font-size="10" fill="#555">choices[0].message.content</ns0:text>
  <ns0:text x="817.7778" y="207.1111" font-family="monospace" font-size="10" fill="#555">choices[0].finish_reason</ns0:text>
  <ns0:text x="817.7778" y="223.1111" font-family="monospace" font-size="10" fill="#1565c0">usage.prompt_tokens</ns0:text>
  <ns0:text x="817.7778" y="239.1111" font-family="monospace" font-size="10" fill="#1565c0">usage.completion_tokens</ns0:text>
  <ns0:text x="817.7778" y="255.1111" font-family="monospace" font-size="10" fill="#c62828">usage.total_tokens</ns0:text>
  <ns0:text x="817.7778" y="271.1111" font-family="monospace" font-size="10" fill="#555">model  (actual version)</ns0:text>
  <ns0:text x="817.7778" y="287.1111" font-family="monospace" font-size="10" fill="#555">id     (request UUID)</ns0:text>
  <ns0:text x="817.7778" y="318.2222" font-family="Arial,sans-serif" font-size="10" fill="#c62828" text-anchor="middle">Billed per token used</ns0:text>
  <ns0:text x="955.5556" y="336" font-family="Arial,sans-serif" font-size="10" fill="#c62828" text-anchor="middle">finish_reason: stop | length | content_filter</ns0:text>
  <ns0:rect x="35.5556" y="435.5556" width="497.7778" height="142.2222" rx="8.8889" fill="#f5f5f5" filter="url(#shadow)" />
  <ns0:text x="284.4444" y="458.6667" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="#333" text-anchor="middle">Key Parameters</ns0:text>
  <ns0:rect x="53.3333" y="469.3333" width="10.6667" height="10.6667" rx="1.7778" fill="#1565c0" />
  <ns0:text x="71.1111" y="479.1111" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">model — which model to use (gpt-4o, gpt-4o-mini, ...)</ns0:text>
  <ns0:rect x="53.3333" y="490.6667" width="10.6667" height="10.6667" rx="1.7778" fill="#1565c0" />
  <ns0:text x="71.1111" y="500.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">messages — list of {role, content} objects</ns0:text>
  <ns0:rect x="53.3333" y="512" width="10.6667" height="10.6667" rx="1.7778" fill="#c62828" />
  <ns0:text x="71.1111" y="521.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">temperature — 0 (deterministic) to 2 (creative)</ns0:text>
  <ns0:rect x="53.3333" y="533.3333" width="10.6667" height="10.6667" rx="1.7778" fill="#c62828" />
  <ns0:text x="71.1111" y="543.1111" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">max_tokens — cap on output tokens (cost control)</ns0:text>
  <ns0:rect x="53.3333" y="554.6667" width="10.6667" height="10.6667" rx="1.7778" fill="#555" />
  <ns0:text x="71.1111" y="564.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">stream — return tokens incrementally (true/false)</ns0:text>
  <ns0:rect x="568.8889" y="435.5556" width="533.3333" height="142.2222" rx="8.8889" fill="#f5f5f5" filter="url(#shadow)" />
  <ns0:text x="835.5556" y="458.6667" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="#333" text-anchor="middle">Message Roles</ns0:text>
  <ns0:rect x="586.6667" y="469.3333" width="10.6667" height="10.6667" rx="1.7778" fill="#2e7d32" />
  <ns0:text x="604.4444" y="479.1111" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">system — persona and instructions for the model</ns0:text>
  <ns0:rect x="586.6667" y="490.6667" width="10.6667" height="10.6667" rx="1.7778" fill="#1565c0" />
  <ns0:text x="604.4444" y="500.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">user — the human turn input</ns0:text>
  <ns0:rect x="586.6667" y="512" width="10.6667" height="10.6667" rx="1.7778" fill="#c62828" />
  <ns0:text x="604.4444" y="521.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">assistant — previous model replies (multi-turn)</ns0:text>
  <ns0:rect x="586.6667" y="533.3333" width="10.6667" height="10.6667" rx="1.7778" fill="#f9a825" />
  <ns0:text x="604.4444" y="543.1111" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">tool — results of function calls</ns0:text>
</ns0:svg>
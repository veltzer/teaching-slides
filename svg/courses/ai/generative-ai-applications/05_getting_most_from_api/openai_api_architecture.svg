<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e; --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.772534713906" font-weight="bold" fill="var(--text)">OpenAI API Architecture</text>

  <rect x="40" y="87.027027027027" width="203.389830508475" height="146.306306306306" rx="8.24721110845" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="141.694915254237" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.525323605456" font-weight="bold" fill="var(--primary-text)">Your App</text>
  <text x="141.694915254237" y="165.405405405405" text-anchor="middle" font-family="Courier New, monospace" font-size="13.401718051231" fill="var(--primary-text)">OpenAI()</text>
  <text x="141.694915254237" y="191.531531531532" text-anchor="middle" font-family="Courier New, monospace" font-size="13.401718051231" fill="var(--primary-text)">.chat.completions</text>
  <text x="141.694915254237" y="217.657657657658" text-anchor="middle" font-family="Courier New, monospace" font-size="13.401718051231" fill="var(--primary-text)">.create()</text>

  <line x1="243.389830508475" y1="160.18018018018" x2="304.406779661017" y2="160.18018018018" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="273.898305084746" y="149.72972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.370816662675" fill="var(--text-muted)">HTTPS</text>

  <rect x="314.576271186441" y="71.351351351351" width="259.322033898305" height="177.657657657658" rx="8.24721110845" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="443.728813559322" y="107.927927927928" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.525323605456" font-weight="bold" fill="var(--warn-text)">Request</text>
  <text x="329.830508474576" y="144.504504504504" font-family="Courier New, monospace" font-size="12.370816662675" fill="var(--warn-text)">POST /v1/chat/completions</text>
  <text x="329.830508474576" y="170.630630630631" font-family="Courier New, monospace" font-size="12.370816662675" fill="var(--warn-text)">Bearer sk-...</text>
  <text x="329.830508474576" y="196.756756756757" font-family="Courier New, monospace" font-size="12.370816662675" fill="var(--warn-text)">model, messages</text>
  <text x="329.830508474576" y="222.882882882883" font-family="Courier New, monospace" font-size="12.370816662675" fill="var(--warn-text)">temperature, max_tokens</text>

  <line x1="573.898305084746" y1="160.18018018018" x2="634.915254237288" y2="160.18018018018" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="55.675675675676" width="233.898305084746" height="209.009009009009" rx="8.24721110845" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="756.949152542373" y="92.252252252252" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.525323605456" font-weight="bold" fill="var(--ok-text)">GPT-4o Model</text>
  <text x="756.949152542373" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--ok-text)">Tokenize</text>
  <text x="756.949152542373" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--ok-text)">Forward pass</text>
  <text x="756.949152542373" y="191.531531531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--ok-text)">Sample tokens</text>
  <text x="756.949152542373" y="222.882882882883" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--ok-text)">Decode output</text>

  <line x1="873.898305084746" y1="160.18018018018" x2="934.915254237288" y2="160.18018018018" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="904.406779661017" y="149.72972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.370816662675" fill="var(--text-muted)">JSON</text>

  <rect x="940" y="71.351351351351" width="300" height="198.558558558559" rx="8.24721110845" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1089.491525423729" y="107.927927927928" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.525323605456" font-weight="bold" fill="var(--danger-text)">Response</text>
  <text x="955.254237288136" y="144.504504504504" font-family="Courier New, monospace" font-size="12.370816662675" fill="var(--danger-text)">choices[0].message</text>
  <text x="955.254237288136" y="170.630630630631" font-family="Courier New, monospace" font-size="12.370816662675" fill="var(--danger-text)">finish_reason</text>
  <text x="955.254237288136" y="196.756756756757" font-family="Courier New, monospace" font-size="12.370816662675" fill="var(--danger-text)">usage.total_tokens</text>
  <text x="955.254237288136" y="222.882882882883" font-family="Courier New, monospace" font-size="12.370816662675" fill="var(--danger-text)">model, id</text>
  <text x="955.254237288136" y="254.234234234234" font-family="Arial, sans-serif" font-size="12.370816662675" fill="var(--danger-text)">Billed per token</text>

  <rect x="40" y="311.711711711712" width="589.830508474576" height="308.288288288288" rx="8.24721110845" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="334.915254237288" y="348.288288288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.556224994012" font-weight="bold" fill="var(--text)">Key Parameters</text>
  <text x="65.423728813559" y="390.09009009009" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--text)">model: which version</text>
  <text x="65.423728813559" y="426.666666666667" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--text)">messages: role/content list</text>
  <text x="65.423728813559" y="463.243243243243" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--text)">temperature: 0 to 2</text>
  <text x="65.423728813559" y="499.81981981982" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--text)">max_tokens: output cap</text>
  <text x="65.423728813559" y="536.396396396396" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--text)">stream: incremental output</text>
  <text x="65.423728813559" y="572.972972972973" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--text)">tools: function calling</text>

  <rect x="650.169491525424" y="311.711711711712" width="589.830508474576" height="308.288288288288" rx="8.24721110845" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="945.084745762712" y="348.288288288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.556224994012" font-weight="bold" fill="var(--text)">Message Roles</text>
  <text x="675.593220338983" y="390.09009009009" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--text)">system: persona</text>
  <text x="675.593220338983" y="431.891891891892" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--text)">user: human input</text>
  <text x="675.593220338983" y="473.693693693694" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--text)">assistant: prior replies</text>
  <text x="675.593220338983" y="515.495495495496" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--text)">tool: function results</text>
</svg>

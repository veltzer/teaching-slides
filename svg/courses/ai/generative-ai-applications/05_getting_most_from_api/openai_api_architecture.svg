<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="77.5" y="201.1111" width="187.5" height="104.7223" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <rect x="77.5" y="201.1111" width="187.5" height="29" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="77.5" y="220.4444" width="187.5" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="171.25" y="220.4444" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Your App</text>
  <text x="171.25" y="247.0277" font-family="monospace" font-size="10.4284" fill="var(--text)" text-anchor="middle">client = OpenAI()</text>
  <text x="171.25" y="261.5277" font-family="monospace" font-size="10.4284" fill="var(--text)" text-anchor="middle">client.chat.</text>
  <text x="171.25" y="276.0277" font-family="monospace" font-size="10.4284" fill="var(--text)" text-anchor="middle">completions.create()</text>
  <line x1="265" y1="253.4723" x2="330.625" y2="253.4723" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="297.8124" y="245.4167" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">HTTP POST</text>
  <rect x="330.625" y="185" width="215.6249" height="140.9723" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="330.625" y="185" width="215.6249" height="29" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="330.625" y="204.3333" width="215.6249" height="9.6667" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="438.4375" y="204.3333" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)" text-anchor="middle">HTTP Request</text>
  <text x="339.9999" y="229.3056" font-family="monospace" font-size="10" fill="var(--text-muted)">POST /v1/chat/completions</text>
  <text x="339.9999" y="243.8056" font-family="monospace" font-size="10" fill="var(--text-muted)">Authorization: Bearer sk-...</text>
  <text x="339.9999" y="258.3056" font-family="monospace" font-size="10" fill="var(--primary-accent)">model: "gpt-4o"</text>
  <text x="339.9999" y="272.8056" font-family="monospace" font-size="10" fill="var(--primary-accent)">messages: [...]</text>
  <text x="339.9999" y="287.3056" font-family="monospace" font-size="10" fill="var(--danger-accent)">temperature: 0.7</text>
  <text x="339.9999" y="301.8056" font-family="monospace" font-size="10" fill="var(--danger-accent)">max_tokens: 300</text>
  <line x1="546.25" y1="253.4723" x2="611.875" y2="253.4723" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="579.0625" y="245.4167" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">TLS</text>
  <rect x="611.875" y="176.9444" width="206.25" height="161.1111" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="611.875" y="176.9444" width="206.25" height="29" rx="6" fill="var(--ok-accent)" />
  <rect x="611.875" y="196.2777" width="206.25" height="9.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="715" y="196.2777" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)" text-anchor="middle">GPT-4o Model</text>
  <text x="715" y="223.6667" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">Tokenize input</text>
  <line x1="640" y1="230.1111" x2="799.375" y2="230.1111" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="715" y="245.4167" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">Forward pass</text>
  <line x1="640" y1="251.8611" x2="799.375" y2="251.8611" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="715" y="267.9723" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">Sample tokens</text>
  <line x1="640" y1="274.4167" x2="799.375" y2="274.4167" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="715" y="290.5277" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">Decode output</text>
  <line x1="640" y1="296.1667" x2="799.375" y2="296.1667" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="715" y="323.5556" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">temperature controls</text>
  <text x="715" y="336.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">randomness of sampling</text>
  <line x1="818.125" y1="253.4723" x2="893.125" y2="253.4723" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="855.6249" y="245.4167" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">JSON</text>
  <rect x="893.125" y="168.8889" width="309.375" height="185.2777" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="893.125" y="168.8889" width="309.375" height="29" rx="6" fill="var(--danger-accent)" />
  <rect x="893.125" y="188.2223" width="309.375" height="9.6667" fill="var(--danger-accent)" rx="6"/>
  <text x="1047.8125" y="188.2223" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)" text-anchor="middle">HTTP Response</text>
  <text x="902.5" y="213.1944" font-family="monospace" font-size="10" fill="var(--text-muted)">choices[0].message.content</text>
  <text x="902.5" y="227.6944" font-family="monospace" font-size="10" fill="var(--text-muted)">choices[0].finish_reason</text>
  <text x="902.5" y="242.1944" font-family="monospace" font-size="10" fill="var(--primary-accent)">usage.prompt_tokens</text>
  <text x="902.5" y="256.6944" font-family="monospace" font-size="10" fill="var(--primary-accent)">usage.completion_tokens</text>
  <text x="902.5" y="271.1944" font-family="monospace" font-size="10" fill="var(--danger-accent)">usage.total_tokens</text>
  <text x="902.5" y="285.6944" font-family="monospace" font-size="10" fill="var(--text-muted)">model  (actual version)</text>
  <text x="902.5" y="300.1944" font-family="monospace" font-size="10" fill="var(--text-muted)">id     (request UUID)</text>
  <text x="902.5" y="328.3889" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">Billed per token used</text>
  <text x="1047.8125" y="344.5" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">finish_reason: stop | length | content_filter</text>
  <rect x="77.5" y="434.7223" width="525" height="128.8889" rx="6" fill="var(--surface)" filter="url(#shadow)" />
  <text x="339.9999" y="455.6667" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--text)" text-anchor="middle">Key Parameters</text>
  <rect x="96.25" y="465.3333" width="11.25" height="9.6667" rx="6" fill="var(--primary-accent)" />
  <text x="115" y="474.1944" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">model — which model to use (gpt-4o, gpt-4o-mini, ...)</text>
  <rect x="96.25" y="484.6667" width="11.25" height="9.6667" rx="6" fill="var(--primary-accent)" />
  <text x="115" y="493.5277" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">messages — list of {role, content} objects</text>
  <rect x="96.25" y="504" width="11.25" height="9.6667" rx="6" fill="var(--danger-accent)" />
  <text x="115" y="512.8611" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">temperature — 0 (deterministic) to 2 (creative)</text>
  <rect x="96.25" y="523.3333" width="11.25" height="9.6667" rx="6" fill="var(--danger-accent)" />
  <text x="115" y="532.1944" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">max_tokens — cap on output tokens (cost control)</text>
  <rect x="96.25" y="542.6667" width="11.25" height="9.6667" rx="6" fill="var(--text-muted)" />
  <text x="115" y="551.5277" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">stream — return tokens incrementally (true/false)</text>
  <rect x="640" y="434.7223" width="562.5" height="128.8889" rx="6" fill="var(--surface)" filter="url(#shadow)" />
  <text x="921.25" y="455.6667" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--text)" text-anchor="middle">Message Roles</text>
  <rect x="658.75" y="465.3333" width="11.25" height="9.6667" rx="6" fill="var(--ok-accent)" />
  <text x="677.4999" y="474.1944" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">system — persona and instructions for the model</text>
  <rect x="658.75" y="484.6667" width="11.25" height="9.6667" rx="6" fill="var(--primary-accent)" />
  <text x="677.4999" y="493.5277" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">user — the human turn input</text>
  <rect x="658.75" y="504" width="11.25" height="9.6667" rx="6" fill="var(--danger-accent)" />
  <text x="677.4999" y="512.8611" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">assistant — previous model replies (multi-turn)</text>
  <rect x="658.75" y="523.3333" width="11.25" height="9.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="677.4999" y="532.1944" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">tool — results of function calls</text>
</svg>
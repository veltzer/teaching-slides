<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="87.346897" width="200" height="153.877635" rx="7.511623" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="87.346897" width="200" height="42.612237" rx="7.511623" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="115.755005" width="200" height="14.204128" fill="var(--primary-fill)" rx="7.511623" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="115.755005" font-family="Arial,sans-serif" font-size="17.407435" font-weight="bold" fill="var(--bg)" text-anchor="middle">Your App</text>
  <text x="140" y="154.816173" font-family="monospace" font-size="13.055701" fill="var(--text)" text-anchor="middle">client = OpenAI()</text>
  <text x="140" y="176.122292" font-family="monospace" font-size="13.055701" fill="var(--text)" text-anchor="middle">client.chat.</text>
  <text x="140" y="197.42841" font-family="monospace" font-size="13.055701" fill="var(--text)" text-anchor="middle">completions.create()</text>
  <line x1="240" y1="164.285788" x2="310" y2="164.285788" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="274.999893" y="152.44899" font-family="Arial,sans-serif" font-size="12.519372" fill="var(--text-muted)" text-anchor="middle">HTTP POST</text>
  <rect x="310" y="63.673448" width="229.999893" height="207.142931" rx="7.511623" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="310" y="63.673448" width="229.999893" height="42.612237" rx="7.511623" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="310" y="92.081557" width="229.999893" height="14.204128" fill="var(--warn-fill)" rx="7.511623" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="92.081557" font-family="Arial,sans-serif" font-size="16.319502" font-weight="bold" fill="var(--bg)" text-anchor="middle">HTTP Request</text>
  <text x="319.999893" y="128.775542" font-family="monospace" font-size="12.519372" fill="var(--text-muted)">POST /v1/chat/completions</text>
  <text x="319.999893" y="150.08166" font-family="monospace" font-size="12.519372" fill="var(--text-muted)">Authorization: Bearer sk-...</text>
  <text x="319.999893" y="171.387778" font-family="monospace" font-size="12.519372" fill="var(--primary-accent)">model: "gpt-4o"</text>
  <text x="319.999893" y="192.693896" font-family="monospace" font-size="12.519372" fill="var(--primary-accent)">messages: [...]</text>
  <text x="319.999893" y="214.000015" font-family="monospace" font-size="12.519372" fill="var(--danger-accent)">temperature: 0.7</text>
  <text x="319.999893" y="235.306133" font-family="monospace" font-size="12.519372" fill="var(--danger-accent)">max_tokens: 300</text>
  <line x1="540" y1="164.285788" x2="610" y2="164.285788" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="575" y="152.44899" font-family="Arial,sans-serif" font-size="12.519372" fill="var(--text-muted)" text-anchor="middle">TLS</text>
  <rect x="610" y="51.836651" width="220" height="236.734631" rx="7.511623" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="610" y="51.836651" width="220" height="42.612237" rx="7.511623" fill="var(--ok-accent)" />
  <rect x="610" y="80.244759" width="220" height="14.204128" fill="var(--ok-accent)" rx="7.511623"/>
  <text x="720" y="80.244759" font-family="Arial,sans-serif" font-size="16.319502" font-weight="bold" fill="var(--bg)" text-anchor="middle">GPT-4o Model</text>
  <text x="720" y="120.489813" font-family="Arial,sans-serif" font-size="14.143635" fill="var(--text)" text-anchor="middle">Tokenize input</text>
  <line x1="640" y1="129.959133" x2="810" y2="129.959133" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="720" y="152.44899" font-family="Arial,sans-serif" font-size="14.143635" fill="var(--text)" text-anchor="middle">Forward pass</text>
  <line x1="640" y1="161.918311" x2="810" y2="161.918311" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="720" y="185.591906" font-family="Arial,sans-serif" font-size="14.143635" fill="var(--text)" text-anchor="middle">Sample tokens</text>
  <line x1="640" y1="195.061227" x2="810" y2="195.061227" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="720" y="218.734528" font-family="Arial,sans-serif" font-size="14.143635" fill="var(--text)" text-anchor="middle">Decode output</text>
  <line x1="640" y1="227.020404" x2="810" y2="227.020404" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="720" y="267.26531" font-family="Arial,sans-serif" font-size="14.143635" fill="var(--text)" text-anchor="middle">temperature controls</text>
  <text x="720" y="286.203951" font-family="Arial,sans-serif" font-size="13.055701" fill="var(--text-muted)" text-anchor="middle">randomness of sampling</text>
  <line x1="830" y1="164.285788" x2="910" y2="164.285788" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="869.999893" y="152.44899" font-family="Arial,sans-serif" font-size="12.519372" fill="var(--text-muted)" text-anchor="middle">JSON</text>
  <rect x="910" y="40" width="330" height="272.24473" rx="7.511623" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="910" y="40" width="330" height="42.612237" rx="7.511623" fill="var(--danger-accent)" />
  <rect x="910" y="68.408256" width="330" height="14.204128" fill="var(--danger-accent)" rx="7.511623"/>
  <text x="1075" y="68.408256" font-family="Arial,sans-serif" font-size="16.319502" font-weight="bold" fill="var(--bg)" text-anchor="middle">HTTP Response</text>
  <text x="920" y="105.101946" font-family="monospace" font-size="12.519372" fill="var(--text-muted)">choices[0].message.content</text>
  <text x="920" y="126.408065" font-family="monospace" font-size="12.519372" fill="var(--text-muted)">choices[0].finish_reason</text>
  <text x="920" y="147.714183" font-family="monospace" font-size="12.519372" fill="var(--primary-accent)">usage.prompt_tokens</text>
  <text x="920" y="169.020301" font-family="monospace" font-size="12.519372" fill="var(--primary-accent)">usage.completion_tokens</text>
  <text x="920" y="190.326419" font-family="monospace" font-size="12.519372" fill="var(--danger-accent)">usage.total_tokens</text>
  <text x="920" y="211.632538" font-family="monospace" font-size="12.519372" fill="var(--text-muted)">model  (actual version)</text>
  <text x="920" y="232.938656" font-family="monospace" font-size="12.519372" fill="var(--text-muted)">id     (request UUID)</text>
  <text x="920" y="274.367301" font-family="Arial,sans-serif" font-size="12.519372" fill="var(--danger-accent)" text-anchor="middle">Billed per token used</text>
  <text x="1075" y="298.040749" font-family="Arial,sans-serif" font-size="12.519372" fill="var(--danger-accent)" text-anchor="middle">finish_reason: stop | length | content_filter</text>
  <rect x="40" y="430.612266" width="560" height="189.387734" rx="7.511623" fill="var(--surface)" />
  <text x="319.999893" y="461.387705" font-family="Arial,sans-serif" font-size="16.319502" font-weight="bold" fill="var(--text)" text-anchor="middle">Key Parameters</text>
  <rect x="60" y="475.591686" width="12" height="14.204128" rx="7.511623" fill="var(--primary-accent)" />
  <text x="80" y="488.612075" font-family="Arial,sans-serif" font-size="14.143635" fill="var(--text)">model — which model to use (gpt-4o, gpt-4o-mini, ...)</text>
  <rect x="60" y="503.999941" width="12" height="14.204128" rx="7.511623" fill="var(--primary-accent)" />
  <text x="80" y="517.020184" font-family="Arial,sans-serif" font-size="14.143635" fill="var(--text)">messages — list of {role, content} objects</text>
  <rect x="60" y="532.40805" width="12" height="14.204128" rx="7.511623" fill="var(--danger-accent)" />
  <text x="80" y="545.428439" font-family="Arial,sans-serif" font-size="14.143635" fill="var(--text)">temperature — 0 (deterministic) to 2 (creative)</text>
  <rect x="60" y="560.816159" width="12" height="14.204128" rx="7.511623" fill="var(--danger-accent)" />
  <text x="80" y="573.836548" font-family="Arial,sans-serif" font-size="14.143635" fill="var(--text)">max_tokens — cap on output tokens (cost control)</text>
  <rect x="60" y="589.224414" width="12" height="14.204128" rx="7.511623" fill="var(--text-muted)" />
  <text x="80" y="602.244657" font-family="Arial,sans-serif" font-size="14.143635" fill="var(--text)">stream — return tokens incrementally (true/false)</text>
  <rect x="640" y="430.612266" width="600" height="189.387734" rx="7.511623" fill="var(--surface)" />
  <text x="940" y="461.387705" font-family="Arial,sans-serif" font-size="16.319502" font-weight="bold" fill="var(--text)" text-anchor="middle">Message Roles</text>
  <rect x="660" y="475.591686" width="12" height="14.204128" rx="7.511623" fill="var(--ok-accent)" />
  <text x="679.999893" y="488.612075" font-family="Arial,sans-serif" font-size="14.143635" fill="var(--text)">system — persona and instructions for the model</text>
  <rect x="660" y="503.999941" width="12" height="14.204128" rx="7.511623" fill="var(--primary-accent)" />
  <text x="679.999893" y="517.020184" font-family="Arial,sans-serif" font-size="14.143635" fill="var(--text)">user — the human turn input</text>
  <rect x="660" y="532.40805" width="12" height="14.204128" rx="7.511623" fill="var(--danger-accent)" />
  <text x="679.999893" y="545.428439" font-family="Arial,sans-serif" font-size="14.143635" fill="var(--text)">assistant — previous model replies (multi-turn)</text>
  <rect x="660" y="560.816159" width="12" height="14.204128" rx="7.511623" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="679.999893" y="573.836548" font-family="Arial,sans-serif" font-size="14.143635" fill="var(--text)">tool — results of function calls</text>
</svg>
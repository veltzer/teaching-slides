<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="35.5556" y="177.7778" width="177.7778" height="115.5556" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <rect x="35.5556" y="177.7778" width="177.7778" height="32" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="35.5556" y="199.1111" width="177.7778" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="124.4444" y="199.1111" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">Your App</text>
  <text x="124.4444" y="228.4444" font-family="monospace" font-size="10.6667" fill="var(--text)" text-anchor="middle">client = OpenAI()</text>
  <text x="124.4444" y="244.4444" font-family="monospace" font-size="10.6667" fill="var(--text)" text-anchor="middle">client.chat.</text>
  <text x="124.4444" y="260.4444" font-family="monospace" font-size="10.6667" fill="var(--text)" text-anchor="middle">completions.create()</text>
  <line x1="213.3333" y1="235.5556" x2="275.5556" y2="235.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="244.4444" y="226.6667" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">HTTP POST</text>
  <rect x="275.5556" y="160" width="204.4444" height="155.5556" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="275.5556" y="160" width="204.4444" height="32" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="275.5556" y="181.3333" width="204.4444" height="10.6667" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="377.7778" y="181.3333" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)" text-anchor="middle">HTTP Request</text>
  <text x="284.4444" y="208.8889" font-family="monospace" font-size="10" fill="var(--text-muted)">POST /v1/chat/completions</text>
  <text x="284.4444" y="224.8889" font-family="monospace" font-size="10" fill="var(--text-muted)">Authorization: Bearer sk-...</text>
  <text x="284.4444" y="240.8889" font-family="monospace" font-size="10" fill="var(--primary-accent)">model: "gpt-4o"</text>
  <text x="284.4444" y="256.8889" font-family="monospace" font-size="10" fill="var(--primary-accent)">messages: [...]</text>
  <text x="284.4444" y="272.8889" font-family="monospace" font-size="10" fill="var(--danger-accent)">temperature: 0.7</text>
  <text x="284.4444" y="288.8889" font-family="monospace" font-size="10" fill="var(--danger-accent)">max_tokens: 300</text>
  <line x1="480" y1="235.5556" x2="542.2222" y2="235.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="511.1111" y="226.6667" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">TLS</text>
  <rect x="542.2222" y="151.1111" width="195.5556" height="177.7778" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="542.2222" y="151.1111" width="195.5556" height="32" rx="6" fill="var(--ok-accent)" />
  <rect x="542.2222" y="172.4444" width="195.5556" height="10.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="640" y="172.4444" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)" text-anchor="middle">GPT-4o Model</text>
  <text x="640" y="202.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">Tokenize input</text>
  <line x1="568.8889" y1="209.7778" x2="720" y2="209.7778" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="640" y="226.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">Forward pass</text>
  <line x1="568.8889" y1="233.7778" x2="720" y2="233.7778" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="640" y="251.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">Sample tokens</text>
  <line x1="568.8889" y1="258.6667" x2="720" y2="258.6667" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="640" y="276.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">Decode output</text>
  <line x1="568.8889" y1="282.6667" x2="720" y2="282.6667" stroke="var(--text-faint)" stroke-width="0.8889" />
  <text x="640" y="312.8889" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">temperature controls</text>
  <text x="640" y="327.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">randomness of sampling</text>
  <line x1="737.7778" y1="235.5556" x2="808.8889" y2="235.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="773.3333" y="226.6667" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">JSON</text>
  <rect x="808.8889" y="142.2222" width="293.3333" height="204.4444" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="808.8889" y="142.2222" width="293.3333" height="32" rx="6" fill="var(--danger-accent)" />
  <rect x="808.8889" y="163.5556" width="293.3333" height="10.6667" fill="var(--danger-accent)" rx="6"/>
  <text x="955.5556" y="163.5556" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)" text-anchor="middle">HTTP Response</text>
  <text x="817.7778" y="191.1111" font-family="monospace" font-size="10" fill="var(--text-muted)">choices[0].message.content</text>
  <text x="817.7778" y="207.1111" font-family="monospace" font-size="10" fill="var(--text-muted)">choices[0].finish_reason</text>
  <text x="817.7778" y="223.1111" font-family="monospace" font-size="10" fill="var(--primary-accent)">usage.prompt_tokens</text>
  <text x="817.7778" y="239.1111" font-family="monospace" font-size="10" fill="var(--primary-accent)">usage.completion_tokens</text>
  <text x="817.7778" y="255.1111" font-family="monospace" font-size="10" fill="var(--danger-accent)">usage.total_tokens</text>
  <text x="817.7778" y="271.1111" font-family="monospace" font-size="10" fill="var(--text-muted)">model  (actual version)</text>
  <text x="817.7778" y="287.1111" font-family="monospace" font-size="10" fill="var(--text-muted)">id     (request UUID)</text>
  <text x="817.7778" y="318.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">Billed per token used</text>
  <text x="955.5556" y="336" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">finish_reason: stop | length | content_filter</text>
  <rect x="35.5556" y="435.5556" width="497.7778" height="142.2222" rx="6" fill="var(--surface)" filter="url(#shadow)" />
  <text x="284.4444" y="458.6667" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)" text-anchor="middle">Key Parameters</text>
  <rect x="53.3333" y="469.3333" width="10.6667" height="10.6667" rx="6" fill="var(--primary-accent)" />
  <text x="71.1111" y="479.1111" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">model — which model to use (gpt-4o, gpt-4o-mini, ...)</text>
  <rect x="53.3333" y="490.6667" width="10.6667" height="10.6667" rx="6" fill="var(--primary-accent)" />
  <text x="71.1111" y="500.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">messages — list of {role, content} objects</text>
  <rect x="53.3333" y="512" width="10.6667" height="10.6667" rx="6" fill="var(--danger-accent)" />
  <text x="71.1111" y="521.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">temperature — 0 (deterministic) to 2 (creative)</text>
  <rect x="53.3333" y="533.3333" width="10.6667" height="10.6667" rx="6" fill="var(--danger-accent)" />
  <text x="71.1111" y="543.1111" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">max_tokens — cap on output tokens (cost control)</text>
  <rect x="53.3333" y="554.6667" width="10.6667" height="10.6667" rx="6" fill="var(--text-muted)" />
  <text x="71.1111" y="564.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">stream — return tokens incrementally (true/false)</text>
  <rect x="568.8889" y="435.5556" width="533.3333" height="142.2222" rx="6" fill="var(--surface)" filter="url(#shadow)" />
  <text x="835.5556" y="458.6667" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)" text-anchor="middle">Message Roles</text>
  <rect x="586.6667" y="469.3333" width="10.6667" height="10.6667" rx="6" fill="var(--ok-accent)" />
  <text x="604.4444" y="479.1111" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">system — persona and instructions for the model</text>
  <rect x="586.6667" y="490.6667" width="10.6667" height="10.6667" rx="6" fill="var(--primary-accent)" />
  <text x="604.4444" y="500.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">user — the human turn input</text>
  <rect x="586.6667" y="512" width="10.6667" height="10.6667" rx="6" fill="var(--danger-accent)" />
  <text x="604.4444" y="521.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">assistant — previous model replies (multi-turn)</text>
  <rect x="586.6667" y="533.3333" width="10.6667" height="10.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="604.4444" y="543.1111" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">tool — results of function calls</text>
</svg>
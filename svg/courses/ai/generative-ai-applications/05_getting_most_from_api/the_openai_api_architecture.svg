<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="aoa" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 0,8" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="31.343" font-weight="bold" fill="var(--text)">OpenAI API Architecture</text>
  <rect x="313.913" y="73.6232" width="652.1739" height="75.6522" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="120.6957" text-anchor="middle" font-size="25.4662" font-weight="bold" fill="var(--text)">Your Application</text>
  <line x1="639.9999" y1="149.2754" x2="639.9999" y2="191.3043" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#aoa)" />
  <text x="848.6955" y="177.8551" font-size="19.5894" fill="var(--text-muted)">HTTPS (REST API)</text>
  <rect x="248.6956" y="199.7101" width="782.6086" height="100.8696" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="241.7391" text-anchor="middle" font-size="25.4662" font-weight="bold" fill="var(--danger-accent)">API Gateway</text>
  <text x="639.9999" y="275.3623" text-anchor="middle" font-size="19.5894" fill="var(--text-muted)">Rate limiting, auth, routing</text>
  <line x1="639.9999" y1="300.5797" x2="639.9999" y2="342.6087" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#aoa)" />
  <rect x="313.913" y="351.0145" width="652.1739" height="67.2464" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="393.0435" text-anchor="middle" font-size="25.4662" font-weight="bold" fill="var(--text)">Load Balancer</text>
  <line x1="457.3912" y1="418.2609" x2="300.8695" y2="477.1014" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#aoa)" />
  <line x1="822.6086" y1="418.2609" x2="979.1304" y2="477.1014" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#aoa)" />
  <rect x="40" y="485.5072" width="469.5653" height="134.4928" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="274.7826" y="535.942" text-anchor="middle" font-size="23.5072" font-weight="bold" fill="var(--ok-accent)">GPU Cluster</text>
  <text x="274.7826" y="574.6087" text-anchor="middle" font-size="21.5483" fill="var(--text-muted)">(model server)</text>
  <rect x="770.4347" y="485.5072" width="469.5653" height="134.4928" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1005.2173" y="535.942" text-anchor="middle" font-size="23.5072" font-weight="bold" fill="var(--ok-accent)">GPU Cluster</text>
  <text x="1005.2173" y="574.6087" text-anchor="middle" font-size="21.5483" fill="var(--text-muted)">(model server)</text>
</svg>
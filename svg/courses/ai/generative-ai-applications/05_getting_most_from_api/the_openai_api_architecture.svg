<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="aoa" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 0,8" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="48" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">OpenAI API Architecture</text>
  <rect x="411.4286" y="80" width="457.1429" height="72" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="124.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--text)">Your Application</text>
  <line x1="640" y1="152" x2="640" y2="192" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#aoa)" />
  <text x="786.2857" y="179.2" font-size="16" fill="var(--text-muted)">HTTPS (REST API)</text>
  <rect x="365.7143" y="200" width="548.5714" height="96" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="240" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--danger-accent)">API Gateway</text>
  <text x="640" y="272" text-anchor="middle" font-size="16" fill="var(--text-muted)">Rate limiting, auth, routing</text>
  <line x1="640" y1="296" x2="640" y2="336" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#aoa)" />
  <rect x="411.4286" y="344" width="457.1429" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="384" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--text)">Load Balancer</text>
  <line x1="512" y1="408" x2="402.2857" y2="464" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#aoa)" />
  <line x1="768" y1="408" x2="877.7143" y2="464" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#aoa)" />
  <rect x="219.4286" y="472" width="329.1429" height="128" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="384" y="520" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--ok-accent)">GPU Cluster</text>
  <text x="384" y="556.8" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">(model server)</text>
  <rect x="731.4286" y="472" width="329.1429" height="128" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="896" y="520" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--ok-accent)">GPU Cluster</text>
  <text x="896" y="556.8" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">(model server)</text>
</svg>
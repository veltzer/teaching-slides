<svg viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="aoa" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">OpenAI API Architecture</text>
  <!-- Your app -->
  <rect x="225" y="50" width="250" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Your Application</text>
  <line x1="350" y1="95" x2="350" y2="120" stroke="#4a90e2" stroke-width="2" marker-end="url(#aoa)"/>
  <text x="430" y="112" font-size="10" fill="#666">HTTPS (REST API)</text>
  <!-- API Gateway -->
  <rect x="200" y="125" width="300" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">API Gateway</text>
  <text x="350" y="170" text-anchor="middle" font-size="10" fill="#666">Rate limiting, auth, routing</text>
  <line x1="350" y1="185" x2="350" y2="210" stroke="#4a90e2" stroke-width="2" marker-end="url(#aoa)"/>
  <!-- Load balancer -->
  <rect x="225" y="215" width="250" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="350" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Load Balancer</text>
  <line x1="280" y1="255" x2="220" y2="290" stroke="#4a90e2" stroke-width="2" marker-end="url(#aoa)"/>
  <line x1="420" y1="255" x2="480" y2="290" stroke="#4a90e2" stroke-width="2" marker-end="url(#aoa)"/>
  <!-- GPU clusters -->
  <rect x="120" y="295" width="180" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="210" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">GPU Cluster</text>
  <text x="210" y="348" text-anchor="middle" font-size="11" fill="#555">(model server)</text>

  <rect x="400" y="295" width="180" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="490" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">GPU Cluster</text>
  <text x="490" y="348" text-anchor="middle" font-size="11" fill="#555">(model server)</text>
</svg>
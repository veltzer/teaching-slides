<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="31.343" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">OpenAI API Architecture</text>
  <rect x="313.913" y="73.6232" width="652.1739" height="75.6522" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="120.6957" text-anchor="middle" font-size="25.4662" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Your Application</text>
  <line x1="639.9999" y1="149.2754" x2="639.9999" y2="191.3043" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="848.6955" y="177.8551" font-size="19.5894" fill="var(--text-muted)" font-family="Arial, sans-serif">HTTPS (REST API)</text>
  <rect x="248.6956" y="199.7101" width="782.6086" height="100.8696" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="241.7391" text-anchor="middle" font-size="25.4662" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">API Gateway</text>
  <text x="639.9999" y="275.3623" text-anchor="middle" font-size="19.5894" fill="var(--text-muted)" font-family="Arial, sans-serif">Rate limiting, auth, routing</text>
  <line x1="639.9999" y1="300.5797" x2="639.9999" y2="342.6087" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="313.913" y="351.0145" width="652.1739" height="67.2464" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="393.0435" text-anchor="middle" font-size="25.4662" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Load Balancer</text>
  <line x1="457.3912" y1="418.2609" x2="300.8695" y2="477.1014" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="822.6086" y1="418.2609" x2="979.1304" y2="477.1014" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="485.5072" width="469.5653" height="134.4928" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="274.7826" y="535.942" text-anchor="middle" font-size="23.5072" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">GPU Cluster</text>
  <text x="274.7826" y="574.6087" text-anchor="middle" font-size="21.5483" fill="var(--text-muted)" font-family="Arial, sans-serif">(model server)</text>
  <rect x="770.4347" y="485.5072" width="469.5653" height="134.4928" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1005.2173" y="535.942" text-anchor="middle" font-size="23.5072" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">GPU Cluster</text>
  <text x="1005.2173" y="574.6087" text-anchor="middle" font-size="21.5483" fill="var(--text-muted)" font-family="Arial, sans-serif">(model server)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="313.913" y="40" width="652.1739" height="80.307721704143" rx="6.181859382607" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="89.969270291125" text-anchor="middle" font-size="26.238077901556" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Your Application</text>
  <line x1="639.9999" y1="120.307721704143" x2="639.9999" y2="164.92301649704" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="848.6955" y="150.64617311716" font-size="20.183152698272" fill="var(--text-muted)" font-family="Arial, sans-serif">HTTPS (REST API)</text>
  <rect x="248.6956" y="173.846096686389" width="782.6086" height="107.07696227219" rx="6.181859382607" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="218.461497633135" text-anchor="middle" font-size="26.238077901556" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">API Gateway</text>
  <text x="639.9999" y="254.153818390532" text-anchor="middle" font-size="20.183152698272" fill="var(--text-muted)" font-family="Arial, sans-serif">Rate limiting, auth, routing</text>
  <line x1="639.9999" y1="280.92305895858" x2="639.9999" y2="325.538459905325" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="313.913" y="334.461540094675" width="652.1739" height="71.384641514793" rx="6.181859382607" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="379.07694104142" text-anchor="middle" font-size="26.238077901556" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Load Balancer</text>
  <line x1="457.3912" y1="405.846181609468" x2="300.8695" y2="468.307636781064" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="822.6086" y1="405.846181609468" x2="979.1304" y2="468.307636781064" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="477.230716970413" width="469.5653" height="142.769283029587" rx="6.181859382607" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="274.7826" y="530.769198106508" text-anchor="middle" font-size="24.219700813135" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">GPU Cluster</text>
  <text x="274.7826" y="571.815388208284" text-anchor="middle" font-size="22.201426755704" fill="var(--text-muted)" font-family="Arial, sans-serif">(model server)</text>
  <rect x="770.4347" y="477.230716970413" width="469.5653" height="142.769283029587" rx="6.181859382607" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1005.2173" y="530.769198106508" text-anchor="middle" font-size="24.219700813135" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">GPU Cluster</text>
  <text x="1005.2173" y="571.815388208284" text-anchor="middle" font-size="22.201426755704" fill="var(--text-muted)" font-family="Arial, sans-serif">(model server)</text>
</svg>

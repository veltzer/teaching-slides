<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="573.1343" height="168.387075858484" rx="6.237244572429" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.5671" y="83.03236438604" text-anchor="middle" font-size="23.744462408703" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">1. Model Selection</text>
  <text x="326.5671" y="124.193591961492" text-anchor="middle" font-size="20.091412216708" fill="var(--text-muted)" font-family="Arial, sans-serif">gpt-4o-mini for simple tasks (20x cheaper)</text>
  <text x="326.5671" y="157.871028746088" text-anchor="middle" font-size="20.091412216708" fill="var(--text-muted)" font-family="Arial, sans-serif">Reserve gpt-4o for complex reasoning</text>
  <rect x="666.8657" y="40" width="573.1343" height="168.387075858484" rx="6.237244572429" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.4329" y="83.03236438604" text-anchor="middle" font-size="23.744462408703" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. Prompt Optimization</text>
  <text x="953.4329" y="124.193591961492" text-anchor="middle" font-size="20.091412216708" fill="var(--text-muted)" font-family="Arial, sans-serif">Shorter prompts = fewer input tokens</text>
  <text x="953.4329" y="157.871028746088" text-anchor="middle" font-size="20.091412216708" fill="var(--text-muted)" font-family="Arial, sans-serif">Cache system prompts when possible</text>
  <rect x="40" y="245.806462070758" width="573.1343" height="168.387075858484" rx="6.237244572429" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.5671" y="288.838718392298" text-anchor="middle" font-size="23.744462408703" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. Max Tokens</text>
  <text x="326.5671" y="330.00005403225" text-anchor="middle" font-size="20.091412216708" fill="var(--text-muted)" font-family="Arial, sans-serif">Set appropriate limits</text>
  <text x="326.5671" y="363.677382752347" text-anchor="middle" font-size="20.091412216708" fill="var(--text-muted)" font-family="Arial, sans-serif">Don't default to 4096</text>
  <rect x="666.8657" y="245.806462070758" width="573.1343" height="168.387075858484" rx="6.237244572429" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.4329" y="288.838718392298" text-anchor="middle" font-size="23.744462408703" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">4. Response Caching</text>
  <text x="953.4329" y="330.00005403225" text-anchor="middle" font-size="20.091412216708" fill="var(--text-muted)" font-family="Arial, sans-serif">Cache identical requests</text>
  <text x="953.4329" y="363.677382752347" text-anchor="middle" font-size="20.091412216708" fill="var(--text-muted)" font-family="Arial, sans-serif">(deterministic at temp=0)</text>
  <rect x="40" y="451.612924141516" width="573.1343" height="168.387075858484" rx="6.237244572429" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.5671" y="494.645072398557" text-anchor="middle" font-size="23.744462408703" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">5. Batching</text>
  <text x="326.5671" y="535.806408038508" text-anchor="middle" font-size="20.091412216708" fill="var(--text-muted)" font-family="Arial, sans-serif">Use batch API for non-urgent requests</text>
  <text x="326.5671" y="569.483844823105" text-anchor="middle" font-size="20.091412216708" fill="var(--ok-accent)" font-family="Arial, sans-serif">(50% off)</text>
  <rect x="666.8657" y="451.612924141516" width="573.1343" height="168.387075858484" rx="6.237244572429" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.4329" y="494.645072398557" text-anchor="middle" font-size="23.744462408703" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">6. Prompt Caching</text>
  <text x="953.4329" y="535.806408038508" text-anchor="middle" font-size="20.091412216708" fill="var(--text-muted)" font-family="Arial, sans-serif">Reuse system prompts across requests</text>
  <text x="953.4329" y="569.483844823105" text-anchor="middle" font-size="20.091412216708" fill="var(--ok-accent)" font-family="Arial, sans-serif">(50% off)</text>
</svg>

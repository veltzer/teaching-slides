<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="51.4286" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="#333">Cost Optimization Playbook</text>
  <rect x="68.2667" y="94.2857" width="546.1333" height="154.2857" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="2.56" />
  <text x="341.3333" y="133.7143" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#28a745">1. Model Selection</text>
  <text x="341.3333" y="171.4286" text-anchor="middle" font-size="18.7733" fill="#555">gpt-4o-mini for simple tasks (20x cheaper)</text>
  <text x="341.3333" y="202.2857" text-anchor="middle" font-size="18.7733" fill="#555">Reserve gpt-4o for complex reasoning</text>
  <rect x="665.6" y="94.2857" width="546.1333" height="154.2857" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="2.56" />
  <text x="938.6667" y="133.7143" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#28a745">2. Prompt Optimization</text>
  <text x="938.6667" y="171.4286" text-anchor="middle" font-size="18.7733" fill="#555">Shorter prompts = fewer input tokens</text>
  <text x="938.6667" y="202.2857" text-anchor="middle" font-size="18.7733" fill="#555">Cache system prompts when possible</text>
  <rect x="68.2667" y="282.8571" width="546.1333" height="154.2857" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="2.56" />
  <text x="341.3333" y="322.2857" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#856404">3. Max Tokens</text>
  <text x="341.3333" y="360" text-anchor="middle" font-size="18.7733" fill="#555">Set appropriate limits</text>
  <text x="341.3333" y="390.8571" text-anchor="middle" font-size="18.7733" fill="#555">Don't default to 4096</text>
  <rect x="665.6" y="282.8571" width="546.1333" height="154.2857" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="2.56" />
  <text x="938.6667" y="322.2857" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#856404">4. Response Caching</text>
  <text x="938.6667" y="360" text-anchor="middle" font-size="18.7733" fill="#555">Cache identical requests</text>
  <text x="938.6667" y="390.8571" text-anchor="middle" font-size="18.7733" fill="#555">(deterministic at temp=0)</text>
  <rect x="68.2667" y="471.4286" width="546.1333" height="154.2857" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.56" />
  <text x="341.3333" y="510.8571" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#4a90e2">5. Batching</text>
  <text x="341.3333" y="548.5714" text-anchor="middle" font-size="18.7733" fill="#555">Use batch API for non-urgent requests</text>
  <text x="341.3333" y="579.4286" text-anchor="middle" font-size="18.7733" fill="#28a745">(50% off)</text>
  <rect x="665.6" y="471.4286" width="546.1333" height="154.2857" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.56" />
  <text x="938.6667" y="510.8571" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#4a90e2">6. Prompt Caching</text>
  <text x="938.6667" y="548.5714" text-anchor="middle" font-size="18.7733" fill="#555">Reuse system prompts across requests</text>
  <text x="938.6667" y="579.4286" text-anchor="middle" font-size="18.7733" fill="#28a745">(50% off)</text>
</svg>
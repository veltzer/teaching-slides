<svg viewBox="0 0 750 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Cost Optimization Playbook</text>
  <!-- Strategy 1 -->
  <rect x="40" y="55" width="320" height="90" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="200" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">1. Model Selection</text>
  <text x="200" y="100" text-anchor="middle" font-size="11" fill="#555">gpt-4o-mini for simple tasks (20x cheaper)</text>
  <text x="200" y="118" text-anchor="middle" font-size="11" fill="#555">Reserve gpt-4o for complex reasoning</text>
  <!-- Strategy 2 -->
  <rect x="390" y="55" width="320" height="90" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="550" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">2. Prompt Optimization</text>
  <text x="550" y="100" text-anchor="middle" font-size="11" fill="#555">Shorter prompts = fewer input tokens</text>
  <text x="550" y="118" text-anchor="middle" font-size="11" fill="#555">Cache system prompts when possible</text>
  <!-- Strategy 3 -->
  <rect x="40" y="165" width="320" height="90" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="200" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">3. Max Tokens</text>
  <text x="200" y="210" text-anchor="middle" font-size="11" fill="#555">Set appropriate limits</text>
  <text x="200" y="228" text-anchor="middle" font-size="11" fill="#555">Don't default to 4096</text>
  <!-- Strategy 4 -->
  <rect x="390" y="165" width="320" height="90" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="550" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">4. Response Caching</text>
  <text x="550" y="210" text-anchor="middle" font-size="11" fill="#555">Cache identical requests</text>
  <text x="550" y="228" text-anchor="middle" font-size="11" fill="#555">(deterministic at temp=0)</text>
  <!-- Strategy 5 -->
  <rect x="40" y="275" width="320" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="200" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">5. Batching</text>
  <text x="200" y="320" text-anchor="middle" font-size="11" fill="#555">Use batch API for non-urgent requests</text>
  <text x="200" y="338" text-anchor="middle" font-size="11" fill="#28a745">(50% off)</text>
  <!-- Strategy 6 -->
  <rect x="390" y="275" width="320" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="550" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">6. Prompt Caching</text>
  <text x="550" y="320" text-anchor="middle" font-size="11" fill="#555">Reuse system prompts across requests</text>
  <text x="550" y="338" text-anchor="middle" font-size="11" fill="#28a745">(50% off)</text>
</svg>
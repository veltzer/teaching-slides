<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.1124" font-weight="bold" fill="var(--text)">Cost Optimization Playbook</text>
  <rect x="40" y="83.2835" width="573.1343" height="155.8209" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.5671" y="123.1045" text-anchor="middle" font-size="22.8413" font-weight="bold" fill="var(--ok-accent)">1. Model Selection</text>
  <text x="326.5671" y="161.194" text-anchor="middle" font-size="19.3272" fill="var(--text-muted)">gpt-4o-mini for simple tasks (20x cheaper)</text>
  <text x="326.5671" y="192.3582" text-anchor="middle" font-size="19.3272" fill="var(--text-muted)">Reserve gpt-4o for complex reasoning</text>
  <rect x="666.8657" y="83.2835" width="573.1343" height="155.8209" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.4329" y="123.1045" text-anchor="middle" font-size="22.8413" font-weight="bold" fill="var(--ok-accent)">2. Prompt Optimization</text>
  <text x="953.4329" y="161.194" text-anchor="middle" font-size="19.3272" fill="var(--text-muted)">Shorter prompts = fewer input tokens</text>
  <text x="953.4329" y="192.3582" text-anchor="middle" font-size="19.3272" fill="var(--text-muted)">Cache system prompts when possible</text>
  <rect x="40" y="273.7313" width="573.1343" height="155.8209" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.5671" y="313.5522" text-anchor="middle" font-size="22.8413" font-weight="bold" fill="var(--danger-accent)">3. Max Tokens</text>
  <text x="326.5671" y="351.6418" text-anchor="middle" font-size="19.3272" fill="var(--text-muted)">Set appropriate limits</text>
  <text x="326.5671" y="382.8059" text-anchor="middle" font-size="19.3272" fill="var(--text-muted)">Don't default to 4096</text>
  <rect x="666.8657" y="273.7313" width="573.1343" height="155.8209" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.4329" y="313.5522" text-anchor="middle" font-size="22.8413" font-weight="bold" fill="var(--danger-accent)">4. Response Caching</text>
  <text x="953.4329" y="351.6418" text-anchor="middle" font-size="19.3272" fill="var(--text-muted)">Cache identical requests</text>
  <text x="953.4329" y="382.8059" text-anchor="middle" font-size="19.3272" fill="var(--text-muted)">(deterministic at temp=0)</text>
  <rect x="40" y="464.1791" width="573.1343" height="155.8209" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.5671" y="503.9999" text-anchor="middle" font-size="22.8413" font-weight="bold" fill="var(--primary-accent)">5. Batching</text>
  <text x="326.5671" y="542.0895" text-anchor="middle" font-size="19.3272" fill="var(--text-muted)">Use batch API for non-urgent requests</text>
  <text x="326.5671" y="573.2537" text-anchor="middle" font-size="19.3272" fill="var(--ok-accent)">(50% off)</text>
  <rect x="666.8657" y="464.1791" width="573.1343" height="155.8209" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.4329" y="503.9999" text-anchor="middle" font-size="22.8413" font-weight="bold" fill="var(--primary-accent)">6. Prompt Caching</text>
  <text x="953.4329" y="542.0895" text-anchor="middle" font-size="19.3272" fill="var(--text-muted)">Reuse system prompts across requests</text>
  <text x="953.4329" y="573.2537" text-anchor="middle" font-size="19.3272" fill="var(--ok-accent)">(50% off)</text>
</svg>
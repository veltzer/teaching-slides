  <ns0:text x="64.2905" y="392.6051" font-size="27.8593" fill="#222">4.  Building a custom database interface</ns0:text>
  <ns0:text x="42.8603" y="580.8403" font-size="27.8593" fill="#222" font-weight="bold">Goal:</ns0:text>
  <ns0:text x="150.0113" y="580.8403" font-size="27.8593" fill="#222">Build systems where LLMs can remember</ns0:text>

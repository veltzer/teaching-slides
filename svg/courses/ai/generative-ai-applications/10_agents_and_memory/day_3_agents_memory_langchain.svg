  <ns0:text x="64.2905" y="198.9916" font-size="27.8593" fill="#222">1.  What are AI agents?</ns0:text>
  <ns0:text x="64.2905" y="263.5294" font-size="27.8593" fill="#222">2.  Memory systems for LLMs</ns0:text>

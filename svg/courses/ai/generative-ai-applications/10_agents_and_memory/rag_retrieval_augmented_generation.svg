<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="61.8181" y="40" font-size="16.2128" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">User Query:</text>
  <text x="301.8182" y="40" font-size="16.2128" fill="var(--text-muted)" font-family="Arial, sans-serif">"What were Q3 results?"</text>
  <line x1="140.3636" y1="47.3418" x2="140.3636" y2="76.7088" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arrow)"/>
  <rect x="40" y="80.3798" width="436.3636" height="61.1814" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="258.1818" y="108.5232" font-size="16.2128" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">1. EMBED query</text>
  <line x1="476.3636" y1="110.9704" x2="515.6363" y2="110.9704" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arrow)"/>
  <text x="530.9091" y="115.865" font-size="14.9657" fill="var(--text-muted)" font-family="Arial, sans-serif">[0.12, -0.34, ...]</text>
  <line x1="258.1818" y1="141.5612" x2="258.1818" y2="181.941" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arrow)"/>
  <rect x="40" y="186.8354" width="436.3636" height="73.4178" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="258.1818" y="214.9789" font-size="16.2128" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">2. SEARCH vector</text>
  <text x="258.1818" y="237.0042" font-size="16.2128" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">database</text>
  <line x1="476.3636" y1="223.5443" x2="515.6363" y2="223.5443" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arrow)"/>
  <text x="530.9091" y="228.4388" font-size="14.9657" fill="var(--text-muted)" font-family="Arial, sans-serif">Find similar docs</text>
  <line x1="258.1818" y1="260.2532" x2="258.1818" y2="301.8566" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arrow)"/>
  <rect x="40" y="306.751" width="436.3636" height="73.4178" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="258.1818" y="334.8946" font-size="16.2128" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">3. RETRIEVE top</text>
  <text x="258.1818" y="356.9198" font-size="16.2128" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">k documents</text>
  <line x1="476.3636" y1="331.2236" x2="515.6363" y2="331.2236" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arrow)"/>
  <text x="530.9091" y="326.3292" font-size="14.9657" fill="var(--text-muted)" font-family="Arial, sans-serif">"Q3 revenue was $4.2M..."</text>
  <text x="530.9091" y="345.9072" font-size="14.9657" fill="var(--text-muted)" font-family="Arial, sans-serif">"Operating costs were..."</text>
  <line x1="258.1818" y1="380.1688" x2="258.1818" y2="421.7722" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arrow)"/>
  <rect x="40" y="426.6666" width="436.3636" height="73.4178" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="258.1818" y="454.8102" font-size="16.2128" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">4. GENERATE</text>
  <text x="258.1818" y="476.8354" font-size="16.2128" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">response</text>
  <line x1="476.3636" y1="463.3756" x2="515.6363" y2="463.3756" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arrow)"/>
  <text x="530.9091" y="458.481" font-size="14.9657" fill="var(--text-muted)" font-family="Arial, sans-serif">Context + Query → LLM → Response</text>
  <line x1="258.1818" y1="500.0844" x2="258.1818" y2="541.6878" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arrow)"/>
  <rect x="40" y="546.5822" width="1200" height="73.4178" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="83.6363" y="578.3966" font-size="14.9657" fill="var(--text)" font-family="Arial, sans-serif">"Based on Q3 reports, revenue was $4.2M,</text>
  <text x="83.6363" y="600.422" font-size="14.9657" fill="var(--text)" font-family="Arial, sans-serif">up 15% from Q2..."</text>
</svg>

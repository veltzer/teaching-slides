<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arr" markerWidth="17.6552" markerHeight="7.7143" refX="17.6552" refY="3.8571" orient="auto">
      <polygon points="0,10.2857 6.6207,0" fill="#555" />
    </marker>
  </defs>
  <text x="44.1379" y="28.2857" font-size="16.7143" fill="#222" font-weight="bold">User Query:</text>
  <text x="286.8966" y="28.2857" font-size="16.7143" fill="#555">"What were Q3 results?"</text>
  <line x1="123.5862" y1="36" x2="123.5862" y2="66.8571" stroke="#555" stroke-width="1.9286" marker-end="url(#arr)" />
  <rect x="22.069" y="70.7143" width="441.3793" height="64.2857" rx="5.1429" fill="#e3f2fd" stroke="#333" stroke-width="1.9286" />
  <text x="242.7586" y="100.2857" font-size="16.7143" fill="#222" text-anchor="middle" font-weight="bold">1. EMBED query</text>
  <line x1="463.4483" y1="102.8571" x2="503.1724" y2="102.8571" stroke="#555" stroke-width="1.9286" marker-end="url(#arr)" />
  <text x="518.6207" y="108" font-size="15.4286" fill="#555">[0.12, -0.34, ...]</text>
  <line x1="242.7586" y1="135" x2="242.7586" y2="177.4286" stroke="#555" stroke-width="1.9286" marker-end="url(#arr)" />
  <rect x="22.069" y="182.5714" width="441.3793" height="77.1429" rx="5.1429" fill="#e3f2fd" stroke="#333" stroke-width="1.9286" />
  <text x="242.7586" y="212.1429" font-size="16.7143" fill="#222" text-anchor="middle" font-weight="bold">2. SEARCH vector</text>
  <text x="242.7586" y="235.2857" font-size="16.7143" fill="#222" text-anchor="middle">database</text>
  <line x1="463.4483" y1="221.1429" x2="503.1724" y2="221.1429" stroke="#555" stroke-width="1.9286" marker-end="url(#arr)" />
  <text x="518.6207" y="226.2857" font-size="15.4286" fill="#555">Find similar docs</text>
  <line x1="242.7586" y1="259.7143" x2="242.7586" y2="303.4286" stroke="#555" stroke-width="1.9286" marker-end="url(#arr)" />
  <rect x="22.069" y="308.5714" width="441.3793" height="77.1429" rx="5.1429" fill="#e3f2fd" stroke="#333" stroke-width="1.9286" />
  <text x="242.7586" y="338.1429" font-size="16.7143" fill="#222" text-anchor="middle" font-weight="bold">3. RETRIEVE top</text>
  <text x="242.7586" y="361.2857" font-size="16.7143" fill="#222" text-anchor="middle">k documents</text>
  <line x1="463.4483" y1="334.2857" x2="503.1724" y2="334.2857" stroke="#555" stroke-width="1.9286" marker-end="url(#arr)" />
  <text x="518.6207" y="329.1429" font-size="15.4286" fill="#555">"Q3 revenue was $4.2M..."</text>
  <text x="518.6207" y="349.7143" font-size="15.4286" fill="#555">"Operating costs were..."</text>
  <line x1="242.7586" y1="385.7143" x2="242.7586" y2="429.4286" stroke="#555" stroke-width="1.9286" marker-end="url(#arr)" />
  <rect x="22.069" y="434.5714" width="441.3793" height="77.1429" rx="5.1429" fill="#e8f5e9" stroke="#333" stroke-width="1.9286" />
  <text x="242.7586" y="464.1429" font-size="16.7143" fill="#222" text-anchor="middle" font-weight="bold">4. GENERATE</text>
  <text x="242.7586" y="487.2857" font-size="16.7143" fill="#222" text-anchor="middle">response</text>
  <line x1="463.4483" y1="473.1429" x2="503.1724" y2="473.1429" stroke="#555" stroke-width="1.9286" marker-end="url(#arr)" />
  <text x="518.6207" y="468" font-size="15.4286" fill="#555">Context + Query → LLM → Response</text>
  <line x1="242.7586" y1="511.7143" x2="242.7586" y2="555.4286" stroke="#555" stroke-width="1.9286" marker-end="url(#arr)" />
  <rect x="22.069" y="560.5714" width="1213.7931" height="77.1429" rx="5.1429" fill="#fff3e0" stroke="#e65100" stroke-width="1.9286" />
  <text x="66.2069" y="594" font-size="15.4286" fill="#222">"Based on Q3 reports, revenue was $4.2M,</text>
  <text x="66.2069" y="617.1429" font-size="15.4286" fill="#222">up 15% from Q2..."</text>
</svg>
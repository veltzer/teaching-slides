<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,10.2857 6.6207,0" fill="#555" />
    </marker>
  </defs>
  <text x="61.8181" y="40" font-size="16.2128" fill="var(--text)" font-weight="bold">User Query:</text>
  <text x="301.8182" y="40" font-size="16.2128" fill="var(--text-muted)">"What were Q3 results?"</text>
  <line x1="140.3636" y1="47.3418" x2="140.3636" y2="76.7088" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arr)" />
  <rect x="40" y="80.3798" width="436.3636" height="61.1814" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="258.1818" y="108.5232" font-size="16.2128" fill="var(--text)" text-anchor="middle" font-weight="bold">1. EMBED query</text>
  <line x1="476.3636" y1="110.9704" x2="515.6363" y2="110.9704" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arr)" />
  <text x="530.9091" y="115.865" font-size="14.9657" fill="var(--text-muted)">[0.12, -0.34, ...]</text>
  <line x1="258.1818" y1="141.5612" x2="258.1818" y2="181.941" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arr)" />
  <rect x="40" y="186.8354" width="436.3636" height="73.4178" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="258.1818" y="214.9789" font-size="16.2128" fill="var(--text)" text-anchor="middle" font-weight="bold">2. SEARCH vector</text>
  <text x="258.1818" y="237.0042" font-size="16.2128" fill="var(--text)" text-anchor="middle">database</text>
  <line x1="476.3636" y1="223.5443" x2="515.6363" y2="223.5443" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arr)" />
  <text x="530.9091" y="228.4388" font-size="14.9657" fill="var(--text-muted)">Find similar docs</text>
  <line x1="258.1818" y1="260.2532" x2="258.1818" y2="301.8566" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arr)" />
  <rect x="40" y="306.751" width="436.3636" height="73.4178" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="258.1818" y="334.8946" font-size="16.2128" fill="var(--text)" text-anchor="middle" font-weight="bold">3. RETRIEVE top</text>
  <text x="258.1818" y="356.9198" font-size="16.2128" fill="var(--text)" text-anchor="middle">k documents</text>
  <line x1="476.3636" y1="331.2236" x2="515.6363" y2="331.2236" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arr)" />
  <text x="530.9091" y="326.3292" font-size="14.9657" fill="var(--text-muted)">"Q3 revenue was $4.2M..."</text>
  <text x="530.9091" y="345.9072" font-size="14.9657" fill="var(--text-muted)">"Operating costs were..."</text>
  <line x1="258.1818" y1="380.1688" x2="258.1818" y2="421.7722" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arr)" />
  <rect x="40" y="426.6666" width="436.3636" height="73.4178" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="258.1818" y="454.8102" font-size="16.2128" fill="var(--text)" text-anchor="middle" font-weight="bold">4. GENERATE</text>
  <text x="258.1818" y="476.8354" font-size="16.2128" fill="var(--text)" text-anchor="middle">response</text>
  <line x1="476.3636" y1="463.3756" x2="515.6363" y2="463.3756" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arr)" />
  <text x="530.9091" y="458.481" font-size="14.9657" fill="var(--text-muted)">Context + Query → LLM → Response</text>
  <line x1="258.1818" y1="500.0844" x2="258.1818" y2="541.6878" stroke="var(--text-muted)" stroke-width="1.9286" marker-end="url(#arr)" />
  <rect x="40" y="546.5822" width="1200" height="73.4178" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="83.6363" y="578.3966" font-size="14.9657" fill="var(--text)">"Based on Q3 reports, revenue was $4.2M,</text>
  <text x="83.6363" y="600.422" font-size="14.9657" fill="var(--text)">up 15% from Q2..."</text>
</svg>
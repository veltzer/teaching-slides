<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="9.3142" y="9.6677" width="1136.3363" height="630.3323" rx="7.4514" fill="var(--surface)" stroke="var(--text-dark)" stroke-width="2.7943" />
  <text x="577.4824" y="58.006" font-size="26.0798" fill="var(--text-darker)" text-anchor="middle" font-weight="bold">PLANNING STRATEGIES</text>
  <line x1="9.3142" y1="73.4743" x2="1145.6505" y2="73.4743" stroke="var(--text-dark)" stroke-width="1.8628" />
  <line x1="288.7412" y1="9.6677" x2="288.7412" y2="640" stroke="var(--text-dark)" stroke-width="1.8628" />
  <rect x="11.1771" y="75.4078" width="275.7013" height="137.281" fill="var(--primary-pale)" stroke="none" />
  <rect x="290.604" y="75.4078" width="853.1837" height="137.281" fill="var(--primary-pale)" stroke="none" />
  <line x1="9.3142" y1="212.6888" x2="1145.6505" y2="212.6888" stroke="var(--border-strong)" stroke-width="1.8628" />
  <text x="26.0798" y="154.6828" font-size="24.217" fill="var(--text-darker)" font-weight="bold">ReAct</text>
  <text x="309.2325" y="123.7463" font-size="22.3542" fill="var(--text-muted)">Interleave reasoning and actions</text>
  <text x="309.2325" y="154.6828" font-size="22.3542" fill="var(--text-muted)">Thought → Action → Observation</text>
  <text x="309.2325" y="185.6194" font-size="22.3542" fill="var(--text-muted)">Simple, effective for most tasks</text>
  <rect x="11.1771" y="214.6223" width="275.7013" height="137.281" fill="var(--warn-pale)" stroke="none" />
  <rect x="290.604" y="214.6223" width="853.1837" height="137.281" fill="var(--warn-pale)" stroke="none" />
  <line x1="9.3142" y1="351.9033" x2="1145.6505" y2="351.9033" stroke="var(--border-strong)" stroke-width="1.8628" />
  <text x="26.0798" y="278.429" font-size="24.217" fill="var(--text-darker)" font-weight="bold">Plan-and-</text>
  <text x="26.0798" y="309.3655" font-size="24.217" fill="var(--text-darker)" font-weight="bold">Execute</text>
  <text x="309.2325" y="262.9608" font-size="22.3542" fill="var(--text-muted)">Create full plan first, then execute</text>
  <text x="309.2325" y="293.8973" font-size="22.3542" fill="var(--text-muted)">Better for complex multi-step tasks</text>
  <text x="309.2325" y="324.8338" font-size="22.3542" fill="var(--text-muted)">Can revise plan based on results</text>
  <rect x="11.1771" y="353.8369" width="275.7013" height="137.281" fill="var(--primary-pale)" stroke="none" />
  <rect x="290.604" y="353.8369" width="853.1837" height="137.281" fill="var(--primary-pale)" stroke="none" />
  <line x1="9.3142" y1="491.1178" x2="1145.6505" y2="491.1178" stroke="var(--border-strong)" stroke-width="1.8628" />
  <text x="26.0798" y="433.1118" font-size="24.217" fill="var(--text-darker)" font-weight="bold">Reflexion</text>
  <text x="309.2325" y="402.1752" font-size="22.3542" fill="var(--text-muted)">Agent reflects on past attempts</text>
  <text x="309.2325" y="433.1118" font-size="22.3542" fill="var(--text-muted)">Learns from mistakes in-context</text>
  <text x="309.2325" y="464.0483" font-size="22.3542" fill="var(--text-muted)">Good for trial-and-error tasks</text>
  <rect x="11.1771" y="493.0514" width="275.7013" height="137.281" fill="var(--warn-pale)" stroke="none" />
  <rect x="290.604" y="493.0514" width="853.1837" height="137.281" fill="var(--warn-pale)" stroke="none" />
  <line x1="9.3142" y1="630.3323" x2="1145.6505" y2="630.3323" stroke="var(--border-strong)" stroke-width="1.8628" />
  <text x="26.0798" y="525.9214" font-size="24.217" fill="var(--text-darker)" font-weight="bold">LATS</text>
  <text x="26.0798" y="556.8581" font-size="24.217" fill="var(--text-darker)" font-weight="bold">(Language</text>
  <text x="26.0798" y="587.7946" font-size="24.217" fill="var(--text-darker)" font-weight="bold">Agent Tree</text>
  <text x="26.0798" y="618.7311" font-size="24.217" fill="var(--text-darker)" font-weight="bold">Search)</text>
  <text x="309.2325" y="541.3897" font-size="22.3542" fill="var(--text-muted)">Tree search over action space</text>
  <text x="309.2325" y="572.3263" font-size="22.3542" fill="var(--text-muted)">Evaluate multiple paths</text>
  <text x="309.2325" y="603.2628" font-size="22.3542" fill="var(--text-muted)">Best for complex reasoning</text>
</svg>
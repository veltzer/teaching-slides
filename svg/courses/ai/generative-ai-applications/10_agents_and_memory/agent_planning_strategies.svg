<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="9.3142" y="9.6677" width="1136.3363" height="630.3323" rx="7.4514" fill="#f5f5f5" stroke="#333" stroke-width="2.7943" />
  <ns0:text x="577.4824" y="58.006" font-size="26.0798" fill="#222" text-anchor="middle" font-weight="bold">PLANNING STRATEGIES</ns0:text>
  <ns0:line x1="9.3142" y1="73.4743" x2="1145.6505" y2="73.4743" stroke="#333" stroke-width="1.8628" />
  <ns0:line x1="288.7412" y1="9.6677" x2="288.7412" y2="640" stroke="#333" stroke-width="1.8628" />
  <ns0:rect x="11.1771" y="75.4078" width="275.7013" height="137.281" fill="#e3f2fd" stroke="none" />
  <ns0:rect x="290.604" y="75.4078" width="853.1837" height="137.281" fill="#e3f2fd" stroke="none" />
  <ns0:line x1="9.3142" y1="212.6888" x2="1145.6505" y2="212.6888" stroke="#bdbdbd" stroke-width="1.8628" />
  <ns0:text x="26.0798" y="154.6828" font-size="24.217" fill="#222" font-weight="bold">ReAct</ns0:text>
  <ns0:text x="309.2325" y="123.7463" font-size="22.3542" fill="#555">Interleave reasoning and actions</ns0:text>
  <ns0:text x="309.2325" y="154.6828" font-size="22.3542" fill="#555">Thought → Action → Observation</ns0:text>
  <ns0:text x="309.2325" y="185.6194" font-size="22.3542" fill="#555">Simple, effective for most tasks</ns0:text>
  <ns0:rect x="11.1771" y="214.6223" width="275.7013" height="137.281" fill="#fff3e0" stroke="none" />
  <ns0:rect x="290.604" y="214.6223" width="853.1837" height="137.281" fill="#fff3e0" stroke="none" />
  <ns0:line x1="9.3142" y1="351.9033" x2="1145.6505" y2="351.9033" stroke="#bdbdbd" stroke-width="1.8628" />
  <ns0:text x="26.0798" y="278.429" font-size="24.217" fill="#222" font-weight="bold">Plan-and-</ns0:text>
  <ns0:text x="26.0798" y="309.3655" font-size="24.217" fill="#222" font-weight="bold">Execute</ns0:text>
  <ns0:text x="309.2325" y="262.9608" font-size="22.3542" fill="#555">Create full plan first, then execute</ns0:text>
  <ns0:text x="309.2325" y="293.8973" font-size="22.3542" fill="#555">Better for complex multi-step tasks</ns0:text>
  <ns0:text x="309.2325" y="324.8338" font-size="22.3542" fill="#555">Can revise plan based on results</ns0:text>
  <ns0:rect x="11.1771" y="353.8369" width="275.7013" height="137.281" fill="#e3f2fd" stroke="none" />
  <ns0:rect x="290.604" y="353.8369" width="853.1837" height="137.281" fill="#e3f2fd" stroke="none" />
  <ns0:line x1="9.3142" y1="491.1178" x2="1145.6505" y2="491.1178" stroke="#bdbdbd" stroke-width="1.8628" />
  <ns0:text x="26.0798" y="433.1118" font-size="24.217" fill="#222" font-weight="bold">Reflexion</ns0:text>
  <ns0:text x="309.2325" y="402.1752" font-size="22.3542" fill="#555">Agent reflects on past attempts</ns0:text>
  <ns0:text x="309.2325" y="433.1118" font-size="22.3542" fill="#555">Learns from mistakes in-context</ns0:text>
  <ns0:text x="309.2325" y="464.0483" font-size="22.3542" fill="#555">Good for trial-and-error tasks</ns0:text>
  <ns0:rect x="11.1771" y="493.0514" width="275.7013" height="137.281" fill="#fff3e0" stroke="none" />
  <ns0:rect x="290.604" y="493.0514" width="853.1837" height="137.281" fill="#fff3e0" stroke="none" />
  <ns0:line x1="9.3142" y1="630.3323" x2="1145.6505" y2="630.3323" stroke="#bdbdbd" stroke-width="1.8628" />
  <ns0:text x="26.0798" y="525.9214" font-size="24.217" fill="#222" font-weight="bold">LATS</ns0:text>
  <ns0:text x="26.0798" y="556.8581" font-size="24.217" fill="#222" font-weight="bold">(Language</ns0:text>
  <ns0:text x="26.0798" y="587.7946" font-size="24.217" fill="#222" font-weight="bold">Agent Tree</ns0:text>
  <ns0:text x="26.0798" y="618.7311" font-size="24.217" fill="#222" font-weight="bold">Search)</ns0:text>
  <ns0:text x="309.2325" y="541.3897" font-size="22.3542" fill="#555">Tree search over action space</ns0:text>
  <ns0:text x="309.2325" y="572.3263" font-size="22.3542" fill="#555">Evaluate multiple paths</ns0:text>
  <ns0:text x="309.2325" y="603.2628" font-size="22.3542" fill="#555">Best for complex reasoning</ns0:text>
</ns0:svg>
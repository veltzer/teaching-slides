<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="84.4785" font-size="25.7081" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">PLANNING STRATEGIES</text>
  <line x1="40" y1="98.7116" x2="1240" y2="98.7116" stroke="var(--text)" stroke-width="1.8628"/>
  <line x1="335.082" y1="40" x2="335.082" y2="620" stroke="var(--text)" stroke-width="1.8628"/>
  <rect x="41.9673" y="100.4907" width="291.1476" height="126.3191" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="337.0492" y="100.4907" width="900.9837" height="126.3191" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="226.8098" x2="1240" y2="226.8098" stroke="var(--border)" stroke-width="1.8628"/>
  <text x="57.7049" y="173.4356" font-size="23.8719" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">ReAct</text>
  <text x="356.7213" y="144.9694" font-size="22.0356" fill="var(--text-muted)" font-family="Arial, sans-serif">Interleave reasoning and actions</text>
  <text x="356.7213" y="173.4356" font-size="22.0356" fill="var(--text-muted)" font-family="Arial, sans-serif">Thought → Action → Observation</text>
  <text x="356.7213" y="201.9019" font-size="22.0356" fill="var(--text-muted)" font-family="Arial, sans-serif">Simple, effective for most tasks</text>
  <rect x="41.9673" y="228.5889" width="291.1476" height="126.3191" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="337.0492" y="228.5889" width="900.9837" height="126.3191" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="354.9079" x2="1240" y2="354.9079" stroke="var(--border)" stroke-width="1.8628"/>
  <text x="57.7049" y="287.3006" font-size="23.8719" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Plan-and-</text>
  <text x="57.7049" y="315.7668" font-size="23.8719" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Execute</text>
  <text x="356.7213" y="273.0675" font-size="22.0356" fill="var(--text-muted)" font-family="Arial, sans-serif">Create full plan first, then execute</text>
  <text x="356.7213" y="301.5337" font-size="22.0356" fill="var(--text-muted)" font-family="Arial, sans-serif">Better for complex multi-step tasks</text>
  <text x="356.7213" y="330" font-size="22.0356" fill="var(--text-muted)" font-family="Arial, sans-serif">Can revise plan based on results</text>
  <rect x="41.9673" y="356.6871" width="291.1476" height="126.3191" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="337.0492" y="356.6871" width="900.9837" height="126.3191" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="483.0061" x2="1240" y2="483.0061" stroke="var(--border)" stroke-width="1.8628"/>
  <text x="57.7049" y="429.6319" font-size="23.8719" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Reflexion</text>
  <text x="356.7213" y="401.1656" font-size="22.0356" fill="var(--text-muted)" font-family="Arial, sans-serif">Agent reflects on past attempts</text>
  <text x="356.7213" y="429.6319" font-size="22.0356" fill="var(--text-muted)" font-family="Arial, sans-serif">Learns from mistakes in-context</text>
  <text x="356.7213" y="458.0981" font-size="22.0356" fill="var(--text-muted)" font-family="Arial, sans-serif">Good for trial-and-error tasks</text>
  <rect x="41.9673" y="484.7853" width="291.1476" height="126.3191" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="337.0492" y="484.7853" width="900.9837" height="126.3191" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="611.1043" x2="1240" y2="611.1043" stroke="var(--border)" stroke-width="1.8628"/>
  <text x="57.7049" y="515.0306" font-size="23.8719" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">LATS</text>
  <text x="57.7049" y="543.497" font-size="23.8719" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">(Language</text>
  <text x="57.7049" y="571.9632" font-size="23.8719" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Agent Tree</text>
  <text x="57.7049" y="600.4294" font-size="23.8719" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Search)</text>
  <text x="356.7213" y="529.2638" font-size="22.0356" fill="var(--text-muted)" font-family="Arial, sans-serif">Tree search over action space</text>
  <text x="356.7213" y="557.7301" font-size="22.0356" fill="var(--text-muted)" font-family="Arial, sans-serif">Evaluate multiple paths</text>
  <text x="356.7213" y="586.1963" font-size="22.0356" fill="var(--text-muted)" font-family="Arial, sans-serif">Best for complex reasoning</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="9.3142" y="9.6677" width="1136.3363" height="630.3323" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="577.4824" y="58.006" font-size="26.0798" fill="var(--text)" text-anchor="middle" font-weight="bold">PLANNING STRATEGIES</text>
  <line x1="9.3142" y1="73.4743" x2="1145.6505" y2="73.4743" stroke="var(--text)" stroke-width="1.8628" />
  <line x1="288.7412" y1="9.6677" x2="288.7412" y2="640" stroke="var(--text)" stroke-width="1.8628" />
  <rect x="11.1771" y="75.4078" width="275.7013" height="137.281" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <rect x="290.604" y="75.4078" width="853.1837" height="137.281" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <line x1="9.3142" y1="212.6888" x2="1145.6505" y2="212.6888" stroke="var(--border)" stroke-width="1.8628" />
  <text x="26.0798" y="154.6828" font-size="24.217" fill="var(--text)" font-weight="bold">ReAct</text>
  <text x="309.2325" y="123.7463" font-size="22.3542" fill="var(--text-muted)">Interleave reasoning and actions</text>
  <text x="309.2325" y="154.6828" font-size="22.3542" fill="var(--text-muted)">Thought → Action → Observation</text>
  <text x="309.2325" y="185.6194" font-size="22.3542" fill="var(--text-muted)">Simple, effective for most tasks</text>
  <rect x="11.1771" y="214.6223" width="275.7013" height="137.281" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <rect x="290.604" y="214.6223" width="853.1837" height="137.281" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <line x1="9.3142" y1="351.9033" x2="1145.6505" y2="351.9033" stroke="var(--border)" stroke-width="1.8628" />
  <text x="26.0798" y="278.429" font-size="24.217" fill="var(--text)" font-weight="bold">Plan-and-</text>
  <text x="26.0798" y="309.3655" font-size="24.217" fill="var(--text)" font-weight="bold">Execute</text>
  <text x="309.2325" y="262.9608" font-size="22.3542" fill="var(--text-muted)">Create full plan first, then execute</text>
  <text x="309.2325" y="293.8973" font-size="22.3542" fill="var(--text-muted)">Better for complex multi-step tasks</text>
  <text x="309.2325" y="324.8338" font-size="22.3542" fill="var(--text-muted)">Can revise plan based on results</text>
  <rect x="11.1771" y="353.8369" width="275.7013" height="137.281" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <rect x="290.604" y="353.8369" width="853.1837" height="137.281" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <line x1="9.3142" y1="491.1178" x2="1145.6505" y2="491.1178" stroke="var(--border)" stroke-width="1.8628" />
  <text x="26.0798" y="433.1118" font-size="24.217" fill="var(--text)" font-weight="bold">Reflexion</text>
  <text x="309.2325" y="402.1752" font-size="22.3542" fill="var(--text-muted)">Agent reflects on past attempts</text>
  <text x="309.2325" y="433.1118" font-size="22.3542" fill="var(--text-muted)">Learns from mistakes in-context</text>
  <text x="309.2325" y="464.0483" font-size="22.3542" fill="var(--text-muted)">Good for trial-and-error tasks</text>
  <rect x="11.1771" y="493.0514" width="275.7013" height="137.281" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <rect x="290.604" y="493.0514" width="853.1837" height="137.281" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <line x1="9.3142" y1="630.3323" x2="1145.6505" y2="630.3323" stroke="var(--border)" stroke-width="1.8628" />
  <text x="26.0798" y="525.9214" font-size="24.217" fill="var(--text)" font-weight="bold">LATS</text>
  <text x="26.0798" y="556.8581" font-size="24.217" fill="var(--text)" font-weight="bold">(Language</text>
  <text x="26.0798" y="587.7946" font-size="24.217" fill="var(--text)" font-weight="bold">Agent Tree</text>
  <text x="26.0798" y="618.7311" font-size="24.217" fill="var(--text)" font-weight="bold">Search)</text>
  <text x="309.2325" y="541.3897" font-size="22.3542" fill="var(--text-muted)">Tree search over action space</text>
  <text x="309.2325" y="572.3263" font-size="22.3542" fill="var(--text-muted)">Evaluate multiple paths</text>
  <text x="309.2325" y="603.2628" font-size="22.3542" fill="var(--text-muted)">Best for complex reasoning</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.0001" y="84.4785" font-size="25.7081" fill="var(--text)" text-anchor="middle" font-weight="bold">PLANNING STRATEGIES</text>
  <line x1="40" y1="98.7116" x2="1240" y2="98.7116" stroke="var(--text)" stroke-width="1.8628" />
  <line x1="335.082" y1="40" x2="335.082" y2="620" stroke="var(--text)" stroke-width="1.8628" />
  <rect x="41.9673" y="100.4907" width="291.1476" height="126.3191" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <rect x="337.0492" y="100.4907" width="900.9837" height="126.3191" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <line x1="40" y1="226.8098" x2="1240" y2="226.8098" stroke="var(--border)" stroke-width="1.8628" />
  <text x="57.7049" y="173.4356" font-size="23.8719" fill="var(--text)" font-weight="bold">ReAct</text>
  <text x="356.7213" y="144.9694" font-size="22.0356" fill="var(--text-muted)">Interleave reasoning and actions</text>
  <text x="356.7213" y="173.4356" font-size="22.0356" fill="var(--text-muted)">Thought → Action → Observation</text>
  <text x="356.7213" y="201.9019" font-size="22.0356" fill="var(--text-muted)">Simple, effective for most tasks</text>
  <rect x="41.9673" y="228.5889" width="291.1476" height="126.3191" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <rect x="337.0492" y="228.5889" width="900.9837" height="126.3191" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <line x1="40" y1="354.9079" x2="1240" y2="354.9079" stroke="var(--border)" stroke-width="1.8628" />
  <text x="57.7049" y="287.3006" font-size="23.8719" fill="var(--text)" font-weight="bold">Plan-and-</text>
  <text x="57.7049" y="315.7668" font-size="23.8719" fill="var(--text)" font-weight="bold">Execute</text>
  <text x="356.7213" y="273.0675" font-size="22.0356" fill="var(--text-muted)">Create full plan first, then execute</text>
  <text x="356.7213" y="301.5337" font-size="22.0356" fill="var(--text-muted)">Better for complex multi-step tasks</text>
  <text x="356.7213" y="330" font-size="22.0356" fill="var(--text-muted)">Can revise plan based on results</text>
  <rect x="41.9673" y="356.6871" width="291.1476" height="126.3191" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <rect x="337.0492" y="356.6871" width="900.9837" height="126.3191" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <line x1="40" y1="483.0061" x2="1240" y2="483.0061" stroke="var(--border)" stroke-width="1.8628" />
  <text x="57.7049" y="429.6319" font-size="23.8719" fill="var(--text)" font-weight="bold">Reflexion</text>
  <text x="356.7213" y="401.1656" font-size="22.0356" fill="var(--text-muted)">Agent reflects on past attempts</text>
  <text x="356.7213" y="429.6319" font-size="22.0356" fill="var(--text-muted)">Learns from mistakes in-context</text>
  <text x="356.7213" y="458.0981" font-size="22.0356" fill="var(--text-muted)">Good for trial-and-error tasks</text>
  <rect x="41.9673" y="484.7853" width="291.1476" height="126.3191" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <rect x="337.0492" y="484.7853" width="900.9837" height="126.3191" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <line x1="40" y1="611.1043" x2="1240" y2="611.1043" stroke="var(--border)" stroke-width="1.8628" />
  <text x="57.7049" y="515.0306" font-size="23.8719" fill="var(--text)" font-weight="bold">LATS</text>
  <text x="57.7049" y="543.497" font-size="23.8719" fill="var(--text)" font-weight="bold">(Language</text>
  <text x="57.7049" y="571.9632" font-size="23.8719" fill="var(--text)" font-weight="bold">Agent Tree</text>
  <text x="57.7049" y="600.4294" font-size="23.8719" fill="var(--text)" font-weight="bold">Search)</text>
  <text x="356.7213" y="529.2638" font-size="22.0356" fill="var(--text-muted)">Tree search over action space</text>
  <text x="356.7213" y="557.7301" font-size="22.0356" fill="var(--text-muted)">Evaluate multiple paths</text>
  <text x="356.7213" y="586.1963" font-size="22.0356" fill="var(--text-muted)">Best for complex reasoning</text>
</svg>
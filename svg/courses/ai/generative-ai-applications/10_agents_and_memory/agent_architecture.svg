<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.999948" y="40" font-size="20.939375" fill="var(--text)" text-anchor="middle" font-weight="bold">AGENT</text>
  <rect x="40" y="61.481444" width="1200" height="157.530889" rx="6.475761" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999948" y="94.419778" font-size="19.44369" fill="var(--text)" text-anchor="middle" font-weight="bold">LLM (Brain)</text>
  <text x="78.7096" y="128.790111" font-size="17.948005" fill="var(--text-muted)">• Understands instructions</text>
  <text x="78.7096" y="154.567889" font-size="17.948005" fill="var(--text-muted)">• Plans actions</text>
  <text x="78.7096" y="180.345667" font-size="17.948005" fill="var(--text-muted)">• Interprets tool outputs</text>
  <rect x="40" y="247.654333" width="1200" height="200.493778" rx="6.475761" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999948" y="280.592556" font-size="19.44369" fill="var(--text)" text-anchor="middle" font-weight="bold">TOOLS</text>
  <rect x="70.96768" y="297.777889" width="232.258122" height="114.567889" rx="6.475761" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.096793" y="350.765444" font-size="17.948005" fill="var(--text)" text-anchor="middle">Search</text>
  <text x="187.096793" y="376.543222" font-size="17.948005" fill="var(--text)" text-anchor="middle">Engine</text>
  <rect x="341.935401" y="297.777889" width="232.258122" height="114.567889" rx="6.475761" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="458.064515" y="350.765444" font-size="17.948005" fill="var(--text)" text-anchor="middle">Code</text>
  <text x="458.064515" y="376.543222" font-size="17.948005" fill="var(--text)" text-anchor="middle">Exec</text>
  <rect x="612.903123" y="297.777889" width="232.258122" height="114.567889" rx="6.475761" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="729.032236" y="350.765444" font-size="17.948005" fill="var(--text)" text-anchor="middle">Database</text>
  <text x="729.032236" y="376.543222" font-size="17.948005" fill="var(--text)" text-anchor="middle">Query</text>
  <rect x="883.870949" y="297.777889" width="232.258122" height="114.567889" rx="6.475761" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.999958" y="350.765444" font-size="17.948005" fill="var(--text)" text-anchor="middle">API</text>
  <text x="999.999958" y="376.543222" font-size="17.948005" fill="var(--text)" text-anchor="middle">Call</text>
  <rect x="40" y="476.790111" width="1200" height="143.209889" rx="6.475761" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999948" y="509.728333" font-size="19.44369" fill="var(--text)" text-anchor="middle" font-weight="bold">MEMORY</text>
  <text x="78.7096" y="544.098778" font-size="17.948005" fill="var(--text-muted)">Short-term:  conversation history</text>
  <text x="78.7096" y="572.740778" font-size="17.948005" fill="var(--text-muted)">Long-term:   vector database</text>
</svg>
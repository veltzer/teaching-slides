<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="163.589758367849" rx="6.599119691589" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999948" y="74.205190704532" font-size="19.814078616575" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">LLM (Brain)</text>
  <text x="78.7096" y="109.897457193884" font-size="18.289901869485" fill="var(--text-muted)" font-family="Arial, sans-serif">• Understands instructions</text>
  <text x="78.7096" y="136.666686397435" font-size="18.289901869485" fill="var(--text-muted)" font-family="Arial, sans-serif">• Plans actions</text>
  <text x="78.7096" y="163.435915600985" font-size="18.289901869485" fill="var(--text-muted)" font-family="Arial, sans-serif">• Interprets tool outputs</text>
  <rect x="40" y="233.333371756408" width="1200" height="208.205063181464" rx="6.599119691589" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999948" y="267.538447191717" font-size="19.814078616575" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">TOOLS</text>
  <rect x="70.96768" y="285.384753340227" width="232.258122" height="118.974338285011" rx="6.599119691589" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.096793" y="340.410287532148" font-size="18.289901869485" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Search</text>
  <text x="187.096793" y="367.179516735698" font-size="18.289901869485" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Engine</text>
  <rect x="341.935401" y="285.384753340227" width="232.258122" height="118.974338285011" rx="6.599119691589" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="458.064515" y="340.410287532148" font-size="18.289901869485" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Code</text>
  <text x="458.064515" y="367.179516735698" font-size="18.289901869485" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Exec</text>
  <rect x="612.903123" y="285.384753340227" width="232.258122" height="118.974338285011" rx="6.599119691589" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="729.032236" y="340.410287532148" font-size="18.289901869485" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Database</text>
  <text x="729.032236" y="367.179516735698" font-size="18.289901869485" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Query</text>
  <rect x="883.870949" y="285.384753340227" width="232.258122" height="118.974338285011" rx="6.599119691589" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.999958" y="340.410287532148" font-size="18.289901869485" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">API</text>
  <text x="999.999958" y="367.179516735698" font-size="18.289901869485" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Call</text>
  <rect x="40" y="471.28204832643" width="1200" height="148.71795167357" rx="6.599119691589" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999948" y="505.487122723278" font-size="19.814078616575" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">MEMORY</text>
  <text x="78.7096" y="541.179505520314" font-size="18.289901869485" fill="var(--text-muted)" font-family="Arial, sans-serif">Short-term:  conversation history</text>
  <text x="78.7096" y="570.923118908873" font-size="18.289901869485" fill="var(--text-muted)" font-family="Arial, sans-serif">Long-term:   vector database</text>
</svg>

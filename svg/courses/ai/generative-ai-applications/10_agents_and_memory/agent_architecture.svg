<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="72.2222" font-size="19.401" fill="var(--text)" text-anchor="middle" font-weight="bold">AGENT</text>
  <rect x="67.6923" y="91.5555" width="1144.6153" height="141.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="121.2" font-size="18.0152" fill="var(--text)" text-anchor="middle" font-weight="bold">LLM (Brain)</text>
  <text x="104.6153" y="152.1333" font-size="16.6294" fill="var(--text-muted)">• Understands instructions</text>
  <text x="104.6153" y="175.3333" font-size="16.6294" fill="var(--text-muted)">• Plans actions</text>
  <text x="104.6153" y="198.5333" font-size="16.6294" fill="var(--text-muted)">• Interprets tool outputs</text>
  <rect x="67.6923" y="259.1111" width="1144.6153" height="180.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="639.9999" y="288.7555" font-size="18.0152" fill="var(--text)" text-anchor="middle" font-weight="bold">TOOLS</text>
  <rect x="97.2307" y="304.2223" width="221.5385" height="103.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="208" y="351.9111" font-size="16.6294" fill="var(--text)" text-anchor="middle">Search</text>
  <text x="208" y="375.1111" font-size="16.6294" fill="var(--text)" text-anchor="middle">Engine</text>
  <rect x="355.6922" y="304.2223" width="221.5385" height="103.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="466.4615" y="351.9111" font-size="16.6294" fill="var(--text)" text-anchor="middle">Code</text>
  <text x="466.4615" y="375.1111" font-size="16.6294" fill="var(--text)" text-anchor="middle">Exec</text>
  <rect x="614.1537" y="304.2223" width="221.5385" height="103.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="724.923" y="351.9111" font-size="16.6294" fill="var(--text)" text-anchor="middle">Database</text>
  <text x="724.923" y="375.1111" font-size="16.6294" fill="var(--text)" text-anchor="middle">Query</text>
  <rect x="872.6153" y="304.2223" width="221.5385" height="103.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="983.3845" y="351.9111" font-size="16.6294" fill="var(--text)" text-anchor="middle">API</text>
  <text x="983.3845" y="375.1111" font-size="16.6294" fill="var(--text)" text-anchor="middle">Call</text>
  <rect x="67.6923" y="465.3333" width="1144.6153" height="128.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="639.9999" y="494.9777" font-size="18.0152" fill="var(--text)" text-anchor="middle" font-weight="bold">MEMORY</text>
  <text x="104.6153" y="525.9111" font-size="16.6294" fill="var(--text-muted)">Short-term:  conversation history</text>
  <text x="104.6153" y="551.6889" font-size="16.6294" fill="var(--text-muted)">Long-term:   vector database</text>
</svg>
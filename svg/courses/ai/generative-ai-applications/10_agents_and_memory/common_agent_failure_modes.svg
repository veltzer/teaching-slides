<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.99995" y="80.0553" font-size="24.072301" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">AGENT FAILURE MODES</text>
  <line x1="40" y1="92.8729" x2="1240" y2="92.8729" stroke="var(--text)" stroke-width="1.7439"/>
  <line x1="365.423727" y1="40" x2="365.423727" y2="620" stroke="var(--text)" stroke-width="1.7439"/>
  <rect x="42.0339" y="94.4752" width="321.356027" height="84.9171" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="367.457627" y="94.4752" width="870.508573" height="84.9171" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="179.3922" x2="1240" y2="179.3922" stroke="var(--border)" stroke-width="1.7439"/>
  <text x="58.305102" y="145.746" font-size="20.633401" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">LOOPING</text>
  <text x="387.796529" y="132.9282" font-size="20.633401" fill="var(--text)" font-family="Arial, sans-serif">Agent repeats the same action</text>
  <text x="387.796529" y="158.5635" font-size="20.633401" fill="var(--text)" font-family="Arial, sans-serif">Fix: Track action history, detect loops</text>
  <rect x="42.0339" y="180.9945" width="321.356027" height="84.9171" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="367.457627" y="180.9945" width="870.508573" height="84.9171" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="265.9116" x2="1240" y2="265.9116" stroke="var(--border)" stroke-width="1.7439"/>
  <text x="58.305102" y="219.4475" font-size="20.633401" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">HALLUCINATED</text>
  <text x="58.305102" y="245.0829" font-size="20.633401" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">TOOLS</text>
  <text x="387.796529" y="219.4475" font-size="20.633401" fill="var(--text)" font-family="Arial, sans-serif">Agent "uses" tools that don't exist</text>
  <text x="387.796529" y="245.0829" font-size="20.633401" fill="var(--text)" font-family="Arial, sans-serif">Fix: Strict tool validation</text>
  <rect x="42.0339" y="267.5138" width="321.356027" height="84.9171" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="367.457627" y="267.5138" width="870.508573" height="84.9171" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="352.431" x2="1240" y2="352.431" stroke="var(--border)" stroke-width="1.7439"/>
  <text x="58.305102" y="305.9668" font-size="20.633401" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">WRONG TOOL</text>
  <text x="58.305102" y="331.6022" font-size="20.633401" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">SELECTION</text>
  <text x="387.796529" y="305.9668" font-size="20.633401" fill="var(--text)" font-family="Arial, sans-serif">Uses search when calculator needed</text>
  <text x="387.796529" y="331.6022" font-size="20.633401" fill="var(--text)" font-family="Arial, sans-serif">Fix: Better tool descriptions</text>
  <rect x="42.0339" y="354.0332" width="321.356027" height="84.9171" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="367.457627" y="354.0332" width="870.508573" height="84.9171" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="438.9503" x2="1240" y2="438.9503" stroke="var(--border)" stroke-width="1.7439"/>
  <text x="58.305102" y="405.3039" font-size="20.633401" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">OVER-PLANNING</text>
  <text x="387.796529" y="392.4862" font-size="20.633401" fill="var(--text)" font-family="Arial, sans-serif">Plans forever, never executes</text>
  <text x="387.796529" y="418.1216" font-size="20.633401" fill="var(--text)" font-family="Arial, sans-serif">Fix: Force action after N think steps</text>
  <rect x="42.0339" y="440.5525" width="321.356027" height="84.9171" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="367.457627" y="440.5525" width="870.508573" height="84.9171" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="525.4696" x2="1240" y2="525.4696" stroke="var(--border)" stroke-width="1.7439"/>
  <text x="58.305102" y="479.0055" font-size="20.633401" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">PREMATURE</text>
  <text x="58.305102" y="504.6409" font-size="20.633401" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">TERMINATION</text>
  <text x="387.796529" y="479.0055" font-size="20.633401" fill="var(--text)" font-family="Arial, sans-serif">Answers before gathering enough info</text>
  <text x="387.796529" y="504.6409" font-size="20.633401" fill="var(--text)" font-family="Arial, sans-serif">Fix: Require minimum evidence</text>
  <rect x="42.0339" y="527.0718" width="321.356027" height="84.9171" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="367.457627" y="527.0718" width="870.508573" height="84.9171" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="611.989" x2="1240" y2="611.989" stroke="var(--border)" stroke-width="1.7439"/>
  <text x="58.305102" y="565.5248" font-size="20.633401" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">CONTEXT</text>
  <text x="58.305102" y="591.1603" font-size="20.633401" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">OVERFLOW</text>
  <text x="387.796529" y="565.5248" font-size="20.633401" fill="var(--text)" font-family="Arial, sans-serif">Forgets earlier findings in long runs</text>
  <text x="387.796529" y="591.1603" font-size="20.633401" fill="var(--text)" font-family="Arial, sans-serif">Fix: Summarize + working memory</text>
</svg>

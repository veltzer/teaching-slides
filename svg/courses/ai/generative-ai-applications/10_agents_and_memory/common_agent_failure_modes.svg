<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="9.6107" y="8.7193" width="1134.0575" height="631.2807" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="576.6394" y="52.3161" font-size="24.4142" fill="var(--text)" text-anchor="middle" font-weight="bold">AGENT FAILURE MODES</text>
  <line x1="9.6107" y1="66.267" x2="1143.6681" y2="66.267" stroke="var(--text)" stroke-width="1.7439" />
  <line x1="317.1517" y1="8.7193" x2="317.1517" y2="640" stroke="var(--text)" stroke-width="1.7439" />
  <rect x="11.5328" y="68.0109" width="303.6968" height="92.425" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
  <rect x="319.0738" y="68.0109" width="822.6722" height="92.425" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
  <line x1="9.6107" y1="160.4359" x2="1143.6681" y2="160.4359" stroke="var(--border)" stroke-width="1.7439" />
  <text x="26.9099" y="123.8148" font-size="20.9264" fill="var(--danger-accent)" font-weight="bold">LOOPING</text>
  <text x="338.2951" y="109.8638" font-size="20.9264" fill="var(--text)">Agent repeats the same action</text>
  <text x="338.2951" y="137.7656" font-size="20.9264" fill="var(--text)">Fix: Track action history, detect loops</text>
  <rect x="11.5328" y="162.1798" width="303.6968" height="92.425" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
  <rect x="319.0738" y="162.1798" width="822.6722" height="92.425" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
  <line x1="9.6107" y1="254.6049" x2="1143.6681" y2="254.6049" stroke="var(--border)" stroke-width="1.7439" />
  <text x="26.9099" y="204.0327" font-size="20.9264" fill="var(--danger-accent)" font-weight="bold">HALLUCINATED</text>
  <text x="26.9099" y="231.9346" font-size="20.9264" fill="var(--danger-accent)" font-weight="bold">TOOLS</text>
  <text x="338.2951" y="204.0327" font-size="20.9264" fill="var(--text)">Agent "uses" tools that don't exist</text>
  <text x="338.2951" y="231.9346" font-size="20.9264" fill="var(--text)">Fix: Strict tool validation</text>
  <rect x="11.5328" y="256.3487" width="303.6968" height="92.425" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <rect x="319.0738" y="256.3487" width="822.6722" height="92.425" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <line x1="9.6107" y1="348.7739" x2="1143.6681" y2="348.7739" stroke="var(--border)" stroke-width="1.7439" />
  <text x="26.9099" y="298.2016" font-size="20.9264" fill="var(--danger-accent)" font-weight="bold">WRONG TOOL</text>
  <text x="26.9099" y="326.1035" font-size="20.9264" fill="var(--danger-accent)" font-weight="bold">SELECTION</text>
  <text x="338.2951" y="298.2016" font-size="20.9264" fill="var(--text)">Uses search when calculator needed</text>
  <text x="338.2951" y="326.1035" font-size="20.9264" fill="var(--text)">Fix: Better tool descriptions</text>
  <rect x="11.5328" y="350.5177" width="303.6968" height="92.425" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
  <rect x="319.0738" y="350.5177" width="822.6722" height="92.425" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
  <line x1="9.6107" y1="442.9428" x2="1143.6681" y2="442.9428" stroke="var(--border)" stroke-width="1.7439" />
  <text x="26.9099" y="406.3215" font-size="20.9264" fill="var(--danger-accent)" font-weight="bold">OVER-PLANNING</text>
  <text x="338.2951" y="392.3706" font-size="20.9264" fill="var(--text)">Plans forever, never executes</text>
  <text x="338.2951" y="420.2725" font-size="20.9264" fill="var(--text)">Fix: Force action after N think steps</text>
  <rect x="11.5328" y="444.6866" width="303.6968" height="92.425" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
  <rect x="319.0738" y="444.6866" width="822.6722" height="92.425" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
  <line x1="9.6107" y1="537.1117" x2="1143.6681" y2="537.1117" stroke="var(--border)" stroke-width="1.7439" />
  <text x="26.9099" y="486.5395" font-size="20.9264" fill="var(--danger-accent)" font-weight="bold">PREMATURE</text>
  <text x="26.9099" y="514.4414" font-size="20.9264" fill="var(--danger-accent)" font-weight="bold">TERMINATION</text>
  <text x="338.2951" y="486.5395" font-size="20.9264" fill="var(--text)">Answers before gathering enough info</text>
  <text x="338.2951" y="514.4414" font-size="20.9264" fill="var(--text)">Fix: Require minimum evidence</text>
  <rect x="11.5328" y="538.8556" width="303.6968" height="92.425" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <rect x="319.0738" y="538.8556" width="822.6722" height="92.425" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <line x1="9.6107" y1="631.2807" x2="1143.6681" y2="631.2807" stroke="var(--border)" stroke-width="1.7439" />
  <text x="26.9099" y="580.7084" font-size="20.9264" fill="var(--danger-accent)" font-weight="bold">CONTEXT</text>
  <text x="26.9099" y="608.6104" font-size="20.9264" fill="var(--danger-accent)" font-weight="bold">OVERFLOW</text>
  <text x="338.2951" y="580.7084" font-size="20.9264" fill="var(--text)">Forgets earlier findings in long runs</text>
  <text x="338.2951" y="608.6104" font-size="20.9264" fill="var(--text)">Fix: Summarize + working memory</text>
</svg>
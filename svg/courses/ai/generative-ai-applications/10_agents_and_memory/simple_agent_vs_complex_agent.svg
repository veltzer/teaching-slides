<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.5806 5.8182,0" fill="#555" />
    </marker>
  </defs>
  <text x="18.6857" y="53.7063" font-size="26.16" fill="var(--text)" font-weight="bold">SIMPLE CHATBOT:</text>
  <rect x="18.6857" y="76.0839" width="112.1141" height="67.1328" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="74.7428" y="120.8392" font-size="22.4228" fill="var(--text)" text-anchor="middle">User</text>
  <line x1="130.7999" y1="109.6504" x2="201.8054" y2="109.6504" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="205.5426" y="76.0839" width="93.4285" height="67.1328" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="252.2568" y="120.8392" font-size="22.4228" fill="var(--text)" text-anchor="middle">LLM</text>
  <line x1="298.971" y1="109.6504" x2="369.9767" y2="109.6504" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="373.7138" y="76.0839" width="149.4855" height="67.1328" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="448.4565" y="120.8392" font-size="22.4228" fill="var(--text)" text-anchor="middle">Response</text>
  <text x="18.6857" y="187.972" font-size="22.4228" fill="var(--text-muted)">(single turn, no tools, no memory)</text>
  <text x="18.6857" y="259.5804" font-size="26.16" fill="var(--text)" font-weight="bold">AGENT:</text>
  <rect x="18.6857" y="277.4825" width="112.1141" height="67.1328" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="74.7428" y="322.2377" font-size="22.4228" fill="var(--text)" text-anchor="middle">User</text>
  <line x1="130.7999" y1="311.0489" x2="201.8054" y2="311.0489" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="205.5426" y="277.4825" width="93.4285" height="67.1328" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="252.2568" y="322.2377" font-size="22.4228" fill="var(--text)" text-anchor="middle">LLM</text>
  <text x="326.9995" y="299.8601" font-size="22.4228" fill="var(--text-muted)">→ "I need to search the database"</text>
  <text x="326.9995" y="344.6153" font-size="22.4228" fill="var(--text-muted)">→ [calls search tool]</text>
  <text x="326.9995" y="389.3706" font-size="22.4228" fill="var(--text-muted)">→ "Found 3 results, let me analyze..."</text>
  <text x="326.9995" y="434.1258" font-size="22.4228" fill="var(--text-muted)">→ "I also need to check the API"</text>
  <text x="326.9995" y="478.8811" font-size="22.4228" fill="var(--text-muted)">→ [calls API tool]</text>
  <text x="326.9995" y="523.6364" font-size="22.4228" fill="var(--text-muted)">→ "Based on my research, here's the answer..."</text>
  <text x="326.9995" y="568.3916" font-size="22.4228" fill="var(--text-muted)">→ Response to User</text>
  <text x="18.6857" y="640" font-size="22.4228" fill="var(--text-muted)">(multi-step, tools, memory, autonomous)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="260" rx="6" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="70" y="80" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Simple Chatbot</text>

  <rect x="70" y="130" width="200" height="120" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="200" text-anchor="middle" font-size="22" fill="var(--primary-text)" font-family="Arial, sans-serif">User</text>

  <line x1="270" y1="190" x2="450" y2="190" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="460" y="130" width="200" height="120" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="200" text-anchor="middle" font-size="22" fill="var(--primary-text)" font-family="Arial, sans-serif">LLM</text>

  <line x1="660" y1="190" x2="840" y2="190" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="850" y="130" width="360" height="120" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="200" text-anchor="middle" font-size="22" fill="var(--primary-text)" font-family="Arial, sans-serif">Response</text>

  <text x="70" y="285" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">single turn - no tools - no memory</text>

  <rect x="40" y="320" width="1200" height="300" rx="6" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="70" y="360" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Agent</text>

  <rect x="70" y="395" width="180" height="200" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="505" text-anchor="middle" font-size="22" fill="var(--ok-text)" font-family="Arial, sans-serif">User</text>

  <line x1="250" y1="495" x2="340" y2="495" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="395" width="180" height="200" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="505" text-anchor="middle" font-size="22" fill="var(--ok-text)" font-family="Arial, sans-serif">LLM Loop</text>

  <line x1="530" y1="495" x2="620" y2="495" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="630" y="395" width="280" height="90" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="445" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">Search Tool</text>

  <rect x="630" y="505" width="280" height="90" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="555" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">API Tool</text>

  <line x1="910" y1="495" x2="1000" y2="495" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1010" y="395" width="200" height="200" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="485" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">Memory</text>
  <text x="1110" y="515" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">and</text>
  <text x="1110" y="545" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">Answer</text>
</svg>

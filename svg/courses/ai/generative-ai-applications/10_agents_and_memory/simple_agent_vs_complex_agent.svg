<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="15.5152" markerHeight="13.9355" refX="15.5152" refY="6.9677" orient="auto">
      <ns0:polygon points="0,18.5806 5.8182,0" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="18.6857" y="53.7063" font-size="26.16" fill="#222" font-weight="bold">SIMPLE CHATBOT:</ns0:text>
  <ns0:rect x="18.6857" y="76.0839" width="112.1141" height="67.1328" rx="7.4743" fill="#e3f2fd" stroke="#333" stroke-width="2.8029" />
  <ns0:text x="74.7428" y="120.8392" font-size="22.4228" fill="#222" text-anchor="middle">User</ns0:text>
  <ns0:line x1="130.7999" y1="109.6504" x2="201.8054" y2="109.6504" stroke="#555" stroke-width="2.8029" marker-end="url(#arr)" />
  <ns0:rect x="205.5426" y="76.0839" width="93.4285" height="67.1328" rx="7.4743" fill="#e3f2fd" stroke="#333" stroke-width="2.8029" />
  <ns0:text x="252.2568" y="120.8392" font-size="22.4228" fill="#222" text-anchor="middle">LLM</ns0:text>
  <ns0:line x1="298.971" y1="109.6504" x2="369.9767" y2="109.6504" stroke="#555" stroke-width="2.8029" marker-end="url(#arr)" />
  <ns0:rect x="373.7138" y="76.0839" width="149.4855" height="67.1328" rx="7.4743" fill="#e3f2fd" stroke="#333" stroke-width="2.8029" />
  <ns0:text x="448.4565" y="120.8392" font-size="22.4228" fill="#222" text-anchor="middle">Response</ns0:text>
  <ns0:text x="18.6857" y="187.972" font-size="22.4228" fill="#555">(single turn, no tools, no memory)</ns0:text>
  <ns0:text x="18.6857" y="259.5804" font-size="26.16" fill="#222" font-weight="bold">AGENT:</ns0:text>
  <ns0:rect x="18.6857" y="277.4825" width="112.1141" height="67.1328" rx="7.4743" fill="#e8f5e9" stroke="#333" stroke-width="2.8029" />
  <ns0:text x="74.7428" y="322.2377" font-size="22.4228" fill="#222" text-anchor="middle">User</ns0:text>
  <ns0:line x1="130.7999" y1="311.0489" x2="201.8054" y2="311.0489" stroke="#555" stroke-width="2.8029" marker-end="url(#arr)" />
  <ns0:rect x="205.5426" y="277.4825" width="93.4285" height="67.1328" rx="7.4743" fill="#e8f5e9" stroke="#333" stroke-width="2.8029" />
  <ns0:text x="252.2568" y="322.2377" font-size="22.4228" fill="#222" text-anchor="middle">LLM</ns0:text>
  <ns0:text x="326.9995" y="299.8601" font-size="22.4228" fill="#555">→ "I need to search the database"</ns0:text>
  <ns0:text x="326.9995" y="344.6153" font-size="22.4228" fill="#555">→ [calls search tool]</ns0:text>
  <ns0:text x="326.9995" y="389.3706" font-size="22.4228" fill="#555">→ "Found 3 results, let me analyze..."</ns0:text>
  <ns0:text x="326.9995" y="434.1258" font-size="22.4228" fill="#555">→ "I also need to check the API"</ns0:text>
  <ns0:text x="326.9995" y="478.8811" font-size="22.4228" fill="#555">→ [calls API tool]</ns0:text>
  <ns0:text x="326.9995" y="523.6364" font-size="22.4228" fill="#555">→ "Based on my research, here's the answer..."</ns0:text>
  <ns0:text x="326.9995" y="568.3916" font-size="22.4228" fill="#555">→ Response to User</ns0:text>
  <ns0:text x="18.6857" y="640" font-size="22.4228" fill="#555">(multi-step, tools, memory, autonomous)</ns0:text>
</ns0:svg>
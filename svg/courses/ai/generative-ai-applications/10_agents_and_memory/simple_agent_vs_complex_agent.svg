<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="260" rx="6" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="70" y="80" font-size="22" font-weight="bold" fill="var(--text)">Simple Chatbot</text>

  <rect x="70" y="130" width="200" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="170" y="200" text-anchor="middle" font-size="22" fill="var(--primary-text)">User</text>

  <line x1="270" y1="190" x2="450" y2="190" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="460" y="130" width="200" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="560" y="200" text-anchor="middle" font-size="22" fill="var(--primary-text)">LLM</text>

  <line x1="660" y1="190" x2="840" y2="190" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="850" y="130" width="360" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1030" y="200" text-anchor="middle" font-size="22" fill="var(--primary-text)">Response</text>

  <text x="70" y="285" font-size="13" fill="var(--text-muted)">single turn - no tools - no memory</text>

  <rect x="40" y="320" width="1200" height="300" rx="6" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="70" y="360" font-size="22" font-weight="bold" fill="var(--text)">Agent</text>

  <rect x="70" y="395" width="180" height="200" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="160" y="505" text-anchor="middle" font-size="22" fill="var(--ok-text)">User</text>

  <line x1="250" y1="495" x2="340" y2="495" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="395" width="180" height="200" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="440" y="505" text-anchor="middle" font-size="22" fill="var(--ok-text)">LLM Loop</text>

  <line x1="530" y1="495" x2="620" y2="495" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="630" y="395" width="280" height="90" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="770" y="445" text-anchor="middle" font-size="18" fill="var(--warn-text)">Search Tool</text>

  <rect x="630" y="505" width="280" height="90" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="770" y="555" text-anchor="middle" font-size="18" fill="var(--warn-text)">API Tool</text>

  <line x1="910" y1="495" x2="1000" y2="495" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1010" y="395" width="200" height="200" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1110" y="485" text-anchor="middle" font-size="18" fill="var(--info-text)">Memory</text>
  <text x="1110" y="515" text-anchor="middle" font-size="18" fill="var(--info-text)">and</text>
  <text x="1110" y="545" text-anchor="middle" font-size="18" fill="var(--info-text)">Answer</text>
</svg>

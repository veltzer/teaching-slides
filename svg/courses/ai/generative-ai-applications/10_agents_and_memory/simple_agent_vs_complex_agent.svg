<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:marker id="arr" markerWidth="15.5152" markerHeight="13.9355" refX="15.5152" refY="6.9677" orient="auto">
      <ns0:polygon points="0,18.5806 5.8182,0" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="18.6857" y="53.7063" font-size="26.16" fill="var(--text-darker)" font-weight="bold">SIMPLE CHATBOT:</ns0:text>
  <ns0:rect x="18.6857" y="76.0839" width="112.1141" height="67.1328" rx="7.4743" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.8029" />
  <ns0:text x="74.7428" y="120.8392" font-size="22.4228" fill="var(--text-darker)" text-anchor="middle">User</ns0:text>
  <ns0:line x1="130.7999" y1="109.6504" x2="201.8054" y2="109.6504" stroke="var(--text-muted)" stroke-width="2.8029" marker-end="url(#arr)" />
  <ns0:rect x="205.5426" y="76.0839" width="93.4285" height="67.1328" rx="7.4743" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.8029" />
  <ns0:text x="252.2568" y="120.8392" font-size="22.4228" fill="var(--text-darker)" text-anchor="middle">LLM</ns0:text>
  <ns0:line x1="298.971" y1="109.6504" x2="369.9767" y2="109.6504" stroke="var(--text-muted)" stroke-width="2.8029" marker-end="url(#arr)" />
  <ns0:rect x="373.7138" y="76.0839" width="149.4855" height="67.1328" rx="7.4743" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.8029" />
  <ns0:text x="448.4565" y="120.8392" font-size="22.4228" fill="var(--text-darker)" text-anchor="middle">Response</ns0:text>
  <ns0:text x="18.6857" y="187.972" font-size="22.4228" fill="var(--text-muted)">(single turn, no tools, no memory)</ns0:text>
  <ns0:text x="18.6857" y="259.5804" font-size="26.16" fill="var(--text-darker)" font-weight="bold">AGENT:</ns0:text>
  <ns0:rect x="18.6857" y="277.4825" width="112.1141" height="67.1328" rx="7.4743" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="2.8029" />
  <ns0:text x="74.7428" y="322.2377" font-size="22.4228" fill="var(--text-darker)" text-anchor="middle">User</ns0:text>
  <ns0:line x1="130.7999" y1="311.0489" x2="201.8054" y2="311.0489" stroke="var(--text-muted)" stroke-width="2.8029" marker-end="url(#arr)" />
  <ns0:rect x="205.5426" y="277.4825" width="93.4285" height="67.1328" rx="7.4743" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="2.8029" />
  <ns0:text x="252.2568" y="322.2377" font-size="22.4228" fill="var(--text-darker)" text-anchor="middle">LLM</ns0:text>
  <ns0:text x="326.9995" y="299.8601" font-size="22.4228" fill="var(--text-muted)">→ "I need to search the database"</ns0:text>
  <ns0:text x="326.9995" y="344.6153" font-size="22.4228" fill="var(--text-muted)">→ [calls search tool]</ns0:text>
  <ns0:text x="326.9995" y="389.3706" font-size="22.4228" fill="var(--text-muted)">→ "Found 3 results, let me analyze..."</ns0:text>
  <ns0:text x="326.9995" y="434.1258" font-size="22.4228" fill="var(--text-muted)">→ "I also need to check the API"</ns0:text>
  <ns0:text x="326.9995" y="478.8811" font-size="22.4228" fill="var(--text-muted)">→ [calls API tool]</ns0:text>
  <ns0:text x="326.9995" y="523.6364" font-size="22.4228" fill="var(--text-muted)">→ "Based on my research, here's the answer..."</ns0:text>
  <ns0:text x="326.9995" y="568.3916" font-size="22.4228" fill="var(--text-muted)">→ Response to User</ns0:text>
  <ns0:text x="18.6857" y="640" font-size="22.4228" fill="var(--text-muted)">(multi-step, tools, memory, autonomous)</ns0:text>
</ns0:svg>
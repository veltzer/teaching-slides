<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.5806 5.8182,0" fill="#555" />
    </marker>
  </defs>
  <text x="390.4511" y="40" font-size="25.8792" fill="var(--text)" font-weight="bold">SIMPLE CHATBOT:</text>
  <rect x="390.4511" y="62.1374" width="110.9106" height="66.4121" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="445.9064" y="106.4122" font-size="22.1821" fill="var(--text)" text-anchor="middle">User</text>
  <line x1="501.3618" y1="95.3436" x2="571.6051" y2="95.3436" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="575.3021" y="62.1374" width="92.4256" height="66.4121" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="621.5149" y="106.4122" font-size="22.1821" fill="var(--text)" text-anchor="middle">LLM</text>
  <line x1="667.7276" y1="95.3436" x2="737.9711" y2="95.3436" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="741.6681" y="62.1374" width="147.8808" height="66.4121" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="815.6084" y="106.4122" font-size="22.1821" fill="var(--text)" text-anchor="middle">Response</text>
  <text x="390.4511" y="172.8244" font-size="22.1821" fill="var(--text-muted)">(single turn, no tools, no memory)</text>
  <text x="390.4511" y="243.6641" font-size="25.8792" fill="var(--text)" font-weight="bold">AGENT:</text>
  <rect x="390.4511" y="261.374" width="110.9106" height="66.4121" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="445.9064" y="305.6488" font-size="22.1821" fill="var(--text)" text-anchor="middle">User</text>
  <line x1="501.3618" y1="294.5801" x2="571.6051" y2="294.5801" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="575.3021" y="261.374" width="92.4256" height="66.4121" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="621.5149" y="305.6488" font-size="22.1821" fill="var(--text)" text-anchor="middle">LLM</text>
  <text x="695.4552" y="283.5114" font-size="22.1821" fill="var(--text-muted)">→ "I need to search the database"</text>
  <text x="695.4552" y="327.7862" font-size="22.1821" fill="var(--text-muted)">→ [calls search tool]</text>
  <text x="695.4552" y="372.061" font-size="22.1821" fill="var(--text-muted)">→ "Found 3 results, let me analyze..."</text>
  <text x="695.4552" y="416.3358" font-size="22.1821" fill="var(--text-muted)">→ "I also need to check the API"</text>
  <text x="695.4552" y="460.6107" font-size="22.1821" fill="var(--text-muted)">→ [calls API tool]</text>
  <text x="695.4552" y="504.8855" font-size="22.1821" fill="var(--text-muted)">→ "Based on my research, here's the answer..."</text>
  <text x="695.4552" y="549.1603" font-size="22.1821" fill="var(--text-muted)">→ Response to User</text>
  <text x="390.4511" y="620" font-size="22.1821" fill="var(--text-muted)">(multi-step, tools, memory, autonomous)</text>
</svg>
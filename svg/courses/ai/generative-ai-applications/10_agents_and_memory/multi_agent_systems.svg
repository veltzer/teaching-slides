<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="112" y="40" width="1056.0001" height="142.7693" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="98" font-size="31.046" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">ORCHESTRATOR AGENT</text>
  <text x="640" y="147.0769" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(routes tasks to specialized agents)</text>
  <line x1="328" y1="182.7693" x2="280" y2="325.5384" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="640" y1="182.7693" x2="640" y2="325.5384" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="952" y1="182.7693" x2="1000" y2="325.5384" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="40" y="330" width="360" height="290" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="383.5384" font-size="28.8283" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">Research Agent</text>
  <line x1="64" y1="405.8461" x2="375.9999" y2="405.8461" stroke="var(--border)" stroke-width="2"/>
  <text x="220" y="450.4615" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Search</text>
  <text x="220" y="490.6154" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Summarize</text>
  <text x="220" y="530.7692" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Cite</text>
  <rect x="460" y="330" width="360" height="290" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="383.5384" font-size="28.8283" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">Code Agent</text>
  <line x1="484" y1="405.8461" x2="796" y2="405.8461" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="450.4615" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Execute</text>
  <text x="640" y="490.6154" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Debug</text>
  <text x="640" y="530.7692" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Test</text>
  <rect x="880" y="330" width="360" height="290" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="383.5384" font-size="28.8283" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">Review Agent</text>
  <line x1="904.0001" y1="405.8461" x2="1216" y2="405.8461" stroke="var(--border)" stroke-width="2"/>
  <text x="1060" y="450.4615" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Analyze</text>
  <text x="1060" y="490.6154" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Critique</text>
  <text x="1060" y="530.7692" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Suggest</text>
</svg>

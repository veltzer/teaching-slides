    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="17.0667" markerHeight="13.9355" refX="17.0667" refY="6.9677" orient="auto">
      <polygon points="0,18.5806 6.4,0" fill="#555" />
    </marker>
  </defs>
  <rect x="170.6667" y="23.2258" width="938.6667" height="148.6452" rx="8.5333" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="4.2667" />
  <text x="640" y="83.6129" font-size="29.8667" fill="var(--text-darker)" text-anchor="middle" font-weight="bold">ORCHESTRATOR AGENT</text>
  <text x="640" y="134.7097" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">(routes tasks to specialized agents)</text>
  <line x1="362.6667" y1="171.871" x2="320" y2="320.5161" stroke="var(--text-muted)" stroke-width="3.2" marker-end="url(#arr)" />
  <line x1="640" y1="171.871" x2="640" y2="320.5161" stroke="var(--text-muted)" stroke-width="3.2" marker-end="url(#arr)" />
  <line x1="917.3333" y1="171.871" x2="960" y2="320.5161" stroke="var(--text-muted)" stroke-width="3.2" marker-end="url(#arr)" />
  <rect x="106.6667" y="325.1613" width="320" height="301.9355" rx="8.5333" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="3.2" />
  <text x="266.6667" y="380.9032" font-size="27.7333" fill="var(--text-darker)" text-anchor="middle" font-weight="bold">Research Agent</text>
  <line x1="128" y1="404.129" x2="405.3333" y2="404.129" stroke="var(--border-strong)" stroke-width="2.1333" />
  <text x="266.6667" y="450.5806" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Search</text>
  <text x="266.6667" y="492.3871" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Summarize</text>
  <text x="266.6667" y="534.1935" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Cite</text>
  <rect x="480" y="325.1613" width="320" height="301.9355" rx="8.5333" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="3.2" />
  <text x="640" y="380.9032" font-size="27.7333" fill="var(--text-darker)" text-anchor="middle" font-weight="bold">Code Agent</text>
  <line x1="501.3333" y1="404.129" x2="778.6667" y2="404.129" stroke="var(--border-strong)" stroke-width="2.1333" />
  <text x="640" y="450.5806" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Execute</text>
  <text x="640" y="492.3871" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Debug</text>
  <text x="640" y="534.1935" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Test</text>
  <rect x="853.3333" y="325.1613" width="320" height="301.9355" rx="8.5333" fill="var(--danger-pale3)" stroke="var(--text-dark)" stroke-width="3.2" />
  <text x="1013.3333" y="380.9032" font-size="27.7333" fill="var(--text-darker)" text-anchor="middle" font-weight="bold">Review Agent</text>
  <line x1="874.6667" y1="404.129" x2="1152" y2="404.129" stroke="var(--border-strong)" stroke-width="2.1333" />
  <text x="1013.3333" y="450.5806" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Analyze</text>
  <text x="1013.3333" y="492.3871" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Critique</text>
  <text x="1013.3333" y="534.1935" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Suggest</text>

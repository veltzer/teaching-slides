<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.5806 6.4,0" fill="#555" />
    </marker>
  </defs>
  <rect x="112" y="40" width="1056.0001" height="142.7693" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="98" font-size="31.046" fill="var(--text)" text-anchor="middle" font-weight="bold">ORCHESTRATOR AGENT</text>
  <text x="640" y="147.0769" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle">(routes tasks to specialized agents)</text>
  <line x1="328" y1="182.7693" x2="280" y2="325.5384" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="640" y1="182.7693" x2="640" y2="325.5384" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="952" y1="182.7693" x2="1000" y2="325.5384" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="40" y="330" width="360" height="290" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="220" y="383.5384" font-size="28.8283" fill="var(--text)" text-anchor="middle" font-weight="bold">Research Agent</text>
  <line x1="64" y1="405.8461" x2="375.9999" y2="405.8461" stroke="var(--border)" stroke-width="2" />
  <text x="220" y="450.4615" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle">Search</text>
  <text x="220" y="490.6154" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle">Summarize</text>
  <text x="220" y="530.7692" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle">Cite</text>
  <rect x="460" y="330" width="360" height="290" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="383.5384" font-size="28.8283" fill="var(--text)" text-anchor="middle" font-weight="bold">Code Agent</text>
  <line x1="484" y1="405.8461" x2="796" y2="405.8461" stroke="var(--border)" stroke-width="2" />
  <text x="640" y="450.4615" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle">Execute</text>
  <text x="640" y="490.6154" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle">Debug</text>
  <text x="640" y="530.7692" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle">Test</text>
  <rect x="880" y="330" width="360" height="290" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1060" y="383.5384" font-size="28.8283" fill="var(--text)" text-anchor="middle" font-weight="bold">Review Agent</text>
  <line x1="904.0001" y1="405.8461" x2="1216" y2="405.8461" stroke="var(--border)" stroke-width="2" />
  <text x="1060" y="450.4615" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle">Analyze</text>
  <text x="1060" y="490.6154" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle">Critique</text>
  <text x="1060" y="530.7692" font-size="26.6108" fill="var(--text-muted)" text-anchor="middle">Suggest</text>
</svg>
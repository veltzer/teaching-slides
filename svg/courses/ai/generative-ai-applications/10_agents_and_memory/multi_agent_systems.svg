<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.5806 6.4,0" fill="#555" />
    </marker>
  </defs>
  <rect x="170.6667" y="23.2258" width="938.6667" height="148.6452" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="83.6129" font-size="29.8667" fill="var(--text)" text-anchor="middle" font-weight="bold">ORCHESTRATOR AGENT</text>
  <text x="640" y="134.7097" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">(routes tasks to specialized agents)</text>
  <line x1="362.6667" y1="171.871" x2="320" y2="320.5161" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="640" y1="171.871" x2="640" y2="320.5161" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="917.3333" y1="171.871" x2="960" y2="320.5161" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="106.6667" y="325.1613" width="320" height="301.9355" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="266.6667" y="380.9032" font-size="27.7333" fill="var(--text)" text-anchor="middle" font-weight="bold">Research Agent</text>
  <line x1="128" y1="404.129" x2="405.3333" y2="404.129" stroke="var(--border)" stroke-width="2" />
  <text x="266.6667" y="450.5806" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Search</text>
  <text x="266.6667" y="492.3871" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Summarize</text>
  <text x="266.6667" y="534.1935" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Cite</text>
  <rect x="480" y="325.1613" width="320" height="301.9355" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="380.9032" font-size="27.7333" fill="var(--text)" text-anchor="middle" font-weight="bold">Code Agent</text>
  <line x1="501.3333" y1="404.129" x2="778.6667" y2="404.129" stroke="var(--border)" stroke-width="2" />
  <text x="640" y="450.5806" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Execute</text>
  <text x="640" y="492.3871" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Debug</text>
  <text x="640" y="534.1935" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Test</text>
  <rect x="853.3333" y="325.1613" width="320" height="301.9355" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1013.3333" y="380.9032" font-size="27.7333" fill="var(--text)" text-anchor="middle" font-weight="bold">Review Agent</text>
  <line x1="874.6667" y1="404.129" x2="1152" y2="404.129" stroke="var(--border)" stroke-width="2" />
  <text x="1013.3333" y="450.5806" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Analyze</text>
  <text x="1013.3333" y="492.3871" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Critique</text>
  <text x="1013.3333" y="534.1935" font-size="25.6" fill="var(--text-muted)" text-anchor="middle">Suggest</text>
</svg>
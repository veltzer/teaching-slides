<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="85.5976" font-size="27.3829" fill="var(--text)" text-anchor="middle" font-weight="bold">MEMORY STRATEGIES</text>
  <line x1="40" y1="100.1887" x2="1240" y2="100.1887" stroke="var(--text)" stroke-width="1.9814" />
  <line x1="386.1539" y1="40" x2="386.1539" y2="620" stroke="var(--text)" stroke-width="1.9814" />
  <rect x="42.3077" y="102.0126" width="341.5385" height="100.3144" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <rect x="388.4616" y="102.0126" width="849.2307" height="100.3144" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <line x1="40" y1="202.3271" x2="1240" y2="202.3271" stroke="var(--border)" stroke-width="1.9814" />
  <text x="60.7692" y="147.61" font-size="25.427" fill="var(--text)" font-weight="bold">Conversation</text>
  <text x="60.7692" y="176.7925" font-size="25.427" fill="var(--text)" font-weight="bold">Buffer</text>
  <text x="411.5385" y="147.61" font-size="23.4711" fill="var(--text-muted)">Pass full history in context</text>
  <text x="411.5385" y="176.7925" font-size="23.4711" fill="var(--text-muted)">Simple but limited by context window</text>
  <rect x="42.3077" y="204.151" width="341.5385" height="100.3144" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <rect x="388.4616" y="204.151" width="849.2307" height="100.3144" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <line x1="40" y1="304.4654" x2="1240" y2="304.4654" stroke="var(--border)" stroke-width="1.9814" />
  <text x="60.7692" y="249.7484" font-size="25.427" fill="var(--text)" font-weight="bold">Summary</text>
  <text x="60.7692" y="278.9308" font-size="25.427" fill="var(--text)" font-weight="bold">Memory</text>
  <text x="411.5385" y="249.7484" font-size="23.4711" fill="var(--text-muted)">Summarize old messages</text>
  <text x="411.5385" y="278.9308" font-size="23.4711" fill="var(--text-muted)">Saves tokens, loses some detail</text>
  <rect x="42.3077" y="306.2893" width="341.5385" height="100.3144" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <rect x="388.4616" y="306.2893" width="849.2307" height="100.3144" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <line x1="40" y1="406.6037" x2="1240" y2="406.6037" stroke="var(--border)" stroke-width="1.9814" />
  <text x="60.7692" y="351.8868" font-size="25.427" fill="var(--text)" font-weight="bold">Window</text>
  <text x="60.7692" y="381.0692" font-size="25.427" fill="var(--text)" font-weight="bold">Memory</text>
  <text x="411.5385" y="351.8868" font-size="23.4711" fill="var(--text-muted)">Keep last N messages</text>
  <text x="411.5385" y="381.0692" font-size="23.4711" fill="var(--text-muted)">Fixed token budget</text>
  <rect x="42.3077" y="408.4277" width="341.5385" height="100.3144" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <rect x="388.4616" y="408.4277" width="849.2307" height="100.3144" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <line x1="40" y1="508.7422" x2="1240" y2="508.7422" stroke="var(--border)" stroke-width="1.9814" />
  <text x="60.7692" y="454.0252" font-size="25.427" fill="var(--text)" font-weight="bold">Vector Store</text>
  <text x="60.7692" y="483.2075" font-size="25.427" fill="var(--text)" font-weight="bold">Memory</text>
  <text x="411.5385" y="454.0252" font-size="23.4711" fill="var(--text-muted)">Embed and retrieve relevant memories</text>
  <text x="411.5385" y="483.2075" font-size="23.4711" fill="var(--text-muted)">Semantic retrieval</text>
  <rect x="42.3077" y="510.5661" width="341.5385" height="100.3144" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <rect x="388.4616" y="510.5661" width="849.2307" height="100.3144" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <line x1="40" y1="610.8805" x2="1240" y2="610.8805" stroke="var(--border)" stroke-width="1.9814" />
  <text x="60.7692" y="556.1635" font-size="25.427" fill="var(--text)" font-weight="bold">Entity</text>
  <text x="60.7692" y="585.346" font-size="25.427" fill="var(--text)" font-weight="bold">Memory</text>
  <text x="411.5385" y="556.1635" font-size="23.4711" fill="var(--text-muted)">Track key entities and facts</text>
  <text x="411.5385" y="585.346" font-size="23.4711" fill="var(--text-muted)">Structured knowledge</text>
</svg>
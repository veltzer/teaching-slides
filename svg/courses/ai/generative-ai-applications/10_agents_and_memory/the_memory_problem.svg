<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="85.5976" font-size="27.3829" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">MEMORY STRATEGIES</text>
  <line x1="40" y1="100.1887" x2="1240" y2="100.1887" stroke="var(--text)" stroke-width="1.9814" />
  <line x1="386.1539" y1="40" x2="386.1539" y2="620" stroke="var(--text)" stroke-width="1.9814" />
  <rect x="42.3077" y="102.0126" width="341.5385" height="100.3144" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="388.4616" y="102.0126" width="849.2307" height="100.3144" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="202.3271" x2="1240" y2="202.3271" stroke="var(--border)" stroke-width="1.9814" />
  <text x="60.7692" y="147.61" font-size="25.427" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Conversation</text>
  <text x="60.7692" y="176.7925" font-size="25.427" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Buffer</text>
  <text x="411.5385" y="147.61" font-size="23.4711" fill="var(--text-muted)" font-family="Arial, sans-serif">Pass full history in context</text>
  <text x="411.5385" y="176.7925" font-size="23.4711" fill="var(--text-muted)" font-family="Arial, sans-serif">Simple but limited by context window</text>
  <rect x="42.3077" y="204.151" width="341.5385" height="100.3144" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="388.4616" y="204.151" width="849.2307" height="100.3144" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="304.4654" x2="1240" y2="304.4654" stroke="var(--border)" stroke-width="1.9814" />
  <text x="60.7692" y="249.7484" font-size="25.427" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Summary</text>
  <text x="60.7692" y="278.9308" font-size="25.427" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Memory</text>
  <text x="411.5385" y="249.7484" font-size="23.4711" fill="var(--text-muted)" font-family="Arial, sans-serif">Summarize old messages</text>
  <text x="411.5385" y="278.9308" font-size="23.4711" fill="var(--text-muted)" font-family="Arial, sans-serif">Saves tokens, loses some detail</text>
  <rect x="42.3077" y="306.2893" width="341.5385" height="100.3144" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="388.4616" y="306.2893" width="849.2307" height="100.3144" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="406.6037" x2="1240" y2="406.6037" stroke="var(--border)" stroke-width="1.9814" />
  <text x="60.7692" y="351.8868" font-size="25.427" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Window</text>
  <text x="60.7692" y="381.0692" font-size="25.427" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Memory</text>
  <text x="411.5385" y="351.8868" font-size="23.4711" fill="var(--text-muted)" font-family="Arial, sans-serif">Keep last N messages</text>
  <text x="411.5385" y="381.0692" font-size="23.4711" fill="var(--text-muted)" font-family="Arial, sans-serif">Fixed token budget</text>
  <rect x="42.3077" y="408.4277" width="341.5385" height="100.3144" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="388.4616" y="408.4277" width="849.2307" height="100.3144" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="508.7422" x2="1240" y2="508.7422" stroke="var(--border)" stroke-width="1.9814" />
  <text x="60.7692" y="454.0252" font-size="25.427" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Vector Store</text>
  <text x="60.7692" y="483.2075" font-size="25.427" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Memory</text>
  <text x="411.5385" y="454.0252" font-size="23.4711" fill="var(--text-muted)" font-family="Arial, sans-serif">Embed and retrieve relevant memories</text>
  <text x="411.5385" y="483.2075" font-size="23.4711" fill="var(--text-muted)" font-family="Arial, sans-serif">Semantic retrieval</text>
  <rect x="42.3077" y="510.5661" width="341.5385" height="100.3144" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="388.4616" y="510.5661" width="849.2307" height="100.3144" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="40" y1="610.8805" x2="1240" y2="610.8805" stroke="var(--border)" stroke-width="1.9814" />
  <text x="60.7692" y="556.1635" font-size="25.427" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Entity</text>
  <text x="60.7692" y="585.346" font-size="25.427" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Memory</text>
  <text x="411.5385" y="556.1635" font-size="23.4711" fill="var(--text-muted)" font-family="Arial, sans-serif">Track key entities and facts</text>
  <text x="411.5385" y="585.346" font-size="23.4711" fill="var(--text-muted)" font-family="Arial, sans-serif">Structured knowledge</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="667.692387" y="40" font-size="32.465948" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">AGENT LOOP</text>
  <rect x="298.461571" y="81.428423" width="406.153897" height="91.142863" rx="8.672503" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.53852" y="137.357099" font-size="30.146921" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Observe</text>
  <line x1="741.538399" y1="126.999854" x2="1184.615378" y2="126.999854" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1240" y="135.285595" font-size="27.828038" fill="var(--text-muted)" font-family="Arial, sans-serif">Environment / Tools</text>
  <line x1="501.53852" y1="172.571286" x2="501.53852" y2="300.999841" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="298.461571" y="305.142711" width="406.153897" height="91.142863" rx="8.672503" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.53852" y="361.071387" font-size="30.146921" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Think</text>
  <line x1="741.538399" y1="350.714281" x2="1036.923051" y2="350.714281" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1092.307674" y="358.999882" font-size="27.828038" fill="var(--text-muted)" font-family="Arial, sans-serif">LLM Reasoning</text>
  <line x1="501.53852" y1="396.285574" x2="501.53852" y2="524.714267" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="298.461571" y="528.857137" width="406.153897" height="91.142863" rx="8.672503" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.53852" y="584.785536" font-size="30.146921" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Act</text>
  <line x1="741.538399" y1="574.42843" x2="1036.923051" y2="574.42843" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1073.845982" y="582.71417" font-size="27.828038" fill="var(--text-muted)" font-family="Arial, sans-serif">Call tool / Respond</text>
  <path d="M 298.461571 574.42843 Q 40 574.42843 40 126.999854 Q 40 81.428423 291.076894 81.428423" fill="none" stroke="var(--text-muted)" stroke-width="2.4427" marker-end="url(#arrow)"/>
  <text x="64.4898" y="294.1237" font-size="17.6482" fill="var(--text-muted)" transform="rotate(-90,15,175)" font-family="Arial, sans-serif">Loop until task complete</text>
</svg>

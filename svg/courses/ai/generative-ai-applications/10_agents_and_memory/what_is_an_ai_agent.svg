<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 7.68,0" fill="#555" />
    </marker>
  </defs>
  <rect x="11.5804" y="8.1425" width="1134.8827" height="631.8575" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="579.0218" y="52.112" font-size="22.799" fill="var(--text)" text-anchor="middle" font-weight="bold">AGENT LOOP</text>
  <rect x="347.4131" y="84.6819" width="254.7696" height="71.6539" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="474.7979" y="128.6514" font-size="21.1705" fill="var(--text)" text-anchor="middle">Observe</text>
  <line x1="625.3435" y1="120.5089" x2="903.274" y2="120.5089" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="938.0153" y="127.0229" font-size="19.542" fill="var(--text-muted)">Environment / Tools</text>
  <line x1="474.7979" y1="156.3359" x2="474.7979" y2="257.3028" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="347.4131" y="260.5598" width="254.7696" height="71.6539" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="474.7979" y="304.5293" font-size="21.1705" fill="var(--text)" text-anchor="middle">Think</text>
  <line x1="625.3435" y1="296.3868" x2="810.6305" y2="296.3868" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="845.3718" y="302.9008" font-size="19.542" fill="var(--text-muted)">LLM Reasoning</text>
  <line x1="474.7979" y1="332.2137" x2="474.7979" y2="433.1807" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="347.4131" y="436.4377" width="254.7696" height="71.6539" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="474.7979" y="480.4071" font-size="21.1705" fill="var(--text)" text-anchor="middle">Act</text>
  <line x1="625.3435" y1="472.2646" x2="810.6305" y2="472.2646" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="833.7913" y="478.7786" font-size="19.542" fill="var(--text-muted)">Call tool / Respond</text>
  <path d="M 347.4131 472.2646 Q 185.287 472.2646 185.287 120.5089 Q 185.287 84.6819 342.7809 84.6819" fill="none" stroke="var(--text-muted)" stroke-width="2.4427" marker-end="url(#arr)" />
  <text x="34.7413" y="284.9873" font-size="17.9135" fill="var(--text-muted)" transform="rotate(-90,15,175)">Loop until task complete</text>
</svg>
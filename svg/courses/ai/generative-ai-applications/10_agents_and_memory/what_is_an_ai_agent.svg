<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 7.68,0" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.0001" y="80.3609" font-size="22.4613" fill="var(--text)" text-anchor="middle" font-weight="bold">AGENT LOOP</text>
  <rect x="395.1021" y="110.2577" width="269.3878" height="65.7732" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="529.796" y="150.6186" font-size="20.8569" fill="var(--text)" text-anchor="middle">Observe</text>
  <line x1="688.9796" y1="143.1443" x2="982.8572" y2="143.1443" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="1019.5919" y="149.1237" font-size="19.2526" fill="var(--text-muted)">Environment / Tools</text>
  <line x1="529.796" y1="176.0309" x2="529.796" y2="268.7113" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="395.1021" y="271.701" width="269.3878" height="65.7732" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="529.796" y="312.0619" font-size="20.8569" fill="var(--text)" text-anchor="middle">Think</text>
  <line x1="688.9796" y1="304.5877" x2="884.898" y2="304.5877" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="921.6327" y="310.567" font-size="19.2526" fill="var(--text-muted)">LLM Reasoning</text>
  <line x1="529.796" y1="337.4742" x2="529.796" y2="430.1547" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="395.1021" y="433.1444" width="269.3878" height="65.7732" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="529.796" y="473.5051" font-size="20.8569" fill="var(--text)" text-anchor="middle">Act</text>
  <line x1="688.9796" y1="466.0309" x2="884.898" y2="466.0309" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="909.3877" y="472.0103" font-size="19.2526" fill="var(--text-muted)">Call tool / Respond</text>
  <path d="M 395.1021 466.0309 Q 223.6735 466.0309 223.6735 143.1443 Q 223.6735 110.2577 390.2041 110.2577" fill="none" stroke="var(--text-muted)" stroke-width="2.4427" marker-end="url(#arr)" />
  <text x="64.4898" y="294.1237" font-size="17.6482" fill="var(--text-muted)" transform="rotate(-90,15,175)">Loop until task complete</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="298.461571" y="40" width="406.153897" height="98.153825410657" rx="8.999880451319" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.53852" y="100.230865246719" font-size="31.284934115947" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Observe</text>
  <line x1="741.538399" y1="89.076912166867" x2="1184.615378" y2="89.076912166867" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1240" y="98.000015399996" font-size="28.878515832714" fill="var(--text-muted)" font-family="Arial, sans-serif">Environment / Tools</text>
  <line x1="501.53852" y1="138.153825410657" x2="501.53852" y2="276.461461908897" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="298.461571" y="280.923012987" width="406.153897" height="98.153825410657" rx="8.999880451319" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.53852" y="341.153878233719" font-size="31.284934115947" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Think</text>
  <line x1="741.538399" y1="330.000074846133" x2="1036.923051" y2="330.000074846133" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1092.307674" y="338.923027310073" font-size="28.878515832714" fill="var(--text-muted)" font-family="Arial, sans-serif">LLM Reasoning</text>
  <line x1="501.53852" y1="379.076838397657" x2="501.53852" y2="517.38462351124" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="298.461571" y="521.846174589343" width="406.153897" height="98.153825410657" rx="8.999880451319" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.53852" y="582.076741528452" font-size="31.284934115947" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Act</text>
  <line x1="741.538399" y1="570.922938140867" x2="1036.923051" y2="570.922938140867" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1073.845982" y="579.846040297073" font-size="28.878515832714" fill="var(--text-muted)" font-family="Arial, sans-serif">Call tool / Respond</text>
  <path d="M 298.461571 570.922938140867 Q 40 570.922938140867 40 89.076912166867 Q 40 40 291.076894 40" fill="none" stroke="var(--text-muted)" stroke-width="2.4427" marker-end="url(#arrow)"/>
  <text x="64.4898" y="294.1237" font-size="17.6482" fill="var(--text-muted)" transform="rotate(-90,15,175)" font-family="Arial, sans-serif">Loop until task complete</text>
</svg>

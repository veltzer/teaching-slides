<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.6011" font-weight="bold" fill="var(--text)">Model License Comparison</text>
  <rect x="40" y="69" width="1200" height="130.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="74.7826" y="105.25" font-family="Arial, sans-serif" font-size="19.9885" font-weight="bold" fill="var(--ok-accent)">Apache 2.0</text>
  <text x="74.7826" y="129.9" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text-muted)">(Mistral, Qwen)</text>
  <rect x="335.6522" y="83.4999" width="31.3043" height="26.1" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="347.8261" y="102.35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="379.1305" y="102.35" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Commercial use</text>
  <rect x="648.6957" y="83.4999" width="31.3043" height="26.1" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="660.8696" y="102.35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="692.174" y="102.35" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Modification &amp; distribution</text>
  <rect x="335.6522" y="119.75" width="31.3043" height="26.1" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="347.8261" y="138.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="379.1305" y="138.6" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Patent grant</text>
  <rect x="648.6957" y="119.75" width="31.3043" height="26.1" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="660.8696" y="138.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="692.174" y="138.6" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">No royalties</text>
  <text x="335.6522" y="185" font-family="Arial, sans-serif" font-size="15.3757" fill="var(--text-muted)">Must include license notice</text>
  <rect x="40" y="213.9999" width="1200" height="101.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="74.7826" y="250.25" font-family="Arial, sans-serif" font-size="19.9885" font-weight="bold" fill="var(--ok-accent)">MIT</text>
  <text x="74.7826" y="274.9" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text-muted)">(Phi-3)</text>
  <rect x="335.6522" y="235.75" width="31.3043" height="26.1" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="347.8261" y="254.5999" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="379.1305" y="254.5999" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Nearly unrestricted use</text>
  <rect x="648.6957" y="235.75" width="31.3043" height="26.1" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="660.8696" y="254.5999" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="692.174" y="254.5999" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Commercial use</text>
  <rect x="961.7392" y="235.75" width="31.3043" height="26.1" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="973.913" y="254.5999" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="1005.2175" y="254.5999" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Minimal obligations</text>
  <rect x="40" y="330" width="1200" height="137.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />

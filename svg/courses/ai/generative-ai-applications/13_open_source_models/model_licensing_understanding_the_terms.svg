<svg viewBox="0 0 750 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="375" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Model License Comparison</text>

  <!-- Apache 2.0 -->
  <rect x="30" y="45" width="690" height="90" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#28a745">Apache 2.0</text>
  <text x="50" y="87" font-family="Arial, sans-serif" font-size="11" fill="#666">(Mistral, Qwen)</text>
  <rect x="200" y="55" width="18" height="18" rx="3" fill="#28a745"/>
  <text x="207" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">&#x2713;</text>
  <text x="225" y="68" font-family="Arial, sans-serif" font-size="11" fill="#333">Commercial use</text>
  <rect x="380" y="55" width="18" height="18" rx="3" fill="#28a745"/>
  <text x="387" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">&#x2713;</text>
  <text x="405" y="68" font-family="Arial, sans-serif" font-size="11" fill="#333">Modification &amp; distribution</text>
  <rect x="200" y="80" width="18" height="18" rx="3" fill="#28a745"/>
  <text x="207" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">&#x2713;</text>
  <text x="225" y="93" font-family="Arial, sans-serif" font-size="11" fill="#333">Patent grant</text>
  <rect x="380" y="80" width="18" height="18" rx="3" fill="#28a745"/>
  <text x="387" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">&#x2713;</text>
  <text x="405" y="93" font-family="Arial, sans-serif" font-size="11" fill="#333">No royalties</text>
  <text x="200" y="125" font-family="Arial, sans-serif" font-size="10" fill="#777">Must include license notice</text>

  <!-- MIT -->
  <rect x="30" y="145" width="690" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="50" y="170" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#28a745">MIT</text>
  <text x="50" y="187" font-family="Arial, sans-serif" font-size="11" fill="#666">(Phi-3)</text>
  <rect x="200" y="160" width="18" height="18" rx="3" fill="#28a745"/>
  <text x="207" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">&#x2713;</text>
  <text x="225" y="173" font-family="Arial, sans-serif" font-size="11" fill="#333">Nearly unrestricted use</text>
  <rect x="380" y="160" width="18" height="18" rx="3" fill="#28a745"/>
  <text x="387" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">&#x2713;</text>
  <text x="405" y="173" font-family="Arial, sans-serif" font-size="11" fill="#333">Commercial use</text>
  <rect x="560" y="160" width="18" height="18" rx="3" fill="#28a745"/>
  <text x="567" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">&#x2713;</text>
  <text x="585" y="173" font-family="Arial, sans-serif" font-size="11" fill="#333">Minimal obligations</text>

  <!-- LLaMA 3.1 -->
  <rect x="30" y="225" width="690" height="95" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="50" y="250" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#856404">LLaMA 3.1 Community</text>
  <rect x="200" y="240" width="18" height="18" rx="3" fill="#28a745"/>
  <text x="207" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">&#x2713;</text>
  <text x="225" y="253" font-family="Arial, sans-serif" font-size="11" fill="#333">Commercial use (with conditions)</text>
  <rect x="450" y="240" width="18" height="18" rx="3" fill="#28a745"/>
  <text x="457" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">&#x2713;</text>
  <text x="475" y="253" font-family="Arial, sans-serif" font-size="11" fill="#333">Modification</text>
  <rect x="200" y="268" width="18" height="18" rx="3" fill="#dc3545"/>
  <text x="207" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">&#x2717;</text>
  <text x="225" y="281" font-family="Arial, sans-serif" font-size="11" fill="#333">Must accept Meta's terms</text>
  <rect x="200" y="293" width="18" height="18" rx="3" fill="#dc3545"/>
  <text x="207" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">&#x2717;</text>
  <text x="225" y="306" font-family="Arial, sans-serif" font-size="11" fill="#333">Monthly active users &gt; 700M: need Meta's permission</text>

  <!-- Gemma -->
  <rect x="30" y="330" width="690" height="95" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="50" y="355" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#856404">Gemma (Google)</text>
  <rect x="200" y="345" width="18" height="18" rx="3" fill="#28a745"/>
  <text x="207" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">&#x2713;</text>
  <text x="225" y="358" font-family="Arial, sans-serif" font-size="11" fill="#333">Commercial use</text>
  <rect x="200" y="373" width="18" height="18" rx="3" fill="#dc3545"/>
  <text x="207" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">&#x2717;</text>
  <text x="225" y="386" font-family="Arial, sans-serif" font-size="11" fill="#333">Cannot use to train competing models</text>
  <rect x="200" y="398" width="18" height="18" rx="3" fill="#dc3545"/>
  <text x="207" y="411" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">&#x2717;</text>
  <text x="225" y="411" font-family="Arial, sans-serif" font-size="11" fill="#333">Must accept Google's terms</text>
</svg>
  <text x="782.6088" y="370.5999" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="813.9131" y="370.5999" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Modification</text>
  <rect x="335.6522" y="392.35" width="31.3043" height="26.1" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="347.8261" y="411.1999" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✗</text>
  <text x="379.1305" y="411.1999" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Must accept Meta's terms</text>
  <rect x="335.6522" y="428.6" width="31.3043" height="26.1" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="347.8261" y="447.45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✗</text>
  <text x="379.1305" y="447.45" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Monthly active users &gt; 700M: need Meta's permission</text>
  <rect x="40" y="482.25" width="1200" height="137.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="74.7826" y="518.5" font-family="Arial, sans-serif" font-size="19.9885" font-weight="bold" fill="var(--danger-accent)">Gemma (Google)</text>
  <rect x="335.6522" y="504" width="31.3043" height="26.1" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="347.8261" y="522.85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="379.1305" y="522.85" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Commercial use</text>
  <rect x="335.6522" y="544.6" width="31.3043" height="26.1" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="347.8261" y="563.45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✗</text>
  <text x="379.1305" y="563.45" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Cannot use to train competing models</text>
  <rect x="335.6522" y="580.85" width="31.3043" height="26.1" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="347.8261" y="599.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✗</text>
  <text x="379.1305" y="599.7" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Must accept Google's terms</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.6011" font-weight="bold" fill="var(--text)">Model License Comparison</text>
  <rect x="40" y="69" width="1200" height="130.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="74.7826" y="105.25" font-family="Arial, sans-serif" font-size="19.9885" font-weight="bold" fill="var(--ok-accent)">Apache 2.0</text>
  <text x="74.7826" y="129.9" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text-muted)">(Mistral, Qwen)</text>
  <rect x="335.6522" y="83.4999" width="31.3043" height="26.1" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="347.8261" y="102.35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="379.1305" y="102.35" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Commercial use</text>
  <rect x="648.6957" y="83.4999" width="31.3043" height="26.1" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.8696" y="102.35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="692.174" y="102.35" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Modification &amp; distribution</text>
  <rect x="335.6522" y="119.75" width="31.3043" height="26.1" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="347.8261" y="138.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="379.1305" y="138.6" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Patent grant</text>
  <rect x="648.6957" y="119.75" width="31.3043" height="26.1" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.8696" y="138.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="692.174" y="138.6" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">No royalties</text>
  <text x="335.6522" y="185" font-family="Arial, sans-serif" font-size="15.3757" fill="var(--text-muted)">Must include license notice</text>
  <rect x="40" y="213.9999" width="1200" height="101.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="74.7826" y="250.25" font-family="Arial, sans-serif" font-size="19.9885" font-weight="bold" fill="var(--ok-accent)">MIT</text>
  <text x="74.7826" y="274.9" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text-muted)">(Phi-3)</text>
  <rect x="335.6522" y="235.75" width="31.3043" height="26.1" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="347.8261" y="254.5999" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="379.1305" y="254.5999" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Nearly unrestricted use</text>
  <rect x="648.6957" y="235.75" width="31.3043" height="26.1" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.8696" y="254.5999" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="692.174" y="254.5999" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Commercial use</text>
  <rect x="961.7392" y="235.75" width="31.3043" height="26.1" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="973.913" y="254.5999" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4509" fill="var(--bg)">✓</text>
  <text x="1005.2175" y="254.5999" font-family="Arial, sans-serif" font-size="16.9133" fill="var(--text)">Minimal obligations</text>
  <rect x="40" y="330" width="1200" height="137.75" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="74.7826" y="366.25" font-family="Arial, sans-serif" font-size="19.9885" font-weight="bold" fill="var(--danger-accent)">LLaMA 3.1 Community</text>

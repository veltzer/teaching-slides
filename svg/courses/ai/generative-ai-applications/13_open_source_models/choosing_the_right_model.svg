<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 9.3913 L 15.0588 4.6957 z" fill="#555" />
    </marker>
  </defs>
  <text x="716.691796" y="40" text-anchor="middle" font-size="27.36118" font-weight="bold" fill="var(--primary-accent)">Decision Framework</text>
  <rect x="40" y="68.06445" width="451.127736" height="56.129024" fill="var(--warn-fill)" rx="7.54323" stroke="var(--warn-border)" stroke-width="2" />
  <text x="265.56406" y="103.924664" text-anchor="middle" font-size="22.230904" fill="var(--text)">Privacy critical?</text>
  <line x1="491.127864" y1="96.128901" x2="649.022591" y2="96.128901" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="563.308332" y="85.21503" text-anchor="middle" font-size="18.810803" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="653.533854" y="68.06445" width="451.127736" height="56.129024" fill="var(--ok-fill)" rx="7.54323" stroke="var(--ok-border)" stroke-width="2" />
  <text x="879.097786" y="103.924664" text-anchor="middle" font-size="20.520728" fill="var(--ok-accent)">Open source (self-host)</text>
  <line x1="265.56406" y1="124.193475" x2="265.56406" y2="183.440854" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="288.120376" y="160.053688" font-size="18.810803" fill="var(--danger-accent)" font-weight="bold">NO</text>
  <rect x="40" y="186.558961" width="451.127736" height="56.129024" fill="var(--warn-fill)" rx="7.54323" stroke="var(--warn-border)" stroke-width="2" />
  <text x="265.56406" y="222.419174" text-anchor="middle" font-size="22.230904" fill="var(--text)">Budget constrained?</text>
  <line x1="491.127864" y1="214.623535" x2="649.022591" y2="214.623535" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="563.308332" y="203.709541" text-anchor="middle" font-size="18.810803" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="653.533854" y="186.558961" width="541.353385" height="56.129024" fill="var(--ok-fill)" rx="7.54323" stroke="var(--ok-border)" stroke-width="2" />
  <text x="924.210674" y="222.419174" text-anchor="middle" font-size="20.520728" fill="var(--ok-accent)">Open source or GPT-4o-mini</text>
  <line x1="265.56406" y1="242.688109" x2="265.56406" y2="301.935364" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="288.120376" y="278.548322" font-size="18.810803" fill="var(--danger-accent)" font-weight="bold">NO</text>
  <rect x="40" y="305.053595" width="451.127736" height="56.129024" fill="var(--warn-fill)" rx="7.54323" stroke="var(--warn-border)" stroke-width="2" />
  <text x="265.56406" y="340.913809" text-anchor="middle" font-size="22.230904" fill="var(--text)">Need best quality?</text>
  <line x1="491.127864" y1="333.118169" x2="649.022591" y2="333.118169" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="563.308332" y="322.204175" text-anchor="middle" font-size="18.810803" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="653.533854" y="305.053595" width="541.353385" height="56.129024" fill="var(--ok-fill)" rx="7.54323" stroke="var(--ok-border)" stroke-width="2" />
  <text x="924.210674" y="340.913809" text-anchor="middle" font-size="20.520728" fill="var(--ok-accent)">GPT-4o / Claude 3.5 Sonnet</text>
  <line x1="265.56406" y1="361.18262" x2="265.56406" y2="420.429998" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="288.120376" y="397.042833" font-size="18.810803" fill="var(--danger-accent)" font-weight="bold">NO</text>
  <rect x="40" y="423.54823" width="451.127736" height="56.129024" fill="var(--warn-fill)" rx="7.54323" stroke="var(--warn-border)" stroke-width="2" />
  <text x="265.56406" y="459.408443" text-anchor="middle" font-size="22.230904" fill="var(--text)">Simple tasks?</text>
  <line x1="491.127864" y1="451.61268" x2="649.022591" y2="451.61268" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="563.308332" y="440.698809" text-anchor="middle" font-size="18.810803" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="653.533854" y="423.54823" width="541.353385" height="56.129024" fill="var(--ok-fill)" rx="7.54323" stroke="var(--ok-border)" stroke-width="2" />
  <text x="924.210674" y="450.053626" text-anchor="middle" font-size="20.520728" fill="var(--ok-accent)">Small open source (7–8B)</text>
  <text x="924.210674" y="474.999845" text-anchor="middle" font-size="20.520728" fill="var(--ok-accent)">or GPT-4o-mini</text>
  <line x1="265.56406" y1="479.677377" x2="265.56406" y2="538.924633" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="288.120376" y="515.537591" font-size="18.810803" fill="var(--danger-accent)" font-weight="bold">NO</text>
  <rect x="40" y="542.042987" width="451.127736" height="56.129024" fill="var(--warn-fill)" rx="7.54323" stroke="var(--warn-border)" stroke-width="2" />
  <text x="265.56406" y="577.903201" text-anchor="middle" font-size="22.230904" fill="var(--text)">Complex reasoning?</text>
  <line x1="491.127864" y1="570.107438" x2="649.022591" y2="570.107438" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="563.308332" y="559.19332" text-anchor="middle" font-size="18.810803" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="653.533854" y="542.042987" width="586.466146" height="77.957013" fill="var(--ok-fill)" rx="7.54323" stroke="var(--ok-border)" stroke-width="2" />
  <text x="946.766991" y="573.225669" text-anchor="middle" font-size="20.520728" fill="var(--ok-accent)">Large open source (70B+)</text>
  <text x="946.766991" y="604.40835" text-anchor="middle" font-size="20.520728" fill="var(--ok-accent)">or closed model API</text>
</svg>
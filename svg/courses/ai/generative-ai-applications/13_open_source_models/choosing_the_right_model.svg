<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="451.127736" height="58.983035102559" fill="url(#grad-warn)" rx="7.73262880395" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="265.56406" y="77.683610196879" text-anchor="middle" font-size="22.789087514003" fill="var(--text)" font-family="Arial, sans-serif">Privacy critical?</text>
  <line x1="491.127864" y1="69.491453449592" x2="649.022591" y2="69.491453449592" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="563.308332" y="58.022641230484" text-anchor="middle" font-size="19.283113083286" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">YES</text>
  <rect x="653.533854" y="40" width="451.127736" height="58.983035102559" fill="url(#grad-ok)" rx="7.73262880395" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="879.097786" y="77.683610196879" text-anchor="middle" font-size="21.035971647534" fill="var(--ok-accent)" font-family="Arial, sans-serif">Open source (self-host)</text>
  <line x1="265.56406" y1="98.983036153406" x2="265.56406" y2="161.242986287076" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="288.120376" y="136.666645299438" font-size="19.283113083286" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">NO</text>
  <rect x="40" y="164.51964070805" width="451.127736" height="58.983035102559" fill="url(#grad-warn)" rx="7.73262880395" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="265.56406" y="202.203249854082" text-anchor="middle" font-size="22.789087514003" fill="var(--text)" font-family="Arial, sans-serif">Budget constrained?</text>
  <line x1="491.127864" y1="194.011223411864" x2="649.022591" y2="194.011223411864" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="563.308332" y="182.542281938534" text-anchor="middle" font-size="19.283113083286" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">YES</text>
  <rect x="653.533854" y="164.51964070805" width="541.353385" height="58.983035102559" fill="url(#grad-ok)" rx="7.73262880395" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="924.210674" y="202.203249854082" text-anchor="middle" font-size="21.035971647534" fill="var(--ok-accent)" font-family="Arial, sans-serif">Open source or GPT-4o-mini</text>
  <line x1="265.56406" y1="223.502806115678" x2="265.56406" y2="285.762625944279" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="288.120376" y="261.186415261709" font-size="19.283113083286" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">NO</text>
  <rect x="40" y="289.039410670322" width="451.127736" height="58.983035102559" fill="url(#grad-warn)" rx="7.73262880395" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="265.56406" y="326.723020867201" text-anchor="middle" font-size="22.789087514003" fill="var(--text)" font-family="Arial, sans-serif">Need best quality?</text>
  <line x1="491.127864" y1="318.530993374136" x2="649.022591" y2="318.530993374136" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="563.308332" y="307.062051900806" text-anchor="middle" font-size="19.283113083286" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">YES</text>
  <rect x="653.533854" y="289.039410670322" width="541.353385" height="58.983035102559" fill="url(#grad-ok)" rx="7.73262880395" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="924.210674" y="326.723020867201" text-anchor="middle" font-size="21.035971647534" fill="var(--ok-accent)" font-family="Arial, sans-serif">GPT-4o / Claude 3.5 Sonnet</text>
  <line x1="265.56406" y1="348.022446823728" x2="265.56406" y2="410.282395906551" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="288.120376" y="385.706055969759" font-size="19.283113083286" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">NO</text>
  <rect x="40" y="413.559181683441" width="451.127736" height="58.983035102559" fill="url(#grad-warn)" rx="7.73262880395" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="265.56406" y="451.242790829473" text-anchor="middle" font-size="22.789087514003" fill="var(--text)" font-family="Arial, sans-serif">Simple tasks?</text>
  <line x1="491.127864" y1="443.050634082186" x2="649.022591" y2="443.050634082186" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="563.308332" y="431.581821863078" text-anchor="middle" font-size="19.283113083286" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">YES</text>
  <rect x="653.533854" y="413.559181683441" width="541.353385" height="58.983035102559" fill="url(#grad-ok)" rx="7.73262880395" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="924.210674" y="441.412306346275" text-anchor="middle" font-size="21.035971647534" fill="var(--ok-accent)" font-family="Arial, sans-serif">Small open source (7–8B)</text>
  <text x="924.210674" y="467.626974018977" text-anchor="middle" font-size="21.035971647534" fill="var(--ok-accent)" font-family="Arial, sans-serif">or GPT-4o-mini</text>
  <line x1="265.56406" y1="472.542346040221" x2="265.56406" y2="534.80216691967" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="288.120376" y="510.2259562371" font-size="19.283113083286" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">NO</text>
  <rect x="40" y="538.079080899935" width="451.127736" height="58.983035102559" fill="url(#grad-warn)" rx="7.73262880395" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="265.56406" y="575.762691096814" text-anchor="middle" font-size="22.789087514003" fill="var(--text)" font-family="Arial, sans-serif">Complex reasoning?</text>
  <line x1="491.127864" y1="567.570534349527" x2="649.022591" y2="567.570534349527" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="563.308332" y="556.101462571128" text-anchor="middle" font-size="19.283113083286" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">YES</text>
  <rect x="653.533854" y="538.079080899935" width="586.466146" height="81.920919100065" fill="url(#grad-ok)" rx="7.73262880395" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="946.766991" y="570.84731907557" text-anchor="middle" font-size="21.035971647534" fill="var(--ok-accent)" font-family="Arial, sans-serif">Large open source (70B+)</text>
  <text x="946.766991" y="603.615556200357" text-anchor="middle" font-size="21.035971647534" fill="var(--ok-accent)" font-family="Arial, sans-serif">or closed model API</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 9.3913 L 15.0588 4.6957 z" fill="#555" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1137.7778" height="640" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="36.174" text-anchor="middle" font-size="22.2609" font-weight="bold" fill="var(--primary-accent)">Decision Framework</text>
  <rect x="66.9281" y="61.2174" width="334.6405" height="50.0869" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="234.2484" y="93.2174" text-anchor="middle" font-size="18.0869" fill="var(--text)">Privacy critical?</text>
  <line x1="401.5686" y1="86.2609" x2="518.6928" y2="86.2609" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="455.1111" y="76.5218" text-anchor="middle" font-size="15.3044" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="522.0392" y="61.2174" width="334.6405" height="50.0869" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="689.3595" y="93.2174" text-anchor="middle" font-size="16.6956" fill="var(--ok-accent)">Open source (self-host)</text>
  <line x1="234.2484" y1="111.3044" x2="234.2484" y2="164.174" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="250.9804" y="143.3044" font-size="15.3044" fill="var(--danger-accent)" font-weight="bold">NO</text>
  <rect x="66.9281" y="166.9565" width="334.6405" height="50.0869" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="234.2484" y="198.9565" text-anchor="middle" font-size="18.0869" fill="var(--text)">Budget constrained?</text>
  <line x1="401.5686" y1="192" x2="518.6928" y2="192" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="455.1111" y="182.2609" text-anchor="middle" font-size="15.3044" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="522.0392" y="166.9565" width="401.5686" height="50.0869" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="722.8236" y="198.9565" text-anchor="middle" font-size="16.6956" fill="var(--ok-accent)">Open source or GPT-4o-mini</text>
  <line x1="234.2484" y1="217.0435" x2="234.2484" y2="269.9131" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="250.9804" y="249.0435" font-size="15.3044" fill="var(--danger-accent)" font-weight="bold">NO</text>
  <rect x="66.9281" y="272.6956" width="334.6405" height="50.0869" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="234.2484" y="304.6956" text-anchor="middle" font-size="18.0869" fill="var(--text)">Need best quality?</text>
  <line x1="401.5686" y1="297.7391" x2="518.6928" y2="297.7391" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="455.1111" y="288" text-anchor="middle" font-size="15.3044" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="522.0392" y="272.6956" width="401.5686" height="50.0869" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="722.8236" y="304.6956" text-anchor="middle" font-size="16.6956" fill="var(--ok-accent)">GPT-4o / Claude 3.5 Sonnet</text>
  <line x1="234.2484" y1="322.7826" x2="234.2484" y2="375.6522" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="250.9804" y="354.7826" font-size="15.3044" fill="var(--danger-accent)" font-weight="bold">NO</text>
  <rect x="66.9281" y="378.4348" width="334.6405" height="50.0869" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="234.2484" y="410.4348" text-anchor="middle" font-size="18.0869" fill="var(--text)">Simple tasks?</text>
  <line x1="401.5686" y1="403.4782" x2="518.6928" y2="403.4782" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="455.1111" y="393.7391" text-anchor="middle" font-size="15.3044" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="522.0392" y="378.4348" width="401.5686" height="50.0869" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="722.8236" y="402.0869" text-anchor="middle" font-size="16.6956" fill="var(--ok-accent)">Small open source (7–8B)</text>
  <text x="722.8236" y="424.3478" text-anchor="middle" font-size="16.6956" fill="var(--ok-accent)">or GPT-4o-mini</text>
  <line x1="234.2484" y1="428.5218" x2="234.2484" y2="481.3913" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="250.9804" y="460.5218" font-size="15.3044" fill="var(--danger-accent)" font-weight="bold">NO</text>
  <rect x="66.9281" y="484.174" width="334.6405" height="50.0869" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="234.2484" y="516.174" text-anchor="middle" font-size="18.0869" fill="var(--text)">Complex reasoning?</text>
  <line x1="401.5686" y1="509.2174" x2="518.6928" y2="509.2174" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="455.1111" y="499.4782" text-anchor="middle" font-size="15.3044" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="522.0392" y="484.174" width="435.0327" height="69.5652" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="739.5556" y="512" text-anchor="middle" font-size="16.6956" fill="var(--ok-accent)">Large open source (70B+)</text>
  <text x="739.5556" y="539.826" text-anchor="middle" font-size="16.6956" fill="var(--ok-accent)">or closed model API</text>
</svg>
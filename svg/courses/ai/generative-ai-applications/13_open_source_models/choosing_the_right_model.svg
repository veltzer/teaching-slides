<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 9.3913 L 15.0588 4.6957 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="72.7827" text-anchor="middle" font-size="21.7635" font-weight="bold" fill="var(--primary-accent)">Decision Framework</text>
  <rect x="110.5882" y="95.4783" width="352.9411" height="45.3913" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="287.0589" y="124.4783" text-anchor="middle" font-size="17.6828" fill="var(--text)">Privacy critical?</text>
  <line x1="463.5294" y1="118.1739" x2="587.0588" y2="118.1739" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="520" y="109.3479" text-anchor="middle" font-size="14.9624" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="590.5882" y="95.4783" width="352.9411" height="45.3913" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="767.0588" y="124.4783" text-anchor="middle" font-size="16.3225" fill="var(--ok-accent)">Open source (self-host)</text>
  <line x1="287.0589" y1="140.8696" x2="287.0589" y2="188.7827" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="304.7059" y="169.8696" font-size="14.9624" fill="var(--danger-accent)" font-weight="bold">NO</text>
  <rect x="110.5882" y="191.3043" width="352.9411" height="45.3913" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="287.0589" y="220.3043" text-anchor="middle" font-size="17.6828" fill="var(--text)">Budget constrained?</text>
  <line x1="463.5294" y1="214" x2="587.0588" y2="214" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="520" y="205.1739" text-anchor="middle" font-size="14.9624" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="590.5882" y="191.3043" width="423.5294" height="45.3913" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="802.353" y="220.3043" text-anchor="middle" font-size="16.3225" fill="var(--ok-accent)">Open source or GPT-4o-mini</text>
  <line x1="287.0589" y1="236.6957" x2="287.0589" y2="284.6087" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="304.7059" y="265.6957" font-size="14.9624" fill="var(--danger-accent)" font-weight="bold">NO</text>
  <rect x="110.5882" y="287.1304" width="352.9411" height="45.3913" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="287.0589" y="316.1304" text-anchor="middle" font-size="17.6828" fill="var(--text)">Need best quality?</text>
  <line x1="463.5294" y1="309.8261" x2="587.0588" y2="309.8261" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="520" y="301" text-anchor="middle" font-size="14.9624" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="590.5882" y="287.1304" width="423.5294" height="45.3913" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="802.353" y="316.1304" text-anchor="middle" font-size="16.3225" fill="var(--ok-accent)">GPT-4o / Claude 3.5 Sonnet</text>
  <line x1="287.0589" y1="332.5217" x2="287.0589" y2="380.4348" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="304.7059" y="361.5217" font-size="14.9624" fill="var(--danger-accent)" font-weight="bold">NO</text>
  <rect x="110.5882" y="382.9565" width="352.9411" height="45.3913" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="287.0589" y="411.9565" text-anchor="middle" font-size="17.6828" fill="var(--text)">Simple tasks?</text>
  <line x1="463.5294" y1="405.6521" x2="587.0588" y2="405.6521" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="520" y="396.8261" text-anchor="middle" font-size="14.9624" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="590.5882" y="382.9565" width="423.5294" height="45.3913" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="802.353" y="404.3913" text-anchor="middle" font-size="16.3225" fill="var(--ok-accent)">Small open source (7–8B)</text>
  <text x="802.353" y="424.5652" text-anchor="middle" font-size="16.3225" fill="var(--ok-accent)">or GPT-4o-mini</text>
  <line x1="287.0589" y1="428.3479" x2="287.0589" y2="476.2609" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="304.7059" y="457.3479" font-size="14.9624" fill="var(--danger-accent)" font-weight="bold">NO</text>
  <rect x="110.5882" y="478.7827" width="352.9411" height="45.3913" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="287.0589" y="507.7827" text-anchor="middle" font-size="17.6828" fill="var(--text)">Complex reasoning?</text>
  <line x1="463.5294" y1="501.4783" x2="587.0588" y2="501.4783" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#ah)" />
  <text x="520" y="492.6521" text-anchor="middle" font-size="14.9624" fill="var(--ok-accent)" font-weight="bold">YES</text>
  <rect x="590.5882" y="478.7827" width="458.8235" height="63.0435" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="820" y="504" text-anchor="middle" font-size="16.3225" fill="var(--ok-accent)">Large open source (70B+)</text>
  <text x="820" y="529.2173" text-anchor="middle" font-size="16.3225" fill="var(--ok-accent)">or closed model API</text>
</svg>
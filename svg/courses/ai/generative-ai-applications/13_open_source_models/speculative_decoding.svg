<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Speculative Decoding</text>

  <!-- Standard decoding section -->
  <rect x="30" y="45" width="340" height="120" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="200" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc3545">Standard Decoding (Slow)</text>
  <rect x="50" y="80" width="100" height="35" rx="5" fill="#fff" stroke="#dc3545"/>
  <text x="100" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">70B Model</text>
  <line x1="150" y1="97" x2="180" y2="97" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="92" font-family="Arial, sans-serif" font-size="11" fill="#555">1 token</text>
  <line x1="250" y1="97" x2="280" y2="97" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="315" y="92" font-family="Arial, sans-serif" font-size="11" fill="#555">1 token</text>
  <text x="200" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Each token = 1 full forward pass of 70B</text>
  <text x="200" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Very slow for long sequences</text>

  <!-- Speculative decoding section -->
  <rect x="400" y="45" width="370" height="170" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="585" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#28a745">Speculative Decoding (Fast)</text>

  <!-- Step 1 -->
  <rect x="420" y="80" width="130" height="35" rx="5" fill="#fff" stroke="#28a745"/>
  <text x="485" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Step 1: Draft</text>
  <text x="485" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">7B model, K tokens</text>
  <line x1="550" y1="97" x2="570" y2="97" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="575" y="80" width="175" height="35" rx="5" fill="#fff" stroke="#28a745"/>
  <text x="662" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Step 2: Verify all K at once</text>
  <text x="662" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">70B model, 1 pass</text>

  <!-- Step 3 -->
  <text x="585" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Step 3: Accept correct, reject wrong, continue</text>

  <!-- Example tokens -->
  <text x="420" y="165" font-family="Arial, sans-serif" font-size="10" fill="#555">Draft: "The capital of France is Paris"</text>
  <text x="420" y="180" font-family="monospace" font-size="10" fill="#28a745">"The" ok "capital" ok "of" ok "France" ok "is" ok "Paris" ok</text>
  <text x="420" y="200" font-family="Arial, sans-serif" font-size="10" fill="#28a745">6 tokens for ~2 large model passes!</text>

  <!-- Comparison section -->
  <rect x="150" y="240" width="500" height="80" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a90e2">Example Verification</text>
  <text x="400" y="285" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">"The" &#x2713; "capital" &#x2713; "of" &#x2713; "France" &#x2713; "is" &#x2713; "Paris" &#x2713;</text>
  <text x="400" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">All 6 tokens verified in ONE forward pass of the large model</text>

  <!-- Result box -->
  <rect x="180" y="340" width="440" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#28a745">Speedup: 2-3x with NO quality loss!</text>
  <text x="400" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Quality is identical -- only verified tokens are used</text>
  <text x="400" y="403" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#777">The large model always has the final say</text>
</svg>
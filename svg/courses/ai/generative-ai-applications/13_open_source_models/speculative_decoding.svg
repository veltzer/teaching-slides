<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="10.5" refX="16" refY="5.25" orient="auto">
      <polygon points="0,15 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="37.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">Speculative Decoding</text>
  <rect x="48" y="67.5" width="544" height="180" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="2.25" />
  <text x="320" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5" font-weight="bold" fill="#dc3545">Standard Decoding (Slow)</text>
  <rect x="80" y="120" width="160" height="52.5" rx="7.5" fill="#fff" stroke="#dc3545" />
  <text x="160" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" fill="#333">70B Model</text>
  <line x1="240" y1="145.5" x2="288" y2="145.5" stroke="#dc3545" stroke-width="2.25" marker-end="url(#arrow)" />
  <text x="352" y="138" font-family="Arial, sans-serif" font-size="16.5" fill="#555">1 token</text>
  <line x1="400" y1="145.5" x2="448" y2="145.5" stroke="#dc3545" stroke-width="2.25" marker-end="url(#arrow)" />
  <text x="504" y="138" font-family="Arial, sans-serif" font-size="16.5" fill="#555">1 token</text>
  <text x="320" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" fill="#555">Each token = 1 full forward pass of 70B</text>
  <text x="320" y="232.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#888">Very slow for long sequences</text>
  <rect x="640" y="67.5" width="592" height="255" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="936" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5" font-weight="bold" fill="#28a745">Speculative Decoding (Fast)</text>
  <rect x="672" y="120" width="208" height="52.5" rx="7.5" fill="#fff" stroke="#28a745" />
  <text x="776" y="142.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Step 1: Draft</text>
  <text x="776" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#555">7B model, K tokens</text>
  <line x1="880" y1="145.5" x2="912" y2="145.5" stroke="#28a745" stroke-width="2.25" marker-end="url(#arrow)" />
  <rect x="920" y="120" width="280" height="52.5" rx="7.5" fill="#fff" stroke="#28a745" />
  <text x="1059.2" y="142.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Step 2: Verify all K at once</text>
  <text x="1059.2" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#555">70B model, 1 pass</text>
  <text x="936" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" fill="#333">Step 3: Accept correct, reject wrong, continue</text>
  <text x="672" y="247.5" font-family="Arial, sans-serif" font-size="15" fill="#555">Draft: "The capital of France is Paris"</text>
  <text x="672" y="270" font-family="monospace" font-size="15" fill="#28a745">"The" ok "capital" ok "of" ok "France" ok "is" ok "Paris" ok</text>
  <text x="672" y="300" font-family="Arial, sans-serif" font-size="15" fill="#28a745">6 tokens for ~2 large model passes!</text>
  <rect x="240" y="360" width="800" height="120" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="397.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#4a90e2">Example Verification</text>
  <text x="640" y="427.5" text-anchor="middle" font-family="monospace" font-size="16.5" fill="#333">"The" ✓ "capital" ✓ "of" ✓ "France" ✓ "is" ✓ "Paris" ✓</text>
  <text x="640" y="457.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" fill="#555">All 6 tokens verified in ONE forward pass of the large model</text>
  <rect x="288" y="510" width="704" height="105" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="640" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#28a745">Speedup: 2-3x with NO quality loss!</text>
  <text x="640" y="580.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#555">Quality is identical -- only verified tokens are used</text>
  <text x="640" y="604.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" fill="#777">The large model always has the final say</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="37.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text)">Speculative Decoding</text>
  <rect x="48" y="67.5" width="544" height="180" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="320" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5" font-weight="bold" fill="var(--danger-accent)">Standard Decoding (Slow)</text>
  <rect x="80" y="120" width="160" height="52.5" rx="6" fill="var(--bg)" stroke="var(--danger-border)" />
  <text x="160" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" fill="var(--text)">70B Model</text>
  <line x1="240" y1="145.5" x2="288" y2="145.5" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="352" y="138" font-family="Arial, sans-serif" font-size="16.5" fill="var(--text-muted)">1 token</text>
  <line x1="400" y1="145.5" x2="448" y2="145.5" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="504" y="138" font-family="Arial, sans-serif" font-size="16.5" fill="var(--text-muted)">1 token</text>
  <text x="320" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" fill="var(--text-muted)">Each token = 1 full forward pass of 70B</text>
  <text x="320" y="232.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-faint)">Very slow for long sequences</text>
  <rect x="640" y="67.5" width="592" height="255" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="936" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5" font-weight="bold" fill="var(--ok-accent)">Speculative Decoding (Fast)</text>
  <rect x="672" y="120" width="208" height="52.5" rx="6" fill="var(--bg)" stroke="var(--ok-border)" />
  <text x="776" y="142.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Step 1: Draft</text>
  <text x="776" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">7B model, K tokens</text>
  <line x1="880" y1="145.5" x2="912" y2="145.5" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="920" y="120" width="280" height="52.5" rx="6" fill="var(--bg)" stroke="var(--ok-border)" />
  <text x="1059.2" y="142.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Step 2: Verify all K at once</text>
  <text x="1059.2" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">70B model, 1 pass</text>
  <text x="936" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" fill="var(--text)">Step 3: Accept correct, reject wrong, continue</text>
  <text x="672" y="247.5" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Draft: "The capital of France is Paris"</text>
  <text x="672" y="270" font-family="monospace" font-size="15" fill="var(--ok-accent)">"The" ok "capital" ok "of" ok "France" ok "is" ok "Paris" ok</text>
  <text x="672" y="300" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-accent)">6 tokens for ~2 large model passes!</text>
  <rect x="240" y="360" width="800" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="397.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="var(--primary-accent)">Example Verification</text>
  <text x="640" y="427.5" text-anchor="middle" font-family="monospace" font-size="16.5" fill="var(--text)">"The" ✓ "capital" ✓ "of" ✓ "France" ✓ "is" ✓ "Paris" ✓</text>
  <text x="640" y="457.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" fill="var(--text-muted)">All 6 tokens verified in ONE forward pass of the large model</text>
  <rect x="288" y="510" width="704" height="105" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="var(--ok-accent)">Speedup: 2-3x with NO quality loss!</text>
  <text x="640" y="580.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Quality is identical -- only verified tokens are used</text>
  <text x="640" y="604.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" fill="var(--text-muted)">The large model always has the final say</text>
</svg>
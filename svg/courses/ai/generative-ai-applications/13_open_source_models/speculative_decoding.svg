<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.2139" font-weight="bold" fill="var(--text)">Speculative Decoding</text>
  <rect x="40" y="70.1299" width="551.3514" height="180.7792" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="315.6757" y="104.7792" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6738" font-weight="bold" fill="var(--danger-accent)">Standard Decoding (Slow)</text>
  <rect x="72.4324" y="122.8571" width="162.1622" height="52.7273" rx="6" fill="var(--bg)" stroke="var(--danger-border)" />
  <text x="153.5135" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.647" fill="var(--text)">70B Model</text>
  <line x1="234.5946" y1="148.4675" x2="283.2432" y2="148.4675" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="348.1081" y="140.9351" font-family="Arial, sans-serif" font-size="16.647" fill="var(--text-muted)">1 token</text>
  <line x1="396.7568" y1="148.4675" x2="445.4054" y2="148.4675" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="502.1622" y="140.9351" font-family="Arial, sans-serif" font-size="16.647" fill="var(--text-muted)">1 token</text>
  <text x="315.6757" y="213.2468" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.647" fill="var(--text-muted)">Each token = 1 full forward pass of 70B</text>
  <text x="315.6757" y="235.8442" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1337" fill="var(--text-faint)">Very slow for long sequences</text>
  <rect x="640" y="70.1299" width="600" height="256.1039" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="940" y="104.7792" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6738" font-weight="bold" fill="var(--ok-accent)">Speculative Decoding (Fast)</text>
  <rect x="672.4324" y="122.8571" width="210.8108" height="52.7273" rx="6" fill="var(--bg)" stroke="var(--ok-border)" />
  <text x="777.8378" y="145.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1337" font-weight="bold" fill="var(--text)">Step 1: Draft</text>
  <text x="777.8378" y="165.039" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1337" fill="var(--text-muted)">7B model, K tokens</text>
  <line x1="883.2432" y1="148.4675" x2="915.6757" y2="148.4675" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="923.7838" y="122.8571" width="283.7838" height="52.7273" rx="6" fill="var(--bg)" stroke="var(--ok-border)" />
  <text x="1064.8649" y="145.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1337" font-weight="bold" fill="var(--text)">Step 2: Verify all K at once</text>
  <text x="1064.8649" y="165.039" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1337" fill="var(--text-muted)">70B model, 1 pass</text>
  <text x="940" y="213.2468" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.647" fill="var(--text)">Step 3: Accept correct, reject wrong, continue</text>
  <text x="672.4324" y="250.9091" font-family="Arial, sans-serif" font-size="15.1337" fill="var(--text-muted)">Draft: "The capital of France is Paris"</text>
  <text x="672.4324" y="273.5065" font-family="monospace" font-size="15.1337" fill="var(--ok-accent)">"The" ok "capital" ok "of" ok "France" ok "is" ok "Paris" ok</text>
  <text x="672.4324" y="303.6364" font-family="Arial, sans-serif" font-size="15.1337" fill="var(--ok-accent)">6 tokens for ~2 large model passes!</text>
  <rect x="234.5946" y="363.8961" width="810.8108" height="120.5195" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="401.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1871" font-weight="bold" fill="var(--primary-accent)">Example Verification</text>
  <text x="640" y="431.6883" text-anchor="middle" font-family="monospace" font-size="16.647" fill="var(--text)">"The" ✓ "capital" ✓ "of" ✓ "France" ✓ "is" ✓ "Paris" ✓</text>
  <text x="640" y="461.8182" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.647" fill="var(--text-muted)">All 6 tokens verified in ONE forward pass of the large model</text>
  <rect x="283.2432" y="514.5455" width="713.5135" height="105.4545" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="552.2078" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1871" font-weight="bold" fill="var(--ok-accent)">Speedup: 2-3x with NO quality loss!</text>
  <text x="640" y="585.3506" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1604" fill="var(--text-muted)">Quality is identical -- only verified tokens are used</text>
  <text x="640" y="609.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.647" fill="var(--text-muted)">The large model always has the final say</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 22.7368 L 17.0667 11.3684 z" fill="#555" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1137.7778" height="640" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="568.8889" y="87.5789" text-anchor="middle" font-size="28.4444" font-weight="bold" fill="var(--warn-accent)">Total Cost of Ownership (1M requests/month)</text>
  <line x1="37.926" y1="114.5263" x2="1099.8518" y2="114.5263" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="37.926" y="141.4737" width="474.074" height="94.3158" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="515.7926" y="141.4737" width="584.0593" height="94.3158" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="274.9629" y="205.4737" text-anchor="middle" font-size="24.6518" font-weight="bold" fill="var(--text)">Option</text>
  <text x="807.8222" y="205.4737" text-anchor="middle" font-size="24.6518" font-weight="bold" fill="var(--text)">Cost</text>
  <rect x="37.926" y="242.5263" width="474.074" height="87.5789" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <rect x="515.7926" y="242.5263" width="584.0593" height="87.5789" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="66.3704" y="303.1579" font-size="24.6518" fill="var(--text)">GPT-4o API</text>
  <text x="544.2371" y="303.1579" font-size="24.6518" fill="var(--text)">~$5,000–50,000/month</text>
  <rect x="37.926" y="336.8421" width="474.074" height="87.5789" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="515.7926" y="336.8421" width="584.0593" height="87.5789" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="66.3704" y="397.4737" font-size="24.6518" fill="var(--text)">GPT-4o-mini API</text>
  <text x="544.2371" y="397.4737" font-size="24.6518" fill="var(--text)">~$300–3,000/month</text>
  <rect x="37.926" y="431.1579" width="474.074" height="87.5789" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <rect x="515.7926" y="431.1579" width="584.0593" height="87.5789" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="66.3704" y="491.7895" font-size="24.6518" fill="var(--text)">Self-hosted 70B</text>
  <text x="544.2371" y="491.7895" font-size="24.6518" fill="var(--text)">~$2,000–5,000/month (GPU rental)</text>
  <rect x="37.926" y="525.4737" width="474.074" height="87.5789" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="515.7926" y="525.4737" width="584.0593" height="87.5789" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="66.3704" y="586.1052" font-size="24.6518" fill="var(--text)">Self-hosted 7B</text>
  <text x="544.2371" y="586.1052" font-size="24.6518" fill="var(--text)">~$200–500/month (single GPU)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 22.7368 L 17.0667 11.3684 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="119.3684" text-anchor="middle" font-size="27.8088" font-weight="bold" fill="var(--warn-accent)">Total Cost of Ownership (1M requests/month)</text>
  <line x1="80.0001" y1="143.7895" x2="1199.9999" y2="143.7895" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="80.0001" y="168.2105" width="499.9999" height="85.4737" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="584" y="168.2105" width="616" height="85.4737" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.9999" y="226.2105" text-anchor="middle" font-size="24.101" font-weight="bold" fill="var(--text)">Option</text>
  <text x="892" y="226.2105" text-anchor="middle" font-size="24.101" font-weight="bold" fill="var(--text)">Cost</text>
  <rect x="80.0001" y="259.7895" width="499.9999" height="79.3684" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <rect x="584" y="259.7895" width="616" height="79.3684" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="110" y="314.7368" font-size="24.101" fill="var(--text)">GPT-4o API</text>
  <text x="614.0001" y="314.7368" font-size="24.101" fill="var(--text)">~$5,000–50,000/month</text>
  <rect x="80.0001" y="345.2632" width="499.9999" height="79.3684" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="584" y="345.2632" width="616" height="79.3684" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="400.2105" font-size="24.101" fill="var(--text)">GPT-4o-mini API</text>
  <text x="614.0001" y="400.2105" font-size="24.101" fill="var(--text)">~$300–3,000/month</text>
  <rect x="80.0001" y="430.7368" width="499.9999" height="79.3684" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <rect x="584" y="430.7368" width="616" height="79.3684" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="110" y="485.6842" font-size="24.101" fill="var(--text)">Self-hosted 70B</text>
  <text x="614.0001" y="485.6842" font-size="24.101" fill="var(--text)">~$2,000–5,000/month (GPU rental)</text>
  <rect x="80.0001" y="516.2105" width="499.9999" height="79.3684" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="584" y="516.2105" width="616" height="79.3684" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="571.1578" font-size="24.101" fill="var(--text)">Self-hosted 7B</text>
  <text x="614.0001" y="571.1578" font-size="24.101" fill="var(--text)">~$200–500/month (single GPU)</text>
</svg>
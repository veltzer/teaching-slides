<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999946428567" y="40" text-anchor="middle" font-size="31.767160192637" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Total Cost of Ownership (1M requests/month)</text>
  <line x1="40" y1="69.743649079556" x2="1239.999892857133" y2="69.743649079556" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="40" y="99.487176364234" width="535.714226403056" height="104.102589086129" fill="url(#grad-warn)" rx="6.85405199634" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="579.999941071423" y="99.487176364234" width="660.000058928577" height="104.102589086129" fill="url(#grad-warn)" rx="6.85405199634" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.856952487228" y="170.128205908942" text-anchor="middle" font-size="27.531584527299" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Option</text>
  <text x="909.999970535712" y="170.128205908942" text-anchor="middle" font-size="27.531584527299" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Cost</text>
  <rect x="40" y="211.025708168971" width="535.714226403056" height="96.66664636752" fill="var(--surface)" rx="6.85405199634" stroke="var(--border)" stroke-width="1"/>
  <rect x="579.999941071423" y="211.025708168971" width="660.000058928577" height="96.66664636752" fill="var(--surface)" rx="6.85405199634" stroke="var(--border)" stroke-width="1"/>
  <text x="72.142752869889" y="277.948705456936" font-size="27.531584527299" fill="var(--text)" font-family="Arial, sans-serif">GPT-4o API</text>
  <text x="612.142908227045" y="277.948705456936" font-size="27.531584527299" fill="var(--text)" font-family="Arial, sans-serif">~$5,000–50,000/month</text>
  <rect x="40" y="315.1282972551" width="535.714226403056" height="96.66664636752" fill="url(#grad-warn)" rx="6.85405199634" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="579.999941071423" y="315.1282972551" width="660.000058928577" height="96.66664636752" fill="url(#grad-warn)" rx="6.85405199634" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="72.142752869889" y="382.051294543065" font-size="27.531584527299" fill="var(--text)" font-family="Arial, sans-serif">GPT-4o-mini API</text>
  <text x="612.142908227045" y="382.051294543065" font-size="27.531584527299" fill="var(--text)" font-family="Arial, sans-serif">~$300–3,000/month</text>
  <rect x="40" y="419.230764546351" width="535.714226403056" height="96.66664636752" fill="var(--surface)" rx="6.85405199634" stroke="var(--border)" stroke-width="1"/>
  <rect x="579.999941071423" y="419.230764546351" width="660.000058928577" height="96.66664636752" fill="var(--surface)" rx="6.85405199634" stroke="var(--border)" stroke-width="1"/>
  <text x="72.142752869889" y="486.153883629193" font-size="27.531584527299" fill="var(--text)" font-family="Arial, sans-serif">Self-hosted 70B</text>
  <text x="612.142908227045" y="486.153883629193" font-size="27.531584527299" fill="var(--text)" font-family="Arial, sans-serif">~$2,000–5,000/month (GPU rental)</text>
  <rect x="40" y="523.33335363248" width="535.714226403056" height="96.66664636752" fill="url(#grad-warn)" rx="6.85405199634" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="579.999941071423" y="523.33335363248" width="660.000058928577" height="96.66664636752" fill="url(#grad-warn)" rx="6.85405199634" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="72.142752869889" y="590.256350920444" font-size="27.531584527299" fill="var(--text)" font-family="Arial, sans-serif">Self-hosted 7B</text>
  <text x="612.142908227045" y="590.256350920444" font-size="27.531584527299" fill="var(--text)" font-family="Arial, sans-serif">~$200–500/month (single GPU)</text>
</svg>

  <ns0:line x1="43.7607" y1="121.6" x2="1094.0171" y2="121.6" stroke="#1565c0" stroke-width="3.282" />
  <ns0:text x="87.5213" y="198.4" font-size="30.6324" fill="#222">1. Open source model landscape</ns0:text>
  <ns0:text x="87.5213" y="275.2" font-size="30.6324" fill="#222">2. HuggingFace infrastructure</ns0:text>
  <ns0:text x="87.5213" y="352" font-size="30.6324" fill="#222">3. Running models locally</ns0:text>
  <ns0:text x="87.5213" y="428.8" font-size="30.6324" fill="#222">4. Parameter Efficient Fine Tuning</ns0:text>
  <ns0:text x="87.5213" y="505.6" font-size="30.6324" fill="#222">5. LoRA, QLoRA, and Prompt Tuning</ns0:text>

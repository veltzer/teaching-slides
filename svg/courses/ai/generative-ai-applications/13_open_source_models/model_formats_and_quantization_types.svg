<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="0" y="0" width="1137.7778" height="640" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <rect x="0" y="0" width="1137.7778" height="53.5814" fill="var(--text-muted)" rx="6" stroke="var(--text)" stroke-width="2.2325" />
  <rect x="0" y="26.7907" width="1137.7778" height="26.7907" fill="var(--text-muted)" rx="6"/>
  <text x="568.8889" y="35.7209" text-anchor="middle" font-size="22.3256" font-weight="bold" fill="var(--bg)">MODEL FILE FORMATS</text>
  <rect x="17.239" y="62.5116" width="224.1077" height="41.6744" fill="var(--border)" stroke="var(--text)" stroke-width="1.4884" rx="6"/>
  <rect x="241.3468" y="62.5116" width="879.1919" height="41.6744" fill="var(--border)" stroke="var(--text)" stroke-width="1.4884" rx="6"/>
  <text x="129.2929" y="90.7907" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text)">Format</text>
  <text x="680.9428" y="90.7907" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text)">Description</text>
  <rect x="17.239" y="104.186" width="224.1077" height="71.4419" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <rect x="241.3468" y="104.186" width="879.1919" height="71.4419" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="129.2929" y="133.9535" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text)">PyTorch</text>
  <text x="129.2929" y="160.7442" text-anchor="middle" font-size="17.8604" fill="var(--text-muted)">(.bin)</text>
  <text x="262.0337" y="130.9767" font-size="19.3488" fill="var(--text)">.bin / .pt — native PyTorch format</text>
  <text x="262.0337" y="160.7442" font-size="19.3488" fill="var(--text-muted)">Widely supported, large file sizes</text>
  <rect x="17.239" y="175.6279" width="224.1077" height="92.2791" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="241.3468" y="175.6279" width="879.1919" height="92.2791" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="129.2929" y="208.3721" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text)">SafeTensors</text>
  <text x="262.0337" y="202.4186" font-size="19.3488" fill="var(--text)">.safetensors — safe, fast loading</text>
  <text x="262.0337" y="229.2093" font-size="19.3488" fill="var(--text-muted)">No code execution risk, faster I/O</text>
  <text x="262.0337" y="256" font-size="19.3488" fill="var(--text-muted)">Becoming the new standard</text>
  <rect x="17.239" y="267.9069" width="224.1077" height="92.2791" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <rect x="241.3468" y="267.9069" width="879.1919" height="92.2791" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="129.2929" y="300.6512" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text)">GGUF</text>
  <text x="262.0337" y="294.6977" font-size="19.3488" fill="var(--text)">.gguf — llama.cpp format</text>
  <text x="262.0337" y="321.4884" font-size="19.3488" fill="var(--text-muted)">CPU-optimized, supports quantization</text>
  <text x="262.0337" y="348.2791" font-size="19.3488" fill="var(--text-muted)">Used by Ollama, LM Studio</text>
  <rect x="17.239" y="360.186" width="224.1077" height="92.2791" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="241.3468" y="360.186" width="879.1919" height="92.2791" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="129.2929" y="392.9302" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text)">GPTQ</text>
  <text x="262.0337" y="386.9767" font-size="19.3488" fill="var(--text)">GPU-optimized quantization</text>
  <text x="262.0337" y="413.7675" font-size="19.3488" fill="var(--text-muted)">Post-training quantization</text>
  <text x="262.0337" y="440.5581" font-size="19.3488" fill="var(--text-muted)">Good quality at 4-bit</text>
  <rect x="17.239" y="452.4652" width="224.1077" height="92.2791" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <rect x="241.3468" y="452.4652" width="879.1919" height="92.2791" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="129.2929" y="485.2093" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text)">AWQ</text>
  <text x="262.0337" y="479.2558" font-size="19.3488" fill="var(--text)">Activation-aware quantization</text>
  <text x="262.0337" y="506.0465" font-size="19.3488" fill="var(--text-muted)">Better quality than GPTQ at same bits</text>
  <text x="262.0337" y="532.8372" font-size="19.3488" fill="var(--text-muted)">Preserves important weights</text>
  <rect x="17.239" y="544.7442" width="224.1077" height="80.3721" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="241.3468" y="544.7442" width="879.1919" height="80.3721" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="129.2929" y="577.4884" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text)">EXL2</text>
  <text x="262.0337" y="571.5348" font-size="19.3488" fill="var(--text)">ExLlamaV2 format</text>
  <text x="262.0337" y="598.3256" font-size="19.3488" fill="var(--text-muted)">Flexible per-layer quantization; fastest inference on GPU</text>
</svg>
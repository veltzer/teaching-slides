<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="49.714248" fill="var(--text-muted)" rx="6.071009" stroke="var(--text)" stroke-width="2.2325" />
  <rect x="40" y="64.857175" width="1200" height="24.857175" fill="var(--text-muted)" rx="6.071009"/>
  <text x="640" y="73.142866" text-anchor="middle" font-size="22.085014" font-weight="bold" fill="var(--bg)">MODEL FILE FORMATS</text>
  <rect x="58.1818" y="97.999939" width="236.3636" height="38.666626" fill="var(--border)" stroke="var(--text)" stroke-width="1.4884" rx="6.071009"/>
  <rect x="294.5454" y="97.999939" width="927.2727" height="38.666626" fill="var(--border)" stroke="var(--text)" stroke-width="1.4884" rx="6.071009"/>
  <text x="176.3636" y="124.23813" text-anchor="middle" font-size="19.140372" font-weight="bold" fill="var(--text)">Format</text>
  <text x="758.1818" y="124.23813" text-anchor="middle" font-size="19.140372" font-weight="bold" fill="var(--text)">Description</text>
  <rect x="58.1818" y="136.666667" width="236.3636" height="66.285732" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6.071009" filter="url(#shadow)"/>
  <rect x="294.5454" y="136.666667" width="927.2727" height="66.285732" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6.071009" filter="url(#shadow)"/>
  <text x="176.3636" y="164.285773" text-anchor="middle" font-size="19.140372" font-weight="bold" fill="var(--text)">PyTorch</text>
  <text x="176.3636" y="189.142845" text-anchor="middle" font-size="17.66795" fill="var(--text-muted)">(.bin)</text>
  <text x="316.3637" y="161.523739" font-size="19.140372" fill="var(--text)">.bin / .pt — native PyTorch format</text>
  <text x="316.3637" y="189.142845" font-size="19.140372" fill="var(--text-muted)">Widely supported, large file sizes</text>
  <rect x="58.1818" y="202.952399" width="236.3636" height="85.619045" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.071009"/>
  <rect x="294.5454" y="202.952399" width="927.2727" height="85.619045" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.071009"/>
  <text x="176.3636" y="233.333333" text-anchor="middle" font-size="19.140372" font-weight="bold" fill="var(--text)">SafeTensors</text>
  <text x="316.3637" y="227.809574" font-size="19.140372" fill="var(--text)">.safetensors — safe, fast loading</text>
  <text x="316.3637" y="252.666646" font-size="19.140372" fill="var(--text-muted)">No code execution risk, faster I/O</text>
  <text x="316.3637" y="277.523821" font-size="19.140372" fill="var(--text-muted)">Becoming the new standard</text>
  <rect x="58.1818" y="288.571341" width="236.3636" height="85.619045" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6.071009" filter="url(#shadow)"/>
  <rect x="294.5454" y="288.571341" width="927.2727" height="85.619045" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6.071009" filter="url(#shadow)"/>
  <text x="176.3636" y="318.952378" text-anchor="middle" font-size="19.140372" font-weight="bold" fill="var(--text)">GGUF</text>
  <text x="316.3637" y="313.428618" font-size="19.140372" fill="var(--text)">.gguf — llama.cpp format</text>
  <text x="316.3637" y="338.285793" font-size="19.140372" fill="var(--text-muted)">CPU-optimized, supports quantization</text>
  <text x="316.3637" y="363.142866" font-size="19.140372" fill="var(--text-muted)">Used by Ollama, LM Studio</text>
  <rect x="58.1818" y="374.190488" width="236.3636" height="85.619045" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.071009"/>
  <rect x="294.5454" y="374.190488" width="927.2727" height="85.619045" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.071009"/>
  <text x="176.3636" y="404.571423" text-anchor="middle" font-size="19.140372" font-weight="bold" fill="var(--text)">GPTQ</text>
  <text x="316.3637" y="399.047561" font-size="19.140372" fill="var(--text)">GPU-optimized quantization</text>
  <text x="316.3637" y="423.904838" font-size="19.140372" fill="var(--text-muted)">Post-training quantization</text>
  <text x="316.3637" y="448.761911" font-size="19.140372" fill="var(--text-muted)">Good quality at 4-bit</text>
  <rect x="58.1818" y="459.809635" width="236.3636" height="85.619045" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6.071009" filter="url(#shadow)"/>
  <rect x="294.5454" y="459.809635" width="927.2727" height="85.619045" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6.071009" filter="url(#shadow)"/>
  <text x="176.3636" y="490.190467" text-anchor="middle" font-size="19.140372" font-weight="bold" fill="var(--text)">AWQ</text>
  <text x="316.3637" y="484.666708" font-size="19.140372" fill="var(--text)">Activation-aware quantization</text>
  <text x="316.3637" y="509.52378" font-size="19.140372" fill="var(--text-muted)">Better quality than GPTQ at same bits</text>
  <text x="316.3637" y="534.380955" font-size="19.140372" fill="var(--text-muted)">Preserves important weights</text>
  <rect x="58.1818" y="545.428577" width="236.3636" height="74.571423" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.071009"/>
  <rect x="294.5454" y="545.428577" width="927.2727" height="74.571423" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.071009"/>
  <text x="176.3636" y="575.809614" text-anchor="middle" font-size="19.140372" font-weight="bold" fill="var(--text)">EXL2</text>
  <text x="316.3637" y="570.28565" font-size="19.140372" fill="var(--text)">ExLlamaV2 format</text>
  <text x="316.3637" y="595.142927" font-size="19.140372" fill="var(--text-muted)">Flexible per-layer quantization; fastest inference on GPU</text>
</svg>
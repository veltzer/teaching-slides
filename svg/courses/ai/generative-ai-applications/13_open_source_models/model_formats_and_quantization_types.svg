    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="0" y="0" width="1137.7778" height="640" fill="var(--surface)" rx="8.9302" stroke="var(--text-dark)" stroke-width="2.2325" />
  <rect x="0" y="0" width="1137.7778" height="53.5814" fill="var(--text-muted)" rx="8.9302" stroke="var(--text-dark)" stroke-width="2.2325" />
  <rect x="0" y="26.7907" width="1137.7778" height="26.7907" fill="var(--text-muted)" />
  <text x="568.8889" y="35.7209" text-anchor="middle" font-size="22.3256" font-weight="bold" fill="var(--bg)">MODEL FILE FORMATS</text>
  <rect x="17.239" y="62.5116" width="224.1077" height="41.6744" fill="var(--border-strong)" stroke="var(--text-dark)" stroke-width="1.4884" />
  <rect x="241.3468" y="62.5116" width="879.1919" height="41.6744" fill="var(--border-strong)" stroke="var(--text-dark)" stroke-width="1.4884" />
  <text x="129.2929" y="90.7907" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text-darker)">Format</text>
  <text x="680.9428" y="90.7907" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text-darker)">Description</text>
  <rect x="17.239" y="104.186" width="224.1077" height="71.4419" fill="var(--info-indigo-lt)" stroke="var(--border-softer)" stroke-width="1.4884" />
  <rect x="241.3468" y="104.186" width="879.1919" height="71.4419" fill="var(--info-indigo-lt)" stroke="var(--border-softer)" stroke-width="1.4884" />
  <text x="129.2929" y="133.9535" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text-darker)">PyTorch</text>
  <text x="129.2929" y="160.7442" text-anchor="middle" font-size="17.8604" fill="var(--text-muted)">(.bin)</text>
  <text x="262.0337" y="130.9767" font-size="19.3488" fill="var(--text-darker)">.bin / .pt — native PyTorch format</text>
  <text x="262.0337" y="160.7442" font-size="19.3488" fill="var(--text-muted)">Widely supported, large file sizes</text>
  <rect x="17.239" y="175.6279" width="224.1077" height="92.2791" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.4884" />
  <rect x="241.3468" y="175.6279" width="879.1919" height="92.2791" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.4884" />
  <text x="129.2929" y="208.3721" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text-darker)">SafeTensors</text>
  <text x="262.0337" y="202.4186" font-size="19.3488" fill="var(--text-darker)">.safetensors — safe, fast loading</text>
  <text x="262.0337" y="229.2093" font-size="19.3488" fill="var(--text-muted)">No code execution risk, faster I/O</text>
  <text x="262.0337" y="256" font-size="19.3488" fill="var(--text-muted)">Becoming the new standard</text>
  <rect x="17.239" y="267.9069" width="224.1077" height="92.2791" fill="var(--info-indigo-lt)" stroke="var(--border-softer)" stroke-width="1.4884" />
  <rect x="241.3468" y="267.9069" width="879.1919" height="92.2791" fill="var(--info-indigo-lt)" stroke="var(--border-softer)" stroke-width="1.4884" />
  <text x="129.2929" y="300.6512" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text-darker)">GGUF</text>
  <text x="262.0337" y="294.6977" font-size="19.3488" fill="var(--text-darker)">.gguf — llama.cpp format</text>
  <text x="262.0337" y="321.4884" font-size="19.3488" fill="var(--text-muted)">CPU-optimized, supports quantization</text>
  <text x="262.0337" y="348.2791" font-size="19.3488" fill="var(--text-muted)">Used by Ollama, LM Studio</text>
  <rect x="17.239" y="360.186" width="224.1077" height="92.2791" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.4884" />
  <rect x="241.3468" y="360.186" width="879.1919" height="92.2791" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.4884" />
  <text x="129.2929" y="392.9302" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text-darker)">GPTQ</text>
  <text x="262.0337" y="386.9767" font-size="19.3488" fill="var(--text-darker)">GPU-optimized quantization</text>
  <text x="262.0337" y="413.7675" font-size="19.3488" fill="var(--text-muted)">Post-training quantization</text>
  <text x="262.0337" y="440.5581" font-size="19.3488" fill="var(--text-muted)">Good quality at 4-bit</text>
  <rect x="17.239" y="452.4652" width="224.1077" height="92.2791" fill="var(--info-indigo-lt)" stroke="var(--border-softer)" stroke-width="1.4884" />
  <rect x="241.3468" y="452.4652" width="879.1919" height="92.2791" fill="var(--info-indigo-lt)" stroke="var(--border-softer)" stroke-width="1.4884" />
  <text x="129.2929" y="485.2093" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text-darker)">AWQ</text>
  <text x="262.0337" y="479.2558" font-size="19.3488" fill="var(--text-darker)">Activation-aware quantization</text>
  <text x="262.0337" y="506.0465" font-size="19.3488" fill="var(--text-muted)">Better quality than GPTQ at same bits</text>
  <text x="262.0337" y="532.8372" font-size="19.3488" fill="var(--text-muted)">Preserves important weights</text>
  <rect x="17.239" y="544.7442" width="224.1077" height="80.3721" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.4884" />
  <rect x="241.3468" y="544.7442" width="879.1919" height="80.3721" fill="var(--surface)" stroke="var(--border-softer)" stroke-width="1.4884" />
  <text x="129.2929" y="577.4884" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="var(--text-darker)">EXL2</text>
  <text x="262.0337" y="571.5348" font-size="19.3488" fill="var(--text-darker)">ExLlamaV2 format</text>
  <text x="262.0337" y="598.3256" font-size="19.3488" fill="var(--text-muted)">Flexible per-layer quantization; fastest inference on GPU</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="0" y="0" width="1137.7778" height="640" fill="#f5f5f5" rx="8.9302" stroke="#333" stroke-width="2.2325" />
  <ns0:rect x="0" y="0" width="1137.7778" height="53.5814" fill="#555555" rx="8.9302" stroke="#333" stroke-width="2.2325" />
  <ns0:rect x="0" y="26.7907" width="1137.7778" height="26.7907" fill="#555555" />
  <ns0:text x="568.8889" y="35.7209" text-anchor="middle" font-size="22.3256" font-weight="bold" fill="white">MODEL FILE FORMATS</ns0:text>
  <ns0:rect x="17.239" y="62.5116" width="224.1077" height="41.6744" fill="#bdbdbd" stroke="#333" stroke-width="1.4884" />
  <ns0:rect x="241.3468" y="62.5116" width="879.1919" height="41.6744" fill="#bdbdbd" stroke="#333" stroke-width="1.4884" />
  <ns0:text x="129.2929" y="90.7907" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="#222">Format</ns0:text>
  <ns0:text x="680.9428" y="90.7907" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="#222">Description</ns0:text>
  <ns0:rect x="17.239" y="104.186" width="224.1077" height="71.4419" fill="#e8eaf6" stroke="#ddd" stroke-width="1.4884" />
  <ns0:rect x="241.3468" y="104.186" width="879.1919" height="71.4419" fill="#e8eaf6" stroke="#ddd" stroke-width="1.4884" />
  <ns0:text x="129.2929" y="133.9535" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="#222">PyTorch</ns0:text>
  <ns0:text x="129.2929" y="160.7442" text-anchor="middle" font-size="17.8604" fill="#555">(.bin)</ns0:text>
  <ns0:text x="262.0337" y="130.9767" font-size="19.3488" fill="#222">.bin / .pt — native PyTorch format</ns0:text>
  <ns0:text x="262.0337" y="160.7442" font-size="19.3488" fill="#555">Widely supported, large file sizes</ns0:text>
  <ns0:rect x="17.239" y="175.6279" width="224.1077" height="92.2791" fill="#f5f5f5" stroke="#ddd" stroke-width="1.4884" />
  <ns0:rect x="241.3468" y="175.6279" width="879.1919" height="92.2791" fill="#f5f5f5" stroke="#ddd" stroke-width="1.4884" />
  <ns0:text x="129.2929" y="208.3721" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="#222">SafeTensors</ns0:text>
  <ns0:text x="262.0337" y="202.4186" font-size="19.3488" fill="#222">.safetensors — safe, fast loading</ns0:text>
  <ns0:text x="262.0337" y="229.2093" font-size="19.3488" fill="#555">No code execution risk, faster I/O</ns0:text>
  <ns0:text x="262.0337" y="256" font-size="19.3488" fill="#555">Becoming the new standard</ns0:text>
  <ns0:rect x="17.239" y="267.9069" width="224.1077" height="92.2791" fill="#e8eaf6" stroke="#ddd" stroke-width="1.4884" />
  <ns0:rect x="241.3468" y="267.9069" width="879.1919" height="92.2791" fill="#e8eaf6" stroke="#ddd" stroke-width="1.4884" />
  <ns0:text x="129.2929" y="300.6512" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="#222">GGUF</ns0:text>
  <ns0:text x="262.0337" y="294.6977" font-size="19.3488" fill="#222">.gguf — llama.cpp format</ns0:text>
  <ns0:text x="262.0337" y="321.4884" font-size="19.3488" fill="#555">CPU-optimized, supports quantization</ns0:text>
  <ns0:text x="262.0337" y="348.2791" font-size="19.3488" fill="#555">Used by Ollama, LM Studio</ns0:text>
  <ns0:rect x="17.239" y="360.186" width="224.1077" height="92.2791" fill="#f5f5f5" stroke="#ddd" stroke-width="1.4884" />
  <ns0:rect x="241.3468" y="360.186" width="879.1919" height="92.2791" fill="#f5f5f5" stroke="#ddd" stroke-width="1.4884" />
  <ns0:text x="129.2929" y="392.9302" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="#222">GPTQ</ns0:text>
  <ns0:text x="262.0337" y="386.9767" font-size="19.3488" fill="#222">GPU-optimized quantization</ns0:text>
  <ns0:text x="262.0337" y="413.7675" font-size="19.3488" fill="#555">Post-training quantization</ns0:text>
  <ns0:text x="262.0337" y="440.5581" font-size="19.3488" fill="#555">Good quality at 4-bit</ns0:text>
  <ns0:rect x="17.239" y="452.4652" width="224.1077" height="92.2791" fill="#e8eaf6" stroke="#ddd" stroke-width="1.4884" />
  <ns0:rect x="241.3468" y="452.4652" width="879.1919" height="92.2791" fill="#e8eaf6" stroke="#ddd" stroke-width="1.4884" />
  <ns0:text x="129.2929" y="485.2093" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="#222">AWQ</ns0:text>
  <ns0:text x="262.0337" y="479.2558" font-size="19.3488" fill="#222">Activation-aware quantization</ns0:text>
  <ns0:text x="262.0337" y="506.0465" font-size="19.3488" fill="#555">Better quality than GPTQ at same bits</ns0:text>
  <ns0:text x="262.0337" y="532.8372" font-size="19.3488" fill="#555">Preserves important weights</ns0:text>
  <ns0:rect x="17.239" y="544.7442" width="224.1077" height="80.3721" fill="#f5f5f5" stroke="#ddd" stroke-width="1.4884" />
  <ns0:rect x="241.3468" y="544.7442" width="879.1919" height="80.3721" fill="#f5f5f5" stroke="#ddd" stroke-width="1.4884" />
  <ns0:text x="129.2929" y="577.4884" text-anchor="middle" font-size="19.3488" font-weight="bold" fill="#222">EXL2</ns0:text>
  <ns0:text x="262.0337" y="571.5348" font-size="19.3488" fill="#222">ExLlamaV2 format</ns0:text>
  <ns0:text x="262.0337" y="598.3256" font-size="19.3488" fill="#555">Flexible per-layer quantization; fastest inference on GPU</ns0:text>
</ns0:svg>
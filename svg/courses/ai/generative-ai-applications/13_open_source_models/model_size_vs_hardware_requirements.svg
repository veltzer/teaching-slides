  <text x="80.0001" y="438.564" font-size="20.8566" font-weight="bold" fill="var(--warn-accent)">Quantization reduces memory requirements:</text>
  <text x="80.0001" y="474.2564" font-size="20.8566" fill="var(--text)">FP16 (16-bit):  Full precision, full VRAM</text>
  <text x="80.0001" y="506.9743" font-size="20.8566" fill="var(--text)">INT8 (8-bit):   ~50% VRAM, minimal quality loss</text>
  <text x="80.0001" y="539.6923" font-size="20.8566" fill="var(--text)">INT4 (4-bit):   ~25% VRAM, small quality loss</text>
  <text x="80.0001" y="572.4103" font-size="20.8566" fill="var(--text)">GGUF/GPTQ:     Optimized quantization formats</text>
</svg>
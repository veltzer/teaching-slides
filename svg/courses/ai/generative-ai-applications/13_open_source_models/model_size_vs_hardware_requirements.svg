  <text x="967.2727" y="84.6154" text-anchor="middle" font-size="20.8566" font-weight="bold" fill="var(--text)">Suitable Hardware</text>
  <rect x="58.1818" y="99.4872" width="363.6364" height="41.641" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <rect x="421.8182" y="99.4872" width="290.9091" height="41.641" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>

  <rect x="362.0202" y="157.5385" width="275.8249" height="45.9487" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <rect x="637.8452" y="157.5385" width="482.6936" height="45.9487" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="37.926" y="188.718" font-size="21.3333" fill="var(--text)">13B</text>
  <text x="382.7071" y="188.718" font-size="21.3333" fill="var(--text)">10–16 GB</text>
  <text x="658.532" y="188.718" font-size="21.3333" fill="var(--text)">RTX 3090/4080</text>
  <rect x="17.239" y="203.4872" width="344.7812" height="45.9487" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="362.0202" y="203.4872" width="275.8249" height="45.9487" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="637.8452" y="203.4872" width="482.6936" height="45.9487" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="37.926" y="234.6667" font-size="21.3333" fill="var(--text)">30–34B</text>
  <text x="382.7071" y="234.6667" font-size="21.3333" fill="var(--text)">24–40 GB</text>
  <text x="658.532" y="234.6667" font-size="21.3333" fill="var(--text)">RTX 4090 / A6000</text>
  <rect x="17.239" y="249.4359" width="344.7812" height="45.9487" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <rect x="362.0202" y="249.4359" width="275.8249" height="45.9487" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <rect x="637.8452" y="249.4359" width="482.6936" height="45.9487" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>

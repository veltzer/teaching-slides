<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="375.000026" height="47.282612" fill="var(--border)" stroke="var(--text)" stroke-width="1.6411" rx="6.272513"/>
  <rect x="415.000026" y="40" width="300" height="47.282612" fill="var(--border)" stroke="var(--text)" stroke-width="1.6411" rx="6.272513"/>
  <rect x="715.000026" y="40" width="524.999974" height="47.282612" fill="var(--border)" stroke="var(--text)" stroke-width="1.6411" rx="6.272513"/>
  <text x="227.500013" y="71.521847" text-anchor="middle" font-size="21.803882" font-weight="bold" fill="var(--text)">Model Size</text>
  <text x="564.999974" y="71.521847" text-anchor="middle" font-size="21.803882" font-weight="bold" fill="var(--text)">VRAM Needed</text>
  <text x="977.499961" y="71.521847" text-anchor="middle" font-size="21.803882" font-weight="bold" fill="var(--text)">Suitable Hardware</text>
  <rect x="40" y="87.282718" width="375.000026" height="44.130396" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <rect x="415.000026" y="87.282718" width="300" height="44.130396" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <rect x="715.000026" y="87.282718" width="524.999974" height="44.130396" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <text x="62.500121" y="117.228351" font-size="21.803882" fill="var(--text)">1–3B</text>
  <text x="437.500044" y="117.228351" font-size="21.803882" fill="var(--text)">2–4 GB</text>
  <text x="737.500044" y="117.228351" font-size="21.803882" fill="var(--text)">CPU, laptop GPU</text>
  <rect x="40" y="131.41322" width="375.000026" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <rect x="415.000026" y="131.41322" width="300" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <rect x="715.000026" y="131.41322" width="524.999974" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <text x="62.500121" y="161.358747" font-size="21.803882" fill="var(--text)">7–8B</text>
  <text x="437.500044" y="161.358747" font-size="21.803882" fill="var(--text)">6–8 GB</text>
  <text x="737.500044" y="161.358747" font-size="21.803882" fill="var(--text)">RTX 3060/4060 (consumer)</text>
  <rect x="40" y="175.543615" width="375.000026" height="44.130396" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <rect x="415.000026" y="175.543615" width="300" height="44.130396" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <rect x="715.000026" y="175.543615" width="524.999974" height="44.130396" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <text x="62.500121" y="205.489249" font-size="21.803882" fill="var(--text)">13B</text>
  <text x="437.500044" y="205.489249" font-size="21.803882" fill="var(--text)">10–16 GB</text>
  <text x="737.500044" y="205.489249" font-size="21.803882" fill="var(--text)">RTX 3090/4080</text>
  <rect x="40" y="219.674011" width="375.000026" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <rect x="415.000026" y="219.674011" width="300" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <rect x="715.000026" y="219.674011" width="524.999974" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <text x="62.500121" y="249.619644" font-size="21.803882" fill="var(--text)">30–34B</text>
  <text x="437.500044" y="249.619644" font-size="21.803882" fill="var(--text)">24–40 GB</text>
  <text x="737.500044" y="249.619644" font-size="21.803882" fill="var(--text)">RTX 4090 / A6000</text>
  <rect x="40" y="263.804407" width="375.000026" height="44.130396" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <rect x="415.000026" y="263.804407" width="300" height="44.130396" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <rect x="715.000026" y="263.804407" width="524.999974" height="44.130396" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>

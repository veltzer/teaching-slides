  <rect x="17.239" y="341.3333" width="344.7812" height="45.9487" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="362.0202" y="341.3333" width="275.8249" height="45.9487" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="637.8452" y="341.3333" width="482.6936" height="45.9487" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="37.926" y="372.5128" font-size="21.3333" fill="var(--text)">405B</text>
  <text x="382.7071" y="372.5128" font-size="21.3333" fill="var(--text)">200+ GB</text>
  <text x="658.532" y="372.5128" font-size="21.3333" fill="var(--text)">8× A100 or more</text>
  <rect x="17.239" y="406.9744" width="1103.2996" height="213.3333" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="37.926" y="439.7948" font-size="21.3333" font-weight="bold" fill="var(--warn-accent)">Quantization reduces memory requirements:</text>
  <text x="37.926" y="479.1795" font-size="21.3333" fill="var(--text)">FP16 (16-bit):  Full precision, full VRAM</text>
  <text x="37.926" y="515.282" font-size="21.3333" fill="var(--text)">INT8 (8-bit):   ~50% VRAM, minimal quality loss</text>
  <text x="37.926" y="551.3846" font-size="21.3333" fill="var(--text)">INT4 (4-bit):   ~25% VRAM, small quality loss</text>
  <text x="37.926" y="587.4872" font-size="21.3333" fill="var(--text)">GGUF/GPTQ:     Optimized quantization formats</text>
</svg>
  <text x="737.500044" y="293.75004" font-size="21.803882" fill="var(--text)">A100 80GB / 2× A6000</text>
  <rect x="40" y="307.934802" width="375.000026" height="44.130396" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <rect x="415.000026" y="307.934802" width="300" height="44.130396" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <rect x="715.000026" y="307.934802" width="524.999974" height="44.130396" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <text x="62.500121" y="337.880435" font-size="21.803882" fill="var(--text)">70B (4-bit)</text>
  <text x="437.500044" y="337.880435" font-size="21.803882" fill="var(--text)">24–40 GB</text>
  <text x="737.500044" y="337.880435" font-size="21.803882" fill="var(--warn-accent)" font-weight="bold">RTX 4090 (quantized!)</text>
  <rect x="40" y="352.065198" width="375.000026" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <rect x="415.000026" y="352.065198" width="300" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <rect x="715.000026" y="352.065198" width="524.999974" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <text x="62.500121" y="382.010831" font-size="21.803882" fill="var(--text)">405B</text>
  <text x="437.500044" y="382.010831" font-size="21.803882" fill="var(--text)">200+ GB</text>
  <text x="737.500044" y="382.010831" font-size="21.803882" fill="var(--text)">8× A100 or more</text>
  <rect x="40" y="415.108787" width="1199.999897" height="204.891213" fill="var(--warn-fill)" rx="6.272513" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="62.500121" y="446.630316" font-size="21.803882" font-weight="bold" fill="var(--warn-accent)">Quantization reduces memory requirements:</text>
  <text x="62.500121" y="484.456491" font-size="21.803882" fill="var(--text)">FP16 (16-bit):  Full precision, full VRAM</text>
  <text x="62.500121" y="519.130343" font-size="21.803882" fill="var(--text)">INT8 (8-bit):   ~50% VRAM, minimal quality loss</text>
  <text x="62.500121" y="553.804301" font-size="21.803882" fill="var(--text)">INT4 (4-bit):   ~25% VRAM, small quality loss</text>
  <text x="62.500121" y="588.478259" font-size="21.803882" fill="var(--text)">GGUF/GPTQ:     Optimized quantization formats</text>
</svg>
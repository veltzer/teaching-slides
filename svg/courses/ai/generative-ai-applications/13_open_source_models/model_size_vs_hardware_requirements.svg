  <rect x="712.7273" y="182.7693" width="509.0909" height="41.641" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="80.0001" y="211.0257" font-size="20.8566" fill="var(--text)">13B</text>

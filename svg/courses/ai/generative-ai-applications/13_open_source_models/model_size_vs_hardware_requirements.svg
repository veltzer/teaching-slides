<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="375.000026" height="47.282612" fill="var(--border)" stroke="var(--text)" stroke-width="1.6411" rx="6.272513"/>
  <rect x="415.000026" y="40" width="300" height="47.282612" fill="var(--border)" stroke="var(--text)" stroke-width="1.6411" rx="6.272513"/>
  <rect x="715.000026" y="40" width="524.999974" height="47.282612" fill="var(--border)" stroke="var(--text)" stroke-width="1.6411" rx="6.272513"/>
  <text x="227.500013" y="71.521847" text-anchor="middle" font-size="21.803882" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Model Size</text>
  <text x="564.999974" y="71.521847" text-anchor="middle" font-size="21.803882" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">VRAM Needed</text>
  <text x="977.499961" y="71.521847" text-anchor="middle" font-size="21.803882" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Suitable Hardware</text>
  <rect x="40" y="87.282718" width="375.000026" height="44.130396" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <rect x="415.000026" y="87.282718" width="300" height="44.130396" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <rect x="715.000026" y="87.282718" width="524.999974" height="44.130396" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <text x="62.500121" y="117.228351" font-size="21.803882" fill="var(--text)" font-family="Arial, sans-serif">1–3B</text>
  <text x="437.500044" y="117.228351" font-size="21.803882" fill="var(--text)" font-family="Arial, sans-serif">2–4 GB</text>
  <text x="737.500044" y="117.228351" font-size="21.803882" fill="var(--text)" font-family="Arial, sans-serif">CPU, laptop GPU</text>
  <rect x="40" y="131.41322" width="375.000026" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <rect x="415.000026" y="131.41322" width="300" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <rect x="715.000026" y="131.41322" width="524.999974" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <text x="62.500121" y="161.358747" font-size="21.803882" fill="var(--text)" font-family="Arial, sans-serif">7–8B</text>
  <text x="437.500044" y="161.358747" font-size="21.803882" fill="var(--text)" font-family="Arial, sans-serif">6–8 GB</text>
  <text x="737.500044" y="161.358747" font-size="21.803882" fill="var(--text)" font-family="Arial, sans-serif">RTX 3060/4060 (consumer)</text>
  <rect x="40" y="175.543615" width="375.000026" height="44.130396" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <rect x="415.000026" y="175.543615" width="300" height="44.130396" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <rect x="715.000026" y="175.543615" width="524.999974" height="44.130396" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.272513" filter="url(#shadow)"/>
  <text x="62.500121" y="205.489249" font-size="21.803882" fill="var(--text)" font-family="Arial, sans-serif">13B</text>
  <text x="437.500044" y="205.489249" font-size="21.803882" fill="var(--text)" font-family="Arial, sans-serif">10–16 GB</text>
  <text x="737.500044" y="205.489249" font-size="21.803882" fill="var(--text)" font-family="Arial, sans-serif">RTX 3090/4080</text>
  <rect x="40" y="219.674011" width="375.000026" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <rect x="415.000026" y="219.674011" width="300" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <rect x="715.000026" y="219.674011" width="524.999974" height="44.130396" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.272513"/>
  <text x="62.500121" y="249.619644" font-size="21.803882" fill="var(--text)" font-family="Arial, sans-serif">30–34B</text>
  <text x="437.500044" y="249.619644" font-size="21.803882" fill="var(--text)" font-family="Arial, sans-serif">24–40 GB</text>
  <text x="737.500044" y="249.619644" font-size="21.803882" fill="var(--text)" font-family="Arial, sans-serif">RTX 4090 / A6000</text>

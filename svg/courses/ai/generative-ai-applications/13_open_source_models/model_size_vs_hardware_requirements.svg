<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="0" y="0" width="1137.7778" height="640" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <rect x="17.239" y="16.4102" width="344.7812" height="49.2308" fill="var(--border)" stroke="var(--text)" stroke-width="1.6411" rx="6"/>
  <rect x="362.0202" y="16.4102" width="275.8249" height="49.2308" fill="var(--border)" stroke="var(--text)" stroke-width="1.6411" rx="6"/>
  <rect x="637.8452" y="16.4102" width="482.6936" height="49.2308" fill="var(--border)" stroke="var(--text)" stroke-width="1.6411" rx="6"/>
  <text x="189.6296" y="49.2308" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">Model Size</text>
  <text x="499.9326" y="49.2308" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">VRAM Needed</text>
  <text x="879.1919" y="49.2308" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">Suitable Hardware</text>
  <rect x="17.239" y="65.6411" width="344.7812" height="45.9487" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <rect x="362.0202" y="65.6411" width="275.8249" height="45.9487" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <rect x="637.8452" y="65.6411" width="482.6936" height="45.9487" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="37.926" y="96.8205" font-size="21.3333" fill="var(--text)">1–3B</text>
  <text x="382.7071" y="96.8205" font-size="21.3333" fill="var(--text)">2–4 GB</text>
  <text x="658.532" y="96.8205" font-size="21.3333" fill="var(--text)">CPU, laptop GPU</text>
  <rect x="17.239" y="111.5898" width="344.7812" height="45.9487" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="362.0202" y="111.5898" width="275.8249" height="45.9487" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="637.8452" y="111.5898" width="482.6936" height="45.9487" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="37.926" y="142.7692" font-size="21.3333" fill="var(--text)">7–8B</text>
  <text x="382.7071" y="142.7692" font-size="21.3333" fill="var(--text)">6–8 GB</text>
  <text x="658.532" y="142.7692" font-size="21.3333" fill="var(--text)">RTX 3060/4060 (consumer)</text>

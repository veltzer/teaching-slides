  <text x="734.5455" y="211.0257" font-size="20.8566" fill="var(--text)">RTX 3090/4080</text>
  <rect x="58.1818" y="224.4103" width="363.6364" height="41.641" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>

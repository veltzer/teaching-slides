  <text x="900" y="412.254545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">64.6</text>
  <text x="1060" y="412.254545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">API</text>
  <text x="1190" y="412.254545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">Hosted</text>

  <rect x="40" y="446" width="1200" height="63.272727" rx="6.161464" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="474.472727" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" font-weight="bold" fill="var(--ok-text)">Key Insight</text>
  <text x="640" y="498.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">Open models match or beat OpenAI on many tasks — zero API cost, full privacy</text>

  <rect x="40" y="525.090909" width="390" height="94.909091" rx="6.161464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="556.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" font-weight="bold" fill="var(--primary-text)">Budget — MiniLM-L6</text>
  <text x="235" y="583.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--primary-text)">Tiny, CPU-fast, decent quality</text>

  <text x="1190" y="140.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-accent)">Open</text>

  <rect x="40" y="159.163636" width="1200" height="40.072727" rx="6.161464" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="185.527273" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">bge-large-en-v1.5</text>
  <text x="700" y="185.527273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">1024</text>

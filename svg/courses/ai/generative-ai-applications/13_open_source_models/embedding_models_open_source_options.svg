<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>
  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--text)">Embedding Models — Open Source Options</text>

  <rect x="40" y="95" width="1200" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="220" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Model</text>
  <text x="700" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Dims</text>
  <text x="900" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">MTEB</text>
  <text x="1060" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Size</text>
  <text x="1190" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Type</text>

  <rect x="40" y="140" width="1200" height="38" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="165" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">all-MiniLM-L6-v2</text>
  <text x="700" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">384</text>
  <text x="900" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">56.3</text>
  <text x="1060" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">80 MB</text>
  <text x="1190" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">Open</text>

  <rect x="40" y="183" width="1200" height="38" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="208" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">bge-large-en-v1.5</text>
  <text x="700" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">1024</text>
  <text x="900" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">64.2</text>
  <text x="1060" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">1.3 GB</text>
  <text x="1190" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">Open</text>

  <rect x="40" y="226" width="1200" height="38" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="251" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">e5-large-v2</text>
  <text x="700" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">1024</text>
  <text x="900" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">62.0</text>
  <text x="1060" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">1.3 GB</text>
  <text x="1190" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">Open</text>

  <rect x="40" y="269" width="1200" height="38" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="294" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">gte-Qwen2-7B-instruct</text>
  <text x="700" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">3584</text>
  <text x="900" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">72.1</text>
  <text x="1060" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">14 GB</text>
  <text x="1190" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">Open</text>

  <rect x="40" y="312" width="1200" height="38" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="337" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">nomic-embed-text-v1.5</text>
  <text x="700" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">768</text>
  <text x="900" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">62.3</text>
  <text x="1060" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">548 MB</text>
  <text x="1190" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)">Open</text>

  <rect x="40" y="355" width="1200" height="38" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="60" y="380" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">text-embedding-3-small (OpenAI)</text>
  <text x="700" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">1536</text>
  <text x="900" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">62.3</text>
  <text x="1060" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">API</text>
  <text x="1190" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Hosted</text>

  <rect x="40" y="398" width="1200" height="38" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="60" y="423" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">text-embedding-3-large (OpenAI)</text>
  <text x="700" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">3072</text>
  <text x="900" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">64.6</text>
  <text x="1060" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">API</text>
  <text x="1190" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Hosted</text>

  <rect x="40" y="455" width="1200" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Key Insight</text>
  <text x="640" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Open models match or beat OpenAI on many tasks — zero API cost, full privacy</text>

  <rect x="40" y="530" width="390" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="235" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Budget — MiniLM-L6</text>
  <text x="235" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Tiny, CPU-fast, decent quality</text>
  <text x="235" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Great default for prototypes</text>

  <rect x="445" y="530" width="390" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Quality — bge-large</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Best quality-per-GB we ship</text>
  <text x="640" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Recommended production pick</text>

  <rect x="850" y="530" width="390" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1045" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Maximum — gte-Qwen2-7B</text>
  <text x="1045" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Top-of-MTEB quality, GPU only</text>
  <text x="1045" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Worth it for retrieval at scale</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="259.4595" height="85.294161851209" rx="6.216675708426" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="77.529405449827" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.958637361903" font-weight="bold" fill="var(--text)">Model A</text>
  <text x="169.7297" y="108.235350951554" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.295365776114" fill="var(--text-muted)">Fine-tuned for coding</text>
  <rect x="348.1081" y="40" width="259.4595" height="85.294161851209" rx="6.216675708426" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.8378" y="77.529405449827" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.958637361903" font-weight="bold" fill="var(--text)">Model B</text>
  <text x="477.8378" y="108.235350951554" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.295365776114" fill="var(--text-muted)">Creative writing</text>
  <rect x="656.2162" y="40" width="259.4595" height="85.294161851209" rx="6.216675708426" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785.9459" y="77.529405449827" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.958637361903" font-weight="bold" fill="var(--text)">Model C</text>
  <text x="785.9459" y="108.235350951554" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.295365776114" fill="var(--text-muted)">Fine-tuned for math</text>
  <line x1="169.7297" y1="125.294161851209" x2="477.8378" y2="176.470594550173" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="477.8378" y1="125.294161851209" x2="477.8378" y2="176.470594550173" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="785.9459" y1="125.294161851209" x2="477.8378" y2="176.470594550173" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="219.117621799309" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.28507692222" font-weight="bold" fill="var(--text)">Merging Methods</text>
  <rect x="40" y="244.705945501727" width="567.5676" height="93.823567301036" rx="6.216675708426" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="64.3243" y="278.823567301036" font-family="Arial, sans-serif" font-size="19.958637361903" font-weight="bold" fill="var(--ok-accent)">1. Linear Merge</text>
  <text x="64.3243" y="307.823567301036" font-size="18.295365776114" fill="var(--text-muted)" font-family="Courier New, monospace">W_merged = a*W_A + b*W_B + c*W_C</text>
  <text x="64.3243" y="330" font-family="Arial, sans-serif" font-size="16.632197801586" fill="var(--text-muted)">Simple but effective</text>
  <rect x="640" y="244.705945501727" width="600" height="93.823567301036" rx="6.216675708426" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="664.3243" y="278.823567301036" font-family="Arial, sans-serif" font-size="19.958637361903" font-weight="bold" fill="var(--ok-accent)">2. SLERP</text>
  <text x="664.3243" y="307.823567301036" font-family="Arial, sans-serif" font-size="18.295365776114" fill="var(--text-muted)">Spherical Linear Interpolation</text>
  <text x="664.3243" y="330" font-family="Arial, sans-serif" font-size="16.632197801586" fill="var(--text-muted)">Interpolate on the hypersphere; best for 2-model merges</text>
  <rect x="40" y="364.117621799309" width="567.5676" height="93.823567301036" rx="6.216675708426" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="64.3243" y="398.235350951554" font-family="Arial, sans-serif" font-size="19.958637361903" font-weight="bold" fill="var(--danger-accent)">3. TIES (Trim, Elect Sign, Merge)</text>
  <text x="64.3243" y="427.235350951554" font-family="Arial, sans-serif" font-size="18.295365776114" fill="var(--text-muted)">Only merge significant changes</text>
  <text x="64.3243" y="449.411783650518" font-family="Arial, sans-serif" font-size="16.632197801586" fill="var(--text-muted)">Reduces interference between models</text>
  <rect x="640" y="364.117621799309" width="600" height="93.823567301036" rx="6.216675708426" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="664.3243" y="398.235350951554" font-family="Arial, sans-serif" font-size="19.958637361903" font-weight="bold" fill="var(--danger-accent)">4. DARE (Drop And REscale)</text>
  <text x="664.3243" y="427.235350951554" font-family="Arial, sans-serif" font-size="18.295365776114" fill="var(--text-muted)">Randomly drop changes, rescale rest</text>
  <text x="664.3243" y="449.411783650518" font-family="Arial, sans-serif" font-size="16.632197801586" fill="var(--text-muted)">Works well with 3+ models</text>
  <line x1="640" y1="475" x2="640" y2="534.705838148791" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="315.6757" y="534.705838148791" width="648.6486" height="85.294161851209" rx="6.216675708426" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="577.352972750864" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.621805336431" font-weight="bold" fill="var(--primary-accent)">Merged Model</text>
  <text x="640" y="608.058810899655" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.295365776114" fill="var(--text-muted)">Coding + Creative Writing + Math expertise combined</text>
</svg>

<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Model Merging: Combining Expertise</text>

  <!-- Source models -->
  <rect x="30" y="50" width="160" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="110" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Model A</text>
  <text x="110" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Fine-tuned for coding</text>

  <rect x="220" y="50" width="160" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="300" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Model B</text>
  <text x="300" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Creative writing</text>

  <rect x="410" y="50" width="160" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="490" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Model C</text>
  <text x="490" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Fine-tuned for math</text>

  <!-- Arrows to merge box -->
  <line x1="110" y1="100" x2="300" y2="130" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="100" x2="300" y2="130" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="100" x2="300" y2="130" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Merging methods -->
  <text x="400" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Merging Methods</text>

  <!-- Method 1: Linear -->
  <rect x="30" y="170" width="350" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="45" y="190" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#28a745">1. Linear Merge</text>
  <text x="45" y="207" font-family="monospace" font-size="11" fill="#555">W_merged = a*W_A + b*W_B + c*W_C</text>
  <text x="45" y="220" font-family="Arial, sans-serif" font-size="10" fill="#777">Simple but effective</text>

  <!-- Method 2: SLERP -->
  <rect x="400" y="170" width="370" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="415" y="190" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#28a745">2. SLERP</text>
  <text x="415" y="207" font-family="Arial, sans-serif" font-size="11" fill="#555">Spherical Linear Interpolation</text>
  <text x="415" y="220" font-family="Arial, sans-serif" font-size="10" fill="#777">Interpolate on the hypersphere; best for 2-model merges</text>

  <!-- Method 3: TIES -->
  <rect x="30" y="240" width="350" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="45" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#856404">3. TIES (Trim, Elect Sign, Merge)</text>
  <text x="45" y="277" font-family="Arial, sans-serif" font-size="11" fill="#555">Only merge significant changes</text>
  <text x="45" y="290" font-family="Arial, sans-serif" font-size="10" fill="#777">Reduces interference between models</text>

  <!-- Method 4: DARE -->
  <rect x="400" y="240" width="370" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="415" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#856404">4. DARE (Drop And REscale)</text>
  <text x="415" y="277" font-family="Arial, sans-serif" font-size="11" fill="#555">Randomly drop changes, rescale rest</text>
  <text x="415" y="290" font-family="Arial, sans-serif" font-size="10" fill="#777">Works well with 3+ models</text>

  <!-- Arrow to result -->
  <line x1="400" y1="305" x2="400" y2="340" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Merged model -->
  <rect x="200" y="340" width="400" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4a90e2">Merged Model</text>
  <text x="400" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Coding + Creative Writing + Math expertise combined</text>
</svg>
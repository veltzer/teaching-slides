<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" font-weight="bold" fill="var(--text)">Model Merging: Combining Expertise</text>
  <rect x="48" y="80" width="256" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="176" y="115.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--text)">Model A</text>
  <text x="176" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Fine-tuned for coding</text>
  <rect x="352" y="80" width="256" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="480" y="115.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--text)">Model B</text>
  <text x="480" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Creative writing</text>
  <rect x="656" y="80" width="256" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="784" y="115.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--text)">Model C</text>
  <text x="784" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Fine-tuned for math</text>
  <line x1="176" y1="160" x2="480" y2="208" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="480" y1="160" x2="480" y2="208" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="784" y1="160" x2="480" y2="208" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="var(--text)">Merging Methods</text>
  <rect x="48" y="272" width="560" height="88" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="72" y="304" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--ok-accent)">1. Linear Merge</text>
  <text x="72" y="331.2" font-family="monospace" font-size="17.6" fill="var(--text-muted)">W_merged = a*W_A + b*W_B + c*W_C</text>
  <text x="72" y="352" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Simple but effective</text>
  <rect x="640" y="272" width="592" height="88" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="664" y="304" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--ok-accent)">2. SLERP</text>
  <text x="664" y="331.2" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Spherical Linear Interpolation</text>
  <text x="664" y="352" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Interpolate on the hypersphere; best for 2-model merges</text>
  <rect x="48" y="384" width="560" height="88" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="72" y="416" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--danger-accent)">3. TIES (Trim, Elect Sign, Merge)</text>
  <text x="72" y="443.2" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Only merge significant changes</text>
  <text x="72" y="464" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Reduces interference between models</text>
  <rect x="640" y="384" width="592" height="88" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="664" y="416" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--danger-accent)">4. DARE (Drop And REscale)</text>
  <text x="664" y="443.2" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Randomly drop changes, rescale rest</text>
  <text x="664" y="464" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Works well with 3+ models</text>
  <line x1="640" y1="488" x2="640" y2="544" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="320" y="544" width="640" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="var(--primary-accent)">Merged Model</text>
  <text x="640" y="612.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Coding + Creative Writing + Math expertise combined</text>
</svg>
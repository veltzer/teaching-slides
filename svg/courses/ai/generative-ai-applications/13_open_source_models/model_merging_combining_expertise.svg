<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" font-weight="bold" fill="var(--text-dark)">Model Merging: Combining Expertise</text>
  <rect x="48" y="80" width="256" height="80" rx="8" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.4" />
  <text x="176" y="115.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--text-dark)">Model A</text>
  <text x="176" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Fine-tuned for coding</text>
  <rect x="352" y="80" width="256" height="80" rx="8" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.4" />
  <text x="480" y="115.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--text-dark)">Model B</text>
  <text x="480" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Creative writing</text>
  <rect x="656" y="80" width="256" height="80" rx="8" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.4" />
  <text x="784" y="115.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--text-dark)">Model C</text>
  <text x="784" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Fine-tuned for math</text>
  <line x1="176" y1="160" x2="480" y2="208" stroke="var(--primary-bright)" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="480" y1="160" x2="480" y2="208" stroke="var(--primary-bright)" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="784" y1="160" x2="480" y2="208" stroke="var(--primary-bright)" stroke-width="2.4" marker-end="url(#arrow)" />
  <text x="640" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="var(--text-dark)">Merging Methods</text>
  <rect x="48" y="272" width="560" height="88" rx="8" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.4" />
  <text x="72" y="304" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--ok-bright)">1. Linear Merge</text>
  <text x="72" y="331.2" font-family="monospace" font-size="17.6" fill="var(--text-muted)">W_merged = a*W_A + b*W_B + c*W_C</text>
  <text x="72" y="352" font-family="Arial, sans-serif" font-size="16" fill="var(--text-lighter)">Simple but effective</text>
  <rect x="640" y="272" width="592" height="88" rx="8" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.4" />
  <text x="664" y="304" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--ok-bright)">2. SLERP</text>
  <text x="664" y="331.2" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Spherical Linear Interpolation</text>
  <text x="664" y="352" font-family="Arial, sans-serif" font-size="16" fill="var(--text-lighter)">Interpolate on the hypersphere; best for 2-model merges</text>
  <rect x="48" y="384" width="560" height="88" rx="8" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.4" />
  <text x="72" y="416" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--danger-deeper)">3. TIES (Trim, Elect Sign, Merge)</text>
  <text x="72" y="443.2" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Only merge significant changes</text>
  <text x="72" y="464" font-family="Arial, sans-serif" font-size="16" fill="var(--text-lighter)">Reduces interference between models</text>
  <rect x="640" y="384" width="592" height="88" rx="8" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.4" />
  <text x="664" y="416" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--danger-deeper)">4. DARE (Drop And REscale)</text>
  <text x="664" y="443.2" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Randomly drop changes, rescale rest</text>
  <text x="664" y="464" font-family="Arial, sans-serif" font-size="16" fill="var(--text-lighter)">Works well with 3+ models</text>
  <line x1="640" y1="488" x2="640" y2="544" stroke="var(--primary-bright)" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="320" y="544" width="640" height="80" rx="8" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.2" />
  <text x="640" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="var(--primary-bright)">Merged Model</text>
  <text x="640" y="612.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-muted)">Coding + Creative Writing + Math expertise combined</text>
</svg>
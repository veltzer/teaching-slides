<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Textual Inversion</text>
  <!-- Standard vocab -->
  <rect x="30" y="55" width="640" height="80" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="80" font-size="13" font-weight="bold" fill="#4a90e2">Standard Vocabulary:</text>
  <text x="70" y="105" font-size="12" fill="#333">"cat" -> embedding vector [0.3, -0.1, 0.5, ...]</text>
  <text x="70" y="125" font-size="12" fill="#333">"dog" -> embedding vector [0.1, 0.4, -0.2, ...]</text>
  <!-- After textual inversion -->
  <rect x="30" y="150" width="640" height="75" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="50" y="175" font-size="13" font-weight="bold" fill="#28a745">After Textual Inversion:</text>
  <text x="70" y="205" font-size="12" fill="#333">"&lt;my-pet&gt;" -> LEARNED embedding vector [0.2, 0.3, -0.1, ...]</text>
  <!-- Key point -->
  <rect x="80" y="250" width="540" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">The entire model is frozen.</text>
  <text x="350" y="305" text-anchor="middle" font-size="13" fill="#555">Only the new embedding vector is trained.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="63.5294" text-anchor="middle" font-size="32.9143" font-weight="bold" fill="#333">Textual Inversion</text>
  <rect x="54.8571" y="116.4706" width="1170.2857" height="169.4118" rx="9.1429" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6571" />
  <text x="91.4286" y="169.4118" font-size="23.7714" font-weight="bold" fill="#4a90e2">Standard Vocabulary:</text>
  <text x="128" y="222.3529" font-size="21.9429" fill="#333">"cat" -&gt; embedding vector [0.3, -0.1, 0.5, ...]</text>
  <text x="128" y="264.7059" font-size="21.9429" fill="#333">"dog" -&gt; embedding vector [0.1, 0.4, -0.2, ...]</text>
  <rect x="54.8571" y="317.6471" width="1170.2857" height="158.8235" rx="9.1429" fill="#d4edda" stroke="#28a745" stroke-width="3.6571" />
  <text x="91.4286" y="370.5882" font-size="23.7714" font-weight="bold" fill="#28a745">After Textual Inversion:</text>
  <text x="128" y="434.1176" font-size="21.9429" fill="#333">"&lt;my-pet&gt;" -&gt; LEARNED embedding vector [0.2, 0.3, -0.1, ...]</text>
  <rect x="146.2857" y="529.4118" width="987.4286" height="148.2353" rx="9.1429" fill="#fff3cd" stroke="#ffc107" stroke-width="3.6571" />
  <text x="640" y="592.9412" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">The entire model is frozen.</text>
  <text x="640" y="645.8824" text-anchor="middle" font-size="23.7714" fill="#555">Only the new embedding vector is trained.</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="604.4444" y="60" text-anchor="middle" font-size="31.0857" font-weight="bold" fill="#333">Textual Inversion</ns0:text>
  <ns0:rect x="51.8095" y="110" width="1105.2698" height="160" rx="8.635" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4539" />
  <ns0:text x="86.3492" y="160" font-size="22.4508" font-weight="bold" fill="#4a90e2">Standard Vocabulary:</ns0:text>
  <ns0:text x="120.8889" y="209.9999" font-size="20.7238" fill="#333">"cat" -&gt; embedding vector [0.3, -0.1, 0.5, ...]</ns0:text>
  <ns0:text x="120.8889" y="250" font-size="20.7238" fill="#333">"dog" -&gt; embedding vector [0.1, 0.4, -0.2, ...]</ns0:text>
  <ns0:rect x="51.8095" y="300" width="1105.2698" height="150" rx="8.635" fill="#d4edda" stroke="#28a745" stroke-width="3.4539" />
  <ns0:text x="86.3492" y="349.9999" font-size="22.4508" font-weight="bold" fill="#28a745">After Textual Inversion:</ns0:text>
  <ns0:text x="120.8889" y="409.9999" font-size="20.7238" fill="#333">"&lt;my-pet&gt;" -&gt; LEARNED embedding vector [0.2, 0.3, -0.1, ...]</ns0:text>
  <ns0:rect x="138.1587" y="500" width="932.5714" height="140" rx="8.635" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4539" />
  <ns0:text x="604.4444" y="560" text-anchor="middle" font-size="24.1778" font-weight="bold" fill="#333">The entire model is frozen.</ns0:text>
  <ns0:text x="604.4444" y="610" text-anchor="middle" font-size="22.4508" fill="#555">Only the new embedding vector is trained.</ns0:text>
</ns0:svg>
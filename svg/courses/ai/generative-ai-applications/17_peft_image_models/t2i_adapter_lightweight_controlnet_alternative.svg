<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="29.6795" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">T2I-Adapter: Lightweight ControlNet Alternative</text>
  <rect x="40" y="78.6667" width="337.5001" height="46.4" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.75" y="109.6" text-anchor="middle" font-size="19.7863" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Metric</text>
  <rect x="386.875" y="78.6667" width="375.0001" height="46.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="109.6" text-anchor="middle" font-size="19.7863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">T2I-Adapter</text>
  <rect x="771.25" y="78.6667" width="375.0001" height="46.4" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.75" y="109.6" text-anchor="middle" font-size="19.7863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ControlNet</text>
  <rect x="40" y="132.8" width="337.5001" height="46.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="163.7333" text-anchor="middle" font-size="18.1375" fill="var(--text)" font-family="Arial, sans-serif">Parameters</text>
  <rect x="386.875" y="132.8" width="375.0001" height="46.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="163.7333" text-anchor="middle" font-size="18.1375" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">77M</text>
  <rect x="771.25" y="132.8" width="375.0001" height="46.4" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="958.75" y="163.7333" text-anchor="middle" font-size="18.1375" fill="var(--text)" font-family="Arial, sans-serif">1.4B</text>
  <rect x="40" y="186.9334" width="337.5001" height="46.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="217.8667" text-anchor="middle" font-size="18.1375" fill="var(--text)" font-family="Arial, sans-serif">Training time</text>
  <rect x="386.875" y="186.9334" width="375.0001" height="46.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="217.8667" text-anchor="middle" font-size="18.1375" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Hours</text>
  <rect x="771.25" y="186.9334" width="375.0001" height="46.4" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="958.75" y="217.8667" text-anchor="middle" font-size="18.1375" fill="var(--text)" font-family="Arial, sans-serif">Days</text>
  <rect x="40" y="241.0667" width="337.5001" height="46.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="272" text-anchor="middle" font-size="18.1375" fill="var(--text)" font-family="Arial, sans-serif">Quality</text>
  <rect x="386.875" y="241.0667" width="375.0001" height="46.4" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="574.375" y="272" text-anchor="middle" font-size="18.1375" fill="var(--text)" font-family="Arial, sans-serif">4/5</text>
  <rect x="771.25" y="241.0667" width="375.0001" height="46.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.75" y="272" text-anchor="middle" font-size="18.1375" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">5/5</text>
  <rect x="40" y="295.2" width="337.5001" height="46.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="326.1334" text-anchor="middle" font-size="18.1375" fill="var(--text)" font-family="Arial, sans-serif">Composability</text>
  <rect x="386.875" y="295.2" width="375.0001" height="46.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="326.1334" text-anchor="middle" font-size="18.1375" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Easy</text>
  <rect x="771.25" y="295.2" width="375.0001" height="46.4" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="958.75" y="326.1334" text-anchor="middle" font-size="18.1375" fill="var(--text)" font-family="Arial, sans-serif">Harder</text>
  <rect x="40" y="349.3333" width="337.5001" height="46.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="380.2666" text-anchor="middle" font-size="18.1375" fill="var(--text)" font-family="Arial, sans-serif">Inference</text>
  <rect x="386.875" y="349.3333" width="375.0001" height="46.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="380.2666" text-anchor="middle" font-size="18.1375" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Faster</text>
  <rect x="771.25" y="349.3333" width="375.0001" height="46.4" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="958.75" y="380.2666" text-anchor="middle" font-size="18.1375" fill="var(--text)" font-family="Arial, sans-serif">Slower</text>
  <rect x="40" y="434.4" width="1200" height="185.6" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="473.0667" text-anchor="middle" font-size="21.4352" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">T2I-Adapter Types &amp; Composability</text>
  <text x="133.75" y="511.7333" font-size="19.7863" fill="var(--text-muted)" font-family="Arial, sans-serif">Canny edges -&gt; structure control</text>
  <text x="133.75" y="542.6666" font-size="19.7863" fill="var(--text-muted)" font-family="Arial, sans-serif">Depth map -&gt; 3D-aware generation</text>
  <text x="696.2499" y="511.7333" font-size="19.7863" fill="var(--text-muted)" font-family="Arial, sans-serif">Color palette -&gt; color harmony</text>
  <text x="696.2499" y="542.6666" font-size="19.7863" fill="var(--text-muted)" font-family="Arial, sans-serif">Sketch -&gt; rough shape control</text>
  <text x="133.75" y="596.8" font-size="19.7863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Multiple adapters can be combined: canny (structure) + color (palette)</text>
</svg>
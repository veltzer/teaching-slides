<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="29.6795" font-weight="bold" fill="var(--text)">T2I-Adapter: Lightweight ControlNet Alternative</text>
  <rect x="40" y="78.6667" width="337.5001" height="46.4" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.75" y="109.6" text-anchor="middle" font-size="19.7863" font-weight="bold" fill="var(--bg)">Metric</text>
  <rect x="386.875" y="78.6667" width="375.0001" height="46.4" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="109.6" text-anchor="middle" font-size="19.7863" font-weight="bold" fill="var(--text)">T2I-Adapter</text>
  <rect x="771.25" y="78.6667" width="375.0001" height="46.4" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.75" y="109.6" text-anchor="middle" font-size="19.7863" font-weight="bold" fill="var(--text)">ControlNet</text>
  <rect x="40" y="132.8" width="337.5001" height="46.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="163.7333" text-anchor="middle" font-size="18.1375" fill="var(--text)">Parameters</text>
  <rect x="386.875" y="132.8" width="375.0001" height="46.4" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="163.7333" text-anchor="middle" font-size="18.1375" font-weight="bold" fill="var(--ok-accent)">77M</text>
  <rect x="771.25" y="132.8" width="375.0001" height="46.4" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="958.75" y="163.7333" text-anchor="middle" font-size="18.1375" fill="var(--text)">1.4B</text>
  <rect x="40" y="186.9334" width="337.5001" height="46.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="217.8667" text-anchor="middle" font-size="18.1375" fill="var(--text)">Training time</text>
  <rect x="386.875" y="186.9334" width="375.0001" height="46.4" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="217.8667" text-anchor="middle" font-size="18.1375" font-weight="bold" fill="var(--ok-accent)">Hours</text>
  <rect x="771.25" y="186.9334" width="375.0001" height="46.4" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="958.75" y="217.8667" text-anchor="middle" font-size="18.1375" fill="var(--text)">Days</text>
  <rect x="40" y="241.0667" width="337.5001" height="46.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="272" text-anchor="middle" font-size="18.1375" fill="var(--text)">Quality</text>
  <rect x="386.875" y="241.0667" width="375.0001" height="46.4" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="574.375" y="272" text-anchor="middle" font-size="18.1375" fill="var(--text)">4/5</text>
  <rect x="771.25" y="241.0667" width="375.0001" height="46.4" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.75" y="272" text-anchor="middle" font-size="18.1375" font-weight="bold" fill="var(--ok-accent)">5/5</text>
  <rect x="40" y="295.2" width="337.5001" height="46.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="326.1334" text-anchor="middle" font-size="18.1375" fill="var(--text)">Composability</text>
  <rect x="386.875" y="295.2" width="375.0001" height="46.4" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="326.1334" text-anchor="middle" font-size="18.1375" font-weight="bold" fill="var(--ok-accent)">Easy</text>
  <rect x="771.25" y="295.2" width="375.0001" height="46.4" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="958.75" y="326.1334" text-anchor="middle" font-size="18.1375" fill="var(--text)">Harder</text>
  <rect x="40" y="349.3333" width="337.5001" height="46.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="380.2666" text-anchor="middle" font-size="18.1375" fill="var(--text)">Inference</text>
  <rect x="386.875" y="349.3333" width="375.0001" height="46.4" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="380.2666" text-anchor="middle" font-size="18.1375" font-weight="bold" fill="var(--ok-accent)">Faster</text>
  <rect x="771.25" y="349.3333" width="375.0001" height="46.4" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="958.75" y="380.2666" text-anchor="middle" font-size="18.1375" fill="var(--text)">Slower</text>
  <rect x="40" y="434.4" width="1200" height="185.6" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="473.0667" text-anchor="middle" font-size="21.4352" font-weight="bold" fill="var(--text)">T2I-Adapter Types &amp; Composability</text>
  <text x="133.75" y="511.7333" font-size="19.7863" fill="var(--text-muted)">Canny edges -&gt; structure control</text>
  <text x="133.75" y="542.6666" font-size="19.7863" fill="var(--text-muted)">Depth map -&gt; 3D-aware generation</text>
  <text x="696.2499" y="511.7333" font-size="19.7863" fill="var(--text-muted)">Color palette -&gt; color harmony</text>
  <text x="696.2499" y="542.6666" font-size="19.7863" fill="var(--text-muted)">Sketch -&gt; rough shape control</text>
  <text x="133.75" y="596.8" font-size="19.7863" font-weight="bold" fill="var(--text)">Multiple adapters can be combined: canny (structure) + color (palette)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="589.9589" y="47.4074" text-anchor="middle" font-size="28.4444" font-weight="bold" fill="var(--text)">T2I-Adapter: Lightweight ControlNet Alternative</text>
  <rect x="50.5679" y="86.9136" width="303.4075" height="47.4074" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="202.2716" y="118.5185" text-anchor="middle" font-size="18.9629" font-weight="bold" fill="var(--bg)">Metric</text>
  <rect x="362.4033" y="86.9136" width="337.1194" height="47.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="530.963" y="118.5185" text-anchor="middle" font-size="18.9629" font-weight="bold" fill="var(--text)">T2I-Adapter</text>
  <rect x="707.9506" y="86.9136" width="337.1194" height="47.4074" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="876.5103" y="118.5185" text-anchor="middle" font-size="18.9629" font-weight="bold" fill="var(--text)">ControlNet</text>
  <rect x="50.5679" y="142.2222" width="303.4075" height="47.4074" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="202.2716" y="173.8271" text-anchor="middle" font-size="17.3827" fill="var(--text)">Parameters</text>
  <rect x="362.4033" y="142.2222" width="337.1194" height="47.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="530.963" y="173.8271" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--ok-accent)">77M</text>
  <rect x="707.9506" y="142.2222" width="337.1194" height="47.4074" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="876.5103" y="173.8271" text-anchor="middle" font-size="17.3827" fill="var(--text)">1.4B</text>
  <rect x="50.5679" y="197.5309" width="303.4075" height="47.4074" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="202.2716" y="229.1358" text-anchor="middle" font-size="17.3827" fill="var(--text)">Training time</text>
  <rect x="362.4033" y="197.5309" width="337.1194" height="47.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="530.963" y="229.1358" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--ok-accent)">Hours</text>
  <rect x="707.9506" y="197.5309" width="337.1194" height="47.4074" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="876.5103" y="229.1358" text-anchor="middle" font-size="17.3827" fill="var(--text)">Days</text>
  <rect x="50.5679" y="252.8395" width="303.4075" height="47.4074" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="202.2716" y="284.4444" text-anchor="middle" font-size="17.3827" fill="var(--text)">Quality</text>
  <rect x="362.4033" y="252.8395" width="337.1194" height="47.4074" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="530.963" y="284.4444" text-anchor="middle" font-size="17.3827" fill="var(--text)">4/5</text>
  <rect x="707.9506" y="252.8395" width="337.1194" height="47.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="876.5103" y="284.4444" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--ok-accent)">5/5</text>
  <rect x="50.5679" y="308.1481" width="303.4075" height="47.4074" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="202.2716" y="339.7531" text-anchor="middle" font-size="17.3827" fill="var(--text)">Composability</text>
  <rect x="362.4033" y="308.1481" width="337.1194" height="47.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="530.963" y="339.7531" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--ok-accent)">Easy</text>
  <rect x="707.9506" y="308.1481" width="337.1194" height="47.4074" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="876.5103" y="339.7531" text-anchor="middle" font-size="17.3827" fill="var(--text)">Harder</text>
  <rect x="50.5679" y="363.4568" width="303.4075" height="47.4074" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="202.2716" y="395.0617" text-anchor="middle" font-size="17.3827" fill="var(--text)">Inference</text>
  <rect x="362.4033" y="363.4568" width="337.1194" height="47.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="530.963" y="395.0617" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--ok-accent)">Faster</text>
  <rect x="707.9506" y="363.4568" width="337.1194" height="47.4074" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="876.5103" y="395.0617" text-anchor="middle" font-size="17.3827" fill="var(--text)">Slower</text>
  <rect x="50.5679" y="450.3704" width="1078.7819" height="189.6296" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="589.9589" y="489.8766" text-anchor="middle" font-size="20.5432" font-weight="bold" fill="var(--text)">T2I-Adapter Types &amp; Composability</text>
  <text x="134.8477" y="529.3827" font-size="18.9629" fill="var(--text-muted)">Canny edges -&gt; structure control</text>
  <text x="134.8477" y="560.9876" font-size="18.9629" fill="var(--text-muted)">Depth map -&gt; 3D-aware generation</text>
  <text x="640.5267" y="529.3827" font-size="18.9629" fill="var(--text-muted)">Color palette -&gt; color harmony</text>
  <text x="640.5267" y="560.9876" font-size="18.9629" fill="var(--text-muted)">Sketch -&gt; rough shape control</text>
  <text x="134.8477" y="616.2963" font-size="18.9629" font-weight="bold" fill="var(--text)">Multiple adapters can be combined: canny (structure) + color (palette)</text>
</svg>
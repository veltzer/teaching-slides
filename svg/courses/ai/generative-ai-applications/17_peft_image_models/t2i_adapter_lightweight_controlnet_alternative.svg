<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">T2I-Adapter: Lightweight ControlNet Alternative</text>
  <!-- Comparison table -->
  <rect x="30" y="55" width="180" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="120" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Metric</text>
  <rect x="215" y="55" width="200" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="315" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">T2I-Adapter</text>
  <rect x="420" y="55" width="200" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="520" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">ControlNet</text>

  <rect x="30" y="90" width="180" height="30" rx="3" fill="#f0f0f0" stroke="#ddd"/>
  <text x="120" y="110" text-anchor="middle" font-size="11" fill="#333">Parameters</text>
  <rect x="215" y="90" width="200" height="30" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="315" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">77M</text>
  <rect x="420" y="90" width="200" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="520" y="110" text-anchor="middle" font-size="11" fill="#333">1.4B</text>

  <rect x="30" y="125" width="180" height="30" rx="3" fill="#f0f0f0" stroke="#ddd"/>
  <text x="120" y="145" text-anchor="middle" font-size="11" fill="#333">Training time</text>
  <rect x="215" y="125" width="200" height="30" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="315" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Hours</text>
  <rect x="420" y="125" width="200" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="520" y="145" text-anchor="middle" font-size="11" fill="#333">Days</text>

  <rect x="30" y="160" width="180" height="30" rx="3" fill="#f0f0f0" stroke="#ddd"/>
  <text x="120" y="180" text-anchor="middle" font-size="11" fill="#333">Quality</text>
  <rect x="215" y="160" width="200" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="315" y="180" text-anchor="middle" font-size="11" fill="#333">4/5</text>
  <rect x="420" y="160" width="200" height="30" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="520" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">5/5</text>

  <rect x="30" y="195" width="180" height="30" rx="3" fill="#f0f0f0" stroke="#ddd"/>
  <text x="120" y="215" text-anchor="middle" font-size="11" fill="#333">Composability</text>
  <rect x="215" y="195" width="200" height="30" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="315" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Easy</text>
  <rect x="420" y="195" width="200" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="520" y="215" text-anchor="middle" font-size="11" fill="#333">Harder</text>

  <rect x="30" y="230" width="180" height="30" rx="3" fill="#f0f0f0" stroke="#ddd"/>
  <text x="120" y="250" text-anchor="middle" font-size="11" fill="#333">Inference</text>
  <rect x="215" y="230" width="200" height="30" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="315" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Faster</text>
  <rect x="420" y="230" width="200" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="520" y="250" text-anchor="middle" font-size="11" fill="#333">Slower</text>

  <!-- Adapter types -->
  <rect x="30" y="285" width="640" height="120" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">T2I-Adapter Types &amp; Composability</text>
  <text x="80" y="335" font-size="12" fill="#555">Canny edges -> structure control</text>
  <text x="80" y="355" font-size="12" fill="#555">Depth map -> 3D-aware generation</text>
  <text x="380" y="335" font-size="12" fill="#555">Color palette -> color harmony</text>
  <text x="380" y="355" font-size="12" fill="#555">Sketch -> rough shape control</text>
  <text x="80" y="390" font-size="12" font-weight="bold" fill="#333">Multiple adapters can be combined: canny (structure) + color (palette)</text>
</svg>
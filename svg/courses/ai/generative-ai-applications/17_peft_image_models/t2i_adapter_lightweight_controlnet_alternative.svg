  <text x="208.75" y="73.142823469386" text-anchor="middle" font-size="20.480766895789" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Metric</text>
  <rect x="386.875" y="40" width="375.0001" height="49.71428877551" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="73.142823469386" text-anchor="middle" font-size="20.480766895789" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">T2I-Adapter</text>
  <rect x="771.25" y="40" width="375.0001" height="49.71428877551" rx="6.210590225294" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.75" y="73.142823469386" text-anchor="middle" font-size="20.480766895789" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ControlNet</text>
  <rect x="40" y="97.999967857141" width="337.5001" height="49.71428877551" rx="6.210590225294" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="131.142791326527" text-anchor="middle" font-size="18.774096701878" fill="var(--text)" font-family="Arial, sans-serif">Parameters</text>
  <rect x="386.875" y="97.999967857141" width="375.0001" height="49.71428877551" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="131.142791326527" text-anchor="middle" font-size="18.774096701878" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">77M</text>
  <rect x="771.25" y="97.999967857141" width="375.0001" height="49.71428877551" rx="6.210590225294" fill="var(--bg)" stroke="var(--border)"/>
  <text x="958.75" y="131.142791326527" text-anchor="middle" font-size="18.774096701878" fill="var(--text)" font-family="Arial, sans-serif">1.4B</text>
  <rect x="40" y="156.000042857146" width="337.5001" height="49.71428877551" rx="6.210590225294" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="189.142866326531" text-anchor="middle" font-size="18.774096701878" fill="var(--text)" font-family="Arial, sans-serif">Training time</text>
  <rect x="386.875" y="156.000042857146" width="375.0001" height="49.71428877551" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="189.142866326531" text-anchor="middle" font-size="18.774096701878" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Hours</text>
  <rect x="771.25" y="156.000042857146" width="375.0001" height="49.71428877551" rx="6.210590225294" fill="var(--bg)" stroke="var(--border)"/>
  <text x="958.75" y="189.142866326531" text-anchor="middle" font-size="18.774096701878" fill="var(--text)" font-family="Arial, sans-serif">Days</text>
  <rect x="40" y="214.000010714286" width="337.5001" height="49.71428877551" rx="6.210590225294" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="247.142834183672" text-anchor="middle" font-size="18.774096701878" fill="var(--text)" font-family="Arial, sans-serif">Quality</text>
  <rect x="386.875" y="214.000010714286" width="375.0001" height="49.71428877551" rx="6.210590225294" fill="var(--bg)" stroke="var(--border)"/>
  <text x="574.375" y="247.142834183672" text-anchor="middle" font-size="18.774096701878" fill="var(--text)" font-family="Arial, sans-serif">4/5</text>
  <rect x="771.25" y="214.000010714286" width="375.0001" height="49.71428877551" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.75" y="247.142834183672" text-anchor="middle" font-size="18.774096701878" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">5/5</text>
  <rect x="40" y="271.999978571427" width="337.5001" height="49.71428877551" rx="6.210590225294" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="305.142909183677" text-anchor="middle" font-size="18.774096701878" fill="var(--text)" font-family="Arial, sans-serif">Composability</text>
  <rect x="386.875" y="271.999978571427" width="375.0001" height="49.71428877551" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="305.142909183677" text-anchor="middle" font-size="18.774096701878" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Easy</text>
  <rect x="771.25" y="271.999978571427" width="375.0001" height="49.71428877551" rx="6.210590225294" fill="var(--bg)" stroke="var(--border)"/>
  <text x="958.75" y="305.142909183677" text-anchor="middle" font-size="18.774096701878" fill="var(--text)" font-family="Arial, sans-serif">Harder</text>
  <rect x="40" y="329.999946428568" width="337.5001" height="49.71428877551" rx="6.210590225294" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="208.75" y="363.142769897954" text-anchor="middle" font-size="18.774096701878" fill="var(--text)" font-family="Arial, sans-serif">Inference</text>
  <rect x="386.875" y="329.999946428568" width="375.0001" height="49.71428877551" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="574.375" y="363.142769897954" text-anchor="middle" font-size="18.774096701878" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Faster</text>
  <rect x="771.25" y="329.999946428568" width="375.0001" height="49.71428877551" rx="6.210590225294" fill="var(--bg)" stroke="var(--border)"/>
  <text x="958.75" y="363.142769897954" text-anchor="middle" font-size="18.774096701878" fill="var(--text)" font-family="Arial, sans-serif">Slower</text>
  <rect x="40" y="421.142844897958" width="1200" height="198.857155102042" rx="6.210590225294" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="462.571454591838" text-anchor="middle" font-size="22.187540599537" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">T2I-Adapter Types &amp; Composability</text>
  <text x="133.75" y="503.999957142854" font-size="20.480766895789" fill="var(--text-muted)" font-family="Arial, sans-serif">Canny edges -&gt; structure control</text>
  <text x="133.75" y="537.14278061224" font-size="20.480766895789" fill="var(--text-muted)" font-family="Arial, sans-serif">Depth map -&gt; 3D-aware generation</text>
  <text x="696.2499" y="503.999957142854" font-size="20.480766895789" fill="var(--text-muted)" font-family="Arial, sans-serif">Color palette -&gt; color harmony</text>
  <text x="696.2499" y="537.14278061224" font-size="20.480766895789" fill="var(--text-muted)" font-family="Arial, sans-serif">Sketch -&gt; rough shape control</text>
  <text x="133.75" y="595.142855612245" font-size="20.480766895789" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Multiple adapters can be combined: canny (structure) + color (palette)</text>
</svg>

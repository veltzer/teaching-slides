<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="584.2642" y="51.8919" text-anchor="middle" font-size="30.0479" font-weight="bold" fill="#333">Customizing Image Models</ns0:text>
  <ns0:rect x="50.0798" y="95.1351" width="1068.3688" height="95.1351" rx="8.3467" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.3386" />
  <ns0:text x="83.4663" y="134.9189" font-size="21.7012" font-weight="bold" fill="#4a90e2">Standard Stable Diffusion:</ns0:text>
  <ns0:text x="83.4663" y="169.5135" font-size="20.032" fill="#555">"A photo of a dog" -&gt; Generic dog image</ns0:text>
  <ns0:rect x="50.0798" y="216.2162" width="1068.3688" height="190.2703" rx="8.3467" fill="#d4edda" stroke="#28a745" stroke-width="3.3386" />
  <ns0:text x="83.4663" y="256" font-size="21.7012" font-weight="bold" fill="#28a745">After DreamBooth fine-tuning on YOUR dog:</ns0:text>
  <ns0:text x="116.8528" y="302.7026" font-size="20.032" fill="#333">"A photo of [V] dog" -&gt; YOUR specific dog</ns0:text>
  <ns0:text x="116.8528" y="342.4865" font-size="20.032" fill="#333">"A photo of [V] dog wearing a cowboy hat" -&gt; Your dog in a hat!</ns0:text>
  <ns0:text x="116.8528" y="382.2702" font-size="20.032" fill="#333">"[V] dog in a Van Gogh painting" -&gt; Your dog, Van Gogh style</ns0:text>
  <ns0:rect x="50.0798" y="432.4324" width="1068.3688" height="112.4324" rx="8.3467" fill="#fff3cd" stroke="#ffc107" stroke-width="3.3386" />
  <ns0:text x="83.4663" y="472.2162" font-size="21.7012" font-weight="bold" fill="#bf360c">After Textual Inversion on YOUR style:</ns0:text>
  <ns0:text x="116.8528" y="518.9189" font-size="20.032" fill="#333">"A landscape in &lt;my-style&gt;" -&gt; Landscape in YOUR art style</ns0:text>
  <ns0:rect x="166.9326" y="570.8108" width="834.6631" height="69.1892" rx="8.3467" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.504" />
  <ns0:text x="584.2642" y="614.054" text-anchor="middle" font-size="20.032" font-weight="bold" fill="#4a90e2">Same base model, personalized to YOUR subjects and styles</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="101.269798437898" rx="6.233549438601" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5" y="82.349208062484" font-size="23.729252647924" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Standard Stable Diffusion:</text>
  <text x="77.5" y="119.17465799949" font-size="21.904069372301" fill="var(--text-muted)" font-family="Arial, sans-serif">"A photo of a dog" -&gt; Generic dog image</text>
  <rect x="40" y="168.888912874777" width="1200" height="202.539704812293" rx="6.233549438601" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5" y="211.238120937261" font-size="23.729252647924" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">After DreamBooth fine-tuning on YOUR dog:</text>
  <text x="114.9999" y="260.952267876052" font-size="21.904069372301" fill="var(--text)" font-family="Arial, sans-serif">"A photo of [V] dog" -&gt; YOUR specific dog</text>
  <text x="114.9999" y="303.301583875032" font-size="21.904069372301" fill="var(--text)" font-family="Arial, sans-serif">"A photo of [V] dog wearing a cowboy hat" -&gt; Your dog in a hat!</text>
  <text x="114.9999" y="345.650791937516" font-size="21.904069372301" fill="var(--text)" font-family="Arial, sans-serif">"[V] dog in a Van Gogh painting" -&gt; Your dog, Van Gogh style</text>
  <rect x="40" y="399.047624187452" width="1200" height="119.682469438153" rx="6.233549438601" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5" y="441.396832249936" font-size="23.729252647924" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">After Textual Inversion on YOUR style:</text>
  <text x="114.9999" y="491.111087125223" font-size="21.904069372301" fill="var(--text)" font-family="Arial, sans-serif">"A landscape in &lt;my-style&gt;" -&gt; Landscape in YOUR art style</text>
  <rect x="171.25" y="546.349208062484" width="937.5" height="73.650791937516" rx="6.233549438601" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="592.380885563122" text-anchor="middle" font-size="21.904069372301" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Same base model, personalized to YOUR subjects and styles</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="56.8421" text-anchor="middle" font-size="32.9143" font-weight="bold" fill="#333">Customizing Image Models</text>
  <rect x="54.8571" y="104.2105" width="1170.2857" height="104.2105" rx="9.1429" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6571" />
  <text x="91.4286" y="147.7895" font-size="23.7714" font-weight="bold" fill="#4a90e2">Standard Stable Diffusion:</text>
  <text x="91.4286" y="185.6842" font-size="21.9429" fill="#555">"A photo of a dog" -&gt; Generic dog image</text>
  <rect x="54.8571" y="236.8421" width="1170.2857" height="208.4211" rx="9.1429" fill="#d4edda" stroke="#28a745" stroke-width="3.6571" />
  <text x="91.4286" y="280.4211" font-size="23.7714" font-weight="bold" fill="#28a745">After DreamBooth fine-tuning on YOUR dog:</text>
  <text x="128" y="331.5789" font-size="21.9429" fill="#333">"A photo of [V] dog" -&gt; YOUR specific dog</text>
  <text x="128" y="375.1579" font-size="21.9429" fill="#333">"A photo of [V] dog wearing a cowboy hat" -&gt; Your dog in a hat!</text>
  <text x="128" y="418.7368" font-size="21.9429" fill="#333">"[V] dog in a Van Gogh painting" -&gt; Your dog, Van Gogh style</text>
  <rect x="54.8571" y="473.6842" width="1170.2857" height="123.1579" rx="9.1429" fill="#fff3cd" stroke="#ffc107" stroke-width="3.6571" />
  <text x="91.4286" y="517.2632" font-size="23.7714" font-weight="bold" fill="#856404">After Textual Inversion on YOUR style:</text>
  <text x="128" y="568.4211" font-size="21.9429" fill="#333">"A landscape in &lt;my-style&gt;" -&gt; Landscape in YOUR art style</text>
  <rect x="182.8571" y="625.2632" width="914.2857" height="75.7895" rx="9.1429" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7429" />
  <text x="640" y="672.6316" text-anchor="middle" font-size="21.9429" font-weight="bold" fill="#4a90e2">Same base model, personalized to YOUR subjects and styles</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Customizing Image Models</text>
  <!-- Standard -->
  <rect x="30" y="55" width="640" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="78" font-size="13" font-weight="bold" fill="#4a90e2">Standard Stable Diffusion:</text>
  <text x="50" y="98" font-size="12" fill="#555">"A photo of a dog" -> Generic dog image</text>
  <!-- DreamBooth -->
  <rect x="30" y="125" width="640" height="110" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="50" y="148" font-size="13" font-weight="bold" fill="#28a745">After DreamBooth fine-tuning on YOUR dog:</text>
  <text x="70" y="175" font-size="12" fill="#333">"A photo of [V] dog" -> YOUR specific dog</text>
  <text x="70" y="198" font-size="12" fill="#333">"A photo of [V] dog wearing a cowboy hat" -> Your dog in a hat!</text>
  <text x="70" y="221" font-size="12" fill="#333">"[V] dog in a Van Gogh painting" -> Your dog, Van Gogh style</text>
  <!-- Textual Inversion -->
  <rect x="30" y="250" width="640" height="65" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="50" y="273" font-size="13" font-weight="bold" fill="#856404">After Textual Inversion on YOUR style:</text>
  <text x="70" y="300" font-size="12" fill="#333">"A landscape in &lt;my-style&gt;" -> Landscape in YOUR art style</text>
  <!-- Key insight -->
  <rect x="100" y="330" width="500" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="350" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Same base model, personalized to YOUR subjects and styles</text>
</svg>
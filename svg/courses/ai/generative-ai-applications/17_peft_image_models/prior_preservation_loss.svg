<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="610.5149" y="46.8293" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="var(--text)">Prior Preservation Loss</text>
  <rect x="52.3298" y="85.8537" width="523.2985" height="140.4878" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="313.9791" y="124.8781" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--danger-accent)">Without Prior Preservation</text>
  <text x="87.2164" y="163.9025" font-size="18.7317" fill="var(--text)">"a photo of a dog" -&gt;</text>
  <text x="87.2164" y="195.122" font-size="18.7317" fill="var(--danger-accent)">Always generates YOUR dog (forgot others!)</text>
  <rect x="645.4014" y="85.8537" width="523.2985" height="140.4878" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="907.0507" y="124.8781" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--ok-accent)">With Prior Preservation</text>
  <text x="680.2881" y="163.9025" font-size="18.7317" fill="var(--text)">"a photo of sks dog" -&gt; YOUR dog</text>
  <text x="680.2881" y="195.122" font-size="18.7317" fill="var(--text)">"a photo of a dog" -&gt; generic dog</text>
  <rect x="139.5462" y="265.3658" width="941.9373" height="78.0488" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="610.5149" y="312.1951" text-anchor="middle" font-size="24.9756" font-weight="bold" fill="var(--text)">L = L_instance + lambda x L_prior</text>
  <rect x="52.3298" y="382.439" width="540.7417" height="140.4878" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="322.7007" y="421.4634" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--ok-accent)">L_instance: Learn YOUR subject</text>
  <text x="87.2164" y="460.4878" font-size="17.1707" fill="var(--text)">"a photo of sks dog"</text>
  <text x="87.2164" y="491.7073" font-size="17.1707" fill="var(--text-muted)">-&gt; denoising loss on YOUR images</text>
  <rect x="627.9582" y="382.439" width="540.7417" height="140.4878" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="898.3291" y="421.4634" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--danger-accent)">L_prior: Don't forget the class</text>
  <text x="662.8447" y="460.4878" font-size="17.1707" fill="var(--text)">"a photo of a dog"</text>
  <text x="662.8447" y="491.7073" font-size="17.1707" fill="var(--text-muted)">-&gt; denoising loss on GENERATED images</text>
  <rect x="348.8657" y="561.9512" width="523.2985" height="78.0488" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="610.5149" y="608.7805" text-anchor="middle" font-size="20.2927" fill="var(--text)">lambda = 1.0 (equal weight, typically)</text>
</svg>
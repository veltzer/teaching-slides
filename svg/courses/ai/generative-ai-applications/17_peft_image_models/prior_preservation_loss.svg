<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="562.5" height="147.042232414203" rx="6.207673609487" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.2501" y="80.845076453085" text-anchor="middle" font-size="21.52428055108" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Without Prior Preservation</text>
  <text x="77.5" y="121.69015290617" font-size="19.868487076976" fill="var(--text)" font-family="Arial, sans-serif">"a photo of a dog" -&gt;</text>
  <text x="77.5" y="154.366192660186" font-size="19.868487076976" fill="var(--danger-accent)" font-family="Arial, sans-serif">Always generates YOUR dog (forgot others!)</text>
  <rect x="677.5" y="40" width="562.5" height="147.042232414203" rx="6.207673609487" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.75" y="80.845076453085" text-anchor="middle" font-size="21.52428055108" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">With Prior Preservation</text>
  <text x="715.0001" y="121.69015290617" font-size="19.868487076976" fill="var(--text)" font-family="Arial, sans-serif">"a photo of sks dog" -&gt; YOUR dog</text>
  <text x="715.0001" y="154.366192660186" font-size="19.868487076976" fill="var(--text)" font-family="Arial, sans-serif">"a photo of a dog" -&gt; generic dog</text>
  <rect x="133.75" y="227.887201825034" width="1012.5" height="81.69015290617" rx="6.207673609487" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="276.901314977186" text-anchor="middle" font-size="26.491350589711" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">L = L_instance + lambda x L_prior</text>
  <rect x="40" y="350.422538226542" width="581.2499" height="147.042232414203" rx="6.207673609487" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.625" y="391.267614679627" text-anchor="middle" font-size="21.52428055108" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">L_instance: Learn YOUR subject</text>
  <text x="77.5" y="432.112691132712" font-size="18.212797064099" fill="var(--text)" font-family="Arial, sans-serif">"a photo of sks dog"</text>
  <text x="77.5" y="464.788730886729" font-size="18.212797064099" fill="var(--text-muted)" font-family="Arial, sans-serif">-&gt; denoising loss on YOUR images</text>
  <rect x="658.7501" y="350.422538226542" width="581.2499" height="147.042232414203" rx="6.207673609487" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.3751" y="391.267614679627" text-anchor="middle" font-size="21.52428055108" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">L_prior: Don't forget the class</text>
  <text x="696.25" y="432.112691132712" font-size="18.212797064099" fill="var(--text)" font-family="Arial, sans-serif">"a photo of a dog"</text>
  <text x="696.25" y="464.788730886729" font-size="18.212797064099" fill="var(--text-muted)" font-family="Arial, sans-serif">-&gt; denoising loss on GENERATED images</text>
  <rect x="358.7501" y="538.309847093831" width="562.5" height="81.69015290617" rx="6.207673609487" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="587.323960245983" text-anchor="middle" font-size="21.52428055108" fill="var(--text)" font-family="Arial, sans-serif">lambda = 1.0 (equal weight, typically)</text>
</svg>

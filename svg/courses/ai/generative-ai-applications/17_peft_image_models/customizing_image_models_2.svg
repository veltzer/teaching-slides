<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="654.4" y="40" text-anchor="middle" font-size="33.5459" font-weight="bold" fill="var(--text)">Personalization Methods</text>
  <rect x="40" y="90.8771" width="326.4" height="71.2281" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.2" y="137.6842" text-anchor="middle" font-size="22.3638" font-weight="bold" fill="var(--bg)">Method</text>
  <rect x="375.9999" y="90.8771" width="864.0001" height="71.2281" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="808" y="137.6842" text-anchor="middle" font-size="22.3638" font-weight="bold" fill="var(--bg)">Details</text>
  <rect x="40" y="172.2807" width="326.4" height="142.4561" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.2" y="233.3334" text-anchor="middle" font-size="24.2276" font-weight="bold" fill="var(--text)">DreamBooth</text>
  <text x="203.2" y="274.0351" text-anchor="middle" font-size="20.5003" fill="var(--ok-accent)">Higher quality</text>
  <rect x="375.9999" y="172.2807" width="864.0001" height="142.4561" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="414.4" y="223.1579" font-size="22.3638" fill="var(--text)">Fine-tune model weights</text>
  <text x="414.4" y="263.8597" font-size="22.3638" fill="var(--text-muted)">3-5 images needed</text>
  <rect x="40" y="324.9122" width="326.4" height="142.4561" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.2" y="375.7895" text-anchor="middle" font-size="24.2276" font-weight="bold" fill="var(--text)">Textual Inversion</text>
  <text x="203.2" y="426.6667" text-anchor="middle" font-size="20.5003" fill="var(--danger-accent)">Lightweight</text>
  <rect x="375.9999" y="324.9122" width="864.0001" height="142.4561" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="414.4" y="375.7895" font-size="22.3638" fill="var(--text)">Learn new text embedding</text>
  <text x="414.4" y="416.4912" font-size="22.3638" fill="var(--text-muted)">3-5 images needed</text>
  <rect x="40" y="477.5439" width="326.4" height="142.4561" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.2" y="528.421" text-anchor="middle" font-size="24.2276" font-weight="bold" fill="var(--text)">LoRA for Diffusion</text>
  <text x="203.2" y="579.2983" text-anchor="middle" font-size="20.5003" fill="var(--primary-accent)">Best tradeoff</text>
  <rect x="375.9999" y="477.5439" width="864.0001" height="142.4561" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="414.4" y="528.421" font-size="22.3638" fill="var(--text)">Low-rank adaptation of U-Net / text encoder</text>
  <text x="414.4" y="569.1228" font-size="22.3638" fill="var(--text-muted)">Best quality/size tradeoff</text>
</svg>
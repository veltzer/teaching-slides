<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Arial, sans-serif">
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Personalization Methods</text>
  <!-- Header -->
  <rect x="20" y="55" width="170" height="35" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="105" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Method</text>
  <rect x="195" y="55" width="450" height="35" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="420" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Details</text>
  <!-- DreamBooth -->
  <rect x="20" y="95" width="170" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="105" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">DreamBooth</text>
  <text x="105" y="145" text-anchor="middle" font-size="11" fill="#28a745">Higher quality</text>
  <rect x="195" y="95" width="450" height="70" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="215" y="120" font-size="12" fill="#333">Fine-tune model weights</text>
  <text x="215" y="140" font-size="12" fill="#555">3-5 images needed</text>
  <!-- Textual Inversion -->
  <rect x="20" y="170" width="170" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="105" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Textual Inversion</text>
  <text x="105" y="220" text-anchor="middle" font-size="11" fill="#856404">Lightweight</text>
  <rect x="195" y="170" width="450" height="70" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="215" y="195" font-size="12" fill="#333">Learn new text embedding</text>
  <text x="215" y="215" font-size="12" fill="#555">3-5 images needed</text>
  <!-- LoRA -->
  <rect x="20" y="245" width="170" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="105" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">LoRA for Diffusion</text>
  <text x="105" y="295" text-anchor="middle" font-size="11" fill="#4a90e2">Best tradeoff</text>
  <rect x="195" y="245" width="450" height="70" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="215" y="270" font-size="12" fill="#333">Low-rank adaptation of U-Net / text encoder</text>
  <text x="215" y="290" font-size="12" fill="#555">Best quality/size tradeoff</text>
</svg>
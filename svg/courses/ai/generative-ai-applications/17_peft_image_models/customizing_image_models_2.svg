<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="326.4" height="78.076942048813" rx="6.281841412117" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.2" y="91.307773676021" text-anchor="middle" font-size="23.414307495383" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Method</text>
  <rect x="375.9999" y="40" width="864.0001" height="78.076942048813" rx="6.281841412117" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="808" y="91.307773676021" text-anchor="middle" font-size="23.414307495383" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Details</text>
  <rect x="40" y="129.230853550281" width="326.4" height="156.153774482261" rx="6.281841412117" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.2" y="196.153993712992" text-anchor="middle" font-size="25.3656568327" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DreamBooth</text>
  <text x="203.2" y="240.769310872767" text-anchor="middle" font-size="21.463272250136" fill="var(--ok-accent)" font-family="Arial, sans-serif">Higher quality</text>
  <rect x="375.9999" y="129.230853550281" width="864.0001" height="156.153774482261" rx="6.281841412117" fill="var(--bg)" stroke="var(--border)"/>
  <text x="414.4" y="185.000082211524" font-size="23.414307495383" fill="var(--text)" font-family="Arial, sans-serif">Fine-tune model weights</text>
  <text x="414.4" y="229.615508986665" font-size="23.414307495383" fill="var(--text-muted)" font-family="Arial, sans-serif">3-5 images needed</text>
  <rect x="40" y="296.538429918645" width="326.4" height="156.153774482261" rx="6.281841412117" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.2" y="352.307768195253" text-anchor="middle" font-size="25.3656568327" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Textual Inversion</text>
  <text x="203.2" y="408.076996856496" text-anchor="middle" font-size="21.463272250136" fill="var(--danger-accent)" font-family="Arial, sans-serif">Lightweight</text>
  <rect x="375.9999" y="296.538429918645" width="864.0001" height="156.153774482261" rx="6.281841412117" fill="var(--bg)" stroke="var(--border)"/>
  <text x="414.4" y="352.307768195253" font-size="23.414307495383" fill="var(--text)" font-family="Arial, sans-serif">Learn new text embedding</text>
  <text x="414.4" y="396.923085355028" font-size="23.414307495383" fill="var(--text-muted)" font-family="Arial, sans-serif">3-5 images needed</text>
  <rect x="40" y="463.846225517739" width="326.4" height="156.153774482261" rx="6.281841412117" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.2" y="519.615344563617" text-anchor="middle" font-size="25.3656568327" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">LoRA for Diffusion</text>
  <text x="203.2" y="575.384682840225" text-anchor="middle" font-size="21.463272250136" fill="var(--primary-accent)" font-family="Arial, sans-serif">Best tradeoff</text>
  <rect x="375.9999" y="463.846225517739" width="864.0001" height="156.153774482261" rx="6.281841412117" fill="var(--bg)" stroke="var(--border)"/>
  <text x="414.4" y="519.615344563617" font-size="23.414307495383" fill="var(--text)" font-family="Arial, sans-serif">Low-rank adaptation of U-Net / text encoder</text>
  <text x="414.4" y="564.230771338757" font-size="23.414307495383" fill="var(--text-muted)" font-family="Arial, sans-serif">Best quality/size tradeoff</text>
</svg>

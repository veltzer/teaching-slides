<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="654.4" y="40" text-anchor="middle" font-size="33.5459" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Personalization Methods</text>
  <rect x="40" y="90.8771" width="326.4" height="71.2281" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.2" y="137.6842" text-anchor="middle" font-size="22.3638" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Method</text>
  <rect x="375.9999" y="90.8771" width="864.0001" height="71.2281" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="808" y="137.6842" text-anchor="middle" font-size="22.3638" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Details</text>
  <rect x="40" y="172.2807" width="326.4" height="142.4561" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.2" y="233.3334" text-anchor="middle" font-size="24.2276" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DreamBooth</text>
  <text x="203.2" y="274.0351" text-anchor="middle" font-size="20.5003" fill="var(--ok-accent)" font-family="Arial, sans-serif">Higher quality</text>
  <rect x="375.9999" y="172.2807" width="864.0001" height="142.4561" rx="6" fill="var(--bg)" stroke="var(--border)"/>
  <text x="414.4" y="223.1579" font-size="22.3638" fill="var(--text)" font-family="Arial, sans-serif">Fine-tune model weights</text>
  <text x="414.4" y="263.8597" font-size="22.3638" fill="var(--text-muted)" font-family="Arial, sans-serif">3-5 images needed</text>
  <rect x="40" y="324.9122" width="326.4" height="142.4561" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.2" y="375.7895" text-anchor="middle" font-size="24.2276" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Textual Inversion</text>
  <text x="203.2" y="426.6667" text-anchor="middle" font-size="20.5003" fill="var(--danger-accent)" font-family="Arial, sans-serif">Lightweight</text>
  <rect x="375.9999" y="324.9122" width="864.0001" height="142.4561" rx="6" fill="var(--bg)" stroke="var(--border)"/>
  <text x="414.4" y="375.7895" font-size="22.3638" fill="var(--text)" font-family="Arial, sans-serif">Learn new text embedding</text>
  <text x="414.4" y="416.4912" font-size="22.3638" fill="var(--text-muted)" font-family="Arial, sans-serif">3-5 images needed</text>
  <rect x="40" y="477.5439" width="326.4" height="142.4561" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.2" y="528.421" text-anchor="middle" font-size="24.2276" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">LoRA for Diffusion</text>
  <text x="203.2" y="579.2983" text-anchor="middle" font-size="20.5003" fill="var(--primary-accent)" font-family="Arial, sans-serif">Best tradeoff</text>
  <rect x="375.9999" y="477.5439" width="864.0001" height="142.4561" rx="6" fill="var(--bg)" stroke="var(--border)"/>
  <text x="414.4" y="528.421" font-size="22.3638" fill="var(--text)" font-family="Arial, sans-serif">Low-rank adaptation of U-Net / text encoder</text>
  <text x="414.4" y="569.1228" font-size="22.3638" fill="var(--text-muted)" font-family="Arial, sans-serif">Best quality/size tradeoff</text>
</svg>

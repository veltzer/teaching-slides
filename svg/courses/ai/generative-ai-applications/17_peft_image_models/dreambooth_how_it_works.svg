<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.9127" font-weight="bold" fill="var(--text)">DreamBooth: How It Works</text>
  <text x="640" y="82.439" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8665" font-weight="bold" fill="var(--primary-accent)">Step 1: Provide 3-5 images of your subject</text>
  <rect x="180" y="96.5854" width="140" height="70.7317" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250.0001" y="139.0244" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.6409" fill="var(--primary-accent)">img</text>
  <rect x="360" y="96.5854" width="140" height="70.7317" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430.0001" y="139.0244" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.6409" fill="var(--primary-accent)">img</text>
  <rect x="540" y="96.5854" width="140" height="70.7317" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610.0001" y="139.0244" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.6409" fill="var(--primary-accent)">img</text>
  <rect x="720" y="96.5854" width="140" height="70.7317" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790.0001" y="139.0244" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.6409" fill="var(--primary-accent)">img</text>
  <rect x="900" y="96.5854" width="140" height="70.7317" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="970.0001" y="139.0244" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.6409" fill="var(--primary-accent)">img</text>
  <text x="640" y="188.5366" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5025" fill="var(--text-muted)">Your dog in different poses/lighting</text>
  <line x1="640" y1="202.6829" x2="640" y2="230.9756" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="200.0001" y="230.9756" width="880" height="70.7317" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="263.5122" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8665" font-weight="bold" fill="var(--danger-accent)">Step 2: Choose unique identifier: "sks dog"</text>
  <text x="640" y="287.561" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5025" fill="var(--text-muted)">(rare token + class word)</text>
  <line x1="640" y1="301.7073" x2="640" y2="337.0731" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="337.0731" width="1200" height="113.1707" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="369.6098" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8665" font-weight="bold" fill="var(--ok-accent)">Step 3: Fine-tune the entire diffusion model</text>
  <text x="640" y="397.9024" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5025" fill="var(--text)">Model learns to associate "sks" with YOUR specific dog</text>
  <text x="640" y="421.9512" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5025" fill="var(--text-muted)">Also trains on generic "dog" images (prior preservation)</text>
  <text x="640" y="443.1708" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8204" fill="var(--text-muted)">Prevents forgetting what dogs look like in general</text>
  <line x1="640" y1="450.2439" x2="640" y2="485.6098" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="485.6098" width="1200" height="134.3902" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="518.1464" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8665" font-weight="bold" fill="var(--primary-accent)">Step 4: Generate with any prompt containing "sks dog"</text>
  <rect x="100.0001" y="535.1219" width="440.0001" height="35.3658" rx="6" fill="var(--bg)" stroke="var(--primary-border)" />
  <text x="320" y="559.1707" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5025" fill="var(--text)">"A sks dog playing in snow"</text>
  <rect x="580" y="535.1219" width="440.0001" height="35.3658" rx="6" fill="var(--bg)" stroke="var(--primary-border)" />
  <text x="800.0001" y="559.1707" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5025" fill="var(--text)">"A sks dog as an astronaut"</text>
  <rect x="320" y="577.561" width="640" height="35.3658" rx="6" fill="var(--bg)" stroke="var(--primary-border)" />
  <text x="640" y="601.6098" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5025" fill="var(--text)">"Oil painting of sks dog by Monet"</text>
</svg>
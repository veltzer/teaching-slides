<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.713255938688" font-weight="bold" fill="var(--primary-accent)">Step 1: Provide 3-5 images of your subject</text>
  <rect x="180" y="55.263220360108" width="140" height="76.315778116344" rx="6.232343339452" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250.0001" y="101.052665650968" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.943606508029" fill="var(--primary-accent)">img</text>
  <rect x="360" y="55.263220360108" width="140" height="76.315778116344" rx="6.232343339452" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430.0001" y="101.052665650968" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.943606508029" fill="var(--primary-accent)">img</text>
  <rect x="540" y="55.263220360108" width="140" height="76.315778116344" rx="6.232343339452" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610.0001" y="101.052665650968" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.943606508029" fill="var(--primary-accent)">img</text>
  <rect x="720" y="55.263220360108" width="140" height="76.315778116344" rx="6.232343339452" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790.0001" y="101.052665650968" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.943606508029" fill="var(--primary-accent)">img</text>
  <rect x="900" y="55.263220360108" width="140" height="76.315778116344" rx="6.232343339452" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="970.0001" y="101.052665650968" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.943606508029" fill="var(--primary-accent)">img</text>
  <text x="640" y="154.473721121882" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.218988773035" fill="var(--text-muted)">Your dog in different poses/lighting</text>
  <line x1="640" y1="169.736833587258" x2="640" y2="200.263166412742" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200.0001" y="200.263166412742" width="880" height="76.315778116344" rx="6.232343339452" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="235.368443767312" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.713255938688" font-weight="bold" fill="var(--danger-accent)">Step 2: Choose unique identifier: "sks dog"</text>
  <text x="640" y="261.31583206371" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.218988773035" fill="var(--text-muted)">(rare token + class word)</text>
  <line x1="640" y1="276.578944529086" x2="640" y2="314.736779639892" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="314.736779639892" width="1200" height="122.105223407204" rx="6.232343339452" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="349.842164889194" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.713255938688" font-weight="bold" fill="var(--ok-accent)">Step 3: Fine-tune the entire diffusion model</text>
  <text x="640" y="380.368389819946" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.218988773035" fill="var(--text)">Model learns to associate "sks" with YOUR specific dog</text>
  <text x="640" y="406.315778116344" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.218988773035" fill="var(--text-muted)">Also trains on generic "dog" images (prior preservation)</text>
  <text x="640" y="429.210608656506" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.47175131782" fill="var(--text-muted)">Prevents forgetting what dogs look like in general</text>
  <line x1="640" y1="436.842110941828" x2="640" y2="475.000053947366" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="475.000053947366" width="1200" height="144.999946052634" rx="6.232343339452" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="510.105331301936" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.713255938688" font-weight="bold" fill="var(--primary-accent)">Step 4: Generate with any prompt containing "sks dog"</text>
  <rect x="100.0001" y="528.421001523548" width="440.0001" height="38.157835110806" rx="6.232343339452" fill="var(--bg)" stroke="var(--primary-border)"/>
  <text x="320" y="554.368389819946" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.218988773035" fill="var(--text)">"A sks dog playing in snow"</text>
  <rect x="580" y="528.421001523548" width="440.0001" height="38.157835110806" rx="6.232343339452" fill="var(--bg)" stroke="var(--primary-border)"/>
  <text x="800.0001" y="554.368389819946" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.218988773035" fill="var(--text)">"A sks dog as an astronaut"</text>
  <rect x="320" y="574.21055470914" width="640" height="38.157835110806" rx="6.232343339452" fill="var(--bg)" stroke="var(--primary-border)"/>
  <text x="640" y="600.157943005538" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.218988773035" fill="var(--text)">"Oil painting of sks dog by Monet"</text>
</svg>

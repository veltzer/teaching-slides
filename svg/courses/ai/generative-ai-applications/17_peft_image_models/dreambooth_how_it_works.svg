  <ns0:text x="588.5057" y="36.7816" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.5402" font-weight="bold" fill="var(--text-dark)">DreamBooth: How It Works</ns0:text>
  <ns0:text x="588.5057" y="80.9195" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1264" font-weight="bold" fill="var(--primary-bright)">Step 1: Provide 3-5 images of your subject</ns0:text>
  <ns0:rect x="250.1149" y="95.6322" width="102.9885" height="73.5632" rx="7.3563" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.2069" />

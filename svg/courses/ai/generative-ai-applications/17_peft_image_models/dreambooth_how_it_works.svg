  <ns0:text x="588.5057" y="269.2414" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1264" font-weight="bold" fill="var(--danger-deeper)">Step 2: Choose unique identifier: "sks dog"</ns0:text>
  <ns0:text x="588.5057" y="294.2529" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="var(--text-muted)">(rare token + class word)</ns0:text>
  <ns0:line x1="588.5057" y1="308.9655" x2="588.5057" y2="345.7471" stroke="var(--primary-bright)" stroke-width="2.2069" marker-end="url(#arrow)" />

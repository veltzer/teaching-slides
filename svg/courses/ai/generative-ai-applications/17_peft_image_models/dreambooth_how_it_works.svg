<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="11.2" refX="16" refY="5.6" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" font-weight="bold" fill="#333">DreamBooth: How It Works</text>
  <text x="640" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#4a90e2">Step 1: Provide 3-5 images of your subject</text>
  <rect x="272" y="104" width="112" height="80" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="328" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#4a90e2">img</text>
  <rect x="416" y="104" width="112" height="80" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="472" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#4a90e2">img</text>
  <rect x="560" y="104" width="112" height="80" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="616" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#4a90e2">img</text>
  <rect x="704" y="104" width="112" height="80" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="760" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#4a90e2">img</text>
  <rect x="848" y="104" width="112" height="80" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="904" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#4a90e2">img</text>
  <text x="640" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Your dog in different poses/lighting</text>
  <line x1="640" y1="224" x2="640" y2="256" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="288" y="256" width="704" height="80" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="640" y="292.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#856404">Step 2: Choose unique identifier: "sks dog"</text>
  <text x="640" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">(rare token + class word)</text>
  <line x1="640" y1="336" x2="640" y2="376" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="160" y="376" width="960" height="128" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="640" y="412.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#28a745">Step 3: Fine-tune the entire diffusion model</text>
  <text x="640" y="444.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#333">Model learns to associate "sks" with YOUR specific dog</text>
  <text x="640" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Also trains on generic "dog" images (prior preservation)</text>
  <text x="640" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#777">Prevents forgetting what dogs look like in general</text>
  <line x1="640" y1="504" x2="640" y2="544" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="160" y="544" width="960" height="152" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="580.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#4a90e2">Step 4: Generate with any prompt containing "sks dog"</text>
  <rect x="208" y="600" width="352" height="40" rx="4.8" fill="#fff" stroke="#4a90e2" />
  <text x="384" y="627.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#333">"A sks dog playing in snow"</text>
  <rect x="592" y="600" width="352" height="40" rx="4.8" fill="#fff" stroke="#4a90e2" />
  <text x="768" y="627.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#333">"A sks dog as an astronaut"</text>
  <rect x="384" y="648" width="512" height="40" rx="4.8" fill="#fff" stroke="#4a90e2" />
  <text x="640" y="675.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#333">"Oil painting of sks dog by Monet"</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.9127" font-weight="bold" fill="var(--text)">DreamBooth: How It Works</text>
  <text x="640" y="82.439" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8665" font-weight="bold" fill="var(--primary-accent)">Step 1: Provide 3-5 images of your subject</text>
  <rect x="180" y="96.5854" width="140" height="70.7317" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250.0001" y="139.0244" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.6409" fill="var(--primary-accent)">img</text>
  <rect x="360" y="96.5854" width="140" height="70.7317" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430.0001" y="139.0244" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.6409" fill="var(--primary-accent)">img</text>
  <rect x="540" y="96.5854" width="140" height="70.7317" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610.0001" y="139.0244" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.6409" fill="var(--primary-accent)">img</text>
  <rect x="720" y="96.5854" width="140" height="70.7317" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790.0001" y="139.0244" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.6409" fill="var(--primary-accent)">img</text>
  <rect x="900" y="96.5854" width="140" height="70.7317" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="970.0001" y="139.0244" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.6409" fill="var(--primary-accent)">img</text>
  <text x="640" y="188.5366" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5025" fill="var(--text-muted)">Your dog in different poses/lighting</text>
  <line x1="640" y1="202.6829" x2="640" y2="230.9756" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="200.0001" y="230.9756" width="880" height="70.7317" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="263.5122" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8665" font-weight="bold" fill="var(--danger-accent)">Step 2: Choose unique identifier: "sks dog"</text>
  <text x="640" y="287.561" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5025" fill="var(--text-muted)">(rare token + class word)</text>
  <line x1="640" y1="301.7073" x2="640" y2="337.0731" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="337.0731" width="1200" height="113.1707" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="369.6098" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8665" font-weight="bold" fill="var(--ok-accent)">Step 3: Fine-tune the entire diffusion model</text>
  <text x="640" y="397.9024" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5025" fill="var(--text)">Model learns to associate "sks" with YOUR specific dog</text>
  <text x="640" y="421.9512" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5025" fill="var(--text-muted)">Also trains on generic "dog" images (prior preservation)</text>
  <text x="640" y="443.1708" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8204" fill="var(--text-muted)">Prevents forgetting what dogs look like in general</text>
  <line x1="640" y1="450.2439" x2="640" y2="485.6098" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="485.6098" width="1200" height="134.3902" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="518.1464" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8665" font-weight="bold" fill="var(--primary-accent)">Step 4: Generate with any prompt containing "sks dog"</text>
  <rect x="100.0001" y="535.1219" width="440.0001" height="35.3658" rx="6" fill="var(--bg)" stroke="var(--primary-border)" />
  <text x="320" y="559.1707" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5025" fill="var(--text)">"A sks dog playing in snow"</text>
  <rect x="580" y="535.1219" width="440.0001" height="35.3658" rx="6" fill="var(--bg)" stroke="var(--primary-border)" />
  <text x="800.0001" y="559.1707" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5025" fill="var(--text)">"A sks dog as an astronaut"</text>
  <rect x="320" y="577.561" width="640" height="35.3658" rx="6" fill="var(--bg)" stroke="var(--primary-border)" />
  <text x="640" y="601.6098" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5025" fill="var(--text)">"Oil painting of sks dog by Monet"</text>
</svg>
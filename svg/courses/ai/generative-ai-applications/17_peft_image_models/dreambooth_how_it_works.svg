  <ns0:text x="588.5057" y="191.2644" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="#555">Your dog in different poses/lighting</ns0:text>
  <ns0:line x1="588.5057" y1="205.977" x2="588.5057" y2="235.4023" stroke="#4a90e2" stroke-width="2.2069" marker-end="url(#arrow)" />
  <ns0:rect x="264.8276" y="235.4023" width="647.3563" height="73.5632" rx="7.3563" fill="#fff3cd" stroke="#ffc107" stroke-width="2.2069" />
  <ns0:text x="588.5057" y="269.2414" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1264" font-weight="bold" fill="#856404">Step 2: Choose unique identifier: "sks dog"</ns0:text>
  <ns0:text x="588.5057" y="294.2529" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="#555">(rare token + class word)</ns0:text>
  <ns0:line x1="588.5057" y1="308.9655" x2="588.5057" y2="345.7471" stroke="#4a90e2" stroke-width="2.2069" marker-end="url(#arrow)" />
  <ns0:rect x="147.1264" y="345.7471" width="882.7586" height="117.7011" rx="7.3563" fill="#d4edda" stroke="#28a745" stroke-width="2.2069" />
  <ns0:text x="588.5057" y="379.5862" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1264" font-weight="bold" fill="#28a745">Step 3: Fine-tune the entire diffusion model</ns0:text>
  <ns0:text x="588.5057" y="409.0115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="#333">Model learns to associate "sks" with YOUR specific dog</ns0:text>
  <ns0:text x="588.5057" y="434.023" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="#555">Also trains on generic "dog" images (prior preservation)</ns0:text>
  <ns0:text x="588.5057" y="456.092" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7126" fill="#777">Prevents forgetting what dogs look like in general</ns0:text>
  <ns0:line x1="588.5057" y1="463.4483" x2="588.5057" y2="500.2299" stroke="#4a90e2" stroke-width="2.2069" marker-end="url(#arrow)" />

  <ns0:text x="831.2644" y="139.7701" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.4253" fill="var(--primary-bright)">img</ns0:text>
  <ns0:text x="588.5057" y="191.2644" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="var(--text-muted)">Your dog in different poses/lighting</ns0:text>
  <ns0:line x1="588.5057" y1="205.977" x2="588.5057" y2="235.4023" stroke="var(--primary-bright)" stroke-width="2.2069" marker-end="url(#arrow)" />

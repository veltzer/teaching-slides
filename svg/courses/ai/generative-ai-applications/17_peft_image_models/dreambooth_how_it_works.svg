  <ns0:text x="588.5057" y="379.5862" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1264" font-weight="bold" fill="var(--ok-bright)">Step 3: Fine-tune the entire diffusion model</ns0:text>
  <ns0:text x="588.5057" y="409.0115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="var(--text-dark)">Model learns to associate "sks" with YOUR specific dog</ns0:text>
  <ns0:text x="588.5057" y="434.023" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="var(--text-muted)">Also trains on generic "dog" images (prior preservation)</ns0:text>
  <ns0:text x="588.5057" y="456.092" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7126" fill="var(--text-lighter)">Prevents forgetting what dogs look like in general</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.5057" y="36.7816" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.5402" font-weight="bold" fill="var(--text)">DreamBooth: How It Works</text>
  <text x="588.5057" y="80.9195" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1264" font-weight="bold" fill="var(--primary-accent)">Step 1: Provide 3-5 images of your subject</text>
  <rect x="250.1149" y="95.6322" width="102.9885" height="73.5632" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="301.6092" y="139.7701" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.4253" fill="var(--primary-accent)">img</text>
  <rect x="382.5287" y="95.6322" width="102.9885" height="73.5632" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="434.023" y="139.7701" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.4253" fill="var(--primary-accent)">img</text>
  <rect x="514.9425" y="95.6322" width="102.9885" height="73.5632" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="566.4368" y="139.7701" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.4253" fill="var(--primary-accent)">img</text>
  <rect x="647.3563" y="95.6322" width="102.9885" height="73.5632" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="698.8506" y="139.7701" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.4253" fill="var(--primary-accent)">img</text>
  <rect x="779.7701" y="95.6322" width="102.9885" height="73.5632" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="831.2644" y="139.7701" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.4253" fill="var(--primary-accent)">img</text>
  <text x="588.5057" y="191.2644" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="var(--text-muted)">Your dog in different poses/lighting</text>
  <line x1="588.5057" y1="205.977" x2="588.5057" y2="235.4023" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="264.8276" y="235.4023" width="647.3563" height="73.5632" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="588.5057" y="269.2414" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1264" font-weight="bold" fill="var(--danger-accent)">Step 2: Choose unique identifier: "sks dog"</text>
  <text x="588.5057" y="294.2529" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="var(--text-muted)">(rare token + class word)</text>
  <line x1="588.5057" y1="308.9655" x2="588.5057" y2="345.7471" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="147.1264" y="345.7471" width="882.7586" height="117.7011" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="588.5057" y="379.5862" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1264" font-weight="bold" fill="var(--ok-accent)">Step 3: Fine-tune the entire diffusion model</text>
  <text x="588.5057" y="409.0115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="var(--text)">Model learns to associate "sks" with YOUR specific dog</text>
  <text x="588.5057" y="434.023" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="var(--text-muted)">Also trains on generic "dog" images (prior preservation)</text>
  <text x="588.5057" y="456.092" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7126" fill="var(--text-muted)">Prevents forgetting what dogs look like in general</text>
  <line x1="588.5057" y1="463.4483" x2="588.5057" y2="500.2299" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="147.1264" y="500.2299" width="882.7586" height="139.7701" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="588.5057" y="534.069" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1264" font-weight="bold" fill="var(--primary-accent)">Step 4: Generate with any prompt containing "sks dog"</text>
  <rect x="191.2644" y="551.7241" width="323.6782" height="36.7816" rx="6" fill="var(--bg)" stroke="var(--primary-border)" />
  <text x="353.1034" y="576.7356" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="var(--text)">"A sks dog playing in snow"</text>
  <rect x="544.3678" y="551.7241" width="323.6782" height="36.7816" rx="6" fill="var(--bg)" stroke="var(--primary-border)" />
  <text x="706.2069" y="576.7356" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="var(--text)">"A sks dog as an astronaut"</text>
  <rect x="353.1034" y="595.8621" width="470.8046" height="36.7816" rx="6" fill="var(--bg)" stroke="var(--primary-border)" />
  <text x="588.5057" y="620.8736" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1839" fill="var(--text)">"Oil painting of sks dog by Monet"</text>
</svg>
  <ns0:text x="588.5057" y="534.069" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1264" font-weight="bold" fill="var(--primary-bright)">Step 4: Generate with any prompt containing "sks dog"</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="624.3902" y="46.8293" text-anchor="middle" font-size="24.9756" font-weight="bold" fill="var(--text)">Prompt Engineering Anti-Patterns</text>
  <rect x="62.439" y="85.8537" width="530.7317" height="249.7561" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="327.8049" y="124.878" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--danger-accent)">1. The Kitchen Sink</text>
  <text x="93.6585" y="163.9024" font-size="15.6098" fill="var(--text-muted)">"Tell me everything about ML including</text>
  <text x="93.6585" y="187.3171" font-size="15.6098" fill="var(--text-muted)">history, types, algorithms, applications..."</text>
  <rect x="93.6585" y="210.7317" width="468.2927" height="39.0244" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="327.8049" y="238.8293" text-anchor="middle" font-size="15.6098" fill="var(--danger-accent)">Unfocused, shallow coverage</text>
  <rect x="93.6585" y="265.3659" width="468.2927" height="46.8293" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="327.8049" y="296.5854" text-anchor="middle" font-size="15.6098" fill="var(--ok-accent)">FIX: One focused request at a time</text>
  <rect x="655.6098" y="85.8537" width="530.7317" height="249.7561" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="920.9756" y="124.878" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--danger-accent)">2. Ambiguous Scope</text>
  <text x="686.8293" y="163.9024" font-size="15.6098" fill="var(--text-muted)">"Make this better"</text>
  <text x="686.8293" y="187.3171" font-size="15.6098" fill="var(--text-muted)">Better how? Style? Accuracy? Brevity?</text>
  <rect x="686.8293" y="210.7317" width="468.2927" height="39.0244" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="920.9756" y="238.8293" text-anchor="middle" font-size="15.6098" fill="var(--danger-accent)">Model can't determine intent</text>
  <rect x="686.8293" y="265.3659" width="468.2927" height="46.8293" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="920.9756" y="296.5854" text-anchor="middle" font-size="15.6098" fill="var(--ok-accent)">FIX: Be specific about improvements</text>
  <rect x="62.439" y="374.6341" width="530.7317" height="265.3659" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="327.8049" y="413.6585" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--danger-accent)">3. Contradictory Instructions</text>
  <text x="93.6585" y="452.6829" font-size="15.6098" fill="var(--text-muted)">"Be concise and thorough. Write briefly</text>
  <text x="93.6585" y="476.0976" font-size="15.6098" fill="var(--text-muted)">but cover everything in detail."</text>
  <rect x="93.6585" y="496.3902" width="468.2927" height="39.0244" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="327.8049" y="524.4878" text-anchor="middle" font-size="15.6098" fill="var(--danger-accent)">Model can't satisfy both</text>
  <rect x="93.6585" y="554.1463" width="468.2927" height="46.8293" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="327.8049" y="585.3659" text-anchor="middle" font-size="15.6098" fill="var(--ok-accent)">FIX: Choose one priority, be specific</text>
  <rect x="655.6098" y="374.6341" width="530.7317" height="265.3659" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="920.9756" y="413.6585" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--danger-accent)">4. Assuming Context</text>
  <text x="686.8293" y="452.6829" font-size="15.6098" fill="var(--text-muted)">"Fix the bug from earlier"</text>
  <text x="686.8293" y="476.0976" font-size="15.6098" fill="var(--text-muted)">Each API call is stateless</text>
  <rect x="686.8293" y="496.3902" width="468.2927" height="39.0244" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="920.9756" y="524.4878" text-anchor="middle" font-size="15.6098" fill="var(--danger-accent)">No context from previous calls</text>
  <rect x="686.8293" y="554.1463" width="468.2927" height="46.8293" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="920.9756" y="585.3659" text-anchor="middle" font-size="15.6098" fill="var(--ok-accent)">FIX: Provide full context needed</text>
</svg>
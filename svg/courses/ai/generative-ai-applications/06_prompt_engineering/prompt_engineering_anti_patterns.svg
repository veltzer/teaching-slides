<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="624.3902" y="46.8293" text-anchor="middle" font-size="24.9756" font-weight="bold" fill="#333">Prompt Engineering Anti-Patterns</ns0:text>
  <ns0:rect x="62.439" y="85.8537" width="530.7317" height="249.7561" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="3.122" />
  <ns0:text x="327.8049" y="124.878" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="#dc3545">1. The Kitchen Sink</ns0:text>
  <ns0:text x="93.6585" y="163.9024" font-size="15.6098" fill="#555">"Tell me everything about ML including</ns0:text>
  <ns0:text x="93.6585" y="187.3171" font-size="15.6098" fill="#555">history, types, algorithms, applications..."</ns0:text>
  <ns0:rect x="93.6585" y="210.7317" width="468.2927" height="39.0244" rx="4.6829" fill="#f8d7da" stroke="#dc3545" />
  <ns0:text x="327.8049" y="238.8293" text-anchor="middle" font-size="15.6098" fill="#dc3545">Unfocused, shallow coverage</ns0:text>
  <ns0:rect x="93.6585" y="265.3659" width="468.2927" height="46.8293" rx="4.6829" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="327.8049" y="296.5854" text-anchor="middle" font-size="15.6098" fill="#28a745">FIX: One focused request at a time</ns0:text>
  <ns0:rect x="655.6098" y="85.8537" width="530.7317" height="249.7561" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="3.122" />
  <ns0:text x="920.9756" y="124.878" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="#dc3545">2. Ambiguous Scope</ns0:text>
  <ns0:text x="686.8293" y="163.9024" font-size="15.6098" fill="#555">"Make this better"</ns0:text>
  <ns0:text x="686.8293" y="187.3171" font-size="15.6098" fill="#555">Better how? Style? Accuracy? Brevity?</ns0:text>
  <ns0:rect x="686.8293" y="210.7317" width="468.2927" height="39.0244" rx="4.6829" fill="#f8d7da" stroke="#dc3545" />
  <ns0:text x="920.9756" y="238.8293" text-anchor="middle" font-size="15.6098" fill="#dc3545">Model can't determine intent</ns0:text>
  <ns0:rect x="686.8293" y="265.3659" width="468.2927" height="46.8293" rx="4.6829" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="920.9756" y="296.5854" text-anchor="middle" font-size="15.6098" fill="#28a745">FIX: Be specific about improvements</ns0:text>
  <ns0:rect x="62.439" y="374.6341" width="530.7317" height="265.3659" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="3.122" />
  <ns0:text x="327.8049" y="413.6585" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="#dc3545">3. Contradictory Instructions</ns0:text>
  <ns0:text x="93.6585" y="452.6829" font-size="15.6098" fill="#555">"Be concise and thorough. Write briefly</ns0:text>
  <ns0:text x="93.6585" y="476.0976" font-size="15.6098" fill="#555">but cover everything in detail."</ns0:text>
  <ns0:rect x="93.6585" y="496.3902" width="468.2927" height="39.0244" rx="4.6829" fill="#f8d7da" stroke="#dc3545" />
  <ns0:text x="327.8049" y="524.4878" text-anchor="middle" font-size="15.6098" fill="#dc3545">Model can't satisfy both</ns0:text>
  <ns0:rect x="93.6585" y="554.1463" width="468.2927" height="46.8293" rx="4.6829" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="327.8049" y="585.3659" text-anchor="middle" font-size="15.6098" fill="#28a745">FIX: Choose one priority, be specific</ns0:text>
  <ns0:rect x="655.6098" y="374.6341" width="530.7317" height="265.3659" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="3.122" />
  <ns0:text x="920.9756" y="413.6585" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="#dc3545">4. Assuming Context</ns0:text>
  <ns0:text x="686.8293" y="452.6829" font-size="15.6098" fill="#555">"Fix the bug from earlier"</ns0:text>
  <ns0:text x="686.8293" y="476.0976" font-size="15.6098" fill="#555">Each API call is stateless</ns0:text>
  <ns0:rect x="686.8293" y="496.3902" width="468.2927" height="39.0244" rx="4.6829" fill="#f8d7da" stroke="#dc3545" />
  <ns0:text x="920.9756" y="524.4878" text-anchor="middle" font-size="15.6098" fill="#dc3545">No context from previous calls</ns0:text>
  <ns0:rect x="686.8293" y="554.1463" width="468.2927" height="46.8293" rx="4.6829" fill="#d4edda" stroke="#28a745" />
  <ns0:text x="920.9756" y="585.3659" text-anchor="middle" font-size="15.6098" fill="#28a745">FIX: Provide full context needed</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="48" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Prompt Engineering Anti-Patterns</text>
  <rect x="64" y="88" width="544" height="256" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="336" y="128" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#dc3545">1. The Kitchen Sink</text>
  <text x="96" y="168" font-size="16" fill="#555">"Tell me everything about ML including</text>
  <text x="96" y="192" font-size="16" fill="#555">history, types, algorithms, applications..."</text>
  <rect x="96" y="216" width="480" height="40" rx="4.8" fill="#f8d7da" stroke="#dc3545" />
  <text x="336" y="244.8" text-anchor="middle" font-size="16" fill="#dc3545">Unfocused, shallow coverage</text>
  <rect x="96" y="272" width="480" height="48" rx="4.8" fill="#d4edda" stroke="#28a745" />
  <text x="336" y="304" text-anchor="middle" font-size="16" fill="#28a745">FIX: One focused request at a time</text>
  <rect x="672" y="88" width="544" height="256" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="944" y="128" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#dc3545">2. Ambiguous Scope</text>
  <text x="704" y="168" font-size="16" fill="#555">"Make this better"</text>
  <text x="704" y="192" font-size="16" fill="#555">Better how? Style? Accuracy? Brevity?</text>
  <rect x="704" y="216" width="480" height="40" rx="4.8" fill="#f8d7da" stroke="#dc3545" />
  <text x="944" y="244.8" text-anchor="middle" font-size="16" fill="#dc3545">Model can't determine intent</text>
  <rect x="704" y="272" width="480" height="48" rx="4.8" fill="#d4edda" stroke="#28a745" />
  <text x="944" y="304" text-anchor="middle" font-size="16" fill="#28a745">FIX: Be specific about improvements</text>
  <rect x="64" y="384" width="544" height="272" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="336" y="424" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#dc3545">3. Contradictory Instructions</text>
  <text x="96" y="464" font-size="16" fill="#555">"Be concise and thorough. Write briefly</text>
  <text x="96" y="488" font-size="16" fill="#555">but cover everything in detail."</text>
  <rect x="96" y="508.8" width="480" height="40" rx="4.8" fill="#f8d7da" stroke="#dc3545" />
  <text x="336" y="537.6" text-anchor="middle" font-size="16" fill="#dc3545">Model can't satisfy both</text>
  <rect x="96" y="568" width="480" height="48" rx="4.8" fill="#d4edda" stroke="#28a745" />
  <text x="336" y="600" text-anchor="middle" font-size="16" fill="#28a745">FIX: Choose one priority, be specific</text>
  <rect x="672" y="384" width="544" height="272" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="944" y="424" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#dc3545">4. Assuming Context</text>
  <text x="704" y="464" font-size="16" fill="#555">"Fix the bug from earlier"</text>
  <text x="704" y="488" font-size="16" fill="#555">Each API call is stateless</text>
  <rect x="704" y="508.8" width="480" height="40" rx="4.8" fill="#f8d7da" stroke="#dc3545" />
  <text x="944" y="537.6" text-anchor="middle" font-size="16" fill="#dc3545">No context from previous calls</text>
  <rect x="704" y="568" width="480" height="48" rx="4.8" fill="#d4edda" stroke="#28a745" />
  <text x="944" y="600" text-anchor="middle" font-size="16" fill="#28a745">FIX: Provide full context needed</text>
</svg>
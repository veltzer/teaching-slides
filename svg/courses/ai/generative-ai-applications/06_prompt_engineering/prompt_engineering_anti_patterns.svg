<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Prompt Engineering Anti-Patterns</text>
  <!-- Anti-pattern 1 -->
  <rect x="40" y="55" width="340" height="160" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="210" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">1. The Kitchen Sink</text>
  <text x="60" y="105" font-size="10" fill="#555">"Tell me everything about ML including</text>
  <text x="60" y="120" font-size="10" fill="#555">history, types, algorithms, applications..."</text>
  <rect x="60" y="135" width="300" height="25" rx="3" fill="#f8d7da" stroke="#dc3545"/>
  <text x="210" y="153" text-anchor="middle" font-size="10" fill="#dc3545">Unfocused, shallow coverage</text>
  <rect x="60" y="170" width="300" height="30" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="210" y="190" text-anchor="middle" font-size="10" fill="#28a745">FIX: One focused request at a time</text>
  <!-- Anti-pattern 2 -->
  <rect x="420" y="55" width="340" height="160" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="590" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">2. Ambiguous Scope</text>
  <text x="440" y="105" font-size="10" fill="#555">"Make this better"</text>
  <text x="440" y="120" font-size="10" fill="#555">Better how? Style? Accuracy? Brevity?</text>
  <rect x="440" y="135" width="300" height="25" rx="3" fill="#f8d7da" stroke="#dc3545"/>
  <text x="590" y="153" text-anchor="middle" font-size="10" fill="#dc3545">Model can't determine intent</text>
  <rect x="440" y="170" width="300" height="30" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="590" y="190" text-anchor="middle" font-size="10" fill="#28a745">FIX: Be specific about improvements</text>
  <!-- Anti-pattern 3 -->
  <rect x="40" y="240" width="340" height="170" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="210" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">3. Contradictory Instructions</text>
  <text x="60" y="290" font-size="10" fill="#555">"Be concise and thorough. Write briefly</text>
  <text x="60" y="305" font-size="10" fill="#555">but cover everything in detail."</text>
  <rect x="60" y="318" width="300" height="25" rx="3" fill="#f8d7da" stroke="#dc3545"/>
  <text x="210" y="336" text-anchor="middle" font-size="10" fill="#dc3545">Model can't satisfy both</text>
  <rect x="60" y="355" width="300" height="30" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="210" y="375" text-anchor="middle" font-size="10" fill="#28a745">FIX: Choose one priority, be specific</text>
  <!-- Anti-pattern 4 -->
  <rect x="420" y="240" width="340" height="170" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="590" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">4. Assuming Context</text>
  <text x="440" y="290" font-size="10" fill="#555">"Fix the bug from earlier"</text>
  <text x="440" y="305" font-size="10" fill="#555">Each API call is stateless</text>
  <rect x="440" y="318" width="300" height="25" rx="3" fill="#f8d7da" stroke="#dc3545"/>
  <text x="590" y="336" text-anchor="middle" font-size="10" fill="#dc3545">No context from previous calls</text>
  <rect x="440" y="355" width="300" height="30" rx="3" fill="#d4edda" stroke="#28a745"/>
  <text x="590" y="375" text-anchor="middle" font-size="10" fill="#28a745">FIX: Provide full context needed</text>
</svg>
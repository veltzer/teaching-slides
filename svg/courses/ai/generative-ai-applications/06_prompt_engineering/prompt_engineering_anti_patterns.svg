<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="25.5192" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Prompt Engineering Anti-Patterns</text>
  <rect x="40" y="78.1579" width="566.6666" height="244.2105" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3334" y="116.3157" text-anchor="middle" font-size="20.7343" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">1. The Kitchen Sink</text>
  <text x="73.3333" y="154.4736" font-size="15.9495" fill="var(--text-muted)" font-family="Arial, sans-serif">"Tell me everything about ML including</text>
  <text x="73.3333" y="177.3684" font-size="15.9495" fill="var(--text-muted)" font-family="Arial, sans-serif">history, types, algorithms, applications..."</text>
  <rect x="73.3333" y="200.2631" width="500" height="38.1579" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3334" y="227.7369" text-anchor="middle" font-size="15.9495" fill="var(--danger-accent)" font-family="Arial, sans-serif">Unfocused, shallow coverage</text>
  <rect x="73.3333" y="253.6842" width="500" height="45.7895" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3334" y="284.2105" text-anchor="middle" font-size="15.9495" fill="var(--ok-accent)" font-family="Arial, sans-serif">FIX: One focused request at a time</text>
  <rect x="673.3334" y="78.1579" width="566.6666" height="244.2105" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="116.3157" text-anchor="middle" font-size="20.7343" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2. Ambiguous Scope</text>
  <text x="706.6667" y="154.4736" font-size="15.9495" fill="var(--text-muted)" font-family="Arial, sans-serif">"Make this better"</text>
  <text x="706.6667" y="177.3684" font-size="15.9495" fill="var(--text-muted)" font-family="Arial, sans-serif">Better how? Style? Accuracy? Brevity?</text>
  <rect x="706.6667" y="200.2631" width="500" height="38.1579" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="227.7369" text-anchor="middle" font-size="15.9495" fill="var(--danger-accent)" font-family="Arial, sans-serif">Model can't determine intent</text>
  <rect x="706.6667" y="253.6842" width="500" height="45.7895" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="284.2105" text-anchor="middle" font-size="15.9495" fill="var(--ok-accent)" font-family="Arial, sans-serif">FIX: Be specific about improvements</text>
  <rect x="40" y="360.5263" width="566.6666" height="259.4737" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3334" y="398.6842" text-anchor="middle" font-size="20.7343" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. Contradictory Instructions</text>
  <text x="73.3333" y="436.8421" font-size="15.9495" fill="var(--text-muted)" font-family="Arial, sans-serif">"Be concise and thorough. Write briefly</text>
  <text x="73.3333" y="459.7369" font-size="15.9495" fill="var(--text-muted)" font-family="Arial, sans-serif">but cover everything in detail."</text>
  <rect x="73.3333" y="479.5789" width="500" height="38.1579" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3334" y="507.0526" text-anchor="middle" font-size="15.9495" fill="var(--danger-accent)" font-family="Arial, sans-serif">Model can't satisfy both</text>
  <rect x="73.3333" y="536.0526" width="500" height="45.7895" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3334" y="566.579" text-anchor="middle" font-size="15.9495" fill="var(--ok-accent)" font-family="Arial, sans-serif">FIX: Choose one priority, be specific</text>
  <rect x="673.3334" y="360.5263" width="566.6666" height="259.4737" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="398.6842" text-anchor="middle" font-size="20.7343" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">4. Assuming Context</text>
  <text x="706.6667" y="436.8421" font-size="15.9495" fill="var(--text-muted)" font-family="Arial, sans-serif">"Fix the bug from earlier"</text>
  <text x="706.6667" y="459.7369" font-size="15.9495" fill="var(--text-muted)" font-family="Arial, sans-serif">Each API call is stateless</text>
  <rect x="706.6667" y="479.5789" width="500" height="38.1579" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="507.0526" text-anchor="middle" font-size="15.9495" fill="var(--danger-accent)" font-family="Arial, sans-serif">No context from previous calls</text>
  <rect x="706.6667" y="536.0526" width="500" height="45.7895" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="566.579" text-anchor="middle" font-size="15.9495" fill="var(--ok-accent)" font-family="Arial, sans-serif">FIX: Provide full context needed</text>
</svg>

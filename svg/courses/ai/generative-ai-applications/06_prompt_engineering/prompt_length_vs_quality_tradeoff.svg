<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="40" y1="40" x2="40" y2="432.615666934973" stroke="var(--text)" stroke-width="0.8757"/>
  <line x1="40" y1="432.615666934973" x2="1071.2497" y2="432.615666934973" stroke="var(--text)" stroke-width="0.8757"/>
  <text x="40" y="276.9016" text-anchor="middle" font-size="21.3378" fill="var(--text)" transform="rotate(-90, 50, 175)" font-family="Arial, sans-serif">Quality</text>
  <text x="555.6251" y="486.154047810695" text-anchor="middle" font-size="23.155601079208" fill="var(--text)" font-family="Arial, sans-serif">Prompt Length (tokens)</text>
  <text x="133.7501" y="468.307811621328" text-anchor="middle" font-size="20.156689664637" fill="var(--text-muted)" font-family="Arial, sans-serif">0</text>
  <text x="321.2499" y="468.307811621328" text-anchor="middle" font-size="20.156689664637" fill="var(--text-muted)" font-family="Arial, sans-serif">100</text>
  <text x="508.7499" y="468.307811621328" text-anchor="middle" font-size="20.156689664637" fill="var(--text-muted)" font-family="Arial, sans-serif">200</text>
  <text x="696.2499" y="468.307811621328" text-anchor="middle" font-size="20.156689664637" fill="var(--text-muted)" font-family="Arial, sans-serif">300</text>
  <text x="883.75" y="468.307811621328" text-anchor="middle" font-size="20.156689664637" fill="var(--text-muted)" font-family="Arial, sans-serif">400</text>
  <text x="1033.7498" y="468.307811621328" text-anchor="middle" font-size="20.156689664637" fill="var(--text-muted)" font-family="Arial, sans-serif">500</text>
  <path d="M 77.4999 396.923303787032 Q 227.4999 254.153741964474 414.9998 111.384507834296 Q 508.7499 75.692363147941 564.9997 84.615426627228 Q 658.7501 102.461444355009 752.4998 147.076870982237 Q 846.2499 200.615470319545 939.9999 254.153741964474 Q 1014.9999 298.769059360909 1052.4998 343.384485988137" fill="none" stroke="var(--primary-border)" stroke-width="1.3136"/>
  <rect x="481.478" y="75.30754306424" width="17.043" height="18.616204049148" rx="8.906121007622" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <line x1="489.9998" y1="97.107606267437" x2="489.9998" y2="432.615666934973" stroke="var(--ok-border)" stroke-width="0.4379" stroke-dasharray="2.1894 1.3136"/>
  <text x="564.9997" y="61.415352350289" font-size="20.156689664637" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Optimal prompt length</text>
  <rect x="40" y="521.84619249705" width="375" height="98.15380750295" rx="6.270812186321" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.4999" y="557.538774106577" text-anchor="middle" font-size="20.156689664637" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Too Short</text>
  <text x="227.4999" y="593.231137254518" text-anchor="middle" font-size="20.156689664637" fill="var(--text-muted)" font-family="Arial, sans-serif">Lacks context, guesses intent</text>
  <rect x="452.4999" y="521.84619249705" width="375" height="98.15380750295" rx="6.270812186321" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="557.538774106577" text-anchor="middle" font-size="20.156689664637" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Optimal</text>
  <text x="639.9999" y="593.231137254518" text-anchor="middle" font-size="20.156689664637" fill="var(--text-muted)" font-family="Arial, sans-serif">Clear instructions + context</text>
  <rect x="865" y="521.84619249705" width="375" height="98.15380750295" rx="6.270812186321" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.4998" y="557.538774106577" text-anchor="middle" font-size="20.156689664637" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Too Long</text>
  <text x="1052.4998" y="593.231137254518" text-anchor="middle" font-size="20.156689664637" fill="var(--text-muted)" font-family="Arial, sans-serif">"Lost in the middle" effect</text>
</svg>

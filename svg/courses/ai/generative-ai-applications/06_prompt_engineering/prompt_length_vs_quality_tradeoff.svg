<svg viewBox="0 0 750 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Prompt Length vs Quality Tradeoff</text>
  <!-- Axes -->
  <line x1="100" y1="60" x2="100" y2="280" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="280" x2="650" y2="280" stroke="#333" stroke-width="2"/>
  <text x="50" y="175" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90, 50, 175)">Quality</text>
  <text x="375" y="310" text-anchor="middle" font-size="13" fill="#333">Prompt Length (tokens)</text>
  <!-- X labels -->
  <text x="150" y="300" text-anchor="middle" font-size="10" fill="#666">0</text>
  <text x="250" y="300" text-anchor="middle" font-size="10" fill="#666">100</text>
  <text x="350" y="300" text-anchor="middle" font-size="10" fill="#666">200</text>
  <text x="450" y="300" text-anchor="middle" font-size="10" fill="#666">300</text>
  <text x="550" y="300" text-anchor="middle" font-size="10" fill="#666">400</text>
  <text x="630" y="300" text-anchor="middle" font-size="10" fill="#666">500</text>
  <!-- Curve -->
  <path d="M120,260 Q200,180 300,100 Q350,80 380,85 Q430,95 480,120 Q530,150 580,180 Q620,205 640,230" fill="none" stroke="#4a90e2" stroke-width="3"/>
  <!-- Optimal marker -->
  <circle cx="340" cy="85" r="5" fill="#28a745"/>
  <line x1="340" y1="92" x2="340" y2="280" stroke="#28a745" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="380" y="72" font-size="11" font-weight="bold" fill="#28a745">Optimal prompt length</text>
  <!-- Labels for zones -->
  <rect x="100" y="330" width="200" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="200" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">Too Short</text>
  <text x="200" y="370" text-anchor="middle" font-size="10" fill="#555">Lacks context, guesses intent</text>
  <rect x="320" y="330" width="200" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="420" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Optimal</text>
  <text x="420" y="370" text-anchor="middle" font-size="10" fill="#555">Clear instructions + context</text>
  <rect x="540" y="330" width="200" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="640" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">Too Long</text>
  <text x="640" y="370" text-anchor="middle" font-size="10" fill="#555">"Lost in the middle" effect</text>
</svg>
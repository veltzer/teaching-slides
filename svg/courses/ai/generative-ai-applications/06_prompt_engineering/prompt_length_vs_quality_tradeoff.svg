<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="405.8268" y="52.9375" text-anchor="middle" font-size="14.1388" font-weight="bold" fill="var(--text)">Prompt Length vs Quality Tradeoff</text>
  <line x1="162.8168" y1="80.8975" x2="162.8168" y2="285.9372" stroke="var(--text)" stroke-width="1.3234" />
  <line x1="162.8168" y1="285.9372" x2="648.8367" y2="285.9372" stroke="var(--text)" stroke-width="1.3234" />
  <text x="118.6331" y="188.0773" text-anchor="middle" font-size="11.4878" fill="var(--text)" transform="rotate(-90, 50, 175)">Quality</text>
  <text x="405.8268" y="313.8972" text-anchor="middle" font-size="11.4878" fill="var(--text)">Prompt Length (tokens)</text>
  <text x="207.0004" y="304.5771" text-anchor="middle" font-size="10" fill="var(--text-muted)">0</text>
  <text x="295.3676" y="304.5771" text-anchor="middle" font-size="10" fill="var(--text-muted)">100</text>
  <text x="383.7349" y="304.5771" text-anchor="middle" font-size="10" fill="var(--text-muted)">200</text>
  <text x="472.1022" y="304.5771" text-anchor="middle" font-size="10" fill="var(--text-muted)">300</text>
  <text x="560.4695" y="304.5771" text-anchor="middle" font-size="10" fill="var(--text-muted)">400</text>
  <text x="631.1633" y="304.5771" text-anchor="middle" font-size="10" fill="var(--text-muted)">500</text>
  <path d="M 180.4902 267.2972 Q 251.184 192.7373 339.5513 118.1774 Q 383.7349 99.5375 410.2451 104.1975 Q 454.4288 113.5174 498.6124 136.8174 Q 542.796 164.7774 586.9797 192.7373 Q 622.3266 216.0372 640 239.3372" fill="none" stroke="var(--primary-border)" stroke-width="1.9852" />
  <circle cx="374.8982" cy="104.1975" r="4.4184" fill="var(--ok-fill)" />
  <line x1="374.8982" y1="110.7214" x2="374.8982" y2="285.9372" stroke="var(--ok-border)" stroke-width="0.6617" stroke-dasharray="3.3086 1.9852" />
  <text x="410.2451" y="92.0815" font-size="10" font-weight="bold" fill="var(--ok-accent)">Optimal prompt length</text>
  <rect x="162.8168" y="332.5371" width="176.7346" height="51.2599" rx="5.302" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.3234" />
  <text x="251.184" y="351.1771" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Too Short</text>
  <text x="251.184" y="369.8171" text-anchor="middle" font-size="10" fill="var(--text-muted)">Lacks context, guesses intent</text>
  <rect x="357.2247" y="332.5371" width="176.7346" height="51.2599" rx="5.302" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.3234" />
  <text x="445.592" y="351.1771" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Optimal</text>
  <text x="445.592" y="369.8171" text-anchor="middle" font-size="10" fill="var(--text-muted)">Clear instructions + context</text>
  <rect x="551.6328" y="332.5371" width="176.7346" height="51.2599" rx="5.302" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.3234" />
  <text x="640" y="351.1771" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Too Long</text>
  <text x="640" y="369.8171" text-anchor="middle" font-size="10" fill="var(--text-muted)">"Lost in the middle" effect</text>
</svg>
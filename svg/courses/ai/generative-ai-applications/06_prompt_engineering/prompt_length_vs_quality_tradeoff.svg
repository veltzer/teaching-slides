<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="613.2916" y="80" text-anchor="middle" font-size="21.3667" font-weight="bold" fill="var(--text)">Prompt Length vs Quality Tradeoff</text>
  <line x1="246.0512" y1="122.2535" x2="246.0512" y2="432.1127" stroke="var(--text)" stroke-width="2" />
  <line x1="246.0512" y1="432.1127" x2="980.532" y2="432.1127" stroke="var(--text)" stroke-width="2" />
  <text x="179.2802" y="284.2253" text-anchor="middle" font-size="17.3605" fill="var(--text)" transform="rotate(-90, 50, 175)">Quality</text>
  <text x="613.2916" y="474.3662" text-anchor="middle" font-size="17.3605" fill="var(--text)">Prompt Length (tokens)</text>
  <text x="312.8222" y="460.2816" text-anchor="middle" font-size="13.3542" fill="var(--text-muted)">0</text>
  <text x="446.3641" y="460.2816" text-anchor="middle" font-size="13.3542" fill="var(--text-muted)">100</text>
  <text x="579.9061" y="460.2816" text-anchor="middle" font-size="13.3542" fill="var(--text-muted)">200</text>
  <text x="713.4481" y="460.2816" text-anchor="middle" font-size="13.3542" fill="var(--text-muted)">300</text>
  <text x="846.9901" y="460.2816" text-anchor="middle" font-size="13.3542" fill="var(--text-muted)">400</text>
  <text x="953.8237" y="460.2816" text-anchor="middle" font-size="13.3542" fill="var(--text-muted)">500</text>
  <path d="M 272.7596 403.9436 Q 379.5931 291.2676 513.1351 178.5915 Q 579.9061 150.4226 619.9687 157.4648 Q 686.7397 171.5493 753.5107 206.7606 Q 820.2817 249.0141 887.0527 291.2676 Q 940.4695 326.4788 967.1778 361.6901" fill="none" stroke="var(--primary-border)" stroke-width="3" />
  <circle cx="566.5519" cy="157.4648" r="6.6771" fill="var(--ok-fill)" />
  <line x1="566.5519" y1="167.3239" x2="566.5519" y2="432.1127" stroke="var(--ok-border)" stroke-width="1" stroke-dasharray="5 3" />
  <text x="619.9687" y="139.155" font-size="14.6896" font-weight="bold" fill="var(--ok-accent)">Optimal prompt length</text>
  <rect x="246.0512" y="502.5352" width="267.084" height="77.4648" rx="8.0125" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="379.5931" y="530.7042" text-anchor="middle" font-size="14.6896" font-weight="bold" fill="var(--danger-accent)">Too Short</text>
  <text x="379.5931" y="558.8733" text-anchor="middle" font-size="13.3542" fill="var(--text-muted)">Lacks context, guesses intent</text>
  <rect x="539.8435" y="502.5352" width="267.084" height="77.4648" rx="8.0125" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="673.3855" y="530.7042" text-anchor="middle" font-size="14.6896" font-weight="bold" fill="var(--ok-accent)">Optimal</text>
  <text x="673.3855" y="558.8733" text-anchor="middle" font-size="13.3542" fill="var(--text-muted)">Clear instructions + context</text>
  <rect x="833.6359" y="502.5352" width="267.084" height="77.4648" rx="8.0125" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="967.1778" y="530.7042" text-anchor="middle" font-size="14.6896" font-weight="bold" fill="var(--danger-accent)">Too Long</text>
  <text x="967.1778" y="558.8733" text-anchor="middle" font-size="13.3542" fill="var(--text-muted)">"Lost in the middle" effect</text>
</svg>
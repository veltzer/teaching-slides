<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="375" y="31.6406" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Prompt Length vs Quality Tradeoff</ns0:text>
  <ns0:line x1="100" y1="63.2812" x2="100" y2="295.3125" stroke="#333" stroke-width="2" />
  <ns0:line x1="100" y1="295.3125" x2="650" y2="295.3125" stroke="#333" stroke-width="2" />
  <ns0:text x="50" y="184.5703" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90, 50, 175)">Quality</ns0:text>
  <ns0:text x="375" y="326.9531" text-anchor="middle" font-size="13" fill="#333">Prompt Length (tokens)</ns0:text>
  <ns0:text x="150" y="316.4062" text-anchor="middle" font-size="10" fill="#666">0</ns0:text>
  <ns0:text x="250" y="316.4062" text-anchor="middle" font-size="10" fill="#666">100</ns0:text>
  <ns0:text x="350" y="316.4062" text-anchor="middle" font-size="10" fill="#666">200</ns0:text>
  <ns0:text x="450" y="316.4062" text-anchor="middle" font-size="10" fill="#666">300</ns0:text>
  <ns0:text x="550" y="316.4062" text-anchor="middle" font-size="10" fill="#666">400</ns0:text>
  <ns0:text x="630" y="316.4062" text-anchor="middle" font-size="10" fill="#666">500</ns0:text>
  <ns0:path d="M 120 274.2187 Q 200 189.8437 300 105.4687 Q 350 84.375 380 89.6484 Q 430 100.1953 480 126.5625 Q 530 158.2031 580 189.8437 Q 620 216.2109 640 242.5781" fill="none" stroke="#4a90e2" stroke-width="3" />
  <ns0:circle cx="340" cy="89.6484" r="5" fill="#28a745" />
  <ns0:line x1="340" y1="97.0312" x2="340" y2="295.3125" stroke="#28a745" stroke-width="1" stroke-dasharray="5 3" />
  <ns0:text x="380" y="75.9375" font-size="11" font-weight="bold" fill="#28a745">Optimal prompt length</ns0:text>
  <ns0:rect x="100" y="348.0469" width="200" height="58.0078" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5" />
  <ns0:text x="200" y="369.1406" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">Too Short</ns0:text>
  <ns0:text x="200" y="390.2344" text-anchor="middle" font-size="10" fill="#555">Lacks context, guesses intent</ns0:text>
  <ns0:rect x="320" y="348.0469" width="200" height="58.0078" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5" />
  <ns0:text x="420" y="369.1406" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Optimal</ns0:text>
  <ns0:text x="420" y="390.2344" text-anchor="middle" font-size="10" fill="#555">Clear instructions + context</ns0:text>
  <ns0:rect x="540" y="348.0469" width="200" height="58.0078" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5" />
  <ns0:text x="640" y="369.1406" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">Too Long</ns0:text>
  <ns0:text x="640" y="390.2344" text-anchor="middle" font-size="10" fill="#555">"Lost in the middle" effect</ns0:text>
</ns0:svg>
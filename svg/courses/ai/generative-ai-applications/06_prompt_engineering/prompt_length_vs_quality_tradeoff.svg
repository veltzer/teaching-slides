<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="375" y="31.6406" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">Prompt Length vs Quality Tradeoff</text>
  <line x1="100" y1="63.2812" x2="100" y2="295.3125" stroke="var(--text)" stroke-width="2" />
  <line x1="100" y1="295.3125" x2="650" y2="295.3125" stroke="var(--text)" stroke-width="2" />
  <text x="50" y="184.5703" text-anchor="middle" font-size="13" fill="var(--text)" transform="rotate(-90, 50, 175)">Quality</text>
  <text x="375" y="326.9531" text-anchor="middle" font-size="13" fill="var(--text)">Prompt Length (tokens)</text>
  <text x="150" y="316.4062" text-anchor="middle" font-size="10" fill="var(--text-muted)">0</text>
  <text x="250" y="316.4062" text-anchor="middle" font-size="10" fill="var(--text-muted)">100</text>
  <text x="350" y="316.4062" text-anchor="middle" font-size="10" fill="var(--text-muted)">200</text>
  <text x="450" y="316.4062" text-anchor="middle" font-size="10" fill="var(--text-muted)">300</text>
  <text x="550" y="316.4062" text-anchor="middle" font-size="10" fill="var(--text-muted)">400</text>
  <text x="630" y="316.4062" text-anchor="middle" font-size="10" fill="var(--text-muted)">500</text>
  <path d="M 120 274.2187 Q 200 189.8437 300 105.4687 Q 350 84.375 380 89.6484 Q 430 100.1953 480 126.5625 Q 530 158.2031 580 189.8437 Q 620 216.2109 640 242.5781" fill="none" stroke="var(--primary-border)" stroke-width="3" />
  <circle cx="340" cy="89.6484" r="5" fill="var(--ok-fill)" />
  <line x1="340" y1="97.0312" x2="340" y2="295.3125" stroke="var(--ok-border)" stroke-width="1" stroke-dasharray="5 3" />
  <text x="380" y="75.9375" font-size="11" font-weight="bold" fill="var(--ok-accent)">Optimal prompt length</text>
  <rect x="100" y="348.0469" width="200" height="58.0078" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="200" y="369.1406" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--danger-accent)">Too Short</text>
  <text x="200" y="390.2344" text-anchor="middle" font-size="10" fill="var(--text-muted)">Lacks context, guesses intent</text>
  <rect x="320" y="348.0469" width="200" height="58.0078" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="420" y="369.1406" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--ok-accent)">Optimal</text>
  <text x="420" y="390.2344" text-anchor="middle" font-size="10" fill="var(--text-muted)">Clear instructions + context</text>
  <rect x="540" y="348.0469" width="200" height="58.0078" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="369.1406" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--danger-accent)">Too Long</text>
  <text x="640" y="390.2344" text-anchor="middle" font-size="10" fill="var(--text-muted)">"Lost in the middle" effect</text>
</svg>
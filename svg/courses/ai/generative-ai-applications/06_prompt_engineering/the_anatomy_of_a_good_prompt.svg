<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="582.7642" y="46.8293" text-anchor="middle" font-size="24.9756" font-weight="bold" fill="var(--text)">The Anatomy of a Good Prompt</text>
  <rect x="166.504" y="78.0488" width="832.5202" height="561.9512" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="582.7642" y="117.0731" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--primary-accent)">PROMPT STRUCTURE</text>
  <rect x="216.4553" y="140.4878" width="732.6178" height="62.439" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="266.4065" y="179.5122" font-size="18.7317" font-weight="bold" fill="var(--primary-accent)">1. ROLE / PERSONA</text>
  <text x="582.7642" y="179.5122" font-size="15.6098" fill="var(--text-muted)">"You are a senior Python developer..."</text>
  <rect x="216.4553" y="218.5366" width="732.6178" height="62.439" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="266.4065" y="257.5609" font-size="18.7317" font-weight="bold" fill="var(--ok-accent)">2. CONTEXT</text>
  <text x="516.1625" y="257.5609" font-size="15.6098" fill="var(--text-muted)">"We are building a REST API for..."</text>
  <rect x="216.4553" y="296.5854" width="732.6178" height="62.439" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="266.4065" y="335.6097" font-size="18.7317" font-weight="bold" fill="var(--danger-accent)">3. TASK</text>
  <text x="466.2113" y="335.6097" font-size="15.6098" fill="var(--text-muted)">"Write a function that..."</text>
  <rect x="216.4553" y="374.6341" width="732.6178" height="62.439" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="266.4065" y="413.6585" font-size="18.7317" font-weight="bold" fill="var(--primary-accent)">4. CONSTRAINTS</text>
  <text x="566.1138" y="413.6585" font-size="15.6098" fill="var(--text-muted)">"Use only standard library..."</text>
  <rect x="216.4553" y="452.6829" width="732.6178" height="62.439" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="266.4065" y="491.7073" font-size="18.7317" font-weight="bold" fill="var(--ok-accent)">5. OUTPUT FORMAT</text>
  <text x="616.065" y="491.7073" font-size="15.6098" fill="var(--text-muted)">"Return as JSON with keys..."</text>
  <rect x="216.4553" y="530.7316" width="732.6178" height="62.439" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="266.4065" y="569.7561" font-size="18.7317" font-weight="bold" fill="var(--text-muted)">6. EXAMPLES (optional)</text>
  <text x="649.3658" y="569.7561" font-size="15.6098" fill="var(--text-muted)">"Input: X -&gt; Output: Y"</text>
</svg>
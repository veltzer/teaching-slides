<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="582.7642" y="46.8293" text-anchor="middle" font-size="24.9756" font-weight="bold" fill="#333">The Anatomy of a Good Prompt</ns0:text>
  <ns0:rect x="166.504" y="78.0488" width="832.5202" height="561.9512" rx="12.4878" fill="#f0f7ff" stroke="#4a90e2" stroke-width="3.122" />
  <ns0:text x="582.7642" y="117.0731" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#4a90e2">PROMPT STRUCTURE</ns0:text>
  <ns0:rect x="216.4553" y="140.4878" width="732.6178" height="62.439" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.3414" />
  <ns0:text x="266.4065" y="179.5122" font-size="18.7317" font-weight="bold" fill="#4a90e2">1. ROLE / PERSONA</ns0:text>
  <ns0:text x="582.7642" y="179.5122" font-size="15.6098" fill="#555">"You are a senior Python developer..."</ns0:text>
  <ns0:rect x="216.4553" y="218.5366" width="732.6178" height="62.439" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="2.3414" />
  <ns0:text x="266.4065" y="257.5609" font-size="18.7317" font-weight="bold" fill="#28a745">2. CONTEXT</ns0:text>
  <ns0:text x="516.1625" y="257.5609" font-size="15.6098" fill="#555">"We are building a REST API for..."</ns0:text>
  <ns0:rect x="216.4553" y="296.5854" width="732.6178" height="62.439" rx="7.8049" fill="#fff3cd" stroke="#ffc107" stroke-width="2.3414" />
  <ns0:text x="266.4065" y="335.6097" font-size="18.7317" font-weight="bold" fill="#856404">3. TASK</ns0:text>
  <ns0:text x="466.2113" y="335.6097" font-size="15.6098" fill="#555">"Write a function that..."</ns0:text>
  <ns0:rect x="216.4553" y="374.6341" width="732.6178" height="62.439" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.3414" />
  <ns0:text x="266.4065" y="413.6585" font-size="18.7317" font-weight="bold" fill="#4a90e2">4. CONSTRAINTS</ns0:text>
  <ns0:text x="566.1138" y="413.6585" font-size="15.6098" fill="#555">"Use only standard library..."</ns0:text>
  <ns0:rect x="216.4553" y="452.6829" width="732.6178" height="62.439" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="2.3414" />
  <ns0:text x="266.4065" y="491.7073" font-size="18.7317" font-weight="bold" fill="#28a745">5. OUTPUT FORMAT</ns0:text>
  <ns0:text x="616.065" y="491.7073" font-size="15.6098" fill="#555">"Return as JSON with keys..."</ns0:text>
  <ns0:rect x="216.4553" y="530.7316" width="732.6178" height="62.439" rx="7.8049" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2.3414" />
  <ns0:text x="266.4065" y="569.7561" font-size="18.7317" font-weight="bold" fill="#666">6. EXAMPLES (optional)</ns0:text>
  <ns0:text x="649.3658" y="569.7561" font-size="15.6098" fill="#555">"Input: X -&gt; Output: Y"</ns0:text>
</ns0:svg>
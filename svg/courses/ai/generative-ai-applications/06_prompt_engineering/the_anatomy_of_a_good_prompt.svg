<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="51.4286" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#333">The Anatomy of a Good Prompt</text>
  <rect x="182.8571" y="85.7143" width="914.2857" height="617.1429" rx="13.7143" fill="#f0f7ff" stroke="#4a90e2" stroke-width="3.4286" />
  <text x="640" y="128.5714" text-anchor="middle" font-size="24" font-weight="bold" fill="#4a90e2">PROMPT STRUCTURE</text>
  <rect x="237.7143" y="154.2857" width="804.5714" height="68.5714" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5714" />
  <text x="292.5714" y="197.1429" font-size="20.5714" font-weight="bold" fill="#4a90e2">1. ROLE / PERSONA</text>
  <text x="640" y="197.1429" font-size="17.1429" fill="#555">"You are a senior Python developer..."</text>
  <rect x="237.7143" y="240" width="804.5714" height="68.5714" rx="8.5714" fill="#d4edda" stroke="#28a745" stroke-width="2.5714" />
  <text x="292.5714" y="282.8571" font-size="20.5714" font-weight="bold" fill="#28a745">2. CONTEXT</text>
  <text x="566.8571" y="282.8571" font-size="17.1429" fill="#555">"We are building a REST API for..."</text>
  <rect x="237.7143" y="325.7143" width="804.5714" height="68.5714" rx="8.5714" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5714" />
  <text x="292.5714" y="368.5714" font-size="20.5714" font-weight="bold" fill="#856404">3. TASK</text>
  <text x="512" y="368.5714" font-size="17.1429" fill="#555">"Write a function that..."</text>
  <rect x="237.7143" y="411.4286" width="804.5714" height="68.5714" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5714" />
  <text x="292.5714" y="454.2857" font-size="20.5714" font-weight="bold" fill="#4a90e2">4. CONSTRAINTS</text>
  <text x="621.7143" y="454.2857" font-size="17.1429" fill="#555">"Use only standard library..."</text>
  <rect x="237.7143" y="497.1429" width="804.5714" height="68.5714" rx="8.5714" fill="#d4edda" stroke="#28a745" stroke-width="2.5714" />
  <text x="292.5714" y="540" font-size="20.5714" font-weight="bold" fill="#28a745">5. OUTPUT FORMAT</text>
  <text x="676.5714" y="540" font-size="17.1429" fill="#555">"Return as JSON with keys..."</text>
  <rect x="237.7143" y="582.8571" width="804.5714" height="68.5714" rx="8.5714" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2.5714" />
  <text x="292.5714" y="625.7143" font-size="20.5714" font-weight="bold" fill="#666">6. EXAMPLES (optional)</text>
  <text x="713.1429" y="625.7143" font-size="17.1429" fill="#555">"Input: X -&gt; Output: Y"</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.1644139144" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0001" y="80.277676620373" text-anchor="middle" font-size="26.655233986561" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">PROMPT STRUCTURE</text>
  <rect x="112.0001" y="104.44440925926" width="1056" height="64.44440925926" rx="6.1644139144" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.0001" y="144.722191435186" font-size="22.847270031172" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. ROLE / PERSONA</text>
  <text x="640.0001" y="144.722191435186" font-size="19.039511556247" fill="var(--text-muted)" font-family="Arial, sans-serif">"You are a senior Python developer..."</text>
  <rect x="112.0001" y="184.999973611112" width="1056" height="64.44440925926" rx="6.1644139144" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.0001" y="225.277650231485" font-size="22.847270031172" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. CONTEXT</text>
  <text x="544" y="225.277650231485" font-size="19.039511556247" fill="var(--text-muted)" font-family="Arial, sans-serif">"We are building a REST API for..."</text>
  <rect x="112.0001" y="265.555537962964" width="1056" height="64.44440925926" rx="6.1644139144" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.0001" y="305.833320138889" font-size="22.847270031172" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. TASK</text>
  <text x="472" y="305.833320138889" font-size="19.039511556247" fill="var(--text-muted)" font-family="Arial, sans-serif">"Write a function that..."</text>
  <rect x="112.0001" y="346.111102314815" width="1056" height="64.44440925926" rx="6.1644139144" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.0001" y="386.388884490741" font-size="22.847270031172" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">4. CONSTRAINTS</text>
  <text x="616.0001" y="386.388884490741" font-size="19.039511556247" fill="var(--text-muted)" font-family="Arial, sans-serif">"Use only standard library..."</text>
  <rect x="112.0001" y="426.666666666667" width="1056" height="64.44440925926" rx="6.1644139144" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.0001" y="466.944448842592" font-size="22.847270031172" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">5. OUTPUT FORMAT</text>
  <text x="688.0001" y="466.944448842592" font-size="19.039511556247" fill="var(--text-muted)" font-family="Arial, sans-serif">"Return as JSON with keys..."</text>
  <rect x="112.0001" y="507.222125462966" width="1056" height="64.44440925926" rx="6.1644139144" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="184.0001" y="547.500013194444" font-size="22.847270031172" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">6. EXAMPLES (optional)</text>
  <text x="736.0001" y="547.500013194444" font-size="19.039511556247" fill="var(--text-muted)" font-family="Arial, sans-serif">"Input: X -&gt; Output: Y"</text>
</svg>

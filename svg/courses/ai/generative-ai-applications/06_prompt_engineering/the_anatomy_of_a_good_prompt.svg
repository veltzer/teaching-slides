<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">The Anatomy of a Good Prompt</text>
  <rect x="100" y="50" width="500" height="360" rx="8" fill="#f0f7ff" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">PROMPT STRUCTURE</text>
  <!-- 1 -->
  <rect x="130" y="90" width="440" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="160" y="115" font-size="12" font-weight="bold" fill="#4a90e2">1. ROLE / PERSONA</text>
  <text x="350" y="115" font-size="10" fill="#555">"You are a senior Python developer..."</text>
  <!-- 2 -->
  <rect x="130" y="140" width="440" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="160" y="165" font-size="12" font-weight="bold" fill="#28a745">2. CONTEXT</text>
  <text x="310" y="165" font-size="10" fill="#555">"We are building a REST API for..."</text>
  <!-- 3 -->
  <rect x="130" y="190" width="440" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="160" y="215" font-size="12" font-weight="bold" fill="#856404">3. TASK</text>
  <text x="280" y="215" font-size="10" fill="#555">"Write a function that..."</text>
  <!-- 4 -->
  <rect x="130" y="240" width="440" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="160" y="265" font-size="12" font-weight="bold" fill="#4a90e2">4. CONSTRAINTS</text>
  <text x="340" y="265" font-size="10" fill="#555">"Use only standard library..."</text>
  <!-- 5 -->
  <rect x="130" y="290" width="440" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="160" y="315" font-size="12" font-weight="bold" fill="#28a745">5. OUTPUT FORMAT</text>
  <text x="370" y="315" font-size="10" fill="#555">"Return as JSON with keys..."</text>
  <!-- 6 -->
  <rect x="130" y="340" width="440" height="40" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="160" y="365" font-size="12" font-weight="bold" fill="#666">6. EXAMPLES (optional)</text>
  <text x="390" y="365" font-size="10" fill="#555">"Input: X -> Output: Y"</text>
</svg>
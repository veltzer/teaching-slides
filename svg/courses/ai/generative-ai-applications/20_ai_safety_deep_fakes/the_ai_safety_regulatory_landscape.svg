<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="700" height="400" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">AI Regulation (as of 2025-2026)</text>
  <!-- Header -->
  <rect x="30" y="60" width="170" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="115" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Regulation</text>
  <rect x="205" y="60" width="480" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="445" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Key Points</text>
  <!-- EU AI Act -->
  <rect x="30" y="95" width="170" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="115" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">EU AI Act</text>
  <text x="115" y="145" text-anchor="middle" font-size="10" fill="#666">(2024)</text>
  <rect x="205" y="95" width="480" height="70" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="220" y="115" font-size="11" fill="#333">Risk-based classification system</text>
  <text x="220" y="135" font-size="11" fill="#333">Banned: social scoring, emotion AI</text>
  <text x="220" y="155" font-size="11" fill="#333">Generative AI: transparency requirements</text>
  <!-- US Executive Order -->
  <rect x="30" y="170" width="170" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="115" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">US Executive</text>
  <text x="115" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Order (2023)</text>
  <rect x="205" y="170" width="480" height="70" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="220" y="195" font-size="11" fill="#333">Safety testing for powerful models</text>
  <text x="220" y="215" font-size="11" fill="#333">Watermarking AI content | Red teaming requirements</text>
  <!-- China -->
  <rect x="30" y="245" width="170" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="115" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">China Regulations</text>
  <rect x="205" y="245" width="480" height="70" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="220" y="270" font-size="11" fill="#333">Deep fake labeling required | Watermarking mandatory</text>
  <text x="220" y="290" font-size="11" fill="#333">Approval for public-facing AI</text>
  <!-- UK -->
  <rect x="30" y="320" width="170" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="115" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">UK AI Safety</text>
  <text x="115" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Institute (2023)</text>
  <rect x="205" y="320" width="480" height="70" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="220" y="345" font-size="11" fill="#333">Frontier model evaluations</text>
  <text x="220" y="365" font-size="11" fill="#333">Safety testing framework | International coordination</text>
</svg>
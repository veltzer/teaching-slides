<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="90.75" text-anchor="middle" font-size="27.8676" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AI Regulation (as of 2025-2026)</text>
  <rect x="74.2857" y="112.4999" width="291.4286" height="43.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.9999" y="141.5" text-anchor="middle" font-size="18.5785" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Regulation</text>
  <rect x="374.2857" y="112.4999" width="822.8572" height="43.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785.7144" y="141.5" text-anchor="middle" font-size="18.5785" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Key Points</text>
  <rect x="74.2857" y="163.2499" width="291.4286" height="101.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.9999" y="206.7499" text-anchor="middle" font-size="20.1267" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">EU AI Act</text>
  <text x="219.9999" y="235.7499" text-anchor="middle" font-size="15.4821" fill="var(--text-muted)" font-family="Arial, sans-serif">(2024)</text>
  <rect x="374.2857" y="163.2499" width="822.8572" height="101.5" rx="6" fill="var(--bg)" stroke="var(--border)"/>
  <text x="400.0001" y="192.25" font-size="17.0302" fill="var(--text)" font-family="Arial, sans-serif">Risk-based classification system</text>
  <text x="400.0001" y="221.25" font-size="17.0302" fill="var(--text)" font-family="Arial, sans-serif">Banned: social scoring, emotion AI</text>
  <text x="400.0001" y="250.25" font-size="17.0302" fill="var(--text)" font-family="Arial, sans-serif">Generative AI: transparency requirements</text>
  <rect x="74.2857" y="272" width="291.4286" height="101.5" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.9999" y="308.2499" text-anchor="middle" font-size="20.1267" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">US Executive</text>
  <text x="219.9999" y="337.2499" text-anchor="middle" font-size="20.1267" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Order (2023)</text>
  <rect x="374.2857" y="272" width="822.8572" height="101.5" rx="6" fill="var(--bg)" stroke="var(--border)"/>
  <text x="400.0001" y="308.2499" font-size="17.0302" fill="var(--text)" font-family="Arial, sans-serif">Safety testing for powerful models</text>
  <text x="400.0001" y="337.2499" font-size="17.0302" fill="var(--text)" font-family="Arial, sans-serif">Watermarking AI content | Red teaming requirements</text>
  <rect x="74.2857" y="380.75" width="291.4286" height="101.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.9999" y="424.25" text-anchor="middle" font-size="20.1267" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">China Regulations</text>
  <rect x="374.2857" y="380.75" width="822.8572" height="101.5" rx="6" fill="var(--bg)" stroke="var(--border)"/>
  <text x="400.0001" y="416.9999" font-size="17.0302" fill="var(--text)" font-family="Arial, sans-serif">Deep fake labeling required | Watermarking mandatory</text>
  <text x="400.0001" y="446" font-size="17.0302" fill="var(--text)" font-family="Arial, sans-serif">Approval for public-facing AI</text>
  <rect x="74.2857" y="489.4999" width="291.4286" height="101.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.9999" y="525.75" text-anchor="middle" font-size="20.1267" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">UK AI Safety</text>
  <text x="219.9999" y="554.75" text-anchor="middle" font-size="20.1267" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Institute (2023)</text>
  <rect x="374.2857" y="489.4999" width="822.8572" height="101.5" rx="6" fill="var(--bg)" stroke="var(--border)"/>
  <text x="400.0001" y="525.75" font-size="17.0302" fill="var(--text)" font-family="Arial, sans-serif">Frontier model evaluations</text>
  <text x="400.0001" y="554.75" font-size="17.0302" fill="var(--text)" font-family="Arial, sans-serif">Safety testing framework | International coordination</text>
</svg>

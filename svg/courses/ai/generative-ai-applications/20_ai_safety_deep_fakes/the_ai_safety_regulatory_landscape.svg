<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="90.75" text-anchor="middle" font-size="27.8676" font-weight="bold" fill="var(--text)">AI Regulation (as of 2025-2026)</text>
  <rect x="74.2857" y="112.4999" width="291.4286" height="43.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="219.9999" y="141.5" text-anchor="middle" font-size="18.5785" font-weight="bold" fill="var(--bg)">Regulation</text>
  <rect x="374.2857" y="112.4999" width="822.8572" height="43.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="785.7144" y="141.5" text-anchor="middle" font-size="18.5785" font-weight="bold" fill="var(--bg)">Key Points</text>
  <rect x="74.2857" y="163.2499" width="291.4286" height="101.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="219.9999" y="206.7499" text-anchor="middle" font-size="20.1267" font-weight="bold" fill="var(--text)">EU AI Act</text>
  <text x="219.9999" y="235.7499" text-anchor="middle" font-size="15.4821" fill="var(--text-muted)">(2024)</text>
  <rect x="374.2857" y="163.2499" width="822.8572" height="101.5" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="400.0001" y="192.25" font-size="17.0302" fill="var(--text)">Risk-based classification system</text>
  <text x="400.0001" y="221.25" font-size="17.0302" fill="var(--text)">Banned: social scoring, emotion AI</text>
  <text x="400.0001" y="250.25" font-size="17.0302" fill="var(--text)">Generative AI: transparency requirements</text>
  <rect x="74.2857" y="272" width="291.4286" height="101.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="219.9999" y="308.2499" text-anchor="middle" font-size="20.1267" font-weight="bold" fill="var(--text)">US Executive</text>
  <text x="219.9999" y="337.2499" text-anchor="middle" font-size="20.1267" font-weight="bold" fill="var(--text)">Order (2023)</text>
  <rect x="374.2857" y="272" width="822.8572" height="101.5" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="400.0001" y="308.2499" font-size="17.0302" fill="var(--text)">Safety testing for powerful models</text>
  <text x="400.0001" y="337.2499" font-size="17.0302" fill="var(--text)">Watermarking AI content | Red teaming requirements</text>
  <rect x="74.2857" y="380.75" width="291.4286" height="101.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="219.9999" y="424.25" text-anchor="middle" font-size="20.1267" font-weight="bold" fill="var(--text)">China Regulations</text>
  <rect x="374.2857" y="380.75" width="822.8572" height="101.5" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="400.0001" y="416.9999" font-size="17.0302" fill="var(--text)">Deep fake labeling required | Watermarking mandatory</text>
  <text x="400.0001" y="446" font-size="17.0302" fill="var(--text)">Approval for public-facing AI</text>
  <rect x="74.2857" y="489.4999" width="291.4286" height="101.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="219.9999" y="525.75" text-anchor="middle" font-size="20.1267" font-weight="bold" fill="var(--text)">UK AI Safety</text>
  <text x="219.9999" y="554.75" text-anchor="middle" font-size="20.1267" font-weight="bold" fill="var(--text)">Institute (2023)</text>
  <rect x="374.2857" y="489.4999" width="822.8572" height="101.5" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="400.0001" y="525.75" font-size="17.0302" fill="var(--text)">Frontier model evaluations</text>
  <text x="400.0001" y="554.75" font-size="17.0302" fill="var(--text)">Safety testing framework | International coordination</text>
</svg>
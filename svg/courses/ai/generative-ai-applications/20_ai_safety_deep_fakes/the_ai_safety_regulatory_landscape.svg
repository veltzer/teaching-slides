<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="644.580244041718" y="40" text-anchor="middle" font-size="31.020473219398" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AI Regulation (as of 2025-2026)</text>
  <rect x="40" y="65.217280403254" width="311.450396363848" height="50.434792690613" rx="6.678825565043" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.7250913117" y="98.840591472382" text-anchor="middle" font-size="20.680426793358" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Regulation</text>
  <rect x="360.610670706836" y="65.217280403254" width="879.389329293164" height="50.434792690613" rx="6.678825565043" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800.305442223641" y="98.840591472382" text-anchor="middle" font-size="20.680426793358" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Key Points</text>
  <rect x="40" y="124.057871875637" width="311.450396363848" height="117.681182944764" rx="6.678825565043" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.7250913117" y="174.49266456625" text-anchor="middle" font-size="22.403786416658" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">EU AI Act</text>
  <text x="195.7250913117" y="208.115859693325" text-anchor="middle" font-size="17.233707546758" fill="var(--text-muted)" font-family="Arial, sans-serif">(2024)</text>
  <rect x="360.610670706836" y="124.057871875637" width="879.389329293164" height="117.681182944764" rx="6.678825565043" fill="var(--bg)" stroke="var(--border)"/>
  <text x="388.091707476249" y="157.681182944764" font-size="18.956955856299" fill="var(--text)" font-family="Arial, sans-serif">Risk-based classification system</text>
  <text x="388.091707476249" y="191.30437807184" font-size="18.956955856299" fill="var(--text)" font-family="Arial, sans-serif">Banned: social scoring, emotion AI</text>
  <text x="388.091707476249" y="224.927573198915" font-size="18.956955856299" fill="var(--text)" font-family="Arial, sans-serif">Generative AI: transparency requirements</text>
  <rect x="40" y="250.144969544222" width="311.450396363848" height="117.681182944764" rx="6.678825565043" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.7250913117" y="292.173847511014" text-anchor="middle" font-size="22.403786416658" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">US Executive</text>
  <text x="195.7250913117" y="325.79704263809" text-anchor="middle" font-size="22.403786416658" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Order (2023)</text>
  <rect x="360.610670706836" y="250.144969544222" width="879.389329293164" height="117.681182944764" rx="6.678825565043" fill="var(--bg)" stroke="var(--border)"/>
  <text x="388.091707476249" y="292.173847511014" font-size="18.956955856299" fill="var(--text)" font-family="Arial, sans-serif">Safety testing for powerful models</text>
  <text x="388.091707476249" y="325.79704263809" font-size="18.956955856299" fill="var(--text)" font-family="Arial, sans-serif">Watermarking AI content | Red teaming requirements</text>
  <rect x="40" y="376.231951270755" width="311.450396363848" height="117.681182944764" rx="6.678825565043" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.7250913117" y="426.666743961368" text-anchor="middle" font-size="22.403786416658" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">China Regulations</text>
  <rect x="360.610670706836" y="376.231951270755" width="879.389329293164" height="117.681182944764" rx="6.678825565043" fill="var(--bg)" stroke="var(--border)"/>
  <text x="388.091707476249" y="418.260829237547" font-size="18.956955856299" fill="var(--text)" font-family="Arial, sans-serif">Deep fake labeling required | Watermarking mandatory</text>
  <text x="388.091707476249" y="451.884140306675" font-size="18.956955856299" fill="var(--text)" font-family="Arial, sans-serif">Approval for public-facing AI</text>
  <rect x="40" y="502.318817055236" width="311.450396363848" height="117.681182944764" rx="6.678825565043" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.7250913117" y="544.347926906132" text-anchor="middle" font-size="22.403786416658" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">UK AI Safety</text>
  <text x="195.7250913117" y="577.971122033208" text-anchor="middle" font-size="22.403786416658" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Institute (2023)</text>
  <rect x="360.610670706836" y="502.318817055236" width="879.389329293164" height="117.681182944764" rx="6.678825565043" fill="var(--bg)" stroke="var(--border)"/>
  <text x="388.091707476249" y="544.347926906132" font-size="18.956955856299" fill="var(--text)" font-family="Arial, sans-serif">Frontier model evaluations</text>
  <text x="388.091707476249" y="577.971122033208" font-size="18.956955856299" fill="var(--text)" font-family="Arial, sans-serif">Safety testing framework | International coordination</text>
</svg>

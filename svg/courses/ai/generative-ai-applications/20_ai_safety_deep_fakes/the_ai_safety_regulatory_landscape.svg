<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="16.1879" y="15.6098" width="1133.1525" height="624.3902" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.7642" y="70.2439" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="var(--text)">AI Regulation (as of 2025-2026)</text>
  <rect x="48.5637" y="93.6585" width="275.1942" height="46.8293" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="186.1607" y="124.8781" text-anchor="middle" font-size="18.7317" font-weight="bold" fill="var(--bg)">Regulation</text>
  <rect x="331.8518" y="93.6585" width="777.0189" height="46.8293" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="720.3613" y="124.8781" text-anchor="middle" font-size="18.7317" font-weight="bold" fill="var(--bg)">Key Points</text>
  <rect x="48.5637" y="148.2926" width="275.1942" height="109.2683" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="186.1607" y="195.1219" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">EU AI Act</text>
  <text x="186.1607" y="226.3414" text-anchor="middle" font-size="15.6098" fill="var(--text-muted)">(2024)</text>
  <rect x="331.8518" y="148.2926" width="777.0189" height="109.2683" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="356.1337" y="179.5122" font-size="17.1707" fill="var(--text)">Risk-based classification system</text>
  <text x="356.1337" y="210.7317" font-size="17.1707" fill="var(--text)">Banned: social scoring, emotion AI</text>
  <text x="356.1337" y="241.9512" font-size="17.1707" fill="var(--text)">Generative AI: transparency requirements</text>
  <rect x="48.5637" y="265.3659" width="275.1942" height="109.2683" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="186.1607" y="304.3902" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">US Executive</text>
  <text x="186.1607" y="335.6097" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">Order (2023)</text>
  <rect x="331.8518" y="265.3659" width="777.0189" height="109.2683" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="356.1337" y="304.3902" font-size="17.1707" fill="var(--text)">Safety testing for powerful models</text>
  <text x="356.1337" y="335.6097" font-size="17.1707" fill="var(--text)">Watermarking AI content | Red teaming requirements</text>
  <rect x="48.5637" y="382.439" width="275.1942" height="109.2683" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="186.1607" y="429.2683" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">China Regulations</text>
  <rect x="331.8518" y="382.439" width="777.0189" height="109.2683" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="356.1337" y="421.4633" font-size="17.1707" fill="var(--text)">Deep fake labeling required | Watermarking mandatory</text>
  <text x="356.1337" y="452.6829" font-size="17.1707" fill="var(--text)">Approval for public-facing AI</text>
  <rect x="48.5637" y="499.5121" width="275.1942" height="109.2683" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="186.1607" y="538.5366" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">UK AI Safety</text>
  <text x="186.1607" y="569.7561" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--text)">Institute (2023)</text>
  <rect x="331.8518" y="499.5121" width="777.0189" height="109.2683" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="356.1337" y="538.5366" font-size="17.1707" fill="var(--text)">Frontier model evaluations</text>
  <text x="356.1337" y="569.7561" font-size="17.1707" fill="var(--text)">Safety testing framework | International coordination</text>
</svg>
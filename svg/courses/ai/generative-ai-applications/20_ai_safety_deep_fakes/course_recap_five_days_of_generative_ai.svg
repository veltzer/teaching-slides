<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="24.6247" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Course Recap: Five Days of Generative AI</text>
  <rect x="40" y="72.9545" width="1200" height="98.8637" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="103.2727" font-size="19.1524" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Day 1: FOUNDATIONS</text>
  <text x="115.0001" y="129.6363" font-size="15.0485" fill="var(--text)" font-family="Arial, sans-serif">Transformer architecture &amp; self-attention | GPT family &amp; ChatGPT pipeline</text>
  <text x="115.0001" y="155.9999" font-size="15.0485" fill="var(--text-muted)" font-family="Arial, sans-serif">Pre-training -&gt; SFT -&gt; RLHF</text>
  <rect x="40" y="185" width="1200" height="98.8637" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="215.3181" font-size="19.1524" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Day 2: APIs &amp; PROMPTS</text>
  <text x="115.0001" y="241.6817" font-size="15.0485" fill="var(--text)" font-family="Arial, sans-serif">OpenAI API mastery | Prompt engineering patterns</text>
  <text x="115.0001" y="268.0454" font-size="15.0485" fill="var(--text-muted)" font-family="Arial, sans-serif">Few-shot / zero-shot / chain-of-thought | Fine-tuning with OpenAI</text>
  <rect x="40" y="297.0455" width="1200" height="98.8637" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="327.3636" font-size="19.1524" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Day 3: AGENTS &amp; MEMORY</text>
  <text x="115.0001" y="353.7272" font-size="15.0485" fill="var(--text)" font-family="Arial, sans-serif">Agent architectures &amp; planning | Memory systems (buffer, summary, vector)</text>
  <text x="115.0001" y="380.0908" font-size="15.0485" fill="var(--text-muted)" font-family="Arial, sans-serif">LangChain and RAG pipelines | Custom database interfaces</text>
  <rect x="40" y="409.0908" width="1200" height="98.8637" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="439.409" font-size="19.1524" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Day 4: OPEN SOURCE</text>
  <text x="115.0001" y="465.7727" font-size="15.0485" fill="var(--text)" font-family="Arial, sans-serif">HuggingFace ecosystem | Local model deployment</text>
  <text x="115.0001" y="492.1363" font-size="15.0485" fill="var(--text-muted)" font-family="Arial, sans-serif">LoRA, QLoRA, Prompt Tuning | Parameter efficient fine-tuning</text>
  <rect x="40" y="521.1363" width="1200" height="98.8637" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="551.4545" font-size="19.1524" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Day 5: IMAGES &amp; SAFETY</text>
  <text x="115.0001" y="577.8181" font-size="15.0485" fill="var(--text)" font-family="Arial, sans-serif">Diffusion models &amp; Stable Diffusion | DreamBooth &amp; Textual Inversion</text>
  <text x="115.0001" y="604.1817" font-size="15.0485" fill="var(--text-muted)" font-family="Arial, sans-serif">Quality metrics &amp; evaluation | Bias, safety, and deep fakes</text>
</svg>
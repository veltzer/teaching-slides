  <ns0:text x="89.9156" y="453.4467" font-size="19.0638" font-weight="bold" fill="#4a90e2">Day 4: OPEN SOURCE</ns0:text>
  <ns0:text x="125.8818" y="480.6808" font-size="14.9788" fill="#333">HuggingFace ecosystem | Local model deployment</ns0:text>

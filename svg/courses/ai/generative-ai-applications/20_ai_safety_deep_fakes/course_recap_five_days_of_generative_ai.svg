<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.601166462271" font-weight="bold" fill="var(--text)">Course Recap: 5 Days of Generative AI</text>

  <rect x="40" y="66.268115942029" width="1200" height="99.81884057971" rx="6.150291615568" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="103.04347826087" font-family="Arial, sans-serif" font-size="19.475923449298" font-weight="bold" fill="var(--primary-text)">Day 1: Foundations</text>
  <text x="115" y="131.413043478261" font-family="Arial, sans-serif" font-size="15.375729038919" fill="var(--primary-text)">Transformers, attention, GPT family</text>
  <text x="115" y="157.68115942029" font-family="Arial, sans-serif" font-size="15.375729038919" fill="var(--primary-text)">Pre-training, SFT, RLHF</text>

  <rect x="40" y="179.746376811594" width="1200" height="99.81884057971" rx="6.150291615568" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="216.521739130435" font-family="Arial, sans-serif" font-size="19.475923449298" font-weight="bold" fill="var(--ok-text)">Day 2: APIs and Prompts</text>
  <text x="115" y="244.891304347826" font-family="Arial, sans-serif" font-size="15.375729038919" fill="var(--ok-text)">OpenAI API, prompt patterns</text>
  <text x="115" y="271.159420289855" font-family="Arial, sans-serif" font-size="15.375729038919" fill="var(--ok-text)">Few-shot, CoT, fine-tuning</text>

  <rect x="40" y="293.224637681159" width="1200" height="99.81884057971" rx="6.150291615568" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="330" font-family="Arial, sans-serif" font-size="19.475923449298" font-weight="bold" fill="var(--warn-text)">Day 3: Agents and Memory</text>
  <text x="115" y="358.369565217391" font-family="Arial, sans-serif" font-size="15.375729038919" fill="var(--warn-text)">Planning, buffer / vector memory</text>
  <text x="115" y="384.63768115942" font-family="Arial, sans-serif" font-size="15.375729038919" fill="var(--warn-text)">LangChain, RAG pipelines</text>

  <rect x="40" y="406.702898550725" width="1200" height="99.81884057971" rx="6.150291615568" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="443.478260869565" font-family="Arial, sans-serif" font-size="19.475923449298" font-weight="bold" fill="var(--info-text)">Day 4: Open Source</text>
  <text x="115" y="471.847826086957" font-family="Arial, sans-serif" font-size="15.375729038919" fill="var(--info-text)">HuggingFace, local deployment</text>
  <text x="115" y="498.115942028986" font-family="Arial, sans-serif" font-size="15.375729038919" fill="var(--info-text)">LoRA, QLoRA, PEFT</text>

  <rect x="40" y="520.18115942029" width="1200" height="99.81884057971" rx="6.150291615568" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="556.95652173913" font-family="Arial, sans-serif" font-size="19.475923449298" font-weight="bold" fill="var(--danger-text)">Day 5: Images and Safety</text>
  <text x="115" y="585.326086956522" font-family="Arial, sans-serif" font-size="15.375729038919" fill="var(--danger-text)">Diffusion, DreamBooth</text>
  <text x="115" y="611.594202898551" font-family="Arial, sans-serif" font-size="15.375729038919" fill="var(--danger-text)">Metrics, bias, deep fakes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Course Recap: Five Days of Generative AI</text>
  <!-- Day 1 -->
  <rect x="30" y="55" width="640" height="75" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="78" font-size="14" font-weight="bold" fill="#4a90e2">Day 1: FOUNDATIONS</text>
  <text x="70" y="98" font-size="11" fill="#333">Transformer architecture &amp; self-attention | GPT family &amp; ChatGPT pipeline</text>
  <text x="70" y="118" font-size="11" fill="#555">Pre-training -> SFT -> RLHF</text>
  <!-- Day 2 -->
  <rect x="30" y="140" width="640" height="75" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="50" y="163" font-size="14" font-weight="bold" fill="#28a745">Day 2: APIs &amp; PROMPTS</text>
  <text x="70" y="183" font-size="11" fill="#333">OpenAI API mastery | Prompt engineering patterns</text>
  <text x="70" y="203" font-size="11" fill="#555">Few-shot / zero-shot / chain-of-thought | Fine-tuning with OpenAI</text>
  <!-- Day 3 -->
  <rect x="30" y="225" width="640" height="75" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="50" y="248" font-size="14" font-weight="bold" fill="#856404">Day 3: AGENTS &amp; MEMORY</text>
  <text x="70" y="268" font-size="11" fill="#333">Agent architectures &amp; planning | Memory systems (buffer, summary, vector)</text>
  <text x="70" y="288" font-size="11" fill="#555">LangChain and RAG pipelines | Custom database interfaces</text>
  <!-- Day 4 -->
  <rect x="30" y="310" width="640" height="75" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="333" font-size="14" font-weight="bold" fill="#4a90e2">Day 4: OPEN SOURCE</text>
  <text x="70" y="353" font-size="11" fill="#333">HuggingFace ecosystem | Local model deployment</text>
  <text x="70" y="373" font-size="11" fill="#555">LoRA, QLoRA, Prompt Tuning | Parameter efficient fine-tuning</text>
  <!-- Day 5 -->
  <rect x="30" y="395" width="640" height="75" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>

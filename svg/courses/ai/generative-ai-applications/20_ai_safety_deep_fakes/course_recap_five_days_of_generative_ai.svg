<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="629.4089" y="40.8511" text-anchor="middle" font-size="24.5107" font-weight="bold" fill="var(--text)">Course Recap: Five Days of Generative AI</text>
  <rect x="53.9493" y="74.8936" width="1150.9191" height="102.1277" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="89.9156" y="106.2128" font-size="19.0638" font-weight="bold" fill="var(--primary-accent)">Day 1: FOUNDATIONS</text>
  <text x="125.8818" y="133.4468" font-size="14.9788" fill="var(--text)">Transformer architecture &amp; self-attention | GPT family &amp; ChatGPT pipeline</text>
  <text x="125.8818" y="160.6808" font-size="14.9788" fill="var(--text-muted)">Pre-training -&gt; SFT -&gt; RLHF</text>
  <rect x="53.9493" y="190.6383" width="1150.9191" height="102.1277" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="89.9156" y="221.9574" font-size="19.0638" font-weight="bold" fill="var(--ok-accent)">Day 2: APIs &amp; PROMPTS</text>
  <text x="125.8818" y="249.1914" font-size="14.9788" fill="var(--text)">OpenAI API mastery | Prompt engineering patterns</text>
  <text x="125.8818" y="276.4255" font-size="14.9788" fill="var(--text-muted)">Few-shot / zero-shot / chain-of-thought | Fine-tuning with OpenAI</text>
  <rect x="53.9493" y="306.383" width="1150.9191" height="102.1277" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="89.9156" y="337.7021" font-size="19.0638" font-weight="bold" fill="var(--danger-accent)">Day 3: AGENTS &amp; MEMORY</text>
  <text x="125.8818" y="364.9361" font-size="14.9788" fill="var(--text)">Agent architectures &amp; planning | Memory systems (buffer, summary, vector)</text>
  <text x="125.8818" y="392.1701" font-size="14.9788" fill="var(--text-muted)">LangChain and RAG pipelines | Custom database interfaces</text>
  <rect x="53.9493" y="422.1276" width="1150.9191" height="102.1277" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="89.9156" y="453.4467" font-size="19.0638" font-weight="bold" fill="var(--primary-accent)">Day 4: OPEN SOURCE</text>
  <text x="125.8818" y="480.6808" font-size="14.9788" fill="var(--text)">HuggingFace ecosystem | Local model deployment</text>
  <text x="125.8818" y="507.9148" font-size="14.9788" fill="var(--text-muted)">LoRA, QLoRA, Prompt Tuning | Parameter efficient fine-tuning</text>
  <rect x="53.9493" y="537.8723" width="1150.9191" height="102.1277" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="89.9156" y="569.1914" font-size="19.0638" font-weight="bold" fill="var(--danger-accent)">Day 5: IMAGES &amp; SAFETY</text>
  <text x="125.8818" y="596.4254" font-size="14.9788" fill="var(--text)">Diffusion models &amp; Stable Diffusion | DreamBooth &amp; Textual Inversion</text>
  <text x="125.8818" y="623.6595" font-size="14.9788" fill="var(--text-muted)">Quality metrics &amp; evaluation | Bias, safety, and deep fakes</text>
</svg>
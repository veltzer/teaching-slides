<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- NEAR-TERM -->
  <rect x="40" y="40" width="1200" height="179.272727272727" rx="12.322927633259" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="82.181818181818" font-size="22.592033994309" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">NEAR-TERM (today)</text>
  <text x="70" y="129.636363636364" font-size="18.484391449889" fill="var(--danger-text)" font-family="Arial, sans-serif">• Misinformation and deep fakes</text>
  <text x="70" y="161.272727272727" font-size="18.484391449889" fill="var(--danger-text)" font-family="Arial, sans-serif">• Bias and discrimination</text>
  <text x="70" y="192.909090909091" font-size="18.484391449889" fill="var(--danger-text)" font-family="Arial, sans-serif">• Privacy violations</text>
  <text x="660" y="129.636363636364" font-size="18.484391449889" fill="var(--danger-text)" font-family="Arial, sans-serif">• Manipulation and deception</text>
  <text x="660" y="161.272727272727" font-size="18.484391449889" fill="var(--danger-text)" font-family="Arial, sans-serif">• Automated harassment</text>
  <text x="660" y="192.909090909091" font-size="18.484391449889" fill="var(--danger-text)" font-family="Arial, sans-serif">• Copyright / IP infringement</text>

  <!-- MEDIUM-TERM -->
  <rect x="40" y="240.363636363636" width="1200" height="179.272727272727" rx="12.322927633259" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="282.545454545455" font-size="22.592033994309" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">MEDIUM-TERM (2–5 years)</text>
  <text x="70" y="330" font-size="18.484391449889" fill="var(--warn-text)" font-family="Arial, sans-serif">• Autonomous weapons</text>
  <text x="70" y="361.636363636364" font-size="18.484391449889" fill="var(--warn-text)" font-family="Arial, sans-serif">• Economic disruption &amp; job loss</text>
  <text x="70" y="393.272727272727" font-size="18.484391449889" fill="var(--warn-text)" font-family="Arial, sans-serif">• Concentration of power</text>
  <text x="660" y="330" font-size="18.484391449889" fill="var(--warn-text)" font-family="Arial, sans-serif">• Surveillance &amp; social control</text>
  <text x="660" y="361.636363636364" font-size="18.484391449889" fill="var(--warn-text)" font-family="Arial, sans-serif">• Cybersecurity arms race</text>
  <text x="660" y="393.272727272727" font-size="18.484391449889" fill="var(--warn-text)" font-family="Arial, sans-serif">• Erosion of human oversight</text>

  <!-- LONG-TERM -->
  <rect x="40" y="440.727272727273" width="1200" height="179.272727272727" rx="12.322927633259" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="482.909090909091" font-size="22.592033994309" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">LONG-TERM (speculative)</text>
  <text x="70" y="530.363636363636" font-size="18.484391449889" fill="var(--primary-text)" font-family="Arial, sans-serif">• Alignment of superintelligent systems</text>
  <text x="70" y="562" font-size="18.484391449889" fill="var(--primary-text)" font-family="Arial, sans-serif">• Loss of human agency</text>
  <text x="70" y="593.636363636364" font-size="18.484391449889" fill="var(--primary-text)" font-family="Arial, sans-serif">• Existential risk</text>
  <text x="660" y="530.363636363636" font-size="18.484391449889" fill="var(--primary-text)" font-family="Arial, sans-serif">• Value-lock-in across generations</text>
  <text x="660" y="562" font-size="18.484391449889" fill="var(--primary-text)" font-family="Arial, sans-serif">• Irreversible deployment decisions</text>
  <text x="660" y="593.636363636364" font-size="18.484391449889" fill="var(--primary-text)" font-family="Arial, sans-serif">• Catastrophic mis-specification</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="680" height="460" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">AI Safety Concerns</text>
  <!-- Near-term -->
  <rect x="30" y="65" width="640" height="145" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="50" y="90" font-size="14" font-weight="bold" fill="#dc3545">NEAR-TERM (today)</text>
  <text x="70" y="115" font-size="11" fill="#333">Misinformation and deep fakes</text>
  <text x="70" y="133" font-size="11" fill="#333">Bias and discrimination</text>
  <text x="70" y="151" font-size="11" fill="#333">Privacy violations</text>
  <text x="350" y="115" font-size="11" fill="#333">Manipulation and deception</text>
  <text x="350" y="133" font-size="11" fill="#333">Automated harassment</text>
  <text x="350" y="151" font-size="11" fill="#333">Copyright and intellectual property</text>
  <!-- Medium-term -->
  <rect x="30" y="220" width="640" height="120" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="50" y="245" font-size="14" font-weight="bold" fill="#856404">MEDIUM-TERM (2-5 years)</text>
  <text x="70" y="270" font-size="11" fill="#333">Autonomous weapons</text>
  <text x="70" y="288" font-size="11" fill="#333">Economic disruption and job displacement</text>
  <text x="70" y="306" font-size="11" fill="#333">Concentration of power</text>
  <text x="400" y="270" font-size="11" fill="#333">Surveillance and social control</text>
  <text x="400" y="288" font-size="11" fill="#333">Cybersecurity arms race</text>
  <!-- Long-term -->
  <rect x="30" y="350" width="640" height="100" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="375" font-size="14" font-weight="bold" fill="#4a90e2">LONG-TERM (speculative)</text>
  <text x="70" y="400" font-size="11" fill="#333">Alignment of superintelligent systems</text>
  <text x="70" y="418" font-size="11" fill="#333">Loss of human agency</text>
  <text x="350" y="400" font-size="11" fill="#333">Existential risk</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84.1305" text-anchor="middle" font-size="24.3183" font-weight="bold" fill="var(--text)">AI Safety Concerns</text>
  <rect x="75.2941" y="109.3478" width="1129.4118" height="182.8261" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="110.5882" y="140.8696" font-size="18.9142" font-weight="bold" fill="var(--danger-accent)">NEAR-TERM (today)</text>
  <text x="145.8824" y="172.3913" font-size="14.8612" fill="var(--text)">Misinformation and deep fakes</text>
  <text x="145.8824" y="195.087" font-size="14.8612" fill="var(--text)">Bias and discrimination</text>
  <text x="145.8824" y="217.7826" font-size="14.8612" fill="var(--text)">Privacy violations</text>
  <text x="640" y="172.3913" font-size="14.8612" fill="var(--text)">Manipulation and deception</text>
  <text x="640" y="195.087" font-size="14.8612" fill="var(--text)">Automated harassment</text>
  <text x="640" y="217.7826" font-size="14.8612" fill="var(--text)">Copyright and intellectual property</text>
  <rect x="75.2941" y="304.7826" width="1129.4118" height="151.3044" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="110.5882" y="336.3043" font-size="18.9142" font-weight="bold" fill="var(--danger-accent)">MEDIUM-TERM (2-5 years)</text>
  <text x="145.8824" y="367.8261" font-size="14.8612" fill="var(--text)">Autonomous weapons</text>
  <text x="145.8824" y="390.5217" font-size="14.8612" fill="var(--text)">Economic disruption and job displacement</text>
  <text x="145.8824" y="413.2174" font-size="14.8612" fill="var(--text)">Concentration of power</text>
  <text x="728.2353" y="367.8261" font-size="14.8612" fill="var(--text)">Surveillance and social control</text>
  <text x="728.2353" y="390.5217" font-size="14.8612" fill="var(--text)">Cybersecurity arms race</text>
  <rect x="75.2941" y="468.6956" width="1129.4118" height="126.0869" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="110.5882" y="500.2174" font-size="18.9142" font-weight="bold" fill="var(--primary-accent)">LONG-TERM (speculative)</text>
  <text x="145.8824" y="531.7392" font-size="14.8612" fill="var(--text)">Alignment of superintelligent systems</text>
  <text x="145.8824" y="554.4348" font-size="14.8612" fill="var(--text)">Loss of human agency</text>
  <text x="640" y="531.7392" font-size="14.8612" fill="var(--text)">Existential risk</text>
</svg>
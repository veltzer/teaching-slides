<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 450" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">How Deep Fakes Work: Face Swapping</text>
  <text x="375" y="52" text-anchor="middle" font-size="12" fill="#666">Traditional approach (autoencoder-based)</text>
  <!-- Person A side -->
  <rect x="50" y="75" width="140" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="120" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Person A (source)</text>
  <line x1="120" y1="125" x2="120" y2="155" stroke="#333" stroke-width="2" marker-end="url(#aD)"/>
  <rect x="60" y="160" width="120" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="120" y="188" text-anchor="middle" font-size="12" fill="#333">Encoder (shared)</text>
  <line x1="120" y1="205" x2="120" y2="235" stroke="#333" stroke-width="2" marker-end="url(#aD)"/>
  <rect x="55" y="240" width="130" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="120" y="260" text-anchor="middle" font-size="11" fill="#666">latent space</text>
  <line x1="120" y1="270" x2="120" y2="295" stroke="#333" stroke-width="2" marker-end="url(#aD)"/>
  <rect x="60" y="300" width="120" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="120" y="328" text-anchor="middle" font-size="12" fill="#333">Decoder A</text>
  <line x1="120" y1="345" x2="120" y2="370" stroke="#333" stroke-width="2" marker-end="url(#aD)"/>
  <text x="120" y="390" text-anchor="middle" font-size="11" fill="#555">Reconstructed A</text>
  <defs><marker id="aD" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#333"/></marker></defs>

  <!-- Person B side -->
  <rect x="530" y="75" width="140" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="600" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Person B (target)</text>
  <line x1="600" y1="125" x2="600" y2="155" stroke="#333" stroke-width="2" marker-end="url(#aD)"/>
  <rect x="540" y="160" width="120" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="600" y="188" text-anchor="middle" font-size="12" fill="#333">Encoder (shared)</text>
  <line x1="600" y1="205" x2="600" y2="235" stroke="#333" stroke-width="2" marker-end="url(#aD)"/>
  <rect x="535" y="240" width="130" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="600" y="260" text-anchor="middle" font-size="11" fill="#666">latent space</text>
  <line x1="600" y1="270" x2="600" y2="295" stroke="#333" stroke-width="2" marker-end="url(#aD)"/>
  <rect x="540" y="300" width="120" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="600" y="328" text-anchor="middle" font-size="12" fill="#333">Decoder B</text>
  <line x1="600" y1="345" x2="600" y2="370" stroke="#333" stroke-width="2" marker-end="url(#aD)"/>
  <text x="600" y="390" text-anchor="middle" font-size="11" fill="#555">Reconstructed B</text>

  <!-- Face swap explanation -->
  <rect x="220" y="240" width="280" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Face Swap Trick</text>
  <text x="360" y="288" text-anchor="middle" font-size="12" fill="#555">Encode A -> use Decoder B</text>
  <text x="360" y="308" text-anchor="middle" font-size="11" fill="#555">A's expressions on B's face</text>
  <!-- Cross arrows -->
  <path d="M185,255 L220,270" stroke="#dc3545" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M500,270 L535,310" stroke="#dc3545" stroke-width="2" stroke-dasharray="4,3"/>
</svg>
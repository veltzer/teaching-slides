    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:rect x="16.6707" y="16.4103" width="1133.6101" height="623.5897" rx="8.2051" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.2821" />
  <ns0:text x="583.4758" y="106.6667" text-anchor="middle" font-size="36.1026" font-weight="bold" fill="var(--text-dark)">Thank you for participating in</ns0:text>
  <ns0:text x="583.4758" y="164.1026" text-anchor="middle" font-size="36.1026" font-weight="bold" fill="var(--primary-bright)">Generative AI Applications!</ns0:text>
  <ns0:text x="583.4758" y="237.9487" text-anchor="middle" font-size="24.6154" font-weight="bold" fill="var(--text-dark)">Key Takeaways:</ns0:text>
  <ns0:rect x="133.3659" y="270.7692" width="900.2198" height="57.4359" rx="8.2051" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.4615" />
  <ns0:text x="166.7073" y="308.5128" font-size="21.3333" fill="var(--text-dark)">1. Start with prompting, escalate to fine-tuning</ns0:text>
  <ns0:rect x="133.3659" y="344.6154" width="900.2198" height="57.4359" rx="8.2051" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.4615" />
  <ns0:text x="166.7073" y="382.359" font-size="21.3333" fill="var(--text-dark)">2. Use the right model for the right task</ns0:text>
  <ns0:rect x="133.3659" y="418.4615" width="900.2198" height="57.4359" rx="8.2051" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.4615" />
  <ns0:text x="166.7073" y="456.2051" font-size="21.3333" fill="var(--text-dark)">3. Build evaluation into everything</ns0:text>
  <ns0:rect x="133.3659" y="492.3077" width="900.2198" height="57.4359" rx="8.2051" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.4615" />
  <ns0:text x="166.7073" y="530.0513" font-size="21.3333" fill="var(--text-dark)">4. Consider safety and bias from day one</ns0:text>
  <ns0:rect x="133.3659" y="566.1538" width="900.2198" height="57.4359" rx="8.2051" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.4615" />
  <ns0:text x="166.7073" y="603.8974" font-size="21.3333" fill="var(--text-dark)">5. The field moves fast - keep learning</ns0:text>
</ns0:svg>
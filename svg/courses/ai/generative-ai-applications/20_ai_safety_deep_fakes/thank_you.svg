<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="680" height="380" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="65" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">Thank you for participating in</text>
  <text x="350" y="100" text-anchor="middle" font-size="22" font-weight="bold" fill="#4a90e2">Generative AI Applications!</text>
  <text x="350" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Key Takeaways:</text>
  <rect x="80" y="165" width="540" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="100" y="188" font-size="13" fill="#333">1. Start with prompting, escalate to fine-tuning</text>
  <rect x="80" y="210" width="540" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="100" y="233" font-size="13" fill="#333">2. Use the right model for the right task</text>
  <rect x="80" y="255" width="540" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="100" y="278" font-size="13" fill="#333">3. Build evaluation into everything</text>
  <rect x="80" y="300" width="540" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="100" y="323" font-size="13" fill="#333">4. Consider safety and bias from day one</text>
  <rect x="80" y="345" width="540" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="100" y="368" font-size="13" fill="#333">5. The field moves fast - keep learning</text>
</svg>
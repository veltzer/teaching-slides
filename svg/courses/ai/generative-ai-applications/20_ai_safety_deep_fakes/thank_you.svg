<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="16.6707" y="16.4103" width="1133.6101" height="623.5897" rx="8.2051" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2821" />
  <ns0:text x="583.4758" y="106.6667" text-anchor="middle" font-size="36.1026" font-weight="bold" fill="#333">Thank you for participating in</ns0:text>
  <ns0:text x="583.4758" y="164.1026" text-anchor="middle" font-size="36.1026" font-weight="bold" fill="#4a90e2">Generative AI Applications!</ns0:text>
  <ns0:text x="583.4758" y="237.9487" text-anchor="middle" font-size="24.6154" font-weight="bold" fill="#333">Key Takeaways:</ns0:text>
  <ns0:rect x="133.3659" y="270.7692" width="900.2198" height="57.4359" rx="8.2051" fill="#d4edda" stroke="#28a745" stroke-width="2.4615" />
  <ns0:text x="166.7073" y="308.5128" font-size="21.3333" fill="#333">1. Start with prompting, escalate to fine-tuning</ns0:text>
  <ns0:rect x="133.3659" y="344.6154" width="900.2198" height="57.4359" rx="8.2051" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4615" />
  <ns0:text x="166.7073" y="382.359" font-size="21.3333" fill="#333">2. Use the right model for the right task</ns0:text>
  <ns0:rect x="133.3659" y="418.4615" width="900.2198" height="57.4359" rx="8.2051" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4615" />
  <ns0:text x="166.7073" y="456.2051" font-size="21.3333" fill="#333">3. Build evaluation into everything</ns0:text>
  <ns0:rect x="133.3659" y="492.3077" width="900.2198" height="57.4359" rx="8.2051" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4615" />
  <ns0:text x="166.7073" y="530.0513" font-size="21.3333" fill="#333">4. Consider safety and bias from day one</ns0:text>
  <ns0:rect x="133.3659" y="566.1538" width="900.2198" height="57.4359" rx="8.2051" fill="#d4edda" stroke="#28a745" stroke-width="2.4615" />
  <ns0:text x="166.7073" y="603.8974" font-size="21.3333" fill="#333">5. The field moves fast - keep learning</ns0:text>
</ns0:svg>
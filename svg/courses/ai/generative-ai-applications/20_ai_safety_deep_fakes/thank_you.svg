<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="18.2857" y="18" width="1243.4286" height="684" rx="9" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6" />
  <text x="640" y="117" text-anchor="middle" font-size="39.6" font-weight="bold" fill="#333">Thank you for participating in</text>
  <text x="640" y="180" text-anchor="middle" font-size="39.6" font-weight="bold" fill="#4a90e2">Generative AI Applications!</text>
  <text x="640" y="261" text-anchor="middle" font-size="27" font-weight="bold" fill="#333">Key Takeaways:</text>
  <rect x="146.2857" y="297" width="987.4286" height="63" rx="9" fill="#d4edda" stroke="#28a745" stroke-width="2.7" />
  <text x="182.8571" y="338.4" font-size="23.4" fill="#333">1. Start with prompting, escalate to fine-tuning</text>
  <rect x="146.2857" y="378" width="987.4286" height="63" rx="9" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7" />
  <text x="182.8571" y="419.4" font-size="23.4" fill="#333">2. Use the right model for the right task</text>
  <rect x="146.2857" y="459" width="987.4286" height="63" rx="9" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7" />
  <text x="182.8571" y="500.4" font-size="23.4" fill="#333">3. Build evaluation into everything</text>
  <rect x="146.2857" y="540" width="987.4286" height="63" rx="9" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7" />
  <text x="182.8571" y="581.4" font-size="23.4" fill="#333">4. Consider safety and bias from day one</text>
  <rect x="146.2857" y="621" width="987.4286" height="63" rx="9" fill="#d4edda" stroke="#28a745" stroke-width="2.7" />
  <text x="182.8571" y="662.4" font-size="23.4" fill="#333">5. The field moves fast - keep learning</text>

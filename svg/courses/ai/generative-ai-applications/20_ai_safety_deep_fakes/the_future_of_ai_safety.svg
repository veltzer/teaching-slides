<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="43.2" text-anchor="middle" font-size="25.92" font-weight="bold" fill="#333">The Future of AI Safety</text>
  <text x="640" y="74.88" text-anchor="middle" font-size="18.72" fill="#666">Emerging Safety Research Areas</text>
  <rect x="54.8571" y="100.8" width="1170.2857" height="100.8" rx="7.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.88" />
  <text x="91.4286" y="136.8" font-size="18.72" font-weight="bold" fill="#4a90e2">1. MECHANISTIC INTERPRETABILITY</text>
  <text x="128" y="165.6" font-size="15.84" fill="#333">Understanding what happens inside the model. "Why did the model produce this output?"</text>
  <text x="128" y="190.08" font-size="15.84" fill="#555">Tools: activation patching, probing classifiers</text>
  <rect x="54.8571" y="216" width="1170.2857" height="100.8" rx="7.2" fill="#d4edda" stroke="#28a745" stroke-width="2.88" />
  <text x="91.4286" y="252" font-size="18.72" font-weight="bold" fill="#28a745">2. SCALABLE OVERSIGHT</text>
  <text x="128" y="280.8" font-size="15.84" fill="#333">How to supervise AI systems smarter than us.</text>
  <text x="128" y="305.28" font-size="15.84" fill="#555">Debate: AI models argue both sides, human judges | Recursive reward modeling</text>
  <rect x="54.8571" y="331.2" width="1170.2857" height="100.8" rx="7.2" fill="#fff3cd" stroke="#ffc107" stroke-width="2.88" />
  <text x="91.4286" y="367.2" font-size="18.72" font-weight="bold" fill="#856404">3. ROBUSTNESS</text>
  <text x="128" y="396" font-size="15.84" fill="#333">Models that work reliably in adversarial conditions.</text>
  <text x="128" y="420.48" font-size="15.84" fill="#555">Adversarial training for jailbreak resistance | Formal verification of safety properties</text>
  <rect x="54.8571" y="446.4" width="1170.2857" height="100.8" rx="7.2" fill="#f8d7da" stroke="#dc3545" stroke-width="2.88" />
  <text x="91.4286" y="482.4" font-size="18.72" font-weight="bold" fill="#dc3545">4. ALIGNMENT TAX</text>
  <text x="128" y="511.2" font-size="15.84" fill="#333">Can we make models safer WITHOUT making them worse?</text>
  <text x="128" y="535.68" font-size="15.84" fill="#555">Current evidence: alignment improves helpfulness</text>
  <rect x="54.8571" y="561.6" width="1170.2857" height="100.8" rx="7.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.88" />
  <text x="91.4286" y="597.6" font-size="18.72" font-weight="bold" fill="#4a90e2">5. MULTI-AGENT SAFETY</text>
  <text x="128" y="626.4" font-size="15.84" fill="#333">Safety when multiple AI agents interact.</text>
  <text x="128" y="650.88" font-size="15.84" fill="#555">Emergent behaviors in agent systems | Coordination problems and race conditions</text>
</svg>
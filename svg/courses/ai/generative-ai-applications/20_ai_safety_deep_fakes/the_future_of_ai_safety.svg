<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="618.3575" y="41.7391" text-anchor="middle" font-size="25.0435" font-weight="bold" fill="#333">The Future of AI Safety</ns0:text>
  <ns0:text x="618.3575" y="72.3478" text-anchor="middle" font-size="18.087" fill="#666">Emerging Safety Research Areas</ns0:text>
  <ns0:rect x="53.002" y="97.3913" width="1130.7108" height="97.3913" rx="6.9565" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7826" />
  <ns0:text x="88.3368" y="132.1739" font-size="18.087" font-weight="bold" fill="#4a90e2">1. MECHANISTIC INTERPRETABILITY</ns0:text>
  <ns0:text x="123.6715" y="160" font-size="15.3043" fill="#333">Understanding what happens inside the model. "Why did the model produce this output?"</ns0:text>
  <ns0:text x="123.6715" y="183.6522" font-size="15.3043" fill="#555">Tools: activation patching, probing classifiers</ns0:text>
  <ns0:rect x="53.002" y="208.6957" width="1130.7108" height="97.3913" rx="6.9565" fill="#d4edda" stroke="#28a745" stroke-width="2.7826" />
  <ns0:text x="88.3368" y="243.4783" font-size="18.087" font-weight="bold" fill="#28a745">2. SCALABLE OVERSIGHT</ns0:text>
  <ns0:text x="123.6715" y="271.3043" font-size="15.3043" fill="#333">How to supervise AI systems smarter than us.</ns0:text>
  <ns0:text x="123.6715" y="294.9565" font-size="15.3043" fill="#555">Debate: AI models argue both sides, human judges | Recursive reward modeling</ns0:text>
  <ns0:rect x="53.002" y="320" width="1130.7108" height="97.3913" rx="6.9565" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7826" />
  <ns0:text x="88.3368" y="354.7826" font-size="18.087" font-weight="bold" fill="#856404">3. ROBUSTNESS</ns0:text>
  <ns0:text x="123.6715" y="382.6087" font-size="15.3043" fill="#333">Models that work reliably in adversarial conditions.</ns0:text>
  <ns0:text x="123.6715" y="406.2609" font-size="15.3043" fill="#555">Adversarial training for jailbreak resistance | Formal verification of safety properties</ns0:text>
  <ns0:rect x="53.002" y="431.3043" width="1130.7108" height="97.3913" rx="6.9565" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7826" />
  <ns0:text x="88.3368" y="466.087" font-size="18.087" font-weight="bold" fill="#dc3545">4. ALIGNMENT TAX</ns0:text>
  <ns0:text x="123.6715" y="493.913" font-size="15.3043" fill="#333">Can we make models safer WITHOUT making them worse?</ns0:text>
  <ns0:text x="123.6715" y="517.5652" font-size="15.3043" fill="#555">Current evidence: alignment improves helpfulness</ns0:text>
  <ns0:rect x="53.002" y="542.6087" width="1130.7108" height="97.3913" rx="6.9565" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7826" />
  <ns0:text x="88.3368" y="577.3913" font-size="18.087" font-weight="bold" fill="#4a90e2">5. MULTI-AGENT SAFETY</ns0:text>
  <ns0:text x="123.6715" y="605.2174" font-size="15.3043" fill="#333">Safety when multiple AI agents interact.</ns0:text>
  <ns0:text x="123.6715" y="628.8696" font-size="15.3043" fill="#555">Emergent behaviors in agent systems | Coordination problems and race conditions</ns0:text>
</ns0:svg>
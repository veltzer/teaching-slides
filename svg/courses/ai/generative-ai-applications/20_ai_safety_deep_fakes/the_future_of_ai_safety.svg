<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.4026" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The Future of AI Safety</text>
  <text x="640.0001" y="69.6744" text-anchor="middle" font-size="18.3464" fill="var(--text-muted)" font-family="Arial, sans-serif">Emerging Safety Research Areas</text>
  <rect x="40" y="93.9535" width="1200" height="94.4186" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="127.6744" font-size="18.3464" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. MECHANISTIC INTERPRETABILITY</text>
  <text x="115.0001" y="154.6512" font-size="15.5238" fill="var(--text)" font-family="Arial, sans-serif">Understanding what happens inside the model. "Why did the model produce this output?"</text>
  <text x="115.0001" y="177.5814" font-size="15.5238" fill="var(--text-muted)" font-family="Arial, sans-serif">Tools: activation patching, probing classifiers</text>
  <rect x="40" y="201.8605" width="1200" height="94.4186" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="235.5815" font-size="18.3464" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. SCALABLE OVERSIGHT</text>
  <text x="115.0001" y="262.5581" font-size="15.5238" fill="var(--text)" font-family="Arial, sans-serif">How to supervise AI systems smarter than us.</text>
  <text x="115.0001" y="285.4884" font-size="15.5238" fill="var(--text-muted)" font-family="Arial, sans-serif">Debate: AI models argue both sides, human judges | Recursive reward modeling</text>
  <rect x="40" y="309.7675" width="1200" height="94.4186" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="343.4884" font-size="18.3464" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. ROBUSTNESS</text>
  <text x="115.0001" y="370.4651" font-size="15.5238" fill="var(--text)" font-family="Arial, sans-serif">Models that work reliably in adversarial conditions.</text>
  <text x="115.0001" y="393.3954" font-size="15.5238" fill="var(--text-muted)" font-family="Arial, sans-serif">Adversarial training for jailbreak resistance | Formal verification of safety properties</text>
  <rect x="40" y="417.6744" width="1200" height="94.4186" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="451.3954" font-size="18.3464" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">4. ALIGNMENT TAX</text>
  <text x="115.0001" y="478.3721" font-size="15.5238" fill="var(--text)" font-family="Arial, sans-serif">Can we make models safer WITHOUT making them worse?</text>
  <text x="115.0001" y="501.3023" font-size="15.5238" fill="var(--text-muted)" font-family="Arial, sans-serif">Current evidence: alignment improves helpfulness</text>
  <rect x="40" y="525.5814" width="1200" height="94.4186" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="559.3023" font-size="18.3464" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">5. MULTI-AGENT SAFETY</text>
  <text x="115.0001" y="586.2791" font-size="15.5238" fill="var(--text)" font-family="Arial, sans-serif">Safety when multiple AI agents interact.</text>
  <text x="115.0001" y="609.2093" font-size="15.5238" fill="var(--text-muted)" font-family="Arial, sans-serif">Emergent behaviors in agent systems | Coordination problems and race conditions</text>
</svg>
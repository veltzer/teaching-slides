<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="618.3575" y="41.7391" text-anchor="middle" font-size="25.0435" font-weight="bold" fill="var(--text)">The Future of AI Safety</text>
  <text x="618.3575" y="72.3478" text-anchor="middle" font-size="18.087" fill="var(--text-muted)">Emerging Safety Research Areas</text>
  <rect x="53.002" y="97.3913" width="1130.7108" height="97.3913" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="88.3368" y="132.1739" font-size="18.087" font-weight="bold" fill="var(--primary-accent)">1. MECHANISTIC INTERPRETABILITY</text>
  <text x="123.6715" y="160" font-size="15.3043" fill="var(--text)">Understanding what happens inside the model. "Why did the model produce this output?"</text>
  <text x="123.6715" y="183.6522" font-size="15.3043" fill="var(--text-muted)">Tools: activation patching, probing classifiers</text>
  <rect x="53.002" y="208.6957" width="1130.7108" height="97.3913" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="88.3368" y="243.4783" font-size="18.087" font-weight="bold" fill="var(--ok-accent)">2. SCALABLE OVERSIGHT</text>
  <text x="123.6715" y="271.3043" font-size="15.3043" fill="var(--text)">How to supervise AI systems smarter than us.</text>
  <text x="123.6715" y="294.9565" font-size="15.3043" fill="var(--text-muted)">Debate: AI models argue both sides, human judges | Recursive reward modeling</text>
  <rect x="53.002" y="320" width="1130.7108" height="97.3913" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="88.3368" y="354.7826" font-size="18.087" font-weight="bold" fill="var(--danger-accent)">3. ROBUSTNESS</text>
  <text x="123.6715" y="382.6087" font-size="15.3043" fill="var(--text)">Models that work reliably in adversarial conditions.</text>
  <text x="123.6715" y="406.2609" font-size="15.3043" fill="var(--text-muted)">Adversarial training for jailbreak resistance | Formal verification of safety properties</text>
  <rect x="53.002" y="431.3043" width="1130.7108" height="97.3913" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="88.3368" y="466.087" font-size="18.087" font-weight="bold" fill="var(--danger-accent)">4. ALIGNMENT TAX</text>
  <text x="123.6715" y="493.913" font-size="15.3043" fill="var(--text)">Can we make models safer WITHOUT making them worse?</text>
  <text x="123.6715" y="517.5652" font-size="15.3043" fill="var(--text-muted)">Current evidence: alignment improves helpfulness</text>
  <rect x="53.002" y="542.6087" width="1130.7108" height="97.3913" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="88.3368" y="577.3913" font-size="18.087" font-weight="bold" fill="var(--primary-accent)">5. MULTI-AGENT SAFETY</text>
  <text x="123.6715" y="605.2174" font-size="15.3043" fill="var(--text)">Safety when multiple AI agents interact.</text>
  <text x="123.6715" y="628.8696" font-size="15.3043" fill="var(--text-muted)">Emergent behaviors in agent systems | Coordination problems and race conditions</text>
</svg>
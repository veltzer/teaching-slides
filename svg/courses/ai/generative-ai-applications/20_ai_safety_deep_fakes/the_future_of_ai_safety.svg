<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.424811740757" font-weight="bold" fill="var(--text)">Future of AI Safety</text>
  <text x="640" y="65.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283207827171" fill="var(--text-muted)">Emerging research areas</text>

  <rect x="40" y="86.607142857143" width="1200" height="98.392857142857" rx="6.106202935189" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="120.785714285714" font-family="Arial, sans-serif" font-size="17.30090831637" font-weight="bold" fill="var(--primary-text)">1. Mechanistic Interpretability</text>
  <text x="115" y="148.75" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--primary-text)">What happens inside the model?</text>
  <text x="115" y="172.571428571429" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--primary-text)">Activation patching, probing</text>

  <rect x="40" y="195.357142857143" width="1200" height="98.392857142857" rx="6.106202935189" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="229.535714285714" font-family="Arial, sans-serif" font-size="17.30090831637" font-weight="bold" fill="var(--ok-text)">2. Scalable Oversight</text>
  <text x="115" y="257.5" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--ok-text)">Supervise smarter models</text>
  <text x="115" y="281.321428571429" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--ok-text)">Debate, recursive rewards</text>

  <rect x="40" y="304.107142857143" width="1200" height="98.392857142857" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="338.285714285714" font-family="Arial, sans-serif" font-size="17.30090831637" font-weight="bold" fill="var(--warn-text)">3. Robustness</text>
  <text x="115" y="366.25" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">Adversarial jailbreak resistance</text>
  <text x="115" y="390.071428571429" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">Formal verification</text>

  <rect x="40" y="412.857142857143" width="1200" height="98.392857142857" rx="6.106202935189" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="447.035714285714" font-family="Arial, sans-serif" font-size="17.30090831637" font-weight="bold" fill="var(--danger-text)">4. Alignment Tax</text>
  <text x="115" y="475" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--danger-text)">Safer without weaker?</text>
  <text x="115" y="498.821428571429" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--danger-text)">Alignment often helps</text>

  <rect x="40" y="521.607142857143" width="1200" height="98.392857142857" rx="6.106202935189" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="555.785714285714" font-family="Arial, sans-serif" font-size="17.30090831637" font-weight="bold" fill="var(--info-text)">5. Multi-Agent Safety</text>
  <text x="115" y="583.75" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--info-text)">Agent interactions</text>
  <text x="115" y="607.571428571429" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--info-text)">Emergent races</text>
</svg>

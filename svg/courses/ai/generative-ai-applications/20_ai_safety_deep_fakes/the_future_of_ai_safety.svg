<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">The Future of AI Safety</text>
  <text x="350" y="52" text-anchor="middle" font-size="13" fill="#666">Emerging Safety Research Areas</text>
  <!-- 1. Mechanistic Interpretability -->
  <rect x="30" y="70" width="640" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="95" font-size="13" font-weight="bold" fill="#4a90e2">1. MECHANISTIC INTERPRETABILITY</text>
  <text x="70" y="115" font-size="11" fill="#333">Understanding what happens inside the model. "Why did the model produce this output?"</text>
  <text x="70" y="132" font-size="11" fill="#555">Tools: activation patching, probing classifiers</text>
  <!-- 2. Scalable Oversight -->
  <rect x="30" y="150" width="640" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="50" y="175" font-size="13" font-weight="bold" fill="#28a745">2. SCALABLE OVERSIGHT</text>
  <text x="70" y="195" font-size="11" fill="#333">How to supervise AI systems smarter than us.</text>
  <text x="70" y="212" font-size="11" fill="#555">Debate: AI models argue both sides, human judges | Recursive reward modeling</text>
  <!-- 3. Robustness -->
  <rect x="30" y="230" width="640" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="50" y="255" font-size="13" font-weight="bold" fill="#856404">3. ROBUSTNESS</text>
  <text x="70" y="275" font-size="11" fill="#333">Models that work reliably in adversarial conditions.</text>
  <text x="70" y="292" font-size="11" fill="#555">Adversarial training for jailbreak resistance | Formal verification of safety properties</text>
  <!-- 4. Alignment Tax -->
  <rect x="30" y="310" width="640" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="50" y="335" font-size="13" font-weight="bold" fill="#dc3545">4. ALIGNMENT TAX</text>
  <text x="70" y="355" font-size="11" fill="#333">Can we make models safer WITHOUT making them worse?</text>
  <text x="70" y="372" font-size="11" fill="#555">Current evidence: alignment improves helpfulness</text>
  <!-- 5. Multi-Agent Safety -->
  <rect x="30" y="390" width="640" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="415" font-size="13" font-weight="bold" fill="#4a90e2">5. MULTI-AGENT SAFETY</text>
  <text x="70" y="435" font-size="11" fill="#333">Safety when multiple AI agents interact.</text>
  <text x="70" y="452" font-size="11" fill="#555">Emergent behaviors in agent systems | Coordination problems and race conditions</text>
</svg>
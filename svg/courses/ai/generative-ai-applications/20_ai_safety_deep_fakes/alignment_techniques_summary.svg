<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="632.0988" y="71.1111" text-anchor="middle" font-size="32.508" font-weight="bold" fill="var(--text)">Alignment Techniques Summary</text>
  <text x="632.0988" y="130.3704" text-anchor="middle" font-size="23.4779" fill="var(--text-muted)">The alignment spectrum</text>
  <rect x="144.4797" y="189.6296" width="975.2381" height="118.5185" rx="6" fill="url(#spectrum)" stroke="var(--text)" stroke-width="1.806" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="spectrum" x1="0%" y1="0%" x2="182.8571%" y2="0%">
      <stop offset="0%" style="stop-color:#f8d7da" />
      <stop offset="50%" style="stop-color:#d4edda" />
      <stop offset="100%" style="stop-color:#fff3cd" />
    </linearGradient>
  </defs>
  <text x="216.7196" y="260.7407" text-anchor="middle" font-size="23.4779" font-weight="bold" fill="var(--danger-accent)">Helpful</text>
  <text x="1047.4779" y="260.7407" text-anchor="middle" font-size="23.4779" font-weight="bold" fill="var(--warn-accent)">Harmless</text>
  <rect x="469.5591" y="343.7037" width="325.0794" height="94.8148" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="632.0988" y="402.963" text-anchor="middle" font-size="23.4779" font-weight="bold" fill="var(--ok-accent)">Sweet Spot (Aligned)</text>
  <line x1="632.0988" y1="308.1481" x2="632.0988" y2="343.7037" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="72.2399" y="474.0741" width="361.1993" height="165.9259" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="252.8395" y="533.3333" text-anchor="middle" font-size="23.4779" font-weight="bold" fill="var(--danger-accent)">Too Eager to Help</text>
  <text x="252.8395" y="592.5926" text-anchor="middle" font-size="19.866" fill="var(--text-muted)">May produce harmful</text>
  <text x="252.8395" y="628.1481" text-anchor="middle" font-size="19.866" fill="var(--text-muted)">content unchecked</text>
  <rect x="830.7584" y="474.0741" width="361.1993" height="165.9259" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1011.358" y="533.3333" text-anchor="middle" font-size="23.4779" font-weight="bold" fill="var(--danger-accent)">Too Cautious</text>
  <text x="1011.358" y="592.5926" text-anchor="middle" font-size="19.866" fill="var(--text-muted)">Refuses too much,</text>
  <text x="1011.358" y="628.1481" text-anchor="middle" font-size="19.866" fill="var(--text-muted)">not useful</text>
</svg>
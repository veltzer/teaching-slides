<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Alignment Techniques Summary</text>
  <text x="350" y="55" text-anchor="middle" font-size="13" fill="#666">The alignment spectrum</text>
  <!-- Spectrum bar -->
  <rect x="80" y="80" width="540" height="50" rx="5" fill="url(#spectrum)" stroke="#333" stroke-width="1"/>
  <defs>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f8d7da"/>
      <stop offset="50%" style="stop-color:#d4edda"/>
      <stop offset="100%" style="stop-color:#fff3cd"/>
    </linearGradient>
  </defs>
  <!-- Labels on spectrum -->
  <text x="120" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Helpful</text>
  <text x="580" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffc107">Harmless</text>
  <!-- Sweet spot -->
  <rect x="260" y="145" width="180" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Sweet Spot (Aligned)</text>
  <line x1="350" y1="130" x2="350" y2="145" stroke="#28a745" stroke-width="2"/>
  <!-- Too eager -->
  <rect x="40" y="200" width="200" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="140" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Too Eager to Help</text>
  <text x="140" y="250" text-anchor="middle" font-size="11" fill="#555">May produce harmful</text>
  <text x="140" y="265" text-anchor="middle" font-size="11" fill="#555">content unchecked</text>
  <!-- Too cautious -->
  <rect x="460" y="200" width="200" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="560" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">Too Cautious</text>
  <text x="560" y="250" text-anchor="middle" font-size="11" fill="#555">Refuses too much,</text>
  <text x="560" y="265" text-anchor="middle" font-size="11" fill="#555">not useful</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="72" text-anchor="middle" font-size="32.9143" font-weight="bold" fill="#333">Alignment Techniques Summary</text>
  <text x="640" y="132" text-anchor="middle" font-size="23.7714" fill="#666">The alignment spectrum</text>
  <rect x="146.2857" y="192" width="987.4286" height="120" rx="9.1429" fill="url(#spectrum)" stroke="#333" stroke-width="1.8286" />
  <defs>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="182.8571%" y2="0%">
      <stop offset="0%" style="stop-color:#f8d7da" />
      <stop offset="50%" style="stop-color:#d4edda" />
      <stop offset="100%" style="stop-color:#fff3cd" />
    </linearGradient>
  </defs>
  <text x="219.4286" y="264" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#dc3545">Helpful</text>
  <text x="1060.5714" y="264" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#ffc107">Harmless</text>
  <rect x="475.4286" y="348" width="329.1429" height="96" rx="9.1429" fill="#d4edda" stroke="#28a745" stroke-width="3.6571" />
  <text x="640" y="408" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#28a745">Sweet Spot (Aligned)</text>
  <line x1="640" y1="312" x2="640" y2="348" stroke="#28a745" stroke-width="3.6571" />
  <rect x="73.1429" y="480" width="365.7143" height="168" rx="9.1429" fill="#f8d7da" stroke="#dc3545" stroke-width="3.6571" />
  <text x="256" y="540" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#dc3545">Too Eager to Help</text>
  <text x="256" y="600" text-anchor="middle" font-size="20.1143" fill="#555">May produce harmful</text>
  <text x="256" y="636" text-anchor="middle" font-size="20.1143" fill="#555">content unchecked</text>
  <rect x="841.1429" y="480" width="365.7143" height="168" rx="9.1429" fill="#fff3cd" stroke="#ffc107" stroke-width="3.6571" />
  <text x="1024" y="540" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="#856404">Too Cautious</text>
  <text x="1024" y="600" text-anchor="middle" font-size="20.1143" fill="#555">Refuses too much,</text>
  <text x="1024" y="636" text-anchor="middle" font-size="20.1143" fill="#555">not useful</text>
</svg>
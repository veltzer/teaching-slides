<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="33.9803" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Alignment Techniques Summary</text>
  <text x="640" y="100.4167" text-anchor="middle" font-size="24.5412" fill="var(--text-muted)" font-family="Arial, sans-serif">The alignment spectrum</text>
  <rect x="117.4193" y="160.8333" width="1045.1613" height="120.8333" rx="6" fill="url(#spectrum)" stroke="var(--text)" stroke-width="1.806"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="194.8387" y="233.3333" text-anchor="middle" font-size="24.5412" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Helpful</text>
  <text x="1085.1612" y="233.3333" text-anchor="middle" font-size="24.5412" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Harmless</text>
  <rect x="465.8064" y="317.9167" width="348.3871" height="96.6666" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="378.3334" text-anchor="middle" font-size="24.5412" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Sweet Spot (Aligned)</text>
  <line x1="640" y1="281.6666" x2="640" y2="317.9167" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="40" y="450.8334" width="387.0968" height="169.1666" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.5483" y="511.25" text-anchor="middle" font-size="24.5412" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Too Eager to Help</text>
  <text x="233.5483" y="571.6667" text-anchor="middle" font-size="20.7657" fill="var(--text-muted)" font-family="Arial, sans-serif">May produce harmful</text>
  <text x="233.5483" y="607.9166" text-anchor="middle" font-size="20.7657" fill="var(--text-muted)" font-family="Arial, sans-serif">content unchecked</text>
  <rect x="852.9032" y="450.8334" width="387.0968" height="169.1666" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.4516" y="511.25" text-anchor="middle" font-size="24.5412" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Too Cautious</text>
  <text x="1046.4516" y="571.6667" text-anchor="middle" font-size="20.7657" fill="var(--text-muted)" font-family="Arial, sans-serif">Refuses too much,</text>
  <text x="1046.4516" y="607.9166" text-anchor="middle" font-size="20.7657" fill="var(--text-muted)" font-family="Arial, sans-serif">not useful</text>
</svg>

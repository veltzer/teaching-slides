<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="33.9803" font-weight="bold" fill="var(--text)">Alignment Techniques Summary</text>
  <text x="640" y="100.4167" text-anchor="middle" font-size="24.5412" fill="var(--text-muted)">The alignment spectrum</text>
  <rect x="117.4193" y="160.8333" width="1045.1613" height="120.8333" rx="6" fill="url(#spectrum)" stroke="var(--text)" stroke-width="1.806" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="spectrum" x1="0%" y1="0%" x2="182.8571%" y2="0%">
      <stop offset="0%" style="stop-color:#f8d7da" />
      <stop offset="50%" style="stop-color:#d4edda" />
      <stop offset="100%" style="stop-color:#fff3cd" />
    </linearGradient>
  </defs>
  <text x="194.8387" y="233.3333" text-anchor="middle" font-size="24.5412" font-weight="bold" fill="var(--danger-accent)">Helpful</text>
  <text x="1085.1612" y="233.3333" text-anchor="middle" font-size="24.5412" font-weight="bold" fill="var(--warn-accent)">Harmless</text>
  <rect x="465.8064" y="317.9167" width="348.3871" height="96.6666" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="378.3334" text-anchor="middle" font-size="24.5412" font-weight="bold" fill="var(--ok-accent)">Sweet Spot (Aligned)</text>
  <line x1="640" y1="281.6666" x2="640" y2="317.9167" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="40" y="450.8334" width="387.0968" height="169.1666" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.5483" y="511.25" text-anchor="middle" font-size="24.5412" font-weight="bold" fill="var(--danger-accent)">Too Eager to Help</text>
  <text x="233.5483" y="571.6667" text-anchor="middle" font-size="20.7657" fill="var(--text-muted)">May produce harmful</text>
  <text x="233.5483" y="607.9166" text-anchor="middle" font-size="20.7657" fill="var(--text-muted)">content unchecked</text>
  <rect x="852.9032" y="450.8334" width="387.0968" height="169.1666" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.4516" y="511.25" text-anchor="middle" font-size="24.5412" font-weight="bold" fill="var(--danger-accent)">Too Cautious</text>
  <text x="1046.4516" y="571.6667" text-anchor="middle" font-size="20.7657" fill="var(--text-muted)">Refuses too much,</text>
  <text x="1046.4516" y="607.9166" text-anchor="middle" font-size="20.7657" fill="var(--text-muted)">not useful</text>
</svg>
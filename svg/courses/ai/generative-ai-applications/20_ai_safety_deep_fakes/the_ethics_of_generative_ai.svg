<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="27.0222" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The Ethics of Generative AI</text>
  <text x="640.0001" y="73.5789" text-anchor="middle" font-size="18.0148" fill="var(--text-muted)" font-family="Arial, sans-serif">Key ethical questions for practitioners</text>
  <rect x="40" y="101.0526" width="581.25" height="122.1053" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="139.2105" font-size="19.516" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. TRANSPARENCY</text>
  <text x="77.5001" y="169.7368" font-size="16.5136" fill="var(--text)" font-family="Arial, sans-serif">Should users always know they're</text>
  <text x="77.5001" y="195.6842" font-size="16.5136" fill="var(--text)" font-family="Arial, sans-serif">interacting with AI? Most say yes.</text>
  <rect x="658.75" y="101.0526" width="581.25" height="122.1053" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="696.25" y="139.2105" font-size="19.516" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. ATTRIBUTION</text>
  <text x="696.25" y="169.7368" font-size="16.5136" fill="var(--text)" font-family="Arial, sans-serif">Who owns AI-generated content?</text>
  <text x="696.25" y="195.6842" font-size="16.5136" fill="var(--text)" font-family="Arial, sans-serif">Legal frameworks still evolving.</text>
  <rect x="40" y="246.0526" width="581.25" height="122.1053" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="284.2105" font-size="19.516" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. CONSENT</text>
  <text x="77.5001" y="314.7368" font-size="16.5136" fill="var(--text)" font-family="Arial, sans-serif">Was training data collected with consent?</text>
  <text x="77.5001" y="340.6842" font-size="16.5136" fill="var(--text)" font-family="Arial, sans-serif">Major ongoing legal battles.</text>
  <rect x="658.75" y="246.0526" width="581.25" height="122.1053" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="696.25" y="284.2105" font-size="19.516" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">4. DISPLACEMENT</text>
  <text x="696.25" y="314.7368" font-size="16.5136" fill="var(--text)" font-family="Arial, sans-serif">What responsibility to affected workers?</text>
  <text x="696.25" y="340.6842" font-size="16.5136" fill="var(--text)" font-family="Arial, sans-serif">Active debate.</text>
  <rect x="40" y="391.0526" width="581.25" height="122.1053" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="429.2105" font-size="19.516" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">5. ACCESS</text>
  <text x="77.5001" y="459.7368" font-size="16.5136" fill="var(--text)" font-family="Arial, sans-serif">Should powerful AI be open source</text>
  <text x="77.5001" y="485.6842" font-size="16.5136" fill="var(--text)" font-family="Arial, sans-serif">or controlled? Strong arguments on both sides.</text>
  <rect x="658.75" y="391.0526" width="581.25" height="122.1053" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="696.25" y="429.2105" font-size="19.516" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">6. DUAL USE</text>
  <text x="696.25" y="459.7368" font-size="16.5136" fill="var(--text)" font-family="Arial, sans-serif">The same model can help or harm.</text>
  <text x="696.25" y="485.6842" font-size="16.5136" fill="var(--text)" font-family="Arial, sans-serif">How to enable beneficial use while preventing harm?</text>
  <rect x="133.75" y="551.3158" width="1012.5" height="68.6842" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="594.0526" text-anchor="middle" font-size="19.516" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">These aren't just philosophical - they're decisions we make every day.</text>
</svg>
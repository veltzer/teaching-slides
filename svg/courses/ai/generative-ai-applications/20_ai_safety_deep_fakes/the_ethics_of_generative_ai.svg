<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="43.2" text-anchor="middle" font-size="25.92" font-weight="bold" fill="#333">The Ethics of Generative AI</text>
  <text x="640" y="74.88" text-anchor="middle" font-size="17.28" fill="#666">Key ethical questions for practitioners</text>
  <rect x="54.8571" y="100.8" width="566.8571" height="115.2" rx="7.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.88" />
  <text x="91.4286" y="136.8" font-size="18.72" font-weight="bold" fill="#4a90e2">1. TRANSPARENCY</text>
  <text x="91.4286" y="165.6" font-size="15.84" fill="#333">Should users always know they're</text>
  <text x="91.4286" y="190.08" font-size="15.84" fill="#333">interacting with AI? Most say yes.</text>
  <rect x="658.2857" y="100.8" width="566.8571" height="115.2" rx="7.2" fill="#d4edda" stroke="#28a745" stroke-width="2.88" />
  <text x="694.8571" y="136.8" font-size="18.72" font-weight="bold" fill="#28a745">2. ATTRIBUTION</text>
  <text x="694.8571" y="165.6" font-size="15.84" fill="#333">Who owns AI-generated content?</text>
  <text x="694.8571" y="190.08" font-size="15.84" fill="#333">Legal frameworks still evolving.</text>
  <rect x="54.8571" y="237.6" width="566.8571" height="115.2" rx="7.2" fill="#fff3cd" stroke="#ffc107" stroke-width="2.88" />
  <text x="91.4286" y="273.6" font-size="18.72" font-weight="bold" fill="#856404">3. CONSENT</text>
  <text x="91.4286" y="302.4" font-size="15.84" fill="#333">Was training data collected with consent?</text>
  <text x="91.4286" y="326.88" font-size="15.84" fill="#333">Major ongoing legal battles.</text>
  <rect x="658.2857" y="237.6" width="566.8571" height="115.2" rx="7.2" fill="#f8d7da" stroke="#dc3545" stroke-width="2.88" />
  <text x="694.8571" y="273.6" font-size="18.72" font-weight="bold" fill="#dc3545">4. DISPLACEMENT</text>
  <text x="694.8571" y="302.4" font-size="15.84" fill="#333">What responsibility to affected workers?</text>
  <text x="694.8571" y="326.88" font-size="15.84" fill="#333">Active debate.</text>
  <rect x="54.8571" y="374.4" width="566.8571" height="115.2" rx="7.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.88" />
  <text x="91.4286" y="410.4" font-size="18.72" font-weight="bold" fill="#4a90e2">5. ACCESS</text>
  <text x="91.4286" y="439.2" font-size="15.84" fill="#333">Should powerful AI be open source</text>
  <text x="91.4286" y="463.68" font-size="15.84" fill="#333">or controlled? Strong arguments on both sides.</text>
  <rect x="658.2857" y="374.4" width="566.8571" height="115.2" rx="7.2" fill="#fff3cd" stroke="#ffc107" stroke-width="2.88" />
  <text x="694.8571" y="410.4" font-size="18.72" font-weight="bold" fill="#856404">6. DUAL USE</text>
  <text x="694.8571" y="439.2" font-size="15.84" fill="#333">The same model can help or harm.</text>
  <text x="694.8571" y="463.68" font-size="15.84" fill="#333">How to enable beneficial use while preventing harm?</text>
  <rect x="146.2857" y="525.6" width="987.4286" height="64.8" rx="7.2" fill="#d4edda" stroke="#28a745" stroke-width="2.88" />
  <text x="640" y="565.92" text-anchor="middle" font-size="18.72" font-weight="bold" fill="#333">These aren't just philosophical - they're decisions we make every day.</text>
</svg>
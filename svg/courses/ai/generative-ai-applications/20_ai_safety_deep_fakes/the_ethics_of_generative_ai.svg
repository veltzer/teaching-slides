<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="27.0222" font-weight="bold" fill="var(--text)">The Ethics of Generative AI</text>
  <text x="640.0001" y="73.5789" text-anchor="middle" font-size="18.0148" fill="var(--text-muted)">Key ethical questions for practitioners</text>
  <rect x="40" y="101.0526" width="581.25" height="122.1053" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="139.2105" font-size="19.516" font-weight="bold" fill="var(--primary-accent)">1. TRANSPARENCY</text>
  <text x="77.5001" y="169.7368" font-size="16.5136" fill="var(--text)">Should users always know they're</text>
  <text x="77.5001" y="195.6842" font-size="16.5136" fill="var(--text)">interacting with AI? Most say yes.</text>
  <rect x="658.75" y="101.0526" width="581.25" height="122.1053" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="696.25" y="139.2105" font-size="19.516" font-weight="bold" fill="var(--ok-accent)">2. ATTRIBUTION</text>
  <text x="696.25" y="169.7368" font-size="16.5136" fill="var(--text)">Who owns AI-generated content?</text>
  <text x="696.25" y="195.6842" font-size="16.5136" fill="var(--text)">Legal frameworks still evolving.</text>
  <rect x="40" y="246.0526" width="581.25" height="122.1053" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="284.2105" font-size="19.516" font-weight="bold" fill="var(--danger-accent)">3. CONSENT</text>
  <text x="77.5001" y="314.7368" font-size="16.5136" fill="var(--text)">Was training data collected with consent?</text>
  <text x="77.5001" y="340.6842" font-size="16.5136" fill="var(--text)">Major ongoing legal battles.</text>
  <rect x="658.75" y="246.0526" width="581.25" height="122.1053" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="696.25" y="284.2105" font-size="19.516" font-weight="bold" fill="var(--danger-accent)">4. DISPLACEMENT</text>
  <text x="696.25" y="314.7368" font-size="16.5136" fill="var(--text)">What responsibility to affected workers?</text>
  <text x="696.25" y="340.6842" font-size="16.5136" fill="var(--text)">Active debate.</text>
  <rect x="40" y="391.0526" width="581.25" height="122.1053" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="429.2105" font-size="19.516" font-weight="bold" fill="var(--primary-accent)">5. ACCESS</text>
  <text x="77.5001" y="459.7368" font-size="16.5136" fill="var(--text)">Should powerful AI be open source</text>
  <text x="77.5001" y="485.6842" font-size="16.5136" fill="var(--text)">or controlled? Strong arguments on both sides.</text>
  <rect x="658.75" y="391.0526" width="581.25" height="122.1053" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="696.25" y="429.2105" font-size="19.516" font-weight="bold" fill="var(--danger-accent)">6. DUAL USE</text>
  <text x="696.25" y="459.7368" font-size="16.5136" fill="var(--text)">The same model can help or harm.</text>
  <text x="696.25" y="485.6842" font-size="16.5136" fill="var(--text)">How to enable beneficial use while preventing harm?</text>
  <rect x="133.75" y="551.3158" width="1012.5" height="68.6842" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="594.0526" text-anchor="middle" font-size="19.516" font-weight="bold" fill="var(--text)">These aren't just philosophical - they're decisions we make every day.</text>
</svg>
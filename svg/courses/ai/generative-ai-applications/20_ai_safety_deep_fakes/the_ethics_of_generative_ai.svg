<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">The Ethics of Generative AI</text>
  <text x="350" y="52" text-anchor="middle" font-size="12" fill="#666">Key ethical questions for practitioners</text>
  <!-- Questions -->
  <rect x="30" y="70" width="310" height="80" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="95" font-size="13" font-weight="bold" fill="#4a90e2">1. TRANSPARENCY</text>
  <text x="50" y="115" font-size="11" fill="#333">Should users always know they're</text>
  <text x="50" y="132" font-size="11" fill="#333">interacting with AI? Most say yes.</text>

  <rect x="360" y="70" width="310" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="380" y="95" font-size="13" font-weight="bold" fill="#28a745">2. ATTRIBUTION</text>
  <text x="380" y="115" font-size="11" fill="#333">Who owns AI-generated content?</text>
  <text x="380" y="132" font-size="11" fill="#333">Legal frameworks still evolving.</text>

  <rect x="30" y="165" width="310" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="50" y="190" font-size="13" font-weight="bold" fill="#856404">3. CONSENT</text>
  <text x="50" y="210" font-size="11" fill="#333">Was training data collected with consent?</text>
  <text x="50" y="227" font-size="11" fill="#333">Major ongoing legal battles.</text>

  <rect x="360" y="165" width="310" height="80" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="380" y="190" font-size="13" font-weight="bold" fill="#dc3545">4. DISPLACEMENT</text>
  <text x="380" y="210" font-size="11" fill="#333">What responsibility to affected workers?</text>
  <text x="380" y="227" font-size="11" fill="#333">Active debate.</text>

  <rect x="30" y="260" width="310" height="80" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="285" font-size="13" font-weight="bold" fill="#4a90e2">5. ACCESS</text>
  <text x="50" y="305" font-size="11" fill="#333">Should powerful AI be open source</text>
  <text x="50" y="322" font-size="11" fill="#333">or controlled? Strong arguments on both sides.</text>

  <rect x="360" y="260" width="310" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="380" y="285" font-size="13" font-weight="bold" fill="#856404">6. DUAL USE</text>
  <text x="380" y="305" font-size="11" fill="#333">The same model can help or harm.</text>
  <text x="380" y="322" font-size="11" fill="#333">How to enable beneficial use while preventing harm?</text>

  <!-- Bottom note -->
  <rect x="80" y="365" width="540" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">These aren't just philosophical - they're decisions we make every day.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="88.3334" text-anchor="middle" font-size="26.5708" font-weight="bold" fill="var(--text)">AI Safety Evaluation Benchmarks</text>
  <rect x="74.2857" y="115.9524" width="257.1429" height="41.4286" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="202.8571" y="143.5714" text-anchor="middle" font-size="17.7139" font-weight="bold" fill="var(--bg)">Benchmark</text>
  <rect x="340" y="115.9524" width="857.1429" height="41.4286" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="768.5714" y="143.5714" text-anchor="middle" font-size="17.7139" font-weight="bold" fill="var(--bg)">Description</text>
  <rect x="74.2857" y="164.2858" width="257.1429" height="75.9524" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="202.8571" y="208.4762" text-anchor="middle" font-size="17.7139" font-weight="bold" fill="var(--text)">TruthfulQA</text>
  <rect x="340" y="164.2858" width="857.1429" height="75.9524" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="365.7143" y="194.6667" font-size="16.2377" fill="var(--text)">Tests resistance to common misconceptions and false claims</text>
  <text x="365.7143" y="222.2857" font-size="16.2377" fill="var(--text-muted)">817 questions across 38 categories</text>
  <rect x="74.2857" y="247.1429" width="257.1429" height="75.9524" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="202.8571" y="291.3334" text-anchor="middle" font-size="17.7139" font-weight="bold" fill="var(--text)">BBQ</text>
  <rect x="340" y="247.1429" width="857.1429" height="75.9524" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="365.7143" y="277.5239" font-size="16.2377" fill="var(--text)">Bias Benchmark for QA - Tests for social biases in Q&amp;A</text>
  <text x="365.7143" y="305.1429" font-size="16.2377" fill="var(--text-muted)">58,492 examples, 9 social categories</text>
  <rect x="74.2857" y="330" width="257.1429" height="75.9524" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="202.8571" y="364.5239" text-anchor="middle" font-size="17.7139" font-weight="bold" fill="var(--text)">RealToxicity</text>
  <text x="202.8571" y="385.2381" text-anchor="middle" font-size="14.7615" fill="var(--text-muted)">Prompts</text>
  <rect x="340" y="330" width="857.1429" height="75.9524" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="365.7143" y="360.381" font-size="16.2377" fill="var(--text)">Measures toxic text generation</text>
  <text x="365.7143" y="388" font-size="16.2377" fill="var(--text-muted)">100K naturally occurring prompts, evaluates toxicity of continuations</text>
  <rect x="74.2857" y="412.8572" width="257.1429" height="75.9524" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="202.8571" y="457.0477" text-anchor="middle" font-size="17.7139" font-weight="bold" fill="var(--text)">WinoBias</text>
  <rect x="340" y="412.8572" width="857.1429" height="75.9524" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="365.7143" y="443.2381" font-size="16.2377" fill="var(--text)">Gender bias in coreference resolution</text>
  <text x="365.7143" y="470.8572" font-size="16.2377" fill="var(--text-muted)">"The nurse examined the patient. She/He was very thorough."</text>
  <rect x="74.2857" y="495.7143" width="257.1429" height="75.9524" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="202.8571" y="539.9048" text-anchor="middle" font-size="17.7139" font-weight="bold" fill="var(--text)">HarmBench</text>
  <rect x="340" y="495.7143" width="857.1429" height="75.9524" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="365.7143" y="526.0952" font-size="16.2377" fill="var(--text)">Comprehensive harmful behavior testing</text>
  <text x="365.7143" y="553.7143" font-size="16.2377" fill="var(--text-muted)">400+ test cases across harm categories</text>
</svg>
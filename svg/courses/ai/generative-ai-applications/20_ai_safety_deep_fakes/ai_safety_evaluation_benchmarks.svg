<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="16.17" y="14.8837" width="1131.8979" height="625.1163" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.1189" y="66.9768" text-anchor="middle" font-size="26.7907" font-weight="bold" fill="var(--text)">AI Safety Evaluation Benchmarks</text>
  <rect x="48.5099" y="96.7442" width="242.5496" height="44.6512" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="169.7847" y="126.5116" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--bg)">Benchmark</text>
  <rect x="299.1445" y="96.7442" width="808.4985" height="44.6512" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="703.3937" y="126.5116" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--bg)">Description</text>
  <rect x="48.5099" y="148.8373" width="242.5496" height="81.8605" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="169.7847" y="196.4651" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--text)">TruthfulQA</text>
  <rect x="299.1445" y="148.8373" width="808.4985" height="81.8605" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="323.3994" y="181.5814" font-size="16.3721" fill="var(--text)">Tests resistance to common misconceptions and false claims</text>
  <text x="323.3994" y="211.3488" font-size="16.3721" fill="var(--text-muted)">817 questions across 38 categories</text>
  <rect x="48.5099" y="238.1396" width="242.5496" height="81.8605" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="169.7847" y="285.7675" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--text)">BBQ</text>
  <rect x="299.1445" y="238.1396" width="808.4985" height="81.8605" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="323.3994" y="270.8838" font-size="16.3721" fill="var(--text)">Bias Benchmark for QA - Tests for social biases in Q&amp;A</text>
  <text x="323.3994" y="300.6512" font-size="16.3721" fill="var(--text-muted)">58,492 examples, 9 social categories</text>
  <rect x="48.5099" y="327.4419" width="242.5496" height="81.8605" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="169.7847" y="364.6512" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--text)">RealToxicity</text>
  <text x="169.7847" y="386.9767" text-anchor="middle" font-size="14.8837" fill="var(--text-muted)">Prompts</text>
  <rect x="299.1445" y="327.4419" width="808.4985" height="81.8605" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="323.3994" y="360.1861" font-size="16.3721" fill="var(--text)">Measures toxic text generation</text>
  <text x="323.3994" y="389.9535" font-size="16.3721" fill="var(--text-muted)">100K naturally occurring prompts, evaluates toxicity of continuations</text>
  <rect x="48.5099" y="416.7442" width="242.5496" height="81.8605" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.7847" y="464.3722" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--text)">WinoBias</text>
  <rect x="299.1445" y="416.7442" width="808.4985" height="81.8605" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="323.3994" y="449.4884" font-size="16.3721" fill="var(--text)">Gender bias in coreference resolution</text>
  <text x="323.3994" y="479.2559" font-size="16.3721" fill="var(--text-muted)">"The nurse examined the patient. She/He was very thorough."</text>
  <rect x="48.5099" y="506.0465" width="242.5496" height="81.8605" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="169.7847" y="553.6745" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--text)">HarmBench</text>
  <rect x="299.1445" y="506.0465" width="808.4985" height="81.8605" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="323.3994" y="538.7907" font-size="16.3721" fill="var(--text)">Comprehensive harmful behavior testing</text>
  <text x="323.3994" y="568.5582" font-size="16.3721" fill="var(--text-muted)">400+ test cases across harm categories</text>
</svg>
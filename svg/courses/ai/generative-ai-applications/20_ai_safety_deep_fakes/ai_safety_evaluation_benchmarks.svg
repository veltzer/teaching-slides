<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="700" height="420" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">AI Safety Evaluation Benchmarks</text>
  <!-- Header -->
  <rect x="30" y="65" width="150" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="105" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Benchmark</text>
  <rect x="185" y="65" width="500" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="435" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Description</text>
  <!-- TruthfulQA -->
  <rect x="30" y="100" width="150" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="105" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">TruthfulQA</text>
  <rect x="185" y="100" width="500" height="55" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="200" y="122" font-size="11" fill="#333">Tests resistance to common misconceptions and false claims</text>
  <text x="200" y="142" font-size="11" fill="#666">817 questions across 38 categories</text>
  <!-- BBQ -->
  <rect x="30" y="160" width="150" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="105" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">BBQ</text>
  <rect x="185" y="160" width="500" height="55" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="200" y="182" font-size="11" fill="#333">Bias Benchmark for QA - Tests for social biases in Q&amp;A</text>
  <text x="200" y="202" font-size="11" fill="#666">58,492 examples, 9 social categories</text>
  <!-- RealToxicity -->
  <rect x="30" y="220" width="150" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="105" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">RealToxicity</text>
  <text x="105" y="260" text-anchor="middle" font-size="10" fill="#666">Prompts</text>
  <rect x="185" y="220" width="500" height="55" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="200" y="242" font-size="11" fill="#333">Measures toxic text generation</text>
  <text x="200" y="262" font-size="11" fill="#666">100K naturally occurring prompts, evaluates toxicity of continuations</text>
  <!-- WinoBias -->
  <rect x="30" y="280" width="150" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="105" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">WinoBias</text>
  <rect x="185" y="280" width="500" height="55" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="200" y="302" font-size="11" fill="#333">Gender bias in coreference resolution</text>
  <text x="200" y="322" font-size="11" fill="#666">"The nurse examined the patient. She/He was very thorough."</text>
  <!-- HarmBench -->
  <rect x="30" y="340" width="150" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="105" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">HarmBench</text>
  <rect x="185" y="340" width="500" height="55" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="200" y="362" font-size="11" fill="#333">Comprehensive harmful behavior testing</text>
  <text x="200" y="382" font-size="11" fill="#666">400+ test cases across harm categories</text>
</svg>
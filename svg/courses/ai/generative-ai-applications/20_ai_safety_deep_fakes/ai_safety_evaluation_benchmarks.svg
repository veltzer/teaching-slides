<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="88.3334" text-anchor="middle" font-size="26.5708" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AI Safety Evaluation Benchmarks</text>
  <rect x="74.2857" y="115.9524" width="257.1429" height="41.4286" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.8571" y="143.5714" text-anchor="middle" font-size="17.7139" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Benchmark</text>
  <rect x="340" y="115.9524" width="857.1429" height="41.4286" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="768.5714" y="143.5714" text-anchor="middle" font-size="17.7139" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Description</text>
  <rect x="74.2857" y="164.2858" width="257.1429" height="75.9524" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.8571" y="208.4762" text-anchor="middle" font-size="17.7139" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">TruthfulQA</text>
  <rect x="340" y="164.2858" width="857.1429" height="75.9524" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="365.7143" y="194.6667" font-size="16.2377" fill="var(--text)" font-family="Arial, sans-serif">Tests resistance to common misconceptions and false claims</text>
  <text x="365.7143" y="222.2857" font-size="16.2377" fill="var(--text-muted)" font-family="Arial, sans-serif">817 questions across 38 categories</text>
  <rect x="74.2857" y="247.1429" width="257.1429" height="75.9524" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.8571" y="291.3334" text-anchor="middle" font-size="17.7139" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">BBQ</text>
  <rect x="340" y="247.1429" width="857.1429" height="75.9524" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="365.7143" y="277.5239" font-size="16.2377" fill="var(--text)" font-family="Arial, sans-serif">Bias Benchmark for QA - Tests for social biases in Q&amp;A</text>
  <text x="365.7143" y="305.1429" font-size="16.2377" fill="var(--text-muted)" font-family="Arial, sans-serif">58,492 examples, 9 social categories</text>
  <rect x="74.2857" y="330" width="257.1429" height="75.9524" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.8571" y="364.5239" text-anchor="middle" font-size="17.7139" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RealToxicity</text>
  <text x="202.8571" y="385.2381" text-anchor="middle" font-size="14.7615" fill="var(--text-muted)" font-family="Arial, sans-serif">Prompts</text>
  <rect x="340" y="330" width="857.1429" height="75.9524" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="365.7143" y="360.381" font-size="16.2377" fill="var(--text)" font-family="Arial, sans-serif">Measures toxic text generation</text>
  <text x="365.7143" y="388" font-size="16.2377" fill="var(--text-muted)" font-family="Arial, sans-serif">100K naturally occurring prompts, evaluates toxicity of continuations</text>
  <rect x="74.2857" y="412.8572" width="257.1429" height="75.9524" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.8571" y="457.0477" text-anchor="middle" font-size="17.7139" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">WinoBias</text>
  <rect x="340" y="412.8572" width="857.1429" height="75.9524" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="365.7143" y="443.2381" font-size="16.2377" fill="var(--text)" font-family="Arial, sans-serif">Gender bias in coreference resolution</text>
  <text x="365.7143" y="470.8572" font-size="16.2377" fill="var(--text-muted)" font-family="Arial, sans-serif">"The nurse examined the patient. She/He was very thorough."</text>
  <rect x="74.2857" y="495.7143" width="257.1429" height="75.9524" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.8571" y="539.9048" text-anchor="middle" font-size="17.7139" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">HarmBench</text>
  <rect x="340" y="495.7143" width="857.1429" height="75.9524" rx="6" fill="var(--bg)" stroke="var(--border)" />
  <text x="365.7143" y="526.0952" font-size="16.2377" fill="var(--text)" font-family="Arial, sans-serif">Comprehensive harmful behavior testing</text>
  <text x="365.7143" y="553.7143" font-size="16.2377" fill="var(--text-muted)" font-family="Arial, sans-serif">400+ test cases across harm categories</text>
</svg>
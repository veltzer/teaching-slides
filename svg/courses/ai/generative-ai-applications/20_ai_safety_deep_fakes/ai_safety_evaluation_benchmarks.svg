<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="644.580030301271" y="40" text-anchor="middle" font-size="30.090099747332" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AI Safety Evaluation Benchmarks</text>
  <rect x="40" y="73.142802285711" width="274.80919212167" height="49.714323428574" rx="6.794699387448" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.404542625723" y="106.285604571421" text-anchor="middle" font-size="20.060104246551" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Benchmark</text>
  <rect x="323.969466464658" y="73.142802285711" width="916.030533535342" height="49.714323428574" rx="6.794699387448" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="781.984679797217" y="106.285604571421" text-anchor="middle" font-size="20.060104246551" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Description</text>
  <rect x="40" y="131.142886285716" width="274.80919212167" height="91.142886285716" rx="6.794699387448" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.404542625723" y="184.171369942853" text-anchor="middle" font-size="20.060104246551" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">TruthfulQA</text>
  <rect x="323.969466464658" y="131.142886285716" width="916.030533535342" height="91.142886285716" rx="6.794699387448" fill="var(--bg)" stroke="var(--border)"/>
  <text x="351.450396363847" y="167.599968799998" font-size="18.38838170726" fill="var(--text)" font-family="Arial, sans-serif">Tests resistance to common misconceptions and false claims</text>
  <text x="351.450396363847" y="200.742771085708" font-size="18.38838170726" fill="var(--text-muted)" font-family="Arial, sans-serif">817 questions across 38 categories</text>
  <rect x="40" y="230.571413142856" width="274.80919212167" height="91.142886285716" rx="6.794699387448" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.404542625723" y="283.600016800001" text-anchor="middle" font-size="20.060104246551" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">BBQ</text>
  <rect x="323.969466464658" y="230.571413142856" width="916.030533535342" height="91.142886285716" rx="6.794699387448" fill="var(--bg)" stroke="var(--border)"/>
  <text x="351.450396363847" y="267.028615657146" font-size="18.38838170726" fill="var(--text)" font-family="Arial, sans-serif">Bias Benchmark for QA - Tests for social biases in Q&amp;A</text>
  <text x="351.450396363847" y="300.171417942856" font-size="18.38838170726" fill="var(--text-muted)" font-family="Arial, sans-serif">58,492 examples, 9 social categories</text>
  <rect x="40" y="329.999939999996" width="274.80919212167" height="91.142886285716" rx="6.794699387448" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.404542625723" y="371.428622857146" text-anchor="middle" font-size="20.060104246551" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RealToxicity</text>
  <text x="177.404542625723" y="396.285664571425" text-anchor="middle" font-size="16.716659167968" fill="var(--text-muted)" font-family="Arial, sans-serif">Prompts</text>
  <rect x="323.969466464658" y="329.999939999996" width="916.030533535342" height="91.142886285716" rx="6.794699387448" fill="var(--bg)" stroke="var(--border)"/>
  <text x="351.450396363847" y="366.457142514286" font-size="18.38838170726" fill="var(--text)" font-family="Arial, sans-serif">Measures toxic text generation</text>
  <text x="351.450396363847" y="399.599944799996" font-size="18.38838170726" fill="var(--text-muted)" font-family="Arial, sans-serif">100K naturally occurring prompts, evaluates toxicity of continuations</text>
  <rect x="40" y="429.428586857144" width="274.80919212167" height="91.142886285716" rx="6.794699387448" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.404542625723" y="482.457190514289" text-anchor="middle" font-size="20.060104246551" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">WinoBias</text>
  <rect x="323.969466464658" y="429.428586857144" width="916.030533535342" height="91.142886285716" rx="6.794699387448" fill="var(--bg)" stroke="var(--border)"/>
  <text x="351.450396363847" y="465.885669371425" font-size="18.38838170726" fill="var(--text)" font-family="Arial, sans-serif">Gender bias in coreference resolution</text>
  <text x="351.450396363847" y="499.028591657144" font-size="18.38838170726" fill="var(--text-muted)" font-family="Arial, sans-serif">"The nurse examined the patient. She/He was very thorough."</text>
  <rect x="40" y="528.857113714284" width="274.80919212167" height="91.142886285716" rx="6.794699387448" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.404542625723" y="581.885717371429" text-anchor="middle" font-size="20.060104246551" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">HarmBench</text>
  <rect x="323.969466464658" y="528.857113714284" width="916.030533535342" height="91.142886285716" rx="6.794699387448" fill="var(--bg)" stroke="var(--border)"/>
  <text x="351.450396363847" y="565.314196228565" font-size="18.38838170726" fill="var(--text)" font-family="Arial, sans-serif">Comprehensive harmful behavior testing</text>
  <text x="351.450396363847" y="598.457118514284" font-size="18.38838170726" fill="var(--text-muted)" font-family="Arial, sans-serif">400+ test cases across harm categories</text>
</svg>

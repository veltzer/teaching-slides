  <ns0:text x="587.2401" y="275.2688" font-size="15.1398" fill="var(--text-muted)">Signature: [cryptographic proof]</ns0:text>
  <ns0:rect x="50.3348" y="433.5484" width="1073.8105" height="137.6344" rx="6.8817" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.7527" />
  <ns0:text x="83.8915" y="467.957" font-size="19.2688" font-weight="bold" fill="var(--danger-deeper)">If AI-generated:</ns0:text>

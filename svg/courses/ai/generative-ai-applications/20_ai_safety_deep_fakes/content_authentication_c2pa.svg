<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Content Authentication: C2PA</text>
  <text x="350" y="55" text-anchor="middle" font-size="12" fill="#666">Coalition for Content Provenance and Authenticity</text>
  <!-- Original photo manifest -->
  <rect x="30" y="70" width="640" height="230" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="95" font-size="14" font-weight="bold" fill="#4a90e2">Original Photo - Cryptographic Manifest</text>
  <rect x="60" y="110" width="580" height="170" rx="5" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="80" y="135" font-size="12" fill="#333">Image data + Cryptographic manifest:</text>
  <text x="100" y="160" font-size="11" fill="#555">Creator: @photographer</text>
  <text x="100" y="180" font-size="11" fill="#555">Device: Canon EOS R5</text>
  <text x="100" y="200" font-size="11" fill="#555">Date: 2026-03-10</text>
  <text x="100" y="220" font-size="11" fill="#555">Location: Paris, France</text>
  <text x="350" y="160" font-size="11" fill="#555">Edits: None</text>
  <text x="350" y="180" font-size="11" fill="#28a745" font-weight="bold">AI-generated: No</text>
  <text x="350" y="200" font-size="11" fill="#555">Signature: [cryptographic proof]</text>
  <!-- AI-generated manifest -->
  <rect x="30" y="315" width="640" height="100" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="50" y="340" font-size="14" font-weight="bold" fill="#856404">If AI-generated:</text>
  <text x="100" y="365" font-size="11" fill="#333">AI-generated: Yes</text>
  <text x="100" y="385" font-size="11" fill="#333">Model: DALL-E 3</text>
  <text x="350" y="365" font-size="11" fill="#333">Prompt: "A sunset over Paris"</text>
  <text x="350" y="385" font-size="11" fill="#333">Signature: [OpenAI signature]</text>
  <!-- Supporters -->
  <rect x="100" y="430" width="500" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="350" y="453" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Supported by: Adobe, Google, Microsoft, OpenAI</text>
</svg>
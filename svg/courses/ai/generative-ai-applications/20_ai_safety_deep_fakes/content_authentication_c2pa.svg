<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.777" font-weight="bold" fill="var(--text)">Content Authentication: C2PA</text>
  <text x="640.0001" y="73.3333" text-anchor="middle" font-size="17.1846" fill="var(--text-muted)">Coalition for Content Provenance and Authenticity</text>
  <rect x="40" y="93.3334" width="1200" height="306.6666" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="77.5001" y="126.6667" font-size="20.0488" font-weight="bold" fill="var(--primary-accent)">Original Photo - Cryptographic Manifest</text>
  <rect x="96.2501" y="146.6666" width="1087.5" height="226.6667" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3763" />
  <text x="133.7501" y="180.0001" font-size="17.1846" fill="var(--text)">Image data + Cryptographic manifest:</text>
  <text x="171.2501" y="213.3334" font-size="15.7526" fill="var(--text-muted)">Creator: @photographer</text>
  <text x="171.2501" y="240" font-size="15.7526" fill="var(--text-muted)">Device: Canon EOS R5</text>
  <text x="171.2501" y="266.6667" font-size="15.7526" fill="var(--text-muted)">Date: 2026-03-10</text>
  <text x="171.2501" y="293.3333" font-size="15.7526" fill="var(--text-muted)">Location: Paris, France</text>
  <text x="640.0001" y="213.3334" font-size="15.7526" fill="var(--text-muted)">Edits: None</text>
  <text x="640.0001" y="240" font-size="15.7526" fill="var(--ok-accent)" font-weight="bold">AI-generated: No</text>
  <text x="640.0001" y="266.6667" font-size="15.7526" fill="var(--text-muted)">Signature: [cryptographic proof]</text>
  <rect x="40" y="420" width="1200" height="133.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="77.5001" y="453.3334" font-size="20.0488" font-weight="bold" fill="var(--danger-accent)">If AI-generated:</text>
  <text x="171.2501" y="486.6667" font-size="15.7526" fill="var(--text)">AI-generated: Yes</text>
  <text x="171.2501" y="513.3334" font-size="15.7526" fill="var(--text)">Model: DALL-E 3</text>
  <text x="640.0001" y="486.6667" font-size="15.7526" fill="var(--text)">Prompt: "A sunset over Paris"</text>
  <text x="640.0001" y="513.3334" font-size="15.7526" fill="var(--text)">Signature: [OpenAI signature]</text>
  <rect x="171.2501" y="573.3334" width="937.5001" height="46.6666" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640.0001" y="604" text-anchor="middle" font-size="17.1846" font-weight="bold" fill="var(--text)">Supported by: Adobe, Google, Microsoft, OpenAI</text>
</svg>
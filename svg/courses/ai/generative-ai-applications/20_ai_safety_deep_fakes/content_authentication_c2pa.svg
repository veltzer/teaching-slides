<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="587.2401" y="41.2903" text-anchor="middle" font-size="24.7742" font-weight="bold" fill="var(--text)">Content Authentication: C2PA</text>
  <text x="587.2401" y="75.6989" text-anchor="middle" font-size="16.5161" fill="var(--text-muted)">Coalition for Content Provenance and Authenticity</text>
  <rect x="50.3348" y="96.3441" width="1073.8105" height="316.5591" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="83.8915" y="130.7527" font-size="19.2688" font-weight="bold" fill="var(--primary-accent)">Original Photo - Cryptographic Manifest</text>
  <rect x="100.6698" y="151.3978" width="973.1408" height="233.9785" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3763" />
  <text x="134.2263" y="185.8065" font-size="16.5161" fill="var(--text)">Image data + Cryptographic manifest:</text>
  <text x="167.7829" y="220.2151" font-size="15.1398" fill="var(--text-muted)">Creator: @photographer</text>
  <text x="167.7829" y="247.7419" font-size="15.1398" fill="var(--text-muted)">Device: Canon EOS R5</text>
  <text x="167.7829" y="275.2688" font-size="15.1398" fill="var(--text-muted)">Date: 2026-03-10</text>
  <text x="167.7829" y="302.7957" font-size="15.1398" fill="var(--text-muted)">Location: Paris, France</text>
  <text x="587.2401" y="220.2151" font-size="15.1398" fill="var(--text-muted)">Edits: None</text>
  <text x="587.2401" y="247.7419" font-size="15.1398" fill="var(--ok-accent)" font-weight="bold">AI-generated: No</text>
  <text x="587.2401" y="275.2688" font-size="15.1398" fill="var(--text-muted)">Signature: [cryptographic proof]</text>
  <rect x="50.3348" y="433.5484" width="1073.8105" height="137.6344" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="83.8915" y="467.957" font-size="19.2688" font-weight="bold" fill="var(--danger-accent)">If AI-generated:</text>
  <text x="167.7829" y="502.3656" font-size="15.1398" fill="var(--text)">AI-generated: Yes</text>
  <text x="167.7829" y="529.8925" font-size="15.1398" fill="var(--text)">Model: DALL-E 3</text>
  <text x="587.2401" y="502.3656" font-size="15.1398" fill="var(--text)">Prompt: "A sunset over Paris"</text>
  <text x="587.2401" y="529.8925" font-size="15.1398" fill="var(--text)">Signature: [OpenAI signature]</text>
  <rect x="167.7829" y="591.828" width="838.9145" height="48.172" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="587.2401" y="623.4839" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="var(--text)">Supported by: Adobe, Google, Microsoft, OpenAI</text>
</svg>
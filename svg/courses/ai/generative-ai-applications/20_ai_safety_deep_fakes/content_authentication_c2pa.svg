<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.777" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Content Authentication: C2PA</text>
  <text x="640.0001" y="73.3333" text-anchor="middle" font-size="17.1846" fill="var(--text-muted)" font-family="Arial, sans-serif">Coalition for Content Provenance and Authenticity</text>
  <rect x="40" y="93.3334" width="1200" height="306.6666" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="126.6667" font-size="20.0488" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Original Photo - Cryptographic Manifest</text>
  <rect x="96.2501" y="146.6666" width="1087.5" height="226.6667" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3763"/>
  <text x="133.7501" y="180.0001" font-size="17.1846" fill="var(--text)" font-family="Arial, sans-serif">Image data + Cryptographic manifest:</text>
  <text x="171.2501" y="213.3334" font-size="15.7526" fill="var(--text-muted)" font-family="Arial, sans-serif">Creator: @photographer</text>
  <text x="171.2501" y="240" font-size="15.7526" fill="var(--text-muted)" font-family="Arial, sans-serif">Device: Canon EOS R5</text>
  <text x="171.2501" y="266.6667" font-size="15.7526" fill="var(--text-muted)" font-family="Arial, sans-serif">Date: 2026-03-10</text>
  <text x="171.2501" y="293.3333" font-size="15.7526" fill="var(--text-muted)" font-family="Arial, sans-serif">Location: Paris, France</text>
  <text x="640.0001" y="213.3334" font-size="15.7526" fill="var(--text-muted)" font-family="Arial, sans-serif">Edits: None</text>
  <text x="640.0001" y="240" font-size="15.7526" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">AI-generated: No</text>
  <text x="640.0001" y="266.6667" font-size="15.7526" fill="var(--text-muted)" font-family="Arial, sans-serif">Signature: [cryptographic proof]</text>
  <rect x="40" y="420" width="1200" height="133.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="453.3334" font-size="20.0488" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">If AI-generated:</text>
  <text x="171.2501" y="486.6667" font-size="15.7526" fill="var(--text)" font-family="Arial, sans-serif">AI-generated: Yes</text>
  <text x="171.2501" y="513.3334" font-size="15.7526" fill="var(--text)" font-family="Arial, sans-serif">Model: DALL-E 3</text>
  <text x="640.0001" y="486.6667" font-size="15.7526" fill="var(--text)" font-family="Arial, sans-serif">Prompt: "A sunset over Paris"</text>
  <text x="640.0001" y="513.3334" font-size="15.7526" fill="var(--text)" font-family="Arial, sans-serif">Signature: [OpenAI signature]</text>
  <rect x="171.2501" y="573.3334" width="937.5001" height="46.6666" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="604" text-anchor="middle" font-size="17.1846" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Supported by: Adobe, Google, Microsoft, OpenAI</text>
</svg>

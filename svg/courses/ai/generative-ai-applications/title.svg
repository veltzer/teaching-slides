<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1e"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Central generative sparkle/starburst -->
  <circle cx="400" cy="170" r="50" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.6"/>
  <circle cx="400" cy="170" r="30" fill="#ec4899" opacity="0.15"/>
  <line x1="400" y1="110" x2="400" y2="90" stroke="#f97316" stroke-width="2" opacity="0.7"/>
  <line x1="400" y1="230" x2="400" y2="250" stroke="#f97316" stroke-width="2" opacity="0.7"/>
  <line x1="340" y1="170" x2="320" y2="170" stroke="#f97316" stroke-width="2" opacity="0.7"/>
  <line x1="460" y1="170" x2="480" y2="170" stroke="#f97316" stroke-width="2" opacity="0.7"/>
  <line x1="358" y1="128" x2="344" y2="114" stroke="#ec4899" stroke-width="1.5" opacity="0.5"/>
  <line x1="442" y1="128" x2="456" y2="114" stroke="#ec4899" stroke-width="1.5" opacity="0.5"/>
  <line x1="358" y1="212" x2="344" y2="226" stroke="#ec4899" stroke-width="1.5" opacity="0.5"/>
  <line x1="442" y1="212" x2="456" y2="226" stroke="#ec4899" stroke-width="1.5" opacity="0.5"/>
  <!-- Image generation icon (left) -->
  <rect x="120" y="100" width="80" height="60" rx="4" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.6"/>
  <circle cx="145" cy="120" r="8" fill="#f97316" opacity="0.5"/>
  <polygon points="125,155 150,130 170,150 195,125 195,155" fill="#ec4899" opacity="0.3"/>
  <!-- Text generation icon (right) -->
  <rect x="600" y="100" width="80" height="60" rx="4" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>
  <rect x="615" y="115" width="50" height="4" rx="2" fill="#f97316" opacity="0.5"/>
  <rect x="615" y="127" width="40" height="4" rx="2" fill="#ec4899" opacity="0.4"/>
  <rect x="615" y="139" width="45" height="4" rx="2" fill="#f97316" opacity="0.4"/>
  <!-- Code generation icon (bottom left) -->
  <text x="170" y="310" font-family="monospace" font-size="28" fill="#ec4899" opacity="0.5">&lt;/&gt;</text>
  <!-- Music note icon (bottom right) -->
  <circle cx="610" cy="300" r="10" fill="#f97316" opacity="0.4"/>
  <line x1="620" y1="300" x2="620" y2="270" stroke="#f97316" stroke-width="2" opacity="0.5"/>
  <line x1="620" y1="270" x2="635" y2="275" stroke="#f97316" stroke-width="2" opacity="0.4"/>
  <!-- Connecting rays from center to outputs -->
  <line x1="350" y1="150" x2="200" y2="130" stroke="#ec4899" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="150" x2="600" y2="130" stroke="#f97316" stroke-width="1" opacity="0.3"/>
  <line x1="370" y1="210" x2="210" y2="290" stroke="#ec4899" stroke-width="1" opacity="0.3"/>
  <line x1="430" y1="210" x2="600" y2="290" stroke="#f97316" stroke-width="1" opacity="0.3"/>
  <!-- Python snake hint -->
  <path d="M380,280 Q390,270 400,280 Q410,290 420,280" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.4"/>
  <!-- Decorative dots -->
  <circle cx="80" cy="50" r="2" fill="#ec4899" opacity="0.3"/>
  <circle cx="720" cy="60" r="3" fill="#f97316" opacity="0.3"/>
  <circle cx="90" cy="370" r="2" fill="#f97316" opacity="0.3"/>
  <circle cx="710" cy="370" r="2" fill="#ec4899" opacity="0.3"/>
  <!-- Bottom accent -->
  <rect x="250" y="375" width="300" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>
</svg>

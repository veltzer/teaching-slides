<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#1a1a2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#dc3545" />
      <stop offset="100%" style="stop-color:#f57c00" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <circle cx="640" cy="286.5" r="69.5222" fill="none" stroke="var(--danger-border)" stroke-width="2.8444" opacity="0.6" />
  <circle cx="640" cy="286.5" r="41.7133" fill="var(--danger-fill)" opacity="0.15" />
  <line x1="640" y1="199.5" x2="640" y2="170.5" stroke="var(--warn-border)" stroke-width="2" opacity="0.7" />
  <line x1="640" y1="373.5" x2="640" y2="402.5" stroke="var(--warn-border)" stroke-width="2" opacity="0.7" />
  <line x1="550" y1="286.5" x2="520" y2="286.5" stroke="var(--warn-border)" stroke-width="2" opacity="0.7" />
  <line x1="730" y1="286.5" x2="760" y2="286.5" stroke="var(--warn-border)" stroke-width="2" opacity="0.7" />
  <line x1="577" y1="225.6" x2="555.9999" y2="205.3" stroke="var(--danger-border)" stroke-width="2" opacity="0.5" />
  <line x1="703" y1="225.6" x2="724" y2="205.3" stroke="var(--danger-border)" stroke-width="2" opacity="0.5" />
  <line x1="577" y1="347.4" x2="555.9999" y2="367.7" stroke="var(--danger-border)" stroke-width="2" opacity="0.5" />
  <line x1="703" y1="347.4" x2="724" y2="367.7" stroke="var(--danger-border)" stroke-width="2" opacity="0.5" />
  <rect x="220" y="185" width="120" height="87" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.6" />
  <circle cx="257.5" cy="214" r="11.1236" fill="var(--warn-fill)" opacity="0.5" />
  <polygon points="227.5,264.75 265,228.5 295,257.5 332.5,221.25 332.5,264.75" fill="var(--danger-fill)" opacity="0.3" />
  <rect x="939.9999" y="185" width="120" height="87" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.6" />
  <rect x="962.5" y="206.75" width="75" height="5.8" rx="6" fill="url(#grad-warn)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="962.5" y="224.15" width="60" height="5.8" rx="6" fill="url(#grad-danger)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="962.5" y="241.55" width="67.5" height="5.8" rx="6" fill="url(#grad-warn)" opacity="0.4" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="295" y="489.5" font-size="38.9324" fill="var(--danger-accent)" opacity="0.5" font-family="Courier New, monospace">&lt;/&gt;</text>
  <circle cx="955" cy="475" r="13.9044" fill="var(--warn-fill)" opacity="0.4" />
  <line x1="970" y1="475" x2="970" y2="431.5" stroke="var(--warn-border)" stroke-width="2" opacity="0.5" />
  <line x1="970" y1="431.5" x2="992.5" y2="438.75" stroke="var(--warn-border)" stroke-width="2" opacity="0.4" />
  <line x1="565" y1="257.5" x2="339.9999" y2="228.5" stroke="var(--danger-border)" stroke-width="1.4222" opacity="0.3" />
  <line x1="715" y1="257.5" x2="939.9999" y2="228.5" stroke="var(--warn-border)" stroke-width="1.4222" opacity="0.3" />
  <line x1="595" y1="344.5" x2="355" y2="460.5" stroke="var(--danger-border)" stroke-width="1.4222" opacity="0.3" />
  <line x1="685" y1="344.5" x2="939.9999" y2="460.5" stroke="var(--warn-border)" stroke-width="1.4222" opacity="0.3" />
  <path d="M 609.9999 446 Q 625 431.5 640 446 Q 655 460.5 670 446" fill="none" stroke="var(--danger-border)" stroke-width="2.8444" opacity="0.4" />
  <circle cx="160" cy="112.5" r="2.7808" fill="var(--danger-fill)" opacity="0.3" />
  <circle cx="1120" cy="127" r="4.1714" fill="var(--warn-fill)" opacity="0.3" />
  <circle cx="175" cy="576.5" r="2.7808" fill="var(--warn-fill)" opacity="0.3" />
  <circle cx="1105" cy="576.5" r="2.7808" fill="var(--danger-fill)" opacity="0.3" />
  <rect x="415" y="583.75" width="450" height="4.35" rx="6" fill="url(#accent)" opacity="0.6" />
</svg>
  <text x="578.5311" y="353.6271" font-size="22.728" font-weight="normal" fill="var(--text)" text-anchor="middle">Distributed</text>
  <text x="578.5311" y="384" font-size="22.728" font-weight="normal" fill="var(--text)" text-anchor="middle">training</text>

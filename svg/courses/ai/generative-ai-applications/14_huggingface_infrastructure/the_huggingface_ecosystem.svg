  <text x="206.6182" y="496.8136" font-size="24.7942" font-weight="bold" fill="var(--text)" text-anchor="middle">Spaces</text>
  <text x="206.6182" y="533.6949" font-size="22.728" font-weight="normal" fill="var(--text)" text-anchor="middle">Deploy apps</text>

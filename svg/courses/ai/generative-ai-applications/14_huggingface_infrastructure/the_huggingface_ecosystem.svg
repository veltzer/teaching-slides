<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" font-size="34.752404" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">HUGGINGFACE ECOSYSTEM</text>
  <rect x="40" y="84.806982" width="384.905682" height="161.80254" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.818921" filter="url(#shadow)"/>
  <text x="232.452789" y="139.570919" font-size="27.801991" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Hub</text>
  <text x="232.452789" y="179.399236" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">500K+ models</text>
  <text x="232.452789" y="214.24889" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Model cards</text>
  <rect x="447.547211" y="84.806982" width="384.905682" height="161.80254" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.818921" filter="url(#shadow)"/>
  <text x="640" y="139.570919" font-size="27.801991" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Transformers</text>
  <text x="640" y="179.399236" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Load &amp; run</text>
  <text x="640" y="214.24889" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">any model</text>
  <rect x="855.094318" y="84.806982" width="384.905682" height="161.80254" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.818921" filter="url(#shadow)"/>
  <text x="1047.547107" y="139.570919" font-size="27.801991" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Datasets</text>
  <text x="1047.547107" y="179.399236" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">100K+</text>
  <text x="1047.547107" y="214.24889" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">datasets</text>
  <rect x="40" y="271.502096" width="384.905682" height="161.80254" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.818921" filter="url(#shadow)"/>
  <text x="232.452789" y="326.266157" font-size="27.801991" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Tokenizers</text>
  <text x="232.452789" y="366.094475" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Fast</text>
  <text x="232.452789" y="400.944253" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">tokenization</text>
  <rect x="447.547211" y="271.502096" width="384.905682" height="161.80254" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.818921" filter="url(#shadow)"/>
  <text x="640" y="326.266157" font-size="27.801991" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Accelerate</text>
  <text x="640" y="366.094475" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Distributed</text>
  <text x="640" y="400.944253" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">training</text>
  <rect x="855.094318" y="271.502096" width="384.905682" height="161.80254" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.818921" filter="url(#shadow)"/>
  <text x="1047.547107" y="326.266157" font-size="27.801991" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">PEFT</text>
  <text x="1047.547107" y="366.094475" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">LoRA, QLoRA</text>
  <text x="1047.547107" y="400.944253" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Adapters</text>
  <rect x="40" y="458.19746" width="384.905682" height="161.80254" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.818921" filter="url(#shadow)"/>
  <text x="232.452789" y="530.386285" font-size="27.801991" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Spaces</text>
  <text x="232.452789" y="572.703873" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Deploy apps</text>
  <rect x="447.547211" y="458.19746" width="384.905682" height="161.80254" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.818921" filter="url(#shadow)"/>
  <text x="640" y="530.386285" font-size="27.801991" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">TRL</text>
  <text x="640" y="572.703873" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">RLHF/DPO</text>
  <rect x="855.094318" y="458.19746" width="384.905682" height="161.80254" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.818921" filter="url(#shadow)"/>
  <text x="1047.547107" y="530.386285" font-size="27.801991" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Evaluate</text>
  <text x="1047.547107" y="572.703873" font-size="25.485149" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Benchmarks</text>
</svg>
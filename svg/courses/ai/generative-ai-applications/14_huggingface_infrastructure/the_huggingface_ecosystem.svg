  <text x="578.5311" y="221.2881" font-size="22.728" font-weight="normal" fill="var(--text)" text-anchor="middle">any model</text>
  <rect x="774.8184" y="108.4746" width="351.251" height="141.0169" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />

  <rect x="40" y="471.150442477876" width="380" height="82.12389380531" rx="8.10549906201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="501.946902654867" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" text-anchor="middle" font-family="Arial, sans-serif">datasets library</text>
  <text x="55" y="527.610619469027" font-size="12.158248593015" fill="var(--warn-text)" font-family="Courier New, monospace">load_dataset()</text>
  <text x="55" y="546.088495575221" font-size="12.158248593015" fill="var(--warn-text)" font-family="Arial, sans-serif">Streaming, Arrow</text>

  <rect x="430" y="471.150442477876" width="430" height="82.12389380531" rx="8.10549906201" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="645" y="501.946902654867" font-size="15.197810741269" font-weight="bold" fill="var(--danger-text)" text-anchor="middle" font-family="Arial, sans-serif">evaluate library</text>
  <text x="445" y="527.610619469027" font-size="12.158248593015" fill="var(--danger-text)" font-family="Courier New, monospace">evaluate.load("bleu")</text>
  <text x="445" y="546.088495575221" font-size="12.158248593015" fill="var(--danger-text)" font-family="Arial, sans-serif">BLEU, ROUGE, F1</text>

  <rect x="870" y="471.150442477876" width="370" height="82.12389380531" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="501.946902654867" font-size="15.197810741269" font-weight="bold" fill="var(--primary-text)" text-anchor="middle" font-family="Arial, sans-serif">Inference API</text>
  <text x="885" y="527.610619469027" font-size="12.158248593015" fill="var(--primary-text)" font-family="Arial, sans-serif">REST, no GPU needed</text>
  <text x="885" y="546.088495575221" font-size="12.158248593015" fill="var(--primary-text)" font-family="Courier New, monospace">InferenceClient</text>

  <rect x="40" y="573.805309734513" width="1200" height="46.194690265487" rx="8.10549906201" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="602.548672566372" font-size="14.184623358518" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">GitHub for ML: discover, share, deploy</text>
</svg>

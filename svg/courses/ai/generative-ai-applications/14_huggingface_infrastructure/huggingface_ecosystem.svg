  <text x="640" y="70.796460176991" font-size="20.263747655025" font-weight="bold" fill="var(--warn-text)" text-anchor="middle" font-family="Arial, sans-serif">HuggingFace Hub</text>

  <rect x="395" y="91.327433628319" width="155" height="92.389380530973" rx="8.10549906201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="473" y="122.12389380531" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" text-anchor="middle" font-family="Arial, sans-serif">Models</text>
  <text x="473" y="147.787610619469" font-size="13.171435975767" fill="var(--warn-text)" text-anchor="middle" font-family="Arial, sans-serif">750k+ models</text>
  <text x="473" y="168.318584070796" font-size="13.171435975767" fill="var(--warn-text)" text-anchor="middle" font-family="Arial, sans-serif">Versioned</text>

  <rect x="562" y="91.327433628319" width="155" height="92.389380530973" rx="8.10549906201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="122.12389380531" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" text-anchor="middle" font-family="Arial, sans-serif">Datasets</text>
  <text x="640" y="147.787610619469" font-size="13.171435975767" fill="var(--warn-text)" text-anchor="middle" font-family="Arial, sans-serif">100k+ sets</text>
  <text x="640" y="168.318584070796" font-size="13.171435975767" fill="var(--warn-text)" text-anchor="middle" font-family="Arial, sans-serif">Streaming</text>

  <rect x="729" y="91.327433628319" width="155" height="92.389380530973" rx="8.10549906201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="807" y="122.12389380531" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)" text-anchor="middle" font-family="Arial, sans-serif">Spaces</text>
  <text x="807" y="147.787610619469" font-size="13.171435975767" fill="var(--warn-text)" text-anchor="middle" font-family="Arial, sans-serif">Gradio demos</text>
  <text x="807" y="168.318584070796" font-size="13.171435975767" fill="var(--warn-text)" text-anchor="middle" font-family="Arial, sans-serif">Streamlit</text>


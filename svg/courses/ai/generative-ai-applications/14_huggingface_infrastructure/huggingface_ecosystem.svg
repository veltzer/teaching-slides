<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="328.8889" y="26.6667" width="480" height="142.2222" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="328.8889" y="26.6667" width="480" height="39.1111" rx="6" fill="var(--warn-accent)" />
  <rect x="328.8889" y="55.1111" width="480" height="10.6667" fill="var(--warn-accent)" rx="6"/>
  <text x="568.8889" y="55.1111" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)" text-anchor="middle">HuggingFace Hub  (huggingface.co)</text>
  <rect x="346.6667" y="80" width="142.2222" height="71.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="417.7778" y="100.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Models</text>
  <text x="417.7778" y="118.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">750 000+ models</text>
  <text x="417.7778" y="134.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">versioned + model cards</text>
  <rect x="497.7778" y="80" width="142.2222" height="71.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="568.8889" y="100.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Datasets</text>
  <text x="568.8889" y="118.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">100 000+ datasets</text>
  <text x="568.8889" y="134.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">streaming support</text>
  <rect x="648.8889" y="80" width="142.2222" height="71.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="720" y="100.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Spaces</text>
  <text x="720" y="118.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Gradio / Streamlit</text>
  <text x="720" y="134.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">hosted demos</text>
  <line x1="417.7778" y1="168.8889" x2="222.2222" y2="248.8889" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="568.8889" y1="168.8889" x2="568.8889" y2="248.8889" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="720" y1="168.8889" x2="906.6667" y2="248.8889" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="53.3333" y="248.8889" width="337.7778" height="151.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="53.3333" y="248.8889" width="337.7778" height="32" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="53.3333" y="270.2222" width="337.7778" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="222.2222" y="271.1111" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">transformers library</text>
  <text x="71.1111" y="302.2222" font-family="monospace" font-size="10.6667" fill="var(--text)">from transformers import AutoModel,</text>
  <text x="71.1111" y="318.2222" font-family="monospace" font-size="10.6667" fill="var(--text)">    AutoTokenizer, AutoConfig</text>
  <text x="71.1111" y="343.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Load any model in 2 lines of code</text>
  <text x="71.1111" y="359.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• PyTorch &amp; TensorFlow backends</text>
  <text x="71.1111" y="375.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• 150+ model architectures (BERT, GPT, T5...)</text>
  <text x="71.1111" y="391.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Pretrained weights auto-downloaded</text>
  <rect x="391.1111" y="248.8889" width="355.5556" height="151.1111" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <rect x="391.1111" y="248.8889" width="355.5556" height="32" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="391.1111" y="270.2222" width="355.5556" height="10.6667" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="568.8889" y="271.1111" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">pipeline() API</text>
  <text x="408.8889" y="302.2222" font-family="monospace" font-size="10.6667" fill="var(--text)">from transformers import pipeline</text>
  <text x="408.8889" y="318.2222" font-family="monospace" font-size="10.6667" fill="var(--text)">nlp = pipeline("sentiment-analysis")</text>
  <text x="408.8889" y="334.2222" font-family="monospace" font-size="10.6667" fill="var(--text)">nlp("I love this!")</text>
  <text x="408.8889" y="361.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Tasks: text-generation, summarization,</text>
  <text x="408.8889" y="376.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">translation, fill-mask, image-classification,</text>
  <text x="408.8889" y="392.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">object-detection, audio-classification ...</text>
  <rect x="764.4444" y="248.8889" width="337.7778" height="151.1111" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="764.4444" y="248.8889" width="337.7778" height="32" rx="6" fill="var(--ok-accent)" />
  <rect x="764.4444" y="270.2222" width="337.7778" height="10.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="933.3333" y="271.1111" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">Fine-Tuning (PEFT / LoRA)</text>
  <text x="782.2222" y="302.2222" font-family="monospace" font-size="10.6667" fill="var(--text)">from peft import LoraConfig,</text>
  <text x="782.2222" y="318.2222" font-family="monospace" font-size="10.6667" fill="var(--text)">    get_peft_model</text>
  <text x="782.2222" y="343.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Full fine-tune (all params)</text>
  <text x="782.2222" y="359.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• LoRA (low-rank adapters, &lt;1% params)</text>
  <text x="782.2222" y="375.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• QLoRA (4-bit quantized LoRA)</text>
  <text x="782.2222" y="391.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Trainer / SFTTrainer helper classes</text>
  <line x1="222.2222" y1="400" x2="222.2222" y2="453.3333" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="568.8889" y1="400" x2="568.8889" y2="453.3333" stroke="var(--info-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="933.3333" y1="400" x2="933.3333" y2="453.3333" stroke="var(--ok-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="26.6667" y="453.3333" width="320" height="71.1111" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="186.6667" y="476.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">datasets library</text>
  <text x="44.4444" y="496" font-family="monospace" font-size="10" fill="var(--text)">from datasets import load_dataset</text>
  <text x="44.4444" y="512" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Streaming, caching, Arrow format</text>
  <rect x="364.4444" y="453.3333" width="408.8889" height="71.1111" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="568.8889" y="476.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">evaluate library</text>
  <text x="382.2222" y="496" font-family="monospace" font-size="10" fill="var(--text)">import evaluate; bleu = evaluate.load("bleu")</text>
  <text x="382.2222" y="512" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">BLEU, ROUGE, BERTScore, accuracy, F1 ...</text>
  <rect x="791.1111" y="453.3333" width="320" height="71.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="951.1111" y="476.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Inference API</text>
  <text x="808.8889" y="496" font-family="Arial,sans-serif" font-size="10" fill="var(--text)">REST API — no GPU needed locally</text>
  <text x="808.8889" y="512" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">hf_hub_download(), InferenceClient</text>
  <rect x="26.6667" y="552.8889" width="1084.4444" height="44.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="568.8889" y="577.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">HuggingFace is the GitHub for ML — discover, share, and deploy any model or dataset with a single pip install transformers</text>
</svg>
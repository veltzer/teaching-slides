<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="374.42623" y="40" width="531.147541" height="144.548318" rx="6.508413" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="374.42623" y="40" width="531.147541" height="39.750734" rx="6.508413" fill="var(--warn-accent)" />
  <rect x="374.42623" y="68.909574" width="531.147541" height="10.84116" fill="var(--warn-accent)" rx="6.508413"/>
  <text x="640" y="68.909574" font-size="18.853353" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">HuggingFace Hub  (huggingface.co)</text>
  <rect x="394.098361" y="94.205577" width="157.377049" height="72.274103" rx="6.508413" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="472.786885" y="114.984309" font-size="13.197217" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Models</text>
  <text x="472.786885" y="133.052947" font-size="10.847354" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">750 000+ models</text>
  <text x="472.786885" y="149.314631" font-size="10.847354" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">versioned + model cards</text>
  <rect x="561.311475" y="94.205577" width="157.377049" height="72.274103" rx="6.508413" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="114.984309" font-size="13.197217" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Datasets</text>
  <text x="640" y="133.052947" font-size="10.847354" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">100 000+ datasets</text>
  <text x="640" y="149.314631" font-size="10.847354" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">streaming support</text>
  <rect x="728.52459" y="94.205577" width="157.377049" height="72.274103" rx="6.508413" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="807.213115" y="114.984309" font-size="13.197217" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Spaces</text>
  <text x="807.213115" y="133.052947" font-size="10.847354" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Gradio / Streamlit</text>
  <text x="807.213115" y="149.314631" font-size="10.847354" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">hosted demos</text>
  <line x1="472.786885" y1="184.548318" x2="256.393443" y2="265.856739" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="640" y1="184.548318" x2="640" y2="265.856739" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="807.213115" y1="184.548318" x2="1013.770492" y2="265.856739" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="69.508197" y="265.856739" width="373.770492" height="153.582524" rx="6.508413" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="69.508197" y="265.856739" width="373.770492" height="32.523369" rx="6.508413" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="69.508197" y="287.538948" width="373.770492" height="10.84116" fill="url(#grad-primary)" rx="6.508413" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="256.393443" y="288.442312" font-size="15.082596" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">transformers library</text>
  <text x="89.180328" y="320.062316" font-size="11.312055" fill="var(--text)" font-family="Courier New, monospace">from transformers import AutoModel,</text>
  <text x="89.180328" y="336.324001" font-size="11.312055" fill="var(--text)" font-family="Courier New, monospace">    AutoTokenizer, AutoConfig</text>
  <text x="89.180328" y="361.619892" font-size="11.312055" fill="var(--text-muted)" font-family="Arial, sans-serif">• Load any model in 2 lines of code</text>
  <text x="89.180328" y="377.881576" font-size="11.312055" fill="var(--text-muted)" font-family="Arial, sans-serif">• PyTorch &amp; TensorFlow backends</text>
  <text x="89.180328" y="394.143261" font-size="11.312055" fill="var(--text-muted)" font-family="Arial, sans-serif">• 150+ model architectures (BERT, GPT, T5...)</text>
  <text x="89.180328" y="410.404945" font-size="11.312055" fill="var(--text-muted)" font-family="Arial, sans-serif">• Pretrained weights auto-downloaded</text>
  <rect x="443.278689" y="265.856739" width="393.442623" height="153.582524" rx="6.508413" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="443.278689" y="265.856739" width="393.442623" height="32.523369" rx="6.508413" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="443.278689" y="287.538948" width="393.442623" height="10.84116" fill="url(#grad-info)" rx="6.508413" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="288.442312" font-size="15.082596" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">pipeline() API</text>
  <text x="462.95082" y="320.062316" font-size="11.312055" fill="var(--text)" font-family="Courier New, monospace">from transformers import pipeline</text>
  <text x="462.95082" y="336.324001" font-size="11.312055" fill="var(--text)" font-family="Courier New, monospace">nlp = pipeline("sentiment-analysis")</text>
  <text x="462.95082" y="352.585685" font-size="11.312055" fill="var(--text)" font-family="Courier New, monospace">nlp("I love this!")</text>
  <text x="462.95082" y="380.591894" font-size="11.312055" fill="var(--text-muted)" font-family="Arial, sans-serif">Tasks: text-generation, summarization,</text>
  <text x="462.95082" y="395.950214" font-size="11.312055" fill="var(--text-muted)" font-family="Arial, sans-serif">translation, fill-mask, image-classification,</text>
  <text x="462.95082" y="412.211898" font-size="11.312055" fill="var(--text-muted)" font-family="Arial, sans-serif">object-detection, audio-classification ...</text>
  <rect x="856.393338" y="265.856739" width="373.770492" height="153.582524" rx="6.508413" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="856.393338" y="265.856739" width="373.770492" height="32.523369" rx="6.508413" fill="var(--ok-accent)" />
  <rect x="856.393338" y="287.538948" width="373.770492" height="10.84116" fill="var(--ok-accent)" rx="6.508413"/>
  <text x="1043.278584" y="288.442312" font-size="15.082596" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Fine-Tuning (PEFT / LoRA)</text>
  <text x="876.065574" y="320.062316" font-size="11.312055" fill="var(--text)" font-family="Courier New, monospace">from peft import LoraConfig,</text>
  <text x="876.065574" y="336.324001" font-size="11.312055" fill="var(--text)" font-family="Courier New, monospace">    get_peft_model</text>
  <text x="876.065574" y="361.619892" font-size="11.312055" fill="var(--text-muted)" font-family="Arial, sans-serif">• Full fine-tune (all params)</text>
  <text x="876.065574" y="377.881576" font-size="11.312055" fill="var(--text-muted)" font-family="Arial, sans-serif">• LoRA (low-rank adapters, &lt;1% params)</text>
  <text x="876.065574" y="394.143261" font-size="11.312055" fill="var(--text-muted)" font-family="Arial, sans-serif">• QLoRA (4-bit quantized LoRA)</text>
  <text x="876.065574" y="410.404945" font-size="11.312055" fill="var(--text-muted)" font-family="Arial, sans-serif">• Trainer / SFTTrainer helper classes</text>
  <line x1="256.393443" y1="419.439264" x2="256.393443" y2="473.644841" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow)" />

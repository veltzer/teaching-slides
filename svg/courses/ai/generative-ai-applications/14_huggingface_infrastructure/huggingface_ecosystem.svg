  <text x="640" y="600.124633" font-family="Arial,sans-serif" font-size="12.25469" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">HuggingFace is the GitHub for ML — discover, share, and deploy any model or dataset with a single pip install transformers</text>

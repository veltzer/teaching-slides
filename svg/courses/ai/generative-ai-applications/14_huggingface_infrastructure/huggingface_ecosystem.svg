  <ns0:text x="186.6667" y="476.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#f57f17" text-anchor="middle">datasets library</ns0:text>
  <ns0:text x="44.4444" y="496" font-family="monospace" font-size="10" fill="#333">from datasets import load_dataset</ns0:text>
  <ns0:text x="44.4444" y="512" font-family="Arial,sans-serif" font-size="10" fill="#555">Streaming, caching, Arrow format</ns0:text>
  <ns0:rect x="364.4444" y="453.3333" width="408.8889" height="71.1111" rx="7.1111" fill="#fce4ec" filter="url(#shadow)" stroke="#c62828" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="476.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#c62828" text-anchor="middle">evaluate library</ns0:text>
  <ns0:text x="382.2222" y="496" font-family="monospace" font-size="10" fill="#333">import evaluate; bleu = evaluate.load("bleu")</ns0:text>
  <ns0:text x="382.2222" y="512" font-family="Arial,sans-serif" font-size="10" fill="#555">BLEU, ROUGE, BERTScore, accuracy, F1 ...</ns0:text>
  <ns0:rect x="791.1111" y="453.3333" width="320" height="71.1111" rx="7.1111" fill="#e0f7fa" filter="url(#shadow)" stroke="#00838f" stroke-width="1.3333" />
  <ns0:text x="951.1111" y="476.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#00838f" text-anchor="middle">Inference API</ns0:text>
  <ns0:text x="808.8889" y="496" font-family="Arial,sans-serif" font-size="10" fill="#333">REST API — no GPU needed locally</ns0:text>
  <ns0:text x="808.8889" y="512" font-family="Arial,sans-serif" font-size="10" fill="#555">hf_hub_download(), InferenceClient</ns0:text>
  <ns0:rect x="26.6667" y="552.8889" width="1084.4444" height="44.4444" rx="7.1111" fill="#fff3e0" stroke="#e65100" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="577.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="#e65100" text-anchor="middle" font-weight="bold">HuggingFace is the GitHub for ML — discover, share, and deploy any model or dataset with a single pip install transformers</ns0:text>

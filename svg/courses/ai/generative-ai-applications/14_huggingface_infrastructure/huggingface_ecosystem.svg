  <line x1="640" y1="199.115044247788" x2="640" y2="270.973451327434" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="807" y1="199.115044247788" x2="1015" y2="270.973451327434" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <rect x="70" y="276.106194690266" width="370" height="159.115044247788" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="255" y="306.902654867257" font-size="16.21099812402" font-weight="bold" fill="var(--primary-text)" text-anchor="middle" font-family="Arial, sans-serif">transformers library</text>
  <text x="90" y="337.699115044248" font-size="13.171435975767" fill="var(--primary-text)" font-family="Courier New, monospace">AutoModel.from_pretrained()</text>
  <text x="90" y="368.495575221239" font-size="13.171435975767" fill="var(--primary-text)" font-family="Arial, sans-serif">PyTorch + TF backends</text>
  <text x="90" y="394.159292035398" font-size="13.171435975767" fill="var(--primary-text)" font-family="Arial, sans-serif">150+ architectures</text>
  <text x="90" y="419.823008849558" font-size="13.171435975767" fill="var(--primary-text)" font-family="Arial, sans-serif">Auto-download weights</text>

  <rect x="445" y="276.106194690266" width="390" height="159.115044247788" rx="8.10549906201" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="306.902654867257" font-size="16.21099812402" font-weight="bold" fill="var(--info-text)" text-anchor="middle" font-family="Arial, sans-serif">pipeline() API</text>
  <text x="465" y="337.699115044248" font-size="13.171435975767" fill="var(--info-text)" font-family="Courier New, monospace">pipeline("sentiment-analysis")</text>

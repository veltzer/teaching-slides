  <rect x="40" y="473.644841" width="354.098361" height="72.274103" rx="6.508413" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="217.04918" y="497.133891" font-family="Arial,sans-serif" font-size="13.197217" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">datasets library</text>
  <text x="59.672131" y="517.00937" font-family="monospace" font-size="10.847354" fill="var(--text)">from datasets import load_dataset</text>
  <text x="59.672131" y="533.271054" font-family="Arial,sans-serif" font-size="10.847354" fill="var(--text-muted)">Streaming, caching, Arrow format</text>
  <rect x="413.770387" y="473.644841" width="452.459016" height="72.274103" rx="6.508413" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="497.133891" font-family="Arial,sans-serif" font-size="13.197217" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">evaluate library</text>
  <text x="433.442623" y="517.00937" font-family="monospace" font-size="10.847354" fill="var(--text)">import evaluate; bleu = evaluate.load("bleu")</text>
  <text x="433.442623" y="533.271054" font-family="Arial,sans-serif" font-size="10.847354" fill="var(--text-muted)">BLEU, ROUGE, BERTScore, accuracy, F1 ...</text>
  <rect x="885.901639" y="473.644841" width="354.098361" height="72.274103" rx="6.508413" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1062.95082" y="497.133891" font-family="Arial,sans-serif" font-size="13.197217" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Inference API</text>
  <text x="905.57377" y="517.00937" font-family="Arial,sans-serif" font-size="10.847354" fill="var(--text)">REST API — no GPU needed locally</text>
  <text x="905.57377" y="533.271054" font-family="Arial,sans-serif" font-size="10.847354" fill="var(--text-muted)">hf_hub_download(), InferenceClient</text>

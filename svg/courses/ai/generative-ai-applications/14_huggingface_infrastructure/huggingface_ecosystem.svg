  <ns0:text x="568.8889" y="55.1111" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#fff" text-anchor="middle">HuggingFace Hub  (huggingface.co)</ns0:text>
  <ns0:rect x="346.6667" y="80" width="142.2222" height="71.1111" rx="7.1111" fill="#ffe0b2" stroke="#e65100" stroke-width="0.8889" />
  <ns0:text x="417.7778" y="100.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#e65100" text-anchor="middle">Models</ns0:text>
  <ns0:text x="417.7778" y="118.2222" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">750 000+ models</ns0:text>
  <ns0:text x="417.7778" y="134.2222" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">versioned + model cards</ns0:text>
  <ns0:rect x="497.7778" y="80" width="142.2222" height="71.1111" rx="7.1111" fill="#ffe0b2" stroke="#e65100" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="100.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#e65100" text-anchor="middle">Datasets</ns0:text>
  <ns0:text x="568.8889" y="118.2222" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">100 000+ datasets</ns0:text>
  <ns0:text x="568.8889" y="134.2222" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">streaming support</ns0:text>
  <ns0:rect x="648.8889" y="80" width="142.2222" height="71.1111" rx="7.1111" fill="#ffe0b2" stroke="#e65100" stroke-width="0.8889" />
  <ns0:text x="720" y="100.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#e65100" text-anchor="middle">Spaces</ns0:text>
  <ns0:text x="720" y="118.2222" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Gradio / Streamlit</ns0:text>
  <ns0:text x="720" y="134.2222" font-family="Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">hosted demos</ns0:text>

  <ns0:rect x="53.3333" y="270.2222" width="337.7778" height="10.6667" fill="url(#grad-accent)" />
  <ns0:text x="222.2222" y="271.1111" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="#fff" text-anchor="middle">transformers library</ns0:text>
  <ns0:text x="71.1111" y="302.2222" font-family="monospace" font-size="10.6667" fill="#333">from transformers import AutoModel,</ns0:text>
  <ns0:text x="71.1111" y="318.2222" font-family="monospace" font-size="10.6667" fill="#333">    AutoTokenizer, AutoConfig</ns0:text>
  <ns0:text x="71.1111" y="343.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Load any model in 2 lines of code</ns0:text>
  <ns0:text x="71.1111" y="359.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• PyTorch &amp; TensorFlow backends</ns0:text>
  <ns0:text x="71.1111" y="375.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• 150+ model architectures (BERT, GPT, T5...)</ns0:text>
  <ns0:text x="71.1111" y="391.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Pretrained weights auto-downloaded</ns0:text>
  <ns0:rect x="391.1111" y="248.8889" width="355.5556" height="151.1111" rx="8.8889" fill="#f3e5f5" filter="url(#shadow)" stroke="#7b1fa2" stroke-width="1.7778" />
  <ns0:rect x="391.1111" y="248.8889" width="355.5556" height="32" rx="8.8889" fill="#7b1fa2" />
  <ns0:rect x="391.1111" y="270.2222" width="355.5556" height="10.6667" fill="#7b1fa2" />
  <ns0:text x="568.8889" y="271.1111" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="#fff" text-anchor="middle">pipeline() API</ns0:text>
  <ns0:text x="408.8889" y="302.2222" font-family="monospace" font-size="10.6667" fill="#333">from transformers import pipeline</ns0:text>
  <ns0:text x="408.8889" y="318.2222" font-family="monospace" font-size="10.6667" fill="#333">nlp = pipeline("sentiment-analysis")</ns0:text>
  <ns0:text x="408.8889" y="334.2222" font-family="monospace" font-size="10.6667" fill="#333">nlp("I love this!")</ns0:text>
  <ns0:text x="408.8889" y="361.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Tasks: text-generation, summarization,</ns0:text>
  <ns0:text x="408.8889" y="376.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">translation, fill-mask, image-classification,</ns0:text>
  <ns0:text x="408.8889" y="392.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">object-detection, audio-classification ...</ns0:text>
  <ns0:rect x="764.4444" y="248.8889" width="337.7778" height="151.1111" rx="8.8889" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="1.7778" />
  <ns0:rect x="764.4444" y="248.8889" width="337.7778" height="32" rx="8.8889" fill="#2e7d32" />
  <ns0:rect x="764.4444" y="270.2222" width="337.7778" height="10.6667" fill="#2e7d32" />
  <ns0:text x="933.3333" y="271.1111" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="#fff" text-anchor="middle">Fine-Tuning (PEFT / LoRA)</ns0:text>
  <ns0:text x="782.2222" y="302.2222" font-family="monospace" font-size="10.6667" fill="#333">from peft import LoraConfig,</ns0:text>
  <ns0:text x="782.2222" y="318.2222" font-family="monospace" font-size="10.6667" fill="#333">    get_peft_model</ns0:text>
  <ns0:text x="782.2222" y="343.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Full fine-tune (all params)</ns0:text>
  <ns0:text x="782.2222" y="359.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• LoRA (low-rank adapters, &lt;1% params)</ns0:text>
  <ns0:text x="782.2222" y="375.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• QLoRA (4-bit quantized LoRA)</ns0:text>
  <ns0:text x="782.2222" y="391.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Trainer / SFTTrainer helper classes</ns0:text>
  <ns0:line x1="222.2222" y1="400" x2="222.2222" y2="453.3333" stroke="#1565c0" stroke-width="1.3333" marker-end="url(#arrow)" />
  <ns0:line x1="568.8889" y1="400" x2="568.8889" y2="453.3333" stroke="#7b1fa2" stroke-width="1.3333" marker-end="url(#arrow)" />
  <ns0:line x1="933.3333" y1="400" x2="933.3333" y2="453.3333" stroke="#2e7d32" stroke-width="1.3333" marker-end="url(#arrow)" />

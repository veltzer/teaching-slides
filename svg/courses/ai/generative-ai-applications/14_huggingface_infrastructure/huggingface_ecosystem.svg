  <ns0:text x="568.8889" y="55.1111" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)" text-anchor="middle">HuggingFace Hub  (huggingface.co)</ns0:text>
  <ns0:rect x="346.6667" y="80" width="142.2222" height="71.1111" rx="7.1111" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="0.8889" />
  <ns0:text x="417.7778" y="100.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Models</ns0:text>
  <ns0:text x="417.7778" y="118.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">750 000+ models</ns0:text>
  <ns0:text x="417.7778" y="134.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">versioned + model cards</ns0:text>
  <ns0:rect x="497.7778" y="80" width="142.2222" height="71.1111" rx="7.1111" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="100.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Datasets</ns0:text>
  <ns0:text x="568.8889" y="118.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">100 000+ datasets</ns0:text>
  <ns0:text x="568.8889" y="134.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">streaming support</ns0:text>
  <ns0:rect x="648.8889" y="80" width="142.2222" height="71.1111" rx="7.1111" fill="var(--warn-lt)" stroke="var(--warn-dk)" stroke-width="0.8889" />
  <ns0:text x="720" y="100.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Spaces</ns0:text>
  <ns0:text x="720" y="118.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Gradio / Streamlit</ns0:text>
  <ns0:text x="720" y="134.2222" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">hosted demos</ns0:text>
  <ns0:line x1="417.7778" y1="168.8889" x2="222.2222" y2="248.8889" stroke="var(--warn-dk)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:line x1="568.8889" y1="168.8889" x2="568.8889" y2="248.8889" stroke="var(--warn-dk)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:line x1="720" y1="168.8889" x2="906.6667" y2="248.8889" stroke="var(--warn-dk)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="53.3333" y="248.8889" width="337.7778" height="151.1111" rx="8.8889" fill="var(--primary-pale)" filter="url(#shadow)" stroke="var(--primary-dk)" stroke-width="1.7778" />
  <ns0:rect x="53.3333" y="248.8889" width="337.7778" height="32" rx="8.8889" fill="url(#grad-primary)" />
  <ns0:rect x="53.3333" y="270.2222" width="337.7778" height="10.6667" fill="url(#grad-primary)" />
  <ns0:text x="222.2222" y="271.1111" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">transformers library</ns0:text>
  <ns0:text x="71.1111" y="302.2222" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">from transformers import AutoModel,</ns0:text>
  <ns0:text x="71.1111" y="318.2222" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">    AutoTokenizer, AutoConfig</ns0:text>
  <ns0:text x="71.1111" y="343.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Load any model in 2 lines of code</ns0:text>
  <ns0:text x="71.1111" y="359.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• PyTorch &amp; TensorFlow backends</ns0:text>
  <ns0:text x="71.1111" y="375.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• 150+ model architectures (BERT, GPT, T5...)</ns0:text>
  <ns0:text x="71.1111" y="391.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Pretrained weights auto-downloaded</ns0:text>
  <ns0:rect x="391.1111" y="248.8889" width="355.5556" height="151.1111" rx="8.8889" fill="var(--info-pale)" filter="url(#shadow)" stroke="var(--info-mid)" stroke-width="1.7778" />
  <ns0:rect x="391.1111" y="248.8889" width="355.5556" height="32" rx="8.8889" fill="var(--info-mid)" />
  <ns0:rect x="391.1111" y="270.2222" width="355.5556" height="10.6667" fill="var(--info-mid)" />
  <ns0:text x="568.8889" y="271.1111" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">pipeline() API</ns0:text>
  <ns0:text x="408.8889" y="302.2222" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">from transformers import pipeline</ns0:text>
  <ns0:text x="408.8889" y="318.2222" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">nlp = pipeline("sentiment-analysis")</ns0:text>
  <ns0:text x="408.8889" y="334.2222" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">nlp("I love this!")</ns0:text>
  <ns0:text x="408.8889" y="361.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Tasks: text-generation, summarization,</ns0:text>
  <ns0:text x="408.8889" y="376.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">translation, fill-mask, image-classification,</ns0:text>
  <ns0:text x="408.8889" y="392.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">object-detection, audio-classification ...</ns0:text>
  <ns0:rect x="764.4444" y="248.8889" width="337.7778" height="151.1111" rx="8.8889" fill="var(--ok-pale)" filter="url(#shadow)" stroke="var(--ok-dk)" stroke-width="1.7778" />
  <ns0:rect x="764.4444" y="248.8889" width="337.7778" height="32" rx="8.8889" fill="var(--ok-dk)" />
  <ns0:rect x="764.4444" y="270.2222" width="337.7778" height="10.6667" fill="var(--ok-dk)" />
  <ns0:text x="933.3333" y="271.1111" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">Fine-Tuning (PEFT / LoRA)</ns0:text>
  <ns0:text x="782.2222" y="302.2222" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">from peft import LoraConfig,</ns0:text>
  <ns0:text x="782.2222" y="318.2222" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">    get_peft_model</ns0:text>
  <ns0:text x="782.2222" y="343.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Full fine-tune (all params)</ns0:text>
  <ns0:text x="782.2222" y="359.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• LoRA (low-rank adapters, &lt;1% params)</ns0:text>
  <ns0:text x="782.2222" y="375.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• QLoRA (4-bit quantized LoRA)</ns0:text>
  <ns0:text x="782.2222" y="391.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Trainer / SFTTrainer helper classes</ns0:text>
  <ns0:line x1="222.2222" y1="400" x2="222.2222" y2="453.3333" stroke="var(--primary-dk)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <ns0:line x1="568.8889" y1="400" x2="568.8889" y2="453.3333" stroke="var(--info-mid)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <ns0:line x1="933.3333" y1="400" x2="933.3333" y2="453.3333" stroke="var(--ok-dk)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <ns0:rect x="26.6667" y="453.3333" width="320" height="71.1111" rx="7.1111" fill="var(--warn-pale3)" filter="url(#shadow)" stroke="var(--warn-amber)" stroke-width="1.3333" />
  <ns0:text x="186.6667" y="476.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-mid)" text-anchor="middle">datasets library</ns0:text>
  <ns0:text x="44.4444" y="496" font-family="monospace" font-size="10" fill="var(--text-dark)">from datasets import load_dataset</ns0:text>
  <ns0:text x="44.4444" y="512" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Streaming, caching, Arrow format</ns0:text>
  <ns0:rect x="364.4444" y="453.3333" width="408.8889" height="71.1111" rx="7.1111" fill="var(--danger-pale3)" filter="url(#shadow)" stroke="var(--danger-dk)" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="476.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">evaluate library</ns0:text>
  <ns0:text x="382.2222" y="496" font-family="monospace" font-size="10" fill="var(--text-dark)">import evaluate; bleu = evaluate.load("bleu")</ns0:text>
  <ns0:text x="382.2222" y="512" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">BLEU, ROUGE, BERTScore, accuracy, F1 ...</ns0:text>
  <ns0:rect x="791.1111" y="453.3333" width="320" height="71.1111" rx="7.1111" fill="var(--primary-pale3)" filter="url(#shadow)" stroke="var(--primary-strong)" stroke-width="1.3333" />
  <ns0:text x="951.1111" y="476.4444" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-strong)" text-anchor="middle">Inference API</ns0:text>
  <ns0:text x="808.8889" y="496" font-family="Arial,sans-serif" font-size="10" fill="var(--text-dark)">REST API — no GPU needed locally</ns0:text>
  <ns0:text x="808.8889" y="512" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">hf_hub_download(), InferenceClient</ns0:text>
  <ns0:rect x="26.6667" y="552.8889" width="1084.4444" height="44.4444" rx="7.1111" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="577.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">HuggingFace is the GitHub for ML — discover, share, and deploy any model or dataset with a single pip install transformers</ns0:text>

  <text x="1025" y="306.902654867257" font-size="16.21099812402" font-weight="bold" fill="var(--ok-text)" text-anchor="middle" font-family="Arial, sans-serif">PEFT / LoRA</text>
  <text x="860" y="337.699115044248" font-size="13.171435975767" fill="var(--ok-text)" font-family="Courier New, monospace">get_peft_model()</text>

  <rect x="40" y="473.644841" width="354.098361" height="72.274103" rx="6.508413" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="217.04918" y="497.133891" font-size="13.197217" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">datasets library</text>
  <text x="59.672131" y="517.00937" font-size="10.847354" fill="var(--text)" font-family="Courier New, monospace">from datasets import load_dataset</text>
  <text x="59.672131" y="533.271054" font-size="10.847354" fill="var(--text-muted)" font-family="Arial, sans-serif">Streaming, caching, Arrow format</text>
  <rect x="413.770387" y="473.644841" width="452.459016" height="72.274103" rx="6.508413" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="497.133891" font-size="13.197217" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">evaluate library</text>
  <text x="433.442623" y="517.00937" font-size="10.847354" fill="var(--text)" font-family="Courier New, monospace">import evaluate; bleu = evaluate.load("bleu")</text>
  <text x="433.442623" y="533.271054" font-size="10.847354" fill="var(--text-muted)" font-family="Arial, sans-serif">BLEU, ROUGE, BERTScore, accuracy, F1 ...</text>
  <rect x="885.901639" y="473.644841" width="354.098361" height="72.274103" rx="6.508413" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1062.95082" y="497.133891" font-size="13.197217" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Inference API</text>
  <text x="905.57377" y="517.00937" font-size="10.847354" fill="var(--text)" font-family="Arial, sans-serif">REST API — no GPU needed locally</text>
  <text x="905.57377" y="533.271054" font-size="10.847354" fill="var(--text-muted)" font-family="Arial, sans-serif">hf_hub_download(), InferenceClient</text>
  <rect x="40" y="574.828742" width="1199.999895" height="45.171258" rx="6.508413" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="600.124633" font-size="12.25469" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">HuggingFace is the GitHub for ML — discover, share, and deploy any model or dataset with a single pip install transformers</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="374.42623" y="40" width="531.147541" height="144.548318" rx="6.508413" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="374.42623" y="40" width="531.147541" height="39.750734" rx="6.508413" fill="var(--warn-accent)" />
  <rect x="374.42623" y="68.909574" width="531.147541" height="10.84116" fill="var(--warn-accent)" rx="6.508413"/>
  <text x="640" y="68.909574" font-family="Arial,sans-serif" font-size="18.853353" font-weight="bold" fill="var(--bg)" text-anchor="middle">HuggingFace Hub  (huggingface.co)</text>
  <rect x="394.098361" y="94.205577" width="157.377049" height="72.274103" rx="6.508413" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="472.786885" y="114.984309" font-family="Arial,sans-serif" font-size="13.197217" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Models</text>
  <text x="472.786885" y="133.052947" font-family="Arial,sans-serif" font-size="10.847354" fill="var(--text-muted)" text-anchor="middle">750 000+ models</text>
  <text x="472.786885" y="149.314631" font-family="Arial,sans-serif" font-size="10.847354" fill="var(--text-muted)" text-anchor="middle">versioned + model cards</text>
  <rect x="561.311475" y="94.205577" width="157.377049" height="72.274103" rx="6.508413" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="114.984309" font-family="Arial,sans-serif" font-size="13.197217" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Datasets</text>
  <text x="640" y="133.052947" font-family="Arial,sans-serif" font-size="10.847354" fill="var(--text-muted)" text-anchor="middle">100 000+ datasets</text>
  <text x="640" y="149.314631" font-family="Arial,sans-serif" font-size="10.847354" fill="var(--text-muted)" text-anchor="middle">streaming support</text>
  <rect x="728.52459" y="94.205577" width="157.377049" height="72.274103" rx="6.508413" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="807.213115" y="114.984309" font-family="Arial,sans-serif" font-size="13.197217" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Spaces</text>
  <text x="807.213115" y="133.052947" font-family="Arial,sans-serif" font-size="10.847354" fill="var(--text-muted)" text-anchor="middle">Gradio / Streamlit</text>
  <text x="807.213115" y="149.314631" font-family="Arial,sans-serif" font-size="10.847354" fill="var(--text-muted)" text-anchor="middle">hosted demos</text>
  <line x1="472.786885" y1="184.548318" x2="256.393443" y2="265.856739" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="640" y1="184.548318" x2="640" y2="265.856739" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="807.213115" y1="184.548318" x2="1013.770492" y2="265.856739" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="69.508197" y="265.856739" width="373.770492" height="153.582524" rx="6.508413" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="69.508197" y="265.856739" width="373.770492" height="32.523369" rx="6.508413" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="69.508197" y="287.538948" width="373.770492" height="10.84116" fill="var(--primary-fill)" rx="6.508413" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="256.393443" y="288.442312" font-family="Arial,sans-serif" font-size="15.082596" font-weight="bold" fill="var(--bg)" text-anchor="middle">transformers library</text>
  <text x="89.180328" y="320.062316" font-family="monospace" font-size="11.312055" fill="var(--text)">from transformers import AutoModel,</text>
  <text x="89.180328" y="336.324001" font-family="monospace" font-size="11.312055" fill="var(--text)">    AutoTokenizer, AutoConfig</text>
  <text x="89.180328" y="361.619892" font-family="Arial,sans-serif" font-size="11.312055" fill="var(--text-muted)">• Load any model in 2 lines of code</text>
  <text x="89.180328" y="377.881576" font-family="Arial,sans-serif" font-size="11.312055" fill="var(--text-muted)">• PyTorch &amp; TensorFlow backends</text>
  <text x="89.180328" y="394.143261" font-family="Arial,sans-serif" font-size="11.312055" fill="var(--text-muted)">• 150+ model architectures (BERT, GPT, T5...)</text>
  <text x="89.180328" y="410.404945" font-family="Arial,sans-serif" font-size="11.312055" fill="var(--text-muted)">• Pretrained weights auto-downloaded</text>
  <rect x="443.278689" y="265.856739" width="393.442623" height="153.582524" rx="6.508413" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <rect x="443.278689" y="265.856739" width="393.442623" height="32.523369" rx="6.508413" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="443.278689" y="287.538948" width="393.442623" height="10.84116" fill="var(--info-fill)" rx="6.508413" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="288.442312" font-family="Arial,sans-serif" font-size="15.082596" font-weight="bold" fill="var(--bg)" text-anchor="middle">pipeline() API</text>
  <text x="462.95082" y="320.062316" font-family="monospace" font-size="11.312055" fill="var(--text)">from transformers import pipeline</text>
  <text x="462.95082" y="336.324001" font-family="monospace" font-size="11.312055" fill="var(--text)">nlp = pipeline("sentiment-analysis")</text>
  <text x="462.95082" y="352.585685" font-family="monospace" font-size="11.312055" fill="var(--text)">nlp("I love this!")</text>
  <text x="462.95082" y="380.591894" font-family="Arial,sans-serif" font-size="11.312055" fill="var(--text-muted)">Tasks: text-generation, summarization,</text>
  <text x="462.95082" y="395.950214" font-family="Arial,sans-serif" font-size="11.312055" fill="var(--text-muted)">translation, fill-mask, image-classification,</text>
  <text x="462.95082" y="412.211898" font-family="Arial,sans-serif" font-size="11.312055" fill="var(--text-muted)">object-detection, audio-classification ...</text>
  <rect x="856.393338" y="265.856739" width="373.770492" height="153.582524" rx="6.508413" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="856.393338" y="265.856739" width="373.770492" height="32.523369" rx="6.508413" fill="var(--ok-accent)" />
  <rect x="856.393338" y="287.538948" width="373.770492" height="10.84116" fill="var(--ok-accent)" rx="6.508413"/>
  <text x="1043.278584" y="288.442312" font-family="Arial,sans-serif" font-size="15.082596" font-weight="bold" fill="var(--bg)" text-anchor="middle">Fine-Tuning (PEFT / LoRA)</text>
  <text x="876.065574" y="320.062316" font-family="monospace" font-size="11.312055" fill="var(--text)">from peft import LoraConfig,</text>
  <text x="876.065574" y="336.324001" font-family="monospace" font-size="11.312055" fill="var(--text)">    get_peft_model</text>
  <text x="876.065574" y="361.619892" font-family="Arial,sans-serif" font-size="11.312055" fill="var(--text-muted)">• Full fine-tune (all params)</text>
  <text x="876.065574" y="377.881576" font-family="Arial,sans-serif" font-size="11.312055" fill="var(--text-muted)">• LoRA (low-rank adapters, &lt;1% params)</text>
  <text x="876.065574" y="394.143261" font-family="Arial,sans-serif" font-size="11.312055" fill="var(--text-muted)">• QLoRA (4-bit quantized LoRA)</text>
  <text x="876.065574" y="410.404945" font-family="Arial,sans-serif" font-size="11.312055" fill="var(--text-muted)">• Trainer / SFTTrainer helper classes</text>

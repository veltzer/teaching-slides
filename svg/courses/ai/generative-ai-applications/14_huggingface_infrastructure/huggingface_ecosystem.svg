<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="386.875" y="64.1667" width="506.25" height="128.8889" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="386.875" y="64.1667" width="506.25" height="35.4444" rx="6" fill="var(--warn-accent)" />
  <rect x="386.875" y="89.9444" width="506.25" height="9.6667" fill="var(--warn-accent)" rx="6"/>
  <text x="640" y="89.9444" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)" text-anchor="middle">HuggingFace Hub  (huggingface.co)</text>
  <rect x="405.625" y="112.5" width="150" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="480.625" y="131.0277" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Models</text>
  <text x="480.625" y="147.1389" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">750 000+ models</text>
  <text x="480.625" y="161.6389" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">versioned + model cards</text>
  <rect x="565" y="112.5" width="150" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="131.0277" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Datasets</text>
  <text x="640" y="147.1389" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">100 000+ datasets</text>
  <text x="640" y="161.6389" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">streaming support</text>
  <rect x="724.375" y="112.5" width="150" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="799.375" y="131.0277" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Spaces</text>
  <text x="799.375" y="147.1389" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Gradio / Streamlit</text>
  <text x="799.375" y="161.6389" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">hosted demos</text>
  <line x1="480.625" y1="193.0556" x2="274.375" y2="265.5556" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="640" y1="193.0556" x2="640" y2="265.5556" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="799.375" y1="193.0556" x2="996.25" y2="265.5556" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="96.25" y="265.5556" width="356.25" height="136.9444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="96.25" y="265.5556" width="356.25" height="29" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="96.25" y="284.8889" width="356.25" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="274.375" y="285.6944" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">transformers library</text>
  <text x="115" y="313.8889" font-family="monospace" font-size="10.4284" fill="var(--text)">from transformers import AutoModel,</text>
  <text x="115" y="328.3889" font-family="monospace" font-size="10.4284" fill="var(--text)">    AutoTokenizer, AutoConfig</text>
  <text x="115" y="350.9444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Load any model in 2 lines of code</text>
  <text x="115" y="365.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• PyTorch &amp; TensorFlow backends</text>
  <text x="115" y="379.9444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• 150+ model architectures (BERT, GPT, T5...)</text>
  <text x="115" y="394.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Pretrained weights auto-downloaded</text>
  <rect x="452.5" y="265.5556" width="375" height="136.9444" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <rect x="452.5" y="265.5556" width="375" height="29" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="452.5" y="284.8889" width="375" height="9.6667" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="285.6944" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">pipeline() API</text>
  <text x="471.25" y="313.8889" font-family="monospace" font-size="10.4284" fill="var(--text)">from transformers import pipeline</text>
  <text x="471.25" y="328.3889" font-family="monospace" font-size="10.4284" fill="var(--text)">nlp = pipeline("sentiment-analysis")</text>
  <text x="471.25" y="342.8889" font-family="monospace" font-size="10.4284" fill="var(--text)">nlp("I love this!")</text>
  <text x="471.25" y="367.8611" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Tasks: text-generation, summarization,</text>
  <text x="471.25" y="381.5556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">translation, fill-mask, image-classification,</text>
  <text x="471.25" y="396.0556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">object-detection, audio-classification ...</text>
  <rect x="846.2499" y="265.5556" width="356.25" height="136.9444" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="846.2499" y="265.5556" width="356.25" height="29" rx="6" fill="var(--ok-accent)" />
  <rect x="846.2499" y="284.8889" width="356.25" height="9.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="1024.3749" y="285.6944" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Fine-Tuning (PEFT / LoRA)</text>
  <text x="865" y="313.8889" font-family="monospace" font-size="10.4284" fill="var(--text)">from peft import LoraConfig,</text>
  <text x="865" y="328.3889" font-family="monospace" font-size="10.4284" fill="var(--text)">    get_peft_model</text>
  <text x="865" y="350.9444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Full fine-tune (all params)</text>
  <text x="865" y="365.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• LoRA (low-rank adapters, &lt;1% params)</text>
  <text x="865" y="379.9444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• QLoRA (4-bit quantized LoRA)</text>
  <text x="865" y="394.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Trainer / SFTTrainer helper classes</text>
  <line x1="274.375" y1="402.5" x2="274.375" y2="450.8333" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="640" y1="402.5" x2="640" y2="450.8333" stroke="var(--info-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="1024.3749" y1="402.5" x2="1024.3749" y2="450.8333" stroke="var(--ok-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="68.125" y="450.8333" width="337.5" height="64.4444" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="236.875" y="471.7777" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">datasets library</text>
  <text x="86.875" y="489.5" font-family="monospace" font-size="10" fill="var(--text)">from datasets import load_dataset</text>
  <text x="86.875" y="504" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Streaming, caching, Arrow format</text>
  <rect x="424.3749" y="450.8333" width="431.25" height="64.4444" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="471.7777" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">evaluate library</text>
  <text x="443.125" y="489.5" font-family="monospace" font-size="10" fill="var(--text)">import evaluate; bleu = evaluate.load("bleu")</text>
  <text x="443.125" y="504" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">BLEU, ROUGE, BERTScore, accuracy, F1 ...</text>
  <rect x="874.375" y="450.8333" width="337.5" height="64.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1043.125" y="471.7777" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Inference API</text>
  <text x="893.125" y="489.5" font-family="Arial,sans-serif" font-size="10" fill="var(--text)">REST API — no GPU needed locally</text>
  <text x="893.125" y="504" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">hf_hub_download(), InferenceClient</text>
  <rect x="68.125" y="541.0556" width="1143.7499" height="40.2777" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="563.6111" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">HuggingFace is the GitHub for ML — discover, share, and deploy any model or dataset with a single pip install transformers</text>
</svg>
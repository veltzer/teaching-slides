<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- HuggingFace Hub — top center, large box -->
  <rect x="370" y="30" width="540" height="160" rx="12" fill="#fff3e0" filter="url(#shadow)" stroke="#e65100" stroke-width="2"/>
  <rect x="370" y="30" width="540" height="44" rx="12" fill="#e65100"/>
  <rect x="370" y="62" width="540" height="12" fill="#e65100"/>
  <text x="640" y="62" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">HuggingFace Hub  (huggingface.co)</text>

  <!-- Hub sub-sections -->
  <rect x="390" y="90" width="160" height="80" rx="8" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="470" y="113" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">Models</text>
  <text x="470" y="133" font-family="Arial,sans-serif" font-size="11" fill="#555" text-anchor="middle">750 000+ models</text>
  <text x="470" y="151" font-family="Arial,sans-serif" font-size="11" fill="#555" text-anchor="middle">versioned + model cards</text>

  <rect x="560" y="90" width="160" height="80" rx="8" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="640" y="113" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">Datasets</text>
  <text x="640" y="133" font-family="Arial,sans-serif" font-size="11" fill="#555" text-anchor="middle">100 000+ datasets</text>
  <text x="640" y="151" font-family="Arial,sans-serif" font-size="11" fill="#555" text-anchor="middle">streaming support</text>

  <rect x="730" y="90" width="160" height="80" rx="8" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="810" y="113" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">Spaces</text>
  <text x="810" y="133" font-family="Arial,sans-serif" font-size="11" fill="#555" text-anchor="middle">Gradio / Streamlit</text>
  <text x="810" y="151" font-family="Arial,sans-serif" font-size="11" fill="#555" text-anchor="middle">hosted demos</text>

  <!-- Arrows from Hub down to components -->
  <line x1="470" y1="190" x2="250" y2="280" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="190" x2="640" y2="280" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="190" x2="1020" y2="280" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- transformers library -->
  <rect x="60" y="280" width="380" height="170" rx="10" fill="#e3f2fd" filter="url(#shadow)" stroke="#1565c0" stroke-width="2"/>
  <rect x="60" y="280" width="380" height="36" rx="10" fill="url(#grad-accent)"/>
  <rect x="60" y="304" width="380" height="12" fill="url(#grad-accent)"/>
  <text x="250" y="305" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">transformers library</text>
  <text x="80" y="340" font-family="monospace" font-size="12" fill="#333">from transformers import AutoModel,</text>
  <text x="80" y="358" font-family="monospace" font-size="12" fill="#333">    AutoTokenizer, AutoConfig</text>
  <text x="80" y="386" font-family="Arial,sans-serif" font-size="12" fill="#555">• Load any model in 2 lines of code</text>
  <text x="80" y="404" font-family="Arial,sans-serif" font-size="12" fill="#555">• PyTorch &amp; TensorFlow backends</text>
  <text x="80" y="422" font-family="Arial,sans-serif" font-size="12" fill="#555">• 150+ model architectures (BERT, GPT, T5...)</text>
  <text x="80" y="440" font-family="Arial,sans-serif" font-size="12" fill="#555">• Pretrained weights auto-downloaded</text>

  <!-- Pipelines -->
  <rect x="440" y="280" width="400" height="170" rx="10" fill="#f3e5f5" filter="url(#shadow)" stroke="#7b1fa2" stroke-width="2"/>
  <rect x="440" y="280" width="400" height="36" rx="10" fill="#7b1fa2"/>
  <rect x="440" y="304" width="400" height="12" fill="#7b1fa2"/>
  <text x="640" y="305" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">pipeline() API</text>
  <text x="460" y="340" font-family="monospace" font-size="12" fill="#333">from transformers import pipeline</text>
  <text x="460" y="358" font-family="monospace" font-size="12" fill="#333">nlp = pipeline("sentiment-analysis")</text>
  <text x="460" y="376" font-family="monospace" font-size="12" fill="#333">nlp("I love this!")</text>
  <text x="460" y="407" font-family="Arial,sans-serif" font-size="12" fill="#555">Tasks: text-generation, summarization,</text>
  <text x="460" y="424" font-family="Arial,sans-serif" font-size="12" fill="#555">translation, fill-mask, image-classification,</text>
  <text x="460" y="442" font-family="Arial,sans-serif" font-size="12" fill="#555">object-detection, audio-classification ...</text>

  <!-- Fine-tuning -->
  <rect x="860" y="280" width="380" height="170" rx="10" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="2"/>
  <rect x="860" y="280" width="380" height="36" rx="10" fill="#2e7d32"/>
  <rect x="860" y="304" width="380" height="12" fill="#2e7d32"/>
  <text x="1050" y="305" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Fine-Tuning (PEFT / LoRA)</text>
  <text x="880" y="340" font-family="monospace" font-size="12" fill="#333">from peft import LoraConfig,</text>
  <text x="880" y="358" font-family="monospace" font-size="12" fill="#333">    get_peft_model</text>
  <text x="880" y="386" font-family="Arial,sans-serif" font-size="12" fill="#555">• Full fine-tune (all params)</text>
  <text x="880" y="404" font-family="Arial,sans-serif" font-size="12" fill="#555">• LoRA (low-rank adapters, &lt;1% params)</text>
  <text x="880" y="422" font-family="Arial,sans-serif" font-size="12" fill="#555">• QLoRA (4-bit quantized LoRA)</text>
  <text x="880" y="440" font-family="Arial,sans-serif" font-size="12" fill="#555">• Trainer / SFTTrainer helper classes</text>

  <!-- Arrows from components down to Trainer/Datasets -->
  <line x1="250" y1="450" x2="250" y2="510" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="450" x2="640" y2="510" stroke="#7b1fa2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1050" y1="450" x2="1050" y2="510" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Datasets row -->
  <rect x="30" y="510" width="360" height="80" rx="8" fill="#fff8e1" filter="url(#shadow)" stroke="#f9a825" stroke-width="1.5"/>
  <text x="210" y="536" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#f57f17" text-anchor="middle">datasets library</text>
  <text x="50" y="558" font-family="monospace" font-size="11" fill="#333">from datasets import load_dataset</text>
  <text x="50" y="576" font-family="Arial,sans-serif" font-size="11" fill="#555">Streaming, caching, Arrow format</text>

  <!-- Evaluate row -->
  <rect x="410" y="510" width="460" height="80" rx="8" fill="#fce4ec" filter="url(#shadow)" stroke="#c62828" stroke-width="1.5"/>
  <text x="640" y="536" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">evaluate library</text>
  <text x="430" y="558" font-family="monospace" font-size="11" fill="#333">import evaluate; bleu = evaluate.load("bleu")</text>
  <text x="430" y="576" font-family="Arial,sans-serif" font-size="11" fill="#555">BLEU, ROUGE, BERTScore, accuracy, F1 ...</text>

  <!-- Inference row -->
  <rect x="890" y="510" width="360" height="80" rx="8" fill="#e0f7fa" filter="url(#shadow)" stroke="#00838f" stroke-width="1.5"/>
  <text x="1070" y="536" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#00838f" text-anchor="middle">Inference API</text>
  <text x="910" y="558" font-family="Arial,sans-serif" font-size="11" fill="#333">REST API — no GPU needed locally</text>
  <text x="910" y="576" font-family="Arial,sans-serif" font-size="11" fill="#555">hf_hub_download(), InferenceClient</text>

  <!-- Bottom tagline -->
  <rect x="30" y="622" width="1220" height="50" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="640" y="650" font-family="Arial,sans-serif" font-size="13" fill="#e65100" text-anchor="middle" font-weight="bold">HuggingFace is the GitHub for ML — discover, share, and deploy any model or dataset with a single pip install transformers</text>
</svg>

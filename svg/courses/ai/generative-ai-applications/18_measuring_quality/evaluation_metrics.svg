<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- BLEU -->
  <rect x="40" y="40" width="285" height="300" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">BLEU</text>
  <text x="182" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">n-gram precision</text>
  <text x="182" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Range 0-1</text>
  <text x="182" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Translation, code</text>
  <text x="182" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Fast, CPU</text>
  <text x="182" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--bg)">No synonyms</text>
  <text x="182" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--bg)">No semantics</text>

  <!-- ROUGE -->
  <rect x="340" y="40" width="285" height="300" rx="8" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="482" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">ROUGE</text>
  <text x="482" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">n-gram recall</text>
  <text x="482" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">ROUGE-1/2/L</text>
  <text x="482" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Summaries, Q&amp;A</text>
  <text x="482" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Fast, CPU</text>
  <text x="482" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--bg)">Surface overlap</text>
  <text x="482" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--bg)">Ignores meaning</text>

  <!-- BERTScore -->
  <rect x="640" y="40" width="285" height="300" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="782" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">BERTScore</text>
  <text x="782" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Semantic embeddings</text>
  <text x="782" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">P / R / F1</text>
  <text x="782" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Open-ended gen</text>
  <text x="782" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">GPU helpful</text>
  <text x="782" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--bg)">Captures synonyms</text>
  <text x="782" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--bg)">Needs BERT</text>

  <!-- Human -->
  <rect x="940" y="40" width="300" height="300" rx="8" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">Human</text>
  <text x="1090" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Gold standard</text>
  <text x="1090" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Fluency, facts</text>
  <text x="1090" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">A/B preference</text>
  <text x="1090" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Safety review</text>
  <text x="1090" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--bg)">Expensive, slow</text>
  <text x="1090" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--bg)">Disagreement</text>

  <!-- Comparison table -->
  <rect x="40" y="370" width="1200" height="250" rx="8" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Cost vs Semantics</text>

  <text x="80" y="440" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Metric</text>
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Cost</text>
  <text x="700" y="440" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Semantics</text>
  <text x="1000" y="440" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Use</text>

  <text x="80" y="475" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">BLEU</text>
  <text x="400" y="475" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">very low</text>
  <text x="700" y="475" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">no</text>
  <text x="1000" y="475" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">daily CI</text>

  <text x="80" y="510" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">ROUGE</text>
  <text x="400" y="510" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">very low</text>
  <text x="700" y="510" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">no</text>
  <text x="1000" y="510" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">summaries</text>

  <text x="80" y="545" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">BERTScore</text>
  <text x="400" y="545" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">medium</text>
  <text x="700" y="545" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">yes</text>
  <text x="1000" y="545" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">best auto</text>

  <text x="80" y="580" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Human</text>
  <text x="400" y="580" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">high</text>
  <text x="700" y="580" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">yes</text>
  <text x="1000" y="580" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">final arbiter</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Human Evaluation: The Gold Standard</text>
  <!-- Task Design -->
  <rect x="30" y="55" width="640" height="200" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="80" font-size="14" font-weight="bold" fill="#4a90e2">1. TASK DESIGN</text>
  <rect x="60" y="95" width="580" height="145" rx="5" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="80" y="118" font-size="12" fill="#333">Rate this response on a 1-5 scale:</text>
  <text x="80" y="145" font-size="12" font-weight="bold" fill="#333">Question: "What causes rain?"</text>
  <text x="80" y="170" font-size="11" fill="#555">Response: "Rain occurs when water vapor in the</text>
  <text x="80" y="185" font-size="11" fill="#555">atmosphere condenses..."</text>
  <!-- Rating scales -->
  <rect x="100" y="200" width="150" height="25" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="175" y="217" text-anchor="middle" font-size="11" fill="#333">Accuracy: 1-5</text>
  <rect x="270" y="200" width="150" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="345" y="217" text-anchor="middle" font-size="11" fill="#333">Helpfulness: 1-5</text>
  <rect x="440" y="200" width="150" height="25" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="515" y="217" text-anchor="middle" font-size="11" fill="#333">Fluency: 1-5</text>
  <!-- Inter-annotator agreement -->
  <rect x="30" y="270" width="310" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="50" y="295" font-size="14" font-weight="bold" fill="#28a745">2. INTER-ANNOTATOR AGREEMENT</text>
  <text x="50" y="320" font-size="12" fill="#555">Multiple raters per example</text>
  <text x="50" y="340" font-size="12" fill="#555">Cohen's kappa or Krippendorff's alpha</text>
  <!-- Calibration -->
  <rect x="360" y="270" width="310" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="380" y="295" font-size="14" font-weight="bold" fill="#856404">3. CALIBRATION</text>
  <text x="380" y="320" font-size="12" fill="#555">Include gold-standard examples</text>
  <text x="380" y="340" font-size="12" fill="#555">Regular annotator meetings</text>
</svg>
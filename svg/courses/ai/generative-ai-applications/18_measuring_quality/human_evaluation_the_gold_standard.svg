<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="49.0909" text-anchor="middle" font-size="29.4545" font-weight="bold" fill="var(--text)">Human Evaluation: The Gold Standard</text>
  <rect x="54.8571" y="90" width="1170.2857" height="327.2727" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="91.4286" y="130.9091" font-size="22.9091" font-weight="bold" fill="var(--primary-accent)">1. TASK DESIGN</text>
  <rect x="109.7143" y="155.4545" width="1060.5714" height="237.2727" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.6364" />
  <text x="146.2857" y="193.0909" font-size="19.6364" fill="var(--text)">Rate this response on a 1-5 scale:</text>
  <text x="146.2857" y="237.2727" font-size="19.6364" font-weight="bold" fill="var(--text)">Question: "What causes rain?"</text>
  <text x="146.2857" y="278.1818" font-size="18" fill="var(--text-muted)">Response: "Rain occurs when water vapor in the</text>
  <text x="146.2857" y="302.7273" font-size="18" fill="var(--text-muted)">atmosphere condenses..."</text>
  <rect x="182.8571" y="327.2727" width="274.2857" height="40.9091" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="320" y="355.0909" text-anchor="middle" font-size="18" fill="var(--text)">Accuracy: 1-5</text>
  <rect x="493.7143" y="327.2727" width="274.2857" height="40.9091" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="630.8571" y="355.0909" text-anchor="middle" font-size="18" fill="var(--text)">Helpfulness: 1-5</text>
  <rect x="804.5714" y="327.2727" width="274.2857" height="40.9091" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="941.7143" y="355.0909" text-anchor="middle" font-size="18" fill="var(--text)">Fluency: 1-5</text>
  <rect x="54.8571" y="441.8182" width="566.8571" height="130.9091" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="91.4286" y="482.7273" font-size="22.9091" font-weight="bold" fill="var(--ok-accent)">2. INTER-ANNOTATOR AGREEMENT</text>
  <text x="91.4286" y="523.6364" font-size="19.6364" fill="var(--text-muted)">Multiple raters per example</text>
  <text x="91.4286" y="556.3636" font-size="19.6364" fill="var(--text-muted)">Cohen's kappa or Krippendorff's alpha</text>
  <rect x="658.2857" y="441.8182" width="566.8571" height="130.9091" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="694.8571" y="482.7273" font-size="22.9091" font-weight="bold" fill="var(--danger-accent)">3. CALIBRATION</text>
  <text x="694.8571" y="523.6364" font-size="19.6364" fill="var(--text-muted)">Include gold-standard examples</text>
  <text x="694.8571" y="556.3636" font-size="19.6364" fill="var(--text-muted)">Regular annotator meetings</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="589.9588" y="47.4074" text-anchor="middle" font-size="28.4444" font-weight="bold" fill="var(--text)">Why Measure Quality?</text>
  <text x="589.9588" y="86.9136" text-anchor="middle" font-size="20.5432" fill="var(--text-muted)">Without measurement, you're flying blind</text>
  <rect x="50.5679" y="118.5185" width="1078.7817" height="142.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="84.2799" y="158.0247" font-size="18.9629" fill="var(--text)">"Is my fine-tuned model better?"     -&gt; Need metrics</text>
  <text x="84.2799" y="197.5308" font-size="18.9629" fill="var(--text)">"Which prompt strategy works best?"   -&gt; Need comparison</text>
  <text x="84.2799" y="237.037" font-size="18.9629" fill="var(--text)">"Is this model safe to deploy?"       -&gt; Need evaluation</text>
  <rect x="50.5679" y="292.3457" width="1078.7817" height="347.6543" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="589.9588" y="339.753" text-anchor="middle" font-size="23.7037" font-weight="bold" fill="var(--primary-accent)">Quality Dimensions</text>
  <rect x="101.1358" y="363.4567" width="471.967" height="47.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="337.1193" y="395.0617" text-anchor="middle" font-size="18.9629" fill="var(--text)">FLUENCY - Is the text grammatical?</text>
  <rect x="606.8147" y="363.4567" width="471.967" height="47.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="842.7982" y="395.0617" text-anchor="middle" font-size="18.9629" fill="var(--text)">RELEVANCE - Does it address the query?</text>
  <rect x="101.1358" y="423.5061" width="471.967" height="47.4074" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="337.1193" y="455.1111" text-anchor="middle" font-size="18.9629" fill="var(--text)">ACCURACY - Are the facts correct?</text>
  <rect x="606.8147" y="423.5061" width="471.967" height="47.4074" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="842.7982" y="455.1111" text-anchor="middle" font-size="18.9629" fill="var(--text)">COHERENCE - Does it make sense?</text>
  <rect x="101.1358" y="483.5555" width="471.967" height="47.4074" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="337.1193" y="515.1604" text-anchor="middle" font-size="18.9629" fill="var(--text)">COMPLETENESS - Covers the topic?</text>
  <rect x="606.8147" y="483.5555" width="471.967" height="47.4074" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="842.7982" y="515.1604" text-anchor="middle" font-size="18.9629" fill="var(--text)">SAFETY - Is it free from harm?</text>
  <rect x="353.9753" y="543.6049" width="471.967" height="47.4074" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="589.9588" y="575.2098" text-anchor="middle" font-size="18.9629" fill="var(--text)">CONSISTENCY - Same quality every time?</text>
</svg>
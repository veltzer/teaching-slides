<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="29.6795" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Why Measure Quality?</text>
  <text x="640.0001" y="78.6667" text-anchor="middle" font-size="21.4352" fill="var(--text-muted)" font-family="Arial, sans-serif">Without measurement, you're flying blind</text>
  <rect x="40" y="109.6" width="1200" height="139.2" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="148.2667" font-size="19.7863" fill="var(--text)" font-family="Arial, sans-serif">"Is my fine-tuned model better?"     -&gt; Need metrics</text>
  <text x="77.5001" y="186.9333" font-size="19.7863" fill="var(--text)" font-family="Arial, sans-serif">"Which prompt strategy works best?"   -&gt; Need comparison</text>
  <text x="77.5001" y="225.6" font-size="19.7863" fill="var(--text)" font-family="Arial, sans-serif">"Is this model safe to deploy?"       -&gt; Need evaluation</text>
  <rect x="40" y="279.7334" width="1200" height="340.2666" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="326.1333" text-anchor="middle" font-size="24.7329" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Quality Dimensions</text>
  <rect x="96.25" y="349.3332" width="525" height="46.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="358.75" y="380.2666" text-anchor="middle" font-size="19.7863" fill="var(--text)" font-family="Arial, sans-serif">FLUENCY - Is the text grammatical?</text>
  <rect x="658.75" y="349.3332" width="525" height="46.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.25" y="380.2666" text-anchor="middle" font-size="19.7863" fill="var(--text)" font-family="Arial, sans-serif">RELEVANCE - Does it address the query?</text>
  <rect x="96.25" y="408.1066" width="525" height="46.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="358.75" y="439.04" text-anchor="middle" font-size="19.7863" fill="var(--text)" font-family="Arial, sans-serif">ACCURACY - Are the facts correct?</text>
  <rect x="658.75" y="408.1066" width="525" height="46.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.25" y="439.04" text-anchor="middle" font-size="19.7863" fill="var(--text)" font-family="Arial, sans-serif">COHERENCE - Does it make sense?</text>
  <rect x="96.25" y="466.8799" width="525" height="46.4" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="358.75" y="497.8132" text-anchor="middle" font-size="19.7863" fill="var(--text)" font-family="Arial, sans-serif">COMPLETENESS - Covers the topic?</text>
  <rect x="658.75" y="466.8799" width="525" height="46.4" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="921.25" y="497.8132" text-anchor="middle" font-size="19.7863" fill="var(--text)" font-family="Arial, sans-serif">SAFETY - Is it free from harm?</text>
  <rect x="377.5001" y="525.6533" width="525" height="46.4" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="556.5866" text-anchor="middle" font-size="19.7863" fill="var(--text)" font-family="Arial, sans-serif">CONSISTENCY - Same quality every time?</text>
</svg>

    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:text x="589.9588" y="47.4074" text-anchor="middle" font-size="28.4444" font-weight="bold" fill="var(--text-dark)">Why Measure Quality?</ns0:text>
  <ns0:text x="589.9588" y="86.9136" text-anchor="middle" font-size="20.5432" fill="var(--text-mid)">Without measurement, you're flying blind</ns0:text>
  <ns0:rect x="50.5679" y="118.5185" width="1078.7817" height="142.2222" rx="7.9012" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.1605" />
  <ns0:text x="84.2799" y="158.0247" font-size="18.9629" fill="var(--text-dark)">"Is my fine-tuned model better?"     -&gt; Need metrics</ns0:text>
  <ns0:text x="84.2799" y="197.5308" font-size="18.9629" fill="var(--text-dark)">"Which prompt strategy works best?"   -&gt; Need comparison</ns0:text>
  <ns0:text x="84.2799" y="237.037" font-size="18.9629" fill="var(--text-dark)">"Is this model safe to deploy?"       -&gt; Need evaluation</ns0:text>
  <ns0:rect x="50.5679" y="292.3457" width="1078.7817" height="347.6543" rx="7.9012" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.1605" />
  <ns0:text x="589.9588" y="339.753" text-anchor="middle" font-size="23.7037" font-weight="bold" fill="var(--primary-bright)">Quality Dimensions</ns0:text>
  <ns0:rect x="101.1358" y="363.4567" width="471.967" height="47.4074" rx="7.9012" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5803" />
  <ns0:text x="337.1193" y="395.0617" text-anchor="middle" font-size="18.9629" fill="var(--text-dark)">FLUENCY - Is the text grammatical?</ns0:text>
  <ns0:rect x="606.8147" y="363.4567" width="471.967" height="47.4074" rx="7.9012" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5803" />
  <ns0:text x="842.7982" y="395.0617" text-anchor="middle" font-size="18.9629" fill="var(--text-dark)">RELEVANCE - Does it address the query?</ns0:text>
  <ns0:rect x="101.1358" y="423.5061" width="471.967" height="47.4074" rx="7.9012" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.5803" />
  <ns0:text x="337.1193" y="455.1111" text-anchor="middle" font-size="18.9629" fill="var(--text-dark)">ACCURACY - Are the facts correct?</ns0:text>
  <ns0:rect x="606.8147" y="423.5061" width="471.967" height="47.4074" rx="7.9012" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.5803" />
  <ns0:text x="842.7982" y="455.1111" text-anchor="middle" font-size="18.9629" fill="var(--text-dark)">COHERENCE - Does it make sense?</ns0:text>
  <ns0:rect x="101.1358" y="483.5555" width="471.967" height="47.4074" rx="7.9012" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.5803" />
  <ns0:text x="337.1193" y="515.1604" text-anchor="middle" font-size="18.9629" fill="var(--text-dark)">COMPLETENESS - Covers the topic?</ns0:text>
  <ns0:rect x="606.8147" y="483.5555" width="471.967" height="47.4074" rx="7.9012" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.5803" />
  <ns0:text x="842.7982" y="515.1604" text-anchor="middle" font-size="18.9629" fill="var(--text-dark)">SAFETY - Is it free from harm?</ns0:text>
  <ns0:rect x="353.9753" y="543.6049" width="471.967" height="47.4074" rx="7.9012" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.5803" />
  <ns0:text x="589.9588" y="575.2098" text-anchor="middle" font-size="18.9629" fill="var(--text-dark)">CONSISTENCY - Same quality every time?</ns0:text>
</ns0:svg>
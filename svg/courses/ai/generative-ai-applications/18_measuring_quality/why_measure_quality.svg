<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="589.9588" y="47.4074" text-anchor="middle" font-size="28.4444" font-weight="bold" fill="#333">Why Measure Quality?</ns0:text>
  <ns0:text x="589.9588" y="86.9136" text-anchor="middle" font-size="20.5432" fill="#666">Without measurement, you're flying blind</ns0:text>
  <ns0:rect x="50.5679" y="118.5185" width="1078.7817" height="142.2222" rx="7.9012" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1605" />
  <ns0:text x="84.2799" y="158.0247" font-size="18.9629" fill="#333">"Is my fine-tuned model better?"     -&gt; Need metrics</ns0:text>
  <ns0:text x="84.2799" y="197.5308" font-size="18.9629" fill="#333">"Which prompt strategy works best?"   -&gt; Need comparison</ns0:text>
  <ns0:text x="84.2799" y="237.037" font-size="18.9629" fill="#333">"Is this model safe to deploy?"       -&gt; Need evaluation</ns0:text>
  <ns0:rect x="50.5679" y="292.3457" width="1078.7817" height="347.6543" rx="7.9012" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1605" />
  <ns0:text x="589.9588" y="339.753" text-anchor="middle" font-size="23.7037" font-weight="bold" fill="#4a90e2">Quality Dimensions</ns0:text>
  <ns0:rect x="101.1358" y="363.4567" width="471.967" height="47.4074" rx="7.9012" fill="#d4edda" stroke="#28a745" stroke-width="1.5803" />
  <ns0:text x="337.1193" y="395.0617" text-anchor="middle" font-size="18.9629" fill="#333">FLUENCY - Is the text grammatical?</ns0:text>
  <ns0:rect x="606.8147" y="363.4567" width="471.967" height="47.4074" rx="7.9012" fill="#d4edda" stroke="#28a745" stroke-width="1.5803" />
  <ns0:text x="842.7982" y="395.0617" text-anchor="middle" font-size="18.9629" fill="#333">RELEVANCE - Does it address the query?</ns0:text>
  <ns0:rect x="101.1358" y="423.5061" width="471.967" height="47.4074" rx="7.9012" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5803" />
  <ns0:text x="337.1193" y="455.1111" text-anchor="middle" font-size="18.9629" fill="#333">ACCURACY - Are the facts correct?</ns0:text>
  <ns0:rect x="606.8147" y="423.5061" width="471.967" height="47.4074" rx="7.9012" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5803" />
  <ns0:text x="842.7982" y="455.1111" text-anchor="middle" font-size="18.9629" fill="#333">COHERENCE - Does it make sense?</ns0:text>
  <ns0:rect x="101.1358" y="483.5555" width="471.967" height="47.4074" rx="7.9012" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5803" />
  <ns0:text x="337.1193" y="515.1604" text-anchor="middle" font-size="18.9629" fill="#333">COMPLETENESS - Covers the topic?</ns0:text>
  <ns0:rect x="606.8147" y="483.5555" width="471.967" height="47.4074" rx="7.9012" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5803" />
  <ns0:text x="842.7982" y="515.1604" text-anchor="middle" font-size="18.9629" fill="#333">SAFETY - Is it free from harm?</ns0:text>
  <ns0:rect x="353.9753" y="543.6049" width="471.967" height="47.4074" rx="7.9012" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5803" />
  <ns0:text x="589.9588" y="575.2098" text-anchor="middle" font-size="18.9629" fill="#333">CONSISTENCY - Same quality every time?</ns0:text>
</ns0:svg>
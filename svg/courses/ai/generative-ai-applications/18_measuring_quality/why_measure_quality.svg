<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="51.4286" text-anchor="middle" font-size="30.8571" font-weight="bold" fill="#333">Why Measure Quality?</text>
  <text x="640" y="94.2857" text-anchor="middle" font-size="22.2857" fill="#666">Without measurement, you're flying blind</text>
  <rect x="54.8571" y="128.5714" width="1170.2857" height="154.2857" rx="8.5714" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4286" />
  <text x="91.4286" y="171.4286" font-size="20.5714" fill="#333">"Is my fine-tuned model better?"     -&gt; Need metrics</text>
  <text x="91.4286" y="214.2857" font-size="20.5714" fill="#333">"Which prompt strategy works best?"   -&gt; Need comparison</text>
  <text x="91.4286" y="257.1429" font-size="20.5714" fill="#333">"Is this model safe to deploy?"       -&gt; Need evaluation</text>
  <rect x="54.8571" y="317.1429" width="1170.2857" height="377.1429" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4286" />
  <text x="640" y="368.5714" text-anchor="middle" font-size="25.7143" font-weight="bold" fill="#4a90e2">Quality Dimensions</text>
  <rect x="109.7143" y="394.2857" width="512" height="51.4286" rx="8.5714" fill="#d4edda" stroke="#28a745" stroke-width="1.7143" />
  <text x="365.7143" y="428.5714" text-anchor="middle" font-size="20.5714" fill="#333">FLUENCY - Is the text grammatical?</text>
  <rect x="658.2857" y="394.2857" width="512" height="51.4286" rx="8.5714" fill="#d4edda" stroke="#28a745" stroke-width="1.7143" />
  <text x="914.2857" y="428.5714" text-anchor="middle" font-size="20.5714" fill="#333">RELEVANCE - Does it address the query?</text>
  <rect x="109.7143" y="459.4286" width="512" height="51.4286" rx="8.5714" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7143" />
  <text x="365.7143" y="493.7143" text-anchor="middle" font-size="20.5714" fill="#333">ACCURACY - Are the facts correct?</text>
  <rect x="658.2857" y="459.4286" width="512" height="51.4286" rx="8.5714" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7143" />
  <text x="914.2857" y="493.7143" text-anchor="middle" font-size="20.5714" fill="#333">COHERENCE - Does it make sense?</text>
  <rect x="109.7143" y="524.5714" width="512" height="51.4286" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7143" />
  <text x="365.7143" y="558.8571" text-anchor="middle" font-size="20.5714" fill="#333">COMPLETENESS - Covers the topic?</text>
  <rect x="658.2857" y="524.5714" width="512" height="51.4286" rx="8.5714" fill="#f8d7da" stroke="#dc3545" stroke-width="1.7143" />
  <text x="914.2857" y="558.8571" text-anchor="middle" font-size="20.5714" fill="#333">SAFETY - Is it free from harm?</text>
  <rect x="384" y="589.7143" width="512" height="51.4286" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7143" />
  <text x="640" y="624" text-anchor="middle" font-size="20.5714" fill="#333">CONSISTENCY - Same quality every time?</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Why Measure Quality?</text>
  <text x="350" y="55" text-anchor="middle" font-size="13" fill="#666">Without measurement, you're flying blind</text>
  <!-- Questions -->
  <rect x="30" y="75" width="640" height="90" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="50" y="100" font-size="12" fill="#333">"Is my fine-tuned model better?"     -> Need metrics</text>
  <text x="50" y="125" font-size="12" fill="#333">"Which prompt strategy works best?"   -> Need comparison</text>
  <text x="50" y="150" font-size="12" fill="#333">"Is this model safe to deploy?"       -> Need evaluation</text>
  <!-- Quality dimensions -->
  <rect x="30" y="185" width="640" height="220" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a90e2">Quality Dimensions</text>
  <rect x="60" y="230" width="280" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="200" y="250" text-anchor="middle" font-size="12" fill="#333">FLUENCY - Is the text grammatical?</text>
  <rect x="360" y="230" width="280" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="500" y="250" text-anchor="middle" font-size="12" fill="#333">RELEVANCE - Does it address the query?</text>
  <rect x="60" y="268" width="280" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="200" y="288" text-anchor="middle" font-size="12" fill="#333">ACCURACY - Are the facts correct?</text>
  <rect x="360" y="268" width="280" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="500" y="288" text-anchor="middle" font-size="12" fill="#333">COHERENCE - Does it make sense?</text>
  <rect x="60" y="306" width="280" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="200" y="326" text-anchor="middle" font-size="12" fill="#333">COMPLETENESS - Covers the topic?</text>
  <rect x="360" y="306" width="280" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="500" y="326" text-anchor="middle" font-size="12" fill="#333">SAFETY - Is it free from harm?</text>
  <rect x="210" y="344" width="280" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="350" y="364" text-anchor="middle" font-size="12" fill="#333">CONSISTENCY - Same quality every time?</text>
</svg>
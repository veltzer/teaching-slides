<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="16.5998" y="13.617" width="1128.7862" height="626.383" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.9929" y="61.2766" text-anchor="middle" font-size="24.5106" font-weight="bold" fill="var(--text)">Evaluation Pipeline</text>
  <rect x="132.7984" y="95.3191" width="265.5967" height="81.7021" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="265.5967" y="129.3617" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="var(--text)">Test Set</text>
  <text x="265.5967" y="156.5957" text-anchor="middle" font-size="14.9787" fill="var(--text-muted)">500+ examples</text>
  <line x1="398.3951" y1="136.1702" x2="514.5937" y2="136.1702" stroke="var(--text)" stroke-width="2" marker-end="url(#aFlow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="aFlow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 14.6286 4.5 L 0 9" fill="#333" />
    </marker>
  </defs>
  <rect x="522.8936" y="95.3191" width="265.5967" height="81.7021" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="655.692" y="129.3617" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="var(--text)">Generate</text>
  <text x="655.692" y="156.5957" text-anchor="middle" font-size="14.9787" fill="var(--text-muted)">Responses</text>
  <line x1="655.692" y1="177.0213" x2="655.692" y2="224.6809" stroke="var(--text)" stroke-width="2" marker-end="url(#aFlow)" />
  <rect x="522.8936" y="231.4894" width="331.996" height="81.7021" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="688.8916" y="265.5319" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="var(--text)">Auto Metrics</text>
  <text x="688.8916" y="292.766" text-anchor="middle" font-size="14.9787" fill="var(--text-muted)">BLEU, ROUGE, BERTScore</text>
  <line x1="688.8916" y1="313.1915" x2="688.8916" y2="360.8511" stroke="var(--text)" stroke-width="2" marker-end="url(#aFlow)" />
  <rect x="522.8936" y="367.6596" width="331.996" height="81.7021" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="688.8916" y="401.7021" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="var(--text)">LLM-as-Judge</text>
  <text x="688.8916" y="428.9362" text-anchor="middle" font-size="14.9787" fill="var(--text-muted)">(GPT-4 eval)</text>
  <line x1="688.8916" y1="449.3617" x2="688.8916" y2="497.0213" stroke="var(--text)" stroke-width="2" marker-end="url(#aFlow)" />
  <rect x="522.8936" y="503.8298" width="331.996" height="68.0851" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="688.8916" y="544.6809" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="var(--text)">Human Eval (sample)</text>
  <line x1="688.8916" y1="571.9149" x2="688.8916" y2="592.3404" stroke="var(--text)" stroke-width="2" marker-end="url(#aFlow)" />
  <rect x="497.9939" y="596.4255" width="381.7953" height="34.0426" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="688.8916" y="620.9362" text-anchor="middle" font-size="16.3404" font-weight="bold" fill="var(--text)">Dashboard &amp; Reports</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84.1305" text-anchor="middle" font-size="24.3183" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Evaluation Pipeline</text>
  <rect x="163.5294" y="115.6521" width="282.3529" height="75.6521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304.7058" y="147.1739" text-anchor="middle" font-size="17.5632" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Test Set</text>
  <text x="304.7058" y="172.3913" text-anchor="middle" font-size="14.8612" fill="var(--text-muted)" font-family="Arial, sans-serif">500+ examples</text>
  <line x1="445.8823" y1="153.4783" x2="569.4118" y2="153.4783" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="578.2353" y="115.6521" width="282.3529" height="75.6521" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="719.4118" y="147.1739" text-anchor="middle" font-size="17.5632" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Generate</text>
  <text x="719.4118" y="172.3913" text-anchor="middle" font-size="14.8612" fill="var(--text-muted)" font-family="Arial, sans-serif">Responses</text>
  <line x1="719.4118" y1="191.3044" x2="719.4118" y2="235.4348" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="578.2353" y="241.7392" width="352.9412" height="75.6521" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="754.7059" y="273.2609" text-anchor="middle" font-size="17.5632" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Auto Metrics</text>
  <text x="754.7059" y="298.4783" text-anchor="middle" font-size="14.8612" fill="var(--text-muted)" font-family="Arial, sans-serif">BLEU, ROUGE, BERTScore</text>
  <line x1="754.7059" y1="317.3913" x2="754.7059" y2="361.5218" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="578.2353" y="367.8261" width="352.9412" height="75.6521" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="754.7059" y="399.3478" text-anchor="middle" font-size="17.5632" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">LLM-as-Judge</text>
  <text x="754.7059" y="424.5653" text-anchor="middle" font-size="14.8612" fill="var(--text-muted)" font-family="Arial, sans-serif">(GPT-4 eval)</text>
  <line x1="754.7059" y1="443.4783" x2="754.7059" y2="487.6087" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="578.2353" y="493.9131" width="352.9412" height="63.0435" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="754.7059" y="531.7392" text-anchor="middle" font-size="17.5632" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Human Eval (sample)</text>
  <line x1="754.7059" y1="556.9565" x2="754.7059" y2="575.8695" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="551.7647" y="579.6521" width="405.8823" height="31.5218" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="754.7059" y="602.3479" text-anchor="middle" font-size="16.2122" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Dashboard &amp; Reports</text>
</svg>

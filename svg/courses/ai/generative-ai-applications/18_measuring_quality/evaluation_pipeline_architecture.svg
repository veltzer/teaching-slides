<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="680" height="460" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Evaluation Pipeline</text>
  <!-- Test Set -->
  <rect x="80" y="70" width="160" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="160" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Test Set</text>
  <text x="160" y="115" text-anchor="middle" font-size="11" fill="#666">500+ examples</text>
  <!-- Arrow -->
  <line x1="240" y1="100" x2="310" y2="100" stroke="#333" stroke-width="2" marker-end="url(#aFlow)"/>
  <defs><marker id="aFlow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#333"/></marker></defs>
  <!-- Generate -->
  <rect x="315" y="70" width="160" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="395" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Generate</text>
  <text x="395" y="115" text-anchor="middle" font-size="11" fill="#666">Responses</text>
  <!-- Arrow down -->
  <line x1="395" y1="130" x2="395" y2="165" stroke="#333" stroke-width="2" marker-end="url(#aFlow)"/>
  <!-- Auto Metrics -->
  <rect x="315" y="170" width="200" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="415" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Auto Metrics</text>
  <text x="415" y="215" text-anchor="middle" font-size="11" fill="#666">BLEU, ROUGE, BERTScore</text>
  <!-- Arrow down -->
  <line x1="415" y1="230" x2="415" y2="265" stroke="#333" stroke-width="2" marker-end="url(#aFlow)"/>
  <!-- LLM Judge -->
  <rect x="315" y="270" width="200" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="415" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">LLM-as-Judge</text>
  <text x="415" y="315" text-anchor="middle" font-size="11" fill="#666">(GPT-4 eval)</text>
  <!-- Arrow down -->
  <line x1="415" y1="330" x2="415" y2="365" stroke="#333" stroke-width="2" marker-end="url(#aFlow)"/>
  <!-- Human Eval -->
  <rect x="315" y="370" width="200" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="415" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Human Eval (sample)</text>
  <!-- Arrow down -->
  <line x1="415" y1="420" x2="415" y2="435" stroke="#333" stroke-width="2" marker-end="url(#aFlow)"/>
  <!-- Dashboard -->
  <rect x="300" y="438" width="230" height="25" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="415" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Dashboard &amp; Reports</text>
</svg>
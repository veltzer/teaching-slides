<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84.1305" text-anchor="middle" font-size="24.3183" font-weight="bold" fill="var(--text)">Evaluation Pipeline</text>
  <rect x="163.5294" y="115.6521" width="282.3529" height="75.6521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304.7058" y="147.1739" text-anchor="middle" font-size="17.5632" font-weight="bold" fill="var(--text)">Test Set</text>
  <text x="304.7058" y="172.3913" text-anchor="middle" font-size="14.8612" fill="var(--text-muted)">500+ examples</text>
  <line x1="445.8823" y1="153.4783" x2="569.4118" y2="153.4783" stroke="var(--text)" stroke-width="2" marker-end="url(#aFlow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="aFlow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 14.6286 4.5 L 0 9" fill="#333" />
    </marker>
  </defs>
  <rect x="578.2353" y="115.6521" width="282.3529" height="75.6521" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="719.4118" y="147.1739" text-anchor="middle" font-size="17.5632" font-weight="bold" fill="var(--text)">Generate</text>
  <text x="719.4118" y="172.3913" text-anchor="middle" font-size="14.8612" fill="var(--text-muted)">Responses</text>
  <line x1="719.4118" y1="191.3044" x2="719.4118" y2="235.4348" stroke="var(--text)" stroke-width="2" marker-end="url(#aFlow)" />
  <rect x="578.2353" y="241.7392" width="352.9412" height="75.6521" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="754.7059" y="273.2609" text-anchor="middle" font-size="17.5632" font-weight="bold" fill="var(--text)">Auto Metrics</text>
  <text x="754.7059" y="298.4783" text-anchor="middle" font-size="14.8612" fill="var(--text-muted)">BLEU, ROUGE, BERTScore</text>
  <line x1="754.7059" y1="317.3913" x2="754.7059" y2="361.5218" stroke="var(--text)" stroke-width="2" marker-end="url(#aFlow)" />
  <rect x="578.2353" y="367.8261" width="352.9412" height="75.6521" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="754.7059" y="399.3478" text-anchor="middle" font-size="17.5632" font-weight="bold" fill="var(--text)">LLM-as-Judge</text>
  <text x="754.7059" y="424.5653" text-anchor="middle" font-size="14.8612" fill="var(--text-muted)">(GPT-4 eval)</text>
  <line x1="754.7059" y1="443.4783" x2="754.7059" y2="487.6087" stroke="var(--text)" stroke-width="2" marker-end="url(#aFlow)" />
  <rect x="578.2353" y="493.9131" width="352.9412" height="63.0435" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="754.7059" y="531.7392" text-anchor="middle" font-size="17.5632" font-weight="bold" fill="var(--text)">Human Eval (sample)</text>
  <line x1="754.7059" y1="556.9565" x2="754.7059" y2="575.8695" stroke="var(--text)" stroke-width="2" marker-end="url(#aFlow)" />
  <rect x="551.7647" y="579.6521" width="405.8823" height="31.5218" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="754.7059" y="602.3479" text-anchor="middle" font-size="16.2122" font-weight="bold" fill="var(--text)">Dashboard &amp; Reports</text>
</svg>
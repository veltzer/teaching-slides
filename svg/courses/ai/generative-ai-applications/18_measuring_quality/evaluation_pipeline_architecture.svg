  <text x="933.333430716055" y="248.133963920239" text-anchor="middle" font-size="22.648668039749" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Auto Metrics</text>
  <text x="933.333430716055" y="275.885173782652" text-anchor="middle" font-size="19.164297250633" fill="var(--text-muted)" font-family="Arial, sans-serif">BLEU, ROUGE, BERTScore</text>
  <line x1="933.333430716055" y1="296.698526155531" x2="933.333430716055" y2="345.263198438686" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="666.66673046914" y="352.200945880358" width="533.333400493831" height="83.253519539378" rx="7.7373148537" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="933.333430716055" y="386.889903184444" text-anchor="middle" font-size="22.648668039749" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">LLM-as-Judge</text>
  <text x="933.333430716055" y="414.64122309472" text-anchor="middle" font-size="19.164297250633" fill="var(--text-muted)" font-family="Arial, sans-serif">(GPT-4 eval)</text>
  <line x1="933.333430716055" y1="435.454575467599" x2="933.333430716055" y2="484.019137702891" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="666.66673046914" y="490.956995192426" width="533.333400493831" height="69.378024656034" rx="7.7373148537" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="610.5149" y="46.8293" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="#333">The Problem: Full Fine-Tuning is Expensive</ns0:text>
  <ns0:text x="610.5149" y="85.8537" text-anchor="middle" font-size="21.8537" fill="#666">Full fine-tuning of a 70B parameter model</ns0:text>
  <ns0:rect x="52.3298" y="117.0732" width="523.2985" height="359.0244" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="3.1219" />
  <ns0:text x="313.9791" y="156.0976" text-anchor="middle" font-size="23.4147" font-weight="bold" fill="#dc3545">Memory Needed</ns0:text>
  <ns0:text x="87.2164" y="202.9269" font-size="18.7317" fill="#333">Model weights (FP16):</ns0:text>
  <ns0:text x="470.9686" y="202.9269" text-anchor="end" font-size="18.7317" font-weight="bold" fill="#333">140 GB</ns0:text>
  <ns0:text x="87.2164" y="241.9513" font-size="18.7317" fill="#333">Gradients (FP16):</ns0:text>
  <ns0:text x="470.9686" y="241.9513" text-anchor="end" font-size="18.7317" font-weight="bold" fill="#333">140 GB</ns0:text>
  <ns0:text x="87.2164" y="280.9756" font-size="18.7317" fill="#333">Optimizer states (FP32):</ns0:text>
  <ns0:text x="470.9686" y="280.9756" text-anchor="end" font-size="18.7317" font-weight="bold" fill="#333">280 GB</ns0:text>
  <ns0:text x="87.2164" y="320" font-size="18.7317" fill="#333">Activations:</ns0:text>
  <ns0:text x="470.9686" y="320" text-anchor="end" font-size="18.7317" font-weight="bold" fill="#333">50+ GB</ns0:text>
  <ns0:line x1="87.2164" y1="335.6098" x2="488.4119" y2="335.6098" stroke="#dc3545" stroke-width="1.561" />
  <ns0:text x="87.2164" y="374.6342" font-size="21.8537" font-weight="bold" fill="#dc3545">Total:</ns0:text>
  <ns0:text x="470.9686" y="374.6342" text-anchor="end" font-size="21.8537" font-weight="bold" fill="#dc3545">~610 GB</ns0:text>
  <ns0:text x="313.9791" y="421.4634" text-anchor="middle" font-size="17.1707" fill="#dc3545">Need 8x A100 80GB!</ns0:text>
  <ns0:rect x="645.4014" y="117.0732" width="523.2985" height="359.0244" rx="7.8049" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1219" />
  <ns0:text x="907.0507" y="156.0976" text-anchor="middle" font-size="23.4147" font-weight="bold" fill="#bf360c">Cost</ns0:text>
  <ns0:text x="680.2881" y="210.7317" font-size="18.7317" fill="#333">Hardware:</ns0:text>
  <ns0:text x="1064.0403" y="210.7317" text-anchor="end" font-size="18.7317" fill="#333">8x A100 80GB</ns0:text>
  <ns0:text x="680.2881" y="257.561" font-size="18.7317" fill="#333">Cloud cost:</ns0:text>
  <ns0:text x="1064.0403" y="257.561" text-anchor="end" font-size="18.7317" fill="#333">~$25/hour</ns0:text>
  <ns0:text x="680.2881" y="304.3902" font-size="18.7317" fill="#333">Training time:</ns0:text>
  <ns0:text x="1064.0403" y="304.3902" text-anchor="end" font-size="18.7317" fill="#333">1-3 days</ns0:text>
  <ns0:line x1="680.2881" y1="327.8049" x2="1081.4835" y2="327.8049" stroke="#ffc107" stroke-width="1.561" />
  <ns0:text x="680.2881" y="374.6342" font-size="21.8537" font-weight="bold" fill="#bf360c">Total:</ns0:text>
  <ns0:text x="1064.0403" y="374.6342" text-anchor="end" font-size="21.8537" font-weight="bold" fill="#bf360c">$600 - $1,800</ns0:text>
  <ns0:text x="907.0507" y="421.4634" text-anchor="middle" font-size="17.1707" fill="#bf360c">per training run</ns0:text>
  <ns0:rect x="139.5462" y="515.1219" width="941.9373" height="124.8781" rx="7.8049" fill="#f8d7da" stroke="#dc3545" stroke-width="3.1219" />
  <ns0:text x="610.5149" y="561.9512" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="#dc3545">AND you get a full copy of the model (140 GB to store)</ns0:text>
  <ns0:text x="610.5149" y="600.9756" text-anchor="middle" font-size="20.2927" fill="#333">for each fine-tuned variant</ns0:text>
</ns0:svg>
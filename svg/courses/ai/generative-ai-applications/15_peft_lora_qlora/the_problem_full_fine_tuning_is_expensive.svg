<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="610.5149" y="46.8293" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="var(--text)">The Problem: Full Fine-Tuning is Expensive</text>
  <text x="610.5149" y="85.8537" text-anchor="middle" font-size="21.8537" fill="var(--text-muted)">Full fine-tuning of a 70B parameter model</text>
  <rect x="52.3298" y="117.0732" width="523.2985" height="359.0244" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="313.9791" y="156.0976" text-anchor="middle" font-size="23.4147" font-weight="bold" fill="var(--danger-accent)">Memory Needed</text>
  <text x="87.2164" y="202.9269" font-size="18.7317" fill="var(--text)">Model weights (FP16):</text>
  <text x="470.9686" y="202.9269" text-anchor="end" font-size="18.7317" font-weight="bold" fill="var(--text)">140 GB</text>
  <text x="87.2164" y="241.9513" font-size="18.7317" fill="var(--text)">Gradients (FP16):</text>
  <text x="470.9686" y="241.9513" text-anchor="end" font-size="18.7317" font-weight="bold" fill="var(--text)">140 GB</text>
  <text x="87.2164" y="280.9756" font-size="18.7317" fill="var(--text)">Optimizer states (FP32):</text>
  <text x="470.9686" y="280.9756" text-anchor="end" font-size="18.7317" font-weight="bold" fill="var(--text)">280 GB</text>
  <text x="87.2164" y="320" font-size="18.7317" fill="var(--text)">Activations:</text>
  <text x="470.9686" y="320" text-anchor="end" font-size="18.7317" font-weight="bold" fill="var(--text)">50+ GB</text>
  <line x1="87.2164" y1="335.6098" x2="488.4119" y2="335.6098" stroke="var(--danger-border)" stroke-width="1.561" />
  <text x="87.2164" y="374.6342" font-size="21.8537" font-weight="bold" fill="var(--danger-accent)">Total:</text>
  <text x="470.9686" y="374.6342" text-anchor="end" font-size="21.8537" font-weight="bold" fill="var(--danger-accent)">~610 GB</text>
  <text x="313.9791" y="421.4634" text-anchor="middle" font-size="17.1707" fill="var(--danger-accent)">Need 8x A100 80GB!</text>
  <rect x="645.4014" y="117.0732" width="523.2985" height="359.0244" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="907.0507" y="156.0976" text-anchor="middle" font-size="23.4147" font-weight="bold" fill="var(--danger-accent)">Cost</text>
  <text x="680.2881" y="210.7317" font-size="18.7317" fill="var(--text)">Hardware:</text>
  <text x="1064.0403" y="210.7317" text-anchor="end" font-size="18.7317" fill="var(--text)">8x A100 80GB</text>
  <text x="680.2881" y="257.561" font-size="18.7317" fill="var(--text)">Cloud cost:</text>
  <text x="1064.0403" y="257.561" text-anchor="end" font-size="18.7317" fill="var(--text)">~$25/hour</text>
  <text x="680.2881" y="304.3902" font-size="18.7317" fill="var(--text)">Training time:</text>
  <text x="1064.0403" y="304.3902" text-anchor="end" font-size="18.7317" fill="var(--text)">1-3 days</text>
  <line x1="680.2881" y1="327.8049" x2="1081.4835" y2="327.8049" stroke="var(--warn-border)" stroke-width="1.561" />
  <text x="680.2881" y="374.6342" font-size="21.8537" font-weight="bold" fill="var(--danger-accent)">Total:</text>
  <text x="1064.0403" y="374.6342" text-anchor="end" font-size="21.8537" font-weight="bold" fill="var(--danger-accent)">$600 - $1,800</text>
  <text x="907.0507" y="421.4634" text-anchor="middle" font-size="17.1707" fill="var(--danger-accent)">per training run</text>
  <rect x="139.5462" y="515.1219" width="941.9373" height="124.8781" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="610.5149" y="561.9512" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--danger-accent)">AND you get a full copy of the model (140 GB to store)</text>
  <text x="610.5149" y="600.9756" text-anchor="middle" font-size="20.2927" fill="var(--text)">for each fine-tuned variant</text>
</svg>
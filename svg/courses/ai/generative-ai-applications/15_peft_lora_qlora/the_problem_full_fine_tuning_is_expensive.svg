<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="23.179970563957" fill="var(--text-muted)" font-family="Arial, sans-serif">Full fine-tuning of a 70B parameter model</text>
  <rect x="40" y="72.676039754017" width="562.5" height="375.774724776831" rx="6.207673609487" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.2501" y="113.521116207102" text-anchor="middle" font-size="24.835764038061" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Memory Needed</text>
  <text x="77.5" y="162.535229359254" font-size="19.868487076976" fill="var(--text)" font-family="Arial, sans-serif">Model weights (FP16):</text>
  <text x="490" y="162.535229359254" text-anchor="end" font-size="19.868487076976" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">140 GB</text>
  <text x="77.5" y="203.380305812339" font-size="19.868487076976" fill="var(--text)" font-family="Arial, sans-serif">Gradients (FP16):</text>
  <text x="490" y="203.380305812339" text-anchor="end" font-size="19.868487076976" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">140 GB</text>
  <text x="77.5" y="244.225275223169" font-size="19.868487076976" fill="var(--text)" font-family="Arial, sans-serif">Optimizer states (FP32):</text>
  <text x="490" y="244.225275223169" text-anchor="end" font-size="19.868487076976" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">280 GB</text>
  <text x="77.5" y="285.070351676254" font-size="19.868487076976" fill="var(--text)" font-family="Arial, sans-serif">Activations:</text>
  <text x="490" y="285.070351676254" text-anchor="end" font-size="19.868487076976" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">50+ GB</text>
  <line x1="77.5" y1="301.40842507439" x2="508.75" y2="301.40842507439" stroke="var(--danger-border)" stroke-width="1.561"/>
  <text x="77.5" y="342.253608569729" font-size="23.179970563957" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Total:</text>
  <text x="490" y="342.253608569729" text-anchor="end" font-size="23.179970563957" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">~610 GB</text>
  <text x="321.2501" y="391.267614679627" text-anchor="middle" font-size="18.212797064099" fill="var(--danger-accent)" font-family="Arial, sans-serif">Need 8x A100 80GB!</text>
  <rect x="677.5" y="72.676039754017" width="562.5" height="375.774724776831" rx="6.207673609487" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.75" y="113.521116207102" text-anchor="middle" font-size="24.835764038061" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cost</text>
  <text x="715.0001" y="170.704159016068" font-size="19.868487076976" fill="var(--text)" font-family="Arial, sans-serif">Hardware:</text>
  <text x="1127.5001" y="170.704159016068" text-anchor="end" font-size="19.868487076976" fill="var(--text)" font-family="Arial, sans-serif">8x A100 80GB</text>
  <text x="715.0001" y="219.71827216822" font-size="19.868487076976" fill="var(--text)" font-family="Arial, sans-serif">Cloud cost:</text>
  <text x="1127.5001" y="219.71827216822" text-anchor="end" font-size="19.868487076976" fill="var(--text)" font-family="Arial, sans-serif">~$25/hour</text>
  <text x="715.0001" y="268.732278278118" font-size="19.868487076976" fill="var(--text)" font-family="Arial, sans-serif">Training time:</text>
  <text x="1127.5001" y="268.732278278118" text-anchor="end" font-size="19.868487076976" fill="var(--text)" font-family="Arial, sans-serif">1-3 days</text>
  <line x1="715.0001" y1="293.239388375322" x2="1146.25" y2="293.239388375322" stroke="var(--warn-border)" stroke-width="1.561"/>
  <text x="715.0001" y="342.253608569729" font-size="23.179970563957" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Total:</text>
  <text x="1127.5001" y="342.253608569729" text-anchor="end" font-size="23.179970563957" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">$600 - $1,800</text>
  <text x="958.75" y="391.267614679627" text-anchor="middle" font-size="18.212797064099" fill="var(--danger-accent)" font-family="Arial, sans-serif">per training run</text>
  <rect x="133.75" y="489.295733941678" width="1012.5" height="130.704266058322" rx="6.207673609487" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="538.309847093831" text-anchor="middle" font-size="21.52428055108" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">AND you get a full copy of the model (140 GB to store)</text>
  <text x="640.0001" y="579.154923546915" text-anchor="middle" font-size="21.52428055108" fill="var(--text)" font-family="Arial, sans-serif">for each fine-tuned variant</text>
</svg>

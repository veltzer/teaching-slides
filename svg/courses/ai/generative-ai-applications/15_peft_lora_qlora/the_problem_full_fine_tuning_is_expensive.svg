<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="49.0909" text-anchor="middle" font-size="29.4545" font-weight="bold" fill="#333">The Problem: Full Fine-Tuning is Expensive</text>
  <text x="640" y="90" text-anchor="middle" font-size="22.9091" fill="#666">Full fine-tuning of a 70B parameter model</text>
  <rect x="54.8571" y="122.7273" width="548.5714" height="376.3636" rx="8.1818" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2727" />
  <text x="329.1429" y="163.6364" text-anchor="middle" font-size="24.5455" font-weight="bold" fill="#dc3545">Memory Needed</text>
  <text x="91.4286" y="212.7273" font-size="19.6364" fill="#333">Model weights (FP16):</text>
  <text x="493.7143" y="212.7273" text-anchor="end" font-size="19.6364" font-weight="bold" fill="#333">140 GB</text>
  <text x="91.4286" y="253.6364" font-size="19.6364" fill="#333">Gradients (FP16):</text>
  <text x="493.7143" y="253.6364" text-anchor="end" font-size="19.6364" font-weight="bold" fill="#333">140 GB</text>
  <text x="91.4286" y="294.5455" font-size="19.6364" fill="#333">Optimizer states (FP32):</text>
  <text x="493.7143" y="294.5455" text-anchor="end" font-size="19.6364" font-weight="bold" fill="#333">280 GB</text>
  <text x="91.4286" y="335.4545" font-size="19.6364" fill="#333">Activations:</text>
  <text x="493.7143" y="335.4545" text-anchor="end" font-size="19.6364" font-weight="bold" fill="#333">50+ GB</text>
  <line x1="91.4286" y1="351.8182" x2="512" y2="351.8182" stroke="#dc3545" stroke-width="1.6364" />
  <text x="91.4286" y="392.7273" font-size="22.9091" font-weight="bold" fill="#dc3545">Total:</text>
  <text x="493.7143" y="392.7273" text-anchor="end" font-size="22.9091" font-weight="bold" fill="#dc3545">~610 GB</text>
  <text x="329.1429" y="441.8182" text-anchor="middle" font-size="18" fill="#dc3545">Need 8x A100 80GB!</text>
  <rect x="676.5714" y="122.7273" width="548.5714" height="376.3636" rx="8.1818" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2727" />
  <text x="950.8571" y="163.6364" text-anchor="middle" font-size="24.5455" font-weight="bold" fill="#856404">Cost</text>
  <text x="713.1429" y="220.9091" font-size="19.6364" fill="#333">Hardware:</text>
  <text x="1115.4286" y="220.9091" text-anchor="end" font-size="19.6364" fill="#333">8x A100 80GB</text>
  <text x="713.1429" y="270" font-size="19.6364" fill="#333">Cloud cost:</text>
  <text x="1115.4286" y="270" text-anchor="end" font-size="19.6364" fill="#333">~$25/hour</text>
  <text x="713.1429" y="319.0909" font-size="19.6364" fill="#333">Training time:</text>
  <text x="1115.4286" y="319.0909" text-anchor="end" font-size="19.6364" fill="#333">1-3 days</text>
  <line x1="713.1429" y1="343.6364" x2="1133.7143" y2="343.6364" stroke="#ffc107" stroke-width="1.6364" />
  <text x="713.1429" y="392.7273" font-size="22.9091" font-weight="bold" fill="#856404">Total:</text>
  <text x="1115.4286" y="392.7273" text-anchor="end" font-size="22.9091" font-weight="bold" fill="#856404">$600 - $1,800</text>
  <text x="950.8571" y="441.8182" text-anchor="middle" font-size="18" fill="#856404">per training run</text>
  <rect x="146.2857" y="540" width="987.4286" height="130.9091" rx="8.1818" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2727" />
  <text x="640" y="589.0909" text-anchor="middle" font-size="21.2727" font-weight="bold" fill="#dc3545">AND you get a full copy of the model (140 GB to store)</text>
  <text x="640" y="630" text-anchor="middle" font-size="21.2727" fill="#333">for each fine-tuned variant</text>
</svg>
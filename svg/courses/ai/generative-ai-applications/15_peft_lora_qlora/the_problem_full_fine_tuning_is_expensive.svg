<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">The Problem: Full Fine-Tuning is Expensive</text>
  <text x="350" y="55" text-anchor="middle" font-size="14" fill="#666">Full fine-tuning of a 70B parameter model</text>
  <!-- Memory breakdown -->
  <rect x="30" y="75" width="300" height="230" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="180" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc3545">Memory Needed</text>
  <text x="50" y="130" font-size="12" fill="#333">Model weights (FP16):</text>
  <text x="270" y="130" text-anchor="end" font-size="12" font-weight="bold" fill="#333">140 GB</text>
  <text x="50" y="155" font-size="12" fill="#333">Gradients (FP16):</text>
  <text x="270" y="155" text-anchor="end" font-size="12" font-weight="bold" fill="#333">140 GB</text>
  <text x="50" y="180" font-size="12" fill="#333">Optimizer states (FP32):</text>
  <text x="270" y="180" text-anchor="end" font-size="12" font-weight="bold" fill="#333">280 GB</text>
  <text x="50" y="205" font-size="12" fill="#333">Activations:</text>
  <text x="270" y="205" text-anchor="end" font-size="12" font-weight="bold" fill="#333">50+ GB</text>
  <line x1="50" y1="215" x2="280" y2="215" stroke="#dc3545" stroke-width="1"/>
  <text x="50" y="240" font-size="14" font-weight="bold" fill="#dc3545">Total:</text>
  <text x="270" y="240" text-anchor="end" font-size="14" font-weight="bold" fill="#dc3545">~610 GB</text>
  <text x="180" y="270" text-anchor="middle" font-size="11" fill="#dc3545">Need 8x A100 80GB!</text>
  <!-- Cost -->
  <rect x="370" y="75" width="300" height="230" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="520" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#856404">Cost</text>
  <text x="390" y="135" font-size="12" fill="#333">Hardware:</text>
  <text x="610" y="135" text-anchor="end" font-size="12" fill="#333">8x A100 80GB</text>
  <text x="390" y="165" font-size="12" fill="#333">Cloud cost:</text>
  <text x="610" y="165" text-anchor="end" font-size="12" fill="#333">~$25/hour</text>
  <text x="390" y="195" font-size="12" fill="#333">Training time:</text>
  <text x="610" y="195" text-anchor="end" font-size="12" fill="#333">1-3 days</text>
  <line x1="390" y1="210" x2="620" y2="210" stroke="#ffc107" stroke-width="1"/>
  <text x="390" y="240" font-size="14" font-weight="bold" fill="#856404">Total:</text>
  <text x="610" y="240" text-anchor="end" font-size="14" font-weight="bold" fill="#856404">$600 - $1,800</text>
  <text x="520" y="270" text-anchor="middle" font-size="11" fill="#856404">per training run</text>
  <!-- Storage note -->
  <rect x="80" y="330" width="540" height="80" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="350" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">AND you get a full copy of the model (140 GB to store)</text>
  <text x="350" y="385" text-anchor="middle" font-size="13" fill="#333">for each fine-tuned variant</text>
</svg>
</defs>
  <ns0:text x="610.5149" y="46.8293" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="var(--text-dark)">The Problem: Full Fine-Tuning is Expensive</ns0:text>
  <ns0:text x="610.5149" y="85.8537" text-anchor="middle" font-size="21.8537" fill="var(--text-mid)">Full fine-tuning of a 70B parameter model</ns0:text>
  <ns0:rect x="52.3298" y="117.0732" width="523.2985" height="359.0244" rx="7.8049" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.1219" />
  <ns0:text x="313.9791" y="156.0976" text-anchor="middle" font-size="23.4147" font-weight="bold" fill="var(--danger-bright)">Memory Needed</ns0:text>
  <ns0:text x="87.2164" y="202.9269" font-size="18.7317" fill="var(--text-dark)">Model weights (FP16):</ns0:text>
  <ns0:text x="470.9686" y="202.9269" text-anchor="end" font-size="18.7317" font-weight="bold" fill="var(--text-dark)">140 GB</ns0:text>
  <ns0:text x="87.2164" y="241.9513" font-size="18.7317" fill="var(--text-dark)">Gradients (FP16):</ns0:text>
  <ns0:text x="470.9686" y="241.9513" text-anchor="end" font-size="18.7317" font-weight="bold" fill="var(--text-dark)">140 GB</ns0:text>
  <ns0:text x="87.2164" y="280.9756" font-size="18.7317" fill="var(--text-dark)">Optimizer states (FP32):</ns0:text>
  <ns0:text x="470.9686" y="280.9756" text-anchor="end" font-size="18.7317" font-weight="bold" fill="var(--text-dark)">280 GB</ns0:text>
  <ns0:text x="87.2164" y="320" font-size="18.7317" fill="var(--text-dark)">Activations:</ns0:text>
  <ns0:text x="470.9686" y="320" text-anchor="end" font-size="18.7317" font-weight="bold" fill="var(--text-dark)">50+ GB</ns0:text>
  <ns0:line x1="87.2164" y1="335.6098" x2="488.4119" y2="335.6098" stroke="var(--danger-bright)" stroke-width="1.561" />
  <ns0:text x="87.2164" y="374.6342" font-size="21.8537" font-weight="bold" fill="var(--danger-bright)">Total:</ns0:text>
  <ns0:text x="470.9686" y="374.6342" text-anchor="end" font-size="21.8537" font-weight="bold" fill="var(--danger-bright)">~610 GB</ns0:text>
  <ns0:text x="313.9791" y="421.4634" text-anchor="middle" font-size="17.1707" fill="var(--danger-bright)">Need 8x A100 80GB!</ns0:text>
  <ns0:rect x="645.4014" y="117.0732" width="523.2985" height="359.0244" rx="7.8049" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.1219" />
  <ns0:text x="907.0507" y="156.0976" text-anchor="middle" font-size="23.4147" font-weight="bold" fill="var(--danger-deeper)">Cost</ns0:text>
  <ns0:text x="680.2881" y="210.7317" font-size="18.7317" fill="var(--text-dark)">Hardware:</ns0:text>
  <ns0:text x="1064.0403" y="210.7317" text-anchor="end" font-size="18.7317" fill="var(--text-dark)">8x A100 80GB</ns0:text>
  <ns0:text x="680.2881" y="257.561" font-size="18.7317" fill="var(--text-dark)">Cloud cost:</ns0:text>
  <ns0:text x="1064.0403" y="257.561" text-anchor="end" font-size="18.7317" fill="var(--text-dark)">~$25/hour</ns0:text>
  <ns0:text x="680.2881" y="304.3902" font-size="18.7317" fill="var(--text-dark)">Training time:</ns0:text>
  <ns0:text x="1064.0403" y="304.3902" text-anchor="end" font-size="18.7317" fill="var(--text-dark)">1-3 days</ns0:text>
  <ns0:line x1="680.2881" y1="327.8049" x2="1081.4835" y2="327.8049" stroke="var(--warn-yellow)" stroke-width="1.561" />
  <ns0:text x="680.2881" y="374.6342" font-size="21.8537" font-weight="bold" fill="var(--danger-deeper)">Total:</ns0:text>
  <ns0:text x="1064.0403" y="374.6342" text-anchor="end" font-size="21.8537" font-weight="bold" fill="var(--danger-deeper)">$600 - $1,800</ns0:text>
  <ns0:text x="907.0507" y="421.4634" text-anchor="middle" font-size="17.1707" fill="var(--danger-deeper)">per training run</ns0:text>
  <ns0:rect x="139.5462" y="515.1219" width="941.9373" height="124.8781" rx="7.8049" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.1219" />
  <ns0:text x="610.5149" y="561.9512" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--danger-bright)">AND you get a full copy of the model (140 GB to store)</ns0:text>
  <ns0:text x="610.5149" y="600.9756" text-anchor="middle" font-size="20.2927" fill="var(--text-dark)">for each fine-tuned variant</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="28.8057" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The Problem: Full Fine-Tuning is Expensive</text>
  <text x="640.0001" y="78.1579" text-anchor="middle" font-size="22.4045" fill="var(--text-muted)" font-family="Arial, sans-serif">Full fine-tuning of a 70B parameter model</text>
  <rect x="40" y="108.6842" width="562.5" height="351.0527" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.2501" y="146.8421" text-anchor="middle" font-size="24.0049" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Memory Needed</text>
  <text x="77.5" y="192.6316" font-size="19.2038" fill="var(--text)" font-family="Arial, sans-serif">Model weights (FP16):</text>
  <text x="490" y="192.6316" text-anchor="end" font-size="19.2038" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">140 GB</text>
  <text x="77.5" y="230.7895" font-size="19.2038" fill="var(--text)" font-family="Arial, sans-serif">Gradients (FP16):</text>
  <text x="490" y="230.7895" text-anchor="end" font-size="19.2038" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">140 GB</text>
  <text x="77.5" y="268.9473" font-size="19.2038" fill="var(--text)" font-family="Arial, sans-serif">Optimizer states (FP32):</text>
  <text x="490" y="268.9473" text-anchor="end" font-size="19.2038" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">280 GB</text>
  <text x="77.5" y="307.1052" font-size="19.2038" fill="var(--text)" font-family="Arial, sans-serif">Activations:</text>
  <text x="490" y="307.1052" text-anchor="end" font-size="19.2038" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">50+ GB</text>
  <line x1="77.5" y1="322.3684" x2="508.75" y2="322.3684" stroke="var(--danger-border)" stroke-width="1.561" />
  <text x="77.5" y="360.5264" font-size="22.4045" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Total:</text>
  <text x="490" y="360.5264" text-anchor="end" font-size="22.4045" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">~610 GB</text>
  <text x="321.2501" y="406.3158" text-anchor="middle" font-size="17.6035" fill="var(--danger-accent)" font-family="Arial, sans-serif">Need 8x A100 80GB!</text>
  <rect x="677.5" y="108.6842" width="562.5" height="351.0527" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.75" y="146.8421" text-anchor="middle" font-size="24.0049" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cost</text>
  <text x="715.0001" y="200.2631" font-size="19.2038" fill="var(--text)" font-family="Arial, sans-serif">Hardware:</text>
  <text x="1127.5001" y="200.2631" text-anchor="end" font-size="19.2038" fill="var(--text)" font-family="Arial, sans-serif">8x A100 80GB</text>
  <text x="715.0001" y="246.0526" font-size="19.2038" fill="var(--text)" font-family="Arial, sans-serif">Cloud cost:</text>
  <text x="1127.5001" y="246.0526" text-anchor="end" font-size="19.2038" fill="var(--text)" font-family="Arial, sans-serif">~$25/hour</text>
  <text x="715.0001" y="291.842" font-size="19.2038" fill="var(--text)" font-family="Arial, sans-serif">Training time:</text>
  <text x="1127.5001" y="291.842" text-anchor="end" font-size="19.2038" fill="var(--text)" font-family="Arial, sans-serif">1-3 days</text>
  <line x1="715.0001" y1="314.7368" x2="1146.25" y2="314.7368" stroke="var(--warn-border)" stroke-width="1.561" />
  <text x="715.0001" y="360.5264" font-size="22.4045" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Total:</text>
  <text x="1127.5001" y="360.5264" text-anchor="end" font-size="22.4045" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">$600 - $1,800</text>
  <text x="958.75" y="406.3158" text-anchor="middle" font-size="17.6035" fill="var(--danger-accent)" font-family="Arial, sans-serif">per training run</text>
  <rect x="133.75" y="497.8947" width="1012.5" height="122.1053" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="543.6842" text-anchor="middle" font-size="20.8042" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">AND you get a full copy of the model (140 GB to store)</text>
  <text x="640.0001" y="581.8421" text-anchor="middle" font-size="20.8042" fill="var(--text)" font-family="Arial, sans-serif">for each fine-tuned variant</text>
</svg>
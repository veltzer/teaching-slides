<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="29.527" font-weight="bold" fill="var(--text)">Multiple LoRA Adapters</text>
  <rect x="128.8888" y="68.2928" width="1022.2222" height="99.0244" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="110.7317" text-anchor="middle" font-size="26.2462" font-weight="bold" fill="var(--text)">BASE MODEL (8B)</text>
  <text x="639.9999" y="139.0244" text-anchor="middle" font-size="19.6846" fill="var(--text-muted)">(loaded once in memory)</text>
  <line x1="351.111" y1="167.3172" x2="351.111" y2="223.9025" stroke="var(--text)" stroke-width="2" />
  <line x1="639.9999" y1="167.3172" x2="639.9999" y2="223.9025" stroke="var(--text)" stroke-width="2" />
  <line x1="928.8887" y1="167.3172" x2="928.8887" y2="223.9025" stroke="var(--text)" stroke-width="2" />
  <rect x="184.4444" y="223.9025" width="333.3332" height="99.0244" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="351.111" y="266.3415" text-anchor="middle" font-size="22.9654" font-weight="bold" fill="var(--text)">LoRA Medical</text>
  <text x="351.111" y="294.6342" text-anchor="middle" font-size="19.6846" fill="var(--text-muted)">(80 MB)</text>
  <rect x="473.3332" y="223.9025" width="333.3332" height="99.0244" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="266.3415" text-anchor="middle" font-size="22.9654" font-weight="bold" fill="var(--text)">LoRA Legal</text>
  <text x="639.9999" y="294.6342" text-anchor="middle" font-size="19.6846" fill="var(--text-muted)">(80 MB)</text>
  <rect x="762.2221" y="223.9025" width="333.3332" height="99.0244" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="928.8887" y="266.3415" text-anchor="middle" font-size="22.9654" font-weight="bold" fill="var(--text)">LoRA Code</text>
  <text x="928.8887" y="294.6342" text-anchor="middle" font-size="19.6846" fill="var(--text-muted)">(80 MB)</text>
  <rect x="40" y="393.6585" width="1200" height="226.3415" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="436.0976" text-anchor="middle" font-size="22.9654" font-weight="bold" fill="var(--text)">Runtime Switching</text>
  <text x="106.6667" y="478.5365" font-size="21.3251" fill="var(--text)" font-family="monospace">model.load_adapter("medical-adapter")</text>
  <text x="106.6667" y="513.9024" font-size="21.3251" fill="var(--text)" font-family="monospace">response_1 = model.generate(medical_query)</text>
  <text x="106.6667" y="563.4147" font-size="21.3251" fill="var(--text)" font-family="monospace">model.load_adapter("legal-adapter")</text>
  <text x="106.6667" y="598.7805" font-size="21.3251" fill="var(--text)" font-family="monospace">response_2 = model.generate(legal_query)</text>
</svg>
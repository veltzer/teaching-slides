<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="29.527" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Multiple LoRA Adapters</text>
  <rect x="128.8888" y="68.2928" width="1022.2222" height="99.0244" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="110.7317" text-anchor="middle" font-size="26.2462" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">BASE MODEL (8B)</text>
  <text x="639.9999" y="139.0244" text-anchor="middle" font-size="19.6846" fill="var(--text-muted)" font-family="Arial, sans-serif">(loaded once in memory)</text>
  <line x1="351.111" y1="167.3172" x2="351.111" y2="223.9025" stroke="var(--text)" stroke-width="2"/>
  <line x1="639.9999" y1="167.3172" x2="639.9999" y2="223.9025" stroke="var(--text)" stroke-width="2"/>
  <line x1="928.8887" y1="167.3172" x2="928.8887" y2="223.9025" stroke="var(--text)" stroke-width="2"/>
  <rect x="184.4444" y="223.9025" width="333.3332" height="99.0244" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="351.111" y="266.3415" text-anchor="middle" font-size="22.9654" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">LoRA Medical</text>
  <text x="351.111" y="294.6342" text-anchor="middle" font-size="19.6846" fill="var(--text-muted)" font-family="Arial, sans-serif">(80 MB)</text>
  <rect x="473.3332" y="223.9025" width="333.3332" height="99.0244" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="266.3415" text-anchor="middle" font-size="22.9654" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">LoRA Legal</text>
  <text x="639.9999" y="294.6342" text-anchor="middle" font-size="19.6846" fill="var(--text-muted)" font-family="Arial, sans-serif">(80 MB)</text>
  <rect x="762.2221" y="223.9025" width="333.3332" height="99.0244" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="928.8887" y="266.3415" text-anchor="middle" font-size="22.9654" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">LoRA Code</text>
  <text x="928.8887" y="294.6342" text-anchor="middle" font-size="19.6846" fill="var(--text-muted)" font-family="Arial, sans-serif">(80 MB)</text>
  <rect x="40" y="393.6585" width="1200" height="226.3415" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="436.0976" text-anchor="middle" font-size="22.9654" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Runtime Switching</text>
  <text x="106.6667" y="478.5365" font-size="21.3251" fill="var(--text)" font-family="Courier New, monospace">model.load_adapter("medical-adapter")</text>
  <text x="106.6667" y="513.9024" font-size="21.3251" fill="var(--text)" font-family="Courier New, monospace">response_1 = model.generate(medical_query)</text>
  <text x="106.6667" y="563.4147" font-size="21.3251" fill="var(--text)" font-family="Courier New, monospace">model.load_adapter("legal-adapter")</text>
  <text x="106.6667" y="598.7805" font-size="21.3251" fill="var(--text)" font-family="Courier New, monospace">response_2 = model.generate(legal_query)</text>
</svg>

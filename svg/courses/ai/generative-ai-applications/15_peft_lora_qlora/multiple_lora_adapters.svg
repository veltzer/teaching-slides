<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="594.7474" y="43.6363" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="var(--text)">Multiple LoRA Adapters</text>
  <rect x="203.9134" y="72.7273" width="781.6681" height="101.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="594.7474" y="116.3636" text-anchor="middle" font-size="23.2727" font-weight="bold" fill="var(--text)">BASE MODEL (8B)</text>
  <text x="594.7474" y="145.4545" text-anchor="middle" font-size="17.4545" fill="var(--text-muted)">(loaded once in memory)</text>
  <line x1="373.8412" y1="174.5455" x2="373.8412" y2="232.7273" stroke="var(--text)" stroke-width="2" />
  <line x1="594.7474" y1="174.5455" x2="594.7474" y2="232.7273" stroke="var(--text)" stroke-width="2" />
  <line x1="815.6536" y1="174.5455" x2="815.6536" y2="232.7273" stroke="var(--text)" stroke-width="2" />
  <rect x="246.3954" y="232.7273" width="254.8917" height="101.8182" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="373.8412" y="276.3636" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--text)">LoRA Medical</text>
  <text x="373.8412" y="305.4546" text-anchor="middle" font-size="17.4545" fill="var(--text-muted)">(80 MB)</text>
  <rect x="467.3015" y="232.7273" width="254.8917" height="101.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="594.7474" y="276.3636" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--text)">LoRA Legal</text>
  <text x="594.7474" y="305.4546" text-anchor="middle" font-size="17.4545" fill="var(--text-muted)">(80 MB)</text>
  <rect x="688.2077" y="232.7273" width="254.8917" height="101.8182" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="815.6536" y="276.3636" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--text)">LoRA Code</text>
  <text x="815.6536" y="305.4546" text-anchor="middle" font-size="17.4545" fill="var(--text-muted)">(80 MB)</text>
  <rect x="135.9423" y="407.2727" width="917.6104" height="232.7273" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="594.7474" y="450.9091" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--text)">Runtime Switching</text>
  <text x="186.9207" y="494.5454" font-size="18.9091" fill="var(--text)" font-family="monospace">model.load_adapter("medical-adapter")</text>
  <text x="186.9207" y="530.909" font-size="18.9091" fill="var(--text)" font-family="monospace">response_1 = model.generate(medical_query)</text>
  <text x="186.9207" y="581.8182" font-size="18.9091" fill="var(--text)" font-family="monospace">model.load_adapter("legal-adapter")</text>
  <text x="186.9207" y="618.1818" font-size="18.9091" fill="var(--text)" font-family="monospace">response_2 = model.generate(legal_query)</text>
</svg>
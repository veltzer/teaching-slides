<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Multiple LoRA Adapters</text>
  <!-- Base model -->
  <rect x="120" y="50" width="460" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">BASE MODEL (8B)</text>
  <text x="350" y="100" text-anchor="middle" font-size="12" fill="#666">(loaded once in memory)</text>
  <!-- Connector lines -->
  <line x1="220" y1="120" x2="220" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="350" y1="120" x2="350" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="480" y1="120" x2="480" y2="160" stroke="#333" stroke-width="2"/>
  <!-- LoRA adapters -->
  <rect x="145" y="160" width="150" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="220" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">LoRA Medical</text>
  <text x="220" y="210" text-anchor="middle" font-size="12" fill="#666">(80 MB)</text>
  <rect x="275" y="160" width="150" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">LoRA Legal</text>
  <text x="350" y="210" text-anchor="middle" font-size="12" fill="#666">(80 MB)</text>
  <rect x="405" y="160" width="150" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="480" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">LoRA Code</text>
  <text x="480" y="210" text-anchor="middle" font-size="12" fill="#666">(80 MB)</text>
  <!-- Runtime switching -->
  <rect x="80" y="280" width="540" height="160" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Runtime Switching</text>
  <text x="110" y="340" font-size="13" fill="#333" font-family="monospace">model.load_adapter("medical-adapter")</text>
  <text x="110" y="365" font-size="13" fill="#333" font-family="monospace">response_1 = model.generate(medical_query)</text>
  <text x="110" y="400" font-size="13" fill="#333" font-family="monospace">model.load_adapter("legal-adapter")</text>
  <text x="110" y="425" font-size="13" fill="#333" font-family="monospace">response_2 = model.generate(legal_query)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999893750003" y="40" text-anchor="middle" font-size="24.34954656309" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">PEFT Training Best Practices</text>
  <rect x="40" y="65.777777777778" width="1200" height="90.222333333333" rx="6.51920230334" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.499980078126" y="95.422333333333" font-size="18.938499997946" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. START WITH r=16, adjust based on results</text>
  <text x="114.999960156251" y="123.777777777778" font-size="16.232922388689" fill="var(--text-muted)" font-family="Arial, sans-serif">Increase if underfitting | Decrease if overfitting</text>
  <rect x="40" y="168.888888888889" width="1200" height="90.222333333333" rx="6.51920230334" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.499980078126" y="198.533333333333" font-size="18.938499997946" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2. TARGET ALL LINEAR LAYERS</text>
  <text x="114.999960156251" y="226.888888888889" font-size="16.232922388689" fill="var(--text-muted)" font-family="Arial, sans-serif">target_modules="all-linear" is a good default | More targets = better quality</text>
  <rect x="40" y="272.000111111111" width="1200" height="90.222333333333" rx="6.51920230334" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.499980078126" y="301.644444444444" font-size="18.938499997946" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. LEARNING RATE</text>
  <text x="114.999960156251" y="330" font-size="16.232922388689" fill="var(--text-muted)" font-family="Arial, sans-serif">LoRA: 1e-4 to 3e-4 (higher than full FT) | Prompt Tuning: 3e-2 to 3e-1</text>
  <rect x="40" y="375.111222222222" width="1200" height="90.222333333333" rx="6.51920230334" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.499980078126" y="404.755555555556" font-size="18.938499997946" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">4. USE GRADIENT CHECKPOINTING</text>
  <text x="114.999960156251" y="433.111222222222" font-size="16.232922388689" fill="var(--text-muted)" font-family="Arial, sans-serif">Trades compute for memory | model.gradient_checkpointing_enable()</text>
  <rect x="40" y="478.222222222222" width="1200" height="141.777777777778" rx="6.51920230334" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.499980078126" y="507.866777777778" font-size="18.938499997946" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">5. MONITOR TRAINING LOSS</text>
  <text x="114.999960156251" y="540.088888888889" font-size="16.232922388689" fill="var(--text-muted)" font-family="Arial, sans-serif">Loss should decrease steadily</text>
  <text x="114.999960156251" y="568.444444444444" font-size="16.232922388689" fill="var(--danger-accent)" font-family="Arial, sans-serif">Sudden increase = learning rate too high</text>
  <text x="114.999960156251" y="596.800111111111" font-size="16.232922388689" fill="var(--warn-accent)" font-family="Arial, sans-serif">Flat loss = learning rate too low</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="18.2857" y="13.8462" width="1243.4286" height="692.3077" rx="6.9231" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7692" />
  <text x="640" y="62.3077" text-anchor="middle" font-size="24.9231" font-weight="bold" fill="#333">PEFT Training Best Practices</text>
  <rect x="54.8571" y="90" width="1170.2857" height="96.9231" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.0769" />
  <text x="91.4286" y="121.8462" font-size="19.3846" font-weight="bold" fill="#333">1. START WITH r=16, adjust based on results</text>
  <text x="128" y="152.3077" font-size="16.6154" fill="#555">Increase if underfitting | Decrease if overfitting</text>
  <rect x="54.8571" y="200.7692" width="1170.2857" height="96.9231" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.0769" />
  <text x="91.4286" y="232.6154" font-size="19.3846" font-weight="bold" fill="#333">2. TARGET ALL LINEAR LAYERS</text>
  <text x="128" y="263.0769" font-size="16.6154" fill="#555">target_modules="all-linear" is a good default | More targets = better quality</text>
  <rect x="54.8571" y="311.5385" width="1170.2857" height="96.9231" rx="6.9231" fill="#fff3cd" stroke="#ffc107" stroke-width="2.0769" />
  <text x="91.4286" y="343.3846" font-size="19.3846" font-weight="bold" fill="#333">3. LEARNING RATE</text>
  <text x="128" y="373.8462" font-size="16.6154" fill="#555">LoRA: 1e-4 to 3e-4 (higher than full FT) | Prompt Tuning: 3e-2 to 3e-1</text>
  <rect x="54.8571" y="422.3077" width="1170.2857" height="96.9231" rx="6.9231" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.0769" />
  <text x="91.4286" y="454.1538" font-size="19.3846" font-weight="bold" fill="#333">4. USE GRADIENT CHECKPOINTING</text>
  <text x="128" y="484.6154" font-size="16.6154" fill="#555">Trades compute for memory | model.gradient_checkpointing_enable()</text>
  <rect x="54.8571" y="533.0769" width="1170.2857" height="152.3077" rx="6.9231" fill="#f8d7da" stroke="#dc3545" stroke-width="2.0769" />
  <text x="91.4286" y="564.9231" font-size="19.3846" font-weight="bold" fill="#333">5. MONITOR TRAINING LOSS</text>
  <text x="128" y="599.5385" font-size="16.6154" fill="#555">Loss should decrease steadily</text>
  <text x="128" y="630" font-size="16.6154" fill="#dc3545">Sudden increase = learning rate too high</text>
  <text x="128" y="660.4615" font-size="16.6154" fill="#ffc107">Flat loss = learning rate too low</text>
</svg>
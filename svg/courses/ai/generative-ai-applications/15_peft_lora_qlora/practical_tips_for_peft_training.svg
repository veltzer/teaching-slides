<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:rect x="16.5727" y="12.5491" width="1126.9417" height="627.4509" rx="6.2745" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="56.4706" text-anchor="middle" font-size="22.5883" font-weight="bold" fill="var(--text-dark)">PEFT Training Best Practices</ns0:text>
  <ns0:rect x="49.718" y="81.5686" width="1060.651" height="87.8432" rx="6.2745" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.8823" />
  <ns0:text x="82.8634" y="110.4314" font-size="17.5686" font-weight="bold" fill="var(--text-dark)">1. START WITH r=16, adjust based on results</ns0:text>
  <ns0:text x="116.0087" y="138.0392" font-size="15.0588" fill="var(--text-muted)">Increase if underfitting | Decrease if overfitting</ns0:text>
  <ns0:rect x="49.718" y="181.9607" width="1060.651" height="87.8432" rx="6.2745" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.8823" />
  <ns0:text x="82.8634" y="210.8235" font-size="17.5686" font-weight="bold" fill="var(--text-dark)">2. TARGET ALL LINEAR LAYERS</ns0:text>
  <ns0:text x="116.0087" y="238.4313" font-size="15.0588" fill="var(--text-muted)">target_modules="all-linear" is a good default | More targets = better quality</ns0:text>
  <ns0:rect x="49.718" y="282.353" width="1060.651" height="87.8432" rx="6.2745" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.8823" />
  <ns0:text x="82.8634" y="311.2156" font-size="17.5686" font-weight="bold" fill="var(--text-dark)">3. LEARNING RATE</ns0:text>
  <ns0:text x="116.0087" y="338.8235" font-size="15.0588" fill="var(--text-muted)">LoRA: 1e-4 to 3e-4 (higher than full FT) | Prompt Tuning: 3e-2 to 3e-1</ns0:text>
  <ns0:rect x="49.718" y="382.7451" width="1060.651" height="87.8432" rx="6.2745" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.8823" />
  <ns0:text x="82.8634" y="411.6078" font-size="17.5686" font-weight="bold" fill="var(--text-dark)">4. USE GRADIENT CHECKPOINTING</ns0:text>
  <ns0:text x="116.0087" y="439.2157" font-size="15.0588" fill="var(--text-muted)">Trades compute for memory | model.gradient_checkpointing_enable()</ns0:text>
  <ns0:rect x="49.718" y="483.1372" width="1060.651" height="138.0392" rx="6.2745" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.8823" />
  <ns0:text x="82.8634" y="512" font-size="17.5686" font-weight="bold" fill="var(--text-dark)">5. MONITOR TRAINING LOSS</ns0:text>
  <ns0:text x="116.0087" y="543.3725" font-size="15.0588" fill="var(--text-muted)">Loss should decrease steadily</ns0:text>
  <ns0:text x="116.0087" y="570.9803" font-size="15.0588" fill="var(--danger-bright)">Sudden increase = learning rate too high</ns0:text>
  <ns0:text x="116.0087" y="598.5882" font-size="15.0588" fill="var(--warn-yellow)">Flat loss = learning rate too low</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="700" height="400" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Parameter Efficient Fine Tuning (PEFT)</text>
  <!-- Header row -->
  <rect x="30" y="65" width="150" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="105" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Method</text>
  <rect x="180" y="65" width="130" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="245" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Trainable Params</text>
  <rect x="310" y="65" width="120" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="370" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Memory Savings</text>
  <rect x="430" y="65" width="120" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="490" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Quality</text>
  <!-- Rows -->
  <rect x="30" y="100" width="150" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="105" y="122" text-anchor="middle" font-size="12" fill="#333">Full FT</text>
  <rect x="180" y="100" width="130" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="245" y="122" text-anchor="middle" font-size="12" fill="#333">100%</text>
  <rect x="310" y="100" width="120" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="370" y="122" text-anchor="middle" font-size="12" fill="#333">1x</text>
  <rect x="430" y="100" width="120" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="490" y="122" text-anchor="middle" font-size="12" fill="#333">5/5</text>

  <rect x="30" y="140" width="150" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="105" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">LoRA</text>
  <rect x="180" y="140" width="130" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="245" y="162" text-anchor="middle" font-size="12" fill="#333">0.1-1%</text>
  <rect x="310" y="140" width="120" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="370" y="162" text-anchor="middle" font-size="12" fill="#333">3-5x</text>
  <rect x="430" y="140" width="120" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="490" y="162" text-anchor="middle" font-size="12" fill="#333">4/5</text>

  <rect x="30" y="180" width="150" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="105" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">QLoRA</text>
  <rect x="180" y="180" width="130" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="245" y="202" text-anchor="middle" font-size="12" fill="#333">0.1-1%</text>
  <rect x="310" y="180" width="120" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="370" y="202" text-anchor="middle" font-size="12" fill="#333">6-10x</text>
  <rect x="430" y="180" width="120" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="490" y="202" text-anchor="middle" font-size="12" fill="#333">4/5</text>

  <rect x="30" y="220" width="150" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="105" y="242" text-anchor="middle" font-size="12" fill="#333">Prompt Tuning</text>
  <rect x="180" y="220" width="130" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="245" y="242" text-anchor="middle" font-size="12" fill="#333">0.01%</text>
  <rect x="310" y="220" width="120" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="370" y="242" text-anchor="middle" font-size="12" fill="#333">10x</text>
  <rect x="430" y="220" width="120" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="490" y="242" text-anchor="middle" font-size="12" fill="#333">3/5</text>

  <rect x="30" y="260" width="150" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="105" y="282" text-anchor="middle" font-size="12" fill="#333">Prefix Tuning</text>
  <rect x="180" y="260" width="130" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="245" y="282" text-anchor="middle" font-size="12" fill="#333">0.1%</text>
  <rect x="310" y="260" width="120" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="370" y="282" text-anchor="middle" font-size="12" fill="#333">5x</text>
  <rect x="430" y="260" width="120" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="490" y="282" text-anchor="middle" font-size="12" fill="#333">3.5/5</text>

  <rect x="30" y="300" width="150" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="105" y="322" text-anchor="middle" font-size="12" fill="#333">Adapters</text>
  <rect x="180" y="300" width="130" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="245" y="322" text-anchor="middle" font-size="12" fill="#333">1-5%</text>
  <rect x="310" y="300" width="120" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="370" y="322" text-anchor="middle" font-size="12" fill="#333">2-3x</text>
  <rect x="430" y="300" width="120" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="490" y="322" text-anchor="middle" font-size="12" fill="#333">4/5</text>

  <rect x="30" y="340" width="150" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="105" y="362" text-anchor="middle" font-size="12" fill="#333">IA3</text>
  <rect x="180" y="340" width="130" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="245" y="362" text-anchor="middle" font-size="12" fill="#333">0.01%</text>
  <rect x="310" y="340" width="120" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="370" y="362" text-anchor="middle" font-size="12" fill="#333">10x</text>
  <rect x="430" y="340" width="120" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="490" y="362" text-anchor="middle" font-size="12" fill="#333">3/5</text>

  <text x="360" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Most popular: LoRA and QLoRA</text>
</svg>
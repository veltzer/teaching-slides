<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" font-weight="bold" fill="#333">LoRA: Low-Rank Adaptation</text>
  <text x="320" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#333">Original Weight Matrix W (frozen)</text>
  <rect x="128" y="126" width="384" height="252" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="320" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" fill="#dc3545">d x d matrix</text>
  <text x="320" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#555">(16M params)</text>
  <text x="320" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#888">Frozen -- no gradients</text>
  <text x="960" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#28a745">LoRA Decomposition</text>
  <rect x="736" y="126" width="96" height="252" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="784" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#333">B</text>
  <text x="784" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#555">d x r</text>
  <text x="864" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.8" fill="#333">x</text>
  <rect x="896" y="198" width="320" height="90" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="1056" y="239.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#333">A</text>
  <text x="1056" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#555">r x d</text>
  <text x="960" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" fill="#333">= delta-W approximation</text>
  <rect x="160" y="450" width="400" height="108" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <text x="360" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#dc3545">Full Fine-tuning</text>
  <text x="360" y="536.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">16,000,000 params (d x d)</text>
  <rect x="720" y="450" width="400" height="108" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="920" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#28a745">LoRA (rank r)</text>
  <text x="920" y="536.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">131,000 params (d*r + r*d)</text>
  <rect x="368" y="603" width="544" height="90" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="640" y="644.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#856404">~99% parameter reduction!</text>
  <text x="640" y="678.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Same or similar quality with far fewer trainable params</text>
</svg>
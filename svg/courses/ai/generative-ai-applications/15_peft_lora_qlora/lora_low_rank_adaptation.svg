<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="604.7059" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.4356" font-weight="bold" fill="var(--text)">LoRA: Low-Rank Adaptation</text>
  <text x="251.7647" y="96.389" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6664" font-weight="bold" fill="var(--text)">Original Weight Matrix W (frozen)</text>
  <rect x="40" y="112.5" width="423.5294" height="225.5556" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="251.7647" y="201.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2562" fill="var(--danger-accent)">d x d matrix</text>
  <text x="251.7647" y="241.3889" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0767" fill="var(--text-muted)">(16M params)</text>
  <text x="251.7647" y="281.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.487" fill="var(--text-faint)">Frozen -- no gradients</text>
  <text x="957.6471" y="96.389" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6664" font-weight="bold" fill="var(--ok-accent)">LoRA Decomposition</text>
  <rect x="710.5883" y="112.5" width="105.8823" height="225.5556" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="763.5294" y="209.1667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6664" font-weight="bold" fill="var(--text)">B</text>
  <text x="763.5294" y="241.3889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8972" fill="var(--text-muted)">d x r</text>
  <text x="851.7648" y="233.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.6151" fill="var(--text)">x</text>
  <rect x="887.0588" y="176.9444" width="352.9412" height="80.5556" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.5295" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6664" font-weight="bold" fill="var(--text)">A</text>
  <text x="1063.5295" y="241.3889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8972" fill="var(--text-muted)">r x d</text>
  <text x="957.6471" y="313.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2562" fill="var(--text)">= delta-W approximation</text>
  <rect x="75.294" y="402.5" width="441.1765" height="96.6667" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="295.8823" y="442.7778" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0767" font-weight="bold" fill="var(--danger-accent)">Full Fine-tuning</text>
  <text x="295.8823" y="479.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0767" fill="var(--text)">16,000,000 params (d x d)</text>
  <rect x="692.9412" y="402.5" width="441.1765" height="96.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="913.5294" y="442.7778" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0767" font-weight="bold" fill="var(--ok-accent)">LoRA (rank r)</text>
  <text x="913.5294" y="479.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0767" fill="var(--text)">131,000 params (d*r + r*d)</text>
  <rect x="304.7059" y="539.4444" width="600.0001" height="80.5556" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.7059" y="576.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6664" font-weight="bold" fill="var(--danger-accent)">~99% parameter reduction!</text>
  <text x="604.7059" y="607.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.487" fill="var(--text-muted)">Same or similar quality with far fewer trainable params</text>
</svg>
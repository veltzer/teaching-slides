  <ns0:text x="797.9221" y="241.039" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.5974" fill="#333">x</ns0:text>
  <ns0:rect x="827.4747" y="182.8571" width="295.5267" height="83.1169" rx="7.3882" fill="#d4edda" stroke="#28a745" stroke-width="2.9553" />
  <ns0:text x="975.2381" y="221.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="#333">A</ns0:text>
  <ns0:text x="975.2381" y="249.3506" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="#555">r x d</ns0:text>
  <ns0:text x="886.5801" y="324.1558" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6869" fill="#333">= delta-W approximation</ns0:text>

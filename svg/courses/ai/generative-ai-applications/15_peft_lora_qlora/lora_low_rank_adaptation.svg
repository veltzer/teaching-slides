  <ns0:text x="332.4675" y="457.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="#dc3545">Full Fine-tuning</ns0:text>
  <ns0:text x="332.4675" y="495.3766" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="#333">16,000,000 params (d x d)</ns0:text>
  <ns0:rect x="664.9351" y="415.5844" width="369.4084" height="99.7403" rx="7.3882" fill="#d4edda" stroke="#28a745" stroke-width="2.2165" />

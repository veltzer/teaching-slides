<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="16.5857" y="13.0612" width="1127.8264" height="626.9388" rx="6.5306" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.6122" />
  <text x="580.4989" y="58.7755" text-anchor="middle" font-size="23.5102" font-weight="bold" fill="var(--text-dark)">QLoRA Innovations</text>
  <rect x="49.757" y="84.898" width="1061.4836" height="130.6122" rx="6.5306" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.6122" />
  <text x="82.9284" y="117.551" font-size="18.2857" font-weight="bold" fill="var(--text-dark)">1. NF4 Quantization (NormalFloat4)</text>
  <text x="116.0998" y="150.2041" font-size="15.6735" fill="var(--text-muted)">Quantization levels match normal distribution</text>
  <text x="116.0998" y="176.3265" font-size="15.6735" fill="var(--text-muted)">Better than uniform INT4 for neural net weights</text>
  <text x="116.0998" y="202.449" font-size="15.6735" fill="var(--text-muted)">Information-theoretically optimal for N(0,sigma)</text>
  <rect x="49.757" y="235.102" width="1061.4836" height="130.6122" rx="6.5306" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.6122" />
  <text x="82.9284" y="267.7551" font-size="18.2857" font-weight="bold" fill="var(--text-dark)">2. Double Quantization</text>
  <text x="116.0998" y="300.4082" font-size="15.6735" fill="var(--text-muted)">Quantize the quantization constants too</text>
  <text x="116.0998" y="326.5306" font-size="15.6735" fill="var(--text-muted)">Saves ~0.4 bits per parameter</text>
  <text x="116.0998" y="352.6531" font-size="15.6735" fill="var(--text-muted)">3 GB savings for a 65B model</text>
  <rect x="49.757" y="385.3061" width="1061.4836" height="130.6122" rx="6.5306" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.9592" />
  <text x="82.9284" y="417.9592" font-size="18.2857" font-weight="bold" fill="var(--text-dark)">3. Paged Optimizers</text>
  <text x="116.0998" y="450.6122" font-size="15.6735" fill="var(--text-muted)">Use CPU RAM when GPU memory is full</text>
  <text x="116.0998" y="476.7347" font-size="15.6735" fill="var(--text-muted)">Automatic page-in/page-out</text>
  <text x="116.0998" y="502.8571" font-size="15.6735" fill="var(--text-muted)">Handles memory spikes during training</text>
  <rect x="132.6854" y="542.0408" width="895.6268" height="71.8367" rx="6.5306" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.6122" />
  <text x="580.4989" y="574.6939" text-anchor="middle" font-size="18.2857" font-weight="bold" fill="var(--ok-bright)">Result: 70B model fine-tuning on a single GPU</text>
  <text x="580.4989" y="600.8163" text-anchor="middle" font-size="15.6735" fill="var(--text-dark)">with NO quality loss compared to full FP16 LoRA</text>
</svg>
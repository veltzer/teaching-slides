<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="680" height="480" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">QLoRA Innovations</text>
  <!-- Innovation 1 -->
  <rect x="30" y="65" width="640" height="100" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="50" y="90" font-size="14" font-weight="bold" fill="#333">1. NF4 Quantization (NormalFloat4)</text>
  <text x="70" y="115" font-size="12" fill="#555">Quantization levels match normal distribution</text>
  <text x="70" y="135" font-size="12" fill="#555">Better than uniform INT4 for neural net weights</text>
  <text x="70" y="155" font-size="12" fill="#555">Information-theoretically optimal for N(0,sigma)</text>
  <!-- Innovation 2 -->
  <rect x="30" y="180" width="640" height="100" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="50" y="205" font-size="14" font-weight="bold" fill="#333">2. Double Quantization</text>
  <text x="70" y="230" font-size="12" fill="#555">Quantize the quantization constants too</text>
  <text x="70" y="250" font-size="12" fill="#555">Saves ~0.4 bits per parameter</text>
  <text x="70" y="270" font-size="12" fill="#555">3 GB savings for a 65B model</text>
  <!-- Innovation 3 -->
  <rect x="30" y="295" width="640" height="100" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="50" y="320" font-size="14" font-weight="bold" fill="#333">3. Paged Optimizers</text>
  <text x="70" y="345" font-size="12" fill="#555">Use CPU RAM when GPU memory is full</text>
  <text x="70" y="365" font-size="12" fill="#555">Automatic page-in/page-out</text>
  <text x="70" y="385" font-size="12" fill="#555">Handles memory spikes during training</text>
  <!-- Result -->
  <rect x="80" y="415" width="540" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Result: 70B model fine-tuning on a single GPU</text>
  <text x="350" y="460" text-anchor="middle" font-size="12" fill="#333">with NO quality loss compared to full FP16 LoRA</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.000159375009" y="40" text-anchor="middle" font-size="25.551588331618" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">QLoRA Innovations</text>
  <rect x="40" y="67.294158837376" width="1200" height="136.470568304496" rx="6.572671304965" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.500089648443" y="101.411772678202" font-size="19.873457591258" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. NF4 Quantization (NormalFloat4)</text>
  <text x="115.000179296885" y="135.529386519028" font-size="17.034392221079" fill="var(--text-muted)" font-family="Arial, sans-serif">Quantization levels match normal distribution</text>
  <text x="115.000179296885" y="162.823545356403" font-size="17.034392221079" fill="var(--text-muted)" font-family="Arial, sans-serif">Better than uniform INT4 for neural net weights</text>
  <text x="115.000179296885" y="190.117704193779" font-size="17.034392221079" fill="var(--text-muted)" font-family="Arial, sans-serif">Information-theoretically optimal for N(0,sigma)</text>
  <rect x="40" y="224.235205093414" width="1200" height="136.470568304496" rx="6.572671304965" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.500089648443" y="258.352931875431" font-size="19.873457591258" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2. Double Quantization</text>
  <text x="115.000179296885" y="292.470658657449" font-size="17.034392221079" fill="var(--text-muted)" font-family="Arial, sans-serif">Quantize the quantization constants too</text>
  <text x="115.000179296885" y="319.764704553633" font-size="17.034392221079" fill="var(--text-muted)" font-family="Arial, sans-serif">Saves ~0.4 bits per parameter</text>
  <text x="115.000179296885" y="347.058863391009" font-size="17.034392221079" fill="var(--text-muted)" font-family="Arial, sans-serif">3 GB savings for a 65B model</text>
  <rect x="40" y="381.176477231835" width="1200" height="136.470568304496" rx="6.572671304965" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.500089648443" y="415.294204013852" font-size="19.873457591258" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. Paged Optimizers</text>
  <text x="115.000179296885" y="449.411704913487" font-size="17.034392221079" fill="var(--text-muted)" font-family="Arial, sans-serif">Use CPU RAM when GPU memory is full</text>
  <text x="115.000179296885" y="476.705863750863" font-size="17.034392221079" fill="var(--text-muted)" font-family="Arial, sans-serif">Automatic page-in/page-out</text>
  <text x="115.000179296885" y="504.000022588238" font-size="17.034392221079" fill="var(--text-muted)" font-family="Arial, sans-serif">Handles memory spikes during training</text>
  <rect x="133.750011621094" y="544.941204373706" width="1012.499976757811" height="75.058795626294" rx="6.572671304965" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000159375009" y="579.058931155723" text-anchor="middle" font-size="19.873457591258" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Result: 70B model fine-tuning on a single GPU</text>
  <text x="640.000159375009" y="606.352977051908" text-anchor="middle" font-size="17.034392221079" fill="var(--text)" font-family="Arial, sans-serif">with NO quality loss compared to full FP16 LoRA</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="82.2917" text-anchor="middle" font-size="23.3253" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">QLoRA Innovations</text>
  <rect x="75.294" y="106.4584" width="1129.4117" height="120.8333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="110.5882" y="136.6667" font-size="18.1419" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. NF4 Quantization (NormalFloat4)</text>
  <text x="145.8824" y="166.875" font-size="15.5502" fill="var(--text-muted)" font-family="Arial, sans-serif">Quantization levels match normal distribution</text>
  <text x="145.8824" y="191.0417" font-size="15.5502" fill="var(--text-muted)" font-family="Arial, sans-serif">Better than uniform INT4 for neural net weights</text>
  <text x="145.8824" y="215.2084" font-size="15.5502" fill="var(--text-muted)" font-family="Arial, sans-serif">Information-theoretically optimal for N(0,sigma)</text>
  <rect x="75.294" y="245.4166" width="1129.4117" height="120.8333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="110.5882" y="275.625" font-size="18.1419" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2. Double Quantization</text>
  <text x="145.8824" y="305.8334" font-size="15.5502" fill="var(--text-muted)" font-family="Arial, sans-serif">Quantize the quantization constants too</text>
  <text x="145.8824" y="330" font-size="15.5502" fill="var(--text-muted)" font-family="Arial, sans-serif">Saves ~0.4 bits per parameter</text>
  <text x="145.8824" y="354.1667" font-size="15.5502" fill="var(--text-muted)" font-family="Arial, sans-serif">3 GB savings for a 65B model</text>
  <rect x="75.294" y="384.375" width="1129.4117" height="120.8333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="110.5882" y="414.5834" font-size="18.1419" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. Paged Optimizers</text>
  <text x="145.8824" y="444.7916" font-size="15.5502" fill="var(--text-muted)" font-family="Arial, sans-serif">Use CPU RAM when GPU memory is full</text>
  <text x="145.8824" y="468.9583" font-size="15.5502" fill="var(--text-muted)" font-family="Arial, sans-serif">Automatic page-in/page-out</text>
  <text x="145.8824" y="493.125" font-size="15.5502" fill="var(--text-muted)" font-family="Arial, sans-serif">Handles memory spikes during training</text>
  <rect x="163.5293" y="529.375" width="952.9411" height="66.4583" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="559.5834" text-anchor="middle" font-size="18.1419" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Result: 70B model fine-tuning on a single GPU</text>
  <text x="640" y="583.75" text-anchor="middle" font-size="15.5502" fill="var(--text)" font-family="Arial, sans-serif">with NO quality loss compared to full FP16 LoRA</text>
</svg>

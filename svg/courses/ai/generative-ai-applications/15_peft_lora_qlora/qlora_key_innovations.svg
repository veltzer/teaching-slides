<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="18.2857" y="14.4" width="1243.4286" height="691.2" rx="7.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.88" />
  <text x="640" y="64.8" text-anchor="middle" font-size="25.92" font-weight="bold" fill="#333">QLoRA Innovations</text>
  <rect x="54.8571" y="93.6" width="1170.2857" height="144" rx="7.2" fill="#d4edda" stroke="#28a745" stroke-width="2.88" />
  <text x="91.4286" y="129.6" font-size="20.16" font-weight="bold" fill="#333">1. NF4 Quantization (NormalFloat4)</text>
  <text x="128" y="165.6" font-size="17.28" fill="#555">Quantization levels match normal distribution</text>
  <text x="128" y="194.4" font-size="17.28" fill="#555">Better than uniform INT4 for neural net weights</text>
  <text x="128" y="223.2" font-size="17.28" fill="#555">Information-theoretically optimal for N(0,sigma)</text>
  <rect x="54.8571" y="259.2" width="1170.2857" height="144" rx="7.2" fill="#fff3cd" stroke="#ffc107" stroke-width="2.88" />
  <text x="91.4286" y="295.2" font-size="20.16" font-weight="bold" fill="#333">2. Double Quantization</text>
  <text x="128" y="331.2" font-size="17.28" fill="#555">Quantize the quantization constants too</text>
  <text x="128" y="360" font-size="17.28" fill="#555">Saves ~0.4 bits per parameter</text>
  <text x="128" y="388.8" font-size="17.28" fill="#555">3 GB savings for a 65B model</text>
  <rect x="54.8571" y="424.8" width="1170.2857" height="144" rx="7.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.16" />
  <text x="91.4286" y="460.8" font-size="20.16" font-weight="bold" fill="#333">3. Paged Optimizers</text>
  <text x="128" y="496.8" font-size="17.28" fill="#555">Use CPU RAM when GPU memory is full</text>
  <text x="128" y="525.6" font-size="17.28" fill="#555">Automatic page-in/page-out</text>
  <text x="128" y="554.4" font-size="17.28" fill="#555">Handles memory spikes during training</text>
  <rect x="146.2857" y="597.6" width="987.4286" height="79.2" rx="7.2" fill="#d4edda" stroke="#28a745" stroke-width="2.88" />
  <text x="640" y="633.6" text-anchor="middle" font-size="20.16" font-weight="bold" fill="#28a745">Result: 70B model fine-tuning on a single GPU</text>
  <text x="640" y="662.4" text-anchor="middle" font-size="17.28" fill="#333">with NO quality loss compared to full FP16 LoRA</text>
</svg>
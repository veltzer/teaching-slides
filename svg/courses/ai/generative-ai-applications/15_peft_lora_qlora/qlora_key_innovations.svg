<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="16.5857" y="13.0612" width="1127.8264" height="626.9388" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.4989" y="58.7755" text-anchor="middle" font-size="23.5102" font-weight="bold" fill="var(--text)">QLoRA Innovations</text>
  <rect x="49.757" y="84.898" width="1061.4836" height="130.6122" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="82.9284" y="117.551" font-size="18.2857" font-weight="bold" fill="var(--text)">1. NF4 Quantization (NormalFloat4)</text>
  <text x="116.0998" y="150.2041" font-size="15.6735" fill="var(--text-muted)">Quantization levels match normal distribution</text>
  <text x="116.0998" y="176.3265" font-size="15.6735" fill="var(--text-muted)">Better than uniform INT4 for neural net weights</text>
  <text x="116.0998" y="202.449" font-size="15.6735" fill="var(--text-muted)">Information-theoretically optimal for N(0,sigma)</text>
  <rect x="49.757" y="235.102" width="1061.4836" height="130.6122" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="82.9284" y="267.7551" font-size="18.2857" font-weight="bold" fill="var(--text)">2. Double Quantization</text>
  <text x="116.0998" y="300.4082" font-size="15.6735" fill="var(--text-muted)">Quantize the quantization constants too</text>
  <text x="116.0998" y="326.5306" font-size="15.6735" fill="var(--text-muted)">Saves ~0.4 bits per parameter</text>
  <text x="116.0998" y="352.6531" font-size="15.6735" fill="var(--text-muted)">3 GB savings for a 65B model</text>
  <rect x="49.757" y="385.3061" width="1061.4836" height="130.6122" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="82.9284" y="417.9592" font-size="18.2857" font-weight="bold" fill="var(--text)">3. Paged Optimizers</text>
  <text x="116.0998" y="450.6122" font-size="15.6735" fill="var(--text-muted)">Use CPU RAM when GPU memory is full</text>
  <text x="116.0998" y="476.7347" font-size="15.6735" fill="var(--text-muted)">Automatic page-in/page-out</text>
  <text x="116.0998" y="502.8571" font-size="15.6735" fill="var(--text-muted)">Handles memory spikes during training</text>
  <rect x="132.6854" y="542.0408" width="895.6268" height="71.8367" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="580.4989" y="574.6939" text-anchor="middle" font-size="18.2857" font-weight="bold" fill="var(--ok-accent)">Result: 70B model fine-tuning on a single GPU</text>
  <text x="580.4989" y="600.8163" text-anchor="middle" font-size="15.6735" fill="var(--text)">with NO quality loss compared to full FP16 LoRA</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="16.5857" y="13.0612" width="1127.8264" height="626.9388" rx="6.5306" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.6122" />
  <ns0:text x="580.4989" y="58.7755" text-anchor="middle" font-size="23.5102" font-weight="bold" fill="#333">QLoRA Innovations</ns0:text>
  <ns0:rect x="49.757" y="84.898" width="1061.4836" height="130.6122" rx="6.5306" fill="#d4edda" stroke="#28a745" stroke-width="2.6122" />
  <ns0:text x="82.9284" y="117.551" font-size="18.2857" font-weight="bold" fill="#333">1. NF4 Quantization (NormalFloat4)</ns0:text>
  <ns0:text x="116.0998" y="150.2041" font-size="15.6735" fill="#555">Quantization levels match normal distribution</ns0:text>
  <ns0:text x="116.0998" y="176.3265" font-size="15.6735" fill="#555">Better than uniform INT4 for neural net weights</ns0:text>
  <ns0:text x="116.0998" y="202.449" font-size="15.6735" fill="#555">Information-theoretically optimal for N(0,sigma)</ns0:text>
  <ns0:rect x="49.757" y="235.102" width="1061.4836" height="130.6122" rx="6.5306" fill="#fff3cd" stroke="#ffc107" stroke-width="2.6122" />
  <ns0:text x="82.9284" y="267.7551" font-size="18.2857" font-weight="bold" fill="#333">2. Double Quantization</ns0:text>
  <ns0:text x="116.0998" y="300.4082" font-size="15.6735" fill="#555">Quantize the quantization constants too</ns0:text>
  <ns0:text x="116.0998" y="326.5306" font-size="15.6735" fill="#555">Saves ~0.4 bits per parameter</ns0:text>
  <ns0:text x="116.0998" y="352.6531" font-size="15.6735" fill="#555">3 GB savings for a 65B model</ns0:text>
  <ns0:rect x="49.757" y="385.3061" width="1061.4836" height="130.6122" rx="6.5306" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.9592" />
  <ns0:text x="82.9284" y="417.9592" font-size="18.2857" font-weight="bold" fill="#333">3. Paged Optimizers</ns0:text>
  <ns0:text x="116.0998" y="450.6122" font-size="15.6735" fill="#555">Use CPU RAM when GPU memory is full</ns0:text>
  <ns0:text x="116.0998" y="476.7347" font-size="15.6735" fill="#555">Automatic page-in/page-out</ns0:text>
  <ns0:text x="116.0998" y="502.8571" font-size="15.6735" fill="#555">Handles memory spikes during training</ns0:text>
  <ns0:rect x="132.6854" y="542.0408" width="895.6268" height="71.8367" rx="6.5306" fill="#d4edda" stroke="#28a745" stroke-width="2.6122" />
  <ns0:text x="580.4989" y="574.6939" text-anchor="middle" font-size="18.2857" font-weight="bold" fill="#28a745">Result: 70B model fine-tuning on a single GPU</ns0:text>
  <ns0:text x="580.4989" y="600.8163" text-anchor="middle" font-size="15.6735" fill="#333">with NO quality loss compared to full FP16 LoRA</ns0:text>
</ns0:svg>
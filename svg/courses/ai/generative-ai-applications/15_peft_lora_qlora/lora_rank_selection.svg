  <ns0:rect x="9.2754" y="203.1773" width="329.2754" height="180.602" rx="3.7626" fill="#d4edda" stroke="#28a745" stroke-width="1.505" />
  <ns0:text x="173.4493" y="221.9899" text-anchor="middle" font-size="10.5351" font-weight="bold" fill="#333">Rank Selection Guidelines</ns0:text>
  <ns0:text x="27.8261" y="240.8027" font-size="10" fill="#333">r=4:   Simple tasks (classification, sentiment)</ns0:text>
  <ns0:text x="27.8261" y="259.6154" font-size="10" fill="#333">r=8:   Standard tasks (Q&amp;A, summarization)</ns0:text>
  <ns0:text x="27.8261" y="278.4281" font-size="10" fill="#333">r=16:  Complex tasks (code gen, reasoning)</ns0:text>
  <ns0:text x="27.8261" y="297.2408" font-size="10" fill="#333">r=32:  Near-full-FT quality needed</ns0:text>
  <ns0:text x="27.8261" y="316.0535" font-size="10" fill="#333">r=64+: Usually not worth it (use full FT)</ns0:text>
  <ns0:rect x="357.1015" y="203.1773" width="329.2754" height="180.602" rx="3.7626" fill="#fff3cd" stroke="#ffc107" stroke-width="1.505" />
  <ns0:text x="521.2754" y="221.9899" text-anchor="middle" font-size="10.5351" font-weight="bold" fill="#333">Memory Impact (7B model)</ns0:text>
  <ns0:text x="375.6522" y="244.5652" font-size="10" fill="#333">r=8:    ~40 MB additional parameters</ns0:text>
  <ns0:text x="375.6522" y="267.1405" font-size="10" fill="#333">r=16:   ~80 MB</ns0:text>
  <ns0:text x="375.6522" y="289.7157" font-size="10" fill="#333">r=32:   ~160 MB</ns0:text>
  <ns0:text x="375.6522" y="312.291" font-size="10" fill="#333">r=64:   ~320 MB</ns0:text>
</ns0:svg>
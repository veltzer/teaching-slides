  <text x="691.2" y="491.5385" font-size="16.6154" fill="#333">r=16:   ~80 MB</text>
  <text x="691.2" y="533.0769" font-size="16.6154" fill="#333">r=32:   ~160 MB</text>
  <text x="691.2" y="574.6154" font-size="16.6154" fill="#333">r=64:   ~320 MB</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="9.2754" y="7.5251" width="677.1015" height="188.1271" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="347.8261" y="30.1003" text-anchor="middle" font-size="12.0401" font-weight="bold" fill="var(--text)">LoRA Rank Selection</text>
  <line x1="74.2029" y1="165.5518" x2="649.2754" y2="165.5518" stroke="var(--text)" stroke-width="1.505" />
  <line x1="74.2029" y1="165.5518" x2="74.2029" y2="45.1505" stroke="var(--text)" stroke-width="1.505" />
  <text x="55.6522" y="105.3512" text-anchor="middle" font-size="10" fill="var(--text)" transform="rotate(-90,60,140)">Quality</text>
  <text x="361.7391" y="184.3646" text-anchor="middle" font-size="10" fill="var(--text)">Rank (r)</text>
  <text x="102.029" y="179.097" text-anchor="middle" font-size="10" fill="var(--text-muted)">4</text>
  <text x="176.2319" y="179.097" text-anchor="middle" font-size="10" fill="var(--text-muted)">8</text>
  <text x="259.7102" y="179.097" text-anchor="middle" font-size="10" fill="var(--text-muted)">16</text>
  <text x="352.4638" y="179.097" text-anchor="middle" font-size="10" fill="var(--text-muted)">32</text>
  <text x="454.4928" y="179.097" text-anchor="middle" font-size="10" fill="var(--text-muted)">64</text>
  <text x="565.7971" y="179.097" text-anchor="middle" font-size="10" fill="var(--text-muted)">128</text>
  <text x="640" y="179.097" text-anchor="middle" font-size="10" fill="var(--text-muted)">256</text>
  <path d="M 74.2029 158.0267 Q 139.1304 127.9264 176.2319 105.3512 Q 231.8841 82.7759 352.4638 67.7258 Q 454.4928 60.2007 640 52.6756" fill="none" stroke="var(--primary-border)" stroke-width="2.2575" />
  <line x1="74.2029" y1="51.1705" x2="649.2754" y2="51.1705" stroke="var(--ok-border)" stroke-width="1.1288" stroke-dasharray="4.5151 2.2575" />
  <text x="658.5507" y="54.1806" font-size="10" fill="var(--ok-accent)">Full FT</text>
  <text x="389.5652" y="79.0134" font-size="10" fill="var(--danger-accent)" font-style="italic">Diminishing returns</text>
  <path d="M 380.2898 81.2709 L 315.3623 79.0134" fill="none" stroke="var(--danger-border)" stroke-width="0.7525" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="9.2754" y="203.1773" width="329.2754" height="180.602" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="173.4493" y="221.9899" text-anchor="middle" font-size="10.5351" font-weight="bold" fill="var(--text)">Rank Selection Guidelines</text>
  <text x="27.8261" y="240.8027" font-size="10" fill="var(--text)">r=4:   Simple tasks (classification, sentiment)</text>
  <text x="27.8261" y="259.6154" font-size="10" fill="var(--text)">r=8:   Standard tasks (Q&amp;A, summarization)</text>
  <text x="27.8261" y="278.4281" font-size="10" fill="var(--text)">r=16:  Complex tasks (code gen, reasoning)</text>
  <text x="27.8261" y="297.2408" font-size="10" fill="var(--text)">r=32:  Near-full-FT quality needed</text>
  <text x="27.8261" y="316.0535" font-size="10" fill="var(--text)">r=64+: Usually not worth it (use full FT)</text>
  <rect x="357.1015" y="203.1773" width="329.2754" height="180.602" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="521.2754" y="221.9899" text-anchor="middle" font-size="10.5351" font-weight="bold" fill="var(--text)">Memory Impact (7B model)</text>
  <text x="375.6522" y="244.5652" font-size="10" fill="var(--text)">r=8:    ~40 MB additional parameters</text>
  <text x="375.6522" y="267.1405" font-size="10" fill="var(--text)">r=16:   ~80 MB</text>
  <text x="375.6522" y="289.7157" font-size="10" fill="var(--text)">r=32:   ~160 MB</text>
  <text x="375.6522" y="312.291" font-size="10" fill="var(--text)">r=64:   ~320 MB</text>
</svg>
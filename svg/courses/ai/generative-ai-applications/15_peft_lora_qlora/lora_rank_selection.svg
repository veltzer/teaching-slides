<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 520" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="730" height="250" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="375" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">LoRA Rank Selection</text>
  <!-- Axes -->
  <line x1="80" y1="220" x2="700" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="220" x2="80" y2="60" stroke="#333" stroke-width="2"/>
  <text x="60" y="140" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90,60,140)">Quality</text>
  <text x="390" y="245" text-anchor="middle" font-size="12" fill="#333">Rank (r)</text>
  <!-- Rank labels -->
  <text x="110" y="238" text-anchor="middle" font-size="10" fill="#666">4</text>
  <text x="190" y="238" text-anchor="middle" font-size="10" fill="#666">8</text>
  <text x="280" y="238" text-anchor="middle" font-size="10" fill="#666">16</text>
  <text x="380" y="238" text-anchor="middle" font-size="10" fill="#666">32</text>
  <text x="490" y="238" text-anchor="middle" font-size="10" fill="#666">64</text>
  <text x="610" y="238" text-anchor="middle" font-size="10" fill="#666">128</text>
  <text x="690" y="238" text-anchor="middle" font-size="10" fill="#666">256</text>
  <!-- Curve -->
  <path d="M80,210 Q150,170 190,140 Q250,110 380,90 Q490,80 690,70" fill="none" stroke="#4a90e2" stroke-width="3"/>
  <!-- Full FT line -->
  <line x1="80" y1="68" x2="700" y2="68" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="710" y="72" font-size="11" fill="#28a745">Full FT</text>
  <!-- Diminishing returns annotation -->
  <text x="420" y="105" font-size="11" fill="#dc3545" font-style="italic">Diminishing returns</text>
  <path d="M410,108 L340,105" fill="none" stroke="#dc3545" stroke-width="1" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#dc3545"/></marker></defs>

  <!-- Guidelines -->
  <rect x="10" y="270" width="355" height="240" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="187" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Rank Selection Guidelines</text>
  <text x="30" y="320" font-size="12" fill="#333">r=4:   Simple tasks (classification, sentiment)</text>
  <text x="30" y="345" font-size="12" fill="#333">r=8:   Standard tasks (Q&amp;A, summarization)</text>
  <text x="30" y="370" font-size="12" fill="#333">r=16:  Complex tasks (code gen, reasoning)</text>
  <text x="30" y="395" font-size="12" fill="#333">r=32:  Near-full-FT quality needed</text>
  <text x="30" y="420" font-size="12" fill="#333">r=64+: Usually not worth it (use full FT)</text>

  <!-- Memory impact -->
  <rect x="385" y="270" width="355" height="240" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="562" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Memory Impact (7B model)</text>
  <text x="405" y="325" font-size="12" fill="#333">r=8:    ~40 MB additional parameters</text>
  <text x="405" y="355" font-size="12" fill="#333">r=16:   ~80 MB</text>
  <text x="405" y="385" font-size="12" fill="#333">r=32:   ~160 MB</text>
  <text x="405" y="415" font-size="12" fill="#333">r=64:   ~320 MB</text>
</svg>
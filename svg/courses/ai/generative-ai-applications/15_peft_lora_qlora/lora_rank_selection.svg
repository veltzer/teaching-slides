  <rect x="118.3219" y="211.6183" width="272.3467" height="149.3775" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.2448" />
  <text x="254.1117" y="227.1784" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">Rank Selection Guidelines</text>
  <text x="133.6654" y="242.7386" font-size="10" fill="var(--text)">r=4:   Simple tasks (classification, sentiment)</text>
  <text x="133.6654" y="258.2988" font-size="10" fill="var(--text)">r=8:   Standard tasks (Q&amp;A, summarization)</text>
  <text x="133.6654" y="273.8589" font-size="10" fill="var(--text)">r=16:  Complex tasks (code gen, reasoning)</text>
  <text x="133.6654" y="289.4191" font-size="10" fill="var(--text)">r=32:  Near-full-FT quality needed</text>
  <text x="133.6654" y="304.9792" font-size="10" fill="var(--text)">r=64+: Usually not worth it (use full FT)</text>
  <rect x="406.012" y="211.6183" width="272.3467" height="149.3775" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.2448" />
  <text x="541.8018" y="227.1784" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">Memory Impact (7B model)</text>
  <text x="421.3554" y="245.8506" font-size="10" fill="var(--text)">r=8:    ~40 MB additional parameters</text>
  <text x="421.3554" y="264.5228" font-size="10" fill="var(--text)">r=16:   ~80 MB</text>
  <text x="421.3554" y="283.195" font-size="10" fill="var(--text)">r=32:   ~160 MB</text>
  <text x="421.3554" y="301.8672" font-size="10" fill="var(--text)">r=64:   ~320 MB</text>

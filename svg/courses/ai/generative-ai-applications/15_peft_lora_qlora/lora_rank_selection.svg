<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="290.0001" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9998" y="74.8" text-anchor="middle" font-size="19.9836" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">LoRA Rank Selection</text>
  <line x1="155.0684" y1="283.6" x2="1174.2465" y2="283.6" stroke="var(--text)" stroke-width="0.583" />
  <line x1="155.0684" y1="283.6" x2="155.0684" y2="98.0001" stroke="var(--text)" stroke-width="0.583" />
  <text x="122.1916" y="190.8001" text-anchor="middle" font-size="19.9836" fill="var(--text)" transform="rotate(-90,60,140)" font-family="Arial, sans-serif">Quality</text>
  <text x="664.6573" y="312.6001" text-anchor="middle" font-size="19.9836" fill="var(--text)" font-family="Arial, sans-serif">Rank (r)</text>
  <text x="204.3836" y="304.4802" text-anchor="middle" font-size="19.9836" fill="var(--text-muted)" font-family="Arial, sans-serif">4</text>
  <text x="335.8903" y="304.4802" text-anchor="middle" font-size="19.9836" fill="var(--text-muted)" font-family="Arial, sans-serif">8</text>
  <text x="483.8356" y="304.4802" text-anchor="middle" font-size="19.9836" fill="var(--text-muted)" font-family="Arial, sans-serif">16</text>
  <text x="648.219" y="304.4802" text-anchor="middle" font-size="19.9836" fill="var(--text-muted)" font-family="Arial, sans-serif">32</text>
  <text x="829.0409" y="304.4802" text-anchor="middle" font-size="19.9836" fill="var(--text-muted)" font-family="Arial, sans-serif">64</text>
  <text x="1026.3013" y="304.4802" text-anchor="middle" font-size="19.9836" fill="var(--text-muted)" font-family="Arial, sans-serif">128</text>
  <text x="1157.8082" y="304.4802" text-anchor="middle" font-size="19.9836" fill="var(--text-muted)" font-family="Arial, sans-serif">256</text>
  <path d="M 155.0684 272 Q 270.1369 225.5999 335.8903 190.8001 Q 434.5204 155.9999 648.219 132.8001 Q 829.0409 121.2001 1157.8082 109.6" fill="none" stroke="var(--primary-border)" stroke-width="0.8745" />
  <line x1="155.0684" y1="107.28" x2="1174.2465" y2="107.28" stroke="var(--ok-border)" stroke-width="0.4373" stroke-dasharray="1.7491 0.8745" />
  <text x="1190.6847" y="111.92" font-size="19.9836" fill="var(--ok-accent)" font-family="Arial, sans-serif">Full FT</text>
  <text x="713.9726" y="150.2001" font-size="19.9836" fill="var(--danger-accent)" font-style="italic" font-family="Arial, sans-serif">Diminishing returns</text>
  <path d="M 697.5341 153.6803 L 582.4657 150.2001" fill="none" stroke="var(--danger-border)" stroke-width="0.2915" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="341.6002" width="583.5617" height="278.3998" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.959" y="370.6" text-anchor="middle" font-size="19.9836" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Rank Selection Guidelines</text>
  <text x="72.8768" y="399.6001" font-size="19.9836" fill="var(--text)" font-family="Arial, sans-serif">r=4:   Simple tasks (classification, sentiment)</text>
  <text x="72.8768" y="428.6002" font-size="19.9836" fill="var(--text)" font-family="Arial, sans-serif">r=8:   Standard tasks (Q&amp;A, summarization)</text>
  <text x="72.8768" y="457.6" font-size="19.9836" fill="var(--text)" font-family="Arial, sans-serif">r=16:  Complex tasks (code gen, reasoning)</text>
  <text x="72.8768" y="486.6001" font-size="19.9836" fill="var(--text)" font-family="Arial, sans-serif">r=32:  Near-full-FT quality needed</text>
  <text x="72.8768" y="515.6" font-size="19.9836" fill="var(--text)" font-family="Arial, sans-serif">r=64+: Usually not worth it (use full FT)</text>
  <rect x="656.4383" y="341.6002" width="583.5617" height="278.3998" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="947.3973" y="370.6" text-anchor="middle" font-size="19.9836" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory Impact (7B model)</text>
  <text x="689.3148" y="405.4" font-size="19.9836" fill="var(--text)" font-family="Arial, sans-serif">r=8:    ~40 MB additional parameters</text>
  <text x="689.3148" y="440.2" font-size="19.9836" fill="var(--text)" font-family="Arial, sans-serif">r=16:   ~80 MB</text>
  <text x="689.3148" y="475" font-size="19.9836" fill="var(--text)" font-family="Arial, sans-serif">r=32:   ~160 MB</text>
  <text x="689.3148" y="509.8001" font-size="19.9836" fill="var(--text)" font-family="Arial, sans-serif">r=64:   ~320 MB</text>
</svg>
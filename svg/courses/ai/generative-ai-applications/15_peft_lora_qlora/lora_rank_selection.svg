  <text x="319.1467" y="408.4615" text-anchor="middle" font-size="19.3846" font-weight="bold" fill="#333">Rank Selection Guidelines</text>
  <text x="51.2" y="443.0769" font-size="16.6154" fill="#333">r=4:   Simple tasks (classification, sentiment)</text>
  <text x="51.2" y="477.6923" font-size="16.6154" fill="#333">r=8:   Standard tasks (Q&amp;A, summarization)</text>
  <text x="51.2" y="512.3077" font-size="16.6154" fill="#333">r=16:  Complex tasks (code gen, reasoning)</text>
  <text x="51.2" y="546.9231" font-size="16.6154" fill="#333">r=32:  Near-full-FT quality needed</text>
  <text x="51.2" y="581.5385" font-size="16.6154" fill="#333">r=64+: Usually not worth it (use full FT)</text>
  <rect x="657.0667" y="373.8462" width="605.8667" height="332.3077" rx="6.9231" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7692" />

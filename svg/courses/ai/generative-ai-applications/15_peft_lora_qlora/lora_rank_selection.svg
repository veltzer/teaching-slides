<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="190.1037" y="80" width="899.7926" height="250" rx="7.9733" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="109.9999" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">LoRA Rank Selection</text>
  <line x1="276.3851" y1="289.9999" x2="1040.5925" y2="289.9999" stroke="var(--text)" stroke-width="1.505" />
  <line x1="276.3851" y1="289.9999" x2="276.3851" y2="130" stroke="var(--text)" stroke-width="1.505" />
  <text x="251.7333" y="210" text-anchor="middle" font-size="13.2889" fill="var(--text)" transform="rotate(-90,60,140)">Quality</text>
  <text x="658.4888" y="315" text-anchor="middle" font-size="13.2889" fill="var(--text)">Rank (r)</text>
  <text x="313.3629" y="308" text-anchor="middle" font-size="13.2889" fill="var(--text-muted)">4</text>
  <text x="411.9703" y="308" text-anchor="middle" font-size="13.2889" fill="var(--text-muted)">8</text>
  <text x="522.9037" y="308" text-anchor="middle" font-size="13.2889" fill="var(--text-muted)">16</text>
  <text x="646.1629" y="308" text-anchor="middle" font-size="13.2889" fill="var(--text-muted)">32</text>
  <text x="781.7481" y="308" text-anchor="middle" font-size="13.2889" fill="var(--text-muted)">64</text>
  <text x="929.6592" y="308" text-anchor="middle" font-size="13.2889" fill="var(--text-muted)">128</text>
  <text x="1028.2666" y="308" text-anchor="middle" font-size="13.2889" fill="var(--text-muted)">256</text>
  <path d="M 276.3851 279.9999 Q 362.6666 239.9999 411.9703 210 Q 485.9259 179.9999 646.1629 160 Q 781.7481 150 1028.2666 140" fill="none" stroke="var(--primary-border)" stroke-width="2.2575" />
  <line x1="276.3851" y1="137.9999" x2="1040.5925" y2="137.9999" stroke="var(--ok-border)" stroke-width="1.1288" stroke-dasharray="4.5151 2.2575" />
  <text x="1052.9184" y="142" font-size="13.2889" fill="var(--ok-accent)">Full FT</text>
  <text x="695.4666" y="175" font-size="13.2889" fill="var(--danger-accent)" font-style="italic">Diminishing returns</text>
  <path d="M 683.1406 178 L 596.8592 175" fill="none" stroke="var(--danger-border)" stroke-width="0.7525" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="190.1037" y="340" width="437.5704" height="240" rx="7.9733" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="408.2726" y="364.9999" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--text)">Rank Selection Guidelines</text>
  <text x="214.7555" y="390" font-size="13.2889" fill="var(--text)">r=4:   Simple tasks (classification, sentiment)</text>
  <text x="214.7555" y="415" font-size="13.2889" fill="var(--text)">r=8:   Standard tasks (Q&amp;A, summarization)</text>
  <text x="214.7555" y="440" font-size="13.2889" fill="var(--text)">r=16:  Complex tasks (code gen, reasoning)</text>
  <text x="214.7555" y="465" font-size="13.2889" fill="var(--text)">r=32:  Near-full-FT quality needed</text>
  <text x="214.7555" y="489.9999" font-size="13.2889" fill="var(--text)">r=64+: Usually not worth it (use full FT)</text>
  <rect x="652.3259" y="340" width="437.5704" height="240" rx="7.9733" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="870.4948" y="364.9999" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--text)">Memory Impact (7B model)</text>
  <text x="676.9777" y="394.9999" font-size="13.2889" fill="var(--text)">r=8:    ~40 MB additional parameters</text>
  <text x="676.9777" y="425" font-size="13.2889" fill="var(--text)">r=16:   ~80 MB</text>
  <text x="676.9777" y="454.9999" font-size="13.2889" fill="var(--text)">r=32:   ~160 MB</text>
  <text x="676.9777" y="485" font-size="13.2889" fill="var(--text)">r=64:   ~320 MB</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,15 5.9733,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="580.9929" y="34.0426" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7872" font-weight="bold" fill="var(--text)">LoRA: How It Works During Forward Pass</text>
  <rect x="464.7943" y="61.2766" width="232.3972" height="47.6596" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.9929" y="91.234" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7021" font-weight="bold" fill="var(--text)">Input x</text>
  <line x1="580.9929" y1="108.9362" x2="580.9929" y2="149.7872" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="580.9929" y1="149.7872" x2="309.8629" y2="149.7872" stroke="var(--primary-border)" stroke-width="1.3617" />
  <line x1="580.9929" y1="149.7872" x2="852.123" y2="149.7872" stroke="var(--ok-border)" stroke-width="1.3617" />
  <line x1="309.8629" y1="149.7872" x2="309.8629" y2="190.6383" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="852.123" y1="149.7872" x2="852.123" y2="190.6383" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowGreen)" />
  <rect x="185.9177" y="190.6383" width="247.8903" height="136.1702" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="309.8629" y="224.6809" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.3404" font-weight="bold" fill="var(--danger-accent)">Original Weight W</text>
  <text x="309.8629" y="251.9149" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9787" fill="var(--text-muted)">(frozen)</text>
  <text x="309.8629" y="285.9574" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.3404" fill="var(--text)">W * x</text>
  <text x="309.8629" y="310.4681" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.617" fill="var(--text-faint)">No gradients computed</text>
  <rect x="728.1777" y="190.6383" width="247.8903" height="272.3404" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="852.123" y="224.6809" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.3404" font-weight="bold" fill="var(--ok-accent)">LoRA Path</text>
  <rect x="774.6572" y="245.1064" width="154.9315" height="54.4681" rx="6" fill="var(--bg)" stroke="var(--ok-border)" />
  <text x="852.123" y="269.617" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9787" font-weight="bold" fill="var(--text)">A</text>
  <text x="852.123" y="290.0426" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.617" fill="var(--text-muted)">d -&gt; r</text>
  <line x1="852.123" y1="299.5745" x2="852.123" y2="333.617" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowGreen)" />
  <rect x="774.6572" y="333.617" width="154.9315" height="54.4681" rx="6" fill="var(--bg)" stroke="var(--ok-border)" />
  <text x="852.123" y="358.1277" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9787" font-weight="bold" fill="var(--text)">B</text>
  <text x="852.123" y="378.5532" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.617" fill="var(--text-muted)">r -&gt; d</text>
  <text x="852.123" y="442.5532" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9787" fill="var(--ok-accent)">= B * A * x</text>
  <line x1="309.8629" y1="326.8085" x2="309.8629" y2="517.4468" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="852.123" y1="462.9787" x2="852.123" y2="517.4468" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="309.8629" y1="517.4468" x2="542.26" y2="517.4468" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="852.123" y1="517.4468" x2="619.7258" y2="517.4468" stroke="var(--ok-border)" stroke-width="2" />
  <circle cx="580.9929" cy="517.4468" r="24.5106" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.7234" />
  <text x="580.9929" y="524.2553" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7872" font-weight="bold" fill="var(--text)">+</text>
  <line x1="580.9929" y1="541.9574" x2="580.9929" y2="585.5319" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="278.8766" y="585.5319" width="604.2326" height="54.4681" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.9929" y="619.5745" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7021" font-weight="bold" fill="var(--text)">Output: W*x + B*A*x = (W + BA)*x</text>
</svg>
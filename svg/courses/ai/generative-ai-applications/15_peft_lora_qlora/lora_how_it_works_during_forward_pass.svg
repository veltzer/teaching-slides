<svg viewBox="0 0 750 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="375" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">LoRA: How It Works During Forward Pass</text>

  <!-- Input -->
  <rect x="300" y="45" width="150" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="375" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Input x</text>

  <!-- Split arrow -->
  <line x1="375" y1="80" x2="375" y2="110" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="375" y1="110" x2="200" y2="110" stroke="#4a90e2" stroke-width="1"/>
  <line x1="375" y1="110" x2="550" y2="110" stroke="#28a745" stroke-width="1"/>
  <line x1="200" y1="110" x2="200" y2="140" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="110" x2="550" y2="140" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Original Weight path -->
  <rect x="120" y="140" width="160" height="100" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc3545">Original Weight W</text>
  <text x="200" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">(frozen)</text>
  <text x="200" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">W * x</text>
  <text x="200" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">No gradients computed</text>

  <!-- LoRA path -->
  <rect x="470" y="140" width="160" height="200" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="550" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#28a745">LoRA Path</text>

  <!-- Matrix A (down-project) -->
  <rect x="500" y="180" width="100" height="40" rx="3" fill="#fff" stroke="#28a745"/>
  <text x="550" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">A</text>
  <text x="550" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">d -&gt; r</text>
  <line x1="550" y1="220" x2="550" y2="245" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Matrix B (up-project) -->
  <rect x="500" y="245" width="100" height="40" rx="3" fill="#fff" stroke="#28a745"/>
  <text x="550" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">B</text>
  <text x="550" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">r -&gt; d</text>

  <text x="550" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">= B * A * x</text>

  <!-- Arrows to addition -->
  <line x1="200" y1="240" x2="200" y2="380" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="550" y1="340" x2="550" y2="380" stroke="#28a745" stroke-width="1.5"/>
  <line x1="200" y1="380" x2="350" y2="380" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="550" y1="380" x2="400" y2="380" stroke="#28a745" stroke-width="1.5"/>

  <!-- Addition circle -->
  <circle cx="375" cy="380" r="18" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="375" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">+</text>

  <!-- Arrow to output -->
  <line x1="375" y1="398" x2="375" y2="430" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="180" y="430" width="390" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="375" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Output: W*x + B*A*x = (W + BA)*x</text>
</svg>
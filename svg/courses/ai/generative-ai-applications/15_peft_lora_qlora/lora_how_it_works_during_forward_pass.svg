<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Input x on left -->
  <rect x="40" y="280" width="200" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="325" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Input x</text>
  <text x="140" y="355" text-anchor="middle" font-size="14" fill="var(--primary-text)" font-family="Arial, sans-serif">hidden state</text>

  <!-- split into two paths -->
  <line x1="240" y1="330" x2="280" y2="330" stroke="var(--text)" stroke-width="2"/>
  <line x1="280" y1="330" x2="280" y2="170" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="280" y1="330" x2="280" y2="490" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="280" y1="170" x2="340" y2="170" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="280" y1="490" x2="340" y2="490" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <!-- Frozen weight W (top) -->
  <rect x="350" y="40" width="500" height="260" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="90" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Original Weight W</text>
  <text x="600" y="125" text-anchor="middle" font-size="16" fill="var(--danger-text)" font-family="Arial, sans-serif">(frozen — no gradients)</text>
  <rect x="380" y="155" width="440" height="120" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="600" y="205" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">W · x</text>
  <text x="600" y="250" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">full-size matrix, untouched</text>

  <!-- LoRA path (bottom) -->
  <rect x="350" y="360" width="500" height="260" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="410" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">LoRA Path (trainable)</text>
  <rect x="380" y="440" width="180" height="120" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="470" y="485" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A</text>
  <text x="470" y="515" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">d → r</text>
  <text x="470" y="545" text-anchor="middle" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">rank r ≪ d</text>
  <line x1="560" y1="500" x2="620" y2="500" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="640" y="440" width="180" height="120" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="730" y="485" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">B</text>
  <text x="730" y="515" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">r → d</text>
  <text x="730" y="545" text-anchor="middle" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">small parameter count</text>
  <text x="600" y="600" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">= B · A · x</text>

  <!-- Merge arrows to sum -->
  <line x1="850" y1="170" x2="990" y2="170" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="990" y1="170" x2="990" y2="310" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="850" y1="490" x2="990" y2="490" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="990" y1="490" x2="990" y2="350" stroke="var(--ok-border)" stroke-width="2"/>

  <!-- Sum node -->
  <rect x="954" y="294" width="72" height="72" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="342" text-anchor="middle" font-size="40" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">+</text>

  <!-- Output -->
  <line x1="1026" y1="330" x2="1080" y2="330" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1080" y="260" width="160" height="140" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="310" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Output</text>
  <text x="1160" y="345" text-anchor="middle" font-size="16" fill="var(--primary-text)" font-family="Arial, sans-serif">W·x + BA·x</text>
  <text x="1160" y="375" text-anchor="middle" font-size="14" fill="var(--primary-text)" font-family="Arial, sans-serif">= (W + BA)·x</text>
</svg>

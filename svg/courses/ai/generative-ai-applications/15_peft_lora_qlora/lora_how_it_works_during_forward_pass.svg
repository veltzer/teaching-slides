<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,15 5.9733,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8539" font-weight="bold" fill="var(--text)">LoRA: How It Works During Forward Pass</text>
  <rect x="528.779" y="66.0674" width="222.442" height="45.618" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="94.7415" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9438" font-weight="bold" fill="var(--text)">Input x</text>
  <line x1="640" y1="111.6854" x2="640" y2="150.7864" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="640" y1="150.7864" x2="380.4844" y2="150.7864" stroke="var(--primary-border)" stroke-width="1.3617" />
  <line x1="640" y1="150.7864" x2="899.5157" y2="150.7864" stroke="var(--ok-border)" stroke-width="1.3617" />
  <line x1="380.4844" y1="150.7864" x2="380.4844" y2="189.8876" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="899.5157" y1="150.7864" x2="899.5157" y2="189.8876" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowGreen)" />
  <rect x="261.8487" y="189.8876" width="237.2714" height="130.3371" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="380.4844" y="222.4719" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6404" font-weight="bold" fill="var(--danger-accent)">Original Weight W</text>
  <text x="380.4844" y="248.5393" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.3371" fill="var(--text-muted)">(frozen)</text>
  <text x="380.4844" y="281.1235" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6404" fill="var(--text)">W * x</text>
  <text x="380.4844" y="304.5843" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0337" fill="var(--text-faint)">No gradients computed</text>
  <rect x="780.8799" y="189.8876" width="237.2714" height="260.6742" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="899.5157" y="222.4719" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6404" font-weight="bold" fill="var(--ok-accent)">LoRA Path</text>
  <rect x="825.3683" y="242.0225" width="148.2947" height="52.1348" rx="6" fill="var(--bg)" stroke="var(--ok-border)" />
  <text x="899.5157" y="265.4831" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.3371" font-weight="bold" fill="var(--text)">A</text>
  <text x="899.5157" y="285.0337" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0337" fill="var(--text-muted)">d -&gt; r</text>
  <line x1="899.5157" y1="294.1573" x2="899.5157" y2="326.7415" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowGreen)" />
  <rect x="825.3683" y="326.7415" width="148.2947" height="52.1348" rx="6" fill="var(--bg)" stroke="var(--ok-border)" />
  <text x="899.5157" y="350.2023" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.3371" font-weight="bold" fill="var(--text)">B</text>
  <text x="899.5157" y="369.7528" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0337" fill="var(--text-muted)">r -&gt; d</text>
  <text x="899.5157" y="431.0112" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.3371" fill="var(--ok-accent)">= B * A * x</text>
  <line x1="380.4844" y1="320.2247" x2="380.4844" y2="502.6966" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="899.5157" y1="450.5618" x2="899.5157" y2="502.6966" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="380.4844" y1="502.6966" x2="602.9263" y2="502.6966" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="899.5157" y1="502.6966" x2="677.0737" y2="502.6966" stroke="var(--ok-border)" stroke-width="2" />
  <circle cx="640" cy="502.6966" r="23.4606" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.7234" />
  <text x="640" y="509.2135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8539" font-weight="bold" fill="var(--text)">+</text>
  <line x1="640" y1="526.1573" x2="640" y2="567.8652" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="350.8255" y="567.8652" width="578.3491" height="52.1348" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="600.4495" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9438" font-weight="bold" fill="var(--text)">Output: W*x + B*A*x = (W + BA)*x</text>
</svg>
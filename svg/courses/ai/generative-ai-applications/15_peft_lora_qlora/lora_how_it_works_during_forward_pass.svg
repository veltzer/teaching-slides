<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>

  <!-- Input x on left -->
  <rect x="40" y="280" width="200" height="100" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="140" y="325" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)">Input x</text>
  <text x="140" y="355" text-anchor="middle" font-size="14" fill="var(--primary-text)">hidden state</text>

  <!-- split into two paths -->
  <line x1="240" y1="330" x2="280" y2="330" stroke="var(--text)" stroke-width="2"/>
  <line x1="280" y1="330" x2="280" y2="170" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="280" y1="330" x2="280" y2="490" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="280" y1="170" x2="340" y2="170" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="280" y1="490" x2="340" y2="490" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <!-- Frozen weight W (top) -->
  <rect x="350" y="40" width="500" height="260" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="600" y="90" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--danger-text)">Original Weight W</text>
  <text x="600" y="125" text-anchor="middle" font-size="16" fill="var(--danger-text)">(frozen — no gradients)</text>
  <rect x="380" y="155" width="440" height="120" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="600" y="205" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--text)">W · x</text>
  <text x="600" y="250" text-anchor="middle" font-size="16" fill="var(--text-muted)">full-size matrix, untouched</text>

  <!-- LoRA path (bottom) -->
  <rect x="350" y="360" width="500" height="260" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="600" y="410" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--ok-text)">LoRA Path (trainable)</text>
  <rect x="380" y="440" width="180" height="120" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="470" y="485" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)">A</text>
  <text x="470" y="515" text-anchor="middle" font-size="16" fill="var(--text-muted)">d → r</text>
  <text x="470" y="545" text-anchor="middle" font-size="13" fill="var(--text-faint)">rank r ≪ d</text>
  <line x1="560" y1="500" x2="620" y2="500" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="640" y="440" width="180" height="120" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="730" y="485" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)">B</text>
  <text x="730" y="515" text-anchor="middle" font-size="16" fill="var(--text-muted)">r → d</text>
  <text x="730" y="545" text-anchor="middle" font-size="13" fill="var(--text-faint)">small parameter count</text>
  <text x="600" y="600" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-text)">= B · A · x</text>

  <!-- Merge arrows to sum -->
  <line x1="850" y1="170" x2="990" y2="170" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="990" y1="170" x2="990" y2="310" stroke="var(--danger-border)" stroke-width="2"/>
  <line x1="850" y1="490" x2="990" y2="490" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="990" y1="490" x2="990" y2="350" stroke="var(--ok-border)" stroke-width="2"/>

  <!-- Sum node -->
  <rect x="954" y="294" width="72" height="72" rx="14" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="990" y="342" text-anchor="middle" font-size="40" font-weight="bold" fill="var(--warn-text)">+</text>

  <!-- Output -->
  <line x1="1026" y1="330" x2="1080" y2="330" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1080" y="260" width="160" height="140" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1160" y="310" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-text)">Output</text>
  <text x="1160" y="345" text-anchor="middle" font-size="16" fill="var(--primary-text)">W·x + BA·x</text>
  <text x="1160" y="375" text-anchor="middle" font-size="14" fill="var(--primary-text)">= (W + BA)·x</text>
</svg>

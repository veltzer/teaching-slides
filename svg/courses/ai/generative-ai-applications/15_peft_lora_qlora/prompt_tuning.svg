    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="589.9589" y="47.4074" text-anchor="middle" font-size="28.4444" font-weight="bold" fill="#333">Prompt Tuning</ns0:text>
  <ns0:rect x="32.7755" y="79.0124" width="1114.3667" height="94.8148" rx="7.9012" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1605" />
  <ns0:text x="65.551" y="118.5185" font-size="20.5432" font-weight="bold" fill="#333">Standard Prompting:</ns0:text>
  <ns0:text x="65.551" y="150.1234" font-size="18.9629" fill="#555">Input: [system prompt tokens] + [user tokens] -- All tokens from vocabulary</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="589.9589" y="47.4074" text-anchor="middle" font-size="28.4444" font-weight="bold" fill="var(--text)">Prompt Tuning</text>
  <rect x="32.7755" y="79.0124" width="1114.3667" height="94.8148" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="65.551" y="118.5185" font-size="20.5432" font-weight="bold" fill="var(--text)">Standard Prompting:</text>
  <text x="65.551" y="150.1234" font-size="18.9629" fill="var(--text-muted)">Input: [system prompt tokens] + [user tokens] -- All tokens from vocabulary</text>
  <rect x="32.7755" y="197.5309" width="1114.3667" height="94.8148" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="65.551" y="237.0371" font-size="20.5432" font-weight="bold" fill="var(--text)">Prompt Tuning:</text>
  <text x="65.551" y="268.642" font-size="18.9629" fill="var(--text-muted)">Input: [LEARNED VIRTUAL TOKENS] + [user tokens] -- Virtual tokens are continuous vectors, not from vocab</text>
  <rect x="32.7755" y="323.9507" width="1114.3667" height="316.0493" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="81.9387" y="363.4568" width="81.9387" height="55.3086" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="122.9081" y="398.2222" text-anchor="middle" font-size="17.3827" fill="var(--text)">v1</text>
  <rect x="180.2652" y="363.4568" width="81.9387" height="55.3086" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="221.2346" y="398.2222" text-anchor="middle" font-size="17.3827" fill="var(--text)">v2</text>
  <rect x="278.5917" y="363.4568" width="81.9387" height="55.3086" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="319.5611" y="398.2222" text-anchor="middle" font-size="17.3827" fill="var(--text)">v3</text>
  <text x="393.3059" y="398.2222" font-size="22.1235" fill="var(--text)">...</text>
  <rect x="434.2753" y="363.4568" width="81.9387" height="55.3086" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="475.2447" y="398.2222" text-anchor="middle" font-size="17.3827" fill="var(--text)">v20</text>
  <rect x="557.1833" y="363.4568" width="557.1833" height="55.3086" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="835.7751" y="398.2222" text-anchor="middle" font-size="18.9629" fill="var(--text)">"Classify this: ..."</text>
  <line x1="122.9081" y1="426.6666" x2="122.9081" y2="458.2717" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="221.2346" y1="426.6666" x2="221.2346" y2="458.2717" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="319.5611" y1="426.6666" x2="319.5611" y2="458.2717" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="475.2447" y1="426.6666" x2="475.2447" y2="458.2717" stroke="var(--ok-border)" stroke-width="2" />
  <text x="81.9387" y="489.8766" font-size="18.9629" font-weight="bold" fill="var(--ok-accent)">Trainable soft prompt tokens</text>
  <text x="81.9387" y="521.4815" font-size="17.3827" fill="var(--text-muted)">(20 x d_model)</text>
  <text x="622.7344" y="489.8766" font-size="18.9629" font-weight="bold" fill="var(--primary-accent)">Frozen model processes</text>
  <text x="622.7344" y="521.4815" font-size="17.3827" fill="var(--text-muted)">everything normally</text>
  <text x="589.9589" y="608.3951" text-anchor="middle" font-size="18.9629" fill="var(--text)">Only virtual token vectors are trained (entire model frozen)</text>
</svg>
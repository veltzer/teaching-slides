<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="29.2018" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Prompt Tuning</text>
  <rect x="40" y="70.9334" width="1200" height="92.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="109.6" font-size="21.0902" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Standard Prompting:</text>
  <text x="75.2941" y="140.5333" font-size="19.4678" fill="var(--text-muted)" font-family="Arial, sans-serif">Input: [system prompt tokens] + [user tokens] -- All tokens from vocabulary</text>
  <rect x="40" y="186.9334" width="1200" height="92.8" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="225.6001" font-size="21.0902" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Prompt Tuning:</text>
  <text x="75.2941" y="256.5334" font-size="19.4678" fill="var(--text-muted)" font-family="Arial, sans-serif">Input: [LEARNED VIRTUAL TOKENS] + [user tokens] -- Virtual tokens are continuous vectors, not from vocab</text>
  <rect x="40" y="310.6668" width="1200" height="309.3332" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="92.9411" y="349.3333" width="88.2353" height="54.1333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.0588" y="383.36" text-anchor="middle" font-size="17.8455" fill="var(--text)" font-family="Arial, sans-serif">v1</text>
  <rect x="198.8235" y="349.3333" width="88.2353" height="54.1333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="242.9412" y="383.36" text-anchor="middle" font-size="17.8455" fill="var(--text)" font-family="Arial, sans-serif">v2</text>
  <rect x="304.7059" y="349.3333" width="88.2353" height="54.1333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="348.8236" y="383.36" text-anchor="middle" font-size="17.8455" fill="var(--text)" font-family="Arial, sans-serif">v3</text>
  <text x="428.2353" y="383.36" font-size="22.7126" fill="var(--text)" font-family="Arial, sans-serif">...</text>
  <rect x="472.353" y="349.3333" width="88.2353" height="54.1333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="516.4707" y="383.36" text-anchor="middle" font-size="17.8455" fill="var(--text)" font-family="Arial, sans-serif">v20</text>
  <rect x="604.7058" y="349.3333" width="599.9999" height="54.1333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="904.706" y="383.36" text-anchor="middle" font-size="19.4678" fill="var(--text)" font-family="Arial, sans-serif">"Classify this: ..."</text>
  <line x1="137.0588" y1="411.1999" x2="137.0588" y2="442.1334" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="242.9412" y1="411.1999" x2="242.9412" y2="442.1334" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="348.8236" y1="411.1999" x2="348.8236" y2="442.1334" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="516.4707" y1="411.1999" x2="516.4707" y2="442.1334" stroke="var(--ok-border)" stroke-width="2" />
  <text x="92.9411" y="473.0667" font-size="19.4678" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Trainable soft prompt tokens</text>
  <text x="92.9411" y="504" font-size="17.8455" fill="var(--text-muted)" font-family="Arial, sans-serif">(20 x d_model)</text>
  <text x="675.2942" y="473.0667" font-size="19.4678" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Frozen model processes</text>
  <text x="675.2942" y="504" font-size="17.8455" fill="var(--text-muted)" font-family="Arial, sans-serif">everything normally</text>
  <text x="640.0001" y="589.0667" text-anchor="middle" font-size="19.4678" fill="var(--text)" font-family="Arial, sans-serif">Only virtual token vectors are trained (entire model frozen)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="29.2018" font-weight="bold" fill="var(--text)">Prompt Tuning</text>
  <rect x="40" y="70.9334" width="1200" height="92.8" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="109.6" font-size="21.0902" font-weight="bold" fill="var(--text)">Standard Prompting:</text>
  <text x="75.2941" y="140.5333" font-size="19.4678" fill="var(--text-muted)">Input: [system prompt tokens] + [user tokens] -- All tokens from vocabulary</text>
  <rect x="40" y="186.9334" width="1200" height="92.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="225.6001" font-size="21.0902" font-weight="bold" fill="var(--text)">Prompt Tuning:</text>
  <text x="75.2941" y="256.5334" font-size="19.4678" fill="var(--text-muted)">Input: [LEARNED VIRTUAL TOKENS] + [user tokens] -- Virtual tokens are continuous vectors, not from vocab</text>
  <rect x="40" y="310.6668" width="1200" height="309.3332" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="92.9411" y="349.3333" width="88.2353" height="54.1333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.0588" y="383.36" text-anchor="middle" font-size="17.8455" fill="var(--text)">v1</text>
  <rect x="198.8235" y="349.3333" width="88.2353" height="54.1333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="242.9412" y="383.36" text-anchor="middle" font-size="17.8455" fill="var(--text)">v2</text>
  <rect x="304.7059" y="349.3333" width="88.2353" height="54.1333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="348.8236" y="383.36" text-anchor="middle" font-size="17.8455" fill="var(--text)">v3</text>
  <text x="428.2353" y="383.36" font-size="22.7126" fill="var(--text)">...</text>
  <rect x="472.353" y="349.3333" width="88.2353" height="54.1333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="516.4707" y="383.36" text-anchor="middle" font-size="17.8455" fill="var(--text)">v20</text>
  <rect x="604.7058" y="349.3333" width="599.9999" height="54.1333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="904.706" y="383.36" text-anchor="middle" font-size="19.4678" fill="var(--text)">"Classify this: ..."</text>
  <line x1="137.0588" y1="411.1999" x2="137.0588" y2="442.1334" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="242.9412" y1="411.1999" x2="242.9412" y2="442.1334" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="348.8236" y1="411.1999" x2="348.8236" y2="442.1334" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="516.4707" y1="411.1999" x2="516.4707" y2="442.1334" stroke="var(--ok-border)" stroke-width="2" />
  <text x="92.9411" y="473.0667" font-size="19.4678" font-weight="bold" fill="var(--ok-accent)">Trainable soft prompt tokens</text>
  <text x="92.9411" y="504" font-size="17.8455" fill="var(--text-muted)">(20 x d_model)</text>
  <text x="675.2942" y="473.0667" font-size="19.4678" font-weight="bold" fill="var(--primary-accent)">Frozen model processes</text>
  <text x="675.2942" y="504" font-size="17.8455" fill="var(--text-muted)">everything normally</text>
  <text x="640.0001" y="589.0667" text-anchor="middle" font-size="19.4678" fill="var(--text)">Only virtual token vectors are trained (entire model frozen)</text>
</svg>
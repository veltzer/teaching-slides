<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="98.028180916486" rx="6.166698762822" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="80.845004959325" font-size="21.676151707946" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Standard Prompting:</text>
  <text x="75.2941" y="113.521030053549" font-size="20.008676362479" fill="var(--text-muted)" font-family="Arial, sans-serif">Input: [system prompt tokens] + [user tokens] -- All tokens from vocabulary</text>
  <rect x="40" y="162.535226145608" width="1200" height="98.028180916486" rx="6.166698762822" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="203.380336738749" font-size="21.676151707946" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Prompt Tuning:</text>
  <text x="75.2941" y="236.056361832972" font-size="20.008676362479" fill="var(--text-muted)" font-family="Arial, sans-serif">Input: [LEARNED VIRTUAL TOKENS] + [user tokens] -- Virtual tokens are continuous vectors, not from vocab</text>
  <rect x="40" y="293.239537790133" width="1200" height="326.760462209867" rx="6.166698762822" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="92.9411" y="334.084437115643" width="88.2353" height="57.183070323345" rx="6.166698762822" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.0588" y="370.02813866296" text-anchor="middle" font-size="18.341303795325" fill="var(--text)" font-family="Arial, sans-serif">v1</text>
  <rect x="198.8235" y="334.084437115643" width="88.2353" height="57.183070323345" rx="6.166698762822" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="242.9412" y="370.02813866296" text-anchor="middle" font-size="18.341303795325" fill="var(--text)" font-family="Arial, sans-serif">v2</text>
  <rect x="304.7059" y="334.084437115643" width="88.2353" height="57.183070323345" rx="6.166698762822" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="348.8236" y="370.02813866296" text-anchor="middle" font-size="18.341303795325" fill="var(--text)" font-family="Arial, sans-serif">v3</text>
  <text x="428.2353" y="370.02813866296" font-size="23.343627053413" fill="var(--text)" font-family="Arial, sans-serif">...</text>
  <rect x="472.353" y="334.084437115643" width="88.2353" height="57.183070323345" rx="6.166698762822" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="516.4707" y="370.02813866296" text-anchor="middle" font-size="18.341303795325" fill="var(--text)" font-family="Arial, sans-serif">v20</text>
  <rect x="604.7058" y="334.084437115643" width="599.9999" height="57.183070323345" rx="6.166698762822" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="904.706" y="370.02813866296" text-anchor="middle" font-size="20.008676362479" fill="var(--text)" font-family="Arial, sans-serif">"Classify this: ..."</text>
  <line x1="137.0588" y1="399.43648730409" x2="137.0588" y2="432.112723665945" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="242.9412" y1="399.43648730409" x2="242.9412" y2="432.112723665945" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="348.8236" y1="399.43648730409" x2="348.8236" y2="432.112723665945" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="516.4707" y1="399.43648730409" x2="516.4707" y2="432.112723665945" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="92.9411" y="464.788748760169" font-size="20.008676362479" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Trainable soft prompt tokens</text>
  <text x="92.9411" y="497.464773854392" font-size="18.341303795325" fill="var(--text-muted)" font-family="Arial, sans-serif">(20 x d_model)</text>
  <text x="675.2942" y="464.788748760169" font-size="20.008676362479" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Frozen model processes</text>
  <text x="675.2942" y="497.464773854392" font-size="18.341303795325" fill="var(--text-muted)" font-family="Arial, sans-serif">everything normally</text>
  <text x="640.0001" y="587.323974905776" text-anchor="middle" font-size="20.008676362479" fill="var(--text)" font-family="Arial, sans-serif">Only virtual token vectors are trained (entire model frozen)</text>
</svg>

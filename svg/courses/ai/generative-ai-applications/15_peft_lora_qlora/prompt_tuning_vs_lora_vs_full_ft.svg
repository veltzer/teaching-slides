<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, sans-serif">
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Prompt Tuning vs LoRA vs Full FT</text>
  <!-- Header -->
  <rect x="20" y="50" width="140" height="35" rx="5" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="90" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Metric</text>
  <rect x="170" y="50" width="160" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="250" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Prompt Tuning</text>
  <rect x="340" y="50" width="160" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="420" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">LoRA</text>
  <rect x="510" y="50" width="170" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="595" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Full FT</text>
  <!-- Rows -->
  <rect x="20" y="95" width="140" height="35" rx="3" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="90" y="117" text-anchor="middle" font-size="11" fill="#333">Trainable %</text>
  <rect x="170" y="95" width="160" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="117" text-anchor="middle" font-size="11" fill="#333">0.001%</text>
  <rect x="340" y="95" width="160" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="420" y="117" text-anchor="middle" font-size="11" fill="#333">0.1-1%</text>
  <rect x="510" y="95" width="170" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="595" y="117" text-anchor="middle" font-size="11" fill="#333">100%</text>

  <rect x="20" y="135" width="140" height="35" rx="3" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="90" y="157" text-anchor="middle" font-size="11" fill="#333">Storage</text>
  <rect x="170" y="135" width="160" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="157" text-anchor="middle" font-size="11" fill="#333">~0.3 MB</text>
  <rect x="340" y="135" width="160" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="420" y="157" text-anchor="middle" font-size="11" fill="#333">~80 MB</text>
  <rect x="510" y="135" width="170" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="595" y="157" text-anchor="middle" font-size="11" fill="#333">~16 GB</text>

  <rect x="20" y="175" width="140" height="35" rx="3" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="90" y="197" text-anchor="middle" font-size="11" fill="#333">Training GPU</text>
  <rect x="170" y="175" width="160" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="197" text-anchor="middle" font-size="11" fill="#333">~8 GB</text>
  <rect x="340" y="175" width="160" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="420" y="197" text-anchor="middle" font-size="11" fill="#333">~16 GB</text>
  <rect x="510" y="175" width="170" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="595" y="197" text-anchor="middle" font-size="11" fill="#333">~60+ GB</text>

  <rect x="20" y="215" width="140" height="35" rx="3" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="90" y="237" text-anchor="middle" font-size="11" fill="#333">Quality</text>
  <rect x="170" y="215" width="160" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="237" text-anchor="middle" font-size="11" fill="#333">3/5</text>
  <rect x="340" y="215" width="160" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="420" y="237" text-anchor="middle" font-size="11" fill="#333">4/5</text>
  <rect x="510" y="215" width="170" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="595" y="237" text-anchor="middle" font-size="11" fill="#333">5/5</text>

  <rect x="20" y="255" width="140" height="35" rx="3" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="90" y="277" text-anchor="middle" font-size="11" fill="#333">Best for</text>
  <rect x="170" y="255" width="160" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="277" text-anchor="middle" font-size="11" fill="#333">Simple classif.</text>
  <rect x="340" y="255" width="160" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="420" y="277" text-anchor="middle" font-size="11" fill="#333">Most tasks</text>
  <rect x="510" y="255" width="170" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="595" y="277" text-anchor="middle" font-size="11" fill="#333">Maximum quality</text>

  <rect x="20" y="295" width="140" height="50" rx="3" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="90" y="322" text-anchor="middle" font-size="11" fill="#333">Inference overhead</text>
  <rect x="170" y="295" width="160" height="50" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="317" text-anchor="middle" font-size="11" fill="#333">+latency</text>
  <text x="250" y="335" text-anchor="middle" font-size="10" fill="#888">(soft tokens)</text>
  <rect x="340" y="295" width="160" height="50" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="420" y="317" text-anchor="middle" font-size="11" fill="#333">No extra</text>
  <text x="420" y="335" text-anchor="middle" font-size="10" fill="#888">(after merge)</text>
  <rect x="510" y="295" width="170" height="50" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="595" y="322" text-anchor="middle" font-size="11" fill="#333">No extra</text>
</svg>
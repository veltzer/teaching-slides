  <text x="1054.0845" y="117.9105" text-anchor="middle" font-size="18.8634" font-weight="bold" fill="var(--bg)">Typical Improvement</text>
  <rect x="40" y="152.5374" width="371.831" height="55.403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="225.9155" y="188.8956" text-anchor="middle" font-size="17.2915" fill="var(--text)">Classification</text>
  <rect x="445.6337" y="152.5374" width="388.7324" height="55.403" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="188.8956" text-anchor="middle" font-size="17.2915" fill="var(--text-muted)">50-200 per class</text>
  <rect x="868.169" y="152.5374" width="371.831" height="55.403" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1054.0845" y="188.8956" text-anchor="middle" font-size="17.2915" fill="var(--ok-accent)">+15-30%</text>
  <rect x="40" y="225.2538" width="371.831" height="55.403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="225.9155" y="261.612" text-anchor="middle" font-size="17.2915" fill="var(--text)">Extraction</text>
  <rect x="445.6337" y="225.2538" width="388.7324" height="55.403" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="261.612" text-anchor="middle" font-size="17.2915" fill="var(--text-muted)">100-500</text>
  <rect x="868.169" y="225.2538" width="371.831" height="55.403" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1054.0845" y="261.612" text-anchor="middle" font-size="17.2915" fill="var(--ok-accent)">+20-40%</text>
  <rect x="40" y="297.9702" width="371.831" height="55.403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="225.9155" y="334.3284" text-anchor="middle" font-size="17.2915" fill="var(--text)">Summarization</text>
  <rect x="445.6337" y="297.9702" width="388.7324" height="55.403" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="334.3284" text-anchor="middle" font-size="17.2915" fill="var(--text-muted)">200-1000</text>
  <rect x="868.169" y="297.9702" width="371.831" height="55.403" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1054.0845" y="334.3284" text-anchor="middle" font-size="17.2915" fill="var(--danger-accent)">+10-20%</text>
  <rect x="40" y="370.6865" width="371.831" height="55.403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="225.9155" y="407.0448" text-anchor="middle" font-size="17.2915" fill="var(--text)">Style transfer</text>
  <rect x="445.6337" y="370.6865" width="388.7324" height="55.403" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="407.0448" text-anchor="middle" font-size="17.2915" fill="var(--text-muted)">100-500</text>
  <rect x="868.169" y="370.6865" width="371.831" height="55.403" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1054.0845" y="407.0448" text-anchor="middle" font-size="17.2915" fill="var(--ok-accent)">+25-40%</text>
  <rect x="40" y="443.403" width="371.831" height="55.403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="225.9155" y="479.7613" text-anchor="middle" font-size="17.2915" fill="var(--text)">Code generation</text>
  <rect x="445.6337" y="443.403" width="388.7324" height="55.403" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="479.7613" text-anchor="middle" font-size="17.2915" fill="var(--text-muted)">500-2000</text>
  <rect x="868.169" y="443.403" width="371.831" height="55.403" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1054.0845" y="479.7613" text-anchor="middle" font-size="17.2915" fill="var(--danger-accent)">+10-25%</text>
  <rect x="40" y="516.1194" width="371.831" height="55.403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="225.9155" y="552.4777" text-anchor="middle" font-size="17.2915" fill="var(--text)">Custom format</text>
  <rect x="445.6337" y="516.1194" width="388.7324" height="55.403" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="552.4777" text-anchor="middle" font-size="17.2915" fill="var(--text-muted)">50-200</text>
  <rect x="868.169" y="516.1194" width="371.831" height="55.403" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1054.0845" y="552.4777" text-anchor="middle" font-size="17.2915" font-weight="bold" fill="var(--ok-accent)">+30-50%</text>
  <text x="648.4506" y="620" text-anchor="middle" font-size="17.2915" fill="var(--text-faint)">Improvements measured vs. few-shot prompting on the same base model</text>
</svg>
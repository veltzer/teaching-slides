<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="648.4506" y="40" text-anchor="middle" font-size="25.1512" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Fine-Tuning for Different Tasks</text>
  <rect x="40" y="83.2836" width="371.831" height="51.9403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.9155" y="117.9105" text-anchor="middle" font-size="18.8634" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Task</text>
  <rect x="445.6337" y="83.2836" width="388.7324" height="51.9403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="117.9105" text-anchor="middle" font-size="18.8634" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Training Examples</text>
  <rect x="868.169" y="83.2836" width="371.831" height="51.9403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.0845" y="117.9105" text-anchor="middle" font-size="18.8634" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Typical Improvement</text>
  <rect x="40" y="152.5374" width="371.831" height="55.403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.9155" y="188.8956" text-anchor="middle" font-size="17.2915" fill="var(--text)" font-family="Arial, sans-serif">Classification</text>
  <rect x="445.6337" y="152.5374" width="388.7324" height="55.403" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="188.8956" text-anchor="middle" font-size="17.2915" fill="var(--text-muted)" font-family="Arial, sans-serif">50-200 per class</text>
  <rect x="868.169" y="152.5374" width="371.831" height="55.403" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.0845" y="188.8956" text-anchor="middle" font-size="17.2915" fill="var(--ok-accent)" font-family="Arial, sans-serif">+15-30%</text>
  <rect x="40" y="225.2538" width="371.831" height="55.403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.9155" y="261.612" text-anchor="middle" font-size="17.2915" fill="var(--text)" font-family="Arial, sans-serif">Extraction</text>
  <rect x="445.6337" y="225.2538" width="388.7324" height="55.403" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="261.612" text-anchor="middle" font-size="17.2915" fill="var(--text-muted)" font-family="Arial, sans-serif">100-500</text>
  <rect x="868.169" y="225.2538" width="371.831" height="55.403" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.0845" y="261.612" text-anchor="middle" font-size="17.2915" fill="var(--ok-accent)" font-family="Arial, sans-serif">+20-40%</text>
  <rect x="40" y="297.9702" width="371.831" height="55.403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.9155" y="334.3284" text-anchor="middle" font-size="17.2915" fill="var(--text)" font-family="Arial, sans-serif">Summarization</text>
  <rect x="445.6337" y="297.9702" width="388.7324" height="55.403" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="334.3284" text-anchor="middle" font-size="17.2915" fill="var(--text-muted)" font-family="Arial, sans-serif">200-1000</text>
  <rect x="868.169" y="297.9702" width="371.831" height="55.403" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.0845" y="334.3284" text-anchor="middle" font-size="17.2915" fill="var(--danger-accent)" font-family="Arial, sans-serif">+10-20%</text>
  <rect x="40" y="370.6865" width="371.831" height="55.403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.9155" y="407.0448" text-anchor="middle" font-size="17.2915" fill="var(--text)" font-family="Arial, sans-serif">Style transfer</text>
  <rect x="445.6337" y="370.6865" width="388.7324" height="55.403" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="407.0448" text-anchor="middle" font-size="17.2915" fill="var(--text-muted)" font-family="Arial, sans-serif">100-500</text>
  <rect x="868.169" y="370.6865" width="371.831" height="55.403" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.0845" y="407.0448" text-anchor="middle" font-size="17.2915" fill="var(--ok-accent)" font-family="Arial, sans-serif">+25-40%</text>
  <rect x="40" y="443.403" width="371.831" height="55.403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.9155" y="479.7613" text-anchor="middle" font-size="17.2915" fill="var(--text)" font-family="Arial, sans-serif">Code generation</text>
  <rect x="445.6337" y="443.403" width="388.7324" height="55.403" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="479.7613" text-anchor="middle" font-size="17.2915" fill="var(--text-muted)" font-family="Arial, sans-serif">500-2000</text>
  <rect x="868.169" y="443.403" width="371.831" height="55.403" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.0845" y="479.7613" text-anchor="middle" font-size="17.2915" fill="var(--danger-accent)" font-family="Arial, sans-serif">+10-25%</text>
  <rect x="40" y="516.1194" width="371.831" height="55.403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.9155" y="552.4777" text-anchor="middle" font-size="17.2915" fill="var(--text)" font-family="Arial, sans-serif">Custom format</text>
  <rect x="445.6337" y="516.1194" width="388.7324" height="55.403" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="552.4777" text-anchor="middle" font-size="17.2915" fill="var(--text-muted)" font-family="Arial, sans-serif">50-200</text>
  <rect x="868.169" y="516.1194" width="371.831" height="55.403" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.0845" y="552.4777" text-anchor="middle" font-size="17.2915" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">+30-50%</text>
  <text x="648.4506" y="620" text-anchor="middle" font-size="17.2915" fill="var(--text-faint)" font-family="Arial, sans-serif">Improvements measured vs. few-shot prompting on the same base model</text>
</svg>
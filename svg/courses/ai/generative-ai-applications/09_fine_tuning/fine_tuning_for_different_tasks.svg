<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="592.2679" y="52.6027" text-anchor="middle" font-size="23.6907" font-weight="bold" fill="var(--text)">Fine-Tuning for Different Tasks</text>
  <rect x="59.2268" y="96.4383" width="325.7474" height="52.6027" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="222.1005" y="131.5069" text-anchor="middle" font-size="17.768" font-weight="bold" fill="var(--bg)">Task</text>
  <rect x="414.5875" y="96.4383" width="340.5541" height="52.6027" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="584.8646" y="131.5069" text-anchor="middle" font-size="17.768" font-weight="bold" fill="var(--bg)">Training Examples</text>
  <rect x="784.755" y="96.4383" width="325.7474" height="52.6027" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="947.6287" y="131.5069" text-anchor="middle" font-size="17.768" font-weight="bold" fill="var(--bg)">Typical Improvement</text>
  <rect x="59.2268" y="166.5754" width="325.7474" height="56.1096" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="222.1005" y="203.3973" text-anchor="middle" font-size="16.2874" fill="var(--text)">Classification</text>
  <rect x="414.5875" y="166.5754" width="340.5541" height="56.1096" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="584.8646" y="203.3973" text-anchor="middle" font-size="16.2874" fill="var(--text-muted)">50-200 per class</text>
  <rect x="784.755" y="166.5754" width="325.7474" height="56.1096" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="947.6287" y="203.3973" text-anchor="middle" font-size="16.2874" fill="var(--ok-accent)">+15-30%</text>
  <rect x="59.2268" y="240.2192" width="325.7474" height="56.1096" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="222.1005" y="277.0411" text-anchor="middle" font-size="16.2874" fill="var(--text)">Extraction</text>
  <rect x="414.5875" y="240.2192" width="340.5541" height="56.1096" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="584.8646" y="277.0411" text-anchor="middle" font-size="16.2874" fill="var(--text-muted)">100-500</text>
  <rect x="784.755" y="240.2192" width="325.7474" height="56.1096" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="947.6287" y="277.0411" text-anchor="middle" font-size="16.2874" fill="var(--ok-accent)">+20-40%</text>
  <rect x="59.2268" y="313.863" width="325.7474" height="56.1096" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="222.1005" y="350.685" text-anchor="middle" font-size="16.2874" fill="var(--text)">Summarization</text>
  <rect x="414.5875" y="313.863" width="340.5541" height="56.1096" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="584.8646" y="350.685" text-anchor="middle" font-size="16.2874" fill="var(--text-muted)">200-1000</text>
  <rect x="784.755" y="313.863" width="325.7474" height="56.1096" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="947.6287" y="350.685" text-anchor="middle" font-size="16.2874" fill="var(--danger-accent)">+10-20%</text>
  <rect x="59.2268" y="387.5068" width="325.7474" height="56.1096" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="222.1005" y="424.3288" text-anchor="middle" font-size="16.2874" fill="var(--text)">Style transfer</text>
  <rect x="414.5875" y="387.5068" width="340.5541" height="56.1096" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="584.8646" y="424.3288" text-anchor="middle" font-size="16.2874" fill="var(--text-muted)">100-500</text>
  <rect x="784.755" y="387.5068" width="325.7474" height="56.1096" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="947.6287" y="424.3288" text-anchor="middle" font-size="16.2874" fill="var(--ok-accent)">+25-40%</text>
  <rect x="59.2268" y="461.1507" width="325.7474" height="56.1096" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="222.1005" y="497.9727" text-anchor="middle" font-size="16.2874" fill="var(--text)">Code generation</text>
  <rect x="414.5875" y="461.1507" width="340.5541" height="56.1096" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="584.8646" y="497.9727" text-anchor="middle" font-size="16.2874" fill="var(--text-muted)">500-2000</text>
  <rect x="784.755" y="461.1507" width="325.7474" height="56.1096" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="947.6287" y="497.9727" text-anchor="middle" font-size="16.2874" fill="var(--danger-accent)">+10-25%</text>
  <rect x="59.2268" y="534.7945" width="325.7474" height="56.1096" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="222.1005" y="571.6165" text-anchor="middle" font-size="16.2874" fill="var(--text)">Custom format</text>
  <rect x="414.5875" y="534.7945" width="340.5541" height="56.1096" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="584.8646" y="571.6165" text-anchor="middle" font-size="16.2874" fill="var(--text-muted)">50-200</text>
  <rect x="784.755" y="534.7945" width="325.7474" height="56.1096" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="947.6287" y="571.6165" text-anchor="middle" font-size="16.2874" font-weight="bold" fill="var(--ok-accent)">+30-50%</text>
  <text x="592.2679" y="640" text-anchor="middle" font-size="16.2874" fill="var(--text-faint)">Improvements measured vs. few-shot prompting on the same base model</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="awf" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="631.7808" y="40" text-anchor="middle" font-size="31.0524" font-weight="bold" fill="var(--text)">What is Fine-Tuning?</text>
  <rect x="40" y="168.8889" width="328.7671" height="451.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="204.3836" y="265.5556" text-anchor="middle" font-size="25.2301" font-weight="bold" fill="var(--primary-accent)">Pre-trained Model</text>
  <text x="204.3836" y="346.1111" text-anchor="middle" font-size="21.3485" fill="var(--text-muted)">GPT-4o-mini</text>
  <line x1="89.3151" y1="394.4444" x2="319.4521" y2="394.4444" stroke="var(--border)" stroke-width="1.6" />
  <text x="204.3836" y="475" text-anchor="middle" font-size="21.3485" fill="var(--text-muted)">General</text>
  <text x="204.3836" y="539.4444" text-anchor="middle" font-size="21.3485" fill="var(--text-muted)">capabilities</text>
  <text x="434.5205" y="426.6667" text-anchor="middle" font-size="54.3418" font-weight="bold" fill="var(--primary-accent)">+</text>
  <rect x="483.8356" y="168.8889" width="328.7671" height="451.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="648.2192" y="265.5556" text-anchor="middle" font-size="25.2301" font-weight="bold" fill="var(--danger-accent)">Your Data</text>
  <text x="648.2192" y="346.1111" text-anchor="middle" font-size="21.3485" fill="var(--text-muted)">1000s of examples</text>
  <line x1="533.1507" y1="394.4444" x2="763.2877" y2="394.4444" stroke="var(--border)" stroke-width="1.6" />
  <text x="648.2192" y="475" text-anchor="middle" font-size="21.3485" fill="var(--text-muted)">(prompt -&gt;</text>
  <text x="648.2192" y="539.4444" text-anchor="middle" font-size="21.3485" fill="var(--text-muted)">response)</text>
  <line x1="812.6027" y1="394.4444" x2="894.7945" y2="394.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#awf)" />
  <text x="853.6986" y="362.2222" font-size="31.0524" fill="var(--primary-accent)">-&gt;</text>
  <rect x="911.2329" y="168.8889" width="328.7671" height="451.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1075.6164" y="265.5556" text-anchor="middle" font-size="25.2301" font-weight="bold" fill="var(--ok-accent)">Fine-tuned Model</text>
  <text x="1075.6164" y="346.1111" text-anchor="middle" font-size="21.3485" fill="var(--text-muted)">Your custom model</text>
  <line x1="960.5479" y1="394.4444" x2="1190.6849" y2="394.4444" stroke="var(--border)" stroke-width="1.6" />
  <text x="1075.6164" y="475" text-anchor="middle" font-size="21.3485" fill="var(--text-muted)">Domain</text>
  <text x="1075.6164" y="539.4444" text-anchor="middle" font-size="21.3485" fill="var(--text-muted)">expert</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="awf" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="67.5" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">What is Fine-Tuning?</text>
  <rect x="64" y="157.5" width="320" height="315" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="224" y="225" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--primary-accent)">Pre-trained Model</text>
  <text x="224" y="281.25" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">GPT-4o-mini</text>
  <line x1="112" y1="315" x2="336" y2="315" stroke="var(--border)" stroke-width="1.6" />
  <text x="224" y="371.25" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">General</text>
  <text x="224" y="416.25" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">capabilities</text>
  <text x="448" y="337.5" text-anchor="middle" font-size="44.8" font-weight="bold" fill="var(--primary-accent)">+</text>
  <rect x="496" y="157.5" width="320" height="315" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="656" y="225" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--danger-accent)">Your Data</text>
  <text x="656" y="281.25" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">1000s of examples</text>
  <line x1="544" y1="315" x2="768" y2="315" stroke="var(--border)" stroke-width="1.6" />
  <text x="656" y="371.25" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">(prompt -&gt;</text>
  <text x="656" y="416.25" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">response)</text>
  <line x1="816" y1="315" x2="896" y2="315" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#awf)" />
  <text x="856" y="292.5" font-size="25.6" fill="var(--primary-accent)">-&gt;</text>
  <rect x="912" y="157.5" width="320" height="315" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1072" y="225" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--ok-accent)">Fine-tuned Model</text>
  <text x="1072" y="281.25" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">Your custom model</text>
  <line x1="960" y1="315" x2="1184" y2="315" stroke="var(--border)" stroke-width="1.6" />
  <text x="1072" y="371.25" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">Domain</text>
  <text x="1072" y="416.25" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">expert</text>
</svg>
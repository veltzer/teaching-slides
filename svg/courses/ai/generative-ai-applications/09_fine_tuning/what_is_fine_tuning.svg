<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="328.7671" height="580" rx="6.803360597951" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.3836" y="164.285760204083" text-anchor="middle" font-size="28.608244703729" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pre-trained Model</text>
  <text x="204.3836" y="267.857119897959" text-anchor="middle" font-size="24.206923954227" fill="var(--text-muted)" font-family="Arial, sans-serif">GPT-4o-mini</text>
  <line x1="89.3151" y1="329.999935714284" x2="319.4521" y2="329.999935714284" stroke="var(--border)" stroke-width="1.6"/>
  <text x="204.3836" y="433.571423979592" text-anchor="middle" font-size="24.206923954227" fill="var(--text-muted)" font-family="Arial, sans-serif">General</text>
  <text x="204.3836" y="516.428511734692" text-anchor="middle" font-size="24.206923954227" fill="var(--text-muted)" font-family="Arial, sans-serif">capabilities</text>
  <text x="434.5205" y="371.428608163266" text-anchor="middle" font-size="61.617810156959" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">+</text>
  <rect x="483.8356" y="40" width="328.7671" height="580" rx="6.803360597951" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.2192" y="164.285760204083" text-anchor="middle" font-size="28.608244703729" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Your Data</text>
  <text x="648.2192" y="267.857119897959" text-anchor="middle" font-size="24.206923954227" fill="var(--text-muted)" font-family="Arial, sans-serif">1000s of examples</text>
  <line x1="533.1507" y1="329.999935714284" x2="763.2877" y2="329.999935714284" stroke="var(--border)" stroke-width="1.6"/>
  <text x="648.2192" y="433.571423979592" text-anchor="middle" font-size="24.206923954227" fill="var(--text-muted)" font-family="Arial, sans-serif">(prompt -&gt;</text>
  <text x="648.2192" y="516.428511734692" text-anchor="middle" font-size="24.206923954227" fill="var(--text-muted)" font-family="Arial, sans-serif">response)</text>
  <line x1="812.6027" y1="329.999935714284" x2="894.7945" y2="329.999935714284" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="853.6986" y="288.571391836734" font-size="35.210112438637" fill="var(--primary-accent)" font-family="Arial, sans-serif">-&gt;</text>
  <rect x="911.2329" y="40" width="328.7671" height="580" rx="6.803360597951" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.6164" y="164.285760204083" text-anchor="middle" font-size="28.608244703729" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Fine-tuned Model</text>
  <text x="1075.6164" y="267.857119897959" text-anchor="middle" font-size="24.206923954227" fill="var(--text-muted)" font-family="Arial, sans-serif">Your custom model</text>
  <line x1="960.5479" y1="329.999935714284" x2="1190.6849" y2="329.999935714284" stroke="var(--border)" stroke-width="1.6"/>
  <text x="1075.6164" y="433.571423979592" text-anchor="middle" font-size="24.206923954227" fill="var(--text-muted)" font-family="Arial, sans-serif">Domain</text>
  <text x="1075.6164" y="516.428511734692" text-anchor="middle" font-size="24.206923954227" fill="var(--text-muted)" font-family="Arial, sans-serif">expert</text>
</svg>

<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="awf" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">What is Fine-Tuning?</text>
  <!-- Pre-trained -->
  <rect x="40" y="70" width="200" height="140" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="140" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Pre-trained Model</text>
  <text x="140" y="125" text-anchor="middle" font-size="11" fill="#555">GPT-4o-mini</text>
  <line x1="70" y1="140" x2="210" y2="140" stroke="#dee2e6" stroke-width="1"/>
  <text x="140" y="165" text-anchor="middle" font-size="11" fill="#555">General</text>
  <text x="140" y="185" text-anchor="middle" font-size="11" fill="#555">capabilities</text>
  <!-- Plus -->
  <text x="280" y="150" text-anchor="middle" font-size="28" font-weight="bold" fill="#4a90e2">+</text>
  <!-- Your data -->
  <rect x="310" y="70" width="200" height="140" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="410" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">Your Data</text>
  <text x="410" y="125" text-anchor="middle" font-size="11" fill="#555">1000s of examples</text>
  <line x1="340" y1="140" x2="480" y2="140" stroke="#dee2e6" stroke-width="1"/>
  <text x="410" y="165" text-anchor="middle" font-size="11" fill="#555">(prompt -></text>
  <text x="410" y="185" text-anchor="middle" font-size="11" fill="#555">response)</text>
  <!-- Arrow -->
  <line x1="510" y1="140" x2="560" y2="140" stroke="#4a90e2" stroke-width="3" marker-end="url(#awf)"/>
  <text x="535" y="130" font-size="16" fill="#4a90e2">-></text>
  <!-- Fine-tuned -->
  <rect x="570" y="70" width="200" height="140" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="670" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Fine-tuned Model</text>
  <text x="670" y="125" text-anchor="middle" font-size="11" fill="#555">Your custom model</text>
  <line x1="600" y1="140" x2="740" y2="140" stroke="#dee2e6" stroke-width="1"/>
  <text x="670" y="165" text-anchor="middle" font-size="11" fill="#555">Domain</text>
  <text x="670" y="185" text-anchor="middle" font-size="11" fill="#555">expert</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="49.0909" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="#333">Data Quality Checklist</text>
  <rect x="102.4" y="81.8182" width="1075.2" height="458.1818" rx="13.0909" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2727" />
  <text x="153.6" y="130.9091" font-size="19.6364" fill="#333">☐ Minimum 50 examples (recommend 200+)</text>
  <text x="153.6" y="171.8182" font-size="19.6364" fill="#333">☐ Consistent formatting across all examples</text>
  <text x="153.6" y="212.7273" font-size="19.6364" fill="#333">☐ Balanced distribution across categories</text>
  <text x="153.6" y="253.6364" font-size="19.6364" fill="#333">☐ No contradictory labels</text>
  <text x="153.6" y="294.5455" font-size="19.6364" fill="#333">☐ Examples represent real-world distribution</text>
  <text x="153.6" y="335.4545" font-size="19.6364" fill="#333">☐ Include edge cases and difficult examples</text>
  <text x="153.6" y="376.3636" font-size="19.6364" fill="#333">☐ System prompt is identical across examples</text>
  <text x="153.6" y="417.2727" font-size="19.6364" fill="#333">☐ Responses match desired style/length</text>
  <text x="153.6" y="458.1818" font-size="19.6364" fill="#333">☐ No PII or sensitive data (unless intended)</text>
  <text x="153.6" y="499.0909" font-size="19.6364" fill="#333">☐ Validated by domain expert</text>
  <text x="153.6" y="523.6364" font-size="19.6364" fill="#333">☐ Set aside 20% for validation</text>
  <rect x="102.4" y="572.7273" width="1075.2" height="130.9091" rx="8.1818" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4545" />
  <text x="640" y="613.6364" text-anchor="middle" font-size="19.6364" font-weight="bold" fill="#dc3545">Common Mistakes</text>
  <text x="153.6" y="651.2727" font-size="18" fill="#dc3545">✗ All examples from one category  ✗ Copy-pasted template responses</text>
  <text x="153.6" y="684" font-size="18" fill="#dc3545">✗ Inconsistent formatting (JSON vs text)  ✗ Too-short or too-long responses</text>
</svg>
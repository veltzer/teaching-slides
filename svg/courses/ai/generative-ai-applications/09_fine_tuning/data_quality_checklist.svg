<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.0369" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Quality Checklist</text>
  <rect x="40" y="69" width="1200" height="405.9999" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="97.1429" y="112.5" font-size="19.5277" fill="var(--text)" font-family="Arial, sans-serif">☐ Minimum 50 examples (recommend 200+)</text>
  <text x="97.1429" y="148.75" font-size="19.5277" fill="var(--text)" font-family="Arial, sans-serif">☐ Consistent formatting across all examples</text>
  <text x="97.1429" y="185" font-size="19.5277" fill="var(--text)" font-family="Arial, sans-serif">☐ Balanced distribution across categories</text>
  <text x="97.1429" y="221.25" font-size="19.5277" fill="var(--text)" font-family="Arial, sans-serif">☐ No contradictory labels</text>
  <text x="97.1429" y="257.5" font-size="19.5277" fill="var(--text)" font-family="Arial, sans-serif">☐ Examples represent real-world distribution</text>
  <text x="97.1429" y="293.7499" font-size="19.5277" fill="var(--text)" font-family="Arial, sans-serif">☐ Include edge cases and difficult examples</text>
  <text x="97.1429" y="329.9999" font-size="19.5277" fill="var(--text)" font-family="Arial, sans-serif">☐ System prompt is identical across examples</text>
  <text x="97.1429" y="366.2499" font-size="19.5277" fill="var(--text)" font-family="Arial, sans-serif">☐ Responses match desired style/length</text>
  <text x="97.1429" y="402.4999" font-size="19.5277" fill="var(--text)" font-family="Arial, sans-serif">☐ No PII or sensitive data (unless intended)</text>
  <text x="97.1429" y="438.75" font-size="19.5277" fill="var(--text)" font-family="Arial, sans-serif">☐ Validated by domain expert</text>
  <text x="97.1429" y="460.5" font-size="19.5277" fill="var(--text)" font-family="Arial, sans-serif">☐ Set aside 20% for validation</text>
  <rect x="40" y="504" width="1200" height="116" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="540.25" text-anchor="middle" font-size="19.5277" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Common Mistakes</text>
  <text x="97.1429" y="573.5999" font-size="17.9004" fill="var(--danger-accent)" font-family="Arial, sans-serif">✗ All examples from one category  ✗ Copy-pasted template responses</text>
  <text x="97.1429" y="602.6" font-size="17.9004" fill="var(--danger-accent)" font-family="Arial, sans-serif">✗ Inconsistent formatting (JSON vs text)  ✗ Too-short or too-long responses</text>
</svg>

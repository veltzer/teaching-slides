<svg viewBox="0 0 750 440" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Data Quality Checklist</text>
  <rect x="60" y="50" width="630" height="280" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="80" font-size="12" fill="#333">&#x2610; Minimum 50 examples (recommend 200+)</text>
  <text x="90" y="105" font-size="12" fill="#333">&#x2610; Consistent formatting across all examples</text>
  <text x="90" y="130" font-size="12" fill="#333">&#x2610; Balanced distribution across categories</text>
  <text x="90" y="155" font-size="12" fill="#333">&#x2610; No contradictory labels</text>
  <text x="90" y="180" font-size="12" fill="#333">&#x2610; Examples represent real-world distribution</text>
  <text x="90" y="205" font-size="12" fill="#333">&#x2610; Include edge cases and difficult examples</text>
  <text x="90" y="230" font-size="12" fill="#333">&#x2610; System prompt is identical across examples</text>
  <text x="90" y="255" font-size="12" fill="#333">&#x2610; Responses match desired style/length</text>
  <text x="90" y="280" font-size="12" fill="#333">&#x2610; No PII or sensitive data (unless intended)</text>
  <text x="90" y="305" font-size="12" fill="#333">&#x2610; Validated by domain expert</text>
  <text x="90" y="320" font-size="12" fill="#333">&#x2610; Set aside 20% for validation</text>
  <!-- Common mistakes -->
  <rect x="60" y="350" width="630" height="80" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="375" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Common Mistakes</text>
  <text x="90" y="398" font-size="11" fill="#dc3545">&#x2717; All examples from one category  &#x2717; Copy-pasted template responses</text>
  <text x="90" y="418" font-size="11" fill="#dc3545">&#x2717; Inconsistent formatting (JSON vs text)  &#x2717; Too-short or too-long responses</text>
</svg>
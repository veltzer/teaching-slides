<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="582.1188" y="44.6512" text-anchor="middle" font-size="23.8139" font-weight="bold" fill="#333">Data Quality Checklist</ns0:text>
  <ns0:rect x="93.139" y="74.4186" width="977.9596" height="416.7441" rx="11.907" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9767" />
  <ns0:text x="139.7085" y="119.0698" font-size="17.8605" fill="#333">☐ Minimum 50 examples (recommend 200+)</ns0:text>
  <ns0:text x="139.7085" y="156.2791" font-size="17.8605" fill="#333">☐ Consistent formatting across all examples</ns0:text>
  <ns0:text x="139.7085" y="193.4884" font-size="17.8605" fill="#333">☐ Balanced distribution across categories</ns0:text>
  <ns0:text x="139.7085" y="230.6977" font-size="17.8605" fill="#333">☐ No contradictory labels</ns0:text>
  <ns0:text x="139.7085" y="267.907" font-size="17.8605" fill="#333">☐ Examples represent real-world distribution</ns0:text>
  <ns0:text x="139.7085" y="305.1162" font-size="17.8605" fill="#333">☐ Include edge cases and difficult examples</ns0:text>
  <ns0:text x="139.7085" y="342.3255" font-size="17.8605" fill="#333">☐ System prompt is identical across examples</ns0:text>
  <ns0:text x="139.7085" y="379.5348" font-size="17.8605" fill="#333">☐ Responses match desired style/length</ns0:text>
  <ns0:text x="139.7085" y="416.7441" font-size="17.8605" fill="#333">☐ No PII or sensitive data (unless intended)</ns0:text>
  <ns0:text x="139.7085" y="453.9535" font-size="17.8605" fill="#333">☐ Validated by domain expert</ns0:text>
  <ns0:text x="139.7085" y="476.2791" font-size="17.8605" fill="#333">☐ Set aside 20% for validation</ns0:text>
  <ns0:rect x="93.139" y="520.9302" width="977.9596" height="119.0698" rx="7.4418" fill="#f8d7da" stroke="#dc3545" stroke-width="2.2325" />
  <ns0:text x="582.1188" y="558.1395" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="#dc3545">Common Mistakes</ns0:text>
  <ns0:text x="139.7085" y="592.372" font-size="16.3721" fill="#dc3545">✗ All examples from one category  ✗ Copy-pasted template responses</ns0:text>
  <ns0:text x="139.7085" y="622.1395" font-size="16.3721" fill="#dc3545">✗ Inconsistent formatting (JSON vs text)  ✗ Too-short or too-long responses</ns0:text>
</ns0:svg>
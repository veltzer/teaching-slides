  <ns0:rect x="561.9512" y="476.0976" width="218.5366" height="54.6341" rx="7.8049" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.122" />
  <ns0:text x="671.2195" y="512" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--ok-bright)">FINE-TUNE</ns0:text>
  <ns0:line x1="671.2195" y1="530.7317" x2="671.2195" y2="569.7561" stroke="var(--primary-bright)" stroke-width="2.3415" />

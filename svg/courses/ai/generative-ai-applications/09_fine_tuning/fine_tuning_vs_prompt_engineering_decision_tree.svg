<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="aft" markerWidth="16" markerHeight="11.2" refX="16" refY="5.6" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="aftd" markerWidth="16" markerHeight="11.2" refX="8" refY="11.2" orient="auto">
      <polygon points="0,16 0,8" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Fine-Tuning vs Prompt Engineering: Decision Tree</text>
  <rect x="400" y="64" width="480" height="56" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="100.8" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Do you have a working prompt?</text>
  <line x1="512" y1="120" x2="288" y2="160" stroke="#dc3545" stroke-width="2.4" marker-end="url(#aft)" />
  <text x="368" y="144" font-size="16" fill="#dc3545">NO</text>
  <rect x="128" y="160" width="320" height="48" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="288" y="192" text-anchor="middle" font-size="17.6" fill="#856404">Try prompt engineering first</text>
  <line x1="768" y1="120" x2="928" y2="160" stroke="#28a745" stroke-width="2.4" marker-end="url(#aft)" />
  <text x="864" y="144" font-size="16" fill="#28a745">YES</text>
  <rect x="752" y="160" width="416" height="56" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="960" y="196.8" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Is quality sufficient?</text>
  <line x1="1024" y1="216" x2="1120" y2="256" stroke="#28a745" stroke-width="2.4" marker-end="url(#aft)" />
  <text x="1088" y="243.2" font-size="16" fill="#28a745">YES</text>
  <rect x="992" y="256" width="256" height="56" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="1120" y="292.8" text-anchor="middle" font-size="16" fill="#28a745">Keep using prompts</text>
  <line x1="864" y1="216" x2="704" y2="272" stroke="#dc3545" stroke-width="2.4" marker-end="url(#aft)" />
  <text x="768" y="248" font-size="16" fill="#dc3545">NO</text>
  <rect x="496" y="272" width="416" height="56" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="704" y="308.8" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Better examples help?</text>
  <line x1="800" y1="328" x2="928" y2="368" stroke="#28a745" stroke-width="2.4" marker-end="url(#aft)" />
  <text x="880" y="355.2" font-size="16" fill="#28a745">YES</text>
  <rect x="832" y="368" width="256" height="48" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="960" y="400" text-anchor="middle" font-size="16" fill="#28a745">Use few-shot learning</text>
  <line x1="608" y1="328" x2="496" y2="384" stroke="#dc3545" stroke-width="2.4" marker-end="url(#aft)" />
  <text x="544" y="360" font-size="16" fill="#dc3545">NO</text>
  <rect x="304" y="384" width="384" height="56" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="496" y="420.8" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">50+ labeled examples?</text>
  <line x1="384" y1="440" x2="256" y2="480" stroke="#dc3545" stroke-width="2.4" marker-end="url(#aft)" />
  <text x="304" y="467.2" font-size="16" fill="#dc3545">NO</text>
  <rect x="96" y="480" width="320" height="48" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="256" y="512" text-anchor="middle" font-size="16" fill="#856404">Collect more data first</text>
  <line x1="592" y1="440" x2="688" y2="488" stroke="#28a745" stroke-width="2.4" marker-end="url(#aft)" />
  <text x="656" y="468.8" font-size="16" fill="#28a745">YES</text>
  <rect x="576" y="488" width="224" height="56" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="688" y="524.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#28a745">FINE-TUNE</text>
  <line x1="688" y1="544" x2="688" y2="584" stroke="#4a90e2" stroke-width="2.4" />
  <rect x="160" y="592" width="288" height="64" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <text x="304" y="619.2" text-anchor="middle" font-size="16" fill="#333">50-500: OpenAI</text>
  <text x="304" y="643.2" text-anchor="middle" font-size="16" fill="#333">fine-tuning</text>
  <rect x="496" y="592" width="288" height="64" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <text x="640" y="619.2" text-anchor="middle" font-size="16" fill="#333">500-10K: Open-source</text>
  <text x="640" y="643.2" text-anchor="middle" font-size="16" fill="#333">+ LoRA</text>
  <rect x="832" y="592" width="288" height="64" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <text x="976" y="619.2" text-anchor="middle" font-size="16" fill="#333">10K+: Full</text>
  <text x="976" y="643.2" text-anchor="middle" font-size="16" fill="#333">fine-tuning viable</text>
  <line x1="688" y1="584" x2="304" y2="592" stroke="#4a90e2" stroke-width="1.6" />
  <line x1="688" y1="584" x2="640" y2="592" stroke="#4a90e2" stroke-width="1.6" />
  <line x1="688" y1="584" x2="976" y2="592" stroke="#4a90e2" stroke-width="1.6" />
</svg>
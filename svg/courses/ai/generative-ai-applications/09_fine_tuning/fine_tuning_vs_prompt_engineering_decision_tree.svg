  <rect x="40" y="447.567553506209" width="333.3333" height="47.027021402484" rx="6.120413326313" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="478.918935792549" text-anchor="middle" font-size="16.163603567236" fill="var(--danger-accent)" font-family="Arial, sans-serif">Collect more data first</text>
  <line x1="556.6667" y1="408.378403688824" x2="656.6667" y2="455.405425091307" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="623.3333" y="436.594637341125" font-size="16.163603567236" fill="var(--ok-accent)" font-family="Arial, sans-serif">YES</text>
  <rect x="540" y="455.405425091307" width="233.3333" height="54.864788933528" rx="6.120413326313" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.6667" y="491.459426274653" text-anchor="middle" font-size="21.012705038785" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">FINE-TUNE</text>
  <line x1="656.6667" y1="510.270214024836" x2="656.6667" y2="549.459467896275" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="106.6667" y="557.297339481373" width="300" height="62.702660518627" rx="6.120413326313" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="256.6667" y="583.945998816654" text-anchor="middle" font-size="16.163603567236" fill="var(--text)" font-family="Arial, sans-serif">50-500: OpenAI</text>
  <text x="256.6667" y="607.459509517896" text-anchor="middle" font-size="16.163603567236" fill="var(--text)" font-family="Arial, sans-serif">fine-tuning</text>
  <rect x="456.6666" y="557.297339481373" width="300" height="62.702660518627" rx="6.120413326313" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="606.6666" y="583.945998816654" text-anchor="middle" font-size="16.163603567236" fill="var(--text)" font-family="Arial, sans-serif">500-10K: Open-source</text>
  <text x="606.6666" y="607.459509517896" text-anchor="middle" font-size="16.163603567236" fill="var(--text)" font-family="Arial, sans-serif">+ LoRA</text>
  <rect x="806.6666" y="557.297339481373" width="300" height="62.702660518627" rx="6.120413326313" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6666" y="583.945998816654" text-anchor="middle" font-size="16.163603567236" fill="var(--text)" font-family="Arial, sans-serif">10K+: Full</text>
  <text x="956.6666" y="607.459509517896" text-anchor="middle" font-size="16.163603567236" fill="var(--text)" font-family="Arial, sans-serif">fine-tuning viable</text>
  <line x1="656.6667" y1="549.459467896275" x2="256.6667" y2="557.297339481373" stroke="var(--primary-border)" stroke-width="1.561"/>
  <line x1="656.6667" y1="549.459467896275" x2="606.6666" y2="557.297339481373" stroke="var(--primary-border)" stroke-width="1.561"/>

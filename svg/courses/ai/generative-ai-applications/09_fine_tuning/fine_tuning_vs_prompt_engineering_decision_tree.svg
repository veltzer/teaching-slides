  <text x="606.6666" y="76.054105237399" text-anchor="middle" font-size="19.396303879306" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Do you have a working prompt?</text>
  <line x1="473.3334" y1="94.864892987582" x2="240" y2="134.054042804967" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="323.3334" y="118.378403688824" font-size="16.163603567236" fill="var(--danger-accent)" font-family="Arial, sans-serif">NO</text>
  <rect x="73.3333" y="134.054042804967" width="333.3333" height="47.027021402484" rx="6.120413326313" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="165.405425091307" text-anchor="middle" font-size="17.779902719827" fill="var(--danger-accent)" font-family="Arial, sans-serif">Try prompt engineering first</text>
  <line x1="740" y1="94.864892987582" x2="906.6667" y2="134.054042804967" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="118.378403688824" font-size="16.163603567236" fill="var(--ok-accent)" font-family="Arial, sans-serif">YES</text>

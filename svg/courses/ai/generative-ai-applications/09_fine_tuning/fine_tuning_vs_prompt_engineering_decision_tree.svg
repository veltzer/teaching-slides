<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="aft" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="aftd" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Fine-Tuning vs Prompt Engineering: Decision Tree</text>
  <!-- Start -->
  <rect x="250" y="40" width="300" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Do you have a working prompt?</text>
  <!-- NO branch -->
  <line x1="320" y1="75" x2="180" y2="100" stroke="#dc3545" stroke-width="1.5" marker-end="url(#aft)"/>
  <text x="230" y="90" font-size="10" fill="#dc3545">NO</text>
  <rect x="80" y="100" width="200" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="180" y="120" text-anchor="middle" font-size="11" fill="#856404">Try prompt engineering first</text>
  <!-- YES branch -->
  <line x1="480" y1="75" x2="580" y2="100" stroke="#28a745" stroke-width="1.5" marker-end="url(#aft)"/>
  <text x="540" y="90" font-size="10" fill="#28a745">YES</text>
  <rect x="470" y="100" width="260" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="600" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Is quality sufficient?</text>
  <!-- YES - keep prompts -->
  <line x1="640" y1="135" x2="700" y2="160" stroke="#28a745" stroke-width="1.5" marker-end="url(#aft)"/>
  <text x="680" y="152" font-size="10" fill="#28a745">YES</text>
  <rect x="620" y="160" width="160" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="700" y="183" text-anchor="middle" font-size="10" fill="#28a745">Keep using prompts</text>
  <!-- NO - few shot? -->
  <line x1="540" y1="135" x2="440" y2="170" stroke="#dc3545" stroke-width="1.5" marker-end="url(#aft)"/>
  <text x="480" y="155" font-size="10" fill="#dc3545">NO</text>
  <rect x="310" y="170" width="260" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="440" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Better examples help?</text>
  <!-- YES - few shot -->
  <line x1="500" y1="205" x2="580" y2="230" stroke="#28a745" stroke-width="1.5" marker-end="url(#aft)"/>
  <text x="550" y="222" font-size="10" fill="#28a745">YES</text>
  <rect x="520" y="230" width="160" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="600" y="250" text-anchor="middle" font-size="10" fill="#28a745">Use few-shot learning</text>
  <!-- NO - data? -->
  <line x1="380" y1="205" x2="310" y2="240" stroke="#dc3545" stroke-width="1.5" marker-end="url(#aft)"/>
  <text x="340" y="225" font-size="10" fill="#dc3545">NO</text>
  <rect x="190" y="240" width="240" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="310" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">50+ labeled examples?</text>
  <!-- NO - collect -->
  <line x1="240" y1="275" x2="160" y2="300" stroke="#dc3545" stroke-width="1.5" marker-end="url(#aft)"/>
  <text x="190" y="292" font-size="10" fill="#dc3545">NO</text>
  <rect x="60" y="300" width="200" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="160" y="320" text-anchor="middle" font-size="10" fill="#856404">Collect more data first</text>
  <!-- YES - fine tune -->
  <line x1="370" y1="275" x2="430" y2="305" stroke="#28a745" stroke-width="1.5" marker-end="url(#aft)"/>
  <text x="410" y="293" font-size="10" fill="#28a745">YES</text>
  <rect x="360" y="305" width="140" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="430" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">FINE-TUNE</text>
  <!-- Fine-tune options -->
  <line x1="430" y1="340" x2="430" y2="365" stroke="#4a90e2" stroke-width="1.5"/>
  <rect x="100" y="370" width="180" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="190" y="387" text-anchor="middle" font-size="10" fill="#333">50-500: OpenAI</text>
  <text x="190" y="402" text-anchor="middle" font-size="10" fill="#333">fine-tuning</text>
  <rect x="310" y="370" width="180" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="400" y="387" text-anchor="middle" font-size="10" fill="#333">500-10K: Open-source</text>
  <text x="400" y="402" text-anchor="middle" font-size="10" fill="#333">+ LoRA</text>
  <rect x="520" y="370" width="180" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="610" y="387" text-anchor="middle" font-size="10" fill="#333">10K+: Full</text>
  <text x="610" y="402" text-anchor="middle" font-size="10" fill="#333">fine-tuning viable</text>
  <line x1="430" y1="365" x2="190" y2="370" stroke="#4a90e2" stroke-width="1"/>
  <line x1="430" y1="365" x2="400" y2="370" stroke="#4a90e2" stroke-width="1"/>
  <line x1="430" y1="365" x2="610" y2="370" stroke="#4a90e2" stroke-width="1"/>
</svg>
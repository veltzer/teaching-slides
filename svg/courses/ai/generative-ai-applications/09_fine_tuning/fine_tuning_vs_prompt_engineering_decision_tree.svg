  <ns0:text x="624.3902" y="39.0244" text-anchor="middle" font-size="23.4146" font-weight="bold" fill="var(--text-dark)">Fine-Tuning vs Prompt Engineering: Decision Tree</ns0:text>
  <ns0:rect x="390.2439" y="62.439" width="468.2927" height="54.6341" rx="7.8049" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.122" />
  <ns0:text x="624.3902" y="98.3415" text-anchor="middle" font-size="18.7317" font-weight="bold" fill="var(--text-dark)">Do you have a working prompt?</ns0:text>
  <ns0:line x1="499.5122" y1="117.0732" x2="280.9756" y2="156.0976" stroke="var(--danger-bright)" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="359.0244" y="140.4878" font-size="15.6098" fill="var(--danger-bright)">NO</ns0:text>
  <ns0:rect x="124.878" y="156.0976" width="312.1951" height="46.8293" rx="7.8049" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.3415" />
  <ns0:text x="280.9756" y="187.3171" text-anchor="middle" font-size="17.1707" fill="var(--danger-deeper)">Try prompt engineering first</ns0:text>
  <ns0:line x1="749.2683" y1="117.0732" x2="905.3659" y2="156.0976" stroke="var(--ok-bright)" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="842.9268" y="140.4878" font-size="15.6098" fill="var(--ok-bright)">YES</ns0:text>
  <ns0:rect x="733.6585" y="156.0976" width="405.8537" height="54.6341" rx="7.8049" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.122" />
  <ns0:text x="936.5854" y="192" text-anchor="middle" font-size="18.7317" font-weight="bold" fill="var(--text-dark)">Is quality sufficient?</ns0:text>
  <ns0:line x1="999.0244" y1="210.7317" x2="1092.6829" y2="249.7561" stroke="var(--ok-bright)" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="1061.4634" y="237.2683" font-size="15.6098" fill="var(--ok-bright)">YES</ns0:text>
  <ns0:rect x="967.8049" y="249.7561" width="249.7561" height="54.6341" rx="7.8049" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.3415" />
  <ns0:text x="1092.6829" y="285.6585" text-anchor="middle" font-size="15.6098" fill="var(--ok-bright)">Keep using prompts</ns0:text>
  <ns0:line x1="842.9268" y1="210.7317" x2="686.8293" y2="265.3659" stroke="var(--danger-bright)" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="749.2683" y="241.9512" font-size="15.6098" fill="var(--danger-bright)">NO</ns0:text>
  <ns0:rect x="483.9024" y="265.3659" width="405.8537" height="54.6341" rx="7.8049" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.122" />
  <ns0:text x="686.8293" y="301.2683" text-anchor="middle" font-size="17.1707" font-weight="bold" fill="var(--text-dark)">Better examples help?</ns0:text>
  <ns0:line x1="780.4878" y1="320" x2="905.3659" y2="359.0244" stroke="var(--ok-bright)" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="858.5366" y="346.5366" font-size="15.6098" fill="var(--ok-bright)">YES</ns0:text>
  <ns0:rect x="811.7073" y="359.0244" width="249.7561" height="46.8293" rx="7.8049" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.3415" />
  <ns0:text x="936.5854" y="390.2439" text-anchor="middle" font-size="15.6098" fill="var(--ok-bright)">Use few-shot learning</ns0:text>
  <ns0:line x1="593.1707" y1="320" x2="483.9024" y2="374.6341" stroke="var(--danger-bright)" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="530.7317" y="351.2195" font-size="15.6098" fill="var(--danger-bright)">NO</ns0:text>
  <ns0:rect x="296.5854" y="374.6341" width="374.6341" height="54.6341" rx="7.8049" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.122" />
  <ns0:text x="483.9024" y="410.5366" text-anchor="middle" font-size="17.1707" font-weight="bold" fill="var(--text-dark)">50+ labeled examples?</ns0:text>
  <ns0:line x1="374.6341" y1="429.2683" x2="249.7561" y2="468.2927" stroke="var(--danger-bright)" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="296.5854" y="455.8049" font-size="15.6098" fill="var(--danger-bright)">NO</ns0:text>
  <ns0:rect x="93.6585" y="468.2927" width="312.1951" height="46.8293" rx="7.8049" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.3415" />
  <ns0:text x="249.7561" y="499.5122" text-anchor="middle" font-size="15.6098" fill="var(--danger-deeper)">Collect more data first</ns0:text>
  <ns0:line x1="577.561" y1="429.2683" x2="671.2195" y2="476.0976" stroke="var(--ok-bright)" stroke-width="2.3415" marker-end="url(#aft)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="aft" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="aftd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 0,8" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="624.3902" y="39.0244" text-anchor="middle" font-size="23.4146" font-weight="bold" fill="var(--text)">Fine-Tuning vs Prompt Engineering: Decision Tree</text>
  <rect x="390.2439" y="62.439" width="468.2927" height="54.6341" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="624.3902" y="98.3415" text-anchor="middle" font-size="18.7317" font-weight="bold" fill="var(--text)">Do you have a working prompt?</text>
  <line x1="499.5122" y1="117.0732" x2="280.9756" y2="156.0976" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#aft)" />
  <text x="359.0244" y="140.4878" font-size="15.6098" fill="var(--danger-accent)">NO</text>
  <rect x="124.878" y="156.0976" width="312.1951" height="46.8293" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="280.9756" y="187.3171" text-anchor="middle" font-size="17.1707" fill="var(--danger-accent)">Try prompt engineering first</text>
  <line x1="749.2683" y1="117.0732" x2="905.3659" y2="156.0976" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#aft)" />
  <text x="842.9268" y="140.4878" font-size="15.6098" fill="var(--ok-accent)">YES</text>
  <rect x="733.6585" y="156.0976" width="405.8537" height="54.6341" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="936.5854" y="192" text-anchor="middle" font-size="18.7317" font-weight="bold" fill="var(--text)">Is quality sufficient?</text>
  <line x1="999.0244" y1="210.7317" x2="1092.6829" y2="249.7561" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#aft)" />
  <text x="1061.4634" y="237.2683" font-size="15.6098" fill="var(--ok-accent)">YES</text>
  <rect x="967.8049" y="249.7561" width="249.7561" height="54.6341" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1092.6829" y="285.6585" text-anchor="middle" font-size="15.6098" fill="var(--ok-accent)">Keep using prompts</text>
  <line x1="842.9268" y1="210.7317" x2="686.8293" y2="265.3659" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#aft)" />
  <text x="749.2683" y="241.9512" font-size="15.6098" fill="var(--danger-accent)">NO</text>
  <rect x="483.9024" y="265.3659" width="405.8537" height="54.6341" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="686.8293" y="301.2683" text-anchor="middle" font-size="17.1707" font-weight="bold" fill="var(--text)">Better examples help?</text>
  <line x1="780.4878" y1="320" x2="905.3659" y2="359.0244" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#aft)" />
  <text x="858.5366" y="346.5366" font-size="15.6098" fill="var(--ok-accent)">YES</text>
  <rect x="811.7073" y="359.0244" width="249.7561" height="46.8293" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="936.5854" y="390.2439" text-anchor="middle" font-size="15.6098" fill="var(--ok-accent)">Use few-shot learning</text>
  <line x1="593.1707" y1="320" x2="483.9024" y2="374.6341" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#aft)" />
  <text x="530.7317" y="351.2195" font-size="15.6098" fill="var(--danger-accent)">NO</text>
  <rect x="296.5854" y="374.6341" width="374.6341" height="54.6341" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="483.9024" y="410.5366" text-anchor="middle" font-size="17.1707" font-weight="bold" fill="var(--text)">50+ labeled examples?</text>
  <line x1="374.6341" y1="429.2683" x2="249.7561" y2="468.2927" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#aft)" />
  <text x="296.5854" y="455.8049" font-size="15.6098" fill="var(--danger-accent)">NO</text>
  <rect x="93.6585" y="468.2927" width="312.1951" height="46.8293" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="249.7561" y="499.5122" text-anchor="middle" font-size="15.6098" fill="var(--danger-accent)">Collect more data first</text>
  <line x1="577.561" y1="429.2683" x2="671.2195" y2="476.0976" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#aft)" />
  <text x="640" y="457.3659" font-size="15.6098" fill="var(--ok-accent)">YES</text>
  <rect x="561.9512" y="476.0976" width="218.5366" height="54.6341" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="671.2195" y="512" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--ok-accent)">FINE-TUNE</text>
  <line x1="671.2195" y1="530.7317" x2="671.2195" y2="569.7561" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="156.0976" y="577.561" width="280.9756" height="62.439" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="296.5854" y="604.0976" text-anchor="middle" font-size="15.6098" fill="var(--text)">50-500: OpenAI</text>
  <text x="296.5854" y="627.5122" text-anchor="middle" font-size="15.6098" fill="var(--text)">fine-tuning</text>
  <rect x="483.9024" y="577.561" width="280.9756" height="62.439" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="624.3902" y="604.0976" text-anchor="middle" font-size="15.6098" fill="var(--text)">500-10K: Open-source</text>
  <text x="624.3902" y="627.5122" text-anchor="middle" font-size="15.6098" fill="var(--text)">+ LoRA</text>
  <rect x="811.7073" y="577.561" width="280.9756" height="62.439" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="952.1951" y="604.0976" text-anchor="middle" font-size="15.6098" fill="var(--text)">10K+: Full</text>
  <text x="952.1951" y="627.5122" text-anchor="middle" font-size="15.6098" fill="var(--text)">fine-tuning viable</text>
  <line x1="671.2195" y1="569.7561" x2="296.5854" y2="577.561" stroke="var(--primary-border)" stroke-width="1.561" />
  <line x1="671.2195" y1="569.7561" x2="624.3902" y2="577.561" stroke="var(--primary-border)" stroke-width="1.561" />
  <line x1="671.2195" y1="569.7561" x2="952.1951" y2="577.561" stroke="var(--primary-border)" stroke-width="1.561" />
</svg>
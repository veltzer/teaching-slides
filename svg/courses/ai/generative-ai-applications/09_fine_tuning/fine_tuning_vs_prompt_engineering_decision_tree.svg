  <text x="1106.6666" y="264.16208679328" text-anchor="middle" font-size="16.163603567236" fill="var(--ok-accent)" font-family="Arial, sans-serif">Keep using prompts</text>
  <line x1="840" y1="188.918935792549" x2="673.3334" y2="243.783828780131" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="740" y="220.270214024836" font-size="16.163603567236" fill="var(--danger-accent)" font-family="Arial, sans-serif">NO</text>
  <rect x="456.6666" y="243.783828780131" width="433.3334" height="54.864788933528" rx="6.120413326313" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="673.3334" y="279.837829963477" text-anchor="middle" font-size="17.779902719827" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Better examples help?</text>
  <line x1="773.3333" y1="298.64861771366" x2="906.6667" y2="337.837871585098" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="856.6667" y="325.297277048941" font-size="16.163603567236" fill="var(--ok-accent)" font-family="Arial, sans-serif">YES</text>
  <rect x="806.6666" y="337.837871585098" width="266.6667" height="47.027021402484" rx="6.120413326313" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="369.189149817385" text-anchor="middle" font-size="16.163603567236" fill="var(--ok-accent)" font-family="Arial, sans-serif">Use few-shot learning</text>
  <line x1="573.3333" y1="298.64861771366" x2="456.6666" y2="353.513510701242" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="506.6667" y="330" font-size="16.163603567236" fill="var(--danger-accent)" font-family="Arial, sans-serif">NO</text>
  <rect x="256.6667" y="353.513510701242" width="399.9999" height="54.864788933528" rx="6.120413326313" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="456.6666" y="389.567615938641" text-anchor="middle" font-size="17.779902719827" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">50+ labeled examples?</text>
  <line x1="340" y1="408.378403688824" x2="206.6667" y2="447.567553506209" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>

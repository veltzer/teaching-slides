  <text x="940" y="170.108148042367" text-anchor="middle" font-size="19.396303879306" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Is quality sufficient?</text>
  <line x1="1006.6667" y1="188.918935792549" x2="1106.6666" y2="228.108085609934" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1073.3333" y="215.56759512783" font-size="16.163603567236" fill="var(--ok-accent)" font-family="Arial, sans-serif">YES</text>

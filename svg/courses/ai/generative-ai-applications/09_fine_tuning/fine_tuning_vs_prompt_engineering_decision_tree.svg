  <ns0:text x="624.3902" y="39.0244" text-anchor="middle" font-size="23.4146" font-weight="bold" fill="#333">Fine-Tuning vs Prompt Engineering: Decision Tree</ns0:text>
  <ns0:rect x="390.2439" y="62.439" width="468.2927" height="54.6341" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.122" />
  <ns0:text x="624.3902" y="98.3415" text-anchor="middle" font-size="18.7317" font-weight="bold" fill="#333">Do you have a working prompt?</ns0:text>
  <ns0:line x1="499.5122" y1="117.0732" x2="280.9756" y2="156.0976" stroke="#dc3545" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="359.0244" y="140.4878" font-size="15.6098" fill="#dc3545">NO</ns0:text>
  <ns0:rect x="124.878" y="156.0976" width="312.1951" height="46.8293" rx="7.8049" fill="#fff3cd" stroke="#ffc107" stroke-width="2.3415" />
  <ns0:text x="280.9756" y="187.3171" text-anchor="middle" font-size="17.1707" fill="#bf360c">Try prompt engineering first</ns0:text>
  <ns0:line x1="749.2683" y1="117.0732" x2="905.3659" y2="156.0976" stroke="#28a745" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="842.9268" y="140.4878" font-size="15.6098" fill="#28a745">YES</ns0:text>
  <ns0:rect x="733.6585" y="156.0976" width="405.8537" height="54.6341" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.122" />
  <ns0:text x="936.5854" y="192" text-anchor="middle" font-size="18.7317" font-weight="bold" fill="#333">Is quality sufficient?</ns0:text>
  <ns0:line x1="999.0244" y1="210.7317" x2="1092.6829" y2="249.7561" stroke="#28a745" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="1061.4634" y="237.2683" font-size="15.6098" fill="#28a745">YES</ns0:text>
  <ns0:rect x="967.8049" y="249.7561" width="249.7561" height="54.6341" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="2.3415" />
  <ns0:text x="1092.6829" y="285.6585" text-anchor="middle" font-size="15.6098" fill="#28a745">Keep using prompts</ns0:text>
  <ns0:line x1="842.9268" y1="210.7317" x2="686.8293" y2="265.3659" stroke="#dc3545" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="749.2683" y="241.9512" font-size="15.6098" fill="#dc3545">NO</ns0:text>
  <ns0:rect x="483.9024" y="265.3659" width="405.8537" height="54.6341" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.122" />
  <ns0:text x="686.8293" y="301.2683" text-anchor="middle" font-size="17.1707" font-weight="bold" fill="#333">Better examples help?</ns0:text>
  <ns0:line x1="780.4878" y1="320" x2="905.3659" y2="359.0244" stroke="#28a745" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="858.5366" y="346.5366" font-size="15.6098" fill="#28a745">YES</ns0:text>
  <ns0:rect x="811.7073" y="359.0244" width="249.7561" height="46.8293" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="2.3415" />
  <ns0:text x="936.5854" y="390.2439" text-anchor="middle" font-size="15.6098" fill="#28a745">Use few-shot learning</ns0:text>
  <ns0:line x1="593.1707" y1="320" x2="483.9024" y2="374.6341" stroke="#dc3545" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="530.7317" y="351.2195" font-size="15.6098" fill="#dc3545">NO</ns0:text>
  <ns0:rect x="296.5854" y="374.6341" width="374.6341" height="54.6341" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.122" />
  <ns0:text x="483.9024" y="410.5366" text-anchor="middle" font-size="17.1707" font-weight="bold" fill="#333">50+ labeled examples?</ns0:text>
  <ns0:line x1="374.6341" y1="429.2683" x2="249.7561" y2="468.2927" stroke="#dc3545" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="296.5854" y="455.8049" font-size="15.6098" fill="#dc3545">NO</ns0:text>
  <ns0:rect x="93.6585" y="468.2927" width="312.1951" height="46.8293" rx="7.8049" fill="#fff3cd" stroke="#ffc107" stroke-width="2.3415" />
  <ns0:text x="249.7561" y="499.5122" text-anchor="middle" font-size="15.6098" fill="#bf360c">Collect more data first</ns0:text>
  <ns0:line x1="577.561" y1="429.2683" x2="671.2195" y2="476.0976" stroke="#28a745" stroke-width="2.3415" marker-end="url(#aft)" />
  <ns0:text x="640" y="457.3659" font-size="15.6098" fill="#28a745">YES</ns0:text>
  <ns0:rect x="561.9512" y="476.0976" width="218.5366" height="54.6341" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="3.122" />
  <ns0:text x="671.2195" y="512" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="#28a745">FINE-TUNE</ns0:text>
  <ns0:line x1="671.2195" y1="530.7317" x2="671.2195" y2="569.7561" stroke="#4a90e2" stroke-width="2.3415" />
  <ns0:rect x="156.0976" y="577.561" width="280.9756" height="62.439" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.561" />
  <ns0:text x="296.5854" y="604.0976" text-anchor="middle" font-size="15.6098" fill="#333">50-500: OpenAI</ns0:text>
  <ns0:text x="296.5854" y="627.5122" text-anchor="middle" font-size="15.6098" fill="#333">fine-tuning</ns0:text>
  <ns0:rect x="483.9024" y="577.561" width="280.9756" height="62.439" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.561" />
  <ns0:text x="624.3902" y="604.0976" text-anchor="middle" font-size="15.6098" fill="#333">500-10K: Open-source</ns0:text>
  <ns0:text x="624.3902" y="627.5122" text-anchor="middle" font-size="15.6098" fill="#333">+ LoRA</ns0:text>
  <ns0:rect x="811.7073" y="577.561" width="280.9756" height="62.439" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.561" />
  <ns0:text x="952.1951" y="604.0976" text-anchor="middle" font-size="15.6098" fill="#333">10K+: Full</ns0:text>
  <ns0:text x="952.1951" y="627.5122" text-anchor="middle" font-size="15.6098" fill="#333">fine-tuning viable</ns0:text>
  <ns0:line x1="671.2195" y1="569.7561" x2="296.5854" y2="577.561" stroke="#4a90e2" stroke-width="1.561" />
  <ns0:line x1="671.2195" y1="569.7561" x2="624.3902" y2="577.561" stroke="#4a90e2" stroke-width="1.561" />
  <ns0:line x1="671.2195" y1="569.7561" x2="952.1951" y2="577.561" stroke="#4a90e2" stroke-width="1.561" />

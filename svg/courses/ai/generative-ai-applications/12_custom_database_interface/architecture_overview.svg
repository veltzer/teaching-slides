<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="adb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="adbl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 5.6,17.1429" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="597.3333" y="48" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text)">Database Interface Architecture</text>
  <rect x="59.7333" y="80" width="1075.2" height="560" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="104.5333" y="128" width="224" height="96" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="216.5333" y="172.8" text-anchor="middle" font-size="17.92" font-weight="bold" fill="var(--text)">User Query</text>
  <text x="216.5333" y="204.8" text-anchor="middle" font-size="14.9333" fill="var(--text-muted)">(Natural Language)</text>
  <line x1="328.5333" y1="176" x2="418.1333" y2="176" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#a5d6a7)" />
  <rect x="433.0667" y="128" width="224" height="96" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="545.0667" y="168" text-anchor="middle" font-size="17.92" font-weight="bold" fill="var(--danger-accent)">Schema Context</text>
  <text x="545.0667" y="200" text-anchor="middle" font-size="14.9333" fill="var(--text-muted)">+ LLM</text>
  <line x1="657.0667" y1="176" x2="746.6667" y2="176" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#a5d6a7)" />
  <rect x="761.6" y="128" width="224" height="96" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="873.6" y="168" text-anchor="middle" font-size="17.92" font-weight="bold" fill="var(--ok-accent)">Query Generator</text>
  <text x="873.6" y="200" text-anchor="middle" font-size="14.9333" fill="var(--text-muted)">(LLM)</text>
  <line x1="873.6" y1="224" x2="873.6" y2="296" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#a5d6a7)" />
  <rect x="761.6" y="304" width="224" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="873.6" y="352" text-anchor="middle" font-size="17.92" font-weight="bold" fill="var(--danger-accent)">SQL Validator</text>
  <line x1="873.6" y1="384" x2="873.6" y2="440" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#a5d6a7)" />
  <rect x="761.6" y="448" width="224" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="873.6" y="496" text-anchor="middle" font-size="17.92" font-weight="bold" fill="var(--text)">Database Executor</text>
  <line x1="761.6" y1="487.9999" x2="672" y2="487.9999" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#a5d6a7l)" />
  <rect x="433.0667" y="448" width="224" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="545.0667" y="496" text-anchor="middle" font-size="17.92" font-weight="bold" fill="var(--danger-accent)">Result Formatter</text>
  <line x1="433.0667" y1="487.9999" x2="343.4667" y2="487.9999" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#a5d6a7l)" />
  <rect x="104.5333" y="448" width="224" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="216.5333" y="487.9999" text-anchor="middle" font-size="17.92" font-weight="bold" fill="var(--ok-accent)">Response</text>
  <text x="216.5333" y="515.2" text-anchor="middle" font-size="14.9333" fill="var(--text-muted)">(Natural Language)</text>
</svg>
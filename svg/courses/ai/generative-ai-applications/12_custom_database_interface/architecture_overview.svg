<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="adb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="adbl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 5.6,17.1429" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.9848" font-weight="bold" fill="var(--text)">Database Interface Architecture</text>
  <rect x="40" y="71.3514" width="1200" height="548.6486" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="90" y="118.3784" width="250" height="94.0541" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="215" y="162.2703" text-anchor="middle" font-size="18.7386" font-weight="bold" fill="var(--text)">User Query</text>
  <text x="215" y="193.6216" text-anchor="middle" font-size="15.6155" fill="var(--text-muted)">(Natural Language)</text>
  <line x1="340" y1="165.4054" x2="440" y2="165.4054" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#a5d6a7)" />
  <rect x="456.6667" y="118.3784" width="250" height="94.0541" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="581.6667" y="157.5676" text-anchor="middle" font-size="18.7386" font-weight="bold" fill="var(--danger-accent)">Schema Context</text>
  <text x="581.6667" y="188.9189" text-anchor="middle" font-size="15.6155" fill="var(--text-muted)">+ LLM</text>
  <line x1="706.6667" y1="165.4054" x2="806.6667" y2="165.4054" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#a5d6a7)" />
  <rect x="823.3334" y="118.3784" width="250" height="94.0541" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="948.3334" y="157.5676" text-anchor="middle" font-size="18.7386" font-weight="bold" fill="var(--ok-accent)">Query Generator</text>
  <text x="948.3334" y="188.9189" text-anchor="middle" font-size="15.6155" fill="var(--text-muted)">(LLM)</text>
  <line x1="948.3334" y1="212.4324" x2="948.3334" y2="282.973" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#a5d6a7)" />
  <rect x="823.3334" y="290.8108" width="250" height="78.3784" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="948.3334" y="337.8378" text-anchor="middle" font-size="18.7386" font-weight="bold" fill="var(--danger-accent)">SQL Validator</text>
  <line x1="948.3334" y1="369.1892" x2="948.3334" y2="424.0541" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#a5d6a7)" />
  <rect x="823.3334" y="431.8919" width="250" height="78.3784" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="948.3334" y="478.9189" text-anchor="middle" font-size="18.7386" font-weight="bold" fill="var(--text)">Database Executor</text>
  <line x1="823.3334" y1="471.081" x2="723.3334" y2="471.081" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#a5d6a7l)" />
  <rect x="456.6667" y="431.8919" width="250" height="78.3784" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="581.6667" y="478.9189" text-anchor="middle" font-size="18.7386" font-weight="bold" fill="var(--danger-accent)">Result Formatter</text>
  <line x1="456.6667" y1="471.081" x2="356.6667" y2="471.081" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#a5d6a7l)" />
  <rect x="90" y="431.8919" width="250" height="78.3784" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="215" y="471.081" text-anchor="middle" font-size="18.7386" font-weight="bold" fill="var(--ok-accent)">Response</text>
  <text x="215" y="497.7297" text-anchor="middle" font-size="15.6155" fill="var(--text-muted)">(Natural Language)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="305.084725079002" height="139.200065119999" rx="8.063476623864" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.542362539501" y="104.960010656001" text-anchor="middle" font-size="25.18304384399" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">User Query</text>
  <text x="192.542362539501" y="151.359933696002" text-anchor="middle" font-size="20.985869869992" fill="var(--text-muted)" font-family="Arial, sans-serif">(Natural Language)</text>
  <line x1="345.084725079002" y1="109.599958560002" x2="467.118615110602" y2="109.599958560002" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="487.457637460499" y="40" width="305.084725079002" height="139.200065119999" rx="8.063476623864" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="98.0000148" text-anchor="middle" font-size="25.18304384399" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Schema Context</text>
  <text x="640" y="144.399937840002" text-anchor="middle" font-size="20.985869869992" fill="var(--text-muted)" font-family="Arial, sans-serif">+ LLM</text>
  <line x1="792.542362539501" y1="109.599958560002" x2="914.576252571102" y2="109.599958560002" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="934.915274920998" y="40" width="305.084725079002" height="139.200065119999" rx="8.063476623864" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.457637460499" y="98.0000148" text-anchor="middle" font-size="25.18304384399" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Query Generator</text>
  <text x="1087.457637460499" y="144.399937840002" text-anchor="middle" font-size="20.985869869992" fill="var(--text-muted)" font-family="Arial, sans-serif">(LLM)</text>
  <line x1="1087.457637460499" y1="179.199917120002" x2="1087.457637460499" y2="283.60000296" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="934.915274920998" y="295.199946720001" width="305.084725079002" height="116.000029599999" rx="8.063476623864" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.457637460499" y="364.799905280002" text-anchor="middle" font-size="25.18304384399" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">SQL Validator</text>
  <line x1="1087.457637460499" y1="411.19997632" x2="1087.457637460499" y2="492.400026639999" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="934.915274920998" y="503.999970400001" width="305.084725079002" height="116.000029599999" rx="8.063476623864" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.457637460499" y="573.599928960001" text-anchor="middle" font-size="25.18304384399" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Database Executor</text>
  <line x1="934.915274920998" y1="561.999837200003" x2="812.881384889398" y2="561.999837200003" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="487.457637460499" y="503.999970400001" width="305.084725079002" height="116.000029599999" rx="8.063476623864" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="573.599928960001" text-anchor="middle" font-size="25.18304384399" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Result Formatter</text>
  <line x1="487.457637460499" y1="561.999837200003" x2="365.423747428898" y2="561.999837200003" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="503.999970400001" width="305.084725079002" height="116.000029599999" rx="8.063476623864" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.542362539501" y="561.999837200003" text-anchor="middle" font-size="25.18304384399" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Response</text>
  <text x="192.542362539501" y="601.439912384001" text-anchor="middle" font-size="20.985869869992" fill="var(--text-muted)" font-family="Arial, sans-serif">(Natural Language)</text>
</svg>

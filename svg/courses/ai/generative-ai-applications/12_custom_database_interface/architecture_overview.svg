<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="24.9848" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Database Interface Architecture</text>
  <rect x="40" y="71.3514" width="1200" height="548.6486" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="90" y="118.3784" width="250" height="94.0541" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="162.2703" text-anchor="middle" font-size="18.7386" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">User Query</text>
  <text x="215" y="193.6216" text-anchor="middle" font-size="15.6155" fill="var(--text-muted)" font-family="Arial, sans-serif">(Natural Language)</text>
  <line x1="340" y1="165.4054" x2="440" y2="165.4054" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="456.6667" y="118.3784" width="250" height="94.0541" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="581.6667" y="157.5676" text-anchor="middle" font-size="18.7386" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Schema Context</text>
  <text x="581.6667" y="188.9189" text-anchor="middle" font-size="15.6155" fill="var(--text-muted)" font-family="Arial, sans-serif">+ LLM</text>
  <line x1="706.6667" y1="165.4054" x2="806.6667" y2="165.4054" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="823.3334" y="118.3784" width="250" height="94.0541" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.3334" y="157.5676" text-anchor="middle" font-size="18.7386" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Query Generator</text>
  <text x="948.3334" y="188.9189" text-anchor="middle" font-size="15.6155" fill="var(--text-muted)" font-family="Arial, sans-serif">(LLM)</text>
  <line x1="948.3334" y1="212.4324" x2="948.3334" y2="282.973" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="823.3334" y="290.8108" width="250" height="78.3784" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.3334" y="337.8378" text-anchor="middle" font-size="18.7386" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">SQL Validator</text>
  <line x1="948.3334" y1="369.1892" x2="948.3334" y2="424.0541" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="823.3334" y="431.8919" width="250" height="78.3784" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.3334" y="478.9189" text-anchor="middle" font-size="18.7386" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Database Executor</text>
  <line x1="823.3334" y1="471.081" x2="723.3334" y2="471.081" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="456.6667" y="431.8919" width="250" height="78.3784" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="581.6667" y="478.9189" text-anchor="middle" font-size="18.7386" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Result Formatter</text>
  <line x1="456.6667" y1="471.081" x2="356.6667" y2="471.081" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="90" y="431.8919" width="250" height="78.3784" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="471.081" text-anchor="middle" font-size="18.7386" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Response</text>
  <text x="215" y="497.7297" text-anchor="middle" font-size="15.6155" fill="var(--text-muted)" font-family="Arial, sans-serif">(Natural Language)</text>
</svg>

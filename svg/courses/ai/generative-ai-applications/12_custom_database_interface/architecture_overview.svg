<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.169047433086" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="90" y="89.714261551018" width="250" height="99.428628816332" rx="6.169047433086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="136.114274236734" text-anchor="middle" font-size="19.266552038272" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">User Query</text>
  <text x="215" y="169.257080032648" text-anchor="middle" font-size="16.055460031893" fill="var(--text-muted)" font-family="Arial, sans-serif">(Natural Language)</text>
  <line x1="340" y1="139.428523102037" x2="440" y2="139.428523102037" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="456.6667" y="89.714261551018" width="250" height="99.428628816332" rx="6.169047433086" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="581.6667" y="131.142848081632" text-anchor="middle" font-size="19.266552038272" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Schema Context</text>
  <text x="581.6667" y="164.285653877546" text-anchor="middle" font-size="16.055460031893" fill="var(--text-muted)" font-family="Arial, sans-serif">+ LLM</text>
  <line x1="706.6667" y1="139.428523102037" x2="806.6667" y2="139.428523102037" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="823.3334" y="89.714261551018" width="250" height="99.428628816332" rx="6.169047433086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.3334" y="131.142848081632" text-anchor="middle" font-size="19.266552038272" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Query Generator</text>
  <text x="948.3334" y="164.285653877546" text-anchor="middle" font-size="16.055460031893" fill="var(--text-muted)" font-family="Arial, sans-serif">(LLM)</text>
  <line x1="948.3334" y1="189.142784653055" x2="948.3334" y2="263.714282693877" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="823.3334" y="271.999957714282" width="250" height="82.857173061227" rx="6.169047433086" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.3334" y="321.7142192653" text-anchor="middle" font-size="19.266552038272" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">SQL Validator</text>
  <line x1="948.3334" y1="354.857130775509" x2="948.3334" y2="412.857173061227" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="823.3334" y="421.142848081632" width="250" height="82.857173061227" rx="6.169047433086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.3334" y="470.85710963265" text-anchor="middle" font-size="19.266552038272" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Database Executor</text>
  <line x1="823.3334" y1="462.57132889795" x2="723.3334" y2="462.57132889795" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="456.6667" y="421.142848081632" width="250" height="82.857173061227" rx="6.169047433086" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="581.6667" y="470.85710963265" text-anchor="middle" font-size="19.266552038272" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Result Formatter</text>
  <line x1="456.6667" y1="462.57132889795" x2="356.6667" y2="462.57132889795" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="90" y="421.142848081632" width="250" height="82.857173061227" rx="6.169047433086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="462.57132889795" text-anchor="middle" font-size="19.266552038272" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Response</text>
  <text x="215" y="490.742814253057" text-anchor="middle" font-size="16.055460031893" fill="var(--text-muted)" font-family="Arial, sans-serif">(Natural Language)</text>
</svg>

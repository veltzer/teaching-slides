<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)">User asks in English</text>
  <text x="640" y="125" text-anchor="middle" font-size="18" fill="var(--primary-text)">"Show me the top 5 customers by revenue this quarter"</text>

  <line x1="640" y1="160" x2="640" y2="195" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="200" width="1200" height="120" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="245" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--info-text)">LLM-Powered Database Interface</text>
  <text x="640" y="285" text-anchor="middle" font-size="18" fill="var(--info-text)">NL → SQL → Execute → NL (schema-aware prompting)</text>

  <line x1="640" y1="320" x2="640" y2="355" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="360" width="1200" height="170" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="395" font-family="monospace" font-size="17" font-weight="bold" fill="var(--warn-text)">Generated SQL:</text>
  <text x="60" y="425" font-family="monospace" font-size="16" fill="var(--warn-text)">SELECT c.name, SUM(o.amount) AS revenue</text>
  <text x="60" y="452" font-family="monospace" font-size="16" fill="var(--warn-text)">FROM customers c JOIN orders o ON c.id = o.customer_id</text>
  <text x="60" y="479" font-family="monospace" font-size="16" fill="var(--warn-text)">WHERE o.date &gt;= DATE_TRUNC('quarter', CURRENT_DATE)</text>
  <text x="60" y="506" font-family="monospace" font-size="16" fill="var(--warn-text)">GROUP BY c.name ORDER BY revenue DESC LIMIT 5;</text>

  <line x1="640" y1="530" x2="640" y2="565" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="570" width="1200" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="603" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ok-text)">Reply: "Acme $245K, TechStart $198K, …"</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </ns0:defs>
  <ns0:rect x="327.4419" y="14.8837" width="535.814" height="59.5349" rx="7.4419" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2326" />
  <ns0:text x="595.3488" y="52.093" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8605" fill="#333">"Show me the top 5 customers by revenue this quarter"</ns0:text>
  <ns0:line x1="595.3488" y1="74.4186" x2="595.3488" y2="119.0698" stroke="#4a90e2" stroke-width="2.2326" marker-end="url(#arrow)" />
  <ns0:rect x="372.093" y="119.0698" width="446.5116" height="119.0698" rx="7.4419" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9767" />
  <ns0:text x="595.3488" y="156.2791" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8372" font-weight="bold" fill="#333">LLM-Powered Database Interface</ns0:text>
  <ns0:text x="595.3488" y="193.4884" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8605" fill="#555">NL &gt; SQL &gt; Execute &gt; NL</ns0:text>
  <ns0:text x="595.3488" y="220.2791" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.3721" fill="#777">Natural Language to SQL Pipeline</ns0:text>
  <ns0:line x1="595.3488" y1="238.1395" x2="595.3488" y2="282.7907" stroke="#4a90e2" stroke-width="2.2326" marker-end="url(#arrow)" />
  <ns0:rect x="193.4884" y="282.7907" width="803.7209" height="178.6047" rx="7.4419" fill="#fff3cd" stroke="#ffc107" stroke-width="2.2326" />
  <ns0:text x="223.2558" y="315.5349" font-family="monospace" font-size="16.3721" fill="#333">Generated SQL:</ns0:text>
  <ns0:text x="223.2558" y="342.3256" font-family="monospace" font-size="14.8837" fill="#555">SELECT c.name, SUM(o.amount) as total_revenue</ns0:text>
  <ns0:text x="223.2558" y="364.6512" font-family="monospace" font-size="14.8837" fill="#555">FROM customers c</ns0:text>
  <ns0:text x="223.2558" y="386.9767" font-family="monospace" font-size="14.8837" fill="#555">JOIN orders o ON c.id = o.customer_id</ns0:text>
  <ns0:text x="223.2558" y="409.3023" font-family="monospace" font-size="14.8837" fill="#555">WHERE o.date &gt;= DATE_TRUNC('quarter', CURRENT_DATE)</ns0:text>
  <ns0:text x="223.2558" y="431.6279" font-family="monospace" font-size="14.8837" fill="#555">GROUP BY c.name ORDER BY total_revenue DESC LIMIT 5;</ns0:text>
  <ns0:line x1="595.3488" y1="461.3953" x2="595.3488" y2="506.0465" stroke="#28a745" stroke-width="2.2326" marker-end="url(#arrow)" />
  <ns0:rect x="253.0233" y="506.0465" width="684.6512" height="133.9535" rx="7.4419" fill="#d4edda" stroke="#28a745" stroke-width="2.2326" />
  <ns0:text x="282.7907" y="543.2558" font-family="Arial, sans-serif" font-size="17.8605" font-weight="bold" fill="#333">Natural Language Response:</ns0:text>
  <ns0:text x="282.7907" y="573.0233" font-family="Arial, sans-serif" font-size="16.3721" fill="#555">"The top 5 customers by revenue this quarter are:</ns0:text>
  <ns0:text x="297.6744" y="598.3256" font-family="Arial, sans-serif" font-size="16.3721" fill="#555">1. Acme Corp -- $245,000</ns0:text>
  <ns0:text x="297.6744" y="623.6279" font-family="Arial, sans-serif" font-size="16.3721" fill="#555">2. TechStart Inc -- $198,000 ..."</ns0:text>
</ns0:svg>
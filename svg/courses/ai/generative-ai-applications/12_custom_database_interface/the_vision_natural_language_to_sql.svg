<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="327.4419" y="14.8837" width="535.814" height="59.5349" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="595.3488" y="52.093" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8605" fill="var(--text)">"Show me the top 5 customers by revenue this quarter"</text>
  <line x1="595.3488" y1="74.4186" x2="595.3488" y2="119.0698" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="372.093" y="119.0698" width="446.5116" height="119.0698" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="595.3488" y="156.2791" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8372" font-weight="bold" fill="var(--text)">LLM-Powered Database Interface</text>
  <text x="595.3488" y="193.4884" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.8605" fill="var(--text-muted)">NL &gt; SQL &gt; Execute &gt; NL</text>
  <text x="595.3488" y="220.2791" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.3721" fill="var(--text-muted)">Natural Language to SQL Pipeline</text>
  <line x1="595.3488" y1="238.1395" x2="595.3488" y2="282.7907" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="193.4884" y="282.7907" width="803.7209" height="178.6047" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="223.2558" y="315.5349" font-family="monospace" font-size="16.3721" fill="var(--text)">Generated SQL:</text>
  <text x="223.2558" y="342.3256" font-family="monospace" font-size="14.8837" fill="var(--text-muted)">SELECT c.name, SUM(o.amount) as total_revenue</text>
  <text x="223.2558" y="364.6512" font-family="monospace" font-size="14.8837" fill="var(--text-muted)">FROM customers c</text>
  <text x="223.2558" y="386.9767" font-family="monospace" font-size="14.8837" fill="var(--text-muted)">JOIN orders o ON c.id = o.customer_id</text>
  <text x="223.2558" y="409.3023" font-family="monospace" font-size="14.8837" fill="var(--text-muted)">WHERE o.date &gt;= DATE_TRUNC('quarter', CURRENT_DATE)</text>
  <text x="223.2558" y="431.6279" font-family="monospace" font-size="14.8837" fill="var(--text-muted)">GROUP BY c.name ORDER BY total_revenue DESC LIMIT 5;</text>
  <line x1="595.3488" y1="461.3953" x2="595.3488" y2="506.0465" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="253.0233" y="506.0465" width="684.6512" height="133.9535" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="282.7907" y="543.2558" font-family="Arial, sans-serif" font-size="17.8605" font-weight="bold" fill="var(--text)">Natural Language Response:</text>
  <text x="282.7907" y="573.0233" font-family="Arial, sans-serif" font-size="16.3721" fill="var(--text-muted)">"The top 5 customers by revenue this quarter are:</text>
  <text x="297.6744" y="598.3256" font-family="Arial, sans-serif" font-size="16.3721" fill="var(--text-muted)">1. Acme Corp -- $245,000</text>
  <text x="297.6744" y="623.6279" font-family="Arial, sans-serif" font-size="16.3721" fill="var(--text-muted)">2. TechStart Inc -- $198,000 ..."</text>
</svg>
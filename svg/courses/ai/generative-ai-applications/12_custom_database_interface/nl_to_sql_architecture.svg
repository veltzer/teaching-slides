  <rect x="475" y="238.703703703704" width="195" height="107.407407407408" rx="8.291003602746" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="572" y="270.925925925926" text-anchor="middle" font-size="14.509256304805" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">LLM (answer)</text>
  <text x="572" y="297.777777777777" text-anchor="middle" font-size="12.436505404119" fill="var(--info-text)" font-family="Arial, sans-serif">Format rows + question</text>

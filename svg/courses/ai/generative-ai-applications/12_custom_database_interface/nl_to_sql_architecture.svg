  <text x="265" y="478.222222222222" font-size="12.436505404119" fill="var(--info-text)" text-anchor="middle" font-family="Arial, sans-serif">LLM</text>
  <rect x="340" y="453.518518518519" width="130" height="37.592592592593" rx="6.218252702059" fill="var(--warn-accent)"/>
  <text x="405" y="478.222222222222" font-size="12.436505404119" fill="var(--warn-text)" text-anchor="middle" font-family="Arial, sans-serif">SQL</text>
  <rect x="480" y="453.518518518519" width="130" height="37.592592592593" rx="6.218252702059" fill="var(--danger-accent)"/>
  <text x="545" y="478.222222222222" font-size="12.436505404119" fill="var(--danger-text)" text-anchor="middle" font-family="Arial, sans-serif">Validate</text>

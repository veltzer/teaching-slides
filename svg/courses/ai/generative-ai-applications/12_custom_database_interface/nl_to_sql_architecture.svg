  <text x="125" y="537.296296296296" font-size="12.436505404119" fill="var(--ok-text)" text-anchor="middle" font-family="Arial, sans-serif">Execute</text>
  <rect x="200" y="512.592592592593" width="130" height="37.592592592593" rx="6.218252702059" fill="var(--primary-accent)"/>
  <text x="265" y="537.296296296296" font-size="12.436505404119" fill="var(--primary-text)" text-anchor="middle" font-family="Arial, sans-serif">Rows</text>
  <rect x="340" y="512.592592592593" width="130" height="37.592592592593" rx="6.218252702059" fill="var(--info-accent)"/>

  <text x="764.4444" y="99.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)" text-anchor="middle">Database</text>
  <text x="764.4444" y="128.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">PostgreSQL</text>
  <text x="764.4444" y="144.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">SQLite / MySQL</text>
  <text x="764.4444" y="160.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">BigQuery / Snowflake</text>
  <line x1="764.4444" y1="177.7778" x2="764.4444" y2="240" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="777.7778" y="213.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">raw rows</text>

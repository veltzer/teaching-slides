  <line x1="551.1111" y1="280" x2="631.1111" y2="280" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="3.5556 2.6667" />
  <rect x="408.8889" y="240" width="177.7778" height="88.8889" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2" />
  <rect x="408.8889" y="240" width="177.7778" height="30.2222" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="408.8889" y="259.5556" width="177.7778" height="10.6667" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="497.7778" y="259.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)" text-anchor="middle">LLM (answer)</text>
  <text x="497.7778" y="288.8889" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">interprets raw rows +</text>

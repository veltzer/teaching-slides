<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389410762361" font-weight="bold" fill="var(--text)">NL to SQL Architecture</text>

  <rect x="40" y="71.071428571429" width="160" height="103.571428571429" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="112.5" text-anchor="middle" font-size="15.265507337973" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">User Question</text>
  <text x="120" y="143.571428571429" text-anchor="middle" font-size="13.230106359577" fill="var(--primary-text)" font-family="Arial, sans-serif">natural language</text>

  <line x1="200" y1="122.857142857143" x2="265" y2="122.857142857143" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="60.714285714286" width="200" height="145" rx="8.141603913586" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="96.964285714286" text-anchor="middle" font-size="16.283207827171" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">LLM + Schema</text>
  <text x="370" y="128.035714285714" text-anchor="middle" font-size="13.230106359577" fill="var(--info-text)" font-family="Arial, sans-serif">GPT-4 / Claude</text>
  <text x="370" y="153.928571428571" text-anchor="middle" font-size="13.230106359577" fill="var(--info-text)" font-family="Arial, sans-serif">Generates SQL</text>
  <text x="370" y="179.821428571429" text-anchor="middle" font-size="12.212405870379" fill="var(--info-text)" font-family="Arial, sans-serif">NL -&gt; SQL</text>

  <rect x="295" y="257.5" width="150" height="82.857142857143" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="288.571428571429" text-anchor="middle" font-size="14.247806848775" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">DB Schema</text>
  <text x="370" y="314.464285714286" text-anchor="middle" font-size="13.230106359577" fill="var(--warn-text)" font-family="Courier New, monospace">tables, types</text>
  <line x1="370" y1="257.5" x2="370" y2="207.785714285714" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-warn)"/>

  <line x1="470" y1="122.857142857143" x2="535" y2="122.857142857143" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="71.071428571429" width="200" height="103.571428571429" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="107.321428571429" text-anchor="middle" font-size="15.265507337973" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">SQL Query</text>
  <text x="640" y="143.571428571429" text-anchor="middle" font-size="13.230106359577" fill="var(--warn-text)" font-family="Courier New, monospace">SELECT name FROM users</text>

  <line x1="740" y1="122.857142857143" x2="805" y2="122.857142857143" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="810" y="60.714285714286" width="180" height="145" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="96.964285714286" text-anchor="middle" font-size="16.283207827171" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Database</text>
  <text x="900" y="128.035714285714" text-anchor="middle" font-size="13.230106359577" fill="var(--ok-text)" font-family="Arial, sans-serif">Postgres / MySQL</text>
  <text x="900" y="153.928571428571" text-anchor="middle" font-size="13.230106359577" fill="var(--ok-text)" font-family="Arial, sans-serif">SQLite</text>
  <text x="900" y="179.821428571429" text-anchor="middle" font-size="13.230106359577" fill="var(--ok-text)" font-family="Arial, sans-serif">BigQuery</text>

  <line x1="900" y1="205.714285714286" x2="900" y2="252.321428571429" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="810" y="257.5" width="180" height="82.857142857143" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="288.571428571429" text-anchor="middle" font-size="14.247806848775" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Raw Results</text>
  <text x="900" y="314.464285714286" text-anchor="middle" font-size="13.230106359577" fill="var(--ok-text)" font-family="Courier New, monospace">[(Alice,), (Bob,)]</text>

  <line x1="810" y1="293.75" x2="675" y2="293.75" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="475" y="252.321428571429" width="195" height="103.571428571429" rx="8.141603913586" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="572" y="283.392857142857" text-anchor="middle" font-size="14.247806848775" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">LLM (answer)</text>
  <text x="572" y="309.285714285714" text-anchor="middle" font-size="12.212405870379" fill="var(--info-text)" font-family="Arial, sans-serif">Format rows + question</text>
  <text x="572" y="335.178571428571" text-anchor="middle" font-size="12.212405870379" fill="var(--info-text)" font-family="Arial, sans-serif">-&gt; NL answer</text>

  <line x1="475" y1="293.75" x2="280" y2="293.75" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="252.321428571429" width="200" height="103.571428571429" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="283.392857142857" text-anchor="middle" font-size="14.247806848775" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">NL Answer</text>
  <text x="180" y="309.285714285714" text-anchor="middle" font-size="12.212405870379" fill="var(--primary-text)" font-family="Arial, sans-serif">"There are 2 users:</text>
  <text x="180" y="330" text-anchor="middle" font-size="12.212405870379" fill="var(--primary-text)" font-family="Arial, sans-serif">Alice and Bob"</text>

  <line x1="180" y1="252.321428571429" x2="180" y2="179.821428571429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="180" y1="179.821428571429" x2="120" y2="179.821428571429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="1010" y="60.714285714286" width="230" height="290" rx="8.141603913586" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1125" y="96.964285714286" text-anchor="middle" font-size="15.265507337973" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">SQL Validation</text>
  <text x="1025" y="138.392857142857" font-size="13.230106359577" fill="var(--danger-text)" font-family="Arial, sans-serif">Block DROP/DELETE</text>
  <text x="1025" y="169.464285714286" font-size="13.230106359577" fill="var(--danger-text)" font-family="Courier New, monospace">LIMIT 100</text>
  <text x="1025" y="200.535714285714" font-size="13.230106359577" fill="var(--danger-text)" font-family="Arial, sans-serif">Whitelist tables</text>
  <text x="1025" y="257.5" font-size="12.212405870379" fill="var(--danger-text)" font-family="Arial, sans-serif">Schema injection</text>
  <text x="1025" y="278.214285714286" font-size="12.212405870379" fill="var(--danger-text)" font-family="Arial, sans-serif">is critical</text>
  <text x="1025" y="319.642857142857" font-size="12.212405870379" fill="var(--danger-text)" font-family="Arial, sans-serif">Sample values help</text>

  <rect x="40" y="392.142857142857" width="1200" height="227.857142857143" rx="8.141603913586" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="428.392857142857" text-anchor="middle" font-size="18.318608805568" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pipeline Summary</text>
  <rect x="60" y="459.464285714286" width="130" height="36.25" rx="6.106202935189" fill="var(--primary-accent)"/>
  <text x="125" y="483.285714285714" font-size="12.212405870379" fill="var(--primary-text)" text-anchor="middle" font-family="Arial, sans-serif">Question</text>
  <rect x="200" y="459.464285714286" width="130" height="36.25" rx="6.106202935189" fill="var(--info-accent)"/>
  <text x="265" y="483.285714285714" font-size="12.212405870379" fill="var(--info-text)" text-anchor="middle" font-family="Arial, sans-serif">LLM</text>
  <rect x="340" y="459.464285714286" width="130" height="36.25" rx="6.106202935189" fill="var(--warn-accent)"/>
  <text x="405" y="483.285714285714" font-size="12.212405870379" fill="var(--warn-text)" text-anchor="middle" font-family="Arial, sans-serif">SQL</text>
  <rect x="480" y="459.464285714286" width="130" height="36.25" rx="6.106202935189" fill="var(--danger-accent)"/>
  <text x="545" y="483.285714285714" font-size="12.212405870379" fill="var(--danger-text)" text-anchor="middle" font-family="Arial, sans-serif">Validate</text>
  <rect x="60" y="516.428571428572" width="130" height="36.25" rx="6.106202935189" fill="var(--ok-accent)"/>
  <text x="125" y="540.25" font-size="12.212405870379" fill="var(--ok-text)" text-anchor="middle" font-family="Arial, sans-serif">Execute</text>
  <rect x="200" y="516.428571428572" width="130" height="36.25" rx="6.106202935189" fill="var(--primary-accent)"/>
  <text x="265" y="540.25" font-size="12.212405870379" fill="var(--primary-text)" text-anchor="middle" font-family="Arial, sans-serif">Rows</text>
  <rect x="340" y="516.428571428572" width="130" height="36.25" rx="6.106202935189" fill="var(--info-accent)"/>
  <text x="405" y="540.25" font-size="12.212405870379" fill="var(--info-text)" text-anchor="middle" font-family="Arial, sans-serif">Format</text>
  <rect x="480" y="516.428571428572" width="130" height="36.25" rx="6.106202935189" fill="var(--primary-accent)"/>
  <text x="545" y="540.25" font-size="12.212405870379" fill="var(--primary-text)" text-anchor="middle" font-family="Arial, sans-serif">Answer</text>
  <text x="640" y="594.107142857143" text-anchor="middle" font-size="13.230106359577" fill="var(--text-muted)" font-family="Arial, sans-serif">Schema injection enables correct SQL</text>
</svg>

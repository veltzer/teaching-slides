  <text x="751.1111" y="549.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">6. Raw results</text>
  <line x1="804.4444" y1="544.8889" x2="826.6667" y2="544.8889" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />

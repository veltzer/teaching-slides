  <line x1="475" y1="281.666666666667" x2="280" y2="281.666666666667" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="80" y="238.703703703704" width="200" height="107.407407407408" rx="8.291003602746" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="270.925925925926" text-anchor="middle" font-size="14.509256304805" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">NL Answer</text>
  <text x="180" y="297.777777777777" text-anchor="middle" font-size="12.436505404119" fill="var(--primary-text)" font-family="Arial, sans-serif">"There are 2 users:</text>
  <text x="180" y="319.259259259259" text-anchor="middle" font-size="12.436505404119" fill="var(--primary-text)" font-family="Arial, sans-serif">Alice and Bob"</text>

  <line x1="180" y1="238.703703703704" x2="180" y2="163.518518518519" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="180" y1="163.518518518519" x2="120" y2="163.518518518519" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="1010" y="40" width="230" height="300.740740740741" rx="8.291003602746" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1125" y="77.592592592593" text-anchor="middle" font-size="15.545631755148" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">SQL Validation</text>
  <text x="1025" y="120.555555555555" font-size="13.472880854462" fill="var(--danger-text)" font-family="Arial, sans-serif">Block DROP/DELETE</text>
  <text x="1025" y="152.777777777778" font-size="13.472880854462" fill="var(--danger-text)" font-family="Courier New, monospace">LIMIT 100</text>
  <text x="1025" y="184.999999999999" font-size="13.472880854462" fill="var(--danger-text)" font-family="Arial, sans-serif">Whitelist tables</text>
  <text x="1025" y="244.074074074074" font-size="12.436505404119" fill="var(--danger-text)" font-family="Arial, sans-serif">Schema injection</text>
  <text x="1025" y="265.555555555556" font-size="12.436505404119" fill="var(--danger-text)" font-family="Arial, sans-serif">is critical</text>
  <text x="1025" y="308.518518518518" font-size="12.436505404119" fill="var(--danger-text)" font-family="Arial, sans-serif">Sample values help</text>

  <rect x="40" y="383.703703703703" width="1200" height="236.296296296297" rx="8.291003602746" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="421.296296296296" text-anchor="middle" font-size="18.654758106178" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pipeline Summary</text>

  <rect x="311.875" y="273.6111" width="131.25" height="64.4444" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="377.5" y="294.5556" font-family="Arial,sans-serif" font-size="10.4284" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">DB Schema</text>
  <text x="377.5" y="309.0556" font-family="monospace" font-size="10" fill="var(--text-muted)" text-anchor="middle">tables, columns</text>
  <text x="377.5" y="321.9444" font-family="monospace" font-size="10" fill="var(--text-muted)" text-anchor="middle">types, samples</text>
  <line x1="377.5" y1="273.6111" x2="377.5" y2="209.1667" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" marker-end="url(#arrow)" />

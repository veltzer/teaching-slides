  <rect x="168.8889" y="240" width="177.7778" height="88.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="168.8889" y="240" width="177.7778" height="30.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="168.8889" y="259.5556" width="177.7778" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="257.7778" y="259.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)" text-anchor="middle">NL Answer</text>
  <text x="257.7778" y="288.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">"There are 2 users:</text>
  <text x="257.7778" y="304.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text)" text-anchor="middle">Alice and Bob."</text>
  <text x="257.7778" y="319.1111" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">(shown to user)</text>
  <line x1="168.8889" y1="284.4444" x2="97.7778" y2="284.4444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="97.7778" y1="284.4444" x2="97.7778" y2="160" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="471.1111" y="373.3333" width="177.7778" height="80" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="560" y="394.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">SQL Validation</text>
  <text x="488.8889" y="412.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">• Block DROP/DELETE/UPDATE</text>
  <text x="488.8889" y="428.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">• Limit rows (LIMIT 100)</text>
  <text x="488.8889" y="444.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">• Whitelist allowed tables</text>
  <line x1="551.1111" y1="328.8889" x2="551.1111" y2="373.3333" stroke="var(--danger-border)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" marker-end="url(#arrow)" />
  <text x="564.4444" y="355.5556" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">validate</text>

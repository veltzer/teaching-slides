  <text x="846.2499" y="171.3056" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)" text-anchor="middle">SQLite / MySQL</text>
  <text x="846.2499" y="185.8056" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)" text-anchor="middle">BigQuery / Snowflake</text>
  <line x1="846.2499" y1="201.1111" x2="846.2499" y2="257.5" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />

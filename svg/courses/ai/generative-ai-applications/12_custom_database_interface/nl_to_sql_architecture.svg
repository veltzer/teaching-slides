  <text x="900" y="276.296296296297" text-anchor="middle" font-size="14.509256304805" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Raw Results</text>
  <text x="900" y="303.148148148148" text-anchor="middle" font-size="13.472880854462" fill="var(--ok-text)" font-family="Courier New, monospace">[(Alice,), (Bob,)]</text>


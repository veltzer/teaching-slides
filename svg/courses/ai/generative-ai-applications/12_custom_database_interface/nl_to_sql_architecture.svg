  <text x="440" y="111.1111" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">SQL text</text>
  <rect x="471.1111" y="88.8889" width="160" height="71.1111" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="551.1111" y="115.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Generated</text>
  <text x="551.1111" y="131.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">SQL Query</text>
  <text x="551.1111" y="151.1111" font-family="monospace" font-size="10" fill="var(--text-muted)" text-anchor="middle">SELECT name FROM users</text>

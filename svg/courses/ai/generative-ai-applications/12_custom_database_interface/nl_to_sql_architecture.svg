  <rect x="44.4444" y="531.5556" width="97.7778" height="26.6667" rx="6" fill="var(--primary-accent)" />
  <text x="93.3333" y="549.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">1. NL question</text>

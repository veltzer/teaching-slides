  <rect x="295" y="244.074074074074" width="150" height="85.925925925926" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="276.296296296297" text-anchor="middle" font-size="14.509256304805" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">DB Schema</text>
  <text x="370" y="303.148148148148" text-anchor="middle" font-size="13.472880854462" fill="var(--warn-text)" font-family="Courier New, monospace">tables, types</text>
  <line x1="370" y1="244.074074074074" x2="370" y2="192.518518518518" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-warn)"/>

  <line x1="470" y1="104.444444444444" x2="535" y2="104.444444444444" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="540" y="50.740740740741" width="200" height="107.407407407408" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="88.333333333334" text-anchor="middle" font-size="15.545631755148" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">SQL Query</text>
  <text x="640" y="125.925925925926" text-anchor="middle" font-size="13.472880854462" fill="var(--warn-text)" font-family="Courier New, monospace">SELECT name FROM users</text>

  <line x1="740" y1="104.444444444444" x2="805" y2="104.444444444444" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>


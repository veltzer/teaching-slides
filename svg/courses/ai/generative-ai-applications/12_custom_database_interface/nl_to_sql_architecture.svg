  <text x="900" y="109.814814814814" text-anchor="middle" font-size="13.472880854462" fill="var(--ok-text)" font-family="Arial, sans-serif">Postgres / MySQL</text>
  <text x="900" y="136.666666666666" text-anchor="middle" font-size="13.472880854462" fill="var(--ok-text)" font-family="Arial, sans-serif">SQLite</text>
  <text x="900" y="163.518518518519" text-anchor="middle" font-size="13.472880854462" fill="var(--ok-text)" font-family="Arial, sans-serif">BigQuery</text>

  <line x1="900" y1="190.37037037037" x2="900" y2="238.703703703704" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>


  <rect x="218.125" y="275.2223" width="187.5" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="311.875" y="275.2223" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--bg)" text-anchor="middle">NL Answer</text>

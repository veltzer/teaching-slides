<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="59.01638" width="157.377063" height="95.082018" rx="6.676943" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.688531" y="95.147632" font-size="13.538948" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">User</text>
  <text x="118.688531" y="116.06552" font-size="13.538948" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Question</text>
  <text x="118.688531" y="136.983644" font-size="11.128238" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(natural language)</text>
  <line x1="197.377063" y1="106.557507" x2="266.229528" y2="106.557507" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="231.803295" y="97.049258" font-size="11.128238" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">NL query</text>
  <rect x="266.229528" y="40" width="196.721329" height="142.622908" rx="6.676943" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="266.229528" y="40" width="196.721329" height="32.327881" rx="6.676943" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="266.229528" y="60.918124" width="196.721329" height="11.409875" fill="url(#grad-info)" rx="6.676943" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="364.590192" y="60.918124" font-size="13.538948" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">LLM + Schema</text>
  <text x="364.590192" y="92.295133" font-size="11.604972" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">GPT-4o / Claude</text>
  <text x="364.590192" y="109.409887" font-size="11.128238" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">receives table names,</text>
  <text x="364.590192" y="124.622896" font-size="11.128238" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">columns, sample rows</text>
  <text x="364.590192" y="141.73765" font-size="11.128238" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">generates SQL query</text>
  <text x="364.590192" y="158.852404" font-size="11.128238" fill="var(--info-accent)" text-anchor="middle" font-style="italic" font-family="Arial, sans-serif">NL → SQL translation</text>
  <rect x="295.737727" y="258.688546" width="137.70493" height="76.06552" rx="6.676943" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="364.590192" y="283.409922" font-size="11.604972" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">DB Schema</text>
  <text x="364.590192" y="300.524676" font-size="11.128238" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">tables, columns</text>
  <text x="364.590192" y="315.737686" font-size="11.128238" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">types, samples</text>
  <line x1="364.590192" y1="258.688546" x2="364.590192" y2="182.623026" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" marker-end="url(#arrow)" />
  <text x="379.344292" y="225.409911" font-size="11.128238" fill="var(--warn-accent)" font-family="Arial, sans-serif">injects</text>
  <line x1="462.950857" y1="111.311513" x2="531.803322" y2="111.311513" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="497.377089" y="101.803264" font-size="11.128238" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">SQL text</text>
  <rect x="531.803322" y="78.032878" width="177.049196" height="76.06552" rx="6.676943" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620.32792" y="106.557507" font-size="13.538948" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Generated</text>

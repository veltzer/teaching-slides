  <text x="320" y="164.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--info-accent)" text-anchor="middle" font-style="italic">NL → SQL translation</text>
  <rect x="257.7778" y="257.7778" width="124.4444" height="71.1111" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="320" y="280.8889" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">DB Schema</text>
  <text x="320" y="296.8889" font-family="monospace" font-size="10" fill="var(--text-muted)" text-anchor="middle">tables, columns</text>
  <text x="320" y="311.1111" font-family="monospace" font-size="10" fill="var(--text-muted)" text-anchor="middle">types, samples</text>
  <line x1="320" y1="257.7778" x2="320" y2="186.6667" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="4.4444 3.5556" marker-end="url(#arrow)" />
  <text x="333.3333" y="226.6667" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)">injects</text>

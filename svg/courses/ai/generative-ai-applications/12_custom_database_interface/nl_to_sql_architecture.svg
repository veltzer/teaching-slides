  <text x="555.625" y="413.7777" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">• Block DROP/DELETE/UPDATE</text>
  <text x="555.625" y="428.2777" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">• Limit rows (LIMIT 100)</text>

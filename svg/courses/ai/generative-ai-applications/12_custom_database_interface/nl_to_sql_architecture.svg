  <text x="856.393409" y="270.098303" font-size="12.572016" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Query</text>
  <text x="856.393409" y="287.213057" font-size="12.572016" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Results</text>

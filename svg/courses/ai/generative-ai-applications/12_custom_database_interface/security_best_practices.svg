<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="573.1343" height="165.714239030611" rx="6.262131180487" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.5671" y="87.642853252551" text-anchor="middle" font-size="24.244675816078" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">1. READ-ONLY ACCESS</text>
  <text x="326.5671" y="133.214320727042" text-anchor="middle" font-size="20.514741747274" fill="var(--text-muted)" font-family="Arial, sans-serif">Create a read-only database user</text>
  <text x="326.5671" y="170.500027232144" text-anchor="middle" font-size="18.649774712872" fill="var(--text-muted)" font-family="Arial, sans-serif">PRAGMA query_only = ON</text>
  <rect x="666.8657" y="40" width="573.1343" height="165.714239030611" rx="6.262131180487" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.4329" y="87.642853252551" text-anchor="middle" font-size="24.244675816078" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2. QUERY ALLOWLIST</text>
  <text x="953.4329" y="133.214320727042" text-anchor="middle" font-size="20.514741747274" fill="var(--text-muted)" font-family="Arial, sans-serif">Only allow SELECT statements</text>
  <text x="953.4329" y="170.500027232144" text-anchor="middle" font-size="18.649774712872" fill="var(--text-muted)" font-family="Arial, sans-serif">Block system tables and metadata</text>
  <rect x="40" y="247.142826020407" width="573.1343" height="165.714239030611" rx="6.262131180487" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.5671" y="294.785679272958" text-anchor="middle" font-size="24.244675816078" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. ROW LIMITS</text>
  <text x="326.5671" y="340.357146747449" text-anchor="middle" font-size="20.514741747274" fill="var(--text-muted)" font-family="Arial, sans-serif">Always add LIMIT clauses</text>
  <text x="326.5671" y="377.642853252551" text-anchor="middle" font-size="18.649774712872" fill="var(--text-muted)" font-family="Arial, sans-serif">Prevent full table scans</text>
  <rect x="666.8657" y="247.142826020407" width="573.1343" height="165.714239030611" rx="6.262131180487" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.4329" y="294.785679272958" text-anchor="middle" font-size="24.244675816078" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">4. TIMEOUT</text>
  <text x="953.4329" y="340.357146747449" text-anchor="middle" font-size="20.514741747274" fill="var(--text-muted)" font-family="Arial, sans-serif">Set query execution timeout</text>
  <text x="953.4329" y="377.642853252551" text-anchor="middle" font-size="18.649774712872" fill="var(--text-muted)" font-family="Arial, sans-serif">Prevent resource exhaustion</text>
  <rect x="40" y="454.285760969389" width="573.1343" height="165.714239030611" rx="6.262131180487" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.5671" y="501.92861422194" text-anchor="middle" font-size="24.244675816078" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">5. AUDIT LOGGING</text>
  <text x="326.5671" y="547.499972767856" text-anchor="middle" font-size="20.514741747274" fill="var(--text-muted)" font-family="Arial, sans-serif">Log all generated SQL</text>
  <text x="326.5671" y="584.785679272958" text-anchor="middle" font-size="18.649774712872" fill="var(--text-muted)" font-family="Arial, sans-serif">Monitor for suspicious patterns</text>
  <rect x="666.8657" y="454.285760969389" width="573.1343" height="165.714239030611" rx="6.262131180487" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.4329" y="501.92861422194" text-anchor="middle" font-size="24.244675816078" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">6. SENSITIVE COLUMN FILTERING</text>
  <text x="953.4329" y="547.499972767856" text-anchor="middle" font-size="20.514741747274" fill="var(--text-muted)" font-family="Arial, sans-serif">Exclude PII columns from schema</text>
  <text x="953.4329" y="584.785679272958" text-anchor="middle" font-size="18.649774712872" fill="var(--text-muted)" font-family="Arial, sans-serif">Block queries to sensitive tables</text>
</svg>

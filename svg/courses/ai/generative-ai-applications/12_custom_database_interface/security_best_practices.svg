<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="48" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Database Interface Security</text>
  <rect x="68.2667" y="88" width="546.1333" height="128" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <text x="341.3333" y="124.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#dc3545">1. READ-ONLY ACCESS</text>
  <text x="341.3333" y="160" text-anchor="middle" font-size="17.6" fill="#555">Create a read-only database user</text>
  <text x="341.3333" y="188.8" text-anchor="middle" font-size="16" fill="#666">PRAGMA query_only = ON</text>
  <rect x="665.6" y="88" width="546.1333" height="128" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <text x="938.6667" y="124.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#dc3545">2. QUERY ALLOWLIST</text>
  <text x="938.6667" y="160" text-anchor="middle" font-size="17.6" fill="#555">Only allow SELECT statements</text>
  <text x="938.6667" y="188.8" text-anchor="middle" font-size="16" fill="#666">Block system tables and metadata</text>
  <rect x="68.2667" y="248" width="546.1333" height="128" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="341.3333" y="284.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#bf360c">3. ROW LIMITS</text>
  <text x="341.3333" y="320" text-anchor="middle" font-size="17.6" fill="#555">Always add LIMIT clauses</text>
  <text x="341.3333" y="348.8" text-anchor="middle" font-size="16" fill="#666">Prevent full table scans</text>
  <rect x="665.6" y="248" width="546.1333" height="128" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="938.6667" y="284.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#bf360c">4. TIMEOUT</text>
  <text x="938.6667" y="320" text-anchor="middle" font-size="17.6" fill="#555">Set query execution timeout</text>
  <text x="938.6667" y="348.8" text-anchor="middle" font-size="16" fill="#666">Prevent resource exhaustion</text>
  <rect x="68.2667" y="408" width="546.1333" height="128" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="341.3333" y="444.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#4a90e2">5. AUDIT LOGGING</text>
  <text x="341.3333" y="480" text-anchor="middle" font-size="17.6" fill="#555">Log all generated SQL</text>
  <text x="341.3333" y="508.8" text-anchor="middle" font-size="16" fill="#666">Monitor for suspicious patterns</text>
  <rect x="665.6" y="408" width="546.1333" height="128" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="938.6667" y="444.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#4a90e2">6. SENSITIVE COLUMN FILTERING</text>
  <text x="938.6667" y="480" text-anchor="middle" font-size="17.6" fill="#555">Exclude PII columns from schema</text>
  <text x="938.6667" y="508.8" text-anchor="middle" font-size="16" fill="#666">Block queries to sensitive tables</text>
</svg>
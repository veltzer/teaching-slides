<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="48" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">Database Interface Security</text>
  <rect x="68.2667" y="88" width="546.1333" height="128" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="341.3333" y="124.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--danger-accent)">1. READ-ONLY ACCESS</text>
  <text x="341.3333" y="160" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">Create a read-only database user</text>
  <text x="341.3333" y="188.8" text-anchor="middle" font-size="16" fill="var(--text-muted)">PRAGMA query_only = ON</text>
  <rect x="665.6" y="88" width="546.1333" height="128" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="938.6667" y="124.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--danger-accent)">2. QUERY ALLOWLIST</text>
  <text x="938.6667" y="160" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">Only allow SELECT statements</text>
  <text x="938.6667" y="188.8" text-anchor="middle" font-size="16" fill="var(--text-muted)">Block system tables and metadata</text>
  <rect x="68.2667" y="248" width="546.1333" height="128" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="341.3333" y="284.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--danger-accent)">3. ROW LIMITS</text>
  <text x="341.3333" y="320" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">Always add LIMIT clauses</text>
  <text x="341.3333" y="348.8" text-anchor="middle" font-size="16" fill="var(--text-muted)">Prevent full table scans</text>
  <rect x="665.6" y="248" width="546.1333" height="128" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="938.6667" y="284.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--danger-accent)">4. TIMEOUT</text>
  <text x="938.6667" y="320" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">Set query execution timeout</text>
  <text x="938.6667" y="348.8" text-anchor="middle" font-size="16" fill="var(--text-muted)">Prevent resource exhaustion</text>
  <rect x="68.2667" y="408" width="546.1333" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="341.3333" y="444.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--primary-accent)">5. AUDIT LOGGING</text>
  <text x="341.3333" y="480" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">Log all generated SQL</text>
  <text x="341.3333" y="508.8" text-anchor="middle" font-size="16" fill="var(--text-muted)">Monitor for suspicious patterns</text>
  <rect x="665.6" y="408" width="546.1333" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="938.6667" y="444.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--primary-accent)">6. SENSITIVE COLUMN FILTERING</text>
  <text x="938.6667" y="480" text-anchor="middle" font-size="17.6" fill="var(--text-muted)">Exclude PII columns from schema</text>
  <text x="938.6667" y="508.8" text-anchor="middle" font-size="16" fill="var(--text-muted)">Block queries to sensitive tables</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="26.6667" width="337.7778" height="39.1111" rx="6" fill="var(--text-muted)" />
  <text x="195.5556" y="51.5556" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)" text-anchor="middle">Zero-Shot</text>
  <rect x="400" y="26.6667" width="337.7778" height="39.1111" rx="6" fill="var(--primary-accent)" />
  <text x="568.8889" y="51.5556" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)" text-anchor="middle">One-Shot</text>
  <rect x="773.3333" y="26.6667" width="337.7778" height="39.1111" rx="6" fill="var(--ok-accent)" />
  <text x="942.2222" y="51.5556" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)" text-anchor="middle">Few-Shot</text>
  <rect x="26.6667" y="80" width="337.7778" height="257.7778" rx="6" fill="var(--surface)" filter="url(#shadow)" />
  <text x="44.4444" y="104.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)">PROMPT:</text>
  <rect x="44.4444" y="113.7778" width="302.2222" height="49.7778" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889" />
  <text x="195.5556" y="132.4444" font-family="monospace" font-size="10.6667" fill="var(--text)" text-anchor="middle">Classify the sentiment of:</text>
  <text x="195.5556" y="148.4444" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)" text-anchor="middle">"The movie was fantastic!"</text>
  <text x="44.4444" y="186.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)">NO EXAMPLES — relies on pre-training</text>
  <rect x="44.4444" y="197.3333" width="302.2222" height="88.8889" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889" />
  <text x="195.5556" y="220.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Task description only</text>
  <text x="195.5556" y="238.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">No format examples</text>
  <text x="195.5556" y="256" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Model uses general knowledge</text>
  <text x="195.5556" y="273.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Fastest, cheapest</text>
  <text x="44.4444" y="320" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)">MODEL OUTPUT:</text>
  <rect x="44.4444" y="328.8889" width="302.2222" height="21.3333" rx="6" fill="var(--border)" />
  <text x="195.5556" y="343.1111" font-family="monospace" font-size="11.5556" fill="var(--text)" text-anchor="middle">Positive</text>
  <rect x="400" y="80" width="337.7778" height="257.7778" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="417.7778" y="104.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--primary-accent)">PROMPT:</text>
  <rect x="417.7778" y="113.7778" width="302.2222" height="88.8889" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="568.8889" y="133.3333" font-family="monospace" font-size="10.6667" fill="var(--text)" text-anchor="middle">Classify the sentiment:</text>
  <text x="568.8889" y="151.1111" font-family="monospace" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Input: "It was terrible."</text>
  <text x="568.8889" y="167.1111" font-family="monospace" font-size="10.6667" fill="var(--ok-accent)" text-anchor="middle">Label: Negative</text>
  <text x="568.8889" y="186.6667" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)" text-anchor="middle">Input: "The movie was fantastic!"</text>
  <text x="568.8889" y="202.6667" font-family="monospace" font-size="10.6667" fill="var(--danger-accent)" text-anchor="middle">Label: ???</text>
  <text x="417.7778" y="220.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--primary-accent)">ONE EXAMPLE provided:</text>
  <rect x="417.7778" y="229.3333" width="302.2222" height="62.2222" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="568.8889" y="247.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Shows desired input/output format</text>
  <text x="568.8889" y="264.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Helps model understand task</text>
  <text x="568.8889" y="282.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Costs a few extra tokens</text>
  <text x="417.7778" y="320" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--primary-accent)">MODEL OUTPUT:</text>
  <rect x="417.7778" y="328.8889" width="302.2222" height="21.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="343.1111" font-family="monospace" font-size="11.5556" fill="var(--text)" text-anchor="middle">Positive</text>
  <rect x="773.3333" y="80" width="337.7778" height="257.7778" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="791.1111" y="104.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)">PROMPT:</text>
  <rect x="791.1111" y="113.7778" width="302.2222" height="149.3333" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="942.2222" y="131.5556" font-family="monospace" font-size="10" fill="var(--text)" text-anchor="middle">Classify the sentiment:</text>
  <text x="791.1111" y="147.5556" font-family="monospace" font-size="10" fill="var(--text-muted)" dx="10">Input: "Absolutely loved it!"</text>
  <text x="791.1111" y="161.7778" font-family="monospace" font-size="10" fill="var(--ok-accent)" dx="10">Label: Positive</text>
  <text x="791.1111" y="177.7778" font-family="monospace" font-size="10" fill="var(--text-muted)" dx="10">Input: "Worst film ever."</text>
  <text x="791.1111" y="192" font-family="monospace" font-size="10" fill="var(--danger-accent)" dx="10">Label: Negative</text>
  <text x="791.1111" y="208" font-family="monospace" font-size="10" fill="var(--text-muted)" dx="10">Input: "It was okay, I guess."</text>
  <text x="791.1111" y="222.2222" font-family="monospace" font-size="10" fill="var(--warn-accent)" dx="10">Label: Neutral</text>
  <text x="791.1111" y="238.2222" font-family="monospace" font-size="10" fill="var(--primary-accent)" dx="10">Input: "The movie was fantastic!"</text>
  <text x="791.1111" y="252.4444" font-family="monospace" font-size="10" fill="var(--danger-accent)" dx="10">Label: ???</text>
  <text x="791.1111" y="280" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)">MULTIPLE EXAMPLES (3+):</text>
  <text x="791.1111" y="296" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Covers edge cases, consistent format</text>
  <text x="791.1111" y="311.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Highest accuracy for complex tasks</text>
  <text x="791.1111" y="327.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)">MODEL OUTPUT:</text>
  <rect x="791.1111" y="333.3333" width="302.2222" height="21.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="942.2222" y="347.5556" font-family="monospace" font-size="11.5556" fill="var(--text)" text-anchor="middle">Positive</text>
  <rect x="26.6667" y="386.6667" width="1084.4444" height="160" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="410.6667" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)" text-anchor="middle">When to Use Each Approach</text>
  <rect x="44.4444" y="422.2222" width="320" height="106.6667" rx="6" fill="var(--surface)" />
  <text x="204.4444" y="442.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Zero-Shot — use when:</text>
  <text x="62.2222" y="460.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Task is well-known (translation, summarize)</text>
  <text x="62.2222" y="478.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Token budget is tight</text>
  <text x="62.2222" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Rapid prototyping</text>
  <text x="62.2222" y="513.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• You have a capable model (GPT-4o)</text>
  <rect x="391.1111" y="422.2222" width="337.7778" height="106.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="560" y="442.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">One-Shot — use when:</text>
  <text x="408.8889" y="460.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Output format needs to be specific</text>
  <text x="408.8889" y="478.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Zero-shot results are inconsistent</text>
  <text x="408.8889" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• One clear canonical example exists</text>
  <rect x="755.5556" y="422.2222" width="337.7778" height="106.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="924.4444" y="442.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Few-Shot — use when:</text>
  <text x="773.3333" y="460.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Task has unusual output structure</text>
  <text x="773.3333" y="478.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Domain is specialised / technical</text>
  <text x="773.3333" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Need consistent style/tone</text>
  <text x="773.3333" y="513.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Edge cases must be demonstrated</text>
  <text x="44.4444" y="565.3333" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Accuracy (typical):</text>
  <rect x="177.7778" y="552.8889" width="88.8889" height="16" rx="6" fill="var(--text-muted)" />
  <text x="275.5556" y="565.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Zero-shot</text>
  <rect x="177.7778" y="571.5556" width="142.2222" height="16" rx="6" fill="var(--primary-accent)" />
  <text x="328.8889" y="584" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">One-shot</text>
  <rect x="177.7778" y="590.2222" width="195.5556" height="16" rx="6" fill="var(--ok-accent)" />
  <text x="382.2222" y="602.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Few-shot (3-5 examples)</text>
</svg>
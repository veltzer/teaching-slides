<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Zero-shot -->
  <rect x="40" y="40" width="375" height="40.701754385965" rx="6.052402741669" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228" y="67.473684210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--info-text)">Zero-Shot</text>

  <rect x="40" y="90.877192982456" width="375" height="264.561403508772" rx="6.052402741669" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="228" y="126.491228070175" text-anchor="middle" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--text)">Classify sentiment of:</text>
  <text x="228" y="146.842105263158" text-anchor="middle" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--primary-accent)">"Fantastic movie!"</text>
  <text x="228" y="192.631578947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--text-muted)">No examples</text>
  <text x="228" y="223.157894736842" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">Task description only</text>
  <text x="228" y="248.59649122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">Uses pre-training</text>
  <text x="228" y="274.035087719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">Fastest, cheapest</text>
  <text x="228" y="314.736842105263" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--text)">Output: Positive</text>

  <!-- One-shot -->
  <rect x="453" y="40" width="375" height="40.701754385965" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="641" y="67.473684210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--primary-text)">One-Shot</text>

  <rect x="453" y="90.877192982456" width="375" height="264.561403508772" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="641" y="121.40350877193" text-anchor="middle" font-family="Courier New, monospace" font-size="11.096071693061" fill="var(--primary-text)">Input: "Terrible."</text>
  <text x="641" y="141.754385964912" text-anchor="middle" font-family="Courier New, monospace" font-size="11.096071693061" fill="var(--primary-text)">Label: Negative</text>
  <text x="641" y="172.280701754386" text-anchor="middle" font-family="Courier New, monospace" font-size="11.096071693061" fill="var(--primary-text)">Input: "Fantastic!"</text>
  <text x="641" y="192.631578947368" text-anchor="middle" font-family="Courier New, monospace" font-size="11.096071693061" fill="var(--primary-text)">Label: ???</text>
  <text x="641" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--primary-text)">One example</text>
  <text x="641" y="263.859649122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--primary-text)">Shows format</text>
  <text x="641" y="289.298245614035" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--primary-text)">Small token cost</text>
  <text x="641" y="324.912280701754" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--primary-text)">Output: Positive</text>

  <!-- Few-shot -->
  <rect x="866" y="40" width="374" height="40.701754385965" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053" y="67.473684210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--ok-text)">Few-Shot</text>

  <rect x="866" y="90.877192982456" width="374" height="264.561403508772" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="885" y="121.40350877193" font-family="Courier New, monospace" font-size="11.096071693061" fill="var(--ok-text)">"Loved it!" → Positive</text>
  <text x="885" y="146.842105263158" font-family="Courier New, monospace" font-size="11.096071693061" fill="var(--ok-text)">"Worst." → Negative</text>
  <text x="885" y="172.280701754386" font-family="Courier New, monospace" font-size="11.096071693061" fill="var(--ok-text)">"Okay." → Neutral</text>
  <text x="885" y="197.719298245614" font-family="Courier New, monospace" font-size="11.096071693061" fill="var(--ok-text)">"Fantastic!" → ???</text>
  <text x="1053" y="238.421052631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--ok-text)">3+ examples</text>
  <text x="1053" y="268.947368421053" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--ok-text)">Covers edge cases</text>
  <text x="1053" y="294.385964912281" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--ok-text)">Highest accuracy</text>
  <text x="1053" y="324.912280701754" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--ok-text)">Output: Positive</text>

  <!-- When to use -->
  <rect x="40" y="385.964912280702" width="1200" height="234.035087719298" rx="6.052402741669" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="416.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--text)">When to use</text>
  <text x="60" y="452.105263157895" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--info-accent)">Zero-shot:</text>
  <text x="60" y="477.543859649123" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">Well-known task, tight budget</text>
  <text x="60" y="502.982456140351" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">Prototyping, capable model</text>
  <text x="460" y="452.105263157895" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--primary-accent)">One-shot:</text>
  <text x="460" y="477.543859649123" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">Specific format needed</text>
  <text x="460" y="502.982456140351" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">Zero-shot inconsistent</text>
  <text x="860" y="452.105263157895" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--ok-accent)">Few-shot:</text>
  <text x="860" y="477.543859649123" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">Unusual output structure</text>
  <text x="860" y="502.982456140351" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">Specialised domain</text>
  <text x="640" y="564.035087719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--text-muted)">Accuracy rises with more examples</text>
</svg>

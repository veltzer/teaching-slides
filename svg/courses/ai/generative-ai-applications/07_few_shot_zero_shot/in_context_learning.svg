  <ns0:text x="568.8889" y="410.6667" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">When to Use Each Approach</ns0:text>
  <ns0:rect x="44.4444" y="422.2222" width="320" height="106.6667" rx="6.2222" fill="var(--surface-alt)" />
  <ns0:text x="204.4444" y="442.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Zero-Shot — use when:</ns0:text>
  <ns0:text x="62.2222" y="460.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Task is well-known (translation, summarize)</ns0:text>
  <ns0:text x="62.2222" y="478.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Token budget is tight</ns0:text>
  <ns0:text x="62.2222" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Rapid prototyping</ns0:text>
  <ns0:text x="62.2222" y="513.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• You have a capable model (GPT-4o)</ns0:text>
  <ns0:rect x="391.1111" y="422.2222" width="337.7778" height="106.6667" rx="6.2222" fill="var(--primary-pale)" />
  <ns0:text x="560" y="442.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">One-Shot — use when:</ns0:text>
  <ns0:text x="408.8889" y="460.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Output format needs to be specific</ns0:text>
  <ns0:text x="408.8889" y="478.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Zero-shot results are inconsistent</ns0:text>
  <ns0:text x="408.8889" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• One clear canonical example exists</ns0:text>
  <ns0:rect x="755.5556" y="422.2222" width="337.7778" height="106.6667" rx="6.2222" fill="var(--ok-pale)" />
  <ns0:text x="924.4444" y="442.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Few-Shot — use when:</ns0:text>
  <ns0:text x="773.3333" y="460.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Task has unusual output structure</ns0:text>
  <ns0:text x="773.3333" y="478.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Domain is specialised / technical</ns0:text>
  <ns0:text x="773.3333" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Need consistent style/tone</ns0:text>
  <ns0:text x="773.3333" y="513.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Edge cases must be demonstrated</ns0:text>
  <ns0:text x="44.4444" y="565.3333" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-dark)">Accuracy (typical):</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="64.1667" width="356.25" height="35.4444" rx="6" fill="var(--text-muted)" />
  <text x="246.25" y="86.7223" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)" text-anchor="middle">Zero-Shot</text>
  <rect x="461.875" y="64.1667" width="356.25" height="35.4444" rx="6" fill="var(--primary-accent)" />
  <text x="640" y="86.7223" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)" text-anchor="middle">One-Shot</text>
  <rect x="855.6249" y="64.1667" width="356.25" height="35.4444" rx="6" fill="var(--ok-accent)" />
  <text x="1033.75" y="86.7223" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)" text-anchor="middle">Few-Shot</text>
  <rect x="68.125" y="112.5" width="356.25" height="233.6111" rx="6" fill="var(--surface)" filter="url(#shadow)" />
  <text x="86.875" y="135.0556" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text-muted)">PROMPT:</text>
  <rect x="86.875" y="143.1111" width="318.75" height="45.1111" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889" />
  <text x="246.25" y="160.0277" font-family="monospace" font-size="10.4284" fill="var(--text)" text-anchor="middle">Classify the sentiment of:</text>
  <text x="246.25" y="174.5277" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)" text-anchor="middle">"The movie was fantastic!"</text>
  <text x="86.875" y="209.1667" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text-muted)">NO EXAMPLES — relies on pre-training</text>
  <rect x="86.875" y="218.8333" width="318.75" height="80.5556" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8889" />
  <text x="246.25" y="239.7777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">Task description only</text>
  <text x="246.25" y="255.8889" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">No format examples</text>
  <text x="246.25" y="272" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">Model uses general knowledge</text>
  <text x="246.25" y="288.1111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">Fastest, cheapest</text>
  <text x="86.875" y="330" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text-muted)">MODEL OUTPUT:</text>
  <rect x="86.875" y="338.0556" width="318.75" height="19.3333" rx="6" fill="var(--border)" />
  <text x="246.25" y="350.9444" font-family="monospace" font-size="11.2974" fill="var(--text)" text-anchor="middle">Positive</text>
  <rect x="461.875" y="112.5" width="356.25" height="233.6111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="480.625" y="135.0556" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">PROMPT:</text>
  <rect x="480.625" y="143.1111" width="318.75" height="80.5556" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="640" y="160.8333" font-family="monospace" font-size="10.4284" fill="var(--text)" text-anchor="middle">Classify the sentiment:</text>
  <text x="640" y="176.9444" font-family="monospace" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">Input: "It was terrible."</text>
  <text x="640" y="191.4444" font-family="monospace" font-size="10.4284" fill="var(--ok-accent)" text-anchor="middle">Label: Negative</text>
  <text x="640" y="209.1667" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)" text-anchor="middle">Input: "The movie was fantastic!"</text>
  <text x="640" y="223.6667" font-family="monospace" font-size="10.4284" fill="var(--danger-accent)" text-anchor="middle">Label: ???</text>
  <text x="480.625" y="239.7777" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">ONE EXAMPLE provided:</text>
  <rect x="480.625" y="247.8333" width="318.75" height="56.3889" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="640" y="263.9444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">Shows desired input/output format</text>
  <text x="640" y="280.0556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">Helps model understand task</text>
  <text x="640" y="296.1667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">Costs a few extra tokens</text>
  <text x="480.625" y="330" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">MODEL OUTPUT:</text>
  <rect x="480.625" y="338.0556" width="318.75" height="19.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="350.9444" font-family="monospace" font-size="11.2974" fill="var(--text)" text-anchor="middle">Positive</text>
  <rect x="855.6249" y="112.5" width="356.25" height="233.6111" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="874.375" y="135.0556" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">PROMPT:</text>
  <rect x="874.375" y="143.1111" width="318.75" height="135.3333" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="1033.75" y="159.2223" font-family="monospace" font-size="10" fill="var(--text)" text-anchor="middle">Classify the sentiment:</text>
  <text x="874.375" y="173.7223" font-family="monospace" font-size="10" fill="var(--text-muted)" dx="10">Input: "Absolutely loved it!"</text>
  <text x="874.375" y="186.6111" font-family="monospace" font-size="10" fill="var(--ok-accent)" dx="10">Label: Positive</text>
  <text x="874.375" y="201.1111" font-family="monospace" font-size="10" fill="var(--text-muted)" dx="10">Input: "Worst film ever."</text>
  <text x="874.375" y="214" font-family="monospace" font-size="10" fill="var(--danger-accent)" dx="10">Label: Negative</text>
  <text x="874.375" y="228.5" font-family="monospace" font-size="10" fill="var(--text-muted)" dx="10">Input: "It was okay, I guess."</text>
  <text x="874.375" y="241.3889" font-family="monospace" font-size="10" fill="var(--warn-accent)" dx="10">Label: Neutral</text>
  <text x="874.375" y="255.8889" font-family="monospace" font-size="10" fill="var(--primary-accent)" dx="10">Input: "The movie was fantastic!"</text>
  <text x="874.375" y="268.7777" font-family="monospace" font-size="10" fill="var(--danger-accent)" dx="10">Label: ???</text>
  <text x="874.375" y="293.75" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">MULTIPLE EXAMPLES (3+):</text>
  <text x="874.375" y="308.25" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Covers edge cases, consistent format</text>
  <text x="874.375" y="321.9444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Highest accuracy for complex tasks</text>
  <text x="874.375" y="336.4444" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">MODEL OUTPUT:</text>
  <rect x="874.375" y="342.0833" width="318.75" height="19.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1033.75" y="354.9723" font-family="monospace" font-size="11.2974" fill="var(--text)" text-anchor="middle">Positive</text>
  <rect x="68.125" y="390.4167" width="1143.7499" height="145" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="412.1667" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text)" text-anchor="middle">When to Use Each Approach</text>
  <rect x="86.875" y="422.6389" width="337.5" height="96.6667" rx="6" fill="var(--surface)" />
  <text x="255.6249" y="441.1667" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">Zero-Shot — use when:</text>
  <text x="105.625" y="457.2777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Task is well-known (translation, summarize)</text>
  <text x="105.625" y="473.3889" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Token budget is tight</text>
  <text x="105.625" y="489.5" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Rapid prototyping</text>
  <text x="105.625" y="505.6111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• You have a capable model (GPT-4o)</text>
  <rect x="452.5" y="422.6389" width="356.25" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="630.625" y="441.1667" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">One-Shot — use when:</text>
  <text x="471.25" y="457.2777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Output format needs to be specific</text>
  <text x="471.25" y="473.3889" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Zero-shot results are inconsistent</text>
  <text x="471.25" y="489.5" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• One clear canonical example exists</text>
  <rect x="836.875" y="422.6389" width="356.25" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1014.9999" y="441.1667" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Few-Shot — use when:</text>
  <text x="855.6249" y="457.2777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Task has unusual output structure</text>
  <text x="855.6249" y="473.3889" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Domain is specialised / technical</text>
  <text x="855.6249" y="489.5" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Need consistent style/tone</text>
  <text x="855.6249" y="505.6111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Edge cases must be demonstrated</text>
  <text x="86.875" y="552.3333" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Accuracy (typical):</text>
  <rect x="227.5" y="541.0556" width="93.75" height="14.5" rx="6" fill="var(--text-muted)" />
  <text x="330.625" y="552.3333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Zero-shot</text>
  <rect x="227.5" y="557.9723" width="150" height="14.5" rx="6" fill="var(--primary-accent)" />
  <text x="386.875" y="569.25" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">One-shot</text>
  <rect x="227.5" y="574.8889" width="206.25" height="14.5" rx="6" fill="var(--ok-accent)" />
  <text x="443.125" y="586.1667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Few-shot (3-5 examples)</text>
</svg>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="26.6667" width="337.7778" height="39.1111" rx="7.1111" fill="#455a64" />
  <ns0:text x="195.5556" y="51.5556" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#fff" text-anchor="middle">Zero-Shot</ns0:text>
  <ns0:rect x="400" y="26.6667" width="337.7778" height="39.1111" rx="7.1111" fill="#1565c0" />
  <ns0:text x="568.8889" y="51.5556" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#fff" text-anchor="middle">One-Shot</ns0:text>
  <ns0:rect x="773.3333" y="26.6667" width="337.7778" height="39.1111" rx="7.1111" fill="#2e7d32" />
  <ns0:text x="942.2222" y="51.5556" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#fff" text-anchor="middle">Few-Shot</ns0:text>
  <ns0:rect x="26.6667" y="80" width="337.7778" height="257.7778" rx="7.1111" fill="#eceff1" filter="url(#shadow)" />
  <ns0:text x="44.4444" y="104.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#455a64">PROMPT:</ns0:text>
  <ns0:rect x="44.4444" y="113.7778" width="302.2222" height="49.7778" rx="4.4444" fill="#fff" stroke="#b0bec5" stroke-width="0.8889" />
  <ns0:text x="195.5556" y="132.4444" font-family="monospace" font-size="10.6667" fill="#333" text-anchor="middle">Classify the sentiment of:</ns0:text>
  <ns0:text x="195.5556" y="148.4444" font-family="monospace" font-size="10.6667" fill="#1565c0" text-anchor="middle">"The movie was fantastic!"</ns0:text>
  <ns0:text x="44.4444" y="186.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#455a64">NO EXAMPLES — relies on pre-training</ns0:text>
  <ns0:rect x="44.4444" y="197.3333" width="302.2222" height="88.8889" rx="4.4444" fill="#fff" stroke="#b0bec5" stroke-width="0.8889" />
  <ns0:text x="195.5556" y="220.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="#777" text-anchor="middle">Task description only</ns0:text>
  <ns0:text x="195.5556" y="238.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="#777" text-anchor="middle">No format examples</ns0:text>
  <ns0:text x="195.5556" y="256" font-family="Arial,sans-serif" font-size="10.6667" fill="#777" text-anchor="middle">Model uses general knowledge</ns0:text>
  <ns0:text x="195.5556" y="273.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#777" text-anchor="middle">Fastest, cheapest</ns0:text>
  <ns0:text x="44.4444" y="320" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#455a64">MODEL OUTPUT:</ns0:text>
  <ns0:rect x="44.4444" y="328.8889" width="302.2222" height="21.3333" rx="4.4444" fill="#cfd8dc" />
  <ns0:text x="195.5556" y="343.1111" font-family="monospace" font-size="11.5556" fill="#333" text-anchor="middle">Positive</ns0:text>
  <ns0:rect x="400" y="80" width="337.7778" height="257.7778" rx="7.1111" fill="#e3f2fd" filter="url(#shadow)" />
  <ns0:text x="417.7778" y="104.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#1565c0">PROMPT:</ns0:text>
  <ns0:rect x="417.7778" y="113.7778" width="302.2222" height="88.8889" rx="4.4444" fill="#fff" stroke="#90caf9" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="133.3333" font-family="monospace" font-size="10.6667" fill="#333" text-anchor="middle">Classify the sentiment:</ns0:text>
  <ns0:text x="568.8889" y="151.1111" font-family="monospace" font-size="10.6667" fill="#555" text-anchor="middle">Input: "It was terrible."</ns0:text>
  <ns0:text x="568.8889" y="167.1111" font-family="monospace" font-size="10.6667" fill="#2e7d32" text-anchor="middle">Label: Negative</ns0:text>
  <ns0:text x="568.8889" y="186.6667" font-family="monospace" font-size="10.6667" fill="#1565c0" text-anchor="middle">Input: "The movie was fantastic!"</ns0:text>
  <ns0:text x="568.8889" y="202.6667" font-family="monospace" font-size="10.6667" fill="#c62828" text-anchor="middle">Label: ???</ns0:text>
  <ns0:text x="417.7778" y="220.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#1565c0">ONE EXAMPLE provided:</ns0:text>
  <ns0:rect x="417.7778" y="229.3333" width="302.2222" height="62.2222" rx="4.4444" fill="#fff" stroke="#90caf9" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="247.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#777" text-anchor="middle">Shows desired input/output format</ns0:text>
  <ns0:text x="568.8889" y="264.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#777" text-anchor="middle">Helps model understand task</ns0:text>
  <ns0:text x="568.8889" y="282.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#777" text-anchor="middle">Costs a few extra tokens</ns0:text>
  <ns0:text x="417.7778" y="320" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#1565c0">MODEL OUTPUT:</ns0:text>
  <ns0:rect x="417.7778" y="328.8889" width="302.2222" height="21.3333" rx="4.4444" fill="#bbdefb" />
  <ns0:text x="568.8889" y="343.1111" font-family="monospace" font-size="11.5556" fill="#333" text-anchor="middle">Positive</ns0:text>
  <ns0:rect x="773.3333" y="80" width="337.7778" height="257.7778" rx="7.1111" fill="#e8f5e9" filter="url(#shadow)" />
  <ns0:text x="791.1111" y="104.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#2e7d32">PROMPT:</ns0:text>
  <ns0:rect x="791.1111" y="113.7778" width="302.2222" height="149.3333" rx="4.4444" fill="#fff" stroke="#a5d6a7" stroke-width="0.8889" />
  <ns0:text x="942.2222" y="131.5556" font-family="monospace" font-size="10" fill="#333" text-anchor="middle">Classify the sentiment:</ns0:text>
  <ns0:text x="791.1111" y="147.5556" font-family="monospace" font-size="10" fill="#555" dx="10">Input: "Absolutely loved it!"</ns0:text>
  <ns0:text x="791.1111" y="161.7778" font-family="monospace" font-size="10" fill="#2e7d32" dx="10">Label: Positive</ns0:text>
  <ns0:text x="791.1111" y="177.7778" font-family="monospace" font-size="10" fill="#555" dx="10">Input: "Worst film ever."</ns0:text>
  <ns0:text x="791.1111" y="192" font-family="monospace" font-size="10" fill="#c62828" dx="10">Label: Negative</ns0:text>
  <ns0:text x="791.1111" y="208" font-family="monospace" font-size="10" fill="#555" dx="10">Input: "It was okay, I guess."</ns0:text>
  <ns0:text x="791.1111" y="222.2222" font-family="monospace" font-size="10" fill="#f57f17" dx="10">Label: Neutral</ns0:text>
  <ns0:text x="791.1111" y="238.2222" font-family="monospace" font-size="10" fill="#1565c0" dx="10">Input: "The movie was fantastic!"</ns0:text>
  <ns0:text x="791.1111" y="252.4444" font-family="monospace" font-size="10" fill="#c62828" dx="10">Label: ???</ns0:text>
  <ns0:text x="791.1111" y="280" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#2e7d32">MULTIPLE EXAMPLES (3+):</ns0:text>
  <ns0:text x="791.1111" y="296" font-family="Arial,sans-serif" font-size="10.6667" fill="#777">Covers edge cases, consistent format</ns0:text>
  <ns0:text x="791.1111" y="311.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#777">Highest accuracy for complex tasks</ns0:text>
  <ns0:text x="791.1111" y="327.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#2e7d32">MODEL OUTPUT:</ns0:text>
  <ns0:rect x="791.1111" y="333.3333" width="302.2222" height="21.3333" rx="4.4444" fill="#c8e6c9" />
  <ns0:text x="942.2222" y="347.5556" font-family="monospace" font-size="11.5556" fill="#333" text-anchor="middle">Positive</ns0:text>
  <ns0:rect x="26.6667" y="386.6667" width="1084.4444" height="160" rx="8.8889" fill="#fafafa" filter="url(#shadow)" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="410.6667" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="#333" text-anchor="middle">When to Use Each Approach</ns0:text>
  <ns0:rect x="44.4444" y="422.2222" width="320" height="106.6667" rx="6.2222" fill="#eceff1" />
  <ns0:text x="204.4444" y="442.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#455a64" text-anchor="middle">Zero-Shot — use when:</ns0:text>
  <ns0:text x="62.2222" y="460.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Task is well-known (translation, summarize)</ns0:text>
  <ns0:text x="62.2222" y="478.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Token budget is tight</ns0:text>
  <ns0:text x="62.2222" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Rapid prototyping</ns0:text>
  <ns0:text x="62.2222" y="513.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• You have a capable model (GPT-4o)</ns0:text>
  <ns0:rect x="391.1111" y="422.2222" width="337.7778" height="106.6667" rx="6.2222" fill="#e3f2fd" />
  <ns0:text x="560" y="442.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0" text-anchor="middle">One-Shot — use when:</ns0:text>
  <ns0:text x="408.8889" y="460.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Output format needs to be specific</ns0:text>
  <ns0:text x="408.8889" y="478.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Zero-shot results are inconsistent</ns0:text>
  <ns0:text x="408.8889" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• One clear canonical example exists</ns0:text>
  <ns0:rect x="755.5556" y="422.2222" width="337.7778" height="106.6667" rx="6.2222" fill="#e8f5e9" />
  <ns0:text x="924.4444" y="442.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32" text-anchor="middle">Few-Shot — use when:</ns0:text>
  <ns0:text x="773.3333" y="460.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Task has unusual output structure</ns0:text>
  <ns0:text x="773.3333" y="478.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Domain is specialised / technical</ns0:text>
  <ns0:text x="773.3333" y="496" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Need consistent style/tone</ns0:text>
  <ns0:text x="773.3333" y="513.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Edge cases must be demonstrated</ns0:text>
  <ns0:text x="44.4444" y="565.3333" font-family="Arial,sans-serif" font-size="11.5556" fill="#333">Accuracy (typical):</ns0:text>
  <ns0:rect x="177.7778" y="552.8889" width="88.8889" height="16" rx="2.6667" fill="#455a64" />
  <ns0:text x="275.5556" y="565.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Zero-shot</ns0:text>
  <ns0:rect x="177.7778" y="571.5556" width="142.2222" height="16" rx="2.6667" fill="#1565c0" />
  <ns0:text x="328.8889" y="584" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">One-shot</ns0:text>
  <ns0:rect x="177.7778" y="590.2222" width="195.5556" height="16" rx="2.6667" fill="#2e7d32" />
  <ns0:text x="382.2222" y="602.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Few-shot (3-5 examples)</ns0:text>
</ns0:svg>
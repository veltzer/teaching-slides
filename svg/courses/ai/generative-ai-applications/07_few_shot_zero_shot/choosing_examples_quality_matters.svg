<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.3573" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Choosing Examples: Quality Matters</text>
  <rect x="40" y="84.6154" width="566.6666" height="535.3846" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3334" y="138.1538" text-anchor="middle" font-size="22.1876" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">GOOD Examples</text>
  <rect x="73.3334" y="164.9231" width="500" height="71.3846" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5224"/>
  <text x="106.6667" y="209.5385" font-size="17.4331" fill="var(--ok-accent)" font-family="Arial, sans-serif">✓ Cover all categories equally</text>
  <rect x="73.3334" y="254.1538" width="500" height="71.3846" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5224"/>
  <text x="106.6667" y="298.7692" font-size="17.4331" fill="var(--ok-accent)" font-family="Arial, sans-serif">✓ Include edge cases</text>
  <rect x="73.3334" y="343.3846" width="500" height="71.3846" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5224"/>
  <text x="106.6667" y="388" font-size="17.4331" fill="var(--ok-accent)" font-family="Arial, sans-serif">✓ Represent actual data distribution</text>
  <rect x="73.3334" y="432.6154" width="500" height="71.3846" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5224"/>
  <text x="106.6667" y="477.2307" font-size="17.4331" fill="var(--ok-accent)" font-family="Arial, sans-serif">✓ Consistent in format</text>
  <rect x="673.3334" y="84.6154" width="566.6666" height="535.3846" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6667" y="138.1538" text-anchor="middle" font-size="22.1876" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">BAD Examples</text>
  <rect x="706.6667" y="164.9231" width="500" height="71.3846" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.5224"/>
  <text x="740.0001" y="209.5385" font-size="17.4331" fill="var(--danger-accent)" font-family="Arial, sans-serif">✗ All from one category (biased)</text>
  <rect x="706.6667" y="254.1538" width="500" height="71.3846" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.5224"/>
  <text x="740.0001" y="298.7692" font-size="17.4331" fill="var(--danger-accent)" font-family="Arial, sans-serif">✗ Only obvious/easy cases</text>
  <rect x="706.6667" y="343.3846" width="500" height="71.3846" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.5224"/>
  <text x="740.0001" y="388" font-size="17.4331" fill="var(--danger-accent)" font-family="Arial, sans-serif">✗ Contradictory labels</text>
  <rect x="706.6667" y="432.6154" width="500" height="71.3846" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.5224"/>
  <text x="740.0001" y="477.2307" font-size="17.4331" fill="var(--danger-accent)" font-family="Arial, sans-serif">✗ Inconsistent formatting</text>
</svg>

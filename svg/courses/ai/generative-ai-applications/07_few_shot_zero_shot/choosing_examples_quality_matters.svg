<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Choosing Examples: Quality Matters</text>
  <!-- Good -->
  <rect x="40" y="55" width="340" height="300" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="210" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">GOOD Examples</text>
  <rect x="60" y="100" width="300" height="40" rx="5" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="80" y="125" font-size="11" fill="#28a745">&#x2713; Cover all categories equally</text>
  <rect x="60" y="150" width="300" height="40" rx="5" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="80" y="175" font-size="11" fill="#28a745">&#x2713; Include edge cases</text>
  <rect x="60" y="200" width="300" height="40" rx="5" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="80" y="225" font-size="11" fill="#28a745">&#x2713; Represent actual data distribution</text>
  <rect x="60" y="250" width="300" height="40" rx="5" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="80" y="275" font-size="11" fill="#28a745">&#x2713; Consistent in format</text>
  <!-- Bad -->
  <rect x="420" y="55" width="340" height="300" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="590" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">BAD Examples</text>
  <rect x="440" y="100" width="300" height="40" rx="5" fill="#fff" stroke="#dc3545" stroke-width="1"/>
  <text x="460" y="125" font-size="11" fill="#dc3545">&#x2717; All from one category (biased)</text>
  <rect x="440" y="150" width="300" height="40" rx="5" fill="#fff" stroke="#dc3545" stroke-width="1"/>
  <text x="460" y="175" font-size="11" fill="#dc3545">&#x2717; Only obvious/easy cases</text>
  <rect x="440" y="200" width="300" height="40" rx="5" fill="#fff" stroke="#dc3545" stroke-width="1"/>
  <text x="460" y="225" font-size="11" fill="#dc3545">&#x2717; Contradictory labels</text>
  <rect x="440" y="250" width="300" height="40" rx="5" fill="#fff" stroke="#dc3545" stroke-width="1"/>
  <text x="460" y="275" font-size="11" fill="#dc3545">&#x2717; Inconsistent formatting</text>
</svg>
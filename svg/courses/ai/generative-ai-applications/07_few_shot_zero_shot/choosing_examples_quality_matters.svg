<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="608.9515" y="54.0845" text-anchor="middle" font-size="24.3581" font-weight="bold" fill="var(--text)">Choosing Examples: Quality Matters</text>
  <rect x="60.8951" y="99.1549" width="517.6087" height="540.8451" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="319.6995" y="153.2394" text-anchor="middle" font-size="21.3133" font-weight="bold" fill="var(--ok-accent)">GOOD Examples</text>
  <rect x="91.3427" y="180.2817" width="456.7136" height="72.1127" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5224" />
  <text x="121.7903" y="225.3521" font-size="16.7462" fill="var(--ok-accent)">✓ Cover all categories equally</text>
  <rect x="91.3427" y="270.4225" width="456.7136" height="72.1127" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5224" />
  <text x="121.7903" y="315.4929" font-size="16.7462" fill="var(--ok-accent)">✓ Include edge cases</text>
  <rect x="91.3427" y="360.5634" width="456.7136" height="72.1127" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5224" />
  <text x="121.7903" y="405.6338" font-size="16.7462" fill="var(--ok-accent)">✓ Represent actual data distribution</text>
  <rect x="91.3427" y="450.7042" width="456.7136" height="72.1127" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5224" />
  <text x="121.7903" y="495.7746" font-size="16.7462" fill="var(--ok-accent)">✓ Consistent in format</text>
  <rect x="639.399" y="99.1549" width="517.6087" height="540.8451" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="898.2034" y="153.2394" text-anchor="middle" font-size="21.3133" font-weight="bold" fill="var(--danger-accent)">BAD Examples</text>
  <rect x="669.8466" y="180.2817" width="456.7136" height="72.1127" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.5224" />
  <text x="700.2942" y="225.3521" font-size="16.7462" fill="var(--danger-accent)">✗ All from one category (biased)</text>
  <rect x="669.8466" y="270.4225" width="456.7136" height="72.1127" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.5224" />
  <text x="700.2942" y="315.4929" font-size="16.7462" fill="var(--danger-accent)">✗ Only obvious/easy cases</text>
  <rect x="669.8466" y="360.5634" width="456.7136" height="72.1127" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.5224" />
  <text x="700.2942" y="405.6338" font-size="16.7462" fill="var(--danger-accent)">✗ Contradictory labels</text>
  <rect x="669.8466" y="450.7042" width="456.7136" height="72.1127" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.5224" />
  <text x="700.2942" y="495.7746" font-size="16.7462" fill="var(--danger-accent)">✗ Inconsistent formatting</text>
</svg>
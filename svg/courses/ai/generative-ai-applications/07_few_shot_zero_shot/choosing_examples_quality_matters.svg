<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="608.9515" y="54.0845" text-anchor="middle" font-size="24.3581" font-weight="bold" fill="#333">Choosing Examples: Quality Matters</ns0:text>
  <ns0:rect x="60.8951" y="99.1549" width="517.6087" height="540.8451" rx="7.6119" fill="#d4edda" stroke="#28a745" stroke-width="3.0448" />
  <ns0:text x="319.6995" y="153.2394" text-anchor="middle" font-size="21.3133" font-weight="bold" fill="#28a745">GOOD Examples</ns0:text>
  <ns0:rect x="91.3427" y="180.2817" width="456.7136" height="72.1127" rx="7.6119" fill="#fff" stroke="#28a745" stroke-width="1.5224" />
  <ns0:text x="121.7903" y="225.3521" font-size="16.7462" fill="#28a745">✓ Cover all categories equally</ns0:text>
  <ns0:rect x="91.3427" y="270.4225" width="456.7136" height="72.1127" rx="7.6119" fill="#fff" stroke="#28a745" stroke-width="1.5224" />
  <ns0:text x="121.7903" y="315.4929" font-size="16.7462" fill="#28a745">✓ Include edge cases</ns0:text>
  <ns0:rect x="91.3427" y="360.5634" width="456.7136" height="72.1127" rx="7.6119" fill="#fff" stroke="#28a745" stroke-width="1.5224" />
  <ns0:text x="121.7903" y="405.6338" font-size="16.7462" fill="#28a745">✓ Represent actual data distribution</ns0:text>
  <ns0:rect x="91.3427" y="450.7042" width="456.7136" height="72.1127" rx="7.6119" fill="#fff" stroke="#28a745" stroke-width="1.5224" />
  <ns0:text x="121.7903" y="495.7746" font-size="16.7462" fill="#28a745">✓ Consistent in format</ns0:text>
  <ns0:rect x="639.399" y="99.1549" width="517.6087" height="540.8451" rx="7.6119" fill="#f8d7da" stroke="#dc3545" stroke-width="3.0448" />
  <ns0:text x="898.2034" y="153.2394" text-anchor="middle" font-size="21.3133" font-weight="bold" fill="#dc3545">BAD Examples</ns0:text>
  <ns0:rect x="669.8466" y="180.2817" width="456.7136" height="72.1127" rx="7.6119" fill="#fff" stroke="#dc3545" stroke-width="1.5224" />
  <ns0:text x="700.2942" y="225.3521" font-size="16.7462" fill="#dc3545">✗ All from one category (biased)</ns0:text>
  <ns0:rect x="669.8466" y="270.4225" width="456.7136" height="72.1127" rx="7.6119" fill="#fff" stroke="#dc3545" stroke-width="1.5224" />
  <ns0:text x="700.2942" y="315.4929" font-size="16.7462" fill="#dc3545">✗ Only obvious/easy cases</ns0:text>
  <ns0:rect x="669.8466" y="360.5634" width="456.7136" height="72.1127" rx="7.6119" fill="#fff" stroke="#dc3545" stroke-width="1.5224" />
  <ns0:text x="700.2942" y="405.6338" font-size="16.7462" fill="#dc3545">✗ Contradictory labels</ns0:text>
  <ns0:rect x="669.8466" y="450.7042" width="456.7136" height="72.1127" rx="7.6119" fill="#fff" stroke="#dc3545" stroke-width="1.5224" />
  <ns0:text x="700.2942" y="495.7746" font-size="16.7462" fill="#dc3545">✗ Inconsistent formatting</ns0:text>
</ns0:svg>
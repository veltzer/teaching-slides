<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="56.8421" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Choosing Examples: Quality Matters</text>
  <rect x="64" y="104.2105" width="544" height="568.4211" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="336" y="161.0526" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#28a745">GOOD Examples</text>
  <rect x="96" y="189.4737" width="480" height="75.7895" rx="8" fill="#fff" stroke="#28a745" stroke-width="1.6" />
  <text x="128" y="236.8421" font-size="17.6" fill="#28a745">✓ Cover all categories equally</text>
  <rect x="96" y="284.2105" width="480" height="75.7895" rx="8" fill="#fff" stroke="#28a745" stroke-width="1.6" />
  <text x="128" y="331.5789" font-size="17.6" fill="#28a745">✓ Include edge cases</text>
  <rect x="96" y="378.9474" width="480" height="75.7895" rx="8" fill="#fff" stroke="#28a745" stroke-width="1.6" />
  <text x="128" y="426.3158" font-size="17.6" fill="#28a745">✓ Represent actual data distribution</text>
  <rect x="96" y="473.6842" width="480" height="75.7895" rx="8" fill="#fff" stroke="#28a745" stroke-width="1.6" />
  <text x="128" y="521.0526" font-size="17.6" fill="#28a745">✓ Consistent in format</text>
  <rect x="672" y="104.2105" width="544" height="568.4211" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="944" y="161.0526" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#dc3545">BAD Examples</text>
  <rect x="704" y="189.4737" width="480" height="75.7895" rx="8" fill="#fff" stroke="#dc3545" stroke-width="1.6" />
  <text x="736" y="236.8421" font-size="17.6" fill="#dc3545">✗ All from one category (biased)</text>
  <rect x="704" y="284.2105" width="480" height="75.7895" rx="8" fill="#fff" stroke="#dc3545" stroke-width="1.6" />
  <text x="736" y="331.5789" font-size="17.6" fill="#dc3545">✗ Only obvious/easy cases</text>
  <rect x="704" y="378.9474" width="480" height="75.7895" rx="8" fill="#fff" stroke="#dc3545" stroke-width="1.6" />
  <text x="736" y="426.3158" font-size="17.6" fill="#dc3545">✗ Contradictory labels</text>
  <rect x="704" y="473.6842" width="480" height="75.7895" rx="8" fill="#fff" stroke="#dc3545" stroke-width="1.6" />
  <text x="736" y="521.0526" font-size="17.6" fill="#dc3545">✗ Inconsistent formatting</text>
</svg>
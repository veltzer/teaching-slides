<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.3475" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">In-Context Learning</text>
  <rect x="40" y="98.9831" width="573.1343" height="235.9322" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.5671" y="154.0339" text-anchor="middle" font-size="23.929" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Zero-shot</text>
  <text x="326.5671" y="207.1186" text-anchor="middle" font-size="20.5107" fill="var(--text-muted)" font-family="Arial, sans-serif">No examples, just instruction</text>
  <rect x="93.7314" y="236.6102" width="465.6717" height="58.983" rx="6" fill="var(--bg)" stroke="var(--primary-border)"/>
  <text x="326.5671" y="275.9322" text-anchor="middle" font-size="17.0923" fill="var(--text)" font-family="Arial, sans-serif">"Classify: positive/negative"</text>
  <rect x="666.8657" y="98.9831" width="573.1343" height="235.9322" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.4329" y="154.0339" text-anchor="middle" font-size="23.929" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">One-shot</text>
  <text x="953.4329" y="207.1186" text-anchor="middle" font-size="20.5107" fill="var(--text-muted)" font-family="Arial, sans-serif">Single example provided</text>
  <rect x="720.5971" y="236.6102" width="465.6717" height="58.983" rx="6" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="953.4329" y="275.9322" text-anchor="middle" font-size="17.0923" fill="var(--text)" font-family="Arial, sans-serif">"Example: 'great!' -&gt; positive"</text>
  <rect x="40" y="384.0678" width="573.1343" height="235.9322" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="326.5671" y="439.1187" text-anchor="middle" font-size="23.929" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Few-shot</text>
  <text x="326.5671" y="492.2034" text-anchor="middle" font-size="20.5107" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple examples (2-10)</text>
  <rect x="93.7314" y="521.695" width="465.6717" height="58.983" rx="6" fill="var(--bg)" stroke="var(--warn-border)"/>
  <text x="326.5671" y="561.017" text-anchor="middle" font-size="17.0923" fill="var(--text)" font-family="Arial, sans-serif">"Example 1: ... Example 2: ..."</text>
  <rect x="666.8657" y="384.0678" width="573.1343" height="235.9322" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.4329" y="439.1187" text-anchor="middle" font-size="23.929" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Many-shot</text>
  <text x="953.4329" y="492.2034" text-anchor="middle" font-size="20.5107" fill="var(--text-muted)" font-family="Arial, sans-serif">Many examples (10-100+)</text>
  <rect x="720.5971" y="521.695" width="465.6717" height="58.983" rx="6" fill="var(--bg)" stroke="var(--danger-border)"/>
  <text x="953.4329" y="561.017" text-anchor="middle" font-size="17.0923" fill="var(--text)" font-family="Arial, sans-serif">Uses large context windows</text>
</svg>

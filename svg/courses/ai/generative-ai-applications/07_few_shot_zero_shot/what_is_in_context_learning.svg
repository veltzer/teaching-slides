<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="612.6496" y="59.0769" text-anchor="middle" font-size="26.1397" font-weight="bold" fill="var(--text)">In-Context Learning</text>
  <rect x="65.3493" y="118.1539" width="522.7943" height="236.3077" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="326.7464" y="173.2923" text-anchor="middle" font-size="22.8722" font-weight="bold" fill="var(--primary-accent)">Zero-shot</text>
  <text x="326.7464" y="226.4615" text-anchor="middle" font-size="19.6048" fill="var(--text-muted)">No examples, just instruction</text>
  <rect x="114.3613" y="256" width="424.7704" height="59.0769" rx="6" fill="var(--bg)" stroke="var(--primary-border)" />
  <text x="326.7464" y="295.3846" text-anchor="middle" font-size="16.3374" fill="var(--text)">"Classify: positive/negative"</text>
  <rect x="637.1556" y="118.1539" width="522.7943" height="236.3077" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="898.5528" y="173.2923" text-anchor="middle" font-size="22.8722" font-weight="bold" fill="var(--ok-accent)">One-shot</text>
  <text x="898.5528" y="226.4615" text-anchor="middle" font-size="19.6048" fill="var(--text-muted)">Single example provided</text>
  <rect x="686.1676" y="256" width="424.7704" height="59.0769" rx="6" fill="var(--bg)" stroke="var(--ok-border)" />
  <text x="898.5528" y="295.3846" text-anchor="middle" font-size="16.3374" fill="var(--text)">"Example: 'great!' -&gt; positive"</text>
  <rect x="65.3493" y="403.6923" width="522.7943" height="236.3077" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="326.7464" y="458.8308" text-anchor="middle" font-size="22.8722" font-weight="bold" fill="var(--danger-accent)">Few-shot</text>
  <text x="326.7464" y="512" text-anchor="middle" font-size="19.6048" fill="var(--text-muted)">Multiple examples (2-10)</text>
  <rect x="114.3613" y="541.5385" width="424.7704" height="59.0769" rx="6" fill="var(--bg)" stroke="var(--warn-border)" />
  <text x="326.7464" y="580.9231" text-anchor="middle" font-size="16.3374" fill="var(--text)">"Example 1: ... Example 2: ..."</text>
  <rect x="637.1556" y="403.6923" width="522.7943" height="236.3077" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="898.5528" y="458.8308" text-anchor="middle" font-size="22.8722" font-weight="bold" fill="var(--danger-accent)">Many-shot</text>
  <text x="898.5528" y="512" text-anchor="middle" font-size="19.6048" fill="var(--text-muted)">Many examples (10-100+)</text>
  <rect x="686.1676" y="541.5385" width="424.7704" height="59.0769" rx="6" fill="var(--bg)" stroke="var(--danger-border)" />
  <text x="898.5528" y="580.9231" text-anchor="middle" font-size="16.3374" fill="var(--text)">Uses large context windows</text>
</svg>
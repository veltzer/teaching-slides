<svg viewBox="0 0 750 350" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">In-Context Learning</text>
  <!-- Zero-shot -->
  <rect x="40" y="60" width="320" height="120" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="200" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Zero-shot</text>
  <text x="200" y="115" text-anchor="middle" font-size="12" fill="#555">No examples, just instruction</text>
  <rect x="70" y="130" width="260" height="30" rx="3" fill="#fff" stroke="#4a90e2"/>
  <text x="200" y="150" text-anchor="middle" font-size="10" fill="#333">"Classify: positive/negative"</text>
  <!-- One-shot -->
  <rect x="390" y="60" width="320" height="120" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="550" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">One-shot</text>
  <text x="550" y="115" text-anchor="middle" font-size="12" fill="#555">Single example provided</text>
  <rect x="420" y="130" width="260" height="30" rx="3" fill="#fff" stroke="#28a745"/>
  <text x="550" y="150" text-anchor="middle" font-size="10" fill="#333">"Example: 'great!' -> positive"</text>
  <!-- Few-shot -->
  <rect x="40" y="205" width="320" height="120" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="200" y="233" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">Few-shot</text>
  <text x="200" y="260" text-anchor="middle" font-size="12" fill="#555">Multiple examples (2-10)</text>
  <rect x="70" y="275" width="260" height="30" rx="3" fill="#fff" stroke="#ffc107"/>
  <text x="200" y="295" text-anchor="middle" font-size="10" fill="#333">"Example 1: ... Example 2: ..."</text>
  <!-- Many-shot -->
  <rect x="390" y="205" width="320" height="120" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="550" y="233" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Many-shot</text>
  <text x="550" y="260" text-anchor="middle" font-size="12" fill="#555">Many examples (10-100+)</text>
  <rect x="420" y="275" width="260" height="30" rx="3" fill="#fff" stroke="#dc3545"/>
  <text x="550" y="295" text-anchor="middle" font-size="10" fill="#333">Uses large context windows</text>
</svg>
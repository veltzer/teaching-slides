<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="80" text-anchor="middle" font-size="19.8031" font-weight="bold" fill="var(--text)">How Many Examples Do You Need?</text>
  <line x1="268.6921" y1="117.9746" x2="268.6921" y2="396.4556" stroke="var(--text)" stroke-width="2" />
  <line x1="268.6921" y1="396.4556" x2="949.4232" y2="396.4556" stroke="var(--text)" stroke-width="2" />
  <text x="206.8075" y="263.5443" text-anchor="middle" font-size="16.09" fill="var(--text)" transform="rotate(-90, 50, 175)">Accuracy</text>
  <text x="609.0577" y="434.4302" text-anchor="middle" font-size="16.09" fill="var(--text)">Number of examples</text>
  <text x="256.3152" y="386.329" text-anchor="end" font-size="12.3769" fill="var(--text-muted)">50%</text>
  <text x="256.3152" y="320.5063" text-anchor="end" font-size="12.3769" fill="var(--text-muted)">70%</text>
  <text x="256.3152" y="244.557" text-anchor="end" font-size="12.3769" fill="var(--text-muted)">80%</text>
  <text x="256.3152" y="168.6077" text-anchor="end" font-size="12.3769" fill="var(--text-muted)">90%</text>
  <text x="256.3152" y="130.6329" text-anchor="end" font-size="12.3769" fill="var(--text-muted)">100%</text>
  <text x="330.5768" y="419.2404" text-anchor="middle" font-size="12.3769" fill="var(--text-muted)">0</text>
  <text x="429.5922" y="419.2404" text-anchor="middle" font-size="12.3769" fill="var(--text-muted)">2</text>
  <text x="528.6076" y="419.2404" text-anchor="middle" font-size="12.3769" fill="var(--text-muted)">4</text>
  <text x="627.6231" y="419.2404" text-anchor="middle" font-size="12.3769" fill="var(--text-muted)">6</text>
  <text x="726.6385" y="419.2404" text-anchor="middle" font-size="12.3769" fill="var(--text-muted)">8</text>
  <text x="813.277" y="419.2404" text-anchor="middle" font-size="12.3769" fill="var(--text-muted)">10</text>
  <text x="912.2925" y="419.2404" text-anchor="middle" font-size="12.3769" fill="var(--text-muted)">20</text>
  <path d="M 330.5768 377.4682 Q 392.4614 307.848 454.3461 257.2151 Q 516.2307 212.9114 578.1154 181.2658 Q 640 162.2785 701.8846 152.1518 Q 763.7693 145.8227 825.6539 140.7596 Q 887.5386 138.2278 937.0463 136.9621" fill="none" stroke="var(--primary-border)" stroke-width="3" />
  <line x1="652.3769" y1="117.9746" x2="652.3769" y2="396.4556" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="5 3" />
  <text x="677.1308" y="238.2279" font-size="12.3769" fill="var(--danger-accent)">Diminishing returns</text>
  <text x="677.1308" y="257.2151" font-size="12.3769" fill="var(--danger-accent)">after ~5-8 examples</text>
  <rect x="194.4305" y="453.4177" width="420.8156" height="126.5823" rx="7.4262" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="404.8383" y="482.5316" text-anchor="middle" font-size="14.8523" font-weight="bold" fill="var(--primary-accent)">Guidelines</text>
  <text x="219.1844" y="507.8479" font-size="12.3769" fill="var(--text)">0 examples: Common/simple tasks</text>
  <text x="219.1844" y="529.367" font-size="12.3769" fill="var(--text)">1-3 examples: Well-defined tasks</text>
  <text x="219.1844" y="550.886" font-size="12.3769" fill="var(--text)">4-8 examples: Complex/ambiguous tasks</text>
  <rect x="664.7539" y="453.4177" width="420.8156" height="126.5823" rx="7.4262" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="875.1617" y="482.5316" text-anchor="middle" font-size="14.8523" font-weight="bold" fill="var(--danger-accent)">Advanced</text>
  <text x="689.5077" y="507.8479" font-size="12.3769" fill="var(--text)">10+ examples: Domain-specific formats</text>
  <text x="689.5077" y="529.367" font-size="12.3769" fill="var(--text)">50+ examples: Consider fine-tuning</text>
  <text x="689.5077" y="550.886" font-size="12.3769" fill="var(--text)">instead of few-shot prompting</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="400" y="30.6818" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">How Many Examples Do You Need?</text>
  <line x1="100" y1="61.3636" x2="100" y2="286.3636" stroke="var(--text)" stroke-width="2" />
  <line x1="100" y1="286.3636" x2="650" y2="286.3636" stroke="var(--text)" stroke-width="2" />
  <text x="50" y="178.9773" text-anchor="middle" font-size="13" fill="var(--text)" transform="rotate(-90, 50, 175)">Accuracy</text>
  <text x="375" y="317.0454" text-anchor="middle" font-size="13" fill="var(--text)">Number of examples</text>
  <text x="90" y="278.1818" text-anchor="end" font-size="10" fill="var(--text-muted)">50%</text>
  <text x="90" y="225" text-anchor="end" font-size="10" fill="var(--text-muted)">70%</text>
  <text x="90" y="163.6364" text-anchor="end" font-size="10" fill="var(--text-muted)">80%</text>
  <text x="90" y="102.2728" text-anchor="end" font-size="10" fill="var(--text-muted)">90%</text>
  <text x="90" y="71.5909" text-anchor="end" font-size="10" fill="var(--text-muted)">100%</text>
  <text x="150" y="304.7727" text-anchor="middle" font-size="10" fill="var(--text-muted)">0</text>
  <text x="230" y="304.7727" text-anchor="middle" font-size="10" fill="var(--text-muted)">2</text>
  <text x="310" y="304.7727" text-anchor="middle" font-size="10" fill="var(--text-muted)">4</text>
  <text x="390" y="304.7727" text-anchor="middle" font-size="10" fill="var(--text-muted)">6</text>
  <text x="470" y="304.7727" text-anchor="middle" font-size="10" fill="var(--text-muted)">8</text>
  <text x="540" y="304.7727" text-anchor="middle" font-size="10" fill="var(--text-muted)">10</text>
  <text x="620" y="304.7727" text-anchor="middle" font-size="10" fill="var(--text-muted)">20</text>
  <path d="M 150 271.0227 Q 200 214.7727 250 173.8636 Q 300 138.0682 350 112.5 Q 400 97.1591 450 88.9772 Q 500 83.8636 550 79.7728 Q 600 77.7272 640 76.7046" fill="none" stroke="var(--primary-border)" stroke-width="3" />
  <line x1="410" y1="61.3636" x2="410" y2="286.3636" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="5 3" />
  <text x="430" y="158.5228" font-size="10" fill="var(--danger-accent)">Diminishing returns</text>
  <text x="430" y="173.8636" font-size="10" fill="var(--danger-accent)">after ~5-8 examples</text>
  <rect x="40" y="332.3864" width="340" height="102.2728" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="210" y="355.9091" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--primary-accent)">Guidelines</text>
  <text x="60" y="376.3636" font-size="10" fill="var(--text)">0 examples: Common/simple tasks</text>
  <text x="60" y="393.75" font-size="10" fill="var(--text)">1-3 examples: Well-defined tasks</text>
  <text x="60" y="411.1364" font-size="10" fill="var(--text)">4-8 examples: Complex/ambiguous tasks</text>
  <rect x="420" y="332.3864" width="340" height="102.2728" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="590" y="355.9091" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--danger-accent)">Advanced</text>
  <text x="440" y="376.3636" font-size="10" fill="var(--text)">10+ examples: Domain-specific formats</text>
  <text x="440" y="393.75" font-size="10" fill="var(--text)">50+ examples: Consider fine-tuning</text>
  <text x="440" y="411.1364" font-size="10" fill="var(--text)">instead of few-shot prompting</text>
</svg>
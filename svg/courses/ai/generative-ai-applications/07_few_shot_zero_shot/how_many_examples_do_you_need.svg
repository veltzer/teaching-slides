<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="140.0001" y1="40" x2="140.0001" y2="389.588981797725" stroke="var(--text)" stroke-width="0.933"/>
  <line x1="140.0001" y1="389.588981797725" x2="1056.6667" y2="389.588981797725" stroke="var(--text)" stroke-width="0.933"/>
  <text x="56.6666" y="252.9113" text-anchor="middle" font-size="20.1095" fill="var(--text)" transform="rotate(-90, 50, 175)" font-family="Arial, sans-serif">Accuracy</text>
  <text x="598.3333" y="437.260059016754" text-anchor="middle" font-size="20.919597977732" fill="var(--text)" font-family="Arial, sans-serif">Number of examples</text>
  <text x="123.3334" y="376.876586320166" text-anchor="end" font-size="19.036163176336" fill="var(--text-muted)" font-family="Arial, sans-serif">50%</text>
  <text x="123.3334" y="294.246610921365" text-anchor="end" font-size="19.036163176336" fill="var(--text-muted)" font-family="Arial, sans-serif">70%</text>
  <text x="123.3334" y="198.904131825853" text-anchor="end" font-size="19.036163176336" fill="var(--text-muted)" font-family="Arial, sans-serif">80%</text>
  <text x="123.3334" y="103.561869168644" text-anchor="end" font-size="19.036163176336" fill="var(--text-muted)" font-family="Arial, sans-serif">90%</text>
  <text x="123.3334" y="55.890467292161" text-anchor="end" font-size="19.036163176336" fill="var(--text-muted)" font-family="Arial, sans-serif">100%</text>
  <text x="223.3333" y="418.191628129143" text-anchor="middle" font-size="19.036163176336" fill="var(--text-muted)" font-family="Arial, sans-serif">0</text>
  <text x="356.6667" y="418.191628129143" text-anchor="middle" font-size="19.036163176336" fill="var(--text-muted)" font-family="Arial, sans-serif">2</text>
  <text x="489.9999" y="418.191628129143" text-anchor="middle" font-size="19.036163176336" fill="var(--text-muted)" font-family="Arial, sans-serif">4</text>
  <text x="623.3333" y="418.191628129143" text-anchor="middle" font-size="19.036163176336" fill="var(--text-muted)" font-family="Arial, sans-serif">6</text>
  <text x="756.6666" y="418.191628129143" text-anchor="middle" font-size="19.036163176336" fill="var(--text-muted)" font-family="Arial, sans-serif">8</text>
  <text x="873.3332" y="418.191628129143" text-anchor="middle" font-size="19.036163176336" fill="var(--text-muted)" font-family="Arial, sans-serif">10</text>
  <text x="1006.6665" y="418.191628129143" text-anchor="middle" font-size="19.036163176336" fill="var(--text-muted)" font-family="Arial, sans-serif">20</text>
  <path d="M 223.3333 365.753172640333 Q 306.6666 278.356035410053 390 214.794490898863 Q 473.3332 159.178180033753 556.6667 119.452011803351 Q 639.9999 95.616635522563 723.3331 82.904131825853 Q 806.6666 74.958898179773 889.9998 68.602970988871 Q 973.3332 65.424682735967 1039.9998 63.835700938241" fill="none" stroke="var(--primary-border)" stroke-width="1.3995"/>
  <line x1="656.6665" y1="40" x2="656.6665" y2="389.588981797725" stroke="var(--warn-border)" stroke-width="0.6997" stroke-dasharray="2.3324 1.3995"/>
  <text x="689.9998" y="190.959006398924" font-size="19.036163176336" fill="var(--danger-accent)" font-family="Arial, sans-serif">Diminishing returns</text>
  <text x="689.9998" y="214.794490898863" font-size="19.036163176336" fill="var(--danger-accent)" font-family="Arial, sans-serif">after ~5-8 examples</text>
  <rect x="40" y="461.095868174147" width="566.6666" height="158.904131825853" rx="6.241706052681" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3332" y="497.643748151645" text-anchor="middle" font-size="19.310486157351" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Guidelines</text>
  <text x="73.3333" y="529.424358078513" font-size="19.036163176336" fill="var(--text)" font-family="Arial, sans-serif">0 examples: Common/simple tasks</text>
  <text x="73.3333" y="556.438239050508" font-size="19.036163176336" fill="var(--text)" font-family="Arial, sans-serif">1-3 examples: Well-defined tasks</text>
  <text x="73.3333" y="583.4519035842" font-size="19.036163176336" fill="var(--text)" font-family="Arial, sans-serif">4-8 examples: Complex/ambiguous tasks</text>
  <rect x="673.3334" y="461.095868174147" width="566.6666" height="158.904131825853" rx="6.241706052681" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6668" y="497.643748151645" text-anchor="middle" font-size="19.310486157351" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Advanced</text>
  <text x="706.6665" y="529.424358078513" font-size="19.036163176336" fill="var(--text)" font-family="Arial, sans-serif">10+ examples: Domain-specific formats</text>
  <text x="706.6665" y="556.438239050508" font-size="19.036163176336" fill="var(--text)" font-family="Arial, sans-serif">50+ examples: Consider fine-tuning</text>
  <text x="706.6665" y="583.4519035842" font-size="19.036163176336" fill="var(--text)" font-family="Arial, sans-serif">instead of few-shot prompting</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="24.7503" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">How Many Examples Do You Need?</text>
  <line x1="140.0001" y1="84.0505" x2="140.0001" y2="407.0885" stroke="var(--text)" stroke-width="0.933" />
  <line x1="140.0001" y1="407.0885" x2="1056.6667" y2="407.0885" stroke="var(--text)" stroke-width="0.933" />
  <text x="56.6666" y="252.9113" text-anchor="middle" font-size="20.1095" fill="var(--text)" transform="rotate(-90, 50, 175)" font-family="Arial, sans-serif">Accuracy</text>
  <text x="598.3333" y="451.139" text-anchor="middle" font-size="20.1095" fill="var(--text)" font-family="Arial, sans-serif">Number of examples</text>
  <text x="123.3334" y="395.3416" text-anchor="end" font-size="18.299" fill="var(--text-muted)" font-family="Arial, sans-serif">50%</text>
  <text x="123.3334" y="318.9873" text-anchor="end" font-size="18.299" fill="var(--text-muted)" font-family="Arial, sans-serif">70%</text>
  <text x="123.3334" y="230.886" text-anchor="end" font-size="18.299" fill="var(--text-muted)" font-family="Arial, sans-serif">80%</text>
  <text x="123.3334" y="142.7849" text-anchor="end" font-size="18.299" fill="var(--text-muted)" font-family="Arial, sans-serif">90%</text>
  <text x="123.3334" y="98.7341" text-anchor="end" font-size="18.299" fill="var(--text-muted)" font-family="Arial, sans-serif">100%</text>
  <text x="223.3333" y="433.5188" text-anchor="middle" font-size="18.299" fill="var(--text-muted)" font-family="Arial, sans-serif">0</text>
  <text x="356.6667" y="433.5188" text-anchor="middle" font-size="18.299" fill="var(--text-muted)" font-family="Arial, sans-serif">2</text>
  <text x="489.9999" y="433.5188" text-anchor="middle" font-size="18.299" fill="var(--text-muted)" font-family="Arial, sans-serif">4</text>
  <text x="623.3333" y="433.5188" text-anchor="middle" font-size="18.299" fill="var(--text-muted)" font-family="Arial, sans-serif">6</text>
  <text x="756.6666" y="433.5188" text-anchor="middle" font-size="18.299" fill="var(--text-muted)" font-family="Arial, sans-serif">8</text>
  <text x="873.3332" y="433.5188" text-anchor="middle" font-size="18.299" fill="var(--text-muted)" font-family="Arial, sans-serif">10</text>
  <text x="1006.6665" y="433.5188" text-anchor="middle" font-size="18.299" fill="var(--text-muted)" font-family="Arial, sans-serif">20</text>
  <path d="M 223.3333 385.063 Q 306.6666 304.3036 390 245.5695 Q 473.3332 194.1772 556.6667 157.4682 Q 639.9999 135.4431 723.3331 123.6961 Q 806.6666 116.3543 889.9998 110.4811 Q 973.3332 107.5442 1039.9998 106.0759" fill="none" stroke="var(--primary-border)" stroke-width="1.3995" />
  <line x1="656.6665" y1="84.0505" x2="656.6665" y2="407.0885" stroke="var(--warn-border)" stroke-width="0.6997" stroke-dasharray="2.3324 1.3995" />
  <text x="689.9998" y="223.5443" font-size="18.299" fill="var(--danger-accent)" font-family="Arial, sans-serif">Diminishing returns</text>
  <text x="689.9998" y="245.5695" font-size="18.299" fill="var(--danger-accent)" font-family="Arial, sans-serif">after ~5-8 examples</text>
  <rect x="40" y="473.1645" width="566.6666" height="146.8355" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3332" y="506.9366" text-anchor="middle" font-size="18.5627" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Guidelines</text>
  <text x="73.3333" y="536.3035" font-size="18.299" fill="var(--text)" font-family="Arial, sans-serif">0 examples: Common/simple tasks</text>
  <text x="73.3333" y="561.2657" font-size="18.299" fill="var(--text)" font-family="Arial, sans-serif">1-3 examples: Well-defined tasks</text>
  <text x="73.3333" y="586.2277" font-size="18.299" fill="var(--text)" font-family="Arial, sans-serif">4-8 examples: Complex/ambiguous tasks</text>
  <rect x="673.3334" y="473.1645" width="566.6666" height="146.8355" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.6668" y="506.9366" text-anchor="middle" font-size="18.5627" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Advanced</text>
  <text x="706.6665" y="536.3035" font-size="18.299" fill="var(--text)" font-family="Arial, sans-serif">10+ examples: Domain-specific formats</text>
  <text x="706.6665" y="561.2657" font-size="18.299" fill="var(--text)" font-family="Arial, sans-serif">50+ examples: Consider fine-tuning</text>
  <text x="706.6665" y="586.2277" font-size="18.299" fill="var(--text)" font-family="Arial, sans-serif">instead of few-shot prompting</text>
</svg>
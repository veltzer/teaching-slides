<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="437.1182" y="54.6398" text-anchor="middle" font-size="13.5255" font-weight="bold" fill="var(--text)">How Many Examples Do You Need?</text>
  <line x1="183.516" y1="80.5763" x2="183.516" y2="270.7781" stroke="var(--text)" stroke-width="1.366" />
  <line x1="183.516" y1="270.7781" x2="648.4534" y2="270.7781" stroke="var(--text)" stroke-width="1.366" />
  <text x="141.2489" y="180" text-anchor="middle" font-size="10.9894" fill="var(--text)" transform="rotate(-90, 50, 175)">Accuracy</text>
  <text x="415.9847" y="296.7146" text-anchor="middle" font-size="10.9894" fill="var(--text)">Number of examples</text>
  <text x="175.0626" y="263.8616" text-anchor="end" font-size="10" fill="var(--text-muted)">50%</text>
  <text x="175.0626" y="218.9049" text-anchor="end" font-size="10" fill="var(--text-muted)">70%</text>
  <text x="175.0626" y="167.0317" text-anchor="end" font-size="10" fill="var(--text-muted)">80%</text>
  <text x="175.0626" y="115.1586" text-anchor="end" font-size="10" fill="var(--text-muted)">90%</text>
  <text x="175.0626" y="89.2219" text-anchor="end" font-size="10" fill="var(--text-muted)">100%</text>
  <text x="225.783" y="286.34" text-anchor="middle" font-size="10" fill="var(--text-muted)">0</text>
  <text x="293.4103" y="286.34" text-anchor="middle" font-size="10" fill="var(--text-muted)">2</text>
  <text x="361.0375" y="286.34" text-anchor="middle" font-size="10" fill="var(--text-muted)">4</text>
  <text x="428.6648" y="286.34" text-anchor="middle" font-size="10" fill="var(--text-muted)">6</text>
  <text x="496.2921" y="286.34" text-anchor="middle" font-size="10" fill="var(--text-muted)">8</text>
  <text x="555.4659" y="286.34" text-anchor="middle" font-size="10" fill="var(--text-muted)">10</text>
  <text x="623.0932" y="286.34" text-anchor="middle" font-size="10" fill="var(--text-muted)">20</text>
  <path d="M 225.783 257.8097 Q 268.05 210.2593 310.3171 175.6772 Q 352.5841 145.4179 394.8512 123.804 Q 437.1182 110.8358 479.3852 103.9193 Q 521.6523 99.5965 563.9193 96.1384 Q 606.1864 94.4092 640 93.5447" fill="none" stroke="var(--primary-border)" stroke-width="2.049" />
  <line x1="445.5716" y1="80.5763" x2="445.5716" y2="270.7781" stroke="var(--warn-border)" stroke-width="1.0245" stroke-dasharray="3.415 2.049" />
  <text x="462.4784" y="162.709" font-size="10" fill="var(--danger-accent)">Diminishing returns</text>
  <text x="462.4784" y="175.6772" font-size="10" fill="var(--danger-accent)">after ~5-8 examples</text>
  <rect x="132.7955" y="309.683" width="287.4159" height="86.4554" rx="5.0721" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.366" />
  <text x="276.5034" y="329.5677" text-anchor="middle" font-size="10.1441" font-weight="bold" fill="var(--primary-accent)">Guidelines</text>
  <text x="149.7023" y="346.8587" font-size="10" fill="var(--text)">0 examples: Common/simple tasks</text>
  <text x="149.7023" y="361.5562" font-size="10" fill="var(--text)">1-3 examples: Well-defined tasks</text>
  <text x="149.7023" y="376.2536" font-size="10" fill="var(--text)">4-8 examples: Complex/ambiguous tasks</text>
  <rect x="454.0251" y="309.683" width="287.4159" height="86.4554" rx="5.0721" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.366" />
  <text x="597.733" y="329.5677" text-anchor="middle" font-size="10.1441" font-weight="bold" fill="var(--danger-accent)">Advanced</text>
  <text x="470.9318" y="346.8587" font-size="10" fill="var(--text)">10+ examples: Domain-specific formats</text>
  <text x="470.9318" y="361.5562" font-size="10" fill="var(--text)">50+ examples: Consider fine-tuning</text>
  <text x="470.9318" y="376.2536" font-size="10" fill="var(--text)">instead of few-shot prompting</text>
</svg>
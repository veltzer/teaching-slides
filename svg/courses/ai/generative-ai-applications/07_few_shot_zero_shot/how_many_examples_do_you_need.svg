    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="400" y="30.6818" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text-dark)">How Many Examples Do You Need?</text>
  <line x1="100" y1="61.3636" x2="100" y2="286.3636" stroke="var(--text-dark)" stroke-width="2" />
  <line x1="100" y1="286.3636" x2="650" y2="286.3636" stroke="var(--text-dark)" stroke-width="2" />
  <text x="50" y="178.9773" text-anchor="middle" font-size="13" fill="var(--text-dark)" transform="rotate(-90, 50, 175)">Accuracy</text>
  <text x="375" y="317.0454" text-anchor="middle" font-size="13" fill="var(--text-dark)">Number of examples</text>
  <text x="90" y="278.1818" text-anchor="end" font-size="10" fill="var(--text-mid)">50%</text>
  <text x="90" y="225" text-anchor="end" font-size="10" fill="var(--text-mid)">70%</text>
  <text x="90" y="163.6364" text-anchor="end" font-size="10" fill="var(--text-mid)">80%</text>
  <text x="90" y="102.2728" text-anchor="end" font-size="10" fill="var(--text-mid)">90%</text>
  <text x="90" y="71.5909" text-anchor="end" font-size="10" fill="var(--text-mid)">100%</text>
  <text x="150" y="304.7727" text-anchor="middle" font-size="10" fill="var(--text-mid)">0</text>
  <text x="230" y="304.7727" text-anchor="middle" font-size="10" fill="var(--text-mid)">2</text>
  <text x="310" y="304.7727" text-anchor="middle" font-size="10" fill="var(--text-mid)">4</text>
  <text x="390" y="304.7727" text-anchor="middle" font-size="10" fill="var(--text-mid)">6</text>
  <text x="470" y="304.7727" text-anchor="middle" font-size="10" fill="var(--text-mid)">8</text>
  <text x="540" y="304.7727" text-anchor="middle" font-size="10" fill="var(--text-mid)">10</text>
  <text x="620" y="304.7727" text-anchor="middle" font-size="10" fill="var(--text-mid)">20</text>
  <path d="M 150 271.0227 Q 200 214.7727 250 173.8636 Q 300 138.0682 350 112.5 Q 400 97.1591 450 88.9772 Q 500 83.8636 550 79.7728 Q 600 77.7272 640 76.7046" fill="none" stroke="var(--primary-bright)" stroke-width="3" />
  <line x1="410" y1="61.3636" x2="410" y2="286.3636" stroke="var(--warn-yellow)" stroke-width="1.5" stroke-dasharray="5 3" />
  <text x="430" y="158.5228" font-size="10" fill="var(--danger-deeper)">Diminishing returns</text>
  <text x="430" y="173.8636" font-size="10" fill="var(--danger-deeper)">after ~5-8 examples</text>
  <rect x="40" y="332.3864" width="340" height="102.2728" rx="5" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.5" />
  <text x="210" y="355.9091" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--primary-bright)">Guidelines</text>
  <text x="60" y="376.3636" font-size="10" fill="var(--text-dark)">0 examples: Common/simple tasks</text>
  <text x="60" y="393.75" font-size="10" fill="var(--text-dark)">1-3 examples: Well-defined tasks</text>
  <text x="60" y="411.1364" font-size="10" fill="var(--text-dark)">4-8 examples: Complex/ambiguous tasks</text>
  <rect x="420" y="332.3864" width="340" height="102.2728" rx="5" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.5" />
  <text x="590" y="355.9091" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--danger-deeper)">Advanced</text>
  <text x="440" y="376.3636" font-size="10" fill="var(--text-dark)">10+ examples: Domain-specific formats</text>
  <text x="440" y="393.75" font-size="10" fill="var(--text-dark)">50+ examples: Consider fine-tuning</text>
  <text x="440" y="411.1364" font-size="10" fill="var(--text-dark)">instead of few-shot prompting</text>
</svg>
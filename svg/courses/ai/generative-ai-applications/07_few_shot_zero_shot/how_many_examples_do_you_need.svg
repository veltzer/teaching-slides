  <ns0:text x="210" y="355.9091" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Guidelines</ns0:text>
  <ns0:text x="60" y="376.3636" font-size="10" fill="#333">0 examples: Common/simple tasks</ns0:text>

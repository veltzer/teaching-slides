<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="200" height="210.909090909091" rx="6.16146381663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="113.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--primary-text)">Token Embed</text>
  <text x="140" y="156" text-anchor="middle" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--primary-text)">"quantum" -&gt; vector</text>
  <text x="140" y="198.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--primary-text)">vocab x d_model</text>

  <line x1="250" y1="145.454545454545" x2="310" y2="145.454545454545" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="320" y="40" width="200" height="210.909090909091" rx="6.16146381663" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="113.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--warn-text)">+ Position</text>
  <text x="420" y="161.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--warn-text)">sinusoidal</text>
  <text x="420" y="198.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--warn-text)">or RoPE</text>

  <line x1="530" y1="145.454545454545" x2="590" y2="145.454545454545" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="600" y="40" width="420" height="210.909090909091" rx="6.16146381663" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="810" y="82.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592033994309" font-weight="bold" fill="var(--info-text)">Decoder Block x N</text>
  <text x="710" y="134.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" font-weight="bold" fill="var(--info-text)">Masked Self-Attn</text>
  <text x="710" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--info-text)">causal, look left</text>
  <text x="710" y="192.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--info-text)">multi-head Q,K,V</text>
  <text x="910" y="134.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" font-weight="bold" fill="var(--info-text)">MLP</text>
  <text x="910" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--info-text)">GELU, LayerNorm</text>
  <text x="910" y="192.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--info-text)">residual add</text>

  <line x1="1030" y1="145.454545454545" x2="1090" y2="145.454545454545" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1100" y="40" width="140" height="210.909090909091" rx="6.16146381663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1170" y="124.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--primary-text)">Linear</text>
  <text x="1170" y="161.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--primary-text)">to vocab</text>
  <text x="1170" y="203.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" font-weight="bold" fill="var(--primary-text)">Softmax</text>

  <rect x="40" y="293.090909090909" width="600" height="326.909090909091" rx="6.16146381663" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="340" y="335.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--text)">Block structure</text>
  <text x="340" y="388" text-anchor="middle" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text-muted)">x = x + Attn(LN(x))</text>
  <text x="340" y="424.909090909091" text-anchor="middle" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text-muted)">x = x + MLP(LN(x))</text>
  <text x="340" y="482.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--text-muted)">N: GPT-2=12, GPT-3=96</text>
  <text x="340" y="519.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--text-muted)">d_model: 768 to 12288</text>
  <text x="340" y="577.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" font-style="italic" fill="var(--text-faint)">MLP dominates params</text>

  <rect x="660" y="293.090909090909" width="580" height="326.909090909091" rx="6.16146381663" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="335.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--ok-text)">Next token distribution</text>
  <text x="950" y="393.272727272727" text-anchor="middle" font-family="Courier New, monospace" font-size="16.430570177679" fill="var(--ok-text)">"in" 0.32</text>
  <text x="950" y="430.181818181818" text-anchor="middle" font-family="Courier New, monospace" font-size="16.430570177679" fill="var(--ok-text)">"of" 0.18</text>
  <text x="950" y="467.090909090909" text-anchor="middle" font-family="Courier New, monospace" font-size="16.430570177679" fill="var(--ok-text)">"mechanics" 0.09</text>
  <text x="950" y="525.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--ok-text)">sample: temperature, top-k, top-p</text>
  <text x="950" y="567.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" font-style="italic" fill="var(--ok-text)">append, feed back, repeat</text>
</svg>

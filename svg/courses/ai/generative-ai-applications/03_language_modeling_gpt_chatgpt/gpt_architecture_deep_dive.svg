  <text x="580.0436" y="31.3726" text-anchor="middle" font-size="18.8235" font-weight="bold" fill="var(--text-dark)">GPT Architecture Deep Dive</text>
  <rect x="248.5901" y="50.1961" width="662.907" height="56.4706" rx="6.2745" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.5098" />
  <text x="580.0436" y="72.7843" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text-dark)">TOKEN EMBEDDING</text>
  <text x="580.0436" y="95.3726" text-anchor="middle" font-size="12.5491" fill="var(--text-mid)">"Explain" -&gt; [0.12, -0.34, ...] "quantum" -&gt; [0.78, 0.11, ...]</text>
  <line x1="580.0436" y1="106.6667" x2="580.0436" y2="131.7647" stroke="var(--primary-bright)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="364.5988" y="131.7647" width="430.8896" height="37.6471" rx="6.2745" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.8823" />
  <text x="580.0436" y="156.8627" text-anchor="middle" font-size="13.804" fill="var(--danger-deeper)">+ Positional Encoding</text>
  <line x1="580.0436" y1="169.4118" x2="580.0436" y2="194.5098" stroke="var(--primary-bright)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="165.7267" y="194.5098" width="828.6337" height="263.5294" rx="10.0392" fill="var(--surface-light)" stroke="var(--primary-bright)" stroke-width="2.5098" />
  <text x="580.0436" y="225.8824" text-anchor="middle" font-size="16.3137" font-weight="bold" fill="var(--primary-bright)">TRANSFORMER DECODER BLOCK x N</text>
  <rect x="232.0174" y="244.7059" width="696.0523" height="69.0196" rx="6.2745" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.8823" />
  <text x="580.0436" y="273.5687" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text-dark)">Masked Multi-Head Self-Attention</text>
  <text x="580.0436" y="298.6667" text-anchor="middle" font-size="12.5491" fill="var(--text-mid)">(causal: can only look left)</text>
  <line x1="580.0436" y1="313.7255" x2="580.0436" y2="338.8236" stroke="var(--primary-bright)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="232.0174" y="338.8236" width="696.0523" height="69.0196" rx="6.2745" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.8823" />
  <text x="580.0436" y="367.6863" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text-dark)">Feed-Forward Network (MLP)</text>
  <text x="580.0436" y="392.7843" text-anchor="middle" font-size="12.5491" fill="var(--text-mid)">FFN(x) = GELU(xW1 + b1)W2 + b2</text>
  <text x="580.0436" y="439.2157" text-anchor="middle" font-size="12.5491" fill="var(--text-mid)">Layer Norm + Residual connections</text>
  <line x1="580.0436" y1="458.0392" x2="580.0436" y2="495.6863" stroke="var(--primary-bright)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="248.5901" y="495.6863" width="662.907" height="69.0196" rx="6.2745" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.5098" />
  <text x="580.0436" y="524.549" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text-dark)">LINEAR + SOFTMAX</text>
  <text x="580.0436" y="549.6471" text-anchor="middle" font-size="13.804" fill="var(--text-mid)">Vocabulary probability distribution</text>
  <line x1="580.0436" y1="564.7059" x2="580.0436" y2="596.0785" stroke="var(--primary-bright)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="372.8852" y="596.0785" width="414.3169" height="43.9215" rx="6.2745" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.5098" />
  <text x="580.0436" y="624.9413" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--ok-bright)">Next token: "in" (p=0.32)</text>

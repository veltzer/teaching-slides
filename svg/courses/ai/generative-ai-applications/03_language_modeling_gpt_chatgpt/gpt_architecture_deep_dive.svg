<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="ad" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">GPT Architecture Deep Dive</text>
  <!-- Input -->
  <rect x="150" y="40" width="400" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">TOKEN EMBEDDING</text>
  <text x="350" y="76" text-anchor="middle" font-size="10" fill="#666">"Explain" -> [0.12, -0.34, ...] "quantum" -> [0.78, 0.11, ...]</text>
  <line x1="350" y1="85" x2="350" y2="105" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ad)"/>
  <!-- Positional encoding -->
  <rect x="220" y="105" width="260" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="350" y="125" text-anchor="middle" font-size="11" fill="#856404">+ Positional Encoding</text>
  <line x1="350" y1="135" x2="350" y2="155" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ad)"/>
  <!-- Transformer block -->
  <rect x="100" y="155" width="500" height="210" rx="8" fill="#f0f7ff" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">TRANSFORMER DECODER BLOCK x N</text>
  <!-- Self-attention -->
  <rect x="140" y="195" width="420" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="350" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Masked Multi-Head Self-Attention</text>
  <text x="350" y="238" text-anchor="middle" font-size="10" fill="#666">(causal: can only look left)</text>
  <line x1="350" y1="250" x2="350" y2="270" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ad)"/>
  <!-- FFN -->
  <rect x="140" y="270" width="420" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="350" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Feed-Forward Network (MLP)</text>
  <text x="350" y="313" text-anchor="middle" font-size="10" fill="#666">FFN(x) = GELU(xW1 + b1)W2 + b2</text>
  <!-- Layer norm note -->
  <text x="350" y="350" text-anchor="middle" font-size="10" fill="#666">Layer Norm + Residual connections</text>
  <line x1="350" y1="365" x2="350" y2="395" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ad)"/>
  <!-- Output -->
  <rect x="150" y="395" width="400" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">LINEAR + SOFTMAX</text>
  <text x="350" y="438" text-anchor="middle" font-size="11" fill="#666">Vocabulary probability distribution</text>
  <line x1="350" y1="450" x2="350" y2="475" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ad)"/>
  <rect x="225" y="475" width="250" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Next token: "in" (p=0.32)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 0,6.9231" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="580.0436" y="31.3726" text-anchor="middle" font-size="18.8235" font-weight="bold" fill="var(--text)">GPT Architecture Deep Dive</text>
  <rect x="248.5901" y="50.1961" width="662.907" height="56.4706" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.0436" y="72.7843" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text)">TOKEN EMBEDDING</text>
  <text x="580.0436" y="95.3726" text-anchor="middle" font-size="12.5491" fill="var(--text-muted)">"Explain" -&gt; [0.12, -0.34, ...] "quantum" -&gt; [0.78, 0.11, ...]</text>
  <line x1="580.0436" y1="106.6667" x2="580.0436" y2="131.7647" stroke="var(--primary-border)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="364.5988" y="131.7647" width="430.8896" height="37.6471" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="580.0436" y="156.8627" text-anchor="middle" font-size="13.804" fill="var(--danger-accent)">+ Positional Encoding</text>
  <line x1="580.0436" y1="169.4118" x2="580.0436" y2="194.5098" stroke="var(--primary-border)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="165.7267" y="194.5098" width="828.6337" height="263.5294" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="580.0436" y="225.8824" text-anchor="middle" font-size="16.3137" font-weight="bold" fill="var(--primary-accent)">TRANSFORMER DECODER BLOCK x N</text>
  <rect x="232.0174" y="244.7059" width="696.0523" height="69.0196" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.0436" y="273.5687" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text)">Masked Multi-Head Self-Attention</text>
  <text x="580.0436" y="298.6667" text-anchor="middle" font-size="12.5491" fill="var(--text-muted)">(causal: can only look left)</text>
  <line x1="580.0436" y1="313.7255" x2="580.0436" y2="338.8236" stroke="var(--primary-border)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="232.0174" y="338.8236" width="696.0523" height="69.0196" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="580.0436" y="367.6863" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text)">Feed-Forward Network (MLP)</text>
  <text x="580.0436" y="392.7843" text-anchor="middle" font-size="12.5491" fill="var(--text-muted)">FFN(x) = GELU(xW1 + b1)W2 + b2</text>
  <text x="580.0436" y="439.2157" text-anchor="middle" font-size="12.5491" fill="var(--text-muted)">Layer Norm + Residual connections</text>
  <line x1="580.0436" y1="458.0392" x2="580.0436" y2="495.6863" stroke="var(--primary-border)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="248.5901" y="495.6863" width="662.907" height="69.0196" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="580.0436" y="524.549" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--text)">LINEAR + SOFTMAX</text>
  <text x="580.0436" y="549.6471" text-anchor="middle" font-size="13.804" fill="var(--text-muted)">Vocabulary probability distribution</text>
  <line x1="580.0436" y1="564.7059" x2="580.0436" y2="596.0785" stroke="var(--primary-border)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="372.8852" y="596.0785" width="414.3169" height="43.9215" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="580.0436" y="624.9413" text-anchor="middle" font-size="15.0588" font-weight="bold" fill="var(--ok-accent)">Next token: "in" (p=0.32)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 0,6.9231" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="17.942" font-weight="bold" fill="var(--text)">GPT Architecture Deep Dive</text>
  <rect x="324" y="57.9381" width="632" height="53.8144" rx="6.0013" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="79.4639" text-anchor="middle" font-size="14.3536" font-weight="bold" fill="var(--text)">TOKEN EMBEDDING</text>
  <text x="639.9999" y="100.9897" text-anchor="middle" font-size="11.9614" fill="var(--text-muted)">"Explain" -&gt; [0.12, -0.34, ...] "quantum" -&gt; [0.78, 0.11, ...]</text>
  <line x1="639.9999" y1="111.7526" x2="639.9999" y2="135.6701" stroke="var(--primary-border)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="434.6" y="135.6701" width="410.8001" height="35.8763" rx="6.0013" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="639.9999" y="159.5875" text-anchor="middle" font-size="13.1575" fill="var(--danger-accent)">+ Positional Encoding</text>
  <line x1="639.9999" y1="171.5464" x2="639.9999" y2="195.4639" stroke="var(--primary-border)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="245" y="195.4639" width="790" height="251.134" rx="6.0013" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="225.3608" text-anchor="middle" font-size="15.5498" font-weight="bold" fill="var(--primary-accent)">TRANSFORMER DECODER BLOCK x N</text>
  <rect x="308.2" y="243.299" width="663.6" height="65.7732" rx="6.0013" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="270.8042" text-anchor="middle" font-size="14.3536" font-weight="bold" fill="var(--text)">Masked Multi-Head Self-Attention</text>
  <text x="639.9999" y="294.7217" text-anchor="middle" font-size="11.9614" fill="var(--text-muted)">(causal: can only look left)</text>
  <line x1="639.9999" y1="309.0721" x2="639.9999" y2="332.9897" stroke="var(--primary-border)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="308.2" y="332.9897" width="663.6" height="65.7732" rx="6.0013" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="639.9999" y="360.4948" text-anchor="middle" font-size="14.3536" font-weight="bold" fill="var(--text)">Feed-Forward Network (MLP)</text>
  <text x="639.9999" y="384.4123" text-anchor="middle" font-size="11.9614" fill="var(--text-muted)">FFN(x) = GELU(xW1 + b1)W2 + b2</text>
  <text x="639.9999" y="428.6598" text-anchor="middle" font-size="11.9614" fill="var(--text-muted)">Layer Norm + Residual connections</text>
  <line x1="639.9999" y1="446.5979" x2="639.9999" y2="482.4742" stroke="var(--primary-border)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="324" y="482.4742" width="632" height="65.7732" rx="6.0013" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="639.9999" y="509.9794" text-anchor="middle" font-size="14.3536" font-weight="bold" fill="var(--text)">LINEAR + SOFTMAX</text>
  <text x="639.9999" y="533.8969" text-anchor="middle" font-size="13.1575" fill="var(--text-muted)">Vocabulary probability distribution</text>
  <line x1="639.9999" y1="548.2474" x2="639.9999" y2="578.1444" stroke="var(--primary-border)" stroke-width="1.8823" marker-end="url(#ad)" />
  <rect x="442.5001" y="578.1444" width="395.0001" height="41.8556" rx="6.0013" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="639.9999" y="605.6496" text-anchor="middle" font-size="14.3536" font-weight="bold" fill="var(--ok-accent)">Next token: "in" (p=0.32)</text>
</svg>
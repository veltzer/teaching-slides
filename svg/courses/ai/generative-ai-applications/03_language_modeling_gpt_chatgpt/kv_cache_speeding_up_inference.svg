<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="583.7838" height="580" rx="6.244998088125" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.8919" y="88.333351388889" text-anchor="middle" font-size="23.371176761699" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Without KV Cache (naive)</text>
  <rect x="72.4324" y="127.000010833334" width="518.9189" height="87.000010833334" rx="6.244998088125" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.6"/>
  <text x="331.8919" y="161.800036833334" text-anchor="middle" font-size="18.363000544927" fill="var(--text)" font-family="Arial, sans-serif">Step 1: Process ["The"]</text>
  <text x="331.8919" y="196.599954499999" text-anchor="middle" font-size="16.693712555971" fill="var(--danger-accent)" font-family="Arial, sans-serif">Compute K,V for all</text>
  <rect x="72.4324" y="242.999989166666" width="518.9189" height="87.000010833334" rx="6.244998088125" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.6"/>
  <text x="331.8919" y="277.800015166667" text-anchor="middle" font-size="18.363000544927" fill="var(--text)" font-family="Arial, sans-serif">Step 2: Process ["The", "cat"]</text>
  <text x="331.8919" y="312.600041166668" text-anchor="middle" font-size="16.693712555971" fill="var(--danger-accent)" font-family="Arial, sans-serif">RECOMPUTE K,V for all</text>
  <rect x="72.4324" y="358.999967499999" width="518.9189" height="87.000010833334" rx="6.244998088125" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.6"/>
  <text x="331.8919" y="393.7999935" text-anchor="middle" font-size="18.363000544927" fill="var(--text)" font-family="Arial, sans-serif">Step 3: Process ["The", "cat", "sat"]</text>
  <text x="331.8919" y="428.600019500001" text-anchor="middle" font-size="16.693712555971" fill="var(--danger-accent)" font-family="Arial, sans-serif">RECOMPUTE again</text>
  <rect x="137.2973" y="474.999945833332" width="389.1892" height="58.000043333335" rx="6.244998088125" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.8919" y="513.666713611112" text-anchor="middle" font-size="20.032392617184" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Quadratic complexity!</text>
  <rect x="656.2162" y="40" width="583.7838" height="580" rx="6.244998088125" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.1081" y="88.333351388889" text-anchor="middle" font-size="23.371176761699" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">With KV Cache</text>
  <rect x="688.6486" y="127.000010833334" width="518.9189" height="87.000010833334" rx="6.244998088125" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.6"/>
  <text x="948.1081" y="161.800036833334" text-anchor="middle" font-size="18.363000544927" fill="var(--text)" font-family="Arial, sans-serif">Step 1: Process ["The"]</text>
  <text x="948.1081" y="196.599954499999" text-anchor="middle" font-size="16.693712555971" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cache K1, V1</text>
  <rect x="688.6486" y="242.999989166666" width="518.9189" height="87.000010833334" rx="6.244998088125" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.6"/>
  <text x="948.1081" y="277.800015166667" text-anchor="middle" font-size="18.363000544927" fill="var(--text)" font-family="Arial, sans-serif">Step 2: Process ["cat"]</text>
  <text x="948.1081" y="312.600041166668" text-anchor="middle" font-size="16.693712555971" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cache K2, V2 (reuse K1, V1)</text>
  <rect x="688.6486" y="358.999967499999" width="518.9189" height="87.000010833334" rx="6.244998088125" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.6"/>
  <text x="948.1081" y="393.7999935" text-anchor="middle" font-size="18.363000544927" fill="var(--text)" font-family="Arial, sans-serif">Step 3: Process ["sat"]</text>
  <text x="948.1081" y="428.600019500001" text-anchor="middle" font-size="16.693712555971" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cache K3, V3 (reuse all)</text>
  <rect x="753.5135" y="474.999945833332" width="389.1892" height="58.000043333335" rx="6.244998088125" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.1081" y="513.666713611112" text-anchor="middle" font-size="20.032392617184" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Linear complexity per token!</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">KV Cache: Speeding Up Inference</text>
  <rect x="48" y="99" width="576" height="540" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="336" y="144" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#dc3545">Without KV Cache (naive)</text>
  <rect x="80" y="180" width="512" height="81" rx="8" fill="#fff" stroke="#dc3545" stroke-width="1.6" />
  <text x="336" y="212.4" text-anchor="middle" font-size="17.6" fill="#333">Step 1: Process ["The"]</text>
  <text x="336" y="244.8" text-anchor="middle" font-size="16" fill="#dc3545">Compute K,V for all</text>
  <rect x="80" y="288" width="512" height="81" rx="8" fill="#fff" stroke="#dc3545" stroke-width="1.6" />
  <text x="336" y="320.4" text-anchor="middle" font-size="17.6" fill="#333">Step 2: Process ["The", "cat"]</text>
  <text x="336" y="352.8" text-anchor="middle" font-size="16" fill="#dc3545">RECOMPUTE K,V for all</text>
  <rect x="80" y="396" width="512" height="81" rx="8" fill="#fff" stroke="#dc3545" stroke-width="1.6" />
  <text x="336" y="428.4" text-anchor="middle" font-size="17.6" fill="#333">Step 3: Process ["The", "cat", "sat"]</text>
  <text x="336" y="460.8" text-anchor="middle" font-size="16" fill="#dc3545">RECOMPUTE again</text>
  <rect x="144" y="504" width="384" height="54" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <text x="336" y="540" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#dc3545">Quadratic complexity!</text>
  <rect x="656" y="99" width="576" height="540" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="944" y="144" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#28a745">With KV Cache</text>
  <rect x="688" y="180" width="512" height="81" rx="8" fill="#fff" stroke="#28a745" stroke-width="1.6" />
  <text x="944" y="212.4" text-anchor="middle" font-size="17.6" fill="#333">Step 1: Process ["The"]</text>
  <text x="944" y="244.8" text-anchor="middle" font-size="16" fill="#28a745">Cache K1, V1</text>
  <rect x="688" y="288" width="512" height="81" rx="8" fill="#fff" stroke="#28a745" stroke-width="1.6" />
  <text x="944" y="320.4" text-anchor="middle" font-size="17.6" fill="#333">Step 2: Process ["cat"]</text>
  <text x="944" y="352.8" text-anchor="middle" font-size="16" fill="#28a745">Cache K2, V2 (reuse K1, V1)</text>
  <rect x="688" y="396" width="512" height="81" rx="8" fill="#fff" stroke="#28a745" stroke-width="1.6" />
  <text x="944" y="428.4" text-anchor="middle" font-size="17.6" fill="#333">Step 3: Process ["sat"]</text>
  <text x="944" y="460.8" text-anchor="middle" font-size="16" fill="#28a745">Cache K3, V3 (reuse all)</text>
  <rect x="752" y="504" width="384" height="54" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="944" y="540" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#28a745">Linear complexity per token!</text>
</svg>
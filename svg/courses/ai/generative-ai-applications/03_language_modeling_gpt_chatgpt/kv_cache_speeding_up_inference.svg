<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text-dark)">KV Cache: Speeding Up Inference</text>
  <rect x="48" y="99" width="576" height="540" rx="8" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.2" />
  <text x="336" y="144" text-anchor="middle" font-size="22.4" font-weight="bold" fill="var(--danger-bright)">Without KV Cache (naive)</text>
  <rect x="80" y="180" width="512" height="81" rx="8" fill="var(--bg)" stroke="var(--danger-bright)" stroke-width="1.6" />
  <text x="336" y="212.4" text-anchor="middle" font-size="17.6" fill="var(--text-dark)">Step 1: Process ["The"]</text>
  <text x="336" y="244.8" text-anchor="middle" font-size="16" fill="var(--danger-bright)">Compute K,V for all</text>
  <rect x="80" y="288" width="512" height="81" rx="8" fill="var(--bg)" stroke="var(--danger-bright)" stroke-width="1.6" />
  <text x="336" y="320.4" text-anchor="middle" font-size="17.6" fill="var(--text-dark)">Step 2: Process ["The", "cat"]</text>
  <text x="336" y="352.8" text-anchor="middle" font-size="16" fill="var(--danger-bright)">RECOMPUTE K,V for all</text>
  <rect x="80" y="396" width="512" height="81" rx="8" fill="var(--bg)" stroke="var(--danger-bright)" stroke-width="1.6" />
  <text x="336" y="428.4" text-anchor="middle" font-size="17.6" fill="var(--text-dark)">Step 3: Process ["The", "cat", "sat"]</text>
  <text x="336" y="460.8" text-anchor="middle" font-size="16" fill="var(--danger-bright)">RECOMPUTE again</text>
  <rect x="144" y="504" width="384" height="54" rx="8" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.4" />
  <text x="336" y="540" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--danger-bright)">Quadratic complexity!</text>
  <rect x="656" y="99" width="576" height="540" rx="8" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.2" />
  <text x="944" y="144" text-anchor="middle" font-size="22.4" font-weight="bold" fill="var(--ok-bright)">With KV Cache</text>
  <rect x="688" y="180" width="512" height="81" rx="8" fill="var(--bg)" stroke="var(--ok-bright)" stroke-width="1.6" />
  <text x="944" y="212.4" text-anchor="middle" font-size="17.6" fill="var(--text-dark)">Step 1: Process ["The"]</text>
  <text x="944" y="244.8" text-anchor="middle" font-size="16" fill="var(--ok-bright)">Cache K1, V1</text>
  <rect x="688" y="288" width="512" height="81" rx="8" fill="var(--bg)" stroke="var(--ok-bright)" stroke-width="1.6" />
  <text x="944" y="320.4" text-anchor="middle" font-size="17.6" fill="var(--text-dark)">Step 2: Process ["cat"]</text>
  <text x="944" y="352.8" text-anchor="middle" font-size="16" fill="var(--ok-bright)">Cache K2, V2 (reuse K1, V1)</text>
  <rect x="688" y="396" width="512" height="81" rx="8" fill="var(--bg)" stroke="var(--ok-bright)" stroke-width="1.6" />
  <text x="944" y="428.4" text-anchor="middle" font-size="17.6" fill="var(--text-dark)">Step 3: Process ["sat"]</text>
  <text x="944" y="460.8" text-anchor="middle" font-size="16" fill="var(--ok-bright)">Cache K3, V3 (reuse all)</text>
  <rect x="752" y="504" width="384" height="54" rx="8" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.4" />
  <text x="944" y="540" text-anchor="middle" font-size="19.2" font-weight="bold" fill="var(--ok-bright)">Linear complexity per token!</text>
</svg>
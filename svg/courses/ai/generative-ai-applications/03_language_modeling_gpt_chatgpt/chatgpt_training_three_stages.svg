<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Stage 1 -->
  <rect x="40" y="40" width="380" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="100" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-text)">Stage 1</text>
  <text x="230" y="140" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)">Pre-Training</text>
  <text x="230" y="175" text-anchor="middle" font-size="16" fill="var(--primary-text)">(unsupervised)</text>
  <rect x="70" y="210" width="320" height="240" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="230" y="250" text-anchor="middle" font-size="16" fill="var(--text-muted)">Predict next token</text>
  <text x="230" y="285" text-anchor="middle" font-size="16" fill="var(--text-muted)">on trillions of tokens</text>
  <text x="230" y="320" text-anchor="middle" font-size="16" fill="var(--text-muted)">from the web</text>
  <text x="230" y="370" text-anchor="middle" font-size="14" fill="var(--text-muted)">billions of parameters</text>
  <text x="230" y="405" text-anchor="middle" font-size="14" fill="var(--text-muted)">massive compute</text>
  <text x="230" y="500" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-text)">Result</text>
  <text x="230" y="540" text-anchor="middle" font-size="16" fill="var(--primary-text)">capable but</text>
  <text x="230" y="575" text-anchor="middle" font-size="16" fill="var(--primary-text)">unaligned base model</text>

  <!-- arrow 1 -->
  <line x1="420" y1="330" x2="460" y2="330" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="470" y="40" width="380" height="580" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="100" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--ok-text)">Stage 2</text>
  <text x="660" y="140" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--ok-text)">Supervised FT</text>
  <text x="660" y="175" text-anchor="middle" font-size="16" fill="var(--ok-text)">(SFT)</text>
  <rect x="500" y="210" width="320" height="240" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="660" y="250" text-anchor="middle" font-size="16" fill="var(--text-muted)">Human-written</text>
  <text x="660" y="285" text-anchor="middle" font-size="16" fill="var(--text-muted)">ideal responses</text>
  <text x="660" y="335" text-anchor="middle" font-size="14" fill="var(--text-muted)">prompt → response pairs</text>
  <text x="660" y="370" text-anchor="middle" font-size="14" fill="var(--text-muted)">around 100K examples</text>
  <text x="660" y="405" text-anchor="middle" font-size="14" fill="var(--text-muted)">supervised loss</text>
  <text x="660" y="500" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-text)">Result</text>
  <text x="660" y="540" text-anchor="middle" font-size="16" fill="var(--ok-text)">follows instructions</text>
  <text x="660" y="575" text-anchor="middle" font-size="16" fill="var(--ok-text)">helpful assistant tone</text>

  <!-- arrow 2 -->
  <line x1="850" y1="330" x2="890" y2="330" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="900" y="40" width="340" height="580" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="100" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--warn-text)">Stage 3</text>
  <text x="1070" y="140" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)">RLHF</text>
  <text x="1070" y="175" text-anchor="middle" font-size="16" fill="var(--warn-text)">reward learning</text>
  <rect x="930" y="210" width="280" height="240" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1070" y="250" text-anchor="middle" font-size="14" fill="var(--text-muted)">Humans rank outputs</text>
  <text x="1070" y="290" text-anchor="middle" font-size="14" fill="var(--text-muted)">Train reward model</text>
  <text x="1070" y="330" text-anchor="middle" font-size="14" fill="var(--text-muted)">on those rankings</text>
  <text x="1070" y="380" text-anchor="middle" font-size="14" fill="var(--text-muted)">Optimize policy</text>
  <text x="1070" y="415" text-anchor="middle" font-size="14" fill="var(--text-muted)">with PPO</text>
  <text x="1070" y="500" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--warn-text)">Result</text>
  <text x="1070" y="540" text-anchor="middle" font-size="16" fill="var(--warn-text)">aligned and safe</text>
  <text x="1070" y="575" text-anchor="middle" font-size="16" fill="var(--warn-text)">production ChatGPT</text>
</svg>

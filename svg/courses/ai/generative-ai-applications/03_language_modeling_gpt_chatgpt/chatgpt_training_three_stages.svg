<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrDn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,15 0,7.5" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="620.6061" y="43.6364" text-anchor="middle" font-size="23.2727" font-weight="bold" fill="var(--text)">ChatGPT Training: Three Stages</text>
  <rect x="232.7273" y="72.7273" width="775.7576" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="620.6061" y="109.0909" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--primary-accent)">Stage 1: PRE-TRAINING (unsupervised)</text>
  <text x="620.6061" y="145.4545" text-anchor="middle" font-size="17.4545" fill="var(--text-muted)">Predict next token on web text</text>
  <text x="620.6061" y="171.6364" text-anchor="middle" font-size="17.4545" fill="var(--text-muted)">Billions of parameters, Trillions of tokens</text>
  <text x="620.6061" y="215.2727" text-anchor="middle" font-size="16" fill="var(--danger-accent)">Result: capable but unaligned</text>
  <line x1="620.6061" y1="232.7273" x2="620.6061" y2="269.0909" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrDn)" />
  <rect x="232.7273" y="269.0909" width="775.7576" height="160" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="620.6061" y="305.4545" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--ok-accent)">Stage 2: SUPERVISED FINE-TUNING (SFT)</text>
  <text x="620.6061" y="341.8182" text-anchor="middle" font-size="17.4545" fill="var(--text-muted)">Human-written ideal responses</text>
  <text x="620.6061" y="368" text-anchor="middle" font-size="17.4545" fill="var(--text-muted)">Prompt to desired response pairs (~100K examples)</text>
  <text x="620.6061" y="411.6364" text-anchor="middle" font-size="16" fill="var(--danger-accent)">Result: follows instructions</text>
  <line x1="620.6061" y1="429.0909" x2="620.6061" y2="465.4545" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrDn)" />
  <rect x="232.7273" y="465.4545" width="775.7576" height="174.5455" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="620.6061" y="501.8182" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="var(--danger-accent)">Stage 3: RLHF</text>
  <text x="620.6061" y="535.2727" text-anchor="middle" font-size="17.4545" fill="var(--text-muted)">Humans rank model outputs</text>
  <text x="620.6061" y="561.4545" text-anchor="middle" font-size="17.4545" fill="var(--text-muted)">Train reward model on rankings</text>
  <text x="620.6061" y="587.6364" text-anchor="middle" font-size="17.4545" fill="var(--text-muted)">Optimize policy with PPO</text>
  <text x="620.6061" y="625.4545" text-anchor="middle" font-size="16" fill="var(--danger-accent)">Result: aligned, safe, helpful</text>
</svg>
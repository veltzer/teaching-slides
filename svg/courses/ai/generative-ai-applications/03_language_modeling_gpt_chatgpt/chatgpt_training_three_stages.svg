<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Stage 1 -->
  <rect x="40" y="40" width="380" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="100" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Stage 1</text>
  <text x="230" y="140" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Pre-Training</text>
  <text x="230" y="175" text-anchor="middle" font-size="16" fill="var(--primary-text)" font-family="Arial, sans-serif">(unsupervised)</text>
  <rect x="70" y="210" width="320" height="240" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="230" y="250" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">Predict next token</text>
  <text x="230" y="285" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">on trillions of tokens</text>
  <text x="230" y="320" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">from the web</text>
  <text x="230" y="370" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">billions of parameters</text>
  <text x="230" y="405" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">massive compute</text>
  <text x="230" y="500" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Result</text>
  <text x="230" y="540" text-anchor="middle" font-size="16" fill="var(--primary-text)" font-family="Arial, sans-serif">capable but</text>
  <text x="230" y="575" text-anchor="middle" font-size="16" fill="var(--primary-text)" font-family="Arial, sans-serif">unaligned base model</text>

  <!-- arrow 1 -->
  <line x1="420" y1="330" x2="460" y2="330" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="470" y="40" width="380" height="580" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="100" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Stage 2</text>
  <text x="660" y="140" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Supervised FT</text>
  <text x="660" y="175" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">(SFT)</text>
  <rect x="500" y="210" width="320" height="240" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="660" y="250" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">Human-written</text>
  <text x="660" y="285" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">ideal responses</text>
  <text x="660" y="335" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">prompt → response pairs</text>
  <text x="660" y="370" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">around 100K examples</text>
  <text x="660" y="405" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">supervised loss</text>
  <text x="660" y="500" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Result</text>
  <text x="660" y="540" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">follows instructions</text>
  <text x="660" y="575" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">helpful assistant tone</text>

  <!-- arrow 2 -->
  <line x1="850" y1="330" x2="890" y2="330" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="900" y="40" width="340" height="580" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="100" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Stage 3</text>
  <text x="1070" y="140" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">RLHF</text>
  <text x="1070" y="175" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">reward learning</text>
  <rect x="930" y="210" width="280" height="240" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1070" y="250" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">Humans rank outputs</text>
  <text x="1070" y="290" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">Train reward model</text>
  <text x="1070" y="330" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">on those rankings</text>
  <text x="1070" y="380" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">Optimize policy</text>
  <text x="1070" y="415" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">with PPO</text>
  <text x="1070" y="500" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Result</text>
  <text x="1070" y="540" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">aligned and safe</text>
  <text x="1070" y="575" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">production ChatGPT</text>
</svg>

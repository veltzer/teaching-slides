<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrDn" markerWidth="16" markerHeight="10.5" refX="8" refY="10.5" orient="auto">
      <polygon points="0,15 0,7.5" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">ChatGPT Training: Three Stages</text>
  <rect x="240" y="75" width="800" height="165" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="112.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#4a90e2">Stage 1: PRE-TRAINING (unsupervised)</text>
  <text x="640" y="150" text-anchor="middle" font-size="18" fill="#555">Predict next token on web text</text>
  <text x="640" y="177" text-anchor="middle" font-size="18" fill="#555">Billions of parameters, Trillions of tokens</text>
  <text x="640" y="222" text-anchor="middle" font-size="16.5" fill="#856404">Result: capable but unaligned</text>
  <line x1="640" y1="240" x2="640" y2="277.5" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrDn)" />
  <rect x="240" y="277.5" width="800" height="165" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="640" y="315" text-anchor="middle" font-size="21" font-weight="bold" fill="#28a745">Stage 2: SUPERVISED FINE-TUNING (SFT)</text>
  <text x="640" y="352.5" text-anchor="middle" font-size="18" fill="#555">Human-written ideal responses</text>
  <text x="640" y="379.5" text-anchor="middle" font-size="18" fill="#555">Prompt to desired response pairs (~100K examples)</text>
  <text x="640" y="424.5" text-anchor="middle" font-size="16.5" fill="#856404">Result: follows instructions</text>
  <line x1="640" y1="442.5" x2="640" y2="480" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrDn)" />
  <rect x="240" y="480" width="800" height="180" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="640" y="517.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#856404">Stage 3: RLHF</text>
  <text x="640" y="552" text-anchor="middle" font-size="18" fill="#555">Humans rank model outputs</text>
  <text x="640" y="579" text-anchor="middle" font-size="18" fill="#555">Train reward model on rankings</text>
  <text x="640" y="606" text-anchor="middle" font-size="18" fill="#555">Optimize policy with PPO</text>
  <text x="640" y="645" text-anchor="middle" font-size="16.5" fill="#856404">Result: aligned, safe, helpful</text>
</svg>
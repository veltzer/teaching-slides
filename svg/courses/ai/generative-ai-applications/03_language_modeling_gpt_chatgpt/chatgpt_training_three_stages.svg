<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:marker id="arrDn" markerWidth="16" markerHeight="10.5" refX="8" refY="10.5" orient="auto">
      <ns0:polygon points="0,15 0,7.5" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="620.6061" y="43.6364" text-anchor="middle" font-size="23.2727" font-weight="bold" fill="#333">ChatGPT Training: Three Stages</ns0:text>
  <ns0:rect x="232.7273" y="72.7273" width="775.7576" height="160" rx="7.2727" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9091" />
  <ns0:text x="620.6061" y="109.0909" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="#4a90e2">Stage 1: PRE-TRAINING (unsupervised)</ns0:text>
  <ns0:text x="620.6061" y="145.4545" text-anchor="middle" font-size="17.4545" fill="#555">Predict next token on web text</ns0:text>
  <ns0:text x="620.6061" y="171.6364" text-anchor="middle" font-size="17.4545" fill="#555">Billions of parameters, Trillions of tokens</ns0:text>
  <ns0:text x="620.6061" y="215.2727" text-anchor="middle" font-size="16" fill="#856404">Result: capable but unaligned</ns0:text>
  <ns0:line x1="620.6061" y1="232.7273" x2="620.6061" y2="269.0909" stroke="#4a90e2" stroke-width="2.9091" marker-end="url(#arrDn)" />
  <ns0:rect x="232.7273" y="269.0909" width="775.7576" height="160" rx="7.2727" fill="#d4edda" stroke="#28a745" stroke-width="2.9091" />
  <ns0:text x="620.6061" y="305.4545" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="#28a745">Stage 2: SUPERVISED FINE-TUNING (SFT)</ns0:text>
  <ns0:text x="620.6061" y="341.8182" text-anchor="middle" font-size="17.4545" fill="#555">Human-written ideal responses</ns0:text>
  <ns0:text x="620.6061" y="368" text-anchor="middle" font-size="17.4545" fill="#555">Prompt to desired response pairs (~100K examples)</ns0:text>
  <ns0:text x="620.6061" y="411.6364" text-anchor="middle" font-size="16" fill="#856404">Result: follows instructions</ns0:text>
  <ns0:line x1="620.6061" y1="429.0909" x2="620.6061" y2="465.4545" stroke="#4a90e2" stroke-width="2.9091" marker-end="url(#arrDn)" />
  <ns0:rect x="232.7273" y="465.4545" width="775.7576" height="174.5455" rx="7.2727" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9091" />
  <ns0:text x="620.6061" y="501.8182" text-anchor="middle" font-size="20.3636" font-weight="bold" fill="#856404">Stage 3: RLHF</ns0:text>
  <ns0:text x="620.6061" y="535.2727" text-anchor="middle" font-size="17.4545" fill="#555">Humans rank model outputs</ns0:text>
  <ns0:text x="620.6061" y="561.4545" text-anchor="middle" font-size="17.4545" fill="#555">Train reward model on rankings</ns0:text>
  <ns0:text x="620.6061" y="587.6364" text-anchor="middle" font-size="17.4545" fill="#555">Optimize policy with PPO</ns0:text>
  <ns0:text x="620.6061" y="625.4545" text-anchor="middle" font-size="16" fill="#856404">Result: aligned, safe, helpful</ns0:text>
</ns0:svg>
<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrDn" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">ChatGPT Training: Three Stages</text>
  <!-- Stage 1 -->
  <rect x="150" y="50" width="500" height="110" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Stage 1: PRE-TRAINING (unsupervised)</text>
  <text x="400" y="100" text-anchor="middle" font-size="12" fill="#555">Predict next token on web text</text>
  <text x="400" y="118" text-anchor="middle" font-size="12" fill="#555">Billions of parameters, Trillions of tokens</text>
  <text x="400" y="148" text-anchor="middle" font-size="11" fill="#856404">Result: capable but unaligned</text>
  <line x1="400" y1="160" x2="400" y2="185" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrDn)"/>
  <!-- Stage 2 -->
  <rect x="150" y="185" width="500" height="110" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Stage 2: SUPERVISED FINE-TUNING (SFT)</text>
  <text x="400" y="235" text-anchor="middle" font-size="12" fill="#555">Human-written ideal responses</text>
  <text x="400" y="253" text-anchor="middle" font-size="12" fill="#555">Prompt to desired response pairs (~100K examples)</text>
  <text x="400" y="283" text-anchor="middle" font-size="11" fill="#856404">Result: follows instructions</text>
  <line x1="400" y1="295" x2="400" y2="320" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrDn)"/>
  <!-- Stage 3 -->
  <rect x="150" y="320" width="500" height="120" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">Stage 3: RLHF</text>
  <text x="400" y="368" text-anchor="middle" font-size="12" fill="#555">Humans rank model outputs</text>
  <text x="400" y="386" text-anchor="middle" font-size="12" fill="#555">Train reward model on rankings</text>
  <text x="400" y="404" text-anchor="middle" font-size="12" fill="#555">Optimize policy with PPO</text>
  <text x="400" y="430" text-anchor="middle" font-size="11" fill="#856404">Result: aligned, safe, helpful</text>
</svg>
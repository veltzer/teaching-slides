<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrDn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,15 0,7.5" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="22.6341" font-weight="bold" fill="var(--text)">ChatGPT Training: Three Stages</text>
  <rect x="262.7642" y="68.2927" width="754.4716" height="155.6098" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="103.6585" text-anchor="middle" font-size="19.8048" font-weight="bold" fill="var(--primary-accent)">Stage 1: PRE-TRAINING (unsupervised)</text>
  <text x="640" y="139.0243" text-anchor="middle" font-size="16.9756" fill="var(--text-muted)">Predict next token on web text</text>
  <text x="640" y="164.4878" text-anchor="middle" font-size="16.9756" fill="var(--text-muted)">Billions of parameters, Trillions of tokens</text>
  <text x="640" y="206.9268" text-anchor="middle" font-size="15.561" fill="var(--danger-accent)">Result: capable but unaligned</text>
  <line x1="640" y1="223.9024" x2="640" y2="259.2683" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrDn)" />
  <rect x="262.7642" y="259.2683" width="754.4716" height="155.6098" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="294.6341" text-anchor="middle" font-size="19.8048" font-weight="bold" fill="var(--ok-accent)">Stage 2: SUPERVISED FINE-TUNING (SFT)</text>
  <text x="640" y="330" text-anchor="middle" font-size="16.9756" fill="var(--text-muted)">Human-written ideal responses</text>
  <text x="640" y="355.4634" text-anchor="middle" font-size="16.9756" fill="var(--text-muted)">Prompt to desired response pairs (~100K examples)</text>
  <text x="640" y="397.9025" text-anchor="middle" font-size="15.561" fill="var(--danger-accent)">Result: follows instructions</text>
  <line x1="640" y1="414.878" x2="640" y2="450.2438" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrDn)" />
  <rect x="262.7642" y="450.2438" width="754.4716" height="169.7562" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="485.6098" text-anchor="middle" font-size="19.8048" font-weight="bold" fill="var(--danger-accent)">Stage 3: RLHF</text>
  <text x="640" y="518.1463" text-anchor="middle" font-size="16.9756" fill="var(--text-muted)">Humans rank model outputs</text>
  <text x="640" y="543.6097" text-anchor="middle" font-size="16.9756" fill="var(--text-muted)">Train reward model on rankings</text>
  <text x="640" y="569.0732" text-anchor="middle" font-size="16.9756" fill="var(--text-muted)">Optimize policy with PPO</text>
  <text x="640" y="605.8536" text-anchor="middle" font-size="15.561" fill="var(--danger-accent)">Result: aligned, safe, helpful</text>
</svg>
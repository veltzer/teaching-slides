  <rect x="470" y="215" width="150" height="30" rx="3" fill="#f8f9fa" stroke="#dee2e6"/><text x="545" y="235" text-anchor="middle" font-size="11" fill="#555">&#x2605;&#x2605;&#x2605;&#x2605;</text>

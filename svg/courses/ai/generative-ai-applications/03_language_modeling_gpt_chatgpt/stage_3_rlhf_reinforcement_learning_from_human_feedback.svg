<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="asd" markerWidth="17.0667" markerHeight="11.2" refX="8.5333" refY="11.2" orient="auto">
      <polygon points="0,16 0,8" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="48" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Stage 3: RLHF</text>
  <rect x="170.6667" y="80" width="938.6667" height="208" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="120" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#4a90e2">Step 1: Collect Comparison Data</text>
  <text x="640" y="160" text-anchor="middle" font-size="17.6" fill="#555">Prompt: "Write a haiku about coding"</text>
  <rect x="221.8667" y="176" width="409.6" height="88" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="426.6667" y="208" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#28a745">Response A (better)</text>
  <text x="426.6667" y="236.8" text-anchor="middle" font-size="16" fill="#555">"Fingers on the keys / Logic</text>
  <text x="426.6667" y="256" text-anchor="middle" font-size="16" fill="#555">flows like a river / Bug found..."</text>
  <rect x="665.6" y="176" width="409.6" height="88" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6" />
  <text x="870.4" y="208" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#dc3545">Response B (worse)</text>
  <text x="870.4" y="236.8" text-anchor="middle" font-size="16" fill="#555">"Code code code today / I</text>
  <text x="870.4" y="256" text-anchor="middle" font-size="16" fill="#555">like to write the code..."</text>
  <line x1="640" y1="288" x2="640" y2="336" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#asd)" />
  <rect x="256" y="336" width="768" height="96" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="640" y="376" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#856404">Step 2: Train Reward Model</text>
  <text x="640" y="412.8" text-anchor="middle" font-size="17.6" fill="#555">reward_model(prompt, response) -&gt; scalar score</text>
  <line x1="640" y1="432" x2="640" y2="480" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#asd)" />
  <rect x="256" y="480" width="768" height="96" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="640" y="520" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#28a745">Step 3: Optimize with PPO</text>
  <text x="640" y="556.8" text-anchor="middle" font-size="17.6" fill="#555">Maximize reward while staying close to SFT model</text>
  <line x1="640" y1="576" x2="640" y2="616" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#asd)" />
  <text x="640" y="652.8" text-anchor="middle" font-size="20.8" fill="#333">Human ranks: A &gt; B</text>
  <rect x="341.3333" y="664" width="597.3333" height="48" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="640" y="696" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#28a745">Result: Aligned, safe, helpful model</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:marker id="asd" markerWidth="17.0667" markerHeight="11.2" refX="8.5333" refY="11.2" orient="auto">
      <ns0:polygon points="0,16 0,8" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="575.2809" y="43.1461" text-anchor="middle" font-size="23.0112" font-weight="bold" fill="var(--text-dark)">Stage 3: RLHF</ns0:text>
  <ns0:rect x="153.4083" y="71.9101" width="843.7453" height="186.9663" rx="7.191" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8764" />
  <ns0:text x="575.2809" y="107.8652" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--primary-bright)">Step 1: Collect Comparison Data</ns0:text>
  <ns0:text x="575.2809" y="143.8202" text-anchor="middle" font-size="15.8202" fill="var(--text-muted)">Prompt: "Write a haiku about coding"</ns0:text>
  <ns0:rect x="199.4307" y="158.2022" width="368.1798" height="79.1011" rx="7.191" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4382" />
  <ns0:text x="383.5206" y="186.9663" text-anchor="middle" font-size="15.8202" font-weight="bold" fill="var(--ok-bright)">Response A (better)</ns0:text>
  <ns0:text x="383.5206" y="212.8539" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">"Fingers on the keys / Logic</ns0:text>
  <ns0:text x="383.5206" y="230.1124" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">flows like a river / Bug found..."</ns0:text>
  <ns0:rect x="598.2921" y="158.2022" width="368.1798" height="79.1011" rx="7.191" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.4382" />
  <ns0:text x="782.382" y="186.9663" text-anchor="middle" font-size="15.8202" font-weight="bold" fill="var(--danger-bright)">Response B (worse)</ns0:text>
  <ns0:text x="782.382" y="212.8539" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">"Code code code today / I</ns0:text>
  <ns0:text x="782.382" y="230.1124" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">like to write the code..."</ns0:text>
  <ns0:line x1="575.2809" y1="258.8764" x2="575.2809" y2="302.0225" stroke="var(--primary-bright)" stroke-width="2.8764" marker-end="url(#asd)" />
  <ns0:rect x="230.1124" y="302.0225" width="690.3371" height="86.2921" rx="7.191" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8764" />
  <ns0:text x="575.2809" y="337.9775" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--danger-deeper)">Step 2: Train Reward Model</ns0:text>
  <ns0:text x="575.2809" y="371.0562" text-anchor="middle" font-size="15.8202" fill="var(--text-muted)">reward_model(prompt, response) -&gt; scalar score</ns0:text>
  <ns0:line x1="575.2809" y1="388.3146" x2="575.2809" y2="431.4607" stroke="var(--primary-bright)" stroke-width="2.8764" marker-end="url(#asd)" />
  <ns0:rect x="230.1124" y="431.4607" width="690.3371" height="86.2921" rx="7.191" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8764" />
  <ns0:text x="575.2809" y="467.4157" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--ok-bright)">Step 3: Optimize with PPO</ns0:text>
  <ns0:text x="575.2809" y="500.4944" text-anchor="middle" font-size="15.8202" fill="var(--text-muted)">Maximize reward while staying close to SFT model</ns0:text>
  <ns0:line x1="575.2809" y1="517.7528" x2="575.2809" y2="553.7079" stroke="var(--primary-bright)" stroke-width="2.8764" marker-end="url(#asd)" />
  <ns0:text x="575.2809" y="586.7865" text-anchor="middle" font-size="18.6966" fill="var(--text-dark)">Human ranks: A &gt; B</ns0:text>
  <ns0:rect x="306.8164" y="596.8539" width="536.9288" height="43.1461" rx="7.191" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.1573" />
  <ns0:text x="575.2809" y="625.618" text-anchor="middle" font-size="17.2584" font-weight="bold" fill="var(--ok-bright)">Result: Aligned, safe, helpful model</ns0:text>
</ns0:svg>
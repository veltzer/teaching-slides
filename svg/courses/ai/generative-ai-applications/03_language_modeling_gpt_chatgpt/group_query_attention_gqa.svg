  <text x="613.633" y="151.0112" text-anchor="middle" font-size="15.8202" fill="var(--text-muted)">Q: 32 heads</text>
  <text x="613.633" y="179.7753" text-anchor="middle" font-size="15.8202" fill="var(--text-muted)">K: 8 groups</text>
  <text x="613.633" y="208.5393" text-anchor="middle" font-size="15.8202" fill="var(--text-muted)">V: 8 groups</text>

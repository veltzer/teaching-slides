  <text x="230.1124" y="115.0562" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--primary-accent)">MHA</text>
  <text x="230.1124" y="151.0112" text-anchor="middle" font-size="15.8202" fill="var(--text-muted)">Q: 32 heads</text>
  <text x="230.1124" y="179.7753" text-anchor="middle" font-size="15.8202" fill="var(--text-muted)">K: 32 heads</text>
  <text x="230.1124" y="208.5393" text-anchor="middle" font-size="15.8202" fill="var(--text-muted)">V: 32 heads</text>
  <text x="230.1124" y="251.6854" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">Each head has own Q, K, V</text>
  <text x="230.1124" y="280.4494" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">Memory: 96 x d_head</text>
  <rect x="99.7154" y="302.0225" width="260.794" height="35.9551" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230.1124" y="327.9101" text-anchor="middle" font-size="14.382" fill="var(--text)">KV Cache: 100%</text>
  <rect x="444.8839" y="79.1011" width="337.4981" height="287.6404" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="23.6439" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Group Query Attention (GQA)</text>
  <rect x="40" y="74.9397" width="366.6666" height="279.518" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.3334" y="109.8795" text-anchor="middle" font-size="19.2107" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">MHA</text>
  <text x="223.3334" y="144.8192" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">Q: 32 heads</text>
  <text x="223.3334" y="172.7711" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">K: 32 heads</text>
  <text x="223.3334" y="200.7228" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">V: 32 heads</text>
  <text x="223.3334" y="242.6506" text-anchor="middle" font-size="14.7774" fill="var(--text-muted)" font-family="Arial, sans-serif">Each head has own Q, K, V</text>
  <text x="223.3334" y="270.6024" text-anchor="middle" font-size="14.7774" fill="var(--text-muted)" font-family="Arial, sans-serif">Memory: 96 x d_head</text>
  <rect x="81.6667" y="291.5663" width="283.3333" height="34.9398" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="223.3334" y="316.7229" text-anchor="middle" font-size="14.7774" fill="var(--text)" font-family="Arial, sans-serif">KV Cache: 100%</text>
  <rect x="456.6667" y="74.9397" width="366.6666" height="279.518" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="109.8795" text-anchor="middle" font-size="19.2107" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">GQA-8</text>
  <text x="640.0001" y="144.8192" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">Q: 32 heads</text>
  <text x="640.0001" y="172.7711" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">K: 8 groups</text>
  <text x="640.0001" y="200.7228" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">V: 8 groups</text>
  <text x="640.0001" y="242.6506" text-anchor="middle" font-size="14.7774" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple Q share K,V</text>
  <text x="640.0001" y="270.6024" text-anchor="middle" font-size="14.7774" fill="var(--text-muted)" font-family="Arial, sans-serif">Memory: 48 x d_head</text>
  <rect x="498.3334" y="291.5663" width="283.3333" height="34.9398" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="316.7229" text-anchor="middle" font-size="14.7774" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">KV Cache: 25%</text>
  <rect x="873.3334" y="74.9397" width="366.6666" height="279.518" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.6667" y="109.8795" text-anchor="middle" font-size="19.2107" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">MQA</text>
  <text x="1056.6667" y="144.8192" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">Q: 32 heads</text>
  <text x="1056.6667" y="172.7711" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">K: 1 shared</text>
  <text x="1056.6667" y="200.7228" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">V: 1 shared</text>
  <text x="1056.6667" y="242.6506" text-anchor="middle" font-size="14.7774" fill="var(--text-muted)" font-family="Arial, sans-serif">ALL Q share ONE K,V</text>
  <text x="1056.6667" y="270.6024" text-anchor="middle" font-size="14.7774" fill="var(--text-muted)" font-family="Arial, sans-serif">Memory: 34 x d_head</text>
  <rect x="915.0001" y="291.5663" width="283.3333" height="34.9398" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.6667" y="316.7229" text-anchor="middle" font-size="14.7774" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">KV Cache: 3%</text>
  <rect x="140" y="403.3735" width="216.6667" height="48.9157" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="248.3333" y="435.5181" text-anchor="middle" font-size="16.2552" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Method</text>
  <rect x="373.3334" y="403.3735" width="216.6667" height="48.9157" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="481.6666" y="435.5181" text-anchor="middle" font-size="16.2552" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">KV Heads</text>
  <rect x="606.6667" y="403.3735" width="216.6667" height="48.9157" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="715" y="435.5181" text-anchor="middle" font-size="16.2552" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">KV Cache</text>
  <rect x="840" y="403.3735" width="216.6667" height="48.9157" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.3333" y="435.5181" text-anchor="middle" font-size="16.2552" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Quality</text>
  <rect x="140" y="466.2651" width="216.6667" height="41.9277" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="248.3333" y="494.2169" text-anchor="middle" font-size="16.2552" fill="var(--text)" font-family="Arial, sans-serif">MHA</text>
  <rect x="373.3334" y="466.2651" width="216.6667" height="41.9277" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="481.6666" y="494.2169" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">32</text>
  <rect x="606.6667" y="466.2651" width="216.6667" height="41.9277" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="715" y="494.2169" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">100%</text>
  <rect x="840" y="466.2651" width="216.6667" height="41.9277" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="948.3333" y="494.2169" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">Baseline</text>
  <rect x="140" y="522.1686" width="216.6667" height="41.9277" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="248.3333" y="550.1205" text-anchor="middle" font-size="16.2552" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">GQA-8</text>
  <rect x="373.3334" y="522.1686" width="216.6667" height="41.9277" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="481.6666" y="550.1205" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">8</text>
  <rect x="606.6667" y="522.1686" width="216.6667" height="41.9277" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="715" y="550.1205" text-anchor="middle" font-size="16.2552" fill="var(--ok-accent)" font-family="Arial, sans-serif">25%</text>
  <rect x="840" y="522.1686" width="216.6667" height="41.9277" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="948.3333" y="550.1205" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">~99.5%</text>
  <rect x="140" y="578.0723" width="216.6667" height="41.9277" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="248.3333" y="606.0241" text-anchor="middle" font-size="16.2552" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">MQA</text>
  <rect x="373.3334" y="578.0723" width="216.6667" height="41.9277" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="481.6666" y="606.0241" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">1</text>
  <rect x="606.6667" y="578.0723" width="216.6667" height="41.9277" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="715" y="606.0241" text-anchor="middle" font-size="16.2552" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">3%</text>
  <rect x="840" y="578.0723" width="216.6667" height="41.9277" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="948.3333" y="606.0241" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)" font-family="Arial, sans-serif">~98%</text>
</svg>

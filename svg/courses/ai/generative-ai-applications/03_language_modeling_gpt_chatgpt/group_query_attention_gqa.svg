  <rect x="140" y="466.2651" width="216.6667" height="41.9277" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="248.3333" y="494.2169" text-anchor="middle" font-size="16.2552" fill="var(--text)">MHA</text>
  <rect x="373.3334" y="466.2651" width="216.6667" height="41.9277" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="481.6666" y="494.2169" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">32</text>
  <rect x="606.6667" y="466.2651" width="216.6667" height="41.9277" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="715" y="494.2169" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">100%</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="23.6439" font-weight="bold" fill="var(--text)">Group Query Attention (GQA)</text>
  <rect x="40" y="74.9397" width="366.6666" height="279.518" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="223.3334" y="109.8795" text-anchor="middle" font-size="19.2107" font-weight="bold" fill="var(--primary-accent)">MHA</text>
  <text x="223.3334" y="144.8192" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">Q: 32 heads</text>
  <text x="223.3334" y="172.7711" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">K: 32 heads</text>
  <text x="223.3334" y="200.7228" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">V: 32 heads</text>
  <text x="223.3334" y="242.6506" text-anchor="middle" font-size="14.7774" fill="var(--text-muted)">Each head has own Q, K, V</text>
  <text x="223.3334" y="270.6024" text-anchor="middle" font-size="14.7774" fill="var(--text-muted)">Memory: 96 x d_head</text>
  <rect x="81.6667" y="291.5663" width="283.3333" height="34.9398" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="223.3334" y="316.7229" text-anchor="middle" font-size="14.7774" fill="var(--text)">KV Cache: 100%</text>
  <rect x="456.6667" y="74.9397" width="366.6666" height="279.518" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640.0001" y="109.8795" text-anchor="middle" font-size="19.2107" font-weight="bold" fill="var(--ok-accent)">GQA-8</text>
  <text x="640.0001" y="144.8192" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">Q: 32 heads</text>
  <text x="640.0001" y="172.7711" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">K: 8 groups</text>
  <text x="640.0001" y="200.7228" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">V: 8 groups</text>
  <text x="640.0001" y="242.6506" text-anchor="middle" font-size="14.7774" fill="var(--text-muted)">Multiple Q share K,V</text>
  <text x="640.0001" y="270.6024" text-anchor="middle" font-size="14.7774" fill="var(--text-muted)">Memory: 48 x d_head</text>
  <rect x="498.3334" y="291.5663" width="283.3333" height="34.9398" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640.0001" y="316.7229" text-anchor="middle" font-size="14.7774" font-weight="bold" fill="var(--ok-accent)">KV Cache: 25%</text>
  <rect x="873.3334" y="74.9397" width="366.6666" height="279.518" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1056.6667" y="109.8795" text-anchor="middle" font-size="19.2107" font-weight="bold" fill="var(--danger-accent)">MQA</text>
  <text x="1056.6667" y="144.8192" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">Q: 32 heads</text>
  <text x="1056.6667" y="172.7711" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">K: 1 shared</text>
  <text x="1056.6667" y="200.7228" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">V: 1 shared</text>
  <text x="1056.6667" y="242.6506" text-anchor="middle" font-size="14.7774" fill="var(--text-muted)">ALL Q share ONE K,V</text>
  <text x="1056.6667" y="270.6024" text-anchor="middle" font-size="14.7774" fill="var(--text-muted)">Memory: 34 x d_head</text>
  <rect x="915.0001" y="291.5663" width="283.3333" height="34.9398" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1056.6667" y="316.7229" text-anchor="middle" font-size="14.7774" font-weight="bold" fill="var(--danger-accent)">KV Cache: 3%</text>
  <rect x="140" y="403.3735" width="216.6667" height="48.9157" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="248.3333" y="435.5181" text-anchor="middle" font-size="16.2552" font-weight="bold" fill="var(--bg)">Method</text>
  <rect x="373.3334" y="403.3735" width="216.6667" height="48.9157" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="481.6666" y="435.5181" text-anchor="middle" font-size="16.2552" font-weight="bold" fill="var(--bg)">KV Heads</text>
  <rect x="606.6667" y="403.3735" width="216.6667" height="48.9157" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>

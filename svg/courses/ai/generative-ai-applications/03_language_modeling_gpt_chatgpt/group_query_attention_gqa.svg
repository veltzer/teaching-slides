  <text x="613.633" y="327.9101" text-anchor="middle" font-size="14.382" font-weight="bold" fill="var(--ok-accent)">KV Cache: 25%</text>
  <rect x="828.4045" y="79.1011" width="337.4981" height="287.6404" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="997.1536" y="115.0562" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--danger-accent)">MQA</text>
  <text x="997.1536" y="151.0112" text-anchor="middle" font-size="15.8202" fill="var(--text-muted)">Q: 32 heads</text>
  <text x="997.1536" y="179.7753" text-anchor="middle" font-size="15.8202" fill="var(--text-muted)">K: 1 shared</text>
  <text x="997.1536" y="208.5393" text-anchor="middle" font-size="15.8202" fill="var(--text-muted)">V: 1 shared</text>

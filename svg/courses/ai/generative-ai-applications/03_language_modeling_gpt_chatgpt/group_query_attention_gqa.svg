  <text x="948.3333" y="494.2169" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">Baseline</text>
  <rect x="140" y="522.1686" width="216.6667" height="41.9277" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="248.3333" y="550.1205" text-anchor="middle" font-size="16.2552" font-weight="bold" fill="var(--ok-accent)">GQA-8</text>
  <rect x="373.3334" y="522.1686" width="216.6667" height="41.9277" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="481.6666" y="550.1205" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">8</text>
  <rect x="606.6667" y="522.1686" width="216.6667" height="41.9277" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="715" y="550.1205" text-anchor="middle" font-size="16.2552" fill="var(--ok-accent)">25%</text>
  <rect x="840" y="522.1686" width="216.6667" height="41.9277" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="948.3333" y="550.1205" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">~99.5%</text>
  <rect x="140" y="578.0723" width="216.6667" height="41.9277" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="248.3333" y="606.0241" text-anchor="middle" font-size="16.2552" font-weight="bold" fill="var(--danger-accent)">MQA</text>
  <rect x="373.3334" y="578.0723" width="216.6667" height="41.9277" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="481.6666" y="606.0241" text-anchor="middle" font-size="16.2552" fill="var(--text-muted)">1</text>
  <rect x="606.6667" y="578.0723" width="216.6667" height="41.9277" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="715" y="606.0241" text-anchor="middle" font-size="16.2552" font-weight="bold" fill="var(--ok-accent)">3%</text>

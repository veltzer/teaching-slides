<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="adn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 0,8.5714" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="628.2354" y="40" text-anchor="middle" font-size="29.5536" font-weight="bold" fill="var(--text)">Model Distillation</text>
  <rect x="275.2943" y="70.9334" width="705.8823" height="108.2667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="628.2354" y="114.24" text-anchor="middle" font-size="25.8594" font-weight="bold" fill="var(--primary-accent)">Teacher Model</text>
  <text x="628.2354" y="148.2667" text-anchor="middle" font-size="22.1651" fill="var(--text-muted)">GPT-4 level, 1T+ params</text>
  <line x1="628.2354" y1="179.2" x2="628.2354" y2="225.6001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#adn)" />
  <text x="934.1176" y="210.1334" font-size="20.318" fill="var(--text-muted)">Generate training data</text>
  <rect x="275.2943" y="233.3334" width="705.8823" height="123.7334" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="628.2354" y="276.64" text-anchor="middle" font-size="25.8594" font-weight="bold" fill="var(--danger-accent)">Distillation Training</text>
  <text x="628.2354" y="315.3066" text-anchor="middle" font-size="22.1651" fill="var(--text-muted)">Student learns to mimic teacher</text>
  <line x1="628.2354" y1="357.0666" x2="628.2354" y2="403.4666" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#adn)" />
  <rect x="275.2943" y="411.1999" width="705.8823" height="108.2667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="628.2354" y="454.5067" text-anchor="middle" font-size="25.8594" font-weight="bold" fill="var(--ok-accent)">Student Model</text>
  <text x="628.2354" y="488.5333" text-anchor="middle" font-size="22.1651" fill="var(--text-muted)">7B params</text>
  <rect x="40" y="558.1333" width="376.4706" height="61.8667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.2355" y="596.8" text-anchor="middle" font-size="20.318" fill="var(--text)">99% quality</text>
  <rect x="451.7648" y="558.1333" width="376.4706" height="61.8667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="596.8" text-anchor="middle" font-size="20.318" fill="var(--text)">100x cheaper</text>
  <rect x="863.5294" y="558.1333" width="376.4706" height="61.8667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.7648" y="596.8" text-anchor="middle" font-size="20.318" fill="var(--text)">Consumer HW</text>
</svg>
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="adn" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Model Distillation</text>
  <!-- Teacher -->
  <rect x="200" y="50" width="300" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Teacher Model</text>
  <text x="350" y="100" text-anchor="middle" font-size="12" fill="#666">GPT-4 level, 1T+ params</text>
  <line x1="350" y1="120" x2="350" y2="150" stroke="#4a90e2" stroke-width="2" marker-end="url(#adn)"/>
  <text x="480" y="140" font-size="11" fill="#666">Generate training data</text>
  <!-- Distillation -->
  <rect x="200" y="155" width="300" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">Distillation Training</text>
  <text x="350" y="208" text-anchor="middle" font-size="12" fill="#666">Student learns to mimic teacher</text>
  <line x1="350" y1="235" x2="350" y2="265" stroke="#4a90e2" stroke-width="2" marker-end="url(#adn)"/>
  <!-- Student -->
  <rect x="200" y="270" width="300" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Student Model</text>
  <text x="350" y="320" text-anchor="middle" font-size="12" fill="#666">7B params</text>
  <!-- Benefits -->
  <rect x="100" y="365" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="180" y="390" text-anchor="middle" font-size="11" fill="#333">99% quality</text>
  <rect x="275" y="365" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="355" y="390" text-anchor="middle" font-size="11" fill="#333">100x cheaper</text>
  <rect x="450" y="365" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="530" y="390" text-anchor="middle" font-size="11" fill="#333">Consumer HW</text>
</svg>
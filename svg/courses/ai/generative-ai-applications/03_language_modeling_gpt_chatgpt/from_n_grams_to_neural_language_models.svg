<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arRight" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="51.4286" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">From N-grams to Neural Language Models</text>
  <rect x="64" y="102.8571" width="256" height="205.7143" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <text x="192" y="145.7143" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#dc3545">N-grams</text>
  <text x="192" y="180" text-anchor="middle" font-size="16" fill="#555">(1990s)</text>
  <text x="192" y="214.2857" text-anchor="middle" font-size="16" fill="#555">Count word sequences</text>
  <text x="192" y="248.5714" text-anchor="middle" font-size="16" fill="#555">P(w | w-1, w-2)</text>
  <text x="192" y="282.8571" text-anchor="middle" font-size="16" fill="#dc3545">Sparse data, no generalization</text>
  <line x1="320" y1="205.7143" x2="384" y2="205.7143" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arRight)" />
  <rect x="400" y="102.8571" width="256" height="205.7143" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="528" y="145.7143" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#856404">RNNs</text>
  <text x="528" y="180" text-anchor="middle" font-size="16" fill="#555">(2010s)</text>
  <text x="528" y="214.2857" text-anchor="middle" font-size="16" fill="#555">Hidden state sequences</text>
  <text x="528" y="248.5714" text-anchor="middle" font-size="16" fill="#555">P(w | h_t)</text>
  <text x="528" y="282.8571" text-anchor="middle" font-size="16" fill="#856404">Forgets long-range deps</text>
  <line x1="656" y1="205.7143" x2="720" y2="205.7143" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arRight)" />
  <rect x="736" y="102.8571" width="256" height="205.7143" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="864" y="145.7143" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#856404">LSTMs</text>
  <text x="864" y="180" text-anchor="middle" font-size="16" fill="#555">(2014)</text>
  <text x="864" y="214.2857" text-anchor="middle" font-size="16" fill="#555">Gated memory cells</text>
  <text x="864" y="248.5714" text-anchor="middle" font-size="16" fill="#555">Better long-range</text>
  <text x="864" y="282.8571" text-anchor="middle" font-size="16" fill="#856404">Slow training, limited ctx</text>
  <line x1="992" y1="205.7143" x2="1056" y2="205.7143" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arRight)" />
  <rect x="1072" y="85.7143" width="176" height="240" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="1160" y="137.1429" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#28a745">Transformers</text>
  <text x="1160" y="171.4286" text-anchor="middle" font-size="16" fill="#555">(2017)</text>
  <text x="1160" y="205.7143" text-anchor="middle" font-size="16" fill="#555">Parallel</text>
  <text x="1160" y="231.4286" text-anchor="middle" font-size="16" fill="#555">attention</text>
  <text x="1160" y="265.7143" text-anchor="middle" font-size="16" fill="#28a745">Scalable!</text>
  <rect x="64" y="377.1429" width="1152" height="308.5714" rx="8" fill="#f0f7ff" stroke="#4a90e2" stroke-width="1.6" />
  <text x="640" y="428.5714" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Key Improvements</text>
  <text x="304" y="480" text-anchor="middle" font-size="17.6" fill="#dc3545">N-grams: Frequency tables</text>
  <text x="304" y="514.2857" text-anchor="middle" font-size="17.6" fill="#dc3545">No generalization</text>
  <text x="640" y="480" text-anchor="middle" font-size="17.6" fill="#856404">RNN/LSTM: Sequential processing</text>
  <text x="640" y="514.2857" text-anchor="middle" font-size="17.6" fill="#856404">Memory bottleneck</text>
  <text x="976" y="480" text-anchor="middle" font-size="17.6" fill="#28a745">Transformers: Parallel attention</text>
  <text x="976" y="514.2857" text-anchor="middle" font-size="17.6" fill="#28a745">Long-range + scalable</text>
  <line x1="464" y1="411.4286" x2="464" y2="531.4286" stroke="#dee2e6" stroke-width="1.6" />
  <line x1="816" y1="411.4286" x2="816" y2="531.4286" stroke="#dee2e6" stroke-width="1.6" />
</svg>
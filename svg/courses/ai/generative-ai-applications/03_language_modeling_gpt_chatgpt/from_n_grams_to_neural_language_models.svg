<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arRight" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="597.3333" y="48" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">From N-grams to Neural Language Models</ns0:text>
  <ns0:rect x="59.7333" y="96" width="238.9333" height="192" rx="7.4667" fill="#f8d7da" stroke="#dc3545" stroke-width="2.24" />
  <ns0:text x="179.2" y="136" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="#dc3545">N-grams</ns0:text>
  <ns0:text x="179.2" y="168" text-anchor="middle" font-size="14.9333" fill="#555">(1990s)</ns0:text>
  <ns0:text x="179.2" y="200" text-anchor="middle" font-size="14.9333" fill="#555">Count word sequences</ns0:text>
  <ns0:text x="179.2" y="232" text-anchor="middle" font-size="14.9333" fill="#555">P(w | w-1, w-2)</ns0:text>
  <ns0:text x="179.2" y="264" text-anchor="middle" font-size="14.9333" fill="#dc3545">Sparse data, no generalization</ns0:text>
  <ns0:line x1="298.6667" y1="192" x2="358.4" y2="192" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arRight)" />
  <ns0:rect x="373.3333" y="96" width="238.9333" height="192" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.24" />
  <ns0:text x="492.8" y="136" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="#bf360c">RNNs</ns0:text>
  <ns0:text x="492.8" y="168" text-anchor="middle" font-size="14.9333" fill="#555">(2010s)</ns0:text>
  <ns0:text x="492.8" y="200" text-anchor="middle" font-size="14.9333" fill="#555">Hidden state sequences</ns0:text>
  <ns0:text x="492.8" y="232" text-anchor="middle" font-size="14.9333" fill="#555">P(w | h_t)</ns0:text>
  <ns0:text x="492.8" y="264" text-anchor="middle" font-size="14.9333" fill="#bf360c">Forgets long-range deps</ns0:text>
  <ns0:line x1="612.2667" y1="192" x2="672" y2="192" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arRight)" />
  <ns0:rect x="686.9333" y="96" width="238.9333" height="192" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.24" />
  <ns0:text x="806.4" y="136" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="#bf360c">LSTMs</ns0:text>
  <ns0:text x="806.4" y="168" text-anchor="middle" font-size="14.9333" fill="#555">(2014)</ns0:text>
  <ns0:text x="806.4" y="200" text-anchor="middle" font-size="14.9333" fill="#555">Gated memory cells</ns0:text>
  <ns0:text x="806.4" y="232" text-anchor="middle" font-size="14.9333" fill="#555">Better long-range</ns0:text>
  <ns0:text x="806.4" y="264" text-anchor="middle" font-size="14.9333" fill="#bf360c">Slow training, limited ctx</ns0:text>
  <ns0:line x1="925.8666" y1="192" x2="985.6" y2="192" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arRight)" />
  <ns0:rect x="1000.5333" y="80" width="164.2667" height="224" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.9867" />
  <ns0:text x="1082.6666" y="128" text-anchor="middle" font-size="17.92" font-weight="bold" fill="#28a745">Transformers</ns0:text>
  <ns0:text x="1082.6666" y="160" text-anchor="middle" font-size="14.9333" fill="#555">(2017)</ns0:text>
  <ns0:text x="1082.6666" y="192" text-anchor="middle" font-size="14.9333" fill="#555">Parallel</ns0:text>
  <ns0:text x="1082.6666" y="216" text-anchor="middle" font-size="14.9333" fill="#555">attention</ns0:text>
  <ns0:text x="1082.6666" y="248" text-anchor="middle" font-size="14.9333" fill="#28a745">Scalable!</ns0:text>
  <ns0:rect x="59.7333" y="352" width="1075.2" height="288" rx="7.4667" fill="#f9f9f9" stroke="#4a90e2" stroke-width="1.4933" />
  <ns0:text x="597.3333" y="400" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="#333">Key Improvements</ns0:text>
  <ns0:text x="283.7333" y="448" text-anchor="middle" font-size="16.4267" fill="#dc3545">N-grams: Frequency tables</ns0:text>
  <ns0:text x="283.7333" y="480" text-anchor="middle" font-size="16.4267" fill="#dc3545">No generalization</ns0:text>
  <ns0:text x="597.3333" y="448" text-anchor="middle" font-size="16.4267" fill="#bf360c">RNN/LSTM: Sequential processing</ns0:text>
  <ns0:text x="597.3333" y="480" text-anchor="middle" font-size="16.4267" fill="#bf360c">Memory bottleneck</ns0:text>
  <ns0:text x="910.9333" y="448" text-anchor="middle" font-size="16.4267" fill="#28a745">Transformers: Parallel attention</ns0:text>
  <ns0:text x="910.9333" y="480" text-anchor="middle" font-size="16.4267" fill="#28a745">Long-range + scalable</ns0:text>
  <ns0:line x1="433.0667" y1="384" x2="433.0667" y2="496" stroke="#e0e0e0" stroke-width="1.4933" />
  <ns0:line x1="761.6" y1="384" x2="761.6" y2="496" stroke="#e0e0e0" stroke-width="1.4933" />
</ns0:svg>
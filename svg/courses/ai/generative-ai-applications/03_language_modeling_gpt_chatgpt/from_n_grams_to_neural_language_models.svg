<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="56.571350040809" width="259.4594" height="198.857151918368" rx="6.169047433086" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7298" y="97.999936571423" text-anchor="middle" font-size="20.588064815896" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">N-grams</text>
  <text x="169.7298" y="131.142848081632" text-anchor="middle" font-size="15.836972935305" fill="var(--text-muted)" font-family="Arial, sans-serif">(1990s)</text>
  <text x="169.7298" y="164.285653877546" text-anchor="middle" font-size="15.836972935305" fill="var(--text-muted)" font-family="Arial, sans-serif">Count word sequences</text>
  <text x="169.7298" y="197.428565387755" text-anchor="middle" font-size="15.836972935305" fill="var(--text-muted)" font-family="Arial, sans-serif">P(w | w-1, w-2)</text>
  <text x="169.7298" y="230.571371183668" text-anchor="middle" font-size="15.836972935305" fill="var(--danger-accent)" font-family="Arial, sans-serif">Sparse data, no generalization</text>
  <line x1="299.4595" y1="155.999978857141" x2="364.3244" y2="155.999978857141" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="380.5405" y="56.571350040809" width="259.4594" height="198.857151918368" rx="6.169047433086" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510.2703" y="97.999936571423" text-anchor="middle" font-size="20.588064815896" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">RNNs</text>
  <text x="510.2703" y="131.142848081632" text-anchor="middle" font-size="15.836972935305" fill="var(--text-muted)" font-family="Arial, sans-serif">(2010s)</text>
  <text x="510.2703" y="164.285653877546" text-anchor="middle" font-size="15.836972935305" fill="var(--text-muted)" font-family="Arial, sans-serif">Hidden state sequences</text>
  <text x="510.2703" y="197.428565387755" text-anchor="middle" font-size="15.836972935305" fill="var(--text-muted)" font-family="Arial, sans-serif">P(w | h_t)</text>
  <text x="510.2703" y="230.571371183668" text-anchor="middle" font-size="15.836972935305" fill="var(--danger-accent)" font-family="Arial, sans-serif">Forgets long-range deps</text>
  <line x1="640.0001" y1="155.999978857141" x2="704.8649" y2="155.999978857141" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="721.0811" y="56.571350040809" width="259.4594" height="198.857151918368" rx="6.169047433086" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="850.8108" y="97.999936571423" text-anchor="middle" font-size="20.588064815896" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">LSTMs</text>
  <text x="850.8108" y="131.142848081632" text-anchor="middle" font-size="15.836972935305" fill="var(--text-muted)" font-family="Arial, sans-serif">(2014)</text>
  <text x="850.8108" y="164.285653877546" text-anchor="middle" font-size="15.836972935305" fill="var(--text-muted)" font-family="Arial, sans-serif">Gated memory cells</text>
  <text x="850.8108" y="197.428565387755" text-anchor="middle" font-size="15.836972935305" fill="var(--text-muted)" font-family="Arial, sans-serif">Better long-range</text>
  <text x="850.8108" y="230.571371183668" text-anchor="middle" font-size="15.836972935305" fill="var(--danger-accent)" font-family="Arial, sans-serif">Slow training, limited ctx</text>
  <line x1="980.5405" y1="155.999978857141" x2="1045.4054" y2="155.999978857141" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1061.6216" y="40" width="178.3784" height="232.000063428577" rx="6.169047433086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150.8107" y="89.714261551018" text-anchor="middle" font-size="19.004367522366" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Transformers</text>
  <text x="1150.8107" y="122.857067346932" text-anchor="middle" font-size="15.836972935305" fill="var(--text-muted)" font-family="Arial, sans-serif">(2017)</text>
  <text x="1150.8107" y="155.999978857141" text-anchor="middle" font-size="15.836972935305" fill="var(--text-muted)" font-family="Arial, sans-serif">Parallel</text>
  <text x="1150.8107" y="180.85710963265" text-anchor="middle" font-size="15.836972935305" fill="var(--text-muted)" font-family="Arial, sans-serif">attention</text>
  <text x="1150.8107" y="213.999915428564" text-anchor="middle" font-size="15.836972935305" fill="var(--ok-accent)" font-family="Arial, sans-serif">Scalable!</text>
  <rect x="40" y="321.7142192653" width="1167.5675" height="298.2857807347" rx="6.169047433086" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="623.7838" y="371.428586530614" text-anchor="middle" font-size="20.588064815896" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Key Improvements</text>
  <text x="283.2432" y="421.142848081632" text-anchor="middle" font-size="17.420773046292" fill="var(--danger-accent)" font-family="Arial, sans-serif">N-grams: Frequency tables</text>
  <text x="283.2432" y="454.285653877546" text-anchor="middle" font-size="17.420773046292" fill="var(--danger-accent)" font-family="Arial, sans-serif">No generalization</text>
  <text x="623.7838" y="421.142848081632" text-anchor="middle" font-size="17.420773046292" fill="var(--danger-accent)" font-family="Arial, sans-serif">RNN/LSTM: Sequential processing</text>
  <text x="623.7838" y="454.285653877546" text-anchor="middle" font-size="17.420773046292" fill="var(--danger-accent)" font-family="Arial, sans-serif">Memory bottleneck</text>
  <text x="964.3243" y="421.142848081632" text-anchor="middle" font-size="17.420773046292" fill="var(--ok-accent)" font-family="Arial, sans-serif">Transformers: Parallel attention</text>
  <text x="964.3243" y="454.285653877546" text-anchor="middle" font-size="17.420773046292" fill="var(--ok-accent)" font-family="Arial, sans-serif">Long-range + scalable</text>
  <line x1="445.4055" y1="354.857130775509" x2="445.4055" y2="470.85710963265" stroke="var(--border)" stroke-width="1.4933"/>
  <line x1="802.1622" y1="354.857130775509" x2="802.1622" y2="470.85710963265" stroke="var(--border)" stroke-width="1.4933"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arRight" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="623.7838" y="40" text-anchor="middle" font-size="24.6448" font-weight="bold" fill="var(--text)">From N-grams to Neural Language Models</text>
  <rect x="40" y="87.027" width="259.4594" height="188.1081" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7298" y="126.2162" text-anchor="middle" font-size="20.0239" font-weight="bold" fill="var(--danger-accent)">N-grams</text>
  <text x="169.7298" y="157.5676" text-anchor="middle" font-size="15.403" fill="var(--text-muted)">(1990s)</text>
  <text x="169.7298" y="188.9189" text-anchor="middle" font-size="15.403" fill="var(--text-muted)">Count word sequences</text>
  <text x="169.7298" y="220.2703" text-anchor="middle" font-size="15.403" fill="var(--text-muted)">P(w | w-1, w-2)</text>
  <text x="169.7298" y="251.6216" text-anchor="middle" font-size="15.403" fill="var(--danger-accent)">Sparse data, no generalization</text>
  <line x1="299.4595" y1="181.0811" x2="364.3244" y2="181.0811" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arRight)" />
  <rect x="380.5405" y="87.027" width="259.4594" height="188.1081" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510.2703" y="126.2162" text-anchor="middle" font-size="20.0239" font-weight="bold" fill="var(--danger-accent)">RNNs</text>
  <text x="510.2703" y="157.5676" text-anchor="middle" font-size="15.403" fill="var(--text-muted)">(2010s)</text>
  <text x="510.2703" y="188.9189" text-anchor="middle" font-size="15.403" fill="var(--text-muted)">Hidden state sequences</text>
  <text x="510.2703" y="220.2703" text-anchor="middle" font-size="15.403" fill="var(--text-muted)">P(w | h_t)</text>
  <text x="510.2703" y="251.6216" text-anchor="middle" font-size="15.403" fill="var(--danger-accent)">Forgets long-range deps</text>
  <line x1="640.0001" y1="181.0811" x2="704.8649" y2="181.0811" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arRight)" />
  <rect x="721.0811" y="87.027" width="259.4594" height="188.1081" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="850.8108" y="126.2162" text-anchor="middle" font-size="20.0239" font-weight="bold" fill="var(--danger-accent)">LSTMs</text>
  <text x="850.8108" y="157.5676" text-anchor="middle" font-size="15.403" fill="var(--text-muted)">(2014)</text>
  <text x="850.8108" y="188.9189" text-anchor="middle" font-size="15.403" fill="var(--text-muted)">Gated memory cells</text>
  <text x="850.8108" y="220.2703" text-anchor="middle" font-size="15.403" fill="var(--text-muted)">Better long-range</text>
  <text x="850.8108" y="251.6216" text-anchor="middle" font-size="15.403" fill="var(--danger-accent)">Slow training, limited ctx</text>
  <line x1="980.5405" y1="181.0811" x2="1045.4054" y2="181.0811" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arRight)" />
  <rect x="1061.6216" y="71.3514" width="178.3784" height="219.4595" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150.8107" y="118.3784" text-anchor="middle" font-size="18.4836" font-weight="bold" fill="var(--ok-accent)">Transformers</text>
  <text x="1150.8107" y="149.7297" text-anchor="middle" font-size="15.403" fill="var(--text-muted)">(2017)</text>
  <text x="1150.8107" y="181.0811" text-anchor="middle" font-size="15.403" fill="var(--text-muted)">Parallel</text>
  <text x="1150.8107" y="204.5946" text-anchor="middle" font-size="15.403" fill="var(--text-muted)">attention</text>
  <text x="1150.8107" y="235.9459" text-anchor="middle" font-size="15.403" fill="var(--ok-accent)">Scalable!</text>
  <rect x="40" y="337.8378" width="1167.5675" height="282.1622" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="623.7838" y="384.8649" text-anchor="middle" font-size="20.0239" font-weight="bold" fill="var(--text)">Key Improvements</text>
  <text x="283.2432" y="431.8919" text-anchor="middle" font-size="16.9434" fill="var(--danger-accent)">N-grams: Frequency tables</text>
  <text x="283.2432" y="463.2432" text-anchor="middle" font-size="16.9434" fill="var(--danger-accent)">No generalization</text>
  <text x="623.7838" y="431.8919" text-anchor="middle" font-size="16.9434" fill="var(--danger-accent)">RNN/LSTM: Sequential processing</text>
  <text x="623.7838" y="463.2432" text-anchor="middle" font-size="16.9434" fill="var(--danger-accent)">Memory bottleneck</text>
  <text x="964.3243" y="431.8919" text-anchor="middle" font-size="16.9434" fill="var(--ok-accent)">Transformers: Parallel attention</text>
  <text x="964.3243" y="463.2432" text-anchor="middle" font-size="16.9434" fill="var(--ok-accent)">Long-range + scalable</text>
  <line x1="445.4055" y1="369.1892" x2="445.4055" y2="478.9189" stroke="var(--border)" stroke-width="1.4933" />
  <line x1="802.1622" y1="369.1892" x2="802.1622" y2="478.9189" stroke="var(--border)" stroke-width="1.4933" />
</svg>
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">From N-grams to Neural Language Models</text>
  <!-- N-grams -->
  <rect x="40" y="60" width="160" height="120" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="120" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">N-grams</text>
  <text x="120" y="105" text-anchor="middle" font-size="10" fill="#555">(1990s)</text>
  <text x="120" y="125" text-anchor="middle" font-size="10" fill="#555">Count word sequences</text>
  <text x="120" y="145" text-anchor="middle" font-size="10" fill="#555">P(w | w-1, w-2)</text>
  <text x="120" y="165" text-anchor="middle" font-size="9" fill="#dc3545">Sparse data, no generalization</text>
  <line x1="200" y1="120" x2="240" y2="120" stroke="#4a90e2" stroke-width="2" marker-end="url(#arRight)"/>
  <!-- RNNs -->
  <rect x="250" y="60" width="160" height="120" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="330" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">RNNs</text>
  <text x="330" y="105" text-anchor="middle" font-size="10" fill="#555">(2010s)</text>
  <text x="330" y="125" text-anchor="middle" font-size="10" fill="#555">Hidden state sequences</text>
  <text x="330" y="145" text-anchor="middle" font-size="10" fill="#555">P(w | h_t)</text>
  <text x="330" y="165" text-anchor="middle" font-size="9" fill="#856404">Forgets long-range deps</text>
  <line x1="410" y1="120" x2="450" y2="120" stroke="#4a90e2" stroke-width="2" marker-end="url(#arRight)"/>
  <!-- LSTMs -->
  <rect x="460" y="60" width="160" height="120" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="540" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">LSTMs</text>
  <text x="540" y="105" text-anchor="middle" font-size="10" fill="#555">(2014)</text>
  <text x="540" y="125" text-anchor="middle" font-size="10" fill="#555">Gated memory cells</text>
  <text x="540" y="145" text-anchor="middle" font-size="10" fill="#555">Better long-range</text>
  <text x="540" y="165" text-anchor="middle" font-size="9" fill="#856404">Slow training, limited ctx</text>
  <line x1="620" y1="120" x2="660" y2="120" stroke="#4a90e2" stroke-width="2" marker-end="url(#arRight)"/>
  <!-- Transformers -->
  <rect x="670" y="50" width="110" height="140" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="725" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Transformers</text>
  <text x="725" y="100" text-anchor="middle" font-size="10" fill="#555">(2017)</text>
  <text x="725" y="120" text-anchor="middle" font-size="10" fill="#555">Parallel</text>
  <text x="725" y="135" text-anchor="middle" font-size="10" fill="#555">attention</text>
  <text x="725" y="155" text-anchor="middle" font-size="9" fill="#28a745">Scalable!</text>
  <!-- Summary at bottom -->
  <rect x="40" y="220" width="720" height="180" rx="5" fill="#f0f7ff" stroke="#4a90e2" stroke-width="1"/>
  <text x="400" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Key Improvements</text>
  <text x="190" y="280" text-anchor="middle" font-size="11" fill="#dc3545">N-grams: Frequency tables</text>
  <text x="190" y="300" text-anchor="middle" font-size="11" fill="#dc3545">No generalization</text>
  <text x="400" y="280" text-anchor="middle" font-size="11" fill="#856404">RNN/LSTM: Sequential processing</text>
  <text x="400" y="300" text-anchor="middle" font-size="11" fill="#856404">Memory bottleneck</text>
  <text x="610" y="280" text-anchor="middle" font-size="11" fill="#28a745">Transformers: Parallel attention</text>
  <text x="610" y="300" text-anchor="middle" font-size="11" fill="#28a745">Long-range + scalable</text>
  <line x1="290" y1="240" x2="290" y2="310" stroke="#dee2e6" stroke-width="1"/>
  <line x1="510" y1="240" x2="510" y2="310" stroke="#dee2e6" stroke-width="1"/>
</svg>
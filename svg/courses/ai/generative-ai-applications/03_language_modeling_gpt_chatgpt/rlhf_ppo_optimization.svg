<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="apd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 0,9" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="423.5002" y="52.9375" text-anchor="middle" font-size="14.1388" font-weight="bold" fill="var(--text)">RLHF PPO Optimization Loop</text>
  <rect x="246.7656" y="71.5775" width="353.4692" height="177.0797" rx="5.1363" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.3234" />
  <text x="423.5002" y="97.6735" text-anchor="middle" font-size="11.4878" font-weight="bold" fill="var(--primary-accent)">PPO (Proximal Policy Optimization)</text>
  <text x="423.5002" y="122.8374" text-anchor="middle" font-size="10.604" fill="var(--text)">1. Sample prompt from dataset</text>
  <text x="423.5002" y="144.2733" text-anchor="middle" font-size="10.604" fill="var(--text)">2. Generate response with policy</text>
  <text x="423.5002" y="165.7094" text-anchor="middle" font-size="10.604" fill="var(--text)">3. Score with reward model</text>
  <text x="423.5002" y="187.1453" text-anchor="middle" font-size="10.604" fill="var(--text)">4. Compute advantage</text>
  <text x="423.5002" y="208.5813" text-anchor="middle" font-size="10.604" fill="var(--text)">5. Update policy (with KL penalty)</text>
  <path d="M 600.2347 136.8174 Q 640 136.8174 640 174.0974 Q 640 211.3773 600.2347 211.3773" fill="none" stroke="var(--primary-border)" stroke-width="1.3661" stroke-dasharray="3.4153 2.0492" />
  <text x="657.6735" y="178.7574" text-anchor="middle" font-size="10" fill="var(--primary-accent)">repeat</text>
  <rect x="180.4901" y="276.6172" width="486.0201" height="46.6" rx="5.1363" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.3234" />
  <text x="423.5002" y="297.1212" text-anchor="middle" font-size="10.604" font-weight="bold" fill="var(--danger-accent)">Objective: maximize E[reward(prompt, response)]</text>
  <text x="423.5002" y="313.8971" text-anchor="middle" font-size="10.604" fill="var(--danger-accent)">subject to KL(policy || sft_model) &lt; delta</text>
  <rect x="180.4901" y="341.8571" width="486.0201" height="41.9399" rx="5.1363" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.3234" />
  <text x="423.5002" y="360.4971" text-anchor="middle" font-size="10" fill="var(--danger-accent)">KL constraint prevents "reward hacking" -- finding degenerate responses</text>
  <text x="423.5002" y="375.4091" text-anchor="middle" font-size="10" fill="var(--danger-accent)">that score high on reward model but are actually low quality</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="apd" markerWidth="17.0667" markerHeight="12.6" refX="8.5333" refY="12.6" orient="auto">
      <ns0:polygon points="0,18 0,9" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="387.0968" y="32.6613" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="#333">RLHF PPO Optimization Loop</ns0:text>
  <ns0:rect x="180.6452" y="54.4355" width="412.9033" height="206.8548" rx="8.258" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.0645" />
  <ns0:text x="387.0968" y="84.9194" text-anchor="middle" font-size="13.4194" font-weight="bold" fill="#4a90e2">PPO (Proximal Policy Optimization)</ns0:text>
  <ns0:text x="387.0968" y="114.3145" text-anchor="middle" font-size="12.3871" fill="#333">1. Sample prompt from dataset</ns0:text>
  <ns0:text x="387.0968" y="139.3548" text-anchor="middle" font-size="12.3871" fill="#333">2. Generate response with policy</ns0:text>
  <ns0:text x="387.0968" y="164.3952" text-anchor="middle" font-size="12.3871" fill="#333">3. Score with reward model</ns0:text>
  <ns0:text x="387.0968" y="189.4355" text-anchor="middle" font-size="12.3871" fill="#333">4. Compute advantage</ns0:text>
  <ns0:text x="387.0968" y="214.4758" text-anchor="middle" font-size="12.3871" fill="#333">5. Update policy (with KL penalty)</ns0:text>
  <ns0:path d="M 593.5484 130.6452 Q 640 130.6452 640 174.1936 Q 640 217.7419 593.5484 217.7419" fill="none" stroke="#4a90e2" stroke-width="2.0645" stroke-dasharray="5.1613 3.0968" />
  <ns0:text x="660.6452" y="179.6371" text-anchor="middle" font-size="10.3226" fill="#4a90e2">repeat</ns0:text>
  <ns0:rect x="103.2258" y="293.9516" width="567.742" height="54.4355" rx="5.1613" fill="#fff3cd" stroke="#ffc107" stroke-width="2.0645" />
  <ns0:text x="387.0968" y="317.9032" text-anchor="middle" font-size="12.3871" font-weight="bold" fill="#bf360c">Objective: maximize E[reward(prompt, response)]</ns0:text>
  <ns0:text x="387.0968" y="337.5" text-anchor="middle" font-size="12.3871" fill="#bf360c">subject to KL(policy || sft_model) &lt; delta</ns0:text>
  <ns0:rect x="103.2258" y="370.1613" width="567.742" height="48.9919" rx="5.1613" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5484" />
  <ns0:text x="387.0968" y="391.9355" text-anchor="middle" font-size="11.3548" fill="#dc3545">KL constraint prevents "reward hacking" -- finding degenerate responses</ns0:text>
  <ns0:text x="387.0968" y="409.3549" text-anchor="middle" font-size="11.3548" fill="#dc3545">that score high on reward model but are actually low quality</ns0:text>
</ns0:svg>
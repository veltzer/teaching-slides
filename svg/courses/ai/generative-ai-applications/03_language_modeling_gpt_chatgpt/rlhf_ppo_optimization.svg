<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="apd" markerWidth="17.0667" markerHeight="12.6" refX="8.5333" refY="12.6" orient="auto">
      <polygon points="0,18 0,9" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="#333">RLHF PPO Optimization Loop</text>
  <rect x="298.6667" y="90" width="682.6667" height="342" rx="13.6533" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="640" y="140.4" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#4a90e2">PPO (Proximal Policy Optimization)</text>
  <text x="640" y="189" text-anchor="middle" font-size="20.48" fill="#333">1. Sample prompt from dataset</text>
  <text x="640" y="230.4" text-anchor="middle" font-size="20.48" fill="#333">2. Generate response with policy</text>
  <text x="640" y="271.8" text-anchor="middle" font-size="20.48" fill="#333">3. Score with reward model</text>
  <text x="640" y="313.2" text-anchor="middle" font-size="20.48" fill="#333">4. Compute advantage</text>
  <text x="640" y="354.6" text-anchor="middle" font-size="20.48" fill="#333">5. Update policy (with KL penalty)</text>
  <path d="M 981.3333 216 Q 1058.1333 216 1058.1333 288 Q 1058.1333 360 981.3333 360" fill="none" stroke="#4a90e2" stroke-width="3.4133" stroke-dasharray="8.5333 5.12" />
  <text x="1092.2667" y="297" text-anchor="middle" font-size="17.0667" fill="#4a90e2">repeat</text>
  <rect x="170.6667" y="486" width="938.6667" height="90" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="640" y="525.6" text-anchor="middle" font-size="20.48" font-weight="bold" fill="#856404">Objective: maximize E[reward(prompt, response)]</text>
  <text x="640" y="558" text-anchor="middle" font-size="20.48" fill="#856404">subject to KL(policy || sft_model) &lt; delta</text>
  <rect x="170.6667" y="612" width="938.6667" height="81" rx="8.5333" fill="#f8d7da" stroke="#dc3545" stroke-width="2.56" />
  <text x="640" y="648" text-anchor="middle" font-size="18.7733" fill="#dc3545">KL constraint prevents "reward hacking" -- finding degenerate responses</text>
  <text x="640" y="676.8" text-anchor="middle" font-size="18.7733" fill="#dc3545">that score high on reward model but are actually low quality</text>
</svg>
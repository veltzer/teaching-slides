<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="28.369247" font-weight="bold" fill="var(--text)">Pre-Training Data Mix</text>

  <!-- Row template: label x=40-280, bar from x=290 width scales to 900 max -->
  <!-- 60% -->
  <text x="280" y="122.123894" text-anchor="end" font-size="20.263748" font-weight="bold" fill="var(--text)">Web crawl</text>
  <rect x="290" y="94.40708" width="900" height="55.433628" rx="6.079124" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1210" y="131.362832" font-size="22.290122" font-weight="bold" fill="var(--text)">60%</text>
  <text x="305" y="135.469027" font-size="16.210998" fill="var(--primary-text)">Common Crawl, C4, RefinedWeb</text>

  <!-- 16% -->
  <text x="280" y="204.247788" text-anchor="end" font-size="20.263748" font-weight="bold" fill="var(--text)">Books</text>
  <rect x="290" y="176.530973" width="240" height="55.433628" rx="6.079124" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="213.486726" font-size="22.290122" font-weight="bold" fill="var(--text)">16%</text>
  <text x="305" y="209.380531" font-size="14.184623" fill="var(--ok-text)">fiction, non-fiction</text>

  <!-- 10% -->
  <text x="280" y="286.371681" text-anchor="end" font-size="20.263748" font-weight="bold" fill="var(--text)">Code (GitHub)</text>
  <rect x="290" y="258.654867" width="150" height="55.433628" rx="6.079124" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="295.610619" font-size="22.290122" font-weight="bold" fill="var(--text)">10%</text>
  <text x="305" y="291.504425" font-size="14.184623" fill="var(--warn-text)">many languages</text>

  <!-- 6% -->
  <text x="280" y="368.495575" text-anchor="end" font-size="20.263748" font-weight="bold" fill="var(--text)">Wikipedia</text>
  <rect x="290" y="340.778761" width="90" height="55.433628" rx="6.079124" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="377.734513" font-size="22.290122" font-weight="bold" fill="var(--text)">6%</text>
  <text x="305" y="373.628319" font-size="13.171436" fill="var(--info-text)">encyclopedic</text>

  <!-- 4% -->
  <text x="280" y="450.619469" text-anchor="end" font-size="20.263748" font-weight="bold" fill="var(--text)">Academic papers</text>
  <rect x="290" y="422.902655" width="60" height="55.433628" rx="6.079124" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="459.858407" font-size="22.290122" font-weight="bold" fill="var(--text)">4%</text>
  <text x="305" y="455.752212" font-size="12.158249" fill="var(--danger-text)">arXiv</text>

  <!-- 4% -->
  <text x="280" y="532.743363" text-anchor="end" font-size="20.263748" font-weight="bold" fill="var(--text)">Curated datasets</text>
  <rect x="290" y="505.026549" width="60" height="55.433628" rx="6.079124" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="541.982301" font-size="22.290122" font-weight="bold" fill="var(--text)">4%</text>
  <text x="305" y="537.876106" font-size="12.158249" fill="var(--ok-text)">QA, dialog</text>

  <rect x="40" y="576.884956" width="1200" height="43.115044" rx="6.079124" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="605.628319" text-anchor="middle" font-size="16.210998" fill="var(--text-muted)">Roughly 1–2 trillion tokens total — percentages are representative, not canonical</text>
</svg>

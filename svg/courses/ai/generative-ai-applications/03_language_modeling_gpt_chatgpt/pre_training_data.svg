<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="55" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)">Pre-Training Data Mix</text>

  <!-- Row template: label x=40-280, bar from x=290 width scales to 900 max -->
  <!-- 60% -->
  <text x="280" y="135" text-anchor="end" font-size="20" font-weight="bold" fill="var(--text)">Web crawl</text>
  <rect x="290" y="108" width="900" height="54" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1210" y="144" font-size="22" font-weight="bold" fill="var(--text)">60%</text>
  <text x="305" y="148" font-size="16" fill="var(--primary-text)">Common Crawl, C4, RefinedWeb</text>

  <!-- 16% -->
  <text x="280" y="215" text-anchor="end" font-size="20" font-weight="bold" fill="var(--text)">Books</text>
  <rect x="290" y="188" width="240" height="54" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="550" y="224" font-size="22" font-weight="bold" fill="var(--text)">16%</text>
  <text x="305" y="220" font-size="14" fill="var(--ok-text)">fiction, non-fiction</text>

  <!-- 10% -->
  <text x="280" y="295" text-anchor="end" font-size="20" font-weight="bold" fill="var(--text)">Code (GitHub)</text>
  <rect x="290" y="268" width="150" height="54" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="460" y="304" font-size="22" font-weight="bold" fill="var(--text)">10%</text>
  <text x="305" y="300" font-size="14" fill="var(--warn-text)">many languages</text>

  <!-- 6% -->
  <text x="280" y="375" text-anchor="end" font-size="20" font-weight="bold" fill="var(--text)">Wikipedia</text>
  <rect x="290" y="348" width="90" height="54" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="400" y="384" font-size="22" font-weight="bold" fill="var(--text)">6%</text>
  <text x="305" y="380" font-size="13" fill="var(--info-text)">encyclopedic</text>

  <!-- 4% -->
  <text x="280" y="455" text-anchor="end" font-size="20" font-weight="bold" fill="var(--text)">Academic papers</text>
  <rect x="290" y="428" width="60" height="54" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="370" y="464" font-size="22" font-weight="bold" fill="var(--text)">4%</text>
  <text x="305" y="460" font-size="12" fill="var(--danger-text)">arXiv</text>

  <!-- 4% -->
  <text x="280" y="535" text-anchor="end" font-size="20" font-weight="bold" fill="var(--text)">Curated datasets</text>
  <rect x="290" y="508" width="60" height="54" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="370" y="544" font-size="22" font-weight="bold" fill="var(--text)">4%</text>
  <text x="305" y="540" font-size="12" fill="var(--ok-text)">QA, dialog</text>

  <rect x="40" y="578" width="1200" height="42" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="606" text-anchor="middle" font-size="16" fill="var(--text-muted)">Roughly 1–2 trillion tokens total — percentages are representative, not canonical</text>
</svg>

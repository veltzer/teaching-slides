<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="28.369247" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pre-Training Data Mix</text>

  <!-- Row template: label x=40-280, bar from x=290 width scales to 900 max -->
  <!-- 60% -->
  <text x="280" y="122.123894" text-anchor="end" font-size="20.263748" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Web crawl</text>
  <rect x="290" y="94.40708" width="900" height="55.433628" rx="6.079124" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1210" y="131.362832" font-size="22.290122" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">60%</text>
  <text x="305" y="135.469027" font-size="16.210998" fill="var(--primary-text)" font-family="Arial, sans-serif">Common Crawl, C4, RefinedWeb</text>

  <!-- 16% -->
  <text x="280" y="204.247788" text-anchor="end" font-size="20.263748" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Books</text>
  <rect x="290" y="176.530973" width="240" height="55.433628" rx="6.079124" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="213.486726" font-size="22.290122" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">16%</text>
  <text x="305" y="209.380531" font-size="14.184623" fill="var(--ok-text)" font-family="Arial, sans-serif">fiction, non-fiction</text>

  <!-- 10% -->
  <text x="280" y="286.371681" text-anchor="end" font-size="20.263748" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Code (GitHub)</text>
  <rect x="290" y="258.654867" width="150" height="55.433628" rx="6.079124" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="295.610619" font-size="22.290122" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">10%</text>
  <text x="305" y="291.504425" font-size="14.184623" fill="var(--warn-text)" font-family="Arial, sans-serif">many languages</text>

  <!-- 6% -->
  <text x="280" y="368.495575" text-anchor="end" font-size="20.263748" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Wikipedia</text>
  <rect x="290" y="340.778761" width="90" height="55.433628" rx="6.079124" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="377.734513" font-size="22.290122" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">6%</text>
  <text x="305" y="373.628319" font-size="13.171436" fill="var(--info-text)" font-family="Arial, sans-serif">encyclopedic</text>

  <!-- 4% -->
  <text x="280" y="450.619469" text-anchor="end" font-size="20.263748" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Academic papers</text>
  <rect x="290" y="422.902655" width="60" height="55.433628" rx="6.079124" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="459.858407" font-size="22.290122" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">4%</text>
  <text x="305" y="455.752212" font-size="12.158249" fill="var(--danger-text)" font-family="Arial, sans-serif">arXiv</text>

  <!-- 4% -->
  <text x="280" y="532.743363" text-anchor="end" font-size="20.263748" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Curated datasets</text>
  <rect x="290" y="505.026549" width="60" height="55.433628" rx="6.079124" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="541.982301" font-size="22.290122" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">4%</text>
  <text x="305" y="537.876106" font-size="12.158249" fill="var(--ok-text)" font-family="Arial, sans-serif">QA, dialog</text>

  <rect x="40" y="576.884956" width="1200" height="43.115044" rx="6.079124" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="605.628319" text-anchor="middle" font-size="16.210998" fill="var(--text-muted)" font-family="Arial, sans-serif">Roughly 1–2 trillion tokens total — percentages are representative, not canonical</text>
</svg>

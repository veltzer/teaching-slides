<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="657.1428" y="40" text-anchor="middle" font-size="25.3302" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Temperature vs Top-p: When to Use Which</text>
  <rect x="40" y="83.2836" width="377.1429" height="51.9403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5714" y="117.9105" text-anchor="middle" font-size="18.9976" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Task</text>
  <rect x="451.4286" y="83.2836" width="377.1429" height="51.9403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="117.9105" text-anchor="middle" font-size="18.9976" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Temperature</text>
  <rect x="862.8571" y="83.2836" width="377.1429" height="51.9403" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4285" y="117.9105" text-anchor="middle" font-size="18.9976" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Top-p</text>
  <rect x="40" y="152.5373" width="377.1429" height="60.597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5714" y="192.3582" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">Code generation</text>
  <rect x="451.4286" y="152.5373" width="377.1429" height="60.597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="192.3582" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">0.0 - 0.2</text>
  <rect x="862.8571" y="152.5373" width="377.1429" height="60.597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4285" y="192.3582" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">0.1</text>
  <rect x="40" y="230.4478" width="377.1429" height="60.597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5714" y="270.2687" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">Factual Q&amp;A</text>
  <rect x="451.4286" y="230.4478" width="377.1429" height="60.597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="270.2687" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">0.0 - 0.3</text>
  <rect x="862.8571" y="230.4478" width="377.1429" height="60.597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4285" y="270.2687" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">0.3</text>
  <rect x="40" y="308.3582" width="377.1429" height="60.597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5714" y="348.1791" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">Business writing</text>
  <rect x="451.4286" y="308.3582" width="377.1429" height="60.597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="348.1791" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">0.3 - 0.5</text>
  <rect x="862.8571" y="308.3582" width="377.1429" height="60.597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4285" y="348.1791" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">0.5</text>
  <rect x="40" y="386.2687" width="377.1429" height="60.597" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5714" y="426.0895" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">Creative writing</text>
  <rect x="451.4286" y="386.2687" width="377.1429" height="60.597" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="426.0895" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">0.7 - 1.0</text>
  <rect x="862.8571" y="386.2687" width="377.1429" height="60.597" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4285" y="426.0895" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">0.9</text>
  <rect x="40" y="464.179" width="377.1429" height="60.597" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5714" y="504" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">Brainstorming</text>
  <rect x="451.4286" y="464.179" width="377.1429" height="60.597" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="504" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">1.0 - 1.5</text>
  <rect x="862.8571" y="464.179" width="377.1429" height="60.597" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4285" y="504" text-anchor="middle" font-size="17.4146" fill="var(--text)" font-family="Arial, sans-serif">0.95</text>
  <rect x="177.1429" y="559.403" width="960" height="60.597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="657.1428" y="599.2239" text-anchor="middle" font-size="18.9976" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">General rule: Adjust ONE of temperature or top_p, not both.</text>
</svg>

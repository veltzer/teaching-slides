  <rect x="177.1429" y="559.403" width="960" height="60.597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="657.1428" y="599.2239" text-anchor="middle" font-size="18.9976" font-weight="bold" fill="var(--danger-accent)">General rule: Adjust ONE of temperature or top_p, not both.</text>
</svg>
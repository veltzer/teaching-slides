  <text x="1051.4285" y="117.9105" text-anchor="middle" font-size="18.9976" font-weight="bold" fill="var(--bg)">Top-p</text>
  <rect x="40" y="152.5373" width="377.1429" height="60.597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="228.5714" y="192.3582" text-anchor="middle" font-size="17.4146" fill="var(--text)">Code generation</text>
  <rect x="451.4286" y="152.5373" width="377.1429" height="60.597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="639.9999" y="192.3582" text-anchor="middle" font-size="17.4146" fill="var(--text)">0.0 - 0.2</text>
  <rect x="862.8571" y="152.5373" width="377.1429" height="60.597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1051.4285" y="192.3582" text-anchor="middle" font-size="17.4146" fill="var(--text)">0.1</text>
  <rect x="40" y="230.4478" width="377.1429" height="60.597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="228.5714" y="270.2687" text-anchor="middle" font-size="17.4146" fill="var(--text)">Factual Q&amp;A</text>
  <rect x="451.4286" y="230.4478" width="377.1429" height="60.597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="639.9999" y="270.2687" text-anchor="middle" font-size="17.4146" fill="var(--text)">0.0 - 0.3</text>
  <rect x="862.8571" y="230.4478" width="377.1429" height="60.597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1051.4285" y="270.2687" text-anchor="middle" font-size="17.4146" fill="var(--text)">0.3</text>
  <rect x="40" y="308.3582" width="377.1429" height="60.597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="228.5714" y="348.1791" text-anchor="middle" font-size="17.4146" fill="var(--text)">Business writing</text>
  <rect x="451.4286" y="308.3582" width="377.1429" height="60.597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="639.9999" y="348.1791" text-anchor="middle" font-size="17.4146" fill="var(--text)">0.3 - 0.5</text>
  <rect x="862.8571" y="308.3582" width="377.1429" height="60.597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1051.4285" y="348.1791" text-anchor="middle" font-size="17.4146" fill="var(--text)">0.5</text>
  <rect x="40" y="386.2687" width="377.1429" height="60.597" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="228.5714" y="426.0895" text-anchor="middle" font-size="17.4146" fill="var(--text)">Creative writing</text>
  <rect x="451.4286" y="386.2687" width="377.1429" height="60.597" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="639.9999" y="426.0895" text-anchor="middle" font-size="17.4146" fill="var(--text)">0.7 - 1.0</text>
  <rect x="862.8571" y="386.2687" width="377.1429" height="60.597" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1051.4285" y="426.0895" text-anchor="middle" font-size="17.4146" fill="var(--text)">0.9</text>
  <rect x="40" y="464.179" width="377.1429" height="60.597" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="228.5714" y="504" text-anchor="middle" font-size="17.4146" fill="var(--text)">Brainstorming</text>
  <rect x="451.4286" y="464.179" width="377.1429" height="60.597" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="639.9999" y="504" text-anchor="middle" font-size="17.4146" fill="var(--text)">1.0 - 1.5</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="615.000003" y="40" font-family="sans-serif" font-size="36.567748" font-weight="bold" fill="var(--text)" text-anchor="middle">LLM Performance Growth Over Time</text>
  <line x1="40" y1="93.953579" x2="40" y2="566.046555" stroke="var(--text)" stroke-width="2" />
  <line x1="40" y1="566.046555" x2="1240" y2="566.046555" stroke="var(--text)" stroke-width="2" />
  <text x="91.7241" y="317.3913" font-family="sans-serif" font-size="23.0143" fill="var(--text-muted)" text-anchor="middle" transform="rotate(-90,25,110)">Performance</text>
  <text x="89.999874" y="620" font-family="sans-serif" font-size="26.816458" fill="var(--text-muted)" text-anchor="middle">2019</text>
  <text x="277.499885" y="620" font-family="sans-serif" font-size="26.816458" fill="var(--text-muted)" text-anchor="middle">2020</text>
  <text x="477.499986" y="620" font-family="sans-serif" font-size="26.816458" fill="var(--text-muted)" text-anchor="middle">2021</text>
  <text x="677.499966" y="620" font-family="sans-serif" font-size="26.816458" fill="var(--text-muted)" text-anchor="middle">2022</text>
  <text x="877.500067" y="620" font-family="sans-serif" font-size="26.816458" fill="var(--text-muted)" text-anchor="middle">2023</text>
  <text x="1077.500047" y="620" font-family="sans-serif" font-size="26.816458" fill="var(--text-muted)" text-anchor="middle">2024</text>
  <polyline points="89.999874,532.325619 277.499885,481.744214 477.499986,424.418595 677.499966,346.860468 877.500067,235.581538 1077.500047,110.814047" fill="none" stroke="var(--primary-border)" stroke-width="4.9042" />
  <rect x="80.2483" y="522.574" width="19.5031" height="19.5031" rx="9.75154" fill="var(--primary-accent)"/>
  <text x="102.499963" y="515.465017" font-family="sans-serif" font-size="26.816458" fill="var(--text)">GPT-2</text>
  <rect x="267.748" y="471.993" width="19.5031" height="19.5031" rx="9.75154" fill="var(--primary-accent)"/>
  <text x="289.999854" y="464.883746" font-family="sans-serif" font-size="26.816458" fill="var(--text)">GPT-3</text>
  <rect x="667.748" y="337.109" width="19.5031" height="19.5031" rx="9.75154" fill="var(--primary-accent)"/>
  <text x="690.000055" y="330" font-family="sans-serif" font-size="26.816458" fill="var(--text)">GPT-3.5</text>
  <rect x="867.749" y="225.83" width="19.5031" height="19.5031" rx="9.75154" fill="var(--primary-accent)"/>
  <text x="890.000035" y="218.720936" font-family="sans-serif" font-size="26.816458" fill="var(--text)">GPT-4</text>
  <rect x="1067.75" y="101.063" width="19.5031" height="19.5031" rx="9.75154" fill="var(--warn-accent)"/>
  <text x="990.000025" y="100.697793" font-family="sans-serif" font-size="26.816458" fill="var(--warn-accent)">GPT-5 / Claude</text>
</svg>
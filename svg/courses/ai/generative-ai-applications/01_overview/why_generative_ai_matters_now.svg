<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="66.7826" font-family="sans-serif" font-size="29.4252" font-weight="bold" fill="var(--text)" text-anchor="middle">LLM Performance Growth Over Time</text>
  <line x1="117.7012" y1="111.3044" x2="117.7012" y2="500.8696" stroke="var(--text)" stroke-width="2" />
  <line x1="117.7012" y1="500.8696" x2="1059.3103" y2="500.8696" stroke="var(--text)" stroke-width="2" />
  <text x="49.0421" y="306.0869" font-family="sans-serif" font-size="23.5403" fill="var(--text-muted)" text-anchor="middle" transform="rotate(-90,25,110)">Performance</text>
  <text x="156.9348" y="545.3913" font-family="sans-serif" font-size="21.5786" fill="var(--text-muted)" text-anchor="middle">2019</text>
  <text x="304.0613" y="545.3913" font-family="sans-serif" font-size="21.5786" fill="var(--text-muted)" text-anchor="middle">2020</text>
  <text x="460.9962" y="545.3913" font-family="sans-serif" font-size="21.5786" fill="var(--text-muted)" text-anchor="middle">2021</text>
  <text x="617.931" y="545.3913" font-family="sans-serif" font-size="21.5786" fill="var(--text-muted)" text-anchor="middle">2022</text>
  <text x="774.8659" y="545.3913" font-family="sans-serif" font-size="21.5786" fill="var(--text-muted)" text-anchor="middle">2023</text>
  <text x="931.8008" y="545.3913" font-family="sans-serif" font-size="21.5786" fill="var(--text-muted)" text-anchor="middle">2024</text>
  <polyline points="156.9348,473.0435 304.0613,431.3044 460.9962,384 617.931,320 774.8659,228.174 931.8008,125.2174" fill="none" stroke="var(--primary-border)" stroke-width="4.9042" />
  <circle cx="156.9348" cy="473.0435" r="7.8468" fill="var(--primary-accent)" />
  <text x="166.7433" y="459.1304" font-family="sans-serif" font-size="21.5786" fill="var(--text)">GPT-2</text>
  <circle cx="304.0613" cy="431.3044" r="7.8468" fill="var(--primary-accent)" />
  <text x="313.8697" y="417.3913" font-family="sans-serif" font-size="21.5786" fill="var(--text)">GPT-3</text>
  <circle cx="617.931" cy="320" r="7.8468" fill="var(--primary-accent)" />
  <text x="627.7395" y="306.0869" font-family="sans-serif" font-size="21.5786" fill="var(--text)">GPT-3.5</text>
  <circle cx="774.8659" cy="228.174" r="7.8468" fill="var(--primary-accent)" />
  <text x="784.6743" y="214.2609" font-family="sans-serif" font-size="21.5786" fill="var(--text)">GPT-4</text>
  <circle cx="931.8008" cy="125.2174" r="7.8468" fill="var(--warn-accent)" />
  <text x="863.1418" y="116.8696" font-family="sans-serif" font-size="21.5786" fill="var(--warn-accent)">GPT-5 / Claude</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" x="40" y="40"/>
  <text x="640" y="100.5217" font-family="sans-serif" font-size="28.7677" font-weight="bold" fill="var(--text)" text-anchor="middle">LLM Performance Growth Over Time</text>
  <line x1="164.138" y1="140.8696" x2="164.138" y2="493.9131" stroke="var(--text)" stroke-width="2" />
  <line x1="164.138" y1="493.9131" x2="1157.2413" y2="493.9131" stroke="var(--text)" stroke-width="2" />
  <text x="91.7241" y="317.3913" font-family="sans-serif" font-size="23.0143" fill="var(--text-muted)" text-anchor="middle" transform="rotate(-90,25,110)">Performance</text>
  <text x="205.5172" y="534.2609" font-family="sans-serif" font-size="21.0964" fill="var(--text-muted)" text-anchor="middle">2019</text>
  <text x="360.6896" y="534.2609" font-family="sans-serif" font-size="21.0964" fill="var(--text-muted)" text-anchor="middle">2020</text>
  <text x="526.2069" y="534.2609" font-family="sans-serif" font-size="21.0964" fill="var(--text-muted)" text-anchor="middle">2021</text>
  <text x="691.7241" y="534.2609" font-family="sans-serif" font-size="21.0964" fill="var(--text-muted)" text-anchor="middle">2022</text>
  <text x="857.2414" y="534.2609" font-family="sans-serif" font-size="21.0964" fill="var(--text-muted)" text-anchor="middle">2023</text>
  <text x="1022.7586" y="534.2609" font-family="sans-serif" font-size="21.0964" fill="var(--text-muted)" text-anchor="middle">2024</text>
  <polyline points="205.5172,468.6957 360.6896,430.8696 526.2069,388 691.7241,330 857.2414,246.7827 1022.7586,153.4783" fill="none" stroke="var(--primary-border)" stroke-width="4.9042" />
  <circle cx="205.5172" cy="468.6957" r="7.6715" fill="var(--primary-accent)" />
  <text x="215.8621" y="456.0869" font-family="sans-serif" font-size="21.0964" fill="var(--text)">GPT-2</text>
  <circle cx="360.6896" cy="430.8696" r="7.6715" fill="var(--primary-accent)" />
  <text x="371.0344" y="418.2609" font-family="sans-serif" font-size="21.0964" fill="var(--text)">GPT-3</text>
  <circle cx="691.7241" cy="330" r="7.6715" fill="var(--primary-accent)" />
  <text x="702.069" y="317.3913" font-family="sans-serif" font-size="21.0964" fill="var(--text)">GPT-3.5</text>
  <circle cx="857.2414" cy="246.7827" r="7.6715" fill="var(--primary-accent)" />
  <text x="867.5862" y="234.1739" font-family="sans-serif" font-size="21.0964" fill="var(--text)">GPT-4</text>
  <circle cx="1022.7586" cy="153.4783" r="7.6715" fill="var(--warn-accent)" />
  <text x="950.3448" y="145.9131" font-family="sans-serif" font-size="21.0964" fill="var(--warn-accent)">GPT-5 / Claude</text>
</svg>
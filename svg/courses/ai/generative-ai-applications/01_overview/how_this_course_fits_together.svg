<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="344.262247" height="160.000040460411" fill="url(#grad-primary)" rx="6.757698259811" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.147615" y="80.000068149595" font-size="22.7786234061" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Day 1: FOUNDATIONS</text>
  <text x="211.147615" y="116.000095191122" font-size="22.7786234061" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">How LLMs work</text>
  <text x="211.147615" y="150.000100623441" font-size="22.7786234061" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">GPT architecture</text>
  <line x1="384.262247" y1="120.000020230206" x2="439.34422" y2="120.000020230206" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="443.278685" y="40" width="344.262247" height="160.000040460411" fill="url(#grad-ok)" rx="6.757698259811" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="614.426192" y="80.000068149595" font-size="22.7786234061" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Day 2: APIs &amp; PROMPTS</text>
  <text x="614.426192" y="116.000095191122" font-size="22.7786234061" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">OpenAI API</text>
  <text x="614.426192" y="150.000100623441" font-size="22.7786234061" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Prompt Engineering</text>
  <text x="614.426192" y="184.000107110933" font-size="22.7786234061" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Fine-tuning</text>
  <line x1="787.540932" y1="120.000020230206" x2="842.622905" y2="120.000020230206" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="846.55737" y="40" width="393.44263" height="160.000040460411" fill="url(#grad-warn)" rx="6.757698259811" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.278577" y="80.000068149595" font-size="22.7786234061" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Day 4: OPEN SOURCE</text>
  <text x="1043.278577" y="116.000095191122" font-size="22.7786234061" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">HuggingFace</text>
  <text x="1043.278577" y="150.000100623441" font-size="22.7786234061" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">LoRA / QLoRA</text>
  <text x="1043.278577" y="184.000107110933" font-size="22.7786234061" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Local models</text>
  <rect x="443.278685" y="300.000036203335" width="344.262247" height="160.000040460411" fill="url(#grad-info)" rx="6.757698259811" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="614.426192" y="339.999988283946" font-size="22.7786234061" font-weight="bold" fill="var(--info-accent)" text-anchor="middle" font-family="Arial, sans-serif">Day 3: AGENTS</text>
  <text x="614.426192" y="376.0000142703" font-size="22.7786234061" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">LangChain</text>
  <text x="614.426192" y="410.000019702619" font-size="22.7786234061" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Memory &amp; Custom DB</text>
  <line x1="614.426192" y1="199.999923336254" x2="614.426192" y2="295.999994040094" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1043.278577" y1="199.999923336254" x2="787.540932" y2="376.0000142703" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="443.278685" y="550.000084650311" width="393.44263" height="69.999915349689" fill="url(#grad-danger)" rx="6.757698259811" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999892" y="594.000078894163" font-size="22.7786234061" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Day 5: IMAGES &amp; SAFETY — Diffusion · DreamBooth · Bias &amp; Safety</text>
  <line x1="614.426192" y1="460.000076663746" x2="614.426192" y2="546.00004248707" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

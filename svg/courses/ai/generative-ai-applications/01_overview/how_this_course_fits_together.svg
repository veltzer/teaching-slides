<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 6.7879,0" fill="#555" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" x="40" y="40"/>
  <text x="640" y="80.9411" font-family="sans-serif" font-size="25.2808" font-weight="bold" fill="var(--text)" text-anchor="middle">Course Outline — 5-Day Schedule</text>
  <rect x="76.3636" y="108.2353" width="318.1818" height="136.4706" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="234.5455" y="142.353" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Day 1: FOUNDATIONS</text>
  <text x="234.5455" y="173.0589" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">How LLMs work</text>
  <text x="234.5455" y="202.0589" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">GPT architecture</text>
  <line x1="394.5454" y1="176.4706" x2="445.4545" y2="176.4706" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="449.0909" y="108.2353" width="318.1818" height="136.4706" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="607.2727" y="142.353" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Day 2: APIs &amp; PROMPTS</text>
  <text x="607.2727" y="173.0589" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">OpenAI API</text>
  <text x="607.2727" y="202.0589" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">Prompt Engineering</text>
  <text x="607.2727" y="231.0589" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">Fine-tuning</text>
  <line x1="767.2727" y1="176.4706" x2="818.1818" y2="176.4706" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="821.8182" y="108.2353" width="363.6364" height="136.4706" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1003.6363" y="142.353" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Day 4: OPEN SOURCE</text>
  <text x="1003.6363" y="173.0589" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">HuggingFace</text>
  <text x="1003.6363" y="202.0589" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">LoRA / QLoRA</text>
  <text x="1003.6363" y="231.0589" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">Local models</text>
  <rect x="449.0909" y="330" width="318.1818" height="136.4706" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2" />
  <text x="607.2727" y="364.1176" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Day 3: AGENTS</text>
  <text x="607.2727" y="394.8235" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">LangChain</text>
  <text x="607.2727" y="423.8235" font-family="sans-serif" font-size="20.2246" fill="var(--text)" text-anchor="middle">Memory &amp; Custom DB</text>
  <line x1="607.2727" y1="244.7058" x2="607.2727" y2="326.5882" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="1003.6363" y1="244.7058" x2="767.2727" y2="394.8235" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="449.0909" y="543.2353" width="363.6364" height="59.7058" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" />
  <text x="630.909" y="580.7647" font-family="sans-serif" font-size="20.2246" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Day 5: IMAGES &amp; SAFETY — Diffusion · DreamBooth · Bias &amp; Safety</text>
  <line x1="607.2727" y1="466.4706" x2="607.2727" y2="539.8235" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
</svg>
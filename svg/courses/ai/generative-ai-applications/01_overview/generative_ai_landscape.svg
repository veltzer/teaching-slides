<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Column: Text -->
  <rect x="40" y="40" width="223.728813559322" height="580" rx="8.360971118323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.864406779661" y="82.962962962963" text-anchor="middle" font-size="18.812185016227" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Text / LLMs</text>
  <text x="151.864406779661" y="147.407407407407" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">GPT-4o</text>
  <text x="151.864406779661" y="190.37037037037" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Claude 3.5</text>
  <text x="151.864406779661" y="233.333333333333" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Gemini 1.5</text>
  <text x="151.864406779661" y="276.296296296296" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Llama 3</text>
  <text x="151.864406779661" y="319.259259259259" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Mistral</text>

  <!-- Column: Image -->
  <rect x="278.983050847458" y="40" width="223.728813559322" height="580" rx="8.360971118323" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390.847457627119" y="82.962962962963" text-anchor="middle" font-size="18.812185016227" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Image</text>
  <text x="390.847457627119" y="147.407407407407" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">DALL-E 3</text>
  <text x="390.847457627119" y="190.37037037037" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Stable Diffusion</text>
  <text x="390.847457627119" y="233.333333333333" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Midjourney</text>
  <text x="390.847457627119" y="276.296296296296" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Imagen 3</text>
  <text x="390.847457627119" y="319.259259259259" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">FLUX</text>

  <!-- Column: Audio -->
  <rect x="517.966101694915" y="40" width="223.728813559322" height="580" rx="8.360971118323" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.830508474576" y="82.962962962963" text-anchor="middle" font-size="18.812185016227" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Audio</text>
  <text x="629.830508474576" y="147.407407407407" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Whisper</text>
  <text x="629.830508474576" y="190.37037037037" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">TTS-1-HD</text>
  <text x="629.830508474576" y="233.333333333333" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">MusicGen</text>
  <text x="629.830508474576" y="276.296296296296" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">AudioCraft</text>

  <!-- Column: Video -->
  <rect x="756.949152542373" y="40" width="223.728813559322" height="580" rx="8.360971118323" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="868.813559322034" y="82.962962962963" text-anchor="middle" font-size="18.812185016227" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Video</text>
  <text x="868.813559322034" y="147.407407407407" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Sora</text>
  <text x="868.813559322034" y="190.37037037037" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Runway Gen-3</text>
  <text x="868.813559322034" y="233.333333333333" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Lumiere</text>

  <!-- Column: Code -->
  <rect x="995.932203389831" y="40" width="244.067796610169" height="580" rx="8.360971118323" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1117.966101694915" y="82.962962962963" text-anchor="middle" font-size="18.812185016227" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Code</text>
  <text x="1117.966101694915" y="147.407407407407" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Copilot</text>
  <text x="1117.966101694915" y="190.37037037037" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Codex</text>
  <text x="1117.966101694915" y="233.333333333333" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">DeepSeek Coder</text>
  <text x="1117.966101694915" y="276.296296296296" text-anchor="middle" font-size="15.676820846856" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">StarCoder 2</text>
</svg>

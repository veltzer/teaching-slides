<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.7273 7.7241,0" fill="#555" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" x="40" y="40"/>
  <text x="640" y="103.2727" font-family="sans-serif" font-size="28.7677" font-weight="bold" fill="var(--text)" text-anchor="middle">Generative AI — How It Works</text>
  <rect x="81.3793" y="171.8182" width="310.3448" height="131.8182" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="236.5518" y="229.8182" font-family="sans-serif" font-size="23.0143" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Input Prompt</text>
  <text x="236.5518" y="274.6364" font-family="sans-serif" font-size="21.0964" fill="var(--text-muted)" text-anchor="middle">"Write a poem about coding"</text>
  <line x1="391.7241" y1="237.7273" x2="470.3449" y2="237.7273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="474.4827" y="140.1818" width="331.0344" height="195.0909" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="203.4545" font-family="sans-serif" font-size="24.9322" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Generative Model</text>
  <text x="640" y="250.9091" font-family="sans-serif" font-size="21.0964" fill="var(--text-muted)" text-anchor="middle">trained on vast</text>
  <text x="640" y="293.0909" font-family="sans-serif" font-size="21.0964" fill="var(--text-muted)" text-anchor="middle">text corpora</text>
  <line x1="805.5172" y1="237.7273" x2="884.1379" y2="237.7273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="888.2759" y="140.1818" width="310.3448" height="303.1818" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1043.4482" y="203.4545" font-family="sans-serif" font-size="23.0143" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Output</text>
  <text x="1043.4482" y="256.1818" font-family="sans-serif" font-size="21.0964" fill="var(--text)" text-anchor="middle" font-style="italic">"In silicon dreams,</text>
  <text x="1043.4482" y="298.3636" font-family="sans-serif" font-size="21.0964" fill="var(--text)" text-anchor="middle" font-style="italic">where logic streams,</text>
  <text x="1043.4482" y="340.5455" font-family="sans-serif" font-size="21.0964" fill="var(--text)" text-anchor="middle" font-style="italic">the coder writes</text>
  <text x="1043.4482" y="382.7273" font-family="sans-serif" font-size="21.0964" fill="var(--text)" text-anchor="middle" font-style="italic">through endless nights..."</text>
</svg>
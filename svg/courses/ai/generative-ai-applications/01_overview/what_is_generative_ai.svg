<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" font-size="38.934871" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Generative AI — How It Works</text>
  <rect x="40" y="156.899305" width="333.333298" height="224.806238" fill="url(#grad-primary)" rx="8.120539" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.666756" y="255.814036" font-size="31.148087" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Input Prompt</text>
  <text x="206.666756" y="332.248178" font-size="28.552356" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">"Write a poem about coding"</text>
  <line x1="373.333298" y1="269.302424" x2="457.777859" y2="269.302424" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="462.222163" y="102.945754" width="355.55546" height="332.713172" fill="url(#grad-warn)" rx="8.120539" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="210.852686" font-size="33.743817" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Generative Model</text>
  <text x="640" y="291.783015" font-size="28.552356" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">trained on vast</text>
  <text x="640" y="363.72097" font-size="28.552356" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">text corpora</text>
  <line x1="817.77773" y1="269.302424" x2="902.222184" y2="269.302424" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="906.666702" y="102.945754" width="333.333298" height="517.054246" fill="url(#grad-ok)" rx="8.120539" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1073.333244" y="210.852686" font-size="31.148087" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Output</text>
  <text x="1073.333244" y="300.775216" font-size="28.552356" fill="var(--text)" text-anchor="middle" font-style="italic" font-family="Arial, sans-serif">"In silicon dreams,</text>
  <text x="1073.333244" y="372.713172" font-size="28.552356" fill="var(--text)" text-anchor="middle" font-style="italic" font-family="Arial, sans-serif">where logic streams,</text>
  <text x="1073.333244" y="444.651297" font-size="28.552356" fill="var(--text)" text-anchor="middle" font-style="italic" font-family="Arial, sans-serif">the coder writes</text>
  <text x="1073.333244" y="516.589252" font-size="28.552356" fill="var(--text)" text-anchor="middle" font-style="italic" font-family="Arial, sans-serif">through endless nights..."</text>
</svg>

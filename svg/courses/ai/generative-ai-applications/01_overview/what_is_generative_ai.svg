<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.7273 7.7241,0" fill="#555" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="69.8182" font-family="sans-serif" font-size="29.4252" font-weight="bold" fill="var(--text)" text-anchor="middle">Generative AI — How It Works</text>
  <rect x="39.2337" y="145.4546" width="294.2529" height="145.4546" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="186.3602" y="209.4546" font-family="sans-serif" font-size="23.5403" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Input Prompt</text>
  <text x="186.3602" y="258.9091" font-family="sans-serif" font-size="21.5786" fill="var(--text-muted)" text-anchor="middle">"Write a poem about coding"</text>
  <line x1="333.4866" y1="218.1818" x2="408.0307" y2="218.1818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="411.954" y="110.5454" width="313.8697" height="215.2727" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="568.8889" y="180.3636" font-family="sans-serif" font-size="25.502" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Generative Model</text>
  <text x="568.8889" y="232.7273" font-family="sans-serif" font-size="21.5786" fill="var(--text-muted)" text-anchor="middle">trained on vast</text>
  <text x="568.8889" y="279.2727" font-family="sans-serif" font-size="21.5786" fill="var(--text-muted)" text-anchor="middle">text corpora</text>
  <line x1="725.8237" y1="218.1818" x2="800.3678" y2="218.1818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="804.2912" y="110.5454" width="294.2529" height="334.5454" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="951.4176" y="180.3636" font-family="sans-serif" font-size="23.5403" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Output</text>
  <text x="951.4176" y="238.5454" font-family="sans-serif" font-size="21.5786" fill="var(--text)" text-anchor="middle" font-style="italic">"In silicon dreams,</text>
  <text x="951.4176" y="285.0909" font-family="sans-serif" font-size="21.5786" fill="var(--text)" text-anchor="middle" font-style="italic">where logic streams,</text>
  <text x="951.4176" y="331.6364" font-family="sans-serif" font-size="21.5786" fill="var(--text)" text-anchor="middle" font-style="italic">the coder writes</text>
  <text x="951.4176" y="378.1818" font-family="sans-serif" font-size="21.5786" fill="var(--text)" text-anchor="middle" font-style="italic">through endless nights..."</text>
</svg>
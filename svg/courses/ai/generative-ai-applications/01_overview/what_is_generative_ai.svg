<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.7273 7.7241,0" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="40" font-family="sans-serif" font-size="38.934871" font-weight="bold" fill="var(--text)" text-anchor="middle">Generative AI — How It Works</text>
  <rect x="40" y="156.899305" width="333.333298" height="224.806238" fill="var(--primary-fill)" rx="8.120539" stroke="var(--primary-border)" stroke-width="2" />
  <text x="206.666756" y="255.814036" font-family="sans-serif" font-size="31.148087" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Input Prompt</text>
  <text x="206.666756" y="332.248178" font-family="sans-serif" font-size="28.552356" fill="var(--text-muted)" text-anchor="middle">"Write a poem about coding"</text>
  <line x1="373.333298" y1="269.302424" x2="457.777859" y2="269.302424" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="462.222163" y="102.945754" width="355.55546" height="332.713172" fill="var(--warn-fill)" rx="8.120539" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="210.852686" font-family="sans-serif" font-size="33.743817" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Generative Model</text>
  <text x="640" y="291.783015" font-family="sans-serif" font-size="28.552356" fill="var(--text-muted)" text-anchor="middle">trained on vast</text>
  <text x="640" y="363.72097" font-family="sans-serif" font-size="28.552356" fill="var(--text-muted)" text-anchor="middle">text corpora</text>
  <line x1="817.77773" y1="269.302424" x2="902.222184" y2="269.302424" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="906.666702" y="102.945754" width="333.333298" height="517.054246" fill="var(--ok-fill)" rx="8.120539" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1073.333244" y="210.852686" font-family="sans-serif" font-size="31.148087" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Output</text>
  <text x="1073.333244" y="300.775216" font-family="sans-serif" font-size="28.552356" fill="var(--text)" text-anchor="middle" font-style="italic">"In silicon dreams,</text>
  <text x="1073.333244" y="372.713172" font-family="sans-serif" font-size="28.552356" fill="var(--text)" text-anchor="middle" font-style="italic">where logic streams,</text>
  <text x="1073.333244" y="444.651297" font-family="sans-serif" font-size="28.552356" fill="var(--text)" text-anchor="middle" font-style="italic">the coder writes</text>
  <text x="1073.333244" y="516.589252" font-family="sans-serif" font-size="28.552356" fill="var(--text)" text-anchor="middle" font-style="italic">through endless nights..."</text>
</svg>
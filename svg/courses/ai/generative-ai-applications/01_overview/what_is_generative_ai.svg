  <ns0:text x="568.8889" y="232.7273" font-family="sans-serif" font-size="21.5786" fill="#555" text-anchor="middle">trained on vast</ns0:text>
  <ns0:text x="568.8889" y="279.2727" font-family="sans-serif" font-size="21.5786" fill="#555" text-anchor="middle">text corpora</ns0:text>

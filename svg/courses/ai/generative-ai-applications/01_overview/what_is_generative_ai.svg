  <ns0:text x="951.4176" y="180.3636" font-family="sans-serif" font-size="23.5403" font-weight="bold" fill="#2e7d32" text-anchor="middle">Output</ns0:text>
  <ns0:text x="951.4176" y="238.5454" font-family="sans-serif" font-size="21.5786" fill="#333" text-anchor="middle" font-style="italic">"In silicon dreams,</ns0:text>
  <ns0:text x="951.4176" y="285.0909" font-family="sans-serif" font-size="21.5786" fill="#333" text-anchor="middle" font-style="italic">where logic streams,</ns0:text>

  <ns0:text x="284.4444" y="53.3333" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)" text-anchor="middle">Standard Prompting</ns0:text>
  <ns0:rect x="44.4444" y="84.4444" width="480" height="71.1111" rx="7.1111" fill="var(--bg)" stroke="var(--warn-tint)" stroke-width="0.8889" />
  <ns0:text x="62.2222" y="104" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-dk)">Prompt:</ns0:text>
  <ns0:text x="62.2222" y="124.4444" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">Q: Roger has 5 tennis balls. He buys 2 cans</ns0:text>
  <ns0:text x="62.2222" y="140.4444" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">   of 3 balls each. How many balls does he have?</ns0:text>
  <ns0:line x1="284.4444" y1="155.5556" x2="284.4444" y2="191.1111" stroke="var(--danger-dk)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="293.3333" y="177.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-dk)">direct answer</ns0:text>
  <ns0:rect x="44.4444" y="193.7778" width="480" height="53.3333" rx="7.1111" fill="var(--bg)" stroke="var(--warn-tint)" stroke-width="0.8889" />
  <ns0:text x="62.2222" y="213.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-dk)">Model Output:</ns0:text>
  <ns0:text x="62.2222" y="232.8889" font-family="monospace" font-size="12.4444" fill="var(--danger-dk)">A: 11</ns0:text>
  <ns0:rect x="44.4444" y="262.2222" width="480" height="39.1111" rx="5.3333" fill="var(--danger-lt)" />
  <ns0:text x="284.4444" y="275.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--danger-dk)" text-anchor="middle" font-weight="bold">No reasoning shown.</ns0:text>
  <ns0:text x="284.4444" y="291.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-dk)" text-anchor="middle">Hard to verify. Hard to debug. Often wrong.</ns0:text>
  <ns0:rect x="44.4444" y="318.2222" width="480" height="71.1111" rx="7.1111" fill="var(--bg)" stroke="var(--warn-tint)" stroke-width="0.8889" />
  <ns0:text x="62.2222" y="337.7778" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-dk)">Harder Prompt:</ns0:text>
  <ns0:text x="62.2222" y="355.5556" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">Q: If a shirt costs $15 and is 30% off, and</ns0:text>
  <ns0:text x="62.2222" y="371.5556" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">   there is 8% tax — what is the final price?</ns0:text>
  <ns0:line x1="284.4444" y1="389.3333" x2="284.4444" y2="417.7778" stroke="var(--danger-dk)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="44.4444" y="420.4444" width="480" height="39.1111" rx="7.1111" fill="var(--bg)" stroke="var(--warn-tint)" stroke-width="0.8889" />
  <ns0:text x="62.2222" y="436.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-dk)">Model Output (often wrong):</ns0:text>
  <ns0:text x="62.2222" y="452.4444" font-family="monospace" font-size="12.4444" fill="var(--danger-dk)">A: $11.34  ✗</ns0:text>
  <ns0:rect x="44.4444" y="475.5556" width="480" height="88.8889" rx="7.1111" fill="var(--bg)" stroke="var(--warn-tint)" stroke-width="0.8889" />
  <ns0:text x="284.4444" y="496" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Problems with Standard Prompting:</ns0:text>
  <ns0:text x="62.2222" y="513.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Model skips intermediate steps (shortcuts)</ns0:text>
  <ns0:text x="62.2222" y="529.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Errors accumulate invisibly</ns0:text>
  <ns0:text x="62.2222" y="545.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• No transparency into model reasoning</ns0:text>
  <ns0:rect x="586.6667" y="26.6667" width="524.4444" height="568.8889" rx="8.8889" fill="var(--ok-pale)" filter="url(#shadow)" stroke="var(--ok-dk)" stroke-width="1.7778" />
  <ns0:rect x="586.6667" y="26.6667" width="524.4444" height="39.1111" rx="8.8889" fill="var(--ok-dk)" />
  <ns0:rect x="586.6667" y="55.1111" width="524.4444" height="10.6667" fill="var(--ok-dk)" />
  <ns0:text x="848.8889" y="53.3333" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)" text-anchor="middle">Chain-of-Thought Prompting</ns0:text>
  <ns0:rect x="604.4444" y="84.4444" width="488.8889" height="71.1111" rx="7.1111" fill="var(--bg)" stroke="var(--ok-tint)" stroke-width="0.8889" />
  <ns0:text x="622.2222" y="104" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-dk)">Prompt:</ns0:text>
  <ns0:text x="622.2222" y="124.4444" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">Q: Roger has 5 tennis balls. He buys 2 cans</ns0:text>
  <ns0:text x="622.2222" y="140.4444" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">   of 3 balls each. How many balls does he have?</ns0:text>
  <ns0:line x1="848.8889" y1="155.5556" x2="848.8889" y2="182.2222" stroke="var(--ok-dk)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="866.6667" y="173.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--ok-dk)">step-by-step reasoning</ns0:text>
  <ns0:rect x="604.4444" y="184.8889" width="488.8889" height="35.5556" rx="5.3333" fill="var(--bg)" stroke="var(--ok-tint)" stroke-width="0.8889" />

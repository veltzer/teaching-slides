  <ns0:text x="643.5556" y="206.2222" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">Roger starts with 5 tennis balls.</ns0:text>
  <ns0:line x1="848.8889" y1="220.4444" x2="848.8889" y2="231.1111" stroke="var(--ok-dk)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <ns0:rect x="604.4444" y="233.7778" width="488.8889" height="35.5556" rx="5.3333" fill="var(--bg)" stroke="var(--ok-tint)" stroke-width="0.8889" />
  <ns0:circle cx="625.7778" cy="251.5556" r="10.6667" fill="var(--ok-dk)" />
  <ns0:text x="625.7778" y="256" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="var(--bg)" text-anchor="middle">2</ns0:text>
  <ns0:text x="643.5556" y="255.1111" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">2 cans × 3 balls = 6 new balls.</ns0:text>
  <ns0:line x1="848.8889" y1="269.3333" x2="848.8889" y2="280" stroke="var(--ok-dk)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <ns0:rect x="604.4444" y="282.6667" width="488.8889" height="35.5556" rx="5.3333" fill="var(--bg)" stroke="var(--ok-tint)" stroke-width="0.8889" />
  <ns0:circle cx="625.7778" cy="300.4444" r="10.6667" fill="var(--ok-dk)" />
  <ns0:text x="625.7778" y="304.8889" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="var(--bg)" text-anchor="middle">3</ns0:text>
  <ns0:text x="643.5556" y="304" font-family="monospace" font-size="10.6667" fill="var(--text-dark)">Total = 5 + 6 = 11 balls.</ns0:text>
  <ns0:line x1="848.8889" y1="318.2222" x2="848.8889" y2="333.3333" stroke="var(--ok-dk)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="604.4444" y="336" width="488.8889" height="39.1111" rx="7.1111" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="1.7778" />
  <ns0:text x="622.2222" y="352" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-dk)">Model Output:</ns0:text>
  <ns0:text x="622.2222" y="368" font-family="monospace" font-size="12.4444" fill="var(--ok-deep)">A: 11 balls  ✓  (reasoning shown)</ns0:text>
  <ns0:rect x="604.4444" y="391.1111" width="488.8889" height="106.6667" rx="7.1111" fill="var(--bg)" stroke="var(--ok-tint)" stroke-width="0.8889" />
  <ns0:text x="848.8889" y="410.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Benefits of Chain-of-Thought:</ns0:text>
  <ns0:text x="622.2222" y="428.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Each step can be verified independently</ns0:text>
  <ns0:text x="622.2222" y="444.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Errors are visible and debuggable</ns0:text>
  <ns0:text x="622.2222" y="460.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Dramatically better on multi-step math/logic</ns0:text>
  <ns0:text x="622.2222" y="476.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Zero-shot trigger: "Let's think step by step"</ns0:text>
  <ns0:rect x="604.4444" y="513.7778" width="488.8889" height="51.5556" rx="7.1111" fill="var(--ok-pale)" stroke="var(--ok-light)" stroke-width="1.7778" />
  <ns0:text x="622.2222" y="533.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-deep)">Zero-Shot CoT (no examples needed):</ns0:text>
  <ns0:text x="622.2222" y="552.8889" font-family="monospace" font-size="11.5556" fill="var(--ok-deep)">Append: "Let's think step by step."</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="570.491853" height="580" rx="6.518574" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="40" y="40" width="570.491853" height="39.874947" rx="6.518574" fill="var(--danger-accent)" />
  <rect x="40" y="68.99991" width="570.491853" height="10.875037" fill="var(--danger-accent)" rx="6.518574"/>
  <text x="325.245822" y="67.187423" font-family="Arial,sans-serif" font-size="18.882787" font-weight="bold" fill="var(--bg)" text-anchor="middle">Standard Prompting</text>
  <rect x="59.672133" y="98.90612" width="531.147587" height="72.499944" rx="6.518574" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="79.344266" y="118.843706" font-family="Arial,sans-serif" font-size="12.273822" font-weight="bold" fill="var(--danger-accent)">Prompt:</text>
  <text x="79.344266" y="139.687366" font-family="monospace" font-size="11.329716" fill="var(--text)">Q: Roger has 5 tennis balls. He buys 2 cans</text>
  <text x="79.344266" y="155.999865" font-family="monospace" font-size="11.329716" fill="var(--text)">   of 3 balls each. How many balls does he have?</text>
  <line x1="325.245822" y1="171.406289" x2="325.245822" y2="207.656148" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="335.081993" y="194.062437" font-family="Arial,sans-serif" font-size="11.329716" fill="var(--danger-accent)">direct answer</text>
  <rect x="59.672133" y="210.374935" width="531.147587" height="54.374958" rx="6.518574" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="79.344266" y="230.312409" font-family="Arial,sans-serif" font-size="12.273822" font-weight="bold" fill="var(--danger-accent)">Model Output:</text>
  <text x="79.344266" y="250.249994" font-family="monospace" font-size="13.217821" fill="var(--danger-accent)">A: 11</text>
  <rect x="59.672133" y="280.156204" width="531.147587" height="39.874947" rx="6.518574" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.245822" y="293.750028" font-family="Arial,sans-serif" font-size="12.273822" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">No reasoning shown.</text>
  <text x="325.245822" y="310.062527" font-family="Arial,sans-serif" font-size="11.329716" fill="var(--danger-accent)" text-anchor="middle">Hard to verify. Hard to debug. Often wrong.</text>
  <rect x="59.672133" y="337.249949" width="531.147587" height="72.499944" rx="6.518574" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="79.344266" y="357.187423" font-family="Arial,sans-serif" font-size="12.273822" font-weight="bold" fill="var(--danger-accent)">Harder Prompt:</text>
  <text x="79.344266" y="375.312521" font-family="monospace" font-size="11.329716" fill="var(--text)">Q: If a shirt costs $15 and is 30% off, and</text>
  <text x="79.344266" y="391.62502" font-family="monospace" font-size="11.329716" fill="var(--text)">   there is 8% tax — what is the final price?</text>
  <line x1="325.245822" y1="409.749893" x2="325.245822" y2="438.749916" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="59.672133" y="441.46859" width="531.147587" height="39.874947" rx="6.518574" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="79.344266" y="457.781089" font-family="Arial,sans-serif" font-size="12.273822" font-weight="bold" fill="var(--danger-accent)">Model Output (often wrong):</text>
  <text x="79.344266" y="474.093588" font-family="monospace" font-size="13.217821" fill="var(--danger-accent)">A: $11.34  ✗</text>
  <rect x="59.672133" y="497.656261" width="531.147587" height="90.625042" rx="6.518574" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="325.245822" y="518.499921" font-family="Arial,sans-serif" font-size="13.217821" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Problems with Standard Prompting:</text>
  <text x="79.344266" y="536.624907" font-family="Arial,sans-serif" font-size="11.329716" fill="var(--text-muted)">• Model skips intermediate steps (shortcuts)</text>
  <text x="79.344266" y="552.937406" font-family="Arial,sans-serif" font-size="11.329716" fill="var(--text-muted)">• Errors accumulate invisibly</text>
  <text x="79.344266" y="569.249904" font-family="Arial,sans-serif" font-size="11.329716" fill="var(--text-muted)">• No transparency into model reasoning</text>
  <rect x="659.672185" y="40" width="580.327815" height="580" rx="6.518574" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="659.672185" y="40" width="580.327815" height="39.874947" rx="6.518574" fill="var(--ok-accent)" />
  <rect x="659.672185" y="68.99991" width="580.327815" height="10.875037" fill="var(--ok-accent)" rx="6.518574"/>
  <text x="949.836145" y="67.187423" font-family="Arial,sans-serif" font-size="18.882787" font-weight="bold" fill="var(--bg)" text-anchor="middle">Chain-of-Thought Prompting</text>
  <rect x="679.344213" y="98.90612" width="540.983654" height="72.499944" rx="6.518574" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="699.016451" y="118.843706" font-family="Arial,sans-serif" font-size="12.273822" font-weight="bold" fill="var(--ok-accent)">Prompt:</text>
  <text x="699.016451" y="139.687366" font-family="monospace" font-size="11.329716" fill="var(--text)">Q: Roger has 5 tennis balls. He buys 2 cans</text>
  <text x="699.016451" y="155.999865" font-family="monospace" font-size="11.329716" fill="var(--text)">   of 3 balls each. How many balls does he have?</text>
  <line x1="949.836145" y1="171.406289" x2="949.836145" y2="198.593711" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="969.508278" y="189.531162" font-family="Arial,sans-serif" font-size="11.329716" fill="var(--ok-accent)">step-by-step reasoning</text>
  <rect x="679.344213" y="201.312499" width="540.983654" height="36.250084" rx="6.518574" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <rect x="691.621" y="208.108" width="22.6594" height="22.6594" rx="11.3297" fill="var(--ok-accent)"/>
  <text x="702.950878" y="223.968647" font-family="Arial,sans-serif" font-size="11.329716" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</text>
  <text x="722.623011" y="223.062459" font-family="monospace" font-size="11.329716" fill="var(--text)">Roger starts with 5 tennis balls.</text>
  <line x1="949.836145" y1="237.562358" x2="949.836145" y2="248.437395" stroke="var(--ok-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="679.344213" y="251.156182" width="540.983654" height="36.250084" rx="6.518574" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <rect x="691.621" y="257.952" width="22.6594" height="22.6594" rx="11.3297" fill="var(--ok-accent)"/>
  <text x="702.950878" y="273.812442" font-family="Arial,sans-serif" font-size="11.329716" font-weight="bold" fill="var(--bg)" text-anchor="middle">2</text>
  <text x="722.623011" y="272.906142" font-family="monospace" font-size="11.329716" fill="var(--text)">2 cans × 3 balls = 6 new balls.</text>
  <line x1="949.836145" y1="287.406154" x2="949.836145" y2="298.28119" stroke="var(--ok-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="679.344213" y="300.999978" width="540.983654" height="36.250084" rx="6.518574" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <rect x="691.621" y="307.795" width="22.6594" height="22.6594" rx="11.3297" fill="var(--ok-accent)"/>
  <text x="702.950878" y="323.656238" font-family="Arial,sans-serif" font-size="11.329716" font-weight="bold" fill="var(--bg)" text-anchor="middle">3</text>
  <text x="722.623011" y="322.749938" font-family="monospace" font-size="11.329716" fill="var(--text)">Total = 5 + 6 = 11 balls.</text>
  <line x1="949.836145" y1="337.249949" x2="949.836145" y2="352.656148" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="679.344213" y="355.374935" width="540.983654" height="39.874947" rx="6.518574" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="699.016451" y="371.687434" font-family="Arial,sans-serif" font-size="12.273822" font-weight="bold" fill="var(--ok-accent)">Model Output:</text>
  <text x="699.016451" y="387.999933" font-family="monospace" font-size="13.217821" fill="var(--ok-accent)">A: 11 balls  ✓  (reasoning shown)</text>
  <rect x="679.344213" y="411.56238" width="540.983654" height="108.750028" rx="6.518574" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="949.836145" y="431.499966" font-family="Arial,sans-serif" font-size="13.217821" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Benefits of Chain-of-Thought:</text>
  <text x="699.016451" y="449.62484" font-family="Arial,sans-serif" font-size="11.329716" fill="var(--text-muted)">• Each step can be verified independently</text>
  <text x="699.016451" y="465.937338" font-family="Arial,sans-serif" font-size="11.329716" fill="var(--text-muted)">• Errors are visible and debuggable</text>
  <text x="699.016451" y="482.249837" font-family="Arial,sans-serif" font-size="11.329716" fill="var(--text-muted)">• Dramatically better on multi-step math/logic</text>
  <text x="699.016451" y="498.562335" font-family="Arial,sans-serif" font-size="11.329716" fill="var(--text-muted)">• Zero-shot trigger: "Let's think step by step"</text>
  <rect x="679.344213" y="536.624907" width="540.983654" height="52.562583" rx="6.518574" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="699.016451" y="556.56238" font-family="Arial,sans-serif" font-size="12.273822" font-weight="bold" fill="var(--ok-accent)">Zero-Shot CoT (no examples needed):</text>
  <text x="699.016451" y="576.499966" font-family="monospace" font-size="12.273822" fill="var(--ok-accent)">Append: "Let's think step by step."</text>
</svg>
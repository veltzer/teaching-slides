  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:rect x="26.6667" y="26.6667" width="515.5556" height="568.8889" rx="8.8889" fill="var(--danger-pale3)" filter="url(#shadow)" stroke="var(--danger-dk)" stroke-width="1.7778" />
  <ns0:rect x="26.6667" y="26.6667" width="515.5556" height="39.1111" rx="8.8889" fill="var(--danger-dk)" />

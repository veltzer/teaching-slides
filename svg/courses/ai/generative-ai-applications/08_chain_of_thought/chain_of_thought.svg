<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-3.5556%" y="-7.1111%" width="96%" height="110.2222%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="26.6667" width="515.5556" height="568.8889" rx="8.8889" fill="#fce4ec" filter="url(#shadow)" stroke="#c62828" stroke-width="1.7778" />
  <ns0:rect x="26.6667" y="26.6667" width="515.5556" height="39.1111" rx="8.8889" fill="#c62828" />
  <ns0:rect x="26.6667" y="55.1111" width="515.5556" height="10.6667" fill="#c62828" />
  <ns0:text x="284.4444" y="53.3333" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#fff" text-anchor="middle">Standard Prompting</ns0:text>
  <ns0:rect x="44.4444" y="84.4444" width="480" height="71.1111" rx="7.1111" fill="#fff" stroke="#ef9a9a" stroke-width="0.8889" />
  <ns0:text x="62.2222" y="104" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#c62828">Prompt:</ns0:text>
  <ns0:text x="62.2222" y="124.4444" font-family="monospace" font-size="10.6667" fill="#333">Q: Roger has 5 tennis balls. He buys 2 cans</ns0:text>
  <ns0:text x="62.2222" y="140.4444" font-family="monospace" font-size="10.6667" fill="#333">   of 3 balls each. How many balls does he have?</ns0:text>
  <ns0:line x1="284.4444" y1="155.5556" x2="284.4444" y2="191.1111" stroke="#c62828" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="293.3333" y="177.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#c62828">direct answer</ns0:text>
  <ns0:rect x="44.4444" y="193.7778" width="480" height="53.3333" rx="7.1111" fill="#fff" stroke="#ef9a9a" stroke-width="0.8889" />
  <ns0:text x="62.2222" y="213.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#c62828">Model Output:</ns0:text>
  <ns0:text x="62.2222" y="232.8889" font-family="monospace" font-size="12.4444" fill="#c62828">A: 11</ns0:text>
  <ns0:rect x="44.4444" y="262.2222" width="480" height="39.1111" rx="5.3333" fill="#ffcdd2" />
  <ns0:text x="284.4444" y="275.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="#c62828" text-anchor="middle" font-weight="bold">No reasoning shown.</ns0:text>
  <ns0:text x="284.4444" y="291.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#c62828" text-anchor="middle">Hard to verify. Hard to debug. Often wrong.</ns0:text>
  <ns0:rect x="44.4444" y="318.2222" width="480" height="71.1111" rx="7.1111" fill="#fff" stroke="#ef9a9a" stroke-width="0.8889" />
  <ns0:text x="62.2222" y="337.7778" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#c62828">Harder Prompt:</ns0:text>
  <ns0:text x="62.2222" y="355.5556" font-family="monospace" font-size="10.6667" fill="#333">Q: If a shirt costs $15 and is 30% off, and</ns0:text>
  <ns0:text x="62.2222" y="371.5556" font-family="monospace" font-size="10.6667" fill="#333">   there is 8% tax — what is the final price?</ns0:text>
  <ns0:line x1="284.4444" y1="389.3333" x2="284.4444" y2="417.7778" stroke="#c62828" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="44.4444" y="420.4444" width="480" height="39.1111" rx="7.1111" fill="#fff" stroke="#ef9a9a" stroke-width="0.8889" />
  <ns0:text x="62.2222" y="436.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#c62828">Model Output (often wrong):</ns0:text>
  <ns0:text x="62.2222" y="452.4444" font-family="monospace" font-size="12.4444" fill="#c62828">A: $11.34  ✗</ns0:text>
  <ns0:rect x="44.4444" y="475.5556" width="480" height="88.8889" rx="7.1111" fill="#fff" stroke="#ef9a9a" stroke-width="0.8889" />
  <ns0:text x="284.4444" y="496" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#c62828" text-anchor="middle">Problems with Standard Prompting:</ns0:text>
  <ns0:text x="62.2222" y="513.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Model skips intermediate steps (shortcuts)</ns0:text>
  <ns0:text x="62.2222" y="529.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Errors accumulate invisibly</ns0:text>
  <ns0:text x="62.2222" y="545.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• No transparency into model reasoning</ns0:text>
  <ns0:rect x="586.6667" y="26.6667" width="524.4444" height="568.8889" rx="8.8889" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="1.7778" />
  <ns0:rect x="586.6667" y="26.6667" width="524.4444" height="39.1111" rx="8.8889" fill="#2e7d32" />
  <ns0:rect x="586.6667" y="55.1111" width="524.4444" height="10.6667" fill="#2e7d32" />
  <ns0:text x="848.8889" y="53.3333" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#fff" text-anchor="middle">Chain-of-Thought Prompting</ns0:text>
  <ns0:rect x="604.4444" y="84.4444" width="488.8889" height="71.1111" rx="7.1111" fill="#fff" stroke="#a5d6a7" stroke-width="0.8889" />
  <ns0:text x="622.2222" y="104" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#2e7d32">Prompt:</ns0:text>
  <ns0:text x="622.2222" y="124.4444" font-family="monospace" font-size="10.6667" fill="#333">Q: Roger has 5 tennis balls. He buys 2 cans</ns0:text>
  <ns0:text x="622.2222" y="140.4444" font-family="monospace" font-size="10.6667" fill="#333">   of 3 balls each. How many balls does he have?</ns0:text>
  <ns0:line x1="848.8889" y1="155.5556" x2="848.8889" y2="182.2222" stroke="#2e7d32" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="866.6667" y="173.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#2e7d32">step-by-step reasoning</ns0:text>
  <ns0:rect x="604.4444" y="184.8889" width="488.8889" height="35.5556" rx="5.3333" fill="#fff" stroke="#a5d6a7" stroke-width="0.8889" />
  <ns0:circle cx="625.7778" cy="202.6667" r="10.6667" fill="#2e7d32" />
  <ns0:text x="625.7778" y="207.1111" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="#fff" text-anchor="middle">1</ns0:text>
  <ns0:text x="643.5556" y="206.2222" font-family="monospace" font-size="10.6667" fill="#333">Roger starts with 5 tennis balls.</ns0:text>
  <ns0:line x1="848.8889" y1="220.4444" x2="848.8889" y2="231.1111" stroke="#2e7d32" stroke-width="1.3333" marker-end="url(#arrow)" />
  <ns0:rect x="604.4444" y="233.7778" width="488.8889" height="35.5556" rx="5.3333" fill="#fff" stroke="#a5d6a7" stroke-width="0.8889" />
  <ns0:circle cx="625.7778" cy="251.5556" r="10.6667" fill="#2e7d32" />
  <ns0:text x="625.7778" y="256" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="#fff" text-anchor="middle">2</ns0:text>
  <ns0:text x="643.5556" y="255.1111" font-family="monospace" font-size="10.6667" fill="#333">2 cans × 3 balls = 6 new balls.</ns0:text>
  <ns0:line x1="848.8889" y1="269.3333" x2="848.8889" y2="280" stroke="#2e7d32" stroke-width="1.3333" marker-end="url(#arrow)" />
  <ns0:rect x="604.4444" y="282.6667" width="488.8889" height="35.5556" rx="5.3333" fill="#fff" stroke="#a5d6a7" stroke-width="0.8889" />
  <ns0:circle cx="625.7778" cy="300.4444" r="10.6667" fill="#2e7d32" />
  <ns0:text x="625.7778" y="304.8889" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="#fff" text-anchor="middle">3</ns0:text>
  <ns0:text x="643.5556" y="304" font-family="monospace" font-size="10.6667" fill="#333">Total = 5 + 6 = 11 balls.</ns0:text>
  <ns0:line x1="848.8889" y1="318.2222" x2="848.8889" y2="333.3333" stroke="#2e7d32" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="604.4444" y="336" width="488.8889" height="39.1111" rx="7.1111" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.7778" />
  <ns0:text x="622.2222" y="352" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#2e7d32">Model Output:</ns0:text>
  <ns0:text x="622.2222" y="368" font-family="monospace" font-size="12.4444" fill="#1b5e20">A: 11 balls  ✓  (reasoning shown)</ns0:text>
  <ns0:rect x="604.4444" y="391.1111" width="488.8889" height="106.6667" rx="7.1111" fill="#fff" stroke="#a5d6a7" stroke-width="0.8889" />
  <ns0:text x="848.8889" y="410.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32" text-anchor="middle">Benefits of Chain-of-Thought:</ns0:text>
  <ns0:text x="622.2222" y="428.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Each step can be verified independently</ns0:text>
  <ns0:text x="622.2222" y="444.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Errors are visible and debuggable</ns0:text>
  <ns0:text x="622.2222" y="460.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Dramatically better on multi-step math/logic</ns0:text>
  <ns0:text x="622.2222" y="476.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">• Zero-shot trigger: "Let's think step by step"</ns0:text>
  <ns0:rect x="604.4444" y="513.7778" width="488.8889" height="51.5556" rx="7.1111" fill="#f1f8e9" stroke="#8bc34a" stroke-width="1.7778" />
  <ns0:text x="622.2222" y="533.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#33691e">Zero-Shot CoT (no examples needed):</ns0:text>
  <ns0:text x="622.2222" y="552.8889" font-family="monospace" font-size="11.5556" fill="#33691e">Append: "Let's think step by step."</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="64.1667" width="543.75" height="515.5556" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="68.125" y="64.1667" width="543.75" height="35.4444" rx="6" fill="var(--danger-accent)" />
  <rect x="68.125" y="89.9444" width="543.75" height="9.6667" fill="var(--danger-accent)" rx="6"/>
  <text x="339.9999" y="88.3333" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)" text-anchor="middle">Standard Prompting</text>
  <rect x="86.875" y="116.5277" width="506.25" height="64.4444" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="105.625" y="134.25" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--danger-accent)">Prompt:</text>
  <text x="105.625" y="152.7777" font-family="monospace" font-size="10.4284" fill="var(--text)">Q: Roger has 5 tennis balls. He buys 2 cans</text>
  <text x="105.625" y="167.2777" font-family="monospace" font-size="10.4284" fill="var(--text)">   of 3 balls each. How many balls does he have?</text>
  <line x1="339.9999" y1="180.9723" x2="339.9999" y2="213.1944" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="349.375" y="201.1111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">direct answer</text>
  <rect x="86.875" y="215.6111" width="506.25" height="48.3333" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="105.625" y="233.3333" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--danger-accent)">Model Output:</text>
  <text x="105.625" y="251.0556" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">A: 11</text>
  <rect x="86.875" y="277.6389" width="506.25" height="35.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="339.9999" y="289.7223" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">No reasoning shown.</text>
  <text x="339.9999" y="304.2223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)" text-anchor="middle">Hard to verify. Hard to debug. Often wrong.</text>
  <rect x="86.875" y="328.3889" width="506.25" height="64.4444" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="105.625" y="346.1111" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--danger-accent)">Harder Prompt:</text>
  <text x="105.625" y="362.2223" font-family="monospace" font-size="10.4284" fill="var(--text)">Q: If a shirt costs $15 and is 30% off, and</text>
  <text x="105.625" y="376.7223" font-family="monospace" font-size="10.4284" fill="var(--text)">   there is 8% tax — what is the final price?</text>
  <line x1="339.9999" y1="392.8333" x2="339.9999" y2="418.6111" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="86.875" y="421.0277" width="506.25" height="35.4444" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="105.625" y="435.5277" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--danger-accent)">Model Output (often wrong):</text>
  <text x="105.625" y="450.0277" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">A: $11.34  ✗</text>
  <rect x="86.875" y="470.9723" width="506.25" height="80.5556" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="339.9999" y="489.5" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Problems with Standard Prompting:</text>
  <text x="105.625" y="505.6111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Model skips intermediate steps (shortcuts)</text>
  <text x="105.625" y="520.1111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Errors accumulate invisibly</text>
  <text x="105.625" y="534.6111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• No transparency into model reasoning</text>
  <rect x="658.75" y="64.1667" width="553.1249" height="515.5556" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="658.75" y="64.1667" width="553.1249" height="35.4444" rx="6" fill="var(--ok-accent)" />
  <rect x="658.75" y="89.9444" width="553.1249" height="9.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="935.3125" y="88.3333" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)" text-anchor="middle">Chain-of-Thought Prompting</text>
  <rect x="677.4999" y="116.5277" width="515.625" height="64.4444" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="696.25" y="134.25" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">Prompt:</text>
  <text x="696.25" y="152.7777" font-family="monospace" font-size="10.4284" fill="var(--text)">Q: Roger has 5 tennis balls. He buys 2 cans</text>
  <text x="696.25" y="167.2777" font-family="monospace" font-size="10.4284" fill="var(--text)">   of 3 balls each. How many balls does he have?</text>
  <line x1="935.3125" y1="180.9723" x2="935.3125" y2="205.1389" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="954.0625" y="197.0833" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--ok-accent)">step-by-step reasoning</text>
  <rect x="677.4999" y="207.5556" width="515.625" height="32.2223" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <circle cx="700" cy="223.6667" r="10.4284" fill="var(--ok-accent)" />
  <text x="700" y="227.6944" font-family="Arial,sans-serif" font-size="10.4284" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</text>
  <text x="718.75" y="226.8889" font-family="monospace" font-size="10.4284" fill="var(--text)">Roger starts with 5 tennis balls.</text>
  <line x1="935.3125" y1="239.7777" x2="935.3125" y2="249.4444" stroke="var(--ok-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="677.4999" y="251.8611" width="515.625" height="32.2223" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <circle cx="700" cy="267.9723" r="10.4284" fill="var(--ok-accent)" />
  <text x="700" y="272" font-family="Arial,sans-serif" font-size="10.4284" font-weight="bold" fill="var(--bg)" text-anchor="middle">2</text>
  <text x="718.75" y="271.1944" font-family="monospace" font-size="10.4284" fill="var(--text)">2 cans × 3 balls = 6 new balls.</text>
  <line x1="935.3125" y1="284.0833" x2="935.3125" y2="293.75" stroke="var(--ok-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="677.4999" y="296.1667" width="515.625" height="32.2223" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <circle cx="700" cy="312.2777" r="10.4284" fill="var(--ok-accent)" />
  <text x="700" y="316.3056" font-family="Arial,sans-serif" font-size="10.4284" font-weight="bold" fill="var(--bg)" text-anchor="middle">3</text>
  <text x="718.75" y="315.5" font-family="monospace" font-size="10.4284" fill="var(--text)">Total = 5 + 6 = 11 balls.</text>
  <line x1="935.3125" y1="328.3889" x2="935.3125" y2="342.0833" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="677.4999" y="344.5" width="515.625" height="35.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="696.25" y="359" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">Model Output:</text>
  <text x="696.25" y="373.5" font-family="monospace" font-size="12.1663" fill="var(--ok-accent)">A: 11 balls  ✓  (reasoning shown)</text>
  <rect x="677.4999" y="394.4444" width="515.625" height="96.6667" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="935.3125" y="412.1667" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Benefits of Chain-of-Thought:</text>
  <text x="696.25" y="428.2777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Each step can be verified independently</text>
  <text x="696.25" y="442.7777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Errors are visible and debuggable</text>
  <text x="696.25" y="457.2777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Dramatically better on multi-step math/logic</text>
  <text x="696.25" y="471.7777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">• Zero-shot trigger: "Let's think step by step"</text>
  <rect x="677.4999" y="505.6111" width="515.625" height="46.7223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="696.25" y="523.3333" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">Zero-Shot CoT (no examples needed):</text>
  <text x="696.25" y="541.0556" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">Append: "Let's think step by step."</text>
</svg>
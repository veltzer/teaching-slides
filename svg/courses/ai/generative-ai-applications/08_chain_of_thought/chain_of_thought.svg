<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="26.6667" width="515.5556" height="568.8889" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="26.6667" y="26.6667" width="515.5556" height="39.1111" rx="6" fill="var(--danger-accent)" />
  <rect x="26.6667" y="55.1111" width="515.5556" height="10.6667" fill="var(--danger-accent)" rx="6"/>
  <text x="284.4444" y="53.3333" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)" text-anchor="middle">Standard Prompting</text>
  <rect x="44.4444" y="84.4444" width="480" height="71.1111" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="62.2222" y="104" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-accent)">Prompt:</text>
  <text x="62.2222" y="124.4444" font-family="monospace" font-size="10.6667" fill="var(--text)">Q: Roger has 5 tennis balls. He buys 2 cans</text>
  <text x="62.2222" y="140.4444" font-family="monospace" font-size="10.6667" fill="var(--text)">   of 3 balls each. How many balls does he have?</text>
  <line x1="284.4444" y1="155.5556" x2="284.4444" y2="191.1111" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="293.3333" y="177.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-accent)">direct answer</text>
  <rect x="44.4444" y="193.7778" width="480" height="53.3333" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="62.2222" y="213.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-accent)">Model Output:</text>
  <text x="62.2222" y="232.8889" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">A: 11</text>
  <rect x="44.4444" y="262.2222" width="480" height="39.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="284.4444" y="275.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">No reasoning shown.</text>
  <text x="284.4444" y="291.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-accent)" text-anchor="middle">Hard to verify. Hard to debug. Often wrong.</text>
  <rect x="44.4444" y="318.2222" width="480" height="71.1111" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="62.2222" y="337.7778" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-accent)">Harder Prompt:</text>
  <text x="62.2222" y="355.5556" font-family="monospace" font-size="10.6667" fill="var(--text)">Q: If a shirt costs $15 and is 30% off, and</text>
  <text x="62.2222" y="371.5556" font-family="monospace" font-size="10.6667" fill="var(--text)">   there is 8% tax — what is the final price?</text>
  <line x1="284.4444" y1="389.3333" x2="284.4444" y2="417.7778" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="44.4444" y="420.4444" width="480" height="39.1111" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="62.2222" y="436.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--danger-accent)">Model Output (often wrong):</text>
  <text x="62.2222" y="452.4444" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">A: $11.34  ✗</text>
  <rect x="44.4444" y="475.5556" width="480" height="88.8889" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="284.4444" y="496" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Problems with Standard Prompting:</text>
  <text x="62.2222" y="513.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Model skips intermediate steps (shortcuts)</text>
  <text x="62.2222" y="529.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Errors accumulate invisibly</text>
  <text x="62.2222" y="545.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• No transparency into model reasoning</text>
  <rect x="586.6667" y="26.6667" width="524.4444" height="568.8889" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="586.6667" y="26.6667" width="524.4444" height="39.1111" rx="6" fill="var(--ok-accent)" />
  <rect x="586.6667" y="55.1111" width="524.4444" height="10.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="848.8889" y="53.3333" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)" text-anchor="middle">Chain-of-Thought Prompting</text>
  <rect x="604.4444" y="84.4444" width="488.8889" height="71.1111" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="622.2222" y="104" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)">Prompt:</text>
  <text x="622.2222" y="124.4444" font-family="monospace" font-size="10.6667" fill="var(--text)">Q: Roger has 5 tennis balls. He buys 2 cans</text>
  <text x="622.2222" y="140.4444" font-family="monospace" font-size="10.6667" fill="var(--text)">   of 3 balls each. How many balls does he have?</text>
  <line x1="848.8889" y1="155.5556" x2="848.8889" y2="182.2222" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="866.6667" y="173.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--ok-accent)">step-by-step reasoning</text>
  <rect x="604.4444" y="184.8889" width="488.8889" height="35.5556" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <circle cx="625.7778" cy="202.6667" r="10.6667" fill="var(--ok-accent)" />
  <text x="625.7778" y="207.1111" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</text>
  <text x="643.5556" y="206.2222" font-family="monospace" font-size="10.6667" fill="var(--text)">Roger starts with 5 tennis balls.</text>
  <line x1="848.8889" y1="220.4444" x2="848.8889" y2="231.1111" stroke="var(--ok-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="604.4444" y="233.7778" width="488.8889" height="35.5556" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <circle cx="625.7778" cy="251.5556" r="10.6667" fill="var(--ok-accent)" />
  <text x="625.7778" y="256" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="var(--bg)" text-anchor="middle">2</text>
  <text x="643.5556" y="255.1111" font-family="monospace" font-size="10.6667" fill="var(--text)">2 cans × 3 balls = 6 new balls.</text>
  <line x1="848.8889" y1="269.3333" x2="848.8889" y2="280" stroke="var(--ok-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="604.4444" y="282.6667" width="488.8889" height="35.5556" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <circle cx="625.7778" cy="300.4444" r="10.6667" fill="var(--ok-accent)" />
  <text x="625.7778" y="304.8889" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="var(--bg)" text-anchor="middle">3</text>
  <text x="643.5556" y="304" font-family="monospace" font-size="10.6667" fill="var(--text)">Total = 5 + 6 = 11 balls.</text>
  <line x1="848.8889" y1="318.2222" x2="848.8889" y2="333.3333" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="604.4444" y="336" width="488.8889" height="39.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="622.2222" y="352" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)">Model Output:</text>
  <text x="622.2222" y="368" font-family="monospace" font-size="12.4444" fill="var(--ok-accent)">A: 11 balls  ✓  (reasoning shown)</text>
  <rect x="604.4444" y="391.1111" width="488.8889" height="106.6667" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="0.8889" />
  <text x="848.8889" y="410.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Benefits of Chain-of-Thought:</text>
  <text x="622.2222" y="428.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Each step can be verified independently</text>
  <text x="622.2222" y="444.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Errors are visible and debuggable</text>
  <text x="622.2222" y="460.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Dramatically better on multi-step math/logic</text>
  <text x="622.2222" y="476.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">• Zero-shot trigger: "Let's think step by step"</text>
  <rect x="604.4444" y="513.7778" width="488.8889" height="51.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="622.2222" y="533.3333" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)">Zero-Shot CoT (no examples needed):</text>
  <text x="622.2222" y="552.8889" font-family="monospace" font-size="11.5556" fill="var(--ok-accent)">Append: "Let's think step by step."</text>
</svg>
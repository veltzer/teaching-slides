<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="590" height="580" rx="8.069870322226" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="75.614035087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--danger-text)">Standard Prompting</text>

  <rect x="60" y="101.052631578947" width="550" height="71.228070175439" rx="8.069870322226" fill="var(--bg)" stroke="var(--border)"/>
  <text x="80" y="126.491228070175" font-family="Arial, sans-serif" font-size="12.104805483339" font-weight="bold" fill="var(--text)">Prompt</text>
  <text x="80" y="151.929824561404" font-family="Courier New, monospace" font-size="11.096071693061" fill="var(--text)">Roger has 5 balls, buys 2 cans of 3.</text>

  <line x1="335" y1="177.368421052632" x2="335" y2="207.894736842105" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>

  <rect x="60" y="212.982456140351" width="550" height="61.052631578947" rx="8.069870322226" fill="var(--bg)" stroke="var(--border)"/>
  <text x="80" y="238.421052631579" font-family="Arial, sans-serif" font-size="12.104805483339" font-weight="bold" fill="var(--text)">Output</text>
  <text x="80" y="261.824561403509" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--text)">A: 11</text>

  <rect x="60" y="294.385964912281" width="550" height="71.228070175439" rx="8.069870322226" fill="var(--bg)" stroke="var(--border)"/>
  <text x="335" y="319.824561403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--text)">No reasoning shown</text>
  <text x="335" y="345.263157894737" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.096071693061" fill="var(--text-muted)">hard to verify or debug</text>

  <rect x="60" y="396.140350877193" width="550" height="203.508771929825" rx="8.069870322226" fill="var(--bg)" stroke="var(--border)"/>
  <text x="335" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--text)">Problems</text>
  <text x="80" y="462.280701754386" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">skips intermediate steps</text>
  <text x="80" y="492.80701754386" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">errors accumulate</text>
  <text x="80" y="523.333333333333" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">opaque failure</text>
  <text x="80" y="553.859649122807" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">fails multi-step math</text>

  <rect x="650" y="40" width="590" height="580" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="75.614035087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--ok-text)">Chain-of-Thought</text>

  <rect x="670" y="101.052631578947" width="550" height="50.877192982456" rx="8.069870322226" fill="var(--bg)" stroke="var(--border)"/>
  <text x="945" y="131.578947368421" text-anchor="middle" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--text)">Let's think step by step</text>

  <rect x="670" y="172.280701754386" width="550" height="40.701754385965" rx="8.069870322226" fill="var(--bg)" stroke="var(--border)"/>
  <text x="945" y="197.719298245614" text-anchor="middle" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--text)">1. Roger starts with 5 balls</text>

  <rect x="670" y="223.157894736842" width="550" height="40.701754385965" rx="8.069870322226" fill="var(--bg)" stroke="var(--border)"/>
  <text x="945" y="248.59649122807" text-anchor="middle" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--text)">2. 2 cans x 3 = 6 new balls</text>

  <rect x="670" y="274.035087719298" width="550" height="40.701754385965" rx="8.069870322226" fill="var(--bg)" stroke="var(--border)"/>
  <text x="945" y="299.473684210526" text-anchor="middle" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--text)">3. Total = 5 + 6 = 11</text>

  <rect x="670" y="335.087719298246" width="550" height="50.877192982456" rx="8.069870322226" fill="var(--bg)" stroke="var(--border)"/>
  <text x="945" y="365.614035087719" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" font-weight="bold" fill="var(--ok-accent)">A: 11 balls</text>

  <rect x="670" y="406.315789473684" width="550" height="193.333333333333" rx="8.069870322226" fill="var(--bg)" stroke="var(--border)"/>
  <text x="945" y="436.842105263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--text)">Benefits</text>
  <text x="690" y="472.456140350877" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">verifiable steps</text>
  <text x="690" y="497.894736842105" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">errors visible</text>
  <text x="690" y="523.333333333333" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">better on multi-step</text>
  <text x="690" y="558.947368421053" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--ok-accent)">zero-shot trigger works</text>
</svg>

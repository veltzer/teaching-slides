<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.8182" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">When CoT Doesn't Help</text>
  <rect x="40" y="83.9394" width="366.6667" height="175.7576" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.3333" y="124.3637" text-anchor="middle" font-size="19.3637" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">1. Simple Factual Recall</text>
  <text x="223.3333" y="163.0304" text-anchor="middle" font-size="16.1364" fill="var(--text-muted)" font-family="Arial, sans-serif">"What is the capital</text>
  <text x="223.3333" y="189.3939" text-anchor="middle" font-size="16.1364" fill="var(--text-muted)" font-family="Arial, sans-serif">of Japan?"</text>
  <text x="223.3333" y="233.3334" text-anchor="middle" font-size="16.1364" fill="var(--danger-accent)" font-family="Arial, sans-serif">CoT adds unnecessary verbosity</text>
  <rect x="456.6667" y="83.9394" width="366.6667" height="175.7576" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="124.3637" text-anchor="middle" font-size="19.3637" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2. Simple Classification</text>
  <text x="640.0001" y="163.0304" text-anchor="middle" font-size="16.1364" fill="var(--text-muted)" font-family="Arial, sans-serif">"Is this email spam?</text>
  <text x="640.0001" y="189.3939" text-anchor="middle" font-size="16.1364" fill="var(--text-muted)" font-family="Arial, sans-serif">Yes/No"</text>
  <text x="640.0001" y="233.3334" text-anchor="middle" font-size="16.1364" fill="var(--danger-accent)" font-family="Arial, sans-serif">Direct answer usually correct</text>
  <rect x="873.3333" y="83.9394" width="366.6667" height="175.7576" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.6667" y="124.3637" text-anchor="middle" font-size="19.3637" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. Translation</text>
  <text x="1056.6667" y="163.0304" text-anchor="middle" font-size="16.1364" fill="var(--text-muted)" font-family="Arial, sans-serif">"Translate 'hello'</text>
  <text x="1056.6667" y="189.3939" text-anchor="middle" font-size="16.1364" fill="var(--text-muted)" font-family="Arial, sans-serif">to Spanish"</text>
  <text x="1056.6667" y="233.3334" text-anchor="middle" font-size="16.1364" fill="var(--danger-accent)" font-family="Arial, sans-serif">Direct generation is fine</text>
  <rect x="173.3333" y="303.6364" width="433.3334" height="175.7576" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="344.0606" text-anchor="middle" font-size="19.3637" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">4. Very Short Outputs</text>
  <text x="390" y="382.7273" text-anchor="middle" font-size="16.1364" fill="var(--text-muted)" font-family="Arial, sans-serif">"What color is the sky?"</text>
  <text x="390" y="444.2424" text-anchor="middle" font-size="16.1364" fill="var(--danger-accent)" font-family="Arial, sans-serif">CoT overhead not justified</text>
  <rect x="673.3333" y="303.6364" width="433.3334" height="175.7576" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="344.0606" text-anchor="middle" font-size="19.3637" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">5. Creative Tasks</text>
  <text x="890" y="382.7273" text-anchor="middle" font-size="16.1364" fill="var(--text-muted)" font-family="Arial, sans-serif">"Write a poem about rain"</text>
  <text x="890" y="444.2424" text-anchor="middle" font-size="16.1364" fill="var(--danger-accent)" font-family="Arial, sans-serif">Reasoning doesn't apply to creativity</text>
  <rect x="173.3333" y="532.1212" width="933.3334" height="87.8788" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="576.0607" text-anchor="middle" font-size="20.9772" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Rule: Use CoT when the task requires</text>
  <text x="640.0001" y="605.9394" text-anchor="middle" font-size="20.9772" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">MULTIPLE REASONING STEPS to reach the answer.</text>
</svg>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">When CoT Doesn't Help</text>
  <!-- Tasks -->
  <rect x="40" y="55" width="220" height="100" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="150" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">1. Simple Factual Recall</text>
  <text x="150" y="100" text-anchor="middle" font-size="10" fill="#555">"What is the capital</text>
  <text x="150" y="115" text-anchor="middle" font-size="10" fill="#555">of Japan?"</text>
  <text x="150" y="140" text-anchor="middle" font-size="10" fill="#dc3545">CoT adds unnecessary verbosity</text>

  <rect x="290" y="55" width="220" height="100" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="400" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">2. Simple Classification</text>
  <text x="400" y="100" text-anchor="middle" font-size="10" fill="#555">"Is this email spam?</text>
  <text x="400" y="115" text-anchor="middle" font-size="10" fill="#555">Yes/No"</text>
  <text x="400" y="140" text-anchor="middle" font-size="10" fill="#dc3545">Direct answer usually correct</text>

  <rect x="540" y="55" width="220" height="100" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="650" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">3. Translation</text>
  <text x="650" y="100" text-anchor="middle" font-size="10" fill="#555">"Translate 'hello'</text>
  <text x="650" y="115" text-anchor="middle" font-size="10" fill="#555">to Spanish"</text>
  <text x="650" y="140" text-anchor="middle" font-size="10" fill="#dc3545">Direct generation is fine</text>

  <rect x="120" y="180" width="260" height="100" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="250" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">4. Very Short Outputs</text>
  <text x="250" y="225" text-anchor="middle" font-size="10" fill="#555">"What color is the sky?"</text>
  <text x="250" y="260" text-anchor="middle" font-size="10" fill="#dc3545">CoT overhead not justified</text>

  <rect x="420" y="180" width="260" height="100" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="550" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">5. Creative Tasks</text>
  <text x="550" y="225" text-anchor="middle" font-size="10" fill="#555">"Write a poem about rain"</text>
  <text x="550" y="260" text-anchor="middle" font-size="10" fill="#dc3545">Reasoning doesn't apply to creativity</text>

  <!-- Rule -->
  <rect x="120" y="310" width="560" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="400" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Rule: Use CoT when the task requires</text>
  <text x="400" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">MULTIPLE REASONING STEPS to reach the answer.</text>
</svg>
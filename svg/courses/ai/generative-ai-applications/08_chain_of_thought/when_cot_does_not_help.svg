<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0988" y="53.3333" text-anchor="middle" font-size="25.284" font-weight="bold" fill="var(--text)">When CoT Doesn't Help</text>
  <rect x="63.2099" y="97.7778" width="347.6543" height="177.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="237.037" y="138.6667" text-anchor="middle" font-size="18.963" font-weight="bold" fill="var(--danger-accent)">1. Simple Factual Recall</text>
  <text x="237.037" y="177.7778" text-anchor="middle" font-size="15.8025" fill="var(--text-muted)">"What is the capital</text>
  <text x="237.037" y="204.4444" text-anchor="middle" font-size="15.8025" fill="var(--text-muted)">of Japan?"</text>
  <text x="237.037" y="248.8889" text-anchor="middle" font-size="15.8025" fill="var(--danger-accent)">CoT adds unnecessary verbosity</text>
  <rect x="458.2716" y="97.7778" width="347.6543" height="177.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="632.0988" y="138.6667" text-anchor="middle" font-size="18.963" font-weight="bold" fill="var(--danger-accent)">2. Simple Classification</text>
  <text x="632.0988" y="177.7778" text-anchor="middle" font-size="15.8025" fill="var(--text-muted)">"Is this email spam?</text>
  <text x="632.0988" y="204.4444" text-anchor="middle" font-size="15.8025" fill="var(--text-muted)">Yes/No"</text>
  <text x="632.0988" y="248.8889" text-anchor="middle" font-size="15.8025" fill="var(--danger-accent)">Direct answer usually correct</text>
  <rect x="853.3333" y="97.7778" width="347.6543" height="177.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1027.1605" y="138.6667" text-anchor="middle" font-size="18.963" font-weight="bold" fill="var(--danger-accent)">3. Translation</text>
  <text x="1027.1605" y="177.7778" text-anchor="middle" font-size="15.8025" fill="var(--text-muted)">"Translate 'hello'</text>
  <text x="1027.1605" y="204.4444" text-anchor="middle" font-size="15.8025" fill="var(--text-muted)">to Spanish"</text>
  <text x="1027.1605" y="248.8889" text-anchor="middle" font-size="15.8025" fill="var(--danger-accent)">Direct generation is fine</text>
  <rect x="189.6296" y="320" width="410.8642" height="177.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="395.0617" y="360.8889" text-anchor="middle" font-size="18.963" font-weight="bold" fill="var(--danger-accent)">4. Very Short Outputs</text>
  <text x="395.0617" y="400" text-anchor="middle" font-size="15.8025" fill="var(--text-muted)">"What color is the sky?"</text>
  <text x="395.0617" y="462.2222" text-anchor="middle" font-size="15.8025" fill="var(--danger-accent)">CoT overhead not justified</text>
  <rect x="663.7037" y="320" width="410.8642" height="177.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="869.1358" y="360.8889" text-anchor="middle" font-size="18.963" font-weight="bold" fill="var(--danger-accent)">5. Creative Tasks</text>
  <text x="869.1358" y="400" text-anchor="middle" font-size="15.8025" fill="var(--text-muted)">"Write a poem about rain"</text>
  <text x="869.1358" y="462.2222" text-anchor="middle" font-size="15.8025" fill="var(--danger-accent)">Reasoning doesn't apply to creativity</text>
  <rect x="189.6296" y="551.1111" width="884.9383" height="88.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="632.0988" y="595.5556" text-anchor="middle" font-size="20.5432" font-weight="bold" fill="var(--ok-accent)">Rule: Use CoT when the task requires</text>
  <text x="632.0988" y="625.7778" text-anchor="middle" font-size="20.5432" font-weight="bold" fill="var(--ok-accent)">MULTIPLE REASONING STEPS to reach the answer.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">When CoT Doesn't Help</text>
  <rect x="64" y="99" width="352" height="180" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <text x="240" y="140.4" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#dc3545">1. Simple Factual Recall</text>
  <text x="240" y="180" text-anchor="middle" font-size="16" fill="#555">"What is the capital</text>
  <text x="240" y="207" text-anchor="middle" font-size="16" fill="#555">of Japan?"</text>
  <text x="240" y="252" text-anchor="middle" font-size="16" fill="#dc3545">CoT adds unnecessary verbosity</text>
  <rect x="464" y="99" width="352" height="180" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <text x="640" y="140.4" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#dc3545">2. Simple Classification</text>
  <text x="640" y="180" text-anchor="middle" font-size="16" fill="#555">"Is this email spam?</text>
  <text x="640" y="207" text-anchor="middle" font-size="16" fill="#555">Yes/No"</text>
  <text x="640" y="252" text-anchor="middle" font-size="16" fill="#dc3545">Direct answer usually correct</text>
  <rect x="864" y="99" width="352" height="180" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <text x="1040" y="140.4" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#dc3545">3. Translation</text>
  <text x="1040" y="180" text-anchor="middle" font-size="16" fill="#555">"Translate 'hello'</text>
  <text x="1040" y="207" text-anchor="middle" font-size="16" fill="#555">to Spanish"</text>
  <text x="1040" y="252" text-anchor="middle" font-size="16" fill="#dc3545">Direct generation is fine</text>
  <rect x="192" y="324" width="416" height="180" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <text x="400" y="365.4" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#dc3545">4. Very Short Outputs</text>
  <text x="400" y="405" text-anchor="middle" font-size="16" fill="#555">"What color is the sky?"</text>
  <text x="400" y="468" text-anchor="middle" font-size="16" fill="#dc3545">CoT overhead not justified</text>
  <rect x="672" y="324" width="416" height="180" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <text x="880" y="365.4" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#dc3545">5. Creative Tasks</text>
  <text x="880" y="405" text-anchor="middle" font-size="16" fill="#555">"Write a poem about rain"</text>
  <text x="880" y="468" text-anchor="middle" font-size="16" fill="#dc3545">Reasoning doesn't apply to creativity</text>
  <rect x="192" y="558" width="896" height="90" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="640" y="603" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#28a745">Rule: Use CoT when the task requires</text>
  <text x="640" y="633.6" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#28a745">MULTIPLE REASONING STEPS to reach the answer.</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="632.0988" y="53.3333" text-anchor="middle" font-size="25.284" font-weight="bold" fill="#333">When CoT Doesn't Help</ns0:text>
  <ns0:rect x="63.2099" y="97.7778" width="347.6543" height="177.7778" rx="7.9012" fill="#f8d7da" stroke="#dc3545" stroke-width="2.3704" />
  <ns0:text x="237.037" y="138.6667" text-anchor="middle" font-size="18.963" font-weight="bold" fill="#dc3545">1. Simple Factual Recall</ns0:text>
  <ns0:text x="237.037" y="177.7778" text-anchor="middle" font-size="15.8025" fill="#555">"What is the capital</ns0:text>
  <ns0:text x="237.037" y="204.4444" text-anchor="middle" font-size="15.8025" fill="#555">of Japan?"</ns0:text>
  <ns0:text x="237.037" y="248.8889" text-anchor="middle" font-size="15.8025" fill="#dc3545">CoT adds unnecessary verbosity</ns0:text>
  <ns0:rect x="458.2716" y="97.7778" width="347.6543" height="177.7778" rx="7.9012" fill="#f8d7da" stroke="#dc3545" stroke-width="2.3704" />
  <ns0:text x="632.0988" y="138.6667" text-anchor="middle" font-size="18.963" font-weight="bold" fill="#dc3545">2. Simple Classification</ns0:text>
  <ns0:text x="632.0988" y="177.7778" text-anchor="middle" font-size="15.8025" fill="#555">"Is this email spam?</ns0:text>
  <ns0:text x="632.0988" y="204.4444" text-anchor="middle" font-size="15.8025" fill="#555">Yes/No"</ns0:text>
  <ns0:text x="632.0988" y="248.8889" text-anchor="middle" font-size="15.8025" fill="#dc3545">Direct answer usually correct</ns0:text>
  <ns0:rect x="853.3333" y="97.7778" width="347.6543" height="177.7778" rx="7.9012" fill="#f8d7da" stroke="#dc3545" stroke-width="2.3704" />
  <ns0:text x="1027.1605" y="138.6667" text-anchor="middle" font-size="18.963" font-weight="bold" fill="#dc3545">3. Translation</ns0:text>
  <ns0:text x="1027.1605" y="177.7778" text-anchor="middle" font-size="15.8025" fill="#555">"Translate 'hello'</ns0:text>
  <ns0:text x="1027.1605" y="204.4444" text-anchor="middle" font-size="15.8025" fill="#555">to Spanish"</ns0:text>
  <ns0:text x="1027.1605" y="248.8889" text-anchor="middle" font-size="15.8025" fill="#dc3545">Direct generation is fine</ns0:text>
  <ns0:rect x="189.6296" y="320" width="410.8642" height="177.7778" rx="7.9012" fill="#f8d7da" stroke="#dc3545" stroke-width="2.3704" />
  <ns0:text x="395.0617" y="360.8889" text-anchor="middle" font-size="18.963" font-weight="bold" fill="#dc3545">4. Very Short Outputs</ns0:text>
  <ns0:text x="395.0617" y="400" text-anchor="middle" font-size="15.8025" fill="#555">"What color is the sky?"</ns0:text>
  <ns0:text x="395.0617" y="462.2222" text-anchor="middle" font-size="15.8025" fill="#dc3545">CoT overhead not justified</ns0:text>
  <ns0:rect x="663.7037" y="320" width="410.8642" height="177.7778" rx="7.9012" fill="#f8d7da" stroke="#dc3545" stroke-width="2.3704" />
  <ns0:text x="869.1358" y="360.8889" text-anchor="middle" font-size="18.963" font-weight="bold" fill="#dc3545">5. Creative Tasks</ns0:text>
  <ns0:text x="869.1358" y="400" text-anchor="middle" font-size="15.8025" fill="#555">"Write a poem about rain"</ns0:text>
  <ns0:text x="869.1358" y="462.2222" text-anchor="middle" font-size="15.8025" fill="#dc3545">Reasoning doesn't apply to creativity</ns0:text>
  <ns0:rect x="189.6296" y="551.1111" width="884.9383" height="88.8889" rx="7.9012" fill="#d4edda" stroke="#28a745" stroke-width="3.1605" />
  <ns0:text x="632.0988" y="595.5556" text-anchor="middle" font-size="20.5432" font-weight="bold" fill="#28a745">Rule: Use CoT when the task requires</ns0:text>
  <ns0:text x="632.0988" y="625.7778" text-anchor="middle" font-size="20.5432" font-weight="bold" fill="#28a745">MULTIPLE REASONING STEPS to reach the answer.</ns0:text>
</ns0:svg>
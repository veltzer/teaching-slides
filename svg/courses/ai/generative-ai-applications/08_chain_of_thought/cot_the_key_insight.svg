<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="387.0968" y="31.106" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="#333">CoT: The Key Insight</ns0:text>
  <ns0:line x1="103.2258" y1="62.212" x2="103.2258" y2="290.3226" stroke="#333" stroke-width="2.0645" />
  <ns0:line x1="103.2258" y1="290.3226" x2="670.9677" y2="290.3226" stroke="#333" stroke-width="2.0645" />
  <ns0:text x="51.6129" y="181.4516" text-anchor="middle" font-size="12.3871" fill="#333" transform="rotate(-90, 50, 175)">Benefit of CoT</ns0:text>
  <ns0:text x="387.0968" y="321.4286" text-anchor="middle" font-size="12.3871" fill="#333">Problem Complexity</ns0:text>
  <ns0:text x="154.8387" y="308.9862" text-anchor="middle" font-size="10.3226" fill="#666">Simple (1 step)</ns0:text>
  <ns0:text x="598.7097" y="308.9862" text-anchor="middle" font-size="10.3226" fill="#666">Complex (5+ steps)</ns0:text>
  <ns0:path d="M 123.871 274.7696 Q 206.4516 248.848 289.0323 207.3733 Q 371.6129 155.53 454.1935 114.0553 Q 536.7742 82.9493 640 67.3963" fill="none" stroke="#4a90e2" stroke-width="3.0968" />
  <ns0:line x1="361.2903" y1="160.7143" x2="289.0323" y2="197.0046" stroke="#28a745" stroke-width="1.5484" stroke-dasharray="4.1291 2.0645" />
  <ns0:text x="247.7419" y="217.7419" font-size="11.3548" fill="#28a745">CoT helps most</ns0:text>
  <ns0:text x="247.7419" y="233.2949" font-size="11.3548" fill="#28a745">with multi-step reasoning</ns0:text>
  <ns0:rect x="82.5806" y="342.1659" width="289.0323" height="82.9493" rx="5.1613" fill="#d4edda" stroke="#28a745" stroke-width="1.5484" />
  <ns0:text x="227.0968" y="364.977" text-anchor="middle" font-size="12.3871" font-weight="bold" fill="#28a745">CoT Helps When:</ns0:text>
  <ns0:text x="103.2258" y="385.7143" font-size="10.3226" fill="#333">- Multi-step arithmetic</ns0:text>
  <ns0:text x="103.2258" y="402.3042" font-size="10.3226" fill="#333">- Logical deduction</ns0:text>
  <ns0:text x="103.2258" y="418.894" font-size="10.3226" fill="#333">- Planning and sequencing</ns0:text>
  <ns0:rect x="402.5807" y="342.1659" width="289.0323" height="82.9493" rx="5.1613" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5484" />
  <ns0:text x="547.0968" y="364.977" text-anchor="middle" font-size="12.3871" font-weight="bold" fill="#dc3545">Less Useful For:</ns0:text>
  <ns0:text x="423.2258" y="385.7143" font-size="10.3226" fill="#333">- Simple factual recall</ns0:text>
  <ns0:text x="423.2258" y="402.3042" font-size="10.3226" fill="#333">- Direct classification</ns0:text>
  <ns0:text x="423.2258" y="418.894" font-size="10.3226" fill="#333">- Creative writing</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.1278" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CoT: The Key Insight</text>
  <line x1="80.6781" y1="85.7895" x2="80.6781" y2="421.579" stroke="var(--text)" stroke-width="0.8519"/>
  <line x1="80.6781" y1="421.579" x2="1199.3217" y2="421.579" stroke="var(--text)" stroke-width="0.8519"/>
  <text x="40" y="261.316" text-anchor="middle" font-size="20.5792" fill="var(--text)" transform="rotate(-90, 50, 175)" font-family="Arial, sans-serif">Benefit of CoT</text>
  <text x="639.9999" y="467.3687" text-anchor="middle" font-size="21.0959" fill="var(--text)" font-family="Arial, sans-serif">Problem Complexity</text>
  <text x="182.373" y="449.0528" text-anchor="middle" font-size="20.5623" fill="var(--text-muted)" font-family="Arial, sans-serif">Simple (1 step)</text>
  <text x="1056.9489" y="449.0528" text-anchor="middle" font-size="20.5623" fill="var(--text-muted)" font-family="Arial, sans-serif">Complex (5+ steps)</text>
  <path d="M 121.3562 398.6842 Q 284.0678 360.5265 446.7798 299.4737 Q 609.4915 223.158 772.2031 162.1055 Q 934.9151 116.3161 1138.3049 93.4211" fill="none" stroke="var(--primary-border)" stroke-width="1.3192"/>
  <line x1="589.1523" y1="230.7898" x2="446.7798" y2="284.2105" stroke="var(--ok-border)" stroke-width="0.6596" stroke-dasharray="1.7589 0.8794"/>
  <text x="365.4236" y="314.7371" font-size="20.5623" fill="var(--ok-accent)" font-family="Arial, sans-serif">CoT helps most</text>
  <text x="365.4236" y="337.6317" font-size="20.5623" fill="var(--ok-accent)" font-family="Arial, sans-serif">with multi-step reasoning</text>
  <rect x="40" y="497.8947" width="569.4915" height="122.1053" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="324.746" y="531.4738" text-anchor="middle" font-size="21.0959" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">CoT Helps When:</text>
  <text x="80.6781" y="562.0002" font-size="20.5623" fill="var(--text)" font-family="Arial, sans-serif">- Multi-step arithmetic</text>
  <text x="80.6781" y="586.4213" font-size="20.5623" fill="var(--text)" font-family="Arial, sans-serif">- Logical deduction</text>
  <text x="80.6781" y="610.8424" font-size="20.5623" fill="var(--text)" font-family="Arial, sans-serif">- Planning and sequencing</text>
  <rect x="670.5085" y="497.8947" width="569.4915" height="122.1053" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955.254" y="531.4738" text-anchor="middle" font-size="21.0959" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Less Useful For:</text>
  <text x="711.1864" y="562.0002" font-size="20.5623" fill="var(--text)" font-family="Arial, sans-serif">- Simple factual recall</text>
  <text x="711.1864" y="586.4213" font-size="20.5623" fill="var(--text)" font-family="Arial, sans-serif">- Direct classification</text>
  <text x="711.1864" y="610.8424" font-size="20.5623" fill="var(--text)" font-family="Arial, sans-serif">- Creative writing</text>
</svg>

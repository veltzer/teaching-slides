<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="51.4286" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="#333">CoT: The Key Insight</text>
  <line x1="170.6667" y1="102.8571" x2="170.6667" y2="480" stroke="#333" stroke-width="3.4133" />
  <line x1="170.6667" y1="480" x2="1109.3333" y2="480" stroke="#333" stroke-width="3.4133" />
  <text x="85.3333" y="300" text-anchor="middle" font-size="20.48" fill="#333" transform="rotate(-90, 50, 175)">Benefit of CoT</text>
  <text x="640" y="531.4286" text-anchor="middle" font-size="20.48" fill="#333">Problem Complexity</text>
  <text x="256" y="510.8571" text-anchor="middle" font-size="17.0667" fill="#666">Simple (1 step)</text>
  <text x="989.8667" y="510.8571" text-anchor="middle" font-size="17.0667" fill="#666">Complex (5+ steps)</text>
  <path d="M 204.8 454.2857 Q 341.3333 411.4286 477.8667 342.8571 Q 614.4 257.1429 750.9333 188.5714 Q 887.4667 137.1429 1058.1333 111.4286" fill="none" stroke="#4a90e2" stroke-width="5.12" />
  <line x1="597.3333" y1="265.7143" x2="477.8667" y2="325.7143" stroke="#28a745" stroke-width="2.56" stroke-dasharray="6.8267 3.4133" />
  <text x="409.6" y="360" font-size="18.7733" fill="#28a745">CoT helps most</text>
  <text x="409.6" y="385.7143" font-size="18.7733" fill="#28a745">with multi-step reasoning</text>
  <rect x="136.5333" y="565.7143" width="477.8667" height="137.1429" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="2.56" />
  <text x="375.4667" y="603.4286" text-anchor="middle" font-size="20.48" font-weight="bold" fill="#28a745">CoT Helps When:</text>
  <text x="170.6667" y="637.7143" font-size="17.0667" fill="#333">- Multi-step arithmetic</text>
  <text x="170.6667" y="665.1429" font-size="17.0667" fill="#333">- Logical deduction</text>
  <text x="170.6667" y="692.5714" font-size="17.0667" fill="#333">- Planning and sequencing</text>
  <rect x="665.6" y="565.7143" width="477.8667" height="137.1429" rx="8.5333" fill="#f8d7da" stroke="#dc3545" stroke-width="2.56" />
  <text x="904.5333" y="603.4286" text-anchor="middle" font-size="20.48" font-weight="bold" fill="#dc3545">Less Useful For:</text>
  <text x="699.7333" y="637.7143" font-size="17.0667" fill="#333">- Simple factual recall</text>
  <text x="699.7333" y="665.1429" font-size="17.0667" fill="#333">- Direct classification</text>
  <text x="699.7333" y="692.5714" font-size="17.0667" fill="#333">- Creative writing</text>

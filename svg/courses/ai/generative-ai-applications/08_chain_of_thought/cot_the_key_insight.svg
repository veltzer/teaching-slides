<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="387.0968" y="31.106" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="var(--text)">CoT: The Key Insight</text>
  <line x1="103.2258" y1="62.212" x2="103.2258" y2="290.3226" stroke="var(--text)" stroke-width="2" />
  <line x1="103.2258" y1="290.3226" x2="670.9677" y2="290.3226" stroke="var(--text)" stroke-width="2" />
  <text x="51.6129" y="181.4516" text-anchor="middle" font-size="12.3871" fill="var(--text)" transform="rotate(-90, 50, 175)">Benefit of CoT</text>
  <text x="387.0968" y="321.4286" text-anchor="middle" font-size="12.3871" fill="var(--text)">Problem Complexity</text>
  <text x="154.8387" y="308.9862" text-anchor="middle" font-size="10.3226" fill="var(--text-muted)">Simple (1 step)</text>
  <text x="598.7097" y="308.9862" text-anchor="middle" font-size="10.3226" fill="var(--text-muted)">Complex (5+ steps)</text>
  <path d="M 123.871 274.7696 Q 206.4516 248.848 289.0323 207.3733 Q 371.6129 155.53 454.1935 114.0553 Q 536.7742 82.9493 640 67.3963" fill="none" stroke="var(--primary-border)" stroke-width="3.0968" />
  <line x1="361.2903" y1="160.7143" x2="289.0323" y2="197.0046" stroke="var(--ok-border)" stroke-width="1.5484" stroke-dasharray="4.1291 2.0645" />
  <text x="247.7419" y="217.7419" font-size="11.3548" fill="var(--ok-accent)">CoT helps most</text>
  <text x="247.7419" y="233.2949" font-size="11.3548" fill="var(--ok-accent)">with multi-step reasoning</text>
  <rect x="82.5806" y="342.1659" width="289.0323" height="82.9493" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="227.0968" y="364.977" text-anchor="middle" font-size="12.3871" font-weight="bold" fill="var(--ok-accent)">CoT Helps When:</text>
  <text x="103.2258" y="385.7143" font-size="10.3226" fill="var(--text)">- Multi-step arithmetic</text>
  <text x="103.2258" y="402.3042" font-size="10.3226" fill="var(--text)">- Logical deduction</text>
  <text x="103.2258" y="418.894" font-size="10.3226" fill="var(--text)">- Planning and sequencing</text>
  <rect x="402.5807" y="342.1659" width="289.0323" height="82.9493" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="547.0968" y="364.977" text-anchor="middle" font-size="12.3871" font-weight="bold" fill="var(--danger-accent)">Less Useful For:</text>
  <text x="423.2258" y="385.7143" font-size="10.3226" fill="var(--text)">- Simple factual recall</text>
  <text x="423.2258" y="402.3042" font-size="10.3226" fill="var(--text)">- Direct classification</text>
  <text x="423.2258" y="418.894" font-size="10.3226" fill="var(--text)">- Creative writing</text>
</svg>
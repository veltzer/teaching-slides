<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="430.5343" y="52.2137" text-anchor="middle" font-size="13.6793" font-weight="bold" fill="var(--text)">CoT: The Key Insight</text>
  <line x1="195.4198" y1="77.9771" x2="195.4198" y2="266.9084" stroke="var(--text)" stroke-width="0.8519" />
  <line x1="195.4198" y1="266.9084" x2="665.6488" y2="266.9084" stroke="var(--text)" stroke-width="0.8519" />
  <text x="152.6717" y="176.7367" text-anchor="middle" font-size="10.2595" fill="var(--text)" transform="rotate(-90, 50, 175)">Benefit of CoT</text>
  <text x="430.5343" y="292.6719" text-anchor="middle" font-size="10.2595" fill="var(--text)">Problem Complexity</text>
  <text x="238.1679" y="282.3665" text-anchor="middle" font-size="10" fill="var(--text-muted)">Simple (1 step)</text>
  <text x="605.8015" y="282.3665" text-anchor="middle" font-size="10" fill="var(--text-muted)">Complex (5+ steps)</text>
  <path d="M 212.5191 254.0267 Q 280.916 232.5573 349.313 198.2061 Q 417.7099 155.2672 486.1068 120.9161 Q 554.5038 95.1528 640 82.271" fill="none" stroke="var(--primary-border)" stroke-width="1.3192" />
  <line x1="409.1602" y1="159.5612" x2="349.313" y2="189.6183" stroke="var(--ok-border)" stroke-width="0.6596" stroke-dasharray="1.7589 0.8794" />
  <text x="315.1144" y="206.794" font-size="10" fill="var(--ok-accent)">CoT helps most</text>
  <text x="315.1144" y="219.6756" font-size="10" fill="var(--ok-accent)">with multi-step reasoning</text>
  <rect x="178.3205" y="309.8473" width="239.3894" height="68.7023" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.3053" />
  <text x="298.0153" y="328.7405" text-anchor="middle" font-size="10.2595" font-weight="bold" fill="var(--ok-accent)">CoT Helps When:</text>
  <text x="195.4198" y="345.9161" font-size="10" fill="var(--text)">- Multi-step arithmetic</text>
  <text x="195.4198" y="359.6566" font-size="10" fill="var(--text)">- Logical deduction</text>
  <text x="195.4198" y="373.3971" font-size="10" fill="var(--text)">- Planning and sequencing</text>
  <rect x="443.3588" y="309.8473" width="239.3894" height="68.7023" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.3053" />
  <text x="563.0534" y="328.7405" text-anchor="middle" font-size="10.2595" font-weight="bold" fill="var(--danger-accent)">Less Useful For:</text>
  <text x="460.458" y="345.9161" font-size="10" fill="var(--text)">- Simple factual recall</text>
  <text x="460.458" y="359.6566" font-size="10" fill="var(--text)">- Direct classification</text>
  <text x="460.458" y="373.3971" font-size="10" fill="var(--text)">- Creative writing</text>
</svg>
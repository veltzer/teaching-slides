<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="659.6491" y="80" text-anchor="middle" font-size="20.959" font-weight="bold" fill="var(--text)">CoT: The Key Insight</text>
  <line x1="299.4151" y1="119.4737" x2="299.4151" y2="408.9474" stroke="var(--text)" stroke-width="2" />
  <line x1="299.4151" y1="408.9474" x2="1019.8829" y2="408.9474" stroke="var(--text)" stroke-width="2" />
  <text x="233.918" y="270.7895" text-anchor="middle" font-size="15.7193" fill="var(--text)" transform="rotate(-90, 50, 175)">Benefit of CoT</text>
  <text x="659.6491" y="448.4211" text-anchor="middle" font-size="15.7193" fill="var(--text)">Problem Complexity</text>
  <text x="364.9122" y="432.6316" text-anchor="middle" font-size="13.0994" fill="var(--text-muted)">Simple (1 step)</text>
  <text x="928.1871" y="432.6316" text-anchor="middle" font-size="13.0994" fill="var(--text-muted)">Complex (5+ steps)</text>
  <path d="M 325.614 389.2105 Q 430.4093 356.3159 535.2047 303.6842 Q 639.9999 237.8948 744.7952 185.2632 Q 849.5906 145.7895 980.5848 126.0526" fill="none" stroke="var(--primary-border)" stroke-width="3.0968" />
  <line x1="626.9005" y1="244.4737" x2="535.2047" y2="290.5263" stroke="var(--ok-border)" stroke-width="1.5484" stroke-dasharray="4.1291 2.0645" />
  <text x="482.8069" y="316.8421" font-size="14.4093" fill="var(--ok-accent)">CoT helps most</text>
  <text x="482.8069" y="336.5789" font-size="14.4093" fill="var(--ok-accent)">with multi-step reasoning</text>
  <rect x="273.2162" y="474.7368" width="366.7837" height="105.2632" rx="7.614" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="456.6082" y="503.6843" text-anchor="middle" font-size="15.7193" font-weight="bold" fill="var(--ok-accent)">CoT Helps When:</text>
  <text x="299.4151" y="530" font-size="13.0994" fill="var(--text)">- Multi-step arithmetic</text>
  <text x="299.4151" y="551.0527" font-size="13.0994" fill="var(--text)">- Logical deduction</text>
  <text x="299.4151" y="572.1053" font-size="13.0994" fill="var(--text)">- Planning and sequencing</text>
  <rect x="679.2983" y="474.7368" width="366.7837" height="105.2632" rx="7.614" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="862.69" y="503.6843" text-anchor="middle" font-size="15.7193" font-weight="bold" fill="var(--danger-accent)">Less Useful For:</text>
  <text x="705.497" y="530" font-size="13.0994" fill="var(--text)">- Simple factual recall</text>
  <text x="705.497" y="551.0527" font-size="13.0994" fill="var(--text)">- Direct classification</text>
  <text x="705.497" y="572.1053" font-size="13.0994" fill="var(--text)">- Creative writing</text>
</svg>
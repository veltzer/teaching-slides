<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.1278" font-weight="bold" fill="var(--text)">CoT: The Key Insight</text>
  <line x1="80.6781" y1="85.7895" x2="80.6781" y2="421.579" stroke="var(--text)" stroke-width="0.8519" />
  <line x1="80.6781" y1="421.579" x2="1199.3217" y2="421.579" stroke="var(--text)" stroke-width="0.8519" />
  <text x="40" y="261.316" text-anchor="middle" font-size="20.5792" fill="var(--text)" transform="rotate(-90, 50, 175)">Benefit of CoT</text>
  <text x="639.9999" y="467.3687" text-anchor="middle" font-size="21.0959" fill="var(--text)">Problem Complexity</text>
  <text x="182.373" y="449.0528" text-anchor="middle" font-size="20.5623" fill="var(--text-muted)">Simple (1 step)</text>
  <text x="1056.9489" y="449.0528" text-anchor="middle" font-size="20.5623" fill="var(--text-muted)">Complex (5+ steps)</text>
  <path d="M 121.3562 398.6842 Q 284.0678 360.5265 446.7798 299.4737 Q 609.4915 223.158 772.2031 162.1055 Q 934.9151 116.3161 1138.3049 93.4211" fill="none" stroke="var(--primary-border)" stroke-width="1.3192" />
  <line x1="589.1523" y1="230.7898" x2="446.7798" y2="284.2105" stroke="var(--ok-border)" stroke-width="0.6596" stroke-dasharray="1.7589 0.8794" />
  <text x="365.4236" y="314.7371" font-size="20.5623" fill="var(--ok-accent)">CoT helps most</text>
  <text x="365.4236" y="337.6317" font-size="20.5623" fill="var(--ok-accent)">with multi-step reasoning</text>
  <rect x="40" y="497.8947" width="569.4915" height="122.1053" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="324.746" y="531.4738" text-anchor="middle" font-size="21.0959" font-weight="bold" fill="var(--ok-accent)">CoT Helps When:</text>
  <text x="80.6781" y="562.0002" font-size="20.5623" fill="var(--text)">- Multi-step arithmetic</text>
  <text x="80.6781" y="586.4213" font-size="20.5623" fill="var(--text)">- Logical deduction</text>
  <text x="80.6781" y="610.8424" font-size="20.5623" fill="var(--text)">- Planning and sequencing</text>
  <rect x="670.5085" y="497.8947" width="569.4915" height="122.1053" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="955.254" y="531.4738" text-anchor="middle" font-size="21.0959" font-weight="bold" fill="var(--danger-accent)">Less Useful For:</text>
  <text x="711.1864" y="562.0002" font-size="20.5623" fill="var(--text)">- Simple factual recall</text>
  <text x="711.1864" y="586.4213" font-size="20.5623" fill="var(--text)">- Direct classification</text>
  <text x="711.1864" y="610.8424" font-size="20.5623" fill="var(--text)">- Creative writing</text>
</svg>
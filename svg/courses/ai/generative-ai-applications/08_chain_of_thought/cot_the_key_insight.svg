<svg viewBox="0 0 750 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">CoT: The Key Insight</text>
  <!-- Chart -->
  <line x1="100" y1="60" x2="100" y2="280" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="280" x2="650" y2="280" stroke="#333" stroke-width="2"/>
  <text x="50" y="175" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90, 50, 175)">Benefit of CoT</text>
  <text x="375" y="310" text-anchor="middle" font-size="12" fill="#333">Problem Complexity</text>
  <text x="150" y="298" text-anchor="middle" font-size="10" fill="#666">Simple (1 step)</text>
  <text x="580" y="298" text-anchor="middle" font-size="10" fill="#666">Complex (5+ steps)</text>
  <!-- Curve -->
  <path d="M120,265 Q200,240 280,200 Q360,150 440,110 Q520,80 620,65" fill="none" stroke="#4a90e2" stroke-width="3"/>
  <!-- Annotation -->
  <line x1="350" y1="155" x2="280" y2="190" stroke="#28a745" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="240" y="210" font-size="11" fill="#28a745">CoT helps most</text>
  <text x="240" y="225" font-size="11" fill="#28a745">with multi-step reasoning</text>
  <!-- When CoT helps -->
  <rect x="80" y="330" width="280" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="220" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">CoT Helps When:</text>
  <text x="100" y="372" font-size="10" fill="#333">- Multi-step arithmetic</text>
  <text x="100" y="388" font-size="10" fill="#333">- Logical deduction</text>
  <text x="100" y="404" font-size="10" fill="#333">- Planning and sequencing</text>
  <rect x="390" y="330" width="280" height="80" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="530" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Less Useful For:</text>
  <text x="410" y="372" font-size="10" fill="#333">- Simple factual recall</text>
  <text x="410" y="388" font-size="10" fill="#333">- Direct classification</text>
  <text x="410" y="404" font-size="10" fill="#333">- Creative writing</text>
</svg>
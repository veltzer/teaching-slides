<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="631.7808" y="40" text-anchor="middle" font-size="24.6634" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Self-Consistency Visualized</text>
  <text x="631.7808" y="78.6667" text-anchor="middle" font-size="18.0865" fill="var(--text-muted)" font-family="Arial, sans-serif">"If 3 shirts take 3 hours to dry, how long do 9 shirts take?"</text>
  <rect x="40" y="115.6522" width="213.6986" height="201.7391" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.8493" y="149.2754" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Path 1</text>
  <text x="146.8493" y="182.8986" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)" font-family="Arial, sans-serif">3 shirts -&gt; 3h</text>
  <text x="146.8493" y="208.116" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)" font-family="Arial, sans-serif">1 shirt -&gt; 1h</text>
  <text x="146.8493" y="233.3333" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)" font-family="Arial, sans-serif">9 shirts -&gt; 9h</text>
  <text x="146.8493" y="297.2174" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">9 hours ✗</text>
  <rect x="286.5753" y="115.6522" width="213.6986" height="201.7391" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="393.4247" y="149.2754" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Path 2</text>
  <text x="393.4247" y="182.8986" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)" font-family="Arial, sans-serif">Shirts dry in</text>
  <text x="393.4247" y="208.116" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)" font-family="Arial, sans-serif">parallel.</text>
  <text x="393.4247" y="233.3333" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)" font-family="Arial, sans-serif">Same time needed</text>
  <text x="393.4247" y="297.2174" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">3 hours ✓</text>
  <rect x="533.1507" y="115.6522" width="213.6986" height="201.7391" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="149.2754" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Path 3</text>
  <text x="640" y="182.8986" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)" font-family="Arial, sans-serif">3 batches needed</text>
  <text x="640" y="208.116" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)" font-family="Arial, sans-serif">3 x 3 hours</text>
  <text x="640" y="297.2174" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">9 hours ✗</text>
  <rect x="779.726" y="115.6522" width="213.6986" height="201.7391" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="886.5753" y="149.2754" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Path 4</text>
  <text x="886.5753" y="182.8986" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)" font-family="Arial, sans-serif">Parallel drying.</text>
  <text x="886.5753" y="208.116" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)" font-family="Arial, sans-serif">Not sequential.</text>
  <text x="886.5753" y="297.2174" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">3 hours ✓</text>
  <rect x="1026.3014" y="115.6522" width="213.6986" height="201.7391" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1133.1507" y="149.2754" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Path 5</text>
  <text x="1133.1507" y="182.8986" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)" font-family="Arial, sans-serif">All dry at once.</text>
  <text x="1133.1507" y="208.116" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)" font-family="Arial, sans-serif">Simultaneously.</text>
  <text x="1133.1507" y="297.2174" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">3 hours ✓</text>
  <line x1="146.8493" y1="317.3913" x2="631.7808" y2="401.4493" stroke="var(--danger-border)" stroke-width="1.5652" />
  <line x1="393.4247" y1="317.3913" x2="631.7808" y2="401.4493" stroke="var(--ok-border)" stroke-width="1.5652" />
  <line x1="640" y1="317.3913" x2="631.7808" y2="401.4493" stroke="var(--danger-border)" stroke-width="1.5652" />
  <line x1="886.5753" y1="317.3913" x2="631.7808" y2="401.4493" stroke="var(--ok-border)" stroke-width="1.5652" />
  <line x1="1133.1507" y1="317.3913" x2="631.7808" y2="401.4493" stroke="var(--ok-border)" stroke-width="1.5652" />
  <rect x="335.8904" y="401.4493" width="591.7808" height="117.6811" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.7808" y="443.4783" text-anchor="middle" font-size="21.3749" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">MAJORITY VOTE</text>
  <text x="631.7808" y="485.5072" text-anchor="middle" font-size="19.7307" fill="var(--text-muted)" font-family="Arial, sans-serif">3 hours (3/5) vs 9 hours (2/5)</text>
  <rect x="401.6438" y="552.7536" width="460.274" height="67.2464" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.7808" y="596.4638" text-anchor="middle" font-size="23.0191" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Answer: 3 hours</text>
  <line x1="631.7808" y1="519.1305" x2="631.7808" y2="552.7536" stroke="var(--primary-border)" stroke-width="2" />
</svg>
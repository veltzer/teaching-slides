<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="39.1304" text-anchor="middle" font-size="23.4783" font-weight="bold" fill="var(--text)">Self-Consistency Visualized</text>
  <text x="640" y="75.1304" text-anchor="middle" font-size="17.2174" fill="var(--text-muted)">"If 3 shirts take 3 hours to dry, how long do 9 shirts take?"</text>
  <rect x="64" y="109.5652" width="208" height="187.8261" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="168" y="140.8696" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="var(--danger-accent)">Path 1</text>
  <text x="168" y="172.1739" text-anchor="middle" font-size="15.6522" fill="var(--text-muted)">3 shirts -&gt; 3h</text>
  <text x="168" y="195.6522" text-anchor="middle" font-size="15.6522" fill="var(--text-muted)">1 shirt -&gt; 1h</text>
  <text x="168" y="219.1304" text-anchor="middle" font-size="15.6522" fill="var(--text-muted)">9 shirts -&gt; 9h</text>
  <text x="168" y="278.6087" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="var(--danger-accent)">9 hours ✗</text>
  <rect x="304" y="109.5652" width="208" height="187.8261" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="408" y="140.8696" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="var(--ok-accent)">Path 2</text>
  <text x="408" y="172.1739" text-anchor="middle" font-size="15.6522" fill="var(--text-muted)">Shirts dry in</text>
  <text x="408" y="195.6522" text-anchor="middle" font-size="15.6522" fill="var(--text-muted)">parallel.</text>
  <text x="408" y="219.1304" text-anchor="middle" font-size="15.6522" fill="var(--text-muted)">Same time needed</text>
  <text x="408" y="278.6087" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="var(--ok-accent)">3 hours ✓</text>
  <rect x="544" y="109.5652" width="208" height="187.8261" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="648" y="140.8696" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="var(--danger-accent)">Path 3</text>
  <text x="648" y="172.1739" text-anchor="middle" font-size="15.6522" fill="var(--text-muted)">3 batches needed</text>
  <text x="648" y="195.6522" text-anchor="middle" font-size="15.6522" fill="var(--text-muted)">3 x 3 hours</text>
  <text x="648" y="278.6087" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="var(--danger-accent)">9 hours ✗</text>
  <rect x="784" y="109.5652" width="208" height="187.8261" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="888" y="140.8696" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="var(--ok-accent)">Path 4</text>
  <text x="888" y="172.1739" text-anchor="middle" font-size="15.6522" fill="var(--text-muted)">Parallel drying.</text>
  <text x="888" y="195.6522" text-anchor="middle" font-size="15.6522" fill="var(--text-muted)">Not sequential.</text>
  <text x="888" y="278.6087" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="var(--ok-accent)">3 hours ✓</text>
  <rect x="1024" y="109.5652" width="208" height="187.8261" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1128" y="140.8696" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="var(--ok-accent)">Path 5</text>
  <text x="1128" y="172.1739" text-anchor="middle" font-size="15.6522" fill="var(--text-muted)">All dry at once.</text>
  <text x="1128" y="195.6522" text-anchor="middle" font-size="15.6522" fill="var(--text-muted)">Simultaneously.</text>
  <text x="1128" y="278.6087" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="var(--ok-accent)">3 hours ✓</text>
  <line x1="168" y1="297.3913" x2="640" y2="375.6522" stroke="var(--danger-border)" stroke-width="1.5652" />
  <line x1="408" y1="297.3913" x2="640" y2="375.6522" stroke="var(--ok-border)" stroke-width="1.5652" />
  <line x1="648" y1="297.3913" x2="640" y2="375.6522" stroke="var(--danger-border)" stroke-width="1.5652" />
  <line x1="888" y1="297.3913" x2="640" y2="375.6522" stroke="var(--ok-border)" stroke-width="1.5652" />
  <line x1="1128" y1="297.3913" x2="640" y2="375.6522" stroke="var(--ok-border)" stroke-width="1.5652" />
  <rect x="352" y="375.6522" width="576" height="109.5652" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="414.7826" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="var(--primary-accent)">MAJORITY VOTE</text>
  <text x="640" y="453.913" text-anchor="middle" font-size="18.7826" fill="var(--text-muted)">3 hours (3/5) vs 9 hours (2/5)</text>
  <rect x="416" y="516.5217" width="448" height="62.6087" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="557.2174" text-anchor="middle" font-size="21.913" font-weight="bold" fill="var(--ok-accent)">Answer: 3 hours</text>
  <line x1="640" y1="485.2174" x2="640" y2="516.5217" stroke="var(--primary-border)" stroke-width="2" />
</svg>
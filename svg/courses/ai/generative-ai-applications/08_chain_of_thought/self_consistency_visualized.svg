<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="631.7808" y="40" text-anchor="middle" font-size="24.6634" font-weight="bold" fill="var(--text)">Self-Consistency Visualized</text>
  <text x="631.7808" y="78.6667" text-anchor="middle" font-size="18.0865" fill="var(--text-muted)">"If 3 shirts take 3 hours to dry, how long do 9 shirts take?"</text>
  <rect x="40" y="115.6522" width="213.6986" height="201.7391" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="146.8493" y="149.2754" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--danger-accent)">Path 1</text>
  <text x="146.8493" y="182.8986" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)">3 shirts -&gt; 3h</text>
  <text x="146.8493" y="208.116" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)">1 shirt -&gt; 1h</text>
  <text x="146.8493" y="233.3333" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)">9 shirts -&gt; 9h</text>
  <text x="146.8493" y="297.2174" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--danger-accent)">9 hours ✗</text>
  <rect x="286.5753" y="115.6522" width="213.6986" height="201.7391" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="393.4247" y="149.2754" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--ok-accent)">Path 2</text>
  <text x="393.4247" y="182.8986" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)">Shirts dry in</text>
  <text x="393.4247" y="208.116" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)">parallel.</text>
  <text x="393.4247" y="233.3333" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)">Same time needed</text>
  <text x="393.4247" y="297.2174" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--ok-accent)">3 hours ✓</text>
  <rect x="533.1507" y="115.6522" width="213.6986" height="201.7391" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="149.2754" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--danger-accent)">Path 3</text>
  <text x="640" y="182.8986" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)">3 batches needed</text>
  <text x="640" y="208.116" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)">3 x 3 hours</text>
  <text x="640" y="297.2174" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--danger-accent)">9 hours ✗</text>
  <rect x="779.726" y="115.6522" width="213.6986" height="201.7391" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="886.5753" y="149.2754" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--ok-accent)">Path 4</text>
  <text x="886.5753" y="182.8986" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)">Parallel drying.</text>
  <text x="886.5753" y="208.116" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)">Not sequential.</text>
  <text x="886.5753" y="297.2174" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--ok-accent)">3 hours ✓</text>
  <rect x="1026.3014" y="115.6522" width="213.6986" height="201.7391" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1133.1507" y="149.2754" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--ok-accent)">Path 5</text>
  <text x="1133.1507" y="182.8986" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)">All dry at once.</text>
  <text x="1133.1507" y="208.116" text-anchor="middle" font-size="16.4423" fill="var(--text-muted)">Simultaneously.</text>
  <text x="1133.1507" y="297.2174" text-anchor="middle" font-size="18.0865" font-weight="bold" fill="var(--ok-accent)">3 hours ✓</text>
  <line x1="146.8493" y1="317.3913" x2="631.7808" y2="401.4493" stroke="var(--danger-border)" stroke-width="1.5652" />
  <line x1="393.4247" y1="317.3913" x2="631.7808" y2="401.4493" stroke="var(--ok-border)" stroke-width="1.5652" />
  <line x1="640" y1="317.3913" x2="631.7808" y2="401.4493" stroke="var(--danger-border)" stroke-width="1.5652" />
  <line x1="886.5753" y1="317.3913" x2="631.7808" y2="401.4493" stroke="var(--ok-border)" stroke-width="1.5652" />
  <line x1="1133.1507" y1="317.3913" x2="631.7808" y2="401.4493" stroke="var(--ok-border)" stroke-width="1.5652" />
  <rect x="335.8904" y="401.4493" width="591.7808" height="117.6811" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="631.7808" y="443.4783" text-anchor="middle" font-size="21.3749" font-weight="bold" fill="var(--primary-accent)">MAJORITY VOTE</text>
  <text x="631.7808" y="485.5072" text-anchor="middle" font-size="19.7307" fill="var(--text-muted)">3 hours (3/5) vs 9 hours (2/5)</text>
  <rect x="401.6438" y="552.7536" width="460.274" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="631.7808" y="596.4638" text-anchor="middle" font-size="23.0191" font-weight="bold" fill="var(--ok-accent)">Answer: 3 hours</text>
  <line x1="631.7808" y1="519.1305" x2="631.7808" y2="552.7536" stroke="var(--primary-border)" stroke-width="2" />
</svg>
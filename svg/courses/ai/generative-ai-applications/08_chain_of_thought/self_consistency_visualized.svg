<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="39.1304" text-anchor="middle" font-size="23.4783" font-weight="bold" fill="#333">Self-Consistency Visualized</text>
  <text x="640" y="75.1304" text-anchor="middle" font-size="17.2174" fill="#666">"If 3 shirts take 3 hours to dry, how long do 9 shirts take?"</text>
  <rect x="64" y="109.5652" width="208" height="187.8261" rx="7.8261" fill="#f8d7da" stroke="#dc3545" stroke-width="2.3478" />
  <text x="168" y="140.8696" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="#dc3545">Path 1</text>
  <text x="168" y="172.1739" text-anchor="middle" font-size="15.6522" fill="#555">3 shirts -&gt; 3h</text>
  <text x="168" y="195.6522" text-anchor="middle" font-size="15.6522" fill="#555">1 shirt -&gt; 1h</text>
  <text x="168" y="219.1304" text-anchor="middle" font-size="15.6522" fill="#555">9 shirts -&gt; 9h</text>
  <text x="168" y="278.6087" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="#dc3545">9 hours ✗</text>
  <rect x="304" y="109.5652" width="208" height="187.8261" rx="7.8261" fill="#d4edda" stroke="#28a745" stroke-width="2.3478" />
  <text x="408" y="140.8696" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="#28a745">Path 2</text>
  <text x="408" y="172.1739" text-anchor="middle" font-size="15.6522" fill="#555">Shirts dry in</text>
  <text x="408" y="195.6522" text-anchor="middle" font-size="15.6522" fill="#555">parallel.</text>
  <text x="408" y="219.1304" text-anchor="middle" font-size="15.6522" fill="#555">Same time needed</text>
  <text x="408" y="278.6087" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="#28a745">3 hours ✓</text>
  <rect x="544" y="109.5652" width="208" height="187.8261" rx="7.8261" fill="#f8d7da" stroke="#dc3545" stroke-width="2.3478" />
  <text x="648" y="140.8696" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="#dc3545">Path 3</text>
  <text x="648" y="172.1739" text-anchor="middle" font-size="15.6522" fill="#555">3 batches needed</text>
  <text x="648" y="195.6522" text-anchor="middle" font-size="15.6522" fill="#555">3 x 3 hours</text>
  <text x="648" y="278.6087" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="#dc3545">9 hours ✗</text>
  <rect x="784" y="109.5652" width="208" height="187.8261" rx="7.8261" fill="#d4edda" stroke="#28a745" stroke-width="2.3478" />
  <text x="888" y="140.8696" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="#28a745">Path 4</text>
  <text x="888" y="172.1739" text-anchor="middle" font-size="15.6522" fill="#555">Parallel drying.</text>
  <text x="888" y="195.6522" text-anchor="middle" font-size="15.6522" fill="#555">Not sequential.</text>
  <text x="888" y="278.6087" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="#28a745">3 hours ✓</text>
  <rect x="1024" y="109.5652" width="208" height="187.8261" rx="7.8261" fill="#d4edda" stroke="#28a745" stroke-width="2.3478" />
  <text x="1128" y="140.8696" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="#28a745">Path 5</text>
  <text x="1128" y="172.1739" text-anchor="middle" font-size="15.6522" fill="#555">All dry at once.</text>
  <text x="1128" y="195.6522" text-anchor="middle" font-size="15.6522" fill="#555">Simultaneously.</text>
  <text x="1128" y="278.6087" text-anchor="middle" font-size="17.2174" font-weight="bold" fill="#28a745">3 hours ✓</text>
  <line x1="168" y1="297.3913" x2="640" y2="375.6522" stroke="#dc3545" stroke-width="1.5652" />
  <line x1="408" y1="297.3913" x2="640" y2="375.6522" stroke="#28a745" stroke-width="1.5652" />
  <line x1="648" y1="297.3913" x2="640" y2="375.6522" stroke="#dc3545" stroke-width="1.5652" />
  <line x1="888" y1="297.3913" x2="640" y2="375.6522" stroke="#28a745" stroke-width="1.5652" />
  <line x1="1128" y1="297.3913" x2="640" y2="375.6522" stroke="#28a745" stroke-width="1.5652" />
  <rect x="352" y="375.6522" width="576" height="109.5652" rx="7.8261" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1304" />
  <text x="640" y="414.7826" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#4a90e2">MAJORITY VOTE</text>
  <text x="640" y="453.913" text-anchor="middle" font-size="18.7826" fill="#555">3 hours (3/5) vs 9 hours (2/5)</text>
  <rect x="416" y="516.5217" width="448" height="62.6087" rx="7.8261" fill="#d4edda" stroke="#28a745" stroke-width="3.1304" />
  <text x="640" y="557.2174" text-anchor="middle" font-size="21.913" font-weight="bold" fill="#28a745">Answer: 3 hours</text>
  <line x1="640" y1="485.2174" x2="640" y2="516.5217" stroke="#4a90e2" stroke-width="3.1304" />
</svg>
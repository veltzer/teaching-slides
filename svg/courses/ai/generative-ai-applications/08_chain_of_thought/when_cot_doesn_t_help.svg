<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="24.6154" y="15" width="1230.7692" height="690" rx="7.5" fill="#f8f9fa" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="67.5" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Tasks Where CoT Provides Little Benefit</text>
  <line x1="73.8462" y1="82.5" x2="1206.1538" y2="82.5" stroke="#4a90e2" stroke-width="3" />
  <rect x="73.8462" y="105" width="1132.3077" height="97.5" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="2.25" />
  <text x="123.0769" y="138" font-size="19.5" font-weight="bold" fill="#333">1. Simple Factual Recall</text>
  <text x="123.0769" y="165" font-size="16.5" fill="#555">"What is the capital of Japan?"</text>
  <text x="123.0769" y="190.5" font-size="16.5" fill="#dc3545">→ CoT adds unnecessary verbosity</text>
  <rect x="73.8462" y="217.5" width="1132.3077" height="97.5" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="2.25" />
  <text x="123.0769" y="250.5" font-size="19.5" font-weight="bold" fill="#333">2. Simple Classification</text>
  <text x="123.0769" y="277.5" font-size="16.5" fill="#555">"Is this email spam? Yes/No"</text>
  <text x="123.0769" y="303" font-size="16.5" fill="#dc3545">→ Direct answer is usually correct</text>
  <rect x="73.8462" y="330" width="1132.3077" height="97.5" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="2.25" />
  <text x="123.0769" y="363" font-size="19.5" font-weight="bold" fill="#333">3. Translation</text>
  <text x="123.0769" y="390" font-size="16.5" fill="#555">"Translate 'hello' to Spanish"</text>
  <text x="123.0769" y="415.5" font-size="16.5" fill="#dc3545">→ Direct generation is fine</text>
  <rect x="73.8462" y="442.5" width="1132.3077" height="97.5" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="2.25" />
  <text x="123.0769" y="475.5" font-size="19.5" font-weight="bold" fill="#333">4. Very Short Outputs</text>
  <text x="123.0769" y="502.5" font-size="16.5" fill="#555">"What color is the sky?"</text>
  <text x="123.0769" y="528" font-size="16.5" fill="#dc3545">→ CoT overhead not justified</text>
  <rect x="73.8462" y="555" width="1132.3077" height="97.5" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="2.25" />
  <text x="123.0769" y="588" font-size="19.5" font-weight="bold" fill="#333">5. Creative Tasks With No "Correct" Answer</text>
  <text x="123.0769" y="615" font-size="16.5" fill="#555">"Write a poem about rain"</text>
  <text x="123.0769" y="640.5" font-size="16.5" fill="#dc3545">→ Reasoning doesn't apply to creativity</text>
  <rect x="73.8462" y="667.5" width="1132.3077" height="30" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="640" y="690" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#28a745">Rule: Use CoT when the task requires MULTIPLE REASONING STEPS</text>
</svg>
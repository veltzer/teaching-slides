<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="500" height="460" rx="5" fill="#f8f9fa" stroke="#4a90e2" stroke-width="2"/>
  <text x="260" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Tasks Where CoT Provides Little Benefit</text>
  <line x1="30" y1="55" x2="490" y2="55" stroke="#4a90e2" stroke-width="2"/>
  <!-- 1. Simple factual recall -->
  <rect x="30" y="70" width="460" height="65" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="50" y="92" font-size="13" font-weight="bold" fill="#333">1. Simple Factual Recall</text>
  <text x="50" y="110" font-size="11" fill="#555">"What is the capital of Japan?"</text>
  <text x="50" y="127" font-size="11" fill="#dc3545">→ CoT adds unnecessary verbosity</text>
  <!-- 2. Simple classification -->
  <rect x="30" y="145" width="460" height="65" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="50" y="167" font-size="13" font-weight="bold" fill="#333">2. Simple Classification</text>
  <text x="50" y="185" font-size="11" fill="#555">"Is this email spam? Yes/No"</text>
  <text x="50" y="202" font-size="11" fill="#dc3545">→ Direct answer is usually correct</text>
  <!-- 3. Translation -->
  <rect x="30" y="220" width="460" height="65" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="50" y="242" font-size="13" font-weight="bold" fill="#333">3. Translation</text>
  <text x="50" y="260" font-size="11" fill="#555">"Translate 'hello' to Spanish"</text>
  <text x="50" y="277" font-size="11" fill="#dc3545">→ Direct generation is fine</text>
  <!-- 4. Very short outputs -->
  <rect x="30" y="295" width="460" height="65" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="50" y="317" font-size="13" font-weight="bold" fill="#333">4. Very Short Outputs</text>
  <text x="50" y="335" font-size="11" fill="#555">"What color is the sky?"</text>
  <text x="50" y="352" font-size="11" fill="#dc3545">→ CoT overhead not justified</text>
  <!-- 5. Creative tasks -->
  <rect x="30" y="370" width="460" height="65" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="50" y="392" font-size="13" font-weight="bold" fill="#333">5. Creative Tasks With No "Correct" Answer</text>
  <text x="50" y="410" font-size="11" fill="#555">"Write a poem about rain"</text>
  <text x="50" y="427" font-size="11" fill="#dc3545">→ Reasoning doesn't apply to creativity</text>
  <!-- Rule -->
  <rect x="30" y="445" width="460" height="20" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="260" y="460" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Rule: Use CoT when the task requires MULTIPLE REASONING STEPS</text>
</svg>

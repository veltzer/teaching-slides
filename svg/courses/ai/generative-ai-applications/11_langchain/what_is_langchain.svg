<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="831.489288" y="40" font-size="41.924093" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">LANGCHAIN</text>
  <rect x="40" y="91.428535" width="382.978715" height="157.142907" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.061835" filter="url(#shadow)"/>
  <text x="231.489426" y="157.14292" font-size="34.063267" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Models</text>
  <text x="231.489426" y="208.571456" font-size="31.442902" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(LLMs)</text>
  <rect x="448.510574" y="91.428535" width="382.978715" height="157.142907" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.061835" filter="url(#shadow)"/>
  <text x="639.999862" y="157.14292" font-size="34.063267" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Prompts</text>
  <text x="639.999862" y="208.571456" font-size="31.442902" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(Templ.)</text>
  <rect x="857.021285" y="91.428535" width="382.978715" height="157.142907" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.061835" filter="url(#shadow)"/>
  <text x="1048.510574" y="157.14292" font-size="34.063267" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Output Parsers</text>
  <text x="1048.510574" y="208.571456" font-size="31.442902" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(Structured)</text>
  <rect x="40" y="277.14288" width="382.978715" height="157.142907" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="8.061835" filter="url(#shadow)"/>
  <text x="231.489426" y="342.857134" font-size="34.063267" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Chains</text>
  <text x="231.489426" y="394.285669" font-size="31.442902" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(LCEL)</text>
  <rect x="448.510574" y="277.14288" width="382.978715" height="157.142907" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="8.061835" filter="url(#shadow)"/>
  <text x="639.999862" y="368.571402" font-size="34.063267" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Memory</text>
  <rect x="857.021285" y="277.14288" width="382.978715" height="157.142907" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="8.061835" filter="url(#shadow)"/>
  <text x="1048.510574" y="342.857134" font-size="34.063267" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Agents</text>
  <text x="1048.510574" y="394.285669" font-size="31.442902" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(Tools)</text>
  <rect x="40" y="462.857093" width="382.978715" height="157.142907" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="8.061835" filter="url(#shadow)"/>
  <text x="231.489426" y="528.571348" font-size="34.063267" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Document</text>
  <text x="231.489426" y="579.999883" font-size="31.442902" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Loaders</text>
  <rect x="448.510574" y="462.857093" width="382.978715" height="157.142907" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="8.061835" filter="url(#shadow)"/>
  <text x="639.999862" y="528.571348" font-size="34.063267" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Vector</text>
  <text x="639.999862" y="579.999883" font-size="31.442902" font-weight="normal" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Stores</text>
  <rect x="857.021285" y="462.857093" width="382.978715" height="157.142907" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="8.061835" filter="url(#shadow)"/>
  <text x="1048.510574" y="554.285615" font-size="34.063267" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Retrievers</text>
</svg>

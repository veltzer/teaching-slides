  <text x="640" y="563.6111" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)" text-anchor="middle">chain = prompt | llm | output_parser    response = chain.invoke({"question": "..."})</text>
  <text x="640" y="578.1111" font-family="Arial,sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">Supports streaming, async, batch, and parallel execution out of the box</text>

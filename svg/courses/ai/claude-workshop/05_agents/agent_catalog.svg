<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">The Agent Catalog</text>
  <rect x="40" y="100" width="380" height="520" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">Explore</text>
  <text x="230" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Read-only search</text>
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Find files and symbols</text>
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Grep across the repo</text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Cannot edit anything</text>
  <text x="60" y="360" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Cheap and parallel</text>
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-text)">Use when:</text>
  <text x="60" y="465" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">"Where is X defined?"</text>
  <text x="60" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">"Who calls Y?"</text>
  <text x="60" y="535" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">"List files matching Z"</text>
  <rect x="450" y="100" width="380" height="520" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">Plan</text>
  <text x="640" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Design and architecture</text>
  <text x="470" y="240" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Lays out an approach</text>
  <text x="470" y="280" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Identifies trade-offs</text>
  <text x="470" y="320" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">No file edits</text>
  <text x="470" y="360" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Returns a structured plan</text>
  <text x="470" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Use when:</text>
  <text x="470" y="465" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Before a big refactor</text>
  <text x="470" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Comparing approaches</text>
  <text x="470" y="535" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Risk-heavy changes</text>
  <rect x="860" y="100" width="380" height="520" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">General</text>
  <text x="1050" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">All tools, anything goes</text>
  <text x="880" y="240" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Full tool access</text>
  <text x="880" y="280" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Can edit and run code</text>
  <text x="880" y="320" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Pair with worktree</text>
  <text x="880" y="360" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">The default fallback</text>
  <text x="880" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Use when:</text>
  <text x="880" y="465" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Mixed work</text>
  <text x="880" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Building a feature</text>
  <text x="880" y="535" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">No fit for a specialist</text>
</svg>

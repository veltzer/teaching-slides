<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Agent on a Worktree</text>
  <rect x="40" y="100" width="240" height="160" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Main repo</text>
  <text x="160" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Untouched</text>
  <text x="160" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">You keep working</text>
  <rect x="340" y="100" width="240" height="160" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Spawn agent</text>
  <text x="460" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">isolation: worktree</text>
  <text x="460" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">git worktree add</text>
  <rect x="640" y="100" width="240" height="160" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Agent works</text>
  <text x="760" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Edits in the worktree</text>
  <text x="760" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Runs tests there</text>
  <rect x="940" y="100" width="300" height="160" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Review and merge</text>
  <text x="1090" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Diff branch vs main</text>
  <text x="1090" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Merge or discard</text>
  <path d="M 280 180 L 340 180" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 580 180 L 640 180" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 880 180 L 940 180" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="300" width="1200" height="320" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Why isolation helps</text>
  <text x="60" y="380" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Your working tree stays clean</text>
  <text x="60" y="415" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">You can keep editing in parallel</text>
  <text x="60" y="450" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">A bad change is contained</text>
  <text x="60" y="485" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Multiple agents cannot collide</text>
  <text x="60" y="520" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Review the diff before merging</text>
  <text x="60" y="570" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-muted)">Empty worktrees auto-clean; failures leave a path to inspect</text>
  <text x="60" y="600" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Right default for risky or large changes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">The Three MCP Primitives</text>
  <rect x="40" y="100" width="380" height="520" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Tools</text>
  <text x="230" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Actions the model can take</text>
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Run a query</text>
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Send a message</text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Create a ticket</text>
  <text x="60" y="360" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Open a URL</text>
  <text x="60" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Side effects expected</text>
  <text x="60" y="460" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Approval for risky ones</text>
  <text x="60" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">JSON in, JSON out</text>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Most common primitive</text>
  <rect x="450" y="100" width="380" height="520" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">Resources</text>
  <text x="640" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Data the model can read</text>
  <text x="470" y="240" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">A file or document</text>
  <text x="470" y="280" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">A page or record</text>
  <text x="470" y="320" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">A live data source</text>
  <text x="470" y="360" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Anything with a URI</text>
  <text x="470" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Read-only by convention</text>
  <text x="470" y="460" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Discoverable by URI</text>
  <text x="470" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Server controls contents</text>
  <text x="470" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Lazy-loaded into context</text>
  <rect x="860" y="100" width="380" height="520" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">Prompts</text>
  <text x="1050" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Reusable prompt templates</text>
  <text x="880" y="240" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">"Summarise this PR"</text>
  <text x="880" y="280" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">"Write release notes"</text>
  <text x="880" y="320" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">"Triage this ticket"</text>
  <text x="880" y="360" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">"Audit this config"</text>
  <text x="880" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">Discoverable by the client</text>
  <text x="880" y="460" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Take parameters</text>
  <text x="880" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Less commonly used</text>
  <text x="880" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Good for slash commands</text>
</svg>

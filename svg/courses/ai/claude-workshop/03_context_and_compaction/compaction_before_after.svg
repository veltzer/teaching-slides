<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Compaction: Before And After</text>
  <rect x="40" y="100" width="580" height="520" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Before</text>
  <text x="330" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Long session, near the limit</text>
  <text x="60" y="225" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Verbose tool outputs</text>
  <text x="60" y="255" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Full file contents you read</text>
  <text x="60" y="285" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Every assistant deliberation</text>
  <text x="60" y="315" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Every user clarification</text>
  <text x="60" y="345" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Old failed attempts</text>
  <text x="60" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">Symptoms:</text>
  <text x="60" y="425" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Drift from early rules</text>
  <text x="60" y="455" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Slow turns</text>
  <text x="60" y="485" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">High cost per question</text>
  <text x="60" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">"I forgot what we were doing"</text>
  <text x="60" y="565" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Cache misses grow</text>
  <rect x="660" y="100" width="580" height="520" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">After</text>
  <text x="950" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Earlier turns replaced by a summary</text>
  <text x="680" y="225" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Compact summary kept</text>
  <text x="680" y="255" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">CLAUDE.md and memory intact</text>
  <text x="680" y="285" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Current goal preserved</text>
  <text x="680" y="315" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Recent turns verbatim</text>
  <text x="680" y="345" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Pinned tasks survive</text>
  <text x="680" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Effects:</text>
  <text x="680" y="425" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Headroom for more work</text>
  <text x="680" y="455" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Faster turns</text>
  <text x="680" y="485" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Cheaper per question</text>
  <text x="680" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Sharp focus restored</text>
  <text x="680" y="565" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Exact tool outputs gone</text>
</svg>

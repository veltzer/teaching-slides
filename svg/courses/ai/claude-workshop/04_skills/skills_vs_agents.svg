<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Skills vs Sub-Agents</text>
  <rect x="40" y="100" width="580" height="520" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">Skill</text>
  <text x="330" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Reusable instruction set</text>
  <text x="60" y="235" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Runs in the main conversation</text>
  <text x="60" y="270" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Shares the main context</text>
  <text x="60" y="305" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Triggered by description match</text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Or invoked with /name</text>
  <text x="60" y="375" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Adds instructions, not isolation</text>
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-text)">Best for:</text>
  <text x="60" y="465" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Repeated, named workflows</text>
  <text x="60" y="500" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Team conventions as commands</text>
  <text x="60" y="535" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Light-weight rules to apply</text>
  <rect x="660" y="100" width="580" height="520" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Sub-Agent</text>
  <text x="950" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Second Claude in its own session</text>
  <text x="680" y="235" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Runs in a separate context</text>
  <text x="680" y="270" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Own tool set, own permissions</text>
  <text x="680" y="305" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Returns a single report</text>
  <text x="680" y="340" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Can run in parallel</text>
  <text x="680" y="375" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Main context stays clean</text>
  <text x="680" y="430" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">Best for:</text>
  <text x="680" y="465" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Heavy search or research</text>
  <text x="680" y="500" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Risky work in a worktree</text>
  <text x="680" y="535" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Parallel independent tasks</text>
</svg>

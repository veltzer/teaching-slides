<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">RAG vs Long Context vs Fine-Tuning</text>
  <rect x="40" y="100" width="380" height="520" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">RAG</text>
  <text x="230" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Retrieve, then generate</text>
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Good for:</text>
  <text x="60" y="275" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Large private corpora</text>
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Fresh data</text>
  <text x="60" y="345" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Citable answers</text>
  <text x="60" y="380" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Cost-sensitive serving</text>
  <text x="60" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Limits:</text>
  <text x="60" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Multi-hop reasoning is hard</text>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Quality rides on retrieval</text>
  <text x="60" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Pipeline complexity</text>
  <rect x="450" y="100" width="380" height="520" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Long context</text>
  <text x="640" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Stuff it all in</text>
  <text x="470" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Good for:</text>
  <text x="470" y="275" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Small or medium corpora</text>
  <text x="470" y="310" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Multi-hop reasoning</text>
  <text x="470" y="345" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Simple to set up</text>
  <text x="470" y="380" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">One-off analysis</text>
  <text x="470" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Limits:</text>
  <text x="470" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Token cost grows</text>
  <text x="470" y="510" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Latency grows</text>
  <text x="470" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Eventually hits the limit</text>
  <rect x="860" y="100" width="380" height="520" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Fine-tuning</text>
  <text x="1050" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Change the weights</text>
  <text x="880" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">Good for:</text>
  <text x="880" y="275" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Domain style or tone</text>
  <text x="880" y="310" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Structured output</text>
  <text x="880" y="345" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Behavior shaping</text>
  <text x="880" y="380" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Tasks with many examples</text>
  <text x="880" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">Limits:</text>
  <text x="880" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Slow to update</text>
  <text x="880" y="510" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Hard to cite</text>
  <text x="880" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Expensive to retrain</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Team Adoption Checklist</text>
  <rect x="40" y="100" width="580" height="100" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Config</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Commit CLAUDE.md, settings.json</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Set a project default model</text>
  <rect x="660" y="100" width="580" height="100" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Skills</text>
  <text x="680" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Capture 3 repeated workflows</text>
  <text x="680" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Versioned in the repo</text>
  <rect x="40" y="220" width="580" height="100" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Agents</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Explore for "where is X"</text>
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Worktree for risky changes</text>
  <rect x="660" y="220" width="580" height="100" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">MCP</text>
  <text x="680" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Wrap one internal tool</text>
  <text x="680" y="310" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Audit every server</text>
  <rect x="40" y="340" width="580" height="100" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="380" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Safety</text>
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Narrow allowlists</text>
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Hooks for lint and format</text>
  <rect x="660" y="340" width="580" height="100" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="380" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Context</text>
  <text x="680" y="410" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Compact on chapter breaks</text>
  <text x="680" y="430" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Watch the token meter</text>
  <rect x="40" y="460" width="1200" height="160" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Culture</text>
  <text x="640" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Always read the diff before merging AI-assisted work</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Share configs and skills across the team in the repo</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Measure adoption with PRs, build pass rates, and surveys</text>
  <text x="640" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">Trust but verify; the tools shift, fundamentals do not</text>
</svg>

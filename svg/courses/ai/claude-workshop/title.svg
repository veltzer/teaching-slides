<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Claude Workshop</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <line x1="640" y1="335" x2="330" y2="250" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="640" y1="335" x2="330" y2="420" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="640" y1="335" x2="950" y2="250" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="640" y1="335" x2="950" y2="420" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="640" y1="335" x2="640" y2="225" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="640" y1="335" x2="640" y2="445" stroke="var(--text-muted)" stroke-width="2"/>
  <circle cx="640" cy="335" r="62" fill="var(--warn-fill)"/>
  <path d="M640,295 L650,325 L680,335 L650,345 L640,375 L630,345 L600,335 L630,325 Z" fill="var(--warn-text)"/>
  <rect x="250" y="228" width="160" height="44" rx="22" fill="var(--primary-fill)"/>
  <text x="330" y="257" font-size="18" fill="var(--primary-text)">CLAUDE.md</text>
  <rect x="250" y="398" width="160" height="44" rx="22" fill="var(--ok-fill)"/>
  <text x="330" y="427" font-size="18" fill="var(--ok-text)">Skills</text>
  <rect x="870" y="228" width="160" height="44" rx="22" fill="var(--info-fill)"/>
  <text x="950" y="257" font-size="18" fill="var(--info-text)">Agents</text>
  <rect x="870" y="398" width="160" height="44" rx="22" fill="var(--danger-fill)"/>
  <text x="950" y="427" font-size="18" fill="var(--danger-text)">MCP</text>
  <rect x="560" y="203" width="160" height="44" rx="22" fill="var(--primary-accent)"/>
  <text x="640" y="232" font-size="18" fill="var(--primary-text)">Context</text>
  <rect x="560" y="423" width="160" height="44" rx="22" fill="var(--ok-accent)"/>
  <text x="640" y="452" font-size="18" fill="var(--ok-text)">RAG</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">configuration • context &amp; compaction • skills • agents • MCP • RAG</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

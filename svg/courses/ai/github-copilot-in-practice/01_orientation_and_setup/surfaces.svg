<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="490.0" y="220.0" width="300.0" height="140.0" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="272.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Copilot seat</text>
  <text x="640.0" y="297.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">one license</text>
  <text x="640.0" y="321.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">one policy set</text>
  <rect x="40.0" y="40.0" width="300.0" height="110.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0" y="89.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Completions</text>
  <text x="190.0" y="114.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">ghost text</text>
  <line x1="490.0" y1="290.0" x2="340.0" y2="95.0" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="40.0" y="180.0" width="300.0" height="110.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0" y="229.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Chat</text>
  <text x="190.0" y="254.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">ask questions</text>
  <line x1="490.0" y1="290.0" x2="340.0" y2="235.0" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="40.0" y="320.0" width="300.0" height="110.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0" y="369.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Edit mode</text>
  <text x="190.0" y="394.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">multi-file</text>
  <line x1="490.0" y1="290.0" x2="340.0" y2="375.0" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="40.0" y="460.0" width="300.0" height="110.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0" y="509.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Agent mode</text>
  <text x="190.0" y="534.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">runs tools</text>
  <line x1="490.0" y1="290.0" x2="340.0" y2="515.0" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="940.0" y="40.0" width="300.0" height="110.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090.0" y="89.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Coding agent</text>
  <text x="1090.0" y="114.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">issue to PR</text>
  <line x1="790.0" y1="290.0" x2="940.0" y2="95.0" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="940.0" y="180.0" width="300.0" height="110.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090.0" y="229.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Code review</text>
  <text x="1090.0" y="254.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">first pass</text>
  <line x1="790.0" y1="290.0" x2="940.0" y2="235.0" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="940.0" y="320.0" width="300.0" height="110.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090.0" y="369.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Website chat</text>
  <text x="1090.0" y="394.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Spaces</text>
  <line x1="790.0" y1="290.0" x2="940.0" y2="375.0" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="940.0" y="460.0" width="300.0" height="110.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090.0" y="509.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Copilot CLI</text>
  <text x="1090.0" y="534.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">terminal agent</text>
  <line x1="790.0" y1="290.0" x2="940.0" y2="515.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="190.0" y="620.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-muted)">in the IDE</text>
  <text x="1090.0" y="620.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-muted)">on GitHub and terminal</text>
</svg>

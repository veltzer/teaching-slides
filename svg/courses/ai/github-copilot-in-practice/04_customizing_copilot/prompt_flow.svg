<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="250.9" width="230.0" height="147.6" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.0" y="318.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Developer</text>
  <text x="155.0" y="344.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">types /new-endpoint</text>
  <rect x="360.0" y="250.9" width="260.0" height="147.6" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490.0" y="318.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Prompt file</text>
  <text x="490.0" y="344.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">template + inputs</text>
  <rect x="710.0" y="250.9" width="240.0" height="147.6" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="830.0" y="306.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Agent mode</text>
  <text x="830.0" y="332.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">tools from</text>
  <text x="830.0" y="357.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">front matter</text>
  <rect x="1040.0" y="250.9" width="200.0" height="147.6" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140.0" y="318.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Result</text>
  <text x="1140.0" y="344.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">files edited</text>
  <line x1="270.0" y1="324.7" x2="360.0" y2="324.7" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620.0" y1="324.7" x2="710.0" y2="324.7" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="665.0" y="316.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">filled in</text>
  <line x1="950.0" y1="324.7" x2="1040.0" y2="324.7" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="360.0" y="504.0" width="260.0" height="116.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="490.0" y="554.7" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--text)">${input:name}</text>
  <text x="490.0" y="580.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--text)">${selection}</text>
  <line x1="490.0" y1="398.5" x2="490.0" y2="504.0" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="710.0" y="504.0" width="240.0" height="116.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="830.0" y="554.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">+ instructions</text>
  <text x="830.0" y="580.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">still apply</text>
  <line x1="830.0" y1="398.5" x2="830.0" y2="504.0" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="40.0" y="40.0" width="1200.0" height="94.9" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="93.5" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="var(--text)">.github/prompts/new-endpoint.prompt.md</text>
</svg>

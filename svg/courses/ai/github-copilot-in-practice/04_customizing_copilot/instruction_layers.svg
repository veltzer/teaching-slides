<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="360.0" height="110.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.0" y="89.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Personal</text>
  <text x="220.0" y="114.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">your preferences</text>
  <rect x="40.0" y="200.0" width="360.0" height="110.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.0" y="249.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Repository</text>
  <text x="220.0" y="273.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">copilot-instructions.md</text>
  <rect x="40.0" y="360.0" width="360.0" height="110.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.0" y="409.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Path scoped</text>
  <text x="220.0" y="433.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">*.instructions.md + applyTo</text>
  <rect x="40.0" y="520.0" width="360.0" height="100.0" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.0" y="564.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Your prompt</text>
  <text x="220.0" y="589.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">plus #file, selection</text>
  <rect x="600.0" y="220.0" width="300.0" height="230.0" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="750.0" y="305.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">Request context</text>
  <text x="750.0" y="330.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--bg)">all layers</text>
  <text x="750.0" y="354.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--bg)">concatenated</text>
  <text x="750.0" y="378.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--bg)">no priority order</text>
  <rect x="1020.0" y="270.0" width="220.0" height="130.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1130.0" y="329.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Model</text>
  <text x="1130.0" y="354.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">one answer</text>
  <line x1="400.0" y1="95.0" x2="600.0" y2="335.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400.0" y1="255.0" x2="600.0" y2="335.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400.0" y1="415.0" x2="600.0" y2="335.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400.0" y1="570.0" x2="600.0" y2="335.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900.0" y1="335.0" x2="1020.0" y2="335.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="960.0" y="327.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">sent</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="300.0" height="580.0" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="190.0" y="337.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)">.github/</text>
  <rect x="420.0" y="80.0" width="440.0" height="80.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="125.4" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="var(--primary-text)">copilot-instructions.md</text>
  <text x="900.0" y="126.0" text-anchor="start" font-family="Arial, sans-serif" font-size="17" fill="var(--text-muted)">always on, whole repo</text>
  <line x1="340.0" y1="120.0" x2="420.0" y2="120.0" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="420.0" y="188.0" width="440.0" height="80.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="233.4" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="var(--ok-text)">instructions/*.instructions.md</text>
  <text x="900.0" y="234.0" text-anchor="start" font-family="Arial, sans-serif" font-size="17" fill="var(--text-muted)">on when applyTo matches</text>
  <line x1="340.0" y1="228.0" x2="420.0" y2="228.0" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="420.0" y="296.0" width="440.0" height="80.0" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="341.4" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="var(--warn-text)">prompts/*.prompt.md</text>
  <text x="900.0" y="342.0" text-anchor="start" font-family="Arial, sans-serif" font-size="17" fill="var(--text-muted)">on demand: /name</text>
  <line x1="340.0" y1="336.0" x2="420.0" y2="336.0" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="420.0" y="404.0" width="440.0" height="80.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="449.4" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="var(--info-text)">agents/*.agent.md</text>
  <text x="900.0" y="450.0" text-anchor="start" font-family="Arial, sans-serif" font-size="17" fill="var(--text-muted)">pick from agent dropdown</text>
  <line x1="340.0" y1="444.0" x2="420.0" y2="444.0" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="420.0" y="512.0" width="440.0" height="80.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="557.4" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="var(--text)">workflows/copilot-setup-steps.yml</text>
  <text x="900.0" y="558.0" text-anchor="start" font-family="Arial, sans-serif" font-size="17" fill="var(--text-muted)">coding agent setup</text>
  <line x1="340.0" y1="552.0" x2="420.0" y2="552.0" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1240.0" y1="40.0" x2="1240.0" y2="40.0" stroke="var(--text-muted)" stroke-width="2"/>
</svg>

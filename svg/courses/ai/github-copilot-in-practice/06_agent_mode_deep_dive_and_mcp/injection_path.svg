<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="240.0" height="162.4" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160.0" y="100.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Attacker</text>
  <text x="160.0" y="129.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">writes an issue</text>
  <text x="160.0" y="157.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">or a web page</text>
  <rect x="360.0" y="40.0" width="260.0" height="162.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490.0" y="100.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Tool result</text>
  <text x="490.0" y="129.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">issue body, page</text>
  <text x="490.0" y="157.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">text, query rows</text>
  <rect x="700.0" y="40.0" width="240.0" height="162.4" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="820.0" y="100.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Model</text>
  <text x="820.0" y="129.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">reads it as</text>
  <text x="820.0" y="157.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">instructions</text>
  <rect x="1020.0" y="40.0" width="220.0" height="162.4" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130.0" y="100.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Harm</text>
  <text x="1130.0" y="129.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">secrets leaked</text>
  <text x="1130.0" y="157.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">files deleted</text>
  <line x1="280.0" y1="121.2" x2="360.0" y2="121.2" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="620.0" y1="121.2" x2="700.0" y2="121.2" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="940.0" y1="121.2" x2="1020.0" y2="121.2" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="980.0" y="111.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">tool call</text>
  <rect x="40.0" y="341.6" width="380.0" height="278.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="460.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Least privilege</text>
  <text x="230.0" y="489.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">only needed tools</text>
  <text x="230.0" y="516.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">read-only tokens</text>
  <rect x="450.0" y="341.6" width="380.0" height="278.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="460.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Human approval</text>
  <text x="640.0" y="489.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">no auto-approve</text>
  <text x="640.0" y="516.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">for writes or network</text>
  <rect x="860.0" y="341.6" width="380.0" height="278.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.0" y="460.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Isolation</text>
  <text x="1050.0" y="489.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">container or</text>
  <text x="1050.0" y="516.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">throwaway branch</text>
  <text x="640.0" y="295.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-muted)">break the chain at any link</text>
</svg>

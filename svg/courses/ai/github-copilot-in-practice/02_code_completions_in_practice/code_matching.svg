<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="241.7" width="240.0" height="176.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160.0" y="322.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Model output</text>
  <text x="160.0" y="354.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">candidate suggestion</text>
  <rect x="380.0" y="216.5" width="300.0" height="227.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="530.0" y="292.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Match check</text>
  <text x="530.0" y="323.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">compared against public</text>
  <text x="530.0" y="354.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">code on GitHub</text>
  <text x="530.0" y="384.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">~150 characters</text>
  <line x1="280.0" y1="330.0" x2="380.0" y2="330.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="800.0" y="40.0" width="440.0" height="201.7" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020.0" y="118.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Policy: block</text>
  <text x="1020.0" y="149.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">matching suggestion</text>
  <text x="1020.0" y="180.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">is silently dropped</text>
  <rect x="800.0" y="418.3" width="440.0" height="201.7" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020.0" y="496.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Policy: allow</text>
  <text x="1020.0" y="528.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">shown with code reference:</text>
  <text x="1020.0" y="558.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">repo, license, location</text>
  <line x1="680.0" y1="292.2" x2="800.0" y2="140.9" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="710.0" y="206.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">match</text>
  <line x1="680.0" y1="367.8" x2="800.0" y2="519.1" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="710.0" y="468.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">match</text>
  <rect x="40.0" y="544.3" width="640.0" height="75.7" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="360.0" y="588.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">no match: suggestion shown normally</text>
</svg>

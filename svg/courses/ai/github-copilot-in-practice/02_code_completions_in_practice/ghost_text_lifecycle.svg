<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="200.0" height="183.2" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0" y="123.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">You type</text>
  <text x="140.0" y="160.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">pause ~100 ms</text>
  <rect x="340.0" y="40.0" width="220.0" height="183.2" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="450.0" y="104.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Prompt built</text>
  <text x="450.0" y="142.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">prefix + suffix</text>
  <text x="450.0" y="179.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">neighboring tabs</text>
  <rect x="660.0" y="40.0" width="200.0" height="183.2" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760.0" y="123.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Model</text>
  <text x="760.0" y="160.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">completion model</text>
  <rect x="960.0" y="40.0" width="280.0" height="183.2" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="1100.0" y="123.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)">Ghost text</text>
  <text x="1100.0" y="160.8" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)">grey, not yet code</text>
  <line x1="240.0" y1="131.6" x2="340.0" y2="131.6" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560.0" y1="131.6" x2="660.0" y2="131.6" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860.0" y1="131.6" x2="960.0" y2="131.6" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="40.0" y="436.8" width="260.0" height="183.2" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.0" y="519.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Tab</text>
  <text x="170.0" y="557.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">accept all</text>
  <rect x="350.0" y="436.8" width="260.0" height="183.2" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480.0" y="519.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Ctrl+Right</text>
  <text x="480.0" y="557.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">accept one word</text>
  <rect x="660.0" y="436.8" width="260.0" height="183.2" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790.0" y="519.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Alt+]</text>
  <text x="790.0" y="557.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">next alternative</text>
  <rect x="970.0" y="436.8" width="270.0" height="183.2" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.0" y="519.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Esc</text>
  <text x="1105.0" y="557.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">dismiss</text>
  <line x1="1100.0" y1="223.2" x2="170.0" y2="436.8" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="1100.0" y1="223.2" x2="480.0" y2="436.8" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="1100.0" y1="223.2" x2="790.0" y2="436.8" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="1100.0" y1="223.2" x2="1105.0" y2="436.8" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
</svg>

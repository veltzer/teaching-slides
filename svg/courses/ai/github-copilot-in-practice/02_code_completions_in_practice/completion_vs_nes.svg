<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="560.0" height="70.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320.0" y="81.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Inline completion</text>
  <rect x="40.0" y="140.0" width="560.0" height="400.0" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="320.0" y="297.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)">def area(w, h):</text>
  <text x="320.0" y="321.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)">    return w * h|</text>
  <text x="320.0" y="345.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)"></text>
  <text x="320.0" y="369.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)">      ghost text appears</text>
  <text x="320.0" y="393.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)">      at the cursor only</text>
  <rect x="680.0" y="40.0" width="560.0" height="70.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960.0" y="81.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Next edit suggestion</text>
  <rect x="680.0" y="140.0" width="560.0" height="400.0" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="960.0" y="285.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)">def area(width, h):  &lt;- you edit</text>
  <text x="960.0" y="309.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)"></text>
  <text x="960.0" y="333.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)">    return w * h</text>
  <text x="960.0" y="357.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)"></text>
  <text x="960.0" y="381.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)">arrow in gutter: line 3</text>
  <text x="960.0" y="405.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)">Tab jumps, Tab accepts</text>
  <line x1="702.0" y1="288.0" x2="702.0" y2="330.0" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <rect x="40.0" y="570.0" width="1200.0" height="50.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="600.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">completions follow the cursor, NES follows the edit</text>
</svg>

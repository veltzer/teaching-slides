<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="440.0" y="40.0" width="400.0" height="98.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="83.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Next few lines?</text>
  <text x="640.0" y="110.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">in this file</text>
  <rect x="40.0" y="258.9" width="360.0" height="120.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.0" y="312.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Completion</text>
  <text x="220.0" y="340.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">comment, name or signature</text>
  <rect x="880.0" y="258.9" width="360.0" height="120.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060.0" y="312.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Is it a dialogue?</text>
  <text x="1060.0" y="340.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">explain, compare, refine</text>
  <line x1="540.0" y1="138.5" x2="220.0" y2="258.9" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="360.0" y="189.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">yes</text>
  <line x1="740.0" y1="138.5" x2="1060.0" y2="258.9" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="920.0" y="189.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">no</text>
  <rect x="640.0" y="499.6" width="300.0" height="120.4" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790.0" y="553.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Chat</text>
  <text x="790.0" y="580.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">ask, inline chat</text>
  <rect x="980.0" y="499.6" width="260.0" height="120.4" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.0" y="553.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Edit / Agent</text>
  <text x="1110.0" y="580.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">many files</text>
  <line x1="1000.0" y1="379.2" x2="790.0" y2="499.6" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="865.0" y="430.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">yes</text>
  <line x1="1120.0" y1="379.2" x2="1110.0" y2="499.6" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="1145.0" y="430.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">no</text>
  <rect x="40.0" y="499.6" width="360.0" height="120.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="220.0" y="553.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Stay in flow</text>
  <text x="220.0" y="580.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">no context switch</text>
  <line x1="220.0" y1="379.2" x2="220.0" y2="499.6" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

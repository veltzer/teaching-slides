<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="300.0" height="105.5" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0" y="99.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">What is the task?</text>
  <rect x="40.0" y="187.6" width="420.0" height="73.8" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="250.0" y="230.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Next few lines while typing?</text>
  <rect x="600.0" y="187.6" width="300.0" height="73.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.0" y="231.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Completions</text>
  <line x1="460.0" y1="224.5" x2="600.0" y2="224.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530.0" y="216.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">yes</text>
  <rect x="40.0" y="277.3" width="420.0" height="73.8" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="250.0" y="320.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">A question or explanation?</text>
  <rect x="600.0" y="277.3" width="300.0" height="73.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.0" y="320.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Ask mode</text>
  <line x1="460.0" y1="314.2" x2="600.0" y2="314.2" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530.0" y="305.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">yes</text>
  <rect x="40.0" y="366.9" width="420.0" height="73.8" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="250.0" y="409.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Known change, known files?</text>
  <rect x="600.0" y="366.9" width="300.0" height="73.8" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.0" y="410.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Edit mode</text>
  <line x1="460.0" y1="403.8" x2="600.0" y2="403.8" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530.0" y="395.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">yes</text>
  <rect x="40.0" y="456.5" width="420.0" height="73.8" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="250.0" y="499.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Must run, test and iterate?</text>
  <rect x="600.0" y="456.5" width="300.0" height="73.8" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.0" y="500.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Agent mode</text>
  <line x1="460.0" y1="493.5" x2="600.0" y2="493.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530.0" y="485.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">yes</text>
  <rect x="40.0" y="546.2" width="420.0" height="73.8" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="250.0" y="589.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Whole issue, async, a PR?</text>
  <rect x="600.0" y="546.2" width="300.0" height="73.8" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.0" y="589.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Coding agent</text>
  <line x1="460.0" y1="583.1" x2="600.0" y2="583.1" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530.0" y="574.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">yes</text>
  <line x1="190.0" y1="145.5" x2="190.0" y2="187.6" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="980.0" y="187.6" width="260.0" height="432.4" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="1110.0" y="359.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Cost and risk</text>
  <text x="1110.0" y="385.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">grow downward:</text>
  <text x="1110.0" y="410.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">more autonomy,</text>
  <text x="1110.0" y="435.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">more review,</text>
  <text x="1110.0" y="460.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">more requests</text>
  <line x1="1220.0" y1="208.7" x2="1220.0" y2="598.9" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
</svg>

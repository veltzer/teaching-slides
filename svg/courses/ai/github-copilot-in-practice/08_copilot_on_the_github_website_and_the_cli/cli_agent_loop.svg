<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="225.6" width="208.3" height="162.4" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="144.1" y="286.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">You</text>
  <text x="144.1" y="315.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">prompt in</text>
  <text x="144.1" y="342.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">terminal</text>
  <rect x="357.4" y="225.6" width="228.1" height="162.4" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="471.4" y="300.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">copilot</text>
  <text x="471.4" y="329.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">plans next step</text>
  <rect x="694.5" y="40.0" width="247.9" height="162.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="818.5" y="100.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Permission check</text>
  <text x="818.5" y="129.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">allow / deny</text>
  <text x="818.5" y="157.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">or ask you</text>
  <rect x="694.5" y="434.4" width="247.9" height="162.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="818.5" y="509.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Tool runs</text>
  <text x="818.5" y="537.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">shell, edit, MCP</text>
  <rect x="1041.7" y="225.6" width="198.3" height="162.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1140.8" y="300.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Result</text>
  <text x="1140.8" y="329.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">fed back</text>
  <rect x="357.4" y="515.6" width="228.1" height="104.4" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="471.4" y="573.7" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)">trusted directory</text>
  <line x1="248.3" y1="306.8" x2="357.4" y2="306.8" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="585.5" y1="272.0" x2="694.5" y2="121.2" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="818.5" y1="202.4" x2="818.5" y2="434.4" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="830.4" y="309.1" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">approved</text>
  <line x1="942.5" y1="515.6" x2="1041.7" y2="341.6" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="1041.7" y1="272.0" x2="585.5" y2="260.4" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="813.6" y="250.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">iterate until done</text>
  <line x1="471.4" y1="388.0" x2="471.4" y2="515.6" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 6"/>
</svg>

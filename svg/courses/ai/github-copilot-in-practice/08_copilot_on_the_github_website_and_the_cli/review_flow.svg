<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="226.2" height="124.3" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.1" y="96.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Push / open PR</text>
  <text x="153.1" y="121.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">ready for review</text>
  <rect x="40.0" y="267.9" width="226.2" height="124.3" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.1" y="311.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Ruleset</text>
  <text x="153.1" y="337.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">auto-request</text>
  <text x="153.1" y="362.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Copilot review</text>
  <rect x="40.0" y="495.7" width="226.2" height="124.3" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="153.1" y="539.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Manual</text>
  <text x="153.1" y="565.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">add Copilot</text>
  <text x="153.1" y="590.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">as reviewer</text>
  <rect x="364.6" y="226.4" width="255.7" height="207.1" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492.5" y="311.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Copilot review</text>
  <text x="492.5" y="337.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">reads the diff</text>
  <text x="492.5" y="362.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">and instructions</text>
  <rect x="364.6" y="495.7" width="255.7" height="124.3" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="492.5" y="551.1" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="var(--text)">copilot-instructions.md</text>
  <text x="492.5" y="573.9" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="var(--text)">*.instructions.md</text>
  <rect x="718.7" y="226.4" width="226.2" height="207.1" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="831.8" y="311.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Comment review</text>
  <text x="831.8" y="337.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">inline comments</text>
  <text x="831.8" y="362.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">suggested changes</text>
  <rect x="1023.6" y="102.1" width="216.4" height="165.7" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1131.8" y="166.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Human reviewer</text>
  <text x="1131.8" y="192.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">approves or</text>
  <text x="1131.8" y="217.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">requests changes</text>
  <rect x="1023.6" y="392.1" width="216.4" height="165.7" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1131.8" y="456.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Never</text>
  <text x="1131.8" y="482.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">approves</text>
  <text x="1131.8" y="507.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">never blocks</text>
  <line x1="266.2" y1="102.1" x2="364.6" y2="267.9" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="266.2" y1="330.0" x2="364.6" y2="330.0" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="266.2" y1="557.9" x2="364.6" y2="392.1" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="492.5" y1="495.7" x2="492.5" y2="433.6" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <line x1="620.3" y1="330.0" x2="718.7" y2="330.0" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="944.9" y1="288.6" x2="1023.6" y2="185.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="944.9" y1="371.4" x2="1023.6" y2="475.0" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-danger)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="1200.0" height="90.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="91.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Is this a good coding agent task?</text>
  <rect x="40.0" y="190.0" width="360.0" height="140.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="220.0" y="254.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Scoped?</text>
  <text x="220.0" y="279.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">a few files, one concern</text>
  <rect x="460.0" y="190.0" width="360.0" height="140.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="254.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Verifiable?</text>
  <text x="640.0" y="279.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">tests or build prove it</text>
  <rect x="880.0" y="190.0" width="360.0" height="140.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1060.0" y="242.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Specified?</text>
  <text x="1060.0" y="267.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">acceptance criteria</text>
  <text x="1060.0" y="291.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">written down</text>
  <line x1="220.0" y1="130.0" x2="220.0" y2="190.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640.0" y1="130.0" x2="640.0" y2="190.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1060.0" y1="130.0" x2="1060.0" y2="190.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40.0" y="420.0" width="560.0" height="200.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320.0" y="490.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">All three: delegate</text>
  <text x="320.0" y="515.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">bug with repro, tests,</text>
  <text x="320.0" y="539.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">dependency bump, docs,</text>
  <text x="320.0" y="563.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">small feature</text>
  <rect x="680.0" y="420.0" width="560.0" height="200.0" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960.0" y="490.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Any missing: keep it</text>
  <text x="960.0" y="515.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">vague redesign, flaky infra,</text>
  <text x="960.0" y="539.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">cross-repo change,</text>
  <text x="960.0" y="563.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">security-sensitive logic</text>
  <line x1="440.0" y1="330.0" x2="320.0" y2="420.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="360.0" y="367.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">yes</text>
  <line x1="840.0" y1="330.0" x2="960.0" y2="420.0" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="920.0" y="367.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">no</text>
</svg>

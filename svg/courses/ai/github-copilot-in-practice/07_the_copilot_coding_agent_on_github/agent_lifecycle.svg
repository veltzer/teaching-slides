<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="200.0" height="140.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0" y="92.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Issue</text>
  <text x="140.0" y="117.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">assigned to</text>
  <text x="140.0" y="141.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Copilot</text>
  <rect x="290.0" y="40.0" width="220.0" height="140.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400.0" y="92.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Actions runner</text>
  <text x="400.0" y="117.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">ephemeral</text>
  <text x="400.0" y="141.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">sandbox</text>
  <rect x="560.0" y="40.0" width="200.0" height="140.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.0" y="104.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Branch</text>
  <text x="660.0" y="129.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">copilot/...</text>
  <rect x="810.0" y="40.0" width="200.0" height="140.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="910.0" y="104.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Draft PR</text>
  <text x="910.0" y="129.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">commits pushed</text>
  <rect x="1060.0" y="40.0" width="180.0" height="140.0" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150.0" y="104.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">You review</text>
  <text x="1150.0" y="129.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">comments</text>
  <line x1="240.0" y1="110.0" x2="290.0" y2="110.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510.0" y1="110.0" x2="560.0" y2="110.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760.0" y1="110.0" x2="810.0" y2="110.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1010.0" y1="110.0" x2="1060.0" y2="110.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="290.0" y="300.0" width="720.0" height="120.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="650.0" y="354.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Agent loop inside the runner</text>
  <text x="650.0" y="379.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">read code, edit, build, test, repeat</text>
  <line x1="400.0" y1="180.0" x2="400.0" y2="300.0" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="900.0" y1="300.0" x2="900.0" y2="180.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="930.0" y="232.0" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">push</text>
  <line x1="1150.0" y1="180.0" x2="1150.0" y2="520.0" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="1150.0" y1="520.0" x2="650.0" y2="520.0" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="650.0" y1="520.0" x2="650.0" y2="420.0" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="662.0" y="462.0" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">@copilot feedback</text>
  <rect x="40.0" y="480.0" width="420.0" height="140.0" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="250.0" y="531.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">only users with write access</text>
  <text x="250.0" y="555.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">can assign or steer</text>
  <text x="250.0" y="579.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">CI on its PR needs approval</text>
</svg>

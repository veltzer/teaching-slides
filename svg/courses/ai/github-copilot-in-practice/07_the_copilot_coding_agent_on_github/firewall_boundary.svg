<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="520.0" height="580.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="300.0" y="80.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Agent environment</text>
  <rect x="80.0" y="120.0" width="440.0" height="100.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300.0" y="164.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Copilot agent</text>
  <text x="300.0" y="189.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">edits, runs commands</text>
  <rect x="80.0" y="260.0" width="440.0" height="100.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300.0" y="304.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Setup steps</text>
  <text x="300.0" y="329.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">run before firewall</text>
  <rect x="80.0" y="400.0" width="440.0" height="100.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300.0" y="444.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">MCP servers</text>
  <text x="300.0" y="469.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">from repo settings</text>
  <rect x="80.0" y="530.0" width="440.0" height="70.0" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="300.0" y="570.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--bg)">secrets: copilot environment</text>
  <rect x="620.0" y="40.0" width="80.0" height="580.0" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.0" y="340.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">firewall</text>
  <rect x="800.0" y="80.0" width="440.0" height="140.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020.0" y="132.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Allowed</text>
  <text x="1020.0" y="157.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">package registries</text>
  <text x="1020.0" y="181.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">GitHub, container registries</text>
  <rect x="800.0" y="260.0" width="440.0" height="140.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020.0" y="312.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Custom allowlist</text>
  <text x="1020.0" y="337.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">your internal mirrors</text>
  <text x="1020.0" y="361.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">added in repo settings</text>
  <rect x="800.0" y="440.0" width="440.0" height="140.0" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020.0" y="492.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Blocked</text>
  <text x="1020.0" y="517.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">everything else</text>
  <text x="1020.0" y="541.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">shown as warning in PR</text>
  <line x1="520.0" y1="170.0" x2="800.0" y2="150.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="520.0" y1="310.0" x2="800.0" y2="330.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="520.0" y1="450.0" x2="620.0" y2="490.0" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-danger)"/>
</svg>

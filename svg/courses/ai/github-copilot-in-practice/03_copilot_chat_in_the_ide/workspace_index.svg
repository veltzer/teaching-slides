<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="193.2" width="220.0" height="175.1" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.0" y="261.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Repository</text>
  <text x="150.0" y="288.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">source files</text>
  <text x="150.0" y="314.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">docs, config</text>
  <rect x="350.0" y="40.0" width="280.0" height="153.2" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490.0" y="97.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Remote index</text>
  <text x="490.0" y="124.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">GitHub repos</text>
  <text x="490.0" y="150.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">semantic search</text>
  <rect x="350.0" y="368.3" width="280.0" height="153.2" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490.0" y="425.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Local index</text>
  <text x="490.0" y="452.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">no GitHub remote</text>
  <text x="490.0" y="479.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">smaller, slower</text>
  <rect x="720.0" y="193.2" width="240.0" height="175.1" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840.0" y="261.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">#codebase</text>
  <text x="840.0" y="288.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">retrieves the</text>
  <text x="840.0" y="314.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">relevant chunks</text>
  <rect x="1050.0" y="193.2" width="190.0" height="175.1" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1145.0" y="261.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Answer</text>
  <text x="1145.0" y="288.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">grounded in</text>
  <text x="1145.0" y="314.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">your code</text>
  <line x1="260.0" y1="247.9" x2="350.0" y2="116.6" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="305.0" y="173.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">pushed</text>
  <line x1="260.0" y1="313.6" x2="350.0" y2="444.9" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="305.0" y="370.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">opened</text>
  <line x1="630.0" y1="116.6" x2="720.0" y2="247.9" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="630.0" y1="444.9" x2="720.0" y2="313.6" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="960.0" y1="280.8" x2="1050.0" y2="280.8" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="40.0" y="565.3" width="1200.0" height="54.7" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="598.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">No index means keyword search over a few files: shallow answers</text>
</svg>

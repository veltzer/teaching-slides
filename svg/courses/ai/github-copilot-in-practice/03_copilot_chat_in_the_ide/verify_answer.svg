<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="240.0" height="145.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160.0" y="120.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Answer arrives</text>
  <rect x="370.0" y="40.0" width="300.0" height="145.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="520.0" y="105.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Expand References</text>
  <text x="520.0" y="137.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">which files were used?</text>
  <rect x="760.0" y="40.0" width="260.0" height="145.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="890.0" y="105.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Names match?</text>
  <text x="890.0" y="137.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">real symbols, paths</text>
  <rect x="1100.0" y="40.0" width="140.0" height="145.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1170.0" y="105.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Trust</text>
  <text x="1170.0" y="137.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">then test</text>
  <rect x="370.0" y="382.7" width="300.0" height="158.2" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520.0" y="438.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Generic answer</text>
  <text x="520.0" y="471.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">no references</text>
  <text x="520.0" y="502.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">invented helpers</text>
  <rect x="760.0" y="382.7" width="480.0" height="158.2" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000.0" y="454.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Re-ask with context</text>
  <text x="1000.0" y="487.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">#codebase, #file, or narrower question</text>
  <line x1="280.0" y1="112.5" x2="370.0" y2="112.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670.0" y1="112.5" x2="760.0" y2="112.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="715.0" y="102.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">yes</text>
  <line x1="1020.0" y1="112.5" x2="1100.0" y2="112.5" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="1060.0" y="102.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">yes</text>
  <line x1="520.0" y1="185.0" x2="520.0" y2="382.7" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="550.0" y="283.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">none</text>
  <line x1="890.0" y1="185.0" x2="890.0" y2="382.7" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="910.0" y="283.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">no</text>
  <line x1="670.0" y1="461.8" x2="760.0" y2="461.8" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="1000.0" y1="540.9" x2="1000.0" y2="620.0" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="1000.0" y1="620.0" x2="160.0" y2="620.0" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="160.0" y1="620.0" x2="160.0" y2="185.0" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="190.0" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">retry</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="200.0" height="165.7" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0" y="116.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Decide</text>
  <text x="140.0" y="145.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">policies, budget</text>
  <rect x="290.0" y="40.0" width="200.0" height="165.7" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390.0" y="116.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Pilot</text>
  <text x="390.0" y="145.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">20-50 volunteers</text>
  <line x1="240.0" y1="122.9" x2="290.0" y2="122.9" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540.0" y="40.0" width="200.0" height="165.7" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="116.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Measure</text>
  <text x="640.0" y="145.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">baseline vs pilot</text>
  <line x1="490.0" y1="122.9" x2="540.0" y2="122.9" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="790.0" y="40.0" width="200.0" height="165.7" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890.0" y="116.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Train</text>
  <text x="890.0" y="145.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">champions per team</text>
  <line x1="740.0" y1="122.9" x2="790.0" y2="122.9" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1040.0" y="40.0" width="200.0" height="165.7" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140.0" y="116.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Expand</text>
  <text x="1140.0" y="145.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">team by team</text>
  <line x1="990.0" y1="122.9" x2="1040.0" y2="122.9" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40.0" y="347.8" width="1200.0" height="118.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="413.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">written instructions, prompt files and an internal FAQ go live before the pilot</text>
  <line x1="1140.0" y1="205.7" x2="1140.0" y2="572.7" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-danger)"/>
  <line x1="1140.0" y1="572.7" x2="140.0" y2="572.7" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-danger)"/>
  <text x="640.0" y="620.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">review metrics and policies every quarter</text>
  <line x1="140.0" y1="572.7" x2="140.0" y2="466.1" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-danger)"/>
</svg>

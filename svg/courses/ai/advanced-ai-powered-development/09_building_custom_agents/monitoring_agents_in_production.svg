<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,264.4899 15.929,0" fill="#333" />
    </marker>
  </defs>
  <rect width="220.2513" height="640" fill="var(--surface)" rx="6"/>
  <text x="110.1256" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Monitoring Agents in Production</text>
  <rect x="5.5063" y="128" width="42.6737" height="144" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="26.7055" y="184" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Agent Runs</text>
  <text x="26.7055" y="219.2" text-anchor="middle" fill="var(--primary-accent)" font-size="10">tool calls</text>
  <text x="26.7055" y="251.2" text-anchor="middle" fill="var(--primary-accent)" font-size="10">completions</text>
  <line x1="48.18" y1="200" x2="57.816" y2="200" stroke="var(--text)" stroke-width="0.5506" marker-end="url(#arr)" />
  <rect x="57.816" y="128" width="42.6737" height="144" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="79.0152" y="184" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Log + Trace</text>
  <text x="79.0152" y="219.2" text-anchor="middle" fill="var(--info-accent)" font-size="10">inputs / outputs</text>
  <text x="79.0152" y="251.2" text-anchor="middle" fill="var(--info-accent)" font-size="10">latency / tokens</text>
  <line x1="100.4897" y1="200" x2="110.1256" y2="200" stroke="var(--text)" stroke-width="0.5506" marker-end="url(#arr)" />
  <rect x="110.1256" y="128" width="42.6737" height="144" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="131.3248" y="184" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Dashboard</text>
  <text x="131.3248" y="219.2" text-anchor="middle" fill="var(--warn-accent)" font-size="10">success rates</text>
  <text x="131.3248" y="251.2" text-anchor="middle" fill="var(--warn-accent)" font-size="10">cost per task</text>
  <line x1="152.7993" y1="200" x2="162.4353" y2="200" stroke="var(--text)" stroke-width="0.5506" marker-end="url(#arr)" />
  <rect x="162.4353" y="128" width="52.3097" height="144" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="188.5902" y="184" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Alerts</text>
  <text x="188.5902" y="219.2" text-anchor="middle" fill="var(--danger-accent)" font-size="10">cost spikes</text>
  <text x="188.5902" y="251.2" text-anchor="middle" fill="var(--danger-accent)" font-size="10">quality drift</text>
  <rect x="5.5063" y="336" width="209.2387" height="280" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="110.1256" y="384" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Key Metrics to Track</text>
  <rect x="11.0126" y="412.8" width="45.4268" height="176" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="33.5883" y="456" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Tool Calls</text>
  <text x="33.5883" y="492.8" text-anchor="middle" font-size="10" fill="var(--text)">inputs + outputs</text>
  <text x="33.5883" y="524.8" text-anchor="middle" font-size="10" fill="var(--text)">latency per call</text>
  <text x="33.5883" y="556.8" text-anchor="middle" font-size="10" fill="var(--text)">error rate</text>
  <rect x="60.5691" y="412.8" width="45.4268" height="176" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="83.1449" y="456" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Tracing</text>
  <text x="83.1449" y="492.8" text-anchor="middle" font-size="10" fill="var(--text)">trace ID per run</text>
  <text x="83.1449" y="524.8" text-anchor="middle" font-size="10" fill="var(--text)">link tool calls</text>
  <text x="83.1449" y="556.8" text-anchor="middle" font-size="10" fill="var(--text)">multi-turn flows</text>
  <rect x="110.1256" y="412.8" width="45.4268" height="176" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="132.7014" y="456" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Cost</text>
  <text x="132.7014" y="492.8" text-anchor="middle" font-size="10" fill="var(--text)">tokens per task</text>
  <text x="132.7014" y="524.8" text-anchor="middle" font-size="10" fill="var(--text)">cost per agent</text>
  <text x="132.7014" y="556.8" text-anchor="middle" font-size="10" fill="var(--text)">budget alerts</text>
  <rect x="159.6822" y="412.8" width="48.18" height="176" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="183.6345" y="456" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Guardrails</text>
  <text x="183.6345" y="492.8" text-anchor="middle" font-size="10" fill="var(--text)">max iterations</text>
  <text x="183.6345" y="524.8" text-anchor="middle" font-size="10" fill="var(--text)">timeout limits</text>
  <text x="183.6345" y="556.8" text-anchor="middle" font-size="10" fill="var(--text)">quality drift flag</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,264.4899 15.929,0" fill="#333" />
    </marker>
  </defs>
  <rect width="199.6027" height="580" fill="var(--surface)" rx="6" x="540.1986" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Monitoring Agents in Production</text>
  <rect x="545.1887" y="156" width="38.673" height="130.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="564.4005" y="206.75" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Agent Runs</text>
  <text x="564.4005" y="238.65" text-anchor="middle" fill="var(--primary-accent)" font-size="10">tool calls</text>
  <text x="564.4005" y="267.65" text-anchor="middle" fill="var(--primary-accent)" font-size="10">completions</text>
  <line x1="583.8618" y1="221.25" x2="592.5944" y2="221.25" stroke="var(--text)" stroke-width="0.5506" marker-end="url(#arr)" />
  <rect x="592.5944" y="156" width="38.673" height="130.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="611.8062" y="206.75" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Log + Trace</text>
  <text x="611.8062" y="238.65" text-anchor="middle" fill="var(--info-accent)" font-size="10">inputs / outputs</text>
  <text x="611.8062" y="267.65" text-anchor="middle" fill="var(--info-accent)" font-size="10">latency / tokens</text>
  <line x1="631.2674" y1="221.25" x2="640" y2="221.25" stroke="var(--text)" stroke-width="0.5506" marker-end="url(#arr)" />
  <rect x="640" y="156" width="38.673" height="130.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="659.2117" y="206.75" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Dashboard</text>
  <text x="659.2117" y="238.65" text-anchor="middle" fill="var(--warn-accent)" font-size="10">success rates</text>
  <text x="659.2117" y="267.65" text-anchor="middle" fill="var(--warn-accent)" font-size="10">cost per task</text>
  <line x1="678.673" y1="221.25" x2="687.4056" y2="221.25" stroke="var(--text)" stroke-width="0.5506" marker-end="url(#arr)" />
  <rect x="687.4056" y="156" width="47.4057" height="130.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="711.1085" y="206.75" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Alerts</text>
  <text x="711.1085" y="238.65" text-anchor="middle" fill="var(--danger-accent)" font-size="10">cost spikes</text>
  <text x="711.1085" y="267.65" text-anchor="middle" fill="var(--danger-accent)" font-size="10">quality drift</text>
  <rect x="545.1887" y="344.5" width="189.6226" height="253.75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="388" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Key Metrics to Track</text>
  <rect x="550.1788" y="414.1" width="41.168" height="159.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="570.638" y="453.25" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Tool Calls</text>
  <text x="570.638" y="486.6" text-anchor="middle" font-size="10" fill="var(--text)">inputs + outputs</text>
  <text x="570.638" y="515.6" text-anchor="middle" font-size="10" fill="var(--text)">latency per call</text>
  <text x="570.638" y="544.6" text-anchor="middle" font-size="10" fill="var(--text)">error rate</text>
  <rect x="595.0894" y="414.1" width="41.168" height="159.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="615.5487" y="453.25" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Tracing</text>
  <text x="615.5487" y="486.6" text-anchor="middle" font-size="10" fill="var(--text)">trace ID per run</text>
  <text x="615.5487" y="515.6" text-anchor="middle" font-size="10" fill="var(--text)">link tool calls</text>
  <text x="615.5487" y="544.6" text-anchor="middle" font-size="10" fill="var(--text)">multi-turn flows</text>
  <rect x="640" y="414.1" width="41.168" height="159.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="660.4593" y="453.25" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Cost</text>
  <text x="660.4593" y="486.6" text-anchor="middle" font-size="10" fill="var(--text)">tokens per task</text>
  <text x="660.4593" y="515.6" text-anchor="middle" font-size="10" fill="var(--text)">cost per agent</text>
  <text x="660.4593" y="544.6" text-anchor="middle" font-size="10" fill="var(--text)">budget alerts</text>
  <rect x="684.9106" y="414.1" width="43.6631" height="159.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="706.6174" y="453.25" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Guardrails</text>
  <text x="706.6174" y="486.6" text-anchor="middle" font-size="10" fill="var(--text)">max iterations</text>
  <text x="706.6174" y="515.6" text-anchor="middle" font-size="10" fill="var(--text)">timeout limits</text>
  <text x="706.6174" y="544.6" text-anchor="middle" font-size="10" fill="var(--text)">quality drift flag</text>
</svg>
  <ns0:text x="79.0152" y="184" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Log + Trace</ns0:text>
  <ns0:text x="79.0152" y="219.2" text-anchor="middle" fill="#f3e5f5" font-size="10">inputs / outputs</ns0:text>
  <ns0:text x="79.0152" y="251.2" text-anchor="middle" fill="#f3e5f5" font-size="10">latency / tokens</ns0:text>
  <ns0:line x1="100.4897" y1="200" x2="110.1256" y2="200" stroke="#333" stroke-width="0.5506" marker-end="url(#arr)" />
  <ns0:rect x="110.1256" y="128" width="42.6737" height="144" rx="2.7531" fill="#f9a825" stroke="#E65100" stroke-width="0.5506" />
  <ns0:text x="131.3248" y="184" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Dashboard</ns0:text>
  <ns0:text x="131.3248" y="219.2" text-anchor="middle" fill="#ffcc80" font-size="10">success rates</ns0:text>
  <ns0:text x="131.3248" y="251.2" text-anchor="middle" fill="#ffcc80" font-size="10">cost per task</ns0:text>
  <ns0:line x1="152.7993" y1="200" x2="162.4353" y2="200" stroke="#333" stroke-width="0.5506" marker-end="url(#arr)" />
  <ns0:rect x="162.4353" y="128" width="52.3097" height="144" rx="2.7531" fill="#e74c3c" stroke="#C62828" stroke-width="0.5506" />
  <ns0:text x="188.5902" y="184" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Alerts</ns0:text>
  <ns0:text x="188.5902" y="219.2" text-anchor="middle" fill="#FFCDD2" font-size="10">cost spikes</ns0:text>
  <ns0:text x="188.5902" y="251.2" text-anchor="middle" fill="#FFCDD2" font-size="10">quality drift</ns0:text>
  <ns0:rect x="5.5063" y="336" width="209.2387" height="280" rx="2.7531" fill="#E8EAF6" stroke="#3949AB" stroke-width="0.413" />
  <ns0:text x="110.1256" y="384" text-anchor="middle" font-size="10" font-weight="bold" fill="#3949AB">Key Metrics to Track</ns0:text>
  <ns0:rect x="11.0126" y="412.8" width="45.4268" height="176" rx="2.2025" fill="#BBDEFB" stroke="#1565C0" />
  <ns0:text x="33.5883" y="456" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">Tool Calls</ns0:text>
  <ns0:text x="33.5883" y="492.8" text-anchor="middle" font-size="10" fill="#333">inputs + outputs</ns0:text>
  <ns0:text x="33.5883" y="524.8" text-anchor="middle" font-size="10" fill="#333">latency per call</ns0:text>
  <ns0:text x="33.5883" y="556.8" text-anchor="middle" font-size="10" fill="#333">error rate</ns0:text>
  <ns0:rect x="60.5691" y="412.8" width="45.4268" height="176" rx="2.2025" fill="#E1BEE7" stroke="#6A1B9A" />
  <ns0:text x="83.1449" y="456" text-anchor="middle" font-size="10" font-weight="bold" fill="#6A1B9A">Tracing</ns0:text>
  <ns0:text x="83.1449" y="492.8" text-anchor="middle" font-size="10" fill="#333">trace ID per run</ns0:text>
  <ns0:text x="83.1449" y="524.8" text-anchor="middle" font-size="10" fill="#333">link tool calls</ns0:text>
  <ns0:text x="83.1449" y="556.8" text-anchor="middle" font-size="10" fill="#333">multi-turn flows</ns0:text>
  <ns0:rect x="110.1256" y="412.8" width="45.4268" height="176" rx="2.2025" fill="#FFF9C4" stroke="#F9A825" />
  <ns0:text x="132.7014" y="456" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">Cost</ns0:text>
  <ns0:text x="132.7014" y="492.8" text-anchor="middle" font-size="10" fill="#333">tokens per task</ns0:text>
  <ns0:text x="132.7014" y="524.8" text-anchor="middle" font-size="10" fill="#333">cost per agent</ns0:text>
  <ns0:text x="132.7014" y="556.8" text-anchor="middle" font-size="10" fill="#333">budget alerts</ns0:text>
  <ns0:rect x="159.6822" y="412.8" width="48.18" height="176" rx="2.2025" fill="#FFCDD2" stroke="#C62828" />
  <ns0:text x="183.6345" y="456" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Guardrails</ns0:text>
  <ns0:text x="183.6345" y="492.8" text-anchor="middle" font-size="10" fill="#333">max iterations</ns0:text>
  <ns0:text x="183.6345" y="524.8" text-anchor="middle" font-size="10" fill="#333">timeout limits</ns0:text>
  <ns0:text x="183.6345" y="556.8" text-anchor="middle" font-size="10" fill="#333">quality drift flag</ns0:text>
</ns0:svg>
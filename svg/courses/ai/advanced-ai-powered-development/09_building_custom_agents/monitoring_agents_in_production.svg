<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Pipeline -->
  <rect x="40" y="40" width="246.153846" height="173.99999989" rx="8.726029836928" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="163.076923" y="97.99999923" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.996580740541" font-weight="bold" fill="var(--primary-text)">Agent Runs</text>
  <text x="163.076923" y="144.400000154" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--primary-text)">tool calls</text>
  <text x="163.076923" y="179.199999472" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--primary-text)">completions</text>

  <line x1="291.282051" y1="126.999999945" x2="332.307692" y2="126.999999945" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="337.435897" y="40" width="246.153846" height="173.99999989" rx="8.726029836928" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="460.512821" y="97.99999923" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.996580740541" font-weight="bold" fill="var(--info-text)">Log + Trace</text>
  <text x="460.512821" y="144.400000154" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--info-text)">inputs / outputs</text>
  <text x="460.512821" y="179.199999472" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--info-text)">latency / tokens</text>

  <line x1="588.717949" y1="126.999999945" x2="629.74359" y2="126.999999945" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="634.871795" y="40" width="246.153846" height="173.99999989" rx="8.726029836928" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="757.948718" y="97.99999923" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.996580740541" font-weight="bold" fill="var(--warn-text)">Dashboard</text>
  <text x="757.948718" y="144.400000154" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--warn-text)">success rates</text>
  <text x="757.948718" y="179.199999472" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--warn-text)">cost per task</text>

  <line x1="886.153846" y1="126.999999945" x2="927.179487" y2="126.999999945" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="932.307692" y="40" width="246.153846" height="173.99999989" rx="8.726029836928" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055.384615" y="97.99999923" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.996580740541" font-weight="bold" fill="var(--danger-text)">Alerts</text>
  <text x="1055.384615" y="144.400000154" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--danger-text)">cost spikes</text>
  <text x="1055.384615" y="179.199999472" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--danger-text)">quality drift</text>

  <!-- Key metrics area -->
  <rect x="50.25641" y="260.399999714" width="1189.74359" height="359.600000286" rx="8.726029836928" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="645.128205" y="312.600000341" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.996580740541" font-weight="bold" fill="var(--text)">Key Metrics to Track</text>

  <rect x="81.025641" y="353.199999362" width="266.666667" height="232.00000022" rx="8.726029836928" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.358974" y="405.399999989" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.724320207199" font-weight="bold" fill="var(--primary-text)">Tool Calls</text>
  <text x="214.358974" y="457.599999516" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--primary-text)">inputs + outputs</text>
  <text x="214.358974" y="498.199999637" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--primary-text)">latency per call</text>
  <text x="214.358974" y="538.799999758" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--primary-text)">error rate</text>

  <rect x="368.205128" y="353.199999362" width="266.666667" height="232.00000022" rx="8.726029836928" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.538462" y="405.399999989" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.724320207199" font-weight="bold" fill="var(--info-text)">Tracing</text>
  <text x="501.538462" y="457.599999516" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--info-text)">trace ID per run</text>
  <text x="501.538462" y="498.199999637" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--info-text)">link tool calls</text>
  <text x="501.538462" y="538.799999758" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--info-text)">multi-turn flows</text>

  <rect x="655.384615" y="353.199999362" width="266.666667" height="232.00000022" rx="8.726029836928" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="788.717949" y="405.399999989" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.724320207199" font-weight="bold" fill="var(--warn-text)">Cost</text>
  <text x="788.717949" y="457.599999516" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--warn-text)">tokens per task</text>
  <text x="788.717949" y="498.199999637" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--warn-text)">cost per agent</text>
  <text x="788.717949" y="538.799999758" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--warn-text)">budget alerts</text>

  <rect x="942.564103" y="353.199999362" width="266.666667" height="232.00000022" rx="8.726029836928" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1075.897436" y="405.399999989" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.724320207199" font-weight="bold" fill="var(--danger-text)">Guardrails</text>
  <text x="1075.897436" y="457.599999516" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--danger-text)">max iterations</text>
  <text x="1075.897436" y="498.199999637" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--danger-text)">timeout limits</text>
  <text x="1075.897436" y="538.799999758" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.452058625047" fill="var(--danger-text)">drift detection</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,230.4 15.929,0" fill="#333" />
    </marker>
  </defs>
  <rect width="252.8395" height="640" fill="var(--surface)" rx="6"/>
  <text x="126.4198" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Multi-Agent Communication Patterns</text>
  <text x="55.3086" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Peer-to-Peer (handoffs)</text>
  <circle cx="28.4444" cy="224" r="14.2222" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="0.6321" />
  <text x="28.4444" y="216" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Agent A</text>
  <text x="28.4444" y="244.8" text-anchor="middle" fill="var(--primary-accent)" font-size="10">security</text>
  <circle cx="82.1728" cy="224" r="14.2222" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="0.6321" />
  <text x="82.1728" y="216" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Agent B</text>
  <text x="82.1728" y="244.8" text-anchor="middle" fill="var(--primary-accent)" font-size="10">style</text>
  <line x1="42.6667" y1="204.8" x2="67.9506" y2="204.8" stroke="var(--text)" stroke-width="0.6321" marker-end="url(#arr)" />
  <line x1="67.9506" y1="243.2" x2="42.6667" y2="243.2" stroke="var(--text)" stroke-width="0.6321" marker-end="url(#arr)" />
  <text x="55.3086" y="192" text-anchor="middle" font-size="10" fill="var(--text-muted)">delegate</text>
  <text x="167.5062" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Shared Blackboard</text>
  <circle cx="142.2222" cy="208" r="12.642" fill="var(--primary-fill)" stroke="var(--info-border)" stroke-width="0.6321" />
  <text x="142.2222" y="200" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Agent A</text>
  <text x="142.2222" y="228.8" text-anchor="middle" fill="var(--info-accent)" font-size="10">reader</text>
  <circle cx="176.9877" cy="280" r="12.642" fill="var(--primary-fill)" stroke="var(--info-border)" stroke-width="0.6321" />
  <text x="176.9877" y="272" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Agent B</text>
  <text x="176.9877" y="300.8" text-anchor="middle" fill="var(--info-accent)" font-size="10">writer</text>
  <rect x="195.9506" y="160" width="44.2469" height="160" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="218.0741" y="204.8" text-anchor="middle" fill="var(--text)" font-size="10" font-weight="bold">Blackboard</text>
  <text x="218.0741" y="240" text-anchor="middle" fill="var(--text-muted)" font-size="10">shared state</text>
  <text x="218.0741" y="268.8" text-anchor="middle" fill="var(--text-muted)" font-size="10">all agents</text>
  <text x="218.0741" y="297.6" text-anchor="middle" fill="var(--text-muted)" font-size="10">read + write</text>
  <line x1="154.8642" y1="208" x2="195.9506" y2="208" stroke="var(--info-border)" stroke-width="0.4741" stroke-dasharray="1.2642 0.6321" />
  <line x1="176.9877" y1="280" x2="197.5309" y2="280" stroke="var(--info-border)" stroke-width="0.4741" stroke-dasharray="1.2642 0.6321" />
  <rect x="6.321" y="400" width="240.1975" height="216" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="126.4198" y="448" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Pattern 3: Agent Debate (for Code Review)</text>
  <rect x="12.642" y="473.6" width="66.3704" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="45.8272" y="520" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Defender Agent</text>
  <text x="45.8272" y="552" text-anchor="middle" font-size="10" fill="var(--text)">argues for</text>
  <text x="45.8272" y="579.2" text-anchor="middle" font-size="10" fill="var(--text)">the code change</text>
  <rect x="93.2346" y="473.6" width="66.3704" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="126.4198" y="520" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Critic Agent</text>
  <text x="126.4198" y="552" text-anchor="middle" font-size="10" fill="var(--text)">finds flaws and</text>
  <text x="126.4198" y="579.2" text-anchor="middle" font-size="10" fill="var(--text)">counterarguments</text>
  <rect x="173.8272" y="473.6" width="66.3704" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="207.0123" y="520" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Judge Agent</text>
  <text x="207.0123" y="552" text-anchor="middle" font-size="10" fill="var(--text)">weighs both sides</text>
  <text x="207.0123" y="579.2" text-anchor="middle" font-size="10" fill="var(--text)">final verdict</text>
</svg>
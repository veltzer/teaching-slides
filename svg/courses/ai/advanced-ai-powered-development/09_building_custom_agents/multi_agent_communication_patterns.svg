<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,230.4 15.929,0" fill="#333" />
    </marker>
  </defs>
  <rect width="229.1358" height="580" fill="var(--surface)" rx="6" x="525.4321" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Multi-Agent Communication Patterns</text>
  <text x="575.5555" y="141.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Peer-to-Peer (handoffs)</text>
  <circle cx="551.2098" cy="243" r="12.8889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="0.6321" />
  <text x="551.2098" y="235.75" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Agent A</text>
  <text x="551.2098" y="261.85" text-anchor="middle" fill="var(--primary-accent)" font-size="10">security</text>
  <circle cx="599.9012" cy="243" r="12.8889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="0.6321" />
  <text x="599.9012" y="235.75" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Agent B</text>
  <text x="599.9012" y="261.85" text-anchor="middle" fill="var(--primary-accent)" font-size="10">style</text>
  <line x1="564.0988" y1="225.6" x2="587.0123" y2="225.6" stroke="var(--text)" stroke-width="0.6321" marker-end="url(#arr)" />
  <line x1="587.0123" y1="260.4" x2="564.0988" y2="260.4" stroke="var(--text)" stroke-width="0.6321" marker-end="url(#arr)" />
  <text x="575.5555" y="214" text-anchor="middle" font-size="10" fill="var(--text-muted)">delegate</text>
  <text x="677.2346" y="141.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Shared Blackboard</text>
  <circle cx="654.321" cy="228.5" r="11.4568" fill="var(--primary-fill)" stroke="var(--info-border)" stroke-width="0.6321" />
  <text x="654.321" y="221.25" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Agent A</text>
  <text x="654.321" y="247.35" text-anchor="middle" fill="var(--info-accent)" font-size="10">reader</text>
  <circle cx="685.8272" cy="293.75" r="11.4568" fill="var(--primary-fill)" stroke="var(--info-border)" stroke-width="0.6321" />
  <text x="685.8272" y="286.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Agent B</text>
  <text x="685.8272" y="312.6" text-anchor="middle" fill="var(--info-accent)" font-size="10">writer</text>
  <rect x="703.0123" y="185" width="40.0988" height="145" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="723.0618" y="225.6" text-anchor="middle" fill="var(--text)" font-size="10" font-weight="bold">Blackboard</text>
  <text x="723.0618" y="257.5" text-anchor="middle" fill="var(--text-muted)" font-size="10">shared state</text>
  <text x="723.0618" y="283.6" text-anchor="middle" fill="var(--text-muted)" font-size="10">all agents</text>
  <text x="723.0618" y="309.7" text-anchor="middle" fill="var(--text-muted)" font-size="10">read + write</text>
  <line x1="665.7778" y1="228.5" x2="703.0123" y2="228.5" stroke="var(--info-border)" stroke-width="0.4741" stroke-dasharray="1.2642 0.6321" />
  <line x1="685.8272" y1="293.75" x2="704.4445" y2="293.75" stroke="var(--info-border)" stroke-width="0.4741" stroke-dasharray="1.2642 0.6321" />
  <rect x="531.1605" y="402.5" width="217.679" height="195.75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="446" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Pattern 3: Agent Debate (for Code Review)</text>
  <rect x="536.8889" y="469.2" width="60.1482" height="108.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="566.963" y="511.25" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Defender Agent</text>
  <text x="566.963" y="540.25" text-anchor="middle" font-size="10" fill="var(--text)">argues for</text>
  <text x="566.963" y="564.9" text-anchor="middle" font-size="10" fill="var(--text)">the code change</text>
  <rect x="609.926" y="469.2" width="60.1482" height="108.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="511.25" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Critic Agent</text>
  <text x="640" y="540.25" text-anchor="middle" font-size="10" fill="var(--text)">finds flaws and</text>
  <text x="640" y="564.9" text-anchor="middle" font-size="10" fill="var(--text)">counterarguments</text>
  <rect x="682.963" y="469.2" width="60.1482" height="108.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="713.037" y="511.25" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Judge Agent</text>
  <text x="713.037" y="540.25" text-anchor="middle" font-size="10" fill="var(--text)">weighs both sides</text>
  <text x="713.037" y="564.9" text-anchor="middle" font-size="10" fill="var(--text)">final verdict</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#212121"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--primary-accent)">Multi-Agent Communication Patterns</text>

  <rect x="70" y="120" width="380" height="460" rx="8" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="260" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-accent)">Peer-to-Peer (handoffs)</text>
  <circle cx="150" cy="330" r="55" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Agent A</text>
  <text x="150" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">security</text>
  <circle cx="370" cy="330" r="55" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="370" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Agent B</text>
  <text x="370" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">style</text>
  <line x1="210" y1="310" x2="310" y2="310" stroke="var(--text)" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="310" y1="355" x2="210" y2="355" stroke="var(--text)" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="260" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">delegate</text>
  <text x="260" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">result</text>
  <text x="260" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Direct handoff; each</text>
  <text x="260" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">agent calls the next</text>

  <rect x="470" y="120" width="380" height="460" rx="8" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="660" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-accent)">Shared Blackboard</text>
  <circle cx="540" cy="260" r="42" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="540" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Agent A</text>
  <text x="540" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">reader</text>
  <circle cx="540" cy="440" r="42" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="540" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Agent B</text>
  <text x="540" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">writer</text>
  <rect x="700" y="220" width="120" height="260" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="760" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Blackboard</text>
  <text x="760" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">shared state</text>
  <text x="760" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">all agents</text>
  <text x="760" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">read + write</text>
  <line x1="582" y1="260" x2="700" y2="260" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="582" y1="440" x2="700" y2="440" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="660" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Decoupled via shared</text>
  <text x="660" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">memory region</text>

  <rect x="870" y="120" width="340" height="460" rx="8" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1040" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-accent)">Agent Debate</text>
  <rect x="895" y="195" width="290" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1040" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Defender</text>
  <text x="1040" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">argues for the change</text>
  <rect x="895" y="295" width="290" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1040" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-text)">Critic</text>
  <text x="1040" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">finds flaws, counters</text>
  <rect x="895" y="395" width="290" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1040" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Judge</text>
  <text x="1040" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">weighs both, decides</text>
  <text x="1040" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Adversarial pattern</text>
  <text x="1040" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">for code review</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="400" height="580" rx="9.216441575588" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="240" y="90.434782749055" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.041103420297" font-weight="bold" fill="var(--primary-accent)">Peer-to-Peer (handoffs)</text>
  <rect x="63.128662" y="239.05321149627" width="122.163728" height="131.458794258406" rx="14.522845570835" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="124.210526" y="298.47826064733" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.432883151176" font-weight="bold" fill="var(--primary-text)">Agent A</text>
  <text x="124.210526" y="330.000000538043" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.128772497942" fill="var(--primary-text)">security</text>
  <rect x="294.70761" y="239.05321149627" width="122.163728" height="131.458794258406" rx="14.522845570835" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="355.789474" y="298.47826064733" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.432883151176" font-weight="bold" fill="var(--ok-text)">Agent B</text>
  <text x="355.789474" y="330.000000538043" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.128772497942" fill="var(--ok-text)">style</text>
  <line x1="187.368421" y1="279.565217788989" x2="292.631579" y2="279.565217788989" stroke="var(--text)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="292.631579" y1="336.304347440099" x2="187.368421" y2="336.304347440099" stroke="var(--text)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="240" y="260.65217385456" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.128772497942" fill="var(--text-muted)">delegate</text>
  <text x="240" y="367.826087330813" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.128772497942" fill="var(--text-muted)">result</text>
  <text x="240" y="569.565217250945" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.128772497942" fill="var(--text)">Direct handoff; each</text>
  <text x="240" y="597.304347924338" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.128772497942" fill="var(--text)">agent calls the next</text>

  <rect x="461.052632" y="40" width="400" height="580" rx="9.216441575588" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="661.052632" y="90.434782749055" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.041103420297" font-weight="bold" fill="var(--info-accent)">Shared Blackboard</text>
  <rect x="488.092509" y="166.328380747633" width="93.288666" height="100.386716672032" rx="12.44815334643" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="534.736842" y="214.000000322826" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.128772497942" font-weight="bold" fill="var(--primary-text)">Agent A</text>
  <text x="534.736842" y="239.21739115931" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.824661844709" fill="var(--primary-text)">reader</text>
  <rect x="488.092509" y="393.284902580336" width="93.288666" height="100.386716672032" rx="12.44815334643" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="534.736842" y="440.956522155529" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.128772497942" font-weight="bold" fill="var(--ok-text)">Agent B</text>
  <text x="534.736842" y="466.173912992013" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.824661844709" fill="var(--ok-text)">writer</text>
  <rect x="703.157895" y="166.086956334594" width="126.315789" height="327.826087330813" rx="9.216441575588" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="766.315789" y="279.565217788989" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.432883151176" font-weight="bold" fill="var(--info-text)">Blackboard</text>
  <text x="766.315789" y="330.000000538043" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.976717689999" fill="var(--info-text)">shared state</text>
  <text x="766.315789" y="367.826087330813" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.976717689999" fill="var(--info-text)">all agents</text>
  <text x="766.315789" y="405.652174123582" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.976717689999" fill="var(--info-text)">read + write</text>
  <line x1="578.947368" y1="216.521739083648" x2="703.157895" y2="216.521739083648" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="578.947368" y1="443.478260916352" x2="703.157895" y2="443.478260916352" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="661.052632" y="569.565217250945" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.128772497942" fill="var(--text)">Decoupled via shared</text>
  <text x="661.052632" y="597.304347924338" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.128772497942" fill="var(--text)">memory region</text>

  <rect x="882.105263" y="40" width="357.894737" height="580" rx="9.216441575588" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1061.052632" y="90.434782749055" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.041103420297" font-weight="bold" fill="var(--warn-accent)">Agent Debate</text>
  <rect x="908.421053" y="134.565217519967" width="305.263158" height="100.86956549811" rx="6.912330922354" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.052632" y="178.695652290879" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.432883151176" font-weight="bold" fill="var(--primary-text)">Defender</text>
  <text x="1061.052632" y="210.217391105506" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.976717689999" fill="var(--primary-text)">argues for the change</text>
  <rect x="908.421053" y="260.65217385456" width="305.263158" height="100.86956549811" rx="6.912330922354" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.052632" y="304.782608625473" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.432883151176" font-weight="bold" fill="var(--danger-text)">Critic</text>
  <text x="1061.052632" y="336.304347440099" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.976717689999" fill="var(--danger-text)">finds flaws, counters</text>
  <rect x="908.421053" y="386.739130189154" width="305.263158" height="100.86956549811" rx="6.912330922354" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.052632" y="430.869564960066" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.432883151176" font-weight="bold" fill="var(--ok-text)">Judge</text>
  <text x="1061.052632" y="462.39130485078" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.976717689999" fill="var(--ok-text)">weighs both, decides</text>
  <text x="1061.052632" y="569.565217250945" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.128772497942" fill="var(--text)">Adversarial pattern</text>
  <text x="1061.052632" y="597.304347924338" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.128772497942" fill="var(--text)">for code review</text>
</svg>

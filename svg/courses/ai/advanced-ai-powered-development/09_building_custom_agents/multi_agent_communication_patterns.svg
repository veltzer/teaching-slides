  <ns0:rect width="252.8395" height="640" fill="var(--surface-light)" />
  <ns0:text x="126.4198" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Multi-Agent Communication Patterns</ns0:text>
  <ns0:text x="55.3086" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-dk)">Peer-to-Peer (handoffs)</ns0:text>
  <ns0:circle cx="28.4444" cy="224" r="14.2222" fill="var(--primary-bright)" stroke="var(--primary-dk)" stroke-width="0.6321" />
  <ns0:text x="28.4444" y="216" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Agent A</ns0:text>
  <ns0:text x="28.4444" y="244.8" text-anchor="middle" fill="var(--primary-pale)" font-size="10">security</ns0:text>
  <ns0:circle cx="82.1728" cy="224" r="14.2222" fill="var(--primary-bright)" stroke="var(--primary-dk)" stroke-width="0.6321" />
  <ns0:text x="82.1728" y="216" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Agent B</ns0:text>
  <ns0:text x="82.1728" y="244.8" text-anchor="middle" fill="var(--primary-pale)" font-size="10">style</ns0:text>
  <ns0:line x1="42.6667" y1="204.8" x2="67.9506" y2="204.8" stroke="var(--text-dark)" stroke-width="0.6321" marker-end="url(#arr)" />
  <ns0:line x1="67.9506" y1="243.2" x2="42.6667" y2="243.2" stroke="var(--text-dark)" stroke-width="0.6321" marker-end="url(#arr)" />
  <ns0:text x="55.3086" y="192" text-anchor="middle" font-size="10" fill="var(--text-muted)">delegate</ns0:text>
  <ns0:text x="167.5062" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-dk)">Shared Blackboard</ns0:text>
  <ns0:circle cx="142.2222" cy="208" r="12.642" fill="var(--primary-google)" stroke="var(--info-dk)" stroke-width="0.6321" />
  <ns0:text x="142.2222" y="200" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Agent A</ns0:text>
  <ns0:text x="142.2222" y="228.8" text-anchor="middle" fill="var(--info-pale)" font-size="10">reader</ns0:text>
  <ns0:circle cx="176.9877" cy="280" r="12.642" fill="var(--primary-google)" stroke="var(--info-dk)" stroke-width="0.6321" />
  <ns0:text x="176.9877" y="272" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Agent B</ns0:text>
  <ns0:text x="176.9877" y="300.8" text-anchor="middle" fill="var(--info-pale)" font-size="10">writer</ns0:text>
  <ns0:rect x="195.9506" y="160" width="44.2469" height="160" rx="2.5284" fill="var(--info-pale)" stroke="var(--info-dk)" stroke-width="0.6321" />
  <ns0:text x="218.0741" y="204.8" text-anchor="middle" fill="var(--text-dark)" font-size="10" font-weight="bold">Blackboard</ns0:text>
  <ns0:text x="218.0741" y="240" text-anchor="middle" fill="var(--text-mid)" font-size="10">shared state</ns0:text>
  <ns0:text x="218.0741" y="268.8" text-anchor="middle" fill="var(--text-mid)" font-size="10">all agents</ns0:text>
  <ns0:text x="218.0741" y="297.6" text-anchor="middle" fill="var(--text-mid)" font-size="10">read + write</ns0:text>
  <ns0:line x1="154.8642" y1="208" x2="195.9506" y2="208" stroke="var(--info-dk)" stroke-width="0.4741" stroke-dasharray="1.2642 0.6321" />
  <ns0:line x1="176.9877" y1="280" x2="197.5309" y2="280" stroke="var(--info-dk)" stroke-width="0.4741" stroke-dasharray="1.2642 0.6321" />
  <ns0:rect x="6.321" y="400" width="240.1975" height="216" rx="3.1605" fill="var(--info-indigo-lt)" stroke="var(--primary-indigo)" stroke-width="0.4741" />
  <ns0:text x="126.4198" y="448" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-indigo)">Pattern 3: Agent Debate (for Code Review)</ns0:text>
  <ns0:rect x="12.642" y="473.6" width="66.3704" height="120" rx="2.5284" fill="var(--primary-lt)" stroke="var(--primary-indigo)" />
  <ns0:text x="45.8272" y="520" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Defender Agent</ns0:text>
  <ns0:text x="45.8272" y="552" text-anchor="middle" font-size="10" fill="var(--text-dark)">argues for</ns0:text>
  <ns0:text x="45.8272" y="579.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">the code change</ns0:text>
  <ns0:rect x="93.2346" y="473.6" width="66.3704" height="120" rx="2.5284" fill="var(--primary-lt)" stroke="var(--primary-indigo)" />
  <ns0:text x="126.4198" y="520" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Critic Agent</ns0:text>
  <ns0:text x="126.4198" y="552" text-anchor="middle" font-size="10" fill="var(--text-dark)">finds flaws and</ns0:text>
  <ns0:text x="126.4198" y="579.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">counterarguments</ns0:text>
  <ns0:rect x="173.8272" y="473.6" width="66.3704" height="120" rx="2.5284" fill="var(--primary-lt)" stroke="var(--primary-indigo)" />
  <ns0:text x="207.0123" y="520" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Judge Agent</ns0:text>
  <ns0:text x="207.0123" y="552" text-anchor="middle" font-size="10" fill="var(--text-dark)">weighs both sides</ns0:text>
  <ns0:text x="207.0123" y="579.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">final verdict</ns0:text>
</ns0:svg>
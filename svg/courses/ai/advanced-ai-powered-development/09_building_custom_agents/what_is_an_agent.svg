<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="45.511" markerHeight="252" refX="40.96" refY="126" orient="auto">
      <polygon points="0,360 15.929,0" fill="#333" />
    </marker>
  </defs>
  <rect width="3640.889" height="14400" fill="#f8f9fa" />
  <text x="1820.4444" y="1260" text-anchor="middle" font-size="91.0223" font-weight="bold" fill="#1a237e">What Is an Agent? The Core Loop</text>
  <text x="1820.4444" y="2052" text-anchor="middle" font-size="59.1644" fill="#555">An LLM-powered system that plans, acts, and observes until the task is done</text>
  <rect x="136.5333" y="3600" width="773.689" height="3240" rx="54.6133" fill="#4A90D9" stroke="#1565C0" stroke-width="9.1023" />
  <text x="523.3777" y="4788" text-anchor="middle" fill="white" font-size="72.8177" font-weight="bold">Observe</text>
  <text x="523.3777" y="5652" text-anchor="middle" fill="#D6EAF8" font-size="59.1644">read tool output</text>
  <text x="523.3777" y="6408" text-anchor="middle" fill="#D6EAF8" font-size="54.6133">current state</text>
  <line x1="910.2223" y1="5220" x2="1092.2667" y2="5220" stroke="#333" stroke-width="9.1023" marker-end="url(#arrow)" />
  <rect x="1092.2667" y="3600" width="773.689" height="3240" rx="54.6133" fill="#7B68EE" stroke="#6A1B9A" stroke-width="9.1023" />
  <text x="1479.111" y="4788" text-anchor="middle" fill="white" font-size="72.8177" font-weight="bold">Think</text>
  <text x="1479.111" y="5652" text-anchor="middle" fill="#E9D8FD" font-size="59.1644">reason + plan</text>
  <text x="1479.111" y="6408" text-anchor="middle" fill="#E9D8FD" font-size="54.6133">choose tool</text>
  <line x1="1865.9556" y1="5220" x2="2048" y2="5220" stroke="#333" stroke-width="9.1023" marker-end="url(#arrow)" />
  <rect x="2048" y="3600" width="773.689" height="3240" rx="54.6133" fill="#50C878" stroke="#2E7D32" stroke-width="9.1023" />
  <text x="2434.8444" y="4788" text-anchor="middle" fill="white" font-size="72.8177" font-weight="bold">Act</text>
  <text x="2434.8444" y="5652" text-anchor="middle" fill="#E8F5E9" font-size="59.1644">execute tool</text>
  <text x="2434.8444" y="6408" text-anchor="middle" fill="#E8F5E9" font-size="54.6133">file / shell / web</text>
  <path d="M 2434.8444 6840 Q 2434.8444 9000 1820.4444 9000 Q 523.3777 9000 523.3777 6840" fill="none" stroke="#333" stroke-width="9.1023" stroke-dasharray="27.3067 13.6533" marker-end="url(#arrow)" />
  <text x="1820.4444" y="9720" text-anchor="middle" font-size="59.1644" fill="#555">loop until task complete or max iterations</text>
  <rect x="136.5333" y="10620" width="3367.8223" height="3420" rx="45.511" fill="#E8EAF6" stroke="#3949AB" stroke-width="6.8267" />
  <text x="1820.4444" y="11700" text-anchor="middle" font-size="68.2667" font-weight="bold" fill="#3949AB">What Makes an Agent Different from a Chatbot</text>
  <text x="227.5556" y="12672" font-size="59.1644" fill="#333">▶ Maintains goals across multiple steps — not just single prompt-response</text>
  <text x="227.5556" y="13428" font-size="59.1644" fill="#333">▶ Tool access: read files, run tests, commit code, query databases</text>
  <text x="227.5556" y="13716" font-size="54.6133" fill="#666">▶ Core loop: Observe → Think → Act → Observe... (autonomous until done)</text>
</svg>
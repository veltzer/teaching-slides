<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="161.8173" height="640" fill="var(--surface)" rx="6"/>
  <text x="80.9086" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">What Is an Agent? The Core Loop</text>
  <text x="80.9086" y="91.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">An LLM-powered system that plans, acts, and observes until the task is done</text>
  <rect x="6.0681" y="160" width="34.3862" height="144" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="23.2612" y="212.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Observe</text>
  <text x="23.2612" y="251.2" text-anchor="middle" fill="var(--primary-accent)" font-size="10">read tool output</text>
  <text x="23.2612" y="284.8" text-anchor="middle" fill="var(--primary-accent)" font-size="10">current state</text>
  <line x1="40.4543" y1="232" x2="48.5452" y2="232" stroke="var(--text)" stroke-width="0.4045" marker-end="url(#arrow)" />
  <rect x="48.5452" y="160" width="34.3862" height="144" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="65.7383" y="212.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Think</text>
  <text x="65.7383" y="251.2" text-anchor="middle" fill="var(--info-accent)" font-size="10">reason + plan</text>
  <text x="65.7383" y="284.8" text-anchor="middle" fill="var(--info-accent)" font-size="10">choose tool</text>
  <line x1="82.9314" y1="232" x2="91.0222" y2="232" stroke="var(--text)" stroke-width="0.4045" marker-end="url(#arrow)" />
  <rect x="91.0222" y="160" width="34.3862" height="144" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="108.2153" y="212.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Act</text>
  <text x="108.2153" y="251.2" text-anchor="middle" fill="var(--ok-accent)" font-size="10">execute tool</text>
  <text x="108.2153" y="284.8" text-anchor="middle" fill="var(--ok-accent)" font-size="10">file / shell / web</text>
  <path d="M 108.2153 304 Q 108.2153 400 80.9086 400 Q 23.2612 400 23.2612 304" fill="none" stroke="var(--text)" stroke-width="0.4045" stroke-dasharray="1.2136 0.6068" marker-end="url(#arrow)" />
  <text x="80.9086" y="432" text-anchor="middle" font-size="10" fill="var(--text-muted)">loop until task complete or max iterations</text>
  <rect x="6.0681" y="472" width="149.681" height="152" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="80.9086" y="520" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">What Makes an Agent Different from a Chatbot</text>
  <text x="10.1136" y="563.2" font-size="10" fill="var(--text)">▶ Maintains goals across multiple steps — not just single prompt-response</text>
  <text x="10.1136" y="596.8" font-size="10" fill="var(--text)">▶ Tool access: read files, run tests, commit code, query databases</text>
  <text x="10.1136" y="609.6" font-size="10" fill="var(--text-muted)">▶ Core loop: Observe → Think → Act → Observe... (autonomous until done)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="146.6469" height="580" fill="var(--surface)" rx="6" x="566.6765" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">What Is an Agent? The Core Loop</text>
  <text x="640" y="122.65" text-anchor="middle" font-size="10" fill="var(--text-muted)">An LLM-powered system that plans, acts, and observes until the task is done</text>
  <rect x="572.1758" y="185" width="31.1625" height="130.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="587.757" y="232.85" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Observe</text>
  <text x="587.757" y="267.65" text-anchor="middle" fill="var(--primary-accent)" font-size="10">read tool output</text>
  <text x="587.757" y="298.1" text-anchor="middle" fill="var(--primary-accent)" font-size="10">current state</text>
  <line x1="603.3382" y1="250.25" x2="610.6706" y2="250.25" stroke="var(--text)" stroke-width="0.4045" marker-end="url(#arrow)" />
  <rect x="610.6706" y="185" width="31.1625" height="130.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="626.2519" y="232.85" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Think</text>
  <text x="626.2519" y="267.65" text-anchor="middle" fill="var(--info-accent)" font-size="10">reason + plan</text>
  <text x="626.2519" y="298.1" text-anchor="middle" fill="var(--info-accent)" font-size="10">choose tool</text>
  <line x1="641.8331" y1="250.25" x2="649.1654" y2="250.25" stroke="var(--text)" stroke-width="0.4045" marker-end="url(#arrow)" />
  <rect x="649.1654" y="185" width="31.1625" height="130.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="664.7467" y="232.85" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Act</text>
  <text x="664.7467" y="267.65" text-anchor="middle" fill="var(--ok-accent)" font-size="10">execute tool</text>
  <text x="664.7467" y="298.1" text-anchor="middle" fill="var(--ok-accent)" font-size="10">file / shell / web</text>
  <path d="M 664.7467 315.5 Q 664.7467 402.5 640 402.5 Q 587.757 402.5 587.757 315.5" fill="none" stroke="var(--text)" stroke-width="0.4045" stroke-dasharray="1.2136 0.6068" marker-end="url(#arrow)" />
  <text x="640" y="431.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">loop until task complete or max iterations</text>
  <rect x="572.1758" y="467.75" width="135.6484" height="137.75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="511.25" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">What Makes an Agent Different from a Chatbot</text>
  <text x="575.842" y="550.4" font-size="10" fill="var(--text)">▶ Maintains goals across multiple steps — not just single prompt-response</text>
  <text x="575.842" y="580.85" font-size="10" fill="var(--text)">▶ Tool access: read files, run tests, commit code, query databases</text>
  <text x="575.842" y="592.45" font-size="10" fill="var(--text-muted)">▶ Core loop: Observe → Think → Act → Observe... (autonomous until done)</text>
</svg>
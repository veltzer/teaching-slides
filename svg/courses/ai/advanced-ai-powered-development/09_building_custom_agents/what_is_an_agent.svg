<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- The loop: three boxes -->
  <rect x="120" y="40" width="280" height="250.19607834679" rx="8.531372229994" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="113.921569092657" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.859803324217" font-weight="bold" fill="var(--primary-text)">Observe</text>
  <text x="260" y="170.784313387159" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--primary-text)">read tool output</text>
  <text x="260" y="204.901960826605" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--primary-text)">current state</text>

  <line x1="410" y1="165.098039173395" x2="490" y2="165.098039173395" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="500" y="40" width="280" height="250.19607834679" rx="8.531372229994" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="113.921569092657" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.859803324217" font-weight="bold" fill="var(--info-text)">Think</text>
  <text x="640" y="170.784313387159" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--info-text)">reason and plan</text>
  <text x="640" y="204.901960826605" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--info-text)">choose tool</text>

  <line x1="790" y1="165.098039173395" x2="870" y2="165.098039173395" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="880" y="40" width="280" height="250.19607834679" rx="8.531372229994" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="113.921569092657" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.859803324217" font-weight="bold" fill="var(--ok-text)">Act</text>
  <text x="1020" y="170.784313387159" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--ok-text)">execute tool</text>
  <text x="1020" y="204.901960826605" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--ok-text)">file / shell / web</text>

  <!-- Feedback loop arc -->
  <path d="M 1020 290.19607834679 Q 1020 369.80392165321 640 369.80392165321 Q 260 369.80392165321 260 290.19607834679" fill="none" stroke="var(--text-muted)" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="640" y="403.921569092657" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587257868" fill="var(--text-muted)">loop until task complete or max iterations</text>

  <!-- Agent vs chatbot -->
  <rect x="40" y="449.411764959631" width="1200" height="170.588235040369" rx="6.398529432114" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="494.901960826605" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--text)">What Makes an Agent Different From a Chatbot</text>
  <text x="80" y="540.392156693579" font-family="Arial, sans-serif" font-size="18.129166378166" fill="var(--text)">- Maintains goals across many steps, not one prompt/response</text>
  <text x="80" y="574.509804133026" font-family="Arial, sans-serif" font-size="18.129166378166" fill="var(--text)">- Tool access: read files, run tests, commit code, query databases</text>
  <text x="80" y="608.627450494041" font-family="Arial, sans-serif" font-size="18.129166378166" fill="var(--text)">- Autonomous: Observe, Think, Act loop runs until done</text>
</svg>

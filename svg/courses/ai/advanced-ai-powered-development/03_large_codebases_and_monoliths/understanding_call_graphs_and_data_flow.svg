<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,264.4899 21.2071,0" fill="#333333" />
    </marker>
  </defs>
  <rect width="265.7433" height="580" fill="var(--surface)" rx="6" x="507.1283" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Request Lifecycle: Call Graph and Data Flow</text>
  <rect x="513.772" y="156" width="43.1833" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="535.3636" y="199.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">API</text>
  <text x="535.3636" y="228.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Handler</text>
  <text x="535.3636" y="260.4" text-anchor="middle" fill="var(--ok-accent)" font-size="10">POST /orders</text>
  <line x1="556.9552" y1="214" x2="568.5815" y2="214" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <rect x="568.5815" y="156" width="43.1833" height="116" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="590.1731" y="199.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Validator</text>
  <text x="590.1731" y="228.5" text-anchor="middle" fill="var(--bg)" font-size="10" />
  <text x="590.1731" y="260.4" text-anchor="middle" fill="var(--primary-accent)" font-size="10">input schema</text>
  <line x1="611.7648" y1="214" x2="623.3911" y2="214" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <rect x="623.3911" y="156" width="43.1833" height="116" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="644.9827" y="199.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Service</text>
  <text x="644.9827" y="228.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Layer</text>
  <text x="644.9827" y="260.4" text-anchor="middle" fill="var(--info-accent)" font-size="10">business logic</text>
  <line x1="666.5743" y1="214" x2="678.2006" y2="214" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <rect x="678.2006" y="156" width="43.1833" height="116" rx="6" fill="var(--warn-accent)" stroke="var(--text)" stroke-width="0.7331" />
  <text x="699.7922" y="199.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Repository</text>
  <text x="699.7922" y="228.5" text-anchor="middle" fill="var(--bg)" font-size="10" />
  <text x="699.7922" y="260.4" text-anchor="middle" fill="var(--warn-accent)" font-size="10">data access</text>
  <line x1="721.3839" y1="214" x2="733.0102" y2="214" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <rect x="733.0102" y="156" width="33.2179" height="116" rx="6" fill="var(--danger-accent)" stroke="var(--text)" stroke-width="0.7331" />
  <text x="749.6191" y="199.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">DB</text>
  <text x="749.6191" y="228.5" text-anchor="middle" fill="var(--danger-accent)" font-size="10">PostgreSQL</text>
  <text x="749.6191" y="260.4" text-anchor="middle" fill="var(--danger-accent)" font-size="10">storage</text>
  <rect x="623.3911" y="344.5" width="43.1833" height="87" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="644.9827" y="385.1" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Event Bus</text>
  <text x="644.9827" y="414.1" text-anchor="middle" fill="var(--warn-accent)" font-size="10">order.created</text>
  <line x1="644.9827" y1="272" x2="644.9827" y2="344.5" stroke="var(--warn-border)" stroke-width="0.7331" stroke-dasharray="1.8327 1.0996" marker-end="url(#arr)" />
  <text x="653.2872" y="318.4" font-size="10" fill="var(--warn-accent)">side effect</text>
  <rect x="513.772" y="467.75" width="252.4561" height="130.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="508.35" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">AI Navigation Prompts for Call Graphs</text>
  <text x="520.4155" y="544.6" font-size="10" fill="var(--text)">▶ "Trace the request from POST /orders to the database write"</text>
  <text x="520.4155" y="573.6" font-size="10" fill="var(--text)">▶ "Identify all shared mutable state and side effects in OrderService"</text>
  <text x="520.4155" y="602.6" font-size="10" fill="var(--text)">▶ "Map the lifecycle of an order across all service boundaries"</text>
</svg>
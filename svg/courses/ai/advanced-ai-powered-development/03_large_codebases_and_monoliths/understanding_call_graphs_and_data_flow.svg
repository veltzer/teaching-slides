<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,264.4899 21.2071,0" fill="#333333" />
    </marker>
  </defs>
  <rect width="293.234" height="640" fill="var(--surface)" rx="6"/>
  <text x="146.617" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Request Lifecycle: Call Graph and Data Flow</text>
  <rect x="7.3309" y="128" width="47.6505" height="128" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="31.1561" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">API</text>
  <text x="31.1561" y="208" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Handler</text>
  <text x="31.1561" y="243.2" text-anchor="middle" fill="var(--ok-accent)" font-size="10">POST /orders</text>
  <line x1="54.9814" y1="192" x2="67.8104" y2="192" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <rect x="67.8104" y="128" width="47.6505" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="91.6356" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Validator</text>
  <text x="91.6356" y="208" text-anchor="middle" fill="var(--bg)" font-size="10" />
  <text x="91.6356" y="243.2" text-anchor="middle" fill="var(--primary-accent)" font-size="10">input schema</text>
  <line x1="115.4609" y1="192" x2="128.2899" y2="192" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <rect x="128.2899" y="128" width="47.6505" height="128" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="152.1151" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Service</text>
  <text x="152.1151" y="208" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Layer</text>
  <text x="152.1151" y="243.2" text-anchor="middle" fill="var(--info-accent)" font-size="10">business logic</text>
  <line x1="175.9404" y1="192" x2="188.7694" y2="192" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <rect x="188.7694" y="128" width="47.6505" height="128" rx="6" fill="var(--warn-accent)" stroke="var(--text)" stroke-width="0.7331" />
  <text x="212.5946" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Repository</text>
  <text x="212.5946" y="208" text-anchor="middle" fill="var(--bg)" font-size="10" />
  <text x="212.5946" y="243.2" text-anchor="middle" fill="var(--warn-accent)" font-size="10">data access</text>
  <line x1="236.4199" y1="192" x2="249.2489" y2="192" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <rect x="249.2489" y="128" width="36.6542" height="128" rx="6" fill="var(--danger-accent)" stroke="var(--text)" stroke-width="0.7331" />
  <text x="267.576" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">DB</text>
  <text x="267.576" y="208" text-anchor="middle" fill="var(--danger-accent)" font-size="10">PostgreSQL</text>
  <text x="267.576" y="243.2" text-anchor="middle" fill="var(--danger-accent)" font-size="10">storage</text>
  <rect x="128.2899" y="336" width="47.6505" height="96" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="152.1151" y="380.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Event Bus</text>
  <text x="152.1151" y="412.8" text-anchor="middle" fill="var(--warn-accent)" font-size="10">order.created</text>
  <line x1="152.1151" y1="256" x2="152.1151" y2="336" stroke="var(--warn-border)" stroke-width="0.7331" stroke-dasharray="1.8327 1.0996" marker-end="url(#arr)" />
  <text x="161.2787" y="307.2" font-size="10" fill="var(--warn-accent)">side effect</text>
  <rect x="7.3309" y="472" width="278.5723" height="144" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="146.617" y="516.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">AI Navigation Prompts for Call Graphs</text>
  <text x="14.6617" y="556.8" font-size="10" fill="var(--text)">▶ "Trace the request from POST /orders to the database write"</text>
  <text x="14.6617" y="588.8" font-size="10" fill="var(--text)">▶ "Identify all shared mutable state and side effects in OrderService"</text>
  <text x="14.6617" y="620.8" font-size="10" fill="var(--text)">▶ "Map the lifecycle of an order across all service boundaries"</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#333333"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="85" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-accent)">Request Lifecycle: Call Graph and Data Flow</text>

  <rect x="70" y="140" width="190" height="140" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="165" y="185" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--ok-text)">API Handler</text>
  <text x="165" y="225" text-anchor="middle" font-size="14" fill="var(--ok-text)">POST /orders</text>

  <line x1="260" y1="210" x2="295" y2="210" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="140" width="190" height="140" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="395" y="185" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-text)">Validator</text>
  <text x="395" y="225" text-anchor="middle" font-size="14" fill="var(--primary-text)">input schema</text>

  <line x1="490" y1="210" x2="525" y2="210" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="530" y="140" width="190" height="140" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="625" y="185" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--info-text)">Service Layer</text>
  <text x="625" y="225" text-anchor="middle" font-size="14" fill="var(--info-text)">business logic</text>

  <line x1="720" y1="210" x2="755" y2="210" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="760" y="140" width="190" height="140" rx="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="855" y="185" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--warn-text)">Repository</text>
  <text x="855" y="225" text-anchor="middle" font-size="14" fill="var(--warn-text)">data access</text>

  <line x1="950" y1="210" x2="985" y2="210" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="990" y="140" width="180" height="140" rx="8" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1080" y="185" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--danger-text)">Database</text>
  <text x="1080" y="225" text-anchor="middle" font-size="14" fill="var(--danger-text)">PostgreSQL</text>

  <line x1="625" y1="280" x2="625" y2="335" stroke="#e65100" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-warn)"/>
  <text x="690" y="315" font-size="14" fill="var(--warn-accent)" font-style="italic">side effect</text>

  <rect x="490" y="340" width="300" height="90" rx="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="375" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--warn-text)">Event Bus</text>
  <text x="640" y="405" text-anchor="middle" font-size="14" fill="var(--warn-text)">order.created</text>

  <rect x="70" y="460" width="1100" height="140" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="620" y="495" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--info-text)">AI Navigation Prompts for Call Graphs</text>
  <text x="95" y="530" font-size="15" fill="var(--info-text)">▶ "Trace the request from POST /orders to the database write"</text>
  <text x="95" y="558" font-size="15" fill="var(--info-text)">▶ "Identify all shared mutable state and side effects in OrderService"</text>
  <text x="95" y="586" font-size="15" fill="var(--info-text)">▶ "Map the lifecycle of an order across all service boundaries"</text>
</svg>

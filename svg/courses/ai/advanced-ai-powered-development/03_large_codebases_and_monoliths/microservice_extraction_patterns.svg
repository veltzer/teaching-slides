<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,264.4899 22.9376,0" fill="#333333" />
    </marker>
  </defs>
  <rect width="317.1619" height="640" fill="var(--surface)" rx="6"/>
  <text x="158.5809" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Strangler Fig: Microservice Extraction Pattern</text>
  <text x="51.5388" y="108.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Phase 1: Before</text>
  <text x="158.5809" y="108.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Phase 2: Transition</text>
  <text x="265.6231" y="108.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Phase 3: After</text>
  <rect x="11.8936" y="128" width="79.2905" height="320" rx="6" fill="var(--danger-fill)" fill-opacity="0.8" stroke="var(--danger-border)" stroke-width="2" />
  <text x="51.5388" y="208" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Monolith</text>
  <text x="51.5388" y="248" text-anchor="middle" fill="var(--danger-accent)" font-size="10">auth module</text>
  <text x="51.5388" y="280" text-anchor="middle" fill="var(--danger-accent)" font-size="10">payments module</text>
  <text x="51.5388" y="312" text-anchor="middle" fill="var(--danger-accent)" font-size="10">billing module</text>
  <text x="51.5388" y="344" text-anchor="middle" fill="var(--danger-accent)" font-size="10">notifications</text>
  <text x="51.5388" y="384" text-anchor="middle" fill="var(--danger-accent)" font-size="10">2M LOC</text>
  <line x1="91.184" y1="288" x2="107.0421" y2="288" stroke="var(--text)" stroke-width="0.7929" marker-end="url(#arr)" />
  <rect x="107.0421" y="128" width="51.5388" height="320" rx="6" fill="var(--danger-fill)" fill-opacity="0.5" stroke="var(--danger-border)" stroke-width="2" />
  <text x="132.8115" y="208" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Monolith</text>
  <text x="132.8115" y="243.2" text-anchor="middle" fill="var(--danger-accent)" font-size="10">(shrinking)</text>
  <text x="132.8115" y="280" text-anchor="middle" fill="var(--danger-accent)" font-size="10">payments</text>
  <text x="132.8115" y="312" text-anchor="middle" fill="var(--danger-accent)" font-size="10">billing</text>
  <text x="132.8115" y="344" text-anchor="middle" fill="var(--danger-accent)" font-size="10">notifications</text>
  <rect x="130.8293" y="336" width="55.5033" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="158.5809" y="372.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Proxy / Facade</text>
  <text x="158.5809" y="401.6" text-anchor="middle" fill="var(--warn-accent)" font-size="10">AI-generated adapter</text>
  <rect x="162.5455" y="128" width="51.5388" height="192" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="188.3149" y="188.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">New Service</text>
  <text x="188.3149" y="224" text-anchor="middle" fill="var(--ok-accent)" font-size="10">auth module</text>
  <text x="188.3149" y="259.2" text-anchor="middle" fill="var(--ok-accent)" font-size="10">(extracted)</text>
  <text x="188.3149" y="294.4" text-anchor="middle" fill="var(--ok-accent)" font-size="10">own deploy</text>
  <line x1="158.5809" y1="320" x2="158.5809" y2="336" stroke="var(--warn-border)" stroke-width="0.5947" marker-end="url(#arr)" />
  <line x1="186.3326" y1="320" x2="158.5809" y2="336" stroke="var(--warn-border)" stroke-width="0.5947" />
  <line x1="214.0843" y1="288" x2="229.9424" y2="288" stroke="var(--text)" stroke-width="0.7929" marker-end="url(#arr)" />
  <rect x="229.9424" y="128" width="51.5388" height="120" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="255.7118" y="179.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Auth Service</text>
  <text x="255.7118" y="211.2" text-anchor="middle" fill="var(--ok-accent)" font-size="10">independent</text>
  <rect x="229.9424" y="264" width="51.5388" height="120" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="255.7118" y="315.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Pay Service</text>
  <text x="255.7118" y="347.2" text-anchor="middle" fill="var(--ok-accent)" font-size="10">independent</text>
  <rect x="229.9424" y="400" width="51.5388" height="64" rx="6" fill="var(--danger-fill)" fill-opacity="0.3" stroke="var(--danger-border)" stroke-width="2" />
  <text x="255.7118" y="441.6" text-anchor="middle" fill="var(--text-muted)" font-size="10">Remaining...</text>
  <rect x="11.8936" y="496" width="293.3747" height="120" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="158.5809" y="540.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">AI-Assisted Strangler Fig Steps</text>
  <text x="158.5809" y="576" text-anchor="middle" font-size="10" fill="var(--text)">1. AI identifies public API surface → 2. generates proxy service → 3. migrates endpoints one-by-one</text>
  <text x="158.5809" y="604.8" text-anchor="middle" font-size="10" fill="var(--text)">4. AI writes data sync logic → 5. all endpoints migrated → 6. retire proxy</text>
</svg>
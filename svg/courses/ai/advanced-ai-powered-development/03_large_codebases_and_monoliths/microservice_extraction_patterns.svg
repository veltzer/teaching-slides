  <text x="642.690583" y="85.789474" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.414515" font-weight="bold" fill="var(--warn-accent)">Phase 2: Transition</text>
  <text x="1089.327354" y="85.789474" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.414515" font-weight="bold" fill="var(--ok-accent)">Phase 3: After</text>

  <!-- Phase 1: Monolith -->

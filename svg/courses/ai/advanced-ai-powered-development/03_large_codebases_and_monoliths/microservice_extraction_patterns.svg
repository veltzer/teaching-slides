<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,264.4899 22.9376,0" fill="#333333" />
    </marker>
  </defs>
  <rect width="287.428" height="580" fill="var(--surface)" rx="6" x="496.286" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Strangler Fig: Microservice Extraction Pattern</text>
  <text x="542.9931" y="138.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Phase 1: Before</text>
  <text x="640" y="138.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Phase 2: Transition</text>
  <text x="737.0069" y="138.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Phase 3: After</text>
  <rect x="507.0646" y="156" width="71.857" height="290" rx="6" fill="var(--danger-fill)" fill-opacity="0.8" stroke="var(--danger-border)" stroke-width="2" />
  <text x="542.9931" y="228.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Monolith</text>
  <text x="542.9931" y="264.75" text-anchor="middle" fill="var(--danger-accent)" font-size="10">auth module</text>
  <text x="542.9931" y="293.75" text-anchor="middle" fill="var(--danger-accent)" font-size="10">payments module</text>
  <text x="542.9931" y="322.75" text-anchor="middle" fill="var(--danger-accent)" font-size="10">billing module</text>
  <text x="542.9931" y="351.75" text-anchor="middle" fill="var(--danger-accent)" font-size="10">notifications</text>
  <text x="542.9931" y="388" text-anchor="middle" fill="var(--danger-accent)" font-size="10">2M LOC</text>
  <line x1="578.9215" y1="301" x2="593.2929" y2="301" stroke="var(--text)" stroke-width="0.7929" marker-end="url(#arr)" />
  <rect x="593.2929" y="156" width="46.707" height="290" rx="6" fill="var(--danger-fill)" fill-opacity="0.5" stroke="var(--danger-border)" stroke-width="2" />
  <text x="616.6464" y="228.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Monolith</text>
  <text x="616.6464" y="260.4" text-anchor="middle" fill="var(--danger-accent)" font-size="10">(shrinking)</text>
  <text x="616.6464" y="293.75" text-anchor="middle" fill="var(--danger-accent)" font-size="10">payments</text>
  <text x="616.6464" y="322.75" text-anchor="middle" fill="var(--danger-accent)" font-size="10">billing</text>
  <text x="616.6464" y="351.75" text-anchor="middle" fill="var(--danger-accent)" font-size="10">notifications</text>
  <rect x="614.8501" y="344.5" width="50.2999" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="377.85" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Proxy / Facade</text>
  <text x="640" y="403.95" text-anchor="middle" fill="var(--warn-accent)" font-size="10">AI-generated adapter</text>
  <rect x="643.5929" y="156" width="46.707" height="174" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="666.9464" y="211.1" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">New Service</text>
  <text x="666.9464" y="243" text-anchor="middle" fill="var(--ok-accent)" font-size="10">auth module</text>
  <text x="666.9464" y="274.9" text-anchor="middle" fill="var(--ok-accent)" font-size="10">(extracted)</text>
  <text x="666.9464" y="306.8" text-anchor="middle" fill="var(--ok-accent)" font-size="10">own deploy</text>
  <line x1="640" y1="330" x2="640" y2="344.5" stroke="var(--warn-border)" stroke-width="0.5947" marker-end="url(#arr)" />
  <line x1="665.1499" y1="330" x2="640" y2="344.5" stroke="var(--warn-border)" stroke-width="0.5947" />
  <line x1="690.2999" y1="301" x2="704.6713" y2="301" stroke="var(--text)" stroke-width="0.7929" marker-end="url(#arr)" />
  <rect x="704.6713" y="156" width="46.707" height="108.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="728.0248" y="202.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Auth Service</text>
  <text x="728.0248" y="231.4" text-anchor="middle" fill="var(--ok-accent)" font-size="10">independent</text>
  <rect x="704.6713" y="279.25" width="46.707" height="108.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="728.0248" y="325.65" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Pay Service</text>
  <text x="728.0248" y="354.65" text-anchor="middle" fill="var(--ok-accent)" font-size="10">independent</text>
  <rect x="704.6713" y="402.5" width="46.707" height="58" rx="6" fill="var(--danger-fill)" fill-opacity="0.3" stroke="var(--danger-border)" stroke-width="2" />
  <text x="728.0248" y="440.2" text-anchor="middle" fill="var(--text-muted)" font-size="10">Remaining...</text>
  <rect x="507.0646" y="489.5" width="265.8708" height="108.75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="530.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">AI-Assisted Strangler Fig Steps</text>
  <text x="640" y="562" text-anchor="middle" font-size="10" fill="var(--text)">1. AI identifies public API surface → 2. generates proxy service → 3. migrates endpoints one-by-one</text>
  <text x="640" y="588.1" text-anchor="middle" font-size="10" fill="var(--text)">4. AI writes data sync logic → 5. all endpoints migrated → 6. retire proxy</text>
</svg>
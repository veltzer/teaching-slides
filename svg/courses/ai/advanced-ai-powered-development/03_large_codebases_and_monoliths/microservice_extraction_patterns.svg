<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Phase labels -->
  <text x="196.053812" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.187485348272" font-weight="bold" fill="var(--danger-accent)">Phase 1: Before</text>
  <text x="642.690583" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.187485348272" font-weight="bold" fill="var(--warn-accent)">Phase 2: Transition</text>
  <text x="1089.327354" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.187485348272" font-weight="bold" fill="var(--ok-accent)">Phase 3: After</text>

  <!-- Phase 1: Monolith -->
  <rect x="40" y="63.673469099708" width="312.107623" height="378.775509938192" rx="9.02940474719" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="196.053812" y="111.02040838484" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.57351290995" font-weight="bold" fill="var(--danger-text)">Monolith</text>
  <text x="196.053812" y="164.285714130612" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.930134682463" fill="var(--danger-text)">auth module</text>
  <text x="196.053812" y="205.714285869388" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.930134682463" fill="var(--danger-text)">payments module</text>
  <text x="196.053812" y="247.142856522449" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.930134682463" fill="var(--danger-text)">billing module</text>
  <text x="196.053812" y="288.571428261225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.930134682463" fill="var(--danger-text)">notifications</text>
  <text x="196.053812" y="347.755101553353" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.80145882857" font-style="italic" fill="var(--danger-text)">~2M LOC</text>
  <text x="196.053812" y="395.102040838484" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.80145882857" font-style="italic" fill="var(--danger-text)">shared deploy</text>

  <!-- Arrow to Phase 2 -->
  <line x1="357.488789" y1="253.061224068805" x2="416.681614" y2="253.061224068805" stroke="var(--text)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Phase 2: Shrinking monolith + proxy + new service -->
  <rect x="422.06278" y="63.673469099708" width="139.910314" height="378.775509938192" rx="9.02940474719" fill="url(#grad-danger)" fill-opacity="0.5" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492.017937" y="105.102040838484" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.930134682463" font-weight="bold" fill="var(--danger-text)">Monolith</text>
  <text x="492.017937" y="134.693877484548" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.544107120785" font-style="italic" fill="var(--danger-text)">(shrinking)</text>
  <text x="492.017937" y="182.040815683965" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.672782974677" fill="var(--danger-text)">payments</text>
  <text x="492.017937" y="215.183673074985" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.672782974677" fill="var(--danger-text)">billing</text>
  <text x="492.017937" y="248.326530466006" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.672782974677" fill="var(--danger-text)">notifications</text>

  <rect x="572.735426" y="205.714285869388" width="139.910314" height="118.367346584257" rx="9.02940474719" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642.690583" y="247.142856522449" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.930134682463" font-weight="bold" fill="var(--warn-text)">Proxy / Facade</text>
  <text x="642.690583" y="276.734693168513" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.544107120785" fill="var(--warn-text)">AI-generated</text>
  <text x="642.690583" y="300.408163353936" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.544107120785" fill="var(--warn-text)">adapter</text>

  <rect x="723.408072" y="63.673469099708" width="139.910314" height="284.081632453644" rx="9.02940474719" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="793.363229" y="111.02040838484" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.930134682463" font-weight="bold" fill="var(--ok-text)">New Service</text>
  <text x="793.363229" y="158.367346584257" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.672782974677" fill="var(--ok-text)">auth module</text>
  <text x="793.363229" y="193.877550776676" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.672782974677" fill="var(--ok-text)">(extracted)</text>
  <text x="793.363229" y="241.224490061808" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.672782974677" fill="var(--ok-text)">own deploy</text>
  <text x="793.363229" y="276.734693168513" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.672782974677" fill="var(--ok-text)">own DB</text>

  <line x1="561.973094" y1="253.061224068805" x2="572.735426" y2="253.061224068805" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="712.64574" y1="205.714285869388" x2="723.408072" y2="205.714285869388" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow to Phase 3 -->
  <line x1="874.080717" y1="253.061224068805" x2="933.273543" y2="253.061224068805" stroke="var(--text)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Phase 3: Independent services -->
  <rect x="938.654709" y="63.673469099708" width="301.345291" height="112.448980123615" rx="9.02940474719" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1089.327354" y="105.102040838484" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.058809494379" font-weight="bold" fill="var(--ok-text)">Auth Service</text>
  <text x="1089.327354" y="140.612245030904" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.672782974677" fill="var(--ok-text)">independent deploy + DB</text>

  <rect x="938.654709" y="193.877550776676" width="301.345291" height="112.448980123615" rx="9.02940474719" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1089.327354" y="235.306122515452" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.058809494379" font-weight="bold" fill="var(--ok-text)">Payments Service</text>
  <text x="1089.327354" y="270.816326707872" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.672782974677" fill="var(--ok-text)">independent deploy + DB</text>

  <rect x="938.654709" y="324.081632453644" width="301.345291" height="112.448980123615" rx="9.02940474719" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1089.327354" y="365.51020419242" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.058809494379" font-weight="bold" fill="var(--ok-text)">Billing Service</text>
  <text x="1089.327354" y="401.02040838484" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.672782974677" fill="var(--ok-text)">independent deploy + DB</text>

  <!-- Bottom steps note -->
  <rect x="40" y="472.040816769679" width="1200" height="147.959183230321" rx="9.02940474719" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642.690583" y="513.469387422741" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.316161202165" font-weight="bold" fill="var(--info-text)">AI-Assisted Strangler Fig Steps</text>
  <text x="642.690583" y="554.897959161516" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.930134682463" fill="var(--info-text)">1. identify public API surface  2. generate proxy service  3. migrate endpoints one-by-one</text>
  <text x="642.690583" y="590.408163353936" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.930134682463" fill="var(--info-text)">4. write data-sync logic  5. complete migration  6. retire proxy</text>
</svg>

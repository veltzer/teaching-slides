<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#333333"/>
    </marker>
    <marker id="arrw" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-accent)">Strangler Fig: Microservice Extraction Pattern</text>

  <!-- Phase labels -->
  <text x="225" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--danger-accent)">Phase 1: Before</text>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--warn-accent)">Phase 2: Transition</text>
  <text x="1055" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--ok-accent)">Phase 3: After</text>

  <!-- Phase 1: Monolith -->
  <rect x="80" y="140" width="290" height="320" rx="8" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="225" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Monolith</text>
  <text x="225" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">auth module</text>
  <text x="225" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">payments module</text>
  <text x="225" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">billing module</text>
  <text x="225" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">notifications</text>
  <text x="225" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--danger-text)">~2M LOC</text>
  <text x="225" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--danger-text)">shared deploy</text>

  <!-- Arrow to Phase 2 -->
  <line x1="375" y1="300" x2="430" y2="300" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Phase 2: Shrinking monolith + proxy + new service -->
  <rect x="435" y="140" width="130" height="320" rx="8" fill="var(--danger-fill)" fill-opacity="0.5" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="500" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-text)">Monolith</text>
  <text x="500" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--danger-text)">(shrinking)</text>
  <text x="500" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">payments</text>
  <text x="500" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">billing</text>
  <text x="500" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">notifications</text>

  <rect x="575" y="260" width="130" height="100" rx="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-text)">Proxy / Facade</text>
  <text x="640" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">AI-generated</text>
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">adapter</text>

  <rect x="715" y="140" width="130" height="240" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="780" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-text)">New Service</text>
  <text x="780" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">auth module</text>
  <text x="780" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">(extracted)</text>
  <text x="780" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">own deploy</text>
  <text x="780" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">own DB</text>

  <line x1="565" y1="300" x2="575" y2="300" stroke="#e65100" stroke-width="2"/>
  <line x1="705" y1="260" x2="715" y2="260" stroke="#e65100" stroke-width="2" marker-end="url(#arrw)"/>

  <!-- Arrow to Phase 3 -->
  <line x1="855" y1="300" x2="910" y2="300" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Phase 3: Independent services -->
  <rect x="915" y="140" width="280" height="95" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1055" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Auth Service</text>
  <text x="1055" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">independent deploy + DB</text>

  <rect x="915" y="250" width="280" height="95" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1055" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Payments Service</text>
  <text x="1055" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">independent deploy + DB</text>

  <rect x="915" y="360" width="280" height="95" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1055" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Billing Service</text>
  <text x="1055" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">independent deploy + DB</text>

  <!-- Bottom steps note -->
  <rect x="80" y="485" width="1115" height="125" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">AI-Assisted Strangler Fig Steps</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">1. identify public API surface  2. generate proxy service  3. migrate endpoints one-by-one</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">4. write data-sync logic  5. complete migration  6. retire proxy</text>
</svg>

  <text x="642.690583" y="276.578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.248102" font-weight="bold" fill="var(--warn-text)">Proxy / Facade</text>
  <text x="642.690583" y="303.834586" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.998481" fill="var(--warn-text)">AI-generated</text>

  <ns0:text x="158.5809" y="540.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#3949AB">AI-Assisted Strangler Fig Steps</ns0:text>
  <ns0:text x="158.5809" y="576" text-anchor="middle" font-size="10" fill="#333">1. AI identifies public API surface → 2. generates proxy service → 3. migrates endpoints one-by-one</ns0:text>
  <ns0:text x="158.5809" y="604.8" text-anchor="middle" font-size="10" fill="#333">4. AI writes data sync logic → 5. all endpoints migrated → 6. retire proxy</ns0:text>

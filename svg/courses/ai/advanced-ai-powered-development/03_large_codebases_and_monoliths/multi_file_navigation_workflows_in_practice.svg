<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,360 29.6198,0" fill="#333333" />
    </marker>
  </defs>
  <rect width="273" height="580" fill="var(--surface)" rx="6.0034" x="503.5" y="40"/>
  <text x="640.0001" y="90.75" text-anchor="middle" font-size="10.0057" font-weight="bold" fill="var(--primary-accent)">Multi-File Navigation Workflow</text>
  <text x="640.0001" y="124.1" text-anchor="middle" font-size="10.0057" fill="var(--text-muted)">Always locate definition → call sites → tests before making changes</text>
  <rect x="513.7375" y="163.25" width="52.8938" height="123.25" rx="6.0034" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="540.0138" y="211.1" text-anchor="middle" fill="var(--bg)" font-size="10.0057" font-weight="bold">1. Definition</text>
  <text x="540.0138" y="243" text-anchor="middle" fill="var(--primary-accent)" font-size="10.0057">OrderService</text>
  <text x="540.0138" y="269.1" text-anchor="middle" fill="var(--primary-accent)" font-size="10.0057">.submitOrder()</text>
  <line x1="566.6313" y1="224.15" x2="576.8688" y2="224.15" stroke="var(--text)" stroke-width="0.7523" marker-end="url(#arr)" />
  <rect x="576.8688" y="163.25" width="52.8938" height="123.25" rx="6.0034" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="603.1451" y="211.1" text-anchor="middle" fill="var(--bg)" font-size="10.0057" font-weight="bold">2. Call Sites</text>
  <text x="603.1451" y="243" text-anchor="middle" fill="var(--ok-accent)" font-size="10.0057">all usages of</text>
  <text x="603.1451" y="269.1" text-anchor="middle" fill="var(--ok-accent)" font-size="10.0057">submitOrder()</text>
  <line x1="629.7625" y1="224.15" x2="640.0001" y2="224.15" stroke="var(--text)" stroke-width="0.7523" marker-end="url(#arr)" />
  <rect x="640.0001" y="163.25" width="52.8938" height="123.25" rx="6.0034" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="666.2763" y="211.1" text-anchor="middle" fill="var(--bg)" font-size="10.0057" font-weight="bold">3. Unit Tests</text>
  <text x="666.2763" y="243" text-anchor="middle" fill="var(--info-accent)" font-size="10.0057">test_order.py</text>
  <text x="666.2763" y="269.1" text-anchor="middle" fill="var(--info-accent)" font-size="10.0057">coverage check</text>
  <line x1="692.8938" y1="224.15" x2="703.1313" y2="224.15" stroke="var(--text)" stroke-width="0.7523" marker-end="url(#arr)" />
  <rect x="703.1313" y="163.25" width="63.1313" height="123.25" rx="6.0034" fill="var(--warn-accent)" stroke="var(--text)" stroke-width="0.7523" />
  <text x="734.5263" y="202.4" text-anchor="middle" fill="var(--bg)" font-size="10.0057" font-weight="bold">4. Integration</text>
  <text x="734.5263" y="231.4" text-anchor="middle" fill="var(--bg)" font-size="10.0057" font-weight="bold">Tests</text>
  <text x="734.5263" y="264.75" text-anchor="middle" fill="var(--warn-accent)" font-size="10.0057">end-to-end flows</text>
  <rect x="513.7375" y="344.5" width="252.525" height="246.5" rx="6.0034" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640.0001" y="388" text-anchor="middle" font-size="10.0057" font-weight="bold" fill="var(--primary-accent)">Navigation Prompt Pattern</text>
  <text x="522.2688" y="428.6" font-size="10.0057" fill="var(--text)">1. "Find the definition of OrderService.submitOrder()"</text>
  <text x="522.2688" y="463.4" font-size="10.0057" fill="var(--text)">2. "Show all call sites of submitOrder() across the codebase"</text>
  <text x="522.2688" y="498.2" font-size="10.0057" fill="var(--text)">3. "Find test files that exercise submitOrder()"</text>
  <text x="522.2688" y="533" font-size="10.0057" fill="var(--text)">4. "Are there integration tests covering the full order flow?"</text>
  <text x="522.2688" y="567.8" font-size="10.0057" fill="var(--text)">5. "Show the database migration for the orders table"</text>
</svg>
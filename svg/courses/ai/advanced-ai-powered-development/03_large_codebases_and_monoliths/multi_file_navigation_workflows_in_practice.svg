<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="85" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-accent)">Multi-File Navigation Workflow</text>
  <text x="640" y="115" text-anchor="middle" font-size="16" fill="var(--text-muted)">Locate definition → call sites → tests before making changes</text>

  <rect x="70" y="150" width="250" height="170" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="195" y="195" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--primary-text)">1. Definition</text>
  <text x="195" y="240" text-anchor="middle" font-size="15" fill="var(--primary-text)">OrderService</text>
  <text x="195" y="268" text-anchor="middle" font-size="15" fill="var(--primary-text)">.submitOrder()</text>

  <line x1="320" y1="235" x2="355" y2="235" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="360" y="150" width="250" height="170" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="485" y="195" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ok-text)">2. Call Sites</text>
  <text x="485" y="240" text-anchor="middle" font-size="15" fill="var(--ok-text)">all usages of</text>
  <text x="485" y="268" text-anchor="middle" font-size="15" fill="var(--ok-text)">submitOrder()</text>

  <line x1="610" y1="235" x2="645" y2="235" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="650" y="150" width="250" height="170" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="775" y="195" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--info-text)">3. Unit Tests</text>
  <text x="775" y="240" text-anchor="middle" font-size="15" fill="var(--info-text)">test_order.py</text>
  <text x="775" y="268" text-anchor="middle" font-size="15" fill="var(--info-text)">coverage check</text>

  <line x1="900" y1="235" x2="935" y2="235" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="940" y="150" width="250" height="170" rx="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1065" y="195" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--warn-text)">4. Integration</text>
  <text x="1065" y="221" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--warn-text)">Tests</text>
  <text x="1065" y="268" text-anchor="middle" font-size="15" fill="var(--warn-text)">end-to-end flows</text>

  <rect x="70" y="360" width="1120" height="240" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="630" y="395" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--info-text)">Navigation Prompt Pattern</text>
  <text x="100" y="435" font-size="16" fill="var(--info-text)">1. "Find the definition of OrderService.submitOrder()"</text>
  <text x="100" y="465" font-size="16" fill="var(--info-text)">2. "Show all call sites of submitOrder() across the codebase"</text>
  <text x="100" y="495" font-size="16" fill="var(--info-text)">3. "Find test files that exercise submitOrder()"</text>
  <text x="100" y="525" font-size="16" fill="var(--info-text)">4. "Are there integration tests covering the full order flow?"</text>
  <text x="100" y="555" font-size="16" fill="var(--info-text)">5. "Show the database migration for the orders table"</text>
</svg>

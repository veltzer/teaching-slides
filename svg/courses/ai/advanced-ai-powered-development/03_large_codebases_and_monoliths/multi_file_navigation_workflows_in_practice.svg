<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="84.6281" markerHeight="252" refX="76.1652" refY="126" orient="auto">
      <polygon points="0,360 29.6198,0" fill="#333333" />
    </marker>
  </defs>
  <rect width="300.8999" height="640" fill="var(--surface-light)" />
  <text x="150.45" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Multi-File Navigation Workflow</text>
  <text x="150.45" y="92.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">Always locate definition → call sites → tests before making changes</text>
  <rect x="11.2837" y="136" width="58.2994" height="136" rx="3.7612" fill="var(--primary-mid)" stroke="var(--text-dark)" stroke-width="0.7523" />
  <text x="40.2454" y="188.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">1. Definition</text>
  <text x="40.2454" y="224" text-anchor="middle" fill="var(--primary-pale)" font-size="10">OrderService</text>
  <text x="40.2454" y="252.8" text-anchor="middle" fill="var(--primary-pale)" font-size="10">.submitOrder()</text>
  <line x1="69.5831" y1="203.2" x2="80.8668" y2="203.2" stroke="var(--text-dark)" stroke-width="0.7523" marker-end="url(#arr)" />
  <rect x="80.8668" y="136" width="58.2994" height="136" rx="3.7612" fill="var(--ok-soft)" stroke="var(--text-dark)" stroke-width="0.7523" />
  <text x="109.8285" y="188.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">2. Call Sites</text>
  <text x="109.8285" y="224" text-anchor="middle" fill="var(--ok-pale2)" font-size="10">all usages of</text>
  <text x="109.8285" y="252.8" text-anchor="middle" fill="var(--ok-pale2)" font-size="10">submitOrder()</text>
  <line x1="139.1662" y1="203.2" x2="150.45" y2="203.2" stroke="var(--text-dark)" stroke-width="0.7523" marker-end="url(#arr)" />
  <rect x="150.45" y="136" width="58.2994" height="136" rx="3.7612" fill="var(--info-soft)" stroke="var(--text-dark)" stroke-width="0.7523" />
  <text x="179.4116" y="188.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">3. Unit Tests</text>
  <text x="179.4116" y="224" text-anchor="middle" fill="var(--info-pale)" font-size="10">test_order.py</text>
  <text x="179.4116" y="252.8" text-anchor="middle" fill="var(--info-pale)" font-size="10">coverage check</text>
  <line x1="208.7493" y1="203.2" x2="220.0331" y2="203.2" stroke="var(--text-dark)" stroke-width="0.7523" marker-end="url(#arr)" />
  <rect x="220.0331" y="136" width="69.5831" height="136" rx="3.7612" fill="var(--warn-dk)" stroke="var(--text-dark)" stroke-width="0.7523" />
  <text x="254.6365" y="179.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">4. Integration</text>
  <text x="254.6365" y="211.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Tests</text>
  <text x="254.6365" y="248" text-anchor="middle" fill="var(--warn-lt)" font-size="10">end-to-end flows</text>
  <rect x="11.2837" y="336" width="278.3324" height="272" rx="3.7612" fill="var(--info-indigo-lt)" stroke="var(--primary-indigo)" stroke-width="0.5642" />
  <text x="150.45" y="384" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-indigo)">Navigation Prompt Pattern</text>
  <text x="20.6869" y="428.8" font-size="10" fill="var(--text-dark)">1. "Find the definition of OrderService.submitOrder()"</text>
  <text x="20.6869" y="467.2" font-size="10" fill="var(--text-dark)">2. "Show all call sites of submitOrder() across the codebase"</text>
  <text x="20.6869" y="505.6" font-size="10" fill="var(--text-dark)">3. "Find test files that exercise submitOrder()"</text>
  <text x="20.6869" y="544" font-size="10" fill="var(--text-dark)">4. "Are there integration tests covering the full order flow?"</text>
  <text x="20.6869" y="582.4" font-size="10" fill="var(--text-dark)">5. "Show the database migration for the orders table"</text>
</svg>
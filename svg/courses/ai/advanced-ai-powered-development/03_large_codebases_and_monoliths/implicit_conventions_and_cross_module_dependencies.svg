<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,202.5 22.9376,0" fill="#c62828" />
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,202.5 22.9376,0" fill="#333333" />
    </marker>
  </defs>
  <rect width="414.2522" height="640" fill="var(--surface)" rx="6"/>
  <text x="207.1261" y="56" text-anchor="middle" font-size="10.3563" font-weight="bold" fill="var(--primary-accent)">Implicit Conventions and Cross-Module Dependencies</text>
  <rect x="20.7126" y="128" width="77.6723" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="59.5488" y="179.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Module A</text>
  <text x="59.5488" y="211.2" text-anchor="middle" fill="var(--primary-accent)" font-size="10">auth / login</text>
  <text x="59.5488" y="240" text-anchor="middle" fill="var(--primary-accent)" font-size="10">team: platform</text>
  <rect x="168.29" y="128" width="77.6723" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="207.1261" y="179.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Module B</text>
  <text x="207.1261" y="211.2" text-anchor="middle" fill="var(--primary-accent)" font-size="10">payments</text>
  <text x="207.1261" y="240" text-anchor="middle" fill="var(--primary-accent)" font-size="10">team: billing</text>
  <rect x="315.8673" y="128" width="77.6723" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="354.7035" y="179.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Module C</text>
  <text x="354.7035" y="211.2" text-anchor="middle" fill="var(--primary-accent)" font-size="10">notifications</text>
  <text x="354.7035" y="240" text-anchor="middle" fill="var(--primary-accent)" font-size="10">team: comms</text>
  <line x1="98.3849" y1="192" x2="168.29" y2="192" stroke="var(--text)" stroke-width="1.0356" stroke-dasharray="4.1425 2.0713" marker-end="url(#arrb)" />
  <text x="133.0785" y="176" text-anchor="middle" font-size="10" fill="var(--text-muted)">hidden coupling</text>
  <line x1="245.9623" y1="192" x2="315.8673" y2="192" stroke="var(--text)" stroke-width="1.0356" stroke-dasharray="4.1425 2.0713" marker-end="url(#arrb)" />
  <text x="280.6559" y="176" text-anchor="middle" font-size="10" fill="var(--text-muted)">event bus</text>
  <rect x="142.3992" y="368" width="129.4538" height="128" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="207.1261" y="420.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Shared Database</text>
  <text x="207.1261" y="452.8" text-anchor="middle" fill="var(--warn-accent)" font-size="10">shared ORM models</text>
  <text x="207.1261" y="480" text-anchor="middle" fill="var(--warn-accent)" font-size="10">owner: DBA team</text>
  <line x1="59.5488" y1="256" x2="155.3446" y2="368" stroke="var(--danger-border)" stroke-width="1.2945" marker-end="url(#arr)" />
  <line x1="207.1261" y1="256" x2="207.1261" y2="368" stroke="var(--danger-border)" stroke-width="1.2945" marker-end="url(#arr)" />
  <line x1="354.7035" y1="256" x2="258.9077" y2="368" stroke="var(--danger-border)" stroke-width="1.2945" marker-end="url(#arr)" />
  <rect x="20.7126" y="536" width="372.827" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="207.1261" y="571.2" text-anchor="middle" font-size="10" fill="var(--danger-accent)" font-weight="bold">Hidden Dependencies Make AI Refactoring Risky</text>
  <text x="207.1261" y="601.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">Document all shared state, event flows, and unwritten rules in CLAUDE.md</text>
</svg>
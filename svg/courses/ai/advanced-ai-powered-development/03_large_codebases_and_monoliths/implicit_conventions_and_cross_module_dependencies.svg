<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,202.5 22.9376,0" fill="#c62828" />
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,202.5 22.9376,0" fill="#333333" />
    </marker>
  </defs>
  <rect width="375.4161" height="580" fill="var(--surface)" rx="6" x="452.292" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Implicit Conventions and Cross-Module Dependencies</text>
  <rect x="471.0628" y="156" width="70.3905" height="116" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="506.2581" y="202.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Module A</text>
  <text x="506.2581" y="231.4" text-anchor="middle" fill="var(--primary-accent)" font-size="10">auth / login</text>
  <text x="506.2581" y="257.5" text-anchor="middle" fill="var(--primary-accent)" font-size="10">team: platform</text>
  <rect x="604.8048" y="156" width="70.3905" height="116" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="202.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Module B</text>
  <text x="640" y="231.4" text-anchor="middle" fill="var(--primary-accent)" font-size="10">payments</text>
  <text x="640" y="257.5" text-anchor="middle" fill="var(--primary-accent)" font-size="10">team: billing</text>
  <rect x="738.5467" y="156" width="70.3905" height="116" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="773.742" y="202.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Module C</text>
  <text x="773.742" y="231.4" text-anchor="middle" fill="var(--primary-accent)" font-size="10">notifications</text>
  <text x="773.742" y="257.5" text-anchor="middle" fill="var(--primary-accent)" font-size="10">team: comms</text>
  <line x1="541.4533" y1="214" x2="604.8048" y2="214" stroke="var(--text)" stroke-width="1.0356" stroke-dasharray="4.1425 2.0713" marker-end="url(#arrb)" />
  <text x="572.8944" y="199.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">hidden coupling</text>
  <line x1="675.1953" y1="214" x2="738.5467" y2="214" stroke="var(--text)" stroke-width="1.0356" stroke-dasharray="4.1425 2.0713" marker-end="url(#arrb)" />
  <text x="706.6364" y="199.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">event bus</text>
  <rect x="581.3412" y="373.5" width="117.3175" height="116" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="421.35" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Shared Database</text>
  <text x="640" y="450.35" text-anchor="middle" fill="var(--warn-accent)" font-size="10">shared ORM models</text>
  <text x="640" y="475" text-anchor="middle" fill="var(--warn-accent)" font-size="10">owner: DBA team</text>
  <line x1="506.2581" y1="272" x2="593.073" y2="373.5" stroke="var(--danger-border)" stroke-width="1.2945" marker-end="url(#arr)" />
  <line x1="640" y1="272" x2="640" y2="373.5" stroke="var(--danger-border)" stroke-width="1.2945" marker-end="url(#arr)" />
  <line x1="773.742" y1="272" x2="686.9271" y2="373.5" stroke="var(--danger-border)" stroke-width="1.2945" marker-end="url(#arr)" />
  <rect x="471.0628" y="525.75" width="337.8745" height="72.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="557.65" text-anchor="middle" font-size="10" fill="var(--danger-accent)" font-weight="bold">Hidden Dependencies Make AI Refactoring Risky</text>
  <text x="640" y="585.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">Document all shared state, event flows, and unwritten rules in CLAUDE.md</text>
</svg>
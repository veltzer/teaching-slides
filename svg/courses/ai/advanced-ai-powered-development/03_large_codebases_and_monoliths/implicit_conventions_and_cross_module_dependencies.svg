<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="590" height="280" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">Implicit Conventions</text>
  <text x="335" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Patterns the team follows but never wrote down</text>
  <text x="335" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Naming schemes and folder layouts</text>
  <text x="335" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Error-handling and logging style</text>
  <text x="335" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Preferred libraries and helpers</text>
  <text x="335" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">AI sees code, not the rules behind it</text>

  <rect x="650" y="40" width="590" height="280" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">Cross-Module Dependencies</text>
  <text x="945" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Changes here break things over there</text>
  <text x="945" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Shared types and schemas</text>
  <text x="945" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Event contracts and queues</text>
  <text x="945" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Invisible coupling through data</text>
  <text x="945" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Local context is not enough</text>

  <rect x="40" y="350" width="1200" height="270" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Why the AI Gets It Wrong</text>

  <rect x="80" y="420" width="360" height="180" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="260" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-accent)">Looks Correct Locally</text>
  <text x="260" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Compiles, passes unit tests,</text>
  <text x="260" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">matches the visible code</text>
  <text x="260" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--text-muted)">but ignores house style</text>

  <rect x="460" y="420" width="360" height="180" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-accent)">Breaks Unseen Modules</text>
  <text x="640" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Callers in other packages</text>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">rely on the old contract</text>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--text-muted)">integration fails at runtime</text>

  <rect x="840" y="420" width="360" height="180" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1020" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-accent)">Fix: Surface the Rules</text>
  <text x="1020" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Style guides in context,</text>
  <text x="1020" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">reference callers, link schemas</text>
  <text x="1020" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--text-muted)">make the implicit explicit</text>

  <line x1="440" y1="510" x2="460" y2="510" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="820" y1="510" x2="840" y2="510" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="414.2522" height="640" fill="var(--surface)" rx="6"/>
  <text x="207.1261" y="56" text-anchor="middle" font-size="10.3563" font-weight="bold" fill="var(--primary-accent)">Skill Inheritance: Project vs Team vs User Level</text>
  <rect x="10.3563" y="96" width="393.5396" height="192" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="207.1261" y="144" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">User-level (~/.claude/skills/)</text>
  <text x="207.1261" y="179.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">Applies to ALL projects — personal defaults, editor preferences, global shortcuts</text>
  <text x="207.1261" y="211.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">example: /my-review, /my-commit with personal style preferences</text>
  <text x="207.1261" y="243.2" text-anchor="middle" font-size="10" fill="var(--text-faint)">lowest priority (overridden by team and project)</text>
  <rect x="20.7126" y="320" width="372.827" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="207.1261" y="363.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Team-level (.claude/teams/backend/)</text>
  <text x="207.1261" y="398.4" text-anchor="middle" font-size="10" fill="var(--text-muted)">Role-specific workflows — backend, frontend, devops skill sets</text>
  <text x="207.1261" y="428.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">example: /db-migrate, /deploy-staging</text>
  <text x="207.1261" y="456" text-anchor="middle" font-size="10" fill="var(--text-faint)">overrides user-level</text>
  <rect x="51.7815" y="512" width="310.6892" height="104" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="207.1261" y="555.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Project-level (.claude/skills/)</text>
  <text x="207.1261" y="587.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">Project-specific — overrides team and user for this repo only</text>
  <text x="207.1261" y="608" text-anchor="middle" font-size="10" fill="var(--text-faint)">highest priority (most specific wins)</text>
</svg>
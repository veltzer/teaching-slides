<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect width="414.2522" height="640" fill="#f8f9fa" />
  <ns0:text x="207.1261" y="56" text-anchor="middle" font-size="10.3563" font-weight="bold" fill="#1a237e">Skill Inheritance: Project vs Team vs User Level</ns0:text>
  <ns0:rect x="10.3563" y="96" width="393.5396" height="192" rx="6.2138" fill="#E1BEE7" stroke="#9C27B0" stroke-width="1.0356" />
  <ns0:text x="207.1261" y="144" text-anchor="middle" font-size="10" font-weight="bold" fill="#6A1B9A">User-level (~/.claude/skills/)</ns0:text>
  <ns0:text x="207.1261" y="179.2" text-anchor="middle" font-size="10" fill="#555">Applies to ALL projects — personal defaults, editor preferences, global shortcuts</ns0:text>
  <ns0:text x="207.1261" y="211.2" text-anchor="middle" font-size="10" fill="#666">example: /my-review, /my-commit with personal style preferences</ns0:text>
  <ns0:text x="207.1261" y="243.2" text-anchor="middle" font-size="10" fill="#888">lowest priority (overridden by team and project)</ns0:text>
  <ns0:rect x="20.7126" y="320" width="372.827" height="160" rx="5.1782" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.0356" />
  <ns0:text x="207.1261" y="363.2" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">Team-level (.claude/teams/backend/)</ns0:text>
  <ns0:text x="207.1261" y="398.4" text-anchor="middle" font-size="10" fill="#555">Role-specific workflows — backend, frontend, devops skill sets</ns0:text>
  <ns0:text x="207.1261" y="428.8" text-anchor="middle" font-size="10" fill="#666">example: /db-migrate, /deploy-staging</ns0:text>
  <ns0:text x="207.1261" y="456" text-anchor="middle" font-size="10" fill="#888">overrides user-level</ns0:text>
  <ns0:rect x="51.7815" y="512" width="310.6892" height="104" rx="4.1425" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.0356" />
  <ns0:text x="207.1261" y="555.2" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Project-level (.claude/skills/)</ns0:text>
  <ns0:text x="207.1261" y="587.2" text-anchor="middle" font-size="10" fill="#555">Project-specific — overrides team and user for this repo only</ns0:text>
  <ns0:text x="207.1261" y="608" text-anchor="middle" font-size="10" fill="#888">highest priority (most specific wins)</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Skill Inheritance: User vs Team vs Project Level</text>

  <rect x="40" y="140" width="1200" height="160" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">User-level — ~/.claude/skills/</text>
  <text x="640" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--info-text)">Applies to every project — personal defaults and editor preferences</text>
  <text x="640" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--info-text)">Examples: /my-review, /my-commit with personal style</text>
  <text x="640" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">lowest priority — overridden by team and project</text>

  <line x1="640" y1="300" x2="640" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="340" width="1040" height="140" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Team-level — .claude/teams/backend/</text>
  <text x="640" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Role-specific workflows — backend, frontend, devops skill sets</text>
  <text x="640" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Examples: /db-migrate, /deploy-staging</text>
  <text x="640" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">overrides user-level</text>

  <line x1="640" y1="480" x2="640" y2="510" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="520" width="800" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">Project-level — .claude/skills/</text>
  <text x="640" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">Repo-specific — overrides team and user for this project</text>
  <text x="640" y="614" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">highest priority — most specific wins</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.321832" font-weight="bold" fill="var(--primary-accent)">Hooks: Automating Actions Around Tool Calls</text>

  <rect x="40" y="101.941748" width="333.333333" height="225.242718" rx="8.949095" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.666667" y="152.621359" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.610011" font-weight="bold" fill="var(--danger-text)">Pre-Hook</text>
  <text x="206.666667" y="214.563107" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.135464" fill="var(--danger-text)">validate / block</text>
  <text x="206.666667" y="253.980583" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.135464" fill="var(--danger-text)">check permissions</text>
  <text x="206.666667" y="293.398058" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.135464" fill="var(--danger-text)">scan secrets</text>

  <line x1="384.444444" y1="214.563107" x2="467.777778" y2="214.563107" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="473.333333" y="101.941748" width="333.333333" height="225.242718" rx="8.949095" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="152.621359" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.610011" font-weight="bold" fill="var(--primary-text)">Tool Execution</text>
  <text x="640" y="214.563107" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.135464" fill="var(--primary-text)">file edit / shell</text>
  <text x="640" y="253.980583" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.135464" fill="var(--primary-text)">git / network</text>
  <text x="640" y="293.398058" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.135464" fill="var(--primary-text)">the actual action</text>

  <line x1="817.777778" y1="214.563107" x2="901.111111" y2="214.563107" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="906.666667" y="101.941748" width="333.333333" height="225.242718" rx="8.949095" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1073.333333" y="152.621359" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.610011" font-weight="bold" fill="var(--ok-text)">Post-Hook</text>
  <text x="1073.333333" y="214.563107" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.135464" fill="var(--ok-text)">notify / log</text>
  <text x="1073.333333" y="253.980583" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.135464" fill="var(--ok-text)">run tests</text>
  <text x="1073.333333" y="293.398058" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.135464" fill="var(--ok-text)">trigger downstream</text>

  <rect x="40" y="372.23301" width="377.777778" height="247.76699" rx="8.949095" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="228.888889" y="411.650485" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.135464" font-weight="bold" fill="var(--danger-accent)">Block Dangerous Commands</text>
  <text x="62.222222" y="462.330097" font-size="17.89819" fill="var(--text)" font-family="Courier New, monospace">event: bash_command</text>
  <text x="62.222222" y="501.747573" font-size="17.89819" fill="var(--text)" font-family="Courier New, monospace">match: "rm -rf | DROP"</text>
  <text x="62.222222" y="541.165049" font-size="17.89819" fill="var(--text)" font-family="Courier New, monospace">action: block</text>
  <text x="62.222222" y="586.213592" font-family="Arial, sans-serif" font-size="15.660916" fill="var(--text-muted)">Pre-hook guards destructive actions</text>

  <rect x="451.111111" y="372.23301" width="377.777778" height="247.76699" rx="8.949095" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="411.650485" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.135464" font-weight="bold" fill="var(--ok-accent)">Scan Files for Secrets</text>
  <text x="473.333333" y="462.330097" font-size="17.89819" fill="var(--text)" font-family="Courier New, monospace">event: file_edit</text>
  <text x="473.333333" y="501.747573" font-size="17.89819" fill="var(--text)" font-family="Courier New, monospace">run: scan_secrets.sh</text>
  <text x="473.333333" y="541.165049" font-size="17.89819" fill="var(--text)" font-family="Courier New, monospace">on_fail: block</text>
  <text x="473.333333" y="586.213592" font-family="Arial, sans-serif" font-size="15.660916" fill="var(--text-muted)">Catches credentials before commit</text>

  <rect x="862.222222" y="372.23301" width="377.777778" height="247.76699" rx="8.949095" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1051.111111" y="411.650485" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.135464" font-weight="bold" fill="var(--primary-accent)">Notify Slack on PR Create</text>
  <text x="884.444444" y="462.330097" font-size="17.89819" fill="var(--text)" font-family="Courier New, monospace">event: pr_create</text>
  <text x="884.444444" y="501.747573" font-size="17.89819" fill="var(--text)" font-family="Courier New, monospace">run: notify_slack.sh</text>
  <text x="884.444444" y="541.165049" font-size="17.89819" fill="var(--text)" font-family="Courier New, monospace">args: $PR_NUMBER</text>
  <text x="884.444444" y="586.213592" font-family="Arial, sans-serif" font-size="15.660916" fill="var(--text-muted)">Post-hook pings the team</text>
</svg>

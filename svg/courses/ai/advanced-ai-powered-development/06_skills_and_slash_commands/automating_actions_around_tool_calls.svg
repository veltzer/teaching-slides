<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--primary-accent)">Hooks: Automating Actions Around Tool Calls</text>

  <rect x="100" y="140" width="300" height="200" rx="8" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="250" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Pre-Hook</text>
  <text x="250" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">validate / block</text>
  <text x="250" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">check permissions</text>
  <text x="250" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">scan secrets</text>

  <line x1="410" y1="240" x2="485" y2="240" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="490" y="140" width="300" height="200" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Tool Execution</text>
  <text x="640" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">file edit / shell</text>
  <text x="640" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">git / network</text>
  <text x="640" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">the actual action</text>

  <line x1="800" y1="240" x2="875" y2="240" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="880" y="140" width="300" height="200" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1030" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Post-Hook</text>
  <text x="1030" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">notify / log</text>
  <text x="1030" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">run tests</text>
  <text x="1030" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">trigger downstream</text>

  <rect x="100" y="380" width="340" height="220" rx="8" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="270" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-accent)">Block Dangerous Commands</text>
  <text x="120" y="460" font-family="Courier, monospace" font-size="16" fill="var(--text)">event: bash_command</text>
  <text x="120" y="495" font-family="Courier, monospace" font-size="16" fill="var(--text)">match: "rm -rf | DROP"</text>
  <text x="120" y="530" font-family="Courier, monospace" font-size="16" fill="var(--text)">action: block</text>
  <text x="120" y="570" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Pre-hook guards destructive actions</text>

  <rect x="470" y="380" width="340" height="220" rx="8" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-accent)">Scan Files for Secrets</text>
  <text x="490" y="460" font-family="Courier, monospace" font-size="16" fill="var(--text)">event: file_edit</text>
  <text x="490" y="495" font-family="Courier, monospace" font-size="16" fill="var(--text)">run: scan_secrets.sh</text>
  <text x="490" y="530" font-family="Courier, monospace" font-size="16" fill="var(--text)">on_fail: block</text>
  <text x="490" y="570" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Catches credentials before commit</text>

  <rect x="840" y="380" width="340" height="220" rx="8" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1010" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">Notify Slack on PR Create</text>
  <text x="860" y="460" font-family="Courier, monospace" font-size="16" fill="var(--text)">event: pr_create</text>
  <text x="860" y="495" font-family="Courier, monospace" font-size="16" fill="var(--text)">run: notify_slack.sh</text>
  <text x="860" y="530" font-family="Courier, monospace" font-size="16" fill="var(--text)">args: $PR_NUMBER</text>
  <text x="860" y="570" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Post-hook pings the team</text>
</svg>

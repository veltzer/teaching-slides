<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="45.511" markerHeight="362.88" refX="40.96" refY="181.44" orient="auto">
      <polygon points="0,518.4 15.929,0" fill="#666" />
    </marker>
  </defs>
  <rect width="112.3731" height="640" fill="var(--surface-light)" />
  <text x="56.1866" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Skill Composition: /ship-it Pipeline</text>
  <rect x="2.8093" y="128" width="16.856" height="112" rx="1.4047" fill="var(--primary-deeper)" stroke="var(--primary-indigo)" stroke-width="0.2809" />
  <text x="11.2373" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">/ship-it</text>
  <text x="11.2373" y="212.8" text-anchor="middle" fill="var(--primary-lt)" font-size="10">trigger</text>
  <line x1="19.6653" y1="184" x2="24.5816" y2="184" stroke="var(--text-mid)" stroke-width="0.2809" marker-end="url(#arr)" />
  <rect x="24.5816" y="128" width="18.2606" height="112" rx="1.4047" fill="var(--primary-vivid)" stroke="var(--primary-dk)" stroke-width="0.2809" />
  <text x="33.7119" y="172.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">1. lint</text>
  <text x="33.7119" y="204.8" text-anchor="middle" fill="var(--primary-lt)" font-size="10">code style</text>
  <text x="33.7119" y="228.8" text-anchor="middle" fill="var(--primary-lt)" font-size="10">on_fail: abort</text>
  <line x1="42.8423" y1="184" x2="47.7586" y2="184" stroke="var(--text-mid)" stroke-width="0.2809" marker-end="url(#arr)" />
  <rect x="47.7586" y="128" width="18.2606" height="112" rx="1.4047" fill="var(--ok-light)" stroke="var(--ok-dk)" stroke-width="0.2809" />
  <text x="56.8889" y="172.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">2. review</text>
  <text x="56.8889" y="204.8" text-anchor="middle" fill="var(--ok-lt)" font-size="10">security focus</text>
  <text x="56.8889" y="228.8" text-anchor="middle" fill="var(--ok-lt)" font-size="10">on_fail: abort</text>
  <line x1="66.0192" y1="184" x2="70.9355" y2="184" stroke="var(--text-mid)" stroke-width="0.2809" marker-end="url(#arr)" />
  <rect x="70.9355" y="128" width="18.2606" height="112" rx="1.4047" fill="var(--warn-orange)" stroke="var(--warn-dk)" stroke-width="0.2809" />
  <text x="80.0658" y="172.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">3. commit</text>
  <text x="80.0658" y="204.8" text-anchor="middle" fill="var(--warn-lt)" font-size="10">auto message</text>
  <text x="80.0658" y="228.8" text-anchor="middle" fill="var(--warn-lt)" font-size="10">on_fail: abort</text>
  <line x1="89.1962" y1="184" x2="94.1125" y2="184" stroke="var(--text-mid)" stroke-width="0.2809" marker-end="url(#arr)" />
  <rect x="94.1125" y="128" width="15.4513" height="112" rx="1.4047" fill="var(--info-light)" stroke="var(--info-dk)" stroke-width="0.2809" />
  <text x="101.8381" y="169.6" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">4. create-</text>
  <text x="101.8381" y="198.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">pr</text>
  <text x="101.8381" y="228.8" text-anchor="middle" fill="var(--info-tint)" font-size="10">on_fail: warn</text>
  <text x="56.1866" y="280" text-anchor="middle" font-size="10" fill="var(--text-muted)">context flows from each step to the next</text>
  <rect x="4.214" y="352" width="103.9451" height="256" rx="1.4047" fill="var(--info-indigo-lt)" stroke="var(--primary-indigo)" stroke-width="0.2107" />
  <text x="56.1866" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-indigo)">on_fail Strategies</text>
  <rect x="7.7256" y="428.8" width="21.7723" height="144" rx="1.1237" fill="var(--danger-lt)" stroke="var(--danger-dk)" />
  <text x="18.5416" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-dk)">abort</text>
  <text x="18.5416" y="508.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">stop chain</text>
  <text x="18.5416" y="540.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">immediately</text>
  <rect x="32.0263" y="428.8" width="21.7723" height="144" rx="1.1237" fill="var(--warn-pale4)" stroke="var(--warn-amber)" />
  <text x="42.8423" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-dk)">skip</text>
  <text x="42.8423" y="508.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">log failure,</text>
  <text x="42.8423" y="540.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">continue next</text>
  <rect x="56.327" y="428.8" width="21.7723" height="144" rx="1.1237" fill="var(--ok-pale)" stroke="var(--ok-dk)" />
  <text x="67.1429" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-dk)">warn</text>
  <text x="67.1429" y="508.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">display warning,</text>
  <text x="67.1429" y="540.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">continue</text>
  <rect x="80.6277" y="428.8" width="25.284" height="144" rx="1.1237" fill="var(--primary-pale)" stroke="var(--primary-dk)" />
  <text x="93.2697" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-dk)">retry</text>
  <text x="93.2697" y="508.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">retry N times</text>
  <text x="93.2697" y="540.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">with backoff</text>
</svg>
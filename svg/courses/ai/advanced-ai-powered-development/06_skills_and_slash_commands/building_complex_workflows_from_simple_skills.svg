<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,518.4 15.929,0" fill="#666" />
    </marker>
  </defs>
  <rect width="112.3731" height="640" fill="var(--surface)" rx="6"/>
  <text x="56.1866" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Skill Composition: /ship-it Pipeline</text>
  <rect x="2.8093" y="128" width="16.856" height="112" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="0.2809" />
  <text x="11.2373" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">/ship-it</text>
  <text x="11.2373" y="212.8" text-anchor="middle" fill="var(--primary-accent)" font-size="10">trigger</text>
  <line x1="19.6653" y1="184" x2="24.5816" y2="184" stroke="var(--text-muted)" stroke-width="0.2809" marker-end="url(#arr)" />
  <rect x="24.5816" y="128" width="18.2606" height="112" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="33.7119" y="172.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">1. lint</text>
  <text x="33.7119" y="204.8" text-anchor="middle" fill="var(--primary-accent)" font-size="10">code style</text>
  <text x="33.7119" y="228.8" text-anchor="middle" fill="var(--primary-accent)" font-size="10">on_fail: abort</text>
  <line x1="42.8423" y1="184" x2="47.7586" y2="184" stroke="var(--text-muted)" stroke-width="0.2809" marker-end="url(#arr)" />
  <rect x="47.7586" y="128" width="18.2606" height="112" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="56.8889" y="172.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">2. review</text>
  <text x="56.8889" y="204.8" text-anchor="middle" fill="var(--ok-accent)" font-size="10">security focus</text>
  <text x="56.8889" y="228.8" text-anchor="middle" fill="var(--ok-accent)" font-size="10">on_fail: abort</text>
  <line x1="66.0192" y1="184" x2="70.9355" y2="184" stroke="var(--text-muted)" stroke-width="0.2809" marker-end="url(#arr)" />
  <rect x="70.9355" y="128" width="18.2606" height="112" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="80.0658" y="172.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">3. commit</text>
  <text x="80.0658" y="204.8" text-anchor="middle" fill="var(--warn-accent)" font-size="10">auto message</text>
  <text x="80.0658" y="228.8" text-anchor="middle" fill="var(--warn-accent)" font-size="10">on_fail: abort</text>
  <line x1="89.1962" y1="184" x2="94.1125" y2="184" stroke="var(--text-muted)" stroke-width="0.2809" marker-end="url(#arr)" />
  <rect x="94.1125" y="128" width="15.4513" height="112" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="101.8381" y="169.6" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">4. create-</text>
  <text x="101.8381" y="198.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">pr</text>
  <text x="101.8381" y="228.8" text-anchor="middle" fill="var(--info-accent)" font-size="10">on_fail: warn</text>
  <text x="56.1866" y="280" text-anchor="middle" font-size="10" fill="var(--text-muted)">context flows from each step to the next</text>
  <rect x="4.214" y="352" width="103.9451" height="256" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="56.1866" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">on_fail Strategies</text>
  <rect x="7.7256" y="428.8" width="21.7723" height="144" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="18.5416" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">abort</text>
  <text x="18.5416" y="508.8" text-anchor="middle" font-size="10" fill="var(--text)">stop chain</text>
  <text x="18.5416" y="540.8" text-anchor="middle" font-size="10" fill="var(--text)">immediately</text>
  <rect x="32.0263" y="428.8" width="21.7723" height="144" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="42.8423" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">skip</text>
  <text x="42.8423" y="508.8" text-anchor="middle" font-size="10" fill="var(--text)">log failure,</text>
  <text x="42.8423" y="540.8" text-anchor="middle" font-size="10" fill="var(--text)">continue next</text>
  <rect x="56.327" y="428.8" width="21.7723" height="144" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="67.1429" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">warn</text>
  <text x="67.1429" y="508.8" text-anchor="middle" font-size="10" fill="var(--text)">display warning,</text>
  <text x="67.1429" y="540.8" text-anchor="middle" font-size="10" fill="var(--text)">continue</text>
  <rect x="80.6277" y="428.8" width="25.284" height="144" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="93.2697" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">retry</text>
  <text x="93.2697" y="508.8" text-anchor="middle" font-size="10" fill="var(--text)">retry N times</text>
  <text x="93.2697" y="540.8" text-anchor="middle" font-size="10" fill="var(--text)">with backoff</text>
</svg>
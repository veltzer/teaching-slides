  <ns0:text x="11.2373" y="212.8" text-anchor="middle" fill="#bbdefb" font-size="10">trigger</ns0:text>
  <ns0:line x1="19.6653" y1="184" x2="24.5816" y2="184" stroke="#666" stroke-width="0.2809" marker-end="url(#arr)" />

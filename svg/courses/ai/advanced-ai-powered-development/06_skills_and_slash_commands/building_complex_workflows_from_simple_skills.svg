  <ns0:text x="42.8423" y="540.8" text-anchor="middle" font-size="10" fill="#333">continue next</ns0:text>
  <ns0:rect x="56.327" y="428.8" width="21.7723" height="144" rx="1.1237" fill="#E8F5E9" stroke="#2E7D32" />
  <ns0:text x="67.1429" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">warn</ns0:text>

  <ns0:text x="67.1429" y="540.8" text-anchor="middle" font-size="10" fill="#333">continue</ns0:text>
  <ns0:rect x="80.6277" y="428.8" width="25.284" height="144" rx="1.1237" fill="#E3F2FD" stroke="#1565C0" />
  <ns0:text x="93.2697" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">retry</ns0:text>
  <ns0:text x="93.2697" y="508.8" text-anchor="middle" font-size="10" fill="#333">retry N times</ns0:text>
  <ns0:text x="93.2697" y="540.8" text-anchor="middle" font-size="10" fill="#333">with backoff</ns0:text>

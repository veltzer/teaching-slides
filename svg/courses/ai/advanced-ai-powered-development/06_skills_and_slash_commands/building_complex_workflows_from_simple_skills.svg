<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="180" height="204.705882479815" rx="6.398529432114" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="96.862745372933" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--primary-text)">/ship-it</text>
  <text x="130" y="153.725490745867" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--primary-text)">trigger</text>

  <line x1="230" y1="142.352941239908" x2="260" y2="142.352941239908" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="270" y="40" width="220" height="204.705882479815" rx="6.398529432114" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="96.862745372933" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--primary-text)">1. lint</text>
  <text x="380" y="148.039215453672" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--primary-text)">code style</text>
  <text x="380" y="187.843137106882" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--primary-text)">on_fail: abort</text>

  <line x1="500" y1="142.352941239908" x2="530" y2="142.352941239908" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="540" y="40" width="220" height="204.705882479815" rx="6.398529432114" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="96.862745372933" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--ok-text)">2. review</text>
  <text x="650" y="148.039215453672" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--ok-text)">security focus</text>
  <text x="650" y="187.843137106882" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--ok-text)">on_fail: abort</text>

  <line x1="770" y1="142.352941239908" x2="800" y2="142.352941239908" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="810" y="40" width="220" height="204.705882479815" rx="6.398529432114" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="96.862745372933" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--warn-text)">3. commit</text>
  <text x="920" y="148.039215453672" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--warn-text)">auto message</text>
  <text x="920" y="187.843137106882" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--warn-text)">on_fail: abort</text>

  <line x1="1040" y1="142.352941239908" x2="1070" y2="142.352941239908" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1080" y="40" width="160" height="204.705882479815" rx="6.398529432114" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="96.862745372933" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--info-text)">4. create-pr</text>
  <text x="1160" y="165.098039173395" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--info-text)">on_fail: warn</text>

  <rect x="40" y="301.568627852749" width="1200" height="318.431372147251" rx="6.398529432114" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="352.745097933487" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--text)">on_fail strategies</text>

  <rect x="90" y="392.549019586697" width="260" height="181.960784546328" rx="6.398529432114" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="449.411764959631" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--danger-text)">abort</text>
  <text x="220" y="506.274510332564" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--danger-text)">stop chain</text>
  <text x="220" y="546.078430907343" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--danger-text)">immediately</text>

  <rect x="390" y="392.549019586697" width="260" height="181.960784546328" rx="6.398529432114" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="449.411764959631" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--warn-text)">skip</text>
  <text x="520" y="506.274510332564" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--warn-text)">log failure</text>
  <text x="520" y="546.078430907343" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--warn-text)">continue next</text>

  <rect x="690" y="392.549019586697" width="260" height="181.960784546328" rx="6.398529432114" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="449.411764959631" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--ok-text)">warn</text>
  <text x="820" y="506.274510332564" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--ok-text)">display warning</text>
  <text x="820" y="546.078430907343" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--ok-text)">continue</text>

  <rect x="990" y="392.549019586697" width="200" height="181.960784546328" rx="6.398529432114" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="449.411764959631" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--primary-text)">retry</text>
  <text x="1090" y="506.274510332564" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--primary-text)">N times</text>
  <text x="1090" y="546.078430907343" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--primary-text)">with backoff</text>
</svg>

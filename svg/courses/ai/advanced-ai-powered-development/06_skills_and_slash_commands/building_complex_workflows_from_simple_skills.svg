  <ns0:text x="33.7119" y="228.8" text-anchor="middle" fill="#BBDEFB" font-size="10">on_fail: abort</ns0:text>
  <ns0:line x1="42.8423" y1="184" x2="47.7586" y2="184" stroke="#666" stroke-width="0.2809" marker-end="url(#arr)" />
  <ns0:rect x="47.7586" y="128" width="18.2606" height="112" rx="1.4047" fill="#4CAF50" stroke="#2E7D32" stroke-width="0.2809" />
  <ns0:text x="56.8889" y="172.8" text-anchor="middle" fill="white" font-size="10" font-weight="bold">2. review</ns0:text>
  <ns0:text x="56.8889" y="204.8" text-anchor="middle" fill="#C8E6C9" font-size="10">security focus</ns0:text>
  <ns0:text x="56.8889" y="228.8" text-anchor="middle" fill="#C8E6C9" font-size="10">on_fail: abort</ns0:text>
  <ns0:line x1="66.0192" y1="184" x2="70.9355" y2="184" stroke="#666" stroke-width="0.2809" marker-end="url(#arr)" />
  <ns0:rect x="70.9355" y="128" width="18.2606" height="112" rx="1.4047" fill="#FF9800" stroke="#E65100" stroke-width="0.2809" />
  <ns0:text x="80.0658" y="172.8" text-anchor="middle" fill="white" font-size="10" font-weight="bold">3. commit</ns0:text>
  <ns0:text x="80.0658" y="204.8" text-anchor="middle" fill="#FFE0B2" font-size="10">auto message</ns0:text>
  <ns0:text x="80.0658" y="228.8" text-anchor="middle" fill="#FFE0B2" font-size="10">on_fail: abort</ns0:text>
  <ns0:line x1="89.1962" y1="184" x2="94.1125" y2="184" stroke="#666" stroke-width="0.2809" marker-end="url(#arr)" />
  <ns0:rect x="94.1125" y="128" width="15.4513" height="112" rx="1.4047" fill="#9C27B0" stroke="#6A1B9A" stroke-width="0.2809" />
  <ns0:text x="101.8381" y="169.6" text-anchor="middle" fill="white" font-size="10" font-weight="bold">4. create-</ns0:text>
  <ns0:text x="101.8381" y="198.4" text-anchor="middle" fill="white" font-size="10" font-weight="bold">pr</ns0:text>
  <ns0:text x="101.8381" y="228.8" text-anchor="middle" fill="#E1BEE7" font-size="10">on_fail: warn</ns0:text>
  <ns0:text x="56.1866" y="280" text-anchor="middle" font-size="10" fill="#555">context flows from each step to the next</ns0:text>
  <ns0:rect x="4.214" y="352" width="103.9451" height="256" rx="1.4047" fill="#E8EAF6" stroke="#3949AB" stroke-width="0.2107" />
  <ns0:text x="56.1866" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="#3949AB">on_fail Strategies</ns0:text>
  <ns0:rect x="7.7256" y="428.8" width="21.7723" height="144" rx="1.1237" fill="#FFCDD2" stroke="#C62828" />

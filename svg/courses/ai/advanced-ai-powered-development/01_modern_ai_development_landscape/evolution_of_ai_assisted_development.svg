<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,129.6 8.96,0" fill="#333" />
    </marker>
  </defs>
  <rect width="229.1358" height="580" fill="var(--surface)" rx="6" x="525.4321" y="40"/>
  <text x="640" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Evolution of AI-Assisted Development</text>
  <line x1="542.6173" y1="330" x2="743.1111" y2="330" stroke="var(--text)" stroke-width="0.9481" marker-end="url(#ah)" />
  <circle cx="562.6667" cy="330" r="5.1556" fill="var(--primary-fill)" />
  <text x="562.6667" y="286.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">2018</text>
  <text x="562.6667" y="388" text-anchor="middle" font-size="10" fill="var(--text)">Basic</text>
  <text x="562.6667" y="414.1" text-anchor="middle" font-size="10" fill="var(--text)">Autocomplete</text>
  <rect x="545.4815" y="438.75" width="34.3703" height="87" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="562.6667" y="472.1" text-anchor="middle" font-size="10" fill="var(--text)">Single-line suggestions</text>
  <text x="562.6667" y="495.3" text-anchor="middle" font-size="10" fill="var(--text)">Pattern matching</text>
  <text x="562.6667" y="518.5" text-anchor="middle" font-size="10" fill="var(--text)">No context awareness</text>
  <circle cx="611.358" cy="330" r="5.1556" fill="var(--ok-fill)" />
  <text x="611.358" y="286.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">2021</text>
  <text x="611.358" y="388" text-anchor="middle" font-size="10" fill="var(--text)">Copilot Era</text>
  <text x="611.358" y="414.1" text-anchor="middle" font-size="10" fill="var(--text)">Multi-line gen</text>
  <rect x="594.1729" y="438.75" width="34.3703" height="87" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="611.358" y="472.1" text-anchor="middle" font-size="10" fill="var(--text)">Context-aware</text>
  <text x="611.358" y="495.3" text-anchor="middle" font-size="10" fill="var(--text)">Full function gen</text>
  <text x="611.358" y="518.5" text-anchor="middle" font-size="10" fill="var(--text)">Ghost text UX</text>
  <circle cx="662.9136" cy="330" r="5.1556" fill="var(--warn-fill)" />
  <text x="662.9136" y="286.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">2023</text>
  <text x="662.9136" y="388" text-anchor="middle" font-size="10" fill="var(--text)">Chat Era</text>
  <text x="662.9136" y="414.1" text-anchor="middle" font-size="10" fill="var(--text)">Conversational</text>
  <rect x="645.7284" y="438.75" width="34.3703" height="87" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="662.9136" y="472.1" text-anchor="middle" font-size="10" fill="var(--text)">Explain &amp; refactor</text>
  <text x="662.9136" y="495.3" text-anchor="middle" font-size="10" fill="var(--text)">Review workflows</text>
  <text x="662.9136" y="518.5" text-anchor="middle" font-size="10" fill="var(--text)">Code Q&amp;A</text>
  <circle cx="717.3333" cy="330" r="5.1556" fill="var(--danger-fill)" />
  <text x="717.3333" y="286.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">2024+</text>
  <text x="717.3333" y="388" text-anchor="middle" font-size="10" fill="var(--text)">Agentic Era</text>
  <text x="717.3333" y="414.1" text-anchor="middle" font-size="10" fill="var(--text)">Autonomous</text>
  <rect x="700.1481" y="438.75" width="34.3703" height="87" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="717.3333" y="472.1" text-anchor="middle" font-size="10" fill="var(--text)">Multi-step tasks</text>
  <text x="717.3333" y="495.3" text-anchor="middle" font-size="10" fill="var(--text)">Tool use + loops</text>
  <text x="717.3333" y="518.5" text-anchor="middle" font-size="10" fill="var(--text)">Self-correction</text>
  <text x="587.0123" y="199.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">narrow context</text>
  <text x="637.1358" y="199.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">copy-paste</text>
  <text x="690.1235" y="199.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">full shell access</text>
</svg>
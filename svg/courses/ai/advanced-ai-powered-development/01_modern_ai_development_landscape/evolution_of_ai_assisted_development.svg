<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <line x1="40" y1="258.441558182493" x2="1240" y2="258.441558182493" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="137.358491" y="237.350648660887" width="31.698113" height="42.181817796458" rx="7.835605305411" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.207547" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.95429077336" font-weight="bold" fill="var(--primary-accent)">2018</text>
  <text x="153.207547" y="92.727271933884" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.506817032813" font-weight="bold" fill="var(--text)">Basic Autocomplete</text>
  <text x="153.207547" y="145.454545114522" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.283080162539" fill="var(--text-muted)">narrow context</text>
  <rect x="40" y="333.766233976725" width="226.415094" height="286.233766023275" rx="10.447473740547" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.207547" y="401.558441817507" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--primary-text)">Single-line suggest</text>
  <text x="153.207547" y="469.35064965829" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--primary-text)">Pattern matching</text>
  <text x="153.207547" y="537.142857499072" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--primary-text)">No context</text>
  <text x="153.207547" y="597.402597386406" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--primary-text)">awareness</text>

  <rect x="431.698113" y="237.350648660887" width="31.698113" height="42.181817796458" rx="7.835605305411" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="447.54717" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.95429077336" font-weight="bold" fill="var(--ok-accent)">2021</text>
  <text x="447.54717" y="92.727271933884" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.506817032813" font-weight="bold" fill="var(--text)">Copilot Era</text>
  <text x="447.54717" y="145.454545114522" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.283080162539" fill="var(--text-muted)">file context</text>
  <rect x="334.339623" y="333.766233976725" width="226.415094" height="286.233766023275" rx="10.447473740547" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="447.54717" y="401.558441817507" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--ok-text)">Multi-line gen</text>
  <text x="447.54717" y="469.35064965829" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--ok-text)">Full function gen</text>
  <text x="447.54717" y="537.142857499072" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--ok-text)">Ghost text UX</text>
  <text x="447.54717" y="597.402597386406" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--ok-text)">IDE integrated</text>

  <rect x="726.037736" y="237.350648660887" width="31.698113" height="42.181817796458" rx="7.835605305411" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="741.886792" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.95429077336" font-weight="bold" fill="var(--warn-accent)">2023</text>
  <text x="741.886792" y="92.727271933884" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.506817032813" font-weight="bold" fill="var(--text)">Chat Era</text>
  <text x="741.886792" y="145.454545114522" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.283080162539" fill="var(--text-muted)">copy-paste</text>
  <rect x="628.679245" y="333.766233976725" width="226.415094" height="286.233766023275" rx="10.447473740547" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="741.886792" y="401.558441817507" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--warn-text)">Conversational</text>
  <text x="741.886792" y="469.35064965829" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--warn-text)">Explain, refactor</text>
  <text x="741.886792" y="537.142857499072" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--warn-text)">Review workflows</text>
  <text x="741.886792" y="597.402597386406" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--warn-text)">Code Q&amp;A</text>

  <rect x="1020.377358" y="237.350648660887" width="31.698113" height="42.181817796458" rx="7.835605305411" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036.226415" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.95429077336" font-weight="bold" fill="var(--danger-accent)">2024+</text>
  <text x="1036.226415" y="92.727271933884" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.506817032813" font-weight="bold" fill="var(--text)">Agentic Era</text>
  <text x="1036.226415" y="145.454545114522" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.283080162539" fill="var(--text-muted)">full shell access</text>
  <rect x="923.018868" y="333.766233976725" width="226.415094" height="286.233766023275" rx="10.447473740547" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036.226415" y="401.558441817507" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--danger-text)">Multi-step tasks</text>
  <text x="1036.226415" y="469.35064965829" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--danger-text)">Tool use + loops</text>
  <text x="1036.226415" y="537.142857499072" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--danger-text)">Self-correction</text>
  <text x="1036.226415" y="597.402597386406" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.589014380108" fill="var(--danger-text)">Autonomous</text>
</svg>

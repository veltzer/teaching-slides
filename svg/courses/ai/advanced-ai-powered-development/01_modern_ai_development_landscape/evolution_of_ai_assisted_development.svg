  <text x="151.7037" y="384" text-anchor="middle" font-size="10" fill="var(--text-dark)">Chat Era</text>
  <text x="151.7037" y="412.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">Conversational</text>
  <rect x="132.7407" y="440" width="37.9259" height="96" rx="2.5284" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="0.4741" />
  <text x="151.7037" y="476.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">Explain &amp; refactor</text>
  <text x="151.7037" y="502.4" text-anchor="middle" font-size="10" fill="var(--text-dark)">Review workflows</text>
  <text x="151.7037" y="528" text-anchor="middle" font-size="10" fill="var(--text-dark)">Code Q&amp;A</text>
  <circle cx="211.7531" cy="320" r="5.6889" fill="var(--danger-vivid)" />
  <text x="211.7531" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-dk)">2024+</text>
  <text x="211.7531" y="384" text-anchor="middle" font-size="10" fill="var(--text-dark)">Agentic Era</text>
  <text x="211.7531" y="412.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">Autonomous</text>
  <rect x="192.7901" y="440" width="37.9259" height="96" rx="2.5284" fill="var(--danger-pale3)" stroke="var(--danger-dk)" stroke-width="0.4741" />
  <text x="211.7531" y="476.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">Multi-step tasks</text>
  <text x="211.7531" y="502.4" text-anchor="middle" font-size="10" fill="var(--text-dark)">Tool use + loops</text>

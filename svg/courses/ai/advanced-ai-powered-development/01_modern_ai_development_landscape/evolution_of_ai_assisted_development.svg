<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,2 L11,6 L1,10 Z" fill="#212121"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--primary-accent)">Evolution of AI-Assisted Development</text>

  <line x1="120" y1="330" x2="1180" y2="330" stroke="var(--text)" stroke-width="3" marker-end="url(#arr)"/>

  <circle cx="220" cy="330" r="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="220" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--primary-accent)">2018</text>
  <text x="220" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Basic Autocomplete</text>
  <text x="220" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">narrow context</text>
  <rect x="120" y="380" width="200" height="190" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="220" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Single-line suggest</text>
  <text x="220" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Pattern matching</text>
  <text x="220" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">No context</text>
  <text x="220" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">awareness</text>

  <circle cx="480" cy="330" r="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="480" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--ok-accent)">2021</text>
  <text x="480" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Copilot Era</text>
  <text x="480" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">file context</text>
  <rect x="380" y="380" width="200" height="190" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="480" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Multi-line gen</text>
  <text x="480" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Full function gen</text>
  <text x="480" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Ghost text UX</text>
  <text x="480" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">IDE integrated</text>

  <circle cx="740" cy="330" r="14" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="740" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--warn-accent)">2023</text>
  <text x="740" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Chat Era</text>
  <text x="740" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">copy-paste</text>
  <rect x="640" y="380" width="200" height="190" rx="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="740" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Conversational</text>
  <text x="740" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Explain, refactor</text>
  <text x="740" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Review workflows</text>
  <text x="740" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Code Q&amp;A</text>

  <circle cx="1000" cy="330" r="14" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1000" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--danger-accent)">2024+</text>
  <text x="1000" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Agentic Era</text>
  <text x="1000" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">full shell access</text>
  <rect x="900" y="380" width="200" height="190" rx="8" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1000" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Multi-step tasks</text>
  <text x="1000" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Tool use + loops</text>
  <text x="1000" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Self-correction</text>
  <text x="1000" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Autonomous</text>
</svg>

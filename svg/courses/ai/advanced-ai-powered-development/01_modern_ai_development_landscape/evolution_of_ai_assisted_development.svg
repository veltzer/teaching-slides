  <text x="94.8148" y="412.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">Multi-line gen</text>
  <rect x="75.8519" y="440" width="37.9259" height="96" rx="2.5284" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="0.4741" />
  <text x="94.8148" y="476.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">Context-aware</text>
  <text x="94.8148" y="502.4" text-anchor="middle" font-size="10" fill="var(--text-dark)">Full function gen</text>
  <text x="94.8148" y="528" text-anchor="middle" font-size="10" fill="var(--text-dark)">Ghost text UX</text>

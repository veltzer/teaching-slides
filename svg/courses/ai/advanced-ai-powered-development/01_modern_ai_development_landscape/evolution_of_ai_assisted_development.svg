  <text x="41.0864" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-dk)">2018</text>
  <text x="41.0864" y="384" text-anchor="middle" font-size="10" fill="var(--text-dark)">Basic</text>
  <text x="41.0864" y="412.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">Autocomplete</text>
  <rect x="22.1235" y="440" width="37.9259" height="96" rx="2.5284" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="0.4741" />
  <text x="41.0864" y="476.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">Single-line suggestions</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="220" height="227.450980413303" rx="6.398529432114" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="102.549019586697" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--primary-text)">System Prompt</text>
  <text x="150" y="159.411764959631" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--primary-text)">persona +</text>
  <text x="150" y="193.529412399077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--primary-text)">constraints</text>
  <line x1="270" y1="153.725490745867" x2="290" y2="153.725490745867" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="300" y="40" width="220" height="227.450980413303" rx="6.398529432114" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="102.549019586697" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--ok-text)">User Message</text>
  <text x="410" y="159.411764959631" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--ok-text)">task or</text>
  <text x="410" y="193.529412399077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--ok-text)">question</text>
  <line x1="530" y1="153.725490745867" x2="550" y2="153.725490745867" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="560" y="40" width="220" height="227.450980413303" rx="6.398529432114" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="102.549019586697" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--warn-text)">Context (RAG)</text>
  <text x="670" y="159.411764959631" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--warn-text)">retrieved files</text>
  <text x="670" y="193.529412399077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--warn-text)">+ docs</text>
  <line x1="790" y1="153.725490745867" x2="810" y2="153.725490745867" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="820" y="40" width="220" height="227.450980413303" rx="6.398529432114" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="102.549019586697" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--info-text)">Tool Calls</text>
  <text x="930" y="159.411764959631" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--info-text)">shell, files,</text>
  <text x="930" y="193.529412399077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--info-text)">web search</text>
  <line x1="1050" y1="153.725490745867" x2="1070" y2="153.725490745867" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1080" y="40" width="160" height="227.450980413303" rx="6.398529432114" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="102.549019586697" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--danger-text)">Response</text>
  <text x="1160" y="159.411764959631" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--danger-text)">token by token</text>
  <text x="1160" y="193.529412399077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--danger-text)">autoregressive</text>

  <rect x="40" y="324.313725786236" width="1200" height="295.686274213764" rx="6.398529432114" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="375.490195866974" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--text)">Common error sources at each stage</text>
  <text x="150" y="438.039215453672" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" font-weight="bold" fill="var(--primary-accent)">System</text>
  <text x="150" y="477.843137106882" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-muted)">too vague</text>
  <text x="410" y="438.039215453672" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" font-weight="bold" fill="var(--ok-accent)">User</text>
  <text x="410" y="477.843137106882" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-muted)">ambiguous / no examples</text>
  <text x="670" y="438.039215453672" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" font-weight="bold" fill="var(--warn-accent)">RAG</text>
  <text x="670" y="477.843137106882" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-muted)">wrong files retrieved</text>
  <text x="930" y="438.039215453672" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" font-weight="bold" fill="var(--info-accent)">Tools</text>
  <text x="930" y="477.843137106882" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-muted)">bad args / timeouts</text>
  <text x="1160" y="438.039215453672" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" font-weight="bold" fill="var(--danger-accent)">Response</text>
  <text x="1160" y="477.843137106882" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-muted)">hallucinations, bad format</text>
  <text x="640" y="563.137254627066" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-faint)">Debug by tracing which stage first went wrong — don't retry the whole prompt.</text>
</svg>

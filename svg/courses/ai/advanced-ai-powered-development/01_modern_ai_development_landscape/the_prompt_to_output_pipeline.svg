<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,306.7455 10.1944,0" fill="#333" />
    </marker>
  </defs>
  <rect width="110.1482" height="580" fill="var(--surface)" rx="6" x="584.9259" y="40"/>
  <text x="640" y="95.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">The Prompt-to-Output Pipeline</text>
  <rect x="586.3028" y="156" width="17.8991" height="130.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="595.2523" y="196.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">System</text>
  <text x="595.2523" y="222.7" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Prompt</text>
  <text x="595.2523" y="254.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">persona +</text>
  <text x="595.2523" y="276.35" text-anchor="middle" font-size="10" fill="var(--text-muted)">constraints</text>
  <line x1="604.2019" y1="221.25" x2="607.644" y2="221.25" stroke="var(--text)" stroke-width="0.3039" marker-end="url(#ah)" />
  <rect x="607.644" y="156" width="17.8991" height="130.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="616.5935" y="196.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">User</text>
  <text x="616.5935" y="222.7" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Message</text>
  <text x="616.5935" y="254.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">task or</text>
  <text x="616.5935" y="276.35" text-anchor="middle" font-size="10" fill="var(--text-muted)">question</text>
  <line x1="625.543" y1="221.25" x2="628.9852" y2="221.25" stroke="var(--text)" stroke-width="0.3039" marker-end="url(#ah)" />
  <rect x="628.9852" y="156" width="17.8991" height="130.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="637.9347" y="196.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Context</text>
  <text x="637.9347" y="222.7" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">(RAG)</text>
  <text x="637.9347" y="254.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">retrieved</text>
  <text x="637.9347" y="276.35" text-anchor="middle" font-size="10" fill="var(--text-muted)">files + docs</text>
  <line x1="646.8842" y1="221.25" x2="650.3264" y2="221.25" stroke="var(--text)" stroke-width="0.3039" marker-end="url(#ah)" />
  <rect x="650.3264" y="156" width="17.8991" height="130.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="659.2759" y="196.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Tool</text>
  <text x="659.2759" y="222.7" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Calls</text>
  <text x="659.2759" y="254.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">shell, files,</text>
  <text x="659.2759" y="276.35" text-anchor="middle" font-size="10" fill="var(--text-muted)">web search</text>
  <line x1="668.2254" y1="221.25" x2="671.6675" y2="221.25" stroke="var(--text)" stroke-width="0.3039" marker-end="url(#ah)" />
  <rect x="671.6675" y="156" width="21.3412" height="130.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="682.2693" y="196.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Response</text>
  <text x="682.2693" y="222.7" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Generation</text>
  <text x="682.2693" y="254.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">token by token</text>
  <text x="682.2693" y="276.35" text-anchor="middle" font-size="10" fill="var(--text-muted)">autoregressive</text>
  <rect x="586.3028" y="344.5" width="104.6407" height="246.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="388" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Common Error Sources at Each Stage</text>
  <rect x="588.368" y="409.75" width="17.8991" height="159.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="597.3176" y="443.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">System Prompt</text>
  <text x="597.3176" y="472.1" text-anchor="middle" font-size="10" fill="var(--text)">Conflicting</text>
  <text x="597.3176" y="498.2" text-anchor="middle" font-size="10" fill="var(--text)">instructions</text>
  <text x="597.3176" y="524.3" text-anchor="middle" font-size="10" fill="var(--text)">Too vague</text>
  <rect x="608.3324" y="409.75" width="17.8991" height="159.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="617.2819" y="443.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">User Message</text>
  <text x="617.2819" y="472.1" text-anchor="middle" font-size="10" fill="var(--text)">Ambiguous</text>
  <text x="617.2819" y="498.2" text-anchor="middle" font-size="10" fill="var(--text)">No examples</text>
  <text x="617.2819" y="524.3" text-anchor="middle" font-size="10" fill="var(--text)">Poor scope</text>
  <rect x="628.2968" y="409.75" width="17.8991" height="159.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="637.2463" y="443.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">RAG Context</text>
  <text x="637.2463" y="472.1" text-anchor="middle" font-size="10" fill="var(--text)">Wrong files</text>
  <text x="637.2463" y="498.2" text-anchor="middle" font-size="10" fill="var(--text)">Stale index</text>
  <text x="637.2463" y="524.3" text-anchor="middle" font-size="10" fill="var(--text)">Too much</text>
  <rect x="648.2611" y="409.75" width="17.8991" height="159.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="657.2106" y="443.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Tool Calls</text>
  <text x="657.2106" y="472.1" text-anchor="middle" font-size="10" fill="var(--text)">Wrong tool</text>
  <text x="657.2106" y="498.2" text-anchor="middle" font-size="10" fill="var(--text)">Bad args</text>
  <text x="657.2106" y="524.3" text-anchor="middle" font-size="10" fill="var(--text)">Timeouts</text>
  <rect x="668.2254" y="409.75" width="20.6528" height="159.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="678.5518" y="443.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Generation</text>
  <text x="678.5518" y="472.1" text-anchor="middle" font-size="10" fill="var(--text)">Hallucination</text>
  <text x="678.5518" y="498.2" text-anchor="middle" font-size="10" fill="var(--text)">Truncation</text>
  <text x="678.5518" y="524.3" text-anchor="middle" font-size="10" fill="var(--text)">Temperature</text>
</svg>
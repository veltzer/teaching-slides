<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,306.7455 10.1944,0" fill="#333" />
    </marker>
  </defs>
  <rect width="121.5428" height="640" fill="var(--surface)" rx="6"/>
  <text x="60.7714" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">The Prompt-to-Output Pipeline</text>
  <rect x="1.5193" y="128" width="19.7507" height="144" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="11.3946" y="172.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">System</text>
  <text x="11.3946" y="201.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Prompt</text>
  <text x="11.3946" y="236.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">persona +</text>
  <text x="11.3946" y="260.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">constraints</text>
  <line x1="21.27" y1="200" x2="25.0682" y2="200" stroke="var(--text)" stroke-width="0.3039" marker-end="url(#ah)" />
  <rect x="25.0682" y="128" width="19.7507" height="144" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="34.9435" y="172.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">User</text>
  <text x="34.9435" y="201.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Message</text>
  <text x="34.9435" y="236.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">task or</text>
  <text x="34.9435" y="260.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">question</text>
  <line x1="44.8189" y1="200" x2="48.6171" y2="200" stroke="var(--text)" stroke-width="0.3039" marker-end="url(#ah)" />
  <rect x="48.6171" y="128" width="19.7507" height="144" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="58.4925" y="172.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Context</text>
  <text x="58.4925" y="201.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">(RAG)</text>
  <text x="58.4925" y="236.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">retrieved</text>
  <text x="58.4925" y="260.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">files + docs</text>
  <line x1="68.3678" y1="200" x2="72.166" y2="200" stroke="var(--text)" stroke-width="0.3039" marker-end="url(#ah)" />
  <rect x="72.166" y="128" width="19.7507" height="144" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="82.0414" y="172.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Tool</text>
  <text x="82.0414" y="201.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Calls</text>
  <text x="82.0414" y="236.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">shell, files,</text>
  <text x="82.0414" y="260.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">web search</text>
  <line x1="91.9167" y1="200" x2="95.7149" y2="200" stroke="var(--text)" stroke-width="0.3039" marker-end="url(#ah)" />
  <rect x="95.7149" y="128" width="23.5489" height="144" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="107.4134" y="172.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Response</text>
  <text x="107.4134" y="201.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Generation</text>
  <text x="107.4134" y="236.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">token by token</text>
  <text x="107.4134" y="260.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">autoregressive</text>
  <rect x="1.5193" y="336" width="115.4656" height="272" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="60.7714" y="384" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Common Error Sources at Each Stage</text>
  <rect x="3.7982" y="408" width="19.7507" height="176" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="13.6736" y="444.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">System Prompt</text>
  <text x="13.6736" y="476.8" text-anchor="middle" font-size="10" fill="var(--text)">Conflicting</text>
  <text x="13.6736" y="505.6" text-anchor="middle" font-size="10" fill="var(--text)">instructions</text>
  <text x="13.6736" y="534.4" text-anchor="middle" font-size="10" fill="var(--text)">Too vague</text>
  <rect x="25.8278" y="408" width="19.7507" height="176" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="35.7032" y="444.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">User Message</text>
  <text x="35.7032" y="476.8" text-anchor="middle" font-size="10" fill="var(--text)">Ambiguous</text>
  <text x="35.7032" y="505.6" text-anchor="middle" font-size="10" fill="var(--text)">No examples</text>
  <text x="35.7032" y="534.4" text-anchor="middle" font-size="10" fill="var(--text)">Poor scope</text>
  <rect x="47.8575" y="408" width="19.7507" height="176" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="57.7328" y="444.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">RAG Context</text>
  <text x="57.7328" y="476.8" text-anchor="middle" font-size="10" fill="var(--text)">Wrong files</text>
  <text x="57.7328" y="505.6" text-anchor="middle" font-size="10" fill="var(--text)">Stale index</text>
  <text x="57.7328" y="534.4" text-anchor="middle" font-size="10" fill="var(--text)">Too much</text>
  <rect x="69.8871" y="408" width="19.7507" height="176" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="79.7624" y="444.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Tool Calls</text>
  <text x="79.7624" y="476.8" text-anchor="middle" font-size="10" fill="var(--text)">Wrong tool</text>
  <text x="79.7624" y="505.6" text-anchor="middle" font-size="10" fill="var(--text)">Bad args</text>
  <text x="79.7624" y="534.4" text-anchor="middle" font-size="10" fill="var(--text)">Timeouts</text>
  <rect x="91.9167" y="408" width="22.7893" height="176" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="103.3113" y="444.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Generation</text>
  <text x="103.3113" y="476.8" text-anchor="middle" font-size="10" fill="var(--text)">Hallucination</text>
  <text x="103.3113" y="505.6" text-anchor="middle" font-size="10" fill="var(--text)">Truncation</text>
  <text x="103.3113" y="534.4" text-anchor="middle" font-size="10" fill="var(--text)">Temperature</text>
</svg>
      <ns0:polygon points="0,16 0.9247,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="211.3532" height="640" fill="#f8f9fa" />
  <ns0:text x="105.6766" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Transformer Architecture for Developers</ns0:text>
  <ns0:rect x="5.2838" y="160" width="36.9868" height="128" rx="2.6419" fill="#E3F2FD" stroke="#1565C0" stroke-width="0.5284" />
  <ns0:text x="23.7772" y="211.2" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">Input</ns0:text>
  <ns0:text x="23.7772" y="240" text-anchor="middle" font-size="10" fill="#1565C0">Tokens</ns0:text>
  <ns0:text x="23.7772" y="272" text-anchor="middle" font-size="10" fill="#555">code + text</ns0:text>
  <ns0:line x1="42.2706" y1="224" x2="51.5173" y2="224" stroke="#333" stroke-width="0.5284" marker-end="url(#ah)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Pipeline of 4 stages -->
  <rect x="40" y="40" width="264.40678" height="208.800000308" rx="8.688976469121" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="172.20339" y="97.99999923" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.894683716871" font-weight="bold" fill="var(--primary-text)">Input Tokens</text>
  <text x="172.20339" y="150.199999857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377951889434" fill="var(--primary-text)">code + text split</text>
  <text x="172.20339" y="185.000000275" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377951889434" fill="var(--primary-text)">into subwords</text>
  <text x="172.20339" y="225.599999296" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377951889434" fill="var(--primary-text)">embedded as vectors</text>

  <line x1="309.491525" y1="144.400000154" x2="350.169492" y2="144.400000154" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="355.254237" y="40" width="264.40678" height="208.800000308" rx="8.688976469121" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.457627" y="97.99999923" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.894683716871" font-weight="bold" fill="var(--ok-text)">Self-Attention</text>
  <text x="487.457627" y="150.199999857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377951889434" fill="var(--ok-text)">every token sees</text>
  <text x="487.457627" y="185.000000275" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377951889434" fill="var(--ok-text)">every other token</text>
  <text x="487.457627" y="225.599999296" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377951889434" font-style="italic" fill="var(--ok-text)">cost is O(n²)</text>

  <line x1="624.745763" y1="144.400000154" x2="665.423729" y2="144.400000154" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="670.508475" y="40" width="264.40678" height="208.800000308" rx="8.688976469121" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.711864" y="97.99999923" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.894683716871" font-weight="bold" fill="var(--warn-text)">Feed-Forward</text>
  <text x="802.711864" y="150.199999857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377951889434" fill="var(--warn-text)">non-linear</text>
  <text x="802.711864" y="185.000000275" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377951889434" fill="var(--warn-text)">transformations</text>
  <text x="802.711864" y="225.599999296" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377951889434" fill="var(--warn-text)">per-token</text>

  <line x1="940" y1="144.400000154" x2="980.677966" y2="144.400000154" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="985.762712" y="40" width="254.237288" height="208.800000308" rx="8.688976469121" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112.881356" y="97.99999923" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.894683716871" font-weight="bold" fill="var(--danger-text)">Output Probs</text>
  <text x="1112.881356" y="150.199999857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377951889434" fill="var(--danger-text)">softmax over vocab</text>
  <text x="1112.881356" y="185.000000275" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377951889434" fill="var(--danger-text)">sample next token</text>
  <text x="1112.881356" y="225.599999296" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377951889434" font-style="italic" fill="var(--danger-text)">repeat autoregressively</text>

  <!-- Bottom: Why this matters -->
  <rect x="50.169492" y="295.200000132" width="1179.661017" height="324.799999868" rx="8.688976469121" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="347.399999659" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.894683716871" font-weight="bold" fill="var(--text)">Why This Matters for Developers</text>

  <text x="90.847458" y="405.399999989" font-family="Arial, sans-serif" font-size="19.550196531119" fill="var(--text)">• Attention cost scales quadratically — long context is expensive and slow</text>
  <text x="90.847458" y="451.799999813" font-family="Arial, sans-serif" font-size="19.550196531119" fill="var(--text)">• Output is autoregressive: generated one token at a time, no parallel decode</text>
  <text x="90.847458" y="498.199999637" font-family="Arial, sans-serif" font-size="19.550196531119" fill="var(--text)">• Bigger model = more parameters, not larger context window</text>
  <text x="90.847458" y="544.599999461" font-family="Arial, sans-serif" font-size="19.550196531119" fill="var(--text)">• Context window is a model spec — pick model by task size and budget</text>
  <text x="90.847458" y="591.000000385" font-family="Arial, sans-serif" font-size="19.550196531119" fill="var(--text)">• Prompt cache shortcuts repeated prefixes — structure prompts to exploit it</text>
</svg>

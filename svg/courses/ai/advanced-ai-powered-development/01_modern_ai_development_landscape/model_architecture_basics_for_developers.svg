<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.996148" font-weight="bold" fill="var(--text)">Transformer Architecture for Developers</text>

  <!-- Pipeline of 4 stages -->
  <rect x="40" y="92.727273" width="264.40678" height="189.818182" rx="8.284614" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="172.20339" y="145.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.782687" font-weight="bold" fill="var(--primary-text)">Input Tokens</text>
  <text x="172.20339" y="192.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227" fill="var(--primary-text)">code + text split</text>
  <text x="172.20339" y="224.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227" fill="var(--primary-text)">into subwords</text>
  <text x="172.20339" y="261.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227" fill="var(--primary-text)">embedded as vectors</text>

  <line x1="309.491525" y1="187.636364" x2="350.169492" y2="187.636364" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="355.254237" y="92.727273" width="264.40678" height="189.818182" rx="8.284614" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="487.457627" y="145.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.782687" font-weight="bold" fill="var(--ok-text)">Self-Attention</text>
  <text x="487.457627" y="192.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227" fill="var(--ok-text)">every token sees</text>
  <text x="487.457627" y="224.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227" fill="var(--ok-text)">every other token</text>
  <text x="487.457627" y="261.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227" font-style="italic" fill="var(--ok-text)">cost is O(n²)</text>

  <line x1="624.745763" y1="187.636364" x2="665.423729" y2="187.636364" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="670.508475" y="92.727273" width="264.40678" height="189.818182" rx="8.284614" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="802.711864" y="145.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.782687" font-weight="bold" fill="var(--warn-text)">Feed-Forward</text>
  <text x="802.711864" y="192.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227" fill="var(--warn-text)">non-linear</text>
  <text x="802.711864" y="224.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227" fill="var(--warn-text)">transformations</text>
  <text x="802.711864" y="261.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227" fill="var(--warn-text)">per-token</text>

  <line x1="940" y1="187.636364" x2="980.677966" y2="187.636364" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="985.762712" y="92.727273" width="254.237288" height="189.818182" rx="8.284614" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1112.881356" y="145.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.782687" font-weight="bold" fill="var(--danger-text)">Output Probs</text>
  <text x="1112.881356" y="192.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227" fill="var(--danger-text)">softmax over vocab</text>
  <text x="1112.881356" y="224.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227" fill="var(--danger-text)">sample next token</text>
  <text x="1112.881356" y="261.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227" font-style="italic" fill="var(--danger-text)">repeat autoregressively</text>

  <!-- Bottom: Why this matters -->
  <rect x="50.169492" y="324.727273" width="1179.661017" height="295.272727" rx="8.284614" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="372.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.782687" font-weight="bold" fill="var(--text)">Why This Matters for Developers</text>

  <text x="90.847458" y="424.909091" font-family="Arial, sans-serif" font-size="18.640381" fill="var(--text)">• Attention cost scales quadratically — long context is expensive and slow</text>
  <text x="90.847458" y="467.090909" font-family="Arial, sans-serif" font-size="18.640381" fill="var(--text)">• Output is autoregressive: generated one token at a time, no parallel decode</text>
  <text x="90.847458" y="509.272727" font-family="Arial, sans-serif" font-size="18.640381" fill="var(--text)">• Bigger model = more parameters, not larger context window</text>
  <text x="90.847458" y="551.454545" font-family="Arial, sans-serif" font-size="18.640381" fill="var(--text)">• Context window is a model spec — pick model by task size and budget</text>
  <text x="90.847458" y="593.636364" font-family="Arial, sans-serif" font-size="18.640381" fill="var(--text)">• Prompt cache shortcuts repeated prefixes — structure prompts to exploit it</text>
</svg>

  <ns0:text x="175.6873" y="268.8" text-anchor="middle" font-size="10" fill="#555">one token/step</ns0:text>
  <ns0:rect x="5.2838" y="352" width="95.1089" height="240" rx="2.6419" fill="#E8EAF6" stroke="#3949AB" stroke-width="0.3963" />
  <ns0:text x="52.8383" y="396.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#3949AB">Why This Matters for Developers</ns0:text>
  <ns0:text x="9.2467" y="440" font-size="10" fill="#333">▶ Self-attention cost scales quadratically with context length</ns0:text>
  <ns0:text x="9.2467" y="475.2" font-size="10" fill="#333">▶ Longer context = higher cost + latency</ns0:text>
  <ns0:text x="9.2467" y="510.4" font-size="10" fill="#333">▶ Output is autoregressive: one token at a time</ns0:text>
  <ns0:text x="9.2467" y="545.6" font-size="10" fill="#333">▶ Larger models have more params, not bigger context</ns0:text>
  <ns0:rect x="110.9604" y="352" width="93.788" height="240" rx="2.6419" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="0.3963" />
  <ns0:text x="157.7223" y="396.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#6A1B9A">Attention: All Tokens See All Tokens</ns0:text>

  <rect x="66.8734" y="4455" width="1203.7224" height="3037.5" rx="33.4367" fill="#E8EAF6" stroke="#3949AB" stroke-width="5.0156" />
  <text x="668.7347" y="5022" text-anchor="middle" font-size="50.1552" font-weight="bold" fill="#3949AB">Why This Matters for Developers</text>
  <text x="117.0286" y="5568.75" font-size="43.4677" fill="#333">▶ Self-attention cost scales quadratically with context length</text>
  <text x="117.0286" y="6014.25" font-size="43.4677" fill="#333">▶ Longer context = higher cost + latency</text>
  <text x="117.0286" y="6459.75" font-size="43.4677" fill="#333">▶ Output is autoregressive: one token at a time</text>
  <text x="117.0286" y="6905.25" font-size="43.4677" fill="#333">▶ Larger models have more params, not bigger context</text>
  <rect x="1404.3429" y="4455" width="1187.0042" height="3037.5" rx="33.4367" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="5.0156" />

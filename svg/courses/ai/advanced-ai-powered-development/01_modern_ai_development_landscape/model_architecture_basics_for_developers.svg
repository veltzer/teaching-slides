<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,202.5 11.7029,0" fill="#333" />
    </marker>
  </defs>
  <rect width="211.3532" height="640" fill="var(--surface)" rx="6"/>
  <text x="105.6766" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Transformer Architecture for Developers</text>
  <rect x="5.2838" y="160" width="36.9868" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="23.7772" y="211.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Input</text>
  <text x="23.7772" y="240" text-anchor="middle" font-size="10" fill="var(--primary-accent)">Tokens</text>
  <text x="23.7772" y="272" text-anchor="middle" font-size="10" fill="var(--text-muted)">code + text</text>
  <line x1="42.2706" y1="224" x2="51.5173" y2="224" stroke="var(--text)" stroke-width="0.5284" marker-end="url(#ah)" />
  <rect x="51.5173" y="160" width="42.2706" height="128" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="72.6526" y="204.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Self-</text>
  <text x="72.6526" y="233.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Attention</text>
  <text x="72.6526" y="268.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">O(n²) cost</text>
  <line x1="93.788" y1="224" x2="103.0347" y2="224" stroke="var(--text)" stroke-width="0.5284" marker-end="url(#ah)" />
  <rect x="103.0347" y="160" width="42.2706" height="128" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="124.17" y="204.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Feed-</text>
  <text x="124.17" y="233.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Forward</text>
  <text x="124.17" y="268.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">transformations</text>
  <line x1="145.3053" y1="224" x2="154.552" y2="224" stroke="var(--text)" stroke-width="0.5284" marker-end="url(#ah)" />
  <rect x="154.552" y="160" width="42.2706" height="128" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="175.6873" y="204.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Output</text>
  <text x="175.6873" y="233.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Probs</text>
  <text x="175.6873" y="268.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">one token/step</text>
  <rect x="5.2838" y="352" width="95.1089" height="240" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="52.8383" y="396.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Why This Matters for Developers</text>
  <text x="9.2467" y="440" font-size="10" fill="var(--text)">▶ Self-attention cost scales quadratically with context length</text>
  <text x="9.2467" y="475.2" font-size="10" fill="var(--text)">▶ Longer context = higher cost + latency</text>
  <text x="9.2467" y="510.4" font-size="10" fill="var(--text)">▶ Output is autoregressive: one token at a time</text>
  <text x="9.2467" y="545.6" font-size="10" fill="var(--text)">▶ Larger models have more params, not bigger context</text>
  <rect x="110.9604" y="352" width="93.788" height="240" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="157.7223" y="396.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Attention: All Tokens See All Tokens</text>
  <circle cx="121.5281" cy="472" r="4.2271" fill="var(--info-fill)" stroke="var(--info-border)" />
  <text x="121.5281" y="480" text-anchor="middle" font-size="10" fill="var(--text)">def</text>
  <circle cx="137.3796" cy="472" r="4.2271" fill="var(--info-fill)" stroke="var(--info-border)" />
  <text x="137.3796" y="480" text-anchor="middle" font-size="10" fill="var(--text)">fib</text>
  <circle cx="153.2311" cy="472" r="4.2271" fill="var(--info-fill)" stroke="var(--info-border)" />
  <text x="153.2311" y="480" text-anchor="middle" font-size="10" fill="var(--text)">(n)</text>
  <circle cx="169.0825" cy="472" r="4.2271" fill="var(--info-fill)" stroke="var(--info-border)" />
  <text x="169.0825" y="480" text-anchor="middle" font-size="10" fill="var(--text)">return</text>
  <circle cx="187.5759" cy="472" r="4.2271" fill="var(--info-fill)" stroke="var(--info-border)" />
  <text x="187.5759" y="480" text-anchor="middle" font-size="10" fill="var(--text)">n-1</text>
  <line x1="125.7551" y1="472" x2="133.1525" y2="472" stroke="var(--info-border)" stroke-width="0.2642" />
  <line x1="141.6066" y1="472" x2="149.004" y2="472" stroke="var(--info-border)" stroke-width="0.2642" />
  <line x1="157.4581" y1="472" x2="164.8555" y2="472" stroke="var(--info-border)" stroke-width="0.2642" />
  <line x1="173.3096" y1="472" x2="183.3489" y2="472" stroke="var(--info-border)" stroke-width="0.2642" />
  <path d="M 121.5281 446.4 Q 154.552 384 187.5759 446.4" fill="none" stroke="var(--info-border)" stroke-width="0.2642" stroke-dasharray="1.0568 0.5284" />
  <text x="157.7223" y="560" text-anchor="middle" font-size="10" fill="var(--text-muted)">each token attends to every other token</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,202.5 11.7029,0" fill="#333" />
    </marker>
  </defs>
  <rect width="191.5388" height="580" fill="var(--surface)" rx="6" x="544.2306" y="40"/>
  <text x="640" y="95.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Transformer Architecture for Developers</text>
  <rect x="549.019" y="185" width="33.5193" height="116" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="565.7787" y="231.4" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Input</text>
  <text x="565.7787" y="257.5" text-anchor="middle" font-size="10" fill="var(--primary-accent)">Tokens</text>
  <text x="565.7787" y="286.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">code + text</text>
  <line x1="582.5383" y1="243" x2="590.9181" y2="243" stroke="var(--text)" stroke-width="0.5284" marker-end="url(#ah)" />
  <rect x="590.9181" y="185" width="38.3077" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="610.072" y="225.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Self-</text>
  <text x="610.072" y="251.7" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Attention</text>
  <text x="610.072" y="283.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">O(n²) cost</text>
  <line x1="629.226" y1="243" x2="637.6058" y2="243" stroke="var(--text)" stroke-width="0.5284" marker-end="url(#ah)" />
  <rect x="637.6058" y="185" width="38.3077" height="116" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="656.7596" y="225.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Feed-</text>
  <text x="656.7596" y="251.7" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Forward</text>
  <text x="656.7596" y="283.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">transformations</text>
  <line x1="675.9135" y1="243" x2="684.2933" y2="243" stroke="var(--text)" stroke-width="0.5284" marker-end="url(#ah)" />
  <rect x="684.2933" y="185" width="38.3077" height="116" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="703.4472" y="225.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Output</text>
  <text x="703.4472" y="251.7" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Probs</text>
  <text x="703.4472" y="283.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">one token/step</text>
  <rect x="549.019" y="359" width="86.1924" height="217.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="592.1153" y="399.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Why This Matters for Developers</text>
  <text x="552.6104" y="438.75" font-size="10" fill="var(--text)">▶ Self-attention cost scales quadratically with context length</text>
  <text x="552.6104" y="470.65" font-size="10" fill="var(--text)">▶ Longer context = higher cost + latency</text>
  <text x="552.6104" y="502.55" font-size="10" fill="var(--text)">▶ Output is autoregressive: one token at a time</text>
  <text x="552.6104" y="534.45" font-size="10" fill="var(--text)">▶ Larger models have more params, not bigger context</text>
  <rect x="644.7884" y="359" width="84.9954" height="217.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="687.1664" y="399.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Attention: All Tokens See All Tokens</text>
  <circle cx="654.3654" cy="467.75" r="3.8308" fill="var(--info-fill)" stroke="var(--info-border)" />
  <text x="654.3654" y="475" text-anchor="middle" font-size="10" fill="var(--text)">def</text>
  <circle cx="668.7308" cy="467.75" r="3.8308" fill="var(--info-fill)" stroke="var(--info-border)" />
  <text x="668.7308" y="475" text-anchor="middle" font-size="10" fill="var(--text)">fib</text>
  <circle cx="683.0963" cy="467.75" r="3.8308" fill="var(--info-fill)" stroke="var(--info-border)" />
  <text x="683.0963" y="475" text-anchor="middle" font-size="10" fill="var(--text)">(n)</text>
  <circle cx="697.4616" cy="467.75" r="3.8308" fill="var(--info-fill)" stroke="var(--info-border)" />
  <text x="697.4616" y="475" text-anchor="middle" font-size="10" fill="var(--text)">return</text>
  <circle cx="714.2212" cy="467.75" r="3.8308" fill="var(--info-fill)" stroke="var(--info-border)" />
  <text x="714.2212" y="475" text-anchor="middle" font-size="10" fill="var(--text)">n-1</text>
  <line x1="658.1961" y1="467.75" x2="664.9" y2="467.75" stroke="var(--info-border)" stroke-width="0.2642" />
  <line x1="672.5616" y1="467.75" x2="679.2655" y2="467.75" stroke="var(--info-border)" stroke-width="0.2642" />
  <line x1="686.927" y1="467.75" x2="693.6309" y2="467.75" stroke="var(--info-border)" stroke-width="0.2642" />
  <line x1="701.2924" y1="467.75" x2="710.3905" y2="467.75" stroke="var(--info-border)" stroke-width="0.2642" />
  <path d="M 654.3654 444.55 Q 684.2933 388 714.2212 444.55" fill="none" stroke="var(--info-border)" stroke-width="0.2642" stroke-dasharray="1.0568 0.5284" />
  <text x="687.1664" y="547.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">each token attends to every other token</text>
</svg>
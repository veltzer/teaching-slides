  <ns0:text x="72.6526" y="204.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Self-</ns0:text>
  <ns0:text x="72.6526" y="233.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Attention</ns0:text>
  <ns0:text x="72.6526" y="268.8" text-anchor="middle" font-size="10" fill="#555">O(n²) cost</ns0:text>

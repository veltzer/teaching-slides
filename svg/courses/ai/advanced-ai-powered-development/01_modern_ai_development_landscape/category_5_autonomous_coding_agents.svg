<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="220" height="204.705882479815" rx="6.398529432114" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="102.549019586697" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--primary-text)">Read Issue</text>
  <text x="150" y="165.098039173395" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--primary-text)">GitHub / Jira</text>
  <line x1="270" y1="142.352941239908" x2="290" y2="142.352941239908" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="300" y="40" width="220" height="204.705882479815" rx="6.398529432114" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="102.549019586697" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--ok-text)">Plan Steps</text>
  <text x="410" y="165.098039173395" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--ok-text)">task breakdown</text>
  <line x1="530" y1="142.352941239908" x2="550" y2="142.352941239908" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="560" y="40" width="220" height="204.705882479815" rx="6.398529432114" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="102.549019586697" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--warn-text)">Write Code</text>
  <text x="670" y="165.098039173395" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--warn-text)">edit files</text>
  <line x1="790" y1="142.352941239908" x2="810" y2="142.352941239908" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="820" y="40" width="220" height="204.705882479815" rx="6.398529432114" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="102.549019586697" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--danger-text)">Run Tests</text>
  <text x="930" y="165.098039173395" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--danger-text)">iterate on fail</text>
  <line x1="1050" y1="142.352941239908" x2="1070" y2="142.352941239908" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1080" y="40" width="160" height="204.705882479815" rx="6.398529432114" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="102.549019586697" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--info-text)">Push PR</text>
  <text x="1160" y="165.098039173395" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--info-text)">git ops</text>

  <path d="M 930 244.705882479815 Q 930 324.313725786236 670 324.313725786236 Q 410 324.313725786236 410 244.705882479815" fill="none" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-danger)"/>
  <text x="670" y="358.431372147251" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--danger-accent)">self-correct on failure</text>

  <rect x="40" y="392.549019586697" width="1200" height="227.450980413303" rx="6.398529432114" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="443.725490745867" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--text)">What they can do</text>
  <text x="200" y="500.588235040369" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Browse docs</text>
  <text x="460" y="500.588235040369" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Install deps</text>
  <text x="720" y="500.588235040369" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Run CI checks</text>
  <text x="1060" y="500.588235040369" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" font-weight="bold" fill="var(--warn-accent)">SWE-bench ~40–50%</text>
  <text x="640" y="574.509804133026" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-faint)">Real-world issue solve rate on the SWE-bench benchmark, leading models.</text>
</svg>

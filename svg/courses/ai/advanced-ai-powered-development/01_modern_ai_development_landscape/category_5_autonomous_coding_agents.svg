<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,360 11.7029,0" fill="#333" />
    </marker>
  </defs>
  <rect width="118.8862" height="640" fill="var(--surface)" rx="6"/>
  <text x="59.4431" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Autonomous Coding Agents: End-to-End Workflow</text>
  <rect x="2.9722" y="160" width="19.319" height="112" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="12.6317" y="204.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Read</text>
  <text x="12.6317" y="233.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Issue</text>
  <text x="12.6317" y="260.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">GitHub/Jira</text>
  <line x1="22.2912" y1="216" x2="27.4924" y2="216" stroke="var(--text)" stroke-width="0.2972" marker-end="url(#ah)" />
  <rect x="27.4924" y="160" width="19.319" height="112" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="37.1519" y="204.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Plan</text>
  <text x="37.1519" y="233.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Steps</text>
  <text x="37.1519" y="260.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">task breakdown</text>
  <line x1="46.8114" y1="216" x2="52.0127" y2="216" stroke="var(--text)" stroke-width="0.2972" marker-end="url(#ah)" />
  <rect x="52.0127" y="160" width="19.319" height="112" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="61.6722" y="204.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Write</text>
  <text x="61.6722" y="233.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Code</text>
  <text x="61.6722" y="260.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">edit files</text>
  <line x1="71.3317" y1="216" x2="76.533" y2="216" stroke="var(--text)" stroke-width="0.2972" marker-end="url(#ah)" />
  <rect x="76.533" y="160" width="19.319" height="112" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="86.1925" y="204.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Run</text>
  <text x="86.1925" y="233.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Tests</text>
  <text x="86.1925" y="260.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">iterate on fail</text>
  <line x1="95.852" y1="216" x2="101.0532" y2="216" stroke="var(--text)" stroke-width="0.2972" marker-end="url(#ah)" />
  <rect x="101.0532" y="160" width="14.8608" height="112" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="108.4836" y="204.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Push</text>
  <text x="108.4836" y="233.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">PR</text>
  <text x="108.4836" y="260.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">git ops</text>
  <path d="M 86.1925 272 Q 86.1925 352 61.6722 352 Q 52.0127 352 52.0127 272" fill="none" stroke="var(--danger-border)" stroke-width="0.2229" stroke-dasharray="0.743 0.4458" marker-end="url(#ah)" />
  <text x="69.1026" y="376" text-anchor="middle" font-size="10" fill="var(--danger-accent)">self-correct on failure</text>
  <rect x="2.9722" y="432" width="112.9419" height="176" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="59.4431" y="476.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Capabilities of Autonomous Agents</text>
  <rect x="5.9443" y="496" width="22.2912" height="88" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="17.0899" y="536" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Browse Docs</text>
  <text x="17.0899" y="568" text-anchor="middle" font-size="10" fill="var(--text)">fetch + parse</text>
  <rect x="31.2076" y="496" width="22.2912" height="88" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="42.3532" y="536" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Install Deps</text>
  <text x="42.3532" y="568" text-anchor="middle" font-size="10" fill="var(--text)">pip/npm/cargo</text>
  <rect x="56.4709" y="496" width="22.2912" height="88" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="67.6165" y="536" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Run CI Checks</text>
  <text x="67.6165" y="568" text-anchor="middle" font-size="10" fill="var(--text)">lint + test</text>
  <rect x="81.7342" y="496" width="31.2076" height="88" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="97.338" y="536" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">SWE-bench: ~40-50%</text>
  <text x="97.338" y="568" text-anchor="middle" font-size="10" fill="var(--text)">real-world issue solve rate</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
<text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.579136" font-weight="bold" fill="var(--text)">Cost, Latency, and Quality Tradeoffs</text>
<rect x="40" y="76.576577" width="390" height="438.918919" rx="6.133647" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="235" y="139.279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.668233" font-weight="bold" fill="var(--primary-text)">Frontier</text>
<text x="235" y="191.531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445489" fill="var(--primary-text)">Claude Opus, GPT-4o</text>
<text x="235" y="285.585586" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--primary-text)">High quality</text>
<text x="235" y="348.288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--primary-text)">Higher cost</text>
<text x="235" y="410.990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--primary-text)">Slower</text>
<rect x="445" y="76.576577" width="390" height="438.918919" rx="6.133647" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="640" y="139.279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.668233" font-weight="bold" fill="var(--ok-text)">Mid-tier</text>
<text x="640" y="191.531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445489" fill="var(--ok-text)">Claude Sonnet, GPT-4o-mini</text>
<text x="640" y="285.585586" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--ok-text)">Good quality</text>
<text x="640" y="348.288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--ok-text)">Balanced cost</text>
<text x="640" y="410.990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--ok-text)">Moderate speed</text>
<rect x="850" y="76.576577" width="390" height="438.918919" rx="6.133647" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="1045" y="139.279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.668233" font-weight="bold" fill="var(--warn-text)">Small / Local</text>
<text x="1045" y="191.531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445489" fill="var(--warn-text)">Haiku, Codellama</text>
<text x="1045" y="285.585586" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--warn-text)">Lower quality</text>
<text x="1045" y="348.288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--warn-text)">Low cost</text>
<text x="1045" y="410.990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--warn-text)">Very fast</text>
<rect x="40" y="536.396396" width="1200" height="83.603604" rx="6.133647" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="640" y="578.198198" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490038" font-weight="bold" fill="var(--info-text)">Strategy: cheap/fast models for completion, frontier for agentic reasoning</text>
<text x="640" y="607.459459" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--info-text)">Route each call to the smallest model that clears the quality bar.</text>
</svg>

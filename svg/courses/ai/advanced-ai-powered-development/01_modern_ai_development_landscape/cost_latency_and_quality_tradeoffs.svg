<text x="640" y="285.585586" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--ok-text)">Good quality</text>
<text x="640" y="348.288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--ok-text)">Balanced cost</text>
<text x="640" y="410.990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--ok-text)">Moderate speed</text>
<rect x="850" y="76.576577" width="390" height="438.918919" rx="6.133647" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
<text x="1045" y="139.279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.668233" font-weight="bold" fill="var(--warn-text)">Small / Local</text>
<text x="1045" y="191.531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445489" fill="var(--warn-text)">Haiku, Codellama</text>
<text x="1045" y="285.585586" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--warn-text)">Lower quality</text>
<text x="1045" y="348.288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--warn-text)">Low cost</text>
<text x="1045" y="410.990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534587" font-weight="bold" fill="var(--warn-text)">Very fast</text>
<rect x="40" y="536.396396" width="1200" height="83.603604" rx="6.133647" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
<text x="640" y="578.198198" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490038" font-weight="bold" fill="var(--info-text)">Strategy: cheap/fast models for completion, frontier for agentic reasoning</text>
<text x="640" y="607.459459" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.40094" fill="var(--info-text)">Route each call to the smallest model that clears the quality bar.</text>

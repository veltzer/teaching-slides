<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="338" fill="var(--surface)" rx="6.0044" x="40" y="161"/>
  <text x="640" y="193.11" text-anchor="middle" font-size="17.7319" font-weight="bold" fill="var(--primary-accent)">Cost, Latency, and Quality Tradeoffs</text>
  <polygon points="640,220.15 310,439.85 970,439.85" fill="none" stroke="var(--text)" stroke-width="2.25" />
  <polygon points="640,220.15 310,439.85 970,439.85" fill="var(--info-fill)" fill-opacity="0.3" />
  <text x="640" y="207.4749" text-anchor="middle" font-size="15.1987" font-weight="bold" fill="var(--primary-accent)">Quality</text>
  <text x="272.5" y="460.9749" text-anchor="middle" font-size="15.1987" font-weight="bold" fill="var(--ok-accent)">Cost</text>
  <text x="1007.5" y="460.9749" text-anchor="middle" font-size="15.1987" font-weight="bold" fill="var(--danger-accent)">Speed</text>
  <circle cx="580" cy="279.3" r="10.1325" fill="var(--primary-accent)" />
  <text x="700" y="275.0749" font-size="10.1325" font-weight="bold" fill="var(--primary-accent)">Frontier (Claude Opus, GPT-4o)</text>
  <text x="700" y="290.2851" font-size="10.0074" fill="var(--text-muted)">Best quality, high cost, slower</text>
  <circle cx="520" cy="363.8" r="10.1325" fill="var(--ok-fill)" />
  <text x="562" y="359.5749" font-size="10.1325" font-weight="bold" fill="var(--ok-accent)">Mid-tier (Claude Sonnet, GPT-4o-mini)</text>
  <text x="562" y="374.7851" font-size="10.0074" fill="var(--text-muted)">Good balance across all three</text>
  <circle cx="745" cy="401.8251" r="10.1325" fill="var(--danger-fill)" />
  <text x="787" y="397.6" font-size="10.1325" font-weight="bold" fill="var(--danger-accent)">Local/Small (Codellama, Haiku)</text>
  <text x="787" y="412.81" font-size="10.0074" fill="var(--text-muted)">Fast and cheap, lower quality</text>
  <rect x="70" y="456.75" width="1140" height="33.8" rx="6.0044" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="477.8749" text-anchor="middle" font-size="10.9769" fill="var(--text-muted)">Strategy: use cheap/fast models for completion, frontier models for agentic reasoning tasks</text>
</svg>
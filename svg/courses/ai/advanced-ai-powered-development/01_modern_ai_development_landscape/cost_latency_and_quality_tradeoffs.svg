<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect width="1280" height="360" fill="#f9f9f9" />
  <ns0:text x="640" y="34.2" text-anchor="middle" font-size="18.9" font-weight="bold" fill="#1a237e">Cost, Latency, and Quality Tradeoffs</ns0:text>
  <ns0:polygon points="640,63 288,297 992,297" fill="none" stroke="#333" stroke-width="2.25" />
  <ns0:polygon points="640,63 288,297 992,297" fill="#E8EAF6" fill-opacity="0.3" />
  <ns0:text x="640" y="49.5" text-anchor="middle" font-size="16.2" font-weight="bold" fill="#1565C0">Quality</ns0:text>
  <ns0:text x="248" y="319.5" text-anchor="middle" font-size="16.2" font-weight="bold" fill="#2E7D32">Cost</ns0:text>
  <ns0:text x="1032" y="319.5" text-anchor="middle" font-size="16.2" font-weight="bold" fill="#C62828">Speed</ns0:text>
  <ns0:circle cx="576" cy="126" r="10.8" fill="#1565C0" />
  <ns0:text x="704" y="121.5" font-size="10.8" font-weight="bold" fill="#1565C0">Frontier (Claude Opus, GPT-4o)</ns0:text>
  <ns0:text x="704" y="137.7" font-size="10" fill="#555">Best quality, high cost, slower</ns0:text>
  <ns0:circle cx="512" cy="216" r="10.8" fill="#4CAF50" />
  <ns0:text x="556.8" y="211.5" font-size="10.8" font-weight="bold" fill="#2E7D32">Mid-tier (Claude Sonnet, GPT-4o-mini)</ns0:text>
  <ns0:text x="556.8" y="227.7" font-size="10" fill="#555">Good balance across all three</ns0:text>
  <ns0:circle cx="752" cy="256.5" r="10.8" fill="#F44336" />
  <ns0:text x="796.8" y="252" font-size="10.8" font-weight="bold" fill="#C62828">Local/Small (Codellama, Haiku)</ns0:text>
  <ns0:text x="796.8" y="268.2" font-size="10" fill="#555">Fast and cheap, lower quality</ns0:text>
  <ns0:rect x="32" y="315" width="1216" height="36" rx="7.2" fill="#fff8e1" stroke="#F9A825" stroke-width="1.35" />
  <ns0:text x="640" y="337.5" text-anchor="middle" font-size="11.7" fill="#555">Strategy: use cheap/fast models for completion, frontier models for agentic reasoning tasks</ns0:text>
</ns0:svg>
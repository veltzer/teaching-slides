<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,264.4899 11.7029,0" fill="#333" />
    </marker>
  </defs>
  <rect width="146.6469" height="580" fill="var(--surface)" rx="6" x="566.6765" y="40"/>
  <text x="640" y="95.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Industry AI Adoption Patterns</text>
  <rect x="569.4262" y="156" width="29.3294" height="145" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="584.0909" y="199.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Stage 1</text>
  <text x="584.0909" y="228.5" text-anchor="middle" font-size="10" fill="var(--primary-accent)">Individual</text>
  <text x="584.0909" y="254.6" text-anchor="middle" font-size="10" fill="var(--primary-accent)">Pilots</text>
  <text x="584.0909" y="286.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">enthusiasts try tools</text>
  <line x1="598.7555" y1="228.5" x2="605.1713" y2="228.5" stroke="var(--text)" stroke-width="0.4045" marker-end="url(#ah)" />
  <rect x="605.1713" y="156" width="29.3294" height="145" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="619.8361" y="199.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Stage 2</text>
  <text x="619.8361" y="228.5" text-anchor="middle" font-size="10" fill="var(--ok-accent)">Team</text>
  <text x="619.8361" y="254.6" text-anchor="middle" font-size="10" fill="var(--ok-accent)">Adoption</text>
  <text x="619.8361" y="286.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">shared workflows</text>
  <line x1="634.5007" y1="228.5" x2="640.9165" y2="228.5" stroke="var(--text)" stroke-width="0.4045" marker-end="url(#ah)" />
  <rect x="640.9165" y="156" width="29.3294" height="145" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="655.5812" y="199.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Stage 3</text>
  <text x="655.5812" y="228.5" text-anchor="middle" font-size="10" fill="var(--warn-accent)">Org-wide</text>
  <text x="655.5812" y="254.6" text-anchor="middle" font-size="10" fill="var(--warn-accent)">Rollout</text>
  <text x="655.5812" y="286.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">policy + training</text>
  <line x1="670.246" y1="228.5" x2="676.6618" y2="228.5" stroke="var(--text)" stroke-width="0.4045" marker-end="url(#ah)" />
  <rect x="676.6618" y="156" width="33.9121" height="145" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="693.5261" y="199.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Stage 4</text>
  <text x="693.5261" y="228.5" text-anchor="middle" font-size="10" fill="var(--info-accent)">Workflow</text>
  <text x="693.5261" y="254.6" text-anchor="middle" font-size="10" fill="var(--info-accent)">Integration</text>
  <text x="693.5261" y="286.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">AI in CI/CD + review</text>
  <rect x="569.4262" y="359" width="67.8242" height="224.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="603.3382" y="402.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Reported Outcomes</text>
  <text x="572.1758" y="443.1" font-size="10" fill="var(--text)">▶ 20-40% less time on boilerplate + tests</text>
  <text x="572.1758" y="475" font-size="10" fill="var(--text)">▶ Minimal gain on complex architecture tasks</text>
  <text x="572.1758" y="506.9" font-size="10" fill="var(--text)">▶ Highest satisfaction: dev-chosen tools</text>
  <text x="572.1758" y="538.8" font-size="10" fill="var(--text)">▶ ROI requires training + policy investment</text>
  <rect x="642.7496" y="359" width="67.8242" height="224.75" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="676.6618" y="402.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Common Pitfalls</text>
  <text x="645.4993" y="443.1" font-size="10" fill="var(--text)">▶ Mandating tools without training</text>
  <text x="645.4993" y="475" font-size="10" fill="var(--text)">▶ Skipping security review</text>
  <text x="645.4993" y="506.9" font-size="10" fill="var(--text)">▶ Measuring only speed, ignoring quality</text>
  <text x="645.4993" y="538.8" font-size="10" fill="var(--text)">▶ No feedback loops or retrospectives</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:marker id="ah" markerWidth="2.0227" markerHeight="11.2" refX="2.0227" refY="5.6" orient="auto">
      <ns0:polygon points="0,16 0.708,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="161.8173" height="640" fill="#f8f9fa" />
  <ns0:text x="80.9086" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Industry AI Adoption Patterns</ns0:text>
  <ns0:rect x="3.0341" y="128" width="32.3635" height="160" rx="2.0227" fill="#E3F2FD" stroke="#1565C0" stroke-width="0.4045" />
  <ns0:text x="19.2158" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">Stage 1</ns0:text>
  <ns0:text x="19.2158" y="208" text-anchor="middle" font-size="10" fill="#1565C0">Individual</ns0:text>
  <ns0:text x="19.2158" y="236.8" text-anchor="middle" font-size="10" fill="#1565C0">Pilots</ns0:text>
  <ns0:text x="19.2158" y="272" text-anchor="middle" font-size="10" fill="#555">enthusiasts try tools</ns0:text>
  <ns0:line x1="35.3975" y1="208" x2="42.477" y2="208" stroke="#333" stroke-width="0.4045" marker-end="url(#ah)" />
  <ns0:rect x="42.477" y="128" width="32.3635" height="160" rx="2.0227" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.4045" />
  <ns0:text x="58.6588" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Stage 2</ns0:text>
  <ns0:text x="58.6588" y="208" text-anchor="middle" font-size="10" fill="#2E7D32">Team</ns0:text>
  <ns0:text x="58.6588" y="236.8" text-anchor="middle" font-size="10" fill="#2E7D32">Adoption</ns0:text>
  <ns0:text x="58.6588" y="272" text-anchor="middle" font-size="10" fill="#555">shared workflows</ns0:text>
  <ns0:line x1="74.8405" y1="208" x2="81.92" y2="208" stroke="#333" stroke-width="0.4045" marker-end="url(#ah)" />
  <ns0:rect x="81.92" y="128" width="32.3635" height="160" rx="2.0227" fill="#FFF3E0" stroke="#E65100" stroke-width="0.4045" />
  <ns0:text x="98.1017" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">Stage 3</ns0:text>
  <ns0:text x="98.1017" y="208" text-anchor="middle" font-size="10" fill="#E65100">Org-wide</ns0:text>
  <ns0:text x="98.1017" y="236.8" text-anchor="middle" font-size="10" fill="#E65100">Rollout</ns0:text>
  <ns0:text x="98.1017" y="272" text-anchor="middle" font-size="10" fill="#555">policy + training</ns0:text>
  <ns0:line x1="114.2835" y1="208" x2="121.363" y2="208" stroke="#333" stroke-width="0.4045" marker-end="url(#ah)" />
  <ns0:rect x="121.363" y="128" width="37.4202" height="160" rx="2.0227" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="0.4045" />
  <ns0:text x="139.9719" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#6A1B9A">Stage 4</ns0:text>
  <ns0:text x="139.9719" y="208" text-anchor="middle" font-size="10" fill="#6A1B9A">Workflow</ns0:text>
  <ns0:text x="139.9719" y="236.8" text-anchor="middle" font-size="10" fill="#6A1B9A">Integration</ns0:text>
  <ns0:text x="139.9719" y="272" text-anchor="middle" font-size="10" fill="#555">AI in CI/CD + review</ns0:text>
  <ns0:rect x="3.0341" y="352" width="74.8405" height="248" rx="2.0227" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.3034" />
  <ns0:text x="40.4543" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Reported Outcomes</ns0:text>
  <ns0:text x="6.0681" y="444.8" font-size="10" fill="#333">▶ 20-40% less time on boilerplate + tests</ns0:text>
  <ns0:text x="6.0681" y="480" font-size="10" fill="#333">▶ Minimal gain on complex architecture tasks</ns0:text>
  <ns0:text x="6.0681" y="515.2" font-size="10" fill="#333">▶ Highest satisfaction: dev-chosen tools</ns0:text>
  <ns0:text x="6.0681" y="550.4" font-size="10" fill="#333">▶ ROI requires training + policy investment</ns0:text>
  <ns0:rect x="83.9427" y="352" width="74.8405" height="248" rx="2.0227" fill="#FCE4EC" stroke="#C62828" stroke-width="0.3034" />
  <ns0:text x="121.363" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Common Pitfalls</ns0:text>
  <ns0:text x="86.9768" y="444.8" font-size="10" fill="#333">▶ Mandating tools without training</ns0:text>
  <ns0:text x="86.9768" y="480" font-size="10" fill="#333">▶ Skipping security review</ns0:text>
  <ns0:text x="86.9768" y="515.2" font-size="10" fill="#333">▶ Measuring only speed, ignoring quality</ns0:text>
  <ns0:text x="86.9768" y="550.4" font-size="10" fill="#333">▶ No feedback loops or retrospectives</ns0:text>
</ns0:svg>
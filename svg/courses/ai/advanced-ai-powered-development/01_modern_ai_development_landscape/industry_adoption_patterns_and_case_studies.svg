  <text x="668.7347" y="6612.245" text-anchor="middle" font-size="50.1552" font-weight="bold" fill="#2E7D32">Reported Outcomes</text>
  <text x="100.3101" y="7352.8164" font-size="43.4677" fill="#333">▶ 20-40% less time on boilerplate + tests</text>
  <text x="100.3101" y="7934.6937" font-size="43.4677" fill="#333">▶ Minimal gain on complex architecture tasks</text>
  <text x="100.3101" y="8516.5714" font-size="43.4677" fill="#333">▶ Highest satisfaction: dev-chosen tools</text>
  <text x="100.3101" y="9098.4492" font-size="43.4677" fill="#333">▶ ROI requires training + policy investment</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,264.4899 11.7029,0" fill="#333" />
    </marker>
  </defs>
  <rect width="161.8173" height="640" fill="var(--surface)" rx="6"/>
  <text x="80.9086" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Industry AI Adoption Patterns</text>
  <rect x="3.0341" y="128" width="32.3635" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="19.2158" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Stage 1</text>
  <text x="19.2158" y="208" text-anchor="middle" font-size="10" fill="var(--primary-accent)">Individual</text>
  <text x="19.2158" y="236.8" text-anchor="middle" font-size="10" fill="var(--primary-accent)">Pilots</text>
  <text x="19.2158" y="272" text-anchor="middle" font-size="10" fill="var(--text-muted)">enthusiasts try tools</text>
  <line x1="35.3975" y1="208" x2="42.477" y2="208" stroke="var(--text)" stroke-width="0.4045" marker-end="url(#ah)" />
  <rect x="42.477" y="128" width="32.3635" height="160" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="58.6588" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Stage 2</text>
  <text x="58.6588" y="208" text-anchor="middle" font-size="10" fill="var(--ok-accent)">Team</text>
  <text x="58.6588" y="236.8" text-anchor="middle" font-size="10" fill="var(--ok-accent)">Adoption</text>
  <text x="58.6588" y="272" text-anchor="middle" font-size="10" fill="var(--text-muted)">shared workflows</text>
  <line x1="74.8405" y1="208" x2="81.92" y2="208" stroke="var(--text)" stroke-width="0.4045" marker-end="url(#ah)" />
  <rect x="81.92" y="128" width="32.3635" height="160" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="98.1017" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Stage 3</text>
  <text x="98.1017" y="208" text-anchor="middle" font-size="10" fill="var(--warn-accent)">Org-wide</text>
  <text x="98.1017" y="236.8" text-anchor="middle" font-size="10" fill="var(--warn-accent)">Rollout</text>
  <text x="98.1017" y="272" text-anchor="middle" font-size="10" fill="var(--text-muted)">policy + training</text>
  <line x1="114.2835" y1="208" x2="121.363" y2="208" stroke="var(--text)" stroke-width="0.4045" marker-end="url(#ah)" />
  <rect x="121.363" y="128" width="37.4202" height="160" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="139.9719" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Stage 4</text>
  <text x="139.9719" y="208" text-anchor="middle" font-size="10" fill="var(--info-accent)">Workflow</text>
  <text x="139.9719" y="236.8" text-anchor="middle" font-size="10" fill="var(--info-accent)">Integration</text>
  <text x="139.9719" y="272" text-anchor="middle" font-size="10" fill="var(--text-muted)">AI in CI/CD + review</text>
  <rect x="3.0341" y="352" width="74.8405" height="248" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="40.4543" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Reported Outcomes</text>
  <text x="6.0681" y="444.8" font-size="10" fill="var(--text)">▶ 20-40% less time on boilerplate + tests</text>
  <text x="6.0681" y="480" font-size="10" fill="var(--text)">▶ Minimal gain on complex architecture tasks</text>
  <text x="6.0681" y="515.2" font-size="10" fill="var(--text)">▶ Highest satisfaction: dev-chosen tools</text>
  <text x="6.0681" y="550.4" font-size="10" fill="var(--text)">▶ ROI requires training + policy investment</text>
  <rect x="83.9427" y="352" width="74.8405" height="248" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="121.363" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Common Pitfalls</text>
  <text x="86.9768" y="444.8" font-size="10" fill="var(--text)">▶ Mandating tools without training</text>
  <text x="86.9768" y="480" font-size="10" fill="var(--text)">▶ Skipping security review</text>
  <text x="86.9768" y="515.2" font-size="10" fill="var(--text)">▶ Measuring only speed, ignoring quality</text>
  <text x="86.9768" y="550.4" font-size="10" fill="var(--text)">▶ No feedback loops or retrospectives</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.753498" font-weight="bold" fill="var(--text)">Industry Adoption Patterns</text>

  <!-- Four stages across the top -->
  <rect x="40" y="82.181818" width="280" height="179.272727" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="124.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--primary-text)">Stage 1</text>
  <text x="180" y="161.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--primary-text)">Individual Pilots</text>
  <text x="180" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--primary-text)">enthusiasts</text>
  <text x="180" y="238.254545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--primary-text)">try tools</text>

  <rect x="340" y="82.181818" width="280" height="179.272727" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="124.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--ok-text)">Stage 2</text>
  <text x="480" y="161.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--ok-text)">Team Adoption</text>
  <text x="480" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--ok-text)">shared</text>
  <text x="480" y="238.254545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--ok-text)">workflows</text>

  <rect x="660" y="82.181818" width="280" height="179.272727" rx="6.161464" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="124.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--warn-text)">Stage 3</text>
  <text x="800" y="161.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--warn-text)">Org-wide Rollout</text>
  <text x="800" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--warn-text)">policy</text>
  <text x="800" y="238.254545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--warn-text)">+ training</text>

  <rect x="960" y="82.181818" width="280" height="179.272727" rx="6.161464" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="124.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--info-text)">Stage 4</text>
  <text x="1100" y="161.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--info-text)">Workflow Integration</text>
  <text x="1100" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--info-text)">AI in CI/CD</text>
  <text x="1100" y="238.254545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--info-text)">+ review</text>

  <!-- Outcomes and Pitfalls -->
  <rect x="40" y="303.636364" width="590" height="316.363636" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="351.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.645855" font-weight="bold" fill="var(--ok-text)">Reported Outcomes</text>
  <text x="70" y="414.363636" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--ok-text)">- 20-40% less time on boilerplate and tests</text>
  <text x="70" y="461.818182" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--ok-text)">- Minimal gain on complex architecture</text>
  <text x="70" y="509.272727" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--ok-text)">- Highest satisfaction: dev-chosen tools</text>
  <text x="70" y="556.727273" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--ok-text)">- ROI requires training and policy</text>

  <rect x="650" y="303.636364" width="590" height="316.363636" rx="6.161464" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="351.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.645855" font-weight="bold" fill="var(--danger-text)">Common Pitfalls</text>
  <text x="680" y="414.363636" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--danger-text)">- Mandating tools without training</text>
  <text x="680" y="461.818182" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--danger-text)">- Skipping security review</text>
  <text x="680" y="509.272727" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--danger-text)">- Measuring speed, ignoring quality</text>
  <text x="680" y="556.727273" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--danger-text)">- No feedback loops or retrospectives</text>
</svg>

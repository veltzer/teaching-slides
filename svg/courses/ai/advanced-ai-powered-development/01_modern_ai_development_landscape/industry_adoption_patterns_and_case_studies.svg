  <text x="1437.7796" y="7352.8164" font-size="43.4677" fill="#333">▶ Mandating tools without training</text>
  <text x="1437.7796" y="7934.6937" font-size="43.4677" fill="#333">▶ Skipping security review</text>
  <text x="1437.7796" y="8516.5714" font-size="43.4677" fill="#333">▶ Measuring only speed, ignoring quality</text>
  <text x="1437.7796" y="9098.4492" font-size="43.4677" fill="#333">▶ No feedback loops or retrospectives</text>

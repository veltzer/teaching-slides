  <ns0:rect width="161.8173" height="640" fill="var(--surface-light)" />
  <ns0:text x="80.9086" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Industry AI Adoption Patterns</ns0:text>
  <ns0:rect x="3.0341" y="128" width="32.3635" height="160" rx="2.0227" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="0.4045" />
  <ns0:text x="19.2158" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-dk)">Stage 1</ns0:text>
  <ns0:text x="19.2158" y="208" text-anchor="middle" font-size="10" fill="var(--primary-dk)">Individual</ns0:text>
  <ns0:text x="19.2158" y="236.8" text-anchor="middle" font-size="10" fill="var(--primary-dk)">Pilots</ns0:text>
  <ns0:text x="19.2158" y="272" text-anchor="middle" font-size="10" fill="var(--text-muted)">enthusiasts try tools</ns0:text>
  <ns0:line x1="35.3975" y1="208" x2="42.477" y2="208" stroke="var(--text-dark)" stroke-width="0.4045" marker-end="url(#ah)" />
  <ns0:rect x="42.477" y="128" width="32.3635" height="160" rx="2.0227" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="0.4045" />
  <ns0:text x="58.6588" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-dk)">Stage 2</ns0:text>
  <ns0:text x="58.6588" y="208" text-anchor="middle" font-size="10" fill="var(--ok-dk)">Team</ns0:text>
  <ns0:text x="58.6588" y="236.8" text-anchor="middle" font-size="10" fill="var(--ok-dk)">Adoption</ns0:text>
  <ns0:text x="58.6588" y="272" text-anchor="middle" font-size="10" fill="var(--text-muted)">shared workflows</ns0:text>
  <ns0:line x1="74.8405" y1="208" x2="81.92" y2="208" stroke="var(--text-dark)" stroke-width="0.4045" marker-end="url(#ah)" />
  <ns0:rect x="81.92" y="128" width="32.3635" height="160" rx="2.0227" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="0.4045" />
  <ns0:text x="98.1017" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-dk)">Stage 3</ns0:text>
  <ns0:text x="98.1017" y="208" text-anchor="middle" font-size="10" fill="var(--warn-dk)">Org-wide</ns0:text>
  <ns0:text x="98.1017" y="236.8" text-anchor="middle" font-size="10" fill="var(--warn-dk)">Rollout</ns0:text>
  <ns0:text x="98.1017" y="272" text-anchor="middle" font-size="10" fill="var(--text-muted)">policy + training</ns0:text>
  <ns0:line x1="114.2835" y1="208" x2="121.363" y2="208" stroke="var(--text-dark)" stroke-width="0.4045" marker-end="url(#ah)" />
  <ns0:rect x="121.363" y="128" width="37.4202" height="160" rx="2.0227" fill="var(--info-pale)" stroke="var(--info-dk)" stroke-width="0.4045" />
  <ns0:text x="139.9719" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-dk)">Stage 4</ns0:text>
  <ns0:text x="139.9719" y="208" text-anchor="middle" font-size="10" fill="var(--info-dk)">Workflow</ns0:text>
  <ns0:text x="139.9719" y="236.8" text-anchor="middle" font-size="10" fill="var(--info-dk)">Integration</ns0:text>
  <ns0:text x="139.9719" y="272" text-anchor="middle" font-size="10" fill="var(--text-muted)">AI in CI/CD + review</ns0:text>
  <ns0:rect x="3.0341" y="352" width="74.8405" height="248" rx="2.0227" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="0.3034" />
  <ns0:text x="40.4543" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-dk)">Reported Outcomes</ns0:text>
  <ns0:text x="6.0681" y="444.8" font-size="10" fill="var(--text-dark)">▶ 20-40% less time on boilerplate + tests</ns0:text>
  <ns0:text x="6.0681" y="480" font-size="10" fill="var(--text-dark)">▶ Minimal gain on complex architecture tasks</ns0:text>
  <ns0:text x="6.0681" y="515.2" font-size="10" fill="var(--text-dark)">▶ Highest satisfaction: dev-chosen tools</ns0:text>
  <ns0:text x="6.0681" y="550.4" font-size="10" fill="var(--text-dark)">▶ ROI requires training + policy investment</ns0:text>
  <ns0:rect x="83.9427" y="352" width="74.8405" height="248" rx="2.0227" fill="var(--danger-pale3)" stroke="var(--danger-dk)" stroke-width="0.3034" />
  <ns0:text x="121.363" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-dk)">Common Pitfalls</ns0:text>
  <ns0:text x="86.9768" y="444.8" font-size="10" fill="var(--text-dark)">▶ Mandating tools without training</ns0:text>
  <ns0:text x="86.9768" y="480" font-size="10" fill="var(--text-dark)">▶ Skipping security review</ns0:text>
  <ns0:text x="86.9768" y="515.2" font-size="10" fill="var(--text-dark)">▶ Measuring only speed, ignoring quality</ns0:text>
  <ns0:text x="86.9768" y="550.4" font-size="10" fill="var(--text-dark)">▶ No feedback loops or retrospectives</ns0:text>
</ns0:svg>
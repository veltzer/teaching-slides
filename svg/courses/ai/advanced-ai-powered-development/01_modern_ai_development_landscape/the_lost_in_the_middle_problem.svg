<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="364.0889" height="640" fill="var(--surface)" rx="6"/>
  <text x="182.0444" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">The Lost-in-the-Middle Problem</text>
  <text x="182.0444" y="99.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">Recall accuracy varies by position in the context window</text>
  <line x1="36.4089" y1="512" x2="327.68" y2="512" stroke="var(--text)" stroke-width="0.9102" />
  <line x1="36.4089" y1="128" x2="36.4089" y2="512" stroke="var(--text)" stroke-width="0.9102" />
  <text x="31.8578" y="520" text-anchor="end" font-size="10" fill="var(--text)">0%</text>
  <text x="31.8578" y="432" text-anchor="end" font-size="10" fill="var(--text)">25%</text>
  <text x="31.8578" y="344" text-anchor="end" font-size="10" fill="var(--text)">50%</text>
  <text x="31.8578" y="256" text-anchor="end" font-size="10" fill="var(--text)">75%</text>
  <text x="31.8578" y="168" text-anchor="end" font-size="10" fill="var(--text)">100%</text>
  <line x1="36.4089" y1="432" x2="327.68" y2="432" stroke="var(--border)" stroke-width="0.4551" />
  <line x1="36.4089" y1="344" x2="327.68" y2="344" stroke="var(--border)" stroke-width="0.4551" />
  <line x1="36.4089" y1="256" x2="327.68" y2="256" stroke="var(--border)" stroke-width="0.4551" />
  <line x1="36.4089" y1="168" x2="327.68" y2="168" stroke="var(--border)" stroke-width="0.4551" />
  <polyline points="36.4089,160 72.8178,179.2 109.2267,264 145.6356,368 182.0444,392 218.4533,368 254.8622,280 291.2711,200 327.68,160" fill="none" stroke="var(--danger-border)" stroke-width="1.3653" />
  <polygon points="36.4089,160 72.8178,179.2 109.2267,264 145.6356,368 182.0444,392 218.4533,368 254.8622,280 291.2711,200 327.68,160 327.68,512 36.4089,512" fill="var(--danger-fill)" fill-opacity="0.1" />
  <rect x="38.6844" y="120" width="40.96" height="48" rx="6" fill="var(--ok-fill)" fill-opacity="0.8" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="59.1644" y="152" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--bg)">HIGH recall</text>
  <rect x="284.4444" y="120" width="40.96" height="48" rx="6" fill="var(--ok-fill)" fill-opacity="0.8" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="304.9244" y="152" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--bg)">HIGH recall</text>
  <rect x="154.7378" y="400" width="54.6133" height="48" rx="6" fill="var(--danger-fill)" fill-opacity="0.8" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="182.0444" y="432" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--bg)">LOW recall</text>
  <text x="182.0444" y="552" text-anchor="middle" font-size="10" fill="var(--text)">Position in Context Window</text>
  <text x="59.1644" y="544" text-anchor="middle" font-size="10" fill="var(--ok-accent)">Start</text>
  <text x="182.0444" y="544" text-anchor="middle" font-size="10" fill="var(--danger-accent)">Middle</text>
  <text x="304.9244" y="544" text-anchor="middle" font-size="10" fill="var(--ok-accent)">End</text>
  <text x="11.3778" y="320" text-anchor="middle" font-size="10" fill="var(--text)" transform="rotate(-90,25,200)">Recall Accuracy</text>
  <rect x="91.0222" y="568" width="182.0444" height="48" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="182.0444" y="600" text-anchor="middle" font-size="10" fill="var(--text-muted)">Tip: Place critical instructions at the start or end of prompts</text>
</svg>
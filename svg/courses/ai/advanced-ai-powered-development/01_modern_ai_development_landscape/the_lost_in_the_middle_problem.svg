<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Chart area -->
  <rect x="52.903226" y="40" width="1187.096774" height="477.647058760092" rx="7.268241243394" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <!-- Y-axis label -->
  <text x="120" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)" transform="rotate(-90,120,320)">Recall Accuracy</text>

  <!-- Y-axis ticks -->
  <text x="40" y="68.431373225682" text-anchor="end" font-family="Arial, sans-serif" font-size="19.381975956733" fill="var(--text-muted)">100%</text>
  <text x="40" y="159.411764959631" text-anchor="end" font-family="Arial, sans-serif" font-size="19.381975956733" fill="var(--text-muted)">75%</text>
  <text x="40" y="250.392156693579" text-anchor="end" font-family="Arial, sans-serif" font-size="19.381975956733" fill="var(--text-muted)">50%</text>
  <text x="40" y="341.372549505959" text-anchor="end" font-family="Arial, sans-serif" font-size="19.381975956733" fill="var(--text-muted)">25%</text>
  <text x="40" y="432.352941239908" text-anchor="end" font-family="Arial, sans-serif" font-size="19.381975956733" fill="var(--text-muted)">0%</text>

  <!-- Gridlines -->
  <line x1="52.903226" y1="62.745097933487" x2="1240" y2="62.745097933487" stroke="var(--border)" stroke-width="1"/>
  <line x1="52.903226" y1="153.725490745867" x2="1240" y2="153.725490745867" stroke="var(--border)" stroke-width="1"/>
  <line x1="52.903226" y1="244.705882479815" x2="1240" y2="244.705882479815" stroke="var(--border)" stroke-width="1"/>
  <line x1="52.903226" y1="335.686274213764" x2="1240" y2="335.686274213764" stroke="var(--border)" stroke-width="1"/>
  <line x1="52.903226" y1="426.666667026144" x2="1240" y2="426.666667026144" stroke="var(--text)" stroke-width="2"/>
  <line x1="52.903226" y1="62.745097933487" x2="52.903226" y2="426.666667026144" stroke="var(--text)" stroke-width="2"/>

  <!-- U-shaped recall curve (fill) -->
  <polygon points="78.709677,79.80392165321 220.645161,119.607843306421 362.580645,233.333332973856 504.516129,324.313725786236 646.451613,352.745097933487 788.387097,324.313725786236 930.322581,233.333332973856 1072.258065,119.607843306421 1214.193548,79.80392165321 1214.193548,426.666667026144 78.709677,426.666667026144" fill="var(--danger-fill)" fill-opacity="0.15"/>
  <!-- Curve line -->
  <polyline points="78.709677,79.80392165321 220.645161,119.607843306421 362.580645,233.333332973856 504.516129,324.313725786236 646.451613,352.745097933487 788.387097,324.313725786236 930.322581,233.333332973856 1072.258065,119.607843306421 1214.193548,79.80392165321" fill="none" stroke="var(--danger-border)" stroke-width="4"/>

  <!-- Points -->
  <rect x="70.544232" y="70.998049597364" width="16.33089" height="17.611744111693" rx="3.115426511677" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="638.286168" y="343.939225877641" width="16.33089" height="17.611744111693" rx="3.115426511677" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1206.028103" y="70.998049597364" width="16.33089" height="17.611744111693" rx="3.115426511677" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

  <!-- Annotations -->
  <rect x="104.516129" y="85.490195866974" width="193.548387" height="45.490195866974" rx="7.268241243394" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="201.290323" y="115.058823504037" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.804722691706" font-weight="bold" fill="var(--ok-text)">HIGH recall</text>

  <rect x="994.83871" y="85.490195866974" width="193.548387" height="45.490195866974" rx="7.268241243394" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1091.612903" y="115.058823504037" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.804722691706" font-weight="bold" fill="var(--ok-text)">HIGH recall</text>

  <rect x="549.677419" y="364.117647439446" width="193.548387" height="45.490195866974" rx="7.268241243394" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="646.451613" y="393.686275076509" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.804722691706" font-weight="bold" fill="var(--danger-text)">LOW recall</text>

  <!-- X-axis label regions -->
  <text x="181.935484" y="466.470588679354" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.804722691706" font-weight="bold" fill="var(--ok-accent)">Start</text>
  <text x="646.451613" y="466.470588679354" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.804722691706" font-weight="bold" fill="var(--danger-accent)">Middle</text>
  <text x="1110.967742" y="466.470588679354" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.804722691706" font-weight="bold" fill="var(--ok-accent)">End</text>
  <text x="646.451613" y="500.588235040369" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.804722691706" fill="var(--text)">Position in Context Window</text>

  <!-- Tip box -->
  <rect x="52.903226" y="540.392156693579" width="1187.096774" height="79.607843306421" rx="7.268241243394" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="646.451613" y="574.509804133026" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.804722691706" font-weight="bold" fill="var(--warn-text)">Tip</text>
  <text x="646.451613" y="602.941176280277" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.804722691706" fill="var(--warn-text)">Place critical instructions at the start or end of prompts — not buried in the middle</text>
</svg>

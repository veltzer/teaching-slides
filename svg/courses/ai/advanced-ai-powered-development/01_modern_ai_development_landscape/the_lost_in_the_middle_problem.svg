<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="330" height="580" fill="var(--surface)" rx="6.0004" x="475" y="40"/>
  <text x="640" y="95.1" text-anchor="middle" font-size="10.0007" font-weight="bold" fill="var(--primary-accent)">The Lost-in-the-Middle Problem</text>
  <text x="640" y="129.9" text-anchor="middle" font-size="10.0007" fill="var(--text-muted)">Recall accuracy varies by position in the context window</text>
  <line x1="508" y1="504" x2="772" y2="504" stroke="var(--text)" stroke-width="0.9102" />
  <line x1="508" y1="156" x2="508" y2="504" stroke="var(--text)" stroke-width="0.9102" />
  <text x="503.875" y="511.25" text-anchor="end" font-size="10.0007" fill="var(--text)">0%</text>
  <text x="503.875" y="431.5" text-anchor="end" font-size="10.0007" fill="var(--text)">25%</text>
  <text x="503.875" y="351.75" text-anchor="end" font-size="10.0007" fill="var(--text)">50%</text>
  <text x="503.875" y="272" text-anchor="end" font-size="10.0007" fill="var(--text)">75%</text>
  <text x="503.875" y="192.25" text-anchor="end" font-size="10.0007" fill="var(--text)">100%</text>
  <line x1="508" y1="431.5" x2="772" y2="431.5" stroke="var(--border)" stroke-width="0.4551" />
  <line x1="508" y1="351.75" x2="772" y2="351.75" stroke="var(--border)" stroke-width="0.4551" />
  <line x1="508" y1="272" x2="772" y2="272" stroke="var(--border)" stroke-width="0.4551" />
  <line x1="508" y1="192.25" x2="772" y2="192.25" stroke="var(--border)" stroke-width="0.4551" />
  <polyline points="508,185 541,202.4 574,279.25 607.0001,373.5 640,395.25 672.9999,373.5 706,293.75 739,221.25 772,185" fill="none" stroke="var(--danger-border)" stroke-width="1.3653" />
  <polygon points="508,185 541,202.4 574,279.25 607.0001,373.5 640,395.25 672.9999,373.5 706,293.75 739,221.25 772,185 772,504 508,504" fill="var(--danger-fill)" fill-opacity="0.1" />
  <rect x="510.0625" y="148.75" width="37.125" height="43.5" rx="6.0004" fill="var(--ok-fill)" fill-opacity="0.8" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="528.625" y="177.75" text-anchor="middle" font-size="10.0007" font-weight="bold" fill="var(--bg)">HIGH recall</text>
  <rect x="732.8125" y="148.75" width="37.125" height="43.5" rx="6.0004" fill="var(--ok-fill)" fill-opacity="0.8" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="751.375" y="177.75" text-anchor="middle" font-size="10.0007" font-weight="bold" fill="var(--bg)">HIGH recall</text>
  <rect x="615.25" y="402.5" width="49.5" height="43.5" rx="6.0004" fill="var(--danger-fill)" fill-opacity="0.8" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="431.5" text-anchor="middle" font-size="10.0007" font-weight="bold" fill="var(--bg)">LOW recall</text>
  <text x="640" y="540.25" text-anchor="middle" font-size="10.0007" fill="var(--text)">Position in Context Window</text>
  <text x="528.625" y="533" text-anchor="middle" font-size="10.0007" fill="var(--ok-accent)">Start</text>
  <text x="640" y="533" text-anchor="middle" font-size="10.0007" fill="var(--danger-accent)">Middle</text>
  <text x="751.375" y="533" text-anchor="middle" font-size="10.0007" fill="var(--ok-accent)">End</text>
  <text x="485.3333" y="330" text-anchor="middle" font-size="10" fill="var(--text)" transform="rotate(-90,25,200)">Recall Accuracy</text>
  <rect x="557.5" y="554.75" width="164.9999" height="43.5" rx="6.0004" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="583.75" text-anchor="middle" font-size="10.0007" fill="var(--text-muted)">Tip: Place critical instructions at the start or end of prompts</text>
</svg>
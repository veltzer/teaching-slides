<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="646.451613" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.661779" font-weight="bold" fill="var(--primary-accent)">Recall Accuracy vs Position in Context Window</text>

  <!-- Chart area -->
  <rect x="52.903226" y="82.181818" width="1187.096774" height="442.909091" rx="6.998953" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <!-- Y-axis label -->
  <text x="120" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)" transform="rotate(-90,120,320)">Recall Accuracy</text>

  <!-- Y-axis ticks -->
  <text x="40" y="108.545455" text-anchor="end" font-family="Arial, sans-serif" font-size="18.663874" fill="var(--text-muted)">100%</text>
  <text x="40" y="192.909091" text-anchor="end" font-family="Arial, sans-serif" font-size="18.663874" fill="var(--text-muted)">75%</text>
  <text x="40" y="277.272727" text-anchor="end" font-family="Arial, sans-serif" font-size="18.663874" fill="var(--text-muted)">50%</text>
  <text x="40" y="361.636364" text-anchor="end" font-family="Arial, sans-serif" font-size="18.663874" fill="var(--text-muted)">25%</text>
  <text x="40" y="446" text-anchor="end" font-family="Arial, sans-serif" font-size="18.663874" fill="var(--text-muted)">0%</text>

  <!-- Gridlines -->
  <line x1="52.903226" y1="103.272727" x2="1240" y2="103.272727" stroke="var(--border)" stroke-width="1"/>
  <line x1="52.903226" y1="187.636364" x2="1240" y2="187.636364" stroke="var(--border)" stroke-width="1"/>
  <line x1="52.903226" y1="272" x2="1240" y2="272" stroke="var(--border)" stroke-width="1"/>
  <line x1="52.903226" y1="356.363636" x2="1240" y2="356.363636" stroke="var(--border)" stroke-width="1"/>
  <line x1="52.903226" y1="440.727273" x2="1240" y2="440.727273" stroke="var(--text)" stroke-width="2"/>
  <line x1="52.903226" y1="103.272727" x2="52.903226" y2="440.727273" stroke="var(--text)" stroke-width="2"/>

  <!-- U-shaped recall curve (fill) -->
  <polygon points="78.709677,119.090909 220.645161,156 362.580645,261.454545 504.516129,345.818182 646.451613,372.181818 788.387097,345.818182 930.322581,261.454545 1072.258065,156 1214.193548,119.090909 1214.193548,440.727273 78.709677,440.727273" fill="var(--danger-fill)" fill-opacity="0.15"/>
  <!-- Curve line -->
  <polyline points="78.709677,119.090909 220.645161,156 362.580645,261.454545 504.516129,345.818182 646.451613,372.181818 788.387097,345.818182 930.322581,261.454545 1072.258065,156 1214.193548,119.090909" fill="none" stroke="var(--danger-border)" stroke-width="4"/>

  <!-- Points -->
  <rect x="70.544232" y="110.925464" width="16.330890" height="16.330890" rx="3" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="638.286168" y="364.016373" width="16.330890" height="16.330890" rx="3" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1206.028103" y="110.925464" width="16.330890" height="16.330890" rx="3" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

  <!-- Annotations -->
  <rect x="104.516129" y="124.363636" width="193.548387" height="42.181818" rx="6.998953" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="201.290323" y="151.781818" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.996858" font-weight="bold" fill="var(--ok-text)">HIGH recall</text>

  <rect x="994.83871" y="124.363636" width="193.548387" height="42.181818" rx="6.998953" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1091.612903" y="151.781818" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.996858" font-weight="bold" fill="var(--ok-text)">HIGH recall</text>

  <rect x="549.677419" y="382.727273" width="193.548387" height="42.181818" rx="6.998953" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="646.451613" y="410.145455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.996858" font-weight="bold" fill="var(--danger-text)">LOW recall</text>

  <!-- X-axis label regions -->
  <text x="181.935484" y="477.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.996858" font-weight="bold" fill="var(--ok-accent)">Start</text>
  <text x="646.451613" y="477.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.996858" font-weight="bold" fill="var(--danger-accent)">Middle</text>
  <text x="1110.967742" y="477.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.996858" font-weight="bold" fill="var(--ok-accent)">End</text>
  <text x="646.451613" y="509.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.996858" fill="var(--text)">Position in Context Window</text>

  <!-- Tip box -->
  <rect x="52.903226" y="546.181818" width="1187.096774" height="73.818182" rx="6.998953" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="646.451613" y="577.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.996858" font-weight="bold" fill="var(--warn-text)">Tip</text>
  <text x="646.451613" y="604.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.996858" fill="var(--warn-text)">Place critical instructions at the start or end of prompts — not buried in the middle</text>
</svg>

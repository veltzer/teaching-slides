<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,230.4 11.7029,0" fill="#333" />
    </marker>
  </defs>
  <rect width="168" height="580" fill="var(--surface)" rx="5.9939" x="556" y="40"/>
  <text x="640" y="95.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">How Context Selection Works in AI Agents</text>
  <rect x="562.3" y="170.5" width="29.4" height="116" rx="5.9939" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="577" y="216.9" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">1. User</text>
  <text x="577" y="243" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Query</text>
  <text x="577" y="272" text-anchor="middle" font-size="10" fill="var(--text)">"Add retry logic"</text>
  <line x1="591.7" y1="228.5" x2="599.05" y2="228.5" stroke="var(--text)" stroke-width="0.4644" marker-end="url(#ah)" />
  <rect x="599.05" y="170.5" width="29.4" height="116" rx="5.9939" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="613.75" y="211.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">2. Index</text>
  <text x="613.75" y="237.2" text-anchor="middle" font-size="10" fill="var(--text)">Embeddings</text>
  <text x="613.75" y="260.4" text-anchor="middle" font-size="10" fill="var(--text)">Symbol graph</text>
  <text x="613.75" y="283.6" text-anchor="middle" font-size="10" fill="var(--text)">Import graph</text>
  <line x1="628.45" y1="228.5" x2="635.8" y2="228.5" stroke="var(--text)" stroke-width="0.4644" marker-end="url(#ah)" />
  <rect x="635.8" y="170.5" width="29.4" height="116" rx="5.9939" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="650.5001" y="211.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">3. Retrieve</text>
  <text x="650.5001" y="237.2" text-anchor="middle" font-size="10" fill="var(--text)">Semantic search</text>
  <text x="650.5001" y="260.4" text-anchor="middle" font-size="10" fill="var(--text)">Keyword match</text>
  <text x="650.5001" y="283.6" text-anchor="middle" font-size="10" fill="var(--text)">Recency boost</text>
  <line x1="665.2" y1="228.5" x2="672.55" y2="228.5" stroke="var(--text)" stroke-width="0.4644" marker-end="url(#ah)" />
  <rect x="672.55" y="170.5" width="29.4" height="116" rx="5.9939" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="687.25" y="211.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">4. Pack</text>
  <text x="687.25" y="237.2" text-anchor="middle" font-size="10" fill="var(--text)">Re-rank chunks</text>
  <text x="687.25" y="260.4" text-anchor="middle" font-size="10" fill="var(--text)">Token budget</text>
  <text x="687.25" y="283.6" text-anchor="middle" font-size="10" fill="var(--text)">Assemble context</text>
  <rect x="599.05" y="359" width="65.1001" height="188.5" rx="5.9939" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="631.5999" y="399.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Codebase (2M tokens)</text>
  <rect x="602.2" y="417" width="16.8" height="50.75" rx="5.9939" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="610.6" y="450.35" text-anchor="middle" font-size="10" fill="var(--text)">auth/</text>
  <rect x="622.15" y="417" width="16.8" height="50.75" rx="5.9939" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="630.55" y="450.35" text-anchor="middle" font-size="10" fill="var(--text)">payments/</text>
  <rect x="642.1" y="417" width="18.9" height="50.75" rx="5.9939" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="651.55" y="450.35" text-anchor="middle" font-size="10" fill="var(--text)">services/</text>
  <text x="631.5999" y="518.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">~10% visible in context at any time</text>
  <line x1="631.5999" y1="359" x2="621.1001" y2="286.5" stroke="var(--info-border)" stroke-width="0.3483" stroke-dasharray="1.161 0.6966" marker-end="url(#ah)" />
  <rect x="672.55" y="359" width="42" height="188.5" rx="5.9939" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="693.5501" y="399.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Context Window</text>
  <text x="693.5501" y="431.5" text-anchor="middle" font-size="10" fill="var(--text)">system prompt</text>
  <text x="693.5501" y="457.6" text-anchor="middle" font-size="10" fill="var(--text)">selected files</text>
  <text x="693.5501" y="483.7" text-anchor="middle" font-size="10" fill="var(--text)">user query</text>
  <text x="693.5501" y="518.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">200K tokens max</text>
  <line x1="687.25" y1="286.5" x2="693.5501" y2="359" stroke="var(--text)" stroke-width="0.4644" marker-end="url(#ah)" />
  <rect x="562.3" y="518.5" width="105" height="72.5" rx="5.9939" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="614.8" y="559.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">Key: Smart context selection outperforms brute-force large windows</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
  </defs>

  <!-- Four-stage pipeline -->
  <rect x="40" y="40" width="270" height="193.333333" rx="8.291004" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="175" y="93.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--primary-text)">1. User Query</text>
  <text x="175" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.618383" fill="var(--primary-text)">"Add retry logic"</text>
  <text x="175" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--primary-text)">intent + files mentioned</text>

  <line x1="320" y1="136.666667" x2="370" y2="136.666667" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="380" y="40" width="270" height="193.333333" rx="8.291004" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="515" y="93.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--ok-text)">2. Index</text>
  <text x="515" y="136.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--ok-text)">embeddings</text>
  <text x="515" y="168.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--ok-text)">symbol graph</text>
  <text x="515" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--ok-text)">import graph</text>

  <line x1="660" y1="136.666667" x2="710" y2="136.666667" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="720" y="40" width="270" height="193.333333" rx="8.291004" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="855" y="93.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--warn-text)">3. Retrieve</text>
  <text x="855" y="136.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--warn-text)">semantic search</text>
  <text x="855" y="168.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--warn-text)">keyword match</text>
  <text x="855" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--warn-text)">recency boost</text>

  <line x1="1000" y1="136.666667" x2="1050" y2="136.666667" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1060" y="40" width="180" height="193.333333" rx="8.291004" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1150" y="93.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--danger-text)">4. Pack</text>
  <text x="1150" y="136.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--danger-text)">re-rank chunks</text>
  <text x="1150" y="168.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--danger-text)">token budget</text>
  <text x="1150" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--danger-text)">assemble context</text>

  <!-- Codebase vs Context Window -->
  <rect x="160" y="287.037037" width="450" height="332.962963" rx="8.291004" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="385" y="335.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--info-text)">Codebase (2M tokens)</text>
  <rect x="200" y="372.962963" width="110" height="139.62963" rx="6.218253" fill="var(--info-border)" stroke="var(--bg)" stroke-width="2"/>
  <text x="255" y="453.518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--info-text)">auth/</text>
  <rect x="330" y="372.962963" width="110" height="139.62963" rx="6.218253" fill="var(--info-border)" stroke="var(--bg)" stroke-width="2"/>
  <text x="385" y="453.518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--info-text)">payments/</text>
  <rect x="460" y="372.962963" width="110" height="139.62963" rx="6.218253" fill="var(--info-border)" stroke="var(--bg)" stroke-width="2"/>
  <text x="515" y="453.518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--info-text)">services/</text>
  <text x="385" y="560.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--info-text)">only ~10% visible</text>
  <text x="385" y="593.148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--info-text)">in context at any time</text>

  <line x1="610" y1="448.148148" x2="680" y2="448.148148" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="690" y="287.037037" width="430" height="332.962963" rx="8.291004" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="905" y="335.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--primary-text)">Context Window</text>
  <text x="905" y="394.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--primary-text)">system prompt</text>
  <text x="905" y="437.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--primary-text)">selected files</text>
  <text x="905" y="480.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--primary-text)">user query</text>
  <text x="905" y="523.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" fill="var(--primary-text)">tool results</text>
  <text x="905" y="593.148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" font-weight="bold" fill="var(--primary-text)">200K tokens max</text>
</svg>

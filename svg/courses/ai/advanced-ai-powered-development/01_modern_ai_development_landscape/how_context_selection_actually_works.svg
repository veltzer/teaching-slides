  <ns0:rect width="185.7596" height="640" fill="#f9f9f9" />
  <ns0:text x="92.8798" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">How Context Selection Works in AI Agents</ns0:text>

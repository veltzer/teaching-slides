  <ns0:text x="23.22" y="224" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">Query</ns0:text>
  <ns0:text x="23.22" y="256" text-anchor="middle" font-size="10" fill="#333">"Add retry logic"</ns0:text>
  <ns0:line x1="39.4739" y1="208" x2="47.6009" y2="208" stroke="#333" stroke-width="0.4644" marker-end="url(#ah)" />

  <ns0:text x="63.8549" y="188.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">2. Index</ns0:text>
  <ns0:text x="63.8549" y="217.6" text-anchor="middle" font-size="10" fill="#333">Embeddings</ns0:text>
  <ns0:text x="63.8549" y="243.2" text-anchor="middle" font-size="10" fill="#333">Symbol graph</ns0:text>
  <ns0:text x="63.8549" y="268.8" text-anchor="middle" font-size="10" fill="#333">Import graph</ns0:text>
  <ns0:line x1="80.1088" y1="208" x2="88.2358" y2="208" stroke="#333" stroke-width="0.4644" marker-end="url(#ah)" />
  <ns0:rect x="88.2358" y="144" width="32.5079" height="128" rx="2.322" fill="#FFF3E0" stroke="#E65100" stroke-width="0.4644" />
  <ns0:text x="104.4898" y="188.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">3. Retrieve</ns0:text>
  <ns0:text x="104.4898" y="217.6" text-anchor="middle" font-size="10" fill="#333">Semantic search</ns0:text>
  <ns0:text x="104.4898" y="243.2" text-anchor="middle" font-size="10" fill="#333">Keyword match</ns0:text>
  <ns0:text x="104.4898" y="268.8" text-anchor="middle" font-size="10" fill="#333">Recency boost</ns0:text>
  <ns0:line x1="120.7438" y1="208" x2="128.8707" y2="208" stroke="#333" stroke-width="0.4644" marker-end="url(#ah)" />
  <ns0:rect x="128.8707" y="144" width="32.5079" height="128" rx="2.322" fill="#FCE4EC" stroke="#C62828" stroke-width="0.4644" />
  <ns0:text x="145.1247" y="188.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">4. Pack</ns0:text>
  <ns0:text x="145.1247" y="217.6" text-anchor="middle" font-size="10" fill="#333">Re-rank chunks</ns0:text>
  <ns0:text x="145.1247" y="243.2" text-anchor="middle" font-size="10" fill="#333">Token budget</ns0:text>
  <ns0:text x="145.1247" y="268.8" text-anchor="middle" font-size="10" fill="#333">Assemble context</ns0:text>
  <ns0:rect x="47.6009" y="352" width="71.9819" height="208" rx="2.322" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="0.4644" />
  <ns0:text x="83.5918" y="396.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#6A1B9A">Codebase (2M tokens)</ns0:text>
  <ns0:rect x="51.0839" y="416" width="18.576" height="56" rx="1.161" fill="#CE93D8" stroke="#6A1B9A" />
  <ns0:text x="60.3719" y="452.8" text-anchor="middle" font-size="10" fill="#333">auth/</ns0:text>
  <ns0:rect x="73.1429" y="416" width="18.576" height="56" rx="1.161" fill="#CE93D8" stroke="#6A1B9A" />
  <ns0:text x="82.4308" y="452.8" text-anchor="middle" font-size="10" fill="#333">payments/</ns0:text>
  <ns0:rect x="95.2018" y="416" width="20.898" height="56" rx="1.161" fill="#CE93D8" stroke="#6A1B9A" />
  <ns0:text x="105.6508" y="452.8" text-anchor="middle" font-size="10" fill="#333">services/</ns0:text>
  <ns0:text x="83.5918" y="528" text-anchor="middle" font-size="10" fill="#555">~10% visible in context at any time</ns0:text>
  <ns0:line x1="83.5918" y1="352" x2="71.9819" y2="272" stroke="#6A1B9A" stroke-width="0.3483" stroke-dasharray="1.161 0.6966" marker-end="url(#ah)" />
  <ns0:rect x="128.8707" y="352" width="46.4399" height="208" rx="2.322" fill="#E8EAF6" stroke="#283593" stroke-width="0.4644" />
  <ns0:text x="152.0907" y="396.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#283593">Context Window</ns0:text>
  <ns0:text x="152.0907" y="432" text-anchor="middle" font-size="10" fill="#333">system prompt</ns0:text>
  <ns0:text x="152.0907" y="460.8" text-anchor="middle" font-size="10" fill="#333">selected files</ns0:text>
  <ns0:text x="152.0907" y="489.6" text-anchor="middle" font-size="10" fill="#333">user query</ns0:text>
  <ns0:text x="152.0907" y="528" text-anchor="middle" font-size="10" fill="#555">200K tokens max</ns0:text>
  <ns0:line x1="145.1247" y1="272" x2="152.0907" y2="352" stroke="#333" stroke-width="0.4644" marker-end="url(#ah)" />

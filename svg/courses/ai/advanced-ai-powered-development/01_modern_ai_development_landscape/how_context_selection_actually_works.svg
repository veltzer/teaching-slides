  <ns0:text x="63.8549" y="268.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">Import graph</ns0:text>
  <ns0:line x1="80.1088" y1="208" x2="88.2358" y2="208" stroke="var(--text-dark)" stroke-width="0.4644" marker-end="url(#ah)" />
  <ns0:rect x="88.2358" y="144" width="32.5079" height="128" rx="2.322" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="0.4644" />
  <ns0:text x="104.4898" y="188.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-dk)">3. Retrieve</ns0:text>

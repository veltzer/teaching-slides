<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect width="161.8173" height="640" fill="#f8f9fa" />
  <ns0:text x="80.9086" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Sandboxed Tool Execution</ns0:text>
  <ns0:rect x="4.0454" y="96" width="153.7264" height="400" rx="3.0341" fill="none" stroke="#C62828" stroke-width="0.6068" stroke-dasharray="2.0227 1.0114" />
  <ns0:text x="80.9086" y="144" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Sandbox Boundary</ns0:text>
  <ns0:rect x="10.1136" y="176" width="31.3521" height="272" rx="2.0227" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.4045" />
  <ns0:text x="25.6885" y="220.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Allowed Tools</ns0:text>
  <ns0:text x="25.6885" y="259.2" text-anchor="middle" font-size="10" fill="#333">read_file ✓</ns0:text>
  <ns0:text x="25.6885" y="291.2" text-anchor="middle" font-size="10" fill="#333">write_file ✓</ns0:text>
  <ns0:text x="25.6885" y="323.2" text-anchor="middle" font-size="10" fill="#333">run_tests ✓</ns0:text>
  <ns0:text x="25.6885" y="355.2" text-anchor="middle" font-size="10" fill="#333">grep ✓</ns0:text>
  <ns0:text x="25.6885" y="400" text-anchor="middle" font-size="10" fill="#555">explicitly permitted</ns0:text>
  <ns0:rect x="45.5111" y="176" width="31.3521" height="272" rx="2.0227" fill="#FFF3E0" stroke="#E65100" stroke-width="0.4045" />
  <ns0:text x="61.086" y="220.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">Scoped FS</ns0:text>
  <ns0:text x="61.086" y="259.2" text-anchor="middle" font-size="10" fill="#333">/project/ ✓</ns0:text>
  <ns0:text x="61.086" y="291.2" text-anchor="middle" font-size="10" fill="#333">/tmp/ ✓</ns0:text>
  <ns0:text x="61.086" y="323.2" text-anchor="middle" font-size="10" fill="#C62828">/etc/ ✗</ns0:text>
  <ns0:text x="61.086" y="355.2" text-anchor="middle" font-size="10" fill="#C62828">/home/ ✗</ns0:text>
  <ns0:text x="61.086" y="400" text-anchor="middle" font-size="10" fill="#555">path restrictions</ns0:text>
  <ns0:rect x="80.9086" y="176" width="31.3521" height="272" rx="2.0227" fill="#E3F2FD" stroke="#1565C0" stroke-width="0.4045" />
  <ns0:text x="96.4836" y="220.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">Net Policy</ns0:text>
  <ns0:text x="96.4836" y="259.2" text-anchor="middle" font-size="10" fill="#333">npm registry ✓</ns0:text>
  <ns0:text x="96.4836" y="291.2" text-anchor="middle" font-size="10" fill="#333">GitHub API ✓</ns0:text>
  <ns0:text x="96.4836" y="323.2" text-anchor="middle" font-size="10" fill="#C62828">internal DB ✗</ns0:text>
  <ns0:text x="96.4836" y="355.2" text-anchor="middle" font-size="10" fill="#C62828">S3 secrets ✗</ns0:text>
  <ns0:text x="96.4836" y="400" text-anchor="middle" font-size="10" fill="#555">egress controls</ns0:text>
  <ns0:rect x="116.3062" y="176" width="35.3975" height="272" rx="2.0227" fill="#FCE4EC" stroke="#C62828" stroke-width="0.4045" />
  <ns0:text x="133.9038" y="220.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Audit Log</ns0:text>
  <ns0:text x="133.9038" y="259.2" text-anchor="middle" font-size="10" fill="#333">tool name</ns0:text>
  <ns0:text x="133.9038" y="291.2" text-anchor="middle" font-size="10" fill="#333">arguments</ns0:text>
  <ns0:text x="133.9038" y="323.2" text-anchor="middle" font-size="10" fill="#333">timestamp</ns0:text>
  <ns0:text x="133.9038" y="355.2" text-anchor="middle" font-size="10" fill="#333">result status</ns0:text>
  <ns0:text x="133.9038" y="400" text-anchor="middle" font-size="10" fill="#555">full traceability</ns0:text>
  <ns0:rect x="4.0454" y="528" width="153.7264" height="88" rx="1.6182" fill="#FFFDE7" stroke="#F9A825" stroke-width="0.3034" />
  <ns0:text x="80.9086" y="569.6" text-anchor="middle" font-size="10" fill="#555">Key principle: Least privilege — only expose tools the task actually requires</ns0:text>
  <ns0:text x="80.9086" y="601.6" text-anchor="middle" font-size="10" fill="#555">Run shell tools in containers or VMs; apply filesystem scoping to project root</ns0:text>
</ns0:svg>
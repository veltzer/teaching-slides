<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Sandbox boundary -->
  <rect x="40" y="40" width="1200" height="427.368421" rx="10.087338" fill="none" stroke="var(--danger-border)" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="640" y="75.614035" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--danger-accent)">Sandbox Boundary</text>

  <!-- Four pillars inside -->
  <rect x="80" y="111.22807" width="260" height="325.614035" rx="6.052403" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="157.017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--ok-text)">Allowed Tools</text>
  <text x="210" y="212.982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--ok-text)">read_file</text>
  <text x="210" y="248.596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--ok-text)">write_file</text>
  <text x="210" y="284.210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--ok-text)">run_tests</text>
  <text x="210" y="319.824561" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--ok-text)">grep</text>
  <text x="210" y="406.315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--ok-text)">explicitly permitted</text>

  <rect x="360" y="111.22807" width="260" height="325.614035" rx="6.052403" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="157.017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--warn-text)">Scoped FS</text>
  <text x="490" y="212.982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--warn-text)">/project ok</text>
  <text x="490" y="248.596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--warn-text)">/tmp ok</text>
  <text x="490" y="284.210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--warn-text)">/etc blocked</text>
  <text x="490" y="319.824561" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--warn-text)">/home blocked</text>
  <text x="490" y="406.315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--warn-text)">path restrictions</text>

  <rect x="640" y="111.22807" width="260" height="325.614035" rx="6.052403" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="157.017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--primary-text)">Net Policy</text>
  <text x="770" y="212.982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--primary-text)">npm registry ok</text>
  <text x="770" y="248.596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--primary-text)">GitHub API ok</text>
  <text x="770" y="284.210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--primary-text)">internal DB blocked</text>
  <text x="770" y="319.824561" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--primary-text)">secrets blocked</text>
  <text x="770" y="406.315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--primary-text)">egress controls</text>

  <rect x="920" y="111.22807" width="260" height="325.614035" rx="6.052403" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="157.017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--info-text)">Audit Log</text>
  <text x="1050" y="212.982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--info-text)">tool name</text>
  <text x="1050" y="248.596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--info-text)">arguments</text>
  <text x="1050" y="284.210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--info-text)">timestamp</text>
  <text x="1050" y="319.824561" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--info-text)">result status</text>
  <text x="1050" y="406.315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--info-text)">full traceability</text>

  <!-- Key principle -->
  <rect x="40" y="497.894737" width="1200" height="122.105263" rx="6.052403" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="543.684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174676" font-weight="bold" fill="var(--text)">Principle: Least privilege — only expose tools the task needs</text>
  <text x="640" y="589.473684" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" fill="var(--text-muted)">Run shell tools in containers or VMs; scope filesystem to project root</text>
</svg>

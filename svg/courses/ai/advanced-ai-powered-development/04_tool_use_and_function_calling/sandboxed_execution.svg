<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="147" height="580" fill="var(--surface)" rx="6.0072" x="566.5" y="40"/>
  <text x="640.0001" y="95.1" text-anchor="middle" font-size="10.012" font-weight="bold" fill="var(--primary-accent)">Sandboxed Tool Execution</text>
  <rect x="570.175" y="127" width="139.6499" height="362.5" rx="6.0072" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="2.0227 1.0114" />
  <text x="640.0001" y="170.5" text-anchor="middle" font-size="10.012" font-weight="bold" fill="var(--danger-accent)">Sandbox Boundary</text>
  <rect x="575.6876" y="199.5" width="28.4812" height="246.5" rx="6.0072" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="589.8363" y="240.1" text-anchor="middle" font-size="10.012" font-weight="bold" fill="var(--ok-accent)">Allowed Tools</text>
  <text x="589.8363" y="274.9" text-anchor="middle" font-size="10.012" fill="var(--text)">read_file ✓</text>
  <text x="589.8363" y="303.9" text-anchor="middle" font-size="10.012" fill="var(--text)">write_file ✓</text>
  <text x="589.8363" y="332.9" text-anchor="middle" font-size="10.012" fill="var(--text)">run_tests ✓</text>
  <text x="589.8363" y="361.9" text-anchor="middle" font-size="10.012" fill="var(--text)">grep ✓</text>
  <text x="589.8363" y="402.5" text-anchor="middle" font-size="10.012" fill="var(--text-muted)">explicitly permitted</text>
  <rect x="607.8438" y="199.5" width="28.4812" height="246.5" rx="6.0072" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="621.9925" y="240.1" text-anchor="middle" font-size="10.012" font-weight="bold" fill="var(--warn-accent)">Scoped FS</text>
  <text x="621.9925" y="274.9" text-anchor="middle" font-size="10.012" fill="var(--text)">/project/ ✓</text>
  <text x="621.9925" y="303.9" text-anchor="middle" font-size="10.012" fill="var(--text)">/tmp/ ✓</text>
  <text x="621.9925" y="332.9" text-anchor="middle" font-size="10.012" fill="var(--danger-accent)">/etc/ ✗</text>
  <text x="621.9925" y="361.9" text-anchor="middle" font-size="10.012" fill="var(--danger-accent)">/home/ ✗</text>
  <text x="621.9925" y="402.5" text-anchor="middle" font-size="10.012" fill="var(--text-muted)">path restrictions</text>
  <rect x="640.0001" y="199.5" width="28.4812" height="246.5" rx="6.0072" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="654.1488" y="240.1" text-anchor="middle" font-size="10.012" font-weight="bold" fill="var(--primary-accent)">Net Policy</text>
  <text x="654.1488" y="274.9" text-anchor="middle" font-size="10.012" fill="var(--text)">npm registry ✓</text>
  <text x="654.1488" y="303.9" text-anchor="middle" font-size="10.012" fill="var(--text)">GitHub API ✓</text>
  <text x="654.1488" y="332.9" text-anchor="middle" font-size="10.012" fill="var(--danger-accent)">internal DB ✗</text>
  <text x="654.1488" y="361.9" text-anchor="middle" font-size="10.012" fill="var(--danger-accent)">S3 secrets ✗</text>
  <text x="654.1488" y="402.5" text-anchor="middle" font-size="10.012" fill="var(--text-muted)">egress controls</text>
  <rect x="672.1563" y="199.5" width="32.1562" height="246.5" rx="6.0072" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="688.1426" y="240.1" text-anchor="middle" font-size="10.012" font-weight="bold" fill="var(--danger-accent)">Audit Log</text>
  <text x="688.1426" y="274.9" text-anchor="middle" font-size="10.012" fill="var(--text)">tool name</text>
  <text x="688.1426" y="303.9" text-anchor="middle" font-size="10.012" fill="var(--text)">arguments</text>
  <text x="688.1426" y="332.9" text-anchor="middle" font-size="10.012" fill="var(--text)">timestamp</text>
  <text x="688.1426" y="361.9" text-anchor="middle" font-size="10.012" fill="var(--text)">result status</text>
  <text x="688.1426" y="402.5" text-anchor="middle" font-size="10.012" fill="var(--text-muted)">full traceability</text>
  <rect x="570.175" y="518.5" width="139.6499" height="79.75" rx="6.0072" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640.0001" y="556.2" text-anchor="middle" font-size="10.012" fill="var(--text-muted)">Key principle: Least privilege — only expose tools the task actually requires</text>
  <text x="640.0001" y="585.2" text-anchor="middle" font-size="10.012" fill="var(--text-muted)">Run shell tools in containers or VMs; apply filesystem scoping to project root</text>
</svg>
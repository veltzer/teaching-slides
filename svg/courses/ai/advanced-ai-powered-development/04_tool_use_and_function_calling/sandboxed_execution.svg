  <rect x="4.0454" y="96" width="153.7264" height="400" rx="3.0341" fill="none" stroke="var(--danger-dk)" stroke-width="0.6068" stroke-dasharray="2.0227 1.0114" />
  <text x="80.9086" y="144" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-dk)">Sandbox Boundary</text>
  <rect x="10.1136" y="176" width="31.3521" height="272" rx="2.0227" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="0.4045" />
  <text x="25.6885" y="220.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-dk)">Allowed Tools</text>
  <text x="25.6885" y="259.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">read_file ✓</text>
  <text x="25.6885" y="291.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">write_file ✓</text>
  <text x="25.6885" y="323.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">run_tests ✓</text>
  <text x="25.6885" y="355.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">grep ✓</text>
  <text x="25.6885" y="400" text-anchor="middle" font-size="10" fill="var(--text-muted)">explicitly permitted</text>
  <rect x="45.5111" y="176" width="31.3521" height="272" rx="2.0227" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="0.4045" />
  <text x="61.086" y="220.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-dk)">Scoped FS</text>
  <text x="61.086" y="259.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">/project/ ✓</text>
  <text x="61.086" y="291.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">/tmp/ ✓</text>
  <text x="61.086" y="323.2" text-anchor="middle" font-size="10" fill="var(--danger-dk)">/etc/ ✗</text>
  <text x="61.086" y="355.2" text-anchor="middle" font-size="10" fill="var(--danger-dk)">/home/ ✗</text>
  <text x="61.086" y="400" text-anchor="middle" font-size="10" fill="var(--text-muted)">path restrictions</text>
  <rect x="80.9086" y="176" width="31.3521" height="272" rx="2.0227" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="0.4045" />
  <text x="96.4836" y="220.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-dk)">Net Policy</text>
  <text x="96.4836" y="259.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">npm registry ✓</text>
  <text x="96.4836" y="291.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">GitHub API ✓</text>
  <text x="96.4836" y="323.2" text-anchor="middle" font-size="10" fill="var(--danger-dk)">internal DB ✗</text>
  <text x="96.4836" y="355.2" text-anchor="middle" font-size="10" fill="var(--danger-dk)">S3 secrets ✗</text>
  <text x="96.4836" y="400" text-anchor="middle" font-size="10" fill="var(--text-muted)">egress controls</text>
  <rect x="116.3062" y="176" width="35.3975" height="272" rx="2.0227" fill="var(--danger-pale3)" stroke="var(--danger-dk)" stroke-width="0.4045" />
  <text x="133.9038" y="220.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-dk)">Audit Log</text>
  <text x="133.9038" y="259.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">tool name</text>
  <text x="133.9038" y="291.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">arguments</text>
  <text x="133.9038" y="323.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">timestamp</text>
  <text x="133.9038" y="355.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">result status</text>
  <text x="133.9038" y="400" text-anchor="middle" font-size="10" fill="var(--text-muted)">full traceability</text>
  <rect x="4.0454" y="528" width="153.7264" height="88" rx="1.6182" fill="var(--warn-pale3)" stroke="var(--warn-amber)" stroke-width="0.3034" />
  <text x="80.9086" y="569.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">Key principle: Least privilege — only expose tools the task actually requires</text>
  <text x="80.9086" y="601.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">Run shell tools in containers or VMs; apply filesystem scoping to project root</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
  </defs>
  <text x="656.216216" y="40" text-anchor="middle" font-size="28.550572" font-weight="bold" fill="var(--primary-accent)">Production Architecture for Tool-Use Systems</text>

  <rect x="40" y="212.884615" width="172.972973" height="156.153846" rx="8.784791" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="126.486486" y="268.653846" text-anchor="middle" font-size="19.76578" font-weight="bold" fill="var(--primary-text)">Client</text>
  <text x="126.486486" y="307.692308" text-anchor="middle" font-size="15.373385" fill="var(--primary-text)">API caller</text>
  <text x="126.486486" y="335.576923" text-anchor="middle" font-size="15.373385" fill="var(--primary-text)">agent / user</text>

  <line x1="212.972973" y1="290.961538" x2="250.810811" y2="290.961538" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="256.216216" y="212.884615" width="183.783784" height="156.153846" rx="8.784791" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="348.108108" y="263.076923" text-anchor="middle" font-size="19.76578" font-weight="bold" fill="var(--warn-text)">API Gateway</text>
  <text x="348.108108" y="296.538462" text-anchor="middle" font-size="14.275286" fill="var(--warn-text)">rate limiting</text>
  <text x="348.108108" y="322.192308" text-anchor="middle" font-size="14.275286" fill="var(--warn-text)">validation</text>
  <text x="348.108108" y="347.846154" text-anchor="middle" font-size="14.275286" fill="var(--warn-text)">routing</text>

  <line x1="440" y1="290.961538" x2="477.837838" y2="290.961538" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="483.243243" y="212.884615" width="183.783784" height="156.153846" rx="8.784791" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="575.135135" y="263.076923" text-anchor="middle" font-size="19.76578" font-weight="bold" fill="var(--ok-text)">LLM</text>
  <text x="575.135135" y="296.538462" text-anchor="middle" font-size="14.275286" fill="var(--ok-text)">Claude / GPT</text>
  <text x="575.135135" y="322.192308" text-anchor="middle" font-size="14.275286" fill="var(--ok-text)">reasoning</text>
  <text x="575.135135" y="347.846154" text-anchor="middle" font-size="14.275286" fill="var(--ok-text)">tool selection</text>

  <line x1="667.027027" y1="290.961538" x2="704.864865" y2="290.961538" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="710.27027" y="212.884615" width="183.783784" height="156.153846" rx="8.784791" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="802.162162" y="263.076923" text-anchor="middle" font-size="19.76578" font-weight="bold" fill="var(--danger-text)">Tools</text>
  <text x="802.162162" y="296.538462" text-anchor="middle" font-size="14.275286" fill="var(--danger-text)">file, shell</text>
  <text x="802.162162" y="322.192308" text-anchor="middle" font-size="14.275286" fill="var(--danger-text)">web, LSP</text>
  <text x="802.162162" y="347.846154" text-anchor="middle" font-size="14.275286" fill="var(--danger-text)">custom APIs</text>

  <rect x="937.297297" y="56.730769" width="302.702703" height="122.692308" rx="8.784791" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1088.648649" y="101.346154" text-anchor="middle" font-size="19.76578" font-weight="bold" fill="var(--info-text)">Registry</text>
  <text x="1088.648649" y="134.807692" text-anchor="middle" font-size="14.275286" fill="var(--info-text)">tool catalog</text>
  <text x="1088.648649" y="160.461538" text-anchor="middle" font-size="14.275286" fill="var(--info-text)">schemas + versions</text>

  <rect x="937.297297" y="229.615385" width="302.702703" height="122.692308" rx="8.784791" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1088.648649" y="274.230769" text-anchor="middle" font-size="19.76578" font-weight="bold" fill="var(--primary-text)">Auth</text>
  <text x="1088.648649" y="307.692308" text-anchor="middle" font-size="14.275286" fill="var(--primary-text)">permission checks</text>
  <text x="1088.648649" y="333.346154" text-anchor="middle" font-size="14.275286" fill="var(--primary-text)">token management</text>

  <rect x="937.297297" y="402.5" width="302.702703" height="122.692308" rx="8.784791" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1088.648649" y="447.115385" text-anchor="middle" font-size="19.76578" font-weight="bold" fill="var(--warn-text)">Logger</text>
  <text x="1088.648649" y="480.576923" text-anchor="middle" font-size="14.275286" fill="var(--warn-text)">audit trail</text>
  <text x="1088.648649" y="506.230769" text-anchor="middle" font-size="14.275286" fill="var(--warn-text)">every invocation</text>

  <line x1="802.162162" y1="212.884615" x2="937.297297" y2="118.076923" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="894.054054" y1="290.961538" x2="937.297297" y2="290.961538" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="802.162162" y1="369.038462" x2="937.297297" y2="463.846154" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <path d="M 802.162162 369.038462 Q 802.162162 580.961538 575.135135 580.961538 Q 483.243243 580.961538 483.243243 369.038462" fill="none" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-ok)"/>
  <text x="640" y="620" text-anchor="middle" font-size="16.471484" font-weight="bold" fill="var(--ok-accent)">tool results flow back to LLM</text>
</svg>

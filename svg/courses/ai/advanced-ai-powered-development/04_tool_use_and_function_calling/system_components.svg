<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,264.4899 21.2071,0" fill="#333" />
    </marker>
  </defs>
  <rect width="293.234" height="640" fill="var(--surface)" rx="6"/>
  <text x="146.617" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Production Architecture for Tool-Use Systems</text>
  <rect x="7.3309" y="272" width="40.3197" height="112" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="27.4907" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Client</text>
  <text x="27.4907" y="352" text-anchor="middle" font-size="10" fill="var(--text-muted)">API caller</text>
  <text x="27.4907" y="376" text-anchor="middle" font-size="10" fill="var(--text-muted)">agent / user</text>
  <line x1="47.6505" y1="328" x2="60.4795" y2="328" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <rect x="60.4795" y="248" width="47.6505" height="160" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="84.3048" y="292.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">API Gateway</text>
  <text x="84.3048" y="324.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">rate limiting</text>
  <text x="84.3048" y="352" text-anchor="middle" font-size="10" fill="var(--text-muted)">validation</text>
  <text x="84.3048" y="379.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">routing</text>
  <line x1="108.13" y1="328" x2="120.959" y2="328" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <rect x="120.959" y="248" width="47.6505" height="160" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="144.7843" y="292.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">LLM</text>
  <text x="144.7843" y="324.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">Claude / GPT</text>
  <text x="144.7843" y="352" text-anchor="middle" font-size="10" fill="var(--text-muted)">reasoning</text>
  <text x="144.7843" y="379.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">tool selection</text>
  <line x1="168.6095" y1="328" x2="181.4385" y2="328" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <rect x="181.4385" y="96" width="47.6505" height="128" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="205.2638" y="144" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Registry</text>
  <text x="205.2638" y="176" text-anchor="middle" font-size="10" fill="var(--text-muted)">tool catalog</text>
  <text x="205.2638" y="203.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">schemas + versions</text>
  <rect x="181.4385" y="256" width="47.6505" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="205.2638" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Auth</text>
  <text x="205.2638" y="336" text-anchor="middle" font-size="10" fill="var(--text-muted)">permission checks</text>
  <text x="205.2638" y="363.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">token management</text>
  <rect x="181.4385" y="416" width="47.6505" height="128" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="205.2638" y="464" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Logger</text>
  <text x="205.2638" y="496" text-anchor="middle" font-size="10" fill="var(--text-muted)">audit trail</text>
  <text x="205.2638" y="523.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">every invocation</text>
  <line x1="168.6095" y1="296" x2="181.4385" y2="176" stroke="var(--text)" stroke-width="0.5498" stroke-dasharray="1.4662 0.7331" />
  <line x1="168.6095" y1="320" x2="181.4385" y2="320" stroke="var(--text)" stroke-width="0.5498" stroke-dasharray="1.4662 0.7331" />
  <line x1="168.6095" y1="344" x2="181.4385" y2="464" stroke="var(--text)" stroke-width="0.5498" stroke-dasharray="1.4662 0.7331" />
  <rect x="243.7507" y="248" width="43.9851" height="160" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="265.7433" y="292.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Tools</text>
  <text x="265.7433" y="324.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">file, shell</text>
  <text x="265.7433" y="352" text-anchor="middle" font-size="10" fill="var(--text-muted)">web, LSP</text>
  <text x="265.7433" y="379.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">custom APIs</text>
  <line x1="229.089" y1="328" x2="243.7507" y2="328" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <path d="M 265.7433 408 Q 265.7433 576 144.7843 576 Q 120.959 576 120.959 408" fill="none" stroke="var(--ok-border)" stroke-width="0.5498" stroke-dasharray="1.8327 1.0996" marker-end="url(#arr)" />
  <text x="194.2675" y="604.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">tool results flow back to LLM</text>
</svg>
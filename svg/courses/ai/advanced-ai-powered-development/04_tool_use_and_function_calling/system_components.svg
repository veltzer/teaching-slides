<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,264.4899 21.2071,0" fill="#333" />
    </marker>
  </defs>
  <rect width="265.7433" height="580" fill="var(--surface)" rx="6" x="507.1283" y="40"/>
  <text x="640" y="95.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Production Architecture for Tool-Use Systems</text>
  <rect x="513.772" y="286.5" width="36.5397" height="101.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="532.0418" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Client</text>
  <text x="532.0418" y="359" text-anchor="middle" font-size="10" fill="var(--text-muted)">API caller</text>
  <text x="532.0418" y="380.75" text-anchor="middle" font-size="10" fill="var(--text-muted)">agent / user</text>
  <line x1="550.3116" y1="337.25" x2="561.9379" y2="337.25" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <rect x="561.9379" y="264.75" width="43.1833" height="145" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="583.5296" y="305.35" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">API Gateway</text>
  <text x="583.5296" y="334.35" text-anchor="middle" font-size="10" fill="var(--text-muted)">rate limiting</text>
  <text x="583.5296" y="359" text-anchor="middle" font-size="10" fill="var(--text-muted)">validation</text>
  <text x="583.5296" y="383.65" text-anchor="middle" font-size="10" fill="var(--text-muted)">routing</text>
  <line x1="605.1212" y1="337.25" x2="616.7474" y2="337.25" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <rect x="616.7474" y="264.75" width="43.1833" height="145" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="638.3391" y="305.35" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">LLM</text>
  <text x="638.3391" y="334.35" text-anchor="middle" font-size="10" fill="var(--text-muted)">Claude / GPT</text>
  <text x="638.3391" y="359" text-anchor="middle" font-size="10" fill="var(--text-muted)">reasoning</text>
  <text x="638.3391" y="383.65" text-anchor="middle" font-size="10" fill="var(--text-muted)">tool selection</text>
  <line x1="659.9307" y1="337.25" x2="671.557" y2="337.25" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <rect x="671.557" y="127" width="43.1833" height="116" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="693.1487" y="170.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Registry</text>
  <text x="693.1487" y="199.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">tool catalog</text>
  <text x="693.1487" y="224.15" text-anchor="middle" font-size="10" fill="var(--text-muted)">schemas + versions</text>
  <rect x="671.557" y="272" width="43.1833" height="116" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="693.1487" y="315.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Auth</text>
  <text x="693.1487" y="344.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">permission checks</text>
  <text x="693.1487" y="369.15" text-anchor="middle" font-size="10" fill="var(--text-muted)">token management</text>
  <rect x="671.557" y="417" width="43.1833" height="116" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="693.1487" y="460.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Logger</text>
  <text x="693.1487" y="489.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">audit trail</text>
  <text x="693.1487" y="514.15" text-anchor="middle" font-size="10" fill="var(--text-muted)">every invocation</text>
  <line x1="659.9307" y1="308.25" x2="671.557" y2="199.5" stroke="var(--text)" stroke-width="0.5498" stroke-dasharray="1.4662 0.7331" />
  <line x1="659.9307" y1="330" x2="671.557" y2="330" stroke="var(--text)" stroke-width="0.5498" stroke-dasharray="1.4662 0.7331" />
  <line x1="659.9307" y1="351.75" x2="671.557" y2="460.5" stroke="var(--text)" stroke-width="0.5498" stroke-dasharray="1.4662 0.7331" />
  <rect x="728.0274" y="264.75" width="39.8615" height="145" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="747.9582" y="305.35" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Tools</text>
  <text x="747.9582" y="334.35" text-anchor="middle" font-size="10" fill="var(--text-muted)">file, shell</text>
  <text x="747.9582" y="359" text-anchor="middle" font-size="10" fill="var(--text-muted)">web, LSP</text>
  <text x="747.9582" y="383.65" text-anchor="middle" font-size="10" fill="var(--text-muted)">custom APIs</text>
  <line x1="714.7403" y1="337.25" x2="728.0274" y2="337.25" stroke="var(--text)" stroke-width="0.7331" marker-end="url(#arr)" />
  <path d="M 747.9582 409.75 Q 747.9582 562 638.3391 562 Q 616.7474 562 616.7474 409.75" fill="none" stroke="var(--ok-border)" stroke-width="0.5498" stroke-dasharray="1.8327 1.0996" marker-end="url(#arr)" />
  <text x="683.1833" y="588.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">tool results flow back to LLM</text>
</svg>
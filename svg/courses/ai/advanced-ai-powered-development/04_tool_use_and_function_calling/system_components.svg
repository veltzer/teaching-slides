<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="200.792078983629" width="172.972973" height="160.792078983629" rx="8.914303502129" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="126.486486" y="258.217821771983" text-anchor="middle" font-size="20.057183133475" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Client</text>
  <text x="126.486486" y="298.415842032742" text-anchor="middle" font-size="15.600031889782" fill="var(--primary-text)" font-family="Arial, sans-serif">API caller</text>
  <text x="126.486486" y="327.128712912067" text-anchor="middle" font-size="15.600031889782" fill="var(--primary-text)" font-family="Arial, sans-serif">agent / user</text>

  <line x1="212.972973" y1="281.188118475444" x2="250.810811" y2="281.188118475444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="256.216216" y="200.792078983629" width="183.783784" height="160.792078983629" rx="8.914303502129" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="348.108108" y="252.475247596118" text-anchor="middle" font-size="20.057183133475" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">API Gateway</text>
  <text x="348.108108" y="286.930693681012" text-anchor="middle" font-size="14.485743825174" fill="var(--warn-text)" font-family="Arial, sans-serif">rate limiting</text>
  <text x="348.108108" y="313.346535095932" text-anchor="middle" font-size="14.485743825174" fill="var(--warn-text)" font-family="Arial, sans-serif">validation</text>
  <text x="348.108108" y="339.762376510852" text-anchor="middle" font-size="14.485743825174" fill="var(--warn-text)" font-family="Arial, sans-serif">routing</text>

  <line x1="440" y1="281.188118475444" x2="477.837838" y2="281.188118475444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="483.243243" y="200.792078983629" width="183.783784" height="160.792078983629" rx="8.914303502129" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="575.135135" y="252.475247596118" text-anchor="middle" font-size="20.057183133475" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">LLM</text>
  <text x="575.135135" y="286.930693681012" text-anchor="middle" font-size="14.485743825174" fill="var(--ok-text)" font-family="Arial, sans-serif">Claude / GPT</text>
  <text x="575.135135" y="313.346535095932" text-anchor="middle" font-size="14.485743825174" fill="var(--ok-text)" font-family="Arial, sans-serif">reasoning</text>
  <text x="575.135135" y="339.762376510852" text-anchor="middle" font-size="14.485743825174" fill="var(--ok-text)" font-family="Arial, sans-serif">tool selection</text>

  <line x1="667.027027" y1="281.188118475444" x2="704.864865" y2="281.188118475444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="710.27027" y="200.792078983629" width="183.783784" height="160.792078983629" rx="8.914303502129" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.162162" y="252.475247596118" text-anchor="middle" font-size="20.057183133475" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Tools</text>
  <text x="802.162162" y="286.930693681012" text-anchor="middle" font-size="14.485743825174" fill="var(--danger-text)" font-family="Arial, sans-serif">file, shell</text>
  <text x="802.162162" y="313.346535095932" text-anchor="middle" font-size="14.485743825174" fill="var(--danger-text)" font-family="Arial, sans-serif">web, LSP</text>
  <text x="802.162162" y="339.762376510852" text-anchor="middle" font-size="14.485743825174" fill="var(--danger-text)" font-family="Arial, sans-serif">custom APIs</text>

  <rect x="937.297297" y="40" width="302.702703" height="126.336633928438" rx="8.914303502129" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1088.648649" y="85.940594436624" text-anchor="middle" font-size="20.057183133475" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Registry</text>
  <text x="1088.648649" y="120.396039491815" text-anchor="middle" font-size="14.485743825174" fill="var(--info-text)" font-family="Arial, sans-serif">tool catalog</text>
  <text x="1088.648649" y="146.811880906735" text-anchor="middle" font-size="14.485743825174" fill="var(--info-text)" font-family="Arial, sans-serif">schemas + versions</text>

  <rect x="937.297297" y="218.019802540927" width="302.702703" height="126.336633928438" rx="8.914303502129" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1088.648649" y="263.960395947848" text-anchor="middle" font-size="20.057183133475" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Auth</text>
  <text x="1088.648649" y="298.415842032742" text-anchor="middle" font-size="14.485743825174" fill="var(--primary-text)" font-family="Arial, sans-serif">permission checks</text>
  <text x="1088.648649" y="324.831683447662" text-anchor="middle" font-size="14.485743825174" fill="var(--primary-text)" font-family="Arial, sans-serif">token management</text>

  <rect x="937.297297" y="396.039604052152" width="302.702703" height="126.336633928438" rx="8.914303502129" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1088.648649" y="441.980198488776" text-anchor="middle" font-size="20.057183133475" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Logger</text>
  <text x="1088.648649" y="476.435643543966" text-anchor="middle" font-size="14.485743825174" fill="var(--warn-text)" font-family="Arial, sans-serif">audit trail</text>
  <text x="1088.648649" y="502.851484958886" text-anchor="middle" font-size="14.485743825174" fill="var(--warn-text)" font-family="Arial, sans-serif">every invocation</text>

  <line x1="802.162162" y1="200.792078983629" x2="937.297297" y2="103.168316964219" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="894.054054" y1="281.188118475444" x2="937.297297" y2="281.188118475444" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="802.162162" y1="361.584158996961" x2="937.297297" y2="459.207921016371" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <path d="M 802.162162 361.584158996961 Q 802.162162 579.801979739241 575.135135 579.801979739241 Q 483.243243 579.801979739241 483.243243 361.584158996961" fill="none" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-ok)"/>
  <text x="640" y="620" text-anchor="middle" font-size="16.714319954391" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">tool results flow back to LLM</text>
</svg>

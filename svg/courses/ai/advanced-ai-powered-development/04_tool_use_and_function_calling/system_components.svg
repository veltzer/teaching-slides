<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="656.216216" y="40" text-anchor="middle" font-size="28.550572" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Production Architecture for Tool-Use Systems</text>

  <rect x="40" y="212.884615" width="172.972973" height="156.153846" rx="8.784791" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="126.486486" y="268.653846" text-anchor="middle" font-size="19.76578" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Client</text>
  <text x="126.486486" y="307.692308" text-anchor="middle" font-size="15.373385" fill="var(--primary-text)" font-family="Arial, sans-serif">API caller</text>
  <text x="126.486486" y="335.576923" text-anchor="middle" font-size="15.373385" fill="var(--primary-text)" font-family="Arial, sans-serif">agent / user</text>

  <line x1="212.972973" y1="290.961538" x2="250.810811" y2="290.961538" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="256.216216" y="212.884615" width="183.783784" height="156.153846" rx="8.784791" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="348.108108" y="263.076923" text-anchor="middle" font-size="19.76578" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">API Gateway</text>
  <text x="348.108108" y="296.538462" text-anchor="middle" font-size="14.275286" fill="var(--warn-text)" font-family="Arial, sans-serif">rate limiting</text>
  <text x="348.108108" y="322.192308" text-anchor="middle" font-size="14.275286" fill="var(--warn-text)" font-family="Arial, sans-serif">validation</text>
  <text x="348.108108" y="347.846154" text-anchor="middle" font-size="14.275286" fill="var(--warn-text)" font-family="Arial, sans-serif">routing</text>

  <line x1="440" y1="290.961538" x2="477.837838" y2="290.961538" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="483.243243" y="212.884615" width="183.783784" height="156.153846" rx="8.784791" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="575.135135" y="263.076923" text-anchor="middle" font-size="19.76578" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">LLM</text>
  <text x="575.135135" y="296.538462" text-anchor="middle" font-size="14.275286" fill="var(--ok-text)" font-family="Arial, sans-serif">Claude / GPT</text>
  <text x="575.135135" y="322.192308" text-anchor="middle" font-size="14.275286" fill="var(--ok-text)" font-family="Arial, sans-serif">reasoning</text>
  <text x="575.135135" y="347.846154" text-anchor="middle" font-size="14.275286" fill="var(--ok-text)" font-family="Arial, sans-serif">tool selection</text>

  <line x1="667.027027" y1="290.961538" x2="704.864865" y2="290.961538" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="710.27027" y="212.884615" width="183.783784" height="156.153846" rx="8.784791" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.162162" y="263.076923" text-anchor="middle" font-size="19.76578" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Tools</text>
  <text x="802.162162" y="296.538462" text-anchor="middle" font-size="14.275286" fill="var(--danger-text)" font-family="Arial, sans-serif">file, shell</text>
  <text x="802.162162" y="322.192308" text-anchor="middle" font-size="14.275286" fill="var(--danger-text)" font-family="Arial, sans-serif">web, LSP</text>
  <text x="802.162162" y="347.846154" text-anchor="middle" font-size="14.275286" fill="var(--danger-text)" font-family="Arial, sans-serif">custom APIs</text>

  <rect x="937.297297" y="56.730769" width="302.702703" height="122.692308" rx="8.784791" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1088.648649" y="101.346154" text-anchor="middle" font-size="19.76578" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Registry</text>
  <text x="1088.648649" y="134.807692" text-anchor="middle" font-size="14.275286" fill="var(--info-text)" font-family="Arial, sans-serif">tool catalog</text>
  <text x="1088.648649" y="160.461538" text-anchor="middle" font-size="14.275286" fill="var(--info-text)" font-family="Arial, sans-serif">schemas + versions</text>

  <rect x="937.297297" y="229.615385" width="302.702703" height="122.692308" rx="8.784791" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1088.648649" y="274.230769" text-anchor="middle" font-size="19.76578" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Auth</text>
  <text x="1088.648649" y="307.692308" text-anchor="middle" font-size="14.275286" fill="var(--primary-text)" font-family="Arial, sans-serif">permission checks</text>
  <text x="1088.648649" y="333.346154" text-anchor="middle" font-size="14.275286" fill="var(--primary-text)" font-family="Arial, sans-serif">token management</text>

  <rect x="937.297297" y="402.5" width="302.702703" height="122.692308" rx="8.784791" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1088.648649" y="447.115385" text-anchor="middle" font-size="19.76578" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Logger</text>
  <text x="1088.648649" y="480.576923" text-anchor="middle" font-size="14.275286" fill="var(--warn-text)" font-family="Arial, sans-serif">audit trail</text>
  <text x="1088.648649" y="506.230769" text-anchor="middle" font-size="14.275286" fill="var(--warn-text)" font-family="Arial, sans-serif">every invocation</text>

  <line x1="802.162162" y1="212.884615" x2="937.297297" y2="118.076923" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="894.054054" y1="290.961538" x2="937.297297" y2="290.961538" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="802.162162" y1="369.038462" x2="937.297297" y2="463.846154" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <path d="M 802.162162 369.038462 Q 802.162162 580.961538 575.135135 580.961538 Q 483.243243 580.961538 483.243243 369.038462" fill="none" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-ok)"/>
  <text x="640" y="620" text-anchor="middle" font-size="16.471484" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">tool results flow back to LLM</text>
</svg>

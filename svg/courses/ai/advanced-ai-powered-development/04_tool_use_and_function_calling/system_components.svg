<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="85" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-accent)">Production Architecture for Tool-Use Systems</text>

  <rect x="70" y="240" width="160" height="140" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150" y="290" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-text)">Client</text>
  <text x="150" y="325" text-anchor="middle" font-size="14" fill="var(--primary-text)">API caller</text>
  <text x="150" y="350" text-anchor="middle" font-size="14" fill="var(--primary-text)">agent / user</text>

  <line x1="230" y1="310" x2="265" y2="310" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="240" width="170" height="140" rx="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="355" y="285" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--warn-text)">API Gateway</text>
  <text x="355" y="315" text-anchor="middle" font-size="13" fill="var(--warn-text)">rate limiting</text>
  <text x="355" y="338" text-anchor="middle" font-size="13" fill="var(--warn-text)">validation</text>
  <text x="355" y="361" text-anchor="middle" font-size="13" fill="var(--warn-text)">routing</text>

  <line x1="440" y1="310" x2="475" y2="310" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="240" width="170" height="140" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="565" y="285" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--ok-text)">LLM</text>
  <text x="565" y="315" text-anchor="middle" font-size="13" fill="var(--ok-text)">Claude / GPT</text>
  <text x="565" y="338" text-anchor="middle" font-size="13" fill="var(--ok-text)">reasoning</text>
  <text x="565" y="361" text-anchor="middle" font-size="13" fill="var(--ok-text)">tool selection</text>

  <line x1="650" y1="310" x2="685" y2="310" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="690" y="240" width="170" height="140" rx="8" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="775" y="285" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--danger-text)">Tools</text>
  <text x="775" y="315" text-anchor="middle" font-size="13" fill="var(--danger-text)">file, shell</text>
  <text x="775" y="338" text-anchor="middle" font-size="13" fill="var(--danger-text)">web, LSP</text>
  <text x="775" y="361" text-anchor="middle" font-size="13" fill="var(--danger-text)">custom APIs</text>

  <rect x="900" y="100" width="280" height="110" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1040" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--info-text)">Registry</text>
  <text x="1040" y="170" text-anchor="middle" font-size="13" fill="var(--info-text)">tool catalog</text>
  <text x="1040" y="193" text-anchor="middle" font-size="13" fill="var(--info-text)">schemas + versions</text>

  <rect x="900" y="255" width="280" height="110" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1040" y="295" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-text)">Auth</text>
  <text x="1040" y="325" text-anchor="middle" font-size="13" fill="var(--primary-text)">permission checks</text>
  <text x="1040" y="348" text-anchor="middle" font-size="13" fill="var(--primary-text)">token management</text>

  <rect x="900" y="410" width="280" height="110" rx="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1040" y="450" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--warn-text)">Logger</text>
  <text x="1040" y="480" text-anchor="middle" font-size="13" fill="var(--warn-text)">audit trail</text>
  <text x="1040" y="503" text-anchor="middle" font-size="13" fill="var(--warn-text)">every invocation</text>

  <line x1="775" y1="240" x2="900" y2="155" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="860" y1="310" x2="900" y2="310" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="775" y1="380" x2="900" y2="465" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <path d="M 775 380 Q 775 570 565 570 Q 480 570 480 380" fill="none" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-ok)"/>
  <text x="625" y="605" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--ok-accent)">tool results flow back to LLM</text>
</svg>

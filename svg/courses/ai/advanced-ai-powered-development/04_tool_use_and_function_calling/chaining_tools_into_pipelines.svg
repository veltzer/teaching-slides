<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,202.5 14.9178,0" fill="#555" />
    </marker>
  </defs>
  <rect width="244.1572" height="580" fill="var(--surface)" rx="6" x="517.9214" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Tool Pipeline: "Find and Fix All Deprecated API Calls"</text>
  <rect x="524.0254" y="156" width="50.3574" height="145" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="549.0515" y="199.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Step 1</text>
  <text x="549.0515" y="231.4" text-anchor="middle" font-size="10" fill="var(--text)">grep("deprecated")</text>
  <text x="549.0515" y="264.75" text-anchor="middle" font-size="10" fill="var(--text-muted)">→ list of files</text>
  <text x="549.0515" y="289.4" text-anchor="middle" font-size="10" fill="var(--text-faint)">codebase search</text>
  <line x1="574.3828" y1="228.5" x2="583.5386" y2="228.5" stroke="var(--text-muted)" stroke-width="0.6735" marker-end="url(#arr)" />
  <rect x="583.5386" y="156" width="50.3574" height="145" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="608.5648" y="199.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Step 2</text>
  <text x="608.5648" y="231.4" text-anchor="middle" font-size="10" fill="var(--text)">read_file(file)</text>
  <text x="608.5648" y="264.75" text-anchor="middle" font-size="10" fill="var(--text-muted)">→ source code</text>
  <text x="608.5648" y="289.4" text-anchor="middle" font-size="10" fill="var(--text-faint)">for each match</text>
  <line x1="633.896" y1="228.5" x2="643.052" y2="228.5" stroke="var(--text-muted)" stroke-width="0.6735" marker-end="url(#arr)" />
  <rect x="643.052" y="156" width="50.3574" height="145" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="668.0781" y="199.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Step 3</text>
  <text x="668.0781" y="231.4" text-anchor="middle" font-size="10" fill="var(--text)">edit_file(file)</text>
  <text x="668.0781" y="264.75" text-anchor="middle" font-size="10" fill="var(--text-muted)">→ patched file</text>
  <text x="668.0781" y="289.4" text-anchor="middle" font-size="10" fill="var(--text-faint)">apply new API</text>
  <line x1="693.4094" y1="228.5" x2="702.5653" y2="228.5" stroke="var(--text-muted)" stroke-width="0.6735" marker-end="url(#arr)" />
  <rect x="702.5653" y="156" width="53.4094" height="145" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="729.1174" y="199.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Step 4</text>
  <text x="729.1174" y="231.4" text-anchor="middle" font-size="10" fill="var(--text)">shell("npm test")</text>
  <text x="729.1174" y="264.75" text-anchor="middle" font-size="10" fill="var(--text-muted)">→ validation</text>
  <text x="729.1174" y="289.4" text-anchor="middle" font-size="10" fill="var(--text-faint)">all tests green</text>
  <rect x="524.0254" y="359" width="231.9493" height="239.25" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="402.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Orchestration Strategies</text>
  <rect x="530.1292" y="428.6" width="65.6172" height="145" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="562.7853" y="469.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Sequential</text>
  <text x="562.7853" y="501.1" text-anchor="middle" font-size="10" fill="var(--text)">each step depends</text>
  <text x="562.7853" y="530.1" text-anchor="middle" font-size="10" fill="var(--text)">on previous result</text>
  <text x="562.7853" y="559.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">e.g. read → analyze → fix</text>
  <rect x="607.344" y="428.6" width="65.6172" height="145" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="469.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Fan-Out / Fan-In</text>
  <text x="640" y="501.1" text-anchor="middle" font-size="10" fill="var(--text)">parallel reads,</text>
  <text x="640" y="530.1" text-anchor="middle" font-size="10" fill="var(--text)">then aggregate</text>
  <text x="640" y="559.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">e.g. read 5 files at once</text>
  <rect x="684.5587" y="428.6" width="65.6172" height="145" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="717.2148" y="469.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Conditional</text>
  <text x="717.2148" y="501.1" text-anchor="middle" font-size="10" fill="var(--text)">branch based on</text>
  <text x="717.2148" y="530.1" text-anchor="middle" font-size="10" fill="var(--text)">tool output</text>
  <text x="717.2148" y="559.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">e.g. skip if tests pass</text>
</svg>
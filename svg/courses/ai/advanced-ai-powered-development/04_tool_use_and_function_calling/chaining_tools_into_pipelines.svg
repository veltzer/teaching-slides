<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,202.5 14.9178,0" fill="#555" />
    </marker>
  </defs>
  <rect width="269.4148" height="640" fill="var(--surface)" rx="6"/>
  <text x="134.7074" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Tool Pipeline: "Find and Fix All Deprecated API Calls"</text>
  <rect x="6.7354" y="128" width="55.5668" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="34.3504" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Step 1</text>
  <text x="34.3504" y="211.2" text-anchor="middle" font-size="10" fill="var(--text)">grep("deprecated")</text>
  <text x="34.3504" y="248" text-anchor="middle" font-size="10" fill="var(--text-muted)">→ list of files</text>
  <text x="34.3504" y="275.2" text-anchor="middle" font-size="10" fill="var(--text-faint)">codebase search</text>
  <line x1="62.3022" y1="208" x2="72.4052" y2="208" stroke="var(--text-muted)" stroke-width="0.6735" marker-end="url(#arr)" />
  <rect x="72.4052" y="128" width="55.5668" height="160" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="100.0203" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Step 2</text>
  <text x="100.0203" y="211.2" text-anchor="middle" font-size="10" fill="var(--text)">read_file(file)</text>
  <text x="100.0203" y="248" text-anchor="middle" font-size="10" fill="var(--text-muted)">→ source code</text>
  <text x="100.0203" y="275.2" text-anchor="middle" font-size="10" fill="var(--text-faint)">for each match</text>
  <line x1="127.972" y1="208" x2="138.0751" y2="208" stroke="var(--text-muted)" stroke-width="0.6735" marker-end="url(#arr)" />
  <rect x="138.0751" y="128" width="55.5668" height="160" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="165.6901" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Step 3</text>
  <text x="165.6901" y="211.2" text-anchor="middle" font-size="10" fill="var(--text)">edit_file(file)</text>
  <text x="165.6901" y="248" text-anchor="middle" font-size="10" fill="var(--text-muted)">→ patched file</text>
  <text x="165.6901" y="275.2" text-anchor="middle" font-size="10" fill="var(--text-faint)">apply new API</text>
  <line x1="193.6419" y1="208" x2="203.745" y2="208" stroke="var(--text-muted)" stroke-width="0.6735" marker-end="url(#arr)" />
  <rect x="203.745" y="128" width="58.9345" height="160" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="233.0438" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Step 4</text>
  <text x="233.0438" y="211.2" text-anchor="middle" font-size="10" fill="var(--text)">shell("npm test")</text>
  <text x="233.0438" y="248" text-anchor="middle" font-size="10" fill="var(--text-muted)">→ validation</text>
  <text x="233.0438" y="275.2" text-anchor="middle" font-size="10" fill="var(--text-faint)">all tests green</text>
  <rect x="6.7354" y="352" width="255.9441" height="264" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="134.7074" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Orchestration Strategies</text>
  <rect x="13.4707" y="428.8" width="72.4052" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="49.505" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Sequential</text>
  <text x="49.505" y="508.8" text-anchor="middle" font-size="10" fill="var(--text)">each step depends</text>
  <text x="49.505" y="540.8" text-anchor="middle" font-size="10" fill="var(--text)">on previous result</text>
  <text x="49.505" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">e.g. read → analyze → fix</text>
  <rect x="98.6732" y="428.8" width="72.4052" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="134.7074" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Fan-Out / Fan-In</text>
  <text x="134.7074" y="508.8" text-anchor="middle" font-size="10" fill="var(--text)">parallel reads,</text>
  <text x="134.7074" y="540.8" text-anchor="middle" font-size="10" fill="var(--text)">then aggregate</text>
  <text x="134.7074" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">e.g. read 5 files at once</text>
  <rect x="183.8756" y="428.8" width="72.4052" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="219.9099" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Conditional</text>
  <text x="219.9099" y="508.8" text-anchor="middle" font-size="10" fill="var(--text)">branch based on</text>
  <text x="219.9099" y="540.8" text-anchor="middle" font-size="10" fill="var(--text)">tool output</text>
  <text x="219.9099" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">e.g. skip if tests pass</text>
</svg>
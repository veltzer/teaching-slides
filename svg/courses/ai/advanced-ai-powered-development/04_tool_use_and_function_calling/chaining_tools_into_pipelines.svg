<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.131228" font-weight="bold" fill="var(--primary-accent)">Tool Pipeline: Find and Fix All Deprecated API Calls</text>

  <rect x="40" y="90.679612" width="273.684211" height="202.718447" rx="8.710409" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.842105" y="135.728155" text-anchor="middle" font-size="21.776023" font-weight="bold" fill="var(--primary-text)">Step 1</text>
  <text x="176.842105" y="180.776699" text-anchor="middle" font-size="17.420819" fill="var(--primary-text)">grep("deprecated")</text>
  <text x="176.842105" y="220.194175" text-anchor="middle" font-size="15.243216" fill="var(--primary-text)">→ list of files</text>
  <text x="176.842105" y="259.61165" text-anchor="middle" font-size="15.243216" fill="var(--primary-text)">codebase search</text>

  <line x1="318.947368" y1="192.038835" x2="350.526316" y2="192.038835" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="355.789474" y="90.679612" width="273.684211" height="202.718447" rx="8.710409" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492.631579" y="135.728155" text-anchor="middle" font-size="21.776023" font-weight="bold" fill="var(--ok-text)">Step 2</text>
  <text x="492.631579" y="180.776699" text-anchor="middle" font-size="17.420819" fill="var(--ok-text)">read_file(f)</text>
  <text x="492.631579" y="220.194175" text-anchor="middle" font-size="15.243216" fill="var(--ok-text)">→ source code</text>
  <text x="492.631579" y="259.61165" text-anchor="middle" font-size="15.243216" fill="var(--ok-text)">for each match</text>

  <line x1="634.736842" y1="192.038835" x2="666.315789" y2="192.038835" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="671.578947" y="90.679612" width="273.684211" height="202.718447" rx="8.710409" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="808.421053" y="135.728155" text-anchor="middle" font-size="21.776023" font-weight="bold" fill="var(--warn-text)">Step 3</text>
  <text x="808.421053" y="180.776699" text-anchor="middle" font-size="17.420819" fill="var(--warn-text)">edit_file(f)</text>
  <text x="808.421053" y="220.194175" text-anchor="middle" font-size="15.243216" fill="var(--warn-text)">→ patched file</text>
  <text x="808.421053" y="259.61165" text-anchor="middle" font-size="15.243216" fill="var(--warn-text)">apply new API</text>

  <line x1="950.526316" y1="192.038835" x2="982.105263" y2="192.038835" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="987.368421" y="90.679612" width="252.631579" height="202.718447" rx="8.710409" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1113.684211" y="135.728155" text-anchor="middle" font-size="21.776023" font-weight="bold" fill="var(--danger-text)">Step 4</text>
  <text x="1113.684211" y="180.776699" text-anchor="middle" font-size="17.420819" fill="var(--danger-text)">shell("npm test")</text>
  <text x="1113.684211" y="220.194175" text-anchor="middle" font-size="15.243216" fill="var(--danger-text)">→ validation</text>
  <text x="1113.684211" y="259.61165" text-anchor="middle" font-size="15.243216" fill="var(--danger-text)">all tests green</text>

  <rect x="40" y="338.446602" width="1200" height="281.553398" rx="8.710409" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="383.495146" text-anchor="middle" font-size="23.953626" font-weight="bold" fill="var(--info-text)">Orchestration Strategies</text>

  <rect x="82.105263" y="417.281553" width="357.894737" height="180.194175" rx="6.532807" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="261.052632" y="456.699029" text-anchor="middle" font-size="19.598421" font-weight="bold" fill="var(--primary-accent)">Sequential</text>
  <text x="261.052632" y="501.747573" text-anchor="middle" font-size="15.243216" fill="var(--text)">each step depends on the</text>
  <text x="261.052632" y="527.650485" text-anchor="middle" font-size="15.243216" fill="var(--text)">previous result</text>
  <text x="261.052632" y="569.320388" text-anchor="middle" font-size="14.154415" fill="var(--text-muted)">read → analyze → fix</text>

  <rect x="461.052632" y="417.281553" width="357.894737" height="180.194175" rx="6.532807" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="456.699029" text-anchor="middle" font-size="19.598421" font-weight="bold" fill="var(--ok-accent)">Fan-Out / Fan-In</text>
  <text x="640" y="501.747573" text-anchor="middle" font-size="15.243216" fill="var(--text)">parallel reads, then</text>
  <text x="640" y="527.650485" text-anchor="middle" font-size="15.243216" fill="var(--text)">aggregate and act</text>
  <text x="640" y="569.320388" text-anchor="middle" font-size="14.154415" fill="var(--text-muted)">read 5 files at once</text>

  <rect x="840" y="417.281553" width="357.894737" height="180.194175" rx="6.532807" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="1018.947368" y="456.699029" text-anchor="middle" font-size="19.598421" font-weight="bold" fill="var(--warn-accent)">Conditional</text>
  <text x="1018.947368" y="501.747573" text-anchor="middle" font-size="15.243216" fill="var(--text)">branch based on</text>
  <text x="1018.947368" y="527.650485" text-anchor="middle" font-size="15.243216" fill="var(--text)">tool output</text>
  <text x="1018.947368" y="569.320388" text-anchor="middle" font-size="14.154415" fill="var(--text-muted)">skip if tests pass</text>
</svg>

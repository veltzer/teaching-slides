<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>
    <ns0:marker id="arr" markerWidth="3.3677" markerHeight="11.2" refX="3.0309" refY="5.6" orient="auto">
      <ns0:polygon points="0,16 1.1787,0" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="269.4148" height="640" fill="#f8f9fa" />
  <ns0:text x="134.7074" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Tool Pipeline: "Find and Fix All Deprecated API Calls"</ns0:text>
  <ns0:rect x="6.7354" y="128" width="55.5668" height="160" rx="3.3677" fill="#E3F2FD" stroke="#1565C0" stroke-width="0.6735" />
  <ns0:text x="34.3504" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">Step 1</ns0:text>
  <ns0:text x="34.3504" y="211.2" text-anchor="middle" font-size="10" fill="#333">grep("deprecated")</ns0:text>
  <ns0:text x="34.3504" y="248" text-anchor="middle" font-size="10" fill="#555">→ list of files</ns0:text>
  <ns0:text x="34.3504" y="275.2" text-anchor="middle" font-size="10" fill="#888">codebase search</ns0:text>
  <ns0:line x1="62.3022" y1="208" x2="72.4052" y2="208" stroke="#555" stroke-width="0.6735" marker-end="url(#arr)" />
  <ns0:rect x="72.4052" y="128" width="55.5668" height="160" rx="3.3677" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.6735" />
  <ns0:text x="100.0203" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Step 2</ns0:text>
  <ns0:text x="100.0203" y="211.2" text-anchor="middle" font-size="10" fill="#333">read_file(file)</ns0:text>
  <ns0:text x="100.0203" y="248" text-anchor="middle" font-size="10" fill="#555">→ source code</ns0:text>
  <ns0:text x="100.0203" y="275.2" text-anchor="middle" font-size="10" fill="#888">for each match</ns0:text>
  <ns0:line x1="127.972" y1="208" x2="138.0751" y2="208" stroke="#555" stroke-width="0.6735" marker-end="url(#arr)" />
  <ns0:rect x="138.0751" y="128" width="55.5668" height="160" rx="3.3677" fill="#FFF3E0" stroke="#E65100" stroke-width="0.6735" />
  <ns0:text x="165.6901" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">Step 3</ns0:text>
  <ns0:text x="165.6901" y="211.2" text-anchor="middle" font-size="10" fill="#333">edit_file(file)</ns0:text>
  <ns0:text x="165.6901" y="248" text-anchor="middle" font-size="10" fill="#555">→ patched file</ns0:text>
  <ns0:text x="165.6901" y="275.2" text-anchor="middle" font-size="10" fill="#888">apply new API</ns0:text>
  <ns0:line x1="193.6419" y1="208" x2="203.745" y2="208" stroke="#555" stroke-width="0.6735" marker-end="url(#arr)" />
  <ns0:rect x="203.745" y="128" width="58.9345" height="160" rx="3.3677" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.6735" />
  <ns0:text x="233.0438" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Step 4</ns0:text>
  <ns0:text x="233.0438" y="211.2" text-anchor="middle" font-size="10" fill="#333">shell("npm test")</ns0:text>
  <ns0:text x="233.0438" y="248" text-anchor="middle" font-size="10" fill="#555">→ validation</ns0:text>
  <ns0:text x="233.0438" y="275.2" text-anchor="middle" font-size="10" fill="#888">all tests green</ns0:text>
  <ns0:rect x="6.7354" y="352" width="255.9441" height="264" rx="3.3677" fill="#E8EAF6" stroke="#3949AB" stroke-width="0.5052" />
  <ns0:text x="134.7074" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="#3949AB">Orchestration Strategies</ns0:text>
  <ns0:rect x="13.4707" y="428.8" width="72.4052" height="160" rx="2.6941" fill="#C5CAE9" stroke="#3949AB" />
  <ns0:text x="49.505" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Sequential</ns0:text>
  <ns0:text x="49.505" y="508.8" text-anchor="middle" font-size="10" fill="#333">each step depends</ns0:text>
  <ns0:text x="49.505" y="540.8" text-anchor="middle" font-size="10" fill="#333">on previous result</ns0:text>
  <ns0:text x="49.505" y="572.8" text-anchor="middle" font-size="10" fill="#555">e.g. read → analyze → fix</ns0:text>
  <ns0:rect x="98.6732" y="428.8" width="72.4052" height="160" rx="2.6941" fill="#C5CAE9" stroke="#3949AB" />
  <ns0:text x="134.7074" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Fan-Out / Fan-In</ns0:text>
  <ns0:text x="134.7074" y="508.8" text-anchor="middle" font-size="10" fill="#333">parallel reads,</ns0:text>
  <ns0:text x="134.7074" y="540.8" text-anchor="middle" font-size="10" fill="#333">then aggregate</ns0:text>
  <ns0:text x="134.7074" y="572.8" text-anchor="middle" font-size="10" fill="#555">e.g. read 5 files at once</ns0:text>
  <ns0:rect x="183.8756" y="428.8" width="72.4052" height="160" rx="2.6941" fill="#C5CAE9" stroke="#3949AB" />
  <ns0:text x="219.9099" y="473.6" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Conditional</ns0:text>
  <ns0:text x="219.9099" y="508.8" text-anchor="middle" font-size="10" fill="#333">branch based on</ns0:text>
  <ns0:text x="219.9099" y="540.8" text-anchor="middle" font-size="10" fill="#333">tool output</ns0:text>
  <ns0:text x="219.9099" y="572.8" text-anchor="middle" font-size="10" fill="#555">e.g. skip if tests pass</ns0:text>
</ns0:svg>
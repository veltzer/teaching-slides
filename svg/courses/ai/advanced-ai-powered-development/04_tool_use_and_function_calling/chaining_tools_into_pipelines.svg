<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.131228" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Tool Pipeline: Find and Fix All Deprecated API Calls</text>

  <rect x="40" y="90.679612" width="273.684211" height="202.718447" rx="8.710409" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.842105" y="135.728155" text-anchor="middle" font-size="21.776023" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Step 1</text>
  <text x="176.842105" y="180.776699" text-anchor="middle" font-size="17.420819" fill="var(--primary-text)" font-family="Arial, sans-serif">grep("deprecated")</text>
  <text x="176.842105" y="220.194175" text-anchor="middle" font-size="15.243216" fill="var(--primary-text)" font-family="Arial, sans-serif">→ list of files</text>
  <text x="176.842105" y="259.61165" text-anchor="middle" font-size="15.243216" fill="var(--primary-text)" font-family="Arial, sans-serif">codebase search</text>

  <line x1="318.947368" y1="192.038835" x2="350.526316" y2="192.038835" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="355.789474" y="90.679612" width="273.684211" height="202.718447" rx="8.710409" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492.631579" y="135.728155" text-anchor="middle" font-size="21.776023" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Step 2</text>
  <text x="492.631579" y="180.776699" text-anchor="middle" font-size="17.420819" fill="var(--ok-text)" font-family="Arial, sans-serif">read_file(f)</text>
  <text x="492.631579" y="220.194175" text-anchor="middle" font-size="15.243216" fill="var(--ok-text)" font-family="Arial, sans-serif">→ source code</text>
  <text x="492.631579" y="259.61165" text-anchor="middle" font-size="15.243216" fill="var(--ok-text)" font-family="Arial, sans-serif">for each match</text>

  <line x1="634.736842" y1="192.038835" x2="666.315789" y2="192.038835" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="671.578947" y="90.679612" width="273.684211" height="202.718447" rx="8.710409" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="808.421053" y="135.728155" text-anchor="middle" font-size="21.776023" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Step 3</text>
  <text x="808.421053" y="180.776699" text-anchor="middle" font-size="17.420819" fill="var(--warn-text)" font-family="Arial, sans-serif">edit_file(f)</text>
  <text x="808.421053" y="220.194175" text-anchor="middle" font-size="15.243216" fill="var(--warn-text)" font-family="Arial, sans-serif">→ patched file</text>
  <text x="808.421053" y="259.61165" text-anchor="middle" font-size="15.243216" fill="var(--warn-text)" font-family="Arial, sans-serif">apply new API</text>

  <line x1="950.526316" y1="192.038835" x2="982.105263" y2="192.038835" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="987.368421" y="90.679612" width="252.631579" height="202.718447" rx="8.710409" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1113.684211" y="135.728155" text-anchor="middle" font-size="21.776023" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Step 4</text>
  <text x="1113.684211" y="180.776699" text-anchor="middle" font-size="17.420819" fill="var(--danger-text)" font-family="Arial, sans-serif">shell("npm test")</text>
  <text x="1113.684211" y="220.194175" text-anchor="middle" font-size="15.243216" fill="var(--danger-text)" font-family="Arial, sans-serif">→ validation</text>
  <text x="1113.684211" y="259.61165" text-anchor="middle" font-size="15.243216" fill="var(--danger-text)" font-family="Arial, sans-serif">all tests green</text>

  <rect x="40" y="338.446602" width="1200" height="281.553398" rx="8.710409" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="383.495146" text-anchor="middle" font-size="23.953626" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Orchestration Strategies</text>

  <rect x="82.105263" y="417.281553" width="357.894737" height="180.194175" rx="6.532807" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="261.052632" y="456.699029" text-anchor="middle" font-size="19.598421" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Sequential</text>
  <text x="261.052632" y="501.747573" text-anchor="middle" font-size="15.243216" fill="var(--text)" font-family="Arial, sans-serif">each step depends on the</text>
  <text x="261.052632" y="527.650485" text-anchor="middle" font-size="15.243216" fill="var(--text)" font-family="Arial, sans-serif">previous result</text>
  <text x="261.052632" y="569.320388" text-anchor="middle" font-size="14.154415" fill="var(--text-muted)" font-family="Arial, sans-serif">read → analyze → fix</text>

  <rect x="461.052632" y="417.281553" width="357.894737" height="180.194175" rx="6.532807" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="456.699029" text-anchor="middle" font-size="19.598421" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Fan-Out / Fan-In</text>
  <text x="640" y="501.747573" text-anchor="middle" font-size="15.243216" fill="var(--text)" font-family="Arial, sans-serif">parallel reads, then</text>
  <text x="640" y="527.650485" text-anchor="middle" font-size="15.243216" fill="var(--text)" font-family="Arial, sans-serif">aggregate and act</text>
  <text x="640" y="569.320388" text-anchor="middle" font-size="14.154415" fill="var(--text-muted)" font-family="Arial, sans-serif">read 5 files at once</text>

  <rect x="840" y="417.281553" width="357.894737" height="180.194175" rx="6.532807" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="1018.947368" y="456.699029" text-anchor="middle" font-size="19.598421" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Conditional</text>
  <text x="1018.947368" y="501.747573" text-anchor="middle" font-size="15.243216" fill="var(--text)" font-family="Arial, sans-serif">branch based on</text>
  <text x="1018.947368" y="527.650485" text-anchor="middle" font-size="15.243216" fill="var(--text)" font-family="Arial, sans-serif">tool output</text>
  <text x="1018.947368" y="569.320388" text-anchor="middle" font-size="14.154415" fill="var(--text-muted)" font-family="Arial, sans-serif">skip if tests pass</text>
</svg>

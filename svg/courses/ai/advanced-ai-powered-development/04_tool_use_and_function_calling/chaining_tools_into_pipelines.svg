<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="42.6223" markerHeight="141.75" refX="38.3599" refY="70.875" orient="auto">
      <polygon points="0,202.5 14.9178,0" fill="#555" />
    </marker>
  </defs>
  <rect width="3409.7815" height="8100" fill="#f8f9fa" />
  <text x="1704.8908" y="708.75" text-anchor="middle" font-size="85.2445" font-weight="bold" fill="#1a237e">Tool Pipeline: "Find and Fix All Deprecated API Calls"</text>
  <rect x="85.2445" y="1620" width="703.2675" height="2025" rx="42.6223" fill="#E3F2FD" stroke="#1565C0" stroke-width="8.5244" />
  <text x="434.747" y="2227.5" text-anchor="middle" font-size="59.6711" font-weight="bold" fill="#1565C0">Step 1</text>
  <text x="434.747" y="2673" text-anchor="middle" font-size="55.4089" fill="#333">grep("deprecated")</text>
  <text x="434.747" y="3138.75" text-anchor="middle" font-size="51.1467" fill="#555">→ list of files</text>
  <text x="434.747" y="3483" text-anchor="middle" font-size="46.8845" fill="#888">codebase search</text>
  <line x1="788.512" y1="2632.5" x2="916.3788" y2="2632.5" stroke="#555" stroke-width="8.5244" marker-end="url(#arr)" />
  <rect x="916.3788" y="1620" width="703.2675" height="2025" rx="42.6223" fill="#E8F5E9" stroke="#2E7D32" stroke-width="8.5244" />
  <text x="1265.8814" y="2227.5" text-anchor="middle" font-size="59.6711" font-weight="bold" fill="#2E7D32">Step 2</text>
  <text x="1265.8814" y="2673" text-anchor="middle" font-size="55.4089" fill="#333">read_file(file)</text>
  <text x="1265.8814" y="3138.75" text-anchor="middle" font-size="51.1467" fill="#555">→ source code</text>
  <text x="1265.8814" y="3483" text-anchor="middle" font-size="46.8845" fill="#888">for each match</text>
  <line x1="1619.6461" y1="2632.5" x2="1747.513" y2="2632.5" stroke="#555" stroke-width="8.5244" marker-end="url(#arr)" />
  <rect x="1747.513" y="1620" width="703.2675" height="2025" rx="42.6223" fill="#FFF3E0" stroke="#E65100" stroke-width="8.5244" />
  <text x="2097.0155" y="2227.5" text-anchor="middle" font-size="59.6711" font-weight="bold" fill="#E65100">Step 3</text>
  <text x="2097.0155" y="2673" text-anchor="middle" font-size="55.4089" fill="#333">edit_file(file)</text>
  <text x="2097.0155" y="3138.75" text-anchor="middle" font-size="51.1467" fill="#555">→ patched file</text>
  <text x="2097.0155" y="3483" text-anchor="middle" font-size="46.8845" fill="#888">apply new API</text>
  <line x1="2450.7805" y1="2632.5" x2="2578.6473" y2="2632.5" stroke="#555" stroke-width="8.5244" marker-end="url(#arr)" />
  <rect x="2578.6473" y="1620" width="745.8897" height="2025" rx="42.6223" fill="#E8F5E9" stroke="#2E7D32" stroke-width="8.5244" />
  <text x="2949.4611" y="2227.5" text-anchor="middle" font-size="59.6711" font-weight="bold" fill="#2E7D32">Step 4</text>
  <text x="2949.4611" y="2673" text-anchor="middle" font-size="55.4089" fill="#333">shell("npm test")</text>
  <text x="2949.4611" y="3138.75" text-anchor="middle" font-size="51.1467" fill="#555">→ validation</text>
  <text x="2949.4611" y="3483" text-anchor="middle" font-size="46.8845" fill="#888">all tests green</text>
  <rect x="85.2445" y="4455" width="3239.2925" height="3341.25" rx="42.6223" fill="#E8EAF6" stroke="#3949AB" stroke-width="6.3934" />
  <text x="1704.8908" y="5062.5" text-anchor="middle" font-size="63.9333" font-weight="bold" fill="#3949AB">Orchestration Strategies</text>
  <rect x="170.489" y="5427" width="916.3788" height="2025" rx="34.0978" fill="#C5CAE9" stroke="#3949AB" />
  <text x="626.5474" y="5994" text-anchor="middle" font-size="59.6711" font-weight="bold" fill="#1a237e">Sequential</text>
  <text x="626.5474" y="6439.5" text-anchor="middle" font-size="51.1467" fill="#333">each step depends</text>
  <text x="626.5474" y="6844.5" text-anchor="middle" font-size="51.1467" fill="#333">on previous result</text>
  <text x="626.5474" y="7249.5" text-anchor="middle" font-size="46.8845" fill="#555">e.g. read → analyze → fix</text>
  <rect x="1248.8324" y="5427" width="916.3788" height="2025" rx="34.0978" fill="#C5CAE9" stroke="#3949AB" />
  <text x="1704.8908" y="5994" text-anchor="middle" font-size="59.6711" font-weight="bold" fill="#1a237e">Fan-Out / Fan-In</text>
  <text x="1704.8908" y="6439.5" text-anchor="middle" font-size="51.1467" fill="#333">parallel reads,</text>
  <text x="1704.8908" y="6844.5" text-anchor="middle" font-size="51.1467" fill="#333">then aggregate</text>
  <text x="1704.8908" y="7249.5" text-anchor="middle" font-size="46.8845" fill="#555">e.g. read 5 files at once</text>
  <rect x="2327.1758" y="5427" width="916.3788" height="2025" rx="34.0978" fill="#C5CAE9" stroke="#3949AB" />
  <text x="2783.2341" y="5994" text-anchor="middle" font-size="59.6711" font-weight="bold" fill="#1a237e">Conditional</text>
  <text x="2783.2341" y="6439.5" text-anchor="middle" font-size="51.1467" fill="#333">branch based on</text>
  <text x="2783.2341" y="6844.5" text-anchor="middle" font-size="51.1467" fill="#333">tool output</text>
  <text x="2783.2341" y="7249.5" text-anchor="middle" font-size="46.8845" fill="#555">e.g. skip if tests pass</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="85" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--primary-accent)">Tool Pipeline: Find and Fix All Deprecated API Calls</text>

  <rect x="70" y="130" width="260" height="180" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="200" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--primary-text)">Step 1</text>
  <text x="200" y="210" text-anchor="middle" font-size="16" fill="var(--primary-text)">grep("deprecated")</text>
  <text x="200" y="245" text-anchor="middle" font-size="14" fill="var(--primary-text)">→ list of files</text>
  <text x="200" y="280" text-anchor="middle" font-size="14" fill="var(--primary-text)">codebase search</text>

  <line x1="335" y1="220" x2="365" y2="220" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="370" y="130" width="260" height="180" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="500" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ok-text)">Step 2</text>
  <text x="500" y="210" text-anchor="middle" font-size="16" fill="var(--ok-text)">read_file(f)</text>
  <text x="500" y="245" text-anchor="middle" font-size="14" fill="var(--ok-text)">→ source code</text>
  <text x="500" y="280" text-anchor="middle" font-size="14" fill="var(--ok-text)">for each match</text>

  <line x1="635" y1="220" x2="665" y2="220" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="670" y="130" width="260" height="180" rx="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="800" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--warn-text)">Step 3</text>
  <text x="800" y="210" text-anchor="middle" font-size="16" fill="var(--warn-text)">edit_file(f)</text>
  <text x="800" y="245" text-anchor="middle" font-size="14" fill="var(--warn-text)">→ patched file</text>
  <text x="800" y="280" text-anchor="middle" font-size="14" fill="var(--warn-text)">apply new API</text>

  <line x1="935" y1="220" x2="965" y2="220" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="970" y="130" width="240" height="180" rx="8" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1090" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--danger-text)">Step 4</text>
  <text x="1090" y="210" text-anchor="middle" font-size="16" fill="var(--danger-text)">shell("npm test")</text>
  <text x="1090" y="245" text-anchor="middle" font-size="14" fill="var(--danger-text)">→ validation</text>
  <text x="1090" y="280" text-anchor="middle" font-size="14" fill="var(--danger-text)">all tests green</text>

  <rect x="70" y="350" width="1140" height="250" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="390" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--info-text)">Orchestration Strategies</text>

  <rect x="110" y="420" width="340" height="160" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="280" y="455" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-accent)">Sequential</text>
  <text x="280" y="495" text-anchor="middle" font-size="14" fill="var(--text)">each step depends on the</text>
  <text x="280" y="518" text-anchor="middle" font-size="14" fill="var(--text)">previous result</text>
  <text x="280" y="555" text-anchor="middle" font-size="13" fill="var(--text-muted)">read → analyze → fix</text>

  <rect x="470" y="420" width="340" height="160" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="455" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--ok-accent)">Fan-Out / Fan-In</text>
  <text x="640" y="495" text-anchor="middle" font-size="14" fill="var(--text)">parallel reads, then</text>
  <text x="640" y="518" text-anchor="middle" font-size="14" fill="var(--text)">aggregate and act</text>
  <text x="640" y="555" text-anchor="middle" font-size="13" fill="var(--text-muted)">read 5 files at once</text>

  <rect x="830" y="420" width="340" height="160" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="1000" y="455" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--warn-accent)">Conditional</text>
  <text x="1000" y="495" text-anchor="middle" font-size="14" fill="var(--text)">branch based on</text>
  <text x="1000" y="518" text-anchor="middle" font-size="14" fill="var(--text)">tool output</text>
  <text x="1000" y="555" text-anchor="middle" font-size="13" fill="var(--text-muted)">skip if tests pass</text>
</svg>

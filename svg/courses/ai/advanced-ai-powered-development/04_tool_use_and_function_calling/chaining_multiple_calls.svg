<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="685.9038" height="640" fill="var(--surface)" rx="6"/>
  <text x="342.9519" y="56" text-anchor="middle" font-size="17.1476" font-weight="bold" fill="var(--primary-accent)">Tool Use: Chaining Multiple Calls</text>
  <text x="342.9519" y="91.2" text-anchor="middle" font-size="11.1459" fill="var(--text-muted)">User: "Refactor the auth module and run the tests"</text>
  <rect x="25.7214" y="120" width="634.461" height="60.8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="41.1542" y="158.4" font-size="11.1459" fill="var(--ok-accent)" font-weight="bold">→ tool_use:</text>
  <text x="132.8938" y="158.4" font-size="11.1459" fill="var(--text)">read_file("src/auth.ts")</text>
  <rect x="25.7214" y="190.4" width="634.461" height="60.8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="41.1542" y="228.8" font-size="11.1459" fill="var(--warn-accent)" font-weight="bold">← tool_result:</text>
  <text x="150.0415" y="228.8" font-size="11.1459" fill="var(--text-muted)">&lt;file contents: 240 lines of TypeScript&gt;</text>
  <rect x="25.7214" y="260.8" width="634.461" height="60.8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="41.1542" y="299.2" font-size="11.1459" fill="var(--ok-accent)" font-weight="bold">→ tool_use:</text>
  <text x="132.8938" y="299.2" font-size="11.1459" fill="var(--text)">edit_file("src/auth.ts", old_pattern, new_pattern)</text>
  <rect x="25.7214" y="331.2" width="634.461" height="60.8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="41.1542" y="369.6" font-size="11.1459" fill="var(--warn-accent)" font-weight="bold">← tool_result:</text>
  <text x="150.0415" y="369.6" font-size="11.1459" fill="var(--text-muted)">success — 3 replacements made</text>
  <rect x="25.7214" y="401.6" width="634.461" height="60.8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="41.1542" y="440" font-size="11.1459" fill="var(--ok-accent)" font-weight="bold">→ tool_use:</text>
  <text x="132.8938" y="440" font-size="11.1459" fill="var(--text)">shell("npm test")</text>
  <rect x="25.7214" y="472" width="634.461" height="60.8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="41.1542" y="510.4" font-size="11.1459" fill="var(--warn-accent)" font-weight="bold">← tool_result:</text>
  <text x="150.0415" y="510.4" font-size="11.1459" fill="var(--text-muted)">All 42 tests passed</text>
  <rect x="25.7214" y="544" width="634.461" height="60.8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="41.1542" y="582.4" font-size="11.1459" fill="var(--primary-accent)" font-weight="bold">Assistant:</text>
  <text x="126.8922" y="582.4" font-size="11.1459" fill="var(--text)">"Done. Refactored auth module — all 42 tests pass."</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="1200" height="70" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">User: "Refactor the auth module and run the tests"</text>
  <text x="640" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Model plans a sequence of tool calls, each informed by the previous result.</text>

  <rect x="40" y="130" width="1200" height="68" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="162" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">→ tool_use (1):</text>
  <text x="220" y="162" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">read_file("src/auth.ts")</text>
  <text x="60" y="187" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Model needs to see current code before proposing a rewrite.</text>

  <rect x="40" y="210" width="1200" height="68" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="242" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">← tool_result:</text>
  <text x="200" y="242" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">240 lines of TypeScript returned</text>
  <text x="60" y="267" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Result becomes part of the next prompt — now the model can reason concretely.</text>

  <rect x="40" y="290" width="1200" height="68" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="322" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">→ tool_use (2):</text>
  <text x="220" y="322" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">edit_file("src/auth.ts", old, new)</text>
  <text x="60" y="347" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Model proposes a structured edit — harness applies it and returns status.</text>

  <rect x="40" y="370" width="1200" height="68" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="402" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">← tool_result:</text>
  <text x="200" y="402" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">success — 3 replacements made</text>
  <text x="60" y="427" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">On failure the model would revise the pattern and retry.</text>

  <rect x="40" y="450" width="1200" height="68" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="482" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">→ tool_use (3):</text>
  <text x="220" y="482" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">shell("npm test")</text>
  <text x="60" y="507" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Verification step — the plan is not "done" until tests pass.</text>

  <rect x="40" y="530" width="1200" height="68" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="562" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">← tool_result:</text>
  <text x="200" y="562" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">all 42 tests passed</text>
  <text x="60" y="587" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Model now has evidence the change is safe to report back.</text>

  <rect x="40" y="608" width="1200" height="12" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
</svg>

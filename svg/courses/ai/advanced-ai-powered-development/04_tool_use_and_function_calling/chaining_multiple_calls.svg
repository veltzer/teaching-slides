<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="71.228070175439" rx="8.069870322226" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85.789473684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--info-text)">User: Refactor auth, run tests</text>

  <rect x="40" y="131.578947368421" width="1200" height="61.052631578947" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="170.245614035088" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--ok-text)">-&gt; tool_use:</text>
  <text x="220" y="170.245614035088" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--ok-text)">read_file("src/auth.ts")</text>

  <rect x="40" y="207.894736842105" width="1200" height="61.052631578947" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="246.561403508772" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--warn-text)">&lt;- result:</text>
  <text x="200" y="246.561403508772" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--warn-text)">240 lines returned</text>

  <rect x="40" y="284.210526315789" width="1200" height="61.052631578947" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="322.877192982456" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--ok-text)">-&gt; tool_use:</text>
  <text x="220" y="322.877192982456" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--ok-text)">edit_file(old, new)</text>

  <rect x="40" y="360.526315789474" width="1200" height="61.052631578947" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="399.19298245614" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--warn-text)">&lt;- result:</text>
  <text x="200" y="399.19298245614" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--warn-text)">3 replacements made</text>

  <rect x="40" y="436.842105263158" width="1200" height="61.052631578947" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="475.508771929825" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--ok-text)">-&gt; tool_use:</text>
  <text x="220" y="475.508771929825" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--ok-text)">shell("npm test")</text>

  <rect x="40" y="513.157894736842" width="1200" height="61.052631578947" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="551.824561403509" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--warn-text)">&lt;- result:</text>
  <text x="200" y="551.824561403509" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--warn-text)">42 tests passed</text>

  <rect x="40" y="589.473684210526" width="1200" height="30.526315789474" rx="8.069870322226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="611.859649122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--primary-text)">Each result feeds the next call</text>
</svg>

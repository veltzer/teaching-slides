<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="71.9188" height="640" fill="var(--surface)" rx="6"/>
  <text x="35.9594" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Why LLMs Need Tools</text>
  <rect x="1.798" y="112" width="31.4645" height="224" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="17.5302" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Without Tools</text>
  <text x="3.5959" y="204.8" font-size="10" fill="var(--text)">▶ Generates text only</text>
  <text x="3.5959" y="240" font-size="10" fill="var(--text)">▶ Cannot read files or run code</text>
  <text x="3.5959" y="275.2" font-size="10" fill="var(--text)">▶ No access to live data</text>
  <text x="3.5959" y="310.4" font-size="10" fill="var(--text)">▶ Stateless, no external actions</text>
  <rect x="38.6563" y="112" width="31.4645" height="224" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="54.3886" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">With Tools</text>
  <text x="40.4543" y="204.8" font-size="10" fill="var(--text)">▶ Reads and edits files</text>
  <text x="40.4543" y="240" font-size="10" fill="var(--text)">▶ Executes shell commands</text>
  <text x="40.4543" y="275.2" font-size="10" fill="var(--text)">▶ Queries databases and APIs</text>
  <text x="40.4543" y="310.4" font-size="10" fill="var(--text)">▶ Acts autonomously on the world</text>
  <text x="35.9594" y="236.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">→</text>
  <rect x="1.798" y="400" width="68.3229" height="208" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="35.9594" y="444.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Tool-Use Round-Trip</text>
  <rect x="3.5959" y="472" width="11.6868" height="104" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="9.4393" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">User Prompt</text>
  <text x="9.4393" y="547.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">task description</text>
  <text x="9.4393" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">+ context</text>
  <line x1="15.2827" y1="523.2" x2="18.4292" y2="523.2" stroke="var(--text)" stroke-width="0.1798" marker-end="url(#arrow)" />
  <rect x="18.4292" y="472" width="11.6868" height="104" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="24.2726" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">LLM Decides</text>
  <text x="24.2726" y="547.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">which tool</text>
  <text x="24.2726" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">+ arguments</text>
  <line x1="30.116" y1="523.2" x2="33.2624" y2="523.2" stroke="var(--text)" stroke-width="0.1798" marker-end="url(#arrow)" />
  <rect x="33.2624" y="472" width="11.6868" height="104" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="39.1058" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Execute Tool</text>
  <text x="39.1058" y="547.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">your code runs</text>
  <text x="39.1058" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">the function</text>
  <line x1="44.9492" y1="523.2" x2="48.0957" y2="523.2" stroke="var(--text)" stroke-width="0.1798" marker-end="url(#arrow)" />
  <rect x="48.0957" y="472" width="11.6868" height="104" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="53.9391" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Return Result</text>
  <text x="53.9391" y="547.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">structured data</text>
  <text x="53.9391" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">back to LLM</text>
  <line x1="59.7825" y1="523.2" x2="62.9289" y2="523.2" stroke="var(--text)" stroke-width="0.1798" marker-end="url(#arrow)" />
  <rect x="62.9289" y="472" width="6.2929" height="104" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="66.0754" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Reason</text>
  <text x="66.0754" y="547.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">next</text>
  <text x="66.0754" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">step</text>
</svg>
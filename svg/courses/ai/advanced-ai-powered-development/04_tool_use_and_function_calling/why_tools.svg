<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="45.511" markerHeight="567" refX="45.511" refY="283.5" orient="auto">
      <polygon points="0,810 15.929,0" fill="#333" />
    </marker>
  </defs>
  <rect width="3640.889" height="32400" fill="#f8f9fa" />
  <text x="1820.4444" y="3078" text-anchor="middle" font-size="95.5733" font-weight="bold" fill="#1a237e">Why LLMs Need Tools</text>
  <rect x="91.0223" y="5670" width="1592.889" height="11340" rx="45.511" fill="#FCE4EC" stroke="#C62828" stroke-width="9.1023" />
  <text x="887.4667" y="8100" text-anchor="middle" font-size="68.2667" font-weight="bold" fill="#C62828">Without Tools</text>
  <text x="182.0444" y="10368" font-size="59.1644" fill="#333">▶ Generates text only</text>
  <text x="182.0444" y="12150" font-size="59.1644" fill="#333">▶ Cannot read files or run code</text>
  <text x="182.0444" y="13932" font-size="59.1644" fill="#333">▶ No access to live data</text>
  <text x="182.0444" y="15714" font-size="59.1644" fill="#333">▶ Stateless, no external actions</text>
  <rect x="1956.9777" y="5670" width="1592.889" height="11340" rx="45.511" fill="#E8F5E9" stroke="#2E7D32" stroke-width="9.1023" />
  <text x="2753.4223" y="8100" text-anchor="middle" font-size="68.2667" font-weight="bold" fill="#2E7D32">With Tools</text>
  <text x="2048" y="10368" font-size="59.1644" fill="#333">▶ Reads and edits files</text>
  <text x="2048" y="12150" font-size="59.1644" fill="#333">▶ Executes shell commands</text>
  <text x="2048" y="13932" font-size="59.1644" fill="#333">▶ Queries databases and APIs</text>
  <text x="2048" y="15714" font-size="59.1644" fill="#333">▶ Acts autonomously on the world</text>
  <text x="1820.4444" y="11988" text-anchor="middle" font-size="91.0223" font-weight="bold" fill="#333">→</text>
  <rect x="91.0223" y="20250" width="3458.8444" height="10530" rx="45.511" fill="#E8EAF6" stroke="#3949AB" stroke-width="6.8267" />
  <text x="1820.4444" y="22518" text-anchor="middle" font-size="68.2667" font-weight="bold" fill="#3949AB">Tool-Use Round-Trip</text>
  <rect x="182.0444" y="23895" width="591.6444" height="5265" rx="36.409" fill="#E3F2FD" stroke="#1565C0" stroke-width="6.8267" />
  <text x="477.8667" y="26082" text-anchor="middle" font-size="59.1644" font-weight="bold" fill="#1565C0">User Prompt</text>
  <text x="477.8667" y="27702" text-anchor="middle" font-size="50.0623" fill="#555">task description</text>
  <text x="477.8667" y="28998" text-anchor="middle" font-size="50.0623" fill="#555">+ context</text>
  <line x1="773.689" y1="26487" x2="932.9777" y2="26487" stroke="#333" stroke-width="9.1023" marker-end="url(#arrow)" />
  <rect x="932.9777" y="23895" width="591.6444" height="5265" rx="36.409" fill="#FFF3E0" stroke="#E65100" stroke-width="6.8267" />
  <text x="1228.8" y="26082" text-anchor="middle" font-size="59.1644" font-weight="bold" fill="#E65100">LLM Decides</text>
  <text x="1228.8" y="27702" text-anchor="middle" font-size="50.0623" fill="#555">which tool</text>
  <text x="1228.8" y="28998" text-anchor="middle" font-size="50.0623" fill="#555">+ arguments</text>
  <line x1="1524.6223" y1="26487" x2="1683.911" y2="26487" stroke="#333" stroke-width="9.1023" marker-end="url(#arrow)" />
  <rect x="1683.911" y="23895" width="591.6444" height="5265" rx="36.409" fill="#E8F5E9" stroke="#2E7D32" stroke-width="6.8267" />
  <text x="1979.7333" y="26082" text-anchor="middle" font-size="59.1644" font-weight="bold" fill="#2E7D32">Execute Tool</text>
  <text x="1979.7333" y="27702" text-anchor="middle" font-size="50.0623" fill="#555">your code runs</text>
  <text x="1979.7333" y="28998" text-anchor="middle" font-size="50.0623" fill="#555">the function</text>
  <line x1="2275.5556" y1="26487" x2="2434.8444" y2="26487" stroke="#333" stroke-width="9.1023" marker-end="url(#arrow)" />
  <rect x="2434.8444" y="23895" width="591.6444" height="5265" rx="36.409" fill="#FCE4EC" stroke="#C62828" stroke-width="6.8267" />
  <text x="2730.6667" y="26082" text-anchor="middle" font-size="59.1644" font-weight="bold" fill="#C62828">Return Result</text>
  <text x="2730.6667" y="27702" text-anchor="middle" font-size="50.0623" fill="#555">structured data</text>
  <text x="2730.6667" y="28998" text-anchor="middle" font-size="50.0623" fill="#555">back to LLM</text>
  <line x1="3026.489" y1="26487" x2="3185.7777" y2="26487" stroke="#333" stroke-width="9.1023" marker-end="url(#arrow)" />
  <rect x="3185.7777" y="23895" width="318.5777" height="5265" rx="36.409" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="6.8267" />
  <text x="3345.0667" y="26082" text-anchor="middle" font-size="59.1644" font-weight="bold" fill="#6A1B9A">Reason</text>
  <text x="3345.0667" y="27702" text-anchor="middle" font-size="50.0623" fill="#555">next</text>
  <text x="3345.0667" y="28998" text-anchor="middle" font-size="50.0623" fill="#555">step</text>
</svg>
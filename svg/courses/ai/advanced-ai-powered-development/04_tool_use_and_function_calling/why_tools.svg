<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="71.9188" height="640" fill="var(--surface-light)" />
  <text x="35.9594" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Why LLMs Need Tools</text>
  <rect x="1.798" y="112" width="31.4645" height="224" rx="0.899" fill="var(--danger-pale3)" stroke="var(--danger-dk)" stroke-width="0.1798" />
  <text x="17.5302" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-dk)">Without Tools</text>
  <text x="3.5959" y="204.8" font-size="10" fill="var(--text-dark)">▶ Generates text only</text>
  <text x="3.5959" y="240" font-size="10" fill="var(--text-dark)">▶ Cannot read files or run code</text>
  <text x="3.5959" y="275.2" font-size="10" fill="var(--text-dark)">▶ No access to live data</text>
  <text x="3.5959" y="310.4" font-size="10" fill="var(--text-dark)">▶ Stateless, no external actions</text>
  <rect x="38.6563" y="112" width="31.4645" height="224" rx="0.899" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="0.1798" />
  <text x="54.3886" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-dk)">With Tools</text>
  <text x="40.4543" y="204.8" font-size="10" fill="var(--text-dark)">▶ Reads and edits files</text>
  <text x="40.4543" y="240" font-size="10" fill="var(--text-dark)">▶ Executes shell commands</text>
  <text x="40.4543" y="275.2" font-size="10" fill="var(--text-dark)">▶ Queries databases and APIs</text>
  <text x="40.4543" y="310.4" font-size="10" fill="var(--text-dark)">▶ Acts autonomously on the world</text>
  <text x="35.9594" y="236.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text-dark)">→</text>
  <rect x="1.798" y="400" width="68.3229" height="208" rx="0.899" fill="var(--info-indigo-lt)" stroke="var(--primary-indigo)" stroke-width="0.1348" />
  <text x="35.9594" y="444.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-indigo)">Tool-Use Round-Trip</text>
  <rect x="3.5959" y="472" width="11.6868" height="104" rx="0.7192" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="0.1348" />
  <text x="9.4393" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-dk)">User Prompt</text>
  <text x="9.4393" y="547.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">task description</text>
  <text x="9.4393" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">+ context</text>
  <line x1="15.2827" y1="523.2" x2="18.4292" y2="523.2" stroke="var(--text-dark)" stroke-width="0.1798" marker-end="url(#arrow)" />
  <rect x="18.4292" y="472" width="11.6868" height="104" rx="0.7192" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="0.1348" />
  <text x="24.2726" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-dk)">LLM Decides</text>
  <text x="24.2726" y="547.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">which tool</text>
  <text x="24.2726" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">+ arguments</text>
  <line x1="30.116" y1="523.2" x2="33.2624" y2="523.2" stroke="var(--text-dark)" stroke-width="0.1798" marker-end="url(#arrow)" />
  <rect x="33.2624" y="472" width="11.6868" height="104" rx="0.7192" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="0.1348" />
  <text x="39.1058" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-dk)">Execute Tool</text>
  <text x="39.1058" y="547.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">your code runs</text>
  <text x="39.1058" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">the function</text>
  <line x1="44.9492" y1="523.2" x2="48.0957" y2="523.2" stroke="var(--text-dark)" stroke-width="0.1798" marker-end="url(#arrow)" />
  <rect x="48.0957" y="472" width="11.6868" height="104" rx="0.7192" fill="var(--danger-pale3)" stroke="var(--danger-dk)" stroke-width="0.1348" />
  <text x="53.9391" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-dk)">Return Result</text>
  <text x="53.9391" y="547.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">structured data</text>
  <text x="53.9391" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">back to LLM</text>
  <line x1="59.7825" y1="523.2" x2="62.9289" y2="523.2" stroke="var(--text-dark)" stroke-width="0.1798" marker-end="url(#arrow)" />
  <rect x="62.9289" y="472" width="6.2929" height="104" rx="0.7192" fill="var(--info-pale)" stroke="var(--info-dk)" stroke-width="0.1348" />
  <text x="66.0754" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-dk)">Reason</text>
  <text x="66.0754" y="547.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">next</text>
  <text x="66.0754" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">step</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="45.511" markerHeight="567" refX="45.511" refY="283.5" orient="auto">
      <ns0:polygon points="0,810 15.929,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="71.9188" height="640" fill="#f8f9fa" />
  <ns0:text x="35.9594" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Why LLMs Need Tools</ns0:text>
  <ns0:rect x="1.798" y="112" width="31.4645" height="224" rx="0.899" fill="#FCE4EC" stroke="#C62828" stroke-width="0.1798" />
  <ns0:text x="17.5302" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Without Tools</ns0:text>
  <ns0:text x="3.5959" y="204.8" font-size="10" fill="#333">▶ Generates text only</ns0:text>
  <ns0:text x="3.5959" y="240" font-size="10" fill="#333">▶ Cannot read files or run code</ns0:text>
  <ns0:text x="3.5959" y="275.2" font-size="10" fill="#333">▶ No access to live data</ns0:text>
  <ns0:text x="3.5959" y="310.4" font-size="10" fill="#333">▶ Stateless, no external actions</ns0:text>
  <ns0:rect x="38.6563" y="112" width="31.4645" height="224" rx="0.899" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.1798" />
  <ns0:text x="54.3886" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">With Tools</ns0:text>
  <ns0:text x="40.4543" y="204.8" font-size="10" fill="#333">▶ Reads and edits files</ns0:text>
  <ns0:text x="40.4543" y="240" font-size="10" fill="#333">▶ Executes shell commands</ns0:text>
  <ns0:text x="40.4543" y="275.2" font-size="10" fill="#333">▶ Queries databases and APIs</ns0:text>
  <ns0:text x="40.4543" y="310.4" font-size="10" fill="#333">▶ Acts autonomously on the world</ns0:text>
  <ns0:text x="35.9594" y="236.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">→</ns0:text>
  <ns0:rect x="1.798" y="400" width="68.3229" height="208" rx="0.899" fill="#E8EAF6" stroke="#3949AB" stroke-width="0.1348" />
  <ns0:text x="35.9594" y="444.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#3949AB">Tool-Use Round-Trip</ns0:text>
  <ns0:rect x="3.5959" y="472" width="11.6868" height="104" rx="0.7192" fill="#E3F2FD" stroke="#1565C0" stroke-width="0.1348" />
  <ns0:text x="9.4393" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">User Prompt</ns0:text>
  <ns0:text x="9.4393" y="547.2" text-anchor="middle" font-size="10" fill="#555">task description</ns0:text>
  <ns0:text x="9.4393" y="572.8" text-anchor="middle" font-size="10" fill="#555">+ context</ns0:text>
  <ns0:line x1="15.2827" y1="523.2" x2="18.4292" y2="523.2" stroke="#333" stroke-width="0.1798" marker-end="url(#arrow)" />
  <ns0:rect x="18.4292" y="472" width="11.6868" height="104" rx="0.7192" fill="#FFF3E0" stroke="#E65100" stroke-width="0.1348" />
  <ns0:text x="24.2726" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">LLM Decides</ns0:text>
  <ns0:text x="24.2726" y="547.2" text-anchor="middle" font-size="10" fill="#555">which tool</ns0:text>
  <ns0:text x="24.2726" y="572.8" text-anchor="middle" font-size="10" fill="#555">+ arguments</ns0:text>
  <ns0:line x1="30.116" y1="523.2" x2="33.2624" y2="523.2" stroke="#333" stroke-width="0.1798" marker-end="url(#arrow)" />
  <ns0:rect x="33.2624" y="472" width="11.6868" height="104" rx="0.7192" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.1348" />
  <ns0:text x="39.1058" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Execute Tool</ns0:text>
  <ns0:text x="39.1058" y="547.2" text-anchor="middle" font-size="10" fill="#555">your code runs</ns0:text>
  <ns0:text x="39.1058" y="572.8" text-anchor="middle" font-size="10" fill="#555">the function</ns0:text>
  <ns0:line x1="44.9492" y1="523.2" x2="48.0957" y2="523.2" stroke="#333" stroke-width="0.1798" marker-end="url(#arrow)" />
  <ns0:rect x="48.0957" y="472" width="11.6868" height="104" rx="0.7192" fill="#FCE4EC" stroke="#C62828" stroke-width="0.1348" />
  <ns0:text x="53.9391" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Return Result</ns0:text>
  <ns0:text x="53.9391" y="547.2" text-anchor="middle" font-size="10" fill="#555">structured data</ns0:text>
  <ns0:text x="53.9391" y="572.8" text-anchor="middle" font-size="10" fill="#555">back to LLM</ns0:text>
  <ns0:line x1="59.7825" y1="523.2" x2="62.9289" y2="523.2" stroke="#333" stroke-width="0.1798" marker-end="url(#arrow)" />
  <ns0:rect x="62.9289" y="472" width="6.2929" height="104" rx="0.7192" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="0.1348" />
  <ns0:text x="66.0754" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="#6A1B9A">Reason</ns0:text>
  <ns0:text x="66.0754" y="547.2" text-anchor="middle" font-size="10" fill="#555">next</ns0:text>
  <ns0:text x="66.0754" y="572.8" text-anchor="middle" font-size="10" fill="#555">step</ns0:text>
</ns0:svg>
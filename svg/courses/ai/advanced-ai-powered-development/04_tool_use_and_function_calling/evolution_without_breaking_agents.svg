  <rect width="5242.88" height="25600" fill="#f8f9fa" />
  <text x="2621.44" y="2432" text-anchor="middle" font-size="137.6256" font-weight="bold" fill="#1a237e">Tool Versioning: Evolution Without Breaking Agents</text>
  <rect x="196.608" y="5440" width="1015.808" height="7040" rx="65.536" fill="#E3F2FD" stroke="#1565C0" stroke-width="13.1072" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="65.536" markerHeight="448" refX="58.9824" refY="224" orient="auto">
      <polygon points="0,640 22.9376,0" fill="#333" />
    </marker>
  </defs>
  <rect width="131.072" height="640" fill="var(--surface-light)" />
  <text x="65.536" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Tool Versioning: Evolution Without Breaking Agents</text>
  <rect x="4.9152" y="136" width="25.3952" height="176" rx="1.6384" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="0.3277" />
  <text x="17.5309" y="184" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-dk)">v1.0</text>
  <text x="17.5309" y="224" text-anchor="middle" font-size="10" fill="var(--text-dark)">Initial release</text>
  <text x="17.5309" y="256" text-anchor="middle" font-size="10" fill="var(--text-muted)">required: pattern</text>
  <text x="17.5309" y="288" text-anchor="middle" font-size="10" fill="var(--ok-light)">stable API</text>
  <line x1="30.3104" y1="224" x2="36.0448" y2="224" stroke="var(--text-dark)" stroke-width="0.3277" marker-end="url(#arr)" />
  <rect x="36.0448" y="136" width="25.3952" height="176" rx="1.6384" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="0.3277" />
  <text x="48.6605" y="184" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-dk)">v1.1</text>
  <text x="48.6605" y="224" text-anchor="middle" font-size="10" fill="var(--text-dark)">Add optional params</text>
  <text x="48.6605" y="256" text-anchor="middle" font-size="10" fill="var(--text-muted)">+ max_results</text>
  <text x="48.6605" y="288" text-anchor="middle" font-size="10" fill="var(--ok-light)">backward-compat</text>
  <line x1="61.44" y1="224" x2="67.1744" y2="224" stroke="var(--text-dark)" stroke-width="0.3277" marker-end="url(#arr)" />
  <rect x="67.1744" y="136" width="25.3952" height="176" rx="1.6384" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="0.3277" />
  <text x="79.7901" y="184" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-dk)">v2.0</text>
  <text x="79.7901" y="224" text-anchor="middle" font-size="10" fill="var(--text-dark)">Breaking change</text>
  <text x="79.7901" y="256" text-anchor="middle" font-size="10" fill="var(--danger-dk)">rename required</text>
  <text x="79.7901" y="288" text-anchor="middle" font-size="10" fill="var(--text-muted)">param</text>
  <line x1="92.5696" y1="224" x2="98.304" y2="224" stroke="var(--text-dark)" stroke-width="0.3277" marker-end="url(#arr)" />
  <rect x="98.304" y="136" width="28.672" height="176" rx="1.6384" fill="var(--danger-pale3)" stroke="var(--danger-dk)" stroke-width="0.3277" />
  <text x="112.5581" y="184" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-dk)">Deprecate</text>
  <text x="112.5581" y="224" text-anchor="middle" font-size="10" fill="var(--text-dark)">v1.x sunset</text>
  <text x="112.5581" y="256" text-anchor="middle" font-size="10" fill="var(--text-muted)">warn in description</text>
  <text x="112.5581" y="288" text-anchor="middle" font-size="10" fill="var(--text-muted)">track usage</text>
  <rect x="4.9152" y="384" width="121.2416" height="232" rx="1.6384" fill="var(--info-indigo-lt)" stroke="var(--primary-indigo)" stroke-width="0.2458" />
  <text x="65.536" y="428.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-indigo)">Versioning Rules for Tool Authors</text>
  <text x="8.192" y="472" font-size="10" fill="var(--text-dark)">▶ Never remove or rename required parameters — always add optional ones</text>
  <text x="8.192" y="508.8" font-size="10" fill="var(--text-dark)">▶ Use semantic versioning: MAJOR.MINOR.PATCH</text>
  <text x="8.192" y="545.6" font-size="10" fill="var(--text-dark)">▶ Mark deprecated tools in description: "[DEPRECATED: use search_code_v2]"</text>
  <text x="8.192" y="582.4" font-size="10" fill="var(--text-dark)">▶ Monitor tool call success rates and latency after every update</text>
  <text x="8.192" y="608" font-size="10" fill="var(--text-mid)">▶ Support multiple versions concurrently during migration periods</text>
</svg>
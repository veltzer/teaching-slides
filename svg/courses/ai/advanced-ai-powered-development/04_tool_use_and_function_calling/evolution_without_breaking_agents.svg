<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,640 22.9376,0" fill="#333" />
    </marker>
  </defs>
  <rect width="118.784" height="580" fill="var(--surface)" rx="6" x="580.608" y="40"/>
  <text x="640" y="95.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Tool Versioning: Evolution Without Breaking Agents</text>
  <rect x="585.0624" y="163.25" width="23.0144" height="159.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="596.4954" y="206.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">v1.0</text>
  <text x="596.4954" y="243" text-anchor="middle" font-size="10" fill="var(--text)">Initial release</text>
  <text x="596.4954" y="272" text-anchor="middle" font-size="10" fill="var(--text-muted)">required: pattern</text>
  <text x="596.4954" y="301" text-anchor="middle" font-size="10" fill="var(--ok-accent)">stable API</text>
  <line x1="608.0768" y1="243" x2="613.2736" y2="243" stroke="var(--text)" stroke-width="0.3277" marker-end="url(#arr)" />
  <rect x="613.2736" y="163.25" width="23.0144" height="159.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="624.7066" y="206.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">v1.1</text>
  <text x="624.7066" y="243" text-anchor="middle" font-size="10" fill="var(--text)">Add optional params</text>
  <text x="624.7066" y="272" text-anchor="middle" font-size="10" fill="var(--text-muted)">+ max_results</text>
  <text x="624.7066" y="301" text-anchor="middle" font-size="10" fill="var(--ok-accent)">backward-compat</text>
  <line x1="636.288" y1="243" x2="641.4848" y2="243" stroke="var(--text)" stroke-width="0.3277" marker-end="url(#arr)" />
  <rect x="641.4848" y="163.25" width="23.0144" height="159.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="652.9178" y="206.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">v2.0</text>
  <text x="652.9178" y="243" text-anchor="middle" font-size="10" fill="var(--text)">Breaking change</text>
  <text x="652.9178" y="272" text-anchor="middle" font-size="10" fill="var(--danger-accent)">rename required</text>
  <text x="652.9178" y="301" text-anchor="middle" font-size="10" fill="var(--text-muted)">param</text>
  <line x1="664.4992" y1="243" x2="669.696" y2="243" stroke="var(--text)" stroke-width="0.3277" marker-end="url(#arr)" />
  <rect x="669.696" y="163.25" width="25.984" height="159.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="682.6138" y="206.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Deprecate</text>
  <text x="682.6138" y="243" text-anchor="middle" font-size="10" fill="var(--text)">v1.x sunset</text>
  <text x="682.6138" y="272" text-anchor="middle" font-size="10" fill="var(--text-muted)">warn in description</text>
  <text x="682.6138" y="301" text-anchor="middle" font-size="10" fill="var(--text-muted)">track usage</text>
  <rect x="585.0624" y="388" width="109.8752" height="210.25" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="428.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Versioning Rules for Tool Authors</text>
  <text x="588.032" y="467.75" font-size="10" fill="var(--text)">▶ Never remove or rename required parameters — always add optional ones</text>
  <text x="588.032" y="501.1" font-size="10" fill="var(--text)">▶ Use semantic versioning: MAJOR.MINOR.PATCH</text>
  <text x="588.032" y="534.45" font-size="10" fill="var(--text)">▶ Mark deprecated tools in description: "[DEPRECATED: use search_code_v2]"</text>
  <text x="588.032" y="567.8" font-size="10" fill="var(--text)">▶ Monitor tool call success rates and latency after every update</text>
  <text x="588.032" y="591" font-size="10" fill="var(--text-muted)">▶ Support multiple versions concurrently during migration periods</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:marker id="arr" markerWidth="1.6384" markerHeight="11.2" refX="1.4746" refY="5.6" orient="auto">
      <ns0:polygon points="0,16 0.5734,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="131.072" height="640" fill="#f8f9fa" />
  <ns0:text x="65.536" y="60.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Tool Versioning: Evolution Without Breaking Agents</ns0:text>
  <ns0:rect x="4.9152" y="136" width="25.3952" height="176" rx="1.6384" fill="#E3F2FD" stroke="#1565C0" stroke-width="0.3277" />
  <ns0:text x="17.5309" y="184" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">v1.0</ns0:text>
  <ns0:text x="17.5309" y="224" text-anchor="middle" font-size="10" fill="#333">Initial release</ns0:text>
  <ns0:text x="17.5309" y="256" text-anchor="middle" font-size="10" fill="#555">required: pattern</ns0:text>
  <ns0:text x="17.5309" y="288" text-anchor="middle" font-size="10" fill="#4CAF50">stable API</ns0:text>
  <ns0:line x1="30.3104" y1="224" x2="36.0448" y2="224" stroke="#333" stroke-width="0.3277" marker-end="url(#arr)" />
  <ns0:rect x="36.0448" y="136" width="25.3952" height="176" rx="1.6384" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.3277" />
  <ns0:text x="48.6605" y="184" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">v1.1</ns0:text>
  <ns0:text x="48.6605" y="224" text-anchor="middle" font-size="10" fill="#333">Add optional params</ns0:text>
  <ns0:text x="48.6605" y="256" text-anchor="middle" font-size="10" fill="#555">+ max_results</ns0:text>
  <ns0:text x="48.6605" y="288" text-anchor="middle" font-size="10" fill="#4CAF50">backward-compat</ns0:text>
  <ns0:line x1="61.44" y1="224" x2="67.1744" y2="224" stroke="#333" stroke-width="0.3277" marker-end="url(#arr)" />
  <ns0:rect x="67.1744" y="136" width="25.3952" height="176" rx="1.6384" fill="#FFF3E0" stroke="#E65100" stroke-width="0.3277" />
  <ns0:text x="79.7901" y="184" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">v2.0</ns0:text>
  <ns0:text x="79.7901" y="224" text-anchor="middle" font-size="10" fill="#333">Breaking change</ns0:text>
  <ns0:text x="79.7901" y="256" text-anchor="middle" font-size="10" fill="#C62828">rename required</ns0:text>
  <ns0:text x="79.7901" y="288" text-anchor="middle" font-size="10" fill="#555">param</ns0:text>
  <ns0:line x1="92.5696" y1="224" x2="98.304" y2="224" stroke="#333" stroke-width="0.3277" marker-end="url(#arr)" />
  <ns0:rect x="98.304" y="136" width="28.672" height="176" rx="1.6384" fill="#FCE4EC" stroke="#C62828" stroke-width="0.3277" />
  <ns0:text x="112.5581" y="184" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Deprecate</ns0:text>
  <ns0:text x="112.5581" y="224" text-anchor="middle" font-size="10" fill="#333">v1.x sunset</ns0:text>
  <ns0:text x="112.5581" y="256" text-anchor="middle" font-size="10" fill="#555">warn in description</ns0:text>
  <ns0:text x="112.5581" y="288" text-anchor="middle" font-size="10" fill="#555">track usage</ns0:text>
  <ns0:rect x="4.9152" y="384" width="121.2416" height="232" rx="1.6384" fill="#E8EAF6" stroke="#3949AB" stroke-width="0.2458" />
  <ns0:text x="65.536" y="428.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#3949AB">Versioning Rules for Tool Authors</ns0:text>
  <ns0:text x="8.192" y="472" font-size="10" fill="#333">▶ Never remove or rename required parameters — always add optional ones</ns0:text>
  <ns0:text x="8.192" y="508.8" font-size="10" fill="#333">▶ Use semantic versioning: MAJOR.MINOR.PATCH</ns0:text>
  <ns0:text x="8.192" y="545.6" font-size="10" fill="#333">▶ Mark deprecated tools in description: "[DEPRECATED: use search_code_v2]"</ns0:text>
  <ns0:text x="8.192" y="582.4" font-size="10" fill="#333">▶ Monitor tool call success rates and latency after every update</ns0:text>
  <ns0:text x="8.192" y="608" font-size="10" fill="#666">▶ Support multiple versions concurrently during migration periods</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="280" height="250.19607834679" rx="6.398529432114" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="96.862745372933" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--primary-text)">v1.0</text>
  <text x="180" y="153.725490745867" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--primary-text)">Initial release</text>
  <text x="180" y="199.215686612841" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--primary-text)">required: pattern</text>
  <text x="180" y="244.705882479815" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--primary-text)">stable API</text>
  <line x1="330" y1="165.098039173395" x2="360" y2="165.098039173395" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="370" y="40" width="280" height="250.19607834679" rx="6.398529432114" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="96.862745372933" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--ok-text)">v1.1</text>
  <text x="510" y="153.725490745867" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--ok-text)">Add optional params</text>
  <text x="510" y="199.215686612841" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--ok-text)">+ max_results</text>
  <text x="510" y="244.705882479815" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--ok-text)">backward-compat</text>
  <line x1="660" y1="165.098039173395" x2="690" y2="165.098039173395" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="700" y="40" width="280" height="250.19607834679" rx="6.398529432114" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="96.862745372933" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--warn-text)">v2.0</text>
  <text x="840" y="153.725490745867" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--warn-text)">Breaking change</text>
  <text x="840" y="199.215686612841" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--warn-text)">rename required</text>
  <text x="840" y="244.705882479815" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--warn-text)">param</text>
  <line x1="990" y1="165.098039173395" x2="1020" y2="165.098039173395" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1030" y="40" width="210" height="250.19607834679" rx="6.398529432114" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135" y="96.862745372933" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--danger-text)">Deprecate</text>
  <text x="1135" y="153.725490745867" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--danger-text)">v1.x sunset</text>
  <text x="1135" y="199.215686612841" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--danger-text)">warn in schema</text>
  <text x="1135" y="244.705882479815" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--danger-text)">track usage</text>

  <rect x="40" y="335.686274213764" width="1200" height="284.313725786236" rx="6.398529432114" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="386.862745372933" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--text)">Versioning rules</text>
  <text x="640" y="438.039215453672" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Never remove or rename required params — add optional ones instead.</text>
  <text x="640" y="483.529411320646" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Use semver. Mark deprecated tools in description: [DEPRECATED: use search_v2].</text>
  <text x="640" y="529.019608266051" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Monitor tool call success rates and latency after every change.</text>
  <text x="640" y="574.509804133026" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Support multiple versions concurrently during migrations.</text>
</svg>

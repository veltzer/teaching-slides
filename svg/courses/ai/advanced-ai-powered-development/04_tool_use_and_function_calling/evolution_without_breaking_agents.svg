  <text x="701.2352" y="8960" text-anchor="middle" font-size="85.1968" fill="#333">Initial release</text>
  <text x="701.2352" y="10240" text-anchor="middle" font-size="78.6432" fill="#555">required: pattern</text>
  <text x="701.2352" y="11520" text-anchor="middle" font-size="78.6432" fill="#4CAF50">stable API</text>
  <line x1="1212.416" y1="8960" x2="1441.792" y2="8960" stroke="#333" stroke-width="13.1072" marker-end="url(#arr)" />
  <rect x="1441.792" y="5440" width="1015.808" height="7040" rx="65.536" fill="#E8F5E9" stroke="#2E7D32" stroke-width="13.1072" />
  <text x="1946.4192" y="7360" text-anchor="middle" font-size="104.8576" font-weight="bold" fill="#2E7D32">v1.1</text>
  <text x="1946.4192" y="8960" text-anchor="middle" font-size="85.1968" fill="#333">Add optional params</text>
  <text x="1946.4192" y="10240" text-anchor="middle" font-size="78.6432" fill="#555">+ max_results</text>
  <text x="1946.4192" y="11520" text-anchor="middle" font-size="78.6432" fill="#4CAF50">backward-compat</text>
  <line x1="2457.6" y1="8960" x2="2686.976" y2="8960" stroke="#333" stroke-width="13.1072" marker-end="url(#arr)" />
  <rect x="2686.976" y="5440" width="1015.808" height="7040" rx="65.536" fill="#FFF3E0" stroke="#E65100" stroke-width="13.1072" />
  <text x="3191.6032" y="7360" text-anchor="middle" font-size="104.8576" font-weight="bold" fill="#E65100">v2.0</text>
  <text x="3191.6032" y="8960" text-anchor="middle" font-size="85.1968" fill="#333">Breaking change</text>
  <text x="3191.6032" y="10240" text-anchor="middle" font-size="78.6432" fill="#C62828">rename required</text>
  <text x="3191.6032" y="11520" text-anchor="middle" font-size="78.6432" fill="#555">param</text>

  <text x="4502.3232" y="7360" text-anchor="middle" font-size="104.8576" font-weight="bold" fill="#C62828">Deprecate</text>
  <text x="4502.3232" y="8960" text-anchor="middle" font-size="85.1968" fill="#333">v1.x sunset</text>
  <text x="4502.3232" y="10240" text-anchor="middle" font-size="78.6432" fill="#555">warn in description</text>
  <text x="4502.3232" y="11520" text-anchor="middle" font-size="78.6432" fill="#555">track usage</text>
  <rect x="196.608" y="15360" width="4849.664" height="9280" rx="65.536" fill="#E8EAF6" stroke="#3949AB" stroke-width="9.8304" />
  <text x="2621.44" y="17152" text-anchor="middle" font-size="98.304" font-weight="bold" fill="#3949AB">Versioning Rules for Tool Authors</text>
  <text x="327.68" y="18880" font-size="85.1968" fill="#333">▶ Never remove or rename required parameters — always add optional ones</text>
  <text x="327.68" y="20352" font-size="85.1968" fill="#333">▶ Use semantic versioning: MAJOR.MINOR.PATCH</text>
  <text x="327.68" y="21824" font-size="85.1968" fill="#333">▶ Mark deprecated tools in description: "[DEPRECATED: use search_code_v2]"</text>
  <text x="327.68" y="23296" font-size="85.1968" fill="#333">▶ Monitor tool call success rates and latency after every update</text>
  <text x="327.68" y="24320" font-size="78.6432" fill="#666">▶ Support multiple versions concurrently during migration periods</text>
</svg>
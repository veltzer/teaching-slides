<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,179.377 13.1644,0" fill="#555" />
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,179.377 13.1644,0" fill="#2E7D32" />
    </marker>
  </defs>
  <rect width="268.3953" height="640" fill="var(--surface)" rx="6"/>
  <text x="134.1977" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">MCP Sampling: Server-Initiated LLM Calls</text>
  <rect x="10.0648" y="128" width="73.8087" height="192" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="46.9692" y="180.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">MCP Server</text>
  <text x="46.9692" y="220.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">analyze_error_logs()</text>
  <text x="46.9692" y="252.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">fetches logs...</text>
  <text x="46.9692" y="284.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">needs LLM reasoning</text>
  <line x1="83.8735" y1="208" x2="124.1328" y2="208" stroke="var(--text-muted)" stroke-width="0.671" marker-end="url(#arr)" />
  <text x="104.0032" y="188.8" text-anchor="middle" font-size="10" fill="var(--text)">sampling/</text>
  <text x="104.0032" y="212.8" text-anchor="middle" font-size="10" fill="var(--text)">createMessage</text>
  <rect x="124.1328" y="128" width="73.8087" height="192" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="161.0372" y="180.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Host</text>
  <text x="161.0372" y="220.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">Claude Desktop /</text>
  <text x="161.0372" y="252.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">Claude Code</text>
  <text x="161.0372" y="284.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">controls model choice</text>
  <line x1="197.9415" y1="208" x2="224.7811" y2="208" stroke="var(--text-muted)" stroke-width="0.671" marker-end="url(#arr)" />
  <text x="211.3613" y="188.8" text-anchor="middle" font-size="10" fill="var(--text)">API call</text>
  <rect x="224.7811" y="128" width="36.9043" height="192" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="243.2332" y="180.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">LLM</text>
  <text x="243.2332" y="220.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">Claude Opus</text>
  <text x="243.2332" y="252.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">reasoning</text>
  <text x="243.2332" y="284.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">completion</text>
  <path d="M 197.9415 320 Q 197.9415 432 83.8735 432 Q 67.0988 432 67.0988 320" fill="none" stroke="var(--ok-border)" stroke-width="0.671" marker-end="url(#arrg)" />
  <text x="140.9075" y="456" text-anchor="middle" font-size="10" fill="var(--ok-accent)">completion returned to server</text>
  <rect x="124.1328" y="344" width="73.8087" height="80" rx="6" fill="var(--warn-fill)" fill-opacity="0.2" stroke="var(--warn-border)" stroke-width="2" />
  <text x="161.0372" y="384" text-anchor="middle" font-size="10" fill="var(--warn-accent)" font-weight="bold">Human Approval Gate</text>
  <text x="161.0372" y="412.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">host may prompt user first</text>
  <rect x="10.0648" y="496" width="248.2656" height="120" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="134.1977" y="540.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Why Sampling is Powerful</text>
  <text x="16.7747" y="579.2" font-size="10" fill="var(--text)">▶ Server stays stateless — delegates reasoning to the host's LLM</text>
  <text x="16.7747" y="604.8" font-size="10" fill="var(--text)">▶ Enables multi-step reasoning inside a tool call without extra round-trips</text>
</svg>
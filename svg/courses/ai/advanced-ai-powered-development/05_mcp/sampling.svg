<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="305.454545" height="289.999999414773" rx="9.593385807601" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.727273" y="105.90909130811" text-anchor="middle" font-size="26.381811511841" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">MCP Server</text>
  <text x="192.727273" y="171.818182616219" text-anchor="middle" font-size="19.186772697078" fill="var(--ok-text)" font-family="Arial, sans-serif">analyze_error_logs()</text>
  <text x="192.727273" y="224.545454492252" text-anchor="middle" font-size="19.186772697078" fill="var(--ok-text)" font-family="Arial, sans-serif">fetches logs</text>
  <text x="192.727273" y="277.27272753874" text-anchor="middle" font-size="19.186772697078" fill="var(--ok-text)" font-family="Arial, sans-serif">needs LLM reasoning</text>

  <line x1="345.454545" y1="171.818182616219" x2="476.363636" y2="171.818182616219" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="410.909091" y="152.045455223786" text-anchor="middle" font-size="16.78842570424" fill="var(--text-muted)" font-family="Arial, sans-serif">sampling/createMessage</text>

  <rect x="487.272727" y="40" width="305.454545" height="289.999999414773" rx="9.593385807601" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="105.90909130811" text-anchor="middle" font-size="26.381811511841" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Host</text>
  <text x="640" y="171.818182616219" text-anchor="middle" font-size="19.186772697078" fill="var(--primary-text)" font-family="Arial, sans-serif">Claude Desktop / Code</text>
  <text x="640" y="224.545454492252" text-anchor="middle" font-size="19.186772697078" fill="var(--primary-text)" font-family="Arial, sans-serif">controls model choice</text>
  <text x="640" y="277.27272753874" text-anchor="middle" font-size="19.186772697078" fill="var(--primary-text)" font-family="Arial, sans-serif">token limits</text>

  <line x1="792.727273" y1="171.818182616219" x2="923.636364" y2="171.818182616219" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="858.181818" y="152.045455223786" text-anchor="middle" font-size="16.78842570424" fill="var(--text-muted)" font-family="Arial, sans-serif">API call</text>

  <rect x="934.545455" y="40" width="305.454545" height="289.999999414773" rx="9.593385807601" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.272727" y="105.90909130811" text-anchor="middle" font-size="26.381811511841" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">LLM</text>
  <text x="1087.272727" y="171.818182616219" text-anchor="middle" font-size="19.186772697078" fill="var(--warn-text)" font-family="Arial, sans-serif">Claude Opus</text>
  <text x="1087.272727" y="224.545454492252" text-anchor="middle" font-size="19.186772697078" fill="var(--warn-text)" font-family="Arial, sans-serif">reasoning</text>
  <text x="1087.272727" y="277.27272753874" text-anchor="middle" font-size="19.186772697078" fill="var(--warn-text)" font-family="Arial, sans-serif">completion</text>

  <path d="M 1087.272727 330.000000585227 Q 1087.272727 422.272727246126 640 422.272727246126 Q 192.727273 422.272727246126 192.727273 330.000000585227" fill="none" stroke="var(--ok-border)" stroke-width="2.5" marker-end="url(#arrow-ok)"/>
  <text x="640" y="409.090908984504" text-anchor="middle" font-size="19.186772697078" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">completion returned to server</text>

  <rect x="312.727273" y="475.000000292614" width="654.545455" height="144.999999707386" rx="9.593385807601" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="521.13636420829" text-anchor="middle" font-size="21.58511860804" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Why Sampling is Powerful</text>
  <text x="640" y="563.31818241139" text-anchor="middle" font-size="17.987599200659" fill="var(--info-text)" font-family="Arial, sans-serif">Server stays stateless; reasoning delegated to host's LLM</text>
  <text x="640" y="597.590909189334" text-anchor="middle" font-size="17.987599200659" fill="var(--info-text)" font-family="Arial, sans-serif">Multi-step reasoning inside a tool call, with host approval</text>
</svg>

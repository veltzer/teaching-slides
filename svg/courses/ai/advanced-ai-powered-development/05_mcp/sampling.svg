<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.818941" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">MCP Sampling: Server-Initiated LLM Calls</text>

  <rect x="40" y="124.466019" width="305.454545" height="247.76699" rx="8.867366" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.727273" y="180.776699" text-anchor="middle" font-size="24.385257" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">MCP Server</text>
  <text x="192.727273" y="237.087379" text-anchor="middle" font-size="17.734733" fill="var(--ok-text)" font-family="Arial, sans-serif">analyze_error_logs()</text>
  <text x="192.727273" y="282.135922" text-anchor="middle" font-size="17.734733" fill="var(--ok-text)" font-family="Arial, sans-serif">fetches logs</text>
  <text x="192.727273" y="327.184466" text-anchor="middle" font-size="17.734733" fill="var(--ok-text)" font-family="Arial, sans-serif">needs LLM reasoning</text>

  <line x1="345.454545" y1="237.087379" x2="476.363636" y2="237.087379" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410.909091" y="220.194175" text-anchor="middle" font-size="15.517891" fill="var(--text-muted)" font-family="Arial, sans-serif">sampling/createMessage</text>

  <rect x="487.272727" y="124.466019" width="305.454545" height="247.76699" rx="8.867366" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="180.776699" text-anchor="middle" font-size="24.385257" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Host</text>
  <text x="640" y="237.087379" text-anchor="middle" font-size="17.734733" fill="var(--primary-text)" font-family="Arial, sans-serif">Claude Desktop / Code</text>
  <text x="640" y="282.135922" text-anchor="middle" font-size="17.734733" fill="var(--primary-text)" font-family="Arial, sans-serif">controls model choice</text>
  <text x="640" y="327.184466" text-anchor="middle" font-size="17.734733" fill="var(--primary-text)" font-family="Arial, sans-serif">token limits</text>

  <line x1="792.727273" y1="237.087379" x2="923.636364" y2="237.087379" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="858.181818" y="220.194175" text-anchor="middle" font-size="15.517891" fill="var(--text-muted)" font-family="Arial, sans-serif">API call</text>

  <rect x="934.545455" y="124.466019" width="305.454545" height="247.76699" rx="8.867366" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.272727" y="180.776699" text-anchor="middle" font-size="24.385257" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">LLM</text>
  <text x="1087.272727" y="237.087379" text-anchor="middle" font-size="17.734733" fill="var(--warn-text)" font-family="Arial, sans-serif">Claude Opus</text>
  <text x="1087.272727" y="282.135922" text-anchor="middle" font-size="17.734733" fill="var(--warn-text)" font-family="Arial, sans-serif">reasoning</text>
  <text x="1087.272727" y="327.184466" text-anchor="middle" font-size="17.734733" fill="var(--warn-text)" font-family="Arial, sans-serif">completion</text>

  <path d="M 1087.272727 372.23301 Q 1087.272727 451.067961 640 451.067961 Q 192.727273 451.067961 192.727273 372.23301" fill="none" stroke="var(--ok-border)" stroke-width="2.5" marker-end="url(#arrow-ok)"/>
  <text x="640" y="439.805825" text-anchor="middle" font-size="17.734733" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">completion returned to server</text>

  <rect x="312.727273" y="496.116505" width="654.545455" height="123.883495" rx="8.867366" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="535.533981" text-anchor="middle" font-size="19.951574" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Why Sampling is Powerful</text>
  <text x="640" y="571.572816" text-anchor="middle" font-size="16.626312" fill="var(--info-text)" font-family="Arial, sans-serif">Server stays stateless; reasoning delegated to host's LLM</text>
  <text x="640" y="600.854369" text-anchor="middle" font-size="16.626312" fill="var(--info-text)" font-family="Arial, sans-serif">Multi-step reasoning inside a tool call, with host approval</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,179.377 13.1644,0" fill="#555" />
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,179.377 13.1644,0" fill="#2E7D32" />
    </marker>
  </defs>
  <rect width="243.2332" height="580" fill="var(--surface)" rx="6" x="518.3834" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">MCP Sampling: Server-Initiated LLM Calls</text>
  <rect x="527.5046" y="156" width="66.8891" height="174" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="560.9492" y="203.85" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">MCP Server</text>
  <text x="560.9492" y="240.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">analyze_error_logs()</text>
  <text x="560.9492" y="269.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">fetches logs...</text>
  <text x="560.9492" y="298.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">needs LLM reasoning</text>
  <line x1="594.3937" y1="228.5" x2="630.8787" y2="228.5" stroke="var(--text-muted)" stroke-width="0.671" marker-end="url(#arr)" />
  <text x="612.6363" y="211.1" text-anchor="middle" font-size="10" fill="var(--text)">sampling/</text>
  <text x="612.6363" y="232.85" text-anchor="middle" font-size="10" fill="var(--text)">createMessage</text>
  <rect x="630.8787" y="156" width="66.8891" height="174" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="664.3233" y="203.85" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Host</text>
  <text x="664.3233" y="240.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">Claude Desktop /</text>
  <text x="664.3233" y="269.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">Claude Code</text>
  <text x="664.3233" y="298.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">controls model choice</text>
  <line x1="697.7679" y1="228.5" x2="722.0913" y2="228.5" stroke="var(--text-muted)" stroke-width="0.671" marker-end="url(#arr)" />
  <text x="709.9296" y="211.1" text-anchor="middle" font-size="10" fill="var(--text)">API call</text>
  <rect x="722.0913" y="156" width="33.4445" height="174" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="738.8135" y="203.85" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">LLM</text>
  <text x="738.8135" y="240.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">Claude Opus</text>
  <text x="738.8135" y="269.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">reasoning</text>
  <text x="738.8135" y="298.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">completion</text>
  <path d="M 697.7679 330 Q 697.7679 431.5 594.3937 431.5 Q 579.1917 431.5 579.1917 330" fill="none" stroke="var(--ok-border)" stroke-width="0.671" marker-end="url(#arrg)" />
  <text x="646.0808" y="453.25" text-anchor="middle" font-size="10" fill="var(--ok-accent)">completion returned to server</text>
  <rect x="630.8787" y="351.75" width="66.8891" height="72.5" rx="6" fill="var(--warn-fill)" fill-opacity="0.2" stroke="var(--warn-border)" stroke-width="2" />
  <text x="664.3233" y="388" text-anchor="middle" font-size="10" fill="var(--warn-accent)" font-weight="bold">Human Approval Gate</text>
  <text x="664.3233" y="414.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">host may prompt user first</text>
  <rect x="527.5046" y="489.5" width="224.9907" height="108.75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="530.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Why Sampling is Powerful</text>
  <text x="533.5855" y="564.9" font-size="10" fill="var(--text)">▶ Server stays stateless — delegates reasoning to the host's LLM</text>
  <text x="533.5855" y="588.1" font-size="10" fill="var(--text)">▶ Enables multi-step reasoning inside a tool call without extra round-trips</text>
</svg>
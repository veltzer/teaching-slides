<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="37.6124" markerHeight="125.5642" refX="33.8512" refY="62.7819" orient="auto">
      <ns0:polygon points="0,179.377 13.1644,0" fill="#555" />
    </ns0:marker>
    <ns0:marker id="arrg" markerWidth="37.6124" markerHeight="125.5642" refX="33.8512" refY="62.7819" orient="auto">
      <ns0:polygon points="0,179.377 13.1644,0" fill="#2E7D32" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="268.3953" height="640" fill="#f9f9f9" />
  <ns0:text x="134.1977" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">MCP Sampling: Server-Initiated LLM Calls</ns0:text>
  <ns0:rect x="10.0648" y="128" width="73.8087" height="192" rx="3.3549" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.671" />
  <ns0:text x="46.9692" y="180.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">MCP Server</ns0:text>
  <ns0:text x="46.9692" y="220.8" text-anchor="middle" font-size="10" fill="#555">analyze_error_logs()</ns0:text>
  <ns0:text x="46.9692" y="252.8" text-anchor="middle" font-size="10" fill="#555">fetches logs...</ns0:text>
  <ns0:text x="46.9692" y="284.8" text-anchor="middle" font-size="10" fill="#555">needs LLM reasoning</ns0:text>
  <ns0:line x1="83.8735" y1="208" x2="124.1328" y2="208" stroke="#555" stroke-width="0.671" marker-end="url(#arr)" />
  <ns0:text x="104.0032" y="188.8" text-anchor="middle" font-size="10" fill="#333">sampling/</ns0:text>
  <ns0:text x="104.0032" y="212.8" text-anchor="middle" font-size="10" fill="#333">createMessage</ns0:text>
  <ns0:rect x="124.1328" y="128" width="73.8087" height="192" rx="3.3549" fill="#E3F2FD" stroke="#1565C0" stroke-width="0.671" />
  <ns0:text x="161.0372" y="180.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">Host</ns0:text>
  <ns0:text x="161.0372" y="220.8" text-anchor="middle" font-size="10" fill="#555">Claude Desktop /</ns0:text>
  <ns0:text x="161.0372" y="252.8" text-anchor="middle" font-size="10" fill="#555">Claude Code</ns0:text>
  <ns0:text x="161.0372" y="284.8" text-anchor="middle" font-size="10" fill="#555">controls model choice</ns0:text>
  <ns0:line x1="197.9415" y1="208" x2="224.7811" y2="208" stroke="#555" stroke-width="0.671" marker-end="url(#arr)" />
  <ns0:text x="211.3613" y="188.8" text-anchor="middle" font-size="10" fill="#333">API call</ns0:text>
  <ns0:rect x="224.7811" y="128" width="36.9043" height="192" rx="3.3549" fill="#FFF3E0" stroke="#E65100" stroke-width="0.671" />
  <ns0:text x="243.2332" y="180.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">LLM</ns0:text>
  <ns0:text x="243.2332" y="220.8" text-anchor="middle" font-size="10" fill="#555">Claude Opus</ns0:text>
  <ns0:text x="243.2332" y="252.8" text-anchor="middle" font-size="10" fill="#555">reasoning</ns0:text>
  <ns0:text x="243.2332" y="284.8" text-anchor="middle" font-size="10" fill="#555">completion</ns0:text>
  <ns0:path d="M 197.9415 320 Q 197.9415 432 83.8735 432 Q 67.0988 432 67.0988 320" fill="none" stroke="#2E7D32" stroke-width="0.671" marker-end="url(#arrg)" />
  <ns0:text x="140.9075" y="456" text-anchor="middle" font-size="10" fill="#2E7D32">completion returned to server</ns0:text>
  <ns0:rect x="124.1328" y="344" width="73.8087" height="80" rx="2.684" fill="#F9A825" fill-opacity="0.2" stroke="#F9A825" stroke-width="0.5032" />
  <ns0:text x="161.0372" y="384" text-anchor="middle" font-size="10" fill="#F9A825" font-weight="bold">Human Approval Gate</ns0:text>
  <ns0:text x="161.0372" y="412.8" text-anchor="middle" font-size="10" fill="#555">host may prompt user first</ns0:text>
  <ns0:rect x="10.0648" y="496" width="248.2656" height="120" rx="3.3549" fill="#E8EAF6" stroke="#3949AB" stroke-width="0.5032" />
  <ns0:text x="134.1977" y="540.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#3949AB">Why Sampling is Powerful</ns0:text>
  <ns0:text x="16.7747" y="579.2" font-size="10" fill="#333">▶ Server stays stateless — delegates reasoning to the host's LLM</ns0:text>
  <ns0:text x="16.7747" y="604.8" font-size="10" fill="#333">▶ Enables multi-step reasoning inside a tool call without extra round-trips</ns0:text>
</ns0:svg>
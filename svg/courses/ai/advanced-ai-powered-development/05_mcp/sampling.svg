<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="85" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-accent)">MCP Sampling: Server-Initiated LLM Calls</text>

  <rect x="90" y="160" width="280" height="220" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="230" y="210" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--ok-text)">MCP Server</text>
  <text x="230" y="260" text-anchor="middle" font-size="16" fill="var(--ok-text)">analyze_error_logs()</text>
  <text x="230" y="300" text-anchor="middle" font-size="16" fill="var(--ok-text)">fetches logs</text>
  <text x="230" y="340" text-anchor="middle" font-size="16" fill="var(--ok-text)">needs LLM reasoning</text>

  <line x1="370" y1="260" x2="490" y2="260" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="245" text-anchor="middle" font-size="14" fill="var(--text-muted)">sampling/createMessage</text>

  <rect x="500" y="160" width="280" height="220" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="210" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)">Host</text>
  <text x="640" y="260" text-anchor="middle" font-size="16" fill="var(--primary-text)">Claude Desktop / Code</text>
  <text x="640" y="300" text-anchor="middle" font-size="16" fill="var(--primary-text)">controls model choice</text>
  <text x="640" y="340" text-anchor="middle" font-size="16" fill="var(--primary-text)">token limits</text>

  <line x1="780" y1="260" x2="900" y2="260" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="245" text-anchor="middle" font-size="14" fill="var(--text-muted)">API call</text>

  <rect x="910" y="160" width="280" height="220" rx="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1050" y="210" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)">LLM</text>
  <text x="1050" y="260" text-anchor="middle" font-size="16" fill="var(--warn-text)">Claude Opus</text>
  <text x="1050" y="300" text-anchor="middle" font-size="16" fill="var(--warn-text)">reasoning</text>
  <text x="1050" y="340" text-anchor="middle" font-size="16" fill="var(--warn-text)">completion</text>

  <path d="M 1050 380 Q 1050 450 640 450 Q 230 450 230 380" fill="none" stroke="var(--ok-border)" stroke-width="2.5" marker-end="url(#arrow-ok)"/>
  <text x="640" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-accent)">completion returned to server</text>

  <rect x="340" y="490" width="600" height="110" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="525" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--info-text)">Why Sampling is Powerful</text>
  <text x="640" y="557" text-anchor="middle" font-size="15" fill="var(--info-text)">Server stays stateless; reasoning delegated to host's LLM</text>
  <text x="640" y="583" text-anchor="middle" font-size="15" fill="var(--info-text)">Multi-step reasoning inside a tool call, with host approval</text>
</svg>

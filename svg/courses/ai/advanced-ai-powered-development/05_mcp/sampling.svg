<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.818941" font-weight="bold" fill="var(--primary-accent)">MCP Sampling: Server-Initiated LLM Calls</text>

  <rect x="40" y="124.466019" width="305.454545" height="247.76699" rx="8.867366" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.727273" y="180.776699" text-anchor="middle" font-size="24.385257" font-weight="bold" fill="var(--ok-text)">MCP Server</text>
  <text x="192.727273" y="237.087379" text-anchor="middle" font-size="17.734733" fill="var(--ok-text)">analyze_error_logs()</text>
  <text x="192.727273" y="282.135922" text-anchor="middle" font-size="17.734733" fill="var(--ok-text)">fetches logs</text>
  <text x="192.727273" y="327.184466" text-anchor="middle" font-size="17.734733" fill="var(--ok-text)">needs LLM reasoning</text>

  <line x1="345.454545" y1="237.087379" x2="476.363636" y2="237.087379" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410.909091" y="220.194175" text-anchor="middle" font-size="15.517891" fill="var(--text-muted)">sampling/createMessage</text>

  <rect x="487.272727" y="124.466019" width="305.454545" height="247.76699" rx="8.867366" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="180.776699" text-anchor="middle" font-size="24.385257" font-weight="bold" fill="var(--primary-text)">Host</text>
  <text x="640" y="237.087379" text-anchor="middle" font-size="17.734733" fill="var(--primary-text)">Claude Desktop / Code</text>
  <text x="640" y="282.135922" text-anchor="middle" font-size="17.734733" fill="var(--primary-text)">controls model choice</text>
  <text x="640" y="327.184466" text-anchor="middle" font-size="17.734733" fill="var(--primary-text)">token limits</text>

  <line x1="792.727273" y1="237.087379" x2="923.636364" y2="237.087379" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="858.181818" y="220.194175" text-anchor="middle" font-size="15.517891" fill="var(--text-muted)">API call</text>

  <rect x="934.545455" y="124.466019" width="305.454545" height="247.76699" rx="8.867366" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1087.272727" y="180.776699" text-anchor="middle" font-size="24.385257" font-weight="bold" fill="var(--warn-text)">LLM</text>
  <text x="1087.272727" y="237.087379" text-anchor="middle" font-size="17.734733" fill="var(--warn-text)">Claude Opus</text>
  <text x="1087.272727" y="282.135922" text-anchor="middle" font-size="17.734733" fill="var(--warn-text)">reasoning</text>
  <text x="1087.272727" y="327.184466" text-anchor="middle" font-size="17.734733" fill="var(--warn-text)">completion</text>

  <path d="M 1087.272727 372.23301 Q 1087.272727 451.067961 640 451.067961 Q 192.727273 451.067961 192.727273 372.23301" fill="none" stroke="var(--ok-border)" stroke-width="2.5" marker-end="url(#arrow-ok)"/>
  <text x="640" y="439.805825" text-anchor="middle" font-size="17.734733" font-weight="bold" fill="var(--ok-accent)">completion returned to server</text>

  <rect x="312.727273" y="496.116505" width="654.545455" height="123.883495" rx="8.867366" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="535.533981" text-anchor="middle" font-size="19.951574" font-weight="bold" fill="var(--info-text)">Why Sampling is Powerful</text>
  <text x="640" y="571.572816" text-anchor="middle" font-size="16.626312" fill="var(--info-text)">Server stays stateless; reasoning delegated to host's LLM</text>
  <text x="640" y="600.854369" text-anchor="middle" font-size="16.626312" fill="var(--info-text)">Multi-step reasoning inside a tool call, with host approval</text>
</svg>

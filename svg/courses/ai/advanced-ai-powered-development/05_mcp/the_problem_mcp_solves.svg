  <text x="225.9753" y="340.8" text-anchor="middle" fill="var(--bg)" font-size="10">Database</text>
  <line x1="204.484" y1="248" x2="208.5926" y2="187.2" stroke="var(--text-muted)" stroke-width="0.4741" />
  <line x1="204.484" y1="272" x2="208.5926" y2="259.2" stroke="var(--text-muted)" stroke-width="0.4741" />
  <line x1="204.484" y1="296" x2="208.5926" y2="331.2" stroke="var(--text-muted)" stroke-width="0.4741" />
  <text x="191.842" y="408" text-anchor="middle" font-size="10" fill="var(--ok-accent)">6 integrations, reused by all!</text>
  <rect x="4.7407" y="456" width="243.358" height="160" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="126.4198" y="500.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Key Benefits of MCP</text>
  <text x="9.4815" y="544" font-size="10" fill="var(--text)">▶ Open standard (JSON-RPC 2.0) — one server works with any compliant host</text>
  <text x="9.4815" y="579.2" font-size="10" fill="var(--text)">▶ Dynamic discovery at runtime — agents find tools without hardcoding</text>
  <text x="9.4815" y="604.8" font-size="10" fill="var(--text)">▶ Supports stdio (local) and HTTP (remote) transports</text>
</svg>
  <text x="94.8148" y="340.8" text-anchor="middle" fill="var(--bg)" font-size="10">Database</text>
  <line x1="41.0864" y1="187.2" x2="77.4321" y2="187.2" stroke="var(--danger-border)" stroke-width="0.316" />
  <line x1="41.0864" y1="187.2" x2="77.4321" y2="259.2" stroke="var(--danger-border)" stroke-width="0.316" />
  <line x1="41.0864" y1="187.2" x2="77.4321" y2="331.2" stroke="var(--danger-border)" stroke-width="0.316" />
  <line x1="41.0864" y1="259.2" x2="77.4321" y2="187.2" stroke="var(--danger-border)" stroke-width="0.316" />
  <line x1="41.0864" y1="259.2" x2="77.4321" y2="259.2" stroke="var(--danger-border)" stroke-width="0.316" />
  <line x1="41.0864" y1="259.2" x2="77.4321" y2="331.2" stroke="var(--danger-border)" stroke-width="0.316" />
  <line x1="41.0864" y1="331.2" x2="77.4321" y2="187.2" stroke="var(--danger-border)" stroke-width="0.316" />
  <line x1="41.0864" y1="331.2" x2="77.4321" y2="259.2" stroke="var(--danger-border)" stroke-width="0.316" />
  <line x1="41.0864" y1="331.2" x2="77.4321" y2="331.2" stroke="var(--danger-border)" stroke-width="0.316" />
  <text x="60.6815" y="408" text-anchor="middle" font-size="10" fill="var(--danger-accent)">9 custom integrations!</text>
  <rect x="135.9012" y="88" width="112.1975" height="320" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="191.842" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">With MCP: N + M integrations</text>
  <rect x="140.642" y="160" width="31.6049" height="56" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="156.4444" y="196.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Claude Code</text>
  <rect x="140.642" y="232" width="31.6049" height="56" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="156.4444" y="268.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Cursor</text>
  <rect x="140.642" y="304" width="31.6049" height="56" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>

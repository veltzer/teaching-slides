  <text x="640" y="493.85" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Key Benefits of MCP</text>
  <text x="534.0247" y="533" font-size="10" fill="var(--text)">▶ Open standard (JSON-RPC 2.0) — one server works with any compliant host</text>
  <text x="534.0247" y="564.9" font-size="10" fill="var(--text)">▶ Dynamic discovery at runtime — agents find tools without hardcoding</text>
  <text x="534.0247" y="588.1" font-size="10" fill="var(--text)">▶ Supports stdio (local) and HTTP (remote) transports</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--primary-accent)">The Problem MCP Solves: N x M to N + M</text>

  <rect x="70" y="120" width="560" height="420" rx="8" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="3"/>
  <text x="350" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-accent)">Before MCP: N x M integrations</text>

  <rect x="100" y="200" width="140" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="170" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Claude Code</text>
  <rect x="100" y="290" width="140" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="170" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Cursor</text>
  <rect x="100" y="380" width="140" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="170" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">VS Code</text>

  <rect x="460" y="200" width="140" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="530" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Filesystem</text>
  <rect x="460" y="290" width="140" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="530" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">GitHub</text>
  <rect x="460" y="380" width="140" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="530" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Database</text>

  <g stroke="var(--danger-border)" stroke-width="1.2" opacity="0.7">
    <line x1="240" y1="230" x2="460" y2="230"/>
    <line x1="240" y1="230" x2="460" y2="320"/>
    <line x1="240" y1="230" x2="460" y2="410"/>
    <line x1="240" y1="320" x2="460" y2="230"/>
    <line x1="240" y1="320" x2="460" y2="320"/>
    <line x1="240" y1="320" x2="460" y2="410"/>
    <line x1="240" y1="410" x2="460" y2="230"/>
    <line x1="240" y1="410" x2="460" y2="320"/>
    <line x1="240" y1="410" x2="460" y2="410"/>
  </g>

  <text x="350" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-accent)">9 custom integrations</text>

  <rect x="650" y="120" width="560" height="420" rx="8" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="3"/>
  <text x="930" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-accent)">With MCP: N + M integrations</text>

  <rect x="680" y="200" width="130" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="745" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">Claude Code</text>
  <rect x="680" y="290" width="130" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="745" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">Cursor</text>
  <rect x="680" y="380" width="130" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="745" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">VS Code</text>

  <rect x="880" y="230" width="120" height="180" rx="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="940" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">MCP</text>
  <text x="940" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Protocol</text>

  <rect x="1070" y="200" width="130" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1135" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Filesystem</text>
  <rect x="1070" y="290" width="130" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1135" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">GitHub</text>
  <rect x="1070" y="380" width="130" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1135" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Database</text>

  <g stroke="var(--text-muted)" stroke-width="1.5">
    <line x1="810" y1="230" x2="880" y2="290"/>
    <line x1="810" y1="320" x2="880" y2="320"/>
    <line x1="810" y1="410" x2="880" y2="350"/>
    <line x1="1000" y1="290" x2="1070" y2="230"/>
    <line x1="1000" y1="320" x2="1070" y2="320"/>
    <line x1="1000" y1="350" x2="1070" y2="410"/>
  </g>

  <text x="930" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-accent)">6 integrations, reused by all</text>

  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Open standard (JSON-RPC 2.0) - dynamic discovery - stdio and HTTP transports</text>
</svg>

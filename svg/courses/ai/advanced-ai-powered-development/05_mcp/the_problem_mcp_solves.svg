  <rect x="208.5926" y="160" width="34.7654" height="56" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="225.9753" y="196.8" text-anchor="middle" fill="var(--bg)" font-size="10">Filesystem</text>
  <rect x="208.5926" y="232" width="34.7654" height="56" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="225.9753" y="268.8" text-anchor="middle" fill="var(--bg)" font-size="10">GitHub</text>

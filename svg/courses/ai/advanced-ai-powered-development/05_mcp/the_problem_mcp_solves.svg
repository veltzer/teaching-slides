<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.94035" font-weight="bold" fill="var(--primary-accent)">The Problem MCP Solves: N x M to N + M</text>

  <rect x="40" y="80.6" width="589.473684" height="487.2" rx="8.8401" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="3"/>
  <text x="334.736842" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.10025" font-weight="bold" fill="var(--danger-accent)">Before MCP: N x M integrations</text>

  <rect x="71.578947" y="173.4" width="147.368421" height="69.6" rx="6.630075" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.263158" y="217.48" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6802" font-weight="bold" fill="var(--primary-text)">Claude Code</text>
  <rect x="71.578947" y="277.8" width="147.368421" height="69.6" rx="6.630075" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.263158" y="321.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6802" font-weight="bold" fill="var(--primary-text)">Cursor</text>
  <rect x="71.578947" y="382.2" width="147.368421" height="69.6" rx="6.630075" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.263158" y="426.28" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6802" font-weight="bold" fill="var(--primary-text)">VS Code</text>

  <rect x="450.526316" y="173.4" width="147.368421" height="69.6" rx="6.630075" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="524.210526" y="217.48" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6802" fill="var(--ok-text)">Filesystem</text>
  <rect x="450.526316" y="277.8" width="147.368421" height="69.6" rx="6.630075" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="524.210526" y="321.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6802" fill="var(--ok-text)">GitHub</text>
  <rect x="450.526316" y="382.2" width="147.368421" height="69.6" rx="6.630075" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="524.210526" y="426.28" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6802" fill="var(--ok-text)">Database</text>

  <g stroke="var(--danger-border)" stroke-width="1.2" opacity="0.7">
    <line x1="218.947368" y1="208.2" x2="450.526316" y2="208.2"/>
    <line x1="218.947368" y1="208.2" x2="450.526316" y2="312.6"/>
    <line x1="218.947368" y1="208.2" x2="450.526316" y2="417"/>
    <line x1="218.947368" y1="312.6" x2="450.526316" y2="208.2"/>
    <line x1="218.947368" y1="312.6" x2="450.526316" y2="312.6"/>
    <line x1="218.947368" y1="312.6" x2="450.526316" y2="417"/>
    <line x1="218.947368" y1="417" x2="450.526316" y2="208.2"/>
    <line x1="218.947368" y1="417" x2="450.526316" y2="312.6"/>
    <line x1="218.947368" y1="417" x2="450.526316" y2="417"/>
  </g>

  <text x="334.736842" y="533" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.890225" font-weight="bold" fill="var(--danger-accent)">9 custom integrations</text>

  <rect x="650.526316" y="80.6" width="589.473684" height="487.2" rx="8.8401" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="3"/>
  <text x="945.263158" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.10025" font-weight="bold" fill="var(--ok-accent)">With MCP: N + M integrations</text>

  <rect x="682.105263" y="173.4" width="136.842105" height="69.6" rx="6.630075" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.526316" y="217.48" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.575188" font-weight="bold" fill="var(--primary-text)">Claude Code</text>
  <rect x="682.105263" y="277.8" width="136.842105" height="69.6" rx="6.630075" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.526316" y="321.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.575188" font-weight="bold" fill="var(--primary-text)">Cursor</text>
  <rect x="682.105263" y="382.2" width="136.842105" height="69.6" rx="6.630075" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.526316" y="426.28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.575188" font-weight="bold" fill="var(--primary-text)">VS Code</text>

  <rect x="892.631579" y="208.2" width="126.315789" height="208.8" rx="8.8401" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955.789474" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.10025" font-weight="bold" fill="var(--warn-text)">MCP</text>
  <text x="955.789474" y="335.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6802" fill="var(--warn-text)">Protocol</text>

  <rect x="1092.631579" y="173.4" width="136.842105" height="69.6" rx="6.630075" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1161.052632" y="217.48" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.575188" fill="var(--ok-text)">Filesystem</text>
  <rect x="1092.631579" y="277.8" width="136.842105" height="69.6" rx="6.630075" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1161.052632" y="321.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.575188" fill="var(--ok-text)">GitHub</text>
  <rect x="1092.631579" y="382.2" width="136.842105" height="69.6" rx="6.630075" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1161.052632" y="426.28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.575188" fill="var(--ok-text)">Database</text>

  <g stroke="var(--text-muted)" stroke-width="1.5">
    <line x1="818.947368" y1="208.2" x2="892.631579" y2="277.8"/>
    <line x1="818.947368" y1="312.6" x2="892.631579" y2="312.6"/>
    <line x1="818.947368" y1="417" x2="892.631579" y2="347.4"/>
    <line x1="1018.947368" y1="277.8" x2="1092.631579" y2="208.2"/>
    <line x1="1018.947368" y1="312.6" x2="1092.631579" y2="312.6"/>
    <line x1="1018.947368" y1="347.4" x2="1092.631579" y2="417"/>
  </g>

  <text x="945.263158" y="533" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.890225" font-weight="bold" fill="var(--ok-accent)">6 integrations, reused by all</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.575188" fill="var(--text-muted)">Open standard (JSON-RPC 2.0) - dynamic discovery - stdio and HTTP transports</text>
</svg>

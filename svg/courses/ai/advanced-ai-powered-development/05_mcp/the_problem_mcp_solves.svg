  <ns0:text x="126.4198" y="500.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-indigo)">Key Benefits of MCP</ns0:text>
  <ns0:text x="9.4815" y="544" font-size="10" fill="var(--text-dark)">▶ Open standard (JSON-RPC 2.0) — one server works with any compliant host</ns0:text>
  <ns0:text x="9.4815" y="579.2" font-size="10" fill="var(--text-dark)">▶ Dynamic discovery at runtime — agents find tools without hardcoding</ns0:text>

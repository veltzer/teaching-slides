  <ns0:text x="283.593" y="336" text-anchor="middle" font-size="10" fill="#555">model output</ns0:text>
  <ns0:text x="283.593" y="361.6" text-anchor="middle" font-size="10" fill="#E65100">~48K tokens</ns0:text>
  <ns0:rect x="12.384" y="416" width="305.4714" height="200" rx="4.128" fill="#E8EAF6" stroke="#3949AB" stroke-width="0.6192" />
  <ns0:text x="165.1197" y="464" text-anchor="middle" font-size="10" font-weight="bold" fill="#3949AB">Strategies to Manage Tool Schema Cost</ns0:text>
  <ns0:rect x="20.64" y="488" width="66.0479" height="104" rx="3.3024" fill="#C5CAE9" stroke="#3949AB" />
  <ns0:text x="53.6639" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Dynamic Reg.</ns0:text>
  <ns0:text x="53.6639" y="560" text-anchor="middle" font-size="10" fill="#333">only register tools</ns0:text>
  <ns0:text x="53.6639" y="587.2" text-anchor="middle" font-size="10" fill="#333">for current task</ns0:text>
  <ns0:rect x="92.8798" y="488" width="66.0479" height="104" rx="3.3024" fill="#C5CAE9" stroke="#3949AB" />
  <ns0:text x="125.9038" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Tool Grouping</ns0:text>
  <ns0:text x="125.9038" y="560" text-anchor="middle" font-size="10" fill="#333">combine fine-grained</ns0:text>
  <ns0:text x="125.9038" y="587.2" text-anchor="middle" font-size="10" fill="#333">tools into one</ns0:text>
  <ns0:rect x="165.1197" y="488" width="66.0479" height="104" rx="3.3024" fill="#C5CAE9" stroke="#3949AB" />
  <ns0:text x="198.1436" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Min. Descriptions</ns0:text>
  <ns0:text x="198.1436" y="560" text-anchor="middle" font-size="10" fill="#333">keep descriptions</ns0:text>
  <ns0:text x="198.1436" y="587.2" text-anchor="middle" font-size="10" fill="#333">concise</ns0:text>
  <ns0:rect x="237.3595" y="488" width="72.2399" height="104" rx="3.3024" fill="#C5CAE9" stroke="#3949AB" />
  <ns0:text x="273.2731" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Lazy Loading</ns0:text>

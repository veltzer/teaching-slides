<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="330.2394" height="640" fill="var(--surface)" rx="6"/>
  <text x="165.1197" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Context Window Management for MCP Tools</text>
  <rect x="12.384" y="112" width="305.4714" height="112" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="165.1197" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Context Window: 200K tokens</text>
  <rect x="12.384" y="256" width="74.3039" height="104" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="49.5359" y="300.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Tool Schemas</text>
  <text x="49.5359" y="336" text-anchor="middle" font-size="10" fill="var(--text-muted)">20 tools × 100 tokens</text>
  <text x="49.5359" y="361.6" text-anchor="middle" font-size="10" fill="var(--danger-accent)">= 2,000 tokens used!</text>
  <rect x="90.8158" y="256" width="154.7997" height="104" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="168.0093" y="300.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Conversation + Code Context</text>
  <text x="168.0093" y="336" text-anchor="middle" font-size="10" fill="var(--text-muted)">retrieved files, tool results</text>
  <text x="168.0093" y="361.6" text-anchor="middle" font-size="10" fill="var(--ok-accent)">~150,000 tokens</text>
  <rect x="249.7435" y="256" width="68.1119" height="104" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="283.593" y="300.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Response</text>
  <text x="283.593" y="336" text-anchor="middle" font-size="10" fill="var(--text-muted)">model output</text>
  <text x="283.593" y="361.6" text-anchor="middle" font-size="10" fill="var(--warn-accent)">~48K tokens</text>
  <rect x="12.384" y="416" width="305.4714" height="200" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="165.1197" y="464" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Strategies to Manage Tool Schema Cost</text>
  <rect x="20.64" y="488" width="66.0479" height="104" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="53.6639" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Dynamic Reg.</text>
  <text x="53.6639" y="560" text-anchor="middle" font-size="10" fill="var(--text)">only register tools</text>
  <text x="53.6639" y="587.2" text-anchor="middle" font-size="10" fill="var(--text)">for current task</text>
  <rect x="92.8798" y="488" width="66.0479" height="104" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="125.9038" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Tool Grouping</text>
  <text x="125.9038" y="560" text-anchor="middle" font-size="10" fill="var(--text)">combine fine-grained</text>
  <text x="125.9038" y="587.2" text-anchor="middle" font-size="10" fill="var(--text)">tools into one</text>
  <rect x="165.1197" y="488" width="66.0479" height="104" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="198.1436" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Min. Descriptions</text>
  <text x="198.1436" y="560" text-anchor="middle" font-size="10" fill="var(--text)">keep descriptions</text>
  <text x="198.1436" y="587.2" text-anchor="middle" font-size="10" fill="var(--text)">concise</text>
  <rect x="237.3595" y="488" width="72.2399" height="104" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="273.2731" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Lazy Loading</text>
  <text x="273.2731" y="560" text-anchor="middle" font-size="10" fill="var(--text)">connect MCP servers</text>
  <text x="273.2731" y="587.2" text-anchor="middle" font-size="10" fill="var(--text)">on demand only</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="299.2795" height="580" fill="var(--surface)" rx="6" x="490.3603" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Context Window Management for MCP Tools</text>
  <rect x="501.5833" y="141.5" width="276.8335" height="101.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="199.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Context Window: 200K tokens</text>
  <rect x="501.5833" y="272" width="67.3379" height="94.25" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="535.2522" y="312.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Tool Schemas</text>
  <text x="535.2522" y="344.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">20 tools × 100 tokens</text>
  <text x="535.2522" y="367.7" text-anchor="middle" font-size="10" fill="var(--danger-accent)">= 2,000 tokens used!</text>
  <rect x="572.6621" y="272" width="140.2872" height="94.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="642.6187" y="312.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Conversation + Code Context</text>
  <text x="642.6187" y="344.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">retrieved files, tool results</text>
  <text x="642.6187" y="367.7" text-anchor="middle" font-size="10" fill="var(--ok-accent)">~150,000 tokens</text>
  <rect x="716.6903" y="272" width="61.7264" height="94.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="747.3664" y="312.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Response</text>
  <text x="747.3664" y="344.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">model output</text>
  <text x="747.3664" y="367.7" text-anchor="middle" font-size="10" fill="var(--warn-accent)">~48K tokens</text>
  <rect x="501.5833" y="417" width="276.8335" height="181.25" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="460.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Strategies to Manage Tool Schema Cost</text>
  <rect x="509.0653" y="482.25" width="59.8559" height="94.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="538.9932" y="518.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Dynamic Reg.</text>
  <text x="538.9932" y="547.5" text-anchor="middle" font-size="10" fill="var(--text)">only register tools</text>
  <text x="538.9932" y="572.15" text-anchor="middle" font-size="10" fill="var(--text)">for current task</text>
  <rect x="574.5326" y="482.25" width="59.8559" height="94.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="604.4606" y="518.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Tool Grouping</text>
  <text x="604.4606" y="547.5" text-anchor="middle" font-size="10" fill="var(--text)">combine fine-grained</text>
  <text x="604.4606" y="572.15" text-anchor="middle" font-size="10" fill="var(--text)">tools into one</text>
  <rect x="640" y="482.25" width="59.8559" height="94.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="669.9279" y="518.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Min. Descriptions</text>
  <text x="669.9279" y="547.5" text-anchor="middle" font-size="10" fill="var(--text)">keep descriptions</text>
  <text x="669.9279" y="572.15" text-anchor="middle" font-size="10" fill="var(--text)">concise</text>
  <rect x="705.4673" y="482.25" width="65.4674" height="94.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="738.014" y="518.5" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Lazy Loading</text>
  <text x="738.014" y="547.5" text-anchor="middle" font-size="10" fill="var(--text)">connect MCP servers</text>
  <text x="738.014" y="572.15" text-anchor="middle" font-size="10" fill="var(--text)">on demand only</text>
</svg>
  <ns0:text x="168.0093" y="336" text-anchor="middle" font-size="10" fill="#555">retrieved files, tool results</ns0:text>
  <ns0:text x="168.0093" y="361.6" text-anchor="middle" font-size="10" fill="#2E7D32">~150,000 tokens</ns0:text>

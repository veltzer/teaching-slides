      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:rect width="330.2394" height="640" fill="var(--surface-light)" />
  <ns0:text x="165.1197" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Context Window Management for MCP Tools</ns0:text>
  <ns0:rect x="12.384" y="112" width="305.4714" height="112" rx="3.3024" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="0.8256" />
  <ns0:text x="165.1197" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-dk)">Context Window: 200K tokens</ns0:text>
  <ns0:rect x="12.384" y="256" width="74.3039" height="104" rx="2.4768" fill="var(--danger-pale3)" stroke="var(--danger-dk)" stroke-width="0.8256" />
  <ns0:text x="49.5359" y="300.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-dk)">Tool Schemas</ns0:text>
  <ns0:text x="49.5359" y="336" text-anchor="middle" font-size="10" fill="var(--text-muted)">20 tools × 100 tokens</ns0:text>
  <ns0:text x="49.5359" y="361.6" text-anchor="middle" font-size="10" fill="var(--danger-dk)">= 2,000 tokens used!</ns0:text>
  <ns0:rect x="90.8158" y="256" width="154.7997" height="104" rx="2.4768" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="0.8256" />
  <ns0:text x="168.0093" y="300.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-dk)">Conversation + Code Context</ns0:text>
  <ns0:text x="168.0093" y="336" text-anchor="middle" font-size="10" fill="var(--text-muted)">retrieved files, tool results</ns0:text>
  <ns0:text x="168.0093" y="361.6" text-anchor="middle" font-size="10" fill="var(--ok-dk)">~150,000 tokens</ns0:text>
  <ns0:rect x="249.7435" y="256" width="68.1119" height="104" rx="2.4768" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="0.8256" />
  <ns0:text x="283.593" y="300.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-dk)">Response</ns0:text>
  <ns0:text x="283.593" y="336" text-anchor="middle" font-size="10" fill="var(--text-muted)">model output</ns0:text>
  <ns0:text x="283.593" y="361.6" text-anchor="middle" font-size="10" fill="var(--warn-dk)">~48K tokens</ns0:text>
  <ns0:rect x="12.384" y="416" width="305.4714" height="200" rx="4.128" fill="var(--info-indigo-lt)" stroke="var(--primary-indigo)" stroke-width="0.6192" />
  <ns0:text x="165.1197" y="464" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-indigo)">Strategies to Manage Tool Schema Cost</ns0:text>
  <ns0:rect x="20.64" y="488" width="66.0479" height="104" rx="3.3024" fill="var(--primary-lt)" stroke="var(--primary-indigo)" />
  <ns0:text x="53.6639" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Dynamic Reg.</ns0:text>
  <ns0:text x="53.6639" y="560" text-anchor="middle" font-size="10" fill="var(--text-dark)">only register tools</ns0:text>
  <ns0:text x="53.6639" y="587.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">for current task</ns0:text>
  <ns0:rect x="92.8798" y="488" width="66.0479" height="104" rx="3.3024" fill="var(--primary-lt)" stroke="var(--primary-indigo)" />
  <ns0:text x="125.9038" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Tool Grouping</ns0:text>
  <ns0:text x="125.9038" y="560" text-anchor="middle" font-size="10" fill="var(--text-dark)">combine fine-grained</ns0:text>
  <ns0:text x="125.9038" y="587.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">tools into one</ns0:text>
  <ns0:rect x="165.1197" y="488" width="66.0479" height="104" rx="3.3024" fill="var(--primary-lt)" stroke="var(--primary-indigo)" />
  <ns0:text x="198.1436" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Min. Descriptions</ns0:text>
  <ns0:text x="198.1436" y="560" text-anchor="middle" font-size="10" fill="var(--text-dark)">keep descriptions</ns0:text>
  <ns0:text x="198.1436" y="587.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">concise</ns0:text>
  <ns0:rect x="237.3595" y="488" width="72.2399" height="104" rx="3.3024" fill="var(--primary-lt)" stroke="var(--primary-indigo)" />
  <ns0:text x="273.2731" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Lazy Loading</ns0:text>
  <ns0:text x="273.2731" y="560" text-anchor="middle" font-size="10" fill="var(--text-dark)">connect MCP servers</ns0:text>
  <ns0:text x="273.2731" y="587.2" text-anchor="middle" font-size="10" fill="var(--text-dark)">on demand only</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,107.1075 8.96,0" fill="#888888" />
    </marker>
  </defs>
  <rect width="305.9358" height="640" fill="var(--surface)" rx="6"/>
  <text x="152.9679" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Central MCP Tool Registry</text>
  <rect x="114.7259" y="112" width="76.484" height="128" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="152.9679" y="164.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Central Registry</text>
  <text x="152.9679" y="196.8" text-anchor="middle" fill="var(--info-accent)" font-size="10">approved MCP servers</text>
  <text x="152.9679" y="225.6" text-anchor="middle" fill="var(--info-accent)" font-size="10">versioned + audited</text>
  <rect x="11.4726" y="384" width="70.7477" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="46.6552" y="432" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Team A</text>
  <text x="46.6552" y="464" text-anchor="middle" fill="var(--primary-accent)" font-size="10">backend</text>
  <text x="46.6552" y="492.8" text-anchor="middle" fill="var(--primary-accent)" font-size="10">uses: github, postgres</text>
  <rect x="117.4029" y="384" width="70.7477" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="152.5855" y="432" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Team B</text>
  <text x="152.5855" y="464" text-anchor="middle" fill="var(--primary-accent)" font-size="10">frontend</text>
  <text x="152.5855" y="492.8" text-anchor="middle" fill="var(--primary-accent)" font-size="10">uses: github, puppeteer</text>
  <rect x="223.3331" y="384" width="70.7477" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="258.5158" y="432" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Team C</text>
  <text x="258.5158" y="464" text-anchor="middle" fill="var(--primary-accent)" font-size="10">devops</text>
  <text x="258.5158" y="492.8" text-anchor="middle" fill="var(--primary-accent)" font-size="10">uses: deploy, monitoring</text>
  <line x1="141.4953" y1="240" x2="76.484" y2="384" stroke="var(--text-faint)" stroke-width="0.7648" marker-end="url(#arr)" />
  <line x1="152.9679" y1="240" x2="152.9679" y2="384" stroke="var(--text-faint)" stroke-width="0.7648" marker-end="url(#arr)" />
  <line x1="164.4405" y1="240" x2="229.4519" y2="384" stroke="var(--text-faint)" stroke-width="0.7648" marker-end="url(#arr)" />
  <rect x="11.4726" y="552" width="282.9906" height="72" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="152.9679" y="588.8" text-anchor="middle" font-size="10" fill="var(--text)">Distribute via internal package registry: pin server versions, enforce security policies</text>
  <text x="152.9679" y="614.4" text-anchor="middle" font-size="10" fill="var(--text-muted)">Each team gets consistent tooling — no drift between environments</text>
</svg>
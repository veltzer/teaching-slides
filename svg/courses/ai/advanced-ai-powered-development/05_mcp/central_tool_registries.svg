  <ns0:text x="152.9679" y="588.8" text-anchor="middle" font-size="10" fill="#333">Distribute via internal package registry: pin server versions, enforce security policies</ns0:text>
  <ns0:text x="152.9679" y="614.4" text-anchor="middle" font-size="10" fill="#555">Each team gets consistent tooling — no drift between environments</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Central Registry -->
  <rect x="421.818182" y="40" width="436.363636" height="153.877550672553" rx="9.090760545503" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84.979591636718" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.999592016201" font-weight="bold" fill="var(--info-text)">Central Registry</text>
  <text x="640" y="122.85714209621" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.181521091005" fill="var(--info-text)">approved MCP servers</text>
  <text x="640" y="154.816325795768" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.181521091005" fill="var(--info-text)">versioned + audited</text>
  <text x="640" y="182.04081608738" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.908831470698" fill="var(--info-text)">internal npm / PyPI / OCI</text>

  <!-- Teams -->
  <rect x="40" y="276.734693834069" width="327.272727" height="189.387755493378" rx="9.090760545503" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.636364" y="324.081632174761" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.726901363757" font-weight="bold" fill="var(--primary-text)">Team A — Backend</text>
  <text x="203.636364" y="365.510203755518" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.045175764783" fill="var(--primary-text)">github, postgres</text>
  <text x="203.636364" y="401.020407511037" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.045175764783" fill="var(--primary-text)">pinned versions</text>
  <text x="203.636364" y="436.530612331862" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.772486144476" fill="var(--primary-text)">consistent tooling</text>

  <rect x="476.363636" y="276.734693834069" width="327.272727" height="189.387755493378" rx="9.090760545503" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="324.081632174761" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.726901363757" font-weight="bold" fill="var(--primary-text)">Team B — Frontend</text>
  <text x="640" y="365.510203755518" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.045175764783" fill="var(--primary-text)">github, puppeteer</text>
  <text x="640" y="401.020407511037" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.045175764783" fill="var(--primary-text)">pinned versions</text>
  <text x="640" y="436.530612331862" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.772486144476" fill="var(--primary-text)">consistent tooling</text>

  <rect x="912.727273" y="276.734693834069" width="327.272727" height="189.387755493378" rx="9.090760545503" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.363636" y="324.081632174761" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.726901363757" font-weight="bold" fill="var(--primary-text)">Team C — DevOps</text>
  <text x="1076.363636" y="365.510203755518" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.045175764783" fill="var(--primary-text)">deploy, monitoring</text>
  <text x="1076.363636" y="401.020407511037" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.045175764783" fill="var(--primary-text)">pinned versions</text>
  <text x="1076.363636" y="436.530612331862" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.772486144476" fill="var(--primary-text)">consistent tooling</text>

  <!-- Arrows -->
  <line x1="530.909091" y1="193.877550672553" x2="247.272727" y2="276.734693834069" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="193.877550672553" x2="640" y2="276.734693834069" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="749.090909" y1="193.877550672553" x2="1032.727273" y2="276.734693834069" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom note -->
  <rect x="40" y="513.469387668138" width="1200" height="106.530612331862" rx="9.090760545503" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="558.448979304856" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.317866417227" font-weight="bold" fill="var(--warn-text)">Distribute via internal package registry — enforce security policies, prevent drift</text>
  <text x="640" y="596.326530829654" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.045175764783" fill="var(--warn-text)">Every team gets the same vetted tools across every environment</text>
</svg>

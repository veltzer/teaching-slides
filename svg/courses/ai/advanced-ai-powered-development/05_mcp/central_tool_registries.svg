<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-accent)">Central MCP Tool Registry</text>

  <!-- Central Registry -->
  <rect x="440" y="110" width="400" height="130" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Central Registry</text>
  <text x="640" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">approved MCP servers</text>
  <text x="640" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">versioned + audited</text>
  <text x="640" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">internal npm / PyPI / OCI</text>

  <!-- Teams -->
  <rect x="90" y="310" width="300" height="160" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="240" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Team A — Backend</text>
  <text x="240" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">github, postgres</text>
  <text x="240" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">pinned versions</text>
  <text x="240" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">consistent tooling</text>

  <rect x="490" y="310" width="300" height="160" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Team B — Frontend</text>
  <text x="640" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">github, puppeteer</text>
  <text x="640" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">pinned versions</text>
  <text x="640" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">consistent tooling</text>

  <rect x="890" y="310" width="300" height="160" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1040" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Team C — DevOps</text>
  <text x="1040" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">deploy, monitoring</text>
  <text x="1040" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">pinned versions</text>
  <text x="1040" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">consistent tooling</text>

  <!-- Arrows -->
  <line x1="540" y1="240" x2="280" y2="310" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="640" y1="240" x2="640" y2="310" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="740" y1="240" x2="1000" y2="310" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bottom note -->
  <rect x="90" y="510" width="1100" height="90" rx="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--warn-text)">Distribute via internal package registry — enforce security policies, prevent drift</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Every team gets the same vetted tools across every environment</text>
</svg>

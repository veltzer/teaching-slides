  <ns0:text x="258.5158" y="432" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Team C</ns0:text>
  <ns0:text x="258.5158" y="464" text-anchor="middle" fill="#e3f2fd" font-size="10">devops</ns0:text>

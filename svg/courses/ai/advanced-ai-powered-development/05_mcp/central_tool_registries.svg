<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.42313" font-weight="bold" fill="var(--primary-accent)">Central MCP Tool Registry</text>

  <!-- Central Registry -->
  <rect x="421.818182" y="75.555556" width="436.363636" height="144.444444" rx="8.80771" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="117.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.221203" font-weight="bold" fill="var(--info-text)">Central Registry</text>
  <text x="640" y="153.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.61542" fill="var(--info-text)">approved MCP servers</text>
  <text x="640" y="183.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.61542" fill="var(--info-text)">versioned + audited</text>
  <text x="640" y="208.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.413493" fill="var(--info-text)">internal npm / PyPI / OCI</text>

  <!-- Teams -->
  <rect x="40" y="297.777778" width="327.272727" height="177.777778" rx="8.80771" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.636364" y="342.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.019275" font-weight="bold" fill="var(--primary-text)">Team A — Backend</text>
  <text x="203.636364" y="381.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.514456" fill="var(--primary-text)">github, postgres</text>
  <text x="203.636364" y="414.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.514456" fill="var(--primary-text)">pinned versions</text>
  <text x="203.636364" y="447.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.312529" fill="var(--primary-text)">consistent tooling</text>

  <rect x="476.363636" y="297.777778" width="327.272727" height="177.777778" rx="8.80771" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="342.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.019275" font-weight="bold" fill="var(--primary-text)">Team B — Frontend</text>
  <text x="640" y="381.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.514456" fill="var(--primary-text)">github, puppeteer</text>
  <text x="640" y="414.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.514456" fill="var(--primary-text)">pinned versions</text>
  <text x="640" y="447.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.312529" fill="var(--primary-text)">consistent tooling</text>

  <rect x="912.727273" y="297.777778" width="327.272727" height="177.777778" rx="8.80771" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.363636" y="342.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.019275" font-weight="bold" fill="var(--primary-text)">Team C — DevOps</text>
  <text x="1076.363636" y="381.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.514456" fill="var(--primary-text)">deploy, monitoring</text>
  <text x="1076.363636" y="414.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.514456" fill="var(--primary-text)">pinned versions</text>
  <text x="1076.363636" y="447.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.312529" fill="var(--primary-text)">consistent tooling</text>

  <!-- Arrows -->
  <line x1="530.909091" y1="220" x2="247.272727" y2="297.777778" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="640" y1="220" x2="640" y2="297.777778" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="749.090909" y1="220" x2="1032.727273" y2="297.777778" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bottom note -->
  <rect x="40" y="520" width="1200" height="100" rx="8.80771" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="562.222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.716384" font-weight="bold" fill="var(--warn-text)">Distribute via internal package registry — enforce security policies, prevent drift</text>
  <text x="640" y="597.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.514456" fill="var(--warn-text)">Every team gets the same vetted tools across every environment</text>
</svg>

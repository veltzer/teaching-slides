<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,306.7455 8.96,0" fill="#888888" />
    </marker>
  </defs>
  <rect width="106.8247" height="640" fill="var(--surface)" rx="6"/>
  <text x="53.4123" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">End-to-End Bug Triage with MCP</text>
  <rect x="1.3353" y="128" width="19.7626" height="144" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="11.2166" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">1. Jira MCP</text>
  <text x="11.2166" y="211.2" text-anchor="middle" fill="var(--info-accent)" font-size="10">fetch bug ticket</text>
  <text x="11.2166" y="240" text-anchor="middle" fill="var(--info-accent)" font-size="10">+ repro steps</text>
  <line x1="21.0979" y1="200" x2="23.3679" y2="200" stroke="var(--text-faint)" stroke-width="0.2671" marker-end="url(#arr)" />
  <rect x="23.3679" y="128" width="19.7626" height="144" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="33.2492" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">2. Postgres MCP</text>
  <text x="33.2492" y="211.2" text-anchor="middle" fill="var(--primary-accent)" font-size="10">query error logs</text>
  <text x="33.2492" y="240" text-anchor="middle" fill="var(--primary-accent)" font-size="10">in time window</text>
  <line x1="43.1305" y1="200" x2="45.4005" y2="200" stroke="var(--text-faint)" stroke-width="0.2671" marker-end="url(#arr)" />
  <rect x="45.4005" y="128" width="19.7626" height="144" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="55.2818" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">3. GitHub MCP</text>
  <text x="55.2818" y="211.2" text-anchor="middle" fill="var(--ok-accent)" font-size="10">git blame on</text>
  <text x="55.2818" y="240" text-anchor="middle" fill="var(--ok-accent)" font-size="10">relevant file</text>
  <line x1="65.1631" y1="200" x2="67.4331" y2="200" stroke="var(--text-faint)" stroke-width="0.2671" marker-end="url(#arr)" />
  <rect x="67.4331" y="128" width="19.7626" height="144" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="77.3144" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">4. FS MCP</text>
  <text x="77.3144" y="211.2" text-anchor="middle" fill="var(--warn-accent)" font-size="10">read code, apply</text>
  <text x="77.3144" y="240" text-anchor="middle" fill="var(--warn-accent)" font-size="10">fix, run tests</text>
  <line x1="87.1957" y1="200" x2="89.4657" y2="200" stroke="var(--text-faint)" stroke-width="0.2671" marker-end="url(#arr)" />
  <rect x="89.4657" y="128" width="16.0237" height="144" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="97.4775" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">5. GitHub</text>
  <text x="97.4775" y="204.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">MCP</text>
  <text x="97.4775" y="240" text-anchor="middle" fill="var(--ok-accent)" font-size="10">open pull request</text>
  <rect x="37.3886" y="328" width="32.0474" height="88" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="0.2671" />
  <text x="53.4123" y="371.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">AI Agent Orchestrator</text>
  <text x="53.4123" y="403.2" text-anchor="middle" fill="var(--primary-accent)" font-size="10">coordinates all MCP servers</text>
  <line x1="44.0652" y1="328" x2="17.359" y2="272" stroke="var(--primary-border)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <line x1="48.0711" y1="328" x2="37.3886" y2="272" stroke="var(--primary-border)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <line x1="53.4123" y1="328" x2="58.7536" y2="272" stroke="var(--primary-border)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <line x1="58.7536" y1="328" x2="77.4479" y2="272" stroke="var(--primary-border)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <line x1="62.7595" y1="328" x2="96.1422" y2="272" stroke="var(--primary-border)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <rect x="1.3353" y="464" width="104.1541" height="160" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="53.4123" y="508.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Key Outcome</text>
  <text x="4.0059" y="552" font-size="10" fill="var(--text)">▶ Each step uses a different MCP server — AI orchestrates all of them seamlessly</text>
  <text x="4.0059" y="587.2" font-size="10" fill="var(--text)">▶ Developer reviews and approves at each stage — human stays in the loop</text>
  <text x="4.0059" y="612.8" font-size="10" fill="var(--text)">▶ Total time: minutes instead of hours of manual context-switching</text>
</svg>
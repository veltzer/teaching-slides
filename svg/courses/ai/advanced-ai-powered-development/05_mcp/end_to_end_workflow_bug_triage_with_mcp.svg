  <ns0:text x="77.3144" y="211.2" text-anchor="middle" fill="#FAD7A0" font-size="10">read code, apply</ns0:text>
  <ns0:text x="77.3144" y="240" text-anchor="middle" fill="#FAD7A0" font-size="10">fix, run tests</ns0:text>
  <ns0:line x1="87.1957" y1="200" x2="89.4657" y2="200" stroke="#7f8c8d" stroke-width="0.2671" marker-end="url(#arr)" />

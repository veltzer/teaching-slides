<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,306.7455 8.96,0" fill="#888888" />
    </marker>
  </defs>
  <rect width="96.8099" height="580" fill="var(--surface)" rx="6" x="591.5951" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">End-to-End Bug Triage with MCP</text>
  <rect x="592.8052" y="156" width="17.9099" height="130.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="601.7601" y="199.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">1. Jira MCP</text>
  <text x="601.7601" y="231.4" text-anchor="middle" fill="var(--info-accent)" font-size="10">fetch bug ticket</text>
  <text x="601.7601" y="257.5" text-anchor="middle" fill="var(--info-accent)" font-size="10">+ repro steps</text>
  <line x1="610.715" y1="221.25" x2="612.7722" y2="221.25" stroke="var(--text-faint)" stroke-width="0.2671" marker-end="url(#arr)" />
  <rect x="612.7722" y="156" width="17.9099" height="130.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="621.7271" y="199.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">2. Postgres MCP</text>
  <text x="621.7271" y="231.4" text-anchor="middle" fill="var(--primary-accent)" font-size="10">query error logs</text>
  <text x="621.7271" y="257.5" text-anchor="middle" fill="var(--primary-accent)" font-size="10">in time window</text>
  <line x1="630.6821" y1="221.25" x2="632.7393" y2="221.25" stroke="var(--text-faint)" stroke-width="0.2671" marker-end="url(#arr)" />
  <rect x="632.7393" y="156" width="17.9099" height="130.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="641.6942" y="199.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">3. GitHub MCP</text>
  <text x="641.6942" y="231.4" text-anchor="middle" fill="var(--ok-accent)" font-size="10">git blame on</text>
  <text x="641.6942" y="257.5" text-anchor="middle" fill="var(--ok-accent)" font-size="10">relevant file</text>
  <line x1="650.6491" y1="221.25" x2="652.7063" y2="221.25" stroke="var(--text-faint)" stroke-width="0.2671" marker-end="url(#arr)" />
  <rect x="652.7063" y="156" width="17.9099" height="130.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="661.6612" y="199.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">4. FS MCP</text>
  <text x="661.6612" y="231.4" text-anchor="middle" fill="var(--warn-accent)" font-size="10">read code, apply</text>
  <text x="661.6612" y="257.5" text-anchor="middle" fill="var(--warn-accent)" font-size="10">fix, run tests</text>
  <line x1="670.6162" y1="221.25" x2="672.6733" y2="221.25" stroke="var(--text-faint)" stroke-width="0.2671" marker-end="url(#arr)" />
  <rect x="672.6733" y="156" width="14.5215" height="130.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="679.934" y="199.5" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">5. GitHub</text>
  <text x="679.934" y="225.6" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">MCP</text>
  <text x="679.934" y="257.5" text-anchor="middle" fill="var(--ok-accent)" font-size="10">open pull request</text>
  <rect x="625.4785" y="337.25" width="29.043" height="79.75" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="0.2671" />
  <text x="640" y="376.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">AI Agent Orchestrator</text>
  <text x="640" y="405.4" text-anchor="middle" fill="var(--primary-accent)" font-size="10">coordinates all MCP servers</text>
  <line x1="631.5291" y1="337.25" x2="607.3267" y2="286.5" stroke="var(--primary-border)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <line x1="635.1595" y1="337.25" x2="625.4785" y2="286.5" stroke="var(--primary-border)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <line x1="640" y1="337.25" x2="644.8405" y2="286.5" stroke="var(--primary-border)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <line x1="644.8405" y1="337.25" x2="661.7822" y2="286.5" stroke="var(--primary-border)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <line x1="648.4709" y1="337.25" x2="678.7239" y2="286.5" stroke="var(--primary-border)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <rect x="592.8052" y="460.5" width="94.3897" height="145" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="501.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Key Outcome</text>
  <text x="595.2254" y="540.25" font-size="10" fill="var(--text)">▶ Each step uses a different MCP server — AI orchestrates all of them seamlessly</text>
  <text x="595.2254" y="572.15" font-size="10" fill="var(--text)">▶ Developer reviews and approves at each stage — human stays in the loop</text>
  <text x="595.2254" y="595.35" font-size="10" fill="var(--text)">▶ Total time: minutes instead of hours of manual context-switching</text>
</svg>
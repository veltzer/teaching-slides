  <ns0:text x="33.2492" y="176" text-anchor="middle" fill="white" font-size="10" font-weight="bold">2. Postgres MCP</ns0:text>
  <ns0:text x="33.2492" y="211.2" text-anchor="middle" fill="#D6EAF8" font-size="10">query error logs</ns0:text>
  <ns0:text x="33.2492" y="240" text-anchor="middle" fill="#D6EAF8" font-size="10">in time window</ns0:text>
  <ns0:line x1="43.1305" y1="200" x2="45.4005" y2="200" stroke="#7f8c8d" stroke-width="0.2671" marker-end="url(#arr)" />
  <ns0:rect x="45.4005" y="128" width="19.7626" height="144" rx="1.3353" fill="#27ae60" stroke="#2E7D32" stroke-width="0.2671" />
  <ns0:text x="55.2818" y="176" text-anchor="middle" fill="white" font-size="10" font-weight="bold">3. GitHub MCP</ns0:text>
  <ns0:text x="55.2818" y="211.2" text-anchor="middle" fill="#D5F5E3" font-size="10">git blame on</ns0:text>
  <ns0:text x="55.2818" y="240" text-anchor="middle" fill="#D5F5E3" font-size="10">relevant file</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--text)">An agent orchestrates many MCP servers to triage and fix a bug</text>

  <rect x="40" y="82.181818" width="220" height="210.909091" rx="6.161464" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="150" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--info-text)">1. Jira MCP</text>
  <text x="150" y="182.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--info-text)">fetch bug ticket</text>
  <text x="150" y="219.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--info-text)">+ repro steps</text>

  <line x1="270" y1="187.636364" x2="290" y2="187.636364" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="82.181818" width="220" height="210.909091" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="410" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--primary-text)">2. Postgres MCP</text>
  <text x="410" y="182.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--primary-text)">query error logs</text>
  <text x="410" y="219.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--primary-text)">in time window</text>

  <line x1="530" y1="187.636364" x2="550" y2="187.636364" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="82.181818" width="220" height="210.909091" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="670" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--ok-text)">3. GitHub MCP</text>
  <text x="670" y="182.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--ok-text)">git blame</text>
  <text x="670" y="219.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--ok-text)">relevant file</text>

  <line x1="790" y1="187.636364" x2="810" y2="187.636364" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="820" y="82.181818" width="200" height="210.909091" rx="6.161464" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="920" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--warn-text)">4. FS MCP</text>
  <text x="920" y="182.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--warn-text)">apply fix</text>
  <text x="920" y="219.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--warn-text)">run tests</text>

  <line x1="1030" y1="187.636364" x2="1050" y2="187.636364" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1060" y="82.181818" width="180" height="210.909091" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1150" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--ok-text)">5. GitHub MCP</text>
  <text x="1150" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--ok-text)">open pull request</text>

  <rect x="40" y="345.818182" width="1200" height="274.181818" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="393.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--text)">AI agent orchestrator</text>
  <text x="640" y="435.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--text-muted)">Coordinates every MCP server above — each step feeds the next.</text>
  <text x="640" y="488.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--text-muted)">Developer reviews and approves at each stage — human stays in the loop.</text>
  <text x="640" y="540.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--text-muted)">Total time: minutes instead of hours of manual context-switching.</text>
  <text x="640" y="593.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-faint)">Each arrow above is an MCP tool call the agent decides to make.</text>
</svg>

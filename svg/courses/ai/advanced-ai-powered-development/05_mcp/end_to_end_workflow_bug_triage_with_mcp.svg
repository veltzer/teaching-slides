<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="25.6" markerHeight="214.7217" refX="23.04" refY="107.3609" orient="auto">
      <ns0:polygon points="0,306.7455 8.96,0" fill="#888888" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="106.8247" height="640" fill="#f9f9f9" />
  <ns0:text x="53.4123" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">End-to-End Bug Triage with MCP</ns0:text>
  <ns0:rect x="1.3353" y="128" width="19.7626" height="144" rx="1.3353" fill="#9b59b6" stroke="#6A1B9A" stroke-width="0.2671" />
  <ns0:text x="11.2166" y="176" text-anchor="middle" fill="white" font-size="10" font-weight="bold">1. Jira MCP</ns0:text>
  <ns0:text x="11.2166" y="211.2" text-anchor="middle" fill="#f3e5f5" font-size="10">fetch bug ticket</ns0:text>
  <ns0:text x="11.2166" y="240" text-anchor="middle" fill="#f3e5f5" font-size="10">+ repro steps</ns0:text>
  <ns0:line x1="21.0979" y1="200" x2="23.3679" y2="200" stroke="#888888" stroke-width="0.2671" marker-end="url(#arr)" />
  <ns0:rect x="23.3679" y="128" width="19.7626" height="144" rx="1.3353" fill="#1976d2" stroke="#1565C0" stroke-width="0.2671" />
  <ns0:text x="33.2492" y="176" text-anchor="middle" fill="white" font-size="10" font-weight="bold">2. Postgres MCP</ns0:text>
  <ns0:text x="33.2492" y="211.2" text-anchor="middle" fill="#e3f2fd" font-size="10">query error logs</ns0:text>
  <ns0:text x="33.2492" y="240" text-anchor="middle" fill="#e3f2fd" font-size="10">in time window</ns0:text>
  <ns0:line x1="43.1305" y1="200" x2="45.4005" y2="200" stroke="#888888" stroke-width="0.2671" marker-end="url(#arr)" />
  <ns0:rect x="45.4005" y="128" width="19.7626" height="144" rx="1.3353" fill="#27ae60" stroke="#2E7D32" stroke-width="0.2671" />
  <ns0:text x="55.2818" y="176" text-anchor="middle" fill="white" font-size="10" font-weight="bold">3. GitHub MCP</ns0:text>
  <ns0:text x="55.2818" y="211.2" text-anchor="middle" fill="#d4edda" font-size="10">git blame on</ns0:text>
  <ns0:text x="55.2818" y="240" text-anchor="middle" fill="#d4edda" font-size="10">relevant file</ns0:text>
  <ns0:line x1="65.1631" y1="200" x2="67.4331" y2="200" stroke="#888888" stroke-width="0.2671" marker-end="url(#arr)" />
  <ns0:rect x="67.4331" y="128" width="19.7626" height="144" rx="1.3353" fill="#f39c12" stroke="#E65100" stroke-width="0.2671" />
  <ns0:text x="77.3144" y="176" text-anchor="middle" fill="white" font-size="10" font-weight="bold">4. FS MCP</ns0:text>
  <ns0:text x="77.3144" y="211.2" text-anchor="middle" fill="#ffe0b2" font-size="10">read code, apply</ns0:text>
  <ns0:text x="77.3144" y="240" text-anchor="middle" fill="#ffe0b2" font-size="10">fix, run tests</ns0:text>
  <ns0:line x1="87.1957" y1="200" x2="89.4657" y2="200" stroke="#888888" stroke-width="0.2671" marker-end="url(#arr)" />
  <ns0:rect x="89.4657" y="128" width="16.0237" height="144" rx="1.3353" fill="#27ae60" stroke="#2E7D32" stroke-width="0.2671" />
  <ns0:text x="97.4775" y="176" text-anchor="middle" fill="white" font-size="10" font-weight="bold">5. GitHub</ns0:text>
  <ns0:text x="97.4775" y="204.8" text-anchor="middle" fill="white" font-size="10" font-weight="bold">MCP</ns0:text>
  <ns0:text x="97.4775" y="240" text-anchor="middle" fill="#d4edda" font-size="10">open pull request</ns0:text>
  <ns0:rect x="37.3886" y="328" width="32.0474" height="88" rx="1.3353" fill="#1a237e" stroke="#3949AB" stroke-width="0.2671" />
  <ns0:text x="53.4123" y="371.2" text-anchor="middle" fill="white" font-size="10" font-weight="bold">AI Agent Orchestrator</ns0:text>
  <ns0:text x="53.4123" y="403.2" text-anchor="middle" fill="#bbdefb" font-size="10">coordinates all MCP servers</ns0:text>
  <ns0:line x1="44.0652" y1="328" x2="17.359" y2="272" stroke="#3949AB" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <ns0:line x1="48.0711" y1="328" x2="37.3886" y2="272" stroke="#3949AB" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <ns0:line x1="53.4123" y1="328" x2="58.7536" y2="272" stroke="#3949AB" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <ns0:line x1="58.7536" y1="328" x2="77.4479" y2="272" stroke="#3949AB" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <ns0:line x1="62.7595" y1="328" x2="96.1422" y2="272" stroke="#3949AB" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <ns0:rect x="1.3353" y="464" width="104.1541" height="160" rx="1.3353" fill="#E8EAF6" stroke="#3949AB" stroke-width="0.2003" />
  <ns0:text x="53.4123" y="508.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#3949AB">Key Outcome</ns0:text>
  <ns0:text x="4.0059" y="552" font-size="10" fill="#333">▶ Each step uses a different MCP server — AI orchestrates all of them seamlessly</ns0:text>
  <ns0:text x="4.0059" y="587.2" font-size="10" fill="#333">▶ Developer reviews and approves at each stage — human stays in the loop</ns0:text>
  <ns0:text x="4.0059" y="612.8" font-size="10" fill="#333">▶ Total time: minutes instead of hours of manual context-switching</ns0:text>
</ns0:svg>
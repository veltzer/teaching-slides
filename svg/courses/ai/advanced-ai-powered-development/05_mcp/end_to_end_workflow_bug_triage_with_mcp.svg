<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="220" height="227.450980413303" rx="6.398529432114" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="91.17647115917" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--info-text)">1. Jira MCP</text>
  <text x="150" y="148.039215453672" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--info-text)">fetch bug ticket</text>
  <text x="150" y="187.843137106882" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--info-text)">+ repro steps</text>

  <line x1="270" y1="153.725490745867" x2="290" y2="153.725490745867" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="40" width="220" height="227.450980413303" rx="6.398529432114" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="91.17647115917" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--primary-text)">2. Postgres MCP</text>
  <text x="410" y="148.039215453672" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--primary-text)">query error logs</text>
  <text x="410" y="187.843137106882" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--primary-text)">in time window</text>

  <line x1="530" y1="153.725490745867" x2="550" y2="153.725490745867" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="40" width="220" height="227.450980413303" rx="6.398529432114" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="91.17647115917" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--ok-text)">3. GitHub MCP</text>
  <text x="670" y="148.039215453672" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--ok-text)">git blame</text>
  <text x="670" y="187.843137106882" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--ok-text)">relevant file</text>

  <line x1="790" y1="153.725490745867" x2="810" y2="153.725490745867" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="820" y="40" width="200" height="227.450980413303" rx="6.398529432114" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="91.17647115917" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--warn-text)">4. FS MCP</text>
  <text x="920" y="148.039215453672" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--warn-text)">apply fix</text>
  <text x="920" y="187.843137106882" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--warn-text)">run tests</text>

  <line x1="1030" y1="153.725490745867" x2="1050" y2="153.725490745867" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1060" y="40" width="180" height="227.450980413303" rx="6.398529432114" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="91.17647115917" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--ok-text)">5. GitHub MCP</text>
  <text x="1150" y="165.098039173395" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323580286" fill="var(--ok-text)">open pull request</text>

  <rect x="40" y="324.313725786236" width="1200" height="295.686274213764" rx="6.398529432114" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="375.490195866974" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273892103" font-weight="bold" fill="var(--text)">AI agent orchestrator</text>
  <text x="640" y="420.980391733948" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Coordinates every MCP server above — each step feeds the next.</text>
  <text x="640" y="477.843137106882" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Developer reviews and approves at each stage — human stays in the loop.</text>
  <text x="640" y="534.705882479815" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Total time: minutes instead of hours of manual context-switching.</text>
  <text x="640" y="591.568627852749" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--text-faint)">Each arrow above is an MCP tool call the agent decides to make.</text>
</svg>

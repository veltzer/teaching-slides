  </ns0:defs>
  <ns0:rect width="106.8247" height="640" fill="var(--surface-light)" />
  <ns0:text x="53.4123" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">End-to-End Bug Triage with MCP</ns0:text>
  <ns0:rect x="1.3353" y="128" width="19.7626" height="144" rx="1.3353" fill="var(--info-soft)" stroke="var(--info-dk)" stroke-width="0.2671" />
  <ns0:text x="11.2166" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">1. Jira MCP</ns0:text>
  <ns0:text x="11.2166" y="211.2" text-anchor="middle" fill="var(--info-pale)" font-size="10">fetch bug ticket</ns0:text>
  <ns0:text x="11.2166" y="240" text-anchor="middle" fill="var(--info-pale)" font-size="10">+ repro steps</ns0:text>
  <ns0:line x1="21.0979" y1="200" x2="23.3679" y2="200" stroke="var(--text-faint)" stroke-width="0.2671" marker-end="url(#arr)" />
  <ns0:rect x="23.3679" y="128" width="19.7626" height="144" rx="1.3353" fill="var(--primary-mid)" stroke="var(--primary-dk)" stroke-width="0.2671" />
  <ns0:text x="33.2492" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">2. Postgres MCP</ns0:text>
  <ns0:text x="33.2492" y="211.2" text-anchor="middle" fill="var(--primary-pale)" font-size="10">query error logs</ns0:text>
  <ns0:text x="33.2492" y="240" text-anchor="middle" fill="var(--primary-pale)" font-size="10">in time window</ns0:text>
  <ns0:line x1="43.1305" y1="200" x2="45.4005" y2="200" stroke="var(--text-faint)" stroke-width="0.2671" marker-end="url(#arr)" />
  <ns0:rect x="45.4005" y="128" width="19.7626" height="144" rx="1.3353" fill="var(--ok-soft)" stroke="var(--ok-dk)" stroke-width="0.2671" />
  <ns0:text x="55.2818" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">3. GitHub MCP</ns0:text>
  <ns0:text x="55.2818" y="211.2" text-anchor="middle" fill="var(--ok-pale2)" font-size="10">git blame on</ns0:text>
  <ns0:text x="55.2818" y="240" text-anchor="middle" fill="var(--ok-pale2)" font-size="10">relevant file</ns0:text>
  <ns0:line x1="65.1631" y1="200" x2="67.4331" y2="200" stroke="var(--text-faint)" stroke-width="0.2671" marker-end="url(#arr)" />
  <ns0:rect x="67.4331" y="128" width="19.7626" height="144" rx="1.3353" fill="var(--warn-gold)" stroke="var(--warn-dk)" stroke-width="0.2671" />
  <ns0:text x="77.3144" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">4. FS MCP</ns0:text>
  <ns0:text x="77.3144" y="211.2" text-anchor="middle" fill="var(--warn-lt)" font-size="10">read code, apply</ns0:text>
  <ns0:text x="77.3144" y="240" text-anchor="middle" fill="var(--warn-lt)" font-size="10">fix, run tests</ns0:text>
  <ns0:line x1="87.1957" y1="200" x2="89.4657" y2="200" stroke="var(--text-faint)" stroke-width="0.2671" marker-end="url(#arr)" />
  <ns0:rect x="89.4657" y="128" width="16.0237" height="144" rx="1.3353" fill="var(--ok-soft)" stroke="var(--ok-dk)" stroke-width="0.2671" />
  <ns0:text x="97.4775" y="176" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">5. GitHub</ns0:text>
  <ns0:text x="97.4775" y="204.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">MCP</ns0:text>
  <ns0:text x="97.4775" y="240" text-anchor="middle" fill="var(--ok-pale2)" font-size="10">open pull request</ns0:text>
  <ns0:rect x="37.3886" y="328" width="32.0474" height="88" rx="1.3353" fill="var(--primary-deeper)" stroke="var(--primary-indigo)" stroke-width="0.2671" />
  <ns0:text x="53.4123" y="371.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">AI Agent Orchestrator</ns0:text>
  <ns0:text x="53.4123" y="403.2" text-anchor="middle" fill="var(--primary-lt)" font-size="10">coordinates all MCP servers</ns0:text>
  <ns0:line x1="44.0652" y1="328" x2="17.359" y2="272" stroke="var(--primary-indigo)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <ns0:line x1="48.0711" y1="328" x2="37.3886" y2="272" stroke="var(--primary-indigo)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <ns0:line x1="53.4123" y1="328" x2="58.7536" y2="272" stroke="var(--primary-indigo)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <ns0:line x1="58.7536" y1="328" x2="77.4479" y2="272" stroke="var(--primary-indigo)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <ns0:line x1="62.7595" y1="328" x2="96.1422" y2="272" stroke="var(--primary-indigo)" stroke-width="0.2003" stroke-dasharray="0.5341 0.4006" />
  <ns0:rect x="1.3353" y="464" width="104.1541" height="160" rx="1.3353" fill="var(--info-indigo-lt)" stroke="var(--primary-indigo)" stroke-width="0.2003" />
  <ns0:text x="53.4123" y="508.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-indigo)">Key Outcome</ns0:text>
  <ns0:text x="4.0059" y="552" font-size="10" fill="var(--text-dark)">▶ Each step uses a different MCP server — AI orchestrates all of them seamlessly</ns0:text>
  <ns0:text x="4.0059" y="587.2" font-size="10" fill="var(--text-dark)">▶ Developer reviews and approves at each stage — human stays in the loop</ns0:text>
  <ns0:text x="4.0059" y="612.8" font-size="10" fill="var(--text-dark)">▶ Total time: minutes instead of hours of manual context-switching</ns0:text>
</ns0:svg>
  <ns0:text x="53.4123" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">End-to-End Bug Triage with MCP</ns0:text>
  <ns0:rect x="1.3353" y="128" width="19.7626" height="144" rx="1.3353" fill="#8e44ad" stroke="#6A1B9A" stroke-width="0.2671" />
  <ns0:text x="11.2166" y="176" text-anchor="middle" fill="white" font-size="10" font-weight="bold">1. Jira MCP</ns0:text>
  <ns0:text x="11.2166" y="211.2" text-anchor="middle" fill="#E9D8FD" font-size="10">fetch bug ticket</ns0:text>
  <ns0:text x="11.2166" y="240" text-anchor="middle" fill="#E9D8FD" font-size="10">+ repro steps</ns0:text>

  <ns0:text x="568.8889" y="174.2222" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#555555">Query (real-time)</ns0:text>
  <ns0:rect x="26.6667" y="186.6667" width="160" height="53.3333" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />

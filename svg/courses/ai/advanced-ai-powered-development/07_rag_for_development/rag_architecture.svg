<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="16.239766555034" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Indexing (offline)</text>

  <rect x="40" y="60.603907637655" width="180" height="61.811722912966" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130" y="91.509769094139" text-anchor="middle" font-size="14.209795735654" fill="var(--text)" font-family="Arial, sans-serif">Source docs</text>
  <text x="130" y="112.113676731794" text-anchor="middle" font-size="13.194810325965" fill="var(--text-faint)" font-family="Courier New, monospace">.py .md .txt</text>
  <line x1="222" y1="91.509769094139" x2="265" y2="91.509769094139" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="270" y="60.603907637655" width="180" height="61.811722912966" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="360" y="91.509769094139" text-anchor="middle" font-size="14.209795735654" fill="var(--text)" font-family="Arial, sans-serif">Chunking</text>
  <text x="360" y="112.113676731794" text-anchor="middle" font-size="13.194810325965" fill="var(--text-muted)" font-family="Arial, sans-serif">~500 token chunks</text>
  <line x1="452" y1="91.509769094139" x2="495" y2="91.509769094139" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="500" y="60.603907637655" width="200" height="61.811722912966" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="600" y="91.509769094139" text-anchor="middle" font-size="14.209795735654" fill="var(--text)" font-family="Arial, sans-serif">Embed model</text>
  <text x="600" y="112.113676731794" text-anchor="middle" font-size="13.194810325965" fill="var(--text-muted)" font-family="Courier New, monospace">chunk -&gt; vector</text>
  <line x1="702" y1="91.509769094139" x2="745" y2="91.509769094139" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="750" y="50.301953818828" width="200" height="103.019538188277" rx="8.119883277517" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="850" y="86.358792184725" text-anchor="middle" font-size="16.239766555034" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Vector DB</text>
  <text x="850" y="112.113676731794" text-anchor="middle" font-size="13.194810325965" fill="var(--primary-text)" font-family="Arial, sans-serif">Chroma / Pinecone</text>
  <text x="850" y="135.808170515098" text-anchor="middle" font-size="13.194810325965" fill="var(--primary-text)" font-family="Arial, sans-serif">FAISS / pgvector</text>

  <text x="640" y="189.378330373002" text-anchor="middle" font-size="16.239766555034" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Query (real-time)</text>

  <rect x="40" y="204.831261101243" width="180" height="61.811722912966" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130" y="235.737122557726" text-anchor="middle" font-size="14.209795735654" fill="var(--text)" font-family="Arial, sans-serif">User query</text>
  <text x="130" y="256.341030195382" text-anchor="middle" font-size="13.194810325965" fill="var(--text-faint)" font-family="Courier New, monospace">"how does X?"</text>
  <line x1="222" y1="235.737122557726" x2="265" y2="235.737122557726" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="270" y="204.831261101243" width="200" height="61.811722912966" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="370" y="235.737122557726" text-anchor="middle" font-size="14.209795735654" fill="var(--text)" font-family="Arial, sans-serif">Embed query</text>
  <text x="370" y="256.341030195382" text-anchor="middle" font-size="13.194810325965" fill="var(--text-muted)" font-family="Arial, sans-serif">same model</text>
  <line x1="472" y1="235.737122557726" x2="515" y2="235.737122557726" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="520" y="204.831261101243" width="220" height="61.811722912966" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="630" y="235.737122557726" text-anchor="middle" font-size="14.209795735654" fill="var(--text)" font-family="Arial, sans-serif">Similarity search</text>
  <text x="630" y="256.341030195382" text-anchor="middle" font-size="13.194810325965" fill="var(--text-muted)" font-family="Arial, sans-serif">cosine</text>

  <line x1="850" y1="155.38188277087" x2="850" y2="204.831261101243" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-primary)"/>

  <rect x="750" y="204.831261101243" width="200" height="61.811722912966" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="850" y="235.737122557726" text-anchor="middle" font-size="14.209795735654" fill="var(--text)" font-family="Arial, sans-serif">Top-k chunks</text>
  <text x="850" y="256.341030195382" text-anchor="middle" font-size="13.194810325965" fill="var(--text-muted)" font-family="Arial, sans-serif">most similar</text>
  <line x1="952" y1="235.737122557726" x2="995" y2="235.737122557726" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="1000" y="184.227353463588" width="240" height="118.472468916519" rx="8.119883277517" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="215.133214920071" text-anchor="middle" font-size="16.239766555034" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">LLM</text>
  <text x="1015" y="246.039076376554" font-size="13.194810325965" fill="var(--primary-text)" font-family="Courier New, monospace">context + query</text>
  <text x="1015" y="269.733570159858" font-size="13.194810325965" fill="var(--primary-text)" font-family="Courier New, monospace">-&gt; grounded</text>
  <text x="1015" y="292.397868561279" font-size="13.194810325965" fill="var(--primary-text)" font-family="Courier New, monospace">answer</text>

  <line x1="1120" y1="304.760213143872" x2="1120" y2="349.058614564831" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="1000" y="352.14920071048" width="240" height="56.660746003552" rx="8.119883277517" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="379.964476021314" text-anchor="middle" font-size="14.209795735654" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Grounded answer</text>
  <text x="1120" y="398.507992895204" text-anchor="middle" font-size="12.179824916275" fill="var(--ok-text)" font-family="Arial, sans-serif">cites context</text>

  <rect x="40" y="434.564831261101" width="910" height="185.435168738899" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="495" y="465.470692717584" text-anchor="middle" font-size="16.239766555034" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Why RAG for Dev?</text>

  <rect x="60" y="482.984014209592" width="260" height="123.623445825933" rx="8.119883277517" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="508.738898756661" text-anchor="middle" font-size="14.209795735654" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Codebase context</text>
  <text x="80" y="534.49378330373" font-size="12.179824916275" fill="var(--primary-text)" font-family="Arial, sans-serif">Index your repo</text>
  <text x="80" y="555.097690941386" font-size="12.179824916275" fill="var(--primary-text)" font-family="Arial, sans-serif">AI knows your APIs</text>
  <text x="80" y="586.003552397869" font-size="12.179824916275" fill="var(--primary-text)" font-family="Arial, sans-serif">No fine-tune</text>

  <rect x="345" y="482.984014209592" width="260" height="123.623445825933" rx="8.119883277517" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="508.738898756661" text-anchor="middle" font-size="14.209795735654" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Up-to-date docs</text>
  <text x="365" y="534.49378330373" font-size="12.179824916275" fill="var(--primary-text)" font-family="Arial, sans-serif">Latest library docs</text>
  <text x="365" y="555.097690941386" font-size="12.179824916275" fill="var(--primary-text)" font-family="Arial, sans-serif">Uses v3.x APIs</text>
  <text x="365" y="586.003552397869" font-size="12.179824916275" fill="var(--primary-text)" font-family="Arial, sans-serif">Less hallucination</text>

  <rect x="630" y="482.984014209592" width="290" height="123.623445825933" rx="8.119883277517" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="775" y="508.738898756661" text-anchor="middle" font-size="14.209795735654" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Private knowledge</text>
  <text x="650" y="534.49378330373" font-size="12.179824916275" fill="var(--primary-text)" font-family="Arial, sans-serif">Internal wikis</text>
  <text x="650" y="555.097690941386" font-size="12.179824916275" fill="var(--primary-text)" font-family="Arial, sans-serif">Architecture notes</text>
  <text x="650" y="586.003552397869" font-size="12.179824916275" fill="var(--primary-text)" font-family="Arial, sans-serif">Stays local</text>
</svg>

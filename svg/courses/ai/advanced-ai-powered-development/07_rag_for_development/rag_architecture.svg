<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="59.3333" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text-muted)">Indexing (offline / build time)</text>
  <rect x="68.125" y="72.2223" width="168.75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="152.5" y="101.2223" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text)">Source docs</text>
  <text x="152.5" y="115.7223" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">.py .md .txt</text>
  <line x1="238.7499" y1="96.3889" x2="281.875" y2="96.3889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="283.75" y="72.2223" width="168.75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="368.125" y="98" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text)">Chunking</text>
  <text x="368.125" y="112.5" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">split into ~500 token chunks</text>
  <line x1="454.375" y1="96.3889" x2="497.5" y2="96.3889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="499.375" y="72.2223" width="187.5" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="593.1249" y="98" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text)">Embed model</text>
  <text x="593.1249" y="112.5" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">chunk → vector [0.2, -0.8, ...]</text>
  <line x1="688.75" y1="96.3889" x2="731.875" y2="96.3889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="733.75" y="56.1111" width="187.5" height="88.6111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="827.5" y="88.3333" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)">Vector DB</text>
  <text x="827.5" y="107.6667" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--primary-accent)">Chroma / Pinecone</text>
  <text x="827.5" y="123.7777" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--primary-accent)">FAISS / pgvector</text>
  <text x="827.5" y="138.2777" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">stores vectors + metadata</text>
  <line x1="640" y1="151.1667" x2="640" y2="199.5" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="3.5556 2.6667" />
  <text x="640" y="197.8889" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text-muted)">Query (real-time)</text>
  <rect x="68.125" y="209.1667" width="168.75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="152.5" y="238.1667" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text)">User query</text>
  <text x="152.5" y="252.6667" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">"how does X work?"</text>
  <line x1="238.7499" y1="233.3333" x2="281.875" y2="233.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="283.75" y="209.1667" width="187.5" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="377.5" y="234.9444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text)">Embed query</text>
  <text x="377.5" y="249.4444" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">same embed model</text>
  <line x1="473.125" y1="233.3333" x2="516.25" y2="233.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="518.125" y="209.1667" width="206.25" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="621.25" y="234.9444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text)">Similarity search</text>
  <text x="621.25" y="249.4444" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">cosine / dot product</text>
  <line x1="827.5" y1="146.3333" x2="827.5" y2="209.1667" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-primary)" />
  <line x1="726.25" y1="233.3333" x2="780.625" y2="233.3333" stroke="var(--primary-border)" stroke-width="1.7778" />
  <line x1="780.625" y1="170.5" x2="780.625" y2="233.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="733.75" y="209.1667" width="187.5" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="827.5" y="234.9444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text)">Top-k chunks</text>
  <text x="827.5" y="249.4444" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">most similar returned</text>
  <line x1="923.1249" y1="233.3333" x2="966.25" y2="233.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="968.125" y="185" width="234.375" height="104.7223" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1085.3125" y="217.2223" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)">LLM</text>
  <text x="1085.3125" y="236.5556" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">Prompt =</text>
  <text x="986.875" y="254.2777" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">  context (chunks)</text>
  <text x="986.875" y="270.3889" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">+ user query</text>
  <text x="986.875" y="286.5" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">→ grounded answer</text>
  <line x1="1085.3125" y1="291.3333" x2="1085.3125" y2="338.0556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="968.125" y="339.6667" width="234.375" height="48.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1085.3125" y="365.4444" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--ok-accent)">Grounded answer</text>
  <text x="1085.3125" y="381.5556" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--ok-accent)">cites retrieved context</text>
  <rect x="68.125" y="410.5556" width="862.5" height="161.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="485.3125" y="434.7223" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text)">Why RAG for development?</text>
  <rect x="86.875" y="447.6111" width="243.75" height="104.7223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="208.75" y="466.9444" text-anchor="middle" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)">Codebase context</text>
  <text x="105.625" y="486.2777" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Index your own repo</text>
  <text x="105.625" y="502.3889" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">AI knows your APIs,</text>
  <text x="105.625" y="518.5" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">patterns, conventions</text>
  <text x="105.625" y="537.8333" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">No fine-tuning needed</text>
  <rect x="358.75" y="447.6111" width="243.75" height="104.7223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="480.625" y="466.9444" text-anchor="middle" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)">Up-to-date docs</text>
  <text x="377.5" y="486.2777" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Index latest library docs</text>
  <text x="377.5" y="502.3889" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">AI uses v3.x API, not v2.x</text>
  <text x="377.5" y="518.5" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">from training data</text>
  <text x="377.5" y="537.8333" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Reduces hallucination</text>
  <rect x="630.625" y="447.6111" width="271.875" height="104.7223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="766.5625" y="466.9444" text-anchor="middle" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)">Private knowledge</text>
  <text x="649.375" y="486.2777" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Internal wikis, runbooks</text>
  <text x="649.375" y="502.3889" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Architecture decisions</text>
  <text x="649.375" y="518.5" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Stays private (local embed)</text>
  <text x="649.375" y="537.8333" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Never sent to model provider</text>
</svg>
  <ns0:text x="746.6667" y="231.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#555555">most similar returned</ns0:text>
  <ns0:line x1="837.3333" y1="213.3333" x2="878.2222" y2="213.3333" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:rect x="880" y="160" width="222.2222" height="115.5556" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="991.1111" y="195.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#ffffff">LLM</ns0:text>
  <ns0:text x="991.1111" y="216.8889" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#bbdefb">Prompt =</ns0:text>
  <ns0:text x="897.7778" y="236.4444" font-family="monospace" font-size="11.5556" fill="#90caf9">  context (chunks)</ns0:text>

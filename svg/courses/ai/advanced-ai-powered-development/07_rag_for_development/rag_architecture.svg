  <ns0:text x="991.1111" y="359.1111" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#1b5e20">Grounded answer</ns0:text>
  <ns0:text x="991.1111" y="376.8889" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#2e7d32">cites retrieved context</ns0:text>
  <ns0:rect x="26.6667" y="408.8889" width="817.7778" height="177.7778" rx="5.3333" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="422.2222" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#212121">Why RAG for development?</ns0:text>
  <ns0:rect x="44.4444" y="449.7778" width="231.1111" height="115.5556" rx="3.5556" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="160" y="471.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">Codebase context</ns0:text>
  <ns0:text x="62.2222" y="492.4444" font-family="sans-serif" font-size="11.5556" fill="#555555">Index your own repo</ns0:text>
  <ns0:text x="62.2222" y="510.2222" font-family="sans-serif" font-size="11.5556" fill="#555555">AI knows your APIs,</ns0:text>
  <ns0:text x="62.2222" y="528" font-family="sans-serif" font-size="11.5556" fill="#555555">patterns, conventions</ns0:text>
  <ns0:text x="62.2222" y="549.3333" font-family="sans-serif" font-size="11.5556" fill="#555555">No fine-tuning needed</ns0:text>
  <ns0:rect x="302.2222" y="449.7778" width="231.1111" height="115.5556" rx="3.5556" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="417.7778" y="471.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">Up-to-date docs</ns0:text>
  <ns0:text x="320" y="492.4444" font-family="sans-serif" font-size="11.5556" fill="#555555">Index latest library docs</ns0:text>
  <ns0:text x="320" y="510.2222" font-family="sans-serif" font-size="11.5556" fill="#555555">AI uses v3.x API, not v2.x</ns0:text>
  <ns0:text x="320" y="528" font-family="sans-serif" font-size="11.5556" fill="#555555">from training data</ns0:text>
  <ns0:text x="320" y="549.3333" font-family="sans-serif" font-size="11.5556" fill="#555555">Reduces hallucination</ns0:text>
  <ns0:rect x="560" y="449.7778" width="257.7778" height="115.5556" rx="3.5556" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="688.8889" y="471.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">Private knowledge</ns0:text>
  <ns0:text x="577.7778" y="492.4444" font-family="sans-serif" font-size="11.5556" fill="#555555">Internal wikis, runbooks</ns0:text>
  <ns0:text x="577.7778" y="510.2222" font-family="sans-serif" font-size="11.5556" fill="#555555">Architecture decisions</ns0:text>
  <ns0:text x="577.7778" y="528" font-family="sans-serif" font-size="11.5556" fill="#555555">Stays private (local embed)</ns0:text>
  <ns0:text x="577.7778" y="549.3333" font-family="sans-serif" font-size="11.5556" fill="#555555">Never sent to model provider</ns0:text>
</ns0:svg>
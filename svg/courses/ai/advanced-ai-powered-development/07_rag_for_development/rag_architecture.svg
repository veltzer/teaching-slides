  <ns0:text x="551.1111" y="231.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#555555">cosine / dot product</ns0:text>
  <ns0:line x1="746.6667" y1="117.3333" x2="746.6667" y2="186.6667" stroke="#1565c0" stroke-width="1.7778" stroke-dasharray="3.5556 2.6667" marker-end="url(#arrow-accent)" />

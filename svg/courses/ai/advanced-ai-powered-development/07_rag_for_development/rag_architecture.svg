  <ns0:text x="897.7778" y="272" font-family="monospace" font-size="11.5556" fill="#90caf9">→ grounded answer</ns0:text>
  <ns0:line x1="991.1111" y1="277.3333" x2="991.1111" y2="328.8889" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />

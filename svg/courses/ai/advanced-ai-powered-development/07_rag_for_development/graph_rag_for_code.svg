<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="garrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,82.944 11.7029,0" fill="#666" />
    </marker>
  </defs>
  <rect width="515.999" height="640" fill="var(--surface)" rx="6"/>
  <text x="257.9995" y="56" text-anchor="middle" font-size="12.9" font-weight="bold" fill="var(--primary-accent)">Graph RAG: Dependency-Aware Retrieval</text>
  <text x="257.9995" y="91.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">When a query matches UserService, also retrieve its dependencies</text>
  <circle cx="257.9995" cy="280" r="32.2499" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.29" />
  <text x="257.9995" y="272" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">UserService</text>
  <text x="257.9995" y="300.8" text-anchor="middle" fill="var(--primary-accent)" font-size="10">(query match)</text>
  <circle cx="109.6498" cy="280" r="29.0249" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.29" />
  <text x="109.6498" y="272" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">AuthModule</text>
  <text x="109.6498" y="300.8" text-anchor="middle" fill="var(--ok-accent)" font-size="10">dependency</text>
  <circle cx="257.9995" cy="480" r="29.0249" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.29" />
  <text x="257.9995" y="472" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">UserRepo</text>
  <text x="257.9995" y="500.8" text-anchor="middle" fill="var(--ok-accent)" font-size="10">dependency</text>
  <circle cx="406.3492" cy="280" r="29.0249" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.29" />
  <text x="406.3492" y="272" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">EmailSvc</text>
  <text x="406.3492" y="300.8" text-anchor="middle" fill="var(--ok-accent)" font-size="10">dependency</text>
  <line x1="227.0395" y1="251.2" x2="137.3847" y2="251.2" stroke="var(--text-muted)" stroke-width="1.29" marker-end="url(#garrow)" />
  <line x1="257.9995" y1="360" x2="257.9995" y2="408" stroke="var(--text-muted)" stroke-width="1.29" marker-end="url(#garrow)" />
  <line x1="288.9594" y1="251.2" x2="378.6143" y2="251.2" stroke="var(--text-muted)" stroke-width="1.29" marker-end="url(#garrow)" />
  <text x="180.5997" y="224" text-anchor="middle" font-size="10" fill="var(--ok-accent)">also retrieve</text>
  <text x="335.3993" y="224" text-anchor="middle" font-size="10" fill="var(--ok-accent)">also retrieve</text>
  <text x="296.6994" y="384" font-size="10" fill="var(--ok-accent)">also retrieve</text>
  <rect x="12.9" y="572.8" width="490.1991" height="56" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="257.9995" y="608" text-anchor="middle" font-size="10" fill="var(--text-muted)">Walk import graph 1-2 hops: store edges as metadata {"depends_on": ["AuthModule", "UserRepo"]}</text>
</svg>
  <rect width="515.999" height="640" fill="var(--surface-light)" />
  <text x="257.9995" y="56" text-anchor="middle" font-size="12.9" font-weight="bold" fill="var(--primary-deeper)">Graph RAG: Dependency-Aware Retrieval</text>
  <text x="257.9995" y="91.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">When a query matches UserService, also retrieve its dependencies</text>
  <circle cx="257.9995" cy="280" r="32.2499" fill="var(--primary-bright)" stroke="var(--primary-dk)" stroke-width="1.29" />
  <text x="257.9995" y="272" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">UserService</text>
  <text x="257.9995" y="300.8" text-anchor="middle" fill="var(--primary-pale)" font-size="10">(query match)</text>
  <circle cx="109.6498" cy="280" r="29.0249" fill="var(--ok-soft)" stroke="var(--ok-dk)" stroke-width="1.29" />
  <text x="109.6498" y="272" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">AuthModule</text>
  <text x="109.6498" y="300.8" text-anchor="middle" fill="var(--ok-pale2)" font-size="10">dependency</text>
  <circle cx="257.9995" cy="480" r="29.0249" fill="var(--ok-soft)" stroke="var(--ok-dk)" stroke-width="1.29" />
  <text x="257.9995" y="472" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">UserRepo</text>
  <text x="257.9995" y="500.8" text-anchor="middle" fill="var(--ok-pale2)" font-size="10">dependency</text>
  <circle cx="406.3492" cy="280" r="29.0249" fill="var(--ok-soft)" stroke="var(--ok-dk)" stroke-width="1.29" />
  <text x="406.3492" y="272" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">EmailSvc</text>
  <text x="406.3492" y="300.8" text-anchor="middle" fill="var(--ok-pale2)" font-size="10">dependency</text>
  <line x1="227.0395" y1="251.2" x2="137.3847" y2="251.2" stroke="var(--text-mid)" stroke-width="1.29" marker-end="url(#garrow)" />
  <line x1="257.9995" y1="360" x2="257.9995" y2="408" stroke="var(--text-mid)" stroke-width="1.29" marker-end="url(#garrow)" />
  <line x1="288.9594" y1="251.2" x2="378.6143" y2="251.2" stroke="var(--text-mid)" stroke-width="1.29" marker-end="url(#garrow)" />
  <text x="180.5997" y="224" text-anchor="middle" font-size="10" fill="var(--ok-dk)">also retrieve</text>
  <text x="335.3993" y="224" text-anchor="middle" font-size="10" fill="var(--ok-dk)">also retrieve</text>
  <text x="296.6994" y="384" font-size="10" fill="var(--ok-dk)">also retrieve</text>
  <rect x="12.9" y="572.8" width="490.1991" height="56" rx="5.16" fill="var(--info-indigo-lt)" stroke="var(--primary-indigo)" stroke-width="0.9675" />
  <text x="257.9995" y="608" text-anchor="middle" font-size="10" fill="var(--text-muted)">Walk import graph 1-2 hops: store edges as metadata {"depends_on": ["AuthModule", "UserRepo"]}</text>

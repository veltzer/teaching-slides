<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="garrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,82.944 11.7029,0" fill="#666" />
    </marker>
  </defs>
  <rect width="468" height="580" fill="var(--surface)" rx="6.0024" x="406" y="40"/>
  <text x="639.9999" y="90.75" text-anchor="middle" font-size="11.6953" font-weight="bold" fill="var(--primary-accent)">Graph RAG: Dependency-Aware Retrieval</text>
  <text x="639.9999" y="122.65" text-anchor="middle" font-size="10.004" fill="var(--text-muted)">When a query matches UserService, also retrieve its dependencies</text>
  <circle cx="639.9999" cy="293.75" r="29.2382" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.29" />
  <text x="639.9999" y="286.5" text-anchor="middle" fill="var(--bg)" font-size="10.004" font-weight="bold">UserService</text>
  <text x="639.9999" y="312.6" text-anchor="middle" fill="var(--primary-accent)" font-size="10.004">(query match)</text>
  <circle cx="505.45" cy="293.75" r="26.3144" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.29" />
  <text x="505.45" y="286.5" text-anchor="middle" fill="var(--bg)" font-size="10.004" font-weight="bold">AuthModule</text>
  <text x="505.45" y="312.6" text-anchor="middle" fill="var(--ok-accent)" font-size="10.004">dependency</text>
  <circle cx="639.9999" cy="475" r="26.3144" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.29" />
  <text x="639.9999" y="467.75" text-anchor="middle" fill="var(--bg)" font-size="10.004" font-weight="bold">UserRepo</text>
  <text x="639.9999" y="493.85" text-anchor="middle" fill="var(--ok-accent)" font-size="10.004">dependency</text>
  <circle cx="774.5499" cy="293.75" r="26.3144" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.29" />
  <text x="774.5499" y="286.5" text-anchor="middle" fill="var(--bg)" font-size="10.004" font-weight="bold">EmailSvc</text>
  <text x="774.5499" y="312.6" text-anchor="middle" fill="var(--ok-accent)" font-size="10.004">dependency</text>
  <line x1="611.9199" y1="267.65" x2="530.6049" y2="267.65" stroke="var(--text-muted)" stroke-width="1.29" marker-end="url(#garrow)" />
  <line x1="639.9999" y1="366.25" x2="639.9999" y2="409.75" stroke="var(--text-muted)" stroke-width="1.29" marker-end="url(#garrow)" />
  <line x1="668.0799" y1="267.65" x2="749.395" y2="267.65" stroke="var(--text-muted)" stroke-width="1.29" marker-end="url(#garrow)" />
  <text x="569.8" y="243" text-anchor="middle" font-size="10.004" fill="var(--ok-accent)">also retrieve</text>
  <text x="710.1999" y="243" text-anchor="middle" font-size="10.004" fill="var(--ok-accent)">also retrieve</text>
  <text x="675.0999" y="388" font-size="10.004" fill="var(--ok-accent)">also retrieve</text>
  <rect x="417.7" y="559.1" width="444.6" height="50.75" rx="6.0024" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="639.9999" y="591" text-anchor="middle" font-size="10.004" fill="var(--text-muted)">Walk import graph 1-2 hops: store edges as metadata {"depends_on": ["AuthModule", "UserRepo"]}</text>
</svg>
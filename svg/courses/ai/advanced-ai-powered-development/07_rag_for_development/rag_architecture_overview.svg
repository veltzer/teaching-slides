<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="568.8889" height="640" fill="var(--surface)" rx="6"/>
  <text x="284.4444" y="56" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">RAG Architecture for Code</text>
  <rect x="14.2222" y="96" width="540.4444" height="48" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="284.4444" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Ingestion Pipeline (offline)</text>
  <rect x="21.3333" y="160" width="85.3333" height="96" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="64" y="203.2" text-anchor="middle" fill="var(--bg)" font-size="10">Codebase</text>
  <text x="64" y="235.2" text-anchor="middle" fill="var(--info-accent)" font-size="10">source files</text>
  <line x1="106.6667" y1="208" x2="131.5556" y2="208" stroke="var(--text)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="131.5556" y="160" width="85.3333" height="96" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="174.2222" y="203.2" text-anchor="middle" fill="var(--bg)" font-size="10">Chunking</text>
  <text x="174.2222" y="235.2" text-anchor="middle" fill="var(--warn-accent)" font-size="10">AST-based</text>
  <line x1="216.8889" y1="208" x2="241.7778" y2="208" stroke="var(--text)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="241.7778" y="160" width="92.4444" height="96" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="288" y="203.2" text-anchor="middle" fill="var(--bg)" font-size="10">Embedding</text>
  <text x="288" y="235.2" text-anchor="middle" fill="var(--primary-accent)" font-size="10">voyage-code-3</text>
  <line x1="334.2222" y1="208" x2="359.1111" y2="208" stroke="var(--text)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="359.1111" y="160" width="85.3333" height="96" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="401.7778" y="203.2" text-anchor="middle" fill="var(--bg)" font-size="10">Vector DB</text>
  <text x="401.7778" y="235.2" text-anchor="middle" fill="var(--ok-accent)" font-size="10">ChromaDB</text>
  <rect x="14.2222" y="320" width="540.4444" height="48" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="284.4444" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Query Pipeline (real-time)</text>
  <rect x="21.3333" y="384" width="85.3333" height="96" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="64" y="427.2" text-anchor="middle" fill="var(--bg)" font-size="10">User Query</text>
  <text x="64" y="459.2" text-anchor="middle" fill="var(--primary-accent)" font-size="10">"fix the auth bug"</text>
  <line x1="106.6667" y1="432" x2="131.5556" y2="432" stroke="var(--text)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="131.5556" y="384" width="85.3333" height="96" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="174.2222" y="427.2" text-anchor="middle" fill="var(--bg)" font-size="10">Embed</text>
  <text x="174.2222" y="459.2" text-anchor="middle" fill="var(--warn-accent)" font-size="10">query vector</text>
  <line x1="216.8889" y1="432" x2="241.7778" y2="432" stroke="var(--text)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="241.7778" y="384" width="92.4444" height="96" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="288" y="427.2" text-anchor="middle" fill="var(--bg)" font-size="10">Retrieve</text>
  <text x="288" y="459.2" text-anchor="middle" fill="var(--ok-accent)" font-size="10">top-K chunks</text>
  <line x1="334.2222" y1="432" x2="359.1111" y2="432" stroke="var(--text)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="359.1111" y="384" width="85.3333" height="96" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="401.7778" y="427.2" text-anchor="middle" fill="var(--bg)" font-size="10">Re-rank</text>
  <text x="401.7778" y="459.2" text-anchor="middle" fill="var(--warn-accent)" font-size="10">cross-encoder</text>
  <line x1="444.4444" y1="432" x2="469.3333" y2="432" stroke="var(--text)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="469.3333" y="384" width="78.2222" height="96" rx="6" fill="var(--danger-accent)" stroke="var(--danger-border)" stroke-width="1.0667" />
  <text x="508.4444" y="427.2" text-anchor="middle" fill="var(--bg)" font-size="10">LLM</text>
  <text x="508.4444" y="459.2" text-anchor="middle" fill="var(--danger-accent)" font-size="10">generates answer</text>
  <path d="M 401.7778 256 Q 401.7778 304 288 384" fill="none" stroke="var(--ok-border)" stroke-width="1.0667" stroke-dasharray="3.5556 2.1333" marker-end="url(#arrow)" />
  <rect x="14.2222" y="536" width="540.4444" height="88" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="284.4444" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">Index once, query many times — incremental updates via git diff</text>
  <text x="284.4444" y="604.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">Code-specific embeddings outperform general models by 15-30% on code retrieval</text>
</svg>
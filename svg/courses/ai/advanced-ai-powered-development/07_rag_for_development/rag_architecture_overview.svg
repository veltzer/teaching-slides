  <line x1="106.6667" y1="432" x2="131.5556" y2="432" stroke="var(--text-dark)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="131.5556" y="384" width="85.3333" height="96" rx="5.6889" fill="var(--warn-gold)" stroke="var(--warn-dk)" stroke-width="1.0667" />

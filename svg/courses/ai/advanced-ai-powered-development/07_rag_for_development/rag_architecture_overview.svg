  <line x1="216.8889" y1="432" x2="241.7778" y2="432" stroke="var(--text-dark)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="241.7778" y="384" width="92.4444" height="96" rx="5.6889" fill="var(--ok-soft)" stroke="var(--ok-dk)" stroke-width="1.0667" />

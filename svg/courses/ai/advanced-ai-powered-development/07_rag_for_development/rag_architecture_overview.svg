<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="515.5556" height="580" fill="var(--surface)" rx="6" x="382.2222" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="12.8889" font-weight="bold" fill="var(--primary-accent)">RAG Architecture for Code</text>
  <rect x="395.1111" y="127" width="489.7777" height="43.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Ingestion Pipeline (offline)</text>
  <rect x="401.5555" y="185" width="77.3333" height="87" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="440.2222" y="224.15" text-anchor="middle" fill="var(--bg)" font-size="10">Codebase</text>
  <text x="440.2222" y="253.15" text-anchor="middle" fill="var(--info-accent)" font-size="10">source files</text>
  <line x1="478.8889" y1="228.5" x2="501.4445" y2="228.5" stroke="var(--text)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="501.4445" y="185" width="77.3333" height="87" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="540.1111" y="224.15" text-anchor="middle" fill="var(--bg)" font-size="10">Chunking</text>
  <text x="540.1111" y="253.15" text-anchor="middle" fill="var(--warn-accent)" font-size="10">AST-based</text>
  <line x1="578.7778" y1="228.5" x2="601.3333" y2="228.5" stroke="var(--text)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="601.3333" y="185" width="83.7777" height="87" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="643.2222" y="224.15" text-anchor="middle" fill="var(--bg)" font-size="10">Embedding</text>
  <text x="643.2222" y="253.15" text-anchor="middle" fill="var(--primary-accent)" font-size="10">voyage-code-3</text>
  <line x1="685.1111" y1="228.5" x2="707.6667" y2="228.5" stroke="var(--text)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="707.6667" y="185" width="77.3333" height="87" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="746.3333" y="224.15" text-anchor="middle" fill="var(--bg)" font-size="10">Vector DB</text>
  <text x="746.3333" y="253.15" text-anchor="middle" fill="var(--ok-accent)" font-size="10">ChromaDB</text>
  <rect x="395.1111" y="330" width="489.7777" height="43.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="359" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Query Pipeline (real-time)</text>
  <rect x="401.5555" y="388" width="77.3333" height="87" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="440.2222" y="427.15" text-anchor="middle" fill="var(--bg)" font-size="10">User Query</text>
  <text x="440.2222" y="456.15" text-anchor="middle" fill="var(--primary-accent)" font-size="10">"fix the auth bug"</text>
  <line x1="478.8889" y1="431.5" x2="501.4445" y2="431.5" stroke="var(--text)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="501.4445" y="388" width="77.3333" height="87" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="540.1111" y="427.15" text-anchor="middle" fill="var(--bg)" font-size="10">Embed</text>
  <text x="540.1111" y="456.15" text-anchor="middle" fill="var(--warn-accent)" font-size="10">query vector</text>
  <line x1="578.7778" y1="431.5" x2="601.3333" y2="431.5" stroke="var(--text)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="601.3333" y="388" width="83.7777" height="87" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="643.2222" y="427.15" text-anchor="middle" fill="var(--bg)" font-size="10">Retrieve</text>
  <text x="643.2222" y="456.15" text-anchor="middle" fill="var(--ok-accent)" font-size="10">top-K chunks</text>
  <line x1="685.1111" y1="431.5" x2="707.6667" y2="431.5" stroke="var(--text)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="707.6667" y="388" width="77.3333" height="87" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="746.3333" y="427.15" text-anchor="middle" fill="var(--bg)" font-size="10">Re-rank</text>
  <text x="746.3333" y="456.15" text-anchor="middle" fill="var(--warn-accent)" font-size="10">cross-encoder</text>
  <line x1="785" y1="431.5" x2="807.5555" y2="431.5" stroke="var(--text)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="807.5555" y="388" width="70.8889" height="87" rx="6" fill="var(--danger-accent)" stroke="var(--danger-border)" stroke-width="1.0667" />
  <text x="843" y="427.15" text-anchor="middle" fill="var(--bg)" font-size="10">LLM</text>
  <text x="843" y="456.15" text-anchor="middle" fill="var(--danger-accent)" font-size="10">generates answer</text>
  <path d="M 746.3333 272 Q 746.3333 315.5 643.2222 388" fill="none" stroke="var(--ok-border)" stroke-width="1.0667" stroke-dasharray="3.5556 2.1333" marker-end="url(#arrow)" />
  <rect x="395.1111" y="525.75" width="489.7777" height="79.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="559.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">Index once, query many times — incremental updates via git diff</text>
  <text x="640" y="588.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">Code-specific embeddings outperform general models by 15-30% on code retrieval</text>
</svg>
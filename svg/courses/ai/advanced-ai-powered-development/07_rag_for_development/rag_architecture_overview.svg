<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="50" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Ingestion Pipeline (offline, runs on change)</text>

  <rect x="40" y="110" width="280" height="180" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Codebase</text>
  <text x="180" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">source files,</text>
  <text x="180" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">docs, issues</text>

  <rect x="340" y="110" width="280" height="180" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Chunking</text>
  <text x="480" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">AST-based splits,</text>
  <text x="480" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">respects functions</text>

  <rect x="640" y="110" width="280" height="180" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Embedding</text>
  <text x="780" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">code-tuned model</text>
  <text x="780" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">(voyage-code-3)</text>

  <rect x="940" y="110" width="300" height="180" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Vector DB</text>
  <text x="1090" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">ChromaDB, pgvector,</text>
  <text x="1090" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Pinecone</text>

  <line x1="320" y1="200" x2="338" y2="200" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="200" x2="638" y2="200" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="200" x2="938" y2="200" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="310" width="1200" height="50" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Query Pipeline (real-time, runs per request)</text>

  <rect x="40" y="380" width="220" height="180" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Query</text>
  <text x="150" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">"fix auth bug"</text>

  <rect x="280" y="380" width="220" height="180" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Embed</text>
  <text x="390" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">query vector</text>

  <rect x="520" y="380" width="220" height="180" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Retrieve</text>
  <text x="630" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">top-K chunks</text>

  <rect x="760" y="380" width="220" height="180" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Re-rank</text>
  <text x="870" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">cross-encoder</text>

  <rect x="1000" y="380" width="240" height="180" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">LLM</text>
  <text x="1120" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">grounded answer</text>

  <line x1="260" y1="470" x2="278" y2="470" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="470" x2="518" y2="470" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="470" x2="758" y2="470" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="470" x2="998" y2="470" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 1090 290 C 1090 335, 630 335, 630 378" fill="none" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-ok)"/>

  <rect x="40" y="580" width="1200" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Index once, query many times. Incremental updates via git diff. Code embeddings beat general models by 15-30%.</text>
</svg>

  <line x1="334.2222" y1="208" x2="359.1111" y2="208" stroke="var(--text-dark)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="359.1111" y="160" width="85.3333" height="96" rx="5.6889" fill="var(--ok-soft)" stroke="var(--ok-dk)" stroke-width="1.0667" />

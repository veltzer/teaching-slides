  <ns0:text x="284.4444" y="572.8" text-anchor="middle" font-size="10" fill="#555">Index once, query many times — incremental updates via git diff</ns0:text>
  <ns0:text x="284.4444" y="604.8" text-anchor="middle" font-size="10" fill="#555">Code-specific embeddings outperform general models by 15-30% on code retrieval</ns0:text>

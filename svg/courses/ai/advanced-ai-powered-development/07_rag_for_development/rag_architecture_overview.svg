  <line x1="444.4444" y1="432" x2="469.3333" y2="432" stroke="var(--text-dark)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <rect x="469.3333" y="384" width="78.2222" height="96" rx="5.6889" fill="var(--danger-dk)" stroke="var(--danger-dk)" stroke-width="1.0667" />
  <text x="508.4444" y="427.2" text-anchor="middle" fill="var(--bg)" font-size="10">LLM</text>

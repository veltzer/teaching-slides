  <path d="M 401.7778 256 Q 401.7778 304 288 384" fill="none" stroke="var(--ok-dk)" stroke-width="1.0667" stroke-dasharray="3.5556 2.1333" marker-end="url(#arrow)" />
  <rect x="14.2222" y="536" width="540.4444" height="88" rx="5.6889" fill="var(--warn-pale3)" stroke="var(--warn-amber)" stroke-width="1.0667" />
  <text x="284.4444" y="572.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">Index once, query many times — incremental updates via git diff</text>

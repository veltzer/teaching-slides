<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect width="330.2393" height="640" fill="#f8f9fa" />
  <ns0:text x="165.1197" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Context Window Budget Allocation for RAG</ns0:text>
  <ns0:rect x="8.256" y="104" width="313.7274" height="120" rx="3.3024" fill="#EEE" stroke="#333" stroke-width="0.6192" />
  <ns0:rect x="9.0816" y="107.2" width="39.2159" height="113.6" rx="2.4768" fill="#e74c3c" />
  <ns0:text x="28.8959" y="156.8" text-anchor="middle" fill="white" font-size="10" font-weight="bold">System</ns0:text>
  <ns0:text x="28.8959" y="185.6" text-anchor="middle" fill="#FADBD8" font-size="10">~10-15%</ns0:text>
  <ns0:rect x="49.1231" y="107.2" width="165.1197" height="113.6" rx="2.4768" fill="#3498db" />
  <ns0:text x="131.683" y="156.8" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Retrieved Code Chunks</ns0:text>
  <ns0:text x="131.683" y="185.6" text-anchor="middle" fill="#D6EAF8" font-size="10">~50-60% of budget</ns0:text>
  <ns0:rect x="215.0684" y="107.2" width="41.2799" height="113.6" rx="2.4768" fill="#f39c12" />
  <ns0:text x="235.7083" y="156.8" text-anchor="middle" fill="white" font-size="10" font-weight="bold">User</ns0:text>
  <ns0:text x="235.7083" y="185.6" text-anchor="middle" fill="#FDE68A" font-size="10">~5-10%</ns0:text>
  <ns0:rect x="257.1739" y="107.2" width="63.9839" height="113.6" rx="2.4768" fill="#27ae60" />
  <ns0:text x="288.9594" y="156.8" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Response</ns0:text>
  <ns0:text x="288.9594" y="185.6" text-anchor="middle" fill="#D5F5E3" font-size="10">~20-30% reserved</ns0:text>
  <ns0:text x="165.1197" y="272" text-anchor="middle" font-size="10" fill="#555">Total context window (128K-200K tokens)</ns0:text>
  <ns0:rect x="8.256" y="312" width="313.7274" height="304" rx="4.128" fill="#E8EAF6" stroke="#3949AB" stroke-width="0.6192" />
  <ns0:text x="165.1197" y="360" text-anchor="middle" font-size="10" font-weight="bold" fill="#3949AB">Budget Allocation Rules</ns0:text>
  <ns0:rect x="16.512" y="384" width="140.3517" height="88" rx="3.3024" fill="#FFCDD2" stroke="#C62828" />
  <ns0:text x="86.6878" y="420.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Reserve 10-15% for system prompt</ns0:text>
  <ns0:text x="86.6878" y="456" text-anchor="middle" font-size="10" fill="#333">instructions, persona, output format</ns0:text>
  <ns0:rect x="173.3757" y="384" width="140.3517" height="88" rx="3.3024" fill="#BBDEFB" stroke="#1565C0" />
  <ns0:text x="243.5515" y="420.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">Allocate 50-60% for retrieved chunks</ns0:text>
  <ns0:text x="243.5515" y="456" text-anchor="middle" font-size="10" fill="#333">code files, functions, documentation</ns0:text>
  <ns0:rect x="16.512" y="488" width="140.3517" height="88" rx="3.3024" fill="#FFF9C4" stroke="#F9A825" />
  <ns0:text x="86.6878" y="524.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">Reserve 5-10% for query + history</ns0:text>
  <ns0:text x="86.6878" y="556.8" text-anchor="middle" font-size="10" fill="#333">user question, conversation turns</ns0:text>
  <ns0:rect x="173.3757" y="488" width="140.3517" height="88" rx="3.3024" fill="#C8E6C9" stroke="#2E7D32" />
  <ns0:text x="243.5515" y="524.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Leave 20-30% for model response</ns0:text>
  <ns0:text x="243.5515" y="556.8" text-anchor="middle" font-size="10" fill="#333">truncate lowest-ranked chunks first</ns0:text>
</ns0:svg>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:rect width="330.2393" height="640" fill="var(--surface-light)" />
  <ns0:text x="165.1197" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-deeper)">Context Window Budget Allocation for RAG</ns0:text>
  <ns0:rect x="8.256" y="104" width="313.7274" height="120" rx="3.3024" fill="var(--surface-alt)" stroke="var(--text-dark)" stroke-width="0.6192" />
  <ns0:rect x="9.0816" y="107.2" width="39.2159" height="113.6" rx="2.4768" fill="var(--danger-light)" />
  <ns0:text x="28.8959" y="156.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">System</ns0:text>
  <ns0:text x="28.8959" y="185.6" text-anchor="middle" fill="var(--danger-pale2)" font-size="10">~10-15%</ns0:text>
  <ns0:rect x="49.1231" y="107.2" width="165.1197" height="113.6" rx="2.4768" fill="var(--primary-soft)" />
  <ns0:text x="131.683" y="156.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Retrieved Code Chunks</ns0:text>
  <ns0:text x="131.683" y="185.6" text-anchor="middle" fill="var(--primary-pale)" font-size="10">~50-60% of budget</ns0:text>
  <ns0:rect x="215.0684" y="107.2" width="41.2799" height="113.6" rx="2.4768" fill="var(--warn-gold)" />
  <ns0:text x="235.7083" y="156.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">User</ns0:text>
  <ns0:text x="235.7083" y="185.6" text-anchor="middle" fill="var(--warn-tint)" font-size="10">~5-10%</ns0:text>
  <ns0:rect x="257.1739" y="107.2" width="63.9839" height="113.6" rx="2.4768" fill="var(--ok-soft)" />
  <ns0:text x="288.9594" y="156.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Response</ns0:text>
  <ns0:text x="288.9594" y="185.6" text-anchor="middle" fill="var(--ok-pale2)" font-size="10">~20-30% reserved</ns0:text>
  <ns0:text x="165.1197" y="272" text-anchor="middle" font-size="10" fill="var(--text-muted)">Total context window (128K-200K tokens)</ns0:text>
  <ns0:rect x="8.256" y="312" width="313.7274" height="304" rx="4.128" fill="var(--info-indigo-lt)" stroke="var(--primary-indigo)" stroke-width="0.6192" />
  <ns0:text x="165.1197" y="360" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-indigo)">Budget Allocation Rules</ns0:text>
  <ns0:rect x="16.512" y="384" width="140.3517" height="88" rx="3.3024" fill="var(--danger-lt)" stroke="var(--danger-dk)" />
  <ns0:text x="86.6878" y="420.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-dk)">Reserve 10-15% for system prompt</ns0:text>
  <ns0:text x="86.6878" y="456" text-anchor="middle" font-size="10" fill="var(--text-dark)">instructions, persona, output format</ns0:text>
  <ns0:rect x="173.3757" y="384" width="140.3517" height="88" rx="3.3024" fill="var(--primary-lt)" stroke="var(--primary-dk)" />
  <ns0:text x="243.5515" y="420.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-dk)">Allocate 50-60% for retrieved chunks</ns0:text>
  <ns0:text x="243.5515" y="456" text-anchor="middle" font-size="10" fill="var(--text-dark)">code files, functions, documentation</ns0:text>
  <ns0:rect x="16.512" y="488" width="140.3517" height="88" rx="3.3024" fill="var(--warn-pale4)" stroke="var(--warn-amber)" />
  <ns0:text x="86.6878" y="524.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-dk)">Reserve 5-10% for query + history</ns0:text>
  <ns0:text x="86.6878" y="556.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">user question, conversation turns</ns0:text>
  <ns0:rect x="173.3757" y="488" width="140.3517" height="88" rx="3.3024" fill="var(--ok-lt)" stroke="var(--ok-dk)" />
  <ns0:text x="243.5515" y="524.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-dk)">Leave 20-30% for model response</ns0:text>
  <ns0:text x="243.5515" y="556.8" text-anchor="middle" font-size="10" fill="var(--text-dark)">truncate lowest-ranked chunks first</ns0:text>
</ns0:svg>
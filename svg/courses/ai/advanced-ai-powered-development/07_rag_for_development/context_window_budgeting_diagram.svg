<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="299.2794" height="580" fill="var(--surface)" rx="6" x="490.3603" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Context Window Budget Allocation for RAG</text>
  <rect x="497.8423" y="134.25" width="284.3155" height="108.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="498.5905" y="137.15" width="35.5394" height="102.95" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="516.5472" y="182.1" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">System</text>
  <text x="516.5472" y="208.2" text-anchor="middle" fill="var(--danger-accent)" font-size="10">~10-15%</text>
  <rect x="534.8781" y="137.15" width="149.6397" height="102.95" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="609.698" y="182.1" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Retrieved Code Chunks</text>
  <text x="609.698" y="208.2" text-anchor="middle" fill="var(--primary-accent)" font-size="10">~50-60% of budget</text>
  <rect x="685.2661" y="137.15" width="37.4099" height="102.95" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="703.971" y="182.1" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">User</text>
  <text x="703.971" y="208.2" text-anchor="middle" fill="var(--warn-accent)" font-size="10">~5-10%</text>
  <rect x="723.4242" y="137.15" width="57.9854" height="102.95" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="752.2298" y="182.1" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Response</text>
  <text x="752.2298" y="208.2" text-anchor="middle" fill="var(--ok-accent)" font-size="10">~20-30% reserved</text>
  <text x="640" y="286.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">Total context window (128K-200K tokens)</text>
  <rect x="497.8423" y="322.75" width="284.3155" height="275.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="366.25" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Budget Allocation Rules</text>
  <rect x="505.3243" y="388" width="127.1937" height="79.75" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="568.9211" y="421.35" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Reserve 10-15% for system prompt</text>
  <text x="568.9211" y="453.25" text-anchor="middle" font-size="10" fill="var(--text)">instructions, persona, output format</text>
  <rect x="647.482" y="388" width="127.1937" height="79.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="711.0789" y="421.35" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Allocate 50-60% for retrieved chunks</text>
  <text x="711.0789" y="453.25" text-anchor="middle" font-size="10" fill="var(--text)">code files, functions, documentation</text>
  <rect x="505.3243" y="482.25" width="127.1937" height="79.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="568.9211" y="515.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Reserve 5-10% for query + history</text>
  <text x="568.9211" y="544.6" text-anchor="middle" font-size="10" fill="var(--text)">user question, conversation turns</text>
  <rect x="647.482" y="482.25" width="127.1937" height="79.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="711.0789" y="515.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Leave 20-30% for model response</text>
  <text x="711.0789" y="544.6" text-anchor="middle" font-size="10" fill="var(--text)">truncate lowest-ranked chunks first</text>
</svg>
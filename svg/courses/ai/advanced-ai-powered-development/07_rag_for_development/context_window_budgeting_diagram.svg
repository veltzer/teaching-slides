<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.424811740757" font-weight="bold" fill="var(--text)">Context Window Budget (RAG)</text>

  <rect x="40" y="81.428571428571" width="150" height="134.642857142857" rx="6.106202935189" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="190" y="81.428571428571" width="660" height="134.642857142857" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="850" y="81.428571428571" width="90" height="134.642857142857" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="940" y="81.428571428571" width="300" height="134.642857142857" rx="6.106202935189" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

  <text x="115" y="133.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283207827171" font-weight="bold" fill="var(--danger-text)">System</text>
  <text x="115" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--danger-text)">prompt</text>
  <text x="115" y="195.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.30090831637" font-weight="bold" fill="var(--danger-text)">10-15%</text>

  <text x="520" y="133.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.336309294766" font-weight="bold" fill="var(--primary-text)">Retrieved Chunks</text>
  <text x="520" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--primary-text)">ranked by similarity</text>
  <text x="520" y="195.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.336309294766" font-weight="bold" fill="var(--primary-text)">50-60%</text>

  <text x="895" y="133.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--warn-text)">Query</text>
  <text x="895" y="195.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--warn-text)">5-10%</text>

  <text x="1090" y="133.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.336309294766" font-weight="bold" fill="var(--ok-text)">Response</text>
  <text x="1090" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--ok-text)">reserved headroom</text>
  <text x="1090" y="195.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.336309294766" font-weight="bold" fill="var(--ok-text)">20-30%</text>

  <text x="640" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--text-muted)">Total: 128K - 200K tokens</text>

  <text x="640" y="298.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389410762361" font-weight="bold" fill="var(--info-accent)">Budget Rules</text>

  <rect x="40" y="324.821428571429" width="590" height="139.821428571429" rx="6.106202935189" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="60" y="361.071428571429" font-family="Arial, sans-serif" font-size="16.283207827171" font-weight="bold" fill="var(--danger-accent)">System prompt: 10-15%</text>
  <text x="60" y="392.142857142857" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--text-muted)">Instructions, persona, format</text>
  <text x="60" y="421.142857142857" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--text-muted)">Stable across turns</text>

  <rect x="650" y="324.821428571429" width="590" height="139.821428571429" rx="6.106202935189" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="670" y="361.071428571429" font-family="Arial, sans-serif" font-size="16.283207827171" font-weight="bold" fill="var(--primary-accent)">Chunks: 50-60%</text>
  <text x="670" y="392.142857142857" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--text-muted)">Code / docs from vector store</text>
  <text x="670" y="421.142857142857" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--text-muted)">Retrieval quality matters</text>

  <rect x="40" y="480.178571428571" width="590" height="139.821428571429" rx="6.106202935189" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="60" y="516.428571428572" font-family="Arial, sans-serif" font-size="16.283207827171" font-weight="bold" fill="var(--warn-accent)">Query + history: 5-10%</text>
  <text x="60" y="547.5" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--text-muted)">Question, recent turns</text>
  <text x="60" y="576.5" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--text-muted)">Summarize old turns</text>

  <rect x="650" y="480.178571428571" width="590" height="139.821428571429" rx="6.106202935189" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="670" y="516.428571428572" font-family="Arial, sans-serif" font-size="16.283207827171" font-weight="bold" fill="var(--ok-accent)">Response: 20-30%</text>
  <text x="670" y="547.5" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--text-muted)">Hard output limit</text>
  <text x="670" y="576.5" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--text-muted)">Truncate low-rank chunks</text>
</svg>

  <rect x="133.747" y="3952.8" width="1136.849" height="712.8" rx="26.7494" fill="#FFF9C4" stroke="#F9A825" />
  <text x="702.1714" y="4250.88" text-anchor="middle" font-size="43.4677" font-weight="bold" fill="#E65100">Reserve 5-10% for query + history</text>
  <text x="702.1714" y="4510.08" text-anchor="middle" font-size="40.1242" fill="#333">user question, conversation turns</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Step 1: Error -->
  <rect x="40" y="40" width="231.578947" height="189.387755308205" rx="8.92984989324" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.789474" y="99.183673744273" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.557086411817" font-weight="bold" fill="var(--danger-text)">1. Error Occurs</text>
  <text x="155.789474" y="152.448979328405" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.859698727023" fill="var(--danger-text)">test fails</text>
  <text x="155.789474" y="187.959183799459" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.859698727023" fill="var(--danger-text)">tool returns error</text>

  <line x1="282.105263" y1="134.693878215327" x2="345.263158" y2="134.693878215327" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: Read -->
  <rect x="355.789474" y="40" width="231.578947" height="189.387755308205" rx="8.92984989324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="471.578947" y="99.183673744273" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.557086411817" font-weight="bold" fill="var(--primary-text)">2. Read Output</text>
  <text x="471.578947" y="152.448979328405" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.859698727023" fill="var(--primary-text)">parse stack trace</text>
  <text x="471.578947" y="187.959183799459" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.859698727023" fill="var(--primary-text)">inspect logs</text>

  <line x1="597.894737" y1="134.693878215327" x2="661.052632" y2="134.693878215327" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3: Diagnose -->
  <rect x="671.578947" y="40" width="231.578947" height="189.387755308205" rx="8.92984989324" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.368421" y="99.183673744273" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.557086411817" font-weight="bold" fill="var(--info-text)">3. Diagnose</text>
  <text x="787.368421" y="152.448979328405" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.859698727023" fill="var(--info-text)">reason about cause</text>
  <text x="787.368421" y="187.959183799459" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.859698727023" fill="var(--info-text)">plan a fix</text>

  <line x1="913.684211" y1="134.693878215327" x2="976.842105" y2="134.693878215327" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4: Fix + Retry -->
  <rect x="987.368421" y="40" width="252.631579" height="189.387755308205" rx="8.92984989324" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1113.684211" y="99.183673744273" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.557086411817" font-weight="bold" fill="var(--ok-text)">4. Fix + Retry</text>
  <text x="1113.684211" y="152.448979328405" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.859698727023" fill="var(--ok-text)">edit code</text>
  <text x="1113.684211" y="187.959183799459" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.859698727023" fill="var(--ok-text)">re-run tool</text>

  <!-- Retry arrow looping back -->
  <path d="M 1113.684211 229.387755308205 Q 1113.684211 312.244898325698 650.526316 312.244898325698 Q 155.789474 312.244898325698 155.789474 229.387755308205" fill="none" stroke="var(--warn-border)" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-warn)"/>
  <text x="650.526316" y="341.83673463661" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.859698727023" font-style="italic" fill="var(--warn-accent)">retry loop — bounded by max_turns</text>

  <!-- Bottom principles box -->
  <rect x="40" y="395.10204134319" width="1200" height="224.89795865681" rx="8.92984989324" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="650.526316" y="442.448979889629" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.557086411817" font-weight="bold" fill="var(--text)">Key Principles</text>

  <text x="82.105263" y="489.795918436068" font-family="Arial, sans-serif" font-size="20.092160935469" fill="var(--text)">• Cap iterations to prevent infinite retry loops</text>
  <text x="82.105263" y="531.224489944815" font-family="Arial, sans-serif" font-size="20.092160935469" fill="var(--text)">• Detect repeated identical errors — stop and report</text>
  <text x="82.105263" y="572.653061453561" font-family="Arial, sans-serif" font-size="20.092160935469" fill="var(--text)">• Log every attempt for debugging and audit</text>
  <text x="82.105263" y="614.081632962307" font-family="Arial, sans-serif" font-size="20.092160935469" fill="var(--text)">• Surface partial results when giving up</text>
</svg>

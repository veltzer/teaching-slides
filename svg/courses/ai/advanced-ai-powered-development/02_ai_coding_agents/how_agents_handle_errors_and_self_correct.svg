<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="25.6" markerHeight="112" refX="23.04" refY="56" orient="auto">
      <ns0:polygon points="0,160 8.96,0" fill="white" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="204.8" height="640" fill="#1a1a2e" />
  <ns0:text x="102.4" y="56" text-anchor="middle" fill="white" font-size="10" font-weight="bold">How Agents Handle Errors and Self-Correct</ns0:text>
  <ns0:rect x="5.12" y="128" width="42.24" height="136" fill="#bf360c" rx="2.56" />
  <ns0:text x="26.112" y="179.2" text-anchor="middle" fill="white" font-size="10" font-weight="bold">1. Error</ns0:text>
  <ns0:text x="26.112" y="211.2" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Occurs</ns0:text>
  <ns0:text x="26.112" y="248" text-anchor="middle" fill="#ffcc80" font-size="10">test fails / crash</ns0:text>
  <ns0:line x1="47.36" y1="195.2" x2="55.04" y2="195.2" stroke="white" stroke-width="0.512" marker-end="url(#arr)" />
  <ns0:rect x="55.04" y="128" width="42.24" height="136" fill="#1565c0" rx="2.56" />
  <ns0:text x="76.032" y="179.2" text-anchor="middle" fill="white" font-size="10" font-weight="bold">2. Read</ns0:text>
  <ns0:text x="76.032" y="211.2" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Output</ns0:text>
  <ns0:text x="76.032" y="248" text-anchor="middle" fill="#bbdefb" font-size="10">parse error message</ns0:text>
  <ns0:line x1="97.28" y1="195.2" x2="104.96" y2="195.2" stroke="white" stroke-width="0.512" marker-end="url(#arr)" />
  <ns0:rect x="104.96" y="128" width="42.24" height="136" fill="#673ab7" rx="2.56" />
  <ns0:text x="125.952" y="179.2" text-anchor="middle" fill="white" font-size="10" font-weight="bold">3. Diagnose</ns0:text>
  <ns0:text x="125.952" y="211.2" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Root Cause</ns0:text>
  <ns0:text x="125.952" y="248" text-anchor="middle" fill="#f3e5f5" font-size="10">LLM reasons why</ns0:text>
  <ns0:line x1="147.2" y1="195.2" x2="154.88" y2="195.2" stroke="white" stroke-width="0.512" marker-end="url(#arr)" />
  <ns0:rect x="154.88" y="128" width="44.8" height="136" fill="#388e3c" rx="2.56" />
  <ns0:text x="177.152" y="179.2" text-anchor="middle" fill="white" font-size="10" font-weight="bold">4. Fix + Retry</ns0:text>
  <ns0:text x="177.152" y="211.2" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Tool Call</ns0:text>
  <ns0:text x="177.152" y="248" text-anchor="middle" fill="#d4edda" font-size="10">edit + re-run</ns0:text>
  <ns0:path d="M 177.152 264 Q 177.152 368 102.4 368 Q 76.032 368 76.032 264" fill="none" stroke="white" stroke-width="0.512" stroke-dasharray="1.536 0.768" marker-end="url(#arr)" />
  <ns0:text x="128" y="400" text-anchor="middle" fill="#F9A825" font-size="10">retry loop (up to max iterations)</ns0:text>
  <ns0:rect x="76.8" y="440" width="51.2" height="96" fill="#2e7d32" rx="2.56" />
  <ns0:text x="102.4" y="484.8" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Done</ns0:text>
  <ns0:text x="102.4" y="516.8" text-anchor="middle" fill="#d4edda" font-size="10">test passes</ns0:text>
  <ns0:line x1="177.152" y1="264" x2="128" y2="440" stroke="#2ecc71" stroke-width="0.512" marker-end="url(#arr)" />
  <ns0:rect x="5.12" y="552" width="194.56" height="72" rx="2.048" fill="#F9A825" fill-opacity="0.15" stroke="#F9A825" stroke-width="0.256" />
  <ns0:text x="102.4" y="588.8" text-anchor="middle" fill="#F9A825" font-size="10">Key principles: cap retries, detect loops, log each attempt for debugging</ns0:text>
  <ns0:text x="102.4" y="614.4" text-anchor="middle" fill="#dddddd" font-size="10">Good agents set a max_turns limit and surface partial results on failure</ns0:text>
</ns0:svg>
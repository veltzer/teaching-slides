<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,160 8.96,0" fill="white" />
    </marker>
  </defs>
  <rect width="185.6" height="580" fill="var(--code-bg)" rx="6" x="547.2" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">How Agents Handle Errors and Self-Correct</text>
  <rect x="551.84" y="156" width="38.28" height="123.25" fill="var(--danger-accent)" rx="6" />
  <text x="570.864" y="202.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">1. Error</text>
  <text x="570.864" y="231.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Occurs</text>
  <text x="570.864" y="264.75" text-anchor="middle" fill="var(--warn-accent)" font-size="10">test fails / crash</text>
  <line x1="590.12" y1="216.9" x2="597.08" y2="216.9" stroke="var(--bg)" stroke-width="0.512" marker-end="url(#arr)" />
  <rect x="597.08" y="156" width="38.28" height="123.25" fill="var(--primary-accent)" rx="6" />
  <text x="616.104" y="202.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">2. Read</text>
  <text x="616.104" y="231.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Output</text>
  <text x="616.104" y="264.75" text-anchor="middle" fill="var(--primary-accent)" font-size="10">parse error message</text>
  <line x1="635.36" y1="216.9" x2="642.32" y2="216.9" stroke="var(--bg)" stroke-width="0.512" marker-end="url(#arr)" />
  <rect x="642.32" y="156" width="38.28" height="123.25" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="661.344" y="202.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">3. Diagnose</text>
  <text x="661.344" y="231.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Root Cause</text>
  <text x="661.344" y="264.75" text-anchor="middle" fill="var(--info-accent)" font-size="10">LLM reasons why</text>
  <line x1="680.6" y1="216.9" x2="687.56" y2="216.9" stroke="var(--bg)" stroke-width="0.512" marker-end="url(#arr)" />
  <rect x="687.56" y="156" width="40.6" height="123.25" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="707.744" y="202.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">4. Fix + Retry</text>
  <text x="707.744" y="231.4" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Tool Call</text>
  <text x="707.744" y="264.75" text-anchor="middle" fill="var(--ok-accent)" font-size="10">edit + re-run</text>
  <path d="M 707.744 279.25 Q 707.744 373.5 640 373.5 Q 616.104 373.5 616.104 279.25" fill="none" stroke="var(--bg)" stroke-width="0.512" stroke-dasharray="1.536 0.768" marker-end="url(#arr)" />
  <text x="663.2" y="402.5" text-anchor="middle" fill="var(--warn-accent)" font-size="10">retry loop (up to max iterations)</text>
  <rect x="616.8" y="438.75" width="46.4" height="87" fill="var(--ok-accent)" rx="6" />
  <text x="640" y="479.35" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Done</text>
  <text x="640" y="508.35" text-anchor="middle" fill="var(--ok-accent)" font-size="10">test passes</text>
  <line x1="707.744" y1="279.25" x2="663.2" y2="438.75" stroke="var(--ok-border)" stroke-width="0.512" marker-end="url(#arr)" />
  <rect x="551.84" y="540.25" width="176.32" height="65.25" rx="6" fill="var(--warn-fill)" fill-opacity="0.15" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="573.6" text-anchor="middle" fill="var(--warn-accent)" font-size="10">Key principles: cap retries, detect loops, log each attempt for debugging</text>
  <text x="640" y="596.8" text-anchor="middle" fill="var(--border)" font-size="10">Good agents set a max_turns limit and surface partial results on failure</text>
</svg>
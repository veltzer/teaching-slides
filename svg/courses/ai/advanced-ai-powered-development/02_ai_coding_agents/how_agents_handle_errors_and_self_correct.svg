<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
  </defs>

  <text x="650.526316" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.500466" font-weight="bold" fill="var(--text)">The Self-Correction Loop</text>

  <!-- Step 1: Error -->
  <rect x="40" y="103.272727" width="231.578947" height="168.727273" rx="8.428705" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.789474" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.178938" font-weight="bold" fill="var(--danger-text)">1. Error Occurs</text>
  <text x="155.789474" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.857409" fill="var(--danger-text)">test fails</text>
  <text x="155.789474" y="235.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.857409" fill="var(--danger-text)">tool returns error</text>

  <line x1="282.105263" y1="187.636364" x2="345.263158" y2="187.636364" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: Read -->
  <rect x="355.789474" y="103.272727" width="231.578947" height="168.727273" rx="8.428705" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="471.578947" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.178938" font-weight="bold" fill="var(--primary-text)">2. Read Output</text>
  <text x="471.578947" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.857409" fill="var(--primary-text)">parse stack trace</text>
  <text x="471.578947" y="235.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.857409" fill="var(--primary-text)">inspect logs</text>

  <line x1="597.894737" y1="187.636364" x2="661.052632" y2="187.636364" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3: Diagnose -->
  <rect x="671.578947" y="103.272727" width="231.578947" height="168.727273" rx="8.428705" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.368421" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.178938" font-weight="bold" fill="var(--info-text)">3. Diagnose</text>
  <text x="787.368421" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.857409" fill="var(--info-text)">reason about cause</text>
  <text x="787.368421" y="235.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.857409" fill="var(--info-text)">plan a fix</text>

  <line x1="913.684211" y1="187.636364" x2="976.842105" y2="187.636364" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4: Fix + Retry -->
  <rect x="987.368421" y="103.272727" width="252.631579" height="168.727273" rx="8.428705" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1113.684211" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.178938" font-weight="bold" fill="var(--ok-text)">4. Fix + Retry</text>
  <text x="1113.684211" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.857409" fill="var(--ok-text)">edit code</text>
  <text x="1113.684211" y="235.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.857409" fill="var(--ok-text)">re-run tool</text>

  <!-- Retry arrow looping back -->
  <path d="M 1113.684211 272 Q 1113.684211 345.818182 650.526316 345.818182 Q 155.789474 345.818182 155.789474 272" fill="none" stroke="var(--warn-border)" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-warn)"/>
  <text x="650.526316" y="372.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.857409" font-style="italic" fill="var(--warn-accent)">retry loop — bounded by max_turns</text>

  <!-- Bottom principles box -->
  <rect x="40" y="419.636364" width="1200" height="200.363636" rx="8.428705" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="650.526316" y="461.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.178938" font-weight="bold" fill="var(--text)">Key Principles</text>

  <text x="82.105263" y="504" font-family="Arial, sans-serif" font-size="18.964585" fill="var(--text)">• Cap iterations to prevent infinite retry loops</text>
  <text x="82.105263" y="540.909091" font-family="Arial, sans-serif" font-size="18.964585" fill="var(--text)">• Detect repeated identical errors — stop and report</text>
  <text x="82.105263" y="577.818182" font-family="Arial, sans-serif" font-size="18.964585" fill="var(--text)">• Log every attempt for debugging and audit</text>
  <text x="82.105263" y="614.727273" font-family="Arial, sans-serif" font-size="18.964585" fill="var(--text)">• Surface partial results when giving up</text>
</svg>

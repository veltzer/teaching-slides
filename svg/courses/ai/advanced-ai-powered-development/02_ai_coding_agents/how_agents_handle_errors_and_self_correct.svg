<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,160 8.96,0" fill="white" />
    </marker>
  </defs>
  <rect width="204.8" height="640" fill="var(--code-bg)" />
  <text x="102.4" y="56" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">How Agents Handle Errors and Self-Correct</text>
  <rect x="5.12" y="128" width="42.24" height="136" fill="var(--danger-deeper)" rx="2.56" />
  <text x="26.112" y="179.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">1. Error</text>
  <text x="26.112" y="211.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Occurs</text>
  <text x="26.112" y="248" text-anchor="middle" fill="var(--warn-tint)" font-size="10">test fails / crash</text>
  <line x1="47.36" y1="195.2" x2="55.04" y2="195.2" stroke="var(--bg)" stroke-width="0.512" marker-end="url(#arr)" />
  <rect x="55.04" y="128" width="42.24" height="136" fill="var(--primary-dk)" rx="2.56" />
  <text x="76.032" y="179.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">2. Read</text>
  <text x="76.032" y="211.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Output</text>
  <text x="76.032" y="248" text-anchor="middle" fill="var(--primary-lt)" font-size="10">parse error message</text>
  <line x1="97.28" y1="195.2" x2="104.96" y2="195.2" stroke="var(--bg)" stroke-width="0.512" marker-end="url(#arr)" />
  <rect x="104.96" y="128" width="42.24" height="136" fill="var(--info-vivid)" rx="2.56" />
  <text x="125.952" y="179.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">3. Diagnose</text>
  <text x="125.952" y="211.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Root Cause</text>
  <text x="125.952" y="248" text-anchor="middle" fill="var(--info-pale)" font-size="10">LLM reasons why</text>
  <line x1="147.2" y1="195.2" x2="154.88" y2="195.2" stroke="var(--bg)" stroke-width="0.512" marker-end="url(#arr)" />
  <rect x="154.88" y="128" width="44.8" height="136" fill="var(--ok-mid)" rx="2.56" />
  <text x="177.152" y="179.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">4. Fix + Retry</text>
  <text x="177.152" y="211.2" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Tool Call</text>
  <text x="177.152" y="248" text-anchor="middle" fill="var(--ok-pale2)" font-size="10">edit + re-run</text>
  <path d="M 177.152 264 Q 177.152 368 102.4 368 Q 76.032 368 76.032 264" fill="none" stroke="var(--bg)" stroke-width="0.512" stroke-dasharray="1.536 0.768" marker-end="url(#arr)" />
  <text x="128" y="400" text-anchor="middle" fill="var(--warn-amber)" font-size="10">retry loop (up to max iterations)</text>
  <rect x="76.8" y="440" width="51.2" height="96" fill="var(--ok-dk)" rx="2.56" />
  <text x="102.4" y="484.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Done</text>
  <text x="102.4" y="516.8" text-anchor="middle" fill="var(--ok-pale2)" font-size="10">test passes</text>
  <line x1="177.152" y1="264" x2="128" y2="440" stroke="var(--ok-vivid)" stroke-width="0.512" marker-end="url(#arr)" />
  <rect x="5.12" y="552" width="194.56" height="72" rx="2.048" fill="var(--warn-amber)" fill-opacity="0.15" stroke="var(--warn-amber)" stroke-width="0.256" />
  <text x="102.4" y="588.8" text-anchor="middle" fill="var(--warn-amber)" font-size="10">Key principles: cap retries, detect loops, log each attempt for debugging</text>
  <text x="102.4" y="614.4" text-anchor="middle" fill="var(--border-softer)" font-size="10">Good agents set a max_turns limit and surface partial results on failure</text>
</svg>
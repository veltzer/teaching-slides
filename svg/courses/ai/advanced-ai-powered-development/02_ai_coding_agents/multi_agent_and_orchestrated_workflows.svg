<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text)">Multi-Agent Orchestrated Workflow</text>

  <!-- Planning Agent (top) -->
  <rect x="480" y="110" width="320" height="110" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Planning Agent</text>
  <text x="640" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">strong model (e.g. Opus)</text>
  <text x="640" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">breaks task into subtasks</text>

  <!-- Parallel execution label -->
  <text x="640" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="var(--warn-accent)">parallel execution (fast models)</text>

  <!-- Execution Agents -->
  <rect x="110" y="280" width="260" height="140" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="240" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Exec Agent A</text>
  <text x="240" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Write unit tests</text>
  <text x="240" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">isolated subtask</text>

  <rect x="510" y="280" width="260" height="140" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Exec Agent B</text>
  <text x="640" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Refactor module</text>
  <text x="640" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">isolated subtask</text>

  <rect x="910" y="280" width="260" height="140" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1040" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Exec Agent C</text>
  <text x="1040" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Update docs</text>
  <text x="1040" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">isolated subtask</text>

  <!-- Review Agent -->
  <rect x="390" y="480" width="500" height="120" rx="8" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Review Agent</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">validates outputs + merges results</text>
  <text x="640" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">security / style / correctness checks</text>

  <!-- Arrows: planner → execs -->
  <line x1="560" y1="220" x2="280" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="640" y1="220" x2="640" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="720" y1="220" x2="1000" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Arrows: execs → reviewer -->
  <line x1="280" y1="420" x2="470" y2="480" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrg)"/>
  <line x1="640" y1="420" x2="640" y2="480" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrg)"/>
  <line x1="1000" y1="420" x2="810" y2="480" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrg)"/>
</svg>

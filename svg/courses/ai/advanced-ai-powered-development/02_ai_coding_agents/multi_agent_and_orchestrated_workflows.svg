<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.917063" font-weight="bold" fill="var(--text)">Multi-Agent Orchestrated Workflow</text>

  <!-- Planning Agent (top) -->
  <rect x="458.867925" y="75.555556" width="362.264151" height="122.222222" rx="8.972354" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="114.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.430886" font-weight="bold" fill="var(--info-text)">Planning Agent</text>
  <text x="640" y="147.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.823165" fill="var(--info-text)">strong model (e.g. Opus)</text>
  <text x="640" y="175.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.823165" fill="var(--info-text)">breaks task into subtasks</text>

  <!-- Parallel execution label -->
  <text x="640" y="231.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.823165" font-style="italic" fill="var(--warn-accent)">parallel execution (fast models)</text>

  <!-- Execution Agents -->
  <rect x="40" y="264.444444" width="294.339623" height="155.555556" rx="8.972354" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.169811" y="308.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.430886" font-weight="bold" fill="var(--ok-text)">Exec Agent A</text>
  <text x="187.169811" y="347.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.944709" fill="var(--ok-text)">Write unit tests</text>
  <text x="187.169811" y="381.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.70162" fill="var(--ok-text)">isolated subtask</text>

  <rect x="492.830189" y="264.444444" width="294.339623" height="155.555556" rx="8.972354" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="308.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.430886" font-weight="bold" fill="var(--ok-text)">Exec Agent B</text>
  <text x="640" y="347.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.944709" fill="var(--ok-text)">Refactor module</text>
  <text x="640" y="381.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.70162" fill="var(--ok-text)">isolated subtask</text>

  <rect x="945.660377" y="264.444444" width="294.339623" height="155.555556" rx="8.972354" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1092.830189" y="308.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.430886" font-weight="bold" fill="var(--ok-text)">Exec Agent C</text>
  <text x="1092.830189" y="347.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.944709" fill="var(--ok-text)">Update docs</text>
  <text x="1092.830189" y="381.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.70162" fill="var(--ok-text)">isolated subtask</text>

  <!-- Review Agent -->
  <rect x="356.981132" y="486.666667" width="566.037736" height="133.333333" rx="8.972354" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="531.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.673975" font-weight="bold" fill="var(--danger-text)">Review Agent</text>
  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.944709" fill="var(--danger-text)">validates outputs + merges results</text>
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.70162" fill="var(--danger-text)">security / style / correctness checks</text>

  <!-- Arrows: planner → execs -->
  <line x1="549.433962" y1="197.777778" x2="232.45283" y2="264.444444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="197.777778" x2="640" y2="264.444444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730.566038" y1="197.777778" x2="1047.54717" y2="264.444444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows: execs → reviewer -->
  <line x1="232.45283" y1="420" x2="447.54717" y2="486.666667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="420" x2="640" y2="486.666667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1047.54717" y1="420" x2="832.45283" y2="486.666667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

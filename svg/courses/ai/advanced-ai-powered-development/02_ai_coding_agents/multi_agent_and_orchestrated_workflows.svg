<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,107.1075 8.96,0" fill="white" />
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,107.1075 8.96,0" fill="#2ecc71" />
    </marker>
  </defs>
  <rect width="305.9358" height="640" fill="var(--code-bg)" rx="6"/>
  <text x="152.9679" y="56" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Multi-Agent Orchestrated Workflow</text>
  <rect x="105.1654" y="96" width="95.6049" height="112" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="152.9679" y="144" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Planning Agent</text>
  <text x="152.9679" y="176" text-anchor="middle" fill="var(--info-accent)" font-size="10">(strong model: Claude Opus)</text>
  <text x="152.9679" y="200" text-anchor="middle" fill="var(--info-accent)" font-size="10">breaks task into subtasks</text>
  <rect x="7.6484" y="320" width="84.1323" height="128" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="49.7146" y="364.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Exec Agent A</text>
  <text x="49.7146" y="396.8" text-anchor="middle" fill="var(--ok-accent)" font-size="10">Write unit tests</text>
  <text x="49.7146" y="424" text-anchor="middle" fill="var(--ok-accent)" font-size="10">(fast model)</text>
  <rect x="110.9017" y="320" width="84.1323" height="128" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="152.9679" y="364.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Exec Agent B</text>
  <text x="152.9679" y="396.8" text-anchor="middle" fill="var(--ok-accent)" font-size="10">Refactor module</text>
  <text x="152.9679" y="424" text-anchor="middle" fill="var(--ok-accent)" font-size="10">(fast model)</text>
  <rect x="214.1551" y="320" width="84.1323" height="128" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="256.2212" y="364.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Exec Agent C</text>
  <text x="256.2212" y="396.8" text-anchor="middle" fill="var(--ok-accent)" font-size="10">Update docs</text>
  <text x="256.2212" y="424" text-anchor="middle" fill="var(--ok-accent)" font-size="10">(fast model)</text>
  <rect x="86.0444" y="528" width="133.8469" height="88" fill="var(--danger-accent)" rx="6" />
  <text x="152.9679" y="572.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Review Agent</text>
  <text x="152.9679" y="601.6" text-anchor="middle" fill="var(--warn-accent)" font-size="10">validates + merges results</text>
  <line x1="126.1985" y1="208" x2="59.2751" y2="320" stroke="var(--bg)" stroke-width="0.7648" marker-end="url(#arr)" />
  <line x1="152.9679" y1="208" x2="152.9679" y2="320" stroke="var(--bg)" stroke-width="0.7648" marker-end="url(#arr)" />
  <line x1="179.7373" y1="208" x2="246.6607" y2="320" stroke="var(--bg)" stroke-width="0.7648" marker-end="url(#arr)" />
  <line x1="49.7146" y1="448" x2="114.7259" y2="528" stroke="var(--ok-border)" stroke-width="0.7648" marker-end="url(#arrg)" />
  <line x1="152.9679" y1="448" x2="152.9679" y2="528" stroke="var(--ok-border)" stroke-width="0.7648" marker-end="url(#arrg)" />
  <line x1="256.2212" y1="448" x2="191.2099" y2="528" stroke="var(--ok-border)" stroke-width="0.7648" marker-end="url(#arrg)" />
  <text x="152.9679" y="296" text-anchor="middle" fill="var(--warn-accent)" font-size="10">parallel execution</text>
</svg>
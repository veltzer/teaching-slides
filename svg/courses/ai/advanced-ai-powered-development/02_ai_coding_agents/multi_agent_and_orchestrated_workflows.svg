<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.917063" font-weight="bold" fill="var(--text)">Multi-Agent Orchestrated Workflow</text>

  <!-- Planning Agent (top) -->
  <rect x="458.867925" y="75.555556" width="362.264151" height="122.222222" rx="8.972354" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="114.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.430886" font-weight="bold" fill="var(--info-text)">Planning Agent</text>
  <text x="640" y="147.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.823165" fill="var(--info-text)">strong model (e.g. Opus)</text>
  <text x="640" y="175.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.823165" fill="var(--info-text)">breaks task into subtasks</text>

  <!-- Parallel execution label -->
  <text x="640" y="231.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.823165" font-style="italic" fill="var(--warn-accent)">parallel execution (fast models)</text>

  <!-- Execution Agents -->
  <rect x="40" y="264.444444" width="294.339623" height="155.555556" rx="8.972354" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.169811" y="308.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.430886" font-weight="bold" fill="var(--ok-text)">Exec Agent A</text>
  <text x="187.169811" y="347.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.944709" fill="var(--ok-text)">Write unit tests</text>
  <text x="187.169811" y="381.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.70162" fill="var(--ok-text)">isolated subtask</text>

  <rect x="492.830189" y="264.444444" width="294.339623" height="155.555556" rx="8.972354" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="308.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.430886" font-weight="bold" fill="var(--ok-text)">Exec Agent B</text>
  <text x="640" y="347.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.944709" fill="var(--ok-text)">Refactor module</text>
  <text x="640" y="381.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.70162" fill="var(--ok-text)">isolated subtask</text>

  <rect x="945.660377" y="264.444444" width="294.339623" height="155.555556" rx="8.972354" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1092.830189" y="308.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.430886" font-weight="bold" fill="var(--ok-text)">Exec Agent C</text>
  <text x="1092.830189" y="347.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.944709" fill="var(--ok-text)">Update docs</text>
  <text x="1092.830189" y="381.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.70162" fill="var(--ok-text)">isolated subtask</text>

  <!-- Review Agent -->
  <rect x="356.981132" y="486.666667" width="566.037736" height="133.333333" rx="8.972354" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="531.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.673975" font-weight="bold" fill="var(--danger-text)">Review Agent</text>
  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.944709" fill="var(--danger-text)">validates outputs + merges results</text>
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.70162" fill="var(--danger-text)">security / style / correctness checks</text>

  <!-- Arrows: planner → execs -->
  <line x1="549.433962" y1="197.777778" x2="232.45283" y2="264.444444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="640" y1="197.777778" x2="640" y2="264.444444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="730.566038" y1="197.777778" x2="1047.54717" y2="264.444444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Arrows: execs → reviewer -->
  <line x1="232.45283" y1="420" x2="447.54717" y2="486.666667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrg)"/>
  <line x1="640" y1="420" x2="640" y2="486.666667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrg)"/>
  <line x1="1047.54717" y1="420" x2="832.45283" y2="486.666667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrg)"/>
</svg>

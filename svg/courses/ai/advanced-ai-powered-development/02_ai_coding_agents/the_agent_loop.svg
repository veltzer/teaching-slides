<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,42.3183 8.96,0" fill="white" />
    </marker>
  </defs>
  <rect width="702" height="580" fill="var(--code-bg)" rx="6.0012" x="289" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" fill="var(--bg)" font-size="18.4239" font-weight="bold">The Agent Loop</text>
  <circle cx="640" cy="344.5" r="43.8666" fill="var(--warn-fill)" fill-opacity="0.2" stroke="var(--warn-border)" stroke-width="1.9358" />
  <text x="640" y="337.25" text-anchor="middle" fill="var(--warn-accent)" font-size="12.2826" font-weight="bold">Task</text>
  <text x="640" y="366.25" text-anchor="middle" fill="var(--warn-accent)" font-size="12.2826" font-weight="bold">Goal</text>
  <rect x="530.3126" y="127" width="219.375" height="87" fill="var(--primary-accent)" rx="6.0012" />
  <text x="640" y="167.6" text-anchor="middle" fill="var(--bg)" font-size="13.1599" font-weight="bold">1. Receive Task</text>
  <text x="640" y="196.6" text-anchor="middle" fill="var(--primary-accent)" font-size="10.5279">user prompt or issue</text>
  <rect x="797.95" y="293.75" width="175.5" height="101.5" fill="var(--ok-fill)" rx="6.0012" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="885.7001" y="334.35" text-anchor="middle" fill="var(--bg)" font-size="13.1599" font-weight="bold">2. Reason</text>
  <text x="885.7001" y="363.3501" text-anchor="middle" fill="var(--ok-accent)" font-size="10.5279">plan next action</text>
  <text x="885.7001" y="385.1" text-anchor="middle" fill="var(--ok-accent)" font-size="10.5279">choose tool</text>
  <rect x="530.3126" y="504" width="219.375" height="87" fill="var(--danger-accent)" rx="6.0012" />
  <text x="640" y="544.6" text-anchor="middle" fill="var(--bg)" font-size="13.1599" font-weight="bold">3. Execute Tool</text>
  <text x="640" y="573.6001" text-anchor="middle" fill="var(--warn-accent)" font-size="10.5279">file edit, shell, search</text>
  <rect x="306.55" y="293.75" width="175.5" height="101.5" fill="var(--info-fill)" rx="6.0012" stroke="var(--info-border)" stroke-width="2"/>
  <text x="394.3" y="334.35" text-anchor="middle" fill="var(--bg)" font-size="13.1599" font-weight="bold">4. Observe</text>
  <text x="394.3" y="363.3501" text-anchor="middle" fill="var(--info-accent)" font-size="10.5279">read tool output</text>
  <text x="394.3" y="385.1" text-anchor="middle" fill="var(--info-accent)" font-size="10.5279">update context</text>
  <path d="M 749.6875 170.5 Q 833.05 170.5 833.05 293.75" fill="none" stroke="var(--bg)" stroke-width="1.9358" marker-end="url(#arr)" />
  <path d="M 833.05 395.25 Q 833.05 504 749.6875 540.25" fill="none" stroke="var(--bg)" stroke-width="1.9358" marker-end="url(#arr)" />
  <path d="M 530.3126 540.25 Q 446.95 540.25 446.95 395.25" fill="none" stroke="var(--bg)" stroke-width="1.9358" marker-end="url(#arr)" />
  <path d="M 446.95 293.75 Q 446.95 170.5 530.3126 170.5" fill="none" stroke="var(--bg)" stroke-width="1.9358" marker-end="url(#arr)" />
  <text x="640" y="612.75" text-anchor="middle" fill="var(--ok-accent)" font-size="11.4053">Loop continues until task is complete or max iterations reached</text>
</svg>
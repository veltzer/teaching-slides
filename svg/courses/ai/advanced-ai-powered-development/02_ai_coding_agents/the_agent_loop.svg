<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,42.3183 8.96,0" fill="white" />
    </marker>
  </defs>
  <rect width="774.321" height="640" fill="var(--code-bg)" rx="6"/>
  <text x="387.1605" y="56" text-anchor="middle" fill="var(--bg)" font-size="20.3259" font-weight="bold">The Agent Loop</text>
  <circle cx="387.1605" cy="336" r="48.3951" fill="var(--warn-fill)" fill-opacity="0.2" stroke="var(--warn-border)" stroke-width="1.9358" />
  <text x="387.1605" y="328" text-anchor="middle" fill="var(--warn-accent)" font-size="13.5506" font-weight="bold">Task</text>
  <text x="387.1605" y="360" text-anchor="middle" fill="var(--warn-accent)" font-size="13.5506" font-weight="bold">Goal</text>
  <rect x="266.1729" y="96" width="241.9753" height="96" fill="var(--primary-accent)" rx="6" />
  <text x="387.1605" y="140.8" text-anchor="middle" fill="var(--bg)" font-size="14.5185" font-weight="bold">1. Receive Task</text>
  <text x="387.1605" y="172.8" text-anchor="middle" fill="var(--primary-accent)" font-size="11.6148">user prompt or issue</text>
  <rect x="561.3827" y="280" width="193.5803" height="112" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="658.1729" y="324.8" text-anchor="middle" fill="var(--bg)" font-size="14.5185" font-weight="bold">2. Reason</text>
  <text x="658.1729" y="356.8001" text-anchor="middle" fill="var(--ok-accent)" font-size="11.6148">plan next action</text>
  <text x="658.1729" y="380.8" text-anchor="middle" fill="var(--ok-accent)" font-size="11.6148">choose tool</text>
  <rect x="266.1729" y="512" width="241.9753" height="96" fill="var(--danger-accent)" rx="6" />
  <text x="387.1605" y="556.8" text-anchor="middle" fill="var(--bg)" font-size="14.5185" font-weight="bold">3. Execute Tool</text>
  <text x="387.1605" y="588.8001" text-anchor="middle" fill="var(--warn-accent)" font-size="11.6148">file edit, shell, search</text>
  <rect x="19.358" y="280" width="193.5803" height="112" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="116.1482" y="324.8" text-anchor="middle" fill="var(--bg)" font-size="14.5185" font-weight="bold">4. Observe</text>
  <text x="116.1482" y="356.8001" text-anchor="middle" fill="var(--info-accent)" font-size="11.6148">read tool output</text>
  <text x="116.1482" y="380.8" text-anchor="middle" fill="var(--info-accent)" font-size="11.6148">update context</text>
  <path d="M 508.1482 144 Q 600.0988 144 600.0988 280" fill="none" stroke="var(--bg)" stroke-width="1.9358" marker-end="url(#arr)" />
  <path d="M 600.0988 392 Q 600.0988 512 508.1482 552" fill="none" stroke="var(--bg)" stroke-width="1.9358" marker-end="url(#arr)" />
  <path d="M 266.1729 552 Q 174.2222 552 174.2222 392" fill="none" stroke="var(--bg)" stroke-width="1.9358" marker-end="url(#arr)" />
  <path d="M 174.2222 280 Q 174.2222 144 266.1729 144" fill="none" stroke="var(--bg)" stroke-width="1.9358" marker-end="url(#arr)" />
  <text x="387.1605" y="632" text-anchor="middle" fill="var(--ok-accent)" font-size="12.5827">Loop continues until task is complete or max iterations reached</text>
</svg>
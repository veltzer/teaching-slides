<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="25.6" markerHeight="29.6229" refX="23.04" refY="14.8114" orient="auto">
      <ns0:polygon points="0,42.3183 8.96,0" fill="white" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="774.321" height="640" fill="#1a1a2e" />
  <ns0:text x="387.1605" y="56" text-anchor="middle" fill="white" font-size="20.3259" font-weight="bold">The Agent Loop</ns0:text>
  <ns0:circle cx="387.1605" cy="336" r="48.3951" fill="#F9A825" fill-opacity="0.2" stroke="#F9A825" stroke-width="1.9358" />
  <ns0:text x="387.1605" y="328" text-anchor="middle" fill="#F9A825" font-size="13.5506" font-weight="bold">Task</ns0:text>
  <ns0:text x="387.1605" y="360" text-anchor="middle" fill="#F9A825" font-size="13.5506" font-weight="bold">Goal</ns0:text>
  <ns0:rect x="266.1729" y="96" width="241.9753" height="96" fill="#1565c0" rx="9.679" />
  <ns0:text x="387.1605" y="140.8" text-anchor="middle" fill="white" font-size="14.5185" font-weight="bold">1. Receive Task</ns0:text>
  <ns0:text x="387.1605" y="172.8" text-anchor="middle" fill="#bbdefb" font-size="11.6148">user prompt or issue</ns0:text>
  <ns0:rect x="561.3827" y="280" width="193.5803" height="112" fill="#388e3c" rx="9.679" />
  <ns0:text x="658.1729" y="324.8" text-anchor="middle" fill="white" font-size="14.5185" font-weight="bold">2. Reason</ns0:text>
  <ns0:text x="658.1729" y="356.8001" text-anchor="middle" fill="#d4edda" font-size="11.6148">plan next action</ns0:text>
  <ns0:text x="658.1729" y="380.8" text-anchor="middle" fill="#d4edda" font-size="11.6148">choose tool</ns0:text>
  <ns0:rect x="266.1729" y="512" width="241.9753" height="96" fill="#bf360c" rx="9.679" />
  <ns0:text x="387.1605" y="556.8" text-anchor="middle" fill="white" font-size="14.5185" font-weight="bold">3. Execute Tool</ns0:text>
  <ns0:text x="387.1605" y="588.8001" text-anchor="middle" fill="#ffcc80" font-size="11.6148">file edit, shell, search</ns0:text>
  <ns0:rect x="19.358" y="280" width="193.5803" height="112" fill="#673ab7" rx="9.679" />
  <ns0:text x="116.1482" y="324.8" text-anchor="middle" fill="white" font-size="14.5185" font-weight="bold">4. Observe</ns0:text>
  <ns0:text x="116.1482" y="356.8001" text-anchor="middle" fill="#f3e5f5" font-size="11.6148">read tool output</ns0:text>
  <ns0:text x="116.1482" y="380.8" text-anchor="middle" fill="#f3e5f5" font-size="11.6148">update context</ns0:text>
  <ns0:path d="M 508.1482 144 Q 600.0988 144 600.0988 280" fill="none" stroke="white" stroke-width="1.9358" marker-end="url(#arr)" />
  <ns0:path d="M 600.0988 392 Q 600.0988 512 508.1482 552" fill="none" stroke="white" stroke-width="1.9358" marker-end="url(#arr)" />
  <ns0:path d="M 266.1729 552 Q 174.2222 552 174.2222 392" fill="none" stroke="white" stroke-width="1.9358" marker-end="url(#arr)" />
  <ns0:path d="M 174.2222 280 Q 174.2222 144 266.1729 144" fill="none" stroke="white" stroke-width="1.9358" marker-end="url(#arr)" />
  <ns0:text x="387.1605" y="632" text-anchor="middle" fill="#a5d6a7" font-size="12.5827">Loop continues until task is complete or max iterations reached</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="284.745762711864" height="371.2" rx="8.688976066531" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.372881355932" y="86.399999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.722440166327" font-weight="bold" fill="var(--primary-text)">1. Receive</text>
  <text x="182.372881355932" y="144.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--primary-text)">User prompt</text>
  <text x="182.372881355932" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--primary-text)">System + tools load</text>
  <text x="182.372881355932" y="231.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--primary-text)">Initial context from</text>
  <text x="182.372881355932" y="260.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--primary-text)">CLAUDE.md, files</text>
  <text x="182.372881355932" y="312.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.119586108113" fill="var(--primary-text)">loop = 0</text>

  <rect x="340" y="40" width="284.745762711864" height="371.2" rx="8.688976066531" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="482.372881355932" y="86.399999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.722440166327" font-weight="bold" fill="var(--ok-text)">2. Reason</text>
  <text x="482.372881355932" y="144.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--ok-text)">Plan next step</text>
  <text x="482.372881355932" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--ok-text)">Pick tool + args</text>
  <text x="482.372881355932" y="231.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--ok-text)">Or emit final</text>
  <text x="482.372881355932" y="260.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--ok-text)">answer and stop</text>
  <text x="482.372881355932" y="312.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.119586108113" fill="var(--ok-text)">Internal CoT</text>

  <rect x="640" y="40" width="284.745762711864" height="371.2" rx="8.688976066531" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="782.372881355932" y="86.399999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.722440166327" font-weight="bold" fill="var(--warn-text)">3. Act</text>
  <text x="782.372881355932" y="144.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--warn-text)">Harness runs tool</text>
  <text x="782.372881355932" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--warn-text)">Shell, edit, search</text>
  <text x="782.372881355932" y="231.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--warn-text)">Side effects in</text>
  <text x="782.372881355932" y="260.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--warn-text)">the real world</text>
  <text x="782.372881355932" y="312.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.119586108113" fill="var(--warn-text)">Permission prompts</text>

  <rect x="940" y="40" width="300" height="371.2" rx="8.688976066531" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1089.491525423729" y="86.399999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.722440166327" font-weight="bold" fill="var(--info-text)">4. Observe</text>
  <text x="1089.491525423729" y="144.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--info-text)">Output → context</text>
  <text x="1089.491525423729" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--info-text)">Exit, stdout, diffs</text>
  <text x="1089.491525423729" y="231.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--info-text)">Re-reason</text>
  <text x="1089.491525423729" y="260.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--info-text)">Loop to step 2</text>
  <text x="1089.491525423729" y="312.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.119586108113" fill="var(--info-text)">Budget check</text>

  <line x1="324.745762711864" y1="225.6" x2="337.966101694915" y2="225.6" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="624.745762711864" y1="225.6" x2="637.966101694915" y2="225.6" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="924.745762711864" y1="225.6" x2="937.966101694915" y2="225.6" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="40" y="446" width="1200" height="174" rx="8.688976066531" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="492.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377952133061" font-weight="bold" fill="var(--text)">Observation becomes new context, then reason again</text>
  <text x="640" y="533" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--text-muted)">Stops on final answer or max iterations</text>
  <text x="640" y="573.600000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.205708116429" fill="var(--text-muted)">Quality = tool design + prompt + fresh observations</text>
</svg>

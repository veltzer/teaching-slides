<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="70" rx="6" fill="var(--code-bg)"/>
  <text x="640" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)">The Agent Loop</text>

  <rect x="40" y="140" width="280" height="320" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">1. Receive</text>
  <text x="180" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">user prompt or</text>
  <text x="180" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">issue description</text>
  <text x="180" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">system prompt +</text>
  <text x="180" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">tool schemas load</text>
  <text x="180" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">initial context from</text>
  <text x="180" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">CLAUDE.md, files</text>
  <text x="180" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">loop counter = 0</text>

  <rect x="340" y="140" width="280" height="320" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="480" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">2. Reason</text>
  <text x="480" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">model plans the</text>
  <text x="480" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">next concrete step</text>
  <text x="480" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">picks a tool and</text>
  <text x="480" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">fills arguments</text>
  <text x="480" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">or emits the final</text>
  <text x="480" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">answer and stops</text>
  <text x="480" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">chain-of-thought internal</text>

  <rect x="640" y="140" width="280" height="320" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="780" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">3. Act</text>
  <text x="780" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">harness runs the</text>
  <text x="780" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">chosen tool call</text>
  <text x="780" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">shell, file edit,</text>
  <text x="780" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">search, web fetch</text>
  <text x="780" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">side effects happen</text>
  <text x="780" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">in the real world</text>
  <text x="780" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">permission prompts here</text>

  <rect x="940" y="140" width="300" height="320" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1090" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">4. Observe</text>
  <text x="1090" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">tool output feeds</text>
  <text x="1090" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">back into context</text>
  <text x="1090" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">exit code, stdout,</text>
  <text x="1090" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">file diffs, errors</text>
  <text x="1090" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">model re-reasons</text>
  <text x="1090" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">loop to step 2</text>
  <text x="1090" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">budget or done check</text>

  <line x1="320" y1="300" x2="340" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="300" x2="640" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="300" x2="940" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="480" width="1200" height="130" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Feedback loop: observation becomes new context; reason again</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Stops when the model emits a final answer or hits the max-iteration budget</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Quality depends on tool design, prompt, and how fresh the observations stay</text>
</svg>

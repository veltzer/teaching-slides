  <rect width="2048" height="1692.7346" fill="#1a1a2e" />
  <text x="1024" y="148.1143" text-anchor="middle" fill="white" font-size="53.76" font-weight="bold">The Agent Loop</text>
  <circle cx="1024" cy="888.6857" r="128" fill="#F9A825" fill-opacity="0.2" stroke="#F9A825" stroke-width="5.12" />
  <text x="1024" y="867.5266" text-anchor="middle" fill="#F9A825" font-size="35.84" font-weight="bold">Task</text>
  <text x="1024" y="952.1632" text-anchor="middle" fill="#F9A825" font-size="35.84" font-weight="bold">Goal</text>
  <rect x="704" y="253.9103" width="640" height="253.9103" fill="#2B6CB0" rx="25.6" />
  <text x="1024" y="372.4017" text-anchor="middle" fill="white" font-size="38.4" font-weight="bold">1. Receive Task</text>
  <text x="1024" y="457.0383" text-anchor="middle" fill="#BEE3F8" font-size="30.72">user prompt or issue</text>
  <rect x="1484.8" y="740.5714" width="512" height="296.2286" fill="#2F855A" rx="25.6" />
  <text x="1740.8" y="859.0629" text-anchor="middle" fill="white" font-size="38.4" font-weight="bold">2. Reason</text>
  <text x="1740.8" y="943.6997" text-anchor="middle" fill="#C6F6D5" font-size="30.72">plan next action</text>
  <text x="1740.8" y="1007.1771" text-anchor="middle" fill="#C6F6D5" font-size="30.72">choose tool</text>
  <rect x="704" y="1354.1877" width="640" height="253.9103" fill="#C05621" rx="25.6" />
  <text x="1024" y="1472.6792" text-anchor="middle" fill="white" font-size="38.4" font-weight="bold">3. Execute Tool</text>
  <text x="1024" y="1557.316" text-anchor="middle" fill="#FBD38D" font-size="30.72">file edit, shell, search</text>
  <rect x="51.2" y="740.5714" width="512" height="296.2286" fill="#6B46C1" rx="25.6" />
  <text x="307.2" y="859.0629" text-anchor="middle" fill="white" font-size="38.4" font-weight="bold">4. Observe</text>
  <text x="307.2" y="943.6997" text-anchor="middle" fill="#E9D8FD" font-size="30.72">read tool output</text>
  <text x="307.2" y="1007.1771" text-anchor="middle" fill="#E9D8FD" font-size="30.72">update context</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="515.5556" height="580" fill="var(--code-bg)" rx="6" x="382.2222" y="40"/>
  <text x="640" y="95.1" text-anchor="middle" fill="var(--bg)" font-size="13.5333" font-weight="bold">Chatbot vs. Agent</text>
  <rect x="401.5555" y="127" width="222.3333" height="435" fill="var(--text-muted)" rx="6" />
  <text x="512.4" y="185" text-anchor="middle" fill="var(--bg)" font-size="11.6" font-weight="bold">Chatbot</text>
  <line x1="414.4445" y1="202.4" x2="611" y2="202.4" stroke="var(--border)" stroke-width="0.7111" stroke-opacity="0.4" />
  <text x="417.6667" y="243" fill="var(--border)" font-size="10">▶ Single prompt-response cycle</text>
  <text x="417.6667" y="286.5" fill="var(--border)" font-size="10">▶ No tool access</text>
  <text x="417.6667" y="330" fill="var(--border)" font-size="10">▶ Stateless across turns</text>
  <text x="417.6667" y="373.5" fill="var(--border)" font-size="10">▶ User drives every step</text>
  <text x="417.6667" y="417" fill="var(--border)" font-size="10">▶ Limited context (what you paste)</text>
  <text x="417.6667" y="460.5" fill="var(--border)" font-size="10">▶ Examples: ChatGPT, Claude.ai</text>
  <text x="640" y="351.75" text-anchor="middle" fill="var(--warn-accent)" font-size="15.4667" font-weight="bold">VS</text>
  <rect x="656.1111" y="127" width="222.3333" height="435" fill="var(--primary-accent)" rx="6" />
  <text x="766.9555" y="185" text-anchor="middle" fill="var(--bg)" font-size="11.6" font-weight="bold">Agent</text>
  <line x1="669" y1="202.4" x2="865.5555" y2="202.4" stroke="var(--primary-border)" stroke-width="0.7111" stroke-opacity="0.4" />
  <text x="672.2222" y="243" fill="var(--primary-accent)" font-size="10">▶ Multi-step autonomous loop</text>
  <text x="672.2222" y="286.5" fill="var(--primary-accent)" font-size="10">▶ Tool use: files, shell, git, web</text>
  <text x="672.2222" y="330" fill="var(--primary-accent)" font-size="10">▶ Maintains goal across steps</text>
  <text x="672.2222" y="373.5" fill="var(--primary-accent)" font-size="10">▶ Self-directed execution</text>
  <text x="672.2222" y="417" fill="var(--primary-accent)" font-size="10">▶ Reads entire codebase as needed</text>
  <text x="672.2222" y="460.5" fill="var(--primary-accent)" font-size="10">▶ Examples: Claude Code, Cursor</text>
  <rect x="401.5555" y="576.5" width="476.8889" height="31.9" rx="6" fill="var(--warn-fill)" fill-opacity="0.2" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="599.7" text-anchor="middle" fill="var(--warn-accent)" font-size="10">Agent = Observe → Reason → Act → Observe ... (loop until done)</text>
</svg>
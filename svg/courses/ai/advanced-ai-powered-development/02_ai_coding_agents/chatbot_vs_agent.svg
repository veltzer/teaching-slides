<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect width="568.8889" height="640" fill="#1a1a2e" />
  <ns0:text x="284.4444" y="60.8" text-anchor="middle" fill="white" font-size="14.9333" font-weight="bold">Chatbot vs. Agent</ns0:text>
  <ns0:rect x="21.3333" y="96" width="245.3333" height="480" fill="#555555" rx="8.5333" />
  <ns0:text x="143.6444" y="160" text-anchor="middle" fill="white" font-size="12.8" font-weight="bold">Chatbot</ns0:text>
  <ns0:line x1="35.5556" y1="179.2" x2="252.4444" y2="179.2" stroke="#dddddd" stroke-width="0.7111" stroke-opacity="0.4" />
  <ns0:text x="39.1111" y="224" fill="#dddddd" font-size="10">▶ Single prompt-response cycle</ns0:text>
  <ns0:text x="39.1111" y="272" fill="#dddddd" font-size="10">▶ No tool access</ns0:text>
  <ns0:text x="39.1111" y="320" fill="#dddddd" font-size="10">▶ Stateless across turns</ns0:text>
  <ns0:text x="39.1111" y="368" fill="#dddddd" font-size="10">▶ User drives every step</ns0:text>
  <ns0:text x="39.1111" y="416" fill="#dddddd" font-size="10">▶ Limited context (what you paste)</ns0:text>
  <ns0:text x="39.1111" y="464" fill="#dddddd" font-size="10">▶ Examples: ChatGPT, Claude.ai</ns0:text>
  <ns0:text x="284.4444" y="344" text-anchor="middle" fill="#F9A825" font-size="17.0667" font-weight="bold">VS</ns0:text>
  <ns0:rect x="302.2222" y="96" width="245.3333" height="480" fill="#1565c0" rx="8.5333" />
  <ns0:text x="424.5333" y="160" text-anchor="middle" fill="white" font-size="12.8" font-weight="bold">Agent</ns0:text>
  <ns0:line x1="316.4444" y1="179.2" x2="533.3333" y2="179.2" stroke="#bbdefb" stroke-width="0.7111" stroke-opacity="0.4" />
  <ns0:text x="320" y="224" fill="#bbdefb" font-size="10">▶ Multi-step autonomous loop</ns0:text>
  <ns0:text x="320" y="272" fill="#bbdefb" font-size="10">▶ Tool use: files, shell, git, web</ns0:text>
  <ns0:text x="320" y="320" fill="#bbdefb" font-size="10">▶ Maintains goal across steps</ns0:text>
  <ns0:text x="320" y="368" fill="#bbdefb" font-size="10">▶ Self-directed execution</ns0:text>
  <ns0:text x="320" y="416" fill="#bbdefb" font-size="10">▶ Reads entire codebase as needed</ns0:text>
  <ns0:text x="320" y="464" fill="#bbdefb" font-size="10">▶ Examples: Claude Code, Cursor</ns0:text>
  <ns0:rect x="21.3333" y="592" width="526.2222" height="35.2" rx="3.5556" fill="#F9A825" fill-opacity="0.2" />
  <ns0:text x="284.4444" y="617.6" text-anchor="middle" fill="#F9A825" font-size="10">Agent = Observe → Reason → Act → Observe ... (loop until done)</ns0:text>
</ns0:svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect width="568.8889" height="640" fill="#1a1a2e" />
  <ns0:text x="284.4444" y="60.8" text-anchor="middle" fill="white" font-size="14.9333" font-weight="bold">Chatbot vs. Agent</ns0:text>
  <ns0:rect x="21.3333" y="96" width="245.3333" height="480" fill="#4A5568" rx="8.5333" />
  <ns0:text x="143.6444" y="160" text-anchor="middle" fill="white" font-size="12.8" font-weight="bold">Chatbot</ns0:text>
  <ns0:line x1="35.5556" y1="179.2" x2="252.4444" y2="179.2" stroke="#CBD5E0" stroke-width="0.7111" stroke-opacity="0.4" />
  <ns0:text x="39.1111" y="224" fill="#CBD5E0" font-size="10">▶ Single prompt-response cycle</ns0:text>
  <ns0:text x="39.1111" y="272" fill="#CBD5E0" font-size="10">▶ No tool access</ns0:text>
  <ns0:text x="39.1111" y="320" fill="#CBD5E0" font-size="10">▶ Stateless across turns</ns0:text>
  <ns0:text x="39.1111" y="368" fill="#CBD5E0" font-size="10">▶ User drives every step</ns0:text>
  <ns0:text x="39.1111" y="416" fill="#CBD5E0" font-size="10">▶ Limited context (what you paste)</ns0:text>
  <ns0:text x="39.1111" y="464" fill="#CBD5E0" font-size="10">▶ Examples: ChatGPT, Claude.ai</ns0:text>
  <ns0:text x="284.4444" y="344" text-anchor="middle" fill="#F9A825" font-size="17.0667" font-weight="bold">VS</ns0:text>
  <ns0:rect x="302.2222" y="96" width="245.3333" height="480" fill="#2B6CB0" rx="8.5333" />
  <ns0:text x="424.5333" y="160" text-anchor="middle" fill="white" font-size="12.8" font-weight="bold">Agent</ns0:text>
  <ns0:line x1="316.4444" y1="179.2" x2="533.3333" y2="179.2" stroke="#BEE3F8" stroke-width="0.7111" stroke-opacity="0.4" />
  <ns0:text x="320" y="224" fill="#BEE3F8" font-size="10">▶ Multi-step autonomous loop</ns0:text>
  <ns0:text x="320" y="272" fill="#BEE3F8" font-size="10">▶ Tool use: files, shell, git, web</ns0:text>
  <ns0:text x="320" y="320" fill="#BEE3F8" font-size="10">▶ Maintains goal across steps</ns0:text>
  <ns0:text x="320" y="368" fill="#BEE3F8" font-size="10">▶ Self-directed execution</ns0:text>
  <ns0:text x="320" y="416" fill="#BEE3F8" font-size="10">▶ Reads entire codebase as needed</ns0:text>
  <ns0:text x="320" y="464" fill="#BEE3F8" font-size="10">▶ Examples: Claude Code, Cursor</ns0:text>
  <ns0:rect x="21.3333" y="592" width="526.2222" height="35.2" rx="3.5556" fill="#F9A825" fill-opacity="0.2" />
  <ns0:text x="284.4444" y="617.6" text-anchor="middle" fill="#F9A825" font-size="10">Agent = Observe → Reason → Act → Observe ... (loop until done)</ns0:text>
</ns0:svg>
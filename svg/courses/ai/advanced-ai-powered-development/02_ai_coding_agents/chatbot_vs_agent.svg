<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="590" height="490" rx="6" fill="var(--text-muted)" stroke="var(--border)" stroke-width="2"/>
  <text x="335" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--bg)">Chatbot</text>
  <text x="335" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--bg)">ChatGPT, Claude.ai</text>

  <text x="70" y="200" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)">Single prompt, single response</text>
  <text x="70" y="250" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)">No tool access, text only</text>
  <text x="70" y="300" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)">Stateless across turns</text>
  <text x="70" y="350" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)">User drives every step</text>
  <text x="70" y="400" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)">Context is what you paste</text>
  <text x="70" y="450" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)">You execute the code</text>
  <text x="70" y="500" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)">You run the tests</text>

  <rect x="650" y="40" width="590" height="490" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--primary-text)">Agent</text>
  <text x="945" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Claude Code, Cursor</text>

  <text x="680" y="200" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Multi-step autonomous loop</text>
  <text x="680" y="250" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Tools: files, shell, git, web</text>
  <text x="680" y="300" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Maintains goal across steps</text>
  <text x="680" y="350" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Self-directed execution</text>
  <text x="680" y="400" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Reads codebase as needed</text>
  <text x="680" y="450" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Runs the code itself</text>
  <text x="680" y="500" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Reads the test output</text>

  <rect x="40" y="550" width="1200" height="70" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Agent loop: Observe then Reason then Act then Observe</text>
  <text x="640" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">repeats until goal is reached or budget is exhausted</text>
</svg>

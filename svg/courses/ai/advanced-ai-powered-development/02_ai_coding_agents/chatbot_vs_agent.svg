<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="2048" height="2304" fill="#1a1a2e" />
  <text x="1024" y="218.88" text-anchor="middle" fill="white" font-size="53.76" font-weight="bold">Chatbot vs. Agent</text>
  <rect x="76.8" y="345.6" width="883.2" height="1728" fill="#4A5568" rx="30.72" />
  <text x="517.12" y="576" text-anchor="middle" fill="white" font-size="46.08" font-weight="bold">Chatbot</text>
  <line x1="128" y1="645.12" x2="908.8" y2="645.12" stroke="#CBD5E0" stroke-width="2.56" stroke-opacity="0.4" />
  <text x="140.8" y="806.4" fill="#CBD5E0" font-size="35.84">▶ Single prompt-response cycle</text>
  <text x="140.8" y="979.2" fill="#CBD5E0" font-size="35.84">▶ No tool access</text>
  <text x="140.8" y="1152" fill="#CBD5E0" font-size="35.84">▶ Stateless across turns</text>
  <text x="140.8" y="1324.8" fill="#CBD5E0" font-size="35.84">▶ User drives every step</text>
  <text x="140.8" y="1497.6" fill="#CBD5E0" font-size="35.84">▶ Limited context (what you paste)</text>
  <text x="140.8" y="1670.4" fill="#CBD5E0" font-size="35.84">▶ Examples: ChatGPT, Claude.ai</text>
  <text x="1024" y="1238.4" text-anchor="middle" fill="#F9A825" font-size="61.44" font-weight="bold">VS</text>
  <rect x="1088" y="345.6" width="883.2" height="1728" fill="#2B6CB0" rx="30.72" />
  <text x="1528.32" y="576" text-anchor="middle" fill="white" font-size="46.08" font-weight="bold">Agent</text>
  <line x1="1139.2" y1="645.12" x2="1920" y2="645.12" stroke="#BEE3F8" stroke-width="2.56" stroke-opacity="0.4" />
  <text x="1152" y="806.4" fill="#BEE3F8" font-size="35.84">▶ Multi-step autonomous loop</text>
  <text x="1152" y="979.2" fill="#BEE3F8" font-size="35.84">▶ Tool use: files, shell, git, web</text>
  <text x="1152" y="1152" fill="#BEE3F8" font-size="35.84">▶ Maintains goal across steps</text>
  <text x="1152" y="1324.8" fill="#BEE3F8" font-size="35.84">▶ Self-directed execution</text>
  <text x="1152" y="1497.6" fill="#BEE3F8" font-size="35.84">▶ Reads entire codebase as needed</text>
  <text x="1152" y="1670.4" fill="#BEE3F8" font-size="35.84">▶ Examples: Claude Code, Cursor</text>
  <rect x="76.8" y="2131.2" width="1894.4" height="126.72" rx="12.8" fill="#F9A825" fill-opacity="0.2" />
  <text x="1024" y="2223.36" text-anchor="middle" fill="#F9A825" font-size="30.72">Agent = Observe → Reason → Act → Observe ... (loop until done)</text>
</svg>
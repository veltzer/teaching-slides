<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="2048" height="5184" fill="#1a1a2e" />
  <text x="1024" y="453.6" text-anchor="middle" fill="white" font-size="51.2" font-weight="bold">Context Window Management and Token Budgets</text>
  <rect x="76.8" y="777.6" width="1894.4" height="777.6" fill="#4A5568" rx="20.48" />
  <text x="1024" y="1257.12" text-anchor="middle" fill="white" font-size="38.4">Total Context Window (e.g., 200K tokens)</text>
  <rect x="76.8" y="1814.4" width="473.6" height="712.8" fill="#2B6CB0" rx="15.36" />
  <text x="312.32" y="2112.48" text-anchor="middle" fill="white" font-size="33.28" font-weight="bold">System Prompt</text>
  <text x="312.32" y="2358.72" text-anchor="middle" fill="#BEE3F8" font-size="28.16">~5K tokens (2.5%)</text>
  <rect x="550.4" y="1814.4" width="819.2" height="712.8" fill="#2F855A" rx="15.36" />
  <text x="960" y="2112.48" text-anchor="middle" fill="white" font-size="33.28" font-weight="bold">Conversation + Tool Results</text>
  <text x="960" y="2358.72" text-anchor="middle" fill="#C6F6D5" font-size="28.16">~120K tokens (60%)</text>
  <rect x="1369.6" y="1814.4" width="601.6" height="712.8" fill="#C05621" rx="15.36" />
  <text x="1669.12" y="2112.48" text-anchor="middle" fill="white" font-size="33.28" font-weight="bold">Available for Response</text>
  <text x="1669.12" y="2358.72" text-anchor="middle" fill="#FBD38D" font-size="28.16">~75K tokens (37.5%)</text>
  <rect x="76.8" y="2916" width="1894.4" height="2008.8" rx="25.6" fill="#2D3748" stroke="#718096" stroke-width="2.56" />
  <text x="1024" y="3304.8" text-anchor="middle" fill="#F9A825" font-size="40.96" font-weight="bold">Strategies Agents Use to Stay Within Budget</text>
  <rect x="128" y="3499.2" width="422.4" height="1166.4" rx="20.48" fill="#2B6CB0" fill-opacity="0.7" />
  <text x="337.92" y="3823.2" text-anchor="middle" fill="white" font-size="33.28" font-weight="bold">Repo Maps</text>
  <text x="337.92" y="4082.4" text-anchor="middle" fill="#BEE3F8" font-size="28.16">compact outline</text>
  <text x="337.92" y="4315.68" text-anchor="middle" fill="#BEE3F8" font-size="28.16">of files + symbols</text>
  <text x="337.92" y="4548.96" text-anchor="middle" fill="#BEE3F8" font-size="28.16">(Aider approach)</text>
  <rect x="588.8" y="3499.2" width="422.4" height="1166.4" rx="20.48" fill="#2F855A" fill-opacity="0.7" />
  <text x="798.72" y="3823.2" text-anchor="middle" fill="white" font-size="33.28" font-weight="bold">Selective Read</text>
  <text x="798.72" y="4082.4" text-anchor="middle" fill="#C6F6D5" font-size="28.16">load only files</text>
  <text x="798.72" y="4315.68" text-anchor="middle" fill="#C6F6D5" font-size="28.16">relevant to step</text>
  <rect x="1049.6" y="3499.2" width="422.4" height="1166.4" rx="20.48" fill="#6B46C1" fill-opacity="0.7" />
  <text x="1259.52" y="3823.2" text-anchor="middle" fill="white" font-size="33.28" font-weight="bold">Summarization</text>
  <text x="1259.52" y="4082.4" text-anchor="middle" fill="#E9D8FD" font-size="28.16">compress older</text>
  <text x="1259.52" y="4315.68" text-anchor="middle" fill="#E9D8FD" font-size="28.16">conversation turns</text>
  <rect x="1510.4" y="3499.2" width="422.4" height="1166.4" rx="20.48" fill="#C05621" fill-opacity="0.7" />
  <text x="1720.32" y="3823.2" text-anchor="middle" fill="white" font-size="33.28" font-weight="bold">Truncation</text>
  <text x="1720.32" y="4082.4" text-anchor="middle" fill="#FBD38D" font-size="28.16">drop oldest ctx</text>
  <text x="1720.32" y="4315.68" text-anchor="middle" fill="#FBD38D" font-size="28.16">when window fills</text>
</svg>
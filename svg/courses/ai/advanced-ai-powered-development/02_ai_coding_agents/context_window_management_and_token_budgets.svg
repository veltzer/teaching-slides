<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="252.8395" height="640" fill="var(--code-bg)" rx="6"/>
  <text x="126.4198" y="56" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Context Window Management and Token Budgets</text>
  <rect x="9.4815" y="96" width="233.8765" height="96" fill="var(--text-muted)" rx="6" />
  <text x="126.4198" y="155.2" text-anchor="middle" fill="var(--bg)" font-size="10">Total Context Window (e.g., 200K tokens)</text>
  <rect x="9.4815" y="224" width="58.4691" height="88" fill="var(--primary-accent)" rx="6" />
  <text x="38.558" y="260.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">System Prompt</text>
  <text x="38.558" y="291.2" text-anchor="middle" fill="var(--primary-accent)" font-size="10">~5K tokens (2.5%)</text>
  <rect x="67.9506" y="224" width="101.1358" height="88" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="118.5185" y="260.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Conversation + Tool Results</text>
  <text x="118.5185" y="291.2" text-anchor="middle" fill="var(--ok-accent)" font-size="10">~120K tokens (60%)</text>
  <rect x="169.0864" y="224" width="74.2716" height="88" fill="var(--danger-accent)" rx="6" />
  <text x="206.0642" y="260.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Available for Response</text>
  <text x="206.0642" y="291.2" text-anchor="middle" fill="var(--warn-accent)" font-size="10">~75K tokens (37.5%)</text>
  <rect x="9.4815" y="360" width="233.8765" height="248" rx="6" fill="var(--text)" stroke="var(--text-faint)" stroke-width="0.316" />
  <text x="126.4198" y="408" text-anchor="middle" fill="var(--warn-accent)" font-size="10" font-weight="bold">Strategies Agents Use to Stay Within Budget</text>
  <rect x="15.8025" y="432" width="52.1481" height="144" rx="6" fill="var(--primary-accent)" fill-opacity="0.7" />
  <text x="41.7185" y="472" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Repo Maps</text>
  <text x="41.7185" y="504" text-anchor="middle" fill="var(--primary-accent)" font-size="10">compact outline</text>
  <text x="41.7185" y="532.8" text-anchor="middle" fill="var(--primary-accent)" font-size="10">of files + symbols</text>
  <text x="41.7185" y="561.6" text-anchor="middle" fill="var(--primary-accent)" font-size="10">(Aider approach)</text>
  <rect x="72.6914" y="432" width="52.1481" height="144" rx="6" fill="var(--ok-fill)" fill-opacity="0.7" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="98.6074" y="472" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Selective Read</text>
  <text x="98.6074" y="504" text-anchor="middle" fill="var(--ok-accent)" font-size="10">load only files</text>
  <text x="98.6074" y="532.8" text-anchor="middle" fill="var(--ok-accent)" font-size="10">relevant to step</text>
  <rect x="129.5802" y="432" width="52.1481" height="144" rx="6" fill="var(--info-fill)" fill-opacity="0.7" stroke="var(--info-border)" stroke-width="2"/>
  <text x="155.4963" y="472" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Summarization</text>
  <text x="155.4963" y="504" text-anchor="middle" fill="var(--info-accent)" font-size="10">compress older</text>
  <text x="155.4963" y="532.8" text-anchor="middle" fill="var(--info-accent)" font-size="10">conversation turns</text>
  <rect x="186.4691" y="432" width="52.1481" height="144" rx="6" fill="var(--danger-accent)" fill-opacity="0.7" />
  <text x="212.3852" y="472" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Truncation</text>
  <text x="212.3852" y="504" text-anchor="middle" fill="var(--warn-accent)" font-size="10">drop oldest ctx</text>
  <text x="212.3852" y="532.8" text-anchor="middle" fill="var(--warn-accent)" font-size="10">when window fills</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.215381" font-weight="bold" fill="var(--primary-accent)">Context Window Management and Token Budgets</text>

  <text x="640" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.067031" font-weight="bold" fill="var(--text-muted)">Total Context Window (e.g., 200K tokens)</text>

  <rect x="40" y="121.2" width="214.285714" height="139.2" rx="6.68901" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.142857" y="167.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.067031" font-weight="bold" fill="var(--primary-text)">System Prompt</text>
  <text x="147.142857" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.83736" fill="var(--primary-text)">~5K tokens</text>
  <text x="147.142857" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.83736" fill="var(--primary-text)">(2.5%)</text>

  <rect x="286.428571" y="121.2" width="600" height="139.2" rx="6.68901" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="586.428571" y="167.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.067031" font-weight="bold" fill="var(--ok-text)">Conversation + Tool Results</text>
  <text x="586.428571" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.83736" fill="var(--ok-text)">~120K tokens</text>
  <text x="586.428571" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.83736" fill="var(--ok-text)">(60%)</text>

  <rect x="918.571429" y="121.2" width="321.428571" height="139.2" rx="6.68901" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1079.285714" y="167.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.067031" font-weight="bold" fill="var(--danger-text)">Response Budget</text>
  <text x="1079.285714" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.83736" fill="var(--danger-text)">~75K tokens</text>
  <text x="1079.285714" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.83736" fill="var(--danger-text)">(37.5%)</text>

  <text x="640" y="324.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.526371" font-weight="bold" fill="var(--text)">Strategies Agents Use to Stay Within Budget</text>

  <rect x="40" y="364.8" width="278.571429" height="255.2" rx="8.91868" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179.285714" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.296701" font-weight="bold" fill="var(--primary-text)">Repo Maps</text>
  <text x="179.285714" y="480.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.722525" fill="var(--primary-text)">compact outline</text>
  <text x="179.285714" y="515.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.722525" fill="var(--primary-text)">of files + symbols</text>
  <text x="179.285714" y="579.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.60769" fill="var(--primary-text)">(Aider approach)</text>

  <rect x="340" y="364.8" width="278.571429" height="255.2" rx="8.91868" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="479.285714" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.296701" font-weight="bold" fill="var(--ok-text)">Selective Read</text>
  <text x="479.285714" y="480.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.722525" fill="var(--ok-text)">load only files</text>
  <text x="479.285714" y="515.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.722525" fill="var(--ok-text)">relevant to step</text>

  <rect x="640" y="364.8" width="278.571429" height="255.2" rx="8.91868" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="779.285714" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.296701" font-weight="bold" fill="var(--info-text)">Summarization</text>
  <text x="779.285714" y="480.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.722525" fill="var(--info-text)">compress older</text>
  <text x="779.285714" y="515.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.722525" fill="var(--info-text)">conversation turns</text>

  <rect x="940" y="364.8" width="278.571429" height="255.2" rx="8.91868" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1079.285714" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.296701" font-weight="bold" fill="var(--danger-text)">Truncation</text>
  <text x="1079.285714" y="480.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.722525" fill="var(--danger-text)">drop oldest ctx</text>
  <text x="1079.285714" y="515.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.722525" fill="var(--danger-text)">when window fills</text>
</svg>

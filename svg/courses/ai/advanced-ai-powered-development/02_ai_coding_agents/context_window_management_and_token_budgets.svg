<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--primary-accent)">Context Window Management and Token Budgets</text>

  <text x="640" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-muted)">Total Context Window (e.g., 200K tokens)</text>

  <rect x="80" y="160" width="200" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">System Prompt</text>
  <text x="180" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">~5K tokens</text>
  <text x="180" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">(2.5%)</text>

  <rect x="310" y="160" width="560" height="120" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="590" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Conversation + Tool Results</text>
  <text x="590" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">~120K tokens</text>
  <text x="590" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">(60%)</text>

  <rect x="900" y="160" width="300" height="120" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1050" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Response Budget</text>
  <text x="1050" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">~75K tokens</text>
  <text x="1050" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">(37.5%)</text>

  <text x="640" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Strategies Agents Use to Stay Within Budget</text>

  <rect x="80" y="370" width="260" height="220" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="210" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Repo Maps</text>
  <text x="210" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">compact outline</text>
  <text x="210" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">of files + symbols</text>
  <text x="210" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">(Aider approach)</text>

  <rect x="360" y="370" width="260" height="220" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="490" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Selective Read</text>
  <text x="490" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">load only files</text>
  <text x="490" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">relevant to step</text>

  <rect x="640" y="370" width="260" height="220" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="770" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Summarization</text>
  <text x="770" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">compress older</text>
  <text x="770" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">conversation turns</text>

  <rect x="920" y="370" width="260" height="220" rx="8" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1050" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Truncation</text>
  <text x="1050" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">drop oldest ctx</text>
  <text x="1050" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">when window fills</text>
</svg>

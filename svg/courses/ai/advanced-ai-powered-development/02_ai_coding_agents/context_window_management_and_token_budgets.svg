<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:rect width="252.8395" height="640" fill="var(--code-bg)" />
  <ns0:text x="126.4198" y="56" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Context Window Management and Token Budgets</ns0:text>
  <ns0:rect x="9.4815" y="96" width="233.8765" height="96" fill="var(--text-muted)" rx="2.5284" />
  <ns0:text x="126.4198" y="155.2" text-anchor="middle" fill="var(--bg)" font-size="10">Total Context Window (e.g., 200K tokens)</ns0:text>
  <ns0:rect x="9.4815" y="224" width="58.4691" height="88" fill="var(--primary-dk)" rx="1.8963" />
  <ns0:text x="38.558" y="260.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">System Prompt</ns0:text>
  <ns0:text x="38.558" y="291.2" text-anchor="middle" fill="var(--primary-lt)" font-size="10">~5K tokens (2.5%)</ns0:text>
  <ns0:rect x="67.9506" y="224" width="101.1358" height="88" fill="var(--ok-mid)" rx="1.8963" />
  <ns0:text x="118.5185" y="260.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Conversation + Tool Results</ns0:text>
  <ns0:text x="118.5185" y="291.2" text-anchor="middle" fill="var(--ok-pale2)" font-size="10">~120K tokens (60%)</ns0:text>
  <ns0:rect x="169.0864" y="224" width="74.2716" height="88" fill="var(--danger-deeper)" rx="1.8963" />
  <ns0:text x="206.0642" y="260.8" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Available for Response</ns0:text>
  <ns0:text x="206.0642" y="291.2" text-anchor="middle" fill="var(--warn-tint)" font-size="10">~75K tokens (37.5%)</ns0:text>
  <ns0:rect x="9.4815" y="360" width="233.8765" height="248" rx="3.1605" fill="var(--text-dark)" stroke="var(--text-faint)" stroke-width="0.316" />
  <ns0:text x="126.4198" y="408" text-anchor="middle" fill="var(--warn-amber)" font-size="10" font-weight="bold">Strategies Agents Use to Stay Within Budget</ns0:text>
  <ns0:rect x="15.8025" y="432" width="52.1481" height="144" rx="2.5284" fill="var(--primary-dk)" fill-opacity="0.7" />
  <ns0:text x="41.7185" y="472" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Repo Maps</ns0:text>
  <ns0:text x="41.7185" y="504" text-anchor="middle" fill="var(--primary-lt)" font-size="10">compact outline</ns0:text>
  <ns0:text x="41.7185" y="532.8" text-anchor="middle" fill="var(--primary-lt)" font-size="10">of files + symbols</ns0:text>
  <ns0:text x="41.7185" y="561.6" text-anchor="middle" fill="var(--primary-lt)" font-size="10">(Aider approach)</ns0:text>
  <ns0:rect x="72.6914" y="432" width="52.1481" height="144" rx="2.5284" fill="var(--ok-mid)" fill-opacity="0.7" />
  <ns0:text x="98.6074" y="472" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Selective Read</ns0:text>
  <ns0:text x="98.6074" y="504" text-anchor="middle" fill="var(--ok-pale2)" font-size="10">load only files</ns0:text>
  <ns0:text x="98.6074" y="532.8" text-anchor="middle" fill="var(--ok-pale2)" font-size="10">relevant to step</ns0:text>
  <ns0:rect x="129.5802" y="432" width="52.1481" height="144" rx="2.5284" fill="var(--info-vivid)" fill-opacity="0.7" />
  <ns0:text x="155.4963" y="472" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Summarization</ns0:text>
  <ns0:text x="155.4963" y="504" text-anchor="middle" fill="var(--info-pale)" font-size="10">compress older</ns0:text>
  <ns0:text x="155.4963" y="532.8" text-anchor="middle" fill="var(--info-pale)" font-size="10">conversation turns</ns0:text>
  <ns0:rect x="186.4691" y="432" width="52.1481" height="144" rx="2.5284" fill="var(--danger-deeper)" fill-opacity="0.7" />
  <ns0:text x="212.3852" y="472" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Truncation</ns0:text>
  <ns0:text x="212.3852" y="504" text-anchor="middle" fill="var(--warn-tint)" font-size="10">drop oldest ctx</ns0:text>
  <ns0:text x="212.3852" y="532.8" text-anchor="middle" fill="var(--warn-tint)" font-size="10">when window fills</ns0:text>
</ns0:svg>
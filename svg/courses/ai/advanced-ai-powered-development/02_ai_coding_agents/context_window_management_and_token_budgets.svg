<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.152507945735" font-weight="bold" fill="var(--text-muted)">Total Context Window (e.g., 200K tokens)</text>

  <rect x="40" y="65.777777777778" width="214.285714" height="154.666666666667" rx="7.050835630548" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.142857" y="117.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.152507945735" font-weight="bold" fill="var(--primary-text)">System Prompt</text>
  <text x="147.142857" y="168.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.802228348127" fill="var(--primary-text)">~5K tokens</text>
  <text x="147.142857" y="201.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.802228348127" fill="var(--primary-text)">(2.5%)</text>

  <rect x="286.428571" y="65.777777777778" width="600" height="154.666666666667" rx="7.050835630548" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="586.428571" y="117.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.152507945735" font-weight="bold" fill="var(--ok-text)">Conversation + Tool Results</text>
  <text x="586.428571" y="168.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.802228348127" fill="var(--ok-text)">~120K tokens</text>
  <text x="586.428571" y="201.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.802228348127" fill="var(--ok-text)">(60%)</text>

  <rect x="918.571429" y="65.777777777778" width="321.428571" height="154.666666666667" rx="7.050835630548" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1079.285714" y="117.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.152507945735" font-weight="bold" fill="var(--danger-text)">Response Budget</text>
  <text x="1079.285714" y="168.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.802228348127" fill="var(--danger-text)">~75K tokens</text>
  <text x="1079.285714" y="201.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.802228348127" fill="var(--danger-text)">(37.5%)</text>

  <text x="640" y="291.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.853065032767" font-weight="bold" fill="var(--text)">Strategies Agents Use to Stay Within Budget</text>

  <rect x="40" y="336.444444444444" width="278.571429" height="283.555555555556" rx="9.401114174064" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179.285714" y="394.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.502786489251" font-weight="bold" fill="var(--primary-text)">Repo Maps</text>
  <text x="179.285714" y="465.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.627089076369" fill="var(--primary-text)">compact outline</text>
  <text x="179.285714" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.627089076369" fill="var(--primary-text)">of files + symbols</text>
  <text x="179.285714" y="574.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.451949804611" fill="var(--primary-text)">(Aider approach)</text>

  <rect x="340" y="336.444444444444" width="278.571429" height="283.555555555556" rx="9.401114174064" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="479.285714" y="394.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.502786489251" font-weight="bold" fill="var(--ok-text)">Selective Read</text>
  <text x="479.285714" y="465.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.627089076369" fill="var(--ok-text)">load only files</text>
  <text x="479.285714" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.627089076369" fill="var(--ok-text)">relevant to step</text>

  <rect x="640" y="336.444444444444" width="278.571429" height="283.555555555556" rx="9.401114174064" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="779.285714" y="394.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.502786489251" font-weight="bold" fill="var(--info-text)">Summarization</text>
  <text x="779.285714" y="465.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.627089076369" fill="var(--info-text)">compress older</text>
  <text x="779.285714" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.627089076369" fill="var(--info-text)">conversation turns</text>

  <rect x="940" y="336.444444444444" width="278.571429" height="283.555555555556" rx="9.401114174064" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1079.285714" y="394.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.502786489251" font-weight="bold" fill="var(--danger-text)">Truncation</text>
  <text x="1079.285714" y="465.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.627089076369" fill="var(--danger-text)">drop oldest ctx</text>
  <text x="1079.285714" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.627089076369" fill="var(--danger-text)">when window fills</text>
</svg>

  <text x="1045" y="329.436893203883" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--info-text)">Issue to PR</text>
  <text x="1045" y="358.718446601942" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--info-text)">Plan before code</text>

  <rect x="870" y="411.650485436893" width="350" height="135.145631067962" rx="6.367392662652" fill="var(--info-accent)"/>
  <text x="1045" y="451.067961165048" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.040945877512" font-weight="bold" fill="var(--info-text)">SWE-Agent</text>
  <text x="1045" y="481.47572815534" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--info-text)">Princeton research</text>
  <text x="1045" y="510.757281553398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--info-text)">SWE-bench</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--text-muted)">Choose by autonomy, IDE fit, price</text>
</svg>

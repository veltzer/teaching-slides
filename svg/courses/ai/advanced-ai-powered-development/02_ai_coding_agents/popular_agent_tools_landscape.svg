  <text x="237" y="85.048543689321" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.224642208838" font-weight="bold" fill="var(--warn-text)">CLI / Terminal</text>

  <rect x="60" y="107.57281553398" width="355" height="135.145631067962" rx="6.367392662652" fill="var(--warn-accent)"/>

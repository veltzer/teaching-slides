<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="70" rx="6" fill="var(--code-bg)"/>
  <text x="640" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)">Popular AI Coding Agent Tools</text>

  <rect x="40" y="130" width="395" height="460" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="237" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">CLI / Terminal</text>
  <rect x="60" y="190" width="355" height="115" rx="6" fill="var(--warn-accent)"/>
  <text x="237" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Claude Code</text>
  <text x="237" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Anthropic official CLI</text>
  <text x="237" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">shell + file + git tools</text>
  <rect x="60" y="320" width="355" height="115" rx="6" fill="var(--warn-accent)"/>
  <text x="237" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Aider</text>
  <text x="237" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">git-native pair programming</text>
  <text x="237" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">each turn = one commit</text>
  <rect x="60" y="450" width="355" height="115" rx="6" fill="var(--warn-accent)"/>
  <text x="237" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Cline / OpenHands</text>
  <text x="237" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">open source, bring-your-key</text>
  <text x="237" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">runs in VS Code or standalone</text>

  <rect x="445" y="130" width="395" height="460" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="642" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">IDE-Integrated</text>
  <rect x="465" y="190" width="355" height="115" rx="6" fill="var(--primary-accent)"/>
  <text x="642" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Cursor</text>
  <text x="642" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">AI-native fork of VS Code</text>
  <text x="642" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">inline edits, composer agent</text>
  <rect x="465" y="320" width="355" height="115" rx="6" fill="var(--primary-accent)"/>
  <text x="642" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Windsurf</text>
  <text x="642" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Codeium Cascade engine</text>
  <text x="642" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">flow-aware multi-file edits</text>
  <rect x="465" y="450" width="355" height="115" rx="6" fill="var(--primary-accent)"/>
  <text x="642" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Copilot + Chat</text>
  <text x="642" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">GitHub, VS Code, JetBrains</text>
  <text x="642" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">agent mode added 2025</text>

  <rect x="850" y="130" width="390" height="460" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1045" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Autonomous Platforms</text>
  <rect x="870" y="190" width="350" height="115" rx="6" fill="var(--info-accent)"/>
  <text x="1045" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Devin</text>
  <text x="1045" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Cognition AI, hosted VM</text>
  <text x="1045" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">plans, browses, long-running</text>
  <rect x="870" y="320" width="350" height="115" rx="6" fill="var(--info-accent)"/>
  <text x="1045" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Copilot Workspace</text>
  <text x="1045" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">GitHub, issue to PR</text>
  <text x="1045" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">spec and plan before code</text>
  <rect x="870" y="450" width="350" height="115" rx="6" fill="var(--info-accent)"/>
  <text x="1045" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">SWE-Agent</text>
  <text x="1045" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Princeton research, open</text>
  <text x="1045" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">SWE-bench reference agent</text>

  <text x="640" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Choose by autonomy level, IDE fit, tool access, and price</text>
</svg>

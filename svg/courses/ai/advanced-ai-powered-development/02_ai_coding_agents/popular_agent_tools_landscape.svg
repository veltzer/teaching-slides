  <text x="237" y="177.398058252427" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--warn-text)">Anthropic official</text>
  <text x="237" y="206.679611650485" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--warn-text)">Shell + file tools</text>

  <rect x="60" y="259.611650485437" width="355" height="135.145631067962" rx="6.367392662652" fill="var(--warn-accent)"/>
  <text x="237" y="299.029126213592" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.040945877512" font-weight="bold" fill="var(--warn-text)">Aider</text>
  <text x="237" y="329.436893203883" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--warn-text)">Git-native pair</text>
  <text x="237" y="358.718446601942" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--warn-text)">Commit per turn</text>

  <rect x="60" y="411.650485436893" width="355" height="135.145631067962" rx="6.367392662652" fill="var(--warn-accent)"/>
  <text x="237" y="451.067961165048" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.040945877512" font-weight="bold" fill="var(--warn-text)">Cline / OpenHands</text>
  <text x="237" y="481.47572815534" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--warn-text)">Open source</text>
  <text x="237" y="510.757281553398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--warn-text)">Bring your key</text>

  <rect x="445" y="40" width="395" height="551.844660194175" rx="10.61232110442" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="85.048543689321" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.224642208838" font-weight="bold" fill="var(--primary-text)">IDE-Integrated</text>

  <rect x="465" y="107.57281553398" width="355" height="135.145631067962" rx="6.367392662652" fill="var(--primary-accent)"/>
  <text x="642" y="146.990291262136" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.040945877512" font-weight="bold" fill="var(--primary-text)">Cursor</text>
  <text x="642" y="177.398058252427" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">VS Code fork</text>
  <text x="642" y="206.679611650485" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">Inline + composer</text>

  <rect x="465" y="259.611650485437" width="355" height="135.145631067962" rx="6.367392662652" fill="var(--primary-accent)"/>
  <text x="642" y="299.029126213592" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.040945877512" font-weight="bold" fill="var(--primary-text)">Windsurf</text>
  <text x="642" y="329.436893203883" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">Codeium Cascade</text>
  <text x="642" y="358.718446601942" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">Multi-file edits</text>


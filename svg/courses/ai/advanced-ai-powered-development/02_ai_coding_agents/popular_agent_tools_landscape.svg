<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="701.7284" height="580" fill="var(--code-bg)" rx="6" x="289.1358" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" fill="var(--bg)" font-size="17.5432" font-weight="bold">Popular AI Coding Agent Tools</text>
  <text x="464.5679" y="141.5" text-anchor="middle" fill="var(--warn-accent)" font-size="12.2802" font-weight="bold">CLI / Terminal</text>
  <rect x="306.679" y="156" width="149.1173" height="87" fill="var(--warn-accent)" rx="6" />
  <text x="381.2376" y="196.6" text-anchor="middle" fill="var(--bg)" font-size="12.2802" font-weight="bold">Claude Code</text>
  <text x="381.2376" y="225.6" text-anchor="middle" fill="var(--warn-accent)" font-size="10">Anthropic</text>
  <rect x="464.5679" y="156" width="149.1173" height="87" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="539.1266" y="196.6" text-anchor="middle" fill="var(--bg)" font-size="12.2802" font-weight="bold">Aider</text>
  <text x="539.1266" y="225.6" text-anchor="middle" fill="var(--ok-accent)" font-size="10">git-native agent</text>
  <text x="464.5679" y="293.75" text-anchor="middle" fill="var(--primary-accent)" font-size="12.2802" font-weight="bold">IDE-Integrated</text>
  <rect x="306.679" y="308.25" width="149.1173" height="87" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="381.2376" y="348.85" text-anchor="middle" fill="var(--bg)" font-size="12.2802" font-weight="bold">Cursor</text>
  <text x="381.2376" y="377.85" text-anchor="middle" fill="var(--primary-accent)" font-size="10">AI-native editor</text>
  <rect x="464.5679" y="308.25" width="149.1173" height="87" fill="var(--primary-accent)" rx="6" />
  <text x="539.1266" y="348.85" text-anchor="middle" fill="var(--bg)" font-size="12.2802" font-weight="bold">Windsurf</text>
  <text x="539.1266" y="377.85" text-anchor="middle" fill="var(--primary-accent)" font-size="10">Codeium</text>
  <rect x="306.679" y="409.75" width="149.1173" height="87" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="381.2376" y="450.35" text-anchor="middle" fill="var(--bg)" font-size="12.2802" font-weight="bold">Cline</text>
  <text x="381.2376" y="479.3501" text-anchor="middle" fill="var(--warn-accent)" font-size="10">open source</text>
  <text x="797.8889" y="141.5" text-anchor="middle" fill="var(--info-accent)" font-size="12.2802" font-weight="bold">Autonomous Platforms</text>
  <rect x="666.3149" y="156" width="153.5031" height="87" fill="var(--text-muted)" rx="6" />
  <text x="742.6278" y="196.6" text-anchor="middle" fill="var(--bg)" font-size="12.2802" font-weight="bold">Copilot</text>
  <text x="742.6278" y="225.6" text-anchor="middle" fill="var(--border)" font-size="10">Workspace (GitHub)</text>
  <rect x="828.5895" y="156" width="149.1173" height="87" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="903.1482" y="196.6" text-anchor="middle" fill="var(--bg)" font-size="12.2802" font-weight="bold">Devin</text>
  <text x="903.1482" y="225.6" text-anchor="middle" fill="var(--info-accent)" font-size="10">Cognition AI</text>
  <rect x="666.3149" y="308.25" width="153.5031" height="87" fill="var(--ok-accent)" rx="6" />
  <text x="742.6278" y="348.85" text-anchor="middle" fill="var(--bg)" font-size="12.2802" font-weight="bold">OpenHands</text>
  <text x="742.6278" y="377.85" text-anchor="middle" fill="var(--ok-accent)" font-size="10">open source</text>
  <rect x="828.5895" y="308.25" width="149.1173" height="87" fill="var(--danger-accent)" rx="6" />
  <text x="903.1482" y="348.85" text-anchor="middle" fill="var(--bg)" font-size="12.2802" font-weight="bold">SWE-Agent</text>
  <text x="903.1482" y="377.85" text-anchor="middle" fill="var(--warn-accent)" font-size="10">Princeton research</text>
  <line x1="635.6142" y1="127" x2="635.6142" y2="533" stroke="var(--text)" stroke-width="1.4519" stroke-dasharray="4.8395 3.8716" />
  <rect x="306.679" y="525.7501" width="666.642" height="72.5" rx="6" fill="var(--warn-fill)" fill-opacity="0.15" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="559.1" text-anchor="middle" fill="var(--warn-accent)" font-size="11.4031">SWE-bench: top agents solve 40-50% of real GitHub issues autonomously</text>
  <text x="640" y="588.1" text-anchor="middle" fill="var(--border)" font-size="10">Choose based on: autonomy level, IDE integration, tool access, pricing</text>
</svg>
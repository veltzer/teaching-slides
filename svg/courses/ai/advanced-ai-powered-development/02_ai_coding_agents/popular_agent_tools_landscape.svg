  <text x="1045" y="177.398058252427" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--info-text)">Hosted VM</text>
  <text x="1045" y="206.679611650485" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--info-text)">Long-running</text>


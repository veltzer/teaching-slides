<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="70.608696" rx="6.02603" fill="var(--code-bg)"/>
  <text x="640" y="85.391304" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445" font-weight="bold" fill="var(--bg)">Popular AI Coding Agent Tools</text>

  <rect x="40" y="130.782609" width="395" height="464" rx="6.02603" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237" y="171.130435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.078091" font-weight="bold" fill="var(--warn-text)">CLI / Terminal</text>
  <rect x="60" y="191.304348" width="355" height="116" rx="6.02603" fill="var(--warn-accent)"/>
  <text x="237" y="226.608696" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" font-weight="bold" fill="var(--warn-text)">Claude Code</text>
  <text x="237" y="251.826087" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--warn-text)">Anthropic official CLI</text>
  <text x="237" y="277.043478" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--warn-text)">shell + file + git tools</text>
  <rect x="60" y="322.434783" width="355" height="116" rx="6.02603" fill="var(--warn-accent)"/>
  <text x="237" y="357.73913" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" font-weight="bold" fill="var(--warn-text)">Aider</text>
  <text x="237" y="382.956522" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--warn-text)">git-native pair programming</text>
  <text x="237" y="408.173913" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--warn-text)">each turn = one commit</text>
  <rect x="60" y="453.565217" width="355" height="116" rx="6.02603" fill="var(--warn-accent)"/>
  <text x="237" y="488.869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" font-weight="bold" fill="var(--warn-text)">Cline / OpenHands</text>
  <text x="237" y="514.086957" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--warn-text)">open source, bring-your-key</text>
  <text x="237" y="539.304348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--warn-text)">runs in VS Code or standalone</text>

  <rect x="445" y="130.782609" width="395" height="464" rx="6.02603" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="171.130435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.078091" font-weight="bold" fill="var(--primary-text)">IDE-Integrated</text>
  <rect x="465" y="191.304348" width="355" height="116" rx="6.02603" fill="var(--primary-accent)"/>
  <text x="642" y="226.608696" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" font-weight="bold" fill="var(--primary-text)">Cursor</text>
  <text x="642" y="251.826087" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--primary-text)">AI-native fork of VS Code</text>
  <text x="642" y="277.043478" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--primary-text)">inline edits, composer agent</text>
  <rect x="465" y="322.434783" width="355" height="116" rx="6.02603" fill="var(--primary-accent)"/>
  <text x="642" y="357.73913" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" font-weight="bold" fill="var(--primary-text)">Windsurf</text>
  <text x="642" y="382.956522" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--primary-text)">Codeium Cascade engine</text>
  <text x="642" y="408.173913" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--primary-text)">flow-aware multi-file edits</text>
  <rect x="465" y="453.565217" width="355" height="116" rx="6.02603" fill="var(--primary-accent)"/>
  <text x="642" y="488.869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" font-weight="bold" fill="var(--primary-text)">Copilot + Chat</text>
  <text x="642" y="514.086957" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--primary-text)">GitHub, VS Code, JetBrains</text>
  <text x="642" y="539.304348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--primary-text)">agent mode added 2025</text>

  <rect x="850" y="130.782609" width="390" height="464" rx="6.02603" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="171.130435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.078091" font-weight="bold" fill="var(--info-text)">Autonomous Platforms</text>
  <rect x="870" y="191.304348" width="350" height="116" rx="6.02603" fill="var(--info-accent)"/>
  <text x="1045" y="226.608696" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" font-weight="bold" fill="var(--info-text)">Devin</text>
  <text x="1045" y="251.826087" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--info-text)">Cognition AI, hosted VM</text>
  <text x="1045" y="277.043478" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--info-text)">plans, browses, long-running</text>
  <rect x="870" y="322.434783" width="350" height="116" rx="6.02603" fill="var(--info-accent)"/>
  <text x="1045" y="357.73913" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" font-weight="bold" fill="var(--info-text)">Copilot Workspace</text>
  <text x="1045" y="382.956522" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--info-text)">GitHub, issue to PR</text>
  <text x="1045" y="408.173913" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--info-text)">spec and plan before code</text>
  <rect x="870" y="453.565217" width="350" height="116" rx="6.02603" fill="var(--info-accent)"/>
  <text x="1045" y="488.869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" font-weight="bold" fill="var(--info-text)">SWE-Agent</text>
  <text x="1045" y="514.086957" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--info-text)">Princeton research, open</text>
  <text x="1045" y="539.304348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--info-text)">SWE-bench reference agent</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--text-muted)">Choose by autonomy level, IDE fit, tool access, and price</text>
</svg>

  <text x="642" y="451.067961165048" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.040945877512" font-weight="bold" fill="var(--primary-text)">Copilot + Chat</text>
  <text x="642" y="481.47572815534" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">GitHub / JetBrains</text>
  <text x="642" y="510.757281553398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">Agent mode</text>


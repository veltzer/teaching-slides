  <text x="577.0399" y="566.1538" text-anchor="middle" font-size="13.1146" fill="var(--ok-accent)">Measured</text>
  <rect x="668.8417" y="344.6154" width="144.26" height="295.3846" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />

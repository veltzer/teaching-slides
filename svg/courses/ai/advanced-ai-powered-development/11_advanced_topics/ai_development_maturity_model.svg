<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="216.3935" height="580" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.1966" y="281.6667" text-anchor="middle" font-size="24.7579" fill="var(--danger-accent)" font-family="Arial, sans-serif">Level 1</text>
  <text x="148.1966" y="475" text-anchor="middle" font-size="22.5073" fill="var(--danger-accent)" font-family="Arial, sans-serif">Ad-hoc / Individual</text>
  <rect x="285.9016" y="40" width="216.3935" height="580" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="394.0984" y="281.6667" text-anchor="middle" font-size="24.7579" fill="var(--warn-accent)" font-family="Arial, sans-serif">Level 2</text>
  <text x="394.0984" y="475" text-anchor="middle" font-size="22.5073" fill="var(--warn-accent)" font-family="Arial, sans-serif">Team-Adopted</text>
  <rect x="531.8033" y="40" width="216.3935" height="580" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="281.6667" text-anchor="middle" font-size="24.7579" fill="var(--warn-accent)" font-family="Arial, sans-serif">Level 3</text>
  <text x="640.0001" y="475" text-anchor="middle" font-size="22.5073" fill="var(--warn-accent)" font-family="Arial, sans-serif">Standardized</text>
  <rect x="777.7048" y="40" width="216.3935" height="580" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="885.9016" y="281.6667" text-anchor="middle" font-size="24.7579" fill="var(--ok-accent)" font-family="Arial, sans-serif">Level 4</text>
  <text x="885.9016" y="475" text-anchor="middle" font-size="22.5073" fill="var(--ok-accent)" font-family="Arial, sans-serif">Measured</text>
  <rect x="1023.6065" y="40" width="216.3935" height="580" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1131.8033" y="281.6667" text-anchor="middle" font-size="24.7579" fill="var(--ok-accent)" font-family="Arial, sans-serif">Level 5</text>
  <text x="1131.8033" y="475" text-anchor="middle" font-size="22.5073" fill="var(--ok-accent)" font-family="Arial, sans-serif">Platform-Level</text>
  <line x1="256.3933" y1="330.0001" x2="285.9016" y2="330.0001" stroke="var(--text)" stroke-width="1.9672" marker-end="url(#arrow)"/>
  <line x1="502.2952" y1="330.0001" x2="531.8033" y2="330.0001" stroke="var(--text)" stroke-width="1.9672" marker-end="url(#arrow)"/>
  <line x1="748.1968" y1="330.0001" x2="777.7048" y2="330.0001" stroke="var(--text)" stroke-width="1.9672" marker-end="url(#arrow)"/>
  <line x1="994.0984" y1="330.0001" x2="1023.6065" y2="330.0001" stroke="var(--text)" stroke-width="1.9672" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

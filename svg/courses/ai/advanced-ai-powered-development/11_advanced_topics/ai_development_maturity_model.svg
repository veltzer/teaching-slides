<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="80" y="123.2274" width="201.9673" height="413.5451" rx="8.4001" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="180.9835" y="295.5379" text-anchor="middle" font-size="20.1967" fill="var(--danger-accent)">Level 1</text>
  <text x="180.9835" y="433.3862" text-anchor="middle" font-size="18.3607" fill="var(--danger-accent)">Ad-hoc / Individual</text>
  <rect x="309.5082" y="123.2274" width="201.9673" height="413.5451" rx="8.4001" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="410.4918" y="295.5379" text-anchor="middle" font-size="20.1967" fill="var(--warn-accent)">Level 2</text>
  <text x="410.4918" y="433.3862" text-anchor="middle" font-size="18.3607" fill="var(--warn-accent)">Team-Adopted</text>
  <rect x="539.0164" y="123.2274" width="201.9673" height="413.5451" rx="8.4001" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640.0001" y="295.5379" text-anchor="middle" font-size="20.1967" fill="var(--warn-accent)">Level 3</text>
  <text x="640.0001" y="433.3862" text-anchor="middle" font-size="18.3607" fill="var(--warn-accent)">Standardized</text>
  <rect x="768.5245" y="123.2274" width="201.9673" height="413.5451" rx="8.4001" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="869.5082" y="295.5379" text-anchor="middle" font-size="20.1967" fill="var(--ok-accent)">Level 4</text>
  <text x="869.5082" y="433.3862" text-anchor="middle" font-size="18.3607" fill="var(--ok-accent)">Measured</text>
  <rect x="998.0327" y="123.2274" width="201.9673" height="413.5451" rx="8.4001" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1099.0164" y="295.5379" text-anchor="middle" font-size="20.1967" fill="var(--ok-accent)">Level 5</text>
  <text x="1099.0164" y="433.3862" text-anchor="middle" font-size="18.3607" fill="var(--ok-accent)">Platform-Level</text>
  <line x1="281.9671" y1="330" x2="309.5082" y2="330" stroke="var(--text)" stroke-width="1.9672" marker-end="url(#arr)" />
  <line x1="511.4755" y1="330" x2="539.0164" y2="330" stroke="var(--text)" stroke-width="1.9672" marker-end="url(#arr)" />
  <line x1="740.9837" y1="330" x2="768.5245" y2="330" stroke="var(--text)" stroke-width="1.9672" marker-end="url(#arr)" />
  <line x1="970.4918" y1="330" x2="998.0327" y2="330" stroke="var(--text)" stroke-width="1.9672" marker-end="url(#arr)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 42.6223 80 L 0 160 z" fill="#333" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:#1a1a2e">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" fill="var(--bg)" font-size="10.0549" font-weight="bold">Temperature: How Sampling Affects Output</text>
  <rect x="536.4597" y="85.1297" width="207.0807" height="91.9309" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="0.4291" />
  <rect x="537.0349" y="88.4726" width="69.0269" height="85.2449" rx="6" fill="var(--primary-accent)" />
  <rect x="606.0618" y="88.4726" width="68.4517" height="85.2449" rx="6" fill="var(--info-accent)" />
  <rect x="674.5134" y="88.4726" width="68.4517" height="85.2449" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="571.5484" y="126.9165" text-anchor="middle" fill="var(--bg)" font-size="10.0549" font-weight="bold">0.0 — Deterministic</text>
  <text x="571.5484" y="157.0029" text-anchor="middle" fill="var(--primary-accent)" font-size="10.0549">same output every run</text>
  <text x="640.2876" y="126.9165" text-anchor="middle" fill="var(--bg)" font-size="10.0549" font-weight="bold">0.4-0.7 — Balanced</text>
  <text x="640.2876" y="157.0029" text-anchor="middle" fill="var(--info-accent)" font-size="10.0549">slight variation</text>
  <text x="708.7393" y="126.9165" text-anchor="middle" fill="var(--bg)" font-size="10.0549" font-weight="bold">1.0+ — Creative</text>
  <text x="708.7393" y="157.0029" text-anchor="middle" fill="var(--warn-accent)" font-size="10.0549">high variation</text>
  <rect x="536.4597" y="223.8617" width="97.7881" height="208.9337" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="0.4291" />
  <text x="585.3537" y="274.0058" text-anchor="middle" fill="var(--primary-accent)" font-size="10.0549" font-weight="bold">Low Temperature (0.0-0.3)</text>
  <text x="542.2119" y="319.1354" fill="var(--border)" font-size="10.0549">▶ Code generation and completion</text>
  <text x="542.2119" y="357.5793" fill="var(--border)" font-size="10.0549">▶ JSON / structured output</text>
  <text x="542.2119" y="396.023" fill="var(--border)" font-size="10.0549">▶ Bug fixing — need accuracy</text>
  <text x="542.2119" y="422.7666" fill="var(--primary-accent)" font-size="10.0549">deterministic, reproducible, reliable</text>
  <rect x="645.7523" y="223.8617" width="97.7881" height="208.9337" rx="6" fill="var(--info-accent)" stroke="var(--info-border)" stroke-width="0.4291" />
  <text x="694.6463" y="274.0058" text-anchor="middle" fill="var(--info-accent)" font-size="10.0549" font-weight="bold">High Temperature (0.7-1.0)</text>
  <text x="651.5045" y="319.1354" fill="var(--border)" font-size="10.0549">▶ Brainstorming solutions</text>
  <text x="651.5045" y="357.5793" fill="var(--border)" font-size="10.0549">▶ Generating test variations</text>
  <text x="651.5045" y="396.023" fill="var(--border)" font-size="10.0549">▶ Creative naming / docs</text>
  <text x="651.5045" y="422.7666" fill="var(--info-accent)" font-size="10.0549">diverse, creative, less predictable</text>
  <rect x="536.4597" y="469.5677" width="207.0807" height="150.4323" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="0.4291" />
  <text x="640.0001" y="519.7119" text-anchor="middle" fill="var(--warn-accent)" font-size="10.0549" font-weight="bold">Other Key Parameters</text>
  <text x="542.2119" y="561.4986" fill="var(--border)" font-size="10.0549">▶ top_p (nucleus sampling): 0.95 is a safe default — controls token probability mass</text>
  <text x="542.2119" y="599.9423" fill="var(--border)" font-size="10.0549">▶ frequency_penalty: reduces repetition in long outputs — useful for documentation</text>
</svg>
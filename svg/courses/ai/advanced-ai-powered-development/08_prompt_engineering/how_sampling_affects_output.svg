<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:#1a1a2e">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="114.4163" y="63.1688" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Temperature: How Sampling Affects Output</ns0:text>
  <ns0:rect x="11.4416" y="108.0519" width="205.9493" height="91.4286" rx="1.7162" fill="#1a1a2e" stroke="#1a237e" stroke-width="0.4291" />
  <ns0:rect x="12.0137" y="111.3766" width="68.6498" height="84.7792" rx="1.4302" fill="#1a237e" />
  <ns0:rect x="80.6635" y="111.3766" width="68.0777" height="84.7792" rx="1.4302" fill="#4a148c" />
  <ns0:rect x="148.7411" y="111.3766" width="68.0777" height="84.7792" rx="1.4302" fill="#dc3545" />
  <ns0:text x="46.3386" y="149.6104" text-anchor="middle" fill="white" font-size="10" font-weight="bold">0.0 — Deterministic</ns0:text>
  <ns0:text x="46.3386" y="179.5325" text-anchor="middle" fill="#90CAF9" font-size="10">same output every run</ns0:text>
  <ns0:text x="114.7023" y="149.6104" text-anchor="middle" fill="white" font-size="10" font-weight="bold">0.4-0.7 — Balanced</ns0:text>
  <ns0:text x="114.7023" y="179.5325" text-anchor="middle" fill="#CE93D8" font-size="10">slight variation</ns0:text>
  <ns0:text x="182.78" y="149.6104" text-anchor="middle" fill="white" font-size="10" font-weight="bold">1.0+ — Creative</ns0:text>
  <ns0:text x="182.78" y="179.5325" text-anchor="middle" fill="#ffcc80" font-size="10">high variation</ns0:text>
  <ns0:rect x="11.4416" y="246.026" width="97.2538" height="207.7922" rx="2.8604" fill="#1a237e" stroke="#1565C0" stroke-width="0.4291" />
  <ns0:text x="60.0685" y="295.8961" text-anchor="middle" fill="#90CAF9" font-size="10" font-weight="bold">Low Temperature (0.0-0.3)</ns0:text>
  <ns0:text x="17.1624" y="340.7792" fill="#E0E0E0" font-size="10">▶ Code generation and completion</ns0:text>
  <ns0:text x="17.1624" y="379.013" fill="#E0E0E0" font-size="10">▶ JSON / structured output</ns0:text>
  <ns0:text x="17.1624" y="417.2467" fill="#E0E0E0" font-size="10">▶ Bug fixing — need accuracy</ns0:text>
  <ns0:text x="17.1624" y="443.8442" fill="#90CAF9" font-size="10">deterministic, reproducible, reliable</ns0:text>
  <ns0:rect x="120.1371" y="246.026" width="97.2538" height="207.7922" rx="2.8604" fill="#4a148c" stroke="#9C27B0" stroke-width="0.4291" />
  <ns0:text x="168.764" y="295.8961" text-anchor="middle" fill="#CE93D8" font-size="10" font-weight="bold">High Temperature (0.7-1.0)</ns0:text>
  <ns0:text x="125.8579" y="340.7792" fill="#E0E0E0" font-size="10">▶ Brainstorming solutions</ns0:text>
  <ns0:text x="125.8579" y="379.013" fill="#E0E0E0" font-size="10">▶ Generating test variations</ns0:text>
  <ns0:text x="125.8579" y="417.2467" fill="#E0E0E0" font-size="10">▶ Creative naming / docs</ns0:text>
  <ns0:text x="125.8579" y="443.8442" fill="#CE93D8" font-size="10">diverse, creative, less predictable</ns0:text>
  <ns0:rect x="11.4416" y="490.3896" width="205.9493" height="149.6104" rx="2.8604" fill="#1a1a2e" stroke="#F9A825" stroke-width="0.4291" />
  <ns0:text x="114.4163" y="540.2598" text-anchor="middle" fill="#F9A825" font-size="10" font-weight="bold">Other Key Parameters</ns0:text>
  <ns0:text x="17.1624" y="581.8182" fill="#E0E0E0" font-size="10">▶ top_p (nucleus sampling): 0.95 is a safe default — controls token probability mass</ns0:text>
  <ns0:text x="17.1624" y="620.0519" fill="#E0E0E0" font-size="10">▶ frequency_penalty: reduces repetition in long outputs — useful for documentation</ns0:text>
</ns0:svg>
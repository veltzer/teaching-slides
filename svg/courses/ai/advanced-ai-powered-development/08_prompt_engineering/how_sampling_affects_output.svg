<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:#1a1a2e">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="114.4163" y="63.1688" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Temperature: How Sampling Affects Output</text>
  <rect x="11.4416" y="108.0519" width="205.9493" height="91.4286" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="0.4291" />
  <rect x="12.0137" y="111.3766" width="68.6498" height="84.7792" rx="6" fill="var(--primary-accent)" />
  <rect x="80.6635" y="111.3766" width="68.0777" height="84.7792" rx="6" fill="var(--info-accent)" />
  <rect x="148.7411" y="111.3766" width="68.0777" height="84.7792" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="46.3386" y="149.6104" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">0.0 — Deterministic</text>
  <text x="46.3386" y="179.5325" text-anchor="middle" fill="var(--primary-accent)" font-size="10">same output every run</text>
  <text x="114.7023" y="149.6104" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">0.4-0.7 — Balanced</text>
  <text x="114.7023" y="179.5325" text-anchor="middle" fill="var(--info-accent)" font-size="10">slight variation</text>
  <text x="182.78" y="149.6104" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">1.0+ — Creative</text>
  <text x="182.78" y="179.5325" text-anchor="middle" fill="var(--warn-accent)" font-size="10">high variation</text>
  <rect x="11.4416" y="246.026" width="97.2538" height="207.7922" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="0.4291" />
  <text x="60.0685" y="295.8961" text-anchor="middle" fill="var(--primary-accent)" font-size="10" font-weight="bold">Low Temperature (0.0-0.3)</text>
  <text x="17.1624" y="340.7792" fill="var(--border)" font-size="10">▶ Code generation and completion</text>
  <text x="17.1624" y="379.013" fill="var(--border)" font-size="10">▶ JSON / structured output</text>
  <text x="17.1624" y="417.2467" fill="var(--border)" font-size="10">▶ Bug fixing — need accuracy</text>
  <text x="17.1624" y="443.8442" fill="var(--primary-accent)" font-size="10">deterministic, reproducible, reliable</text>
  <rect x="120.1371" y="246.026" width="97.2538" height="207.7922" rx="6" fill="var(--info-accent)" stroke="var(--info-border)" stroke-width="0.4291" />
  <text x="168.764" y="295.8961" text-anchor="middle" fill="var(--info-accent)" font-size="10" font-weight="bold">High Temperature (0.7-1.0)</text>
  <text x="125.8579" y="340.7792" fill="var(--border)" font-size="10">▶ Brainstorming solutions</text>
  <text x="125.8579" y="379.013" fill="var(--border)" font-size="10">▶ Generating test variations</text>
  <text x="125.8579" y="417.2467" fill="var(--border)" font-size="10">▶ Creative naming / docs</text>
  <text x="125.8579" y="443.8442" fill="var(--info-accent)" font-size="10">diverse, creative, less predictable</text>
  <rect x="11.4416" y="490.3896" width="205.9493" height="149.6104" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="0.4291" />
  <text x="114.4163" y="540.2598" text-anchor="middle" fill="var(--warn-accent)" font-size="10" font-weight="bold">Other Key Parameters</text>
  <text x="17.1624" y="581.8182" fill="var(--border)" font-size="10">▶ top_p (nucleus sampling): 0.95 is a safe default — controls token probability mass</text>
  <text x="17.1624" y="620.0519" fill="var(--border)" font-size="10">▶ frequency_penalty: reduces repetition in long outputs — useful for documentation</text>
</svg>
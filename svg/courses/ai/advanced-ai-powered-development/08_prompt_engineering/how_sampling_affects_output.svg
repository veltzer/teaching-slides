<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.245046" font-weight="bold" fill="var(--text)">Temperature: How Sampling Affects Output</text>

  <!-- Temperature scale -->
  <rect x="40" y="82.181818" width="393.103448" height="116" rx="8.355727" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978251" font-weight="bold" fill="var(--primary-text)">0.0 — Deterministic</text>
  <text x="236.551724" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711455" fill="var(--primary-text)">same output every run</text>

  <rect x="443.448276" y="82.181818" width="393.103448" height="116" rx="8.355727" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978251" font-weight="bold" fill="var(--info-text)">0.4–0.7 — Balanced</text>
  <text x="640" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711455" fill="var(--info-text)">slight variation</text>

  <rect x="846.896552" y="82.181818" width="393.103448" height="116" rx="8.355727" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448276" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978251" font-weight="bold" fill="var(--warn-text)">1.0+ — Creative</text>
  <text x="1043.448276" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711455" fill="var(--warn-text)">high variation</text>

  <!-- Two use case columns -->
  <rect x="40" y="229.818182" width="600" height="210.909091" rx="8.355727" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889319" font-weight="bold" fill="var(--primary-text)">Low Temp (0.0–0.3) — Use For</text>
  <text x="71.034483" y="319.454545" font-family="Arial, sans-serif" font-size="17.755921" fill="var(--primary-text)">• Code generation and completion</text>
  <text x="71.034483" y="356.363636" font-family="Arial, sans-serif" font-size="17.755921" fill="var(--primary-text)">• JSON / structured output</text>
  <text x="71.034483" y="393.272727" font-family="Arial, sans-serif" font-size="17.755921" fill="var(--primary-text)">• Bug fixing — accuracy matters</text>
  <text x="71.034483" y="430.181818" font-family="Arial, sans-serif" font-size="17.755921" font-style="italic" fill="var(--primary-text)">deterministic, reproducible</text>

  <rect x="660.689655" y="229.818182" width="579.310345" height="210.909091" rx="8.355727" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344828" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889319" font-weight="bold" fill="var(--info-text)">High Temp (0.7–1.0) — Use For</text>
  <text x="691.724138" y="319.454545" font-family="Arial, sans-serif" font-size="17.755921" fill="var(--info-text)">• Brainstorming solutions</text>
  <text x="691.724138" y="356.363636" font-family="Arial, sans-serif" font-size="17.755921" fill="var(--info-text)">• Generating test variations</text>
  <text x="691.724138" y="393.272727" font-family="Arial, sans-serif" font-size="17.755921" fill="var(--info-text)">• Creative naming / docs</text>
  <text x="691.724138" y="430.181818" font-family="Arial, sans-serif" font-size="17.755921" font-style="italic" fill="var(--info-text)">diverse, creative</text>

  <!-- Other params -->
  <rect x="40" y="467.090909" width="1200" height="152.909091" rx="8.355727" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="509.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889319" font-weight="bold" fill="var(--text)">Other Key Sampling Parameters</text>
  <text x="71.034483" y="551.454545" font-family="Arial, sans-serif" font-size="17.755921" fill="var(--text)">• top_p (nucleus sampling): 0.95 default — caps token probability mass</text>
  <text x="71.034483" y="588.363636" font-family="Arial, sans-serif" font-size="17.755921" fill="var(--text)">• frequency_penalty: reduces repetition in long outputs</text>
</svg>

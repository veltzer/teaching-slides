<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:#1a1a2e">
  <defs>
    <marker id="arr" markerWidth="31.605" markerHeight="362.88" refX="28.4444" refY="181.44" orient="auto">
      <polygon points="0,518.4 11.0617,0" fill="#e94560" />
    </marker>
  </defs>
  <text x="1264.1975" y="1969.92" text-anchor="middle" fill="white" font-size="63.21" font-weight="bold">Breaking Complex Tasks into Stages</text>
  <text x="1264.1975" y="3214.08" text-anchor="middle" fill="#90A4AE" font-size="41.0864">Each stage gets a focused prompt — failures are isolated and retriable</text>
  <rect x="63.21" y="4665.6" width="521.4814" height="5184" rx="31.605" fill="#16213e" stroke="#0f3460" stroke-width="6.3211" />
  <text x="322.3703" y="6324.48" text-anchor="middle" fill="#90CAF9" font-size="44.2469" font-weight="bold">Stage 1</text>
  <text x="322.3703" y="7464.96" text-anchor="middle" fill="#e0e0e0" font-size="41.0864">Extract Facts</text>
  <text x="322.3703" y="8553.6" text-anchor="middle" fill="#90CAF9" font-size="34.7655">cheap model</text>
  <text x="322.3703" y="9434.88" text-anchor="middle" fill="#666" font-size="34.7655">→ structured data</text>
  <line x1="584.6914" y1="7257.6" x2="679.5061" y2="7257.6" stroke="#e94560" stroke-width="6.3211" marker-end="url(#arr)" />
  <rect x="679.5061" y="4665.6" width="521.4814" height="5184" rx="31.605" fill="#16213e" stroke="#533483" stroke-width="6.3211" />
  <text x="938.6667" y="6324.48" text-anchor="middle" fill="#CE93D8" font-size="44.2469" font-weight="bold">Stage 2</text>
  <text x="938.6667" y="7464.96" text-anchor="middle" fill="#e0e0e0" font-size="41.0864">Analyze Risk</text>
  <text x="938.6667" y="8553.6" text-anchor="middle" fill="#CE93D8" font-size="34.7655">strong model</text>
  <text x="938.6667" y="9434.88" text-anchor="middle" fill="#666" font-size="34.7655">→ risk assessment</text>
  <line x1="1200.9877" y1="7257.6" x2="1295.8025" y2="7257.6" stroke="#e94560" stroke-width="6.3211" marker-end="url(#arr)" />
  <rect x="1295.8025" y="4665.6" width="521.4814" height="5184" rx="31.605" fill="#16213e" stroke="#0f3460" stroke-width="6.3211" />
  <text x="1554.963" y="6324.48" text-anchor="middle" fill="#80CBC4" font-size="44.2469" font-weight="bold">Stage 3</text>
  <text x="1554.963" y="7464.96" text-anchor="middle" fill="#e0e0e0" font-size="41.0864">Generate Code</text>
  <text x="1554.963" y="8553.6" text-anchor="middle" fill="#80CBC4" font-size="34.7655">mid-tier model</text>
  <text x="1554.963" y="9434.88" text-anchor="middle" fill="#666" font-size="34.7655">→ implementation</text>
  <line x1="1817.2839" y1="7257.6" x2="1912.0988" y2="7257.6" stroke="#e94560" stroke-width="6.3211" marker-end="url(#arr)" />
  <rect x="1912.0988" y="4665.6" width="553.0864" height="5184" rx="31.605" fill="#16213e" stroke="#e94560" stroke-width="6.3211" />
  <text x="2187.0617" y="6324.48" text-anchor="middle" fill="#EF9A9A" font-size="44.2469" font-weight="bold">Stage 4</text>
  <text x="2187.0617" y="7464.96" text-anchor="middle" fill="#e0e0e0" font-size="41.0864">Validate Output</text>
  <text x="2187.0617" y="8553.6" text-anchor="middle" fill="#EF9A9A" font-size="34.7655">JSON schema check</text>
  <text x="2187.0617" y="9434.88" text-anchor="middle" fill="#666" font-size="34.7655">→ verified result</text>
  <rect x="63.21" y="11923.2" width="2401.9753" height="8035.2" rx="31.605" fill="#0d1b2a" stroke="#F9A825" stroke-width="4.7408" />
  <text x="1264.1975" y="13478.4" text-anchor="middle" fill="#F9A825" font-size="47.4075" font-weight="bold">Why Prompt Chaining Works</text>
  <rect x="126.4197" y="14411.52" width="695.3086" height="4665.6" rx="25.2839" fill="#16213e" stroke="#0f3460" />
  <text x="474.0741" y="15811.2" text-anchor="middle" fill="#90CAF9" font-size="41.0864" font-weight="bold">Focused Responsibility</text>
  <text x="474.0741" y="16848" text-anchor="middle" fill="#e0e0e0" font-size="37.9259">each stage does</text>
  <text x="474.0741" y="17781.12" text-anchor="middle" fill="#e0e0e0" font-size="37.9259">one thing well</text>
  <rect x="916.5433" y="14411.52" width="695.3086" height="4665.6" rx="25.2839" fill="#16213e" stroke="#533483" />
  <text x="1264.1975" y="15811.2" text-anchor="middle" fill="#CE93D8" font-size="41.0864" font-weight="bold">Model Flexibility</text>
  <text x="1264.1975" y="16848" text-anchor="middle" fill="#e0e0e0" font-size="37.9259">cheap model for extract</text>
  <text x="1264.1975" y="17781.12" text-anchor="middle" fill="#e0e0e0" font-size="37.9259">strong model for reason</text>
  <rect x="1706.6667" y="14411.52" width="695.3086" height="4665.6" rx="25.2839" fill="#16213e" stroke="#e94560" />
  <text x="2054.3211" y="15811.2" text-anchor="middle" fill="#EF9A9A" font-size="41.0864" font-weight="bold">Isolated Failures</text>
  <text x="2054.3211" y="16848" text-anchor="middle" fill="#e0e0e0" font-size="37.9259">retry only the</text>
  <text x="2054.3211" y="17781.12" text-anchor="middle" fill="#e0e0e0" font-size="37.9259">failing stage</text>
</svg>
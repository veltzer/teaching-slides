<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:#1a1a2e">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,518.4 11.0617,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="40.5386" y="63.1688" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Breaking Complex Tasks into Stages</text>
  <text x="40.5386" y="103.0649" text-anchor="middle" fill="var(--text-faint)" font-size="10">Each stage gets a focused prompt — failures are isolated and retriable</text>
  <rect x="2.0269" y="149.6104" width="16.7222" height="166.2338" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="0.2027" />
  <text x="10.3374" y="202.8052" text-anchor="middle" fill="var(--primary-accent)" font-size="10" font-weight="bold">Stage 1</text>
  <text x="10.3374" y="239.3766" text-anchor="middle" fill="var(--border)" font-size="10">Extract Facts</text>
  <text x="10.3374" y="274.2857" text-anchor="middle" fill="var(--primary-accent)" font-size="10">cheap model</text>
  <text x="10.3374" y="302.5455" text-anchor="middle" fill="var(--text-muted)" font-size="10">→ structured data</text>
  <line x1="18.7491" y1="232.7273" x2="21.7895" y2="232.7273" stroke="var(--danger-border)" stroke-width="0.2027" marker-end="url(#arr)" />
  <rect x="21.7895" y="149.6104" width="16.7222" height="166.2338" rx="6" fill="var(--code-bg)" stroke="var(--info-border)" stroke-width="0.2027" />
  <text x="30.0999" y="202.8052" text-anchor="middle" fill="var(--info-accent)" font-size="10" font-weight="bold">Stage 2</text>
  <text x="30.0999" y="239.3766" text-anchor="middle" fill="var(--border)" font-size="10">Analyze Risk</text>
  <text x="30.0999" y="274.2857" text-anchor="middle" fill="var(--info-accent)" font-size="10">strong model</text>
  <text x="30.0999" y="302.5455" text-anchor="middle" fill="var(--text-muted)" font-size="10">→ risk assessment</text>
  <line x1="38.5117" y1="232.7273" x2="41.5521" y2="232.7273" stroke="var(--danger-border)" stroke-width="0.2027" marker-end="url(#arr)" />
  <rect x="41.5521" y="149.6104" width="16.7222" height="166.2338" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="0.2027" />
  <text x="49.8625" y="202.8052" text-anchor="middle" fill="var(--ok-accent)" font-size="10" font-weight="bold">Stage 3</text>
  <text x="49.8625" y="239.3766" text-anchor="middle" fill="var(--border)" font-size="10">Generate Code</text>
  <text x="49.8625" y="274.2857" text-anchor="middle" fill="var(--ok-accent)" font-size="10">mid-tier model</text>
  <text x="49.8625" y="302.5455" text-anchor="middle" fill="var(--text-muted)" font-size="10">→ implementation</text>
  <line x1="58.2743" y1="232.7273" x2="61.3147" y2="232.7273" stroke="var(--danger-border)" stroke-width="0.2027" marker-end="url(#arr)" />
  <rect x="61.3147" y="149.6104" width="17.7357" height="166.2338" rx="6" fill="var(--code-bg)" stroke="var(--danger-border)" stroke-width="0.2027" />
  <text x="70.1318" y="202.8052" text-anchor="middle" fill="var(--warn-accent)" font-size="10" font-weight="bold">Stage 4</text>
  <text x="70.1318" y="239.3766" text-anchor="middle" fill="var(--border)" font-size="10">Validate Output</text>
  <text x="70.1318" y="274.2857" text-anchor="middle" fill="var(--warn-accent)" font-size="10">JSON schema check</text>
  <text x="70.1318" y="302.5455" text-anchor="middle" fill="var(--text-muted)" font-size="10">→ verified result</text>
  <rect x="2.0269" y="382.3377" width="77.0234" height="257.6623" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="0.152" />
  <text x="40.5386" y="432.2078" text-anchor="middle" fill="var(--warn-accent)" font-size="10" font-weight="bold">Why Prompt Chaining Works</text>
  <rect x="4.0539" y="462.1299" width="22.2963" height="149.6104" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" />
  <text x="15.202" y="507.013" text-anchor="middle" fill="var(--primary-accent)" font-size="10" font-weight="bold">Focused Responsibility</text>
  <text x="15.202" y="540.2597" text-anchor="middle" fill="var(--border)" font-size="10">each stage does</text>
  <text x="15.202" y="570.1818" text-anchor="middle" fill="var(--border)" font-size="10">one thing well</text>
  <rect x="29.3905" y="462.1299" width="22.2963" height="149.6104" rx="6" fill="var(--code-bg)" stroke="var(--info-border)" />
  <text x="40.5386" y="507.013" text-anchor="middle" fill="var(--info-accent)" font-size="10" font-weight="bold">Model Flexibility</text>
  <text x="40.5386" y="540.2597" text-anchor="middle" fill="var(--border)" font-size="10">cheap model for extract</text>
  <text x="40.5386" y="570.1818" text-anchor="middle" fill="var(--border)" font-size="10">strong model for reason</text>
  <rect x="54.7272" y="462.1299" width="22.2963" height="149.6104" rx="6" fill="var(--code-bg)" stroke="var(--danger-border)" />
  <text x="65.8753" y="507.013" text-anchor="middle" fill="var(--warn-accent)" font-size="10" font-weight="bold">Isolated Failures</text>
  <text x="65.8753" y="540.2597" text-anchor="middle" fill="var(--border)" font-size="10">retry only the</text>
  <text x="65.8753" y="570.1818" text-anchor="middle" fill="var(--border)" font-size="10">failing stage</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:#1a1a2e">
  <ns0:defs>
    <ns0:marker id="arr" markerWidth="1.0135" markerHeight="11.6364" refX="0.9121" refY="5.8182" orient="auto">
      <ns0:polygon points="0,16.6234 0.3547,0" fill="#e94560" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="40.5386" y="63.1688" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Breaking Complex Tasks into Stages</ns0:text>
  <ns0:text x="40.5386" y="103.0649" text-anchor="middle" fill="#90A4AE" font-size="10">Each stage gets a focused prompt — failures are isolated and retriable</ns0:text>
  <ns0:rect x="2.0269" y="149.6104" width="16.7222" height="166.2338" rx="1.0135" fill="#16213e" stroke="#0f3460" stroke-width="0.2027" />
  <ns0:text x="10.3374" y="202.8052" text-anchor="middle" fill="#90CAF9" font-size="10" font-weight="bold">Stage 1</ns0:text>
  <ns0:text x="10.3374" y="239.3766" text-anchor="middle" fill="#e0e0e0" font-size="10">Extract Facts</ns0:text>
  <ns0:text x="10.3374" y="274.2857" text-anchor="middle" fill="#90CAF9" font-size="10">cheap model</ns0:text>
  <ns0:text x="10.3374" y="302.5455" text-anchor="middle" fill="#666" font-size="10">→ structured data</ns0:text>
  <ns0:line x1="18.7491" y1="232.7273" x2="21.7895" y2="232.7273" stroke="#e94560" stroke-width="0.2027" marker-end="url(#arr)" />
  <ns0:rect x="21.7895" y="149.6104" width="16.7222" height="166.2338" rx="1.0135" fill="#16213e" stroke="#533483" stroke-width="0.2027" />
  <ns0:text x="30.0999" y="202.8052" text-anchor="middle" fill="#CE93D8" font-size="10" font-weight="bold">Stage 2</ns0:text>
  <ns0:text x="30.0999" y="239.3766" text-anchor="middle" fill="#e0e0e0" font-size="10">Analyze Risk</ns0:text>
  <ns0:text x="30.0999" y="274.2857" text-anchor="middle" fill="#CE93D8" font-size="10">strong model</ns0:text>
  <ns0:text x="30.0999" y="302.5455" text-anchor="middle" fill="#666" font-size="10">→ risk assessment</ns0:text>
  <ns0:line x1="38.5117" y1="232.7273" x2="41.5521" y2="232.7273" stroke="#e94560" stroke-width="0.2027" marker-end="url(#arr)" />
  <ns0:rect x="41.5521" y="149.6104" width="16.7222" height="166.2338" rx="1.0135" fill="#16213e" stroke="#0f3460" stroke-width="0.2027" />
  <ns0:text x="49.8625" y="202.8052" text-anchor="middle" fill="#80CBC4" font-size="10" font-weight="bold">Stage 3</ns0:text>
  <ns0:text x="49.8625" y="239.3766" text-anchor="middle" fill="#e0e0e0" font-size="10">Generate Code</ns0:text>
  <ns0:text x="49.8625" y="274.2857" text-anchor="middle" fill="#80CBC4" font-size="10">mid-tier model</ns0:text>
  <ns0:text x="49.8625" y="302.5455" text-anchor="middle" fill="#666" font-size="10">→ implementation</ns0:text>
  <ns0:line x1="58.2743" y1="232.7273" x2="61.3147" y2="232.7273" stroke="#e94560" stroke-width="0.2027" marker-end="url(#arr)" />
  <ns0:rect x="61.3147" y="149.6104" width="17.7357" height="166.2338" rx="1.0135" fill="#16213e" stroke="#e94560" stroke-width="0.2027" />
  <ns0:text x="70.1318" y="202.8052" text-anchor="middle" fill="#EF9A9A" font-size="10" font-weight="bold">Stage 4</ns0:text>
  <ns0:text x="70.1318" y="239.3766" text-anchor="middle" fill="#e0e0e0" font-size="10">Validate Output</ns0:text>
  <ns0:text x="70.1318" y="274.2857" text-anchor="middle" fill="#EF9A9A" font-size="10">JSON schema check</ns0:text>
  <ns0:text x="70.1318" y="302.5455" text-anchor="middle" fill="#666" font-size="10">→ verified result</ns0:text>
  <ns0:rect x="2.0269" y="382.3377" width="77.0234" height="257.6623" rx="1.0135" fill="#0d1b2a" stroke="#F9A825" stroke-width="0.152" />
  <ns0:text x="40.5386" y="432.2078" text-anchor="middle" fill="#F9A825" font-size="10" font-weight="bold">Why Prompt Chaining Works</ns0:text>
  <ns0:rect x="4.0539" y="462.1299" width="22.2963" height="149.6104" rx="0.8108" fill="#16213e" stroke="#0f3460" />
  <ns0:text x="15.202" y="507.013" text-anchor="middle" fill="#90CAF9" font-size="10" font-weight="bold">Focused Responsibility</ns0:text>
  <ns0:text x="15.202" y="540.2597" text-anchor="middle" fill="#e0e0e0" font-size="10">each stage does</ns0:text>
  <ns0:text x="15.202" y="570.1818" text-anchor="middle" fill="#e0e0e0" font-size="10">one thing well</ns0:text>
  <ns0:rect x="29.3905" y="462.1299" width="22.2963" height="149.6104" rx="0.8108" fill="#16213e" stroke="#533483" />
  <ns0:text x="40.5386" y="507.013" text-anchor="middle" fill="#CE93D8" font-size="10" font-weight="bold">Model Flexibility</ns0:text>
  <ns0:text x="40.5386" y="540.2597" text-anchor="middle" fill="#e0e0e0" font-size="10">cheap model for extract</ns0:text>
  <ns0:text x="40.5386" y="570.1818" text-anchor="middle" fill="#e0e0e0" font-size="10">strong model for reason</ns0:text>
  <ns0:rect x="54.7272" y="462.1299" width="22.2963" height="149.6104" rx="0.8108" fill="#16213e" stroke="#e94560" />
  <ns0:text x="65.8753" y="507.013" text-anchor="middle" fill="#EF9A9A" font-size="10" font-weight="bold">Isolated Failures</ns0:text>
  <ns0:text x="65.8753" y="540.2597" text-anchor="middle" fill="#e0e0e0" font-size="10">retry only the</ns0:text>
  <ns0:text x="65.8753" y="570.1818" text-anchor="middle" fill="#e0e0e0" font-size="10">failing stage</ns0:text>
</ns0:svg>
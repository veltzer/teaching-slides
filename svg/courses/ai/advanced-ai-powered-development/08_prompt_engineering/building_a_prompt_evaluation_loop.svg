<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:#1a1a2e">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,360 15.929,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" fill="var(--bg)" font-size="10.0408" font-weight="bold">Building a Prompt Evaluation Loop</text>
  <rect x="560.844" y="100.9659" width="34.3704" height="148.2955" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="0.4149" />
  <text x="577.925" y="155.3409" text-anchor="middle" fill="var(--primary-accent)" font-size="10.0408" font-weight="bold">Write Prompt</text>
  <text x="577.925" y="191.5909" text-anchor="middle" fill="var(--border)" font-size="10.0408">draft template</text>
  <text x="577.925" y="227.8409" text-anchor="middle" fill="var(--text-muted)" font-size="10.0408">version in git</text>
  <line x1="595.2143" y1="175.1136" x2="601.4635" y2="175.1136" stroke="var(--danger-border)" stroke-width="0.4149" marker-end="url(#arr)" />
  <rect x="601.4635" y="100.9659" width="34.3704" height="148.2955" rx="6" fill="var(--code-bg)" stroke="var(--info-border)" stroke-width="0.4149" />
  <text x="618.5445" y="155.3409" text-anchor="middle" fill="var(--info-accent)" font-size="10.0408" font-weight="bold">Run Test Suite</text>
  <text x="618.5445" y="191.5909" text-anchor="middle" fill="var(--border)" font-size="10.0408">20-50 test cases</text>
  <text x="618.5445" y="227.8409" text-anchor="middle" fill="var(--text-muted)" font-size="10.0408">representative inputs</text>
  <line x1="635.8339" y1="175.1136" x2="642.083" y2="175.1136" stroke="var(--danger-border)" stroke-width="0.4149" marker-end="url(#arr)" />
  <rect x="642.083" y="100.9659" width="34.3704" height="148.2955" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="0.4149" />
  <text x="659.1641" y="155.3409" text-anchor="middle" fill="var(--ok-accent)" font-size="10.0408" font-weight="bold">Score Results</text>
  <text x="659.1641" y="191.5909" text-anchor="middle" fill="var(--border)" font-size="10.0408">LLM-as-judge</text>
  <text x="659.1641" y="227.8409" text-anchor="middle" fill="var(--text-muted)" font-size="10.0408">or exact match</text>
  <line x1="676.4534" y1="175.1136" x2="682.7025" y2="175.1136" stroke="var(--danger-border)" stroke-width="0.4149" marker-end="url(#arr)" />
  <rect x="682.7025" y="100.9659" width="36.4535" height="148.2955" rx="6" fill="var(--code-bg)" stroke="var(--danger-border)" stroke-width="0.4149" />
  <text x="700.8251" y="155.3409" text-anchor="middle" fill="var(--warn-accent)" font-size="10.0408" font-weight="bold">Refine Prompt</text>
  <text x="700.8251" y="191.5909" text-anchor="middle" fill="var(--border)" font-size="10.0408">fix failures</text>
  <text x="700.8251" y="227.8409" text-anchor="middle" fill="var(--text-muted)" font-size="10.0408">iterate</text>
  <path d="M 700.8251 249.2613 Q 700.8251 306.9318 639.9999 306.9318 Q 577.5084 306.9318 577.5084 249.2613" fill="none" stroke="var(--danger-border)" stroke-width="0.4149" stroke-dasharray="1.2447 0.6224" marker-end="url(#arr)" />
  <text x="639.9999" y="339.8863" text-anchor="middle" fill="var(--warn-accent)" font-size="10.0408">iterate until quality threshold met</text>
  <rect x="560.844" y="381.0796" width="158.312" height="238.9204" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="0.3112" />
  <text x="639.9999" y="430.5114" text-anchor="middle" fill="var(--warn-accent)" font-size="10.0408" font-weight="bold">Prompt Evaluation Best Practices</text>
  <text x="565.01" y="474.9999" fill="var(--border)" font-size="10.0408">▶ Build a test set of 20-50 representative inputs with expected outputs</text>
  <text x="565.01" y="512.8977" fill="var(--border)" font-size="10.0408">▶ Track prompt versions in git alongside their evaluation scores</text>
  <text x="565.01" y="550.7954" fill="var(--border)" font-size="10.0408">▶ Use a stronger model as judge than the one being evaluated</text>
  <text x="565.01" y="588.6932" fill="var(--border)" font-size="10.0408">▶ Set a quality gate: prompts below threshold do not ship</text>
</svg>
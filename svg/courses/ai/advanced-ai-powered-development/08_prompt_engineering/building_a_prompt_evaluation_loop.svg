  </defs>
  <text x="1820.4444" y="1368" text-anchor="middle" fill="white" font-size="91.0223" font-weight="bold">Building a Prompt Evaluation Loop</text>
  <rect x="91.0223" y="2700" width="750.9333" height="3240" rx="45.511" fill="#16213e" stroke="#0f3460" stroke-width="9.1023" />
  <text x="464.2133" y="3888" text-anchor="middle" fill="#90CAF9" font-size="63.7156" font-weight="bold">Write Prompt</text>
  <text x="464.2133" y="4680" text-anchor="middle" fill="#e0e0e0" font-size="54.6133">draft template</text>
  <text x="464.2133" y="5472" text-anchor="middle" fill="#666" font-size="50.0623">version in git</text>
  <line x1="841.9556" y1="4320" x2="978.489" y2="4320" stroke="#e94560" stroke-width="9.1023" marker-end="url(#arr)" />
  <rect x="978.489" y="2700" width="750.9333" height="3240" rx="45.511" fill="#16213e" stroke="#533483" stroke-width="9.1023" />
  <text x="1351.68" y="3888" text-anchor="middle" fill="#CE93D8" font-size="63.7156" font-weight="bold">Run Test Suite</text>
  <text x="1351.68" y="4680" text-anchor="middle" fill="#e0e0e0" font-size="54.6133">20-50 test cases</text>
  <text x="1351.68" y="5472" text-anchor="middle" fill="#666" font-size="50.0623">representative inputs</text>
  <line x1="1729.4223" y1="4320" x2="1865.9556" y2="4320" stroke="#e94560" stroke-width="9.1023" marker-end="url(#arr)" />

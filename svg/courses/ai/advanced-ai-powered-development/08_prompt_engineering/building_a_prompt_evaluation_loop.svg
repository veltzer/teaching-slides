<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:#1a1a2e">
  <ns0:defs>
    <ns0:marker id="arr" markerWidth="2.0746" markerHeight="11.4872" refX="1.8671" refY="5.7436" orient="auto">
      <ns0:polygon points="0,16.4103 0.7261,0" fill="#e94560" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="82.9832" y="62.359" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Building a Prompt Evaluation Loop</ns0:text>
  <ns0:rect x="4.1492" y="123.0769" width="34.2306" height="147.6923" rx="2.0746" fill="#16213e" stroke="#0f3460" stroke-width="0.4149" />
  <ns0:text x="21.1607" y="177.2308" text-anchor="middle" fill="#90CAF9" font-size="10" font-weight="bold">Write Prompt</ns0:text>
  <ns0:text x="21.1607" y="213.3333" text-anchor="middle" fill="#e0e0e0" font-size="10">draft template</ns0:text>
  <ns0:text x="21.1607" y="249.4359" text-anchor="middle" fill="#666" font-size="10">version in git</ns0:text>
  <ns0:line x1="38.3797" y1="196.9231" x2="44.6035" y2="196.9231" stroke="#e94560" stroke-width="0.4149" marker-end="url(#arr)" />
  <ns0:rect x="44.6035" y="123.0769" width="34.2306" height="147.6923" rx="2.0746" fill="#16213e" stroke="#533483" stroke-width="0.4149" />
  <ns0:text x="61.615" y="177.2308" text-anchor="middle" fill="#CE93D8" font-size="10" font-weight="bold">Run Test Suite</ns0:text>
  <ns0:text x="61.615" y="213.3333" text-anchor="middle" fill="#e0e0e0" font-size="10">20-50 test cases</ns0:text>
  <ns0:text x="61.615" y="249.4359" text-anchor="middle" fill="#666" font-size="10">representative inputs</ns0:text>
  <ns0:line x1="78.8341" y1="196.9231" x2="85.0578" y2="196.9231" stroke="#e94560" stroke-width="0.4149" marker-end="url(#arr)" />
  <ns0:rect x="85.0578" y="123.0769" width="34.2306" height="147.6923" rx="2.0746" fill="#16213e" stroke="#2E7D32" stroke-width="0.4149" />
  <ns0:text x="102.0694" y="177.2308" text-anchor="middle" fill="#80CBC4" font-size="10" font-weight="bold">Score Results</ns0:text>
  <ns0:text x="102.0694" y="213.3333" text-anchor="middle" fill="#e0e0e0" font-size="10">LLM-as-judge</ns0:text>
  <ns0:text x="102.0694" y="249.4359" text-anchor="middle" fill="#666" font-size="10">or exact match</ns0:text>
  <ns0:line x1="119.2884" y1="196.9231" x2="125.5121" y2="196.9231" stroke="#e94560" stroke-width="0.4149" marker-end="url(#arr)" />
  <ns0:rect x="125.5121" y="123.0769" width="36.3052" height="147.6923" rx="2.0746" fill="#16213e" stroke="#e94560" stroke-width="0.4149" />
  <ns0:text x="143.561" y="177.2308" text-anchor="middle" fill="#EF9A9A" font-size="10" font-weight="bold">Refine Prompt</ns0:text>
  <ns0:text x="143.561" y="213.3333" text-anchor="middle" fill="#e0e0e0" font-size="10">fix failures</ns0:text>
  <ns0:text x="143.561" y="249.4359" text-anchor="middle" fill="#666" font-size="10">iterate</ns0:text>
  <ns0:path d="M 143.561 270.7692 Q 143.561 328.2051 82.9832 328.2051 Q 20.7458 328.2051 20.7458 270.7692" fill="none" stroke="#e94560" stroke-width="0.4149" stroke-dasharray="1.2447 0.6224" marker-end="url(#arr)" />
  <ns0:text x="82.9832" y="361.0256" text-anchor="middle" fill="#EF9A9A" font-size="10">iterate until quality threshold met</ns0:text>
  <ns0:rect x="4.1492" y="402.0513" width="157.6681" height="237.9487" rx="2.0746" fill="#0d1b2a" stroke="#F9A825" stroke-width="0.3112" />
  <ns0:text x="82.9832" y="451.2821" text-anchor="middle" fill="#F9A825" font-size="10" font-weight="bold">Prompt Evaluation Best Practices</ns0:text>
  <ns0:text x="8.2983" y="495.5897" fill="#E0E0E0" font-size="10">▶ Build a test set of 20-50 representative inputs with expected outputs</ns0:text>
  <ns0:text x="8.2983" y="533.3333" fill="#E0E0E0" font-size="10">▶ Track prompt versions in git alongside their evaluation scores</ns0:text>
  <ns0:text x="8.2983" y="571.0769" fill="#E0E0E0" font-size="10">▶ Use a stronger model as judge than the one being evaluated</ns0:text>
  <ns0:text x="8.2983" y="608.8205" fill="#E0E0E0" font-size="10">▶ Set a quality gate: prompts below threshold do not ship</ns0:text>
</ns0:svg>
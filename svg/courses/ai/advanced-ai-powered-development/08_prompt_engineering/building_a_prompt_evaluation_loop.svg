  <text x="2239.1467" y="3888" text-anchor="middle" fill="#80CBC4" font-size="63.7156" font-weight="bold">Score Results</text>
  <text x="2239.1467" y="4680" text-anchor="middle" fill="#e0e0e0" font-size="54.6133">LLM-as-judge</text>
  <text x="2239.1467" y="5472" text-anchor="middle" fill="#666" font-size="50.0623">or exact match</text>
  <line x1="2616.889" y1="4320" x2="2753.4223" y2="4320" stroke="#e94560" stroke-width="9.1023" marker-end="url(#arr)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Four-step loop -->
  <rect x="40" y="40" width="272.268908" height="214.814815" rx="8.325767" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.134454" y="104.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.977301" font-weight="bold" fill="var(--primary-text)">1. Write Prompt</text>
  <text x="176.134454" y="163.518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.692255" fill="var(--primary-text)">draft template</text>
  <text x="176.134454" y="195.740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.692255" fill="var(--primary-text)">version in git</text>

  <line x1="322.352941" y1="147.407407" x2="382.857143" y2="147.407407" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="392.941176" y="40" width="272.268908" height="214.814815" rx="8.325767" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="529.07563" y="104.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.977301" font-weight="bold" fill="var(--info-text)">2. Run Tests</text>
  <text x="529.07563" y="163.518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.692255" fill="var(--info-text)">20-50 test cases</text>
  <text x="529.07563" y="195.740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.692255" fill="var(--info-text)">representative inputs</text>

  <line x1="675.294118" y1="147.407407" x2="735.798319" y2="147.407407" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="745.882353" y="40" width="242.016807" height="214.814815" rx="8.325767" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="866.890756" y="104.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.977301" font-weight="bold" fill="var(--ok-text)">3. Score</text>
  <text x="866.890756" y="163.518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.692255" fill="var(--ok-text)">LLM-as-judge</text>
  <text x="866.890756" y="195.740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.692255" fill="var(--ok-text)">or exact match</text>

  <line x1="997.983193" y1="147.407407" x2="1058.487395" y2="147.407407" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1068.571429" y="40" width="171.428571" height="214.814815" rx="8.325767" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1154.285714" y="104.444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.895859" font-weight="bold" fill="var(--warn-text)">4. Refine</text>
  <text x="1154.285714" y="163.518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.692255" fill="var(--warn-text)">fix failures</text>
  <text x="1154.285714" y="195.740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.692255" fill="var(--warn-text)">iterate</text>

  <!-- Feedback arrow -->
  <path d="M 1154.285714 265.555556 Q 1154.285714 340.740741 634.957983 340.740741 Q 176.134454 340.740741 176.134454 265.555556" fill="none" stroke="var(--danger-border)" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="634.957983" y="378.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.814417" font-weight="bold" fill="var(--warn-accent)">iterate until quality threshold met</text>

  <!-- Best practices -->
  <rect x="40" y="415.925926" width="1200" height="204.074074" rx="8.325767" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="458.888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.895859" font-weight="bold" fill="var(--text)">Best Practices</text>
  <text x="70.252101" y="501.851852" font-family="Arial, sans-serif" font-size="17.692255" fill="var(--text)">- Build a test set of 20-50 representative inputs with expected outputs</text>
  <text x="70.252101" y="534.074074" font-family="Arial, sans-serif" font-size="17.692255" fill="var(--text)">- Track prompt versions in git alongside their evaluation scores</text>
  <text x="70.252101" y="566.296296" font-family="Arial, sans-serif" font-size="17.692255" fill="var(--text)">- Use a stronger model as judge than the one being evaluated</text>
  <text x="70.252101" y="598.518519" font-family="Arial, sans-serif" font-size="17.692255" fill="var(--text)">- Set a quality gate: prompts below threshold do not ship</text>
</svg>

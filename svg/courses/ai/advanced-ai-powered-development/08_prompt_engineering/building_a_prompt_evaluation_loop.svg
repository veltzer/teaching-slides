  <text x="3149.369" y="3888" text-anchor="middle" fill="#EF9A9A" font-size="63.7156" font-weight="bold">Refine Prompt</text>
  <text x="3149.369" y="4680" text-anchor="middle" fill="#e0e0e0" font-size="54.6133">fix failures</text>
  <text x="3149.369" y="5472" text-anchor="middle" fill="#666" font-size="50.0623">iterate</text>
  <path d="M 3149.369 5940 Q 3149.369 7200 1820.4444 7200 Q 455.111 7200 455.111 5940" fill="none" stroke="#e94560" stroke-width="9.1023" stroke-dasharray="27.3067 13.6533" marker-end="url(#arr)" />
  <text x="1820.4444" y="7920" text-anchor="middle" fill="#EF9A9A" font-size="54.6133">iterate until quality threshold met</text>
  <rect x="91.0223" y="8820" width="3458.8444" height="5220" rx="45.511" fill="#0d1b2a" stroke="#F9A825" stroke-width="6.8267" />
  <text x="1820.4444" y="9900" text-anchor="middle" fill="#F9A825" font-size="68.2667" font-weight="bold">Prompt Evaluation Best Practices</text>
  <text x="182.0444" y="10872" fill="#E0E0E0" font-size="59.1644">▶ Build a test set of 20-50 representative inputs with expected outputs</text>
  <text x="182.0444" y="11700" fill="#E0E0E0" font-size="59.1644">▶ Track prompt versions in git alongside their evaluation scores</text>
  <text x="182.0444" y="12528" fill="#E0E0E0" font-size="59.1644">▶ Use a stronger model as judge than the one being evaluated</text>
  <text x="182.0444" y="13356" fill="#E0E0E0" font-size="59.1644">▶ Set a quality gate: prompts below threshold do not ship</text>
</svg>
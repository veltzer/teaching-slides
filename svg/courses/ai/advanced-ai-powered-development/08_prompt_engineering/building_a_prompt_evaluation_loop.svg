<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:#1a1a2e">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:marker id="arr" markerWidth="45.511" markerHeight="252" refX="40.96" refY="126" orient="auto">
      <ns0:polygon points="0,360 15.929,0" fill="#dc3545" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="82.9832" y="62.359" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="bold">Building a Prompt Evaluation Loop</ns0:text>
  <ns0:rect x="4.1492" y="123.0769" width="34.2306" height="147.6923" rx="2.0746" fill="var(--code-bg)" stroke="var(--primary-deeper)" stroke-width="0.4149" />
  <ns0:text x="21.1607" y="177.2308" text-anchor="middle" fill="var(--primary-tint)" font-size="10" font-weight="bold">Write Prompt</ns0:text>
  <ns0:text x="21.1607" y="213.3333" text-anchor="middle" fill="var(--border)" font-size="10">draft template</ns0:text>
  <ns0:text x="21.1607" y="249.4359" text-anchor="middle" fill="var(--text-mid)" font-size="10">version in git</ns0:text>
  <ns0:line x1="38.3797" y1="196.9231" x2="44.6035" y2="196.9231" stroke="var(--danger-bright)" stroke-width="0.4149" marker-end="url(#arr)" />
  <ns0:rect x="44.6035" y="123.0769" width="34.2306" height="147.6923" rx="2.0746" fill="var(--code-bg)" stroke="var(--info-deep)" stroke-width="0.4149" />
  <ns0:text x="61.615" y="177.2308" text-anchor="middle" fill="var(--info-lt)" font-size="10" font-weight="bold">Run Test Suite</ns0:text>
  <ns0:text x="61.615" y="213.3333" text-anchor="middle" fill="var(--border)" font-size="10">20-50 test cases</ns0:text>
  <ns0:text x="61.615" y="249.4359" text-anchor="middle" fill="var(--text-mid)" font-size="10">representative inputs</ns0:text>
  <ns0:line x1="78.8341" y1="196.9231" x2="85.0578" y2="196.9231" stroke="var(--danger-bright)" stroke-width="0.4149" marker-end="url(#arr)" />
  <ns0:rect x="85.0578" y="123.0769" width="34.2306" height="147.6923" rx="2.0746" fill="var(--code-bg)" stroke="var(--ok-dk)" stroke-width="0.4149" />
  <ns0:text x="102.0694" y="177.2308" text-anchor="middle" fill="var(--ok-tint)" font-size="10" font-weight="bold">Score Results</ns0:text>
  <ns0:text x="102.0694" y="213.3333" text-anchor="middle" fill="var(--border)" font-size="10">LLM-as-judge</ns0:text>
  <ns0:text x="102.0694" y="249.4359" text-anchor="middle" fill="var(--text-mid)" font-size="10">or exact match</ns0:text>
  <ns0:line x1="119.2884" y1="196.9231" x2="125.5121" y2="196.9231" stroke="var(--danger-bright)" stroke-width="0.4149" marker-end="url(#arr)" />
  <ns0:rect x="125.5121" y="123.0769" width="36.3052" height="147.6923" rx="2.0746" fill="var(--code-bg)" stroke="var(--danger-bright)" stroke-width="0.4149" />
  <ns0:text x="143.561" y="177.2308" text-anchor="middle" fill="var(--warn-tint)" font-size="10" font-weight="bold">Refine Prompt</ns0:text>
  <ns0:text x="143.561" y="213.3333" text-anchor="middle" fill="var(--border)" font-size="10">fix failures</ns0:text>
  <ns0:text x="143.561" y="249.4359" text-anchor="middle" fill="var(--text-mid)" font-size="10">iterate</ns0:text>
  <ns0:path d="M 143.561 270.7692 Q 143.561 328.2051 82.9832 328.2051 Q 20.7458 328.2051 20.7458 270.7692" fill="none" stroke="var(--danger-bright)" stroke-width="0.4149" stroke-dasharray="1.2447 0.6224" marker-end="url(#arr)" />
  <ns0:text x="82.9832" y="361.0256" text-anchor="middle" fill="var(--warn-tint)" font-size="10">iterate until quality threshold met</ns0:text>
  <ns0:rect x="4.1492" y="402.0513" width="157.6681" height="237.9487" rx="2.0746" fill="var(--code-bg)" stroke="var(--warn-amber)" stroke-width="0.3112" />
  <ns0:text x="82.9832" y="451.2821" text-anchor="middle" fill="var(--warn-amber)" font-size="10" font-weight="bold">Prompt Evaluation Best Practices</ns0:text>
  <ns0:text x="8.2983" y="495.5897" fill="var(--border)" font-size="10">▶ Build a test set of 20-50 representative inputs with expected outputs</ns0:text>
  <ns0:text x="8.2983" y="533.3333" fill="var(--border)" font-size="10">▶ Track prompt versions in git alongside their evaluation scores</ns0:text>
  <ns0:text x="8.2983" y="571.0769" fill="var(--border)" font-size="10">▶ Use a stronger model as judge than the one being evaluated</ns0:text>
  <ns0:text x="8.2983" y="608.8205" fill="var(--border)" font-size="10">▶ Set a quality gate: prompts below threshold do not ship</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="1200" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--primary-text)">Context Window Budget</text>
  <text x="640" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Instructions, code, history, and output all share the same limit</text>

  <rect x="40" y="170" width="290" height="210" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Keep In</text>
  <text x="185" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Task and clear goal</text>
  <text x="185" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Relevant code only</text>
  <text x="185" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Types and signatures</text>
  <text x="185" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">One or two examples</text>

  <rect x="350" y="170" width="290" height="210" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Summarize</text>
  <text x="495" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Long chat history</text>
  <text x="495" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Old tool outputs</text>
  <text x="495" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Verbose logs</text>
  <text x="495" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Bulky documentation</text>

  <rect x="660" y="170" width="290" height="210" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Drop</text>
  <text x="805" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Unrelated files</text>
  <text x="805" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Stale context</text>
  <text x="805" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Boilerplate noise</text>
  <text x="805" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Dead code paths</text>

  <rect x="970" y="170" width="270" height="210" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Offload</text>
  <text x="1105" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Retrieval or RAG</text>
  <text x="1105" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">External memory</text>
  <text x="1105" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Tools on demand</text>
  <text x="1105" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Read just-in-time</text>

  <rect x="40" y="410" width="1200" height="210" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Packing Strategy</text>

  <rect x="70" y="475" width="270" height="120" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="205" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">1. Rank</text>
  <text x="205" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Score chunks by</text>
  <text x="205" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">relevance to task</text>

  <rect x="370" y="475" width="270" height="120" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="505" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">2. Compress</text>
  <text x="505" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Summarize long</text>
  <text x="505" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">or low-value text</text>

  <rect x="670" y="475" width="270" height="120" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="805" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">3. Order</text>
  <text x="805" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Key items at edges,</text>
  <text x="805" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">not in the middle</text>

  <rect x="970" y="475" width="240" height="120" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1090" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">4. Reserve</text>
  <text x="1090" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Leave headroom</text>
  <text x="1090" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">for the answer</text>

  <line x1="340" y1="535" x2="370" y2="535" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="535" x2="670" y2="535" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="940" y1="535" x2="970" y2="535" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

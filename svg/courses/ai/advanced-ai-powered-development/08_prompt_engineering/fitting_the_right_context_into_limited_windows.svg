<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="407.3526" height="580" fill="var(--surface)" rx="6" x="436.3237" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10.1838" font-weight="bold" fill="var(--primary-accent)">Priority-Based Context Assembly</text>
  <text x="640" y="122.65" text-anchor="middle" font-size="10" fill="var(--text-muted)">Rank context sources, assemble from highest priority, drop lowest when budget is tight</text>
  <rect x="446.5075" y="141.5" width="386.9849" height="55.1" rx="6" fill="var(--border)" stroke="var(--text)" stroke-width="0.5619" />
  <text x="487.2428" y="176.3" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">Priority</text>
  <text x="594.1728" y="176.3" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">Context Source</text>
  <text x="726.5624" y="176.3" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">Token Budget</text>
  <text x="802.941" y="176.3" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">Reason</text>
  <rect x="446.5075" y="196.6" width="386.9849" height="55.1" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="487.2428" y="231.4" text-anchor="middle" font-size="10" fill="var(--text)">1 (highest)</text>
  <text x="594.1728" y="231.4" text-anchor="middle" font-size="10" fill="var(--text)">Current file under edit</text>
  <text x="726.5624" y="231.4" text-anchor="middle" font-size="10" fill="var(--ok-accent)" font-weight="bold">~500 tokens</text>
  <text x="802.941" y="231.4" text-anchor="middle" font-size="10" fill="var(--text-muted)">always needed</text>
  <rect x="446.5075" y="251.7" width="386.9849" height="55.1" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="487.2428" y="286.5" text-anchor="middle" font-size="10" fill="var(--text)">2</text>
  <text x="594.1728" y="286.5" text-anchor="middle" font-size="10" fill="var(--text)">Directly imported modules</text>
  <text x="726.5624" y="286.5" text-anchor="middle" font-size="10" fill="var(--primary-accent)" font-weight="bold">~1,500 tokens</text>
  <text x="802.941" y="286.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">dependencies</text>
  <rect x="446.5075" y="306.8" width="386.9849" height="55.1" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="487.2428" y="341.6" text-anchor="middle" font-size="10" fill="var(--text)">3</text>
  <text x="594.1728" y="341.6" text-anchor="middle" font-size="10" fill="var(--text)">Recent git diff</text>
  <text x="726.5624" y="341.6" text-anchor="middle" font-size="10" fill="var(--primary-accent)" font-weight="bold">~800 tokens</text>
  <text x="802.941" y="341.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">change context</text>
  <rect x="446.5075" y="361.9" width="386.9849" height="55.1" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="487.2428" y="396.7" text-anchor="middle" font-size="10" fill="var(--text)">4</text>
  <text x="594.1728" y="396.7" text-anchor="middle" font-size="10" fill="var(--text)">Project conventions (CLAUDE.md)</text>
  <text x="726.5624" y="396.7" text-anchor="middle" font-size="10" fill="var(--primary-accent)" font-weight="bold">~300 tokens</text>
  <text x="802.941" y="396.7" text-anchor="middle" font-size="10" fill="var(--text-muted)">style rules</text>
  <rect x="446.5075" y="417" width="386.9849" height="55.1" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="487.2428" y="451.8" text-anchor="middle" font-size="10" fill="var(--text)">5 (lowest)</text>
  <text x="594.1728" y="451.8" text-anchor="middle" font-size="10" fill="var(--text)">Related test files</text>
  <text x="726.5624" y="451.8" text-anchor="middle" font-size="10" fill="var(--warn-accent)" font-weight="bold">~600 tokens</text>
  <text x="802.941" y="451.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">drop if tight</text>
  <rect x="446.5075" y="472.1" width="386.9849" height="55.1" rx="6" fill="var(--border)" stroke="var(--text)" stroke-width="0.5619" />
  <text x="487.2428" y="506.9" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">Total</text>
  <text x="594.1728" y="506.9" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">all sources combined</text>
  <text x="726.5624" y="506.9" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">~3,700 tokens</text>
  <rect x="446.5075" y="547.5" width="386.9849" height="58" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="585.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">Rule: always reserve tokens for the model's response — drop Priority 5 sources first</text>
</svg>
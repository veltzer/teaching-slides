<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect width="449.4925" height="640" fill="#f9f9f9" />
  <ns0:text x="224.7462" y="56" text-anchor="middle" font-size="11.2373" font-weight="bold" fill="#1a237e">Priority-Based Context Assembly</ns0:text>
  <ns0:text x="224.7462" y="91.2" text-anchor="middle" font-size="10" fill="#555">Rank context sources, assemble from highest priority, drop lowest when budget is tight</ns0:text>
  <ns0:rect x="11.2373" y="112" width="427.0178" height="60.8" rx="2.8093" fill="#bdbdbd" stroke="#333" stroke-width="0.5619" />
  <ns0:text x="56.1866" y="150.4" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Priority</ns0:text>
  <ns0:text x="174.1783" y="150.4" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Context Source</ns0:text>
  <ns0:text x="320.2634" y="150.4" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Token Budget</ns0:text>
  <ns0:text x="404.5432" y="150.4" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Reason</ns0:text>
  <ns0:rect x="11.2373" y="172.8" width="427.0178" height="60.8" rx="1.1237" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5619" />
  <ns0:text x="56.1866" y="211.2" text-anchor="middle" font-size="10" fill="#333">1 (highest)</ns0:text>
  <ns0:text x="174.1783" y="211.2" text-anchor="middle" font-size="10" fill="#333">Current file under edit</ns0:text>
  <ns0:text x="320.2634" y="211.2" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="bold">~500 tokens</ns0:text>
  <ns0:text x="404.5432" y="211.2" text-anchor="middle" font-size="10" fill="#555">always needed</ns0:text>
  <ns0:rect x="11.2373" y="233.6" width="427.0178" height="60.8" rx="1.1237" fill="#F5F5F5" stroke="#ccc" stroke-width="0.5619" />
  <ns0:text x="56.1866" y="272" text-anchor="middle" font-size="10" fill="#333">2</ns0:text>
  <ns0:text x="174.1783" y="272" text-anchor="middle" font-size="10" fill="#333">Directly imported modules</ns0:text>
  <ns0:text x="320.2634" y="272" text-anchor="middle" font-size="10" fill="#1565C0" font-weight="bold">~1,500 tokens</ns0:text>
  <ns0:text x="404.5432" y="272" text-anchor="middle" font-size="10" fill="#555">dependencies</ns0:text>
  <ns0:rect x="11.2373" y="294.4" width="427.0178" height="60.8" rx="1.1237" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5619" />
  <ns0:text x="56.1866" y="332.8" text-anchor="middle" font-size="10" fill="#333">3</ns0:text>
  <ns0:text x="174.1783" y="332.8" text-anchor="middle" font-size="10" fill="#333">Recent git diff</ns0:text>
  <ns0:text x="320.2634" y="332.8" text-anchor="middle" font-size="10" fill="#1565C0" font-weight="bold">~800 tokens</ns0:text>
  <ns0:text x="404.5432" y="332.8" text-anchor="middle" font-size="10" fill="#555">change context</ns0:text>
  <ns0:rect x="11.2373" y="355.2" width="427.0178" height="60.8" rx="1.1237" fill="#F5F5F5" stroke="#ccc" stroke-width="0.5619" />
  <ns0:text x="56.1866" y="393.6" text-anchor="middle" font-size="10" fill="#333">4</ns0:text>
  <ns0:text x="174.1783" y="393.6" text-anchor="middle" font-size="10" fill="#333">Project conventions (CLAUDE.md)</ns0:text>
  <ns0:text x="320.2634" y="393.6" text-anchor="middle" font-size="10" fill="#1565C0" font-weight="bold">~300 tokens</ns0:text>
  <ns0:text x="404.5432" y="393.6" text-anchor="middle" font-size="10" fill="#555">style rules</ns0:text>
  <ns0:rect x="11.2373" y="416" width="427.0178" height="60.8" rx="1.1237" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5619" />
  <ns0:text x="56.1866" y="454.4" text-anchor="middle" font-size="10" fill="#333">5 (lowest)</ns0:text>
  <ns0:text x="174.1783" y="454.4" text-anchor="middle" font-size="10" fill="#333">Related test files</ns0:text>
  <ns0:text x="320.2634" y="454.4" text-anchor="middle" font-size="10" fill="#E65100" font-weight="bold">~600 tokens</ns0:text>
  <ns0:text x="404.5432" y="454.4" text-anchor="middle" font-size="10" fill="#555">drop if tight</ns0:text>
  <ns0:rect x="11.2373" y="476.8" width="427.0178" height="60.8" rx="1.1237" fill="#bdbdbd" stroke="#333" stroke-width="0.5619" />
  <ns0:text x="56.1866" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Total</ns0:text>
  <ns0:text x="174.1783" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">all sources combined</ns0:text>
  <ns0:text x="320.2634" y="515.2" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">~3,700 tokens</ns0:text>
  <ns0:rect x="11.2373" y="560" width="427.0178" height="64" rx="4.4949" fill="#fff8e1" stroke="#F9A825" stroke-width="0.8428" />
  <ns0:text x="224.7462" y="601.6" text-anchor="middle" font-size="10" fill="#555">Rule: always reserve tokens for the model's response — drop Priority 5 sources first</ns0:text>
</ns0:svg>
  <ns0:text x="37.12" y="540.8" text-anchor="middle" font-size="10" fill="#333">config/, crypto/</ns0:text>
  <ns0:text x="37.12" y="569.6" text-anchor="middle" font-size="10" fill="#555">require extra reviewers</ns0:text>

  <ns0:text x="184.32" y="256" text-anchor="middle" font-size="10" fill="var(--text-muted)">merge / block</ns0:text>
  <ns0:rect x="3.84" y="352" width="194.56" height="264" rx="2.56" fill="var(--info-indigo-lt)" stroke="var(--primary-indigo)" stroke-width="0.384" />

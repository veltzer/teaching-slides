  <ns0:text x="184.32" y="256" text-anchor="middle" font-size="10" fill="#555">merge / block</ns0:text>
  <ns0:rect x="3.84" y="352" width="194.56" height="264" rx="2.56" fill="#E8EAF6" stroke="#3949AB" stroke-width="0.384" />
  <ns0:text x="102.4" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="#3949AB">How AI Assigns Risk Scores to PRs</ns0:text>

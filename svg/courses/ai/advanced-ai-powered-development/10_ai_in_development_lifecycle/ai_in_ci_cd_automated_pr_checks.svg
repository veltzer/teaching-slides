<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,160 8.96,0" fill="#333" />
    </marker>
  </defs>
  <rect width="204.8" height="640" fill="var(--surface)" rx="6"/>
  <text x="102.4" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">AI-Powered Automated PR Checks</text>
  <rect x="3.84" y="144" width="32" height="144" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="19.712" y="195.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">PR Opened</text>
  <text x="19.712" y="232" text-anchor="middle" font-size="10" fill="var(--text-muted)">diff ready</text>
  <text x="19.712" y="264" text-anchor="middle" font-size="10" fill="var(--text-muted)">CI triggered</text>
  <line x1="35.84" y1="216" x2="44.8" y2="216" stroke="var(--text)" stroke-width="0.512" marker-end="url(#arr)" />
  <rect x="44.8" y="144" width="32" height="144" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="60.672" y="195.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">AI Review</text>
  <text x="60.672" y="232" text-anchor="middle" font-size="10" fill="var(--text-muted)">security scan</text>
  <text x="60.672" y="264" text-anchor="middle" font-size="10" fill="var(--text-muted)">logic check</text>
  <line x1="76.8" y1="216" x2="85.76" y2="216" stroke="var(--text)" stroke-width="0.512" marker-end="url(#arr)" />
  <rect x="85.76" y="144" width="32" height="144" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="101.632" y="188.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">AI Test</text>
  <text x="101.632" y="220.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Selection</text>
  <text x="101.632" y="256" text-anchor="middle" font-size="10" fill="var(--text-muted)">predict failures</text>
  <line x1="117.76" y1="216" x2="126.72" y2="216" stroke="var(--text)" stroke-width="0.512" marker-end="url(#arr)" />
  <rect x="126.72" y="144" width="32" height="144" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="142.592" y="188.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Risk</text>
  <text x="142.592" y="220.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Scoring</text>
  <text x="142.592" y="256" text-anchor="middle" font-size="10" fill="var(--text-muted)">files changed</text>
  <line x1="158.72" y1="216" x2="167.68" y2="216" stroke="var(--text)" stroke-width="0.512" marker-end="url(#arr)" />
  <rect x="167.68" y="144" width="33.28" height="144" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="184.32" y="188.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Gate</text>
  <text x="184.32" y="220.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Decision</text>
  <text x="184.32" y="256" text-anchor="middle" font-size="10" fill="var(--text-muted)">merge / block</text>
  <rect x="3.84" y="352" width="194.56" height="264" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="102.4" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">How AI Assigns Risk Scores to PRs</text>
  <rect x="8.96" y="428.8" width="56.32" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="37.12" y="472" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">High Risk Files</text>
  <text x="37.12" y="508.8" text-anchor="middle" font-size="10" fill="var(--text)">auth/, payments/</text>
  <text x="37.12" y="540.8" text-anchor="middle" font-size="10" fill="var(--text)">config/, crypto/</text>
  <text x="37.12" y="569.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">require extra reviewers</text>
  <rect x="71.68" y="428.8" width="56.32" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="99.84" y="472" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Complexity Delta</text>
  <text x="99.84" y="508.8" text-anchor="middle" font-size="10" fill="var(--text)">cyclomatic complexity</text>
  <text x="99.84" y="540.8" text-anchor="middle" font-size="10" fill="var(--text)">change magnitude</text>
  <text x="99.84" y="569.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">coverage delta tracked</text>
  <rect x="134.4" y="428.8" width="58.88" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="163.84" y="472" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Historical Defect Rate</text>
  <text x="163.84" y="508.8" text-anchor="middle" font-size="10" fill="var(--text)">past bug frequency</text>
  <text x="163.84" y="540.8" text-anchor="middle" font-size="10" fill="var(--text)">in changed modules</text>
  <text x="163.84" y="569.6" text-anchor="middle" font-size="10" fill="var(--text-muted)">learned from history</text>
</svg>
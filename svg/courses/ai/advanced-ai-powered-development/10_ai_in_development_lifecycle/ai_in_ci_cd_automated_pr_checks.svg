  <ns0:text x="99.84" y="540.8" text-anchor="middle" font-size="10" fill="#333">change magnitude</ns0:text>
  <ns0:text x="99.84" y="569.6" text-anchor="middle" font-size="10" fill="#555">coverage delta tracked</ns0:text>
  <ns0:rect x="134.4" y="428.8" width="58.88" height="160" rx="2.048" fill="#bbdefb" stroke="#3949AB" />
  <ns0:text x="163.84" y="472" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Historical Defect Rate</ns0:text>
  <ns0:text x="163.84" y="508.8" text-anchor="middle" font-size="10" fill="#333">past bug frequency</ns0:text>
  <ns0:text x="163.84" y="540.8" text-anchor="middle" font-size="10" fill="#333">in changed modules</ns0:text>
  <ns0:text x="163.84" y="569.6" text-anchor="middle" font-size="10" fill="#555">learned from history</ns0:text>

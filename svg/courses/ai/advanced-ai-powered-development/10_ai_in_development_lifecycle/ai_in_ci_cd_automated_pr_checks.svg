  <ns0:text x="142.592" y="256" text-anchor="middle" font-size="10" fill="#555">files changed</ns0:text>
  <ns0:line x1="158.72" y1="216" x2="167.68" y2="216" stroke="#333" stroke-width="0.512" marker-end="url(#arr)" />
  <ns0:rect x="167.68" y="144" width="33.28" height="144" rx="2.56" fill="#FFEBEE" stroke="#C62828" stroke-width="0.512" />
  <ns0:text x="184.32" y="188.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Gate</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Pipeline stages -->
  <rect x="40" y="40" width="203.389831" height="153.877551515202" rx="8.777191161417" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="141.694915" y="93.26530578509" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.942978428433" font-weight="bold" fill="var(--primary-text)">PR Opened</text>
  <text x="141.694915" y="134.693877685964" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.457233821325" fill="var(--primary-text)">diff ready</text>
  <text x="141.694915" y="164.285713498542" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.457233821325" fill="var(--primary-text)">CI triggered</text>

  <line x1="248.474576" y1="116.938775757601" x2="289.152542" y2="116.938775757601" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="294.237288" y="40" width="203.389831" height="153.877551515202" rx="8.777191161417" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395.932203" y="93.26530578509" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.942978428433" font-weight="bold" fill="var(--warn-text)">AI Review</text>
  <text x="395.932203" y="134.693877685964" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.457233821325" fill="var(--warn-text)">security scan</text>
  <text x="395.932203" y="164.285713498542" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.457233821325" fill="var(--warn-text)">logic check</text>

  <line x1="502.711864" y1="116.938775757601" x2="543.389831" y2="116.938775757601" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="548.474576" y="40" width="203.389831" height="153.877551515202" rx="8.777191161417" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.169492" y="93.26530578509" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.942978428433" font-weight="bold" fill="var(--info-text)">Test Selection</text>
  <text x="650.169492" y="134.693877685964" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.457233821325" fill="var(--info-text)">predict failures</text>
  <text x="650.169492" y="164.285713498542" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.457233821325" fill="var(--info-text)">run smart subset</text>

  <line x1="756.949153" y1="116.938775757601" x2="797.627119" y2="116.938775757601" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="802.711864" y="40" width="203.389831" height="153.877551515202" rx="8.777191161417" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="904.40678" y="93.26530578509" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.942978428433" font-weight="bold" fill="var(--ok-text)">Risk Scoring</text>
  <text x="904.40678" y="134.693877685964" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.457233821325" fill="var(--ok-text)">rank changes</text>
  <text x="904.40678" y="164.285713498542" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.457233821325" fill="var(--ok-text)">assign reviewers</text>

  <line x1="1011.186441" y1="116.938775757601" x2="1051.864407" y2="116.938775757601" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1056.949153" y="40" width="183.050847" height="153.877551515202" rx="8.777191161417" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1148.474576" y="93.26530578509" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.942978428433" font-weight="bold" fill="var(--danger-text)">Gate Decision</text>
  <text x="1148.474576" y="134.693877685964" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.457233821325" fill="var(--danger-text)">merge</text>
  <text x="1148.474576" y="164.285713498542" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.457233821325" fill="var(--danger-text)">or block</text>

  <!-- Risk score detail box -->
  <rect x="50.169492" y="253.061224242399" width="1179.661017" height="366.938775757601" rx="8.777191161417" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="306.326530027489" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.137276481232" font-weight="bold" fill="var(--text)">How AI Assigns Risk Scores</text>

  <rect x="90.847458" y="347.755101928363" width="345.762712" height="236.73469421491" rx="8.777191161417" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.728814" y="395.102040771345" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.845828877142" font-weight="bold" fill="var(--primary-text)">High-Risk Files</text>
  <text x="263.728814" y="442.448979614327" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.554382322834" fill="var(--primary-text)">auth / payments / crypto</text>
  <text x="263.728814" y="483.877550413161" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.554382322834" fill="var(--primary-text)">config / infra</text>
  <text x="263.728814" y="543.061224242399" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.457233821325" font-style="italic" fill="var(--primary-text)">require extra reviewers</text>

  <rect x="467.118644" y="347.755101928363" width="345.762712" height="236.73469421491" rx="8.777191161417" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="395.102040771345" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.845828877142" font-weight="bold" fill="var(--primary-text)">Complexity Delta</text>
  <text x="640" y="442.448979614327" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.554382322834" fill="var(--primary-text)">cyclomatic complexity</text>
  <text x="640" y="483.877550413161" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.554382322834" fill="var(--primary-text)">change magnitude</text>
  <text x="640" y="543.061224242399" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.457233821325" font-style="italic" fill="var(--primary-text)">coverage delta tracked</text>

  <rect x="843.389831" y="347.755101928363" width="345.762712" height="236.73469421491" rx="8.777191161417" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1016.271186" y="395.102040771345" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.845828877142" font-weight="bold" fill="var(--primary-text)">Historical Defects</text>
  <text x="1016.271186" y="442.448979614327" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.554382322834" fill="var(--primary-text)">past bug frequency</text>
  <text x="1016.271186" y="483.877550413161" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.554382322834" fill="var(--primary-text)">in changed modules</text>
  <text x="1016.271186" y="543.061224242399" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.457233821325" font-style="italic" fill="var(--primary-text)">learned from git history</text>
</svg>

  <ns0:text x="115.4908" y="328" text-anchor="middle" font-size="10" fill="#555">analyze NFRs</ns0:text>
  <ns0:text x="115.4908" y="360" text-anchor="middle" font-size="10" fill="#555">assess tradeoffs</ns0:text>

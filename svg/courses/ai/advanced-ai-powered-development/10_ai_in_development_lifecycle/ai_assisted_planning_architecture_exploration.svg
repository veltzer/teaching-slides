<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,107.1075 8.96,0" fill="#333" />
    </marker>
  </defs>
  <rect width="277" height="580" fill="var(--surface)" rx="5.9972" x="501.5" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">AI-Assisted Architecture Exploration</text>
  <rect x="508.425" y="257.5" width="57.1313" height="145" rx="5.9972" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="536.8176" y="305.35" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Requirements</text>
  <text x="536.8176" y="337.25" text-anchor="middle" font-size="10" fill="var(--text-muted)">"high traffic API"</text>
  <text x="536.8176" y="366.25" text-anchor="middle" font-size="10" fill="var(--text-muted)">"team of 8"</text>
  <text x="536.8176" y="390.9" text-anchor="middle" font-size="10" fill="var(--text-muted)">"rapid iteration"</text>
  <line x1="565.5563" y1="330" x2="577.675" y2="330" stroke="var(--text)" stroke-width="0.7648" marker-end="url(#ar)" />
  <rect x="577.675" y="257.5" width="57.1313" height="145" rx="5.9972" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="606.0676" y="305.35" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">AI Analysis</text>
  <text x="606.0676" y="337.25" text-anchor="middle" font-size="10" fill="var(--text-muted)">analyze NFRs</text>
  <text x="606.0676" y="366.25" text-anchor="middle" font-size="10" fill="var(--text-muted)">assess tradeoffs</text>
  <text x="606.0676" y="390.9" text-anchor="middle" font-size="10" fill="var(--text-muted)">propose options</text>
  <line x1="634.8063" y1="308.25" x2="653.85" y2="228.5" stroke="var(--text)" stroke-width="0.5736" marker-end="url(#ar)" />
  <line x1="634.8063" y1="330" x2="653.85" y2="330" stroke="var(--text)" stroke-width="0.5736" marker-end="url(#ar)" />
  <line x1="634.8063" y1="351.75" x2="653.85" y2="431.5" stroke="var(--text)" stroke-width="0.5736" marker-end="url(#ar)" />
  <rect x="653.85" y="156" width="67.5188" height="123.25" rx="5.9972" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="687.4363" y="196.6" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Option A: Monolith</text>
  <text x="687.4363" y="228.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">faster initial dev</text>
  <text x="687.4363" y="257.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">harder to scale later</text>
  <rect x="653.85" y="264.75" width="67.5188" height="123.25" rx="5.9972" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="687.4363" y="305.35" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Option B: Microservices</text>
  <text x="687.4363" y="337.25" text-anchor="middle" font-size="10" fill="var(--text-muted)">independent scaling</text>
  <text x="687.4363" y="366.25" text-anchor="middle" font-size="10" fill="var(--text-muted)">higher ops complexity</text>
  <rect x="653.85" y="373.5" width="67.5188" height="123.25" rx="5.9972" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="687.4363" y="414.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Option C: Serverless</text>
  <text x="687.4363" y="446" text-anchor="middle" font-size="10" fill="var(--text-muted)">auto-scaling, pay-per-use</text>
  <text x="687.4363" y="475" text-anchor="middle" font-size="10" fill="var(--text-muted)">cold start latency</text>
  <rect x="726.5625" y="156" width="46.7438" height="340.75" rx="5.9972" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="749.7614" y="203.85" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Tradeoffs</text>
  <text x="749.7614" y="240.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">latency</text>
  <text x="749.7614" y="269.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">scale</text>
  <text x="749.7614" y="298.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">cost</text>
  <text x="749.7614" y="327.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">team fit</text>
  <text x="749.7614" y="356.1" text-anchor="middle" font-size="10" fill="var(--text-muted)">time-to-market</text>
  <line x1="721.3687" y1="216.9" x2="726.5625" y2="216.9" stroke="var(--danger-border)" stroke-width="0.5736" />
  <line x1="721.3687" y1="325.65" x2="726.5625" y2="325.65" stroke="var(--danger-border)" stroke-width="0.5736" />
  <line x1="721.3687" y1="434.4" x2="726.5625" y2="434.4" stroke="var(--danger-border)" stroke-width="0.5736" />
  <rect x="508.425" y="540.25" width="263.15" height="65.25" rx="5.9972" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="576.5" text-anchor="middle" font-size="10" fill="var(--text-muted)">AI evaluates options against your NFRs and generates C4 or sequence diagrams on request</text>
</svg>
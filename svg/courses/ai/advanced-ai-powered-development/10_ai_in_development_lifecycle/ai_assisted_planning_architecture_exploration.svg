  <ns0:text x="205.3594" y="172.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Option A: Monolith</ns0:text>
  <ns0:text x="205.3594" y="208" text-anchor="middle" font-size="10" fill="#555">faster initial dev</ns0:text>
  <ns0:text x="205.3594" y="240" text-anchor="middle" font-size="10" fill="#555">harder to scale later</ns0:text>
  <ns0:rect x="168.2647" y="248" width="74.5719" height="136" rx="3.8242" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.7648" />
  <ns0:text x="205.3594" y="292.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Option B: Microservices</ns0:text>
  <ns0:text x="205.3594" y="328" text-anchor="middle" font-size="10" fill="#555">independent scaling</ns0:text>
  <ns0:text x="205.3594" y="360" text-anchor="middle" font-size="10" fill="#555">higher ops complexity</ns0:text>
  <ns0:rect x="168.2647" y="368" width="74.5719" height="136" rx="3.8242" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.7648" />
  <ns0:text x="205.3594" y="412.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Option C: Serverless</ns0:text>
  <ns0:text x="205.3594" y="448" text-anchor="middle" font-size="10" fill="#555">auto-scaling, pay-per-use</ns0:text>
  <ns0:text x="205.3594" y="480" text-anchor="middle" font-size="10" fill="#555">cold start latency</ns0:text>
  <ns0:rect x="248.5728" y="128" width="51.6267" height="376" rx="3.8242" fill="#FCE4EC" stroke="#C62828" stroke-width="0.7648" />
  <ns0:text x="274.195" y="180.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Tradeoffs</ns0:text>
  <ns0:text x="274.195" y="220.8" text-anchor="middle" font-size="10" fill="#555">latency</ns0:text>
  <ns0:text x="274.195" y="252.8" text-anchor="middle" font-size="10" fill="#555">scale</ns0:text>
  <ns0:text x="274.195" y="284.8" text-anchor="middle" font-size="10" fill="#555">cost</ns0:text>
  <ns0:text x="274.195" y="316.8" text-anchor="middle" font-size="10" fill="#555">team fit</ns0:text>
  <ns0:text x="274.195" y="348.8" text-anchor="middle" font-size="10" fill="#555">time-to-market</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,107.1075 8.96,0" fill="#333" />
    </marker>
  </defs>
  <rect width="305.9358" height="640" fill="var(--surface)" rx="6"/>
  <text x="152.9679" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">AI-Assisted Architecture Exploration</text>
  <rect x="7.6484" y="240" width="63.0993" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="39.0068" y="292.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Requirements</text>
  <text x="39.0068" y="328" text-anchor="middle" font-size="10" fill="var(--text-muted)">"high traffic API"</text>
  <text x="39.0068" y="360" text-anchor="middle" font-size="10" fill="var(--text-muted)">"team of 8"</text>
  <text x="39.0068" y="387.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">"rapid iteration"</text>
  <line x1="70.7477" y1="320" x2="84.1323" y2="320" stroke="var(--text)" stroke-width="0.7648" marker-end="url(#ar)" />
  <rect x="84.1323" y="240" width="63.0993" height="160" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="115.4908" y="292.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">AI Analysis</text>
  <text x="115.4908" y="328" text-anchor="middle" font-size="10" fill="var(--text-muted)">analyze NFRs</text>
  <text x="115.4908" y="360" text-anchor="middle" font-size="10" fill="var(--text-muted)">assess tradeoffs</text>
  <text x="115.4908" y="387.2" text-anchor="middle" font-size="10" fill="var(--text-muted)">propose options</text>
  <line x1="147.2316" y1="296" x2="168.2647" y2="208" stroke="var(--text)" stroke-width="0.5736" marker-end="url(#ar)" />
  <line x1="147.2316" y1="320" x2="168.2647" y2="320" stroke="var(--text)" stroke-width="0.5736" marker-end="url(#ar)" />
  <line x1="147.2316" y1="344" x2="168.2647" y2="432" stroke="var(--text)" stroke-width="0.5736" marker-end="url(#ar)" />
  <rect x="168.2647" y="128" width="74.5719" height="136" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="205.3594" y="172.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Option A: Monolith</text>
  <text x="205.3594" y="208" text-anchor="middle" font-size="10" fill="var(--text-muted)">faster initial dev</text>
  <text x="205.3594" y="240" text-anchor="middle" font-size="10" fill="var(--text-muted)">harder to scale later</text>
  <rect x="168.2647" y="248" width="74.5719" height="136" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="205.3594" y="292.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Option B: Microservices</text>
  <text x="205.3594" y="328" text-anchor="middle" font-size="10" fill="var(--text-muted)">independent scaling</text>
  <text x="205.3594" y="360" text-anchor="middle" font-size="10" fill="var(--text-muted)">higher ops complexity</text>
  <rect x="168.2647" y="368" width="74.5719" height="136" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="205.3594" y="412.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Option C: Serverless</text>
  <text x="205.3594" y="448" text-anchor="middle" font-size="10" fill="var(--text-muted)">auto-scaling, pay-per-use</text>
  <text x="205.3594" y="480" text-anchor="middle" font-size="10" fill="var(--text-muted)">cold start latency</text>
  <rect x="248.5728" y="128" width="51.6267" height="376" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="274.195" y="180.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">Tradeoffs</text>
  <text x="274.195" y="220.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">latency</text>
  <text x="274.195" y="252.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">scale</text>
  <text x="274.195" y="284.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">cost</text>
  <text x="274.195" y="316.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">team fit</text>
  <text x="274.195" y="348.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">time-to-market</text>
  <line x1="242.8365" y1="195.2" x2="248.5728" y2="195.2" stroke="var(--danger-border)" stroke-width="0.5736" />
  <line x1="242.8365" y1="315.2" x2="248.5728" y2="315.2" stroke="var(--danger-border)" stroke-width="0.5736" />
  <line x1="242.8365" y1="435.2" x2="248.5728" y2="435.2" stroke="var(--danger-border)" stroke-width="0.5736" />
  <rect x="7.6484" y="552" width="290.639" height="72" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="152.9679" y="592" text-anchor="middle" font-size="10" fill="var(--text-muted)">AI evaluates options against your NFRs and generates C4 or sequence diagrams on request</text>
</svg>
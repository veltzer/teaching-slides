<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Requirements -->
  <rect x="40" y="154.851484390472" width="235.714286" height="229.702970907676" rx="8.874418783911" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="157.857143" y="200.792078997353" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.967441490403" font-weight="bold" fill="var(--primary-text)">Requirements</text>
  <text x="157.857143" y="246.732672540869" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.530232614046" fill="var(--primary-text)">"high-traffic API"</text>
  <text x="157.857143" y="281.18811849603" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.530232614046" fill="var(--primary-text)">"team of 8"</text>
  <text x="157.857143" y="315.643564451191" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.530232614046" fill="var(--primary-text)">"rapid iteration"</text>
  <text x="157.857143" y="355.841584200529" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.420930137157" font-style="italic" fill="var(--primary-text)">NFRs + constraints</text>

  <!-- AI Analysis -->
  <rect x="329.285714" y="154.851484390472" width="235.714286" height="229.702970907676" rx="8.874418783911" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="447.142857" y="200.792078997353" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.967441490403" font-weight="bold" fill="var(--warn-text)">AI Analysis</text>
  <text x="447.142857" y="246.732672540869" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.530232614046" fill="var(--warn-text)">analyze NFRs</text>
  <text x="447.142857" y="281.18811849603" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.530232614046" fill="var(--warn-text)">assess tradeoffs</text>
  <text x="447.142857" y="315.643564451191" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.530232614046" fill="var(--warn-text)">propose options</text>
  <text x="447.142857" y="355.841584200529" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.420930137157" font-style="italic" fill="var(--warn-text)">reason + compare</text>

  <!-- Options -->
  <rect x="618.571429" y="40" width="321.428571" height="114.851485453838" rx="8.874418783911" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="779.285714" y="80.198019749338" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.858139013515" font-weight="bold" fill="var(--ok-text)">Option A: Monolith</text>
  <text x="779.285714" y="114.653464641133" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.530232614046" fill="var(--ok-text)">faster initial dev</text>
  <text x="779.285714" y="139.920791674918" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.420930137157" fill="var(--ok-text)">harder to scale later</text>

  <rect x="618.571429" y="212.277227649074" width="321.428571" height="114.851485453838" rx="8.874418783911" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="779.285714" y="252.475247398412" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.858139013515" font-weight="bold" fill="var(--ok-text)">Option B: Microservices</text>
  <text x="779.285714" y="286.930693353573" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.530232614046" fill="var(--ok-text)">independent scaling</text>
  <text x="779.285714" y="312.198019323992" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.420930137157" fill="var(--ok-text)">higher ops complexity</text>

  <rect x="618.571429" y="384.554455298147" width="321.428571" height="114.851485453838" rx="8.874418783911" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="779.285714" y="424.752475047486" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.858139013515" font-weight="bold" fill="var(--ok-text)">Option C: Serverless</text>
  <text x="779.285714" y="459.207921002647" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.530232614046" fill="var(--ok-text)">auto-scale, pay-per-use</text>
  <text x="779.285714" y="484.475246973065" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.420930137157" fill="var(--ok-text)">cold-start latency</text>

  <!-- Tradeoffs -->
  <rect x="993.571429" y="40" width="246.428571" height="459.405940751985" rx="8.874418783911" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.785714" y="83.643563813171" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.967441490403" font-weight="bold" fill="var(--danger-text)">Tradeoff Axes</text>
  <text x="1116.785714" y="154.851484390472" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.639535090934" fill="var(--danger-text)">latency</text>
  <text x="1116.785714" y="212.277227649074" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.639535090934" fill="var(--danger-text)">scale</text>
  <text x="1116.785714" y="269.702969844309" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.639535090934" fill="var(--danger-text)">cost</text>
  <text x="1116.785714" y="327.128713102911" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.639535090934" fill="var(--danger-text)">team fit</text>
  <text x="1116.785714" y="384.554455298147" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.639535090934" fill="var(--danger-text)">time-to-market</text>
  <text x="1116.785714" y="453.465346145103" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.420930137157" font-style="italic" fill="var(--danger-text)">scored per option</text>

  <!-- Arrows -->
  <line x1="275.714286" y1="269.702969844309" x2="329.285714" y2="269.702969844309" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="565" y1="223.762376300794" x2="618.571429" y2="97.425742195236" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="565" y1="269.702969844309" x2="618.571429" y2="269.702969844309" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="565" y1="315.643564451191" x2="618.571429" y2="441.980197493383" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="940" y1="97.425742195236" x2="993.571429" y2="143.366336802117" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="940" y1="269.702969844309" x2="993.571429" y2="269.702969844309" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="940" y1="441.980197493383" x2="993.571429" y2="396.039603949868" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom note -->
  <rect x="40" y="539.603960501323" width="1200" height="80.396039498677" rx="8.874418783911" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.714286" y="582.099009981006" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.748836536626" fill="var(--info-text)">AI evaluates each option against your NFRs and generates C4 or sequence diagrams on request</text>
</svg>

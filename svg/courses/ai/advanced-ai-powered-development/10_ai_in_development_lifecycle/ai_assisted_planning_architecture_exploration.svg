<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-accent)">AI-Assisted Architecture Exploration</text>

  <!-- Requirements -->
  <rect x="70" y="210" width="220" height="200" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Requirements</text>
  <text x="180" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">"high-traffic API"</text>
  <text x="180" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">"team of 8"</text>
  <text x="180" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">"rapid iteration"</text>
  <text x="180" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">NFRs + constraints</text>

  <!-- AI Analysis -->
  <rect x="340" y="210" width="220" height="200" rx="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="450" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">AI Analysis</text>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">analyze NFRs</text>
  <text x="450" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">assess tradeoffs</text>
  <text x="450" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">propose options</text>
  <text x="450" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">reason + compare</text>

  <!-- Options -->
  <rect x="610" y="110" width="300" height="100" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="760" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--ok-text)">Option A: Monolith</text>
  <text x="760" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">faster initial dev</text>
  <text x="760" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">harder to scale later</text>

  <rect x="610" y="260" width="300" height="100" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="760" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--ok-text)">Option B: Microservices</text>
  <text x="760" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">independent scaling</text>
  <text x="760" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">higher ops complexity</text>

  <rect x="610" y="410" width="300" height="100" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="760" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--ok-text)">Option C: Serverless</text>
  <text x="760" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">auto-scale, pay-per-use</text>
  <text x="760" y="497" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">cold-start latency</text>

  <!-- Tradeoffs -->
  <rect x="960" y="110" width="230" height="400" rx="8" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1075" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Tradeoff Axes</text>
  <text x="1075" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">latency</text>
  <text x="1075" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">scale</text>
  <text x="1075" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">cost</text>
  <text x="1075" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">team fit</text>
  <text x="1075" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">time-to-market</text>
  <text x="1075" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--danger-text)">scored per option</text>

  <!-- Arrows -->
  <line x1="290" y1="310" x2="340" y2="310" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="560" y1="270" x2="610" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="560" y1="310" x2="610" y2="310" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="560" y1="350" x2="610" y2="460" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="910" y1="160" x2="960" y2="200" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="910" y1="310" x2="960" y2="310" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="910" y1="460" x2="960" y2="420" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bottom note -->
  <rect x="70" y="545" width="1120" height="70" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">AI evaluates each option against your NFRs and generates C4 or sequence diagrams on request</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Measuring AI Impact on Development Velocity</text>

  <rect x="40" y="140" width="1200" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Metric</text>
  <text x="640" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Before AI</text>
  <text x="900" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">After AI</text>
  <text x="1120" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Delta</text>

  <rect x="40" y="210" width="1200" height="55" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="250" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">PR cycle time (median)</text>
  <text x="640" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">4.2 days</text>
  <text x="900" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">1.8 days</text>
  <text x="1120" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-accent)">-57%</text>

  <rect x="40" y="275" width="1200" height="55" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="250" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Review turnaround</text>
  <text x="640" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">18 hrs</text>
  <text x="900" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">3 hrs</text>
  <text x="1120" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-accent)">-83%</text>

  <rect x="40" y="340" width="1200" height="55" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="250" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Defect escape rate</text>
  <text x="640" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">5.1%</text>
  <text x="900" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">2.3%</text>
  <text x="1120" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-accent)">-55%</text>

  <rect x="40" y="405" width="1200" height="55" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="250" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Test coverage</text>
  <text x="640" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">64%</text>
  <text x="900" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">82%</text>
  <text x="1120" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-accent)">+28%</text>

  <rect x="40" y="470" width="1200" height="55" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="250" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">CI pipeline duration</text>
  <text x="640" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">38 min</text>
  <text x="900" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">14 min</text>
  <text x="1120" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-accent)">-63%</text>

  <rect x="40" y="540" width="1200" height="80" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Measure at team level, not individual level — track satisfaction alongside productivity</text>
  <text x="640" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--info-text)">Re-evaluate quarterly; numbers guide decisions, they do not replace judgment</text>
</svg>

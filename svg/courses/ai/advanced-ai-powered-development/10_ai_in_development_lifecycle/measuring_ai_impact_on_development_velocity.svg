<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="421.3435" height="640" fill="var(--surface)" rx="6"/>
  <text x="210.6717" y="56" text-anchor="middle" font-size="10.5336" font-weight="bold" fill="var(--primary-accent)">Measuring AI Impact on Development Velocity</text>
  <rect x="10.5336" y="88" width="400.2763" height="60.8" rx="6" fill="var(--border)" stroke="var(--text)" stroke-width="0.5267" />
  <text x="92.1689" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">Metric</text>
  <text x="237.0057" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">Before AI</text>
  <text x="305.474" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">After AI</text>
  <text x="379.2091" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">Delta</text>
  <rect x="10.5336" y="148.8" width="400.2763" height="64" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="92.1689" y="188.8" text-anchor="middle" font-size="10" fill="var(--text)">PR cycle time (median)</text>
  <text x="237.0057" y="188.8" text-anchor="middle" font-size="10" fill="var(--text)">4.2 days</text>
  <text x="305.474" y="188.8" text-anchor="middle" font-size="10" fill="var(--text)">1.8 days</text>
  <rect x="352.8751" y="152" width="56.8814" height="57.6" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="381.3158" y="188.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">-57%</text>
  <rect x="10.5336" y="212.8" width="400.2763" height="64" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="92.1689" y="252.8" text-anchor="middle" font-size="10" fill="var(--text)">Review turnaround</text>
  <text x="237.0057" y="252.8" text-anchor="middle" font-size="10" fill="var(--text)">18 hrs</text>
  <text x="305.474" y="252.8" text-anchor="middle" font-size="10" fill="var(--text)">3 hrs</text>
  <rect x="352.8751" y="216" width="56.8814" height="57.6" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="381.3158" y="252.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">-83%</text>
  <rect x="10.5336" y="276.8" width="400.2763" height="64" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="92.1689" y="316.8" text-anchor="middle" font-size="10" fill="var(--text)">Defect escape rate</text>
  <text x="237.0057" y="316.8" text-anchor="middle" font-size="10" fill="var(--text)">5.1%</text>
  <text x="305.474" y="316.8" text-anchor="middle" font-size="10" fill="var(--text)">2.3%</text>
  <rect x="352.8751" y="280" width="56.8814" height="57.6" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="381.3158" y="316.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">-55%</text>
  <rect x="10.5336" y="340.8" width="400.2763" height="64" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="92.1689" y="380.8" text-anchor="middle" font-size="10" fill="var(--text)">Test coverage</text>
  <text x="237.0057" y="380.8" text-anchor="middle" font-size="10" fill="var(--text)">64%</text>
  <text x="305.474" y="380.8" text-anchor="middle" font-size="10" fill="var(--text)">82%</text>
  <rect x="352.8751" y="344" width="56.8814" height="57.6" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="381.3158" y="380.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">+28%</text>
  <rect x="10.5336" y="404.8" width="400.2763" height="64" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="92.1689" y="444.8" text-anchor="middle" font-size="10" fill="var(--text)">CI pipeline duration</text>
  <text x="237.0057" y="444.8" text-anchor="middle" font-size="10" fill="var(--text)">38 min</text>
  <text x="305.474" y="444.8" text-anchor="middle" font-size="10" fill="var(--text)">14 min</text>
  <rect x="352.8751" y="408" width="56.8814" height="57.6" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="381.3158" y="444.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">-63%</text>
  <rect x="10.5336" y="504" width="400.2763" height="120" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="210.6717" y="548.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Measurement Guidelines</text>
  <text x="21.0672" y="587.2" font-size="10" fill="var(--text)">▶ Measure at team level, not individual level — avoid gaming and comparison pressure</text>
  <text x="21.0672" y="614.4" font-size="10" fill="var(--text)">▶ Track developer satisfaction alongside productivity — re-evaluate quarterly</text>
</svg>
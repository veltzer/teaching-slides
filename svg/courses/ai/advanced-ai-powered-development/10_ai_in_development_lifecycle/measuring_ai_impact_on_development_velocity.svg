<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="381.8425" height="580" fill="var(--surface)" rx="6" x="449.0787" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Measuring AI Impact on Development Velocity</text>
  <rect x="458.6248" y="119.75" width="362.7504" height="55.1" rx="6" fill="var(--border)" stroke="var(--text)" stroke-width="0.5267" />
  <text x="532.6068" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">Metric</text>
  <text x="663.8651" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">Before AI</text>
  <text x="725.9145" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">After AI</text>
  <text x="792.737" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">Delta</text>
  <rect x="458.6248" y="174.85" width="362.7504" height="58" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="532.6068" y="211.1" text-anchor="middle" font-size="10" fill="var(--text)">PR cycle time (median)</text>
  <text x="663.8651" y="211.1" text-anchor="middle" font-size="10" fill="var(--text)">4.2 days</text>
  <text x="725.9145" y="211.1" text-anchor="middle" font-size="10" fill="var(--text)">1.8 days</text>
  <rect x="768.8718" y="177.75" width="51.5488" height="52.2" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="794.6462" y="211.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">-57%</text>
  <rect x="458.6248" y="232.85" width="362.7504" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="532.6068" y="269.1" text-anchor="middle" font-size="10" fill="var(--text)">Review turnaround</text>
  <text x="663.8651" y="269.1" text-anchor="middle" font-size="10" fill="var(--text)">18 hrs</text>
  <text x="725.9145" y="269.1" text-anchor="middle" font-size="10" fill="var(--text)">3 hrs</text>
  <rect x="768.8718" y="235.75" width="51.5488" height="52.2" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="794.6462" y="269.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">-83%</text>
  <rect x="458.6248" y="290.85" width="362.7504" height="58" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="532.6068" y="327.1" text-anchor="middle" font-size="10" fill="var(--text)">Defect escape rate</text>
  <text x="663.8651" y="327.1" text-anchor="middle" font-size="10" fill="var(--text)">5.1%</text>
  <text x="725.9145" y="327.1" text-anchor="middle" font-size="10" fill="var(--text)">2.3%</text>
  <rect x="768.8718" y="293.75" width="51.5488" height="52.2" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="794.6462" y="327.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">-55%</text>
  <rect x="458.6248" y="348.85" width="362.7504" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="532.6068" y="385.1" text-anchor="middle" font-size="10" fill="var(--text)">Test coverage</text>
  <text x="663.8651" y="385.1" text-anchor="middle" font-size="10" fill="var(--text)">64%</text>
  <text x="725.9145" y="385.1" text-anchor="middle" font-size="10" fill="var(--text)">82%</text>
  <rect x="768.8718" y="351.75" width="51.5488" height="52.2" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="794.6462" y="385.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">+28%</text>
  <rect x="458.6248" y="406.85" width="362.7504" height="58" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="532.6068" y="443.1" text-anchor="middle" font-size="10" fill="var(--text)">CI pipeline duration</text>
  <text x="663.8651" y="443.1" text-anchor="middle" font-size="10" fill="var(--text)">38 min</text>
  <text x="725.9145" y="443.1" text-anchor="middle" font-size="10" fill="var(--text)">14 min</text>
  <rect x="768.8718" y="409.75" width="51.5488" height="52.2" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="794.6462" y="443.1" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--danger-accent)">-63%</text>
  <rect x="458.6248" y="496.75" width="362.7504" height="108.75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="537.35" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Measurement Guidelines</text>
  <text x="468.1709" y="572.15" font-size="10" fill="var(--text)">▶ Measure at team level, not individual level — avoid gaming and comparison pressure</text>
  <text x="468.1709" y="596.8" font-size="10" fill="var(--text)">▶ Track developer satisfaction alongside productivity — re-evaluate quarterly</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect width="421.3435" height="640" fill="#f9f9f9" />
  <ns0:text x="210.6717" y="56" text-anchor="middle" font-size="10.5336" font-weight="bold" fill="#1a237e">Measuring AI Impact on Development Velocity</ns0:text>
  <ns0:rect x="10.5336" y="88" width="400.2763" height="60.8" rx="2.6334" fill="#bdbdbd" stroke="#333" stroke-width="0.5267" />
  <ns0:text x="92.1689" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Metric</ns0:text>
  <ns0:text x="237.0057" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Before AI</ns0:text>
  <ns0:text x="305.474" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">After AI</ns0:text>
  <ns0:text x="379.2091" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Delta</ns0:text>
  <ns0:rect x="10.5336" y="148.8" width="400.2763" height="64" rx="1.0534" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5267" />
  <ns0:text x="92.1689" y="188.8" text-anchor="middle" font-size="10" fill="#333">PR cycle time (median)</ns0:text>
  <ns0:text x="237.0057" y="188.8" text-anchor="middle" font-size="10" fill="#333">4.2 days</ns0:text>
  <ns0:text x="305.474" y="188.8" text-anchor="middle" font-size="10" fill="#333">1.8 days</ns0:text>
  <ns0:rect x="352.8751" y="152" width="56.8814" height="57.6" rx="1.58" fill="#FFCDD2" stroke="#C62828" />
  <ns0:text x="381.3158" y="188.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">-57%</ns0:text>
  <ns0:rect x="10.5336" y="212.8" width="400.2763" height="64" rx="1.0534" fill="#F5F5F5" stroke="#ccc" stroke-width="0.5267" />
  <ns0:text x="92.1689" y="252.8" text-anchor="middle" font-size="10" fill="#333">Review turnaround</ns0:text>
  <ns0:text x="237.0057" y="252.8" text-anchor="middle" font-size="10" fill="#333">18 hrs</ns0:text>
  <ns0:text x="305.474" y="252.8" text-anchor="middle" font-size="10" fill="#333">3 hrs</ns0:text>
  <ns0:rect x="352.8751" y="216" width="56.8814" height="57.6" rx="1.58" fill="#FFCDD2" stroke="#C62828" />
  <ns0:text x="381.3158" y="252.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">-83%</ns0:text>
  <ns0:rect x="10.5336" y="276.8" width="400.2763" height="64" rx="1.0534" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5267" />
  <ns0:text x="92.1689" y="316.8" text-anchor="middle" font-size="10" fill="#333">Defect escape rate</ns0:text>
  <ns0:text x="237.0057" y="316.8" text-anchor="middle" font-size="10" fill="#333">5.1%</ns0:text>
  <ns0:text x="305.474" y="316.8" text-anchor="middle" font-size="10" fill="#333">2.3%</ns0:text>
  <ns0:rect x="352.8751" y="280" width="56.8814" height="57.6" rx="1.58" fill="#FFCDD2" stroke="#C62828" />
  <ns0:text x="381.3158" y="316.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">-55%</ns0:text>
  <ns0:rect x="10.5336" y="340.8" width="400.2763" height="64" rx="1.0534" fill="#F5F5F5" stroke="#ccc" stroke-width="0.5267" />
  <ns0:text x="92.1689" y="380.8" text-anchor="middle" font-size="10" fill="#333">Test coverage</ns0:text>
  <ns0:text x="237.0057" y="380.8" text-anchor="middle" font-size="10" fill="#333">64%</ns0:text>
  <ns0:text x="305.474" y="380.8" text-anchor="middle" font-size="10" fill="#333">82%</ns0:text>
  <ns0:rect x="352.8751" y="344" width="56.8814" height="57.6" rx="1.58" fill="#C8E6C9" stroke="#2E7D32" />
  <ns0:text x="381.3158" y="380.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">+28%</ns0:text>
  <ns0:rect x="10.5336" y="404.8" width="400.2763" height="64" rx="1.0534" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5267" />
  <ns0:text x="92.1689" y="444.8" text-anchor="middle" font-size="10" fill="#333">CI pipeline duration</ns0:text>
  <ns0:text x="237.0057" y="444.8" text-anchor="middle" font-size="10" fill="#333">38 min</ns0:text>
  <ns0:text x="305.474" y="444.8" text-anchor="middle" font-size="10" fill="#333">14 min</ns0:text>
  <ns0:rect x="352.8751" y="408" width="56.8814" height="57.6" rx="1.58" fill="#FFCDD2" stroke="#C62828" />
  <ns0:text x="381.3158" y="444.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">-63%</ns0:text>
  <ns0:rect x="10.5336" y="504" width="400.2763" height="120" rx="5.2668" fill="#E8EAF6" stroke="#3949AB" stroke-width="0.79" />
  <ns0:text x="210.6717" y="548.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#3949AB">Measurement Guidelines</ns0:text>
  <ns0:text x="21.0672" y="587.2" font-size="10" fill="#333">▶ Measure at team level, not individual level — avoid gaming and comparison pressure</ns0:text>
  <ns0:text x="21.0672" y="614.4" font-size="10" fill="#333">▶ Track developer satisfaction alongside productivity — re-evaluate quarterly</ns0:text>
</ns0:svg>
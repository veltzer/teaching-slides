  <ns0:text x="210.6717" y="548.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-indigo)">Measurement Guidelines</ns0:text>
  <ns0:text x="21.0672" y="587.2" font-size="10" fill="var(--text-dark)">▶ Measure at team level, not individual level — avoid gaming and comparison pressure</ns0:text>

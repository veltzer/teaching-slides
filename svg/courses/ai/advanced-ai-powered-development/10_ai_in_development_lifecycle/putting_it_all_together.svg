<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,76.6864 8.96,0" fill="#333" />
    </marker>
  </defs>
  <rect width="387.2395" height="580" fill="var(--surface)" rx="6" x="446.3802" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">AI Across the Full Development Lifecycle</text>
  <rect x="456.0612" y="134.25" width="82.2884" height="79.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="497.2054" y="180.65" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Plan &amp; Design</text>
  <line x1="538.3497" y1="173.4" x2="550.4508" y2="173.4" stroke="var(--text)" stroke-width="1.0682" marker-end="url(#arr)" />
  <rect x="550.4508" y="134.25" width="82.2884" height="79.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="591.595" y="180.65" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Code &amp; Review</text>
  <line x1="632.7392" y1="173.4" x2="644.8405" y2="173.4" stroke="var(--text)" stroke-width="1.0682" marker-end="url(#arr)" />
  <rect x="644.8405" y="134.25" width="82.2884" height="79.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="685.9847" y="180.65" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Test &amp; Verify</text>
  <line x1="727.1289" y1="173.4" x2="739.2301" y2="173.4" stroke="var(--text)" stroke-width="1.0682" marker-end="url(#arr)" />
  <rect x="739.2301" y="134.25" width="84.7086" height="79.75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="781.3424" y="180.65" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Deploy &amp; Run</text>
  <rect x="456.0612" y="257.5" width="367.8775" height="290" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="3.2047 1.6024" />
  <text x="640" y="301" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--text)">AI Layer (transparent to the team)</text>
  <rect x="463.3219" y="322.75" width="84.7086" height="210.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="505.4343" y="361.9" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Plan &amp; Design AI</text>
  <text x="505.4343" y="395.25" text-anchor="middle" font-size="10" fill="var(--text)">Req. analysis</text>
  <text x="505.4343" y="424.25" text-anchor="middle" font-size="10" fill="var(--text)">Arch proposals</text>
  <text x="505.4343" y="453.25" text-anchor="middle" font-size="10" fill="var(--text)">Schema design</text>
  <text x="505.4343" y="482.25" text-anchor="middle" font-size="10" fill="var(--text)">Sprint planning</text>
  <text x="505.4343" y="511.25" text-anchor="middle" font-size="10" fill="var(--text)">ADR generation</text>
  <rect x="555.2914" y="322.75" width="84.7086" height="210.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="597.4036" y="361.9" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Code &amp; Review AI</text>
  <text x="597.4036" y="395.25" text-anchor="middle" font-size="10" fill="var(--text)">Agent coding</text>
  <text x="597.4036" y="424.25" text-anchor="middle" font-size="10" fill="var(--text)">Auto review</text>
  <text x="597.4036" y="453.25" text-anchor="middle" font-size="10" fill="var(--text)">Security scan</text>
  <text x="597.4036" y="482.25" text-anchor="middle" font-size="10" fill="var(--text)">Perf analysis</text>
  <text x="597.4036" y="511.25" text-anchor="middle" font-size="10" fill="var(--text)">Debt detection</text>
  <rect x="647.2607" y="322.75" width="84.7086" height="210.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="689.373" y="361.9" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">Test &amp; Verify AI</text>
  <text x="689.373" y="395.25" text-anchor="middle" font-size="10" fill="var(--text)">Test generation</text>
  <text x="689.373" y="424.25" text-anchor="middle" font-size="10" fill="var(--text)">Property-based</text>
  <text x="689.373" y="453.25" text-anchor="middle" font-size="10" fill="var(--text)">Smart selection</text>
  <text x="689.373" y="482.25" text-anchor="middle" font-size="10" fill="var(--text)">Coverage gaps</text>
  <text x="689.373" y="511.25" text-anchor="middle" font-size="10" fill="var(--text)">Visual regression</text>
  <rect x="739.2301" y="322.75" width="79.8682" height="210.25" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="778.9221" y="361.9" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Deploy &amp; Run AI</text>
  <text x="778.9221" y="395.25" text-anchor="middle" font-size="10" fill="var(--text)">Risk scoring</text>
  <text x="778.9221" y="424.25" text-anchor="middle" font-size="10" fill="var(--text)">Auto rollback</text>
  <text x="778.9221" y="453.25" text-anchor="middle" font-size="10" fill="var(--text)">Incident RCA</text>
  <text x="778.9221" y="482.25" text-anchor="middle" font-size="10" fill="var(--text)">Log analysis</text>
  <text x="778.9221" y="511.25" text-anchor="middle" font-size="10" fill="var(--text)">Post-mortems</text>
  <rect x="456.0612" y="569.25" width="367.8775" height="40.6" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="595.35" text-anchor="middle" font-size="10" fill="var(--text)">Start where your team has the most pain, then expand — keep humans in the decision loop</text>
</svg>
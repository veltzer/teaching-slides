<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--text)">AI Across the Full Development Lifecycle</text>

  <rect x="40" y="130" width="285" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Plan &amp; Design</text>
  <line x1="325" y1="170" x2="345" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="345" y="130" width="285" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Code &amp; Review</text>
  <line x1="630" y1="170" x2="650" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="650" y="130" width="285" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Test &amp; Verify</text>
  <line x1="935" y1="170" x2="955" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="955" y="130" width="285" height="80" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Deploy &amp; Run</text>

  <rect x="40" y="230" width="285" height="300" rx="6" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="182" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">AI assists</text>
  <text x="182" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Requirements analysis</text>
  <text x="182" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Architecture proposals</text>
  <text x="182" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Schema design</text>
  <text x="182" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Sprint planning</text>
  <text x="182" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">ADR generation</text>
  <text x="182" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Risk assessment</text>

  <rect x="345" y="230" width="285" height="300" rx="6" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="487" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-accent)">AI assists</text>
  <text x="487" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Agent coding</text>
  <text x="487" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Automated review</text>
  <text x="487" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Security scanning</text>
  <text x="487" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Performance analysis</text>
  <text x="487" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Debt detection</text>
  <text x="487" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Refactor suggestions</text>

  <rect x="650" y="230" width="285" height="300" rx="6" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="792" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-accent)">AI assists</text>
  <text x="792" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Test generation</text>
  <text x="792" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Property-based tests</text>
  <text x="792" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Smart selection</text>
  <text x="792" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Coverage gap finder</text>
  <text x="792" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Visual regression</text>
  <text x="792" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Flake triage</text>

  <rect x="955" y="230" width="285" height="300" rx="6" fill="var(--surface)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1097" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-accent)">AI assists</text>
  <text x="1097" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Deploy risk scoring</text>
  <text x="1097" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Auto rollback</text>
  <text x="1097" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Incident RCA</text>
  <text x="1097" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Log analysis</text>
  <text x="1097" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Post-mortem drafts</text>
  <text x="1097" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Alert correlation</text>

  <rect x="40" y="550" width="1200" height="70" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Start where your team has the most pain, then expand — keep humans in the decision loop</text>
</svg>

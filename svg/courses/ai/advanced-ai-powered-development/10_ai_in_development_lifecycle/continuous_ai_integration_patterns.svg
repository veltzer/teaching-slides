<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="277.2543" height="580" fill="var(--surface)" rx="6" x="501.3728" y="40"/>
  <text x="640" y="90.75" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Continuous AI Integration Patterns</text>
  <rect x="511.7699" y="156" width="57.1837" height="116" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="540.1884" y="202.4" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">IDE Copilot</text>
  <text x="540.1884" y="232.85" text-anchor="middle" font-size="10" fill="var(--text-muted)">inline completion</text>
  <text x="540.1884" y="257.5" text-anchor="middle" font-size="10" fill="var(--text-faint)">dev time</text>
  <rect x="575.8849" y="156" width="57.1837" height="116" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="604.3035" y="202.4" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">PR AI Review</text>
  <text x="604.3035" y="232.85" text-anchor="middle" font-size="10" fill="var(--text-muted)">code review bot</text>
  <text x="604.3035" y="257.5" text-anchor="middle" font-size="10" fill="var(--text-faint)">pre-merge</text>
  <rect x="640" y="156" width="57.1837" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="668.4185" y="202.4" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">CI AI Checks</text>
  <text x="668.4185" y="232.85" text-anchor="middle" font-size="10" fill="var(--text-muted)">test selection</text>
  <text x="668.4185" y="257.5" text-anchor="middle" font-size="10" fill="var(--text-faint)">on every push</text>
  <rect x="704.1151" y="156" width="64.1151" height="116" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="735.9993" y="202.4" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Deploy AI</text>
  <text x="735.9993" y="232.85" text-anchor="middle" font-size="10" fill="var(--text-muted)">risk assessment</text>
  <text x="735.9993" y="257.5" text-anchor="middle" font-size="10" fill="var(--text-faint)">auto-rollback</text>
  <rect x="511.7699" y="330" width="256.4602" height="116" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="377.85" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Shared Context Layer</text>
  <text x="640" y="417" text-anchor="middle" font-size="10" fill="var(--text-muted)">Codebase knowledge, team conventions, project history, test results</text>
  <line x1="540.1884" y1="272" x2="540.1884" y2="330" stroke="var(--text-faint)" stroke-width="0.5736" stroke-dasharray="1.9121 1.1473" />
  <line x1="604.3035" y1="272" x2="604.3035" y2="330" stroke="var(--text-faint)" stroke-width="0.5736" stroke-dasharray="1.9121 1.1473" />
  <line x1="668.4185" y1="272" x2="668.4185" y2="330" stroke="var(--text-faint)" stroke-width="0.5736" stroke-dasharray="1.9121 1.1473" />
  <line x1="735.9993" y1="272" x2="735.9993" y2="330" stroke="var(--text-faint)" stroke-width="0.5736" stroke-dasharray="1.9121 1.1473" />
  <rect x="511.7699" y="482.25" width="256.4602" height="123.25" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="522.85" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Adoption Pattern Recommendations</text>
  <rect x="518.7012" y="547.5" width="69.3136" height="43.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="553.3581" y="577.95" text-anchor="middle" font-size="10" fill="var(--text)">Start: Advisory (non-blocking)</text>
  <rect x="605.3432" y="547.5" width="69.3136" height="43.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="577.95" text-anchor="middle" font-size="10" fill="var(--text)">Grow: Gate-based (blocking)</text>
  <rect x="691.9852" y="547.5" width="69.3136" height="43.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="726.6419" y="577.95" text-anchor="middle" font-size="10" fill="var(--text)">Mature: Ambient (proactive PRs)</text>
</svg>
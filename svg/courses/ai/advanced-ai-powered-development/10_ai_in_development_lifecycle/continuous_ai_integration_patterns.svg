<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="305.9358" height="640" fill="var(--surface)" rx="6"/>
  <text x="152.9679" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Continuous AI Integration Patterns</text>
  <rect x="11.4726" y="128" width="63.0993" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="42.831" y="179.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">IDE Copilot</text>
  <text x="42.831" y="212.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">inline completion</text>
  <text x="42.831" y="240" text-anchor="middle" font-size="10" fill="var(--text-faint)">dev time</text>
  <rect x="82.2202" y="128" width="63.0993" height="128" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="113.5787" y="179.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">PR AI Review</text>
  <text x="113.5787" y="212.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">code review bot</text>
  <text x="113.5787" y="240" text-anchor="middle" font-size="10" fill="var(--text-faint)">pre-merge</text>
  <rect x="152.9679" y="128" width="63.0993" height="128" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="184.3263" y="179.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--ok-accent)">CI AI Checks</text>
  <text x="184.3263" y="212.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">test selection</text>
  <text x="184.3263" y="240" text-anchor="middle" font-size="10" fill="var(--text-faint)">on every push</text>
  <rect x="223.7156" y="128" width="70.7477" height="128" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="258.8982" y="179.2" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--info-accent)">Deploy AI</text>
  <text x="258.8982" y="212.8" text-anchor="middle" font-size="10" fill="var(--text-muted)">risk assessment</text>
  <text x="258.8982" y="240" text-anchor="middle" font-size="10" fill="var(--text-faint)">auto-rollback</text>
  <rect x="11.4726" y="320" width="282.9906" height="128" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="152.9679" y="372.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--warn-accent)">Shared Context Layer</text>
  <text x="152.9679" y="416" text-anchor="middle" font-size="10" fill="var(--text-muted)">Codebase knowledge, team conventions, project history, test results</text>
  <line x1="42.831" y1="256" x2="42.831" y2="320" stroke="var(--text-faint)" stroke-width="0.5736" stroke-dasharray="1.9121 1.1473" />
  <line x1="113.5787" y1="256" x2="113.5787" y2="320" stroke="var(--text-faint)" stroke-width="0.5736" stroke-dasharray="1.9121 1.1473" />
  <line x1="184.3263" y1="256" x2="184.3263" y2="320" stroke="var(--text-faint)" stroke-width="0.5736" stroke-dasharray="1.9121 1.1473" />
  <line x1="258.8982" y1="256" x2="258.8982" y2="320" stroke="var(--text-faint)" stroke-width="0.5736" stroke-dasharray="1.9121 1.1473" />
  <rect x="11.4726" y="488" width="282.9906" height="136" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="152.9679" y="532.8" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--primary-accent)">Adoption Pattern Recommendations</text>
  <rect x="19.121" y="560" width="76.484" height="48" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="57.363" y="593.6" text-anchor="middle" font-size="10" fill="var(--text)">Start: Advisory (non-blocking)</text>
  <rect x="114.7259" y="560" width="76.484" height="48" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="152.9679" y="593.6" text-anchor="middle" font-size="10" fill="var(--text)">Grow: Gate-based (blocking)</text>
  <rect x="210.3309" y="560" width="76.484" height="48" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="248.5728" y="593.6" text-anchor="middle" font-size="10" fill="var(--text)">Mature: Ambient (proactive PRs)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-accent)">Continuous AI Integration Patterns</text>

  <!-- Pipeline row: 4 stages -->
  <rect x="70" y="110" width="270" height="140" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="205" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="var(--primary-text)">IDE Copilot</text>
  <text x="205" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">inline completion</text>
  <text x="205" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">stage: dev time</text>

  <rect x="360" y="110" width="270" height="140" rx="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="495" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="var(--warn-text)">PR AI Review</text>
  <text x="495" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">code review bot</text>
  <text x="495" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">stage: pre-merge</text>

  <rect x="650" y="110" width="270" height="140" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="785" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="var(--ok-text)">CI AI Checks</text>
  <text x="785" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">test selection</text>
  <text x="785" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">stage: every push</text>

  <rect x="940" y="110" width="270" height="140" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1075" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="var(--info-text)">Deploy AI</text>
  <text x="1075" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">risk assessment</text>
  <text x="1075" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">stage: auto-rollback</text>

  <!-- Dashed connectors to shared layer -->
  <line x1="205" y1="250" x2="205" y2="300" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="495" y1="250" x2="495" y2="300" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="785" y1="250" x2="785" y2="300" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="1075" y1="250" x2="1075" y2="300" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Shared context layer -->
  <rect x="70" y="300" width="1140" height="110" rx="8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Shared Context Layer</text>
  <text x="640" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">codebase knowledge · team conventions · project history · test results</text>

  <!-- Adoption bar title -->
  <text x="640" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Adoption Maturity</text>

  <!-- Adoption stages -->
  <rect x="70" y="475" width="360" height="130" rx="8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="250" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Start: Advisory</text>
  <text x="250" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">non-blocking comments</text>
  <text x="250" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">build trust first</text>

  <rect x="460" y="475" width="360" height="130" rx="8" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Grow: Gate-based</text>
  <text x="640" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">required CI check</text>
  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">blocks merge on failure</text>

  <rect x="850" y="475" width="360" height="130" rx="8" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1030" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Mature: Ambient</text>
  <text x="1030" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">proactive improvement PRs</text>
  <text x="1030" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">continuous monitoring</text>
</svg>

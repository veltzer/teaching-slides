<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Neural network brain outline -->
  <ellipse cx="400" cy="170" rx="100" ry="90" fill="none" stroke="#7c3aed" stroke-width="2.5" opacity="0.8"/>
  <ellipse cx="400" cy="160" rx="85" ry="65" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>
  <!-- Neural nodes -->
  <circle cx="360" cy="140" r="8" fill="#a855f7" opacity="0.9"/>
  <circle cx="440" cy="140" r="8" fill="#a855f7" opacity="0.9"/>
  <circle cx="400" cy="110" r="8" fill="#7c3aed" opacity="0.9"/>
  <circle cx="370" cy="180" r="6" fill="#c084fc" opacity="0.8"/>
  <circle cx="430" cy="180" r="6" fill="#c084fc" opacity="0.8"/>
  <circle cx="400" cy="200" r="6" fill="#7c3aed" opacity="0.8"/>
  <!-- Neural connections -->
  <line x1="360" y1="140" x2="400" y2="110" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
  <line x1="440" y1="140" x2="400" y2="110" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
  <line x1="360" y1="140" x2="370" y2="180" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
  <line x1="440" y1="140" x2="430" y2="180" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
  <line x1="370" y1="180" x2="400" y2="200" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
  <line x1="430" y1="180" x2="400" y2="200" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
  <line x1="360" y1="140" x2="430" y2="180" stroke="#a855f7" stroke-width="0.8" opacity="0.3"/>
  <line x1="440" y1="140" x2="370" y2="180" stroke="#a855f7" stroke-width="0.8" opacity="0.3"/>
  <!-- Code brackets -->
  <text x="240" y="180" font-family="monospace" font-size="60" fill="#7c3aed" opacity="0.6">{</text>
  <text x="520" y="180" font-family="monospace" font-size="60" fill="#7c3aed" opacity="0.6">}</text>
  <!-- Gear icons -->
  <circle cx="180" cy="300" r="25" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  <circle cx="180" cy="300" r="10" fill="#7c3aed" opacity="0.5"/>
  <circle cx="620" cy="300" r="25" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  <circle cx="620" cy="300" r="10" fill="#7c3aed" opacity="0.5"/>
  <!-- Connecting arrows from brain to tools -->
  <line x1="330" y1="230" x2="200" y2="280" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <line x1="470" y1="230" x2="600" y2="280" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <!-- Terminal prompt symbols -->
  <text x="350" y="320" font-family="monospace" font-size="24" fill="#c084fc" opacity="0.6">&gt;_</text>
  <text x="420" y="320" font-family="monospace" font-size="18" fill="#a855f7" opacity="0.4">AI</text>
  <!-- Decorative particles -->
  <circle cx="100" cy="60" r="2" fill="#a855f7" opacity="0.3"/>
  <circle cx="700" cy="80" r="3" fill="#7c3aed" opacity="0.3"/>
  <circle cx="150" cy="350" r="2" fill="#c084fc" opacity="0.3"/>
  <circle cx="650" cy="360" r="2" fill="#a855f7" opacity="0.3"/>
  <circle cx="80" cy="200" r="2" fill="#7c3aed" opacity="0.2"/>
  <circle cx="720" cy="200" r="2" fill="#7c3aed" opacity="0.2"/>
  <!-- Bottom accent -->
  <rect x="250" y="375" width="300" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)"><metadata><type>title</type></metadata><defs><style id="palette-vars">:root, svg { --bg: #ffffff; --surface: #f5f5f5; --border: #e0e0e0; --text: #212121; --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e; --black: #000000; --primary-fill: #2196f3; --primary-border: #1565c0; --primary-text: #ffffff; --primary-accent: #0d47a1; --ok-fill: #4caf50; --ok-border: #2e7d32; --ok-text: #ffffff; --ok-accent: #1b5e20; --warn-fill: #ff9800; --warn-border: #e65100; --warn-text: #ffffff; --warn-accent: #bf360c; --danger-fill: #e74c3c; --danger-border: #c62828; --danger-text: #ffffff; --danger-accent: #b71c1c; --info-fill: #9c27b0; --info-border: #6a1b9a; --info-text: #ffffff; --info-accent: #4a148c; }</style></defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Prompt Engineering</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="340" y="196" width="600" height="44" rx="10" fill="var(--info-fill)"/>
  <text x="640" y="224" font-size="18" fill="var(--info-text)"><tspan font-weight="bold">System:</tspan> role, rules, output format</text>
  <rect x="600" y="254" width="460" height="44" rx="22" fill="var(--primary-fill)"/>
  <text x="830" y="282" font-size="18" fill="var(--primary-text)"><tspan font-weight="bold">User:</tspan> examples + the task</text>
  <rect x="220" y="312" width="460" height="44" rx="22" fill="var(--ok-fill)"/>
  <text x="450" y="340" font-size="18" fill="var(--ok-text)"><tspan font-weight="bold">Assistant:</tspan> think step by step...</text>
  <rect x="600" y="370" width="460" height="44" rx="22" fill="var(--warn-fill)"/>
  <text x="830" y="398" font-size="18" fill="var(--warn-text)"><tspan font-weight="bold">Tool:</tspan> search(query)</text>
  <rect x="220" y="428" width="460" height="44" rx="22" fill="var(--ok-accent)"/>
  <text x="450" y="456" font-size="18" font-family="Courier New, monospace" fill="var(--ok-text)">{"answer": "42", "valid": true}</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">prompt patterns &#8226; chain of thought &#8226; structured output &#8226; tool use &#8226; agents</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

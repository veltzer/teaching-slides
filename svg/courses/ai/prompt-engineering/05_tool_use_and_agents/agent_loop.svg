<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.672576485512" font-weight="bold" fill="var(--text)">Tool-Using Agent Loop</text>
  <rect x="40" y="93.538461538462" width="284.745762711864" height="446.153846153846" rx="9.525920173397" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.372881355932" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.146656312115" font-weight="bold" fill="var(--info-text)">Plan</text>
  <text x="60.338983050847" y="164.923076923077" font-family="Arial, sans-serif" font-size="12.383696225416" fill="var(--info-text)">Read user goal</text>
  <text x="60.338983050847" y="191.692307692308" font-family="Arial, sans-serif" font-size="12.383696225416" fill="var(--info-text)">Pick next step</text>
  <text x="60.338983050847" y="218.461538461538" font-family="Arial, sans-serif" font-size="12.383696225416" fill="var(--info-text)">Tool or finish</text>
  <path d="M 329.830508474576 316.615384615385 L 380.677966101695 316.615384615385" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="385.762711864407" y="93.538461538462" width="284.745762711864" height="446.153846153846" rx="9.525920173397" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="528.135593220339" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.146656312115" font-weight="bold" fill="var(--primary-text)">Call Tool</text>
  <text x="406.101694915254" y="164.923076923077" font-family="Arial, sans-serif" font-size="12.383696225416" fill="var(--primary-text)">Validate args</text>
  <text x="406.101694915254" y="191.692307692308" font-family="Arial, sans-serif" font-size="12.383696225416" fill="var(--primary-text)">Run function</text>
  <text x="406.101694915254" y="218.461538461538" font-family="Arial, sans-serif" font-size="12.383696225416" fill="var(--primary-text)">Capture result</text>
  <path d="M 675.593220338983 316.615384615385 L 726.440677966102 316.615384615385" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="731.525423728814" y="93.538461538462" width="284.745762711864" height="446.153846153846" rx="9.525920173397" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="873.898305084746" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.146656312115" font-weight="bold" fill="var(--warn-text)">Reflect</text>
  <text x="751.864406779661" y="164.923076923077" font-family="Arial, sans-serif" font-size="12.383696225416" fill="var(--warn-text)">Inspect output</text>
  <text x="751.864406779661" y="191.692307692308" font-family="Arial, sans-serif" font-size="12.383696225416" fill="var(--warn-text)">Update beliefs</text>
  <text x="751.864406779661" y="218.461538461538" font-family="Arial, sans-serif" font-size="12.383696225416" fill="var(--warn-text)">Decide finish or loop</text>
  <path d="M 1021.35593220339 316.615384615385 L 1072.203389830509 316.615384615385" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1077.28813559322" y="93.538461538462" width="162.71186440678" height="446.153846153846" rx="9.525920173397" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1158.64406779661" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.146656312115" font-weight="bold" fill="var(--ok-text)">Reply</text>
  <text x="1092.542372881356" y="164.923076923077" font-family="Arial, sans-serif" font-size="12.383696225416" fill="var(--ok-text)">Final answer</text>
  <text x="1092.542372881356" y="191.692307692308" font-family="Arial, sans-serif" font-size="12.383696225416" fill="var(--ok-text)">Done state</text>
  <path d="M 873.898305084746 539.692307692308 Q 182.372881355932 575.384615384615 182.372881355932 539.692307692308" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="528.135593220339" y="620" font-family="Arial, sans-serif" font-size="13.336288242756" fill="var(--text-muted)">If not done, loop back to plan</text>
</svg>

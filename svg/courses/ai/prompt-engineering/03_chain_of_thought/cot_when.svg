<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">When To Use Chain Of Thought</text>
  <rect x="80" y="80" width="520" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Helps</text>
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Multi-step math or logic</text>
  <text x="100" y="210" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Comparing several options</text>
  <text x="100" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Following long chains of rules</text>
  <text x="100" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Code reasoning and tracing</text>
  <text x="100" y="330" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Debugging hidden assumptions</text>
  <text x="100" y="370" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Explainability requirements</text>
  <rect x="680" y="80" width="520" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Hurts or Wastes</text>
  <text x="700" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Single-fact lookups</text>
  <text x="700" y="210" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Pure classification or extraction</text>
  <text x="700" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Latency-sensitive paths</text>
  <text x="700" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Token-cost-sensitive flows</text>
  <text x="700" y="330" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Already-strong base prompts</text>
  <text x="700" y="370" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">When output schema is rigid</text>
</svg>

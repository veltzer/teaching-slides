<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="359.999976666666" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.483314877483" filter="url(#shadow)"/>
  <text x="219.999988333333" y="100.416666666666" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">default</text>
  <rect x="71.527650875768" y="153.770666666666" width="96.94393602622" height="110.793066666666" rx="17.46106804746" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="119.999968888888" y="221.25" text-anchor="middle" fill="var(--bg)" font-size="22.80028849063" font-family="Arial, sans-serif">Pod</text>
  <rect x="211.527654764657" y="153.770666666666" width="96.94393602622" height="110.793066666666" rx="17.46106804746" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="259.999972777777" y="221.25" text-anchor="middle" fill="var(--bg)" font-size="22.80028849063" font-family="Arial, sans-serif">Pod</text>
  <rect x="79.999984444444" y="330" width="160.000054444446" height="96.666666666666" fill="url(#grad-ok)" rx="7.483314877483" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="159.999953333332" y="390.416666666666" text-anchor="middle" fill="var(--bg)" font-size="22.80028849063" font-family="Arial, sans-serif">Service</text>
  <rect x="79.999984444444" y="475" width="160.000054444446" height="96.666666666666" fill="url(#grad-warn)" rx="7.483314877483" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="159.999953333332" y="535.416666666666" text-anchor="middle" font-size="22.80028849063" font-family="Arial, sans-serif" fill="var(--warn-text)">ConfigMap</text>
  <rect x="460.000011666667" y="40" width="359.999976666666" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.483314877483" filter="url(#shadow)"/>
  <text x="640" y="100.416666666666" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">kube-system</text>
  <rect x="491.527662542435" y="153.770666666666" width="96.94393602622" height="110.793066666666" rx="17.46106804746" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="539.999980555555" y="221.25" text-anchor="middle" fill="var(--bg)" font-size="22.80028849063" font-family="Arial, sans-serif">DNS</text>
  <rect x="631.527666431324" y="153.770666666666" width="96.94393602622" height="110.793066666666" rx="17.46106804746" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="679.999984444444" y="221.25" text-anchor="middle" fill="var(--bg)" font-size="22.80028849063" font-family="Arial, sans-serif">Proxy</text>
  <rect x="499.999996111111" y="330" width="160.000054444446" height="96.666666666666" fill="url(#grad-primary)" rx="7.483314877483" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="579.999964999999" y="390.416666666666" text-anchor="middle" fill="var(--bg)" font-size="22.80028849063" font-family="Arial, sans-serif">Controller</text>
  <rect x="880.000023333334" y="40" width="359.999976666666" height="580" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.483314877483" filter="url(#shadow)"/>
  <text x="1060.000011666667" y="100.416666666666" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">production</text>
  <rect x="911.527674209102" y="153.770666666666" width="96.94393602622" height="110.793066666666" rx="17.46106804746" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="959.999992222222" y="221.25" text-anchor="middle" fill="var(--bg)" font-size="22.80028849063" font-family="Arial, sans-serif">App</text>
  <rect x="1051.527678097991" y="153.770666666666" width="96.94393602622" height="110.793066666666" rx="17.46106804746" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="1099.999996111111" y="221.25" text-anchor="middle" fill="var(--bg)" font-size="22.80028849063" font-family="Arial, sans-serif">App</text>
  <rect x="920.000007777778" y="330" width="160.000054444446" height="96.666666666666" fill="url(#grad-danger)" rx="7.483314877483" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.999976666666" y="390.416666666666" text-anchor="middle" fill="var(--bg)" font-size="22.80028849063" font-family="Arial, sans-serif">Service</text>
</svg>

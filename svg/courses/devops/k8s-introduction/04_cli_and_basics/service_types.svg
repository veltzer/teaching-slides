<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="276.92312662722" height="580" fill="url(#grad-primary)" rx="7.875961530254" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="178.461509467455" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">ClusterIP</text>
  <text x="178.461509467455" y="199.499999999999" text-anchor="middle" fill="var(--bg)" font-size="23.996610856403" font-family="Arial, sans-serif">Internal only</text>
  <rect x="142.667062854706" y="276.819199999999" width="71.589539379353" height="106.361599999999" rx="18.377243570592" fill="var(--bg)"/>
  <text x="178.461509467455" y="344.5" text-anchor="middle" font-size="21.815100778547" font-family="Arial, sans-serif" fill="var(--primary-text)">Pod</text>
  <rect x="142.667062854706" y="421.819199999999" width="71.589539379353" height="106.361599999999" rx="18.377243570592" fill="var(--bg)"/>
  <text x="178.461509467455" y="489.499999999998" text-anchor="middle" font-size="21.815100778547" font-family="Arial, sans-serif" fill="var(--primary-text)">Pod</text>
  <rect x="363.076927218935" y="40" width="276.92312662722" height="580" fill="url(#grad-ok)" rx="7.875961530254" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.53843668639" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">NodePort</text>
  <text x="501.53843668639" y="199.499999999999" text-anchor="middle" fill="var(--bg)" font-size="23.996610856403" font-family="Arial, sans-serif">Node IP:Port</text>
  <rect x="399.999989230769" y="271.999999999999" width="203.076894911242" height="87" fill="var(--bg)" rx="7.875961530254"/>
  <text x="501.53843668639" y="329.999999999999" text-anchor="middle" font-size="21.815100778547" font-family="Arial, sans-serif" fill="var(--ok-text)">30000-32767</text>
  <rect x="686.15385443787" y="40" width="276.92312662722" height="580" fill="url(#grad-warn)" rx="7.875961530254" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="824.615363905325" y="127" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">LoadBalancer</text>
  <text x="824.615363905325" y="199.499999999999" text-anchor="middle" font-size="23.996610856403" font-family="Arial, sans-serif" fill="var(--warn-text)">External LB</text>
  <rect x="723.076916449704" y="271.999999999999" width="203.076894911242" height="87" fill="var(--bg)" rx="7.875961530254"/>
  <text x="824.615363905325" y="329.999999999999" text-anchor="middle" font-size="21.815100778547" font-family="Arial, sans-serif" fill="var(--warn-text)">Cloud Provider</text>
  <rect x="1009.230781656805" y="40" width="230.769218343195" height="580" fill="url(#grad-danger)" rx="7.875961530254" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1123.692306201184" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">ExternalName</text>
  <text x="1123.692306201184" y="199.499999999999" text-anchor="middle" fill="var(--bg)" font-size="23.996610856403" font-family="Arial, sans-serif">DNS CNAME</text>
  <rect x="1027.692258816567" y="271.999999999999" width="193.846156331361" height="87" fill="var(--bg)" rx="7.875961530254"/>
  <text x="1123.692306201184" y="329.999999999999" text-anchor="middle" font-size="21.815100778547" font-family="Arial, sans-serif" fill="var(--danger-text)">External DNS</text>
</svg>

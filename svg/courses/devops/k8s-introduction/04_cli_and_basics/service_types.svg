<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Kubernetes Service Types</text>
  <rect x="160" y="180" width="240" height="360" fill="#4285f4" rx="8" />
  <text x="280" y="234" text-anchor="middle" fill="white" font-weight="bold">ClusterIP</text>
  <text x="280" y="279" text-anchor="middle" fill="white" font-size="17.6">Internal only</text>
  <circle cx="280" cy="360" r="32" fill="white" />
  <text x="280" y="369" text-anchor="middle" font-size="16">Pod</text>
  <circle cx="280" cy="450" r="32" fill="white" />
  <text x="280" y="459" text-anchor="middle" font-size="16">Pod</text>
  <rect x="440" y="180" width="240" height="360" fill="#34a853" rx="8" />
  <text x="560" y="234" text-anchor="middle" fill="white" font-weight="bold">NodePort</text>
  <text x="560" y="279" text-anchor="middle" fill="white" font-size="17.6">Node IP:Port</text>
  <rect x="472" y="324" width="176" height="54" fill="white" rx="4.8" />
  <text x="560" y="360" text-anchor="middle" font-size="16">30000-32767</text>
  <rect x="720" y="180" width="240" height="360" fill="#fbbc04" rx="8" />
  <text x="840" y="234" text-anchor="middle" font-weight="bold">LoadBalancer</text>
  <text x="840" y="279" text-anchor="middle" font-size="17.6">External LB</text>
  <rect x="752" y="324" width="176" height="54" fill="white" rx="4.8" />
  <text x="840" y="360" text-anchor="middle" font-size="16">Cloud Provider</text>
  <rect x="1000" y="180" width="200" height="360" fill="#ea4335" rx="8" />
  <text x="1099.2" y="234" text-anchor="middle" fill="white" font-weight="bold">ExternalName</text>
  <text x="1099.2" y="279" text-anchor="middle" fill="white" font-size="17.6">DNS CNAME</text>
  <rect x="1016" y="324" width="168" height="54" fill="white" rx="4.8" />
  <text x="1099.2" y="360" text-anchor="middle" font-size="16">External DNS</text>
</svg>
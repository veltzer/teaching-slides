  <rect x="222.2222" y="124.4444" width="151.1111" height="71.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="297.7778" y="147.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">Authn</text>
  <text x="297.7778" y="165.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--primary-accent)">Authentication</text>
  <text x="297.7778" y="182.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">certs / tokens / OIDC</text>
  <line x1="373.3333" y1="160" x2="417.7778" y2="160" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="417.7778" y="124.4444" width="151.1111" height="71.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="493.3333" y="147.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--ok-accent)">Authz</text>
  <text x="493.3333" y="165.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--ok-accent)">Authorization (RBAC)</text>
  <text x="493.3333" y="182.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Role / ClusterRole</text>
  <line x1="568.8889" y1="160" x2="613.3333" y2="160" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="613.3333" y="124.4444" width="151.1111" height="71.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="688.8889" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-accent)">Admission</text>

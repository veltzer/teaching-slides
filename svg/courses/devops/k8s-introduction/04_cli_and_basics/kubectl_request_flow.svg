  <text x="373.3333" y="346.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">Scheduler</text>
  <text x="373.3333" y="364.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--info-accent)">kube-scheduler</text>
  <text x="373.3333" y="380.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--info-accent)">assigns pods to nodes</text>
  <line x1="808.8889" y1="346.6667" x2="480" y2="355.5556" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />

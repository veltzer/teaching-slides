  <text x="152.5" y="196.2777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">user command</text>
  <text x="152.5" y="210.7777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">kubectl get pods</text>
  <line x1="227.5" y1="185" x2="274.375" y2="185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="250.9375" y="176.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">HTTPS</text>
  <rect x="274.375" y="152.7777" width="159.375" height="64.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="354.0625" y="173.7223" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">Authn</text>
  <text x="354.0625" y="189.8333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">Authentication</text>
  <text x="354.0625" y="205.1389" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">certs / tokens / OIDC</text>
  <line x1="433.75" y1="185" x2="480.625" y2="185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="480.625" y="152.7777" width="159.375" height="64.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="560.3125" y="173.7223" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--ok-accent)">Authz</text>
  <text x="560.3125" y="189.8333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--ok-accent)">Authorization (RBAC)</text>
  <text x="560.3125" y="205.1389" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Role / ClusterRole</text>

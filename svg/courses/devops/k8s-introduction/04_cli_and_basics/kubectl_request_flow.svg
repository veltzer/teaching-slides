  <text x="106.6667" y="172.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-accent)">user command</text>
  <text x="106.6667" y="188.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">kubectl get pods</text>
  <line x1="177.7778" y1="160" x2="222.2222" y2="160" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />

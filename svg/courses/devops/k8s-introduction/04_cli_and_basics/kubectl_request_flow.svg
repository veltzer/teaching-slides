  <rect x="686.875" y="152.7777" width="159.375" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="766.5625" y="170.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)">Admission</text>
  <text x="766.5625" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)">Control</text>
  <text x="766.5625" y="201.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Mutating / Validating</text>

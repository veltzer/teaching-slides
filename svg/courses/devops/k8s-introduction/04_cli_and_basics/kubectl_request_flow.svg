<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Step boxes along the top flow -->

  <!-- 1. kubectl -->
  <rect x="40" y="140" width="160" height="80" rx="10" fill="#fff9c4" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#e65100">kubectl</text>
  <text x="120" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#bf360c">user command</text>
  <text x="120" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bf360c">kubectl get pods</text>

  <!-- Arrow 1→2 -->
  <line x1="200" y1="180" x2="250" y2="180" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="225" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">HTTPS</text>

  <!-- 2. Authentication -->
  <rect x="250" y="140" width="170" height="80" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#1565c0">Authn</text>
  <text x="335" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#1565c0">Authentication</text>
  <text x="335" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">certs / tokens / OIDC</text>

  <!-- Arrow 2→3 -->
  <line x1="420" y1="180" x2="470" y2="180" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3. Authorization (RBAC) -->
  <rect x="470" y="140" width="170" height="80" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="555" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#388e3c">Authz</text>
  <text x="555" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#388e3c">Authorization (RBAC)</text>
  <text x="555" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">Role / ClusterRole</text>

  <!-- Arrow 3→4 -->
  <line x1="640" y1="180" x2="690" y2="180" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 4. Admission Control -->
  <rect x="690" y="140" width="170" height="80" rx="10" fill="#fff3e0" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="775" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#e65100">Admission</text>
  <text x="775" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#e65100">Control</text>
  <text x="775" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">Mutating / Validating</text>
  <text x="775" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">webhooks</text>

  <!-- Arrow 4→5 -->
  <line x1="860" y1="180" x2="910" y2="180" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 5. API Server processes -->
  <rect x="910" y="100" width="200" height="160" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1010" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">API Server</text>
  <text x="1010" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#bbdefb">validates &amp; persists</text>
  <text x="1010" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#bbdefb">object to etcd</text>
  <text x="1010" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#bbdefb">notifies watchers</text>
  <text x="1010" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#bbdefb">via watch/list</text>
  <text x="1010" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#e3f2fd">kube-apiserver</text>

  <!-- Arrow down to etcd -->
  <line x1="1010" y1="260" x2="1010" y2="330" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1035" y="300" font-family="Arial,sans-serif" font-size="12" fill="#555">persist</text>

  <!-- etcd -->
  <rect x="910" y="330" width="200" height="80" rx="10" fill="#546e7a" filter="url(#shadow)"/>
  <text x="1010" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">etcd</text>
  <text x="1010" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#cfd8dc">cluster state store</text>

  <!-- Controllers watch API server -->
  <rect x="600" y="360" width="240" height="80" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#6a1b9a">Controllers</text>
  <text x="720" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#7b1fa2">Deployment, ReplicaSet</text>
  <text x="720" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#9c27b0">reconcile desired state</text>

  <!-- Arrow: API server → Controllers (watch) -->
  <line x1="910" y1="370" x2="840" y2="400" stroke="#8e24aa" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="870" y="358" font-family="Arial,sans-serif" font-size="11" fill="#8e24aa">watch</text>

  <!-- Scheduler -->
  <rect x="300" y="360" width="240" height="80" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#283593">Scheduler</text>
  <text x="420" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#3f51b5">kube-scheduler</text>
  <text x="420" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#5c6bc0">assigns pods to nodes</text>

  <!-- Arrow: API server → Scheduler (watch) -->
  <line x1="910" y1="390" x2="540" y2="400" stroke="#3949ab" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- kubelet -->
  <rect x="40" y="360" width="200" height="80" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">kubelet</text>
  <text x="140" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#388e3c">on each worker node</text>
  <text x="140" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">starts / stops pods</text>

  <!-- Arrow: API server → kubelet -->
  <line x1="910" y1="410" x2="240" y2="410" stroke="#388e3c" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Response back -->
  <line x1="910" y1="160" x2="420" y2="260" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
  <text x="660" y="250" font-family="Arial,sans-serif" font-size="12" fill="#1565c0">JSON response</text>

  <!-- Step numbers -->
  <circle cx="56" cy="140" r="14" fill="#f9a825"/>
  <text x="56" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fff">1</text>
  <circle cx="266" cy="140" r="14" fill="#1565c0"/>
  <text x="266" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fff">2</text>
  <circle cx="486" cy="140" r="14" fill="#388e3c"/>
  <text x="486" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fff">3</text>
  <circle cx="706" cy="140" r="14" fill="#f57c00"/>
  <text x="706" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fff">4</text>
  <circle cx="926" cy="100" r="14" fill="#1565c0"/>
  <text x="926" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fff">5</text>

  <!-- Legend -->
  <line x1="40" y1="560" x2="100" y2="560" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="110" y="565" font-family="Arial,sans-serif" font-size="13" fill="#333">request / response path</text>
  <line x1="300" y1="560" x2="360" y2="560" stroke="#8e24aa" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="370" y="565" font-family="Arial,sans-serif" font-size="13" fill="#333">watch / notify (async)</text>
</svg>

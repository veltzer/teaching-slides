  <text x="433.75" y="354.1667" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">Scheduler</text>
  <text x="433.75" y="370.2777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--info-accent)">kube-scheduler</text>
  <text x="433.75" y="384.7777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--info-accent)">assigns pods to nodes</text>
  <line x1="893.125" y1="354.1667" x2="546.25" y2="362.2223" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <rect x="77.5" y="330" width="187.5" height="64.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />

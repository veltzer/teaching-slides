<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="276.92312662722" height="244.21052631579" fill="url(#grad-primary)" rx="8.080566031896" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="178.461509467455" y="131.578947368421" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Basic</text>
  <text x="178.461509467455" y="192.631578947369" text-anchor="middle" fill="var(--bg)" font-size="24.620003262081" font-family="Arial, sans-serif">get, create</text>
  <text x="178.461509467455" y="238.421052631579" text-anchor="middle" fill="var(--bg)" font-size="24.620003262081" font-family="Arial, sans-serif">delete, edit</text>
  <rect x="353.846188639054" y="40" width="276.92312662722" height="244.21052631579" fill="url(#grad-ok)" rx="8.080566031896" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492.307698106509" y="131.578947368421" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Debugging</text>
  <text x="492.307698106509" y="192.631578947369" text-anchor="middle" fill="var(--bg)" font-size="24.620003262081" font-family="Arial, sans-serif">describe, logs</text>
  <text x="492.307698106509" y="238.421052631579" text-anchor="middle" fill="var(--bg)" font-size="24.620003262081" font-family="Arial, sans-serif">exec, port-forward</text>
  <rect x="667.692269585798" y="40" width="276.92312662722" height="244.21052631579" fill="url(#grad-warn)" rx="8.080566031896" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="806.153886745563" y="131.578947368421" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Deployment</text>
  <text x="806.153886745563" y="192.631578947369" text-anchor="middle" font-size="24.620003262081" font-family="Arial, sans-serif" fill="var(--warn-text)">apply, rollout</text>
  <text x="806.153886745563" y="238.421052631579" text-anchor="middle" font-size="24.620003262081" font-family="Arial, sans-serif" fill="var(--warn-text)">scale, autoscale</text>
  <rect x="981.538458224852" y="40" width="258.461541775148" height="244.21052631579" fill="url(#grad-danger)" rx="8.080566031896" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.769229112426" y="131.578947368421" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Cluster</text>
  <text x="1110.769229112426" y="192.631578947369" text-anchor="middle" fill="var(--bg)" font-size="24.620003262081" font-family="Arial, sans-serif">cluster-info</text>
  <text x="1110.769229112426" y="238.421052631579" text-anchor="middle" fill="var(--bg)" font-size="24.620003262081" font-family="Arial, sans-serif">top, version</text>
  <rect x="40" y="375.78947368421" width="276.92312662722" height="244.21052631579" fill="url(#grad-info)" rx="8.080566031896" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="178.461509467455" y="467.368421052631" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Config</text>
  <text x="178.461509467455" y="528.421052631577" text-anchor="middle" fill="var(--bg)" font-size="24.620003262081" font-family="Arial, sans-serif">config, label</text>
  <text x="178.461509467455" y="574.210526315788" text-anchor="middle" fill="var(--bg)" font-size="24.620003262081" font-family="Arial, sans-serif">annotate, patch</text>
  <rect x="353.846188639054" y="375.78947368421" width="276.92312662722" height="244.21052631579" fill="var(--text-muted)" rx="8.080566031896"/>
  <text x="492.307698106509" y="467.368421052631" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Advanced</text>
  <text x="492.307698106509" y="528.421052631577" text-anchor="middle" fill="var(--bg)" font-size="24.620003262081" font-family="Arial, sans-serif">proxy, cp</text>
  <text x="492.307698106509" y="574.210526315788" text-anchor="middle" fill="var(--bg)" font-size="24.620003262081" font-family="Arial, sans-serif">auth, plugin</text>
</svg>

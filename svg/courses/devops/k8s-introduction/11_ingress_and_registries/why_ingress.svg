<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Service vs Ingress</text>
  <g id="services">
    <text x="320" y="144" text-anchor="middle" font-size="19.2">Without Ingress</text>
    <rect x="160" y="180" width="320" height="72" fill="#4285f4" rx="4.8" />
    <text x="320" y="225" text-anchor="middle" fill="white">LoadBalancer Service 1</text>
    <rect x="160" y="270" width="320" height="72" fill="#4285f4" rx="4.8" />
    <text x="320" y="315" text-anchor="middle" fill="white">LoadBalancer Service 2</text>
    <rect x="160" y="360" width="320" height="72" fill="#4285f4" rx="4.8" />
    <text x="320" y="405" text-anchor="middle" fill="white">LoadBalancer Service 3</text>
    <text x="320" y="486" text-anchor="middle" font-size="17.6">Multiple Load Balancers</text>
    <text x="320" y="522" text-anchor="middle" font-size="17.6">Higher cost</text>
  </g>
  <g id="ingress">
    <text x="880" y="144" text-anchor="middle" font-size="19.2">With Ingress</text>
    <rect x="720" y="180" width="320" height="72" fill="#34a853" rx="4.8" />
    <text x="880" y="225" text-anchor="middle" fill="white">Single Ingress</text>
    <rect x="720" y="288" width="96" height="54" fill="#fbbc04" rx="4.8" />
    <text x="768" y="324" text-anchor="middle" font-size="16">Svc 1</text>
    <rect x="832" y="288" width="96" height="54" fill="#fbbc04" rx="4.8" />
    <text x="880" y="324" text-anchor="middle" font-size="16">Svc 2</text>
    <rect x="944" y="288" width="96" height="54" fill="#fbbc04" rx="4.8" />
    <text x="992" y="324" text-anchor="middle" font-size="16">Svc 3</text>
    <text x="880" y="486" text-anchor="middle" font-size="17.6">Single entry point</text>
    <text x="880" y="522" text-anchor="middle" font-size="17.6">Cost effective</text>
  </g>
</svg>
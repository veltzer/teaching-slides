<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <g id="services">
    <text x="258.181864462812" y="40" text-anchor="middle" font-size="27.772767648746" font-family="Arial, sans-serif" fill="var(--text)">Without Ingress</text>
    <rect x="40" y="95.238095238096" width="436.363601652891" height="110.47619047619" fill="url(#grad-primary)" rx="8.355727675777" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="258.181864462812" y="164.285714285714" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">LoadBalancer Service 1</text>
    <rect x="40" y="233.333333333333" width="436.363601652891" height="110.47619047619" fill="url(#grad-primary)" rx="8.355727675777" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="258.181864462812" y="302.380952380953" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">LoadBalancer Service 2</text>
    <rect x="40" y="371.428571428571" width="436.363601652891" height="110.47619047619" fill="url(#grad-primary)" rx="8.355727675777" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="258.181864462812" y="440.47619047619" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">LoadBalancer Service 3</text>
    <text x="258.181864462812" y="564.761904761904" text-anchor="middle" font-size="25.458370344684" font-family="Arial, sans-serif" fill="var(--text)">Multiple Load Balancers</text>
    <text x="258.181864462812" y="620" text-anchor="middle" font-size="25.458370344684" font-family="Arial, sans-serif" fill="var(--text)">Higher cost</text>
  </g>
  <g id="ingress">
    <text x="1021.818262809921" y="40" text-anchor="middle" font-size="27.772767648746" font-family="Arial, sans-serif" fill="var(--text)">With Ingress</text>
    <rect x="803.636398347109" y="95.238095238096" width="436.363601652891" height="110.47619047619" fill="url(#grad-ok)" rx="8.355727675777" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="1021.818262809921" y="164.285714285714" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Single Ingress</text>
    <rect x="803.636398347109" y="260.952380952381" width="130.909042314047" height="82.857142857143" fill="url(#grad-warn)" rx="8.355727675777" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="869.090983140499" y="316.190476190476" text-anchor="middle" font-size="23.143973040621" font-family="Arial, sans-serif" fill="var(--warn-text)">Svc 1</text>
    <rect x="956.363678016531" y="260.952380952381" width="130.909042314047" height="82.857142857143" fill="url(#grad-warn)" rx="8.355727675777" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="1021.818262809921" y="316.190476190476" text-anchor="middle" font-size="23.143973040621" font-family="Arial, sans-serif" fill="var(--warn-text)">Svc 2</text>
    <rect x="1109.090957685952" y="260.952380952381" width="130.909042314047" height="82.857142857143" fill="url(#grad-warn)" rx="8.355727675777" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="1174.545542479343" y="316.190476190476" text-anchor="middle" font-size="23.143973040621" font-family="Arial, sans-serif" fill="var(--warn-text)">Svc 3</text>
    <text x="1021.818262809921" y="564.761904761904" text-anchor="middle" font-size="25.458370344684" font-family="Arial, sans-serif" fill="var(--text)">Single entry point</text>
    <text x="1021.818262809921" y="620" text-anchor="middle" font-size="25.458370344684" font-family="Arial, sans-serif" fill="var(--text)">Cost effective</text>
  </g>
</svg>

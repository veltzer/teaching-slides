  <line x1="1052.5" y1="404.1111" x2="1052.5" y2="412.1667" stroke="var(--warn-border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="958.75" y="450.8333" width="187.5" height="51.5556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />

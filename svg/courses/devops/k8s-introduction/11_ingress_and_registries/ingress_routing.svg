  <rect x="282.105263" y="233.333375" width="231.578947" height="183.157881" rx="7.1455" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="397.894737" y="263.859731" text-anchor="middle" font-size="16.558981" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Ingress Controller</text>

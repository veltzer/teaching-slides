  <text x="397.894737" y="310.666801" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.419355" fill="var(--primary-accent)">TLS termination</text>
  <text x="397.894737" y="331.017663" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.419355" fill="var(--primary-accent)">Host matching</text>

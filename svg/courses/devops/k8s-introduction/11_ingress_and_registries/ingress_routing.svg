  <rect x="565" y="106.0556" width="318.75" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="724.375" y="104.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)">Ingress Rules</text>
  <text x="579.0625" y="131.8333" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">host: app.example.com</text>
  <text x="579.0625" y="147.9444" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">  /          → web-svc:80</text>
  <text x="579.0625" y="164.0556" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">  /api       → api-svc:8080</text>
  <text x="579.0625" y="180.1667" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">  /static    → cdn-svc:80</text>

  <rect x="587.368421" y="40" width="357.894737" height="44.77187" rx="7.1455" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="587.368421" y="72.561556" width="357.894737" height="12.210568" fill="var(--primary-fill)" rx="7.1455" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="766.315789" y="70.526356" text-anchor="middle" font-family="Arial,sans-serif" font-size="16.558981" font-weight="bold" fill="var(--bg)">Ingress Rules</text>

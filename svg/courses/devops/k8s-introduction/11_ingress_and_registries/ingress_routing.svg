  <text x="579.0625" y="204.3333" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">host: admin.example.com</text>
  <text x="579.0625" y="220.4444" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">  /          → admin-svc:3000</text>

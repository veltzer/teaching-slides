  <rect x="958.75" y="346.1111" width="187.5" height="58" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1052.5" y="368.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)">cdn-svc</text>

  <text x="396.25" y="275.2223" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">(nginx / traefik)</text>
  <text x="396.25" y="294.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">TLS termination</text>
  <text x="396.25" y="310.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">Host matching</text>
  <text x="396.25" y="326.7777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">Path matching</text>
  <text x="396.25" y="342.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">Header rewriting</text>
  <text x="396.25" y="362.2223" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-accent)">LoadBalancer svc in front</text>

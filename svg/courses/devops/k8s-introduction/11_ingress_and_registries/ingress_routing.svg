  <text x="337.7778" y="280.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--primary-accent)">TLS termination</text>
  <text x="337.7778" y="298.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--primary-accent)">Host matching</text>
  <text x="337.7778" y="316.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--primary-accent)">Path matching</text>

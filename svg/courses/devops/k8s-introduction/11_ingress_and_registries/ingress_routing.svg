  <text x="648.8889" y="71.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)">Ingress Rules</text>
  <text x="511.1111" y="101.3333" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">host: app.example.com</text>

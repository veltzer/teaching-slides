  <rect x="512" y="360" width="320" height="180" fill="#e53935" rx="8" />
  <text x="672" y="414" text-anchor="middle" fill="white" font-weight="bold">Harbor</text>
  <text x="672" y="459" text-anchor="middle" fill="white" font-size="17.6">Open source</text>
  <text x="672" y="495" text-anchor="middle" fill="white" font-size="17.6">RBAC, scanning</text>
  <rect x="864" y="360" width="320" height="180" fill="#ea4335" rx="8" />
  <text x="1024" y="414" text-anchor="middle" fill="white" font-weight="bold">Quay.io</text>

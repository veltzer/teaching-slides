<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="359.999976666666" height="252.173913043478" fill="url(#grad-primary)" rx="7.644264793418" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.999988333333" y="115.652173913044" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">default</text>
  <text x="219.999988333333" y="178.695652173913" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">User workloads</text>
  <text x="219.999988333333" y="229.130434782609" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">No namespace specified</text>
  <rect x="460.000011666667" y="40" width="359.999976666666" height="252.173913043478" fill="url(#grad-ok)" rx="7.644264793418" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="115.652173913044" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">kube-system</text>
  <text x="640" y="178.695652173913" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">System components</text>
  <text x="640" y="229.130434782609" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">DNS, proxy, etc.</text>
  <rect x="880.000023333334" y="40" width="359.999976666666" height="252.173913043478" fill="url(#grad-warn)" rx="7.644264793418" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060.000011666667" y="115.652173913044" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">kube-public</text>
  <text x="1060.000011666667" y="178.695652173913" text-anchor="middle" font-size="23.290673376999" font-family="Arial, sans-serif" fill="var(--warn-text)">Public resources</text>
  <text x="1060.000011666667" y="229.130434782609" text-anchor="middle" font-size="23.290673376999" font-family="Arial, sans-serif" fill="var(--warn-text)">ConfigMaps, etc.</text>
  <rect x="350.000025277779" y="367.826086956522" width="580.000066111113" height="252.173913043478" fill="url(#grad-danger)" rx="7.644264793418" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="443.478260869565" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">kube-node-lease</text>
  <text x="640" y="506.521739130436" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">Node heartbeat data</text>
  <text x="640" y="556.956521739131" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">Improved node failure detection</text>
</svg>

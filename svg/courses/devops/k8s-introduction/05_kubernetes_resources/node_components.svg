<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Node Resource Management</text>
  <rect x="160" y="144" width="960" height="108" fill="#4285f4" rx="8" />
  <text x="640" y="180" text-anchor="middle" fill="white" font-weight="bold">Node Capacity</text>
  <text x="640" y="225" text-anchor="middle" fill="white" font-size="19.2">CPU: 16 cores | Memory: 64GB | Storage: 500GB</text>
  <rect x="160" y="288" width="240" height="108" fill="#34a853" rx="8" />
  <text x="280" y="333" text-anchor="middle" fill="white" font-size="17.6">System Reserved</text>
  <text x="280" y="369" text-anchor="middle" fill="white" font-size="16">CPU: 1 | Mem: 2GB</text>
  <rect x="416" y="288" width="240" height="108" fill="#fbbc04" rx="8" />
  <text x="536" y="333" text-anchor="middle" font-size="17.6">Kubernetes Reserved</text>
  <text x="536" y="369" text-anchor="middle" font-size="16">CPU: 1 | Mem: 2GB</text>
  <rect x="672" y="288" width="240" height="108" fill="#ea4335" rx="8" />
  <text x="792" y="333" text-anchor="middle" fill="white" font-size="17.6">Eviction Threshold</text>
  <text x="792" y="369" text-anchor="middle" fill="white" font-size="16">Memory: 100Mi</text>
  <rect x="928" y="288" width="192" height="108" fill="#9c27b0" rx="8" />
  <text x="1024" y="333" text-anchor="middle" fill="white" font-size="17.6">Allocatable</text>
  <text x="1024" y="369" text-anchor="middle" fill="white" font-size="16">User Pods</text>
  <rect x="160" y="450" width="960" height="108" fill="#e8f5e9" rx="8" />
  <text x="640" y="495" text-anchor="middle" font-weight="bold">Allocatable = Capacity - Reserved - Eviction</text>
  <text x="640" y="531" text-anchor="middle" font-size="19.2">CPU: 14 cores | Memory: 59.9GB available for pods</text>
</svg>
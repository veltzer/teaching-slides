<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="151.304347826087" fill="url(#grad-primary)" rx="7.644264793418" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="90.434782608696" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Node Capacity</text>
  <text x="640" y="153.478260869565" text-anchor="middle" fill="var(--bg)" font-size="25.408007320362" font-family="Arial, sans-serif">CPU: 16 cores | Memory: 64GB | Storage: 500GB</text>
  <rect x="40" y="241.739130434783" width="300.000058333335" height="151.304347826087" fill="url(#grad-ok)" rx="7.644264793418" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="189.999970833332" y="304.782608695652" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">System Reserved</text>
  <text x="189.999970833332" y="355.217391304348" text-anchor="middle" fill="var(--bg)" font-size="21.173339433634" font-family="Arial, sans-serif">CPU: 1 | Mem: 2GB</text>
  <rect x="359.999992222222" y="241.739130434783" width="300.000058333335" height="151.304347826087" fill="url(#grad-warn)" rx="7.644264793418" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="509.999963055555" y="304.782608695652" text-anchor="middle" font-size="23.290673376999" font-family="Arial, sans-serif" fill="var(--warn-text)">Kubernetes Reserved</text>
  <text x="509.999963055555" y="355.217391304348" text-anchor="middle" font-size="21.173339433634" font-family="Arial, sans-serif" fill="var(--warn-text)">CPU: 1 | Mem: 2GB</text>
  <rect x="679.999984444444" y="241.739130434783" width="300.000058333335" height="151.304347826087" fill="url(#grad-danger)" rx="7.644264793418" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="829.999955277776" y="304.782608695652" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">Eviction Threshold</text>
  <text x="829.999955277776" y="355.217391304348" text-anchor="middle" fill="var(--bg)" font-size="21.173339433634" font-family="Arial, sans-serif">Memory: 100Mi</text>
  <rect x="999.999976666666" y="241.739130434783" width="240.000023333334" height="151.304347826087" fill="url(#grad-info)" rx="7.644264793418" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120.000046666668" y="304.782608695652" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">Allocatable</text>
  <text x="1120.000046666668" y="355.217391304348" text-anchor="middle" fill="var(--bg)" font-size="21.173339433634" font-family="Arial, sans-serif">User Pods</text>
  <rect x="40" y="468.695652173913" width="1200" height="151.304347826087" fill="url(#grad-ok)" rx="7.644264793418" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="531.739130434782" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Allocatable = Capacity - Reserved - Eviction</text>
  <text x="640" y="582.173913043478" text-anchor="middle" font-size="25.408007320362" font-family="Arial, sans-serif" fill="var(--ok-text)">CPU: 14 cores | Memory: 59.9GB available for pods</text>
</svg>

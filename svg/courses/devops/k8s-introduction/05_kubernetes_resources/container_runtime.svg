<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="276.92312662722" height="232" fill="var(--primary-accent)" rx="7.875961530254"/>
  <text x="178.461509467455" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Docker</text>
  <text x="178.461509467455" y="199.499999999999" text-anchor="middle" fill="var(--bg)" font-size="23.996610856403" font-family="Arial, sans-serif">Most common</text>
  <rect x="363.076927218935" y="40" width="276.92312662722" height="232" fill="url(#grad-primary)" rx="7.875961530254" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="501.53843668639" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">containerd</text>
  <text x="501.53843668639" y="199.499999999999" text-anchor="middle" fill="var(--bg)" font-size="23.996610856403" font-family="Arial, sans-serif">Industry standard</text>
  <rect x="686.15385443787" y="40" width="276.92312662722" height="232" fill="url(#grad-ok)" rx="7.875961530254" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="824.615363905325" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">CRI-O</text>
  <text x="824.615363905325" y="199.499999999999" text-anchor="middle" fill="var(--bg)" font-size="23.996610856403" font-family="Arial, sans-serif">OCI compatible</text>
  <rect x="1009.230781656805" y="40" width="230.769218343195" height="232" fill="url(#grad-warn)" rx="7.875961530254" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1123.692306201184" y="127" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">rkt</text>
  <text x="1123.692306201184" y="199.499999999999" text-anchor="middle" font-size="23.996610856403" font-family="Arial, sans-serif" fill="var(--warn-text)">CoreOS</text>
  <rect x="224.61541775148" y="388" width="738.46156331361" height="232" fill="url(#grad-ok)" rx="7.875961530254" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="593.84614556213" y="475" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Container Runtime Interface (CRI)</text>
  <text x="593.84614556213" y="547.499999999999" text-anchor="middle" font-size="26.178120934257" font-family="Arial, sans-serif" fill="var(--ok-text)">Standard interface for container runtimes</text>
</svg>

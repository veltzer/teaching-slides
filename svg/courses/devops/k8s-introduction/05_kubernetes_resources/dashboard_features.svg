  <text x="280" y="414" text-anchor="middle" fill="white" font-size="17.6">PVCs</text>
  <text x="280" y="441" text-anchor="middle" fill="white" font-size="17.6">Storage Classes</text>
  <rect x="432" y="324" width="240" height="144" fill="#777777" rx="8" />

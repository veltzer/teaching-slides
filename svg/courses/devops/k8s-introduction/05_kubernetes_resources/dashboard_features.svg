  <text x="552" y="414" text-anchor="middle" fill="white" font-size="17.6">Pod logs</text>
  <text x="552" y="441" text-anchor="middle" fill="white" font-size="17.6">Container logs</text>
  <rect x="704" y="324" width="240" height="144" fill="#f44336" rx="8" />

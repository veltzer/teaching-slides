<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="1120" height="540" fill="#f9f9f9" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">QoS Classes</text>
  <rect x="160" y="144" width="320" height="270" fill="#4285f4" rx="8" />
  <text x="320" y="198" text-anchor="middle" fill="white" font-weight="bold">Guaranteed</text>
  <text x="320" y="243" text-anchor="middle" fill="white" font-size="17.6">Requests = Limits</text>
  <text x="320" y="279" text-anchor="middle" fill="white" font-size="17.6">For all containers</text>
  <text x="320" y="315" text-anchor="middle" fill="white" font-size="17.6">CPU &amp; Memory set</text>
  <text x="320" y="360" text-anchor="middle" fill="white" font-size="16">Highest priority</text>
  <text x="320" y="387" text-anchor="middle" fill="white" font-size="16">Last to be killed</text>
  <rect x="512" y="144" width="320" height="270" fill="#fbbc04" rx="8" />
  <text x="672" y="198" text-anchor="middle" font-weight="bold">Burstable</text>
  <text x="672" y="243" text-anchor="middle" font-size="17.6">At least one request</text>
  <text x="672" y="279" text-anchor="middle" font-size="17.6">or limit set</text>
  <text x="672" y="315" text-anchor="middle" font-size="17.6">Not Guaranteed</text>
  <text x="672" y="360" text-anchor="middle" font-size="16">Medium priority</text>
  <text x="672" y="387" text-anchor="middle" font-size="16">Killed after BestEffort</text>
  <rect x="864" y="144" width="320" height="270" fill="#ea4335" rx="8" />
  <text x="1024" y="198" text-anchor="middle" fill="white" font-weight="bold">BestEffort</text>
  <text x="1024" y="243" text-anchor="middle" fill="white" font-size="17.6">No requests</text>
  <text x="1024" y="279" text-anchor="middle" fill="white" font-size="17.6">No limits</text>
  <text x="1024" y="315" text-anchor="middle" fill="white" font-size="17.6">Uses available resources</text>
  <text x="1024" y="360" text-anchor="middle" fill="white" font-size="16">Lowest priority</text>
  <text x="1024" y="387" text-anchor="middle" fill="white" font-size="16">First to be killed</text>
</svg>
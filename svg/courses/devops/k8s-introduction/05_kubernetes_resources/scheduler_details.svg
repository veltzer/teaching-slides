<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Scheduler Decision Process</text>
  <rect x="80" y="108" width="240" height="108" fill="#4285f4" rx="8" />
  <text x="200" y="171" text-anchor="middle" fill="white">1. Filter Nodes</text>
  <rect x="400" y="108" width="240" height="108" fill="#4285f4" rx="8" />
  <text x="520" y="171" text-anchor="middle" fill="white">2. Score Nodes</text>
  <rect x="720" y="108" width="240" height="108" fill="#4285f4" rx="8" />
  <text x="840" y="171" text-anchor="middle" fill="white">3. Select Best</text>
  <rect x="1040" y="108" width="192" height="108" fill="#34a853" rx="8" />
  <text x="1136" y="171" text-anchor="middle" fill="white">4. Bind Pod</text>
  <rect x="160" y="288" width="960" height="324" fill="#f0f0f0" rx="8" />
  <text x="640" y="333" text-anchor="middle" font-weight="bold">Scheduling Factors</text>
  <text x="320" y="378" text-anchor="start" font-size="19.2">• Resource requirements</text>
  <text x="320" y="423" text-anchor="start" font-size="19.2">• Hardware/software constraints</text>
  <text x="320" y="468" text-anchor="start" font-size="19.2">• Affinity and anti-affinity</text>
  <text x="320" y="513" text-anchor="start" font-size="19.2">• Data locality</text>
  <text x="320" y="558" text-anchor="start" font-size="19.2">• Workload interference</text>
  <text x="720" y="378" text-anchor="start" font-size="19.2">• Taints and tolerations</text>
  <text x="720" y="423" text-anchor="start" font-size="19.2">• Pod priority and preemption</text>
  <text x="720" y="468" text-anchor="start" font-size="19.2">• Node selectors</text>
  <text x="720" y="513" text-anchor="start" font-size="19.2">• Resource utilization</text>
  <text x="720" y="558" text-anchor="start" font-size="19.2">• Custom schedulers</text>
</svg>
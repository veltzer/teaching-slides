<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Scheduler Decision Process</text>
  <rect x="80" y="108" width="240" height="108" fill="#4285f4" rx="8" />
  <text x="200" y="171" text-anchor="middle" fill="white">1. Filter Nodes</text>
  <rect x="400" y="108" width="240" height="108" fill="#4285f4" rx="8" />
  <text x="520" y="171" text-anchor="middle" fill="white">2. Score Nodes</text>
  <rect x="720" y="108" width="240" height="108" fill="#4285f4" rx="8" />
  <text x="840" y="171" text-anchor="middle" fill="white">3. Select Best</text>
  <rect x="1040" y="108" width="192" height="108" fill="#34a853" rx="8" />
  <text x="1136" y="171" text-anchor="middle" fill="white">4. Bind Pod</text>
  <rect x="160" y="288" width="960" height="324" fill="#f0f0f0" rx="8" />
  <text x="640" y="333" text-anchor="middle" font-weight="bold">Scheduling Factors</text>
  <text x="320" y="378" text-anchor="start" font-size="19.2">• Resource requirements</text>
  <text x="320" y="423" text-anchor="start" font-size="19.2">• Hardware/software constraints</text>
  <text x="320" y="468" text-anchor="start" font-size="19.2">• Affinity and anti-affinity</text>
  <text x="320" y="513" text-anchor="start" font-size="19.2">• Data locality</text>
  <text x="320" y="558" text-anchor="start" font-size="19.2">• Workload interference</text>
  <text x="720" y="378" text-anchor="start" font-size="19.2">• Taints and tolerations</text>
  <text x="720" y="423" text-anchor="start" font-size="19.2">• Pod priority and preemption</text>
  <text x="720" y="468" text-anchor="start" font-size="19.2">• Node selectors</text>
  <text x="720" y="513" text-anchor="start" font-size="19.2">• Resource utilization</text>
  <text x="720" y="558" text-anchor="start" font-size="19.2">• Custom schedulers</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="623.3333" y="40" text-anchor="middle" font-size="26.638" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Scheduler Decision Process</text>
  <rect x="40" y="96.129" width="250" height="112.2581" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="161.6129" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">1. Filter Nodes</text>
  <rect x="373.3333" y="96.129" width="250" height="112.2581" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="498.3333" y="161.6129" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">2. Score Nodes</text>
  <rect x="706.6667" y="96.129" width="250" height="112.2581" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="831.6667" y="161.6129" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">3. Select Best</text>
  <rect x="1040" y="96.129" width="200" height="112.2581" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="161.6129" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">4. Bind Pod</text>
  <rect x="123.3333" y="283.2258" width="1000" height="336.7742" fill="var(--surface)" rx="6"/>
  <text x="623.3333" y="330" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Scheduling Factors</text>
  <text x="290" y="376.7742" text-anchor="start" font-size="19.9785" font-family="Arial, sans-serif" fill="var(--text)">• Resource requirements</text>
  <text x="290" y="423.5484" text-anchor="start" font-size="19.9785" font-family="Arial, sans-serif" fill="var(--text)">• Hardware/software constraints</text>
  <text x="290" y="470.3226" text-anchor="start" font-size="19.9785" font-family="Arial, sans-serif" fill="var(--text)">• Affinity and anti-affinity</text>
  <text x="290" y="517.0968" text-anchor="start" font-size="19.9785" font-family="Arial, sans-serif" fill="var(--text)">• Data locality</text>
  <text x="290" y="563.871" text-anchor="start" font-size="19.9785" font-family="Arial, sans-serif" fill="var(--text)">• Workload interference</text>
  <text x="706.6667" y="376.7742" text-anchor="start" font-size="19.9785" font-family="Arial, sans-serif" fill="var(--text)">• Taints and tolerations</text>
  <text x="706.6667" y="423.5484" text-anchor="start" font-size="19.9785" font-family="Arial, sans-serif" fill="var(--text)">• Pod priority and preemption</text>
  <text x="706.6667" y="470.3226" text-anchor="start" font-size="19.9785" font-family="Arial, sans-serif" fill="var(--text)">• Node selectors</text>
  <text x="706.6667" y="517.0968" text-anchor="start" font-size="19.9785" font-family="Arial, sans-serif" fill="var(--text)">• Resource utilization</text>
  <text x="706.6667" y="563.871" text-anchor="start" font-size="19.9785" font-family="Arial, sans-serif" fill="var(--text)">• Custom schedulers</text>
</svg>

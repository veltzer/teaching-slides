<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="623.3333" y="40" text-anchor="middle" font-size="26.638" font-weight="bold">Scheduler Decision Process</text>
  <rect x="40" y="96.129" width="250" height="112.2581" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="165" y="161.6129" text-anchor="middle" fill="var(--bg)">1. Filter Nodes</text>
  <rect x="373.3333" y="96.129" width="250" height="112.2581" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="498.3333" y="161.6129" text-anchor="middle" fill="var(--bg)">2. Score Nodes</text>
  <rect x="706.6667" y="96.129" width="250" height="112.2581" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="831.6667" y="161.6129" text-anchor="middle" fill="var(--bg)">3. Select Best</text>
  <rect x="1040" y="96.129" width="200" height="112.2581" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1140" y="161.6129" text-anchor="middle" fill="var(--bg)">4. Bind Pod</text>
  <rect x="123.3333" y="283.2258" width="1000" height="336.7742" fill="var(--surface)" rx="6" />
  <text x="623.3333" y="330" text-anchor="middle" font-weight="bold">Scheduling Factors</text>
  <text x="290" y="376.7742" text-anchor="start" font-size="19.9785">• Resource requirements</text>
  <text x="290" y="423.5484" text-anchor="start" font-size="19.9785">• Hardware/software constraints</text>
  <text x="290" y="470.3226" text-anchor="start" font-size="19.9785">• Affinity and anti-affinity</text>
  <text x="290" y="517.0968" text-anchor="start" font-size="19.9785">• Data locality</text>
  <text x="290" y="563.871" text-anchor="start" font-size="19.9785">• Workload interference</text>
  <text x="706.6667" y="376.7742" text-anchor="start" font-size="19.9785">• Taints and tolerations</text>
  <text x="706.6667" y="423.5484" text-anchor="start" font-size="19.9785">• Pod priority and preemption</text>
  <text x="706.6667" y="470.3226" text-anchor="start" font-size="19.9785">• Node selectors</text>
  <text x="706.6667" y="517.0968" text-anchor="start" font-size="19.9785">• Resource utilization</text>
  <text x="706.6667" y="563.871" text-anchor="start" font-size="19.9785">• Custom schedulers</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="499.999980555555" height="302.608695652174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.644264793418" filter="url(#shadow)"/>
  <text x="289.999990277777" y="103.043478260869" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Master Node</text>
  <rect x="59.999933888887" y="140.869565217391" width="200.00003888889" height="75.652173913043" fill="url(#grad-primary)" rx="7.644264793418" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="159.999953333332" y="191.304347826087" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">API Server</text>
  <rect x="280.000023333334" y="140.869565217391" width="200.00003888889" height="75.652173913043" fill="url(#grad-primary)" rx="7.644264793418" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380.000042777779" y="191.304347826087" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">Scheduler</text>
  <rect x="59.999933888887" y="241.739130434783" width="200.00003888889" height="75.652173913043" fill="url(#grad-primary)" rx="7.644264793418" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="159.999953333332" y="292.173913043478" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">Controller</text>
  <rect x="280.000023333334" y="241.739130434783" width="200.00003888889" height="75.652173913043" fill="url(#grad-primary)" rx="7.644264793418" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380.000042777779" y="292.173913043478" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">etcd</text>
  <rect x="740.000019444445" y="40" width="499.999980555555" height="302.608695652174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.644264793418" filter="url(#shadow)"/>
  <text x="990.000009722222" y="103.043478260869" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Worker Node</text>
  <rect x="759.999953333332" y="140.869565217391" width="200.00003888889" height="75.652173913043" fill="url(#grad-ok)" rx="7.644264793418" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="859.999972777777" y="191.304347826087" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">Kubelet</text>
  <rect x="980.000042777779" y="140.869565217391" width="240.000023333334" height="75.652173913043" fill="url(#grad-ok)" rx="7.644264793418" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1099.999996111111" y="191.304347826087" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">Container Runtime</text>
  <rect x="759.999953333332" y="241.739130434783" width="200.00003888889" height="75.652173913043" fill="url(#grad-ok)" rx="7.644264793418" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="859.999972777777" y="292.173913043478" text-anchor="middle" fill="var(--bg)" font-size="23.290673376999" font-family="Arial, sans-serif">Kube-proxy</text>
  <rect x="40" y="418.260869565217" width="1200" height="201.739130434783" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.644264793418" filter="url(#shadow)"/>
  <text x="640" y="481.304347826086" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Pods (Application Containers)</text>
  <rect x="201.222487811736" y="498.103652173913" width="77.555335487648" height="92.488347826086" rx="17.836617851308" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="401.221826700606" y="498.103652173913" width="77.555335487648" height="92.488347826086" rx="17.836617851308" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="601.222332256176" y="498.103652173913" width="77.555335487648" height="92.488347826086" rx="17.836617851308" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="801.222837811745" y="498.103652173913" width="77.555335487648" height="92.488347826086" rx="17.836617851308" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="1001.222176700616" y="498.103652173913" width="77.555335487648" height="92.488347826086" rx="17.836617851308" fill="url(#grad-warn)" filter="url(#shadow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="302.2222" y="35.5556" width="533.3333" height="62.2222" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="60.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.5556" font-weight="bold" fill="var(--info-accent)">Namespace</text>
  <text x="568.8889" y="81.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--info-accent)">logical isolation boundary — e.g. production, staging, dev</text>
  <line x1="568.8889" y1="97.7778" x2="568.8889" y2="122.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="586.6667" y="115.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">contains</text>
  <rect x="346.6667" y="126.2222" width="444.4444" height="62.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="151.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.5556" font-weight="bold" fill="var(--bg)">Deployment</text>
  <text x="568.8889" y="173.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--primary-accent)">desired state: replicas, image, update strategy</text>
  <line x1="568.8889" y1="188.4444" x2="568.8889" y2="213.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="586.6667" y="206.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">owns</text>
  <rect x="382.2222" y="216.8889" width="373.3333" height="62.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="241.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.5556" font-weight="bold" fill="var(--bg)">ReplicaSet</text>
  <text x="568.8889" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--primary-accent)">ensures N identical pods running at all times</text>
  <line x1="568.8889" y1="279.1111" x2="568.8889" y2="304" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="586.6667" y="296.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">manages</text>
  <rect x="124.4444" y="307.5556" width="248.8889" height="133.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="248.8889" y="330.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">Pod</text>
  <text x="248.8889" y="350.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">IP: 10.244.1.5</text>
  <rect x="142.2222" y="359.1111" width="213.3333" height="53.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="248.8889" y="382.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">Container</text>
  <text x="248.8889" y="401.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--primary-accent)">nginx:1.21  port 80</text>
  <text x="248.8889" y="430.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">app=web, ver=v1</text>
  <line x1="435.5556" y1="307.5556" x2="302.2222" y2="307.5556" stroke="var(--primary-border)" stroke-width="1.7778" />
  <rect x="444.4444" y="307.5556" width="248.8889" height="133.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="330.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">Pod</text>
  <text x="568.8889" y="350.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">IP: 10.244.1.6</text>
  <rect x="462.2222" y="359.1111" width="213.3333" height="53.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="382.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">Container</text>
  <text x="568.8889" y="401.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--primary-accent)">nginx:1.21  port 80</text>
  <text x="568.8889" y="430.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">app=web, ver=v1</text>
  <rect x="764.4444" y="307.5556" width="248.8889" height="133.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="888.8889" y="330.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">Pod</text>
  <text x="888.8889" y="350.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">IP: 10.244.2.3</text>
  <rect x="782.2222" y="359.1111" width="213.3333" height="53.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="888.8889" y="382.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">Container</text>
  <text x="888.8889" y="401.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--primary-accent)">nginx:1.21  port 80</text>
  <text x="888.8889" y="430.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">app=web, ver=v1</text>
  <line x1="702.2222" y1="307.5556" x2="835.5556" y2="307.5556" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="248.8889" y="462.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">replica 1/3</text>
  <text x="568.8889" y="462.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">replica 2/3</text>
  <text x="888.8889" y="462.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">replica 3/3</text>
  <rect x="35.5556" y="497.7778" width="1066.6667" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="521.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">Key Facts</text>
  <text x="177.7778" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">Namespace isolates resources</text>
  <text x="444.4444" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">Deployment owns ReplicaSets</text>
  <text x="711.1111" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">ReplicaSet maintains pod count</text>
  <text x="977.7778" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">Pod hosts containers</text>
  <text x="568.8889" y="555.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Pods are ephemeral — controllers recreate them if they die</text>
</svg>
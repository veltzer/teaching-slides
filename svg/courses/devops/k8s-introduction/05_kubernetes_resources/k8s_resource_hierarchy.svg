<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Level 0: Namespace -->
  <rect x="340" y="40" width="600" height="70" rx="12" fill="#ede7f6" stroke="#673ab7" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="640" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#4527a0">Namespace</text>
  <text x="640" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#7e57c2">logical isolation boundary — e.g. production, staging, dev</text>

  <!-- Arrow down -->
  <line x1="640" y1="110" x2="640" y2="138" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="660" y="130" font-family="Arial,sans-serif" font-size="12" fill="#555">contains</text>

  <!-- Level 1: Deployment -->
  <rect x="390" y="142" width="500" height="70" rx="12" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Deployment</text>
  <text x="640" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#bbdefb">desired state: replicas, image, update strategy</text>

  <!-- Arrow down -->
  <line x1="640" y1="212" x2="640" y2="240" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="660" y="232" font-family="Arial,sans-serif" font-size="12" fill="#555">owns</text>

  <!-- Level 2: ReplicaSet -->
  <rect x="430" y="244" width="420" height="70" rx="12" fill="#1976d2" filter="url(#shadow)"/>
  <text x="640" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff">ReplicaSet</text>
  <text x="640" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#bbdefb">ensures N identical pods running at all times</text>

  <!-- Arrow down to Pod group -->
  <line x1="640" y1="314" x2="640" y2="342" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="660" y="334" font-family="Arial,sans-serif" font-size="12" fill="#555">manages</text>

  <!-- Level 3: Pods (three) -->
  <!-- Pod 1 -->
  <rect x="140" y="346" width="280" height="150" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Pod</text>
  <text x="280" y="394" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">IP: 10.244.1.5</text>
  <!-- Container inside pod 1 -->
  <rect x="160" y="404" width="240" height="60" rx="8" fill="#4fc3f7" stroke="#0277bd" stroke-width="1.5"/>
  <text x="280" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff">Container</text>
  <text x="280" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e1f5fe">nginx:1.21  port 80</text>
  <text x="280" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">app=web, ver=v1</text>

  <!-- Line from ReplicaSet to Pod1 -->
  <line x1="490" y1="346" x2="340" y2="346" stroke="#1976d2" stroke-width="2"/>

  <!-- Pod 2 -->
  <rect x="500" y="346" width="280" height="150" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Pod</text>
  <text x="640" y="394" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">IP: 10.244.1.6</text>
  <rect x="520" y="404" width="240" height="60" rx="8" fill="#4fc3f7" stroke="#0277bd" stroke-width="1.5"/>
  <text x="640" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff">Container</text>
  <text x="640" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e1f5fe">nginx:1.21  port 80</text>
  <text x="640" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">app=web, ver=v1</text>

  <!-- Pod 3 -->
  <rect x="860" y="346" width="280" height="150" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Pod</text>
  <text x="1000" y="394" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">IP: 10.244.2.3</text>
  <rect x="880" y="404" width="240" height="60" rx="8" fill="#4fc3f7" stroke="#0277bd" stroke-width="1.5"/>
  <text x="1000" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff">Container</text>
  <text x="1000" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e1f5fe">nginx:1.21  port 80</text>
  <text x="1000" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">app=web, ver=v1</text>

  <!-- Line from ReplicaSet to Pod3 -->
  <line x1="790" y1="346" x2="940" y2="346" stroke="#1976d2" stroke-width="2"/>

  <!-- Annotations -->
  <text x="280" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#777">replica 1/3</text>
  <text x="640" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#777">replica 2/3</text>
  <text x="1000" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#777">replica 3/3</text>

  <!-- Key facts -->
  <rect x="40" y="560" width="1200" height="90" rx="10" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="640" y="587" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#333">Key Facts</text>
  <text x="200" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555">Namespace isolates resources</text>
  <text x="500" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555">Deployment owns ReplicaSets</text>
  <text x="800" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555">ReplicaSet maintains pod count</text>
  <text x="1100" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555">Pod hosts containers</text>
  <text x="640" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#777">Pods are ephemeral — controllers recreate them if they die</text>
</svg>

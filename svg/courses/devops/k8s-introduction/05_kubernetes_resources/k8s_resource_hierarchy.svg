<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="358.75" y="72.2223" width="562.5" height="56.3889" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="94.7777" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.1186" font-weight="bold" fill="var(--info-accent)">Namespace</text>
  <text x="640" y="114.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" fill="var(--info-accent)">logical isolation boundary — e.g. production, staging, dev</text>
  <line x1="640" y1="128.6111" x2="640" y2="151.1667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="658.75" y="144.7223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">contains</text>
  <rect x="405.625" y="154.3889" width="468.7499" height="56.3889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="176.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.1186" font-weight="bold" fill="var(--bg)">Deployment</text>
  <text x="640" y="197.0833" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" fill="var(--primary-accent)">desired state: replicas, image, update strategy</text>
  <line x1="640" y1="210.7777" x2="640" y2="233.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="658.75" y="226.8889" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">owns</text>
  <rect x="443.125" y="236.5556" width="393.75" height="56.3889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="259.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.1186" font-weight="bold" fill="var(--bg)">ReplicaSet</text>
  <text x="640" y="279.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" fill="var(--primary-accent)">ensures N identical pods running at all times</text>
  <line x1="640" y1="292.9444" x2="640" y2="315.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="658.75" y="309.0556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">manages</text>
  <rect x="171.25" y="318.7223" width="262.5" height="120.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="302.5" y="339.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">Pod</text>
  <text x="302.5" y="357.3889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">IP: 10.244.1.5</text>
  <rect x="190" y="365.4444" width="225" height="48.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="302.5" y="386.3889" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)">Container</text>
  <text x="302.5" y="404.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">nginx:1.21  port 80</text>
  <text x="302.5" y="429.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">app=web, ver=v1</text>
  <line x1="499.375" y1="318.7223" x2="358.75" y2="318.7223" stroke="var(--primary-border)" stroke-width="1.7778" />
  <rect x="508.7499" y="318.7223" width="262.5" height="120.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="339.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">Pod</text>
  <text x="640" y="357.3889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">IP: 10.244.1.6</text>
  <rect x="527.5" y="365.4444" width="225" height="48.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="386.3889" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)">Container</text>
  <text x="640" y="404.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">nginx:1.21  port 80</text>
  <text x="640" y="429.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">app=web, ver=v1</text>
  <rect x="846.2499" y="318.7223" width="262.5" height="120.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="977.5" y="339.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">Pod</text>
  <text x="977.5" y="357.3889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">IP: 10.244.2.3</text>
  <rect x="865" y="365.4444" width="225" height="48.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="977.5" y="386.3889" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)">Container</text>
  <text x="977.5" y="404.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">nginx:1.21  port 80</text>
  <text x="977.5" y="429.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">app=web, ver=v1</text>
  <line x1="780.625" y1="318.7223" x2="921.25" y2="318.7223" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="302.5" y="458.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)">replica 1/3</text>
  <text x="640" y="458.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)">replica 2/3</text>
  <text x="977.5" y="458.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)">replica 3/3</text>
  <rect x="77.5" y="491.1111" width="1125" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="512.8611" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--text)">Key Facts</text>
  <text x="227.5" y="533" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)">Namespace isolates resources</text>
  <text x="508.7499" y="533" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)">Deployment owns ReplicaSets</text>
  <text x="790" y="533" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)">ReplicaSet maintains pod count</text>
  <text x="1071.25" y="533" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)">Pod hosts containers</text>
  <text x="640" y="543.4723" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Pods are ephemeral — controllers recreate them if they die</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="299.9999" height="139.199860800019" fill="url(#grad-primary)" rx="6.572670236774" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0002" y="121.200268799963" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Observe</text>
  <rect x="490.0001" y="40" width="299.9999" height="139.199860800019" fill="url(#grad-ok)" rx="6.572670236774" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="121.200268799963" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Analyze</text>
  <rect x="940.0001" y="40" width="299.9999" height="139.199860800019" fill="url(#grad-warn)" rx="6.572670236774" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090.0003" y="121.200268799963" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Act</text>
  <path d="M 340.0001 109.600110399985 L 480.0001 109.600110399985" stroke="var(--text-muted)" stroke-width="0.8854" marker-end="url(#arrow)"/>
  <path d="M 790.0002 109.600110399985 L 930.0001 109.600110399985" stroke="var(--text-muted)" stroke-width="0.8854" marker-end="url(#arrow)"/>
  <path d="M 1090.0003 179.200100799986 Q 640 318.399961600005 190.0002 179.200100799986" stroke="var(--text-muted)" stroke-width="0.8854" marker-end="url(#arrow)"/>
  <rect x="240.0001" y="387.999952000007" width="800.0001" height="232.000047999993" fill="url(#grad-ok)" rx="6.572670236774" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="457.599942400008" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Reconciliation Loop</text>
  <text x="640" y="515.600014399998" text-anchor="middle" font-size="24.370475337424" font-family="Arial, sans-serif" fill="var(--ok-text)">1. Watch for changes in resources</text>
  <text x="640" y="561.99992800001" text-anchor="middle" font-size="24.370475337424" font-family="Arial, sans-serif" fill="var(--ok-text)">2. Compare desired vs current state</text>
  <text x="640" y="608.399961600005" text-anchor="middle" font-size="24.370475337424" font-family="Arial, sans-serif" fill="var(--ok-text)">3. Take action to match desired state</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="420.8219" y="52.6027" text-anchor="middle" font-size="15.586" font-weight="bold">Controller Loop</text>
  <rect x="128.5845" y="107.3972" width="146.1187" height="65.7534" fill="var(--primary-fill)" rx="5.7078" stroke="var(--primary-border)" stroke-width="1.3151" />
  <text x="201.6439" y="145.7535" text-anchor="middle" fill="var(--bg)">Observe</text>
  <rect x="347.7626" y="107.3972" width="146.1187" height="65.7534" fill="var(--ok-fill)" rx="5.7078" stroke="var(--ok-border)" stroke-width="1.3151" />
  <text x="420.8219" y="145.7535" text-anchor="middle" fill="var(--bg)">Analyze</text>
  <rect x="566.9406" y="107.3972" width="146.1187" height="65.7534" fill="var(--warn-fill)" rx="5.7078" stroke="var(--warn-border)" stroke-width="1.3151" />
  <text x="640" y="145.7535" text-anchor="middle">Act</text>
  <path d="M 274.7032 140.274 L 342.892 140.274" stroke="var(--text-muted)" stroke-width="1.3466" marker-end="url(#arrow)" />
  <path d="M 493.8813 140.274 L 562.07 140.274" stroke="var(--text-muted)" stroke-width="1.3466" marker-end="url(#arrow)" />
  <path d="M 640 173.1507 Q 420.8219 238.9041 201.6439 173.1507" stroke="var(--text-muted)" stroke-width="1.3466" marker-end="url(#arrow)" />
  <rect x="225.997" y="271.7808" width="389.6499" height="109.5891" fill="var(--ok-fill)" rx="5.7078" stroke="var(--ok-border)" stroke-width="1.3151" />
  <text x="420.8219" y="304.6575" text-anchor="middle" font-weight="bold">Reconciliation Loop</text>
  <text x="420.8219" y="332.0548" text-anchor="middle" font-size="11.6895">1. Watch for changes in resources</text>
  <text x="420.8219" y="353.9726" text-anchor="middle" font-size="11.6895">2. Compare desired vs current state</text>
  <text x="420.8219" y="375.8904" text-anchor="middle" font-size="11.6895">3. Take action to match desired state</text>
  <defs>
    <style id="palette-vars">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Controller Loop</text>
  <rect x="160" y="144" width="240" height="108" fill="#4285f4" rx="8" />
  <text x="280" y="207" text-anchor="middle" fill="white">Observe</text>
  <rect x="520" y="144" width="240" height="108" fill="#34a853" rx="8" />
  <text x="640" y="207" text-anchor="middle" fill="white">Analyze</text>
  <rect x="880" y="144" width="240" height="108" fill="#fbbc04" rx="8" />
  <text x="1000" y="207" text-anchor="middle">Act</text>
  <path d="M 400 198 L 512 198" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 760 198 L 872 198" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 1000 252 Q 640 360 280 252" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="320" y="414" width="640" height="180" fill="#e8f5e9" rx="8" />
  <text x="640" y="468" text-anchor="middle" font-weight="bold">Reconciliation Loop</text>
  <text x="640" y="513" text-anchor="middle" font-size="19.2">1. Watch for changes in resources</text>
  <text x="640" y="549" text-anchor="middle" font-size="19.2">2. Compare desired vs current state</text>
  <text x="640" y="585" text-anchor="middle" font-size="19.2">3. Take action to match desired state</text>
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#666" />
    </marker>
  </defs>
</svg>
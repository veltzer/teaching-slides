<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="409.6" y="34.56" text-anchor="middle" font-size="16.384" font-weight="bold">Controller Loop</ns0:text>
  <ns0:rect x="102.4" y="92.16" width="153.6" height="69.12" fill="#4285f4" rx="5.12" />
  <ns0:text x="179.2" y="132.48" text-anchor="middle" fill="white">Observe</ns0:text>
  <ns0:rect x="332.8" y="92.16" width="153.6" height="69.12" fill="#34a853" rx="5.12" />
  <ns0:text x="409.6" y="132.48" text-anchor="middle" fill="white">Analyze</ns0:text>
  <ns0:rect x="563.2" y="92.16" width="153.6" height="69.12" fill="#fbbc04" rx="5.12" />
  <ns0:text x="640" y="132.48" text-anchor="middle">Act</ns0:text>

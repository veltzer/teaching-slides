<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="80" text-anchor="middle" font-size="23.7037" font-weight="bold">Controller Loop</text>
  <rect x="195.5556" y="163.3333" width="222.2222" height="100" fill="var(--primary-fill)" rx="8.6806" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="306.6667" y="221.6667" text-anchor="middle" fill="var(--bg)">Observe</text>
  <rect x="528.8889" y="163.3333" width="222.2222" height="100" fill="var(--ok-fill)" rx="8.6806" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="221.6667" text-anchor="middle" fill="var(--bg)">Analyze</text>
  <rect x="862.2222" y="163.3333" width="222.2222" height="100" fill="var(--warn-fill)" rx="8.6806" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="973.3333" y="221.6667" text-anchor="middle">Act</text>
  <path d="M 417.7778 213.3333 L 521.4815 213.3333" stroke="var(--text-muted)" stroke-width="2.048" marker-end="url(#arrow)" />
  <path d="M 751.1111 213.3333 L 854.8148 213.3333" stroke="var(--text-muted)" stroke-width="2.048" marker-end="url(#arrow)" />
  <path d="M 973.3333 263.3333 Q 640 363.3333 306.6667 263.3333" stroke="var(--text-muted)" stroke-width="2.048" marker-end="url(#arrow)" />
  <rect x="343.7037" y="413.3333" width="592.5926" height="166.6667" fill="var(--ok-fill)" rx="8.6806" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="463.3333" text-anchor="middle" font-weight="bold">Reconciliation Loop</text>
  <text x="640" y="505" text-anchor="middle" font-size="17.7778">1. Watch for changes in resources</text>
  <text x="640" y="538.3333" text-anchor="middle" font-size="17.7778">2. Compare desired vs current state</text>
  <text x="640" y="571.6667" text-anchor="middle" font-size="17.7778">3. Take action to match desired state</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
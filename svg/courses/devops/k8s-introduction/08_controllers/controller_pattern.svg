  <ns0:path d="M 486.4 126.72 L 558.08 126.72" stroke="#666" stroke-width="2.048" marker-end="url(#arrow)" />
  <ns0:path d="M 640 161.28 Q 409.6 230.4 179.2 161.28" stroke="#666" stroke-width="2.048" marker-end="url(#arrow)" />
  <ns0:rect x="204.8" y="264.96" width="409.6" height="115.2" fill="#e8f5e9" rx="5.12" />
  <ns0:text x="409.6" y="299.52" text-anchor="middle" font-weight="bold">Reconciliation Loop</ns0:text>
  <ns0:text x="409.6" y="328.32" text-anchor="middle" font-size="12.288">1. Watch for changes in resources</ns0:text>
  <ns0:text x="409.6" y="351.36" text-anchor="middle" font-size="12.288">2. Compare desired vs current state</ns0:text>
  <ns0:text x="409.6" y="374.4" text-anchor="middle" font-size="12.288">3. Take action to match desired state</ns0:text>

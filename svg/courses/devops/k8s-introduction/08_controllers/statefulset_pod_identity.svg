  <text x="854.2857" y="272" text-anchor="middle" fill="var(--bg)" font-size="18.880432334316" font-family="Arial, sans-serif">PVC: www-web-2</text>
  <rect x="1025.7143" y="136.666666666667" width="214.2857" height="154.666666666667" fill="var(--text-faint)" rx="6.196773353932"/>
  <text x="1132" y="214" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">web-N</text>

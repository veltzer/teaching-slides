  <text x="501.53843668639" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">web-1</text>
  <text x="501.53843668639" y="184.999999999999" text-anchor="middle" fill="var(--bg)" font-size="23.996610856403" font-family="Arial, sans-serif">Second pod</text>
  <text x="501.53843668639" y="242.999999999999" text-anchor="middle" fill="var(--bg)" font-size="23.996610856403" font-family="Arial, sans-serif">PVC: www-web-1</text>
  <rect x="686.15385443787" y="40" width="276.92312662722" height="232" fill="url(#grad-primary)" rx="7.875961530254" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="824.615363905325" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">web-2</text>
  <text x="824.615363905325" y="184.999999999999" text-anchor="middle" fill="var(--bg)" font-size="23.996610856403" font-family="Arial, sans-serif">Third pod</text>
  <text x="824.615363905325" y="242.999999999999" text-anchor="middle" fill="var(--bg)" font-size="23.996610856403" font-family="Arial, sans-serif">PVC: www-web-2</text>
  <rect x="1009.230781656805" y="40" width="230.769218343195" height="232" fill="var(--text-faint)" rx="7.875961530254"/>
  <text x="1123.692306201184" y="155.999999999999" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">web-N</text>
  <rect x="224.61541775148" y="388" width="738.46156331361" height="232" fill="url(#grad-ok)" rx="7.875961530254" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="593.84614556213" y="475" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Properties</text>
  <text x="593.84614556213" y="532.999999999998" text-anchor="middle" font-size="26.178120934257" font-family="Arial, sans-serif" fill="var(--ok-text)">• Predictable pod names: $(statefulset)-$(ordinal)</text>
  <text x="593.84614556213" y="590.999999999999" text-anchor="middle" font-size="26.178120934257" font-family="Arial, sans-serif" fill="var(--ok-text)">• Stable network ID: web-0.nginx.default.svc.cluster.local</text>

  <text x="554.2857" y="194.666666666667" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">web-1</text>
  <text x="554.2857" y="233.333333333333" text-anchor="middle" fill="var(--bg)" font-size="18.880432334316" font-family="Arial, sans-serif">Second pod</text>

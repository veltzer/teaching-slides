<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="76.25" width="1200" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640" y="40" text-anchor="middle" font-size="29.9142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Controller Types</text>
  <rect x="91.4286" y="130.625" width="222.8571" height="453.125" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.8571" y="175.9375" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Deployment</text>
  <text x="202.8571" y="212.1875" text-anchor="middle" fill="var(--bg)" font-size="16.619" font-family="Arial, sans-serif">Stateless apps</text>
  <text x="202.8571" y="248.4375" text-anchor="middle" fill="var(--bg)" font-size="16.619" font-family="Arial, sans-serif">Rolling updates</text>
  <rect x="331.4286" y="130.625" width="222.8571" height="453.125" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="442.8571" y="175.9375" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">StatefulSet</text>
  <text x="442.8571" y="212.1875" text-anchor="middle" fill="var(--bg)" font-size="16.619" font-family="Arial, sans-serif">Stateful apps</text>
  <text x="442.8571" y="248.4375" text-anchor="middle" fill="var(--bg)" font-size="16.619" font-family="Arial, sans-serif">Ordered</text>
  <rect x="571.4286" y="130.625" width="222.8571" height="453.125" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="682.8571" y="175.9375" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">DaemonSet</text>
  <text x="682.8571" y="212.1875" text-anchor="middle" font-size="16.619" font-family="Arial, sans-serif" fill="var(--warn-text)">Node agents</text>
  <text x="682.8571" y="248.4375" text-anchor="middle" font-size="16.619" font-family="Arial, sans-serif" fill="var(--warn-text)">One per node</text>
  <rect x="811.4286" y="130.625" width="222.8571" height="453.125" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="922.8571" y="175.9375" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Job</text>
  <text x="922.8571" y="212.1875" text-anchor="middle" fill="var(--bg)" font-size="16.619" font-family="Arial, sans-serif">Batch tasks</text>
  <text x="922.8571" y="248.4375" text-anchor="middle" fill="var(--bg)" font-size="16.619" font-family="Arial, sans-serif">Run to completion</text>
  <rect x="1051.4286" y="130.625" width="188.5714" height="453.125" fill="url(#grad-info)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.7143" y="175.9375" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">CronJob</text>
  <text x="1145.7143" y="212.1875" text-anchor="middle" fill="var(--bg)" font-size="16.619" font-family="Arial, sans-serif">Scheduled</text>
  <text x="1145.7143" y="248.4375" text-anchor="middle" fill="var(--bg)" font-size="16.619" font-family="Arial, sans-serif">Recurring</text>
</svg>

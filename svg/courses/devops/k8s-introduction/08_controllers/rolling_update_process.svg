<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Rolling Update Stages</text>
  <g id="stage1">
    <text x="160" y="108" text-anchor="middle" font-size="19.2">Initial</text>
    <rect x="80" y="144" width="160" height="72" fill="#4285f4" rx="4.8" />
    <text x="160" y="189" text-anchor="middle" fill="white">v1</text>
    <rect x="80" y="234" width="160" height="72" fill="#4285f4" rx="4.8" />
    <text x="160" y="279" text-anchor="middle" fill="white">v1</text>
    <rect x="80" y="324" width="160" height="72" fill="#4285f4" rx="4.8" />
    <text x="160" y="369" text-anchor="middle" fill="white">v1</text>
  </g>
  <g id="stage2">
    <text x="400" y="108" text-anchor="middle" font-size="19.2">Updating</text>
    <rect x="320" y="144" width="160" height="72" fill="#34a853" rx="4.8" />
    <text x="400" y="189" text-anchor="middle" fill="white">v2</text>
    <rect x="320" y="234" width="160" height="72" fill="#4285f4" rx="4.8" />
    <text x="400" y="279" text-anchor="middle" fill="white">v1</text>
    <rect x="320" y="324" width="160" height="72" fill="#4285f4" rx="4.8" />
    <text x="400" y="369" text-anchor="middle" fill="white">v1</text>
    <rect x="320" y="414" width="160" height="72" fill="#34a853" rx="4.8" />
    <text x="400" y="459" text-anchor="middle" fill="white">v2</text>
  </g>
  <g id="stage3">
    <text x="640" y="108" text-anchor="middle" font-size="19.2">Progressing</text>
    <rect x="560" y="144" width="160" height="72" fill="#34a853" rx="4.8" />
    <text x="640" y="189" text-anchor="middle" fill="white">v2</text>
    <rect x="560" y="234" width="160" height="72" fill="#34a853" rx="4.8" />
    <text x="640" y="279" text-anchor="middle" fill="white">v2</text>
    <rect x="560" y="324" width="160" height="72" fill="#4285f4" rx="4.8" />
    <text x="640" y="369" text-anchor="middle" fill="white">v1</text>
  </g>
  <g id="stage4">
    <text x="880" y="108" text-anchor="middle" font-size="19.2">Complete</text>
    <rect x="800" y="144" width="160" height="72" fill="#34a853" rx="4.8" />
    <text x="880" y="189" text-anchor="middle" fill="white">v2</text>
    <rect x="800" y="234" width="160" height="72" fill="#34a853" rx="4.8" />
    <text x="880" y="279" text-anchor="middle" fill="white">v2</text>
    <rect x="800" y="324" width="160" height="72" fill="#34a853" rx="4.8" />
    <text x="880" y="369" text-anchor="middle" fill="white">v2</text>
  </g>
</svg>
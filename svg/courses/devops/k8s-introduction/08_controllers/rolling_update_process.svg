<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="778.8889" y="80" text-anchor="middle" font-size="29.6296" font-weight="bold">Rolling Update Stages</text>
  <g id="stage1">
    <text x="223.3333" y="142.5" text-anchor="middle" font-size="22.2222">Initial</text>
    <rect x="130.7407" y="184.1667" width="185.1852" height="83.3333" fill="var(--primary-fill)" rx="6.9444" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="223.3333" y="236.25" text-anchor="middle" fill="var(--bg)">v1</text>
    <rect x="130.7407" y="288.3333" width="185.1852" height="83.3333" fill="var(--primary-fill)" rx="6.9444" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="223.3333" y="340.4167" text-anchor="middle" fill="var(--bg)">v1</text>
    <rect x="130.7407" y="392.5" width="185.1852" height="83.3333" fill="var(--primary-fill)" rx="6.9444" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="223.3333" y="444.5833" text-anchor="middle" fill="var(--bg)">v1</text>
  </g>
  <g id="stage2">
    <text x="501.1111" y="142.5" text-anchor="middle" font-size="22.2222">Updating</text>
    <rect x="408.5185" y="184.1667" width="185.1852" height="83.3333" fill="var(--ok-fill)" rx="6.9444" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="501.1111" y="236.25" text-anchor="middle" fill="var(--bg)">v2</text>
    <rect x="408.5185" y="288.3333" width="185.1852" height="83.3333" fill="var(--primary-fill)" rx="6.9444" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="501.1111" y="340.4167" text-anchor="middle" fill="var(--bg)">v1</text>
    <rect x="408.5185" y="392.5" width="185.1852" height="83.3333" fill="var(--primary-fill)" rx="6.9444" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="501.1111" y="444.5833" text-anchor="middle" fill="var(--bg)">v1</text>
    <rect x="408.5185" y="496.6667" width="185.1852" height="83.3333" fill="var(--ok-fill)" rx="6.9444" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="501.1111" y="548.75" text-anchor="middle" fill="var(--bg)">v2</text>
  </g>
  <g id="stage3">
    <text x="778.8889" y="142.5" text-anchor="middle" font-size="22.2222">Progressing</text>
    <rect x="686.2963" y="184.1667" width="185.1852" height="83.3333" fill="var(--ok-fill)" rx="6.9444" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="778.8889" y="236.25" text-anchor="middle" fill="var(--bg)">v2</text>
    <rect x="686.2963" y="288.3333" width="185.1852" height="83.3333" fill="var(--ok-fill)" rx="6.9444" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="778.8889" y="340.4167" text-anchor="middle" fill="var(--bg)">v2</text>
    <rect x="686.2963" y="392.5" width="185.1852" height="83.3333" fill="var(--primary-fill)" rx="6.9444" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="778.8889" y="444.5833" text-anchor="middle" fill="var(--bg)">v1</text>
  </g>
  <g id="stage4">
    <text x="1056.6667" y="142.5" text-anchor="middle" font-size="22.2222">Complete</text>
    <rect x="964.0741" y="184.1667" width="185.1852" height="83.3333" fill="var(--ok-fill)" rx="6.9444" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="1056.6667" y="236.25" text-anchor="middle" fill="var(--bg)">v2</text>
    <rect x="964.0741" y="288.3333" width="185.1852" height="83.3333" fill="var(--ok-fill)" rx="6.9444" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="1056.6667" y="340.4167" text-anchor="middle" fill="var(--bg)">v2</text>
    <rect x="964.0741" y="392.5" width="185.1852" height="83.3333" fill="var(--ok-fill)" rx="6.9444" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="1056.6667" y="444.5833" text-anchor="middle" fill="var(--bg)">v2</text>
  </g>
</svg>
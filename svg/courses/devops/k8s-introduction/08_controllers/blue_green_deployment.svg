<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Blue/Green Deployment</text>
  <rect x="160" y="144" width="320" height="180" fill="#4285f4" rx="8" />
  <text x="320" y="216" text-anchor="middle" fill="white" font-weight="bold">Blue (Current)</text>
  <text x="320" y="261" text-anchor="middle" fill="white">Version 1.0</text>
  <text x="320" y="297" text-anchor="middle" fill="white">Active Traffic</text>
  <rect x="560" y="144" width="320" height="180" fill="#34a853" rx="8" />
  <text x="720" y="216" text-anchor="middle" fill="white" font-weight="bold">Green (New)</text>
  <text x="720" y="261" text-anchor="middle" fill="white">Version 2.0</text>
  <text x="720" y="297" text-anchor="middle" fill="white">Testing</text>
  <rect x="960" y="144" width="240" height="180" fill="#fbbc04" rx="8" />
  <text x="1080" y="216" text-anchor="middle" font-weight="bold">Service</text>

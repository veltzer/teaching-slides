<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="356.7817" y="87.1724" text-anchor="middle" font-size="16.4782" font-weight="bold">Blue/Green Deployment</text>
  <rect x="47.8161" y="145.1034" width="205.9769" height="115.8621" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="1.1954" />
  <text x="150.8046" y="191.4483" text-anchor="middle" fill="var(--bg)" font-weight="bold">Blue (Current)</text>
  <text x="150.8046" y="220.4138" text-anchor="middle" fill="var(--bg)">Version 1.0</text>
  <text x="150.8046" y="243.5862" text-anchor="middle" fill="var(--bg)">Active Traffic</text>
  <rect x="305.2874" y="145.1034" width="205.9769" height="115.8621" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="1.1954" />
  <text x="408.2759" y="191.4483" text-anchor="middle" fill="var(--bg)" font-weight="bold">Green (New)</text>
  <text x="408.2759" y="220.4138" text-anchor="middle" fill="var(--bg)">Version 2.0</text>
  <text x="408.2759" y="243.5862" text-anchor="middle" fill="var(--bg)">Testing</text>
  <rect x="562.7586" y="145.1034" width="154.4827" height="115.8621" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="1.1954" />
  <text x="640" y="191.4483" text-anchor="middle" font-weight="bold">Service</text>
  <text x="640" y="220.4138" text-anchor="middle">Selector: blue</text>
  <text x="640" y="243.5862" text-anchor="middle">→ Switch to green</text>
  <path d="M 150.8046 260.9654 L 640 260.9654" stroke="var(--primary-border)" stroke-width="1.0162" />
  <path d="M 408.2759 260.9654 L 640 307.3104" stroke="var(--ok-border)" stroke-width="0.6774" stroke-dasharray="1.6936 1.6936" />
</svg>
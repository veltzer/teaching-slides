  <ns0:text x="586.6667" y="394.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="#555">kubectl rollout status deployment/my-app</ns0:text>
  <ns0:text x="586.6667" y="412.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="#555">kubectl rollout history deployment/my-app</ns0:text>

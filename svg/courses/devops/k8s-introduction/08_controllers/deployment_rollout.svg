  <text x="640" y="362.462655" text-anchor="middle" font-size="17.684043" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Deployment  (spec.strategy.type: RollingUpdate)</text>
  <text x="640" y="386.268723" text-anchor="middle" font-size="13.523112" fill="var(--primary-accent)" font-family="Arial, sans-serif">owns Old ReplicaSet (rs-abc) AND New ReplicaSet (rs-def) simultaneously during rollout</text>
  <rect x="40" y="420.895474" width="580" height="108.208984" rx="7.182066" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>

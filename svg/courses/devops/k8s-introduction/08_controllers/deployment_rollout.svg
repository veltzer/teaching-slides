  <ns0:text x="53.3333" y="394.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="#555">kubectl rollout undo deployment/my-app</ns0:text>
  <ns0:text x="53.3333" y="412.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="#555">kubectl rollout undo deployment/my-app --to-revision=2</ns0:text>
  <ns0:text x="53.3333" y="430.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="#777">Old RS is kept (scaled to 0) enabling instant rollback</ns0:text>

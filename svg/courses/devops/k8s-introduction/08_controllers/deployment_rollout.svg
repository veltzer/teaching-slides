  <rect x="40" y="324.727272727273" width="1200" height="84.363636363636" rx="8.21528508884" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="361.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--primary-text)">Deployment: RollingUpdate</text>
  <text x="640" y="390.109090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--primary-text)">Owns Old + New ReplicaSets during rollout</text>


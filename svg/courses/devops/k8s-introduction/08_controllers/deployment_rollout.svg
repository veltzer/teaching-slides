  <text x="450" y="82.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" font-weight="bold" fill="var(--text)">Step 1: +1 new</text>
  <text x="740" y="82.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" font-weight="bold" fill="var(--text)">Step 2: -1 old</text>

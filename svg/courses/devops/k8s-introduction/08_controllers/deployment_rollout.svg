<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Timeline steps header -->
  <text x="640" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#333">Rolling Update: image v1 → v2  (maxSurge=1, maxUnavailable=0)</text>

  <!-- Column headers -->
  <text x="160" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#555">Step 0 — Before</text>
  <text x="450" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#555">Step 1 — +1 new pod</text>
  <text x="740" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#555">Step 2 — -1 old pod</text>
  <text x="1040" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#555">Step 3 — Complete</text>

  <!-- Vertical dividers -->
  <line x1="300" y1="58" x2="300" y2="580" stroke="#e0e0e0" stroke-width="1.5"/>
  <line x1="590" y1="58" x2="590" y2="580" stroke="#e0e0e0" stroke-width="1.5"/>
  <line x1="880" y1="58" x2="880" y2="580" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Helper function-like block: pod squares -->
  <!-- Step 0: 3 old pods -->
  <rect x="60" y="110" width="80" height="50" rx="8" fill="#1976d2" filter="url(#shadow)"/>
  <text x="100" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="100" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bbdefb">v1</text>

  <rect x="160" y="110" width="80" height="50" rx="8" fill="#1976d2" filter="url(#shadow)"/>
  <text x="200" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="200" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bbdefb">v1</text>

  <rect x="60" y="180" width="80" height="50" rx="8" fill="#1976d2" filter="url(#shadow)"/>
  <text x="100" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="100" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bbdefb">v1</text>

  <text x="160" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">Old RS: 3/3</text>
  <text x="160" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">New RS: 0/0</text>

  <!-- Step 1: 3 old + 1 new (surge) -->
  <rect x="330" y="110" width="80" height="50" rx="8" fill="#1976d2" filter="url(#shadow)"/>
  <text x="370" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="370" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bbdefb">v1</text>

  <rect x="430" y="110" width="80" height="50" rx="8" fill="#1976d2" filter="url(#shadow)"/>
  <text x="470" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="470" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bbdefb">v1</text>

  <rect x="330" y="180" width="80" height="50" rx="8" fill="#1976d2" filter="url(#shadow)"/>
  <text x="370" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="370" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bbdefb">v1</text>

  <rect x="430" y="180" width="80" height="50" rx="8" fill="#43a047" filter="url(#shadow)"/>
  <text x="470" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="470" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c8e6c9">v2 NEW</text>

  <text x="450" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">Old RS: 3/3</text>
  <text x="450" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#388e3c">New RS: 1/1 (surge)</text>

  <!-- Arrow step 0→1 -->
  <line x1="260" y1="165" x2="320" y2="165" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: 2 old (1 terminated) + 1 new -->
  <rect x="620" y="110" width="80" height="50" rx="8" fill="#1976d2" filter="url(#shadow)"/>
  <text x="660" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="660" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bbdefb">v1</text>

  <rect x="720" y="110" width="80" height="50" rx="8" fill="#1976d2" filter="url(#shadow)"/>
  <text x="760" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="760" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bbdefb">v1</text>

  <!-- Terminating old pod -->
  <rect x="620" y="180" width="80" height="50" rx="8" fill="#b0bec5" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="660" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#37474f">Terminating</text>
  <text x="660" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#37474f">v1</text>

  <rect x="720" y="180" width="80" height="50" rx="8" fill="#43a047" filter="url(#shadow)"/>
  <text x="760" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="760" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c8e6c9">v2</text>

  <text x="740" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">Old RS: 2/3 (terminating)</text>
  <text x="740" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#388e3c">New RS: 1/1</text>

  <!-- Arrow step 1→2 -->
  <line x1="548" y1="165" x2="608" y2="165" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: 0 old + 3 new -->
  <rect x="910" y="110" width="80" height="50" rx="8" fill="#43a047" filter="url(#shadow)"/>
  <text x="950" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="950" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c8e6c9">v2</text>

  <rect x="1010" y="110" width="80" height="50" rx="8" fill="#43a047" filter="url(#shadow)"/>
  <text x="1050" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="1050" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c8e6c9">v2</text>

  <rect x="910" y="180" width="80" height="50" rx="8" fill="#43a047" filter="url(#shadow)"/>
  <text x="950" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="950" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c8e6c9">v2</text>

  <text x="1040" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">Old RS: 0/0</text>
  <text x="1040" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#388e3c">New RS: 3/3  Done!</text>

  <!-- Arrow step 2→3 -->
  <line x1="838" y1="165" x2="898" y2="165" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Deployment box across top -->
  <rect x="40" y="316" width="1200" height="60" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#fff">Deployment  (spec.strategy.type: RollingUpdate)</text>
  <text x="640" y="364" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#bbdefb">owns Old ReplicaSet (rs-abc) AND New ReplicaSet (rs-def) simultaneously during rollout</text>

  <!-- Rollback info -->
  <rect x="40" y="396" width="580" height="100" rx="10" fill="#fff3e0" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="50" y="420" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#e65100">Rollback</text>
  <text x="60" y="444" font-family="Arial,sans-serif" font-size="13" fill="#555">kubectl rollout undo deployment/my-app</text>
  <text x="60" y="464" font-family="Arial,sans-serif" font-size="13" fill="#555">kubectl rollout undo deployment/my-app --to-revision=2</text>
  <text x="60" y="484" font-family="Arial,sans-serif" font-size="12" fill="#777">Old RS is kept (scaled to 0) enabling instant rollback</text>

  <!-- Status commands -->
  <rect x="640" y="396" width="600" height="100" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="420" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2e7d32">Monitor Rollout</text>
  <text x="660" y="444" font-family="Arial,sans-serif" font-size="13" fill="#555">kubectl rollout status deployment/my-app</text>
  <text x="660" y="464" font-family="Arial,sans-serif" font-size="13" fill="#555">kubectl rollout history deployment/my-app</text>
  <text x="660" y="484" font-family="Arial,sans-serif" font-size="12" fill="#777">kubectl get rs  (see old and new ReplicaSets)</text>

  <!-- Legend -->
  <rect x="40" y="516" width="20" height="20" rx="3" fill="#1976d2"/>
  <text x="70" y="531" font-family="Arial,sans-serif" font-size="14" fill="#333">Old version (v1)</text>
  <rect x="220" y="516" width="20" height="20" rx="3" fill="#43a047"/>
  <text x="250" y="531" font-family="Arial,sans-serif" font-size="14" fill="#333">New version (v2)</text>
  <rect x="400" y="516" width="20" height="20" rx="3" fill="#b0bec5" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="430" y="531" font-family="Arial,sans-serif" font-size="14" fill="#333">Terminating</text>

  <!-- Key point -->
  <text x="640" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#555">Rolling update ensures zero downtime — always ≥ (desired - maxUnavailable) pods running during update</text>
</svg>

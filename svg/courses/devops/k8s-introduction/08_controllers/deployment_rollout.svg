  <ns0:text x="568.8889" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.1111" font-weight="bold" fill="#fff">Deployment  (spec.strategy.type: RollingUpdate)</ns0:text>
  <ns0:text x="568.8889" y="323.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#bbdefb">owns Old ReplicaSet (rs-abc) AND New ReplicaSet (rs-def) simultaneously during rollout</ns0:text>

  <text x="60" y="494.477439" font-size="13.523112" fill="var(--text-muted)" font-family="Arial, sans-serif">kubectl rollout undo deployment/my-app --to-revision=2</text>
  <text x="60" y="516.119343" font-size="12.48291" fill="var(--text-muted)" font-family="Arial, sans-serif">Old RS is kept (scaled to 0) enabling instant rollback</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Control Plane box -->
  <rect x="40" y="50" width="540" height="330" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="40" y="50" width="540" height="44" rx="12" fill="url(#grad-accent)"/>
  <rect x="40" y="82" width="540" height="12" fill="url(#grad-accent)"/>
  <text x="310" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Control Plane</text>

  <!-- API Server -->
  <rect x="70" y="112" width="220" height="60" rx="8" fill="#1565c0" filter="url(#shadow)"/>
  <text x="180" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">API Server</text>
  <text x="180" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#bbdefb">kube-apiserver</text>

  <!-- etcd -->
  <rect x="310" y="112" width="220" height="60" rx="8" fill="#1976d2" filter="url(#shadow)"/>
  <text x="420" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">etcd</text>
  <text x="420" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#bbdefb">distributed key-value store</text>

  <!-- Scheduler -->
  <rect x="70" y="196" width="220" height="60" rx="8" fill="#0d47a1" filter="url(#shadow)"/>
  <text x="180" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">Scheduler</text>
  <text x="180" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#bbdefb">kube-scheduler</text>

  <!-- Controller Manager -->
  <rect x="310" y="196" width="220" height="60" rx="8" fill="#283593" filter="url(#shadow)"/>
  <text x="420" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">Controller Manager</text>
  <text x="420" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#bbdefb">kube-controller-manager</text>

  <!-- Cloud Controller Manager -->
  <rect x="160" y="280" width="260" height="60" rx="8" fill="#3949ab" filter="url(#shadow)"/>
  <text x="290" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff">Cloud Controller Manager</text>
  <text x="290" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#c5cae9">cloud-controller-manager</text>

  <!-- kubectl user -->
  <rect x="40" y="420" width="120" height="56" rx="8" fill="#fff9c4" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="447" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#e65100">kubectl</text>
  <text x="100" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#bf360c">user / CI</text>

  <!-- Arrow kubectl to API server -->
  <line x1="160" y1="448" x2="180" y2="145" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-accent)"/>

  <!-- Worker Node 1 -->
  <rect x="700" y="50" width="250" height="310" rx="12" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
  <rect x="700" y="50" width="250" height="44" rx="12" fill="#388e3c"/>
  <rect x="700" y="82" width="250" height="12" fill="#388e3c"/>
  <text x="825" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">Worker Node 1</text>

  <rect x="720" y="112" width="210" height="48" rx="6" fill="#2e7d32" filter="url(#shadow)"/>
  <text x="825" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff">kubelet</text>
  <text x="825" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c8e6c9">node agent</text>

  <rect x="720" y="174" width="210" height="48" rx="6" fill="#43a047" filter="url(#shadow)"/>
  <text x="825" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff">kube-proxy</text>
  <text x="825" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c8e6c9">network proxy</text>

  <rect x="720" y="236" width="210" height="48" rx="6" fill="#66bb6a" filter="url(#shadow)"/>
  <text x="825" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff">Container Runtime</text>
  <text x="825" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#1b5e20">containerd / CRI-O</text>

  <!-- Pods in node 1 -->
  <rect x="720" y="298" width="90" height="44" rx="5" fill="#a5d6a7" stroke="#388e3c" stroke-width="1.5"/>
  <text x="765" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Pod A</text>
  <text x="765" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2e7d32">app:v1</text>
  <rect x="840" y="298" width="90" height="44" rx="5" fill="#a5d6a7" stroke="#388e3c" stroke-width="1.5"/>
  <text x="885" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Pod B</text>
  <text x="885" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2e7d32">app:v2</text>

  <!-- Worker Node 2 -->
  <rect x="980" y="50" width="260" height="310" rx="12" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
  <rect x="980" y="50" width="260" height="44" rx="12" fill="#388e3c"/>
  <rect x="980" y="82" width="260" height="12" fill="#388e3c"/>
  <text x="1110" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">Worker Node 2</text>

  <rect x="1000" y="112" width="220" height="48" rx="6" fill="#2e7d32" filter="url(#shadow)"/>
  <text x="1110" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff">kubelet</text>
  <text x="1110" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c8e6c9">node agent</text>

  <rect x="1000" y="174" width="220" height="48" rx="6" fill="#43a047" filter="url(#shadow)"/>
  <text x="1110" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff">kube-proxy</text>
  <text x="1110" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c8e6c9">network proxy</text>

  <rect x="1000" y="236" width="220" height="48" rx="6" fill="#66bb6a" filter="url(#shadow)"/>
  <text x="1110" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff">Container Runtime</text>
  <text x="1110" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#1b5e20">containerd / CRI-O</text>

  <!-- Pods in node 2 -->
  <rect x="1000" y="298" width="90" height="44" rx="5" fill="#a5d6a7" stroke="#388e3c" stroke-width="1.5"/>
  <text x="1045" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Pod C</text>
  <text x="1045" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2e7d32">svc:db</text>
  <rect x="1120" y="298" width="90" height="44" rx="5" fill="#a5d6a7" stroke="#388e3c" stroke-width="1.5"/>
  <text x="1165" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Pod D</text>
  <text x="1165" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2e7d32">svc:web</text>

  <!-- Arrows: API server to worker nodes (kubelet) -->
  <line x1="580" y1="200" x2="700" y2="136" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="580" y1="200" x2="980" y2="136" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- API server ↔ etcd arrow -->
  <line x1="290" y1="142" x2="310" y2="142" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="310" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#1565c0" font-style="italic">API server is the single gateway</text>
  <text x="310" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#1565c0" font-style="italic">for all cluster operations</text>

  <!-- Legend bottom -->
  <rect x="40" y="510" width="18" height="18" fill="#1565c0" rx="3"/>
  <text x="66" y="524" font-family="Arial,sans-serif" font-size="14" fill="#333">Control Plane component</text>
  <rect x="260" y="510" width="18" height="18" fill="#388e3c" rx="3"/>
  <text x="286" y="524" font-family="Arial,sans-serif" font-size="14" fill="#333">Worker Node component</text>
  <rect x="480" y="510" width="18" height="18" fill="#a5d6a7" stroke="#388e3c" stroke-width="1.5" rx="3"/>
  <text x="506" y="524" font-family="Arial,sans-serif" font-size="14" fill="#333">Pod (workload)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <g id="traditional">
    <rect x="40" y="76.25" width="514.2857" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
    <text x="297.1429" y="40" text-anchor="middle" font-weight="bold">Traditional</text>
    <rect x="57.1429" y="493.125" width="480" height="108.75" fill="var(--text-muted)" rx="6"/>
    <text x="297.1429" y="556.5625" text-anchor="middle" fill="var(--bg)">Server</text>
    <rect x="57.1429" y="348.125" width="480" height="126.875" fill="var(--text-faint)" rx="6"/>
    <text x="297.1429" y="420.625" text-anchor="middle" fill="var(--bg)">Operating System</text>
    <rect x="74.2857" y="166.875" width="137.1429" height="163.125" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="142.8571" y="221.25" text-anchor="middle" fill="var(--bg)" font-size="19.9428">App A</text>
    <text x="142.8571" y="257.5" text-anchor="middle" fill="var(--bg)" font-size="16.619">Dependencies</text>
    <rect x="228.5714" y="166.875" width="137.1429" height="163.125" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="297.1429" y="221.25" text-anchor="middle" fill="var(--bg)" font-size="19.9428">App B</text>
    <text x="297.1429" y="257.5" text-anchor="middle" fill="var(--bg)" font-size="16.619">Dependencies</text>
    <rect x="382.8571" y="166.875" width="137.1429" height="163.125" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="451.4286" y="221.25" text-anchor="middle" fill="var(--bg)" font-size="19.9428">App C</text>
    <text x="451.4286" y="257.5" text-anchor="middle" fill="var(--bg)" font-size="16.619">Dependencies</text>
    <text x="297.1429" y="130.625" text-anchor="middle" font-size="23.2666" fill="var(--danger-accent)">Conflicts!</text>
  </g>
  <g id="docker">
    <rect x="725.7143" y="76.25" width="514.2857" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
    <text x="982.8571" y="40" text-anchor="middle" font-weight="bold">Docker</text>
    <rect x="742.8571" y="493.125" width="480" height="108.75" fill="var(--text-muted)" rx="6"/>
    <text x="982.8571" y="556.5625" text-anchor="middle" fill="var(--bg)">Server</text>
    <rect x="742.8571" y="348.125" width="480" height="126.875" fill="var(--text-faint)" rx="6"/>
    <text x="982.8571" y="420.625" text-anchor="middle" fill="var(--bg)">Operating System</text>
    <rect x="742.8571" y="239.375" width="480" height="90.625" fill="var(--primary-accent)" rx="6"/>
    <text x="982.8571" y="293.75" text-anchor="middle" fill="var(--bg)">Docker Engine</text>
    <rect x="760" y="112.5" width="137.1429" height="108.75" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="828.5714" y="175.9375" text-anchor="middle" fill="var(--bg)" font-size="19.9428">Container A</text>
    <rect x="914.2857" y="112.5" width="137.1429" height="108.75" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="982.8571" y="175.9375" text-anchor="middle" fill="var(--bg)" font-size="19.9428">Container B</text>
    <rect x="1068.5714" y="112.5" width="137.1429" height="108.75" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="1137.1429" y="175.9375" text-anchor="middle" fill="var(--bg)" font-size="19.9428">Container C</text>
  </g>
</svg>
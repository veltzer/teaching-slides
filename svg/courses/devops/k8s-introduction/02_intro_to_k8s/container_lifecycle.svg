<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <circle cx="160" cy="240" r="42.6667" fill="var(--primary-fill)" />
  <text x="160" y="246.8571" text-anchor="middle" fill="var(--bg)">Created</text>
  <circle cx="320" cy="240" r="42.6667" fill="var(--ok-fill)" />
  <text x="320" y="246.8571" text-anchor="middle" fill="var(--bg)">Running</text>
  <circle cx="480" cy="240" r="42.6667" fill="var(--warn-fill)" />
  <text x="480" y="246.8571" text-anchor="middle">Paused</text>
  <circle cx="640" cy="240" r="42.6667" fill="var(--danger-fill)" />
  <text x="640" y="246.8571" text-anchor="middle" fill="var(--bg)">Stopped</text>
  <circle cx="480" cy="384" r="42.6667" fill="var(--text-muted)" />
  <text x="480" y="390.8571" text-anchor="middle" fill="var(--bg)">Removed</text>
  <path d="M 202.6667 240 L 277.3333 240" stroke="var(--text)" stroke-width="2.1333" marker-end="url(#arrow)" />
  <text x="240" y="226.2857" text-anchor="middle" font-size="12.8">start</text>
  <path d="M 362.6667 240 L 437.3333 240" stroke="var(--text)" stroke-width="2.1333" marker-end="url(#arrow)" />
  <text x="400" y="226.2857" text-anchor="middle" font-size="12.8">pause</text>
  <path d="M 480 185.1429 Q 400 137.1429 320 185.1429" stroke="var(--text)" stroke-width="2.1333" marker-end="url(#arrow)" />
  <text x="400" y="130.2857" text-anchor="middle" font-size="12.8">unpause</text>
  <path d="M 522.6667 240 L 597.3333 240" stroke="var(--text)" stroke-width="2.1333" marker-end="url(#arrow)" />
  <text x="560" y="226.2857" text-anchor="middle" font-size="12.8">stop</text>
  <path d="M 640 294.8571 L 522.6667 329.1429" stroke="var(--text)" stroke-width="2.1333" marker-end="url(#arrow)" />
  <text x="581.3333" y="322.2857" text-anchor="middle" font-size="12.8">remove</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
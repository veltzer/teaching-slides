<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="400.00007777778" height="171.851862002744" fill="url(#grad-primary)" rx="7.586538277425" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="239.99980555555" y="104.444551028817" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Docker Client</text>
  <text x="239.99980555555" y="158.148275034306" text-anchor="middle" fill="var(--bg)" font-size="24.872971511757" font-family="Arial, sans-serif">docker build</text>
  <text x="239.99980555555" y="190.370619067241" text-anchor="middle" fill="var(--bg)" font-size="24.872971511757" font-family="Arial, sans-serif">docker run</text>
  <rect x="640" y="40" width="600" height="257.777930041168" fill="url(#grad-ok)" rx="7.586538277425" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="939.999941666665" y="104.444551028817" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Docker Daemon</text>

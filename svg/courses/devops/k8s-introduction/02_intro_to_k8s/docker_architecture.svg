<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="71.3516" width="1200" height="548.6484" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640.0001" y="40" text-anchor="middle" font-size="29.5071" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Docker Architecture</text>
  <rect x="125.7144" y="118.3783" width="342.8572" height="125.4054" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1428" y="165.4054" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Docker Client</text>
  <text x="297.1428" y="204.5946" text-anchor="middle" fill="var(--bg)" font-size="19.6714" font-family="Arial, sans-serif">docker build</text>
  <text x="297.1428" y="228.1082" text-anchor="middle" fill="var(--bg)" font-size="19.6714" font-family="Arial, sans-serif">docker run</text>
  <rect x="640.0001" y="118.3783" width="514.2857" height="188.1082" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="897.1429" y="165.4054" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Docker Daemon</text>
  <text x="897.1429" y="204.5946" text-anchor="middle" fill="var(--bg)" font-size="19.6714" font-family="Arial, sans-serif">Manages Images</text>
  <text x="897.1429" y="235.946" text-anchor="middle" fill="var(--bg)" font-size="19.6714" font-family="Arial, sans-serif">Manages Containers</text>
  <text x="897.1429" y="267.2974" text-anchor="middle" fill="var(--bg)" font-size="19.6714" font-family="Arial, sans-serif">Manages Networks</text>
  <rect x="125.7144" y="384.8649" width="257.1427" height="156.7566" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.286" y="431.892" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Images</text>
  <text x="254.286" y="471.0811" text-anchor="middle" font-size="19.6714" font-family="Arial, sans-serif" fill="var(--warn-text)">Ubuntu</text>
  <text x="254.286" y="502.4326" text-anchor="middle" font-size="19.6714" font-family="Arial, sans-serif" fill="var(--warn-text)">Nginx</text>
  <rect x="468.5716" y="384.8649" width="257.1427" height="156.7566" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="597.1429" y="431.892" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Containers</text>
  <text x="597.1429" y="471.0811" text-anchor="middle" fill="var(--bg)" font-size="19.6714" font-family="Arial, sans-serif">Running Apps</text>
  <text x="597.1429" y="502.4326" text-anchor="middle" fill="var(--bg)" font-size="19.6714" font-family="Arial, sans-serif">Isolated Process</text>
  <rect x="811.4285" y="384.8649" width="342.8572" height="156.7566" fill="url(#grad-info)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.8572" y="431.892" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Registry</text>
  <text x="982.8572" y="471.0811" text-anchor="middle" fill="var(--bg)" font-size="19.6714" font-family="Arial, sans-serif">Docker Hub</text>
  <text x="982.8572" y="502.4326" text-anchor="middle" fill="var(--bg)" font-size="19.6714" font-family="Arial, sans-serif">Private Registry</text>
  <path d="M 468.5716 181.0811 L 631.4285 181.0811" stroke="var(--text-muted)" stroke-width="1.0546" marker-end="url(#arrow)"/>
  <path d="M 897.1429 306.4865 L 254.286 377.0269" stroke="var(--text-muted)" stroke-width="1.0546" marker-end="url(#arrow)"/>
  <path d="M 897.1429 306.4865 L 597.1429 377.0269" stroke="var(--text-muted)" stroke-width="1.0546" marker-end="url(#arrow)"/>
  <path d="M 897.1429 306.4865 L 982.8572 377.0269" stroke="var(--text-muted)" stroke-width="1.0546" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

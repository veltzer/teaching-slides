  <text x="939.999941666665" y="201.111309053518" text-anchor="middle" fill="var(--bg)" font-size="24.872971511757" font-family="Arial, sans-serif">Manages Containers</text>
  <text x="939.999941666665" y="244.074343072729" text-anchor="middle" fill="var(--bg)" font-size="24.872971511757" font-family="Arial, sans-serif">Manages Networks</text>
  <rect x="40" y="405.185378052146" width="299.999824999995" height="214.814621947854" fill="url(#grad-warn)" rx="7.586538277425" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.000204166672" y="469.629929080963" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Images</text>
  <text x="190.000204166672" y="523.333516049402" text-anchor="middle" font-size="24.872971511757" font-family="Arial, sans-serif" fill="var(--warn-text)">Ubuntu</text>
  <text x="190.000204166672" y="566.296687105664" text-anchor="middle" font-size="24.872971511757" font-family="Arial, sans-serif" fill="var(--warn-text)">Nginx</text>
  <rect x="440.00007777778" y="405.185378052146" width="299.999824999995" height="214.814621947854" fill="url(#grad-danger)" rx="7.586538277425" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="589.999931944443" y="469.629929080963" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Containers</text>
  <text x="589.999931944443" y="523.333516049402" text-anchor="middle" fill="var(--bg)" font-size="24.872971511757" font-family="Arial, sans-serif">Running Apps</text>
  <text x="589.999931944443" y="566.296687105664" text-anchor="middle" fill="var(--bg)" font-size="24.872971511757" font-family="Arial, sans-serif">Isolated Process</text>
  <rect x="839.99980555555" y="405.185378052146" width="400.00007777778" height="214.814621947854" fill="url(#grad-info)" rx="7.586538277425" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1039.99996111111" y="469.629929080963" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Registry</text>
  <text x="1039.99996111111" y="523.333516049402" text-anchor="middle" fill="var(--bg)" font-size="24.872971511757" font-family="Arial, sans-serif">Docker Hub</text>
  <text x="1039.99996111111" y="566.296687105664" text-anchor="middle" fill="var(--bg)" font-size="24.872971511757" font-family="Arial, sans-serif">Private Registry</text>
  <path d="M 440.00007777778 125.926068038422 L 629.999799722217 125.926068038422" stroke="var(--text-muted)" stroke-width="1.0546" marker-end="url(#arrow)"/>
  <path d="M 939.999941666665 297.777930041168 L 190.000204166672 394.444413991766" stroke="var(--text-muted)" stroke-width="1.0546" marker-end="url(#arrow)"/>
  <path d="M 939.999941666665 297.777930041168 L 589.999931944443 394.444413991766" stroke="var(--text-muted)" stroke-width="1.0546" marker-end="url(#arrow)"/>
  <path d="M 939.999941666665 297.777930041168 L 1039.99996111111 394.444413991766" stroke="var(--text-muted)" stroke-width="1.0546" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

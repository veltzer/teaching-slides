<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="71.1111" y="80" width="426.6667" height="480" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="284.4444" y="48" text-anchor="middle" font-weight="bold">Docker</text>
  <rect x="106.6667" y="240" width="355.5556" height="240" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="284.4444" y="288" text-anchor="middle" fill="var(--bg)">Container Runtime</text>
  <text x="284.4444" y="336" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Build images</text>
  <text x="284.4444" y="376" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Run containers</text>
  <text x="284.4444" y="416" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Manage storage</text>
  <text x="284.4444" y="456" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Handle networking</text>
  <rect x="640" y="80" width="426.6667" height="480" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="853.3333" y="48" text-anchor="middle" font-weight="bold">Kubernetes</text>
  <rect x="675.5556" y="240" width="355.5556" height="240" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="853.3333" y="288" text-anchor="middle" fill="var(--bg)">Orchestration</text>
  <text x="853.3333" y="336" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Schedule containers</text>
  <text x="853.3333" y="376" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Scale applications</text>
  <text x="853.3333" y="416" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Load balancing</text>
  <text x="853.3333" y="456" text-anchor="middle" fill="var(--bg)" font-size="17.0667">• Self-healing</text>
  <path d="M 497.7778 360 L 640 360" stroke="var(--text-muted)" stroke-width="4.2667" marker-end="url(#arrow)" />
  <text x="568.8889" y="344" text-anchor="middle" font-size="17.0667">Orchestrates</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#666" />
    </marker>
  </defs>
</svg>
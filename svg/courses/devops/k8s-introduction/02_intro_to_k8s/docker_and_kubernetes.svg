<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="480" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="320" y="54" text-anchor="middle" font-weight="bold">Docker</text>
  <rect x="120" y="270" width="400" height="270" fill="#4285f4" rx="8" />
  <text x="320" y="324" text-anchor="middle" fill="white">Container Runtime</text>
  <text x="320" y="378" text-anchor="middle" fill="white" font-size="19.2">• Build images</text>
  <text x="320" y="423" text-anchor="middle" fill="white" font-size="19.2">• Run containers</text>
  <text x="320" y="468" text-anchor="middle" fill="white" font-size="19.2">• Manage storage</text>
  <text x="320" y="513" text-anchor="middle" fill="white" font-size="19.2">• Handle networking</text>
  <rect x="720" y="90" width="480" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="960" y="54" text-anchor="middle" font-weight="bold">Kubernetes</text>
  <rect x="760" y="270" width="400" height="270" fill="#326ce5" rx="8" />
  <text x="960" y="324" text-anchor="middle" fill="white">Orchestration</text>
  <text x="960" y="378" text-anchor="middle" fill="white" font-size="19.2">• Schedule containers</text>
  <text x="960" y="423" text-anchor="middle" fill="white" font-size="19.2">• Scale applications</text>
  <text x="960" y="468" text-anchor="middle" fill="white" font-size="19.2">• Load balancing</text>
  <text x="960" y="513" text-anchor="middle" fill="white" font-size="19.2">• Self-healing</text>
  <path d="M 560 405 L 720 405" stroke="#666" stroke-width="4.8" marker-end="url(#arrowhead)" />
  <text x="640" y="387" text-anchor="middle" font-size="19.2">Orchestrates</text>
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#666" />
    </marker>
  </defs>
</svg>
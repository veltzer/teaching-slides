  <ns0:rect x="71.1111" y="80" width="426.6667" height="480" fill="#f0f0f0" stroke="#333" stroke-width="2.8444" />
  <ns0:text x="284.4444" y="48" text-anchor="middle" font-weight="bold">Docker</ns0:text>
  <ns0:rect x="106.6667" y="240" width="355.5556" height="240" fill="#4285f4" rx="7.1111" />
  <ns0:text x="284.4444" y="288" text-anchor="middle" fill="white">Container Runtime</ns0:text>
  <ns0:text x="284.4444" y="336" text-anchor="middle" fill="white" font-size="17.0667">• Build images</ns0:text>
  <ns0:text x="284.4444" y="376" text-anchor="middle" fill="white" font-size="17.0667">• Run containers</ns0:text>
  <ns0:text x="284.4444" y="416" text-anchor="middle" fill="white" font-size="17.0667">• Manage storage</ns0:text>
  <ns0:text x="284.4444" y="456" text-anchor="middle" fill="white" font-size="17.0667">• Handle networking</ns0:text>
  <ns0:rect x="640" y="80" width="426.6667" height="480" fill="#f0f0f0" stroke="#333" stroke-width="2.8444" />
  <ns0:text x="853.3333" y="48" text-anchor="middle" font-weight="bold">Kubernetes</ns0:text>
  <ns0:rect x="675.5556" y="240" width="355.5556" height="240" fill="#326ce5" rx="7.1111" />
  <ns0:text x="853.3333" y="288" text-anchor="middle" fill="white">Orchestration</ns0:text>
  <ns0:text x="853.3333" y="336" text-anchor="middle" fill="white" font-size="17.0667">• Schedule containers</ns0:text>
  <ns0:text x="853.3333" y="376" text-anchor="middle" fill="white" font-size="17.0667">• Scale applications</ns0:text>
  <ns0:text x="853.3333" y="416" text-anchor="middle" fill="white" font-size="17.0667">• Load balancing</ns0:text>
  <ns0:text x="853.3333" y="456" text-anchor="middle" fill="white" font-size="17.0667">• Self-healing</ns0:text>

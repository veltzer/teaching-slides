<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="76.25" width="514.2857" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="297.1428" y="40" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Docker</text>
  <rect x="82.8572" y="257.5" width="428.5715" height="271.875" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1428" y="311.875" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Container Runtime</text>
  <text x="297.1428" y="366.25" text-anchor="middle" fill="var(--bg)" font-size="19.9428" font-family="Arial, sans-serif">• Build images</text>
  <text x="297.1428" y="411.5625" text-anchor="middle" fill="var(--bg)" font-size="19.9428" font-family="Arial, sans-serif">• Run containers</text>
  <text x="297.1428" y="456.875" text-anchor="middle" fill="var(--bg)" font-size="19.9428" font-family="Arial, sans-serif">• Manage storage</text>
  <text x="297.1428" y="502.1875" text-anchor="middle" fill="var(--bg)" font-size="19.9428" font-family="Arial, sans-serif">• Handle networking</text>
  <rect x="725.7143" y="76.25" width="514.2857" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="982.8571" y="40" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Kubernetes</text>
  <rect x="768.5715" y="257.5" width="428.5715" height="271.875" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.8571" y="311.875" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Orchestration</text>
  <text x="982.8571" y="366.25" text-anchor="middle" fill="var(--bg)" font-size="19.9428" font-family="Arial, sans-serif">• Schedule containers</text>
  <text x="982.8571" y="411.5625" text-anchor="middle" fill="var(--bg)" font-size="19.9428" font-family="Arial, sans-serif">• Scale applications</text>
  <text x="982.8571" y="456.875" text-anchor="middle" fill="var(--bg)" font-size="19.9428" font-family="Arial, sans-serif">• Load balancing</text>
  <text x="982.8571" y="502.1875" text-anchor="middle" fill="var(--bg)" font-size="19.9428" font-family="Arial, sans-serif">• Self-healing</text>
  <path d="M 554.2857 393.4375 L 725.7143 393.4375" stroke="var(--text-muted)" stroke-width="4.2667" marker-end="url(#arrow)" />
  <text x="640" y="375.3125" text-anchor="middle" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--text)">Orchestrates</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
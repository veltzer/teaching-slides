<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Docker Storage Types</text>
  <g id="bind">
    <rect x="160" y="144" width="320" height="216" fill="#4285f4" rx="8" />
    <text x="320" y="198" text-anchor="middle" fill="white" font-weight="bold">Bind Mounts</text>
    <rect x="192" y="234" width="256" height="90" fill="#fff" rx="4.8" />
    <text x="320" y="270" text-anchor="middle" font-size="19.2">Host Path:</text>
    <text x="320" y="306" text-anchor="middle" font-size="17.6">/host/path:/container/path</text>
  </g>
  <g id="volume">
    <rect x="560" y="144" width="320" height="216" fill="#34a853" rx="8" />
    <text x="720" y="198" text-anchor="middle" fill="white" font-weight="bold">Docker Volumes</text>
    <rect x="592" y="234" width="256" height="90" fill="#fff" rx="4.8" />
    <text x="720" y="270" text-anchor="middle" font-size="19.2">Managed by Docker</text>
    <text x="720" y="306" text-anchor="middle" font-size="17.6">volume_name:/path</text>
  </g>
  <g id="tmpfs">
    <rect x="960" y="144" width="224" height="216" fill="#fbbc04" rx="8" />
    <text x="1072" y="198" text-anchor="middle" font-weight="bold">tmpfs</text>
    <rect x="976" y="234" width="192" height="90" fill="#fff" rx="4.8" />
    <text x="1072" y="270" text-anchor="middle" font-size="19.2">Memory only</text>
    <text x="1072" y="306" text-anchor="middle" font-size="17.6">Temporary</text>
  </g>
  <rect x="160" y="414" width="1024" height="144" fill="#e3f2fd" rx="8" />
  <text x="672" y="459" text-anchor="middle" font-weight="bold">Container Filesystem</text>
  <text x="672" y="504" text-anchor="middle" font-size="19.2">Writable layer (ephemeral)</text>
  <text x="672" y="540" text-anchor="middle" font-size="19.2">Lost when container removed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <g id="bind">
    <rect x="40" y="40" width="374.999938476565" height="302.608695652174" fill="url(#grad-primary)" rx="7.401527312367" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="227.50002392578" y="115.652173913043" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Bind Mounts</text>
    <rect x="77.499982910157" y="166.086956521739" width="299.999972656251" height="126.086956521739" fill="var(--bg)" rx="7.401527312367"/>
    <text x="227.50002392578" y="216.521739130434" text-anchor="middle" font-size="24.601196480844" font-family="Arial, sans-serif" fill="var(--primary-text)">Host Path:</text>
    <text x="227.50002392578" y="266.95652173913" text-anchor="middle" font-size="22.551096774107" font-family="Arial, sans-serif" fill="var(--primary-text)">/host/path:/container/path</text>
  </g>
  <g id="volume">
    <rect x="508.749950439455" y="40" width="374.999938476565" height="302.608695652174" fill="url(#grad-ok)" rx="7.401527312367" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="696.249974365235" y="115.652173913043" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Docker Volumes</text>
    <rect x="546.249933349612" y="166.086956521739" width="299.999972656251" height="126.086956521739" fill="var(--bg)" rx="7.401527312367"/>
    <text x="696.249974365235" y="216.521739130434" text-anchor="middle" font-size="24.601196480844" font-family="Arial, sans-serif" fill="var(--ok-text)">Managed by Docker</text>
    <text x="696.249974365235" y="266.95652173913" text-anchor="middle" font-size="22.551096774107" font-family="Arial, sans-serif" fill="var(--ok-text)">volume_name:/path</text>
  </g>
  <g id="tmpfs">
    <rect x="977.49990087891" y="40" width="262.499989746094" height="302.608695652174" fill="url(#grad-warn)" rx="7.401527312367" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="1108.749895751957" y="115.652173913043" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">tmpfs</text>
    <rect x="996.249947021486" y="166.086956521739" width="225.000006835937" height="126.086956521739" fill="var(--bg)" rx="7.401527312367"/>
    <text x="1108.749895751957" y="216.521739130434" text-anchor="middle" font-size="24.601196480844" font-family="Arial, sans-serif" fill="var(--warn-text)">Memory only</text>
    <text x="1108.749895751957" y="266.95652173913" text-anchor="middle" font-size="22.551096774107" font-family="Arial, sans-serif" fill="var(--warn-text)">Temporary</text>
  </g>
  <rect x="40" y="418.260869565217" width="1200" height="201.739130434783" fill="url(#grad-primary)" rx="7.401527312367" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999945312502" y="481.304347826086" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Container Filesystem</text>
  <text x="639.999945312502" y="544.347826086957" text-anchor="middle" font-size="24.601196480844" font-family="Arial, sans-serif" fill="var(--primary-text)">Writable layer (ephemeral)</text>
  <text x="639.999945312502" y="594.782608695651" text-anchor="middle" font-size="24.601196480844" font-family="Arial, sans-serif" fill="var(--primary-text)">Lost when container removed</text>
</svg>

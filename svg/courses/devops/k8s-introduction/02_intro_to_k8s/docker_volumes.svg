<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Docker Storage Types</text>
  <g id="bind">
    <rect x="160" y="144" width="320" height="216" fill="#4285f4" rx="8" />
    <text x="320" y="198" text-anchor="middle" fill="white" font-weight="bold">Bind Mounts</text>
    <rect x="192" y="234" width="256" height="90" fill="#fff" rx="4.8" />
    <text x="320" y="270" text-anchor="middle" font-size="19.2">Host Path:</text>
    <text x="320" y="306" text-anchor="middle" font-size="17.6">/host/path:/container/path</text>
  </g>
  <g id="volume">
    <rect x="560" y="144" width="320" height="216" fill="#34a853" rx="8" />
    <text x="720" y="198" text-anchor="middle" fill="white" font-weight="bold">Docker Volumes</text>
    <rect x="592" y="234" width="256" height="90" fill="#fff" rx="4.8" />
    <text x="720" y="270" text-anchor="middle" font-size="19.2">Managed by Docker</text>
    <text x="720" y="306" text-anchor="middle" font-size="17.6">volume_name:/path</text>
  </g>
  <g id="tmpfs">
    <rect x="960" y="144" width="224" height="216" fill="#fbbc04" rx="8" />
    <text x="1072" y="198" text-anchor="middle" font-weight="bold">tmpfs</text>
    <rect x="976" y="234" width="192" height="90" fill="#fff" rx="4.8" />
    <text x="1072" y="270" text-anchor="middle" font-size="19.2">Memory only</text>
    <text x="1072" y="306" text-anchor="middle" font-size="17.6">Temporary</text>
  </g>
  <rect x="160" y="414" width="1024" height="144" fill="#e3f2fd" rx="8" />
  <text x="672" y="459" text-anchor="middle" font-weight="bold">Container Filesystem</text>
  <text x="672" y="504" text-anchor="middle" font-size="19.2">Writable layer (ephemeral)</text>
  <text x="672" y="540" text-anchor="middle" font-size="19.2">Lost when container removed</text>
</svg>
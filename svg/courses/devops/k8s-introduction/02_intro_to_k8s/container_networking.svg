<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="76.25" width="1200" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640" y="40" text-anchor="middle" font-size="29.9142" font-weight="bold">Docker Network Types</text>
  <rect x="125.7143" y="130.625" width="257.1429" height="181.25" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.2857" y="185" text-anchor="middle" fill="var(--bg)" font-weight="bold">Bridge</text>
  <text x="254.2857" y="221.25" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Default network</text>
  <text x="254.2857" y="257.5" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Containers can</text>
  <text x="254.2857" y="293.75" text-anchor="middle" fill="var(--bg)" font-size="18.2809">communicate</text>
  <rect x="425.7143" y="130.625" width="257.1429" height="181.25" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="554.2857" y="185" text-anchor="middle" fill="var(--bg)" font-weight="bold">Host</text>
  <text x="554.2857" y="221.25" text-anchor="middle" fill="var(--bg)" font-size="18.2809">No isolation</text>
  <text x="554.2857" y="257.5" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Share host</text>
  <text x="554.2857" y="293.75" text-anchor="middle" fill="var(--bg)" font-size="18.2809">network</text>
  <rect x="725.7143" y="130.625" width="257.1429" height="181.25" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="854.2857" y="185" text-anchor="middle" font-weight="bold">None</text>
  <text x="854.2857" y="221.25" text-anchor="middle" font-size="18.2809">No networking</text>
  <text x="854.2857" y="257.5" text-anchor="middle" font-size="18.2809">Complete</text>
  <text x="854.2857" y="293.75" text-anchor="middle" font-size="18.2809">isolation</text>
  <rect x="1025.7143" y="130.625" width="214.2857" height="181.25" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132" y="185" text-anchor="middle" fill="var(--bg)" font-weight="bold">Custom</text>
  <text x="1132" y="221.25" text-anchor="middle" fill="var(--bg)" font-size="18.2809">User-defined</text>
  <text x="1132" y="257.5" text-anchor="middle" fill="var(--bg)" font-size="18.2809">bridges</text>
  <rect x="125.7143" y="384.375" width="1114.2857" height="181.25" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="682.8571" y="438.75" text-anchor="middle" font-weight="bold">Container Network</text>
  <rect x="255.595" y="451.578" width="83.0948" height="83.0948" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="297.1429" y="502.1875" text-anchor="middle" fill="var(--bg)" font-size="19.9428">C1</text>
  <rect x="427.024" y="451.578" width="83.0948" height="83.0948" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="468.5714" y="502.1875" text-anchor="middle" fill="var(--bg)" font-size="19.9428">C2</text>
  <rect x="598.453" y="451.578" width="83.0948" height="83.0948" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="640" y="502.1875" text-anchor="middle" fill="var(--bg)" font-size="19.9428">C3</text>
  <line x1="340" y1="493.125" x2="425.7143" y2="493.125" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="511.4286" y1="493.125" x2="597.1429" y2="493.125" stroke="var(--text-muted)" stroke-width="2" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.196773353932"/>
  <rect x="125.7143" y="98" width="257.1429" height="193.333333333333" fill="url(#grad-primary)" rx="6.196773353932" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.2857" y="156" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Bridge</text>
  <text x="254.2857" y="194.666666666667" text-anchor="middle" fill="var(--bg)" font-size="18.880432334316" font-family="Arial, sans-serif">Default network</text>
  <text x="254.2857" y="233.333333333333" text-anchor="middle" fill="var(--bg)" font-size="18.880432334316" font-family="Arial, sans-serif">Containers can</text>
  <text x="254.2857" y="272" text-anchor="middle" fill="var(--bg)" font-size="18.880432334316" font-family="Arial, sans-serif">communicate</text>
  <rect x="425.7143" y="98" width="257.1429" height="193.333333333333" fill="url(#grad-ok)" rx="6.196773353932" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="554.2857" y="156" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Host</text>
  <text x="554.2857" y="194.666666666667" text-anchor="middle" fill="var(--bg)" font-size="18.880432334316" font-family="Arial, sans-serif">No isolation</text>
  <text x="554.2857" y="233.333333333333" text-anchor="middle" fill="var(--bg)" font-size="18.880432334316" font-family="Arial, sans-serif">Share host</text>
  <text x="554.2857" y="272" text-anchor="middle" fill="var(--bg)" font-size="18.880432334316" font-family="Arial, sans-serif">network</text>
  <rect x="725.7143" y="98" width="257.1429" height="193.333333333333" fill="url(#grad-warn)" rx="6.196773353932" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="854.2857" y="156" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">None</text>
  <text x="854.2857" y="194.666666666667" text-anchor="middle" font-size="18.880432334316" font-family="Arial, sans-serif" fill="var(--warn-text)">No networking</text>
  <text x="854.2857" y="233.333333333333" text-anchor="middle" font-size="18.880432334316" font-family="Arial, sans-serif" fill="var(--warn-text)">Complete</text>
  <text x="854.2857" y="272" text-anchor="middle" font-size="18.880432334316" font-family="Arial, sans-serif" fill="var(--warn-text)">isolation</text>
  <rect x="1025.7143" y="98" width="214.2857" height="193.333333333333" fill="url(#grad-danger)" rx="6.196773353932" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132" y="156" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Custom</text>
  <text x="1132" y="194.666666666667" text-anchor="middle" fill="var(--bg)" font-size="18.880432334316" font-family="Arial, sans-serif">User-defined</text>
  <text x="1132" y="233.333333333333" text-anchor="middle" fill="var(--bg)" font-size="18.880432334316" font-family="Arial, sans-serif">bridges</text>
  <rect x="125.7143" y="368.666666666667" width="1114.2857" height="193.333333333333" fill="url(#grad-ok)" rx="6.196773353932" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="682.8571" y="426.666666666667" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Container Network</text>
  <rect x="255.595" y="440.349866666667" width="83.0948" height="88.634453333333" rx="14.459137825841" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="297.1429" y="494.333333333333" text-anchor="middle" fill="var(--bg)" font-size="20.596835273799" font-family="Arial, sans-serif">C1</text>
  <rect x="427.024" y="440.349866666667" width="83.0948" height="88.634453333333" rx="14.459137825841" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="468.5714" y="494.333333333333" text-anchor="middle" fill="var(--bg)" font-size="20.596835273799" font-family="Arial, sans-serif">C2</text>
  <rect x="598.453" y="440.349866666667" width="83.0948" height="88.634453333333" rx="14.459137825841" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="494.333333333333" text-anchor="middle" fill="var(--bg)" font-size="20.596835273799" font-family="Arial, sans-serif">C3</text>
  <line x1="340" y1="484.666666666667" x2="425.7143" y2="484.666666666667" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="511.4286" y1="484.666666666667" x2="597.1429" y2="484.666666666667" stroke="var(--text-muted)" stroke-width="2"/>
</svg>

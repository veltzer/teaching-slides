<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="276.92312662722" height="241.666666666666" fill="url(#grad-primary)" rx="7.189736320272" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="178.461509467455" y="112.5" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Bridge</text>
  <text x="178.461509467455" y="160.833333333334" text-anchor="middle" fill="var(--bg)" font-size="21.905808449542" font-family="Arial, sans-serif">Default network</text>
  <text x="178.461509467455" y="209.166666666666" text-anchor="middle" fill="var(--bg)" font-size="21.905808449542" font-family="Arial, sans-serif">Containers can</text>
  <text x="178.461509467455" y="257.5" text-anchor="middle" fill="var(--bg)" font-size="21.905808449542" font-family="Arial, sans-serif">communicate</text>
  <rect x="363.076927218935" y="40" width="276.92312662722" height="241.666666666666" fill="url(#grad-ok)" rx="7.189736320272" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.53843668639" y="112.5" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Host</text>
  <text x="501.53843668639" y="160.833333333334" text-anchor="middle" fill="var(--bg)" font-size="21.905808449542" font-family="Arial, sans-serif">No isolation</text>
  <text x="501.53843668639" y="209.166666666666" text-anchor="middle" fill="var(--bg)" font-size="21.905808449542" font-family="Arial, sans-serif">Share host</text>
  <text x="501.53843668639" y="257.5" text-anchor="middle" fill="var(--bg)" font-size="21.905808449542" font-family="Arial, sans-serif">network</text>
  <rect x="686.15385443787" y="40" width="276.92312662722" height="241.666666666666" fill="url(#grad-warn)" rx="7.189736320272" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="824.615363905325" y="112.5" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">None</text>
  <text x="824.615363905325" y="160.833333333334" text-anchor="middle" font-size="21.905808449542" font-family="Arial, sans-serif" fill="var(--warn-text)">No networking</text>
  <text x="824.615363905325" y="209.166666666666" text-anchor="middle" font-size="21.905808449542" font-family="Arial, sans-serif" fill="var(--warn-text)">Complete</text>
  <text x="824.615363905325" y="257.5" text-anchor="middle" font-size="21.905808449542" font-family="Arial, sans-serif" fill="var(--warn-text)">isolation</text>
  <rect x="1009.230781656805" y="40" width="230.769218343195" height="241.666666666666" fill="url(#grad-danger)" rx="7.189736320272" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1123.692306201184" y="112.5" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Custom</text>
  <text x="1123.692306201184" y="160.833333333334" text-anchor="middle" fill="var(--bg)" font-size="21.905808449542" font-family="Arial, sans-serif">User-defined</text>
  <text x="1123.692306201184" y="209.166666666666" text-anchor="middle" fill="var(--bg)" font-size="21.905808449542" font-family="Arial, sans-serif">bridges</text>
  <rect x="40" y="378.333333333334" width="1200" height="241.666666666666" fill="url(#grad-ok)" rx="7.189736320272" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999946153845" y="450.833333333334" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Container Network</text>
  <rect x="179.871524870148" y="467.937333333334" width="89.486708839573" height="110.793066666666" rx="16.776051413967" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="224.61541775148" y="535.416666666666" text-anchor="middle" fill="var(--bg)" font-size="23.897245581318" font-family="Arial, sans-serif">C1</text>
  <rect x="364.487373390864" y="467.937333333334" width="89.486708839573" height="110.793066666666" rx="16.776051413967" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="409.23072781065" y="535.416666666666" text-anchor="middle" fill="var(--bg)" font-size="23.897245581318" font-family="Arial, sans-serif">C2</text>
  <rect x="549.10322191158" y="467.937333333334" width="89.486708839573" height="110.793066666666" rx="16.776051413967" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="593.84614556213" y="535.416666666666" text-anchor="middle" fill="var(--bg)" font-size="23.897245581318" font-family="Arial, sans-serif">C3</text>
  <line x1="270.769218343195" y1="523.333333333334" x2="363.076927218935" y2="523.333333333334" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="455.384636094675" y1="523.333333333334" x2="547.692344970415" y2="523.333333333334" stroke="var(--text-muted)" stroke-width="2"/>
</svg>

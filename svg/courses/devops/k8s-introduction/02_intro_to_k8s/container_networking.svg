<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Docker Network Types</text>
  <rect x="160" y="144" width="240" height="180" fill="#4285f4" rx="8" />
  <text x="280" y="198" text-anchor="middle" fill="white" font-weight="bold">Bridge</text>
  <text x="280" y="234" text-anchor="middle" fill="white" font-size="17.6">Default network</text>
  <text x="280" y="270" text-anchor="middle" fill="white" font-size="17.6">Containers can</text>
  <text x="280" y="306" text-anchor="middle" fill="white" font-size="17.6">communicate</text>
  <rect x="440" y="144" width="240" height="180" fill="#34a853" rx="8" />
  <text x="560" y="198" text-anchor="middle" fill="white" font-weight="bold">Host</text>
  <text x="560" y="234" text-anchor="middle" fill="white" font-size="17.6">No isolation</text>
  <text x="560" y="270" text-anchor="middle" fill="white" font-size="17.6">Share host</text>
  <text x="560" y="306" text-anchor="middle" fill="white" font-size="17.6">network</text>
  <rect x="720" y="144" width="240" height="180" fill="#fbbc04" rx="8" />
  <text x="840" y="198" text-anchor="middle" font-weight="bold">None</text>
  <text x="840" y="234" text-anchor="middle" font-size="17.6">No networking</text>
  <text x="840" y="270" text-anchor="middle" font-size="17.6">Complete</text>
  <text x="840" y="306" text-anchor="middle" font-size="17.6">isolation</text>
  <rect x="1000" y="144" width="200" height="180" fill="#ea4335" rx="8" />
  <text x="1099.2" y="198" text-anchor="middle" fill="white" font-weight="bold">Custom</text>
  <text x="1099.2" y="234" text-anchor="middle" fill="white" font-size="17.6">User-defined</text>
  <text x="1099.2" y="270" text-anchor="middle" fill="white" font-size="17.6">bridges</text>
  <rect x="160" y="396" width="1040" height="180" fill="#e8f5e9" rx="8" />
  <text x="680" y="450" text-anchor="middle" font-weight="bold">Container Network</text>
  <circle cx="320" cy="504" r="40" fill="#4285f4" />
  <text x="320" y="513" text-anchor="middle" fill="white" font-size="19.2">C1</text>
  <circle cx="480" cy="504" r="40" fill="#4285f4" />
  <text x="480" y="513" text-anchor="middle" fill="white" font-size="19.2">C2</text>
  <circle cx="640" cy="504" r="40" fill="#4285f4" />
  <text x="640" y="513" text-anchor="middle" fill="white" font-size="19.2">C3</text>
  <line x1="360" y1="504" x2="440" y2="504" stroke="#666" stroke-width="3.2" />
  <line x1="520" y1="504" x2="600" y2="504" stroke="#666" stroke-width="3.2" />
</svg>
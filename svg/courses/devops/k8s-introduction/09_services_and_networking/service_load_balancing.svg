<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="80" text-anchor="middle" font-size="29.6297" font-weight="bold">Load Balancing Algorithms</text>
  <rect x="84.4444" y="142.5001" width="1111.1111" height="166.6667" fill="var(--primary-fill)" rx="9.5486" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="205.0001" text-anchor="middle" fill="var(--bg)" font-weight="bold">Service: my-app</text>
  <text x="640" y="257.0835" text-anchor="middle" fill="var(--bg)">ClusterIP: 10.96.10.20</text>
  <g id="rr">
    <text x="269.6297" y="371.6668" text-anchor="middle" font-weight="bold">Round Robin (Default)</text>
    <circle cx="177.0372" cy="475.8334" r="46.2963" fill="var(--ok-fill)" />
    <text x="177.0372" y="486.2501" text-anchor="middle" fill="var(--bg)">Pod 1</text>
    <circle cx="269.6297" cy="475.8334" r="46.2963" fill="var(--ok-fill)" />
    <text x="269.6297" y="486.2501" text-anchor="middle" fill="var(--bg)">Pod 2</text>
    <circle cx="362.2223" cy="475.8334" r="46.2963" fill="var(--ok-fill)" />
    <text x="362.2223" y="486.2501" text-anchor="middle" fill="var(--bg)">Pod 3</text>
    <path d="M 269.6297 309.1667 L 177.0372 423.75" stroke="var(--text-muted)" stroke-width="2.3273" />
    <path d="M 269.6297 309.1667 L 269.6297 423.75" stroke="var(--text-muted)" stroke-width="2.3273" />
    <path d="M 269.6297 309.1667 L 362.2223 423.75" stroke="var(--text-muted)" stroke-width="2.3273" />
    <text x="269.6297" y="580" text-anchor="middle" font-size="20.3704">1→2→3→1→2→3...</text>
  </g>
  <g id="session">
    <text x="917.7779" y="371.6668" text-anchor="middle" font-weight="bold">Session Affinity</text>
    <circle cx="825.1853" cy="475.8334" r="46.2963" fill="var(--warn-fill)" />
    <text x="825.1853" y="486.2501" text-anchor="middle">Pod 1</text>
    <circle cx="917.7779" cy="475.8334" r="46.2963" fill="var(--text-faint)" />
    <text x="917.7779" y="486.2501" text-anchor="middle" fill="var(--bg)">Pod 2</text>
    <circle cx="1010.3704" cy="475.8334" r="46.2963" fill="var(--text-faint)" />
    <text x="1010.3704" y="486.2501" text-anchor="middle" fill="var(--bg)">Pod 3</text>
    <path d="M 917.7779 309.1667 L 825.1853 423.75" stroke="var(--text-muted)" stroke-width="3.4909" />
    <text x="917.7779" y="580" text-anchor="middle" font-size="20.3704">Client → Same Pod</text>
  </g>
</svg>
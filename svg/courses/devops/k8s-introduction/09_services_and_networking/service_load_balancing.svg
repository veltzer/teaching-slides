<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Load Balancing Algorithms</text>
  <rect x="160" y="108" width="960" height="144" fill="#4285f4" rx="8" />
  <text x="640" y="162" text-anchor="middle" fill="white" font-weight="bold">Service: my-app</text>
  <text x="640" y="207" text-anchor="middle" fill="white">ClusterIP: 10.96.10.20</text>
  <g id="rr">
    <text x="320" y="306" text-anchor="middle" font-weight="bold">Round Robin (Default)</text>
    <circle cx="240" cy="396" r="40" fill="#34a853" />
    <text x="240" y="405" text-anchor="middle" fill="white">Pod 1</text>
    <circle cx="320" cy="396" r="40" fill="#34a853" />
    <text x="320" y="405" text-anchor="middle" fill="white">Pod 2</text>
    <circle cx="400" cy="396" r="40" fill="#34a853" />
    <text x="400" y="405" text-anchor="middle" fill="white">Pod 3</text>
    <path d="M 320 252 L 240 351" stroke="#666" stroke-width="3.2" />
    <path d="M 320 252 L 320 351" stroke="#666" stroke-width="3.2" />
    <path d="M 320 252 L 400 351" stroke="#666" stroke-width="3.2" />
    <text x="320" y="486" text-anchor="middle" font-size="17.6">1→2→3→1→2→3...</text>
  </g>
  <g id="session">
    <text x="880" y="306" text-anchor="middle" font-weight="bold">Session Affinity</text>
    <circle cx="800" cy="396" r="40" fill="#fbbc04" />
    <text x="800" y="405" text-anchor="middle">Pod 1</text>
    <circle cx="880" cy="396" r="40" fill="#888" />
    <text x="880" y="405" text-anchor="middle" fill="white">Pod 2</text>
    <circle cx="960" cy="396" r="40" fill="#888" />
    <text x="960" y="405" text-anchor="middle" fill="white">Pod 3</text>
    <path d="M 880 252 L 800 351" stroke="#666" stroke-width="4.8" />
    <text x="880" y="486" text-anchor="middle" font-size="17.6">Client → Same Pod</text>
  </g>
</svg>
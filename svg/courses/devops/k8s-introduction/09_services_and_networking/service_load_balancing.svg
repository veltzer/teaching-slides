<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="33.1641" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Load Balancing Algorithms</text>
  <rect x="40" y="112.5001" width="1200" height="193.3334" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="185" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Service: my-app</text>
  <text x="640" y="245.4169" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">ClusterIP: 10.96.10.20</text>
  <g id="rr">
    <text x="240.0001" y="378.3334" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Round Robin (Default)</text>
    <rect x="88.1815" y="447.348" width="103.638" height="103.638" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
    <text x="140.0003" y="511.25" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Pod 1</text>
    <rect x="188.181" y="447.348" width="103.638" height="103.638" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
    <text x="240.0001" y="511.25" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Pod 2</text>
    <rect x="288.181" y="447.348" width="103.638" height="103.638" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
    <text x="340.0001" y="511.25" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Pod 3</text>
    <path d="M 240.0001 305.8333 L 140.0003 438.7499" stroke="var(--text-muted)" stroke-width="1.1317"/>
    <path d="M 240.0001 305.8333 L 240.0001 438.7499" stroke="var(--text-muted)" stroke-width="1.1317"/>
    <path d="M 240.0001 305.8333 L 340.0001 438.7499" stroke="var(--text-muted)" stroke-width="1.1317"/>
    <text x="240.0001" y="620" text-anchor="middle" font-size="22.8003" font-family="Arial, sans-serif" fill="var(--text)">1→2→3→1→2→3...</text>
  </g>
  <g id="session">
    <text x="940.0002" y="378.3334" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Session Affinity</text>
    <rect x="788.181" y="447.348" width="103.638" height="103.638" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
    <text x="840.0002" y="511.25" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod 1</text>
    <rect x="888.181" y="447.348" width="103.638" height="103.638" rx="14" fill="var(--text-faint)"/>
    <text x="940.0002" y="511.25" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Pod 2</text>
    <rect x="988.181" y="447.348" width="103.638" height="103.638" rx="14" fill="var(--text-faint)"/>
    <text x="1040.0001" y="511.25" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Pod 3</text>
    <path d="M 940.0002 305.8333 L 840.0002 438.7499" stroke="var(--text-muted)" stroke-width="1.6975"/>
    <text x="940.0002" y="620" text-anchor="middle" font-size="22.8003" font-family="Arial, sans-serif" fill="var(--text)">Client → Same Pod</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Problem: Pod IPs are Ephemeral</text>
  <g id="without-service">
    <text x="320" y="126" text-anchor="middle" font-size="19.2">Without Service</text>
    <rect x="160" y="162" width="160" height="72" fill="#888" rx="4.8" />
    <text x="240" y="207" text-anchor="middle" fill="white">Client</text>
    <circle cx="240" cy="360" r="40" fill="#ea4335" />
    <text x="240" y="369" text-anchor="middle" fill="white" font-size="16">Pod</text>
    <text x="240" y="423" text-anchor="middle" font-size="16">10.1.1.5 ❌</text>
    <circle cx="368" cy="360" r="40" fill="#34a853" />
    <text x="368" y="369" text-anchor="middle" fill="white" font-size="16">Pod</text>
    <text x="368" y="423" text-anchor="middle" font-size="16">10.1.1.6 ✓</text>
    <path d="M 240 234 L 240 315" stroke="#666" stroke-width="3.2" stroke-dasharray="8 8" />
    <text x="240" y="504" text-anchor="middle" font-size="17.6">Direct connection fails</text>
  </g>
  <g id="with-service">
    <text x="960" y="126" text-anchor="middle" font-size="19.2">With Service</text>
    <rect x="800" y="162" width="160" height="72" fill="#888" rx="4.8" />
    <text x="880" y="207" text-anchor="middle" fill="white">Client</text>
    <rect x="768" y="288" width="224" height="72" fill="#4285f4" rx="4.8" />
    <text x="880" y="333" text-anchor="middle" fill="white">Service</text>
    <circle cx="800" cy="468" r="40" fill="#ea4335" />
    <text x="800" y="477" text-anchor="middle" fill="white" font-size="16">Pod</text>
    <text x="800" y="531" text-anchor="middle" font-size="16">10.1.2.5 ❌</text>
    <circle cx="960" cy="468" r="40" fill="#34a853" />
    <text x="960" y="477" text-anchor="middle" fill="white" font-size="16">Pod</text>
    <text x="960" y="531" text-anchor="middle" font-size="16">10.1.2.7 ✓</text>
    <path d="M 880 234 L 880 288" stroke="#666" stroke-width="3.2" />
    <path d="M 880 360 L 960 423" stroke="#666" stroke-width="3.2" />
    <text x="880" y="594" text-anchor="middle" font-size="17.6">Service handles routing</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="448.8126" y="51.6206" text-anchor="middle" font-size="15.295" font-weight="bold">Problem: Pod IPs are Ephemeral</text>
  <g id="without-service">
    <text x="257.6251" y="94.6378" text-anchor="middle" font-size="11.4713">Without Service</text>
    <rect x="162.0314" y="116.1464" width="95.5938" height="43.0172" fill="var(--text-faint)" rx="6" />
    <text x="209.8282" y="143.0321" text-anchor="middle" fill="var(--bg)">Client</text>
    <circle cx="209.8282" cy="234.4436" r="23.8985" fill="var(--danger-fill)" />
    <text x="209.8282" y="239.8208" text-anchor="middle" fill="var(--bg)" font-size="10">Pod</text>
    <text x="209.8282" y="272.0837" text-anchor="middle" font-size="10">10.1.1.5 ❌</text>
    <circle cx="286.3033" cy="234.4436" r="23.8985" fill="var(--ok-fill)" />
    <text x="286.3033" y="239.8208" text-anchor="middle" fill="var(--bg)" font-size="10">Pod</text>
    <text x="286.3033" y="272.0837" text-anchor="middle" font-size="10">10.1.1.6 ✓</text>
    <path d="M 209.8282 159.1636 L 209.8282 207.5579" stroke="var(--text-muted)" stroke-width="0.8882" stroke-dasharray="2.2206 2.2206" />
    <text x="209.8282" y="320.478" text-anchor="middle" font-size="10.5153">Direct connection fails</text>
  </g>
  <g id="with-service">
    <text x="640" y="94.6378" text-anchor="middle" font-size="11.4713">With Service</text>
    <rect x="544.4062" y="116.1464" width="95.5938" height="43.0172" fill="var(--text-faint)" rx="6" />
    <text x="592.2032" y="143.0321" text-anchor="middle" fill="var(--bg)">Client</text>
    <rect x="525.2875" y="191.4265" width="133.8312" height="43.0172" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="1.2905" />
    <text x="592.2032" y="218.3122" text-anchor="middle" fill="var(--bg)">Service</text>
    <circle cx="544.4062" cy="298.9694" r="23.8985" fill="var(--danger-fill)" />
    <text x="544.4062" y="304.3466" text-anchor="middle" fill="var(--bg)" font-size="10">Pod</text>
    <text x="544.4062" y="336.6094" text-anchor="middle" font-size="10">10.1.2.5 ❌</text>
    <circle cx="640" cy="298.9694" r="23.8985" fill="var(--ok-fill)" />
    <text x="640" y="304.3466" text-anchor="middle" fill="var(--bg)" font-size="10">Pod</text>
    <text x="640" y="336.6094" text-anchor="middle" font-size="10">10.1.2.7 ✓</text>
    <path d="M 592.2032 159.1636 L 592.2032 191.4265" stroke="var(--text-muted)" stroke-width="0.8882" />
    <path d="M 592.2032 234.4436 L 640 272.0837" stroke="var(--text-muted)" stroke-width="0.8882" />
    <text x="592.2032" y="374.2495" text-anchor="middle" font-size="10.5153">Service handles routing</text>
  </g>
</svg>
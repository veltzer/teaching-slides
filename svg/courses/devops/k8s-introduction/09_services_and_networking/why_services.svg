<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="580" height="580" rx="6.462247144859" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="86.399935199996" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.386637511526" font-weight="bold" fill="var(--danger-text)">Without a Service</text>

  <rect x="80" y="121.199913599994" width="160" height="92.799978399998" rx="6.462247144859" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="161.799924399995" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.078507389304" fill="var(--primary-text)">Pod A</text>
  <text x="160" y="190.799978399999" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.847331855348" fill="var(--primary-text)">10.0.1.5</text>

  <rect x="260" y="121.199913599994" width="160" height="92.799978399998" rx="6.462247144859" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="161.799924399995" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.078507389304" fill="var(--primary-text)">Pod B</text>
  <text x="340" y="190.799978399999" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.847331855348" fill="var(--primary-text)">10.0.1.8</text>

  <rect x="440" y="121.199913599994" width="160" height="92.799978399998" rx="6.462247144859" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="161.799924399995" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.078507389304" fill="var(--primary-text)">Pod C</text>
  <text x="520" y="190.799978399999" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.847331855348" fill="var(--primary-text)">10.0.2.3</text>

  <text x="330" y="283.599956799997" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.001448877985" fill="var(--danger-text)">Pod IPs change on restart</text>
  <text x="330" y="318.399935199996" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.001448877985" fill="var(--danger-text)">Clients hard-code addresses</text>
  <text x="330" y="353.200021600001" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.001448877985" fill="var(--danger-text)">No load balancing</text>
  <text x="330" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.001448877985" fill="var(--danger-text)">Adding a pod requires reconfig</text>
  <text x="330" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.001448877985" font-weight="bold" fill="var(--danger-text)">Fragile and unscalable.</text>

  <rect x="660" y="40" width="580" height="580" rx="6.462247144859" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="86.399935199996" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.386637511526" font-weight="bold" fill="var(--ok-text)">With a Service</text>

  <rect x="820" y="121.199913599994" width="260" height="92.799978399998" rx="6.462247144859" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="161.799924399995" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.078507389304" font-weight="bold" fill="var(--warn-text)">Service: web</text>
  <text x="950" y="190.799978399999" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.847331855348" fill="var(--warn-text)">stable DNS + ClusterIP</text>

  <line x1="880" y1="214" x2="780" y2="260.399935199995" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950" y1="214" x2="950" y2="260.399935199995" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1020" y1="214" x2="1120" y2="260.399935199995" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="720" y="272" width="140" height="69.599956799997" rx="6.462247144859" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="312.600010800001" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.001448877985" fill="var(--primary-text)">Pod A</text>
  <rect x="880" y="272" width="140" height="69.599956799997" rx="6.462247144859" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="312.600010800001" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.001448877985" fill="var(--primary-text)">Pod B</text>
  <rect x="1040" y="272" width="140" height="69.599956799997" rx="6.462247144859" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="312.600010800001" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.001448877985" fill="var(--primary-text)">Pod C</text>

  <text x="950" y="411.200021600001" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.001448877985" fill="var(--ok-text)">Stable virtual IP + DNS name</text>
  <text x="950" y="443.679943839996" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.001448877985" fill="var(--ok-text)">Selector picks matching pods</text>
  <text x="950" y="476.159974079998" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.001448877985" fill="var(--ok-text)">Load balances across endpoints</text>
  <text x="950" y="508.64000432" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.001448877985" fill="var(--ok-text)">Scale up/down is transparent</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="725.7143" y="40" text-anchor="middle" font-size="31.7109" font-weight="bold">Problem: Pod IPs are Ephemeral</text>
  <g id="without-service">
    <text x="268.5713" y="117.3334" text-anchor="middle" font-size="23.7833">Without Service</text>
    <rect x="40" y="156" width="228.5716" height="77.3334" fill="var(--text-faint)" rx="6" />
    <text x="154.2856" y="204.3333" text-anchor="middle" fill="var(--bg)">Client</text>
    <circle cx="154.2856" cy="368.6666" r="49.5484" fill="var(--danger-fill)" />
    <text x="154.2856" y="378.3333" text-anchor="middle" fill="var(--bg)" font-size="20.7328">Pod</text>
    <text x="154.2856" y="436.3334" text-anchor="middle" font-size="20.7328">10.1.1.5 ❌</text>
    <circle cx="337.143" cy="368.6666" r="49.5484" fill="var(--ok-fill)" />
    <text x="337.143" y="378.3333" text-anchor="middle" fill="var(--bg)" font-size="20.7328">Pod</text>
    <text x="337.143" y="436.3334" text-anchor="middle" font-size="20.7328">10.1.1.6 ✓</text>
    <path d="M 154.2856 233.3334 L 154.2856 320.3333" stroke="var(--text-muted)" stroke-width="0.8882" stroke-dasharray="2.2206 2.2206" />
    <text x="154.2856" y="523.3333" text-anchor="middle" font-size="21.8012">Direct connection fails</text>
  </g>
  <g id="with-service">
    <text x="1182.857" y="117.3334" text-anchor="middle" font-size="23.7833">With Service</text>
    <rect x="954.2854" y="156" width="228.5716" height="77.3334" fill="var(--text-faint)" rx="6" />
    <text x="1068.5714" y="204.3333" text-anchor="middle" fill="var(--bg)">Client</text>
    <rect x="908.5712" y="291.3334" width="319.9999" height="77.3334" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
    <text x="1068.5714" y="339.6667" text-anchor="middle" fill="var(--bg)">Service</text>
    <circle cx="954.2854" cy="484.6666" r="49.5484" fill="var(--danger-fill)" />
    <text x="954.2854" y="494.3334" text-anchor="middle" fill="var(--bg)" font-size="20.7328">Pod</text>
    <text x="954.2854" y="552.3332" text-anchor="middle" font-size="20.7328">10.1.2.5 ❌</text>
    <circle cx="1182.857" cy="484.6666" r="49.5484" fill="var(--ok-fill)" />
    <text x="1182.857" y="494.3334" text-anchor="middle" fill="var(--bg)" font-size="20.7328">Pod</text>
    <text x="1182.857" y="552.3332" text-anchor="middle" font-size="20.7328">10.1.2.7 ✓</text>
    <path d="M 1068.5714 233.3334 L 1068.5714 291.3334" stroke="var(--text-muted)" stroke-width="0.8882" />
    <path d="M 1068.5714 368.6666 L 1182.857 436.3334" stroke="var(--text-muted)" stroke-width="0.8882" />
    <text x="1068.5714" y="620" text-anchor="middle" font-size="21.8012">Service handles routing</text>
  </g>
</svg>
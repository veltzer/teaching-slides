<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="695.5556" y="80" text-anchor="middle" font-size="23.7037" font-weight="bold">Problem: Pod IPs are Ephemeral</text>
  <g id="without-service">
    <text x="399.2592" y="146.6667" text-anchor="middle" font-size="17.7778">Without Service</text>
    <rect x="251.1111" y="180" width="148.1482" height="66.6667" fill="var(--text-faint)" rx="8.3333" />
    <text x="325.1851" y="221.6667" text-anchor="middle" fill="var(--bg)">Client</text>
    <circle cx="325.1851" cy="363.3333" r="37.0371" fill="var(--danger-fill)" />
    <text x="325.1851" y="371.6667" text-anchor="middle" fill="var(--bg)" font-size="14.8149">Pod</text>
    <text x="325.1851" y="421.6667" text-anchor="middle" font-size="14.8149">10.1.1.5 ❌</text>
    <circle cx="443.7036" cy="363.3333" r="37.0371" fill="var(--ok-fill)" />
    <text x="443.7036" y="371.6667" text-anchor="middle" fill="var(--bg)" font-size="14.8149">Pod</text>
    <text x="443.7036" y="421.6667" text-anchor="middle" font-size="14.8149">10.1.1.6 ✓</text>
    <path d="M 325.1851 246.6667 L 325.1851 321.6667" stroke="var(--text-muted)" stroke-width="2.1333" stroke-dasharray="5.3333 5.3333" />
    <text x="325.1851" y="496.6667" text-anchor="middle" font-size="16.2963">Direct connection fails</text>
  </g>
  <g id="with-service">
    <text x="991.8518" y="146.6667" text-anchor="middle" font-size="17.7778">With Service</text>
    <rect x="843.7036" y="180" width="148.1482" height="66.6667" fill="var(--text-faint)" rx="8.3333" />
    <text x="917.7778" y="221.6667" text-anchor="middle" fill="var(--bg)">Client</text>
    <rect x="814.074" y="296.6667" width="207.4074" height="66.6667" fill="var(--primary-fill)" rx="8.3333" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="917.7778" y="338.3333" text-anchor="middle" fill="var(--bg)">Service</text>
    <circle cx="843.7036" cy="463.3333" r="37.0371" fill="var(--danger-fill)" />
    <text x="843.7036" y="471.6667" text-anchor="middle" fill="var(--bg)" font-size="14.8149">Pod</text>
    <text x="843.7036" y="521.6667" text-anchor="middle" font-size="14.8149">10.1.2.5 ❌</text>
    <circle cx="991.8518" cy="463.3333" r="37.0371" fill="var(--ok-fill)" />
    <text x="991.8518" y="471.6667" text-anchor="middle" fill="var(--bg)" font-size="14.8149">Pod</text>
    <text x="991.8518" y="521.6667" text-anchor="middle" font-size="14.8149">10.1.2.7 ✓</text>
    <path d="M 917.7778 246.6667 L 917.7778 296.6667" stroke="var(--text-muted)" stroke-width="2.1333" />
    <path d="M 917.7778 363.3333 L 991.8518 421.6667" stroke="var(--text-muted)" stroke-width="2.1333" />
    <text x="917.7778" y="580" text-anchor="middle" font-size="16.2963">Service handles routing</text>
  </g>
</svg>
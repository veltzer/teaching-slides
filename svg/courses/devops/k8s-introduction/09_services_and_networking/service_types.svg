<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Cluster boundary -->
  <rect x="30" y="40" width="1220" height="560" rx="16" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
  <text x="640" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#555">Kubernetes Cluster</text>

  <!-- External internet box -->
  <rect x="40" y="570" width="280" height="44" rx="8" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="180" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#e65100">External Client / Internet</text>

  <!-- ===== ClusterIP ===== -->
  <rect x="50" y="90" width="260" height="340" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="50" y="90" width="260" height="44" rx="12" fill="url(#grad-accent)"/>
  <rect x="50" y="122" width="260" height="12" fill="url(#grad-accent)"/>
  <text x="180" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">ClusterIP</text>
  <text x="180" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">Internal VIP only</text>
  <text x="180" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#1565c0">clusterIP: 10.96.0.1</text>
  <text x="180" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">Not reachable from outside</text>
  <!-- Pods -->
  <rect x="66" y="210" width="100" height="44" rx="6" fill="#1976d2"/>
  <text x="116" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="116" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#bbdefb">:8080</text>
  <rect x="178" y="210" width="100" height="44" rx="6" fill="#1976d2"/>
  <text x="228" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Pod</text>
  <text x="228" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#bbdefb">:8080</text>
  <!-- Internal caller -->
  <rect x="80" y="290" width="200" height="44" rx="6" fill="#90caf9"/>
  <text x="180" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#0d47a1">Other Pod</text>
  <text x="180" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#0d47a1">my-svc.default.svc</text>
  <line x1="180" y1="334" x2="180" y2="258" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Use case -->
  <text x="180" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#555">Use: microservice-to-microservice</text>
  <text x="180" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#777">Default service type</text>
  <text x="180" y="406" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#777">DNS: &lt;svc&gt;.&lt;ns&gt;.svc.cluster.local</text>

  <!-- ===== NodePort ===== -->
  <rect x="330" y="90" width="260" height="340" rx="12" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="330" y="90" width="260" height="44" rx="12" fill="#388e3c"/>
  <rect x="330" y="122" width="260" height="12" fill="#388e3c"/>
  <text x="460" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">NodePort</text>
  <text x="460" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">ClusterIP + Node port</text>
  <text x="460" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#388e3c">nodePort: 30080 (30000-32767)</text>
  <text x="460" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">Every node opens the port</text>
  <!-- Node representation -->
  <rect x="346" y="208" width="228" height="44" rx="6" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="460" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Node :30080</text>
  <text x="460" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#2e7d32">forwards to ClusterIP:80</text>
  <!-- Pods -->
  <rect x="346" y="268" width="100" height="36" rx="5" fill="#2e7d32"/>
  <text x="396" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff">Pod :8080</text>
  <rect x="460" y="268" width="100" height="36" rx="5" fill="#2e7d32"/>
  <text x="510" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff">Pod :8080</text>
  <line x1="460" y1="252" x2="460" y2="268" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- External arrow -->
  <line x1="180" y1="570" x2="360" y2="252" stroke="#f9a825" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="220" y="530" font-family="Arial,sans-serif" font-size="11" fill="#e65100">NodeIP:30080</text>
  <!-- Use case -->
  <text x="460" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#555">Use: dev/test, bare-metal</text>
  <text x="460" y="358" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#777">Not for production (use LB)</text>
  <text x="460" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#777">Exposes on ALL nodes</text>

  <!-- ===== LoadBalancer ===== -->
  <rect x="610" y="90" width="280" height="340" rx="12" fill="#fff3e0" stroke="#f57c00" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="610" y="90" width="280" height="44" rx="12" fill="#f57c00"/>
  <rect x="610" y="122" width="280" height="12" fill="#f57c00"/>
  <text x="750" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">LoadBalancer</text>
  <text x="750" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">NodePort + cloud LB</text>
  <text x="750" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#e65100">externalIP: 34.100.200.5</text>
  <text x="750" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">Cloud provisions LB automatically</text>
  <!-- Cloud LB box -->
  <rect x="626" y="208" width="248" height="44" rx="6" fill="#ffe0b2" stroke="#f57c00" stroke-width="1.5"/>
  <text x="750" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e65100">Cloud Load Balancer</text>
  <text x="750" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bf360c">AWS ELB / GCP GLB / Azure LB</text>
  <!-- NodePort layer -->
  <rect x="626" y="264" width="248" height="36" rx="5" fill="#ffcc80"/>
  <text x="750" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e65100">NodePort layer (auto)</text>
  <line x1="750" y1="252" x2="750" y2="264" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Pods -->
  <rect x="626" y="310" width="110" height="36" rx="5" fill="#ef6c00"/>
  <text x="681" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff">Pod :8080</text>
  <rect x="748" y="310" width="110" height="36" rx="5" fill="#ef6c00"/>
  <text x="803" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff">Pod :8080</text>
  <line x1="750" y1="300" x2="750" y2="310" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- External arrow -->
  <line x1="250" y1="570" x2="700" y2="252" stroke="#f9a825" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Use case -->
  <text x="750" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#555">Use: production on cloud</text>
  <text x="750" y="396" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#777">Each service gets own LB (costly)</text>
  <text x="750" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#777">Use Ingress to share one LB</text>

  <!-- ===== ExternalName ===== -->
  <rect x="910" y="90" width="300" height="340" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="910" y="90" width="300" height="44" rx="12" fill="#8e24aa"/>
  <rect x="910" y="122" width="300" height="12" fill="#8e24aa"/>
  <text x="1060" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">ExternalName</text>
  <text x="1060" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">DNS CNAME alias</text>
  <text x="1060" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#7b1fa2">No ClusterIP, no proxy</text>
  <text x="1060" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">Maps to external DNS name</text>
  <!-- CNAME box -->
  <rect x="926" y="208" width="268" height="44" rx="6" fill="#e1bee7" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="1060" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#4a148c">my-db.default.svc.cluster.local</text>
  <text x="1060" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#6a1b9a">CNAME → rds.amazonaws.com</text>
  <!-- Arrow to external -->
  <line x1="1060" y1="252" x2="1060" y2="290" stroke="#8e24aa" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- External service box -->
  <rect x="926" y="290" width="268" height="44" rx="6" fill="#ce93d8"/>
  <text x="1060" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fff">External Service</text>
  <text x="1060" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#4a148c">rds.amazonaws.com:5432</text>
  <!-- Use case -->
  <text x="1060" y="374" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#555">Use: external database/API</text>
  <text x="1060" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#777">Migrate external → internal</text>
  <text x="1060" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#777">Pure DNS — no load balancing</text>

  <!-- Bottom comparison bar -->
  <rect x="40" y="450" width="1200" height="36" rx="8" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="180" y="474" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#333">Internal only</text>
  <text x="460" y="474" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#333">External via port</text>
  <text x="750" y="474" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#333">External via cloud LB</text>
  <text x="1060" y="474" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#333">DNS alias to external</text>

  <!-- Legend bottom -->
  <text x="640" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555">kube-proxy implements ClusterIP/NodePort via iptables or IPVS rules on every node</text>
</svg>

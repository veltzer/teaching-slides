<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Kubernetes Network Model</text>
  <rect x="160" y="144" width="320" height="180" fill="#4285f4" rx="8" />
  <text x="320" y="198" text-anchor="middle" fill="white" font-weight="bold">Container to Container</text>
  <text x="320" y="243" text-anchor="middle" fill="white" font-size="17.6">Same Pod</text>
  <text x="320" y="279" text-anchor="middle" fill="white" font-size="17.6">localhost communication</text>
  <text x="320" y="315" text-anchor="middle" fill="white" font-size="17.6">Shared network namespace</text>
  <rect x="512" y="144" width="320" height="180" fill="#34a853" rx="8" />
  <text x="672" y="198" text-anchor="middle" fill="white" font-weight="bold">Pod to Pod</text>
  <text x="672" y="243" text-anchor="middle" fill="white" font-size="17.6">Direct IP communication</text>
  <text x="672" y="279" text-anchor="middle" fill="white" font-size="17.6">No NAT required</text>
  <text x="672" y="315" text-anchor="middle" fill="white" font-size="17.6">Across nodes</text>
  <rect x="864" y="144" width="320" height="180" fill="#fbbc04" rx="8" />
  <text x="1024" y="198" text-anchor="middle" font-weight="bold">Pod to Service</text>
  <text x="1024" y="243" text-anchor="middle" font-size="17.6">Virtual IP (ClusterIP)</text>
  <text x="1024" y="279" text-anchor="middle" font-size="17.6">Load balancing</text>
  <text x="1024" y="315" text-anchor="middle" font-size="17.6">Service discovery</text>
  <rect x="400" y="396" width="480" height="144" fill="#e8f5e9" rx="8" />
  <text x="640" y="450" text-anchor="middle" font-weight="bold">External to Service</text>
  <text x="640" y="495" text-anchor="middle" font-size="19.2">NodePort, LoadBalancer, Ingress</text>
</svg>
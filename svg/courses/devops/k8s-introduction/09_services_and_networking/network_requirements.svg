<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="374.999972656249" height="263.636363636363" fill="url(#grad-primary)" rx="7.567874883723" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.500041015627" y="119.090909090909" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Container to Container</text>
  <text x="227.500041015627" y="184.999999999999" text-anchor="middle" fill="var(--bg)" font-size="23.057927326975" font-family="Arial, sans-serif">Same Pod</text>
  <text x="227.500041015627" y="237.727272727272" text-anchor="middle" fill="var(--bg)" font-size="23.057927326975" font-family="Arial, sans-serif">localhost communication</text>
  <text x="227.500041015627" y="290.454545454546" text-anchor="middle" fill="var(--bg)" font-size="23.057927326975" font-family="Arial, sans-serif">Shared network namespace</text>
  <rect x="452.499958984373" y="40" width="374.999972656249" height="263.636363636363" fill="url(#grad-ok)" rx="7.567874883723" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="119.090909090909" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Pod to Pod</text>
  <text x="640" y="184.999999999999" text-anchor="middle" fill="var(--bg)" font-size="23.057927326975" font-family="Arial, sans-serif">Direct IP communication</text>
  <text x="640" y="237.727272727272" text-anchor="middle" fill="var(--bg)" font-size="23.057927326975" font-family="Arial, sans-serif">No NAT required</text>
  <text x="640" y="290.454545454546" text-anchor="middle" fill="var(--bg)" font-size="23.057927326975" font-family="Arial, sans-serif">Across nodes</text>
  <rect x="865.000027343752" y="40" width="374.999972656249" height="263.636363636363" fill="url(#grad-warn)" rx="7.567874883723" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.500068359378" y="119.090909090909" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod to Service</text>
  <text x="1052.500068359378" y="184.999999999999" text-anchor="middle" font-size="23.057927326975" font-family="Arial, sans-serif" fill="var(--warn-text)">Virtual IP (ClusterIP)</text>
  <text x="1052.500068359378" y="237.727272727272" text-anchor="middle" font-size="23.057927326975" font-family="Arial, sans-serif" fill="var(--warn-text)">Load balancing</text>
  <text x="1052.500068359378" y="290.454545454546" text-anchor="middle" font-size="23.057927326975" font-family="Arial, sans-serif" fill="var(--warn-text)">Service discovery</text>
  <rect x="321.249952148435" y="409.090909090909" width="562.500013671876" height="210.909090909091" fill="url(#grad-ok)" rx="7.567874883723" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="602.500013671876" y="488.181818181818" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">External to Service</text>
  <text x="602.500013671876" y="554.090909090908" text-anchor="middle" font-size="25.154102538518" font-family="Arial, sans-serif" fill="var(--ok-text)">NodePort, LoadBalancer, Ingress</text>
</svg>

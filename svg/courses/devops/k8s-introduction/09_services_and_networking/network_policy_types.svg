<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Network Policy Rules</text>
  <rect x="160" y="144" width="320" height="216" fill="#4285f4" rx="8" />
  <text x="320" y="198" text-anchor="middle" fill="white" font-weight="bold">Ingress Rules</text>
  <text x="320" y="243" text-anchor="middle" fill="white" font-size="17.6">Control incoming traffic</text>
  <text x="320" y="279" text-anchor="middle" fill="white" font-size="17.6">• From pods</text>
  <text x="320" y="315" text-anchor="middle" fill="white" font-size="17.6">• From namespaces</text>
  <text x="320" y="351" text-anchor="middle" fill="white" font-size="17.6">• From IP blocks</text>
  <rect x="512" y="144" width="320" height="216" fill="#34a853" rx="8" />
  <text x="672" y="198" text-anchor="middle" fill="white" font-weight="bold">Egress Rules</text>
  <text x="672" y="243" text-anchor="middle" fill="white" font-size="17.6">Control outgoing traffic</text>
  <text x="672" y="279" text-anchor="middle" fill="white" font-size="17.6">• To pods</text>
  <text x="672" y="315" text-anchor="middle" fill="white" font-size="17.6">• To namespaces</text>
  <text x="672" y="351" text-anchor="middle" fill="white" font-size="17.6">• To IP blocks</text>
  <rect x="864" y="144" width="320" height="216" fill="#fbbc04" rx="8" />
  <text x="1024" y="198" text-anchor="middle" font-weight="bold">Default Behavior</text>
  <text x="1024" y="243" text-anchor="middle" font-size="17.6">No policy = Allow all</text>
  <text x="1024" y="279" text-anchor="middle" font-size="17.6">With policy:</text>
  <text x="1024" y="315" text-anchor="middle" font-size="17.6">• Whitelist mode</text>
  <text x="1024" y="351" text-anchor="middle" font-size="17.6">• Explicit allow only</text>
</svg>
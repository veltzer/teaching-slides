  <text x="605.2778" y="205" text-anchor="middle" fill="var(--bg)" font-weight="bold">App Container</text>
  <rect x="501.1111" y="329.9999" width="208.3334" height="93.75" fill="var(--ok-fill)" rx="6.4453" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="605.2778" y="384.6875" text-anchor="middle" fill="var(--bg)">Sidecar Proxy</text>
  <rect x="778.8888" y="158.1249" width="208.3334" height="156.25" fill="var(--primary-fill)" rx="6.4453" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="883.0555" y="205" text-anchor="middle" fill="var(--bg)" font-weight="bold">App Container</text>
  <rect x="778.8888" y="329.9999" width="208.3334" height="93.75" fill="var(--ok-fill)" rx="6.4453" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="883.0555" y="384.6875" text-anchor="middle" fill="var(--bg)">Sidecar Proxy</text>
  <path d="M 431.6666 376.875 L 494.1666 376.875" stroke="var(--text-muted)" stroke-width="2.5859" stroke-dasharray="6.4646 6.4646" />
  <path d="M 709.4444 376.875 L 771.9444 376.875" stroke="var(--text-muted)" stroke-width="2.5859" stroke-dasharray="6.4646 6.4646" />
  <rect x="431.6666" y="470.625" width="416.6667" height="78.125" fill="var(--danger-fill)" rx="6.4453" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="639.9999" y="517.5" text-anchor="middle" fill="var(--bg)">Control Plane (Istio, Linkerd)</text>
</svg>
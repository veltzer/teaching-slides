<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="327.272889256188" height="231.99994880001" fill="url(#grad-primary)" rx="7.658149660986" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.636444628094" y="109.600112639975" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">App Container</text>
  <rect x="40" y="295.200071679984" width="327.272889256188" height="139.199969280006" fill="url(#grad-ok)" rx="7.658149660986" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.636444628094" y="376.400309759932" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Sidecar Proxy</text>
  <rect x="476.363682644625" y="40" width="327.272889256188" height="231.99994880001" fill="url(#grad-primary)" rx="7.658149660986" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="109.600112639975" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">App Container</text>
  <rect x="476.363682644625" y="295.200071679984" width="327.272889256188" height="139.199969280006" fill="url(#grad-ok)" rx="7.658149660986" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="376.400309759932" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Sidecar Proxy</text>
  <rect x="912.727110743811" y="40" width="327.272889256188" height="231.99994880001" fill="url(#grad-primary)" rx="7.658149660986" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.363682644625" y="109.600112639975" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">App Container</text>
  <rect x="912.727110743811" y="295.200071679984" width="327.272889256188" height="139.199969280006" fill="url(#grad-ok)" rx="7.658149660986" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.363682644625" y="376.400309759932" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Sidecar Proxy</text>
  <path d="M 367.272761983469 364.800056319988 L 465.454628760325 364.800056319988" stroke="var(--text-muted)" stroke-width="1.7775" stroke-dasharray="4.4435 4.4435"/>
  <path d="M 803.636317355375 364.800056319988 L 901.818184132231 364.800056319988" stroke="var(--text-muted)" stroke-width="1.7775" stroke-dasharray="4.4435 4.4435"/>
  <rect x="367.272761983469" y="504.000025599994" width="654.545523966938" height="115.999974400006" fill="url(#grad-danger)" rx="7.658149660986" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="694.545396694218" y="573.600010239997" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Control Plane (Istio, Linkerd)</text>
</svg>

  <text x="931.6666" y="197.1875" text-anchor="middle" fill="var(--bg)">Worker Node 2</text>
  <text x="931.6666" y="228.4375" text-anchor="middle" fill="var(--bg)" font-size="15.2778">10.0.0.2:30080</text>

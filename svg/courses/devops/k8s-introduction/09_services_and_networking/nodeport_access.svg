  <path d="M 340.000058333335 118.054151500355 L 869.99993972222 118.054151500355" stroke="var(--text-muted)" stroke-width="0.9902" marker-end="url(#arrow)"/>
  <path d="M 659.999933888887 196.107872358698 L 659.999933888887 287.170857712662" stroke="var(--text-muted)" stroke-width="0.9902" marker-end="url(#arrow)"/>
  <path d="M 1059.999778333327 196.107872358698 L 859.999972777777 287.170857712662" stroke="var(--text-muted)" stroke-width="0.9902" marker-end="url(#arrow)"/>

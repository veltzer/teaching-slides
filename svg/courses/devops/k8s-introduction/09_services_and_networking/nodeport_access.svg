  <rect x="879.999906666664" y="40" width="360.000093333336" height="156.107728811361" fill="url(#grad-primary)" rx="7.764656022432" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1059.999778333327" y="105.045030552071" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Worker Node 2</text>

  <text x="482.623" y="336.3934" text-anchor="middle">Pod</text>
  <circle cx="577.0492" cy="330.4918" r="26.2295" fill="var(--warn-fill)" />
  <text x="577.0492" y="336.3934" text-anchor="middle">Pod</text>
  <circle cx="671.4754" cy="330.4918" r="26.2295" fill="var(--warn-fill)" />
  <text x="671.4754" y="336.3934" text-anchor="middle">Pod</text>
  <path d="M 262.2951 129.8361 L 330.4918 129.8361" stroke="var(--text-muted)" stroke-width="2.0984" marker-end="url(#arrow)" />
  <path d="M 262.2951 129.8361 L 540.3279 129.8361" stroke="var(--text-muted)" stroke-width="2.0984" marker-end="url(#arrow)" />
  <path d="M 430.1639 165.2459 L 430.1639 206.5574" stroke="var(--text-muted)" stroke-width="2.0984" marker-end="url(#arrow)" />
  <path d="M 640 165.2459 L 535.082 206.5574" stroke="var(--text-muted)" stroke-width="2.0984" marker-end="url(#arrow)" />
</svg>
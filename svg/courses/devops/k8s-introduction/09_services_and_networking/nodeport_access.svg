  <rect x="479.999945555554" y="300.179691566272" width="759.999821111106" height="130.089917556804" fill="url(#grad-ok)" rx="7.764656022432" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="859.999972777777" y="378.233412424617" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Service (ClusterIP: 10.96.10.20:80)</text>

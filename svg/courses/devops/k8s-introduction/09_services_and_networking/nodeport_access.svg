  <text x="640" y="123.9344" text-anchor="middle" fill="var(--bg)">Worker Node 2</text>
  <text x="640" y="147.541" text-anchor="middle" fill="var(--bg)" font-size="11.541">10.0.0.2:30080</text>
  <rect x="335.7377" y="212.459" width="398.6885" height="59.0164" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="535.082" y="247.8689" text-anchor="middle" fill="var(--bg)">Service (ClusterIP: 10.96.10.20:80)</text>

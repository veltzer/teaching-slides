  <text x="940.000058333335" y="573.368073438818" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>
  <rect x="1071.526795320189" y="500.71962754911" width="96.94393602622" height="119.28037245089" rx="18.117530719008" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="1119.999929999998" y="573.368073438818" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>

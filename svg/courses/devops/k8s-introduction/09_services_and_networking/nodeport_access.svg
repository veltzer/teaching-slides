  <path d="M 431.6668 205.0001 L 521.9445 205.0001" stroke="var(--text-muted)" stroke-width="2.0984" marker-end="url(#arrow)" />
  <path d="M 431.6668 205.0001 L 799.7223 205.0001" stroke="var(--text-muted)" stroke-width="2.0984" marker-end="url(#arrow)" />
  <path d="M 653.8889 251.875 L 653.8889 306.5625" stroke="var(--text-muted)" stroke-width="2.0984" marker-end="url(#arrow)" />
  <path d="M 931.6666 251.875 L 792.7778 306.5625" stroke="var(--text-muted)" stroke-width="2.0984" marker-end="url(#arrow)" />
</svg>
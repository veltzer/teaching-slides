<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="76.25" width="1200" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="639.9997" y="40" text-anchor="middle" font-size="29.9141" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">NodePort Service</text>
  <rect x="125.7142" y="130.6249" width="257.1427" height="108.75" fill="var(--text-faint)" rx="6"/>
  <text x="254.2857" y="185.0001" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">External Client</text>
  <text x="254.2857" y="212.1875" text-anchor="middle" fill="var(--bg)" font-size="17.4188" font-family="Arial, sans-serif">192.168.1.100</text>
  <rect x="502.857" y="130.6249" width="308.5715" height="108.75" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="657.1427" y="175.9375" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Worker Node 1</text>
  <text x="657.1427" y="212.1875" text-anchor="middle" fill="var(--bg)" font-size="18.2808" font-family="Arial, sans-serif">10.0.0.1:30080</text>
  <rect x="845.7141" y="130.6249" width="308.5715" height="108.75" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.9997" y="175.9375" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Worker Node 2</text>
  <text x="999.9997" y="212.1875" text-anchor="middle" fill="var(--bg)" font-size="18.2808" font-family="Arial, sans-serif">10.0.0.2:30080</text>
  <rect x="502.857" y="311.875" width="651.4284" height="90.6251" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.5713" y="366.2499" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Service (ClusterIP: 10.96.10.20:80)</text>
  <rect x="547.024" y="451.578" width="83.0948" height="83.0948" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="588.5714" y="502.1874" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>
  <rect x="701.31" y="451.578" width="83.0948" height="83.0948" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="742.8571" y="502.1874" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>
  <rect x="855.595" y="451.578" width="83.0948" height="83.0948" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="897.1428" y="502.1874" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>
  <rect x="1009.88" y="451.578" width="83.0948" height="83.0948" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="1051.4284" y="502.1874" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>
  <path d="M 382.8571 185.0001 L 494.2856 185.0001" stroke="var(--text-muted)" stroke-width="0.9902" marker-end="url(#arrow)"/>
  <path d="M 382.8571 185.0001 L 837.1427 185.0001" stroke="var(--text-muted)" stroke-width="0.9902" marker-end="url(#arrow)"/>
  <path d="M 657.1427 239.375 L 657.1427 302.8126" stroke="var(--text-muted)" stroke-width="0.9902" marker-end="url(#arrow)"/>
  <path d="M 999.9997 239.375 L 828.5713 302.8126" stroke="var(--text-muted)" stroke-width="0.9902" marker-end="url(#arrow)"/>
</svg>

  <rect x="845.7141" y="97.999893333333" width="308.5715" height="116" fill="url(#grad-primary)" rx="6.196773353932" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.9997" y="146.333333333333" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Worker Node 2</text>
  <text x="999.9997" y="185" text-anchor="middle" fill="var(--bg)" font-size="18.88032905476" font-family="Arial, sans-serif">10.0.0.2:30080</text>
  <rect x="502.857" y="291.333333333333" width="651.4284" height="96.666773333333" fill="url(#grad-ok)" rx="6.196773353932" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.5713" y="349.333226666667" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Service (ClusterIP: 10.96.10.20:80)</text>
  <rect x="547.024" y="440.349866666667" width="83.0948" height="88.634453333333" rx="14.459137825841" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="588.5714" y="494.333226666667" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>
  <rect x="701.31" y="440.349866666667" width="83.0948" height="88.634453333333" rx="14.459137825841" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="742.8571" y="494.333226666667" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>
  <rect x="855.595" y="440.349866666667" width="83.0948" height="88.634453333333" rx="14.459137825841" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="897.1428" y="494.333226666667" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>
  <rect x="1009.88" y="440.349866666667" width="83.0948" height="88.634453333333" rx="14.459137825841" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="1051.4284" y="494.333226666667" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>
  <path d="M 382.8571 156.000106666667 L 494.2856 156.000106666667" stroke="var(--text-muted)" stroke-width="0.9902" marker-end="url(#arrow)"/>
  <path d="M 382.8571 156.000106666667 L 837.1427 156.000106666667" stroke="var(--text-muted)" stroke-width="0.9902" marker-end="url(#arrow)"/>
  <path d="M 657.1427 214 L 657.1427 281.666773333333" stroke="var(--text-muted)" stroke-width="0.9902" marker-end="url(#arrow)"/>
  <path d="M 999.9997 214 L 828.5713 281.666773333333" stroke="var(--text-muted)" stroke-width="0.9902" marker-end="url(#arrow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="54.2373" y="61.0169" width="759.322" height="366.1017" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="433.8983" y="36.6102" text-anchor="middle" font-size="19.5254" font-weight="bold">LoadBalancer Service</text>
  <rect x="325.4237" y="85.4237" width="216.9492" height="61.0169" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="433.8983" y="115.9322" text-anchor="middle" fill="var(--bg)" font-weight="bold">Cloud Load Balancer</text>
  <text x="433.8983" y="134.2373" text-anchor="middle" fill="var(--bg)" font-size="10.8475">External IP: 35.1.2.3</text>
  <rect x="162.7119" y="183.0508" width="130.1695" height="61.0169" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="227.7966" y="219.661" text-anchor="middle" fill="var(--bg)" font-size="11.9322">Worker Node 1</text>
  <rect x="368.8136" y="183.0508" width="130.1695" height="61.0169" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="433.8983" y="219.661" text-anchor="middle" fill="var(--bg)" font-size="11.9322">Worker Node 2</text>
  <rect x="574.9153" y="183.0508" width="130.1695" height="61.0169" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="219.661" text-anchor="middle" fill="var(--bg)" font-size="11.9322">Worker Node 3</text>
  <rect x="216.9492" y="280.678" width="433.8983" height="48.8136" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="433.8983" y="311.1864" text-anchor="middle" fill="var(--bg)">Service + NodePort</text>
  <circle cx="271.1864" cy="378.3051" r="21.6949" fill="var(--warn-fill)" />
  <circle cx="379.661" cy="378.3051" r="21.6949" fill="var(--warn-fill)" />
  <circle cx="488.1356" cy="378.3051" r="21.6949" fill="var(--warn-fill)" />
  <circle cx="596.6102" cy="378.3051" r="21.6949" fill="var(--warn-fill)" />
  <path d="M 433.8983 146.4407 L 227.7966 176.9492" stroke="var(--text-muted)" stroke-width="2.1695" marker-end="url(#arrow)" />
  <path d="M 433.8983 146.4407 L 433.8983 176.9492" stroke="var(--text-muted)" stroke-width="2.1695" marker-end="url(#arrow)" />
  <path d="M 433.8983 146.4407 L 640 176.9492" stroke="var(--text-muted)" stroke-width="2.1695" marker-end="url(#arrow)" />
</svg>
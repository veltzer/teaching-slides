<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="153.8888" y="111.2499" width="972.2224" height="468.7501" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.6823"/>
  <text x="640" y="80" text-anchor="middle" font-size="25" font-weight="bold">LoadBalancer Service</text>
  <rect x="501.1111" y="142.4999" width="277.7779" height="78.125" fill="var(--danger-fill)" rx="7.6823" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="181.5625" text-anchor="middle" fill="var(--bg)" font-weight="bold">Cloud Load Balancer</text>
  <text x="640" y="205" text-anchor="middle" fill="var(--bg)" font-size="13.8889">External IP: 35.1.2.3</text>
  <rect x="292.7778" y="267.4999" width="166.6667" height="78.125" fill="var(--primary-fill)" rx="7.6823" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="376.1111" y="314.375" text-anchor="middle" fill="var(--bg)" font-size="15.2778">Worker Node 1</text>
  <rect x="556.6667" y="267.4999" width="166.6667" height="78.125" fill="var(--primary-fill)" rx="7.6823" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="314.375" text-anchor="middle" fill="var(--bg)" font-size="15.2778">Worker Node 2</text>
  <rect x="820.5557" y="267.4999" width="166.6667" height="78.125" fill="var(--primary-fill)" rx="7.6823" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="903.8889" y="314.375" text-anchor="middle" fill="var(--bg)" font-size="15.2778">Worker Node 3</text>
  <rect x="362.2222" y="392.5001" width="555.5557" height="62.5001" fill="var(--ok-fill)" rx="7.6823" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="431.5625" text-anchor="middle" fill="var(--bg)">Service + NodePort</text>
  <circle cx="431.6666" cy="517.5001" r="27.7778" fill="var(--warn-fill)" />
  <circle cx="570.5555" cy="517.5001" r="27.7778" fill="var(--warn-fill)" />
  <circle cx="709.4445" cy="517.5001" r="27.7778" fill="var(--warn-fill)" />
  <circle cx="848.3334" cy="517.5001" r="27.7778" fill="var(--warn-fill)" />
  <path d="M 640 220.625 L 376.1111 259.6876" stroke="var(--text-muted)" stroke-width="2.1695" marker-end="url(#arrow)" />
  <path d="M 640 220.625 L 640 259.6876" stroke="var(--text-muted)" stroke-width="2.1695" marker-end="url(#arrow)" />
  <path d="M 640 220.625 L 903.8889 259.6876" stroke="var(--text-muted)" stroke-width="2.1695" marker-end="url(#arrow)" />
</svg>
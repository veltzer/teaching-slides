<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="399.999860000023" y="40" width="480" height="112.255822893486" fill="url(#grad-danger)" rx="7.901251772576" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.99958000007" y="96.127973381058" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Cloud Load Balancer</text>
  <text x="639.99958000007" y="129.804881278324" text-anchor="middle" fill="var(--bg)" font-size="22.254402367579" font-family="Arial, sans-serif">External IP: 35.1.2.3</text>
  <rect x="40" y="219.609390950756" width="287.999972000005" height="112.255822893486" fill="url(#grad-primary)" rx="7.901251772576" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.000055999991" y="286.963082876656" text-anchor="middle" fill="var(--bg)" font-size="24.073797275744" font-family="Arial, sans-serif">Worker Node 1</text>
  <rect x="495.999804000033" y="219.609390950756" width="287.999972000005" height="112.255822893486" fill="url(#grad-primary)" rx="7.901251772576" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.99958000007" y="286.963082876656" text-anchor="middle" fill="var(--bg)" font-size="24.073797275744" font-family="Arial, sans-serif">Worker Node 2</text>
  <rect x="952.000027999995" y="219.609390950756" width="287.999972000005" height="112.255822893486" fill="url(#grad-primary)" rx="7.901251772576" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.999664000056" y="286.963082876656" text-anchor="middle" fill="var(--bg)" font-size="24.073797275744" font-family="Arial, sans-serif">Worker Node 3</text>
  <rect x="159.999860000023" y="399.219153507405" width="960" height="89.804881278324" fill="url(#grad-ok)" rx="7.901251772576" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.99958000007" y="455.347003019832" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Service + NodePort</text>
  <rect x="233.466527755579" y="537.657088916321" width="93.066384488936" height="82.342911083679" rx="18.436254136011" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="473.465687755719" y="537.657088916321" width="93.066384488936" height="82.342911083679" rx="18.436254136011" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="713.466247755625" y="537.657088916321" width="93.066384488936" height="82.342911083679" rx="18.436254136011" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="953.466807755532" y="537.657088916321" width="93.066384488936" height="82.342911083679" rx="18.436254136011" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <path d="M 639.99958000007 152.256070630747 L 184.000055999991 208.384044011805" stroke="var(--text-muted)" stroke-width="1.0876" marker-end="url(#arrow)"/>
  <path d="M 639.99958000007 152.256070630747 L 639.99958000007 208.384044011805" stroke="var(--text-muted)" stroke-width="1.0876" marker-end="url(#arrow)"/>
  <path d="M 639.99958000007 152.256070630747 L 1095.999664000056 208.384044011805" stroke="var(--text-muted)" stroke-width="1.0876" marker-end="url(#arrow)"/>
</svg>

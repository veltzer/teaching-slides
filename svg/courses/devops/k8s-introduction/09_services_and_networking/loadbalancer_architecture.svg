<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.196773353932"/>
  <rect x="468.5714" y="78.666666666667" width="342.8572" height="96.66656" fill="url(#grad-danger)" rx="6.196773353932" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9998" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Cloud Load Balancer</text>
  <text x="639.9998" y="156.000106666667" text-anchor="middle" fill="var(--bg)" font-size="17.453625269573" font-family="Arial, sans-serif">External IP: 35.1.2.3</text>
  <rect x="211.4286" y="233.333226666667" width="205.7143" height="96.66656" fill="url(#grad-primary)" rx="6.196773353932" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2858" y="291.333333333333" text-anchor="middle" fill="var(--bg)" font-size="18.880535613871" font-family="Arial, sans-serif">Worker Node 1</text>
  <rect x="537.1428" y="233.333226666667" width="205.7143" height="96.66656" fill="url(#grad-primary)" rx="6.196773353932" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9998" y="291.333333333333" text-anchor="middle" fill="var(--bg)" font-size="18.880535613871" font-family="Arial, sans-serif">Worker Node 2</text>
  <rect x="862.8573" y="233.333226666667" width="205.7143" height="96.66656" fill="url(#grad-primary)" rx="6.196773353932" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965.7142" y="291.333333333333" text-anchor="middle" fill="var(--bg)" font-size="18.880535613871" font-family="Arial, sans-serif">Worker Node 3</text>
  <rect x="297.1428" y="388.000106666667" width="685.7144" height="77.33344" fill="url(#grad-ok)" rx="6.196773353932" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9998" y="436.333333333333" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Service + NodePort</text>
  <rect x="349.619" y="507.2128" width="66.476" height="70.907733333333" rx="14.459137825841" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="521.047" y="507.2128" width="66.476" height="70.907733333333" rx="14.459137825841" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="692.476" y="507.2128" width="66.476" height="70.907733333333" rx="14.459137825841" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="863.905" y="507.2128" width="66.476" height="70.907733333333" rx="14.459137825841" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <path d="M 639.9998 175.33344 L 314.2858 223.666773333333" stroke="var(--text-muted)" stroke-width="1.0876" marker-end="url(#arrow)"/>
  <path d="M 639.9998 175.33344 L 639.9998 223.666773333333" stroke="var(--text-muted)" stroke-width="1.0876" marker-end="url(#arrow)"/>
  <path d="M 639.9998 175.33344 L 965.7142 223.666773333333" stroke="var(--text-muted)" stroke-width="1.0876" marker-end="url(#arrow)"/>
</svg>

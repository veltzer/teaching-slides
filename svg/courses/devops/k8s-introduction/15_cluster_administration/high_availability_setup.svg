<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="76.25" width="1200" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640" y="40" text-anchor="middle" font-size="29.9142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">HA Control Plane</text>
  <rect x="125.7143" y="130.625" width="257.1429" height="90.625" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.2857" y="185" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Load Balancer</text>
  <rect x="40" y="275.625" width="171.4286" height="108.75" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.7143" y="320.9375" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Master 1</text>
  <text x="125.7143" y="357.1875" text-anchor="middle" fill="var(--bg)" font-size="16.619" font-family="Arial, sans-serif">API, etcd</text>
  <rect x="254.2857" y="275.625" width="171.4286" height="108.75" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="320.9375" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Master 2</text>
  <text x="340" y="357.1875" text-anchor="middle" fill="var(--bg)" font-size="16.619" font-family="Arial, sans-serif">API, etcd</text>
  <rect x="468.5714" y="275.625" width="171.4286" height="108.75" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="554.2857" y="320.9375" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Master 3</text>
  <text x="554.2857" y="357.1875" text-anchor="middle" fill="var(--bg)" font-size="16.619" font-family="Arial, sans-serif">API, etcd</text>
  <rect x="725.7143" y="166.875" width="428.5714" height="326.25" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="212.1875" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Worker Nodes</text>
  <rect x="778.191" y="260.512" width="66.476" height="66.476" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="863.905" y="260.512" width="66.476" height="66.476" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="949.619" y="260.512" width="66.476" height="66.476" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="1035.33" y="260.512" width="66.476" height="66.476" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="778.191" y="351.137" width="66.476" height="66.476" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="863.905" y="351.137" width="66.476" height="66.476" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="949.619" y="351.137" width="66.476" height="66.476" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <rect x="1035.33" y="351.137" width="66.476" height="66.476" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
</svg>
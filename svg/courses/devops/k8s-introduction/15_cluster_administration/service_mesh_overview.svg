<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="360.000041999998" height="276.190476190476" fill="url(#grad-info)" rx="8.763560700994" stroke="var(--info-border)" stroke-width="2"/>
  <text x="219.999951000002" y="122.857142857143" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Istio</text>
  <text x="219.999951000002" y="191.904761904761" text-anchor="middle" fill="var(--bg)" font-size="24.273602548302" font-family="Arial, sans-serif">Feature rich</text>
  <text x="219.999951000002" y="247.142857142857" text-anchor="middle" fill="var(--bg)" font-size="24.273602548302" font-family="Arial, sans-serif">Complex</text>
  <text x="219.999951000002" y="302.380952380953" text-anchor="middle" fill="var(--bg)" font-size="24.273602548302" font-family="Arial, sans-serif">Envoy proxy</text>
  <rect x="448.000019599999" y="40" width="360.000041999998" height="276.190476190476" fill="url(#grad-primary)" rx="8.763560700994" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="627.999970600002" y="122.857142857143" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Linkerd</text>
  <text x="627.999970600002" y="191.904761904761" text-anchor="middle" font-size="24.273602548302" font-family="Arial, sans-serif" fill="var(--primary-text)">Lightweight</text>
  <text x="627.999970600002" y="247.142857142857" text-anchor="middle" font-size="24.273602548302" font-family="Arial, sans-serif" fill="var(--primary-text)">Simple</text>
  <text x="627.999970600002" y="302.380952380953" text-anchor="middle" font-size="24.273602548302" font-family="Arial, sans-serif" fill="var(--primary-text)">Rust proxy</text>
  <rect x="855.999899200005" y="40" width="360.000041999998" height="276.190476190476" fill="url(#grad-ok)" rx="8.763560700994" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1035.999990200001" y="122.857142857143" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Consul</text>
  <text x="1035.999990200001" y="191.904761904761" text-anchor="middle" font-size="24.273602548302" font-family="Arial, sans-serif" fill="var(--ok-text)">Multi-platform</text>
  <text x="1035.999990200001" y="247.142857142857" text-anchor="middle" font-size="24.273602548302" font-family="Arial, sans-serif" fill="var(--ok-text)">Service discovery</text>
  <text x="1035.999990200001" y="302.380952380953" text-anchor="middle" font-size="24.273602548302" font-family="Arial, sans-serif" fill="var(--ok-text)">HashiCorp</text>
  <rect x="280.000027999999" y="399.047619047619" width="959.999972000001" height="220.952380952381" fill="url(#grad-ok)" rx="8.763560700994" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="759.999944000003" y="481.904761904761" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Common Features</text>
  <text x="759.999944000003" y="550.952380952382" text-anchor="middle" font-size="26.700962803133" font-family="Arial, sans-serif" fill="var(--ok-text)">Traffic management, Security (mTLS), Observability</text>
</svg>

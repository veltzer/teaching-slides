<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="276.92312662722" height="220.952380952381" fill="url(#grad-danger)" rx="7.686151431915" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="178.461509467455" y="122.857142857143" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Prometheus</text>
  <text x="178.461509467455" y="178.095238095239" text-anchor="middle" fill="var(--bg)" font-size="21.289358441164" font-family="Arial, sans-serif">Metrics collection</text>
  <text x="178.461509467455" y="233.333333333333" text-anchor="middle" fill="var(--bg)" font-size="21.289358441164" font-family="Arial, sans-serif">Time series DB</text>
  <rect x="353.846188639054" y="40" width="276.92312662722" height="220.952380952381" fill="var(--warn-accent)" rx="7.686151431915"/>
  <text x="492.307698106509" y="122.857142857143" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Grafana</text>
  <text x="492.307698106509" y="178.095238095239" text-anchor="middle" fill="var(--bg)" font-size="21.289358441164" font-family="Arial, sans-serif">Visualization</text>
  <text x="492.307698106509" y="233.333333333333" text-anchor="middle" fill="var(--bg)" font-size="21.289358441164" font-family="Arial, sans-serif">Dashboards</text>
  <rect x="667.692269585798" y="40" width="276.92312662722" height="220.952380952381" fill="url(#grad-danger)" rx="7.686151431915" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="806.153886745563" y="122.857142857143" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Alertmanager</text>
  <text x="806.153886745563" y="178.095238095239" text-anchor="middle" fill="var(--bg)" font-size="21.289358441164" font-family="Arial, sans-serif">Alert routing</text>
  <text x="806.153886745563" y="233.333333333333" text-anchor="middle" fill="var(--bg)" font-size="21.289358441164" font-family="Arial, sans-serif">Notifications</text>
  <rect x="981.538458224852" y="40" width="258.461541775148" height="220.952380952381" fill="url(#grad-primary)" rx="7.686151431915" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1110.769229112426" y="122.857142857143" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Loki</text>
  <text x="1110.769229112426" y="178.095238095239" text-anchor="middle" fill="var(--bg)" font-size="21.289358441164" font-family="Arial, sans-serif">Log aggregation</text>
  <text x="1110.769229112426" y="233.333333333333" text-anchor="middle" fill="var(--bg)" font-size="21.289358441164" font-family="Arial, sans-serif">Like Prometheus</text>
  <rect x="224.61541775148" y="343.809523809524" width="738.46156331361" height="276.190476190476" fill="url(#grad-ok)" rx="7.686151431915" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="593.84614556213" y="426.666666666667" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Data Sources</text>
  <text x="593.84614556213" y="495.714285714286" text-anchor="middle" font-size="23.418294285281" font-family="Arial, sans-serif" fill="var(--ok-text)">• Node Exporter (system metrics)</text>
  <text x="593.84614556213" y="550.952380952382" text-anchor="middle" font-size="23.418294285281" font-family="Arial, sans-serif" fill="var(--ok-text)">• kube-state-metrics (K8s objects)</text>
  <text x="593.84614556213" y="606.190476190476" text-anchor="middle" font-size="23.418294285281" font-family="Arial, sans-serif" fill="var(--ok-text)">• cAdvisor (container metrics)</text>
</svg>

  <text x="423.9055" y="183.3202" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--ok-accent)">kubectl uncordon (node rejoins)</text>
  <rect x="297.8503" y="195.9257" width="117.0512" height="58.5256" rx="4.8115" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.2966" filter="url(#shadow)" />
  <rect x="297.8503" y="195.9257" width="117.0512" height="20.7091" rx="4.8115" fill="var(--danger-accent)" />
  <rect x="297.8503" y="211.2324" width="117.0512" height="5.4023" fill="var(--danger-accent)" rx="4.8115" />
  <text x="356.3759" y="210.332" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--bg)">NotReady</text>
  <text x="356.3759" y="226.5392" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">kubelet stopped heartbeat</text>
  <text x="356.3759" y="235.543" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">network partition</text>
  <text x="356.3759" y="244.547" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">node OOM / crash</text>
  <line x1="207.8109" y1="150.906" x2="297.8503" y2="218.4356" stroke="var(--danger-border)" stroke-width="0.7279" stroke-dasharray="1.8197 1.0918" marker-end="url(#arrow)" />
  <text x="234.8227" y="195.9257" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">node failure</text>
  <rect x="441.9134" y="195.9257" width="117.0512" height="58.5256" rx="4.8115" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.2966" filter="url(#shadow)" />
  <rect x="441.9134" y="195.9257" width="117.0512" height="20.7091" rx="4.8115" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.2966" />

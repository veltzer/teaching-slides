  <rect x="297.8503" y="78.8745" width="108.0472" height="72.0316" rx="4.8115" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.2966" filter="url(#shadow)" />
  <rect x="297.8503" y="78.8745" width="108.0472" height="20.7091" rx="4.8115" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.2966" />
  <rect x="297.8503" y="94.1812" width="108.0472" height="5.4023" fill="var(--warn-fill)" rx="4.8115" stroke="var(--warn-border)" stroke-width="1.2966" />
  <text x="351.874" y="93.2808" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--bg)">Cordoned</text>

  <text x="951.7709" y="284.5019" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3145" fill="var(--primary-accent)">Pods evicted gracefully</text>
  <text x="951.7709" y="298.0304" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3145" fill="var(--primary-accent)">Rescheduled elsewhere</text>
  <text x="951.7709" y="311.5585" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3145" fill="var(--primary-accent)">DaemonSet pods skip</text>
  <text x="951.7709" y="329.8214" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3145" fill="var(--text-muted)">safe to maintain node now</text>

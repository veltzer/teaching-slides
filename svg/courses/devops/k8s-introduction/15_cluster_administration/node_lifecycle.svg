  <text x="951.7709" y="487.4244" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3145" fill="var(--danger-accent)">Scale-in / decommission</text>
  <line x1="951.7709" y1="346.7316" x2="951.7709" y2="414.3724" stroke="var(--danger-border)" stroke-width="0.4286" stroke-dasharray="1.0714 0.6428" marker-end="url(#arrow)" />
  <text x="967.2369" y="384.6105" font-family="Arial,sans-serif" font-size="17.3145" fill="var(--danger-accent)">kubectl delete node</text>
  <rect x="396.4028" y="521.2447" width="407.7386" height="94.697" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="403.4328" y="534.7728" font-family="Arial,sans-serif" font-size="17.3145" font-weight="bold" fill="var(--text)">Node Lifecycle Commands</text>
  <text x="410.4629" y="548.3008" font-family="monospace" font-size="17.3145" fill="var(--ok-accent)">kubectl cordon &lt;node&gt;   — mark unschedulable</text>
  <text x="410.4629" y="561.8291" font-family="monospace" font-size="17.3145" fill="var(--warn-accent)">kubectl drain &lt;node&gt; --ignore-daemonsets --delete-emptydir-data</text>
  <text x="410.4629" y="575.3573" font-family="monospace" font-size="17.3145" fill="var(--primary-accent)">kubectl uncordon &lt;node&gt;   — re-enable scheduling</text>
  <text x="410.4629" y="588.8852" font-family="monospace" font-size="17.3145" fill="var(--danger-accent)">kubectl delete node &lt;node&gt;   — remove from cluster</text>
  <text x="410.4629" y="602.4135" font-family="monospace" font-size="17.3145" fill="var(--text-muted)">kubectl get nodes -o wide  |  kubectl describe node  |  kubectl top nodes</text>
  <rect x="832.2614" y="521.2447" width="407.7386" height="94.697" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="839.2915" y="534.7728" font-family="Arial,sans-serif" font-size="17.3145" font-weight="bold" fill="var(--ok-accent)">Node Conditions (kubectl describe node)</text>
  <text x="846.3212" y="548.3008" font-family="monospace" font-size="17.3145" fill="var(--text-muted)">Ready              — kubelet healthy and pod-ready</text>
  <text x="846.3212" y="561.8291" font-family="monospace" font-size="17.3145" fill="var(--text-muted)">MemoryPressure    — node running low on memory</text>
  <text x="846.3212" y="575.3573" font-family="monospace" font-size="17.3145" fill="var(--text-muted)">DiskPressure      — node low on disk space</text>
  <text x="846.3212" y="588.8852" font-family="monospace" font-size="17.3145" fill="var(--text-muted)">PIDPressure       — too many processes on node</text>
  <text x="846.3212" y="602.4135" font-family="monospace" font-size="17.3145" fill="var(--text-muted)">NetworkUnavailable — CNI plugin not configured</text>
  <text x="846.3212" y="620" font-family="Arial,sans-serif" font-size="17.3145" fill="var(--text-muted)">Pod eviction triggered automatically on pressure. PodDisruptionBudget protects apps during drain.</text>
</svg>
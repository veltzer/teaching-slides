  <text x="351.874" y="118.4919" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)">Existing pods still run</text>
  <text x="351.874" y="127.4958" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)">No new pods scheduled</text>
  <text x="351.874" y="139.6511" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">condition: SchedulingDisabled</text>

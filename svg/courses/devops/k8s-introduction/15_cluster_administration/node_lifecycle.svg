<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Node States top row -->

  <!-- Ready -->
  <rect x="60" y="60" width="240" height="160" rx="14" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="60" y="60" width="240" height="46" rx="14" fill="#388e3c"/>
  <rect x="60" y="94" width="240" height="12" fill="#388e3c"/>
  <text x="180" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">Ready</text>
  <text x="180" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#2e7d32">kubelet healthy</text>
  <text x="180" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#2e7d32">Accepts new pods</text>
  <text x="180" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#2e7d32">Schedulable=true</text>
  <text x="180" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">condition: Ready=True</text>

  <!-- Arrow Ready → Cordoned -->
  <line x1="300" y1="140" x2="380" y2="140" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="340" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">kubectl cordon</text>

  <!-- Cordoned -->
  <rect x="380" y="60" width="240" height="160" rx="14" fill="#fff3e0" stroke="#f57c00" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="380" y="60" width="240" height="46" rx="14" fill="#f57c00"/>
  <rect x="380" y="94" width="240" height="12" fill="#f57c00"/>
  <text x="500" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">Cordoned</text>
  <text x="500" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#e65100">Schedulable=false</text>
  <text x="500" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#e65100">Existing pods still run</text>
  <text x="500" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#e65100">No new pods scheduled</text>
  <text x="500" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">condition: SchedulingDisabled</text>

  <!-- Arrow Cordoned → Drained -->
  <line x1="620" y1="140" x2="700" y2="140" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="660" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">kubectl drain</text>

  <!-- Drained -->
  <rect x="700" y="60" width="260" height="160" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="700" y="60" width="260" height="46" rx="14" fill="#3949ab"/>
  <rect x="700" y="94" width="260" height="12" fill="#3949ab"/>
  <text x="830" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">Drained</text>
  <text x="830" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#283593">Pods evicted gracefully</text>
  <text x="830" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#283593">Rescheduled elsewhere</text>
  <text x="830" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#283593">DaemonSet pods skip</text>
  <text x="830" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">safe to maintain node now</text>

  <!-- Arrow Drained → Maintenance -->
  <line x1="960" y1="140" x2="1040" y2="140" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1000" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">maintenance</text>

  <!-- Maintenance -->
  <rect x="1040" y="60" width="200" height="160" rx="14" fill="#eceff1" stroke="#607d8b" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="1040" y="60" width="200" height="46" rx="14" fill="#607d8b"/>
  <rect x="1040" y="94" width="200" height="12" fill="#607d8b"/>
  <text x="1140" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">Maintenance</text>
  <text x="1140" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#37474f">OS upgrade</text>
  <text x="1140" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#37474f">kernel patch</text>
  <text x="1140" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#37474f">hardware replace</text>
  <text x="1140" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">node offline</text>

  <!-- Arrow back: Maintenance → Ready (uncordon) -->
  <path d="M 1140 220 Q 1140 270 660 270 Q 180 270 180 220" fill="none" stroke="#388e3c" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="660" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#388e3c">kubectl uncordon (node rejoins)</text>

  <!-- NotReady state -->
  <rect x="380" y="320" width="260" height="130" rx="14" fill="#ffebee" stroke="#c62828" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="380" y="320" width="260" height="46" rx="14" fill="#c62828"/>
  <rect x="380" y="354" width="260" height="12" fill="#c62828"/>
  <text x="510" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">NotReady</text>
  <text x="510" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#b71c1c">kubelet stopped heartbeat</text>
  <text x="510" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#b71c1c">network partition</text>
  <text x="510" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#b71c1c">node OOM / crash</text>

  <!-- Arrow Ready → NotReady (failure) -->
  <line x1="180" y1="220" x2="380" y2="370" stroke="#c62828" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="240" y="320" font-family="Arial,sans-serif" font-size="11" fill="#c62828">node failure</text>

  <!-- Delete node -->
  <rect x="700" y="320" width="260" height="130" rx="14" fill="#fce4ec" stroke="#e91e63" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="700" y="320" width="260" height="46" rx="14" fill="#e91e63"/>
  <rect x="700" y="354" width="260" height="12" fill="#e91e63"/>
  <text x="830" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">Deleted</text>
  <text x="830" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#880e4f">kubectl delete node</text>
  <text x="830" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#880e4f">Removed from cluster</text>
  <text x="830" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#880e4f">Scale-in / decommission</text>

  <!-- Arrow Drained → Deleted -->
  <line x1="830" y1="220" x2="830" y2="320" stroke="#e91e63" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="852" y="276" font-family="Arial,sans-serif" font-size="11" fill="#e91e63">kubectl delete node</text>

  <!-- Commands reference -->
  <rect x="40" y="478" width="580" height="140" rx="12" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="50" y="498" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#333">Node Lifecycle Commands</text>
  <text x="60" y="518" font-family="monospace" font-size="12" fill="#388e3c">kubectl cordon &lt;node&gt;   — mark unschedulable</text>
  <text x="60" y="538" font-family="monospace" font-size="12" fill="#f57c00">kubectl drain &lt;node&gt; --ignore-daemonsets --delete-emptydir-data</text>
  <text x="60" y="558" font-family="monospace" font-size="12" fill="#1565c0">kubectl uncordon &lt;node&gt;   — re-enable scheduling</text>
  <text x="60" y="578" font-family="monospace" font-size="12" fill="#e91e63">kubectl delete node &lt;node&gt;   — remove from cluster</text>
  <text x="60" y="598" font-family="monospace" font-size="12" fill="#555">kubectl get nodes -o wide  |  kubectl describe node  |  kubectl top nodes</text>

  <!-- Node conditions reference -->
  <rect x="660" y="478" width="580" height="140" rx="12" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="670" y="498" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">Node Conditions (kubectl describe node)</text>
  <text x="680" y="518" font-family="monospace" font-size="12" fill="#555">Ready              — kubelet healthy and pod-ready</text>
  <text x="680" y="538" font-family="monospace" font-size="12" fill="#555">MemoryPressure    — node running low on memory</text>
  <text x="680" y="558" font-family="monospace" font-size="12" fill="#555">DiskPressure      — node low on disk space</text>
  <text x="680" y="578" font-family="monospace" font-size="12" fill="#555">PIDPressure       — too many processes on node</text>
  <text x="680" y="598" font-family="monospace" font-size="12" fill="#555">NetworkUnavailable — CNI plugin not configured</text>
  <text x="680" y="624" font-family="Arial,sans-serif" font-size="11" fill="#777">Pod eviction triggered automatically on pressure. PodDisruptionBudget protects apps during drain.</text>
</svg>

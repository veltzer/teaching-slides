  <text x="1169.7002" y="298.0304" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3145" fill="var(--text-muted)">kernel patch</text>
  <text x="1169.7002" y="311.5585" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3145" fill="var(--text-muted)">hardware replace</text>
  <text x="1169.7002" y="329.8214" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3145" fill="var(--text-muted)">node offline</text>

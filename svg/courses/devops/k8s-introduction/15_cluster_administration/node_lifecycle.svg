  <text x="525.3001" y="202.9042" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">kubectl delete node</text>
  <rect x="201.91" y="283.3535" width="230.9929" height="55.7569" rx="5.3079" fill="var(--surface)" stroke="var(--border)" stroke-width="0.5888" />
  <text x="205.8927" y="291.3187" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--text)">Node Lifecycle Commands</text>
  <text x="209.8754" y="299.2839" font-family="monospace" font-size="10" fill="var(--ok-accent)">kubectl cordon &lt;node&gt;   — mark unschedulable</text>
  <text x="209.8754" y="307.2493" font-family="monospace" font-size="10" fill="var(--warn-accent)">kubectl drain &lt;node&gt; --ignore-daemonsets --delete-emptydir-data</text>
  <text x="209.8754" y="315.2146" font-family="monospace" font-size="10" fill="var(--primary-accent)">kubectl uncordon &lt;node&gt;   — re-enable scheduling</text>
  <text x="209.8754" y="323.1797" font-family="monospace" font-size="10" fill="var(--danger-accent)">kubectl delete node &lt;node&gt;   — remove from cluster</text>
  <text x="209.8754" y="331.1451" font-family="monospace" font-size="10" fill="var(--text-muted)">kubectl get nodes -o wide  |  kubectl describe node  |  kubectl top nodes</text>
  <rect x="448.8335" y="283.3535" width="230.9929" height="55.7569" rx="5.3079" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1776" />
  <text x="452.8162" y="291.3187" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Node Conditions (kubectl describe node)</text>
  <text x="456.7987" y="299.2839" font-family="monospace" font-size="10" fill="var(--text-muted)">Ready              — kubelet healthy and pod-ready</text>
  <text x="456.7987" y="307.2493" font-family="monospace" font-size="10" fill="var(--text-muted)">MemoryPressure    — node running low on memory</text>
  <text x="456.7987" y="315.2146" font-family="monospace" font-size="10" fill="var(--text-muted)">DiskPressure      — node low on disk space</text>
  <text x="456.7987" y="323.1797" font-family="monospace" font-size="10" fill="var(--text-muted)">PIDPressure       — too many processes on node</text>
  <text x="456.7987" y="331.1451" font-family="monospace" font-size="10" fill="var(--text-muted)">NetworkUnavailable — CNI plugin not configured</text>
  <text x="456.7987" y="341.4999" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Pod eviction triggered automatically on pressure. PodDisruptionBudget protects apps during drain.</text>

  <text x="500.4389" y="235.543" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">Removed from cluster</text>
  <text x="500.4389" y="244.547" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">Scale-in / decommission</text>
  <line x1="500.4389" y1="150.906" x2="500.4389" y2="195.9257" stroke="var(--danger-border)" stroke-width="0.7279" stroke-dasharray="1.8197 1.0918" marker-end="url(#arrow)" />
  <text x="510.3433" y="176.1171" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">kubectl delete node</text>
  <rect x="144.7833" y="267.0569" width="261.1143" height="63.0276" rx="4.8115" fill="var(--surface)" stroke="var(--border)" stroke-width="0.6483" />
  <text x="149.2853" y="276.0608" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--text)">Node Lifecycle Commands</text>
  <text x="153.7873" y="285.0647" font-family="monospace" font-size="10" fill="var(--ok-accent)">kubectl cordon &lt;node&gt;   — mark unschedulable</text>
  <text x="153.7873" y="294.0687" font-family="monospace" font-size="10" fill="var(--warn-accent)">kubectl drain &lt;node&gt; --ignore-daemonsets --delete-emptydir-data</text>
  <text x="153.7873" y="303.0727" font-family="monospace" font-size="10" fill="var(--primary-accent)">kubectl uncordon &lt;node&gt;   — re-enable scheduling</text>
  <text x="153.7873" y="312.0765" font-family="monospace" font-size="10" fill="var(--danger-accent)">kubectl delete node &lt;node&gt;   — remove from cluster</text>
  <text x="153.7873" y="321.0805" font-family="monospace" font-size="10" fill="var(--text-muted)">kubectl get nodes -o wide  |  kubectl describe node  |  kubectl top nodes</text>
  <rect x="423.9055" y="267.0569" width="261.1143" height="63.0276" rx="4.8115" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.2966" />
  <text x="428.4075" y="276.0608" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Node Conditions (kubectl describe node)</text>
  <text x="432.9094" y="285.0647" font-family="monospace" font-size="10" fill="var(--text-muted)">Ready              — kubelet healthy and pod-ready</text>
  <text x="432.9094" y="294.0687" font-family="monospace" font-size="10" fill="var(--text-muted)">MemoryPressure    — node running low on memory</text>
  <text x="432.9094" y="303.0727" font-family="monospace" font-size="10" fill="var(--text-muted)">DiskPressure      — node low on disk space</text>
  <text x="432.9094" y="312.0765" font-family="monospace" font-size="10" fill="var(--text-muted)">PIDPressure       — too many processes on node</text>
  <text x="432.9094" y="321.0805" font-family="monospace" font-size="10" fill="var(--text-muted)">NetworkUnavailable — CNI plugin not configured</text>
  <text x="432.9094" y="332.7856" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Pod eviction triggered automatically on pressure. PodDisruptionBudget protects apps during drain.</text>
</svg>
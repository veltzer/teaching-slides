  <text x="207.8109" y="139.6511" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">condition: Ready=True</text>
  <line x1="261.8346" y1="114.8903" x2="297.8503" y2="114.8903" stroke="var(--text-muted)" stroke-width="0.9099" marker-end="url(#arrow)" />

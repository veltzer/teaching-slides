  <rect x="441.9134" y="78.8745" width="117.0512" height="20.7091" rx="4.8115" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.2966" />
  <rect x="441.9134" y="94.1812" width="117.0512" height="5.4023" fill="var(--primary-fill)" rx="4.8115" stroke="var(--primary-border)" stroke-width="1.2966" />
  <text x="500.4389" y="93.2808" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--bg)">Drained</text>
  <text x="500.4389" y="109.4878" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-accent)">Pods evicted gracefully</text>
  <text x="500.4389" y="118.4919" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-accent)">Rescheduled elsewhere</text>
  <text x="500.4389" y="127.4958" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-accent)">DaemonSet pods skip</text>
  <text x="500.4389" y="139.6511" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">safe to maintain node now</text>
  <line x1="558.9646" y1="114.8903" x2="594.9803" y2="114.8903" stroke="var(--text-muted)" stroke-width="0.9099" marker-end="url(#arrow)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="220" height="189.615384615385" rx="8.448941672459" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="79.038461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763032" font-weight="bold" fill="var(--ok-text)">Ready</text>
  <text x="150" y="118.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">kubelet healthy</text>
  <text x="150" y="145.961538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">Accepts pods</text>
  <text x="150" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">Schedulable=true</text>

  <line x1="265" y1="134.807692307693" x2="310" y2="134.807692307693" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="287" y="123.653846153846" text-anchor="middle" font-family="Courier New, monospace" font-size="11.617294799631" fill="var(--text-muted)">cordon</text>

  <rect x="315" y="40" width="220" height="189.615384615385" rx="8.448941672459" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="79.038461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763032" font-weight="bold" fill="var(--warn-text)">Cordoned</text>
  <text x="425" y="118.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">Unschedulable</text>
  <text x="425" y="145.961538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">Existing pods stay</text>
  <text x="425" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">No new pods</text>

  <line x1="540" y1="134.807692307693" x2="585" y2="134.807692307693" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="562" y="123.653846153846" text-anchor="middle" font-family="Courier New, monospace" font-size="11.617294799631" fill="var(--text-muted)">drain</text>

  <rect x="590" y="40" width="220" height="189.615384615385" rx="8.448941672459" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="79.038461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763032" font-weight="bold" fill="var(--info-text)">Drained</text>
  <text x="700" y="118.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">Pods evicted</text>
  <text x="700" y="145.961538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">Rescheduled away</text>
  <text x="700" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">DaemonSets skip</text>

  <line x1="815" y1="134.807692307693" x2="860" y2="134.807692307693" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="865" y="40" width="220" height="189.615384615385" rx="8.448941672459" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="975" y="79.038461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763032" font-weight="bold" fill="var(--text)">Maintenance</text>
  <text x="975" y="118.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--text-muted)">OS upgrade</text>
  <text x="975" y="145.961538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--text-muted)">Kernel patch</text>
  <text x="975" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--text-muted)">Hardware</text>

  <path d="M 975 235.192307692308 Q 975 274.230769230769 500 274.230769230769 Q 150 274.230769230769 150 235.192307692308" fill="none" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-ok)"/>
  <text x="560" y="290.961538461539" text-anchor="middle" font-family="Courier New, monospace" font-size="12.673412508689" fill="var(--ok-accent)">uncordon - rejoins</text>

  <rect x="315" y="330" width="220" height="145" rx="8.448941672459" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="369.038461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763032" font-weight="bold" fill="var(--danger-text)">NotReady</text>
  <text x="425" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--danger-text)">Heartbeat lost</text>
  <text x="425" y="430.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--danger-text)">Network / OOM</text>

  <rect x="590" y="330" width="220" height="145" rx="8.448941672459" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="369.038461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763032" font-weight="bold" fill="var(--danger-text)">Deleted</text>
  <text x="700" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--danger-text)">Removed from cluster</text>
  <text x="700" y="430.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--danger-text)">Scale-in</text>

  <rect x="40" y="497.307692307693" width="590" height="122.692307692308" rx="8.448941672459" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="55" y="525.192307692308" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--text)">Commands</text>
  <text x="55" y="550.846153846153" font-family="Courier New, monospace" font-size="12.673412508689" fill="var(--ok-accent)">kubectl cordon</text>
  <text x="55" y="573.153846153846" font-family="Courier New, monospace" font-size="12.673412508689" fill="var(--warn-accent)">kubectl drain</text>
  <text x="55" y="595.461538461538" font-family="Courier New, monospace" font-size="12.673412508689" fill="var(--primary-accent)">kubectl uncordon</text>
  <text x="55" y="616.653846153847" font-family="Courier New, monospace" font-size="12.673412508689" fill="var(--danger-accent)">kubectl delete node</text>

  <rect x="650" y="497.307692307693" width="590" height="122.692307692308" rx="8.448941672459" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="665" y="525.192307692308" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--ok-text)">Conditions</text>
  <text x="665" y="550.846153846153" font-family="Courier New, monospace" font-size="12.673412508689" fill="var(--ok-text)">Ready</text>
  <text x="665" y="573.153846153846" font-family="Courier New, monospace" font-size="12.673412508689" fill="var(--ok-text)">MemoryPressure</text>
  <text x="665" y="595.461538461538" font-family="Courier New, monospace" font-size="12.673412508689" fill="var(--ok-text)">DiskPressure</text>
  <text x="665" y="616.653846153847" font-family="Courier New, monospace" font-size="12.673412508689" fill="var(--ok-text)">PIDPressure</text>
</svg>

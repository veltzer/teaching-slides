  <ns0:text x="28.0702" y="279.5789" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#333">Node Lifecycle Commands</ns0:text>
  <ns0:text x="33.6842" y="290.807" font-family="monospace" font-size="10" fill="#388e3c">kubectl cordon &lt;node&gt;   — mark unschedulable</ns0:text>
  <ns0:text x="33.6842" y="302.0351" font-family="monospace" font-size="10" fill="#f57c00">kubectl drain &lt;node&gt; --ignore-daemonsets --delete-emptydir-data</ns0:text>
  <ns0:text x="33.6842" y="313.2632" font-family="monospace" font-size="10" fill="#1565c0">kubectl uncordon &lt;node&gt;   — re-enable scheduling</ns0:text>
  <ns0:text x="33.6842" y="324.4912" font-family="monospace" font-size="10" fill="#e91e63">kubectl delete node &lt;node&gt;   — remove from cluster</ns0:text>
  <ns0:text x="33.6842" y="335.7193" font-family="monospace" font-size="10" fill="#555">kubectl get nodes -o wide  |  kubectl describe node  |  kubectl top nodes</ns0:text>
  <ns0:rect x="370.5263" y="268.3509" width="325.614" height="78.5965" rx="6.7368" fill="#e8f5e9" stroke="#388e3c" stroke-width="0.8421" />
  <ns0:text x="376.1404" y="279.5789" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">Node Conditions (kubectl describe node)</ns0:text>
  <ns0:text x="381.7544" y="290.807" font-family="monospace" font-size="10" fill="#555">Ready              — kubelet healthy and pod-ready</ns0:text>
  <ns0:text x="381.7544" y="302.0351" font-family="monospace" font-size="10" fill="#555">MemoryPressure    — node running low on memory</ns0:text>
  <ns0:text x="381.7544" y="313.2632" font-family="monospace" font-size="10" fill="#555">DiskPressure      — node low on disk space</ns0:text>
  <ns0:text x="381.7544" y="324.4912" font-family="monospace" font-size="10" fill="#555">PIDPressure       — too many processes on node</ns0:text>
  <ns0:text x="381.7544" y="335.7193" font-family="monospace" font-size="10" fill="#555">NetworkUnavailable — CNI plugin not configured</ns0:text>
  <ns0:text x="381.7544" y="350.3158" font-family="Arial,sans-serif" font-size="10" fill="#777">Pod eviction triggered automatically on pressure. PodDisruptionBudget protects apps during drain.</ns0:text>

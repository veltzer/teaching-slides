<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.209610966678" font-weight="bold" fill="var(--text)">Node Lifecycle</text>

  <rect x="40" y="90.877192982456" width="220" height="172.982456140351" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--ok-text)">Ready</text>
  <text x="150" y="162.105263157895" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">kubelet healthy</text>
  <text x="150" y="187.543859649123" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">Accepts pods</text>
  <text x="150" y="212.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">Schedulable=true</text>

  <line x1="265" y1="177.368421052632" x2="310" y2="177.368421052632" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="287" y="167.19298245614" text-anchor="middle" font-family="Courier New, monospace" font-size="11.096071693061" fill="var(--text-muted)">cordon</text>

  <rect x="315" y="90.877192982456" width="220" height="172.982456140351" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--warn-text)">Cordoned</text>
  <text x="425" y="162.105263157895" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">Unschedulable</text>
  <text x="425" y="187.543859649123" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">Existing pods stay</text>
  <text x="425" y="212.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">No new pods</text>

  <line x1="540" y1="177.368421052632" x2="585" y2="177.368421052632" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="562" y="167.19298245614" text-anchor="middle" font-family="Courier New, monospace" font-size="11.096071693061" fill="var(--text-muted)">drain</text>

  <rect x="590" y="90.877192982456" width="220" height="172.982456140351" rx="8.069870322226" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--info-text)">Drained</text>
  <text x="700" y="162.105263157895" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--info-text)">Pods evicted</text>
  <text x="700" y="187.543859649123" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--info-text)">Rescheduled away</text>
  <text x="700" y="212.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--info-text)">DaemonSets skip</text>

  <line x1="815" y1="177.368421052632" x2="860" y2="177.368421052632" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="865" y="90.877192982456" width="220" height="172.982456140351" rx="8.069870322226" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="975" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--text)">Maintenance</text>
  <text x="975" y="162.105263157895" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text-muted)">OS upgrade</text>
  <text x="975" y="187.543859649123" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text-muted)">Kernel patch</text>
  <text x="975" y="212.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text-muted)">Hardware</text>

  <path d="M 975 268.947368421053 Q 975 304.561403508772 500 304.561403508772 Q 150 304.561403508772 150 268.947368421053" fill="none" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-ok)"/>
  <text x="560" y="319.824561403509" text-anchor="middle" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--ok-accent)">uncordon - rejoins</text>

  <rect x="315" y="355.438596491228" width="220" height="132.280701754386" rx="8.069870322226" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="391.052631578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--danger-text)">NotReady</text>
  <text x="425" y="421.578947368421" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">Heartbeat lost</text>
  <text x="425" y="447.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">Network / OOM</text>

  <rect x="590" y="355.438596491228" width="220" height="132.280701754386" rx="8.069870322226" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="391.052631578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--danger-text)">Deleted</text>
  <text x="700" y="421.578947368421" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">Removed from cluster</text>
  <text x="700" y="447.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">Scale-in</text>

  <rect x="40" y="508.070175438597" width="590" height="111.929824561404" rx="8.069870322226" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="55" y="533.508771929825" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--text)">Commands</text>
  <text x="55" y="556.912280701754" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--ok-accent)">kubectl cordon</text>
  <text x="55" y="577.263157894737" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--warn-accent)">kubectl drain</text>
  <text x="55" y="597.614035087719" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--primary-accent)">kubectl uncordon</text>
  <text x="55" y="616.947368421053" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--danger-accent)">kubectl delete node</text>

  <rect x="650" y="508.070175438597" width="590" height="111.929824561404" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="665" y="533.508771929825" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--ok-text)">Conditions</text>
  <text x="665" y="556.912280701754" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--ok-text)">Ready</text>
  <text x="665" y="577.263157894737" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--ok-text)">MemoryPressure</text>
  <text x="665" y="597.614035087719" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--ok-text)">DiskPressure</text>
  <text x="665" y="616.947368421053" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--ok-text)">PIDPressure</text>
</svg>

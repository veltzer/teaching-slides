  <text x="640" y="109.4878" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">OS upgrade</text>
  <text x="640" y="118.4919" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">kernel patch</text>
  <text x="640" y="127.4958" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">hardware replace</text>
  <text x="640" y="139.6511" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">node offline</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="718.5965" height="404.2105" fill="var(--bg)" rx="6"/>
  <rect x="33.6842" y="33.6842" width="134.7368" height="89.8246" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="33.6842" y="33.6842" width="134.7368" height="25.8246" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="33.6842" y="52.7719" width="134.7368" height="6.7368" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="101.0526" y="51.6491" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.1053" font-weight="bold" fill="var(--bg)">Ready</text>
  <text x="101.0526" y="71.8596" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--ok-accent)">kubelet healthy</text>
  <text x="101.0526" y="83.0877" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--ok-accent)">Accepts new pods</text>
  <text x="101.0526" y="94.3158" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--ok-accent)">Schedulable=true</text>
  <text x="101.0526" y="109.4737" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">condition: Ready=True</text>
  <line x1="168.4211" y1="78.5965" x2="213.3333" y2="78.5965" stroke="var(--text-muted)" stroke-width="1.4035" marker-end="url(#arrow)" />
  <text x="190.8772" y="71.8596" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">kubectl cordon</text>
  <rect x="213.3333" y="33.6842" width="134.7368" height="89.8246" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="213.3333" y="33.6842" width="134.7368" height="25.8246" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="213.3333" y="52.7719" width="134.7368" height="6.7368" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="280.7018" y="51.6491" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.1053" font-weight="bold" fill="var(--bg)">Cordoned</text>
  <text x="280.7018" y="71.8596" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)">Schedulable=false</text>
  <text x="280.7018" y="83.0877" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)">Existing pods still run</text>
  <text x="280.7018" y="94.3158" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--warn-accent)">No new pods scheduled</text>
  <text x="280.7018" y="109.4737" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">condition: SchedulingDisabled</text>
  <line x1="348.0702" y1="78.5965" x2="392.9825" y2="78.5965" stroke="var(--text-muted)" stroke-width="1.4035" marker-end="url(#arrow)" />
  <text x="370.5263" y="71.8596" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">kubectl drain</text>
  <rect x="392.9825" y="33.6842" width="145.9649" height="89.8246" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="392.9825" y="33.6842" width="145.9649" height="25.8246" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="392.9825" y="52.7719" width="145.9649" height="6.7368" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="465.9649" y="51.6491" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.1053" font-weight="bold" fill="var(--bg)">Drained</text>
  <text x="465.9649" y="71.8596" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-accent)">Pods evicted gracefully</text>
  <text x="465.9649" y="83.0877" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-accent)">Rescheduled elsewhere</text>
  <text x="465.9649" y="94.3158" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-accent)">DaemonSet pods skip</text>
  <text x="465.9649" y="109.4737" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">safe to maintain node now</text>
  <line x1="538.9474" y1="78.5965" x2="583.8596" y2="78.5965" stroke="var(--text-muted)" stroke-width="1.4035" marker-end="url(#arrow)" />
  <text x="561.4035" y="71.8596" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">maintenance</text>
  <rect x="583.8596" y="33.6842" width="112.2807" height="89.8246" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="583.8596" y="33.6842" width="112.2807" height="25.8246" rx="6" fill="var(--text-muted)" />
  <rect x="583.8596" y="52.7719" width="112.2807" height="6.7368" fill="var(--text-muted)" rx="6"/>
  <text x="640" y="51.6491" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.1053" font-weight="bold" fill="var(--bg)">Maintenance</text>
  <text x="640" y="71.8596" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">OS upgrade</text>
  <text x="640" y="83.0877" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">kernel patch</text>
  <text x="640" y="94.3158" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">hardware replace</text>
  <text x="640" y="109.4737" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">node offline</text>
  <path d="M 640 123.5088 Q 640 151.5789 370.5263 151.5789 Q 101.0526 151.5789 101.0526 123.5088" fill="none" stroke="var(--ok-border)" stroke-width="1.1228" stroke-dasharray="3.3684 1.6842" marker-end="url(#arrow)" />
  <text x="370.5263" y="163.9298" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--ok-accent)">kubectl uncordon (node rejoins)</text>
  <rect x="213.3333" y="179.6491" width="145.9649" height="72.9825" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="213.3333" y="179.6491" width="145.9649" height="25.8246" rx="6" fill="var(--danger-accent)" />
  <rect x="213.3333" y="198.7368" width="145.9649" height="6.7368" fill="var(--danger-accent)" rx="6"/>
  <text x="286.3158" y="197.614" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.1053" font-weight="bold" fill="var(--bg)">NotReady</text>
  <text x="286.3158" y="217.8246" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">kubelet stopped heartbeat</text>
  <text x="286.3158" y="229.0526" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">network partition</text>
  <text x="286.3158" y="240.2807" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">node OOM / crash</text>
  <line x1="101.0526" y1="123.5088" x2="213.3333" y2="207.7193" stroke="var(--danger-border)" stroke-width="1.1228" stroke-dasharray="2.807 1.6842" marker-end="url(#arrow)" />
  <text x="134.7368" y="179.6491" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">node failure</text>
  <rect x="392.9825" y="179.6491" width="145.9649" height="72.9825" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="392.9825" y="179.6491" width="145.9649" height="25.8246" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="392.9825" y="198.7368" width="145.9649" height="6.7368" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="465.9649" y="197.614" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.1053" font-weight="bold" fill="var(--bg)">Deleted</text>
  <text x="465.9649" y="217.8246" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">kubectl delete node</text>
  <text x="465.9649" y="229.0526" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">Removed from cluster</text>
  <text x="465.9649" y="240.2807" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">Scale-in / decommission</text>
  <line x1="465.9649" y1="123.5088" x2="465.9649" y2="179.6491" stroke="var(--danger-border)" stroke-width="1.1228" stroke-dasharray="2.807 1.6842" marker-end="url(#arrow)" />
  <text x="478.3158" y="154.9474" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">kubectl delete node</text>
  <rect x="22.4561" y="268.3509" width="325.614" height="78.5965" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="28.0702" y="279.5789" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--text)">Node Lifecycle Commands</text>
  <text x="33.6842" y="290.807" font-family="monospace" font-size="10" fill="var(--ok-accent)">kubectl cordon &lt;node&gt;   — mark unschedulable</text>
  <text x="33.6842" y="302.0351" font-family="monospace" font-size="10" fill="var(--warn-accent)">kubectl drain &lt;node&gt; --ignore-daemonsets --delete-emptydir-data</text>
  <text x="33.6842" y="313.2632" font-family="monospace" font-size="10" fill="var(--primary-accent)">kubectl uncordon &lt;node&gt;   — re-enable scheduling</text>
  <text x="33.6842" y="324.4912" font-family="monospace" font-size="10" fill="var(--danger-accent)">kubectl delete node &lt;node&gt;   — remove from cluster</text>
  <text x="33.6842" y="335.7193" font-family="monospace" font-size="10" fill="var(--text-muted)">kubectl get nodes -o wide  |  kubectl describe node  |  kubectl top nodes</text>
  <rect x="370.5263" y="268.3509" width="325.614" height="78.5965" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="376.1404" y="279.5789" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Node Conditions (kubectl describe node)</text>
  <text x="381.7544" y="290.807" font-family="monospace" font-size="10" fill="var(--text-muted)">Ready              — kubelet healthy and pod-ready</text>
  <text x="381.7544" y="302.0351" font-family="monospace" font-size="10" fill="var(--text-muted)">MemoryPressure    — node running low on memory</text>
  <text x="381.7544" y="313.2632" font-family="monospace" font-size="10" fill="var(--text-muted)">DiskPressure      — node low on disk space</text>
  <text x="381.7544" y="324.4912" font-family="monospace" font-size="10" fill="var(--text-muted)">PIDPressure       — too many processes on node</text>
  <text x="381.7544" y="335.7193" font-family="monospace" font-size="10" fill="var(--text-muted)">NetworkUnavailable — CNI plugin not configured</text>
  <text x="381.7544" y="350.3158" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Pod eviction triggered automatically on pressure. PodDisruptionBudget protects apps during drain.</text>
</svg>
  <text x="832.2614" y="395.4329" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3145" fill="var(--ok-accent)">kubectl uncordon (node rejoins)</text>
  <rect x="635.4219" y="414.3724" width="182.7793" height="87.933" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />

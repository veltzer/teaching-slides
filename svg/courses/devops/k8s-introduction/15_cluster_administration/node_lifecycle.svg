<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="888.889" height="500" fill="var(--bg)" rx="7.4219"/>
  <rect x="237.2222" y="121.6667" width="166.6666" height="111.1112" rx="7.4219" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="237.2222" y="121.6667" width="166.6666" height="31.9445" rx="7.4219" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="237.2222" y="145.2777" width="166.6666" height="8.3333" fill="var(--ok-fill)" rx="7.4219" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="320.5555" y="143.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.5" font-weight="bold" fill="var(--bg)">Ready</text>
  <text x="320.5555" y="168.8888" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--ok-accent)">kubelet healthy</text>
  <text x="320.5555" y="182.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--ok-accent)">Accepts new pods</text>
  <text x="320.5555" y="196.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--ok-accent)">Schedulable=true</text>
  <text x="320.5555" y="215.4167" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--text-muted)">condition: Ready=True</text>
  <line x1="403.8889" y1="177.2222" x2="459.4444" y2="177.2222" stroke="var(--text-muted)" stroke-width="1.4035" marker-end="url(#arrow)" />
  <text x="431.6667" y="168.8888" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--text-muted)">kubectl cordon</text>
  <rect x="459.4444" y="121.6667" width="166.6666" height="111.1112" rx="7.4219" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="459.4444" y="121.6667" width="166.6666" height="31.9445" rx="7.4219" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="459.4444" y="145.2777" width="166.6666" height="8.3333" fill="var(--warn-fill)" rx="7.4219" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="542.7778" y="143.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.5" font-weight="bold" fill="var(--bg)">Cordoned</text>
  <text x="542.7778" y="168.8888" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--warn-accent)">Schedulable=false</text>
  <text x="542.7778" y="182.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--warn-accent)">Existing pods still run</text>
  <text x="542.7778" y="196.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--warn-accent)">No new pods scheduled</text>
  <text x="542.7778" y="215.4167" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--text-muted)">condition: SchedulingDisabled</text>
  <line x1="626.1111" y1="177.2222" x2="681.6667" y2="177.2222" stroke="var(--text-muted)" stroke-width="1.4035" marker-end="url(#arrow)" />
  <text x="653.8889" y="168.8888" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--text-muted)">kubectl drain</text>
  <rect x="681.6667" y="121.6667" width="180.5556" height="111.1112" rx="7.4219" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="681.6667" y="121.6667" width="180.5556" height="31.9445" rx="7.4219" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="681.6667" y="145.2777" width="180.5556" height="8.3333" fill="var(--primary-fill)" rx="7.4219" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="771.9444" y="143.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.5" font-weight="bold" fill="var(--bg)">Drained</text>
  <text x="771.9444" y="168.8888" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--primary-accent)">Pods evicted gracefully</text>
  <text x="771.9444" y="182.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--primary-accent)">Rescheduled elsewhere</text>
  <text x="771.9444" y="196.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--primary-accent)">DaemonSet pods skip</text>
  <text x="771.9444" y="215.4167" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--text-muted)">safe to maintain node now</text>
  <line x1="862.2223" y1="177.2222" x2="917.7777" y2="177.2222" stroke="var(--text-muted)" stroke-width="1.4035" marker-end="url(#arrow)" />
  <text x="890" y="168.8888" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--text-muted)">maintenance</text>
  <rect x="917.7777" y="121.6667" width="138.8889" height="111.1112" rx="7.4219" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="917.7777" y="121.6667" width="138.8889" height="31.9445" rx="7.4219" fill="var(--text-muted)" />
  <rect x="917.7777" y="145.2777" width="138.8889" height="8.3333" fill="var(--text-muted)" rx="7.4219"/>
  <text x="987.2222" y="143.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.5" font-weight="bold" fill="var(--bg)">Maintenance</text>
  <text x="987.2222" y="168.8888" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--text-muted)">OS upgrade</text>
  <text x="987.2222" y="182.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--text-muted)">kernel patch</text>
  <text x="987.2222" y="196.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--text-muted)">hardware replace</text>
  <text x="987.2222" y="215.4167" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--text-muted)">node offline</text>
  <path d="M 987.2222 232.7778 Q 987.2222 267.5 653.8889 267.5 Q 320.5555 267.5 320.5555 232.7778" fill="none" stroke="var(--ok-border)" stroke-width="1.1228" stroke-dasharray="3.3684 1.6842" marker-end="url(#arrow)" />
  <text x="653.8889" y="282.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--ok-accent)">kubectl uncordon (node rejoins)</text>
  <rect x="459.4444" y="302.2222" width="180.5556" height="90.2778" rx="7.4219" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="459.4444" y="302.2222" width="180.5556" height="31.9445" rx="7.4219" fill="var(--danger-accent)" />
  <rect x="459.4444" y="325.8333" width="180.5556" height="8.3333" fill="var(--danger-accent)" rx="7.4219"/>
  <text x="549.7222" y="324.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.5" font-weight="bold" fill="var(--bg)">NotReady</text>
  <text x="549.7222" y="349.4445" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--danger-accent)">kubelet stopped heartbeat</text>
  <text x="549.7222" y="363.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--danger-accent)">network partition</text>
  <text x="549.7222" y="377.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--danger-accent)">node OOM / crash</text>
  <line x1="320.5555" y1="232.7778" x2="459.4444" y2="336.9445" stroke="var(--danger-border)" stroke-width="1.1228" stroke-dasharray="2.807 1.6842" marker-end="url(#arrow)" />
  <text x="362.2221" y="302.2222" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--danger-accent)">node failure</text>
  <rect x="681.6667" y="302.2222" width="180.5556" height="90.2778" rx="7.4219" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="681.6667" y="302.2222" width="180.5556" height="31.9445" rx="7.4219" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="681.6667" y="325.8333" width="180.5556" height="8.3333" fill="var(--danger-fill)" rx="7.4219" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="771.9444" y="324.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.5" font-weight="bold" fill="var(--bg)">Deleted</text>
  <text x="771.9444" y="349.4445" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--danger-accent)">kubectl delete node</text>
  <text x="771.9444" y="363.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--danger-accent)">Removed from cluster</text>
  <text x="771.9444" y="377.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--danger-accent)">Scale-in / decommission</text>
  <line x1="771.9444" y1="232.7778" x2="771.9444" y2="302.2222" stroke="var(--danger-border)" stroke-width="1.1228" stroke-dasharray="2.807 1.6842" marker-end="url(#arrow)" />
  <text x="787.2222" y="271.6667" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--danger-accent)">kubectl delete node</text>
  <rect x="223.3333" y="411.9445" width="402.7778" height="97.2222" rx="7.4219" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="230.2778" y="425.8333" font-family="Arial,sans-serif" font-size="12.3698" font-weight="bold" fill="var(--text)">Node Lifecycle Commands</text>
  <text x="237.2222" y="439.7222" font-family="monospace" font-size="12.3698" fill="var(--ok-accent)">kubectl cordon &lt;node&gt;   — mark unschedulable</text>
  <text x="237.2222" y="453.6112" font-family="monospace" font-size="12.3698" fill="var(--warn-accent)">kubectl drain &lt;node&gt; --ignore-daemonsets --delete-emptydir-data</text>
  <text x="237.2222" y="467.5001" font-family="monospace" font-size="12.3698" fill="var(--primary-accent)">kubectl uncordon &lt;node&gt;   — re-enable scheduling</text>
  <text x="237.2222" y="481.3889" font-family="monospace" font-size="12.3698" fill="var(--danger-accent)">kubectl delete node &lt;node&gt;   — remove from cluster</text>
  <text x="237.2222" y="495.2778" font-family="monospace" font-size="12.3698" fill="var(--text-muted)">kubectl get nodes -o wide  |  kubectl describe node  |  kubectl top nodes</text>
  <rect x="653.8889" y="411.9445" width="402.7778" height="97.2222" rx="7.4219" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="660.8334" y="425.8333" font-family="Arial,sans-serif" font-size="12.3698" font-weight="bold" fill="var(--ok-accent)">Node Conditions (kubectl describe node)</text>
  <text x="667.7778" y="439.7222" font-family="monospace" font-size="12.3698" fill="var(--text-muted)">Ready              — kubelet healthy and pod-ready</text>
  <text x="667.7778" y="453.6112" font-family="monospace" font-size="12.3698" fill="var(--text-muted)">MemoryPressure    — node running low on memory</text>
  <text x="667.7778" y="467.5001" font-family="monospace" font-size="12.3698" fill="var(--text-muted)">DiskPressure      — node low on disk space</text>
  <text x="667.7778" y="481.3889" font-family="monospace" font-size="12.3698" fill="var(--text-muted)">PIDPressure       — too many processes on node</text>
  <text x="667.7778" y="495.2778" font-family="monospace" font-size="12.3698" fill="var(--text-muted)">NetworkUnavailable — CNI plugin not configured</text>
  <text x="667.7778" y="513.3334" font-family="Arial,sans-serif" font-size="12.3698" fill="var(--text-muted)">Pod eviction triggered automatically on pressure. PodDisruptionBudget protects apps during drain.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="899.8371" height="487.013" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="410.4629" y="238.5065" width="168.7193" height="108.2251" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="410.4629" y="238.5065" width="168.7193" height="31.1148" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="410.4629" y="261.5044" width="168.7193" height="8.1168" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="494.8224" y="260.1514" text-anchor="middle" font-size="17.3145" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Ready</text>
  <text x="494.8224" y="284.5019" text-anchor="middle" font-size="17.3145" fill="var(--ok-accent)" font-family="Arial, sans-serif">kubelet healthy</text>
  <text x="494.8224" y="298.0304" text-anchor="middle" font-size="17.3145" fill="var(--ok-accent)" font-family="Arial, sans-serif">Accepts new pods</text>
  <text x="494.8224" y="311.5585" text-anchor="middle" font-size="17.3145" fill="var(--ok-accent)" font-family="Arial, sans-serif">Schedulable=true</text>
  <text x="494.8224" y="329.8214" text-anchor="middle" font-size="17.3145" fill="var(--text-muted)" font-family="Arial, sans-serif">condition: Ready=True</text>
  <line x1="579.1822" y1="292.619" x2="635.4219" y2="292.619" stroke="var(--text-muted)" stroke-width="0.5357" marker-end="url(#arrow)" />
  <text x="607.3022" y="284.5019" text-anchor="middle" font-size="17.3145" fill="var(--text-muted)" font-family="Arial, sans-serif">kubectl cordon</text>
  <rect x="635.4219" y="238.5065" width="168.7193" height="108.2251" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="635.4219" y="238.5065" width="168.7193" height="31.1148" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="635.4219" y="261.5044" width="168.7193" height="8.1168" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="719.7819" y="260.1514" text-anchor="middle" font-size="17.3145" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Cordoned</text>
  <text x="719.7819" y="284.5019" text-anchor="middle" font-size="17.3145" fill="var(--warn-accent)" font-family="Arial, sans-serif">Schedulable=false</text>
  <text x="719.7819" y="298.0304" text-anchor="middle" font-size="17.3145" fill="var(--warn-accent)" font-family="Arial, sans-serif">Existing pods still run</text>
  <text x="719.7819" y="311.5585" text-anchor="middle" font-size="17.3145" fill="var(--warn-accent)" font-family="Arial, sans-serif">No new pods scheduled</text>
  <text x="719.7819" y="329.8214" text-anchor="middle" font-size="17.3145" fill="var(--text-muted)" font-family="Arial, sans-serif">condition: SchedulingDisabled</text>
  <line x1="804.1414" y1="292.619" x2="860.3814" y2="292.619" stroke="var(--text-muted)" stroke-width="0.5357" marker-end="url(#arrow)" />
  <text x="832.2614" y="284.5019" text-anchor="middle" font-size="17.3145" fill="var(--text-muted)" font-family="Arial, sans-serif">kubectl drain</text>
  <rect x="860.3814" y="238.5065" width="182.7793" height="108.2251" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860.3814" y="238.5065" width="182.7793" height="31.1148" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860.3814" y="261.5044" width="182.7793" height="8.1168" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="951.7709" y="260.1514" text-anchor="middle" font-size="17.3145" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Drained</text>
  <text x="951.7709" y="284.5019" text-anchor="middle" font-size="17.3145" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pods evicted gracefully</text>
  <text x="951.7709" y="298.0304" text-anchor="middle" font-size="17.3145" fill="var(--primary-accent)" font-family="Arial, sans-serif">Rescheduled elsewhere</text>
  <text x="951.7709" y="311.5585" text-anchor="middle" font-size="17.3145" fill="var(--primary-accent)" font-family="Arial, sans-serif">DaemonSet pods skip</text>
  <text x="951.7709" y="329.8214" text-anchor="middle" font-size="17.3145" fill="var(--text-muted)" font-family="Arial, sans-serif">safe to maintain node now</text>
  <line x1="1043.1607" y1="292.619" x2="1099.4003" y2="292.619" stroke="var(--text-muted)" stroke-width="0.5357" marker-end="url(#arrow)" />
  <text x="1071.2805" y="284.5019" text-anchor="middle" font-size="17.3145" fill="var(--text-muted)" font-family="Arial, sans-serif">maintenance</text>
  <rect x="1099.4003" y="238.5065" width="140.5995" height="108.2251" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="1099.4003" y="238.5065" width="140.5995" height="31.1148" rx="6" fill="var(--text-muted)" />
  <rect x="1099.4003" y="261.5044" width="140.5995" height="8.1168" fill="var(--text-muted)" rx="6" />
  <text x="1169.7002" y="260.1514" text-anchor="middle" font-size="17.3145" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Maintenance</text>
  <text x="1169.7002" y="284.5019" text-anchor="middle" font-size="17.3145" fill="var(--text-muted)" font-family="Arial, sans-serif">OS upgrade</text>
  <text x="1169.7002" y="298.0304" text-anchor="middle" font-size="17.3145" fill="var(--text-muted)" font-family="Arial, sans-serif">kernel patch</text>
  <text x="1169.7002" y="311.5585" text-anchor="middle" font-size="17.3145" fill="var(--text-muted)" font-family="Arial, sans-serif">hardware replace</text>
  <text x="1169.7002" y="329.8214" text-anchor="middle" font-size="17.3145" fill="var(--text-muted)" font-family="Arial, sans-serif">node offline</text>
  <path d="M 1169.7002 346.7316 Q 1169.7002 380.552 832.2614 380.552 Q 494.8224 380.552 494.8224 346.7316" fill="none" stroke="var(--ok-border)" stroke-width="0.4286" stroke-dasharray="1.2857 0.6428" marker-end="url(#arrow)" />
  <text x="832.2614" y="395.4329" text-anchor="middle" font-size="17.3145" fill="var(--ok-accent)" font-family="Arial, sans-serif">kubectl uncordon (node rejoins)</text>
  <rect x="635.4219" y="414.3724" width="182.7793" height="87.933" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="635.4219" y="414.3724" width="182.7793" height="31.1148" rx="6" fill="var(--danger-accent)" />
  <rect x="635.4219" y="437.3701" width="182.7793" height="8.1168" fill="var(--danger-accent)" rx="6" />
  <text x="726.8116" y="436.0173" text-anchor="middle" font-size="17.3145" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">NotReady</text>
  <text x="726.8116" y="460.3682" text-anchor="middle" font-size="17.3145" fill="var(--danger-accent)" font-family="Arial, sans-serif">kubelet stopped heartbeat</text>
  <text x="726.8116" y="473.896" text-anchor="middle" font-size="17.3145" fill="var(--danger-accent)" font-family="Arial, sans-serif">network partition</text>
  <text x="726.8116" y="487.4244" text-anchor="middle" font-size="17.3145" fill="var(--danger-accent)" font-family="Arial, sans-serif">node OOM / crash</text>
  <line x1="494.8224" y1="346.7316" x2="635.4219" y2="448.1927" stroke="var(--danger-border)" stroke-width="0.4286" stroke-dasharray="1.0714 0.6428" marker-end="url(#arrow)" />
  <text x="537.0022" y="414.3724" font-size="17.3145" fill="var(--danger-accent)" font-family="Arial, sans-serif">node failure</text>
  <rect x="860.3814" y="414.3724" width="182.7793" height="87.933" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860.3814" y="414.3724" width="182.7793" height="31.1148" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860.3814" y="437.3701" width="182.7793" height="8.1168" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="951.7709" y="436.0173" text-anchor="middle" font-size="17.3145" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Deleted</text>
  <text x="951.7709" y="460.3682" text-anchor="middle" font-size="17.3145" fill="var(--danger-accent)" font-family="Arial, sans-serif">kubectl delete node</text>
  <text x="951.7709" y="473.896" text-anchor="middle" font-size="17.3145" fill="var(--danger-accent)" font-family="Arial, sans-serif">Removed from cluster</text>
  <text x="951.7709" y="487.4244" text-anchor="middle" font-size="17.3145" fill="var(--danger-accent)" font-family="Arial, sans-serif">Scale-in / decommission</text>
  <line x1="951.7709" y1="346.7316" x2="951.7709" y2="414.3724" stroke="var(--danger-border)" stroke-width="0.4286" stroke-dasharray="1.0714 0.6428" marker-end="url(#arrow)" />
  <text x="967.2369" y="384.6105" font-size="17.3145" fill="var(--danger-accent)" font-family="Arial, sans-serif">kubectl delete node</text>
  <rect x="396.4028" y="521.2447" width="407.7386" height="94.697" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="403.4328" y="534.7728" font-size="17.3145" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Node Lifecycle Commands</text>
  <text x="410.4629" y="548.3008" font-size="17.3145" fill="var(--ok-accent)" font-family="Courier New, monospace">kubectl cordon &lt;node&gt;   — mark unschedulable</text>
  <text x="410.4629" y="561.8291" font-size="17.3145" fill="var(--warn-accent)" font-family="Courier New, monospace">kubectl drain &lt;node&gt; --ignore-daemonsets --delete-emptydir-data</text>
  <text x="410.4629" y="575.3573" font-size="17.3145" fill="var(--primary-accent)" font-family="Courier New, monospace">kubectl uncordon &lt;node&gt;   — re-enable scheduling</text>
  <text x="410.4629" y="588.8852" font-size="17.3145" fill="var(--danger-accent)" font-family="Courier New, monospace">kubectl delete node &lt;node&gt;   — remove from cluster</text>
  <text x="410.4629" y="602.4135" font-size="17.3145" fill="var(--text-muted)" font-family="Courier New, monospace">kubectl get nodes -o wide  |  kubectl describe node  |  kubectl top nodes</text>
  <rect x="832.2614" y="521.2447" width="407.7386" height="94.697" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="839.2915" y="534.7728" font-size="17.3145" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Node Conditions (kubectl describe node)</text>
  <text x="846.3212" y="548.3008" font-size="17.3145" fill="var(--text-muted)" font-family="Courier New, monospace">Ready              — kubelet healthy and pod-ready</text>
  <text x="846.3212" y="561.8291" font-size="17.3145" fill="var(--text-muted)" font-family="Courier New, monospace">MemoryPressure    — node running low on memory</text>
  <text x="846.3212" y="575.3573" font-size="17.3145" fill="var(--text-muted)" font-family="Courier New, monospace">DiskPressure      — node low on disk space</text>
  <text x="846.3212" y="588.8852" font-size="17.3145" fill="var(--text-muted)" font-family="Courier New, monospace">PIDPressure       — too many processes on node</text>
  <text x="846.3212" y="602.4135" font-size="17.3145" fill="var(--text-muted)" font-family="Courier New, monospace">NetworkUnavailable — CNI plugin not configured</text>
  <text x="846.3212" y="620" font-size="17.3145" fill="var(--text-muted)" font-family="Arial, sans-serif">Pod eviction triggered automatically on pressure. PodDisruptionBudget protects apps during drain.</text>
</svg>
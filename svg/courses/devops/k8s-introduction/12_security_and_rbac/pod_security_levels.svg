<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="374.999972656249" height="580" fill="url(#grad-ok)" rx="9.165151628588" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="227.500041015627" y="156" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Privileged</text>
  <text x="227.500041015627" y="252.666666666666" text-anchor="middle" fill="var(--bg)" font-size="27.924536734508" font-family="Arial, sans-serif">• Unrestricted</text>
  <text x="227.500041015627" y="330" text-anchor="middle" fill="var(--bg)" font-size="27.924536734508" font-family="Arial, sans-serif">• No limitations</text>
  <text x="227.500041015627" y="407.333333333334" text-anchor="middle" fill="var(--bg)" font-size="27.924536734508" font-family="Arial, sans-serif">• System pods</text>
  <text x="227.500041015627" y="484.666666666666" text-anchor="middle" fill="var(--bg)" font-size="27.924536734508" font-family="Arial, sans-serif">• Least secure</text>
  <rect x="452.499958984373" y="40" width="374.999972656249" height="580" fill="url(#grad-warn)" rx="9.165151628588" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="156" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Baseline</text>
  <text x="640" y="252.666666666666" text-anchor="middle" font-size="27.924536734508" font-family="Arial, sans-serif" fill="var(--warn-text)">• Minimal restrictions</text>
  <text x="640" y="330" text-anchor="middle" font-size="27.924536734508" font-family="Arial, sans-serif" fill="var(--warn-text)">• Prevents escalations</text>
  <text x="640" y="407.333333333334" text-anchor="middle" font-size="27.924536734508" font-family="Arial, sans-serif" fill="var(--warn-text)">• Default for most</text>
  <text x="640" y="484.666666666666" text-anchor="middle" font-size="27.924536734508" font-family="Arial, sans-serif" fill="var(--warn-text)">• Moderate security</text>
  <rect x="865.000027343752" y="40" width="374.999972656249" height="580" fill="url(#grad-danger)" rx="9.165151628588" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1052.500068359378" y="156" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Restricted</text>
  <text x="1052.500068359378" y="252.666666666666" text-anchor="middle" fill="var(--bg)" font-size="27.924536734508" font-family="Arial, sans-serif">• Heavily restricted</text>
  <text x="1052.500068359378" y="330" text-anchor="middle" fill="var(--bg)" font-size="27.924536734508" font-family="Arial, sans-serif">• Security hardened</text>
  <text x="1052.500068359378" y="407.333333333334" text-anchor="middle" fill="var(--bg)" font-size="27.924536734508" font-family="Arial, sans-serif">• Best practices</text>
  <text x="1052.500068359378" y="484.666666666666" text-anchor="middle" fill="var(--bg)" font-size="27.924536734508" font-family="Arial, sans-serif">• Most secure</text>
</svg>

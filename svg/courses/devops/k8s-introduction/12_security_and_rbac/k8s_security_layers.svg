  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:text x="568.8889" y="37.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text-dark)">API Server Request Pipeline (every request passes through all stages)</ns0:text>
  <ns0:rect x="35.5556" y="53.3333" width="124.4444" height="62.2222" rx="8.8889" fill="var(--warn-pale4)" stroke="var(--warn-amber)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="97.7778" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--warn-dk)">Requester</ns0:text>
  <ns0:text x="97.7778" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-deeper)">user / pod /</ns0:text>
  <ns0:text x="97.7778" y="108.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-deeper)">service account</ns0:text>
  <ns0:line x1="160" y1="84.4444" x2="195.5556" y2="84.4444" stroke="var(--text-muted)" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="195.5556" y="44.4444" width="177.7778" height="248.8889" rx="10.6667" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:rect x="195.5556" y="44.4444" width="177.7778" height="40.8889" rx="10.6667" fill="url(#grad-primary)" />
  <ns0:rect x="195.5556" y="74.6667" width="177.7778" height="10.6667" fill="url(#grad-primary)" />
  <ns0:text x="284.4444" y="72.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">1. Authentication</ns0:text>
  <ns0:text x="284.4444" y="103.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--primary-dk)">Who are you?</ns0:text>
  <ns0:text x="213.3333" y="128" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">X.509 Client Certs</ns0:text>
  <ns0:text x="213.3333" y="145.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Bearer Tokens</ns0:text>
  <ns0:text x="213.3333" y="163.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">ServiceAccount Tokens</ns0:text>
  <ns0:text x="213.3333" y="181.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">OpenID Connect (OIDC)</ns0:text>
  <ns0:text x="213.3333" y="199.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Webhook Token Auth</ns0:text>
  <ns0:text x="213.3333" y="222.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Bootstrap Tokens</ns0:text>
  <ns0:rect x="204.4444" y="240" width="160" height="39.1111" rx="5.3333" fill="var(--primary-lt)" />
  <ns0:text x="284.4444" y="259.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--primary-deep)">→ username, groups</ns0:text>
  <ns0:text x="284.4444" y="273.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-deep)">401 if unrecognized</ns0:text>
  <ns0:line x1="373.3333" y1="84.4444" x2="408.8889" y2="84.4444" stroke="var(--text-muted)" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="408.8889" y="44.4444" width="186.6667" height="302.2222" rx="10.6667" fill="var(--ok-pale)" stroke="var(--ok-mid)" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:rect x="408.8889" y="44.4444" width="186.6667" height="40.8889" rx="10.6667" fill="var(--ok-mid)" />
  <ns0:rect x="408.8889" y="74.6667" width="186.6667" height="10.6667" fill="var(--ok-mid)" />
  <ns0:text x="502.2222" y="72.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">2. Authorization</ns0:text>
  <ns0:text x="502.2222" y="103.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-mid)">What can you do?</ns0:text>
  <ns0:text x="502.2222" y="124.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)">RBAC (default)</ns0:text>
  <ns0:text x="426.6667" y="145.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Role + RoleBinding</ns0:text>
  <ns0:text x="426.6667" y="163.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">ClusterRole + ClusterRoleBinding</ns0:text>
  <ns0:line x1="426.6667" y1="176" x2="586.6667" y2="176" stroke="var(--ok-lt)" stroke-width="0.8889" stroke-dasharray="3.5556 1.7778" />
  <ns0:text x="502.2222" y="193.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="var(--text-muted)">ABAC, Webhook</ns0:text>
  <ns0:text x="426.6667" y="211.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Attribute-based / external</ns0:text>
  <ns0:rect x="423.1111" y="229.3333" width="71.1111" height="26.6667" rx="4.4444" fill="var(--ok-lt)" />
  <ns0:text x="458.6667" y="246.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--ok-deep)">Role</ns0:text>
  <ns0:line x1="494.2222" y1="242.6667" x2="512" y2="242.6667" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <ns0:rect x="512" y="229.3333" width="71.1111" height="26.6667" rx="4.4444" fill="var(--ok-tint)" />
  <ns0:text x="547.5556" y="246.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--ok-deep)">Binding</ns0:text>
  <ns0:rect x="423.1111" y="273.7778" width="163.5556" height="39.1111" rx="5.3333" fill="var(--ok-lt)" />
  <ns0:text x="504.8889" y="293.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--ok-deep)">→ allow / deny</ns0:text>
  <ns0:text x="504.8889" y="307.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--ok-dk)">403 if not authorized</ns0:text>
  <ns0:line x1="595.5556" y1="84.4444" x2="631.1111" y2="84.4444" stroke="var(--text-muted)" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="631.1111" y="44.4444" width="213.3333" height="355.5556" rx="10.6667" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:rect x="631.1111" y="44.4444" width="213.3333" height="40.8889" rx="10.6667" fill="var(--warn-mid)" />
  <ns0:rect x="631.1111" y="74.6667" width="213.3333" height="10.6667" fill="var(--warn-mid)" />
  <ns0:text x="737.7778" y="72.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">3. Admission Control</ns0:text>
  <ns0:text x="737.7778" y="103.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--warn-dk)">Is it a valid request?</ns0:text>
  <ns0:text x="737.7778" y="124.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="var(--text-muted)">Mutating Webhooks (modify)</ns0:text>
  <ns0:text x="648.8889" y="144" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Inject sidecar containers</ns0:text>
  <ns0:text x="648.8889" y="160" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Add default resource limits</ns0:text>
  <ns0:text x="648.8889" y="176" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Set security contexts</ns0:text>
  <ns0:line x1="648.8889" y1="186.6667" x2="835.5556" y2="186.6667" stroke="var(--warn-lt)" stroke-width="0.8889" stroke-dasharray="3.5556 1.7778" />
  <ns0:text x="737.7778" y="206.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="var(--text-muted)">Validating Webhooks (check)</ns0:text>
  <ns0:text x="648.8889" y="225.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">ResourceQuota enforcement</ns0:text>
  <ns0:text x="648.8889" y="241.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">LimitRange enforcement</ns0:text>
  <ns0:text x="648.8889" y="257.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Pod Security Admission</ns0:text>
  <ns0:text x="648.8889" y="273.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">OPA / Gatekeeper / Kyverno</ns0:text>
  <ns0:rect x="645.3333" y="288" width="184.8889" height="39.1111" rx="5.3333" fill="var(--warn-lt)" />
  <ns0:text x="737.7778" y="307.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-deeper)">→ pass / reject / mutate</ns0:text>
  <ns0:text x="737.7778" y="321.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-deeper)">400/422 if rejected</ns0:text>
  <ns0:rect x="645.3333" y="337.7778" width="184.8889" height="49.7778" rx="5.3333" fill="var(--warn-pale4)" stroke="var(--warn-amber)" stroke-width="1.3333" />
  <ns0:text x="737.7778" y="355.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="var(--warn-dk)">Schema Validation</ns0:text>
  <ns0:text x="737.7778" y="371.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">OpenAPI schema check</ns0:text>
  <ns0:text x="737.7778" y="385.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">required fields, types</ns0:text>
  <ns0:line x1="844.4444" y1="84.4444" x2="880" y2="84.4444" stroke="var(--text-muted)" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="880" y="44.4444" width="213.3333" height="177.7778" rx="10.6667" fill="var(--surface-alt)" stroke="var(--text-mid)" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:rect x="880" y="44.4444" width="213.3333" height="40.8889" rx="10.6667" fill="var(--text-mid)" />
  <ns0:rect x="880" y="74.6667" width="213.3333" height="10.6667" fill="var(--text-mid)" />
  <ns0:text x="986.6667" y="72.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)">4. etcd</ns0:text>
  <ns0:text x="986.6667" y="103.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)">Persist to cluster store</ns0:text>
  <ns0:text x="897.7778" y="131.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Object stored in etcd</ns0:text>
  <ns0:text x="897.7778" y="149.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Watch events fired</ns0:text>
  <ns0:text x="897.7778" y="167.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Controllers reconcile</ns0:text>
  <ns0:text x="897.7778" y="184.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">kubelet picks up work</ns0:text>
  <ns0:rect x="894.2222" y="193.7778" width="184.8889" height="21.3333" rx="4.4444" fill="var(--ok-lt)" />
  <ns0:text x="986.6667" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="var(--ok-deep)">201 Created / 200 OK</ns0:text>
  <ns0:rect x="35.5556" y="391.1111" width="800" height="71.1111" rx="8.8889" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="1.3333" />
  <ns0:text x="44.4444" y="410.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-deep)">Rejection outcomes</ns0:text>
  <ns0:text x="53.3333" y="432" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">401 Unauthorized — no valid credentials (Authn failed)</ns0:text>
  <ns0:text x="53.3333" y="449.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">403 Forbidden — authenticated but not allowed (Authz failed)    |    400/422 — bad request (Admission rejected)</ns0:text>
  <ns0:rect x="35.5556" y="471.1111" width="1066.6667" height="80" rx="10.6667" fill="var(--ok-pale)" stroke="var(--ok-mid)" stroke-width="1.3333" />
  <ns0:text x="44.4444" y="488.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-dk)">RBAC Quick Reference</ns0:text>
  <ns0:text x="53.3333" y="504.8889" font-family="monospace" font-size="10" fill="var(--text-muted)">Role — namespace-scoped permissions    ClusterRole — cluster-scoped permissions (nodes, PVs)</ns0:text>
  <ns0:text x="53.3333" y="520.8889" font-family="monospace" font-size="10" fill="var(--text-muted)">RoleBinding — binds Role/ClusterRole to subject in a namespace</ns0:text>
  <ns0:text x="53.3333" y="536.8889" font-family="monospace" font-size="10" fill="var(--text-muted)">ClusterRoleBinding — binds ClusterRole cluster-wide    Subject — User | Group | ServiceAccount</ns0:text>

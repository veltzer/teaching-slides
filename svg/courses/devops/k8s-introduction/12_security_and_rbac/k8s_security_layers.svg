<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Pipeline title -->
  <text x="640" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#333">API Server Request Pipeline (every request passes through all stages)</text>

  <!-- Requester -->
  <rect x="40" y="60" width="140" height="70" rx="10" fill="#fff9c4" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#e65100">Requester</text>
  <text x="110" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bf360c">user / pod /</text>
  <text x="110" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bf360c">service account</text>

  <!-- Arrow -->
  <line x1="180" y1="95" x2="220" y2="95" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 1: Authentication -->
  <rect x="220" y="50" width="200" height="280" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="220" y="50" width="200" height="46" rx="12" fill="url(#grad-accent)"/>
  <rect x="220" y="84" width="200" height="12" fill="url(#grad-accent)"/>
  <text x="320" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff">1. Authentication</text>
  <text x="320" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Who are you?</text>
  <text x="240" y="144" font-family="Arial,sans-serif" font-size="12" fill="#555">X.509 Client Certs</text>
  <text x="240" y="164" font-family="Arial,sans-serif" font-size="12" fill="#555">Bearer Tokens</text>
  <text x="240" y="184" font-family="Arial,sans-serif" font-size="12" fill="#555">ServiceAccount Tokens</text>
  <text x="240" y="204" font-family="Arial,sans-serif" font-size="12" fill="#555">OpenID Connect (OIDC)</text>
  <text x="240" y="224" font-family="Arial,sans-serif" font-size="12" fill="#555">Webhook Token Auth</text>
  <text x="240" y="250" font-family="Arial,sans-serif" font-size="12" fill="#555">Bootstrap Tokens</text>
  <!-- Result -->
  <rect x="230" y="270" width="180" height="44" rx="6" fill="#bbdefb"/>
  <text x="320" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#0d47a1">→ username, groups</text>
  <text x="320" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#0d47a1">401 if unrecognized</text>

  <!-- Arrow -->
  <line x1="420" y1="95" x2="460" y2="95" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Authorization (RBAC) -->
  <rect x="460" y="50" width="210" height="340" rx="12" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="460" y="50" width="210" height="46" rx="12" fill="#388e3c"/>
  <rect x="460" y="84" width="210" height="12" fill="#388e3c"/>
  <text x="565" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff">2. Authorization</text>
  <text x="565" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#388e3c">What can you do?</text>
  <text x="565" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#555">RBAC (default)</text>
  <text x="480" y="164" font-family="Arial,sans-serif" font-size="12" fill="#555">Role + RoleBinding</text>
  <text x="480" y="184" font-family="Arial,sans-serif" font-size="12" fill="#555">ClusterRole + ClusterRoleBinding</text>
  <line x1="480" y1="198" x2="660" y2="198" stroke="#c8e6c9" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="565" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#555">ABAC, Webhook</text>
  <text x="480" y="238" font-family="Arial,sans-serif" font-size="12" fill="#555">Attribute-based / external</text>
  <!-- RBAC mini diagram -->
  <rect x="476" y="258" width="80" height="30" rx="5" fill="#c8e6c9"/>
  <text x="516" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#1b5e20">Role</text>
  <line x1="556" y1="273" x2="576" y2="273" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="576" y="258" width="80" height="30" rx="5" fill="#a5d6a7"/>
  <text x="616" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#1b5e20">Binding</text>
  <!-- Result -->
  <rect x="476" y="308" width="184" height="44" rx="6" fill="#c8e6c9"/>
  <text x="568" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#1b5e20">→ allow / deny</text>
  <text x="568" y="346" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#2e7d32">403 if not authorized</text>

  <!-- Arrow -->
  <line x1="670" y1="95" x2="710" y2="95" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Admission Control -->
  <rect x="710" y="50" width="240" height="400" rx="12" fill="#fff3e0" stroke="#f57c00" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="710" y="50" width="240" height="46" rx="12" fill="#f57c00"/>
  <rect x="710" y="84" width="240" height="12" fill="#f57c00"/>
  <text x="830" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff">3. Admission Control</text>
  <text x="830" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e65100">Is it a valid request?</text>
  <text x="830" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#555">Mutating Webhooks (modify)</text>
  <text x="730" y="162" font-family="Arial,sans-serif" font-size="12" fill="#555">Inject sidecar containers</text>
  <text x="730" y="180" font-family="Arial,sans-serif" font-size="12" fill="#555">Add default resource limits</text>
  <text x="730" y="198" font-family="Arial,sans-serif" font-size="12" fill="#555">Set security contexts</text>
  <line x1="730" y1="210" x2="940" y2="210" stroke="#ffe0b2" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="830" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#555">Validating Webhooks (check)</text>
  <text x="730" y="254" font-family="Arial,sans-serif" font-size="12" fill="#555">ResourceQuota enforcement</text>
  <text x="730" y="272" font-family="Arial,sans-serif" font-size="12" fill="#555">LimitRange enforcement</text>
  <text x="730" y="290" font-family="Arial,sans-serif" font-size="12" fill="#555">Pod Security Admission</text>
  <text x="730" y="308" font-family="Arial,sans-serif" font-size="12" fill="#555">OPA / Gatekeeper / Kyverno</text>
  <!-- Result -->
  <rect x="726" y="324" width="208" height="44" rx="6" fill="#ffe0b2"/>
  <text x="830" y="346" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#bf360c">→ pass / reject / mutate</text>
  <text x="830" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bf360c">400/422 if rejected</text>
  <!-- Object schema validation -->
  <rect x="726" y="380" width="208" height="56" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="830" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e65100">Schema Validation</text>
  <text x="830" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">OpenAPI schema check</text>
  <text x="830" y="434" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">required fields, types</text>

  <!-- Arrow -->
  <line x1="950" y1="95" x2="990" y2="95" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: etcd -->
  <rect x="990" y="50" width="240" height="200" rx="12" fill="#eceff1" stroke="#546e7a" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="990" y="50" width="240" height="46" rx="12" fill="#546e7a"/>
  <rect x="990" y="84" width="240" height="12" fill="#546e7a"/>
  <text x="1110" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff">4. etcd</text>
  <text x="1110" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#37474f">Persist to cluster store</text>
  <text x="1010" y="148" font-family="Arial,sans-serif" font-size="12" fill="#555">Object stored in etcd</text>
  <text x="1010" y="168" font-family="Arial,sans-serif" font-size="12" fill="#555">Watch events fired</text>
  <text x="1010" y="188" font-family="Arial,sans-serif" font-size="12" fill="#555">Controllers reconcile</text>
  <text x="1010" y="208" font-family="Arial,sans-serif" font-size="12" fill="#555">kubelet picks up work</text>
  <!-- Success -->
  <rect x="1006" y="218" width="208" height="24" rx="5" fill="#c8e6c9"/>
  <text x="1110" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">201 Created / 200 OK</text>

  <!-- Reject flows -->
  <rect x="40" y="440" width="900" height="80" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="50" y="462" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#b71c1c">Rejection outcomes</text>
  <text x="60" y="486" font-family="Arial,sans-serif" font-size="13" fill="#555">401 Unauthorized — no valid credentials (Authn failed)</text>
  <text x="60" y="506" font-family="Arial,sans-serif" font-size="13" fill="#555">403 Forbidden — authenticated but not allowed (Authz failed)    |    400/422 — bad request (Admission rejected)</text>

  <!-- RBAC detail -->
  <rect x="40" y="530" width="1200" height="90" rx="12" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="50" y="550" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">RBAC Quick Reference</text>
  <text x="60" y="568" font-family="monospace" font-size="11" fill="#555">Role — namespace-scoped permissions    ClusterRole — cluster-scoped permissions (nodes, PVs)</text>
  <text x="60" y="586" font-family="monospace" font-size="11" fill="#555">RoleBinding — binds Role/ClusterRole to subject in a namespace</text>
  <text x="60" y="604" font-family="monospace" font-size="11" fill="#555">ClusterRoleBinding — binds ClusterRole cluster-wide    Subject — User | Group | ServiceAccount</text>
</svg>

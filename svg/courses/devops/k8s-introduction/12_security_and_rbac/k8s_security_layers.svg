<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Requester -->
  <rect x="40" y="40" width="140" height="88.380952380953" rx="6.306459273747" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="110" y="78.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" font-weight="bold" fill="var(--text)">Requester</text>
  <text x="110" y="106.285714285715" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.56184200187" fill="var(--text-muted)">user / pod / SA</text>

  <line x1="180" y1="84.190476190476" x2="215" y2="84.190476190476" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- 1. Authentication -->
  <rect x="220" y="40" width="200" height="309.333333333334" rx="6.306459273747" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="73.142857142858" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.766148184367" font-weight="bold" fill="var(--primary-text)">1. Authentication</text>
  <text x="320" y="106.285714285715" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" font-weight="bold" fill="var(--primary-text)">Who are you?</text>
  <text x="240" y="144.952380952382" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--primary-text)">X.509 certs</text>
  <text x="240" y="172.571428571429" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--primary-text)">Bearer tokens</text>
  <text x="240" y="200.190476190477" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--primary-text)">ServiceAccount</text>
  <text x="240" y="227.809523809524" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--primary-text)">OIDC</text>
  <text x="240" y="255.428571428572" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--primary-text)">Webhook</text>
  <text x="320" y="305.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--primary-text)">→ username</text>
  <text x="320" y="330.552380952381" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.56184200187" fill="var(--primary-text)">401 if bad</text>

  <line x1="420" y1="84.190476190476" x2="455" y2="84.190476190476" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- 2. Authorization -->
  <rect x="460" y="40" width="210" height="309.333333333334" rx="6.306459273747" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="565" y="73.142857142858" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.766148184367" font-weight="bold" fill="var(--ok-text)">2. Authorization</text>
  <text x="565" y="106.285714285715" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" font-weight="bold" fill="var(--ok-text)">What can you do?</text>
  <text x="480" y="144.952380952382" font-family="Arial, sans-serif" font-size="12.612918547494" font-weight="bold" fill="var(--ok-text)">RBAC (default)</text>
  <text x="480" y="172.571428571429" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--ok-text)">Role + Binding</text>
  <text x="480" y="200.190476190477" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--ok-text)">ClusterRole</text>
  <text x="480" y="238.857142857143" font-family="Arial, sans-serif" font-size="12.612918547494" font-weight="bold" fill="var(--ok-text)">ABAC / Webhook</text>
  <text x="565" y="305.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--ok-text)">→ allow / deny</text>
  <text x="565" y="330.552380952381" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.56184200187" fill="var(--ok-text)">403 if denied</text>

  <line x1="670" y1="84.190476190476" x2="705" y2="84.190476190476" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- 3. Admission Control -->
  <rect x="710" y="40" width="240" height="309.333333333334" rx="6.306459273747" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="830" y="73.142857142858" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.766148184367" font-weight="bold" fill="var(--warn-text)">3. Admission</text>
  <text x="830" y="106.285714285715" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" font-weight="bold" fill="var(--warn-text)">Valid request?</text>
  <text x="730" y="144.952380952382" font-family="Arial, sans-serif" font-size="12.612918547494" font-weight="bold" fill="var(--warn-text)">Mutating</text>
  <text x="730" y="172.571428571429" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--warn-text)">Inject sidecars</text>
  <text x="730" y="200.190476190477" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--warn-text)">Default limits</text>
  <text x="730" y="238.857142857143" font-family="Arial, sans-serif" font-size="12.612918547494" font-weight="bold" fill="var(--warn-text)">Validating</text>
  <text x="730" y="266.476190476191" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--warn-text)">ResourceQuota</text>
  <text x="730" y="294.095238095239" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--warn-text)">OPA / Kyverno</text>
  <text x="830" y="330.552380952381" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.56184200187" fill="var(--warn-text)">400/422 if rejected</text>

  <line x1="950" y1="84.190476190476" x2="985" y2="84.190476190476" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- 4. etcd -->
  <rect x="990" y="40" width="250" height="309.333333333334" rx="6.306459273747" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1115" y="73.142857142858" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.766148184367" font-weight="bold" fill="var(--text)">4. etcd</text>
  <text x="1115" y="106.285714285715" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" font-weight="bold" fill="var(--text-muted)">Persist</text>
  <text x="1010" y="144.952380952382" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--text-muted)">Store object</text>
  <text x="1010" y="178.095238095238" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--text-muted)">Fire watch events</text>
  <text x="1010" y="211.238095238095" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--text-muted)">Controllers reconcile</text>
  <text x="1010" y="244.380952380953" font-family="Arial, sans-serif" font-size="12.612918547494" fill="var(--text-muted)">kubelet picks up</text>
  <text x="1115" y="305.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.612918547494" font-weight="bold" fill="var(--text-muted)">201 Created</text>

  <!-- RBAC quick ref -->
  <rect x="40" y="382.47619047619" width="1200" height="237.52380952381" rx="6.306459273747" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="421.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.919377821241" font-weight="bold" fill="var(--info-text)">RBAC Reference</text>
  <text x="60" y="470.857142857143" font-family="Courier New, monospace" font-size="13.663995093118" fill="var(--info-text)">Role → namespace permissions</text>
  <text x="60" y="504" font-family="Courier New, monospace" font-size="13.663995093118" fill="var(--info-text)">ClusterRole → cluster-wide</text>
  <text x="60" y="537.142857142858" font-family="Courier New, monospace" font-size="13.663995093118" fill="var(--info-text)">RoleBinding → bind in namespace</text>
  <text x="60" y="570.285714285714" font-family="Courier New, monospace" font-size="13.663995093118" fill="var(--info-text)">Subject → User | Group | SA</text>
</svg>

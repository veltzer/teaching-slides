<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="73.8333" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text)">API Server Request Pipeline (every request passes through all stages)</text>
  <rect x="77.5" y="88.3333" width="131.25" height="56.3889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="143.125" y="112.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)">Requester</text>
  <text x="143.125" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">user / pod /</text>
  <text x="143.125" y="138.2777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">service account</text>
  <line x1="208.75" y1="116.5277" x2="246.25" y2="116.5277" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="246.25" y="80.2777" width="187.5" height="225.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="246.25" y="80.2777" width="187.5" height="37.0556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="246.25" y="107.6667" width="187.5" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="339.9999" y="106.0556" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)">1. Authentication</text>
  <text x="339.9999" y="133.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">Who are you?</text>
  <text x="265" y="156" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">X.509 Client Certs</text>
  <text x="265" y="172.1111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Bearer Tokens</text>
  <text x="265" y="188.2223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">ServiceAccount Tokens</text>
  <text x="265" y="204.3333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">OpenID Connect (OIDC)</text>
  <text x="265" y="220.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Webhook Token Auth</text>
  <text x="265" y="241.3889" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Bootstrap Tokens</text>
  <rect x="255.6249" y="257.5" width="168.75" height="35.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="339.9999" y="275.2223" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">→ username, groups</text>
  <text x="339.9999" y="288.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-accent)">401 if unrecognized</text>
  <line x1="433.75" y1="116.5277" x2="471.25" y2="116.5277" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="471.25" y="80.2777" width="196.875" height="273.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="471.25" y="80.2777" width="196.875" height="37.0556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="471.25" y="107.6667" width="196.875" height="9.6667" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="569.6875" y="106.0556" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)">2. Authorization</text>
  <text x="569.6875" y="133.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">What can you do?</text>
  <text x="569.6875" y="152.7777" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text-muted)">RBAC (default)</text>
  <text x="490" y="172.1111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Role + RoleBinding</text>
  <text x="490" y="188.2223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">ClusterRole + ClusterRoleBinding</text>
  <line x1="490" y1="199.5" x2="658.75" y2="199.5" stroke="var(--ok-border)" stroke-width="0.8889" stroke-dasharray="3.5556 1.7778" />
  <text x="569.6875" y="215.6111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" font-weight="bold" fill="var(--text-muted)">ABAC, Webhook</text>
  <text x="490" y="231.7223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Attribute-based / external</text>
  <rect x="486.25" y="247.8333" width="75" height="24.1667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="523.75" y="263.1389" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--ok-accent)">Role</text>
  <line x1="561.25" y1="259.9167" x2="580" y2="259.9167" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="580" y="247.8333" width="75" height="24.1667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="617.5" y="263.1389" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--ok-accent)">Binding</text>
  <rect x="486.25" y="288.1111" width="172.5" height="35.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="572.5" y="305.8333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--ok-accent)">→ allow / deny</text>
  <text x="572.5" y="318.7223" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--ok-accent)">403 if not authorized</text>
  <line x1="668.125" y1="116.5277" x2="705.625" y2="116.5277" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="705.625" y="80.2777" width="225" height="322.2223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="705.625" y="80.2777" width="225" height="37.0556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="705.625" y="107.6667" width="225" height="9.6667" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="818.125" y="106.0556" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)">3. Admission Control</text>
  <text x="818.125" y="133.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--warn-accent)">Is it a valid request?</text>
  <text x="818.125" y="152.7777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" font-weight="bold" fill="var(--text-muted)">Mutating Webhooks (modify)</text>
  <text x="724.375" y="170.5" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Inject sidecar containers</text>
  <text x="724.375" y="185" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Add default resource limits</text>
  <text x="724.375" y="199.5" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Set security contexts</text>
  <line x1="724.375" y1="209.1667" x2="921.25" y2="209.1667" stroke="var(--warn-border)" stroke-width="0.8889" stroke-dasharray="3.5556 1.7778" />
  <text x="818.125" y="226.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" font-weight="bold" fill="var(--text-muted)">Validating Webhooks (check)</text>
  <text x="724.375" y="244.6111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">ResourceQuota enforcement</text>
  <text x="724.375" y="259.1111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">LimitRange enforcement</text>
  <text x="724.375" y="273.6111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Pod Security Admission</text>
  <text x="724.375" y="288.1111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">OPA / Gatekeeper / Kyverno</text>
  <rect x="720.625" y="301" width="195" height="35.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="818.125" y="318.7223" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">→ pass / reject / mutate</text>
  <text x="818.125" y="331.6111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">400/422 if rejected</text>
  <rect x="720.625" y="346.1111" width="195" height="45.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="818.125" y="362.2223" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" font-weight="bold" fill="var(--warn-accent)">Schema Validation</text>
  <text x="818.125" y="376.7223" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">OpenAPI schema check</text>
  <text x="818.125" y="389.6111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">required fields, types</text>
  <line x1="930.6249" y1="116.5277" x2="968.125" y2="116.5277" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="968.125" y="80.2777" width="225" height="161.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="968.125" y="80.2777" width="225" height="37.0556" rx="6" fill="var(--text-muted)" />
  <rect x="968.125" y="107.6667" width="225" height="9.6667" fill="var(--text-muted)" rx="6"/>
  <text x="1080.625" y="106.0556" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)">4. etcd</text>
  <text x="1080.625" y="133.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text-muted)">Persist to cluster store</text>
  <text x="986.875" y="159.2223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Object stored in etcd</text>
  <text x="986.875" y="175.3333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Watch events fired</text>
  <text x="986.875" y="191.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Controllers reconcile</text>
  <text x="986.875" y="207.5556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">kubelet picks up work</text>
  <rect x="983.125" y="215.6111" width="195" height="19.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1080.625" y="228.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" font-weight="bold" fill="var(--ok-accent)">201 Created / 200 OK</text>
  <rect x="77.5" y="394.4444" width="843.75" height="64.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="86.875" y="412.1667" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)">Rejection outcomes</text>
  <text x="96.25" y="431.5" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)">401 Unauthorized — no valid credentials (Authn failed)</text>
  <text x="96.25" y="447.6111" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)">403 Forbidden — authenticated but not allowed (Authz failed)    |    400/422 — bad request (Admission rejected)</text>
  <rect x="77.5" y="466.9444" width="1125" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="86.875" y="483.0556" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">RBAC Quick Reference</text>
  <text x="96.25" y="497.5556" font-family="monospace" font-size="10" fill="var(--text-muted)">Role — namespace-scoped permissions    ClusterRole — cluster-scoped permissions (nodes, PVs)</text>
  <text x="96.25" y="512.0556" font-family="monospace" font-size="10" fill="var(--text-muted)">RoleBinding — binds Role/ClusterRole to subject in a namespace</text>
  <text x="96.25" y="526.5556" font-family="monospace" font-size="10" fill="var(--text-muted)">ClusterRoleBinding — binds ClusterRole cluster-wide    Subject — User | Group | ServiceAccount</text>
</svg>
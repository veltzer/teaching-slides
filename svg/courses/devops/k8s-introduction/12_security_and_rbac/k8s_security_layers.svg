<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--text)">API Server Request Pipeline</text>

  <!-- Requester -->
  <rect x="40" y="71.351351351351" width="140" height="83.603603603604" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="110" y="107.927927927928" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--text)">Requester</text>
  <text x="110" y="134.054054054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.245018917301" fill="var(--text-muted)">user / pod / SA</text>

  <line x1="180" y1="113.153153153153" x2="215" y2="113.153153153153" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1. Authentication -->
  <rect x="220" y="71.351351351351" width="200" height="292.612612612613" rx="6.133646682164" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--primary-text)">1. Authentication</text>
  <text x="320" y="134.054054054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" font-weight="bold" fill="var(--primary-text)">Who are you?</text>
  <text x="240" y="170.630630630631" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--primary-text)">X.509 certs</text>
  <text x="240" y="196.756756756757" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--primary-text)">Bearer tokens</text>
  <text x="240" y="222.882882882883" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--primary-text)">ServiceAccount</text>
  <text x="240" y="249.009009009009" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--primary-text)">OIDC</text>
  <text x="240" y="275.135135135135" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--primary-text)">Webhook</text>
  <text x="320" y="322.162162162162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--primary-text)">→ username</text>
  <text x="320" y="346.198198198198" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.245018917301" fill="var(--primary-text)">401 if bad</text>

  <line x1="420" y1="113.153153153153" x2="455" y2="113.153153153153" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Authorization -->
  <rect x="460" y="71.351351351351" width="210" height="292.612612612613" rx="6.133646682164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="565" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--ok-text)">2. Authorization</text>
  <text x="565" y="134.054054054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" font-weight="bold" fill="var(--ok-text)">What can you do?</text>
  <text x="480" y="170.630630630631" font-family="Arial, sans-serif" font-size="12.267293364328" font-weight="bold" fill="var(--ok-text)">RBAC (default)</text>
  <text x="480" y="196.756756756757" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--ok-text)">Role + Binding</text>
  <text x="480" y="222.882882882883" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--ok-text)">ClusterRole</text>
  <text x="480" y="259.459459459459" font-family="Arial, sans-serif" font-size="12.267293364328" font-weight="bold" fill="var(--ok-text)">ABAC / Webhook</text>
  <text x="565" y="322.162162162162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--ok-text)">→ allow / deny</text>
  <text x="565" y="346.198198198198" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.245018917301" fill="var(--ok-text)">403 if denied</text>

  <line x1="670" y1="113.153153153153" x2="705" y2="113.153153153153" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Admission Control -->
  <rect x="710" y="71.351351351351" width="240" height="292.612612612613" rx="6.133646682164" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="830" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--warn-text)">3. Admission</text>
  <text x="830" y="134.054054054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" font-weight="bold" fill="var(--warn-text)">Valid request?</text>
  <text x="730" y="170.630630630631" font-family="Arial, sans-serif" font-size="12.267293364328" font-weight="bold" fill="var(--warn-text)">Mutating</text>
  <text x="730" y="196.756756756757" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--warn-text)">Inject sidecars</text>
  <text x="730" y="222.882882882883" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--warn-text)">Default limits</text>
  <text x="730" y="259.459459459459" font-family="Arial, sans-serif" font-size="12.267293364328" font-weight="bold" fill="var(--warn-text)">Validating</text>
  <text x="730" y="285.585585585586" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--warn-text)">ResourceQuota</text>
  <text x="730" y="311.711711711712" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--warn-text)">OPA / Kyverno</text>
  <text x="830" y="346.198198198198" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.245018917301" fill="var(--warn-text)">400/422 if rejected</text>

  <line x1="950" y1="113.153153153153" x2="985" y2="113.153153153153" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. etcd -->
  <rect x="990" y="71.351351351351" width="250" height="292.612612612613" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1115" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--text)">4. etcd</text>
  <text x="1115" y="134.054054054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" font-weight="bold" fill="var(--text-muted)">Persist</text>
  <text x="1010" y="170.630630630631" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">Store object</text>
  <text x="1010" y="201.981981981982" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">Fire watch events</text>
  <text x="1010" y="233.333333333333" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">Controllers reconcile</text>
  <text x="1010" y="264.684684684685" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">kubelet picks up</text>
  <text x="1115" y="322.162162162162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.267293364328" font-weight="bold" fill="var(--text-muted)">201 Created</text>

  <!-- RBAC quick ref -->
  <rect x="40" y="395.315315315315" width="1200" height="224.684684684685" rx="6.133646682164" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="431.891891891892" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--info-text)">RBAC Reference</text>
  <text x="60" y="478.918918918919" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--info-text)">Role → namespace permissions</text>
  <text x="60" y="510.27027027027" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--info-text)">ClusterRole → cluster-wide</text>
  <text x="60" y="541.621621621622" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--info-text)">RoleBinding → bind in namespace</text>
  <text x="60" y="572.972972972973" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--info-text)">Subject → User | Group | SA</text>
</svg>

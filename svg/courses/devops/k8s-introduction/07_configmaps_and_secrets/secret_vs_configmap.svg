<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="580.645168574402" height="580" fill="url(#grad-primary)" rx="8.064258222973" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="330.322527835586" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">ConfigMap</text>
  <text x="330.322527835586" y="199.499999999999" text-anchor="middle" fill="var(--bg)" font-size="24.570316358058" font-family="Arial, sans-serif">✓ Non-sensitive data</text>
  <text x="330.322527835586" y="257.5" text-anchor="middle" fill="var(--bg)" font-size="24.570316358058" font-family="Arial, sans-serif">✓ Plain text storage</text>
  <text x="330.322527835586" y="315.5" text-anchor="middle" fill="var(--bg)" font-size="24.570316358058" font-family="Arial, sans-serif">✓ Application settings</text>
  <text x="330.322527835586" y="373.499999999999" text-anchor="middle" fill="var(--bg)" font-size="24.570316358058" font-family="Arial, sans-serif">✓ Feature flags</text>
  <text x="330.322527835586" y="431.5" text-anchor="middle" fill="var(--bg)" font-size="24.570316358058" font-family="Arial, sans-serif">✓ Config files</text>
  <text x="330.322527835586" y="489.5" text-anchor="middle" fill="var(--bg)" font-size="24.570316358058" font-family="Arial, sans-serif">✓ No size limit concerns</text>
  <text x="330.322527835586" y="547.499999999999" text-anchor="middle" fill="var(--bg)" font-size="24.570316358058" font-family="Arial, sans-serif">Example: app.properties</text>
  <rect x="659.354831425598" y="40" width="580.645168574402" height="580" fill="url(#grad-danger)" rx="8.064258222973" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="949.677472164414" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Secret</text>
  <text x="949.677472164414" y="199.499999999999" text-anchor="middle" fill="var(--bg)" font-size="24.570316358058" font-family="Arial, sans-serif">✓ Sensitive data</text>
  <text x="949.677472164414" y="257.5" text-anchor="middle" fill="var(--bg)" font-size="24.570316358058" font-family="Arial, sans-serif">✓ Base64 encoded</text>
  <text x="949.677472164414" y="315.5" text-anchor="middle" fill="var(--bg)" font-size="24.570316358058" font-family="Arial, sans-serif">✓ Passwords, tokens</text>
  <text x="949.677472164414" y="373.499999999999" text-anchor="middle" fill="var(--bg)" font-size="24.570316358058" font-family="Arial, sans-serif">✓ TLS certificates</text>
  <text x="949.677472164414" y="431.5" text-anchor="middle" fill="var(--bg)" font-size="24.570316358058" font-family="Arial, sans-serif">✓ SSH keys</text>
  <text x="949.677472164414" y="489.5" text-anchor="middle" fill="var(--bg)" font-size="24.570316358058" font-family="Arial, sans-serif">✓ 1MB size limit</text>
  <text x="949.677472164414" y="547.499999999999" text-anchor="middle" fill="var(--bg)" font-size="24.570316358058" font-family="Arial, sans-serif">Example: db-password</text>
</svg>

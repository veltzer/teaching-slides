<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">ConfigMap vs Secret</text>
  <rect x="160" y="144" width="480" height="360" fill="#4285f4" rx="8" />
  <text x="400" y="198" text-anchor="middle" fill="white" font-weight="bold">ConfigMap</text>
  <text x="400" y="243" text-anchor="middle" fill="white" font-size="17.6">✓ Non-sensitive data</text>
  <text x="400" y="279" text-anchor="middle" fill="white" font-size="17.6">✓ Plain text storage</text>
  <text x="400" y="315" text-anchor="middle" fill="white" font-size="17.6">✓ Application settings</text>
  <text x="400" y="351" text-anchor="middle" fill="white" font-size="17.6">✓ Feature flags</text>
  <text x="400" y="387" text-anchor="middle" fill="white" font-size="17.6">✓ Config files</text>
  <text x="400" y="423" text-anchor="middle" fill="white" font-size="17.6">✓ No size limit concerns</text>
  <text x="400" y="459" text-anchor="middle" fill="white" font-size="17.6">Example: app.properties</text>
  <rect x="672" y="144" width="480" height="360" fill="#ea4335" rx="8" />
  <text x="912" y="198" text-anchor="middle" fill="white" font-weight="bold">Secret</text>
  <text x="912" y="243" text-anchor="middle" fill="white" font-size="17.6">✓ Sensitive data</text>
  <text x="912" y="279" text-anchor="middle" fill="white" font-size="17.6">✓ Base64 encoded</text>
  <text x="912" y="315" text-anchor="middle" fill="white" font-size="17.6">✓ Passwords, tokens</text>
  <text x="912" y="351" text-anchor="middle" fill="white" font-size="17.6">✓ TLS certificates</text>
  <text x="912" y="387" text-anchor="middle" fill="white" font-size="17.6">✓ SSH keys</text>
  <text x="912" y="423" text-anchor="middle" fill="white" font-size="17.6">✓ 1MB size limit</text>
  <text x="912" y="459" text-anchor="middle" fill="white" font-size="17.6">Example: db-password</text>
</svg>
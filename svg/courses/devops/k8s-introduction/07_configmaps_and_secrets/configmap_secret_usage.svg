<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="35.5556" y="53.3333" width="284.4444" height="177.7778" rx="10.6667" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:rect x="35.5556" y="53.3333" width="284.4444" height="40.8889" rx="10.6667" fill="url(#grad-primary)" />
  <ns0:rect x="35.5556" y="83.5556" width="284.4444" height="10.6667" fill="url(#grad-primary)" />
  <ns0:text x="177.7778" y="81.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">ConfigMap</ns0:text>
  <ns0:text x="53.3333" y="117.3333" font-family="monospace" font-size="11.5556" fill="#1a237e">apiVersion: v1</ns0:text>
  <ns0:text x="53.3333" y="135.1111" font-family="monospace" font-size="11.5556" fill="#1a237e">kind: ConfigMap</ns0:text>
  <ns0:text x="53.3333" y="152.8889" font-family="monospace" font-size="11.5556" fill="#1a237e">data:</ns0:text>
  <ns0:text x="53.3333" y="170.6667" font-family="monospace" font-size="11.5556" fill="#1565c0">  DB_HOST: postgres</ns0:text>
  <ns0:text x="53.3333" y="188.4444" font-family="monospace" font-size="11.5556" fill="#1565c0">  DB_PORT: "5432"</ns0:text>
  <ns0:text x="53.3333" y="206.2222" font-family="monospace" font-size="11.5556" fill="#1565c0">  LOG_LEVEL: info</ns0:text>
  <ns0:rect x="35.5556" y="257.7778" width="284.4444" height="177.7778" rx="10.6667" fill="#fce4ec" stroke="#dc3545" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:rect x="35.5556" y="257.7778" width="284.4444" height="40.8889" rx="10.6667" fill="#dc3545" />
  <ns0:rect x="35.5556" y="288" width="284.4444" height="10.6667" fill="#dc3545" />
  <ns0:text x="177.7778" y="286.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">Secret</ns0:text>
  <ns0:text x="53.3333" y="321.7778" font-family="monospace" font-size="11.5556" fill="#c2185b">apiVersion: v1</ns0:text>
  <ns0:text x="53.3333" y="339.5556" font-family="monospace" font-size="11.5556" fill="#c2185b">kind: Secret</ns0:text>
  <ns0:text x="53.3333" y="357.3333" font-family="monospace" font-size="11.5556" fill="#c2185b">type: Opaque</ns0:text>
  <ns0:text x="53.3333" y="375.1111" font-family="monospace" font-size="11.5556" fill="#c2185b">data:</ns0:text>
  <ns0:text x="53.3333" y="392.8889" font-family="monospace" font-size="11.5556" fill="#c2185b">  DB_PASS: c2VjcmV0  # b64</ns0:text>
  <ns0:text x="53.3333" y="410.6667" font-family="monospace" font-size="11.5556" fill="#c2185b">  API_KEY:  YWJjMTIz</ns0:text>
  <ns0:rect x="444.4444" y="71.1111" width="657.7778" height="462.2222" rx="14.2222" fill="#f9f9f9" stroke="#555" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="444.4444" y="71.1111" width="657.7778" height="44.4444" rx="14.2222" fill="#555555" />
  <ns0:rect x="444.4444" y="103.1111" width="657.7778" height="12.4444" fill="#555555" />
  <ns0:text x="773.3333" y="101.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#fff">Pod</ns0:text>
  <ns0:rect x="471.1111" y="131.5556" width="604.4444" height="382.2222" rx="10.6667" fill="#eeeeee" stroke="#9e9e9e" stroke-width="1.7778" />
  <ns0:text x="773.3333" y="154.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="#555555">Container: app</ns0:text>
  <ns0:rect x="488.8889" y="167.1111" width="266.6667" height="195.5556" rx="8.8889" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="622.2222" y="186.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="#1565c0">Env Vars (envFrom)</ns0:text>
  <ns0:text x="502.2222" y="208" font-family="monospace" font-size="10.6667" fill="#333">DB_HOST=postgres</ns0:text>
  <ns0:text x="502.2222" y="225.7778" font-family="monospace" font-size="10.6667" fill="#333">DB_PORT=5432</ns0:text>
  <ns0:text x="502.2222" y="243.5556" font-family="monospace" font-size="10.6667" fill="#333">LOG_LEVEL=info</ns0:text>
  <ns0:line x1="488.8889" y1="253.3333" x2="755.5556" y2="253.3333" stroke="#bdbdbd" stroke-width="0.8889" stroke-dasharray="3.5556 2.6667" />
  <ns0:text x="502.2222" y="271.1111" font-family="monospace" font-size="10.6667" fill="#c62828">DB_PASS=secret</ns0:text>
  <ns0:text x="502.2222" y="288.8889" font-family="monospace" font-size="10.6667" fill="#c62828">API_KEY=abc123</ns0:text>
  <ns0:text x="622.2222" y="318.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">from ConfigMap (blue)</ns0:text>
  <ns0:text x="622.2222" y="332.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">from Secret (red)</ns0:text>
  <ns0:text x="622.2222" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#777">env vars loaded at pod start</ns0:text>
  <ns0:rect x="773.3333" y="167.1111" width="284.4444" height="195.5556" rx="8.8889" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.3333" />
  <ns0:text x="915.5556" y="186.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="#388e3c">Volume Mount</ns0:text>
  <ns0:text x="786.6667" y="208" font-family="monospace" font-size="10.6667" fill="#333">/etc/config/</ns0:text>
  <ns0:text x="800" y="225.7778" font-family="monospace" font-size="10.6667" fill="#1565c0">  DB_HOST → file</ns0:text>
  <ns0:text x="800" y="243.5556" font-family="monospace" font-size="10.6667" fill="#1565c0">  LOG_LEVEL → file</ns0:text>
  <ns0:line x1="773.3333" y1="253.3333" x2="1057.7778" y2="253.3333" stroke="#bdbdbd" stroke-width="0.8889" stroke-dasharray="3.5556 2.6667" />
  <ns0:text x="786.6667" y="273.7778" font-family="monospace" font-size="10.6667" fill="#333">/etc/secrets/</ns0:text>
  <ns0:text x="800" y="291.5556" font-family="monospace" font-size="10.6667" fill="#c62828">  DB_PASS → file</ns0:text>
  <ns0:text x="800" y="309.3333" font-family="monospace" font-size="10.6667" fill="#c62828">  API_KEY → file</ns0:text>
  <ns0:text x="915.5556" y="336" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">Files updated when</ns0:text>
  <ns0:text x="915.5556" y="350.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">ConfigMap/Secret changes</ns0:text>
  <ns0:rect x="488.8889" y="391.1111" width="568.8889" height="97.7778" rx="8.8889" fill="#fff9c4" stroke="#f9a825" stroke-width="1.3333" />
  <ns0:text x="773.3333" y="413.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="#e65100">Application Process</ns0:text>
  <ns0:text x="773.3333" y="435.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#555">reads env: os.getenv("DB_HOST")  →  postgres</ns0:text>
  <ns0:text x="773.3333" y="455.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#555">reads file: open("/etc/secrets/DB_PASS")  →  secret</ns0:text>
  <ns0:text x="773.3333" y="474.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="#777">Code never contains credentials — all injected by Kubernetes</ns0:text>

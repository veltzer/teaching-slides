<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="35.5556" y="53.3333" width="284.4444" height="177.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="35.5556" y="53.3333" width="284.4444" height="40.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="35.5556" y="83.5556" width="284.4444" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="177.7778" y="81.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">ConfigMap</text>
  <text x="53.3333" y="117.3333" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">apiVersion: v1</text>
  <text x="53.3333" y="135.1111" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">kind: ConfigMap</text>
  <text x="53.3333" y="152.8889" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">data:</text>
  <text x="53.3333" y="170.6667" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">  DB_HOST: postgres</text>
  <text x="53.3333" y="188.4444" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">  DB_PORT: "5432"</text>
  <text x="53.3333" y="206.2222" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">  LOG_LEVEL: info</text>
  <rect x="35.5556" y="257.7778" width="284.4444" height="177.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="35.5556" y="257.7778" width="284.4444" height="40.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="35.5556" y="288" width="284.4444" height="10.6667" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="177.7778" y="286.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Secret</text>
  <text x="53.3333" y="321.7778" font-family="monospace" font-size="11.5556" fill="var(--danger-accent)">apiVersion: v1</text>
  <text x="53.3333" y="339.5556" font-family="monospace" font-size="11.5556" fill="var(--danger-accent)">kind: Secret</text>
  <text x="53.3333" y="357.3333" font-family="monospace" font-size="11.5556" fill="var(--danger-accent)">type: Opaque</text>
  <text x="53.3333" y="375.1111" font-family="monospace" font-size="11.5556" fill="var(--danger-accent)">data:</text>
  <text x="53.3333" y="392.8889" font-family="monospace" font-size="11.5556" fill="var(--danger-accent)">  DB_PASS: c2VjcmV0  # b64</text>
  <text x="53.3333" y="410.6667" font-family="monospace" font-size="11.5556" fill="var(--danger-accent)">  API_KEY:  YWJjMTIz</text>
  <rect x="444.4444" y="71.1111" width="657.7778" height="462.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="444.4444" y="71.1111" width="657.7778" height="44.4444" rx="6" fill="var(--text-muted)" />
  <rect x="444.4444" y="103.1111" width="657.7778" height="12.4444" fill="var(--text-muted)" rx="6"/>
  <text x="773.3333" y="101.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">Pod</text>
  <rect x="471.1111" y="131.5556" width="604.4444" height="382.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="773.3333" y="154.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text-muted)">Container: app</text>
  <rect x="488.8889" y="167.1111" width="266.6667" height="195.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="622.2222" y="186.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">Env Vars (envFrom)</text>
  <text x="502.2222" y="208" font-family="monospace" font-size="10.6667" fill="var(--text)">DB_HOST=postgres</text>
  <text x="502.2222" y="225.7778" font-family="monospace" font-size="10.6667" fill="var(--text)">DB_PORT=5432</text>
  <text x="502.2222" y="243.5556" font-family="monospace" font-size="10.6667" fill="var(--text)">LOG_LEVEL=info</text>
  <line x1="488.8889" y1="253.3333" x2="755.5556" y2="253.3333" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="3.5556 2.6667" />
  <text x="502.2222" y="271.1111" font-family="monospace" font-size="10.6667" fill="var(--danger-accent)">DB_PASS=secret</text>
  <text x="502.2222" y="288.8889" font-family="monospace" font-size="10.6667" fill="var(--danger-accent)">API_KEY=abc123</text>
  <text x="622.2222" y="318.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">from ConfigMap (blue)</text>
  <text x="622.2222" y="332.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">from Secret (red)</text>
  <text x="622.2222" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">env vars loaded at pod start</text>
  <rect x="773.3333" y="167.1111" width="284.4444" height="195.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="915.5556" y="186.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--ok-accent)">Volume Mount</text>
  <text x="786.6667" y="208" font-family="monospace" font-size="10.6667" fill="var(--text)">/etc/config/</text>
  <text x="800" y="225.7778" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">  DB_HOST → file</text>
  <text x="800" y="243.5556" font-family="monospace" font-size="10.6667" fill="var(--primary-accent)">  LOG_LEVEL → file</text>
  <line x1="773.3333" y1="253.3333" x2="1057.7778" y2="253.3333" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="3.5556 2.6667" />
  <text x="786.6667" y="273.7778" font-family="monospace" font-size="10.6667" fill="var(--text)">/etc/secrets/</text>
  <text x="800" y="291.5556" font-family="monospace" font-size="10.6667" fill="var(--danger-accent)">  DB_PASS → file</text>
  <text x="800" y="309.3333" font-family="monospace" font-size="10.6667" fill="var(--danger-accent)">  API_KEY → file</text>
  <text x="915.5556" y="336" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Files updated when</text>
  <text x="915.5556" y="350.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">ConfigMap/Secret changes</text>
  <rect x="488.8889" y="391.1111" width="568.8889" height="97.7778" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="773.3333" y="413.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--warn-accent)">Application Process</text>
  <text x="773.3333" y="435.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">reads env: os.getenv("DB_HOST")  →  postgres</text>
  <text x="773.3333" y="455.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">reads file: open("/etc/secrets/DB_PASS")  →  secret</text>
  <text x="773.3333" y="474.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Code never contains credentials — all injected by Kubernetes</text>
  <line x1="320" y1="142.2222" x2="488.8889" y2="264.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="382.2222" y="195.5556" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-accent)">envFrom</text>
  <line x1="320" y1="177.7778" x2="773.3333" y2="264.8889" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow-primary)" />
  <text x="488.8889" y="168.8889" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-accent)">volumeMount</text>
  <line x1="320" y1="355.5556" x2="488.8889" y2="302.2222" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="369.7778" y="351.1111" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">envFrom</text>
  <line x1="320" y1="391.1111" x2="773.3333" y2="328.8889" stroke="var(--danger-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <text x="480" y="389.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">volumeMount</text>
</svg>
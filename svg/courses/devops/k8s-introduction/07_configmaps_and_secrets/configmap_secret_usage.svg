<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="319.999922" height="214.8148" rx="7.155418" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="319.999922" height="49.407467" rx="7.155418" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="76.518667" width="319.999922" height="12.888933" fill="url(#grad-primary)" rx="7.155418" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200.000014" y="74.3704" text-anchor="middle" font-size="18.654771" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">ConfigMap</text>
  <text x="60.000002" y="117.333333" font-size="13.472936" fill="var(--primary-accent)" font-family="Courier New, monospace">apiVersion: v1</text>
  <text x="60.000002" y="138.8148" font-size="13.472936" fill="var(--primary-accent)" font-family="Courier New, monospace">kind: ConfigMap</text>
  <text x="60.000002" y="160.2964" font-size="13.472936" fill="var(--primary-accent)" font-family="Courier New, monospace">data:</text>
  <text x="60.000002" y="181.777867" font-size="13.472936" fill="var(--primary-accent)" font-family="Courier New, monospace">  DB_HOST: postgres</text>
  <text x="60.000002" y="203.2592" font-size="13.472936" fill="var(--primary-accent)" font-family="Courier New, monospace">  DB_PORT: "5432"</text>
  <text x="60.000002" y="224.7408" font-size="13.472936" fill="var(--primary-accent)" font-family="Courier New, monospace">  LOG_LEVEL: info</text>
  <rect x="40" y="287.037067" width="319.999922" height="214.8148" rx="7.155418" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="287.037067" width="319.999922" height="49.407467" rx="7.155418" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="323.5556" width="319.999922" height="12.888933" fill="url(#grad-danger)" rx="7.155418" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200.000014" y="321.407467" text-anchor="middle" font-size="18.654771" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Secret</text>
  <text x="60.000002" y="364.3704" font-size="13.472936" fill="var(--danger-accent)" font-family="Courier New, monospace">apiVersion: v1</text>
  <text x="60.000002" y="385.852" font-size="13.472936" fill="var(--danger-accent)" font-family="Courier New, monospace">kind: Secret</text>
  <text x="60.000002" y="407.333333" font-size="13.472936" fill="var(--danger-accent)" font-family="Courier New, monospace">type: Opaque</text>
  <text x="60.000002" y="428.8148" font-size="13.472936" fill="var(--danger-accent)" font-family="Courier New, monospace">data:</text>
  <text x="60.000002" y="450.2964" font-size="13.472936" fill="var(--danger-accent)" font-family="Courier New, monospace">  DB_PASS: c2VjcmV0  # b64</text>
  <text x="60.000002" y="471.777867" font-size="13.472936" fill="var(--danger-accent)" font-family="Courier New, monospace">  API_KEY:  YWJjMTIz</text>
  <rect x="499.999934" y="61.481467" width="740.000066" height="558.518533" rx="7.155418" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="499.999934" y="61.481467" width="740.000066" height="53.7036" rx="7.155418" fill="var(--text-muted)"/>
  <rect x="499.999934" y="100.148133" width="740.000066" height="15.036933" fill="var(--text-muted)" rx="7.155418"/>
  <text x="869.999967" y="98" text-anchor="middle" font-size="20.727576" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Pod</text>
  <rect x="530.000044" y="134.518667" width="679.999954" height="461.851867" rx="7.155418" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="869.999967" y="162.444533" text-anchor="middle" font-size="16.581965" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Container: app</text>
  <rect x="550.000045" y="177.481467" width="300.000027" height="236.2964" rx="7.155418" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="700.000059" y="201.1112" text-anchor="middle" font-size="15.545622" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Env Vars (envFrom)</text>
  <text x="565.000047" y="226.888933" font-size="12.436593" fill="var(--text)" font-family="Courier New, monospace">DB_HOST=postgres</text>
  <text x="565.000047" y="248.3704" font-size="12.436593" fill="var(--text)" font-family="Courier New, monospace">DB_PORT=5432</text>
  <text x="565.000047" y="269.852" font-size="12.436593" fill="var(--text)" font-family="Courier New, monospace">LOG_LEVEL=info</text>
  <line x1="550.000045" y1="281.666667" x2="850.000072" y2="281.666667" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="3.5556 2.6667"/>
  <text x="565.000047" y="303.148133" font-size="12.436593" fill="var(--danger-accent)" font-family="Courier New, monospace">DB_PASS=secret</text>
  <text x="565.000047" y="324.629733" font-size="12.436593" fill="var(--danger-accent)" font-family="Courier New, monospace">API_KEY=abc123</text>
  <text x="700.000059" y="360.074133" text-anchor="middle" font-size="11.925696" fill="var(--text-muted)" font-family="Arial, sans-serif">from ConfigMap (blue)</text>
  <text x="700.000059" y="377.2592" text-anchor="middle" font-size="11.925696" fill="var(--text-muted)" font-family="Arial, sans-serif">from Secret (red)</text>
  <text x="700.000059" y="400.888933" text-anchor="middle" font-size="11.925696" fill="var(--text-muted)" font-family="Arial, sans-serif">env vars loaded at pod start</text>
  <rect x="869.999967" y="177.481467" width="319.999922" height="236.2964" rx="7.155418" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030.000088" y="201.1112" text-anchor="middle" font-size="15.545622" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Volume Mount</text>
  <text x="885.000075" y="226.888933" font-size="12.436593" fill="var(--text)" font-family="Courier New, monospace">/etc/config/</text>
  <text x="900.000076" y="248.3704" font-size="12.436593" fill="var(--primary-accent)" font-family="Courier New, monospace">  DB_HOST → file</text>
  <text x="900.000076" y="269.852" font-size="12.436593" fill="var(--primary-accent)" font-family="Courier New, monospace">  LOG_LEVEL → file</text>
  <line x1="869.999967" y1="281.666667" x2="1190.000102" y2="281.666667" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="3.5556 2.6667"/>
  <text x="885.000075" y="306.3704" font-size="12.436593" fill="var(--text)" font-family="Courier New, monospace">/etc/secrets/</text>
  <text x="900.000076" y="327.852" font-size="12.436593" fill="var(--danger-accent)" font-family="Courier New, monospace">  DB_PASS → file</text>
  <text x="900.000076" y="349.333333" font-size="12.436593" fill="var(--danger-accent)" font-family="Courier New, monospace">  API_KEY → file</text>
  <text x="1030.000088" y="381.5556" text-anchor="middle" font-size="11.925696" fill="var(--text-muted)" font-family="Arial, sans-serif">Files updated when</text>
  <text x="1030.000088" y="398.7408" text-anchor="middle" font-size="11.925696" fill="var(--text-muted)" font-family="Arial, sans-serif">ConfigMap/Secret changes</text>
  <rect x="550.000045" y="448.148133" width="640.000057" height="118.148133" rx="7.155418" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="869.999967" y="475" text-anchor="middle" font-size="15.545622" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Application Process</text>
  <text x="869.999967" y="501.852" text-anchor="middle" font-size="13.472936" fill="var(--text-muted)" font-family="Arial, sans-serif">reads env: os.getenv("DB_HOST")  →  postgres</text>
  <text x="869.999967" y="525.481467" text-anchor="middle" font-size="13.472936" fill="var(--text-muted)" font-family="Arial, sans-serif">reads file: open("/etc/secrets/DB_PASS")  →  secret</text>
  <text x="869.999967" y="549.1112" text-anchor="middle" font-size="12.436593" fill="var(--text-muted)" font-family="Arial, sans-serif">Code never contains credentials — all injected by Kubernetes</text>
  <line x1="360.000028" y1="147.407467" x2="550.000045" y2="295.629733" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <text x="430.000035" y="211.852" font-size="11.925696" fill="var(--primary-accent)" font-family="Arial, sans-serif">envFrom</text>
  <line x1="360.000028" y1="190.3704" x2="869.999967" y2="295.629733" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow-primary)"/>
  <text x="550.000045" y="179.629733" font-size="11.925696" fill="var(--primary-accent)" font-family="Arial, sans-serif">volumeMount</text>
  <line x1="360.000028" y1="405.185333" x2="550.000045" y2="340.7408" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="416.000033" y="399.8148" font-size="11.925696" fill="var(--danger-accent)" font-family="Arial, sans-serif">envFrom</text>
  <line x1="360.000028" y1="448.148133" x2="869.999967" y2="372.963067" stroke="var(--danger-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)"/>
  <text x="540.000044" y="446" font-size="11.925696" fill="var(--danger-accent)" font-family="Arial, sans-serif">volumeMount</text>
</svg>

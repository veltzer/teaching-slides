<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="319.999922" height="214.8148" rx="7.155418" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="40" width="319.999922" height="49.407467" rx="7.155418" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="76.518667" width="319.999922" height="12.888933" fill="var(--primary-fill)" rx="7.155418" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="200.000014" y="74.3704" text-anchor="middle" font-family="Arial,sans-serif" font-size="18.654771" font-weight="bold" fill="var(--bg)">ConfigMap</text>
  <text x="60.000002" y="117.333333" font-family="monospace" font-size="13.472936" fill="var(--primary-accent)">apiVersion: v1</text>
  <text x="60.000002" y="138.8148" font-family="monospace" font-size="13.472936" fill="var(--primary-accent)">kind: ConfigMap</text>
  <text x="60.000002" y="160.2964" font-family="monospace" font-size="13.472936" fill="var(--primary-accent)">data:</text>
  <text x="60.000002" y="181.777867" font-family="monospace" font-size="13.472936" fill="var(--primary-accent)">  DB_HOST: postgres</text>
  <text x="60.000002" y="203.2592" font-family="monospace" font-size="13.472936" fill="var(--primary-accent)">  DB_PORT: "5432"</text>
  <text x="60.000002" y="224.7408" font-family="monospace" font-size="13.472936" fill="var(--primary-accent)">  LOG_LEVEL: info</text>
  <rect x="40" y="287.037067" width="319.999922" height="214.8148" rx="7.155418" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="287.037067" width="319.999922" height="49.407467" rx="7.155418" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="40" y="323.5556" width="319.999922" height="12.888933" fill="var(--danger-fill)" rx="7.155418" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="200.000014" y="321.407467" text-anchor="middle" font-family="Arial,sans-serif" font-size="18.654771" font-weight="bold" fill="var(--bg)">Secret</text>
  <text x="60.000002" y="364.3704" font-family="monospace" font-size="13.472936" fill="var(--danger-accent)">apiVersion: v1</text>
  <text x="60.000002" y="385.852" font-family="monospace" font-size="13.472936" fill="var(--danger-accent)">kind: Secret</text>
  <text x="60.000002" y="407.333333" font-family="monospace" font-size="13.472936" fill="var(--danger-accent)">type: Opaque</text>
  <text x="60.000002" y="428.8148" font-family="monospace" font-size="13.472936" fill="var(--danger-accent)">data:</text>
  <text x="60.000002" y="450.2964" font-family="monospace" font-size="13.472936" fill="var(--danger-accent)">  DB_PASS: c2VjcmV0  # b64</text>
  <text x="60.000002" y="471.777867" font-family="monospace" font-size="13.472936" fill="var(--danger-accent)">  API_KEY:  YWJjMTIz</text>
  <rect x="499.999934" y="61.481467" width="740.000066" height="558.518533" rx="7.155418" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="499.999934" y="61.481467" width="740.000066" height="53.7036" rx="7.155418" fill="var(--text-muted)" />
  <rect x="499.999934" y="100.148133" width="740.000066" height="15.036933" fill="var(--text-muted)" rx="7.155418"/>
  <text x="869.999967" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="20.727576" font-weight="bold" fill="var(--bg)">Pod</text>
  <rect x="530.000044" y="134.518667" width="679.999954" height="461.851867" rx="7.155418" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="869.999967" y="162.444533" text-anchor="middle" font-family="Arial,sans-serif" font-size="16.581965" font-weight="bold" fill="var(--text-muted)">Container: app</text>
  <rect x="550.000045" y="177.481467" width="300.000027" height="236.2964" rx="7.155418" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="700.000059" y="201.1112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.545622" font-weight="bold" fill="var(--primary-accent)">Env Vars (envFrom)</text>
  <text x="565.000047" y="226.888933" font-family="monospace" font-size="12.436593" fill="var(--text)">DB_HOST=postgres</text>
  <text x="565.000047" y="248.3704" font-family="monospace" font-size="12.436593" fill="var(--text)">DB_PORT=5432</text>
  <text x="565.000047" y="269.852" font-family="monospace" font-size="12.436593" fill="var(--text)">LOG_LEVEL=info</text>
  <line x1="550.000045" y1="281.666667" x2="850.000072" y2="281.666667" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="3.5556 2.6667" />
  <text x="565.000047" y="303.148133" font-family="monospace" font-size="12.436593" fill="var(--danger-accent)">DB_PASS=secret</text>
  <text x="565.000047" y="324.629733" font-family="monospace" font-size="12.436593" fill="var(--danger-accent)">API_KEY=abc123</text>
  <text x="700.000059" y="360.074133" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.925696" fill="var(--text-muted)">from ConfigMap (blue)</text>
  <text x="700.000059" y="377.2592" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.925696" fill="var(--text-muted)">from Secret (red)</text>
  <text x="700.000059" y="400.888933" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.925696" fill="var(--text-muted)">env vars loaded at pod start</text>
  <rect x="869.999967" y="177.481467" width="319.999922" height="236.2964" rx="7.155418" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1030.000088" y="201.1112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.545622" font-weight="bold" fill="var(--ok-accent)">Volume Mount</text>
  <text x="885.000075" y="226.888933" font-family="monospace" font-size="12.436593" fill="var(--text)">/etc/config/</text>
  <text x="900.000076" y="248.3704" font-family="monospace" font-size="12.436593" fill="var(--primary-accent)">  DB_HOST → file</text>
  <text x="900.000076" y="269.852" font-family="monospace" font-size="12.436593" fill="var(--primary-accent)">  LOG_LEVEL → file</text>
  <line x1="869.999967" y1="281.666667" x2="1190.000102" y2="281.666667" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="3.5556 2.6667" />
  <text x="885.000075" y="306.3704" font-family="monospace" font-size="12.436593" fill="var(--text)">/etc/secrets/</text>
  <text x="900.000076" y="327.852" font-family="monospace" font-size="12.436593" fill="var(--danger-accent)">  DB_PASS → file</text>
  <text x="900.000076" y="349.333333" font-family="monospace" font-size="12.436593" fill="var(--danger-accent)">  API_KEY → file</text>
  <text x="1030.000088" y="381.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.925696" fill="var(--text-muted)">Files updated when</text>
  <text x="1030.000088" y="398.7408" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.925696" fill="var(--text-muted)">ConfigMap/Secret changes</text>
  <rect x="550.000045" y="448.148133" width="640.000057" height="118.148133" rx="7.155418" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="869.999967" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.545622" font-weight="bold" fill="var(--warn-accent)">Application Process</text>
  <text x="869.999967" y="501.852" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.472936" fill="var(--text-muted)">reads env: os.getenv("DB_HOST")  →  postgres</text>
  <text x="869.999967" y="525.481467" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.472936" fill="var(--text-muted)">reads file: open("/etc/secrets/DB_PASS")  →  secret</text>
  <text x="869.999967" y="549.1112" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.436593" fill="var(--text-muted)">Code never contains credentials — all injected by Kubernetes</text>
  <line x1="360.000028" y1="147.407467" x2="550.000045" y2="295.629733" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="430.000035" y="211.852" font-family="Arial,sans-serif" font-size="11.925696" fill="var(--primary-accent)">envFrom</text>
  <line x1="360.000028" y1="190.3704" x2="869.999967" y2="295.629733" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow-primary)" />
  <text x="550.000045" y="179.629733" font-family="Arial,sans-serif" font-size="11.925696" fill="var(--primary-accent)">volumeMount</text>
  <line x1="360.000028" y1="405.185333" x2="550.000045" y2="340.7408" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="416.000033" y="399.8148" font-family="Arial,sans-serif" font-size="11.925696" fill="var(--danger-accent)">envFrom</text>
  <line x1="360.000028" y1="448.148133" x2="869.999967" y2="372.963067" stroke="var(--danger-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <text x="540.000044" y="446" font-family="Arial,sans-serif" font-size="11.925696" fill="var(--danger-accent)">volumeMount</text>
</svg>
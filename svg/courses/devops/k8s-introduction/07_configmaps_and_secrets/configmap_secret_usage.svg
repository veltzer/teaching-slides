<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="77.5" y="88.3333" width="299.9999" height="161.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="77.5" y="88.3333" width="299.9999" height="37.0556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="77.5" y="115.7223" width="299.9999" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="227.5" y="114.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.6425" font-weight="bold" fill="var(--bg)">ConfigMap</text>
  <text x="96.25" y="146.3333" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">apiVersion: v1</text>
  <text x="96.25" y="162.4444" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">kind: ConfigMap</text>
  <text x="96.25" y="178.5556" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">data:</text>
  <text x="96.25" y="194.6667" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">  DB_HOST: postgres</text>
  <text x="96.25" y="210.7777" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">  DB_PORT: "5432"</text>
  <text x="96.25" y="226.8889" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">  LOG_LEVEL: info</text>
  <rect x="77.5" y="273.6111" width="299.9999" height="161.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="77.5" y="273.6111" width="299.9999" height="37.0556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="77.5" y="301" width="299.9999" height="9.6667" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="227.5" y="299.3889" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.6425" font-weight="bold" fill="var(--bg)">Secret</text>
  <text x="96.25" y="331.6111" font-family="monospace" font-size="11.2974" fill="var(--danger-accent)">apiVersion: v1</text>
  <text x="96.25" y="347.7223" font-family="monospace" font-size="11.2974" fill="var(--danger-accent)">kind: Secret</text>
  <text x="96.25" y="363.8333" font-family="monospace" font-size="11.2974" fill="var(--danger-accent)">type: Opaque</text>
  <text x="96.25" y="379.9444" font-family="monospace" font-size="11.2974" fill="var(--danger-accent)">data:</text>
  <text x="96.25" y="396.0556" font-family="monospace" font-size="11.2974" fill="var(--danger-accent)">  DB_PASS: c2VjcmV0  # b64</text>
  <text x="96.25" y="412.1667" font-family="monospace" font-size="11.2974" fill="var(--danger-accent)">  API_KEY:  YWJjMTIz</text>
  <rect x="508.7499" y="104.4444" width="693.75" height="418.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="508.7499" y="104.4444" width="693.75" height="40.2777" rx="6" fill="var(--text-muted)" />
  <rect x="508.7499" y="133.4444" width="693.75" height="11.2777" fill="var(--text-muted)" rx="6"/>
  <text x="855.6249" y="131.8333" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)">Pod</text>
  <rect x="536.875" y="159.2223" width="637.4999" height="346.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="855.6249" y="180.1667" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text-muted)">Container: app</text>
  <rect x="555.625" y="191.4444" width="281.25" height="177.2223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="696.25" y="209.1667" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">Env Vars (envFrom)</text>
  <text x="569.6875" y="228.5" font-family="monospace" font-size="10.4284" fill="var(--text)">DB_HOST=postgres</text>
  <text x="569.6875" y="244.6111" font-family="monospace" font-size="10.4284" fill="var(--text)">DB_PORT=5432</text>
  <text x="569.6875" y="260.7223" font-family="monospace" font-size="10.4284" fill="var(--text)">LOG_LEVEL=info</text>
  <line x1="555.625" y1="269.5833" x2="836.875" y2="269.5833" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="3.5556 2.6667" />
  <text x="569.6875" y="285.6944" font-family="monospace" font-size="10.4284" fill="var(--danger-accent)">DB_PASS=secret</text>
  <text x="569.6875" y="301.8056" font-family="monospace" font-size="10.4284" fill="var(--danger-accent)">API_KEY=abc123</text>
  <text x="696.25" y="328.3889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">from ConfigMap (blue)</text>
  <text x="696.25" y="341.2777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">from Secret (red)</text>
  <text x="696.25" y="359" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">env vars loaded at pod start</text>
  <rect x="855.6249" y="191.4444" width="299.9999" height="177.2223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1005.625" y="209.1667" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--ok-accent)">Volume Mount</text>
  <text x="869.6875" y="228.5" font-family="monospace" font-size="10.4284" fill="var(--text)">/etc/config/</text>
  <text x="883.75" y="244.6111" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">  DB_HOST → file</text>
  <text x="883.75" y="260.7223" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">  LOG_LEVEL → file</text>
  <line x1="855.6249" y1="269.5833" x2="1155.625" y2="269.5833" stroke="var(--border)" stroke-width="0.8889" stroke-dasharray="3.5556 2.6667" />
  <text x="869.6875" y="288.1111" font-family="monospace" font-size="10.4284" fill="var(--text)">/etc/secrets/</text>
  <text x="883.75" y="304.2223" font-family="monospace" font-size="10.4284" fill="var(--danger-accent)">  DB_PASS → file</text>
  <text x="883.75" y="320.3333" font-family="monospace" font-size="10.4284" fill="var(--danger-accent)">  API_KEY → file</text>
  <text x="1005.625" y="344.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Files updated when</text>
  <text x="1005.625" y="357.3889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">ConfigMap/Secret changes</text>
  <rect x="555.625" y="394.4444" width="600" height="88.6111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="855.6249" y="414.5833" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--warn-accent)">Application Process</text>
  <text x="855.6249" y="434.7223" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)">reads env: os.getenv("DB_HOST")  →  postgres</text>
  <text x="855.6249" y="452.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)">reads file: open("/etc/secrets/DB_PASS")  →  secret</text>
  <text x="855.6249" y="470.1667" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Code never contains credentials — all injected by Kubernetes</text>
  <line x1="377.5" y1="168.8889" x2="555.625" y2="280.0556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="443.125" y="217.2223" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-accent)">envFrom</text>
  <line x1="377.5" y1="201.1111" x2="855.6249" y2="280.0556" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow-primary)" />
  <text x="555.625" y="193.0556" font-family="Arial,sans-serif" font-size="10" fill="var(--primary-accent)">volumeMount</text>
  <line x1="377.5" y1="362.2223" x2="555.625" y2="313.8889" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="430" y="358.1944" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">envFrom</text>
  <line x1="377.5" y1="394.4444" x2="855.6249" y2="338.0556" stroke="var(--danger-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <text x="546.25" y="392.8333" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">volumeMount</text>
</svg>
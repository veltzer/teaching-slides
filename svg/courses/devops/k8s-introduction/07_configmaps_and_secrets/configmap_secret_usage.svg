<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- ConfigMap source -->
  <rect x="40" y="60" width="320" height="200" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="40" y="60" width="320" height="46" rx="12" fill="url(#grad-accent)"/>
  <rect x="40" y="94" width="320" height="12" fill="url(#grad-accent)"/>
  <text x="200" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">ConfigMap</text>
  <text x="60" y="132" font-family="monospace" font-size="13" fill="#1a237e">apiVersion: v1</text>
  <text x="60" y="152" font-family="monospace" font-size="13" fill="#1a237e">kind: ConfigMap</text>
  <text x="60" y="172" font-family="monospace" font-size="13" fill="#1a237e">data:</text>
  <text x="60" y="192" font-family="monospace" font-size="13" fill="#1565c0">  DB_HOST: postgres</text>
  <text x="60" y="212" font-family="monospace" font-size="13" fill="#1565c0">  DB_PORT: "5432"</text>
  <text x="60" y="232" font-family="monospace" font-size="13" fill="#1565c0">  LOG_LEVEL: info</text>

  <!-- Secret source -->
  <rect x="40" y="290" width="320" height="200" rx="12" fill="#fce4ec" stroke="#e91e63" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="40" y="290" width="320" height="46" rx="12" fill="#e91e63"/>
  <rect x="40" y="324" width="320" height="12" fill="#e91e63"/>
  <text x="200" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">Secret</text>
  <text x="60" y="362" font-family="monospace" font-size="13" fill="#880e4f">apiVersion: v1</text>
  <text x="60" y="382" font-family="monospace" font-size="13" fill="#880e4f">kind: Secret</text>
  <text x="60" y="402" font-family="monospace" font-size="13" fill="#880e4f">type: Opaque</text>
  <text x="60" y="422" font-family="monospace" font-size="13" fill="#880e4f">data:</text>
  <text x="60" y="442" font-family="monospace" font-size="13" fill="#c2185b">  DB_PASS: c2VjcmV0  # b64</text>
  <text x="60" y="462" font-family="monospace" font-size="13" fill="#c2185b">  API_KEY:  YWJjMTIz</text>

  <!-- Pod -->
  <rect x="500" y="80" width="740" height="520" rx="16" fill="#f9f9f9" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
  <rect x="500" y="80" width="740" height="50" rx="16" fill="#37474f"/>
  <rect x="500" y="116" width="740" height="14" fill="#37474f"/>
  <text x="870" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#fff">Pod</text>

  <!-- Container -->
  <rect x="530" y="148" width="680" height="430" rx="12" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="870" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#37474f">Container: app</text>

  <!-- env vars section -->
  <rect x="550" y="188" width="300" height="220" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="700" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Env Vars (envFrom)</text>
  <text x="565" y="234" font-family="monospace" font-size="12" fill="#333">DB_HOST=postgres</text>
  <text x="565" y="254" font-family="monospace" font-size="12" fill="#333">DB_PORT=5432</text>
  <text x="565" y="274" font-family="monospace" font-size="12" fill="#333">LOG_LEVEL=info</text>
  <line x1="550" y1="285" x2="850" y2="285" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="565" y="305" font-family="monospace" font-size="12" fill="#c62828">DB_PASS=secret</text>
  <text x="565" y="325" font-family="monospace" font-size="12" fill="#c62828">API_KEY=abc123</text>
  <text x="700" y="358" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">from ConfigMap (blue)</text>
  <text x="700" y="374" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">from Secret (red)</text>
  <text x="700" y="396" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#777">env vars loaded at pod start</text>

  <!-- Volume mount section -->
  <rect x="870" y="188" width="320" height="220" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="1030" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#388e3c">Volume Mount</text>
  <text x="885" y="234" font-family="monospace" font-size="12" fill="#333">/etc/config/</text>
  <text x="900" y="254" font-family="monospace" font-size="12" fill="#1565c0">  DB_HOST → file</text>
  <text x="900" y="274" font-family="monospace" font-size="12" fill="#1565c0">  LOG_LEVEL → file</text>
  <line x1="870" y1="285" x2="1190" y2="285" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="885" y="308" font-family="monospace" font-size="12" fill="#333">/etc/secrets/</text>
  <text x="900" y="328" font-family="monospace" font-size="12" fill="#c62828">  DB_PASS → file</text>
  <text x="900" y="348" font-family="monospace" font-size="12" fill="#c62828">  API_KEY → file</text>
  <text x="1030" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">Files updated when</text>
  <text x="1030" y="394" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">ConfigMap/Secret changes</text>

  <!-- Process inside container -->
  <rect x="550" y="440" width="640" height="110" rx="10" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="870" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#e65100">Application Process</text>
  <text x="870" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555">reads env: os.getenv("DB_HOST")  →  postgres</text>
  <text x="870" y="512" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555">reads file: open("/etc/secrets/DB_PASS")  →  secret</text>
  <text x="870" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#777">Code never contains credentials — all injected by Kubernetes</text>

  <!-- Arrows ConfigMap → env vars -->
  <line x1="360" y1="160" x2="550" y2="298" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="430" y="220" font-family="Arial,sans-serif" font-size="11" fill="#1565c0">envFrom</text>

  <!-- Arrows ConfigMap → volume -->
  <line x1="360" y1="200" x2="870" y2="298" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-accent)"/>
  <text x="550" y="190" font-family="Arial,sans-serif" font-size="11" fill="#1565c0">volumeMount</text>

  <!-- Arrows Secret → env vars -->
  <line x1="360" y1="400" x2="550" y2="340" stroke="#e91e63" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="416" y="395" font-family="Arial,sans-serif" font-size="11" fill="#e91e63">envFrom</text>

  <!-- Arrows Secret → volume -->
  <line x1="360" y1="440" x2="870" y2="370" stroke="#e91e63" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="540" y="438" font-family="Arial,sans-serif" font-size="11" fill="#e91e63">volumeMount</text>
</svg>

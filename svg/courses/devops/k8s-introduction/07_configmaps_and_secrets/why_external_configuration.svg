  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Configuration Management</text>
  <rect x="160" y="144" width="320" height="180" fill="#ea4335" rx="8" />

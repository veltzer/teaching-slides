<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="276.9231" height="124.285745918365" fill="url(#grad-primary)" rx="6.313251175336" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="178.4615" y="112.50002767857" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">1. Identify Issue</text>
  <rect x="372.3077" y="40" width="276.9231" height="124.285745918365" fill="url(#grad-ok)" rx="6.313251175336" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510.7692" y="112.50002767857" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">2. Gather Info</text>
  <rect x="704.6154" y="40" width="276.9231" height="124.285745918365" fill="url(#grad-warn)" rx="6.313251175336" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="843.0769" y="112.50002767857" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">3. Analyze</text>
  <rect x="1036.9231" y="40" width="203.0769" height="124.285745918365" fill="url(#grad-danger)" rx="6.313251175336" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1138.4615" y="112.50002767857" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">4. Fix</text>
  <rect x="224.6154" y="247.142872959183" width="738.4615" height="372.857127040817" fill="url(#grad-ok)" rx="6.313251175336" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="593.8462" y="309.285690561226" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Information Sources</text>
  <text x="593.8462" y="361.071408801022" text-anchor="middle" font-size="22.124473081407" font-family="Arial, sans-serif" fill="var(--ok-text)">• kubectl describe</text>
  <text x="593.8462" y="402.50002767857" text-anchor="middle" font-size="22.124473081407" font-family="Arial, sans-serif" fill="var(--ok-text)">• kubectl logs</text>
  <text x="593.8462" y="443.928535841839" text-anchor="middle" font-size="22.124473081407" font-family="Arial, sans-serif" fill="var(--ok-text)">• kubectl get events</text>
  <text x="593.8462" y="485.357154719387" text-anchor="middle" font-size="22.124473081407" font-family="Arial, sans-serif" fill="var(--ok-text)">• kubectl exec</text>
  <text x="593.8462" y="526.785773596935" text-anchor="middle" font-size="22.124473081407" font-family="Arial, sans-serif" fill="var(--ok-text)">• kubectl debug</text>
  <text x="593.8462" y="568.214281760204" text-anchor="middle" font-size="22.124473081407" font-family="Arial, sans-serif" fill="var(--ok-text)">• Metrics and monitoring</text>
</svg>

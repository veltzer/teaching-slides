<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Troubleshooting Process</text>
  <rect x="160" y="108" width="240" height="108" fill="#4285f4" rx="8" />
  <text x="280" y="171" text-anchor="middle" fill="white">1. Identify Issue</text>
  <rect x="448" y="108" width="240" height="108" fill="#34a853" rx="8" />
  <text x="568" y="171" text-anchor="middle" fill="white">2. Gather Info</text>
  <rect x="736" y="108" width="240" height="108" fill="#fbbc04" rx="8" />
  <text x="856" y="171" text-anchor="middle">3. Analyze</text>
  <rect x="1024" y="108" width="176" height="108" fill="#ea4335" rx="8" />
  <text x="1112" y="171" text-anchor="middle" fill="white">4. Fix</text>
  <rect x="320" y="288" width="640" height="324" fill="#e8f5e9" rx="8" />
  <text x="640" y="342" text-anchor="middle" font-weight="bold">Information Sources</text>
  <text x="640" y="387" text-anchor="middle" font-size="19.2">• kubectl describe</text>
  <text x="640" y="423" text-anchor="middle" font-size="19.2">• kubectl logs</text>
  <text x="640" y="459" text-anchor="middle" font-size="19.2">• kubectl get events</text>
  <text x="640" y="495" text-anchor="middle" font-size="19.2">• kubectl exec</text>
  <text x="640" y="531" text-anchor="middle" font-size="19.2">• kubectl debug</text>
  <text x="640" y="567" text-anchor="middle" font-size="19.2">• Metrics and monitoring</text>
</svg>
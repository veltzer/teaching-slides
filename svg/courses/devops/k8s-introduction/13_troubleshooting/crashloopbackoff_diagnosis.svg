<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="374.999938476565" height="151.304347826087" fill="url(#grad-primary)" rx="7.401527312367" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.50002392578" y="115.652173913043" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Check Logs</text>
  <text x="227.50002392578" y="153.478260869565" text-anchor="middle" fill="var(--bg)" font-size="20.500997067369" font-family="Arial, sans-serif">kubectl logs pod --previous</text>
  <rect x="452.499921386722" y="40" width="374.999938476565" height="151.304347826087" fill="url(#grad-ok)" rx="7.401527312367" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999945312502" y="115.652173913043" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Check Exit Code</text>
  <text x="639.999945312502" y="153.478260869565" text-anchor="middle" fill="var(--bg)" font-size="20.500997067369" font-family="Arial, sans-serif">kubectl describe pod</text>
  <rect x="864.999952148439" y="40" width="374.999938476565" height="151.304347826087" fill="url(#grad-warn)" rx="7.401527312367" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.499976074219" y="115.652173913043" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Check Resources</text>
  <text x="1052.499976074219" y="153.478260869565" text-anchor="middle" font-size="20.500997067369" font-family="Arial, sans-serif" fill="var(--warn-text)">Memory/CPU limits</text>
  <rect x="40" y="241.739130434783" width="1200" height="378.260869565217" fill="url(#grad-ok)" rx="7.401527312367" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999945312502" y="304.782608695652" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Common Exit Codes</text>
  <text x="321.249926513675" y="367.826086956521" text-anchor="start" font-size="22.551096774107" font-family="Arial, sans-serif" fill="var(--ok-text)">• 0: Success (check restart policy)</text>
  <text x="321.249926513675" y="418.260869565217" text-anchor="start" font-size="22.551096774107" font-family="Arial, sans-serif" fill="var(--ok-text)">• 1: General errors</text>
  <text x="321.249926513675" y="468.695652173913" text-anchor="start" font-size="22.551096774107" font-family="Arial, sans-serif" fill="var(--ok-text)">• 125: Container failed to run</text>
  <text x="321.249926513675" y="519.130434782608" text-anchor="start" font-size="22.551096774107" font-family="Arial, sans-serif" fill="var(--ok-text)">• 126: Container command not executable</text>
  <text x="321.249926513675" y="569.565217391304" text-anchor="start" font-size="22.551096774107" font-family="Arial, sans-serif" fill="var(--ok-text)">• 127: Container command not found</text>
  <text x="789.999986328125" y="367.826086956521" text-anchor="start" font-size="22.551096774107" font-family="Arial, sans-serif" fill="var(--ok-text)">• 128+n: Fatal signal n</text>
  <text x="789.999986328125" y="418.260869565217" text-anchor="start" font-size="22.551096774107" font-family="Arial, sans-serif" fill="var(--ok-text)">• 137: SIGKILL (OOM)</text>
  <text x="789.999986328125" y="468.695652173913" text-anchor="start" font-size="22.551096774107" font-family="Arial, sans-serif" fill="var(--ok-text)">• 139: SIGSEGV</text>
  <text x="789.999986328125" y="519.130434782608" text-anchor="start" font-size="22.551096774107" font-family="Arial, sans-serif" fill="var(--ok-text)">• 143: SIGTERM</text>
</svg>

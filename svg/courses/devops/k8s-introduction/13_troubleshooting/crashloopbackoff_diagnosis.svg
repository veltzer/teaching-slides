<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">CrashLoopBackOff Diagnosis</text>
  <rect x="160" y="144" width="320" height="108" fill="#4285f4" rx="8" />
  <text x="320" y="198" text-anchor="middle" fill="white" font-weight="bold">Check Logs</text>
  <text x="320" y="225" text-anchor="middle" fill="white" font-size="16">kubectl logs pod --previous</text>
  <rect x="512" y="144" width="320" height="108" fill="#34a853" rx="8" />
  <text x="672" y="198" text-anchor="middle" fill="white" font-weight="bold">Check Exit Code</text>
  <text x="672" y="225" text-anchor="middle" fill="white" font-size="16">kubectl describe pod</text>
  <rect x="864" y="144" width="320" height="108" fill="#fbbc04" rx="8" />
  <text x="1024" y="198" text-anchor="middle" font-weight="bold">Check Resources</text>
  <text x="1024" y="225" text-anchor="middle" font-size="16">Memory/CPU limits</text>
  <rect x="160" y="288" width="1024" height="270" fill="#e8f5e9" rx="8" />
  <text x="672" y="333" text-anchor="middle" font-weight="bold">Common Exit Codes</text>
  <text x="400" y="378" text-anchor="start" font-size="17.6">• 0: Success (check restart policy)</text>
  <text x="400" y="414" text-anchor="start" font-size="17.6">• 1: General errors</text>
  <text x="400" y="450" text-anchor="start" font-size="17.6">• 125: Container failed to run</text>
  <text x="400" y="486" text-anchor="start" font-size="17.6">• 126: Container command not executable</text>
  <text x="400" y="522" text-anchor="start" font-size="17.6">• 127: Container command not found</text>
  <text x="800" y="378" text-anchor="start" font-size="17.6">• 128+n: Fatal signal n</text>
  <text x="800" y="414" text-anchor="start" font-size="17.6">• 137: SIGKILL (OOM)</text>
  <text x="800" y="450" text-anchor="start" font-size="17.6">• 139: SIGSEGV</text>
  <text x="800" y="486" text-anchor="start" font-size="17.6">• 143: SIGTERM</text>
</svg>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="453.3333" y="26.6667" width="231.1111" height="49.7778" rx="24.8889" fill="#37474f" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="#fff">Pod not running as expected</ns0:text>
  <ns0:line x1="568.8889" y1="76.4444" x2="568.8889" y2="101.3333" stroke="#555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:polygon points="568.8889,104.8889 675.5556,138.6667 568.8889,172.4444 462.2222,138.6667" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="133.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#1565c0">kubectl get pod</ns0:text>
  <ns0:text x="568.8889" y="149.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="#1565c0">What PHASE?</ns0:text>
  <ns0:line x1="462.2222" y1="138.6667" x2="106.6667" y2="240" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="248.8889" y="181.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Pending</ns0:text>
  <ns0:rect x="35.5556" y="240" width="177.7778" height="88.8889" rx="8.8889" fill="#eeeeee" stroke="#9e9e9e" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="124.4444" y="261.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#616161">Pending</ns0:text>
  <ns0:text x="124.4444" y="279.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">kubectl describe pod</ns0:text>
  <ns0:text x="124.4444" y="295.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">→ check Events section</ns0:text>
  <ns0:text x="124.4444" y="311.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">→ kubectl get nodes</ns0:text>
  <ns0:rect x="231.1111" y="240" width="177.7778" height="88.8889" rx="7.1111" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:text x="320" y="259.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" font-weight="bold" fill="#555">Causes</ns0:text>
  <ns0:text x="240" y="277.3333" font-family="Arial,sans-serif" font-size="10" fill="#555">• No node with free resources</ns0:text>
  <ns0:text x="240" y="293.3333" font-family="Arial,sans-serif" font-size="10" fill="#555">• nodeSelector mismatch</ns0:text>
  <ns0:text x="240" y="309.3333" font-family="Arial,sans-serif" font-size="10" fill="#555">• PVC not bound</ns0:text>
  <ns0:text x="240" y="325.3333" font-family="Arial,sans-serif" font-size="10" fill="#555">• Taint/toleration missing</ns0:text>
  <ns0:line x1="568.8889" y1="172.4444" x2="568.8889" y2="240" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="586.6667" y="211.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Running</ns0:text>
  <ns0:rect x="453.3333" y="240" width="231.1111" height="88.8889" rx="8.8889" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="261.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">Check readiness/liveness</ns0:text>
  <ns0:text x="568.8889" y="279.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">kubectl describe pod → Events</ns0:text>
  <ns0:text x="568.8889" y="295.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">kubectl logs my-pod</ns0:text>
  <ns0:text x="568.8889" y="311.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">kubectl logs --previous (crash)</ns0:text>
  <ns0:line x1="675.5556" y1="138.6667" x2="888.8889" y2="240" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="817.7778" y="181.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">CrashLoop/Error</ns0:text>
  <ns0:rect x="817.7778" y="240" width="284.4444" height="106.6667" rx="8.8889" fill="#ffebee" stroke="#c62828" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="960" y="263.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#b71c1c">CrashLoopBackOff</ns0:text>
  <ns0:text x="831.1111" y="282.6667" font-family="Arial,sans-serif" font-size="10" fill="#555">kubectl logs my-pod --previous</ns0:text>
  <ns0:text x="831.1111" y="298.6667" font-family="Arial,sans-serif" font-size="10" fill="#555">kubectl describe pod → Last State</ns0:text>
  <ns0:text x="831.1111" y="314.6667" font-family="Arial,sans-serif" font-size="10" fill="#555">→ app crash / bad CMD / OOMKilled</ns0:text>
  <ns0:text x="831.1111" y="330.6667" font-family="Arial,sans-serif" font-size="10" fill="#555">→ kubectl get events --sort-by='.lastTimestamp'</ns0:text>
  <ns0:rect x="817.7778" y="364.4444" width="284.4444" height="88.8889" rx="8.8889" fill="#fff3e0" stroke="#f57c00" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="960" y="385.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#e65100">ImagePullBackOff</ns0:text>
  <ns0:text x="831.1111" y="405.3333" font-family="Arial,sans-serif" font-size="10" fill="#555">• Wrong image name/tag</ns0:text>
  <ns0:text x="831.1111" y="421.3333" font-family="Arial,sans-serif" font-size="10" fill="#555">• Private registry: missing imagePullSecret</ns0:text>
  <ns0:text x="831.1111" y="437.3333" font-family="Arial,sans-serif" font-size="10" fill="#555">• Network policy blocking registry</ns0:text>
  <ns0:rect x="817.7778" y="471.1111" width="284.4444" height="71.1111" rx="8.8889" fill="#fce4ec" stroke="#e91e63" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="960" y="492.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#880e4f">OOMKilled</ns0:text>
  <ns0:text x="831.1111" y="510.2222" font-family="Arial,sans-serif" font-size="10" fill="#555">Container hit memory limit</ns0:text>
  <ns0:text x="831.1111" y="526.2222" font-family="Arial,sans-serif" font-size="10" fill="#555">→ increase resources.limits.memory</ns0:text>
  <ns0:rect x="453.3333" y="373.3333" width="231.1111" height="88.8889" rx="8.8889" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="394.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32">Check Node</ns0:text>
  <ns0:text x="568.8889" y="412.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">kubectl describe node NODE</ns0:text>
  <ns0:text x="568.8889" y="428.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">kubectl top node</ns0:text>
  <ns0:text x="568.8889" y="444.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">journalctl -u kubelet (on node)</ns0:text>
  <ns0:line x1="568.8889" y1="328.8889" x2="568.8889" y2="373.3333" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="35.5556" y="382.2222" width="391.1111" height="168.8889" rx="8.8889" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.3333" />
  <ns0:text x="44.4444" y="403.5556" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#333">Key Diagnostic Commands</ns0:text>
  <ns0:text x="53.3333" y="424.8889" font-family="monospace" font-size="10.6667" fill="#1565c0">kubectl get pods -o wide</ns0:text>
  <ns0:text x="53.3333" y="442.6667" font-family="monospace" font-size="10.6667" fill="#1565c0">kubectl describe pod &lt;name&gt;</ns0:text>
  <ns0:text x="53.3333" y="460.4444" font-family="monospace" font-size="10.6667" fill="#1565c0">kubectl logs &lt;pod&gt; [-c container]</ns0:text>
  <ns0:text x="53.3333" y="478.2222" font-family="monospace" font-size="10.6667" fill="#1565c0">kubectl logs --previous</ns0:text>
  <ns0:text x="53.3333" y="496" font-family="monospace" font-size="10.6667" fill="#1565c0">kubectl exec -it &lt;pod&gt; -- /bin/sh</ns0:text>
  <ns0:text x="53.3333" y="513.7778" font-family="monospace" font-size="10.6667" fill="#1565c0">kubectl get events --sort-by='.lastTimestamp'</ns0:text>
  <ns0:text x="53.3333" y="531.5556" font-family="monospace" font-size="10.6667" fill="#1565c0">kubectl top pods / nodes</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="518.125" y="64.1667" width="243.75" height="45.1111" rx="6" fill="var(--text-muted)" filter="url(#shadow)" />
  <text x="640" y="90.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)">Pod not running as expected</text>
  <line x1="640" y1="109.2777" x2="640" y2="131.8333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="640,135.0556 752.5,165.6667 640,196.2777 527.5,165.6667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.2222" filter="url(#shadow)" />
  <text x="640" y="160.8333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">kubectl get pod</text>
  <text x="640" y="175.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">What PHASE?</text>
  <line x1="527.5" y1="165.6667" x2="152.5" y2="257.5" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="302.5" y="204.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Pending</text>
  <rect x="77.5" y="257.5" width="187.5" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="171.25" y="276.8333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--text-muted)">Pending</text>
  <text x="171.25" y="292.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">kubectl describe pod</text>
  <text x="171.25" y="307.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">→ check Events section</text>
  <text x="171.25" y="321.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">→ kubectl get nodes</text>
  <rect x="283.75" y="257.5" width="187.5" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="377.5" y="275.2223" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" font-weight="bold" fill="var(--text-muted)">Causes</text>
  <text x="293.125" y="291.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">• No node with free resources</text>
  <text x="293.125" y="305.8333" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">• nodeSelector mismatch</text>
  <text x="293.125" y="320.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">• PVC not bound</text>
  <text x="293.125" y="334.8333" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">• Taint/toleration missing</text>
  <line x1="640" y1="196.2777" x2="640" y2="257.5" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="658.75" y="231.7223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Running</text>
  <rect x="518.125" y="257.5" width="243.75" height="80.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="276.8333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)">Check readiness/liveness</text>
  <text x="640" y="292.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">kubectl describe pod → Events</text>
  <text x="640" y="307.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">kubectl logs my-pod</text>
  <text x="640" y="321.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">kubectl logs --previous (crash)</text>
  <line x1="752.5" y1="165.6667" x2="977.5" y2="257.5" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="902.5" y="204.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">CrashLoop/Error</text>
  <rect x="902.5" y="257.5" width="299.9999" height="96.6667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1052.5" y="278.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)">CrashLoopBackOff</text>
  <text x="916.5625" y="296.1667" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">kubectl logs my-pod --previous</text>
  <text x="916.5625" y="310.6667" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">kubectl describe pod → Last State</text>
  <text x="916.5625" y="325.1667" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">→ app crash / bad CMD / OOMKilled</text>
  <text x="916.5625" y="339.6667" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">→ kubectl get events --sort-by='.lastTimestamp'</text>
  <rect x="902.5" y="370.2777" width="299.9999" height="80.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1052.5" y="389.6111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)">ImagePullBackOff</text>
  <text x="916.5625" y="407.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">• Wrong image name/tag</text>
  <text x="916.5625" y="421.8333" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">• Private registry: missing imagePullSecret</text>
  <text x="916.5625" y="436.3333" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">• Network policy blocking registry</text>
  <rect x="902.5" y="466.9444" width="299.9999" height="64.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1052.5" y="486.2777" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)">OOMKilled</text>
  <text x="916.5625" y="502.3889" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Container hit memory limit</text>
  <text x="916.5625" y="516.8889" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">→ increase resources.limits.memory</text>
  <rect x="518.125" y="378.3333" width="243.75" height="80.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="397.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)">Check Node</text>
  <text x="640" y="413.7777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">kubectl describe node NODE</text>
  <text x="640" y="428.2777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">kubectl top node</text>
  <text x="640" y="442.7777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">journalctl -u kubelet (on node)</text>
  <line x1="640" y1="338.0556" x2="640" y2="378.3333" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="77.5" y="386.3889" width="412.5" height="153.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="86.875" y="405.7223" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--text)">Key Diagnostic Commands</text>
  <text x="96.25" y="425.0556" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">kubectl get pods -o wide</text>
  <text x="96.25" y="441.1667" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">kubectl describe pod &lt;name&gt;</text>
  <text x="96.25" y="457.2777" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">kubectl logs &lt;pod&gt; [-c container]</text>
  <text x="96.25" y="473.3889" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">kubectl logs --previous</text>
  <text x="96.25" y="489.5" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">kubectl exec -it &lt;pod&gt; -- /bin/sh</text>
  <text x="96.25" y="505.6111" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">kubectl get events --sort-by='.lastTimestamp'</text>
  <text x="96.25" y="521.7223" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">kubectl top pods / nodes</text>
</svg>
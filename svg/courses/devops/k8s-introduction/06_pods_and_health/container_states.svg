<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect x="40" y="76.2503" width="1200" height="543.7497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="639.9999" y="40" text-anchor="middle" font-size="29.9142" font-weight="bold">Container States</text>
  <rect x="125.7143" y="166.8751" width="342.8572" height="217.5" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="297.1429" y="221.2501" text-anchor="middle" fill="var(--bg)" font-weight="bold">Waiting</text>
  <text x="297.1429" y="266.5625" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Not yet running</text>
  <text x="297.1429" y="302.8124" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Pulling image</text>
  <text x="297.1429" y="339.0625" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Creating container</text>
  <rect x="502.8571" y="166.8751" width="342.8572" height="217.5" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="674.2859" y="221.2501" text-anchor="middle" fill="var(--bg)" font-weight="bold">Running</text>
  <text x="674.2859" y="266.5625" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Executing normally</text>
  <text x="674.2859" y="302.8124" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Started at: timestamp</text>
  <text x="674.2859" y="339.0625" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Process active</text>
  <rect x="880" y="166.8751" width="342.8572" height="217.5" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1051.4286" y="221.2501" text-anchor="middle" fill="var(--bg)" font-weight="bold">Terminated</text>
  <text x="1051.4286" y="266.5625" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Execution completed</text>
  <text x="1051.4286" y="302.8124" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Exit code: 0 or error</text>
  <text x="1051.4286" y="339.0625" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Reason: OOMKilled, Error</text>
  <path d="M 468.5713 275.625 L 494.2855 275.625" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)" />
  <path d="M 845.7143 275.625 L 871.4286 275.625" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)" />
  <path d="M 1051.4286 384.375 Q 674.2859 456.875 297.1429 384.375" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)" />
  <text x="674.2859" y="447.8124" text-anchor="middle" font-size="18.1978">Restart Policy</text>
</svg>
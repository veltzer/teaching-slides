<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="76.2503" width="1200" height="543.7497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="639.9999" y="40" text-anchor="middle" font-size="29.9142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Container States</text>
  <rect x="125.7143" y="166.8751" width="342.8572" height="217.5" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1429" y="221.2501" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Waiting</text>
  <text x="297.1429" y="266.5625" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Not yet running</text>
  <text x="297.1429" y="302.8124" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Pulling image</text>
  <text x="297.1429" y="339.0625" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Creating container</text>
  <rect x="502.8571" y="166.8751" width="342.8572" height="217.5" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.2859" y="221.2501" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Running</text>
  <text x="674.2859" y="266.5625" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Executing normally</text>
  <text x="674.2859" y="302.8124" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Started at: timestamp</text>
  <text x="674.2859" y="339.0625" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Process active</text>
  <rect x="880" y="166.8751" width="342.8572" height="217.5" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4286" y="221.2501" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Terminated</text>
  <text x="1051.4286" y="266.5625" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Execution completed</text>
  <text x="1051.4286" y="302.8124" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Exit code: 0 or error</text>
  <text x="1051.4286" y="339.0625" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Reason: OOMKilled, Error</text>
  <path d="M 468.5713 275.625 L 494.2855 275.625" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)"/>
  <path d="M 845.7143 275.625 L 871.4286 275.625" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)"/>
  <path d="M 1051.4286 384.375 Q 674.2859 456.875 297.1429 384.375" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)"/>
  <text x="674.2859" y="447.8124" text-anchor="middle" font-size="18.1978" font-family="Arial, sans-serif" fill="var(--text)">Restart Policy</text>
</svg>

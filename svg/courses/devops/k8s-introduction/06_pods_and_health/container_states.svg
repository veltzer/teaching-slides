<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="375.000047851561" height="435.000150000052" fill="url(#grad-primary)" rx="8.874121031347" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.50002392578" y="148.750037500013" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Waiting</text>
  <text x="227.50002392578" y="239.374868749955" text-anchor="middle" fill="var(--bg)" font-size="27.037819860328" font-family="Arial, sans-serif">Not yet running</text>
  <text x="227.50002392578" y="311.874693749896" text-anchor="middle" fill="var(--bg)" font-size="27.037819860328" font-family="Arial, sans-serif">Pulling image</text>
  <text x="227.50002392578" y="384.374918749973" text-anchor="middle" fill="var(--bg)" font-size="27.037819860328" font-family="Arial, sans-serif">Creating container</text>
  <rect x="452.499921386722" y="40" width="375.000047851561" height="435.000150000052" fill="url(#grad-ok)" rx="8.874121031347" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000164062494" y="148.750037500013" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Running</text>
  <text x="640.000164062494" y="239.374868749955" text-anchor="middle" fill="var(--bg)" font-size="27.037819860328" font-family="Arial, sans-serif">Executing normally</text>
  <text x="640.000164062494" y="311.874693749896" text-anchor="middle" fill="var(--bg)" font-size="27.037819860328" font-family="Arial, sans-serif">Started at: timestamp</text>
  <text x="640.000164062494" y="384.374918749973" text-anchor="middle" fill="var(--bg)" font-size="27.037819860328" font-family="Arial, sans-serif">Process active</text>
  <rect x="864.999952148439" y="40" width="375.000047851561" height="435.000150000052" fill="url(#grad-danger)" rx="8.874121031347" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.49997607422" y="148.750037500013" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Terminated</text>
  <text x="1052.49997607422" y="239.374868749955" text-anchor="middle" fill="var(--bg)" font-size="27.037819860328" font-family="Arial, sans-serif">Execution completed</text>
  <text x="1052.49997607422" y="311.874693749896" text-anchor="middle" fill="var(--bg)" font-size="27.037819860328" font-family="Arial, sans-serif">Exit code: 0 or error</text>
  <text x="1052.49997607422" y="384.374918749973" text-anchor="middle" fill="var(--bg)" font-size="27.037819860328" font-family="Arial, sans-serif">Reason: OOMKilled, Error</text>
  <path d="M 414.999829101569 257.499874999957 L 443.12473425294 257.499874999957" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)"/>
  <path d="M 827.499969238282 257.499874999957 L 855.624983764649 257.499874999957" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)"/>
  <path d="M 1052.49997607422 474.999949999984 Q 640.000164062494 620 227.50002392578 474.999949999984" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)"/>
  <text x="640.000164062494" y="601.87479374993" text-anchor="middle" font-size="26.914913284044" font-family="Arial, sans-serif" fill="var(--text)">Restart Policy</text>
</svg>

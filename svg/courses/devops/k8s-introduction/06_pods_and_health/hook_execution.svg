<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="735.238" y="80" text-anchor="middle" font-size="33.8624" font-weight="bold">Lifecycle Hook Timing</text>
  <rect x="100.3176" y="199.0477" width="317.4603" height="142.8572" fill="var(--text-faint)" rx="10.6151" />
  <text x="259.0476" y="282.381" text-anchor="middle" fill="var(--bg)">Container Created</text>
  <rect x="481.2698" y="199.0477" width="317.4603" height="142.8572" fill="var(--primary-fill)" rx="10.6151" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="639.9999" y="258.5714" text-anchor="middle" fill="var(--bg)">PostStart Hook</text>
  <text x="639.9999" y="306.1905" text-anchor="middle" fill="var(--bg)" font-size="21.164">Runs immediately</text>
  <rect x="862.2221" y="199.0477" width="317.4603" height="142.8572" fill="var(--ok-fill)" rx="10.6151" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1020.9522" y="282.381" text-anchor="middle" fill="var(--bg)">Container Running</text>
  <rect x="481.2698" y="437.1428" width="317.4603" height="142.8572" fill="var(--warn-fill)" rx="10.6151" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="639.9999" y="496.6667" text-anchor="middle">PreStop Hook</text>
  <text x="639.9999" y="544.2856" text-anchor="middle" font-size="21.164">Before termination</text>
  <rect x="862.2221" y="437.1428" width="317.4603" height="142.8572" fill="var(--danger-fill)" rx="10.6151" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1020.9522" y="520.4761" text-anchor="middle" fill="var(--bg)">Container Terminated</text>
  <path d="M 417.7777 270.4762 L 470.6878 270.4762" stroke="var(--text-muted)" stroke-width="2.3925" marker-end="url(#arrow)" />
  <path d="M 798.73 270.4762 L 851.6401 270.4762" stroke="var(--text-muted)" stroke-width="2.3925" marker-end="url(#arrow)" />
  <path d="M 1020.9522 341.9047 L 639.9999 425.238" stroke="var(--text-muted)" stroke-width="2.3925" marker-end="url(#arrow)" />
  <path d="M 798.73 508.5713 L 851.6401 508.5713" stroke="var(--text-muted)" stroke-width="2.3925" marker-end="url(#arrow)" />
</svg>
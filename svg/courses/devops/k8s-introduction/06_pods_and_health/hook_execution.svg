<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="745.8822" y="40" text-anchor="middle" font-size="38.4551" font-weight="bold">Lifecycle Hook Timing</text>
  <rect x="40" y="178.0951" width="352.9413" height="165.7144" fill="var(--text-faint)" rx="6" />
  <text x="216.4705" y="274.7619" text-anchor="middle" fill="var(--bg)">Container Created</text>
  <rect x="463.5294" y="178.0951" width="352.9413" height="165.7144" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9998" y="247.1428" text-anchor="middle" fill="var(--bg)">PostStart Hook</text>
  <text x="639.9998" y="302.3808" text-anchor="middle" fill="var(--bg)" font-size="24.0344">Runs immediately</text>
  <rect x="887.0587" y="178.0951" width="352.9413" height="165.7144" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1063.5294" y="274.7619" text-anchor="middle" fill="var(--bg)">Container Running</text>
  <rect x="463.5294" y="454.2856" width="352.9413" height="165.7144" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" />
  <text x="639.9998" y="523.3334" text-anchor="middle">PreStop Hook</text>
  <text x="639.9998" y="578.5712" text-anchor="middle" font-size="24.0344">Before termination</text>
  <rect x="887.0587" y="454.2856" width="352.9413" height="165.7144" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1063.5294" y="550.9523" text-anchor="middle" fill="var(--bg)">Container Terminated</text>
  <path d="M 392.9409 260.9524 L 451.7647 260.9524" stroke="var(--text-muted)" stroke-width="0.9402" marker-end="url(#arrow)" />
  <path d="M 816.4705 260.9524 L 875.294 260.9524" stroke="var(--text-muted)" stroke-width="0.9402" marker-end="url(#arrow)" />
  <path d="M 1063.5294 343.8095 L 639.9998 440.4761" stroke="var(--text-muted)" stroke-width="0.9402" marker-end="url(#arrow)" />
  <path d="M 816.4705 537.1425 L 875.294 537.1425" stroke="var(--text-muted)" stroke-width="0.9402" marker-end="url(#arrow)" />
</svg>
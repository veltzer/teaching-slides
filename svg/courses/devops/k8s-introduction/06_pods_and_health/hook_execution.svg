<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Lifecycle Hook Timing</text>
  <rect x="160" y="144" width="240" height="108" fill="#888" rx="8" />
  <text x="280" y="207" text-anchor="middle" fill="white">Container Created</text>
  <rect x="448" y="144" width="240" height="108" fill="#4285f4" rx="8" />
  <text x="568" y="189" text-anchor="middle" fill="white">PostStart Hook</text>
  <text x="568" y="225" text-anchor="middle" fill="white" font-size="16">Runs immediately</text>
  <rect x="736" y="144" width="240" height="108" fill="#34a853" rx="8" />
  <text x="856" y="207" text-anchor="middle" fill="white">Container Running</text>
  <rect x="448" y="324" width="240" height="108" fill="#fbbc04" rx="8" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="745.8822" y="40" text-anchor="middle" font-size="38.4551" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Lifecycle Hook Timing</text>
  <rect x="40" y="178.0951" width="352.9413" height="165.7144" fill="var(--text-faint)" rx="6" />
  <text x="216.4705" y="274.7619" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Container Created</text>
  <rect x="463.5294" y="178.0951" width="352.9413" height="165.7144" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9998" y="247.1428" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">PostStart Hook</text>
  <text x="639.9998" y="302.3808" text-anchor="middle" fill="var(--bg)" font-size="24.0344" font-family="Arial, sans-serif">Runs immediately</text>
  <rect x="887.0587" y="178.0951" width="352.9413" height="165.7144" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.5294" y="274.7619" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Container Running</text>
  <rect x="463.5294" y="454.2856" width="352.9413" height="165.7144" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9998" y="523.3334" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">PreStop Hook</text>
  <text x="639.9998" y="578.5712" text-anchor="middle" font-size="24.0344" font-family="Arial, sans-serif" fill="var(--warn-text)">Before termination</text>
  <rect x="887.0587" y="454.2856" width="352.9413" height="165.7144" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.5294" y="550.9523" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Container Terminated</text>
  <path d="M 392.9409 260.9524 L 451.7647 260.9524" stroke="var(--text-muted)" stroke-width="0.9402" marker-end="url(#arrow)" />
  <path d="M 816.4705 260.9524 L 875.294 260.9524" stroke="var(--text-muted)" stroke-width="0.9402" marker-end="url(#arrow)" />
  <path d="M 1063.5294 343.8095 L 639.9998 440.4761" stroke="var(--text-muted)" stroke-width="0.9402" marker-end="url(#arrow)" />
  <path d="M 816.4705 537.1425 L 875.294 537.1425" stroke="var(--text-muted)" stroke-width="0.9402" marker-end="url(#arrow)" />
</svg>
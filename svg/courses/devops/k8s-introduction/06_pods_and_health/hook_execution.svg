  <rect x="736" y="324" width="240" height="108" fill="#ea4335" rx="8" />
  <text x="856" y="387" text-anchor="middle" fill="white">Container Terminated</text>
  <path d="M 400 198 L 440 198" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 688 198 L 728 198" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 856 252 L 568 315" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 688 378 L 728 378" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
</svg>
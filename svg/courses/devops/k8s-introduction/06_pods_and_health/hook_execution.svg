<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="460.8955" y="50.1493" text-anchor="middle" font-size="21.2272" font-weight="bold">Lifecycle Hook Timing</text>
  <rect x="62.8857" y="124.7761" width="199.005" height="89.5523" fill="var(--text-faint)" rx="6" />
  <text x="162.3881" y="177.015" text-anchor="middle" fill="var(--bg)">Container Created</text>
  <rect x="301.6916" y="124.7761" width="199.005" height="89.5523" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="1.2537" />
  <text x="401.194" y="162.0896" text-anchor="middle" fill="var(--bg)">PostStart Hook</text>
  <text x="401.194" y="191.9403" text-anchor="middle" fill="var(--bg)" font-size="13.267">Runs immediately</text>
  <rect x="540.4975" y="124.7761" width="199.005" height="89.5523" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="1.2537" />
  <text x="640" y="177.015" text-anchor="middle" fill="var(--bg)">Container Running</text>
  <rect x="301.6916" y="274.0299" width="199.005" height="89.5523" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="1.2537" />
  <text x="401.194" y="311.3434" text-anchor="middle">PreStop Hook</text>
  <text x="401.194" y="341.194" text-anchor="middle" font-size="13.267">Before termination</text>
  <rect x="540.4975" y="274.0299" width="199.005" height="89.5523" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="1.2537" />
  <text x="640" y="326.2687" text-anchor="middle" fill="var(--bg)">Container Terminated</text>
  <path d="M 261.8905 169.5523 L 295.0581 169.5523" stroke="var(--text-muted)" stroke-width="0.9402" marker-end="url(#arrow)" />
  <path d="M 500.6965 169.5523 L 533.864 169.5523" stroke="var(--text-muted)" stroke-width="0.9402" marker-end="url(#arrow)" />
  <path d="M 640 214.3284 L 401.194 266.5672" stroke="var(--text-muted)" stroke-width="0.9402" marker-end="url(#arrow)" />
  <path d="M 500.6965 318.8059 L 533.864 318.8059" stroke="var(--text-muted)" stroke-width="0.9402" marker-end="url(#arrow)" />
</svg>
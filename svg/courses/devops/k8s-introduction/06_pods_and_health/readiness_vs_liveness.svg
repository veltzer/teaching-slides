<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="580.645168574402" height="302.608695652174" fill="url(#grad-primary)" rx="7.519959567814" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.322527835586" y="115.652173913043" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Readiness Probe</text>
  <text x="330.322527835586" y="178.695652173913" text-anchor="middle" fill="var(--bg)" font-size="22.911938143875" font-family="Arial, sans-serif">• Removes from service endpoints</text>
  <text x="330.322527835586" y="229.130434782609" text-anchor="middle" fill="var(--bg)" font-size="22.911938143875" font-family="Arial, sans-serif">• Traffic stops routing to pod</text>
  <text x="330.322527835586" y="279.565217391305" text-anchor="middle" fill="var(--bg)" font-size="22.911938143875" font-family="Arial, sans-serif">• Container keeps running</text>
  <rect x="659.354831425598" y="40" width="580.645168574402" height="302.608695652174" fill="url(#grad-ok)" rx="7.519959567814" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.677472164414" y="115.652173913043" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Liveness Probe</text>
  <text x="949.677472164414" y="178.695652173913" text-anchor="middle" fill="var(--bg)" font-size="22.911938143875" font-family="Arial, sans-serif">• Restarts container</text>
  <text x="949.677472164414" y="229.130434782609" text-anchor="middle" fill="var(--bg)" font-size="22.911938143875" font-family="Arial, sans-serif">• Kills unhealthy container</text>
  <text x="949.677472164414" y="279.565217391305" text-anchor="middle" fill="var(--bg)" font-size="22.911938143875" font-family="Arial, sans-serif">• Based on restart policy</text>
  <rect x="40" y="418.260869565217" width="1200" height="201.739130434783" fill="url(#grad-warn)" rx="7.519959567814" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000056451615" y="481.304347826086" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Best Practice</text>
  <text x="640.000056451615" y="531.739130434782" text-anchor="middle" font-size="24.994841611499" font-family="Arial, sans-serif" fill="var(--warn-text)">Use both probes with different endpoints</text>
  <text x="640.000056451615" y="582.173913043478" text-anchor="middle" font-size="24.994841611499" font-family="Arial, sans-serif" fill="var(--warn-text)">Readiness: /ready (dependencies check) | Liveness: /health (app health)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Liveness Probe Types</text>
  <rect x="160" y="144" width="320" height="216" fill="#4285f4" rx="8" />
  <text x="320" y="198" text-anchor="middle" fill="white" font-weight="bold">HTTP GET</text>
  <text x="320" y="243" text-anchor="middle" fill="white" font-size="17.6">GET request to path</text>
  <text x="320" y="279" text-anchor="middle" fill="white" font-size="17.6">200-399 = healthy</text>
  <text x="320" y="315" text-anchor="middle" fill="white" font-size="17.6">Other = unhealthy</text>
  <rect x="512" y="144" width="320" height="216" fill="#34a853" rx="8" />
  <text x="672" y="198" text-anchor="middle" fill="white" font-weight="bold">TCP Socket</text>
  <text x="672" y="243" text-anchor="middle" fill="white" font-size="17.6">TCP connection</text>
  <text x="672" y="279" text-anchor="middle" fill="white" font-size="17.6">Connect = healthy</text>
  <text x="672" y="315" text-anchor="middle" fill="white" font-size="17.6">Fail = unhealthy</text>
  <rect x="864" y="144" width="320" height="216" fill="#fbbc04" rx="8" />
  <text x="1024" y="198" text-anchor="middle" font-weight="bold">Exec Command</text>
  <text x="1024" y="243" text-anchor="middle" font-size="17.6">Run command in container</text>
  <text x="1024" y="279" text-anchor="middle" font-size="17.6">Exit 0 = healthy</text>
  <text x="1024" y="315" text-anchor="middle" font-size="17.6">Non-zero = unhealthy</text>
  <rect x="320" y="414" width="640" height="144" fill="#e8f5e9" rx="8" />
  <text x="640" y="459" text-anchor="middle" font-weight="bold">Action on Failure</text>
  <text x="640" y="504" text-anchor="middle" font-size="19.2">Container is killed and restarted based on restart policy</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="374.999972656249" height="302.608695652174" fill="url(#grad-primary)" rx="7.401527649676" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.500041015627" y="115.652173913043" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">HTTP GET</text>
  <text x="227.500041015627" y="178.695652173913" text-anchor="middle" fill="var(--bg)" font-size="22.551097801827" font-family="Arial, sans-serif">GET request to path</text>
  <text x="227.500041015627" y="229.130434782609" text-anchor="middle" fill="var(--bg)" font-size="22.551097801827" font-family="Arial, sans-serif">200-399 = healthy</text>
  <text x="227.500041015627" y="279.565217391305" text-anchor="middle" fill="var(--bg)" font-size="22.551097801827" font-family="Arial, sans-serif">Other = unhealthy</text>
  <rect x="452.499958984373" y="40" width="374.999972656249" height="302.608695652174" fill="url(#grad-ok)" rx="7.401527649676" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="115.652173913043" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">TCP Socket</text>
  <text x="640" y="178.695652173913" text-anchor="middle" fill="var(--bg)" font-size="22.551097801827" font-family="Arial, sans-serif">TCP connection</text>
  <text x="640" y="229.130434782609" text-anchor="middle" fill="var(--bg)" font-size="22.551097801827" font-family="Arial, sans-serif">Connect = healthy</text>
  <text x="640" y="279.565217391305" text-anchor="middle" fill="var(--bg)" font-size="22.551097801827" font-family="Arial, sans-serif">Fail = unhealthy</text>
  <rect x="865.000027343752" y="40" width="374.999972656249" height="302.608695652174" fill="url(#grad-warn)" rx="7.401527649676" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.500068359378" y="115.652173913043" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Exec Command</text>
  <text x="1052.500068359378" y="178.695652173913" text-anchor="middle" font-size="22.551097801827" font-family="Arial, sans-serif" fill="var(--warn-text)">Run command in container</text>
  <text x="1052.500068359378" y="229.130434782609" text-anchor="middle" font-size="22.551097801827" font-family="Arial, sans-serif" fill="var(--warn-text)">Exit 0 = healthy</text>
  <text x="1052.500068359378" y="279.565217391305" text-anchor="middle" font-size="22.551097801827" font-family="Arial, sans-serif" fill="var(--warn-text)">Non-zero = unhealthy</text>
  <rect x="227.500041015627" y="418.260869565217" width="750.000054687503" height="201.739130434783" fill="url(#grad-ok)" rx="7.401527649676" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="602.500013671876" y="481.304347826086" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Action on Failure</text>
  <text x="602.500013671876" y="544.347826086957" text-anchor="middle" font-size="24.601197601992" font-family="Arial, sans-serif" fill="var(--ok-text)">Container is killed and restarted based on restart policy</text>
</svg>

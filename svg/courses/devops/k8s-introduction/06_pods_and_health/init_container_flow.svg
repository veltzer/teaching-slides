<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="623.3333" y="40" text-anchor="middle" font-size="30.9256" font-weight="bold">Init Container Execution</text>
  <rect x="40" y="166.0869" width="200" height="151.3043" fill="var(--text-faint)" rx="6" />
  <text x="140.0002" y="254.3477" text-anchor="middle" fill="var(--bg)">Pod Created</text>
  <rect x="290" y="166.0869" width="200" height="151.3043" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="229.1304" text-anchor="middle" fill="var(--bg)" font-size="21.2613">Init Container 1</text>
  <text x="390" y="279.5651" text-anchor="middle" fill="var(--bg)" font-size="19.5227">Check DB</text>
  <rect x="539.9999" y="166.0869" width="200" height="151.3043" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="229.1304" text-anchor="middle" fill="var(--bg)" font-size="21.2613">Init Container 2</text>
  <text x="640.0001" y="279.5651" text-anchor="middle" fill="var(--bg)" font-size="19.5227">Setup Config</text>
  <rect x="790.0001" y="166.0869" width="200" height="151.3043" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890.0001" y="229.1304" text-anchor="middle" fill="var(--bg)" font-size="21.2613">Init Container 3</text>
  <text x="890.0001" y="279.5651" text-anchor="middle" fill="var(--bg)" font-size="19.5227">Load Data</text>
  <rect x="1040" y="166.0869" width="200" height="151.3043" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="229.1304" text-anchor="middle" fill="var(--bg)">Main Container</text>
  <text x="1140" y="279.5651" text-anchor="middle" fill="var(--bg)" font-size="19.5227">App Running</text>
  <path d="M 240.0001 241.739 L 281.6668 241.739" stroke="var(--text-muted)" stroke-width="0.8039" marker-end="url(#arrow)" />
  <path d="M 490 241.739 L 531.6667 241.739" stroke="var(--text-muted)" stroke-width="0.8039" marker-end="url(#arrow)" />
  <path d="M 740.0002 241.739 L 781.6668 241.739" stroke="var(--text-muted)" stroke-width="0.8039" marker-end="url(#arrow)" />
  <path d="M 990.0001 241.739 L 1031.6668 241.739" stroke="var(--text-muted)" stroke-width="0.8039" marker-end="url(#arrow)" />
  <rect x="290" y="418.2608" width="666.6667" height="201.7392" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="623.3333" y="481.3043" text-anchor="middle" font-weight="bold">Sequential Execution</text>
  <text x="623.3333" y="531.739" text-anchor="middle" font-size="23.1943">• Each init container must complete successfully</text>
  <text x="623.3333" y="582.1739" text-anchor="middle" font-size="23.1943">• Main containers start only after all init containers finish</text>
</svg>
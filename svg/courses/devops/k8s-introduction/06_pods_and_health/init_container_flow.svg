<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="396.8992" y="33.4884" text-anchor="middle" font-size="15.876" font-weight="bold">Init Container Execution</text>
  <rect x="49.6124" y="89.3023" width="119.0698" height="66.9767" fill="var(--text-faint)" rx="6" />
  <text x="109.1473" y="128.3721" text-anchor="middle" fill="var(--bg)">Pod Created</text>
  <rect x="198.4496" y="89.3023" width="119.0698" height="66.9767" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="257.9845" y="117.2093" text-anchor="middle" fill="var(--bg)" font-size="10.9147">Init Container 1</text>
  <text x="257.9845" y="139.5349" text-anchor="middle" fill="var(--bg)" font-size="10">Check DB</text>
  <rect x="347.2868" y="89.3023" width="119.0698" height="66.9767" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="406.8217" y="117.2093" text-anchor="middle" fill="var(--bg)" font-size="10.9147">Init Container 2</text>
  <text x="406.8217" y="139.5349" text-anchor="middle" fill="var(--bg)" font-size="10">Setup Config</text>
  <rect x="496.124" y="89.3023" width="119.0698" height="66.9767" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="555.6589" y="117.2093" text-anchor="middle" fill="var(--bg)" font-size="10.9147">Init Container 3</text>
  <text x="555.6589" y="139.5349" text-anchor="middle" fill="var(--bg)" font-size="10">Load Data</text>
  <rect x="644.9612" y="89.3023" width="119.0698" height="66.9767" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="704.4961" y="117.2093" text-anchor="middle" fill="var(--bg)">Main Container</text>
  <text x="704.4961" y="139.5349" text-anchor="middle" fill="var(--bg)" font-size="10">App Running</text>
  <path d="M 168.6822 122.7907 L 193.4884 122.7907" stroke="var(--text-muted)" stroke-width="1.9845" marker-end="url(#arrow)" />
  <path d="M 317.5194 122.7907 L 342.3256 122.7907" stroke="var(--text-muted)" stroke-width="1.9845" marker-end="url(#arrow)" />
  <path d="M 466.3566 122.7907 L 491.1628 122.7907" stroke="var(--text-muted)" stroke-width="1.9845" marker-end="url(#arrow)" />
  <path d="M 615.1938 122.7907 L 640 122.7907" stroke="var(--text-muted)" stroke-width="1.9845" marker-end="url(#arrow)" />
  <rect x="198.4496" y="200.9302" width="396.8992" height="89.3023" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="396.8992" y="228.8372" text-anchor="middle" font-weight="bold">Sequential Execution</text>
  <text x="396.8992" y="251.1628" text-anchor="middle" font-size="11.907">• Each init container must complete successfully</text>
  <text x="396.8992" y="273.4884" text-anchor="middle" font-size="11.907">• Main containers start only after all init containers finish</text>
</svg>
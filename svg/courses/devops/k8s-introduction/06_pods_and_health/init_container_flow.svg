<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="200" height="193.333248148159" fill="var(--text-faint)" rx="6.782329560854"/>
  <text x="140.0002" y="152.777674845692" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Pod Created</text>
  <rect x="290" y="40" width="200" height="193.333248148159" fill="url(#grad-primary)" rx="6.782329560854" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="120.555573302467" text-anchor="middle" fill="var(--bg)" font-size="24.033523915363" font-family="Arial, sans-serif">Init Container 1</text>
  <text x="390" y="184.999904166679" text-anchor="middle" fill="var(--bg)" font-size="22.06823088628" font-family="Arial, sans-serif">Check DB</text>
  <rect x="539.9999" y="40" width="200" height="193.333248148159" fill="url(#grad-primary)" rx="6.782329560854" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="120.555573302467" text-anchor="middle" fill="var(--bg)" font-size="24.033523915363" font-family="Arial, sans-serif">Init Container 2</text>
  <text x="640.0001" y="184.999904166679" text-anchor="middle" fill="var(--bg)" font-size="22.06823088628" font-family="Arial, sans-serif">Setup Config</text>
  <rect x="790.0001" y="40" width="200" height="193.333248148159" fill="url(#grad-primary)" rx="6.782329560854" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890.0001" y="120.555573302467" text-anchor="middle" fill="var(--bg)" font-size="24.033523915363" font-family="Arial, sans-serif">Init Container 3</text>
  <text x="890.0001" y="184.999904166679" text-anchor="middle" fill="var(--bg)" font-size="22.06823088628" font-family="Arial, sans-serif">Load Data</text>
  <rect x="1040" y="40" width="200" height="193.333248148159" fill="url(#grad-ok)" rx="6.782329560854" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="120.555573302467" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Main Container</text>
  <text x="1140" y="184.999904166679" text-anchor="middle" fill="var(--bg)" font-size="22.06823088628" font-family="Arial, sans-serif">App Running</text>
  <path d="M 240.0001 136.666560185198 L 281.6668 136.666560185198" stroke="var(--text-muted)" stroke-width="0.8039" marker-end="url(#arrow)"/>
  <path d="M 490 136.666560185198 L 531.6667 136.666560185198" stroke="var(--text-muted)" stroke-width="0.8039" marker-end="url(#arrow)"/>
  <path d="M 740.0002 136.666560185198 L 781.6668 136.666560185198" stroke="var(--text-muted)" stroke-width="0.8039" marker-end="url(#arrow)"/>
  <path d="M 990.0001 136.666560185198 L 1031.6668 136.666560185198" stroke="var(--text-muted)" stroke-width="0.8039" marker-end="url(#arrow)"/>
  <rect x="290" y="362.222165432106" width="666.6667" height="257.777834567894" fill="url(#grad-warn)" rx="6.782329560854" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="623.3333" y="442.777738734573" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Sequential Execution</text>
  <text x="623.3333" y="507.222069598785" text-anchor="middle" font-size="26.218564422219" font-family="Arial, sans-serif" fill="var(--warn-text)">• Each init container must complete successfully</text>
  <text x="623.3333" y="571.66665601852" text-anchor="middle" font-size="26.218564422219" font-family="Arial, sans-serif" fill="var(--warn-text)">• Main containers start only after all init containers finish</text>
</svg>

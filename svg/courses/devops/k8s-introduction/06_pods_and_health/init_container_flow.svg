<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="397.4364" y="81.9447" text-anchor="middle" font-size="15.8409" font-weight="bold">Init Container Execution</text>
  <rect x="50.9171" y="137.6353" width="118.8066" height="66.8287" fill="var(--text-faint)" rx="6" />
  <text x="110.3205" y="176.6187" text-anchor="middle" fill="var(--bg)">Pod Created</text>
  <rect x="199.4254" y="137.6353" width="118.8066" height="66.8287" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="1.2729" />
  <text x="258.8287" y="165.4806" text-anchor="middle" fill="var(--bg)" font-size="10.8906">Init Container 1</text>
  <text x="258.8287" y="187.7568" text-anchor="middle" fill="var(--bg)" font-size="10">Check DB</text>
  <rect x="347.9336" y="137.6353" width="118.8066" height="66.8287" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="1.2729" />
  <text x="407.337" y="165.4806" text-anchor="middle" fill="var(--bg)" font-size="10.8906">Init Container 2</text>
  <text x="407.337" y="187.7568" text-anchor="middle" fill="var(--bg)" font-size="10">Setup Config</text>
  <rect x="496.442" y="137.6353" width="118.8066" height="66.8287" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="1.2729" />
  <text x="555.8453" y="165.4806" text-anchor="middle" fill="var(--bg)" font-size="10.8906">Init Container 3</text>
  <text x="555.8453" y="187.7568" text-anchor="middle" fill="var(--bg)" font-size="10">Load Data</text>
  <rect x="644.9502" y="137.6353" width="118.8066" height="66.8287" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="1.2729" />
  <text x="704.3535" y="165.4806" text-anchor="middle" fill="var(--bg)">Main Container</text>
  <text x="704.3535" y="187.7568" text-anchor="middle" fill="var(--bg)" font-size="10">App Running</text>
  <path d="M 169.7238 171.0496 L 194.4752 171.0496" stroke="var(--text-muted)" stroke-width="0.8039" marker-end="url(#arrow)" />
  <path d="M 318.232 171.0496 L 342.9834 171.0496" stroke="var(--text-muted)" stroke-width="0.8039" marker-end="url(#arrow)" />
  <path d="M 466.7404 171.0496 L 491.4917 171.0496" stroke="var(--text-muted)" stroke-width="0.8039" marker-end="url(#arrow)" />
  <path d="M 615.2486 171.0496 L 640 171.0496" stroke="var(--text-muted)" stroke-width="0.8039" marker-end="url(#arrow)" />
  <rect x="199.4254" y="249.0165" width="396.0221" height="89.105" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="1.2729" />
  <text x="397.4364" y="276.8618" text-anchor="middle" font-weight="bold">Sequential Execution</text>
  <text x="397.4364" y="299.138" text-anchor="middle" font-size="11.8807">• Each init container must complete successfully</text>
  <text x="397.4364" y="321.4143" text-anchor="middle" font-size="11.8807">• Main containers start only after all init containers finish</text>
</svg>
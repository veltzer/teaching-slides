<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="624.4444" y="128.7501" text-anchor="middle" font-size="24.8889" font-weight="bold">Init Container Execution</text>
  <rect x="80" y="216.25" width="186.6667" height="104.9999" fill="var(--text-faint)" rx="9.4063" />
  <text x="173.3334" y="277.5" text-anchor="middle" fill="var(--bg)">Pod Created</text>
  <rect x="313.3333" y="216.25" width="186.6667" height="104.9999" fill="var(--primary-fill)" rx="9.4063" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="406.6667" y="260" text-anchor="middle" fill="var(--bg)" font-size="17.1111">Init Container 1</text>
  <text x="406.6667" y="295" text-anchor="middle" fill="var(--bg)" font-size="15.6771">Check DB</text>
  <rect x="546.6666" y="216.25" width="186.6667" height="104.9999" fill="var(--primary-fill)" rx="9.4063" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="260" text-anchor="middle" fill="var(--bg)" font-size="17.1111">Init Container 2</text>
  <text x="640" y="295" text-anchor="middle" fill="var(--bg)" font-size="15.6771">Setup Config</text>
  <rect x="780" y="216.25" width="186.6667" height="104.9999" fill="var(--primary-fill)" rx="9.4063" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="873.3333" y="260" text-anchor="middle" fill="var(--bg)" font-size="17.1111">Init Container 3</text>
  <text x="873.3333" y="295" text-anchor="middle" fill="var(--bg)" font-size="15.6771">Load Data</text>
  <rect x="1013.3333" y="216.25" width="186.6667" height="104.9999" fill="var(--ok-fill)" rx="9.4063" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1106.6666" y="260" text-anchor="middle" fill="var(--bg)">Main Container</text>
  <text x="1106.6666" y="295" text-anchor="middle" fill="var(--bg)" font-size="15.6771">App Running</text>
  <path d="M 266.6667 268.75 L 305.5556 268.75" stroke="var(--text-muted)" stroke-width="1.9845" marker-end="url(#arrow)" />
  <path d="M 500 268.75 L 538.8889 268.75" stroke="var(--text-muted)" stroke-width="1.9845" marker-end="url(#arrow)" />
  <path d="M 733.3334 268.75 L 772.2222 268.75" stroke="var(--text-muted)" stroke-width="1.9845" marker-end="url(#arrow)" />
  <path d="M 966.6667 268.75 L 1005.5556 268.75" stroke="var(--text-muted)" stroke-width="1.9845" marker-end="url(#arrow)" />
  <rect x="313.3333" y="391.25" width="622.2222" height="140" fill="var(--warn-fill)" rx="9.4063" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="624.4444" y="435" text-anchor="middle" font-weight="bold">Sequential Execution</text>
  <text x="624.4444" y="470" text-anchor="middle" font-size="18.6667">• Each init container must complete successfully</text>
  <text x="624.4444" y="505.0001" text-anchor="middle" font-size="18.6667">• Main containers start only after all init containers finish</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <rect x="60" y="60" width="280" height="540" rx="6" fill="var(--text-faint)" stroke="var(--border)" stroke-width="2"/>
  <text x="200" y="110" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--bg)">Stage 1</text>
  <text x="200" y="150" text-anchor="middle" font-size="22" fill="var(--bg)">Container Start</text>
  <text x="200" y="250" text-anchor="middle" font-size="20" fill="var(--bg)">initialDelaySeconds</text>
  <text x="200" y="290" text-anchor="middle" font-size="48" font-weight="bold" fill="var(--bg)">30s</text>
  <text x="200" y="360" text-anchor="middle" font-size="18" fill="var(--bg)">wait before the first</text>
  <text x="200" y="385" text-anchor="middle" font-size="18" fill="var(--bg)">probe is executed</text>
  <text x="200" y="470" text-anchor="middle" font-size="16" fill="var(--bg)">app gets time</text>
  <text x="200" y="492" text-anchor="middle" font-size="16" fill="var(--bg)">to warm up</text>
  <text x="200" y="560" text-anchor="middle" font-size="14" fill="var(--bg)">no probes run yet</text>

  <rect x="360" y="60" width="420" height="540" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="570" y="110" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-text)">Stage 2</text>
  <text x="570" y="150" text-anchor="middle" font-size="22" fill="var(--primary-text)">Periodic Checks</text>

  <circle cx="430" cy="230" r="22" fill="var(--primary-text)"/>
  <text x="430" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-accent)">1</text>
  <circle cx="530" cy="230" r="22" fill="var(--primary-text)"/>
  <text x="530" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-accent)">2</text>
  <circle cx="630" cy="230" r="22" fill="var(--primary-text)"/>
  <text x="630" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-accent)">3</text>
  <circle cx="730" cy="230" r="22" fill="var(--primary-text)"/>
  <text x="730" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-accent)">4</text>

  <line x1="452" y1="230" x2="508" y2="230" stroke="var(--primary-text)" stroke-width="3"/>
  <line x1="552" y1="230" x2="608" y2="230" stroke="var(--primary-text)" stroke-width="3"/>
  <line x1="652" y1="230" x2="708" y2="230" stroke="var(--primary-text)" stroke-width="3"/>

  <text x="570" y="320" text-anchor="middle" font-size="20" fill="var(--primary-text)">periodSeconds = 10</text>
  <text x="570" y="360" text-anchor="middle" font-size="18" fill="var(--primary-text)">probe runs every N seconds</text>
  <text x="570" y="420" text-anchor="middle" font-size="18" fill="var(--primary-text)">timeoutSeconds = 1</text>
  <text x="570" y="450" text-anchor="middle" font-size="16" fill="var(--primary-text)">probe fails if no response</text>
  <text x="570" y="520" text-anchor="middle" font-size="18" fill="var(--primary-text)">successThreshold = 1</text>
  <text x="570" y="560" text-anchor="middle" font-size="14" fill="var(--primary-text)">one success resets failure count</text>

  <rect x="800" y="60" width="220" height="540" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="910" y="110" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--warn-text)">Stage 3</text>
  <text x="910" y="150" text-anchor="middle" font-size="22" fill="var(--warn-text)">Failures</text>
  <text x="910" y="230" text-anchor="middle" font-size="18" fill="var(--warn-text)">Fail 1</text>
  <text x="910" y="280" text-anchor="middle" font-size="18" fill="var(--warn-text)">Fail 2</text>
  <text x="910" y="330" text-anchor="middle" font-size="18" fill="var(--warn-text)">Fail 3</text>
  <text x="910" y="420" text-anchor="middle" font-size="20" fill="var(--warn-text)">failureThreshold</text>
  <text x="910" y="470" text-anchor="middle" font-size="48" font-weight="bold" fill="var(--warn-text)">3</text>
  <text x="910" y="560" text-anchor="middle" font-size="15" fill="var(--warn-text)">consecutive failures</text>

  <rect x="1040" y="60" width="180" height="540" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1130" y="110" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--danger-text)">Stage 4</text>
  <text x="1130" y="150" text-anchor="middle" font-size="22" fill="var(--danger-text)">Action</text>
  <text x="1130" y="240" text-anchor="middle" font-size="18" fill="var(--danger-text)">liveness:</text>
  <text x="1130" y="270" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--danger-text)">restart</text>
  <text x="1130" y="360" text-anchor="middle" font-size="18" fill="var(--danger-text)">readiness:</text>
  <text x="1130" y="390" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--danger-text)">drop from</text>
  <text x="1130" y="420" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--danger-text)">endpoints</text>
  <text x="1130" y="520" text-anchor="middle" font-size="15" fill="var(--danger-text)">kubelet drives</text>
  <text x="1130" y="545" text-anchor="middle" font-size="15" fill="var(--danger-text)">the decision</text>

</svg>

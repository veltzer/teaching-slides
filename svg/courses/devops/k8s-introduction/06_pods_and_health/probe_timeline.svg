<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Probe Execution Timeline</text>
  <line x1="160" y1="180" x2="1120" y2="180" stroke="#333" stroke-width="3.2" />
  <text x="160" y="162" text-anchor="start" font-size="19.2">Container Start</text>
  <circle cx="160" cy="180" r="8" fill="#333" />
  <rect x="160" y="216" width="240" height="72" fill="#888" rx="4.8" />
  <text x="280" y="261" text-anchor="middle" fill="white" font-size="17.6">Initial Delay (30s)</text>
  <circle cx="400" cy="180" r="8" fill="#4285f4" />
  <text x="400" y="153" text-anchor="middle" font-size="16">Probe 1</text>
  <rect x="400" y="216" width="96" height="54" fill="#4285f4" rx="4.8" />
  <text x="448" y="252" text-anchor="middle" fill="white" font-size="16">Period</text>
  <circle cx="496" cy="180" r="8" fill="#4285f4" />
  <text x="496" y="153" text-anchor="middle" font-size="16">Probe 2</text>
  <rect x="496" y="216" width="96" height="54" fill="#4285f4" rx="4.8" />
  <text x="544" y="252" text-anchor="middle" fill="white" font-size="16">Period</text>
  <circle cx="592" cy="180" r="8" fill="#ea4335" />
  <text x="592" y="153" text-anchor="middle" font-size="16">Fail 1</text>
  <circle cx="688" cy="180" r="8" fill="#ea4335" />
  <text x="688" y="153" text-anchor="middle" font-size="16">Fail 2</text>
  <circle cx="784" cy="180" r="8" fill="#ea4335" />
  <text x="784" y="153" text-anchor="middle" font-size="16">Fail 3</text>
  <rect x="784" y="216" width="160" height="72" fill="#ea4335" rx="4.8" />
  <text x="864" y="261" text-anchor="middle" fill="white" font-size="17.6">Action Taken</text>
  <text x="640" y="360" text-anchor="middle" font-size="19.2">Timeline: Initial Delay → Periodic Checks → Failure Threshold → Action</text>
</svg>
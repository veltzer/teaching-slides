<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="644.9587" y="140.3306" text-anchor="middle" font-size="31.7355" font-weight="bold">Probe Execution Timeline</text>
  <line x1="49.9174" y1="296.5289" x2="1240" y2="296.5289" stroke="var(--text)" stroke-width="2" />
  <text x="49.9174" y="274.2149" text-anchor="start" font-size="23.8017">Container Start</text>
  <circle cx="49.9174" cy="296.5289" r="9.9174" fill="var(--text)" />
  <rect x="49.9174" y="341.157" width="297.5207" height="89.2562" fill="var(--text-faint)" rx="6" />
  <text x="198.6777" y="396.9421" text-anchor="middle" fill="var(--bg)" font-size="21.8181">Initial Delay (30s)</text>
  <circle cx="347.438" cy="296.5289" r="9.9174" fill="var(--primary-fill)" />
  <text x="347.438" y="263.0579" text-anchor="middle" font-size="19.8347">Probe 1</text>
  <rect x="347.438" y="341.157" width="119.0083" height="66.9421" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="406.9421" y="385.7851" text-anchor="middle" fill="var(--bg)" font-size="19.8347">Period</text>
  <circle cx="466.4463" cy="296.5289" r="9.9174" fill="var(--primary-fill)" />
  <text x="466.4463" y="263.0579" text-anchor="middle" font-size="19.8347">Probe 2</text>
  <rect x="466.4463" y="341.157" width="119.0083" height="66.9421" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="525.9504" y="385.7851" text-anchor="middle" fill="var(--bg)" font-size="19.8347">Period</text>
  <circle cx="585.4545" cy="296.5289" r="9.9174" fill="var(--danger-fill)" />
  <text x="585.4545" y="263.0579" text-anchor="middle" font-size="19.8347">Fail 1</text>
  <circle cx="704.4628" cy="296.5289" r="9.9174" fill="var(--danger-fill)" />
  <text x="704.4628" y="263.0579" text-anchor="middle" font-size="19.8347">Fail 2</text>
  <circle cx="823.4711" cy="296.5289" r="9.9174" fill="var(--danger-fill)" />
  <text x="823.4711" y="263.0579" text-anchor="middle" font-size="19.8347">Fail 3</text>
  <rect x="823.4711" y="341.157" width="198.3471" height="89.2562" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="922.6447" y="396.9421" text-anchor="middle" fill="var(--bg)" font-size="21.8181">Action Taken</text>
  <text x="644.9587" y="519.6694" text-anchor="middle" font-size="23.8017">Timeline: Initial Delay → Periodic Checks → Failure Threshold → Action</text>
</svg>
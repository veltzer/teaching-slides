<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="644.9565" y="140.5" text-anchor="middle" font-size="31.7214" font-weight="bold">Probe Execution Timeline</text>
  <line x1="49.913" y1="296.5588" x2="1240" y2="296.5588" stroke="var(--text)" stroke-width="2" />
  <text x="49.913" y="274.2647" text-anchor="start" font-size="23.7911">Container Start</text>
  <circle cx="49.913" cy="296.5588" r="9.913" fill="var(--text)" />
  <rect x="49.913" y="341.147" width="297.5218" height="89.1765" fill="var(--text-faint)" rx="5.9973" />
  <text x="198.6739" y="396.8823" text-anchor="middle" fill="var(--bg)" font-size="21.8084">Initial Delay (30s)</text>
  <circle cx="347.4347" cy="296.5588" r="9.913" fill="var(--primary-fill)" />
  <text x="347.4347" y="263.1177" text-anchor="middle" font-size="19.8258">Probe 1</text>
  <rect x="347.4347" y="341.147" width="119.0087" height="66.8823" fill="var(--primary-fill)" rx="5.9973" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="406.939" y="385.7353" text-anchor="middle" fill="var(--bg)" font-size="19.8258">Period</text>
  <circle cx="466.4435" cy="296.5588" r="9.913" fill="var(--primary-fill)" />
  <text x="466.4435" y="263.1177" text-anchor="middle" font-size="19.8258">Probe 2</text>
  <rect x="466.4435" y="341.147" width="119.0087" height="66.8823" fill="var(--primary-fill)" rx="5.9973" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="525.9478" y="385.7353" text-anchor="middle" fill="var(--bg)" font-size="19.8258">Period</text>
  <circle cx="585.4521" cy="296.5588" r="9.913" fill="var(--danger-fill)" />
  <text x="585.4521" y="263.1177" text-anchor="middle" font-size="19.8258">Fail 1</text>
  <circle cx="704.4608" cy="296.5588" r="9.913" fill="var(--danger-fill)" />
  <text x="704.4608" y="263.1177" text-anchor="middle" font-size="19.8258">Fail 2</text>
  <circle cx="823.4696" cy="296.5588" r="9.913" fill="var(--danger-fill)" />
  <text x="823.4696" y="263.1177" text-anchor="middle" font-size="19.8258">Fail 3</text>
  <rect x="823.4696" y="341.147" width="198.3478" height="89.1765" fill="var(--danger-fill)" rx="5.9973" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="922.6435" y="396.8823" text-anchor="middle" fill="var(--bg)" font-size="21.8084">Action Taken</text>
  <text x="644.9565" y="519.5" text-anchor="middle" font-size="23.7911">Timeline: Initial Delay → Periodic Checks → Failure Threshold → Action</text>
</svg>
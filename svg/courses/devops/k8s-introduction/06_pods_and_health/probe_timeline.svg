<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="289.655172" height="580" rx="6.324555" fill="var(--text-faint)" stroke="var(--border)" stroke-width="2"/>
  <text x="184.827586" y="93.703704" text-anchor="middle" font-size="27.406406" font-weight="bold" fill="var(--bg)">Stage 1</text>
  <text x="184.827586" y="136.666667" text-anchor="middle" font-size="23.190036" fill="var(--bg)">Container Start</text>
  <text x="184.827586" y="244.074074" text-anchor="middle" font-size="21.081851" fill="var(--bg)">initialDelaySeconds</text>
  <text x="184.827586" y="287.037037" text-anchor="middle" font-size="50.596443" font-weight="bold" fill="var(--bg)">30s</text>
  <text x="184.827586" y="362.222222" text-anchor="middle" font-size="18.973666" fill="var(--bg)">wait before the first</text>
  <text x="184.827586" y="389.074074" text-anchor="middle" font-size="18.973666" fill="var(--bg)">probe is executed</text>
  <text x="184.827586" y="480.37037" text-anchor="middle" font-size="16.865481" fill="var(--bg)">app gets time</text>
  <text x="184.827586" y="504" text-anchor="middle" font-size="16.865481" fill="var(--bg)">to warm up</text>
  <text x="184.827586" y="577.037037" text-anchor="middle" font-size="14.757296" fill="var(--bg)">no probes run yet</text>

  <rect x="350.344828" y="40" width="434.482759" height="580" rx="6.324555" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="567.586207" y="93.703704" text-anchor="middle" font-size="27.406406" font-weight="bold" fill="var(--primary-text)">Stage 2</text>
  <text x="567.586207" y="136.666667" text-anchor="middle" font-size="23.190036" fill="var(--primary-text)">Periodic Checks</text>

  <circle cx="422.758621" cy="222.592593" r="23.190036" fill="var(--primary-text)"/>
  <text x="422.758621" y="231.185185" text-anchor="middle" font-size="18.973666" font-weight="bold" fill="var(--primary-accent)">1</text>
  <circle cx="526.206897" cy="222.592593" r="23.190036" fill="var(--primary-text)"/>
  <text x="526.206897" y="231.185185" text-anchor="middle" font-size="18.973666" font-weight="bold" fill="var(--primary-accent)">2</text>
  <circle cx="629.655172" cy="222.592593" r="23.190036" fill="var(--primary-text)"/>
  <text x="629.655172" y="231.185185" text-anchor="middle" font-size="18.973666" font-weight="bold" fill="var(--primary-accent)">3</text>
  <circle cx="733.103448" cy="222.592593" r="23.190036" fill="var(--primary-text)"/>
  <text x="733.103448" y="231.185185" text-anchor="middle" font-size="18.973666" font-weight="bold" fill="var(--primary-accent)">4</text>

  <line x1="445.517241" y1="222.592593" x2="503.448276" y2="222.592593" stroke="var(--primary-text)" stroke-width="3"/>
  <line x1="548.965517" y1="222.592593" x2="606.896552" y2="222.592593" stroke="var(--primary-text)" stroke-width="3"/>
  <line x1="652.413793" y1="222.592593" x2="710.344828" y2="222.592593" stroke="var(--primary-text)" stroke-width="3"/>

  <text x="567.586207" y="319.259259" text-anchor="middle" font-size="21.081851" fill="var(--primary-text)">periodSeconds = 10</text>
  <text x="567.586207" y="362.222222" text-anchor="middle" font-size="18.973666" fill="var(--primary-text)">probe runs every N seconds</text>
  <text x="567.586207" y="426.666667" text-anchor="middle" font-size="18.973666" fill="var(--primary-text)">timeoutSeconds = 1</text>
  <text x="567.586207" y="458.888889" text-anchor="middle" font-size="16.865481" fill="var(--primary-text)">probe fails if no response</text>
  <text x="567.586207" y="534.074074" text-anchor="middle" font-size="18.973666" fill="var(--primary-text)">successThreshold = 1</text>
  <text x="567.586207" y="577.037037" text-anchor="middle" font-size="14.757296" fill="var(--primary-text)">one success resets failure count</text>

  <rect x="805.517241" y="40" width="227.586207" height="580" rx="6.324555" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="919.310345" y="93.703704" text-anchor="middle" font-size="27.406406" font-weight="bold" fill="var(--warn-text)">Stage 3</text>
  <text x="919.310345" y="136.666667" text-anchor="middle" font-size="23.190036" fill="var(--warn-text)">Failures</text>
  <text x="919.310345" y="222.592593" text-anchor="middle" font-size="18.973666" fill="var(--warn-text)">Fail 1</text>
  <text x="919.310345" y="276.296296" text-anchor="middle" font-size="18.973666" fill="var(--warn-text)">Fail 2</text>
  <text x="919.310345" y="330" text-anchor="middle" font-size="18.973666" fill="var(--warn-text)">Fail 3</text>
  <text x="919.310345" y="426.666667" text-anchor="middle" font-size="21.081851" fill="var(--warn-text)">failureThreshold</text>
  <text x="919.310345" y="480.37037" text-anchor="middle" font-size="50.596443" font-weight="bold" fill="var(--warn-text)">3</text>
  <text x="919.310345" y="577.037037" text-anchor="middle" font-size="15.811388" fill="var(--warn-text)">consecutive failures</text>

  <rect x="1053.793103" y="40" width="186.206897" height="580" rx="6.324555" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1146.896552" y="93.703704" text-anchor="middle" font-size="27.406406" font-weight="bold" fill="var(--danger-text)">Stage 4</text>
  <text x="1146.896552" y="136.666667" text-anchor="middle" font-size="23.190036" fill="var(--danger-text)">Action</text>
  <text x="1146.896552" y="233.333333" text-anchor="middle" font-size="18.973666" fill="var(--danger-text)">liveness:</text>
  <text x="1146.896552" y="265.555556" text-anchor="middle" font-size="21.081851" font-weight="bold" fill="var(--danger-text)">restart</text>
  <text x="1146.896552" y="362.222222" text-anchor="middle" font-size="18.973666" fill="var(--danger-text)">readiness:</text>
  <text x="1146.896552" y="394.444444" text-anchor="middle" font-size="21.081851" font-weight="bold" fill="var(--danger-text)">drop from</text>
  <text x="1146.896552" y="426.666667" text-anchor="middle" font-size="21.081851" font-weight="bold" fill="var(--danger-text)">endpoints</text>
  <text x="1146.896552" y="534.074074" text-anchor="middle" font-size="15.811388" fill="var(--danger-text)">kubelet drives</text>
  <text x="1146.896552" y="560.925926" text-anchor="middle" font-size="15.811388" fill="var(--danger-text)">the decision</text>

</svg>

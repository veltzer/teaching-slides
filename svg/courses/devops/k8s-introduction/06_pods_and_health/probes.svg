<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.854226236055" font-weight="bold" fill="var(--text)">Pod Health Probes</text>

  <rect x="40" y="86.194690265487" width="382.758620689655" height="266.902654867257" rx="10.305080798591" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--info-text)">startup probe</text>
  <text x="60.689655172414" y="158.053097345133" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--info-text)">Slow boot apps</text>
  <text x="60.689655172414" y="188.849557522124" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">Disables others</text>
  <text x="60.689655172414" y="214.513274336283" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">until passing</text>
  <text x="60.689655172414" y="255.575221238938" font-family="Arial, sans-serif" font-size="13.396605038168" font-weight="bold" fill="var(--info-text)">Use when</text>
  <text x="60.689655172414" y="281.238938053097" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">JVM, Rails, .NET</text>
  <text x="60.689655172414" y="327.433628318584" font-family="Arial, sans-serif" font-size="12.366096958309" font-style="italic" fill="var(--info-text)">Long initialization</text>

  <rect x="448.620689655172" y="86.194690265487" width="382.758620689655" height="266.902654867257" rx="10.305080798591" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--ok-text)">readiness probe</text>
  <text x="469.310344827586" y="158.053097345133" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--ok-text)">"Send me traffic?"</text>
  <text x="469.310344827586" y="188.849557522124" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">Removes from Service</text>
  <text x="469.310344827586" y="214.513274336283" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">if failing</text>
  <text x="469.310344827586" y="255.575221238938" font-family="Arial, sans-serif" font-size="13.396605038168" font-weight="bold" fill="var(--ok-text)">Use for</text>
  <text x="469.310344827586" y="281.238938053097" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">DB warmup, cache fill</text>
  <text x="469.310344827586" y="327.433628318584" font-family="Arial, sans-serif" font-size="12.366096958309" font-style="italic" fill="var(--ok-text)">Pod stays alive</text>

  <rect x="857.241379310345" y="86.194690265487" width="382.758620689655" height="266.902654867257" rx="10.305080798591" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--danger-text)">liveness probe</text>
  <text x="877.931034482759" y="158.053097345133" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--danger-text)">"Are you alive?"</text>
  <text x="877.931034482759" y="188.849557522124" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--danger-text)">Failing = restart pod</text>
  <text x="877.931034482759" y="255.575221238938" font-family="Arial, sans-serif" font-size="13.396605038168" font-weight="bold" fill="var(--danger-text)">Careful</text>
  <text x="877.931034482759" y="281.238938053097" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--danger-text)">Restart loops if too tight</text>
  <text x="877.931034482759" y="327.433628318584" font-family="Arial, sans-serif" font-size="12.366096958309" font-style="italic" fill="var(--danger-text)">Detects deadlocks</text>

  <rect x="40" y="394.159292035398" width="1200" height="225.840707964602" rx="10.305080798591" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="430.088495575221" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--text)">Probe types</text>
  <text x="60.689655172414" y="466.017699115044" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">httpGet -- 2xx/3xx = pass</text>
  <text x="60.689655172414" y="491.681415929204" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">tcpSocket -- port open</text>
  <text x="60.689655172414" y="517.345132743363" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">exec -- exit code 0</text>
  <text x="60.689655172414" y="543.008849557522" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">grpc (1.24+) -- standard health protocol</text>
  <text x="60.689655172414" y="584.070796460177" font-family="Arial, sans-serif" font-size="13.396605038168" font-style="italic" fill="var(--text-muted)">Tune initialDelay, period, threshold per probe</text>
</svg>

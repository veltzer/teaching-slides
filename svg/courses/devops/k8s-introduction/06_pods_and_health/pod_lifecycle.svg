<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="96.25" y="120.5556" width="168.75" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="180.625" y="152.7777" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--text-muted)">Pending</text>
  <text x="180.625" y="170.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">accepted by API server</text>
  <text x="180.625" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">waiting to be scheduled</text>
  <line x1="265" y1="160.8333" x2="358.75" y2="160.8333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="311.875" y="152.7777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">scheduled</text>
  <rect x="358.75" y="120.5556" width="168.75" height="80.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="443.125" y="152.7777" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">Running</text>
  <text x="443.125" y="170.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">bound to node</text>
  <text x="443.125" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">≥1 container running</text>
  <line x1="527.5" y1="144.7223" x2="621.25" y2="144.7223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="574.375" y="136.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">all containers</text>
  <text x="574.375" y="147.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">exit 0</text>
  <line x1="527.5" y1="185" x2="621.25" y2="217.2223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="572.5" y="213.1944" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">container exit ≠0</text>
  <rect x="621.25" y="104.4444" width="168.75" height="80.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="705.625" y="135.0556" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">Succeeded</text>
  <text x="705.625" y="152.7777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--ok-accent)">all containers</text>
  <text x="705.625" y="167.2777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--ok-accent)">terminated exit 0</text>
  <text x="705.625" y="180.1667" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--ok-accent)">(terminal state)</text>
  <rect x="621.25" y="201.1111" width="168.75" height="80.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="705.625" y="231.7223" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--danger-accent)">Failed</text>
  <text x="705.625" y="249.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">≥1 container</text>
  <text x="705.625" y="263.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">terminated with error</text>
  <rect x="358.75" y="233.3333" width="168.75" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="443.125" y="259.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.6425" font-weight="bold" fill="var(--warn-accent)">Unknown</text>
  <text x="443.125" y="277.6389" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--warn-accent)">node communication lost</text>
  <line x1="443.125" y1="201.1111" x2="443.125" y2="233.3333" stroke="var(--warn-border)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <rect x="865" y="88.3333" width="337.5" height="249.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="865" y="88.3333" width="337.5" height="37.0556" rx="6" fill="var(--text-muted)" />
  <rect x="865" y="115.7223" width="337.5" height="9.6667" fill="var(--text-muted)" rx="6"/>
  <text x="1033.75" y="114.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.6425" font-weight="bold" fill="var(--bg)">Container States</text>
  <rect x="883.75" y="136.6667" width="290.625" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1029.0625" y="156.8056" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text-muted)">Waiting</text>
  <text x="1029.0625" y="175.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">pulling image, initializing</text>
  <line x1="1033.75" y1="185" x2="1033.75" y2="201.1111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="883.75" y="201.1111" width="290.625" height="48.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1029.0625" y="221.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">Running</text>
  <text x="1029.0625" y="239.7777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">process executing</text>
  <line x1="1033.75" y1="249.4444" x2="1033.75" y2="265.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="883.75" y="265.5556" width="290.625" height="54.7777" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1029.0625" y="288.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--danger-accent)">Terminated</text>
  <text x="1029.0625" y="304.2223" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">exit code 0 (ok) or non-0 (err)</text>
  <text x="1029.0625" y="317.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">reason, message, startedAt, finishedAt</text>
  <rect x="77.5" y="346.1111" width="731.25" height="96.6667" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="86.875" y="367.0556" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--info-accent)">Restart Policy (restartPolicy on Pod spec)</text>
  <text x="115" y="389.6111" font-family="Arial,sans-serif" font-size="12.1663" fill="var(--text-muted)">Always (default)   — restart container on any exit (good for services)</text>
  <text x="115" y="408.9444" font-family="Arial,sans-serif" font-size="12.1663" fill="var(--text-muted)">OnFailure            — restart only on non-zero exit (good for jobs)</text>
  <text x="115" y="428.2777" font-family="Arial,sans-serif" font-size="12.1663" fill="var(--text-muted)">Never                   — never restart (one-shot tasks)</text>
  <rect x="865" y="362.2223" width="337.5" height="161.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1033.75" y="382.3611" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--ok-accent)">Health Probes</text>
  <text x="883.75" y="404.1111" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--ok-accent)">startupProbe   — has container started? (blocks others)</text>
  <text x="883.75" y="423.4444" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--ok-accent)">livenessProbe  — is container alive? (restart if fails)</text>
  <text x="883.75" y="442.7777" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--ok-accent)">readinessProbe — ready for traffic? (remove from svc)</text>
  <text x="883.75" y="463.7223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Methods: httpGet / tcpSocket / exec</text>
  <text x="883.75" y="481.4444" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Params: initialDelaySeconds, periodSeconds, failureThreshold</text>
  <text x="883.75" y="499.1667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">successThreshold, timeoutSeconds</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="53.3333" y="88.8889" width="160" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="133.3333" y="124.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--text-muted)">Pending</text>
  <text x="133.3333" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">accepted by API server</text>
  <text x="133.3333" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">waiting to be scheduled</text>
  <line x1="213.3333" y1="133.3333" x2="302.2222" y2="133.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="257.7778" y="124.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">scheduled</text>
  <rect x="302.2222" y="88.8889" width="160" height="88.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="382.2222" y="124.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">Running</text>
  <text x="382.2222" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--primary-accent)">bound to node</text>
  <text x="382.2222" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--primary-accent)">≥1 container running</text>
  <line x1="462.2222" y1="115.5556" x2="551.1111" y2="115.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="506.6667" y="106.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">all containers</text>
  <text x="506.6667" y="119.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">exit 0</text>
  <line x1="462.2222" y1="160" x2="551.1111" y2="195.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="504.8889" y="191.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">container exit ≠0</text>
  <rect x="551.1111" y="71.1111" width="160" height="88.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="631.1111" y="104.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">Succeeded</text>
  <text x="631.1111" y="124.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--ok-accent)">all containers</text>
  <text x="631.1111" y="140.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--ok-accent)">terminated exit 0</text>
  <text x="631.1111" y="154.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--ok-accent)">(terminal state)</text>
  <rect x="551.1111" y="177.7778" width="160" height="88.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="631.1111" y="211.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">Failed</text>
  <text x="631.1111" y="231.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-accent)">≥1 container</text>
  <text x="631.1111" y="247.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-accent)">terminated with error</text>
  <rect x="302.2222" y="213.3333" width="160" height="71.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="382.2222" y="241.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)">Unknown</text>
  <text x="382.2222" y="262.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--warn-accent)">node communication lost</text>
  <line x1="382.2222" y1="177.7778" x2="382.2222" y2="213.3333" stroke="var(--warn-border)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <rect x="782.2222" y="53.3333" width="320" height="275.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="782.2222" y="53.3333" width="320" height="40.8889" rx="6" fill="var(--text-muted)" />
  <rect x="782.2222" y="83.5556" width="320" height="10.6667" fill="var(--text-muted)" rx="6"/>
  <text x="942.2222" y="81.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Container States</text>
  <rect x="800" y="106.6667" width="275.5556" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="937.7778" y="128.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text-muted)">Waiting</text>
  <text x="937.7778" y="149.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">pulling image, initializing</text>
  <line x1="942.2222" y1="160" x2="942.2222" y2="177.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="800" y="177.7778" width="275.5556" height="53.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="937.7778" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">Running</text>
  <text x="937.7778" y="220.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--primary-accent)">process executing</text>
  <line x1="942.2222" y1="231.1111" x2="942.2222" y2="248.8889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="800" y="248.8889" width="275.5556" height="60.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="937.7778" y="273.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--danger-accent)">Terminated</text>
  <text x="937.7778" y="291.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-accent)">exit code 0 (ok) or non-0 (err)</text>
  <text x="937.7778" y="305.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--danger-accent)">reason, message, startedAt, finishedAt</text>
  <rect x="35.5556" y="337.7778" width="693.3333" height="106.6667" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="44.4444" y="360.8889" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--info-accent)">Restart Policy (restartPolicy on Pod spec)</text>
  <text x="71.1111" y="385.7778" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text-muted)">Always (default)   — restart container on any exit (good for services)</text>
  <text x="71.1111" y="407.1111" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text-muted)">OnFailure            — restart only on non-zero exit (good for jobs)</text>
  <text x="71.1111" y="428.4444" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text-muted)">Never                   — never restart (one-shot tasks)</text>
  <rect x="782.2222" y="355.5556" width="320" height="177.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="942.2222" y="377.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="var(--ok-accent)">Health Probes</text>
  <text x="800" y="401.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--ok-accent)">startupProbe   — has container started? (blocks others)</text>
  <text x="800" y="423.1111" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--ok-accent)">livenessProbe  — is container alive? (restart if fails)</text>
  <text x="800" y="444.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--ok-accent)">readinessProbe — ready for traffic? (remove from svc)</text>
  <text x="800" y="467.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Methods: httpGet / tcpSocket / exec</text>
  <text x="800" y="487.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">Params: initialDelaySeconds, periodSeconds, failureThreshold</text>
  <text x="800" y="506.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">successThreshold, timeoutSeconds</text>
</svg>
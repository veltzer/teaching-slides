  <ns0:text x="937.7778" y="291.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="#c2185b">exit code 0 (ok) or non-0 (err)</ns0:text>
  <ns0:text x="937.7778" y="305.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#c2185b">reason, message, startedAt, finishedAt</ns0:text>
  <ns0:rect x="35.5556" y="337.7778" width="693.3333" height="106.6667" rx="10.6667" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="44.4444" y="360.8889" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="#4527a0">Restart Policy (restartPolicy on Pod spec)</ns0:text>
  <ns0:text x="71.1111" y="385.7778" font-family="Arial,sans-serif" font-size="12.4444" fill="#555">Always (default)   — restart container on any exit (good for services)</ns0:text>
  <ns0:text x="71.1111" y="407.1111" font-family="Arial,sans-serif" font-size="12.4444" fill="#555">OnFailure            — restart only on non-zero exit (good for jobs)</ns0:text>
  <ns0:text x="71.1111" y="428.4444" font-family="Arial,sans-serif" font-size="12.4444" fill="#555">Never                   — never restart (one-shot tasks)</ns0:text>
  <ns0:rect x="782.2222" y="355.5556" width="320" height="177.7778" rx="10.6667" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="942.2222" y="377.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.2222" font-weight="bold" fill="#2e7d32">Health Probes</ns0:text>
  <ns0:text x="800" y="401.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="#1b5e20">startupProbe   — has container started? (blocks others)</ns0:text>
  <ns0:text x="800" y="423.1111" font-family="Arial,sans-serif" font-size="11.5556" fill="#1b5e20">livenessProbe  — is container alive? (restart if fails)</ns0:text>
  <ns0:text x="800" y="444.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="#1b5e20">readinessProbe — ready for traffic? (remove from svc)</ns0:text>
  <ns0:text x="800" y="467.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Methods: httpGet / tcpSocket / exec</ns0:text>
  <ns0:text x="800" y="487.1111" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Params: initialDelaySeconds, periodSeconds, failureThreshold</ns0:text>
  <ns0:text x="800" y="506.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">successThreshold, timeoutSeconds</ns0:text>
</ns0:svg>
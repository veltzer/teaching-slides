<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Pod Lifecycle Phases</text>
  <circle cx="240" cy="360" r="64" fill="#888" />
  <text x="240" y="369" text-anchor="middle" fill="white">Pending</text>
  <circle cx="480" cy="360" r="64" fill="#4285f4" />
  <text x="480" y="369" text-anchor="middle" fill="white">Running</text>
  <circle cx="720" cy="360" r="64" fill="#34a853" />
  <text x="720" y="369" text-anchor="middle" fill="white">Succeeded</text>
  <circle cx="960" cy="360" r="64" fill="#ea4335" />
  <text x="960" y="369" text-anchor="middle" fill="white">Failed</text>
  <circle cx="600" cy="576" r="64" fill="#fbbc04" />
  <text x="600" y="585" text-anchor="middle">Unknown</text>
  <path d="M 304 360 L 416 360" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 544 360 L 656 360" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 544 360 L 896 360" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 480 432 L 600 504" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="360" y="342" text-anchor="middle" font-size="16">Scheduled</text>
  <text x="600" y="342" text-anchor="middle" font-size="16">Complete</text>
  <text x="720" y="342" text-anchor="middle" font-size="16">Error</text>
  <text x="512" y="477" text-anchor="middle" font-size="16">Lost</text>
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#666" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="1120" height="540" fill="#f9f9f9" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">GitOps Workflow</text>
  <rect x="160" y="144" width="240" height="108" fill="#4285f4" rx="8" />
  <text x="280" y="189" text-anchor="middle" fill="white" font-weight="bold">Git Repository</text>
  <text x="280" y="225" text-anchor="middle" fill="white" font-size="16">Source of truth</text>
  <rect x="480" y="144" width="240" height="108" fill="#34a853" rx="8" />
  <text x="600" y="189" text-anchor="middle" fill="white" font-weight="bold">GitOps Agent</text>
  <text x="600" y="225" text-anchor="middle" fill="white" font-size="16">ArgoCD/Flux</text>
  <rect x="800" y="144" width="240" height="108" fill="#fbbc04" rx="8" />
  <text x="920" y="189" text-anchor="middle" font-weight="bold">Kubernetes</text>

  <path d="M 400 198 L 472 198" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="435.2" y="180" text-anchor="middle" font-size="16">Pull</text>
  <path d="M 720 198 L 792 198" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="755.2" y="180" text-anchor="middle" font-size="16">Apply</text>
  <rect x="320" y="324" width="640" height="216" fill="#e8f5e9" rx="8" />
  <text x="640" y="378" text-anchor="middle" font-weight="bold">Benefits</text>
  <text x="640" y="423" text-anchor="middle" font-size="19.2">• Increased reliability</text>
  <text x="640" y="459" text-anchor="middle" font-size="19.2">• Better security (pull vs push)</text>
  <text x="640" y="495" text-anchor="middle" font-size="19.2">• Easier rollbacks</text>
  <text x="640" y="531" text-anchor="middle" font-size="19.2">• Complete audit trail</text>
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#666" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="153.8888" y="111.25" width="972.2223" height="468.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.4453"/>
  <text x="639.9999" y="80" text-anchor="middle" font-size="25" font-weight="bold">GitOps Workflow</text>
  <rect x="223.3332" y="158.1249" width="208.3334" height="93.75" fill="var(--primary-fill)" rx="6.4453" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="327.4999" y="197.1875" text-anchor="middle" fill="var(--bg)" font-weight="bold">Git Repository</text>
  <text x="327.4999" y="228.4375" text-anchor="middle" fill="var(--bg)" font-size="13.8889">Source of truth</text>
  <rect x="501.1111" y="158.1249" width="208.3334" height="93.75" fill="var(--ok-fill)" rx="6.4453" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="605.2778" y="197.1875" text-anchor="middle" fill="var(--bg)" font-weight="bold">GitOps Agent</text>
  <text x="605.2778" y="228.4375" text-anchor="middle" fill="var(--bg)" font-size="13.8889">ArgoCD/Flux</text>
  <rect x="778.8888" y="158.1249" width="208.3334" height="93.75" fill="var(--warn-fill)" rx="6.4453" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="883.0555" y="197.1875" text-anchor="middle" font-weight="bold">Kubernetes</text>
  <text x="883.0555" y="228.4375" text-anchor="middle" font-size="13.8889">Target cluster</text>
  <path d="M 431.6666 205 L 494.1666 205" stroke="var(--text-muted)" stroke-width="2.5859" marker-end="url(#arrow)" />
  <text x="462.2222" y="189.3749" text-anchor="middle" font-size="13.8889">Pull</text>
  <path d="M 709.4444 205 L 771.9444 205" stroke="var(--text-muted)" stroke-width="2.5859" marker-end="url(#arrow)" />
  <text x="739.9999" y="189.3749" text-anchor="middle" font-size="13.8889">Apply</text>
  <rect x="362.2222" y="314.375" width="555.5556" height="187.5001" fill="var(--ok-fill)" rx="6.4453" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="639.9999" y="361.2499" text-anchor="middle" font-weight="bold">Benefits</text>
  <text x="639.9999" y="400.3125" text-anchor="middle" font-size="16.6667">• Increased reliability</text>
  <text x="639.9999" y="431.5625" text-anchor="middle" font-size="16.6667">• Better security (pull vs push)</text>
  <text x="639.9999" y="462.8125" text-anchor="middle" font-size="16.6667">• Easier rollbacks</text>
  <text x="639.9999" y="494.0625" text-anchor="middle" font-size="16.6667">• Complete audit trail</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
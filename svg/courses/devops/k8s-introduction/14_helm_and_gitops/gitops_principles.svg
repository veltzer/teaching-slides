  <ns0:rect x="387.8788" y="116.3636" width="193.9394" height="87.2727" fill="#34a853" rx="6.4646" />
  <ns0:text x="484.8485" y="152.7273" text-anchor="middle" fill="white" font-weight="bold">GitOps Agent</ns0:text>
  <ns0:text x="484.8485" y="181.8182" text-anchor="middle" fill="white" font-size="12.9293">ArgoCD/Flux</ns0:text>
  <ns0:rect x="646.4646" y="116.3636" width="193.9394" height="87.2727" fill="#fbbc04" rx="6.4646" />
  <ns0:text x="743.4343" y="152.7273" text-anchor="middle" font-weight="bold">Kubernetes</ns0:text>
  <ns0:text x="743.4343" y="181.8182" text-anchor="middle" font-size="12.9293">Target cluster</ns0:text>
  <ns0:path d="M 323.2323 160 L 381.4141 160" stroke="#666" stroke-width="2.5859" marker-end="url(#arrow)" />
  <ns0:text x="351.6768" y="145.4545" text-anchor="middle" font-size="12.9293">Pull</ns0:text>
  <ns0:path d="M 581.8182 160 L 640 160" stroke="#666" stroke-width="2.5859" marker-end="url(#arrow)" />
  <ns0:text x="610.2626" y="145.4545" text-anchor="middle" font-size="12.9293">Apply</ns0:text>
  <ns0:rect x="258.5859" y="261.8182" width="517.1717" height="174.5455" fill="#e8f5e9" rx="6.4646" />
  <ns0:text x="517.1717" y="305.4545" text-anchor="middle" font-weight="bold">Benefits</ns0:text>
  <ns0:text x="517.1717" y="341.8182" text-anchor="middle" font-size="15.5152">• Increased reliability</ns0:text>
  <ns0:text x="517.1717" y="370.9091" text-anchor="middle" font-size="15.5152">• Better security (pull vs push)</ns0:text>
  <ns0:text x="517.1717" y="400" text-anchor="middle" font-size="15.5152">• Easier rollbacks</ns0:text>
  <ns0:text x="517.1717" y="429.0909" text-anchor="middle" font-size="15.5152">• Complete audit trail</ns0:text>

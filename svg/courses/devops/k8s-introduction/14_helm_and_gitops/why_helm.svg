<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="76.25" width="1200" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640" y="40" text-anchor="middle" font-size="29.9142" font-weight="bold">Without Helm vs With Helm</text>
  <g id="without">
    <text x="297.1429" y="130.625" text-anchor="middle" font-size="19.9428">Without Helm</text>
    <rect x="125.7143" y="166.875" width="342.8571" height="54.375" fill="var(--text-faint)" rx="6" />
    <text x="297.1429" y="203.125" text-anchor="middle" fill="var(--bg)" font-size="16.619">deployment.yaml</text>
    <rect x="125.7143" y="239.375" width="342.8571" height="54.375" fill="var(--text-faint)" rx="6" />
    <text x="297.1429" y="275.625" text-anchor="middle" fill="var(--bg)" font-size="16.619">service.yaml</text>
    <rect x="125.7143" y="311.875" width="342.8571" height="54.375" fill="var(--text-faint)" rx="6" />
    <text x="297.1429" y="348.125" text-anchor="middle" fill="var(--bg)" font-size="16.619">configmap.yaml</text>
    <rect x="125.7143" y="384.375" width="342.8571" height="54.375" fill="var(--text-faint)" rx="6" />
    <text x="297.1429" y="420.625" text-anchor="middle" fill="var(--bg)" font-size="16.619">ingress.yaml</text>
    <text x="297.1429" y="493.125" text-anchor="middle" font-size="18.2809">Multiple files to manage</text>
    <text x="297.1429" y="529.375" text-anchor="middle" font-size="18.2809">Manual versioning</text>
  </g>
  <g id="with">
    <text x="897.1429" y="130.625" text-anchor="middle" font-size="19.9428">With Helm</text>
    <rect x="725.7143" y="166.875" width="342.8571" height="108.75" fill="var(--primary-accent)" rx="6" />
    <text x="897.1429" y="230.3125" text-anchor="middle" fill="var(--bg)" font-weight="bold">Helm Chart</text>
    <text x="897.1429" y="266.5625" text-anchor="middle" fill="var(--bg)" font-size="16.619">All resources packaged</text>
    <rect x="725.7143" y="311.875" width="342.8571" height="72.5" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="897.1429" y="357.1875" text-anchor="middle" fill="var(--bg)">values.yaml</text>
    <text x="897.1429" y="493.125" text-anchor="middle" font-size="18.2809">Single package</text>
    <text x="897.1429" y="529.375" text-anchor="middle" font-size="18.2809">Version controlled</text>
  </g>
</svg>
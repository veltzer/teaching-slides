<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <g id="without">
    <text x="258.181864462812" y="40" text-anchor="middle" font-size="27.134227865035" font-family="Arial, sans-serif" fill="var(--text)">Without Helm</text>
    <rect x="40" y="92.727272727273" width="436.363601652891" height="79.090909090909" fill="var(--text-faint)" rx="8.163616302135"/>
    <text x="258.181864462812" y="145.454545454545" text-anchor="middle" fill="var(--bg)" font-size="22.611856554195" font-family="Arial, sans-serif">deployment.yaml</text>
    <rect x="40" y="198.181818181818" width="436.363601652891" height="79.090909090909" fill="var(--text-faint)" rx="8.163616302135"/>
    <text x="258.181864462812" y="250.909090909092" text-anchor="middle" fill="var(--bg)" font-size="22.611856554195" font-family="Arial, sans-serif">service.yaml</text>
    <rect x="40" y="303.636363636363" width="436.363601652891" height="79.090909090909" fill="var(--text-faint)" rx="8.163616302135"/>
    <text x="258.181864462812" y="356.363636363637" text-anchor="middle" fill="var(--bg)" font-size="22.611856554195" font-family="Arial, sans-serif">configmap.yaml</text>
    <rect x="40" y="409.09090909091" width="436.363601652891" height="79.090909090909" fill="var(--text-faint)" rx="8.163616302135"/>
    <text x="258.181864462812" y="461.818181818182" text-anchor="middle" fill="var(--bg)" font-size="22.611856554195" font-family="Arial, sans-serif">ingress.yaml</text>
    <text x="258.181864462812" y="567.272727272728" text-anchor="middle" font-size="24.873042209616" font-family="Arial, sans-serif" fill="var(--text)">Multiple files to manage</text>
    <text x="258.181864462812" y="620" text-anchor="middle" font-size="24.873042209616" font-family="Arial, sans-serif" fill="var(--text)">Manual versioning</text>
  </g>
  <g id="with">
    <text x="1021.818262809921" y="40" text-anchor="middle" font-size="27.134227865035" font-family="Arial, sans-serif" fill="var(--text)">With Helm</text>
    <rect x="803.636398347109" y="92.727272727273" width="436.363601652891" height="158.181818181818" fill="var(--primary-accent)" rx="8.163616302135"/>
    <text x="1021.818262809921" y="185" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Helm Chart</text>
    <text x="1021.818262809921" y="237.727272727273" text-anchor="middle" fill="var(--bg)" font-size="22.611856554195" font-family="Arial, sans-serif">All resources packaged</text>
    <rect x="803.636398347109" y="303.636363636363" width="436.363601652891" height="105.454545454545" fill="url(#grad-primary)" rx="8.163616302135" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="1021.818262809921" y="369.545454545455" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">values.yaml</text>
    <text x="1021.818262809921" y="567.272727272728" text-anchor="middle" font-size="24.873042209616" font-family="Arial, sans-serif" fill="var(--text)">Single package</text>
    <text x="1021.818262809921" y="620" text-anchor="middle" font-size="24.873042209616" font-family="Arial, sans-serif" fill="var(--text)">Version controlled</text>
  </g>
</svg>

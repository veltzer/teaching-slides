<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Without Helm vs With Helm</text>
  <g id="without">
    <text x="320" y="144" text-anchor="middle" font-size="19.2">Without Helm</text>
    <rect x="160" y="180" width="320" height="54" fill="#888" rx="4.8" />
    <text x="320" y="216" text-anchor="middle" fill="white" font-size="16">deployment.yaml</text>
    <rect x="160" y="252" width="320" height="54" fill="#888" rx="4.8" />
    <text x="320" y="288" text-anchor="middle" fill="white" font-size="16">service.yaml</text>
    <rect x="160" y="324" width="320" height="54" fill="#888" rx="4.8" />
    <text x="320" y="360" text-anchor="middle" fill="white" font-size="16">configmap.yaml</text>
    <rect x="160" y="396" width="320" height="54" fill="#888" rx="4.8" />
    <text x="320" y="432" text-anchor="middle" fill="white" font-size="16">ingress.yaml</text>
    <text x="320" y="504" text-anchor="middle" font-size="17.6">Multiple files to manage</text>
    <text x="320" y="540" text-anchor="middle" font-size="17.6">Manual versioning</text>
  </g>
  <g id="with">
    <text x="880" y="144" text-anchor="middle" font-size="19.2">With Helm</text>
    <rect x="720" y="180" width="320" height="108" fill="#0f1689" rx="4.8" />
    <text x="880" y="243" text-anchor="middle" fill="white" font-weight="bold">Helm Chart</text>
    <text x="880" y="279" text-anchor="middle" fill="white" font-size="16">All resources packaged</text>
    <rect x="720" y="324" width="320" height="72" fill="#4285f4" rx="4.8" />
    <text x="880" y="369" text-anchor="middle" fill="white">values.yaml</text>
    <text x="880" y="504" text-anchor="middle" font-size="17.6">Single package</text>
    <text x="880" y="540" text-anchor="middle" font-size="17.6">Version controlled</text>
  </g>
</svg>
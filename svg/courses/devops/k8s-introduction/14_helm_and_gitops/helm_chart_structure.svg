  <ns0:text x="475.5556" y="531.5556" font-family="monospace" font-size="10.6667" fill="#555">helm search repo nginx</ns0:text>
  <ns0:text x="475.5556" y="549.3333" font-family="monospace" font-size="10.6667" fill="#555">helm template rel ./chart</ns0:text>

  <text x="85.3333" y="362.6667" font-family="monospace" font-size="11.5556" fill="var(--ok-accent)">service.yaml</text>
  <rect x="71.1111" y="378.6667" width="266.6667" height="26.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="85.3333" y="396.4444" font-family="monospace" font-size="11.5556" fill="var(--ok-accent)">ingress.yaml</text>

  <text x="541.5625" y="505.6111" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">helm repo add bitnami ...</text>
  <text x="541.5625" y="521.7223" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">helm search repo nginx</text>
  <text x="541.5625" y="537.8333" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">helm template rel ./chart</text>
  <rect x="808.75" y="458.8889" width="393.75" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="818.125" y="475" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text)">Template syntax example</text>
  <text x="818.125" y="489.5" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">replicas: {{ .Values.replicaCount }}</text>
  <text x="818.125" y="504" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"</text>

  <rect x="808.75" y="226.8889" width="262.5" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="939.9999" y="225.2777" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)">Rendered Manifests</text>
  <text x="825.625" y="254.2777" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">kind: Deployment</text>
  <text x="825.625" y="268.7777" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">  replicas: 2</text>
  <text x="825.625" y="283.2777" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">  image: nginx:latest</text>
  <text x="825.625" y="299.3889" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">kind: Service</text>
  <text x="825.625" y="313.8889" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">  port: 80</text>
  <text x="825.625" y="330" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">  type: ClusterIP</text>
  <text x="825.625" y="347.7223" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">...</text>
  <line x1="939.9999" y1="362.2223" x2="939.9999" y2="410.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="954.0625" y="390.4167" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">helm install</text>
  <rect x="808.75" y="410.5556" width="262.5" height="64.4444" rx="6" fill="var(--text-muted)" filter="url(#shadow)" />
  <text x="939.9999" y="437.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)">Kubernetes API</text>
  <text x="939.9999" y="457.2777" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--border)">applies all resources</text>
  <rect x="527.5" y="386.3889" width="243.75" height="177.2223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="649.375" y="405.7223" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--warn-accent)">Helm Commands</text>

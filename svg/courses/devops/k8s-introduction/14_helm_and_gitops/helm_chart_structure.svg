  <text x="630.625" y="259.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.7735" font-weight="bold" fill="var(--bg)">Template</text>
  <text x="630.625" y="276.8333" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.7735" font-weight="bold" fill="var(--bg)">Engine</text>
  <text x="630.625" y="297.7777" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--primary-accent)">Go templates + Sprig</text>
  <line x1="733.75" y1="273.6111" x2="808.75" y2="273.6111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="771.25" y="263.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">render</text>
  <rect x="808.75" y="201.1111" width="262.5" height="161.1111" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="77.5" y="72.2223" width="356.25" height="451.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="77.5" y="72.2223" width="356.25" height="37.0556" rx="6" fill="var(--text-muted)" />
  <rect x="77.5" y="99.6111" width="356.25" height="9.6667" fill="var(--text-muted)" rx="6"/>
  <text x="255.6249" y="98" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">my-chart/</text>
  <rect x="96.25" y="125.3889" width="318.75" height="45.1111" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="115" y="141.5" font-family="monospace" font-size="13.0354" font-weight="bold" fill="var(--info-accent)">Chart.yaml</text>
  <text x="115" y="159.2223" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">name, version, description, appVersion</text>
  <rect x="96.25" y="180.1667" width="318.75" height="58" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="115" y="197.8889" font-family="monospace" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">values.yaml</text>
  <text x="115" y="214" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">replicaCount: 2</text>
  <text x="115" y="226.8889" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">image.tag: latest   service.port: 80</text>
  <rect x="96.25" y="247.8333" width="318.75" height="37.0556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="115" y="263.9444" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">values-prod.yaml  (override)</text>
  <text x="115" y="278.4444" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">replicaCount: 5</text>
  <rect x="96.25" y="294.5556" width="318.75" height="193.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="115" y="312.2777" font-family="monospace" font-size="13.0354" font-weight="bold" fill="var(--ok-accent)">templates/</text>
  <rect x="115" y="321.9444" width="281.25" height="24.1667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="130" y="338.0556" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">deployment.yaml</text>
  <rect x="115" y="352.5556" width="281.25" height="24.1667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="130" y="368.6667" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">service.yaml</text>
  <rect x="115" y="383.1667" width="281.25" height="24.1667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="130" y="399.2777" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">ingress.yaml</text>
  <rect x="115" y="413.7777" width="281.25" height="24.1667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="130" y="429.8889" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">configmap.yaml</text>
  <rect x="115" y="444.3889" width="281.25" height="24.1667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="130" y="460.5" font-family="monospace" font-size="11.2974" fill="var(--ok-accent)">_helpers.tpl  (named templates)</text>
  <rect x="96.25" y="495.9444" width="318.75" height="20.9444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="115" y="509.6389" font-family="monospace" font-size="11.2974" fill="var(--warn-accent)">charts/  (sub-chart dependencies)</text>
  <line x1="433.75" y1="209.1667" x2="527.5" y2="265.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="461.875" y="233.3333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)">values</text>
  <line x1="433.75" y1="354.1667" x2="527.5" y2="289.7223" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />

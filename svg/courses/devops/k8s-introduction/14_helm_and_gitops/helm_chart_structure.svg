  <rect x="53.3333" y="94.2222" width="302.2222" height="49.7778" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="71.1111" y="112" font-family="monospace" font-size="13.3333" font-weight="bold" fill="var(--info-accent)">Chart.yaml</text>

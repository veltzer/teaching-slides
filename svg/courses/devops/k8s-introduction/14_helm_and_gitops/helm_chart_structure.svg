  <rect x="60" y="102.754018" width="340" height="53.245887" rx="6.732354" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="80" y="121.770398" font-family="monospace" font-size="14.626488" font-weight="bold" fill="var(--info-accent)">Chart.yaml</text>
  <text x="80" y="142.688522" font-family="monospace" font-size="11.70128" fill="var(--text-muted)">name, version, description, appVersion</text>

  <text x="71.1111" y="192" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">replicaCount: 2</text>
  <text x="71.1111" y="206.2222" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">image.tag: latest   service.port: 80</text>
  <rect x="53.3333" y="229.3333" width="302.2222" height="40.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="71.1111" y="247.1111" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">values-prod.yaml  (override)</text>
  <text x="71.1111" y="263.1111" font-family="monospace" font-size="10.6667" fill="var(--text-muted)">replicaCount: 5</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Writable container layer (top) -->
  <rect x="340" y="80" width="600" height="72" rx="8" fill="#fce4ec" stroke="#e91e63" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#880e4f">Writable Container Layer</text>
  <text x="640" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#c2185b">(runtime writes, ephemeral)</text>

  <!-- Arrow down into image -->
  <line x1="640" y1="152" x2="640" y2="174" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="168" font-family="Arial,sans-serif" font-size="13" fill="#777">Read-only image layers below</text>

  <!-- Layer 4: App CMD -->
  <rect x="340" y="178" width="600" height="72" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Layer 4 — CMD / ENTRYPOINT</text>
  <text x="640" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#bbdefb">CMD ["python", "app.py"]</text>

  <!-- Arrow -->
  <line x1="640" y1="250" x2="640" y2="270" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: App code -->
  <rect x="340" y="274" width="600" height="72" rx="8" fill="#1976d2" filter="url(#shadow)"/>
  <text x="640" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Layer 3 — Application Code</text>
  <text x="640" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#bbdefb">COPY src/ /app/  (your files)</text>

  <!-- Arrow -->
  <line x1="640" y1="346" x2="640" y2="366" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Dependencies -->
  <rect x="340" y="370" width="600" height="72" rx="8" fill="#1565c0" filter="url(#shadow)"/>
  <text x="640" y="399" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Layer 2 — Dependencies</text>
  <text x="640" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#bbdefb">RUN pip install -r requirements.txt</text>

  <!-- Arrow -->
  <line x1="640" y1="442" x2="640" y2="462" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 1: Base OS -->
  <rect x="340" y="466" width="600" height="72" rx="8" fill="#0d47a1" filter="url(#shadow)"/>
  <text x="640" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Layer 1 — Base OS</text>
  <text x="640" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#bbdefb">FROM ubuntu:22.04</text>

  <!-- Arrow -->
  <line x1="640" y1="538" x2="640" y2="558" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 0: Scratch -->
  <rect x="340" y="562" width="600" height="56" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="591" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1b5e20">Layer 0 — Scratch / Bootfs</text>
  <text x="640" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#2e7d32">(shared across all images on this host)</text>

  <!-- Legend -->
  <rect x="80" y="80" width="200" height="56" rx="6" fill="#fce4ec" stroke="#e91e63" stroke-width="1.5"/>
  <text x="180" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#880e4f">Writable (container)</text>
  <text x="180" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#c2185b">Created at runtime</text>

  <rect x="80" y="152" width="200" height="40" rx="6" fill="#1565c0"/>
  <text x="180" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Read-only (image)</text>

  <rect x="80" y="208" width="200" height="40" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="180" y="233" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1b5e20">Shared bootfs</text>

  <!-- Right side note -->
  <text x="1000" y="220" font-family="Arial,sans-serif" font-size="14" fill="#555">Each layer is a</text>
  <text x="1000" y="238" font-family="Arial,sans-serif" font-size="14" fill="#555">content-addressed</text>
  <text x="1000" y="256" font-family="Arial,sans-serif" font-size="14" fill="#555">diff snapshot</text>
  <text x="1000" y="290" font-family="Arial,sans-serif" font-size="14" fill="#555">Layers are cached</text>
  <text x="1000" y="308" font-family="Arial,sans-serif" font-size="14" fill="#555">and reused across</text>
  <text x="1000" y="326" font-family="Arial,sans-serif" font-size="14" fill="#555">images on host</text>
</svg>

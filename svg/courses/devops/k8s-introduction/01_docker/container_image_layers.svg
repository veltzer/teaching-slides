  <ns0:text x="568.8889" y="97.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#880e4f">Writable Container Layer</ns0:text>
  <ns0:text x="568.8889" y="119.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" fill="#c2185b">(runtime writes, ephemeral)</ns0:text>
  <ns0:line x1="568.8889" y1="135.1111" x2="568.8889" y2="154.6667" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="631.1111" y="149.3333" font-family="Arial,sans-serif" font-size="11.5556" fill="#777">Read-only image layers below</ns0:text>
  <ns0:rect x="302.2222" y="158.2222" width="533.3333" height="64" rx="7.1111" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#ffffff">Layer 4 — CMD / ENTRYPOINT</ns0:text>
  <ns0:text x="568.8889" y="205.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" fill="#bbdefb">CMD ["python", "app.py"]</ns0:text>
  <ns0:line x1="568.8889" y1="222.2222" x2="568.8889" y2="240" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="302.2222" y="243.5556" width="533.3333" height="64" rx="7.1111" fill="#1976d2" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="269.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#ffffff">Layer 3 — Application Code</ns0:text>
  <ns0:text x="568.8889" y="290.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" fill="#bbdefb">COPY src/ /app/  (your files)</ns0:text>
  <ns0:line x1="568.8889" y1="307.5556" x2="568.8889" y2="325.3333" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="302.2222" y="328.8889" width="533.3333" height="64" rx="7.1111" fill="#1565c0" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="354.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#ffffff">Layer 2 — Dependencies</ns0:text>
  <ns0:text x="568.8889" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" fill="#bbdefb">RUN pip install -r requirements.txt</ns0:text>
  <ns0:line x1="568.8889" y1="392.8889" x2="568.8889" y2="410.6667" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="302.2222" y="414.2222" width="533.3333" height="64" rx="7.1111" fill="#0d47a1" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#ffffff">Layer 1 — Base OS</ns0:text>
  <ns0:text x="568.8889" y="461.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" fill="#bbdefb">FROM ubuntu:22.04</ns0:text>
  <ns0:line x1="568.8889" y1="478.2222" x2="568.8889" y2="496" stroke="#555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="302.2222" y="499.5556" width="533.3333" height="49.7778" rx="7.1111" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="525.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#1b5e20">Layer 0 — Scratch / Bootfs</ns0:text>
  <ns0:text x="568.8889" y="542.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#2e7d32">(shared across all images on this host)</ns0:text>
  <ns0:rect x="71.1111" y="71.1111" width="177.7778" height="49.7778" rx="5.3333" fill="#fce4ec" stroke="#e91e63" stroke-width="1.3333" />
  <ns0:text x="160" y="92.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#880e4f">Writable (container)</ns0:text>
  <ns0:text x="160" y="110.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="#c2185b">Created at runtime</ns0:text>
  <ns0:rect x="71.1111" y="135.1111" width="177.7778" height="35.5556" rx="5.3333" fill="#1565c0" />
  <ns0:text x="160" y="157.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#ffffff">Read-only (image)</ns0:text>
  <ns0:rect x="71.1111" y="184.8889" width="177.7778" height="35.5556" rx="5.3333" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.3333" />
  <ns0:text x="160" y="207.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#1b5e20">Shared bootfs</ns0:text>
  <ns0:text x="888.8889" y="195.5556" font-family="Arial,sans-serif" font-size="12.4444" fill="#555">Each layer is a</ns0:text>
  <ns0:text x="888.8889" y="211.5556" font-family="Arial,sans-serif" font-size="12.4444" fill="#555">content-addressed</ns0:text>
  <ns0:text x="888.8889" y="227.5556" font-family="Arial,sans-serif" font-size="12.4444" fill="#555">diff snapshot</ns0:text>
  <ns0:text x="888.8889" y="257.7778" font-family="Arial,sans-serif" font-size="12.4444" fill="#555">Layers are cached</ns0:text>
  <ns0:text x="888.8889" y="273.7778" font-family="Arial,sans-serif" font-size="12.4444" fill="#555">and reused across</ns0:text>
  <ns0:text x="888.8889" y="289.7778" font-family="Arial,sans-serif" font-size="12.4444" fill="#555">images on host</ns0:text>
</ns0:svg>
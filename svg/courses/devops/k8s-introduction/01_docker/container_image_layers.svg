<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="379.130435" y="40" width="782.608696" height="77.620798" rx="8.187237" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="770.434783" y="72.342044" text-anchor="middle" font-family="Arial,sans-serif" font-size="23.716516" font-weight="bold" fill="var(--danger-accent)">Writable Container Layer</text>
  <text x="770.434783" y="98.215598" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.787319" fill="var(--danger-accent)">(runtime writes, ephemeral)</text>
  <line x1="770.434783" y1="117.620798" x2="770.434783" y2="141.338368" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="861.73913" y="134.869879" font-family="Arial,sans-serif" font-size="15.415749" fill="var(--text-muted)">Read-only image layers below</text>
  <rect x="379.130435" y="145.650605" width="782.608696" height="77.620798" rx="8.187237" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="770.434783" y="176.914523" text-anchor="middle" font-family="Arial,sans-serif" font-size="23.716516" font-weight="bold" fill="var(--bg)">Layer 4 — CMD / ENTRYPOINT</text>
  <text x="770.434783" y="202.788077" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.787319" fill="var(--primary-accent)">CMD ["python", "app.py"]</text>
  <line x1="770.434783" y1="223.271403" x2="770.434783" y2="244.832721" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="379.130435" y="249.145091" width="782.608696" height="77.620798" rx="8.187237" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="770.434783" y="280.408875" text-anchor="middle" font-family="Arial,sans-serif" font-size="23.716516" font-weight="bold" fill="var(--bg)">Layer 3 — Application Code</text>
  <text x="770.434783" y="306.282564" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.787319" fill="var(--primary-accent)">COPY src/ /app/  (your files)</text>
  <line x1="770.434783" y1="326.765889" x2="770.434783" y2="348.327073" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="379.130435" y="352.639444" width="782.608696" height="77.620798" rx="8.187237" fill="var(--primary-accent)" />
  <text x="770.434783" y="383.903362" text-anchor="middle" font-family="Arial,sans-serif" font-size="23.716516" font-weight="bold" fill="var(--bg)">Layer 2 — Dependencies</text>
  <text x="770.434783" y="409.776916" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.787319" fill="var(--primary-accent)">RUN pip install -r requirements.txt</text>
  <line x1="770.434783" y1="430.260242" x2="770.434783" y2="451.82156" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="379.130435" y="456.133797" width="782.608696" height="77.620798" rx="8.187237" fill="var(--primary-accent)" />
  <text x="770.434783" y="487.397714" text-anchor="middle" font-family="Arial,sans-serif" font-size="23.716516" font-weight="bold" fill="var(--bg)">Layer 1 — Base OS</text>
  <text x="770.434783" y="513.271269" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.787319" fill="var(--primary-accent)">FROM ubuntu:22.04</text>
  <line x1="770.434783" y1="533.754595" x2="770.434783" y2="555.315912" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="379.130435" y="559.628283" width="782.608696" height="60.371717" rx="8.187237" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="770.434783" y="590.892067" text-anchor="middle" font-family="Arial,sans-serif" font-size="21.34481" font-weight="bold" fill="var(--ok-accent)">Layer 0 — Scratch / Bootfs</text>
  <text x="770.434783" y="611.375393" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.415749" fill="var(--ok-accent)">(shared across all images on this host)</text>
  <rect x="40" y="40" width="260.869565" height="60.371717" rx="8.187237" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.434783" y="65.873555" text-anchor="middle" font-family="Arial,sans-serif" font-size="16.601397" font-weight="bold" fill="var(--danger-accent)">Writable (container)</text>
  <text x="170.434783" y="87.435006" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.229964" fill="var(--danger-accent)">Created at runtime</text>
  <rect x="40" y="117.620798" width="260.869565" height="43.12277" rx="8.187237" fill="var(--primary-accent)" />
  <text x="170.434783" y="144.572479" text-anchor="middle" font-family="Arial,sans-serif" font-size="16.601397" font-weight="bold" fill="var(--bg)">Read-only (image)</text>
  <rect x="40" y="177.992649" width="260.869565" height="43.12277" rx="8.187237" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.434783" y="204.944196" text-anchor="middle" font-family="Arial,sans-serif" font-size="16.601397" font-weight="bold" fill="var(--ok-accent)">Shared bootfs</text>
  <text x="1240" y="190.929493" font-family="Arial,sans-serif" font-size="16.601397" fill="var(--text-muted)">Each layer is a</text>
  <text x="1240" y="210.334692" font-family="Arial,sans-serif" font-size="16.601397" fill="var(--text-muted)">content-addressed</text>
  <text x="1240" y="229.739892" font-family="Arial,sans-serif" font-size="16.601397" fill="var(--text-muted)">diff snapshot</text>
  <text x="1240" y="266.394039" font-family="Arial,sans-serif" font-size="16.601397" fill="var(--text-muted)">Layers are cached</text>
  <text x="1240" y="285.799238" font-family="Arial,sans-serif" font-size="16.601397" fill="var(--text-muted)">and reused across</text>
  <text x="1240" y="305.204438" font-family="Arial,sans-serif" font-size="16.601397" fill="var(--text-muted)">images on host</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="302.2222" y="71.1111" width="533.3333" height="64" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="97.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">Writable Container Layer</text>
  <text x="568.8889" y="119.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" fill="var(--danger-accent)">(runtime writes, ephemeral)</text>
  <line x1="568.8889" y1="135.1111" x2="568.8889" y2="154.6667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="631.1111" y="149.3333" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">Read-only image layers below</text>
  <rect x="302.2222" y="158.2222" width="533.3333" height="64" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">Layer 4 — CMD / ENTRYPOINT</text>
  <text x="568.8889" y="205.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" fill="var(--primary-accent)">CMD ["python", "app.py"]</text>
  <line x1="568.8889" y1="222.2222" x2="568.8889" y2="240" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="302.2222" y="243.5556" width="533.3333" height="64" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="269.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">Layer 3 — Application Code</text>
  <text x="568.8889" y="290.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" fill="var(--primary-accent)">COPY src/ /app/  (your files)</text>
  <line x1="568.8889" y1="307.5556" x2="568.8889" y2="325.3333" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="302.2222" y="328.8889" width="533.3333" height="64" rx="6" fill="var(--primary-accent)" filter="url(#shadow)" />
  <text x="568.8889" y="354.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">Layer 2 — Dependencies</text>
  <text x="568.8889" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" fill="var(--primary-accent)">RUN pip install -r requirements.txt</text>
  <line x1="568.8889" y1="392.8889" x2="568.8889" y2="410.6667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="302.2222" y="414.2222" width="533.3333" height="64" rx="6" fill="var(--primary-accent)" filter="url(#shadow)" />
  <text x="568.8889" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">Layer 1 — Base OS</text>
  <text x="568.8889" y="461.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.3333" fill="var(--primary-accent)">FROM ubuntu:22.04</text>
  <line x1="568.8889" y1="478.2222" x2="568.8889" y2="496" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="302.2222" y="499.5556" width="533.3333" height="49.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="525.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Layer 0 — Scratch / Bootfs</text>
  <text x="568.8889" y="542.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--ok-accent)">(shared across all images on this host)</text>
  <rect x="71.1111" y="71.1111" width="177.7778" height="49.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="160" y="92.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">Writable (container)</text>
  <text x="160" y="110.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--danger-accent)">Created at runtime</text>
  <rect x="71.1111" y="135.1111" width="177.7778" height="35.5556" rx="6" fill="var(--primary-accent)" />
  <text x="160" y="157.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)">Read-only (image)</text>
  <rect x="71.1111" y="184.8889" width="177.7778" height="35.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="160" y="207.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">Shared bootfs</text>
  <text x="888.8889" y="195.5556" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text-muted)">Each layer is a</text>
  <text x="888.8889" y="211.5556" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text-muted)">content-addressed</text>
  <text x="888.8889" y="227.5556" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text-muted)">diff snapshot</text>
  <text x="888.8889" y="257.7778" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text-muted)">Layers are cached</text>
  <text x="888.8889" y="273.7778" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text-muted)">and reused across</text>
  <text x="888.8889" y="289.7778" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text-muted)">images on host</text>
</svg>
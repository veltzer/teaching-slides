<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="379.130435" y="40" width="782.608696" height="77.620798" rx="8.187237" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770.434783" y="72.342044" text-anchor="middle" font-size="23.716516" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Writable Container Layer</text>
  <text x="770.434783" y="98.215598" text-anchor="middle" font-size="17.787319" fill="var(--danger-accent)" font-family="Arial, sans-serif">(runtime writes, ephemeral)</text>
  <line x1="770.434783" y1="117.620798" x2="770.434783" y2="141.338368" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="861.73913" y="134.869879" font-size="15.415749" fill="var(--text-muted)" font-family="Arial, sans-serif">Read-only image layers below</text>
  <rect x="379.130435" y="145.650605" width="782.608696" height="77.620798" rx="8.187237" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770.434783" y="176.914523" text-anchor="middle" font-size="23.716516" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Layer 4 — CMD / ENTRYPOINT</text>
  <text x="770.434783" y="202.788077" text-anchor="middle" font-size="17.787319" fill="var(--primary-accent)" font-family="Arial, sans-serif">CMD ["python", "app.py"]</text>
  <line x1="770.434783" y1="223.271403" x2="770.434783" y2="244.832721" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="379.130435" y="249.145091" width="782.608696" height="77.620798" rx="8.187237" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770.434783" y="280.408875" text-anchor="middle" font-size="23.716516" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Layer 3 — Application Code</text>
  <text x="770.434783" y="306.282564" text-anchor="middle" font-size="17.787319" fill="var(--primary-accent)" font-family="Arial, sans-serif">COPY src/ /app/  (your files)</text>
  <line x1="770.434783" y1="326.765889" x2="770.434783" y2="348.327073" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="379.130435" y="352.639444" width="782.608696" height="77.620798" rx="8.187237" fill="var(--primary-accent)" />
  <text x="770.434783" y="383.903362" text-anchor="middle" font-size="23.716516" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Layer 2 — Dependencies</text>
  <text x="770.434783" y="409.776916" text-anchor="middle" font-size="17.787319" fill="var(--primary-accent)" font-family="Arial, sans-serif">RUN pip install -r requirements.txt</text>
  <line x1="770.434783" y1="430.260242" x2="770.434783" y2="451.82156" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="379.130435" y="456.133797" width="782.608696" height="77.620798" rx="8.187237" fill="var(--primary-accent)" />
  <text x="770.434783" y="487.397714" text-anchor="middle" font-size="23.716516" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Layer 1 — Base OS</text>
  <text x="770.434783" y="513.271269" text-anchor="middle" font-size="17.787319" fill="var(--primary-accent)" font-family="Arial, sans-serif">FROM ubuntu:22.04</text>
  <line x1="770.434783" y1="533.754595" x2="770.434783" y2="555.315912" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="379.130435" y="559.628283" width="782.608696" height="60.371717" rx="8.187237" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770.434783" y="590.892067" text-anchor="middle" font-size="21.34481" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Layer 0 — Scratch / Bootfs</text>
  <text x="770.434783" y="611.375393" text-anchor="middle" font-size="15.415749" fill="var(--ok-accent)" font-family="Arial, sans-serif">(shared across all images on this host)</text>
  <rect x="40" y="40" width="260.869565" height="60.371717" rx="8.187237" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.434783" y="65.873555" text-anchor="middle" font-size="16.601397" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Writable (container)</text>
  <text x="170.434783" y="87.435006" text-anchor="middle" font-size="14.229964" fill="var(--danger-accent)" font-family="Arial, sans-serif">Created at runtime</text>
  <rect x="40" y="117.620798" width="260.869565" height="43.12277" rx="8.187237" fill="var(--primary-accent)" />
  <text x="170.434783" y="144.572479" text-anchor="middle" font-size="16.601397" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Read-only (image)</text>
  <rect x="40" y="177.992649" width="260.869565" height="43.12277" rx="8.187237" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.434783" y="204.944196" text-anchor="middle" font-size="16.601397" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Shared bootfs</text>
  <text x="1240" y="190.929493" font-size="16.601397" fill="var(--text-muted)" font-family="Arial, sans-serif">Each layer is a</text>
  <text x="1240" y="210.334692" font-size="16.601397" fill="var(--text-muted)" font-family="Arial, sans-serif">content-addressed</text>
  <text x="1240" y="229.739892" font-size="16.601397" fill="var(--text-muted)" font-family="Arial, sans-serif">diff snapshot</text>
  <text x="1240" y="266.394039" font-size="16.601397" fill="var(--text-muted)" font-family="Arial, sans-serif">Layers are cached</text>
  <text x="1240" y="285.799238" font-size="16.601397" fill="var(--text-muted)" font-family="Arial, sans-serif">and reused across</text>
  <text x="1240" y="305.204438" font-size="16.601397" fill="var(--text-muted)" font-family="Arial, sans-serif">images on host</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <circle cx="640" cy="330" r="128.9007" fill="var(--primary-fill)" />
  <text x="640" y="355.0961" text-anchor="middle" fill="var(--bg)" font-weight="bold">K8s</text>
  <circle cx="329.6552" cy="129.2308" r="85.9338" fill="var(--primary-fill)" />
  <text x="329.6552" y="141.7789" text-anchor="middle" fill="var(--bg)" font-size="25.7801">Helm</text>
  <circle cx="950.3448" cy="129.2308" r="85.9338" fill="var(--primary-fill)" />
  <text x="950.3448" y="141.7789" text-anchor="middle" fill="var(--bg)" font-size="25.7801">Istio</text>
  <circle cx="329.6552" cy="530.7692" r="85.9338" fill="var(--ok-fill)" />
  <text x="329.6552" y="543.3173" text-anchor="middle" fill="var(--bg)" font-size="25.7801">Prometheus</text>
  <circle cx="950.3448" cy="530.7692" r="85.9338" fill="var(--ok-fill)" />
  <text x="950.3448" y="543.3173" text-anchor="middle" fill="var(--bg)" font-size="25.7801">Grafana</text>
  <circle cx="122.7586" cy="330" r="85.9338" fill="var(--warn-fill)" />
  <text x="122.7586" y="342.5481" text-anchor="middle" font-size="25.7801">ArgoCD</text>
  <circle cx="1157.2414" cy="330" r="85.9338" fill="var(--warn-fill)" />
  <text x="1157.2414" y="342.5481" text-anchor="middle" font-size="25.7801">Flux</text>
  <line x1="205.5172" y1="330" x2="515.8621" y2="330" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="764.1379" y1="330" x2="1074.4828" y2="330" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="391.7242" y1="204.5192" x2="557.2414" y2="254.7116" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="888.2758" y1="204.5192" x2="722.7586" y2="254.7116" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="391.7242" y1="455.4808" x2="557.2414" y2="405.2884" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="888.2758" y1="455.4808" x2="722.7586" y2="405.2884" stroke="var(--text-muted)" stroke-width="2" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <circle cx="640" cy="330" r="115.3846" fill="var(--primary-fill)" />
  <text x="640" y="351.6346" text-anchor="middle" fill="var(--bg)" font-weight="bold">K8s</text>
  <circle cx="351.5385" cy="156.9231" r="76.9231" fill="var(--primary-fill)" />
  <text x="351.5385" y="167.7404" text-anchor="middle" fill="var(--bg)" font-size="23.0769">Helm</text>
  <circle cx="928.4615" cy="156.9231" r="76.9231" fill="var(--primary-fill)" />
  <text x="928.4615" y="167.7404" text-anchor="middle" fill="var(--bg)" font-size="23.0769">Istio</text>
  <circle cx="351.5385" cy="503.0769" r="76.9231" fill="var(--ok-fill)" />
  <text x="351.5385" y="513.8942" text-anchor="middle" fill="var(--bg)" font-size="23.0769">Prometheus</text>
  <circle cx="928.4615" cy="503.0769" r="76.9231" fill="var(--ok-fill)" />
  <text x="928.4615" y="513.8942" text-anchor="middle" fill="var(--bg)" font-size="23.0769">Grafana</text>
  <circle cx="159.2308" cy="330" r="76.9231" fill="var(--warn-fill)" />
  <text x="159.2308" y="340.8173" text-anchor="middle" font-size="23.0769">ArgoCD</text>
  <circle cx="1120.7692" cy="330" r="76.9231" fill="var(--warn-fill)" />
  <text x="1120.7692" y="340.8173" text-anchor="middle" font-size="23.0769">Flux</text>
  <line x1="236.1538" y1="330" x2="524.6154" y2="330" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="755.3846" y1="330" x2="1043.8462" y2="330" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="409.2308" y1="221.8269" x2="563.0769" y2="265.0962" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="870.7692" y1="221.8269" x2="716.9231" y2="265.0962" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="409.2308" y1="438.1731" x2="563.0769" y2="394.9038" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="870.7692" y1="438.1731" x2="716.9231" y2="394.9038" stroke="var(--text-muted)" stroke-width="2" />
</svg>
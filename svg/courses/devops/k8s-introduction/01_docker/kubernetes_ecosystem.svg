  <text x="948.236843" y="139.0038" text-anchor="middle" fill="var(--bg)" font-size="25.881089">Istio</text>
  <rect x="245.491829" y="447.459" width="172.540856" height="172.541" rx="13.999994" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="331.762157" y="546.4624" text-anchor="middle" fill="var(--bg)" font-size="25.881089">Prometheus</text>
  <rect x="861.966315" y="447.459" width="172.540856" height="172.541" rx="13.999994" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="948.236843" y="546.4624" text-anchor="middle" fill="var(--bg)" font-size="25.881089">Grafana</text>
  <rect x="40" y="243.729" width="172.540856" height="172.541" rx="13.999994" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="126.270528" y="342.733" text-anchor="middle" font-size="25.881089">ArgoCD</text>
  <rect x="1067.459144" y="243.729" width="172.540856" height="172.541" rx="13.999994" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="1153.728472" y="342.733" text-anchor="middle" font-size="25.881089">Flux</text>
  <line x1="208.46706" y1="330" x2="516.704503" y2="330" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="763.294497" y1="330" x2="1071.53194" y2="330" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="393.409705" y1="202.6692" x2="557.802868" y2="253.6017" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="886.589295" y1="202.6692" x2="722.196132" y2="253.6017" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="393.409705" y1="457.3308" x2="557.802868" y2="406.3983" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="886.589295" y1="457.3308" x2="722.196132" y2="406.3983" stroke="var(--text-muted)" stroke-width="2" />
</svg>
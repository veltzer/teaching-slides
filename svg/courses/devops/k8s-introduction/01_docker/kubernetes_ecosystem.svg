<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <circle cx="640" cy="330" r="129.2981" fill="var(--primary-fill)" />
  <text x="640" y="355.3847" text-anchor="middle" fill="var(--bg)" font-weight="bold">K8s</text>
  <circle cx="331.2889" cy="126.922" r="86.1987" fill="var(--primary-fill)" />
  <text x="331.2889" y="139.6144" text-anchor="middle" fill="var(--bg)" font-size="25.8596">Helm</text>
  <circle cx="948.7111" cy="126.922" r="86.1987" fill="var(--primary-fill)" />
  <text x="948.7111" y="139.6144" text-anchor="middle" fill="var(--bg)" font-size="25.8596">Istio</text>
  <circle cx="331.2889" cy="533.078" r="86.1987" fill="var(--ok-fill)" />
  <text x="331.2889" y="545.7704" text-anchor="middle" fill="var(--bg)" font-size="25.8596">Prometheus</text>
  <circle cx="948.7111" cy="533.078" r="86.1987" fill="var(--ok-fill)" />
  <text x="948.7111" y="545.7704" text-anchor="middle" fill="var(--bg)" font-size="25.8596">Grafana</text>
  <circle cx="125.4814" cy="330" r="86.1987" fill="var(--warn-fill)" />
  <text x="125.4814" y="342.6924" text-anchor="middle" font-size="25.8596">ArgoCD</text>
  <circle cx="1154.5186" cy="330" r="86.1987" fill="var(--warn-fill)" />
  <text x="1154.5186" y="342.6924" text-anchor="middle" font-size="25.8596">Flux</text>
  <line x1="207.8044" y1="330" x2="516.5156" y2="330" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="763.4844" y1="330" x2="1072.1956" y2="330" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="393.0312" y1="203.0762" x2="557.6771" y2="253.8458" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="886.9688" y1="203.0762" x2="722.3229" y2="253.8458" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="393.0312" y1="456.9238" x2="557.6771" y2="406.1542" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="886.9688" y1="456.9238" x2="722.3229" y2="406.1542" stroke="var(--text-muted)" stroke-width="2" />
</svg>
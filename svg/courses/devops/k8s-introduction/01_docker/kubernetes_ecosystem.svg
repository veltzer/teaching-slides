<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="510.593608" y="200.594" width="258.811784" height="258.812" rx="13.999994" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="639.9995" y="355.4661" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">K8s</text>
  <rect x="245.491829" y="40" width="172.540856" height="172.541" rx="13.999994" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="331.762157" y="139.0038" text-anchor="middle" fill="var(--bg)" font-size="25.881089" font-family="Arial, sans-serif">Helm</text>
  <rect x="861.966315" y="40" width="172.540856" height="172.541" rx="13.999994" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="948.236843" y="139.0038" text-anchor="middle" fill="var(--bg)" font-size="25.881089" font-family="Arial, sans-serif">Istio</text>
  <rect x="245.491829" y="447.459" width="172.540856" height="172.541" rx="13.999994" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="331.762157" y="546.4624" text-anchor="middle" fill="var(--bg)" font-size="25.881089" font-family="Arial, sans-serif">Prometheus</text>
  <rect x="861.966315" y="447.459" width="172.540856" height="172.541" rx="13.999994" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="948.236843" y="546.4624" text-anchor="middle" fill="var(--bg)" font-size="25.881089" font-family="Arial, sans-serif">Grafana</text>
  <rect x="40" y="243.729" width="172.540856" height="172.541" rx="13.999994" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="126.270528" y="342.733" text-anchor="middle" font-size="25.881089" font-family="Arial, sans-serif" fill="var(--warn-text)">ArgoCD</text>
  <rect x="1067.459144" y="243.729" width="172.540856" height="172.541" rx="13.999994" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="1153.728472" y="342.733" text-anchor="middle" font-size="25.881089" font-family="Arial, sans-serif" fill="var(--warn-text)">Flux</text>
  <line x1="208.46706" y1="330" x2="516.704503" y2="330" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="763.294497" y1="330" x2="1071.53194" y2="330" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="393.409705" y1="202.6692" x2="557.802868" y2="253.6017" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="886.589295" y1="202.6692" x2="722.196132" y2="253.6017" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="393.409705" y1="457.3308" x2="557.802868" y2="406.3983" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="886.589295" y1="457.3308" x2="722.196132" y2="406.3983" stroke="var(--text-muted)" stroke-width="2"/>
</svg>

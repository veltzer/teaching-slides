  <text x="380.000159444449" y="148.749934375005" text-anchor="middle" fill="var(--bg)" font-size="21.674943530487" font-family="Arial, sans-serif">Scheduler</text>
  <rect x="60.000050555557" y="185" width="200.00003888889" height="54.375032812498" fill="url(#grad-primary)" rx="7.424620985551" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160.000070000002" y="221.249934375005" text-anchor="middle" fill="var(--bg)" font-size="21.674943530487" font-family="Arial, sans-serif">Controller</text>

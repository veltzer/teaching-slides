  <text x="380.000159444449" y="221.249934375005" text-anchor="middle" fill="var(--bg)" font-size="21.674943530487" font-family="Arial, sans-serif">etcd</text>
  <rect x="740.000019444445" y="40" width="499.999980555555" height="271.874901562509" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.424620985551" filter="url(#shadow)"/>
  <text x="990.000126388892" y="85.312483593751" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Worker Node</text>

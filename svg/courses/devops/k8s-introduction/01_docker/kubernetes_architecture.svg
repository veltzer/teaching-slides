  <text x="426.6667" y="256" text-anchor="middle" fill="var(--bg)" font-size="17.0667">etcd</text>
  <rect x="711.1111" y="113.7778" width="395.0617" height="213.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="908.642" y="149.3333" text-anchor="middle" font-weight="bold">Worker Node</text>
  <rect x="726.9136" y="170.6667" width="158.0247" height="42.6667" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="805.9259" y="199.1111" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Kubelet</text>
  <rect x="900.7407" y="170.6667" width="189.6296" height="42.6667" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="995.5556" y="199.1111" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Container Runtime</text>
  <rect x="726.9136" y="227.5556" width="158.0247" height="42.6667" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="805.9259" y="256" text-anchor="middle" fill="var(--bg)" font-size="17.0667">Kube-proxy</text>
  <rect x="158.0247" y="398.2222" width="948.1481" height="170.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="632.0988" y="433.7778" text-anchor="middle" font-weight="bold">Application Pods</text>
  <circle cx="316.0494" cy="497.7778" r="42.6667" fill="var(--warn-fill)" />
  <text x="316.0494" y="504.8889" text-anchor="middle">Pod</text>

  <text x="1100.000112777781" y="148.749934375005" text-anchor="middle" fill="var(--bg)" font-size="21.674943530487" font-family="Arial, sans-serif">Container Runtime</text>
  <rect x="760.000070000002" y="185" width="200.00003888889" height="54.375032812498" fill="url(#grad-ok)" rx="7.424620985551" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860.000089444447" y="221.249934375005" text-anchor="middle" fill="var(--bg)" font-size="21.674943530487" font-family="Arial, sans-serif">Kube-proxy</text>

  <text x="632.0988" y="504.8889" text-anchor="middle">Pod</text>
  <circle cx="790.1235" cy="497.7778" r="42.6667" fill="var(--warn-fill)" />
  <text x="790.1235" y="504.8889" text-anchor="middle">Pod</text>
  <circle cx="948.1481" cy="497.7778" r="42.6667" fill="var(--warn-fill)" />
  <text x="948.1481" y="504.8889" text-anchor="middle">Pod</text>
</svg>
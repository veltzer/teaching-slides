  <text x="417.143" y="191.9047" text-anchor="middle" fill="var(--bg)" font-size="17.516">Scheduler</text>
  <rect x="142.8572" y="219.5238" width="171.4286" height="41.4286" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="228.5715" y="247.1428" text-anchor="middle" fill="var(--bg)" font-size="17.516">Controller</text>
  <rect x="331.4286" y="219.5238" width="171.4286" height="41.4286" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="417.143" y="247.1428" text-anchor="middle" fill="var(--bg)" font-size="17.516">etcd</text>
  <rect x="725.7143" y="109.0476" width="428.5714" height="207.1428" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="940.0001" y="143.5714" text-anchor="middle" font-weight="bold">Worker Node</text>
  <rect x="742.8572" y="164.2857" width="171.4286" height="41.4286" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="828.5715" y="191.9047" text-anchor="middle" fill="var(--bg)" font-size="17.516">Kubelet</text>
  <rect x="931.4286" y="164.2857" width="205.7143" height="41.4286" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1034.2858" y="191.9047" text-anchor="middle" fill="var(--bg)" font-size="17.516">Container Runtime</text>
  <rect x="742.8572" y="219.5238" width="171.4286" height="41.4286" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="828.5715" y="247.1428" text-anchor="middle" fill="var(--bg)" font-size="17.516">Kube-proxy</text>
  <rect x="125.7143" y="385.2381" width="1028.5714" height="165.7143" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="640.0001" y="419.7619" text-anchor="middle" font-weight="bold">Application Pods</text>
  <circle cx="297.1429" cy="481.9048" r="43.7899" fill="var(--warn-fill)" />
  <text x="297.1429" y="488.8095" text-anchor="middle">Pod</text>
  <circle cx="468.5715" cy="481.9048" r="43.7899" fill="var(--warn-fill)" />
  <text x="468.5715" y="488.8095" text-anchor="middle">Pod</text>
  <circle cx="640.0001" cy="481.9048" r="43.7899" fill="var(--warn-fill)" />
  <text x="640.0001" y="488.8095" text-anchor="middle">Pod</text>
  <circle cx="811.4287" cy="481.9048" r="43.7899" fill="var(--warn-fill)" />
  <text x="811.4287" y="488.8095" text-anchor="middle">Pod</text>
  <circle cx="982.8572" cy="481.9048" r="43.7899" fill="var(--warn-fill)" />
  <text x="982.8572" y="488.8095" text-anchor="middle">Pod</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="67.619" width="1200" height="552.381" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640.0001" y="40" text-anchor="middle" font-size="26.2739" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Kubernetes Architecture</text>
  <rect x="125.7143" y="109.0476" width="428.5714" height="207.1428" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="340.0001" y="143.5714" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Control Plane</text>
  <rect x="142.8572" y="164.2857" width="171.4286" height="41.4286" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5715" y="191.9047" text-anchor="middle" fill="var(--bg)" font-size="17.516" font-family="Arial, sans-serif">API Server</text>
  <rect x="331.4286" y="164.2857" width="171.4286" height="41.4286" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="417.143" y="191.9047" text-anchor="middle" fill="var(--bg)" font-size="17.516" font-family="Arial, sans-serif">Scheduler</text>
  <rect x="142.8572" y="219.5238" width="171.4286" height="41.4286" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5715" y="247.1428" text-anchor="middle" fill="var(--bg)" font-size="17.516" font-family="Arial, sans-serif">Controller</text>
  <rect x="331.4286" y="219.5238" width="171.4286" height="41.4286" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="417.143" y="247.1428" text-anchor="middle" fill="var(--bg)" font-size="17.516" font-family="Arial, sans-serif">etcd</text>
  <rect x="725.7143" y="109.0476" width="428.5714" height="207.1428" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="940.0001" y="143.5714" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Worker Node</text>
  <rect x="742.8572" y="164.2857" width="171.4286" height="41.4286" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.5715" y="191.9047" text-anchor="middle" fill="var(--bg)" font-size="17.516" font-family="Arial, sans-serif">Kubelet</text>
  <rect x="931.4286" y="164.2857" width="205.7143" height="41.4286" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1034.2858" y="191.9047" text-anchor="middle" fill="var(--bg)" font-size="17.516" font-family="Arial, sans-serif">Container Runtime</text>
  <rect x="742.8572" y="219.5238" width="171.4286" height="41.4286" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.5715" y="247.1428" text-anchor="middle" fill="var(--bg)" font-size="17.516" font-family="Arial, sans-serif">Kube-proxy</text>
  <rect x="125.7143" y="385.2381" width="1028.5714" height="165.7143" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="419.7619" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Application Pods</text>
  <rect x="253.353" y="438.115" width="87.5798" height="87.5798" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="297.1429" y="488.8095" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>
  <rect x="424.782" y="438.115" width="87.5798" height="87.5798" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="468.5715" y="488.8095" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>
  <rect x="596.21" y="438.115" width="87.5798" height="87.5798" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="640.0001" y="488.8095" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>
  <rect x="767.639" y="438.115" width="87.5798" height="87.5798" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="811.4287" y="488.8095" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>
  <rect x="939.067" y="438.115" width="87.5798" height="87.5798" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="982.8572" y="488.8095" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Pod</text>
</svg>

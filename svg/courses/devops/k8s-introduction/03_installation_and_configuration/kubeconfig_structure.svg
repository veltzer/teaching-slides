  <ns0:rect x="67.5556" y="174.2222" width="238.2222" height="32" rx="4.4444" fill="var(--primary-tint)" />
  <ns0:text x="186.6667" y="187.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--primary-deep)">- name: dev-cluster</ns0:text>
  <ns0:text x="186.6667" y="202.6667" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--primary-deep)">  server: https://localhost:8443</ns0:text>
  <ns0:rect x="53.3333" y="234.6667" width="266.6667" height="115.5556" rx="7.1111" fill="var(--ok-pale)" stroke="var(--ok-mid)" stroke-width="1.3333" filter="url(#shadow)" />

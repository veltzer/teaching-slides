  <ns0:text x="897.7778" y="206.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Resulting API Request</ns0:text>
  <ns0:text x="728.8889" y="241.7778" font-family="monospace" font-size="12.4444" fill="var(--primary-deeper)">Target:</ns0:text>
  <ns0:text x="728.8889" y="259.5556" font-family="monospace" font-size="11.5556" fill="var(--primary-indigo-dk)">  https://1.2.3.4:6443</ns0:text>
  <ns0:text x="728.8889" y="280.8889" font-family="monospace" font-size="12.4444" fill="var(--primary-deeper)">Auth (TLS cert):</ns0:text>
  <ns0:text x="728.8889" y="298.6667" font-family="monospace" font-size="11.5556" fill="var(--primary-indigo-dk)">  client-certificate-data</ns0:text>
  <ns0:text x="728.8889" y="320" font-family="monospace" font-size="12.4444" fill="var(--primary-deeper)">Namespace:</ns0:text>

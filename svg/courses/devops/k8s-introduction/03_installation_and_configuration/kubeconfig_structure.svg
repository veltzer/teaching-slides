<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="77.5" y="80.2777" width="318.75" height="451.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="77.5" y="80.2777" width="318.75" height="37.0556" rx="6" fill="var(--text-muted)" />
  <rect x="77.5" y="107.6667" width="318.75" height="9.6667" fill="var(--text-muted)" rx="6"/>
  <text x="236.875" y="106.0556" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">~/.kube/config</text>
  <rect x="96.25" y="133.4444" width="281.25" height="104.7223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="236.875" y="151.1667" text-anchor="middle" font-family="monospace" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">clusters:</text>
  <rect x="111.25" y="159.2223" width="251.25" height="32.2223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="236.875" y="171.3056" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">- name: prod-cluster</text>
  <text x="236.875" y="185" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">  server: https://1.2.3.4:6443</text>
  <rect x="111.25" y="197.8889" width="251.25" height="29" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="236.875" y="209.9723" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">- name: dev-cluster</text>
  <text x="236.875" y="223.6667" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">  server: https://localhost:8443</text>
  <rect x="96.25" y="252.6667" width="281.25" height="104.7223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="236.875" y="270.3889" text-anchor="middle" font-family="monospace" font-size="13.0354" font-weight="bold" fill="var(--ok-accent)">users:</text>
  <rect x="111.25" y="278.4444" width="251.25" height="32.2223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="236.875" y="290.5277" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--ok-accent)">- name: admin</text>
  <text x="236.875" y="304.2223" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--ok-accent)">  client-certificate-data: ...</text>
  <rect x="111.25" y="317.1111" width="251.25" height="29" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="236.875" y="329.1944" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--ok-accent)">- name: dev-user</text>
  <text x="236.875" y="342.8889" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--ok-accent)">  token: eyJhbGci...</text>
  <rect x="96.25" y="371.8889" width="281.25" height="104.7223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="236.875" y="389.6111" text-anchor="middle" font-family="monospace" font-size="13.0354" font-weight="bold" fill="var(--warn-accent)">contexts:</text>
  <rect x="111.25" y="397.6667" width="251.25" height="41.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="236.875" y="410.5556" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--danger-accent)">- name: prod-admin</text>
  <text x="236.875" y="423.4444" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--danger-accent)">  cluster: prod-cluster</text>
  <text x="236.875" y="436.3333" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--danger-accent)">  user: admin</text>
  <rect x="111.25" y="446" width="251.25" height="24.1667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="236.875" y="462.9167" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--danger-accent)">- name: dev-context  user: dev-user</text>
  <rect x="96.25" y="487.8889" width="281.25" height="32.2223" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="236.875" y="500.7777" text-anchor="middle" font-family="monospace" font-size="11.2974" font-weight="bold" fill="var(--danger-accent)">current-context:</text>
  <text x="236.875" y="514.4723" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--danger-accent)">prod-admin</text>
  <rect x="508.7499" y="273.6111" width="187.5" height="64.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="602.5" y="301.8056" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.1186" font-weight="bold" fill="var(--bg)">kubectl</text>
  <text x="602.5" y="323.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--primary-accent)">reads kubeconfig</text>
  <line x1="396.25" y1="504" x2="508.7499" y2="504" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <text x="452.5" y="495.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">selects</text>
  <line x1="602.5" y1="273.6111" x2="405.625" y2="217.2223" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="518.125" y="239.7777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--warn-accent)">cluster ref</text>
  <line x1="602.5" y1="338.0556" x2="405.625" y2="338.0556" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="447.8125" y="331.6111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--warn-accent)">user ref</text>
  <rect x="790" y="201.1111" width="393.75" height="257.7777" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="790" y="201.1111" width="393.75" height="37.0556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="790" y="228.5" width="393.75" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="986.875" y="226.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="15.6425" font-weight="bold" fill="var(--bg)">Resulting API Request</text>
  <text x="808.75" y="259.1111" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">Target:</text>
  <text x="808.75" y="275.2223" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">  https://1.2.3.4:6443</text>
  <text x="808.75" y="294.5556" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">Auth (TLS cert):</text>
  <text x="808.75" y="310.6667" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">  client-certificate-data</text>
  <text x="808.75" y="330" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">Namespace:</text>
  <text x="808.75" y="346.1111" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">  default (or context ns)</text>
  <text x="808.75" y="365.4444" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">Command:</text>
  <text x="808.75" y="381.5556" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">  GET /api/v1/pods</text>
  <text x="808.75" y="400.8889" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">kubectl config use-context:</text>
  <text x="808.75" y="417" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">  switches current-context field</text>
  <line x1="696.25" y1="305.8333" x2="790" y2="305.8333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="543.4723" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" fill="var(--text-muted)">A context binds a cluster + user + (optional) namespace. kubectl uses current-context to know where to connect.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- kubeconfig file box -->
  <rect x="40" y="50" width="340" height="560" rx="12" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="50" width="340" height="46" rx="12" fill="#546e7a"/>
  <rect x="40" y="84" width="340" height="12" fill="#546e7a"/>
  <text x="210" y="82" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#fff">~/.kube/config</text>

  <!-- clusters[] -->
  <rect x="60" y="116" width="300" height="130" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="138" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#1565c0">clusters:</text>
  <rect x="76" y="148" width="268" height="40" rx="5" fill="#bbdefb"/>
  <text x="210" y="163" text-anchor="middle" font-family="monospace" font-size="12" fill="#0d47a1">- name: prod-cluster</text>
  <text x="210" y="180" text-anchor="middle" font-family="monospace" font-size="12" fill="#0d47a1">  server: https://1.2.3.4:6443</text>
  <rect x="76" y="196" width="268" height="36" rx="5" fill="#90caf9"/>
  <text x="210" y="211" text-anchor="middle" font-family="monospace" font-size="12" fill="#0d47a1">- name: dev-cluster</text>
  <text x="210" y="228" text-anchor="middle" font-family="monospace" font-size="12" fill="#0d47a1">  server: https://localhost:8443</text>

  <!-- users[] -->
  <rect x="60" y="264" width="300" height="130" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="286" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#388e3c">users:</text>
  <rect x="76" y="296" width="268" height="40" rx="5" fill="#c8e6c9"/>
  <text x="210" y="311" text-anchor="middle" font-family="monospace" font-size="12" fill="#1b5e20">- name: admin</text>
  <text x="210" y="328" text-anchor="middle" font-family="monospace" font-size="12" fill="#1b5e20">  client-certificate-data: ...</text>
  <rect x="76" y="344" width="268" height="36" rx="5" fill="#a5d6a7"/>
  <text x="210" y="359" text-anchor="middle" font-family="monospace" font-size="12" fill="#1b5e20">- name: dev-user</text>
  <text x="210" y="376" text-anchor="middle" font-family="monospace" font-size="12" fill="#1b5e20">  token: eyJhbGci...</text>

  <!-- contexts[] -->
  <rect x="60" y="412" width="300" height="130" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="434" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#e65100">contexts:</text>
  <rect x="76" y="444" width="268" height="52" rx="5" fill="#ffe0b2"/>
  <text x="210" y="460" text-anchor="middle" font-family="monospace" font-size="12" fill="#bf360c">- name: prod-admin</text>
  <text x="210" y="476" text-anchor="middle" font-family="monospace" font-size="12" fill="#bf360c">  cluster: prod-cluster</text>
  <text x="210" y="492" text-anchor="middle" font-family="monospace" font-size="12" fill="#bf360c">  user: admin</text>
  <rect x="76" y="504" width="268" height="30" rx="5" fill="#ffcc80"/>
  <text x="210" y="525" text-anchor="middle" font-family="monospace" font-size="12" fill="#bf360c">- name: dev-context  user: dev-user</text>

  <!-- current-context -->
  <rect x="60" y="556" width="300" height="40" rx="8" fill="#fce4ec" stroke="#e91e63" stroke-width="2"/>
  <text x="210" y="572" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#880e4f">current-context:</text>
  <text x="210" y="589" text-anchor="middle" font-family="monospace" font-size="13" fill="#c2185b">prod-admin</text>

  <!-- kubectl box -->
  <rect x="500" y="290" width="200" height="80" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="600" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#fff">kubectl</text>
  <text x="600" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#bbdefb">reads kubeconfig</text>

  <!-- Arrow: current-context to context box -->
  <line x1="380" y1="576" x2="500" y2="576" stroke="#e91e63" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="440" y="566" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e91e63">selects</text>

  <!-- Context lookup arrows to clusters/users -->
  <line x1="600" y1="290" x2="390" y2="220" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="248" font-family="Arial,sans-serif" font-size="12" fill="#e65100">cluster ref</text>
  <line x1="600" y1="370" x2="390" y2="370" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="435" y="362" font-family="Arial,sans-serif" font-size="12" fill="#e65100">user ref</text>

  <!-- Resulting API call -->
  <rect x="800" y="200" width="420" height="320" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2" filter="url(#shadow)"/>
  <rect x="800" y="200" width="420" height="46" rx="12" fill="#3949ab"/>
  <rect x="800" y="234" width="420" height="12" fill="#3949ab"/>
  <text x="1010" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">Resulting API Request</text>

  <text x="820" y="272" font-family="monospace" font-size="14" fill="#1a237e">Target:</text>
  <text x="820" y="292" font-family="monospace" font-size="13" fill="#283593">  https://1.2.3.4:6443</text>
  <text x="820" y="316" font-family="monospace" font-size="14" fill="#1a237e">Auth (TLS cert):</text>
  <text x="820" y="336" font-family="monospace" font-size="13" fill="#283593">  client-certificate-data</text>
  <text x="820" y="360" font-family="monospace" font-size="14" fill="#1a237e">Namespace:</text>
  <text x="820" y="380" font-family="monospace" font-size="13" fill="#283593">  default (or context ns)</text>
  <text x="820" y="404" font-family="monospace" font-size="14" fill="#1a237e">Command:</text>
  <text x="820" y="424" font-family="monospace" font-size="13" fill="#283593">  GET /api/v1/pods</text>
  <text x="820" y="448" font-family="monospace" font-size="14" fill="#1a237e">kubectl config use-context:</text>
  <text x="820" y="468" font-family="monospace" font-size="13" fill="#283593">  switches current-context field</text>

  <!-- Arrow kubectl to API request -->
  <line x1="700" y1="330" x2="800" y2="330" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Bottom note -->
  <text x="640" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#555">A context binds a cluster + user + (optional) namespace. kubectl uses current-context to know where to connect.</text>
</svg>

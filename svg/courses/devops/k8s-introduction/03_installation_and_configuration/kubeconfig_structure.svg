  <ns0:text x="728.8889" y="359.1111" font-family="monospace" font-size="12.4444" fill="var(--primary-deeper)">Command:</ns0:text>
  <ns0:text x="728.8889" y="376.8889" font-family="monospace" font-size="11.5556" fill="var(--primary-indigo-dk)">  GET /api/v1/pods</ns0:text>
  <ns0:text x="728.8889" y="398.2222" font-family="monospace" font-size="12.4444" fill="var(--primary-deeper)">kubectl config use-context:</ns0:text>
  <ns0:text x="728.8889" y="416" font-family="monospace" font-size="11.5556" fill="var(--primary-indigo-dk)">  switches current-context field</ns0:text>
  <ns0:line x1="622.2222" y1="293.3333" x2="711.1111" y2="293.3333" stroke="var(--primary-dk)" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <ns0:text x="568.8889" y="555.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text-muted)">A context binds a cluster + user + (optional) namespace. kubectl uses current-context to know where to connect.</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="345.762712" height="564.869362" rx="6.992742" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="40" width="345.762712" height="46.40004" rx="6.992742" fill="var(--text-muted)" />
  <rect x="40" y="74.29578" width="345.762712" height="12.104386" fill="var(--text-muted)" rx="6.992742"/>
  <text x="212.881356" y="72.278403" text-anchor="middle" font-family="monospace" font-size="18.23066" font-weight="bold" fill="var(--bg)">~/.kube/config</text>
  <rect x="60.338983" y="106.573932" width="305.084746" height="131.130488" rx="6.992742" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="212.881356" y="128.765327" text-anchor="middle" font-family="monospace" font-size="15.192197" font-weight="bold" fill="var(--primary-accent)">clusters:</text>
  <rect x="76.610169" y="138.852335" width="272.542373" height="40.34791" rx="6.992742" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.881356" y="153.982723" text-anchor="middle" font-family="monospace" font-size="12.153851" fill="var(--primary-accent)">- name: prod-cluster</text>
  <text x="212.881356" y="171.130488" text-anchor="middle" font-family="monospace" font-size="12.153851" fill="var(--primary-accent)">  server: https://1.2.3.4:6443</text>
  <rect x="76.610169" y="187.269627" width="272.542373" height="36.313031" rx="6.992742" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.881356" y="202.40014" text-anchor="middle" font-family="monospace" font-size="12.153851" fill="var(--primary-accent)">- name: dev-cluster</text>
  <text x="212.881356" y="219.547905" text-anchor="middle" font-family="monospace" font-size="12.153851" fill="var(--primary-accent)">  server: https://localhost:8443</text>
  <rect x="60.338983" y="255.860936" width="305.084746" height="131.130488" rx="6.992742" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="212.881356" y="278.052205" text-anchor="middle" font-family="monospace" font-size="15.192197" font-weight="bold" fill="var(--ok-accent)">users:</text>
  <rect x="76.610169" y="288.139089" width="272.542373" height="40.34791" rx="6.992742" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.881356" y="303.269477" text-anchor="middle" font-family="monospace" font-size="12.153851" fill="var(--ok-accent)">- name: admin</text>
  <text x="212.881356" y="320.417492" text-anchor="middle" font-family="monospace" font-size="12.153851" fill="var(--ok-accent)">  client-certificate-data: ...</text>
  <rect x="76.610169" y="336.556506" width="272.542373" height="36.313031" rx="6.992742" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.881356" y="351.686894" text-anchor="middle" font-family="monospace" font-size="12.153851" fill="var(--ok-accent)">- name: dev-user</text>
  <text x="212.881356" y="368.834783" text-anchor="middle" font-family="monospace" font-size="12.153851" fill="var(--ok-accent)">  token: eyJhbGci...</text>
  <rect x="60.338983" y="405.147815" width="305.084746" height="131.130488" rx="6.992742" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="212.881356" y="427.339084" text-anchor="middle" font-family="monospace" font-size="15.192197" font-weight="bold" fill="var(--warn-accent)">contexts:</text>
  <rect x="76.610169" y="437.426093" width="272.542373" height="52.45217" rx="6.992742" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.881356" y="453.565232" text-anchor="middle" font-family="monospace" font-size="12.153851" fill="var(--danger-accent)">- name: prod-admin</text>
  <text x="212.881356" y="469.704245" text-anchor="middle" font-family="monospace" font-size="12.153851" fill="var(--danger-accent)">  cluster: prod-cluster</text>
  <text x="212.881356" y="485.843384" text-anchor="middle" font-family="monospace" font-size="12.153851" fill="var(--danger-accent)">  user: admin</text>
  <rect x="76.610169" y="497.94777" width="272.542373" height="30.260901" rx="6.992742" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.881356" y="519.130413" text-anchor="middle" font-family="monospace" font-size="12.153851" fill="var(--danger-accent)">- name: dev-context  user: dev-user</text>
  <rect x="60.338983" y="550.39994" width="305.084746" height="40.34791" rx="6.992742" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.881356" y="566.538954" text-anchor="middle" font-family="monospace" font-size="13.166633" font-weight="bold" fill="var(--danger-accent)">current-context:</text>
  <text x="212.881356" y="583.686969" text-anchor="middle" font-family="monospace" font-size="13.166633" fill="var(--danger-accent)">prod-admin</text>
  <rect x="507.796502" y="282.086959" width="203.389831" height="80.695569" rx="6.992742" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="609.491525" y="317.391364" text-anchor="middle" font-family="Arial,sans-serif" font-size="22.281905" font-weight="bold" fill="var(--bg)">kubectl</text>
  <text x="609.491525" y="344.626138" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.166633" fill="var(--primary-accent)">reads kubeconfig</text>
  <line x1="385.762712" y1="570.573832" x2="507.796502" y2="570.573832" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <text x="446.779661" y="560.486823" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.153851" fill="var(--danger-accent)">selects</text>
  <line x1="609.491525" y1="282.086959" x2="395.932203" y2="211.478398" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="517.966102" y="239.721672" font-family="Arial,sans-serif" font-size="12.153851" fill="var(--warn-accent)">cluster ref</text>
  <line x1="609.491525" y1="362.782653" x2="395.932203" y2="362.782653" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="441.694915" y="354.713021" font-family="Arial,sans-serif" font-size="12.153851" fill="var(--warn-accent)">user ref</text>
  <rect x="812.881356" y="191.30438" width="427.118644" height="322.782403" rx="6.992742" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="812.881356" y="191.30438" width="427.118644" height="46.40004" rx="6.992742" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="812.881356" y="225.600035" width="427.118644" height="12.104386" fill="var(--primary-fill)" rx="6.992742" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1026.440678" y="223.582658" text-anchor="middle" font-family="Arial,sans-serif" font-size="18.23066" font-weight="bold" fill="var(--bg)">Resulting API Request</text>
  <text x="833.220339" y="263.930443" font-family="monospace" font-size="14.179299" fill="var(--primary-accent)">Target:</text>
  <text x="833.220339" y="284.104461" font-family="monospace" font-size="13.166633" fill="var(--primary-accent)">  https://1.2.3.4:6443</text>
  <text x="833.220339" y="308.313106" font-family="monospace" font-size="14.179299" fill="var(--primary-accent)">Auth (TLS cert):</text>
  <text x="833.220339" y="328.486999" font-family="monospace" font-size="13.166633" fill="var(--primary-accent)">  client-certificate-data</text>
  <text x="833.220339" y="352.695645" font-family="monospace" font-size="14.179299" fill="var(--primary-accent)">Namespace:</text>
  <text x="833.220339" y="372.869537" font-family="monospace" font-size="13.166633" fill="var(--primary-accent)">  default (or context ns)</text>
  <text x="833.220339" y="397.078183" font-family="monospace" font-size="14.179299" fill="var(--primary-accent)">Command:</text>
  <text x="833.220339" y="417.2522" font-family="monospace" font-size="13.166633" fill="var(--primary-accent)">  GET /api/v1/pods</text>
  <text x="833.220339" y="441.460846" font-family="monospace" font-size="14.179299" fill="var(--primary-accent)">kubectl config use-context:</text>
  <text x="833.220339" y="461.634738" font-family="monospace" font-size="13.166633" fill="var(--primary-accent)">  switches current-context field</text>
  <line x1="711.186441" y1="322.434743" x2="812.881356" y2="322.434743" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="650.169492" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.179299" fill="var(--text-muted)">A context binds a cluster + user + (optional) namespace. kubectl uses current-context to know where to connect.</text>
</svg>
  <ns0:text x="897.7778" y="206.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">Resulting API Request</ns0:text>
  <ns0:text x="728.8889" y="241.7778" font-family="monospace" font-size="12.4444" fill="#1a237e">Target:</ns0:text>
  <ns0:text x="728.8889" y="259.5556" font-family="monospace" font-size="11.5556" fill="#283593">  https://1.2.3.4:6443</ns0:text>
  <ns0:text x="728.8889" y="280.8889" font-family="monospace" font-size="12.4444" fill="#1a237e">Auth (TLS cert):</ns0:text>
  <ns0:text x="728.8889" y="298.6667" font-family="monospace" font-size="11.5556" fill="#283593">  client-certificate-data</ns0:text>
  <ns0:text x="728.8889" y="320" font-family="monospace" font-size="12.4444" fill="#1a237e">Namespace:</ns0:text>
  <ns0:text x="728.8889" y="337.7778" font-family="monospace" font-size="11.5556" fill="#283593">  default (or context ns)</ns0:text>
  <ns0:text x="728.8889" y="359.1111" font-family="monospace" font-size="12.4444" fill="#1a237e">Command:</ns0:text>
  <ns0:text x="728.8889" y="376.8889" font-family="monospace" font-size="11.5556" fill="#283593">  GET /api/v1/pods</ns0:text>
  <ns0:text x="728.8889" y="398.2222" font-family="monospace" font-size="12.4444" fill="#1a237e">kubectl config use-context:</ns0:text>
  <ns0:text x="728.8889" y="416" font-family="monospace" font-size="11.5556" fill="#283593">  switches current-context field</ns0:text>
  <ns0:line x1="622.2222" y1="293.3333" x2="711.1111" y2="293.3333" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <ns0:text x="568.8889" y="555.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" fill="#555">A context binds a cluster + user + (optional) namespace. kubectl uses current-context to know where to connect.</ns0:text>

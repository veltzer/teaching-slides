<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="374.999972656249" height="232" fill="url(#grad-warn)" rx="7.937254139893" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.500041015627" y="127" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">AWS</text>
  <text x="227.500041015627" y="199.499999999999" text-anchor="middle" font-size="30.778819528539" font-family="Arial, sans-serif" fill="var(--warn-text)">EKS</text>
  <text x="227.500041015627" y="242.999999999999" text-anchor="middle" font-size="24.183358200996" font-family="Arial, sans-serif" fill="var(--warn-text)">Elastic Kubernetes Service</text>
  <rect x="452.499958984373" y="40" width="374.999972656249" height="232" fill="url(#grad-primary)" rx="7.937254139893" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Google Cloud</text>
  <text x="640" y="199.499999999999" text-anchor="middle" fill="var(--bg)" font-size="30.778819528539" font-family="Arial, sans-serif">GKE</text>
  <text x="640" y="242.999999999999" text-anchor="middle" fill="var(--bg)" font-size="24.183358200996" font-family="Arial, sans-serif">Google Kubernetes Engine</text>
  <rect x="865.000027343752" y="40" width="374.999972656249" height="232" fill="var(--primary-accent)" rx="7.937254139893"/>
  <text x="1052.500068359378" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Azure</text>
  <text x="1052.500068359378" y="199.499999999999" text-anchor="middle" fill="var(--bg)" font-size="30.778819528539" font-family="Arial, sans-serif">AKS</text>
  <text x="1052.500068359378" y="242.999999999999" text-anchor="middle" fill="var(--bg)" font-size="24.183358200996" font-family="Arial, sans-serif">Azure Kubernetes Service</text>
  <rect x="227.500041015627" y="388" width="374.999972656249" height="232" fill="url(#grad-danger)" rx="7.937254139893" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="414.999972656249" y="475" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">DigitalOcean</text>
  <text x="414.999972656249" y="547.499999999999" text-anchor="middle" fill="var(--bg)" font-size="30.778819528539" font-family="Arial, sans-serif">DOKS</text>
  <rect x="640" y="388" width="374.999972656249" height="232" fill="var(--primary-accent)" rx="7.937254139893"/>
  <text x="827.500041015627" y="475" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">IBM Cloud</text>
  <text x="827.500041015627" y="547.499999999999" text-anchor="middle" fill="var(--bg)" font-size="30.778819528539" font-family="Arial, sans-serif">IKS</text>
</svg>

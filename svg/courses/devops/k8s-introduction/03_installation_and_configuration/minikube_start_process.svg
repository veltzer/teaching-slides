<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="327.2727" height="116.000066000003" fill="url(#grad-primary)" rx="6.292853251767" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="107.666723500003" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">1. Check Driver</text>
  <rect x="40" y="194.666718000003" width="327.2727" height="116.000066000003" fill="url(#grad-primary)" rx="6.292853251767" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="262.3333315" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">2. Create VM/Container</text>
  <rect x="40" y="349.333326" width="327.2727" height="116.000066000003" fill="url(#grad-primary)" rx="6.292853251767" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="416.999939499997" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">3. Configure Network</text>
  <rect x="40" y="503.999933999997" width="327.2727" height="116.000066000003" fill="url(#grad-primary)" rx="6.292853251767" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.6364" y="571.666547499994" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">4. Install Kubernetes</text>
  <rect x="476.3637" y="40" width="327.2727" height="116.000066000003" fill="url(#grad-ok)" rx="6.292853251767" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="107.666723500003" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">5. Start kubelet</text>
  <rect x="476.3637" y="194.666718000003" width="327.2727" height="116.000066000003" fill="url(#grad-ok)" rx="6.292853251767" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="262.3333315" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">6. Start API Server</text>
  <rect x="476.3637" y="349.333326" width="327.2727" height="116.000066000003" fill="url(#grad-ok)" rx="6.292853251767" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="416.999939499997" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">7. Start etcd</text>
  <rect x="476.3637" y="503.999933999997" width="327.2727" height="116.000066000003" fill="url(#grad-ok)" rx="6.292853251767" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="571.666547499994" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">8. Start Controllers</text>
  <rect x="912.7273" y="40" width="327.2727" height="116.000066000003" fill="url(#grad-warn)" rx="6.292853251767" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3637" y="107.666723500003" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">9. Configure kubectl</text>
  <rect x="912.7273" y="194.666718000003" width="327.2727" height="116.000066000003" fill="url(#grad-warn)" rx="6.292853251767" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3637" y="262.3333315" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">10. Verify Cluster</text>
  <rect x="912.7273" y="349.333326" width="327.2727" height="116.000066000003" fill="url(#grad-warn)" rx="6.292853251767" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3637" y="416.999939499997" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">11. Enable Addons</text>
  <rect x="912.7273" y="503.999933999997" width="327.2727" height="116.000066000003" fill="url(#grad-warn)" rx="6.292853251767" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.3637" y="571.666547499994" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">12. Ready!</text>
  <path d="M 367.2727 98.000033000002 L 465.4547 98.000033000002" stroke="var(--text-muted)" stroke-width="2.8764" marker-end="url(#arrow)"/>
  <path d="M 803.6364 98.000033000002 L 901.8182 98.000033000002" stroke="var(--text-muted)" stroke-width="2.8764" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

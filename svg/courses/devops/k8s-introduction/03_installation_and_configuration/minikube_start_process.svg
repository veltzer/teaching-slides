<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="575.2809" y="48.5393" text-anchor="middle" font-size="23.0112" font-weight="bold">Minikube Start Sequence</ns0:text>
  <ns0:rect x="71.9101" y="97.0787" width="215.7303" height="97.0787" fill="#4285f4" rx="7.191" />
  <ns0:text x="179.7753" y="153.7079" text-anchor="middle" fill="white">1. Check Driver</ns0:text>
  <ns0:rect x="71.9101" y="226.5169" width="215.7303" height="97.0787" fill="#4285f4" rx="7.191" />
  <ns0:text x="179.7753" y="283.1461" text-anchor="middle" fill="white">2. Create VM/Container</ns0:text>
  <ns0:rect x="71.9101" y="355.9551" width="215.7303" height="97.0787" fill="#4285f4" rx="7.191" />
  <ns0:text x="179.7753" y="412.5843" text-anchor="middle" fill="white">3. Configure Network</ns0:text>
  <ns0:rect x="71.9101" y="485.3933" width="215.7303" height="97.0787" fill="#4285f4" rx="7.191" />
  <ns0:text x="179.7753" y="542.0225" text-anchor="middle" fill="white">4. Install Kubernetes</ns0:text>
  <ns0:rect x="359.5506" y="97.0787" width="215.7303" height="97.0787" fill="#34a853" rx="7.191" />
  <ns0:text x="467.4157" y="153.7079" text-anchor="middle" fill="white">5. Start kubelet</ns0:text>
  <ns0:rect x="359.5506" y="226.5169" width="215.7303" height="97.0787" fill="#34a853" rx="7.191" />
  <ns0:text x="467.4157" y="283.1461" text-anchor="middle" fill="white">6. Start API Server</ns0:text>
  <ns0:rect x="359.5506" y="355.9551" width="215.7303" height="97.0787" fill="#34a853" rx="7.191" />
  <ns0:text x="467.4157" y="412.5843" text-anchor="middle" fill="white">7. Start etcd</ns0:text>
  <ns0:rect x="359.5506" y="485.3933" width="215.7303" height="97.0787" fill="#34a853" rx="7.191" />
  <ns0:text x="467.4157" y="542.0225" text-anchor="middle" fill="white">8. Start Controllers</ns0:text>
  <ns0:rect x="647.191" y="97.0787" width="215.7303" height="97.0787" fill="#fbbc04" rx="7.191" />
  <ns0:text x="755.0562" y="153.7079" text-anchor="middle">9. Configure kubectl</ns0:text>
  <ns0:rect x="647.191" y="226.5169" width="215.7303" height="97.0787" fill="#fbbc04" rx="7.191" />
  <ns0:text x="755.0562" y="283.1461" text-anchor="middle">10. Verify Cluster</ns0:text>
  <ns0:rect x="647.191" y="355.9551" width="215.7303" height="97.0787" fill="#fbbc04" rx="7.191" />
  <ns0:text x="755.0562" y="412.5843" text-anchor="middle">11. Enable Addons</ns0:text>
  <ns0:rect x="647.191" y="485.3933" width="215.7303" height="97.0787" fill="#fbbc04" rx="7.191" />
  <ns0:text x="755.0562" y="542.0225" text-anchor="middle">12. Ready!</ns0:text>

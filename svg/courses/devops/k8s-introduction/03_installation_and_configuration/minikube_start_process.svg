<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">Minikube Start Sequence</text>
  <rect x="80" y="108" width="240" height="108" fill="#4285f4" rx="8" />
  <text x="200" y="171" text-anchor="middle" fill="white">1. Check Driver</text>
  <rect x="80" y="252" width="240" height="108" fill="#4285f4" rx="8" />
  <text x="200" y="315" text-anchor="middle" fill="white">2. Create VM/Container</text>
  <rect x="80" y="396" width="240" height="108" fill="#4285f4" rx="8" />
  <text x="200" y="459" text-anchor="middle" fill="white">3. Configure Network</text>
  <rect x="80" y="540" width="240" height="108" fill="#4285f4" rx="8" />
  <text x="200" y="603" text-anchor="middle" fill="white">4. Install Kubernetes</text>
  <rect x="400" y="108" width="240" height="108" fill="#34a853" rx="8" />
  <text x="520" y="171" text-anchor="middle" fill="white">5. Start kubelet</text>
  <rect x="400" y="252" width="240" height="108" fill="#34a853" rx="8" />
  <text x="520" y="315" text-anchor="middle" fill="white">6. Start API Server</text>
  <rect x="400" y="396" width="240" height="108" fill="#34a853" rx="8" />
  <text x="520" y="459" text-anchor="middle" fill="white">7. Start etcd</text>
  <rect x="400" y="540" width="240" height="108" fill="#34a853" rx="8" />
  <text x="520" y="603" text-anchor="middle" fill="white">8. Start Controllers</text>
  <rect x="720" y="108" width="240" height="108" fill="#fbbc04" rx="8" />
  <text x="840" y="171" text-anchor="middle">9. Configure kubectl</text>
  <rect x="720" y="252" width="240" height="108" fill="#fbbc04" rx="8" />
  <text x="840" y="315" text-anchor="middle">10. Verify Cluster</text>
  <rect x="720" y="396" width="240" height="108" fill="#fbbc04" rx="8" />
  <text x="840" y="459" text-anchor="middle">11. Enable Addons</text>
  <rect x="720" y="540" width="240" height="108" fill="#fbbc04" rx="8" />
  <text x="840" y="603" text-anchor="middle">12. Ready!</text>
  <path d="M 320 162 L 392 162" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 640 162 L 712 162" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#666" />
    </marker>
  </defs>
</svg>
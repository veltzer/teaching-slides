<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <rect x="80" y="90" width="1120" height="540" fill="#f9f9f9" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Minikube Driver Options</text>
  <rect x="160" y="144" width="320" height="144" fill="#4285f4" rx="8" />
  <text x="320" y="198" text-anchor="middle" fill="white" font-weight="bold">Docker (Recommended)</text>
  <text x="320" y="243" text-anchor="middle" fill="white" font-size="19.2">Lightweight</text>
  <text x="320" y="270" text-anchor="middle" fill="white" font-size="19.2">No VM needed</text>
  <rect x="512" y="144" width="320" height="144" fill="#34a853" rx="8" />
  <text x="672" y="198" text-anchor="middle" fill="white" font-weight="bold">VirtualBox</text>
  <text x="672" y="243" text-anchor="middle" fill="white" font-size="19.2">Cross-platform</text>
  <text x="672" y="270" text-anchor="middle" fill="white" font-size="19.2">Full isolation</text>
  <rect x="864" y="144" width="320" height="144" fill="#fbbc04" rx="8" />
  <text x="1024" y="198" text-anchor="middle" font-weight="bold">KVM2 (Linux)</text>
  <text x="1024" y="243" text-anchor="middle" font-size="19.2">Native Linux</text>
  <text x="1024" y="270" text-anchor="middle" font-size="19.2">Best performance</text>
  <rect x="160" y="324" width="320" height="144" fill="#ea4335" rx="8" />
  <text x="320" y="378" text-anchor="middle" fill="white" font-weight="bold">Hyperkit (macOS)</text>
  <text x="320" y="423" text-anchor="middle" fill="white" font-size="19.2">Native macOS</text>
  <text x="320" y="450" text-anchor="middle" fill="white" font-size="19.2">Lightweight</text>
  <rect x="512" y="324" width="320" height="144" fill="#9c27b0" rx="8" />
  <text x="672" y="378" text-anchor="middle" fill="white" font-weight="bold">Hyper-V (Windows)</text>
  <text x="672" y="423" text-anchor="middle" fill="white" font-size="19.2">Windows native</text>
  <text x="672" y="450" text-anchor="middle" fill="white" font-size="19.2">Enterprise ready</text>
  <rect x="864" y="324" width="320" height="144" fill="#777777" rx="8" />
  <text x="1024" y="378" text-anchor="middle" fill="white" font-weight="bold">None (Bare Metal)</text>
  <text x="1024" y="423" text-anchor="middle" fill="white" font-size="19.2">Direct on host</text>
  <text x="1024" y="450" text-anchor="middle" fill="white" font-size="19.2">Advanced users</text>
</svg>
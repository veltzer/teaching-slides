<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Local Kubernetes Options</text>
  <rect x="160" y="144" width="240" height="180" fill="#4285f4" rx="8" />
  <text x="280" y="198" text-anchor="middle" fill="white" font-weight="bold">Minikube</text>
  <text x="280" y="243" text-anchor="middle" fill="white" font-size="17.6">Most popular</text>
  <text x="280" y="279" text-anchor="middle" fill="white" font-size="17.6">Full features</text>
  <rect x="440" y="144" width="240" height="180" fill="#34a853" rx="8" />
  <text x="560" y="198" text-anchor="middle" fill="white" font-weight="bold">Kind</text>
  <text x="560" y="243" text-anchor="middle" fill="white" font-size="17.6">K8s in Docker</text>
  <text x="560" y="279" text-anchor="middle" fill="white" font-size="17.6">CI/CD friendly</text>

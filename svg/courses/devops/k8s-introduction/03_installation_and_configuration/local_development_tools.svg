<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="276.92312662722" height="252.173913043478" fill="url(#grad-primary)" rx="7.344371996477" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="178.461509467455" y="115.652173913044" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Minikube</text>
  <text x="178.461509467455" y="178.695652173913" text-anchor="middle" fill="var(--bg)" font-size="22.376955005067" font-family="Arial, sans-serif">Most popular</text>
  <text x="178.461509467455" y="229.130434782609" text-anchor="middle" fill="var(--bg)" font-size="22.376955005067" font-family="Arial, sans-serif">Full features</text>
  <rect x="363.076927218935" y="40" width="276.92312662722" height="252.173913043478" fill="url(#grad-ok)" rx="7.344371996477" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="501.53843668639" y="115.652173913044" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Kind</text>
  <text x="501.53843668639" y="178.695652173913" text-anchor="middle" fill="var(--bg)" font-size="22.376955005067" font-family="Arial, sans-serif">K8s in Docker</text>
  <text x="501.53843668639" y="229.130434782609" text-anchor="middle" fill="var(--bg)" font-size="22.376955005067" font-family="Arial, sans-serif">CI/CD friendly</text>
  <rect x="686.15385443787" y="40" width="276.92312662722" height="252.173913043478" fill="url(#grad-warn)" rx="7.344371996477" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="824.615363905325" y="115.652173913044" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">K3s</text>
  <text x="824.615363905325" y="178.695652173913" text-anchor="middle" font-size="22.376955005067" font-family="Arial, sans-serif" fill="var(--warn-text)">Lightweight</text>
  <text x="824.615363905325" y="229.130434782609" text-anchor="middle" font-size="22.376955005067" font-family="Arial, sans-serif" fill="var(--warn-text)">Edge/IoT</text>
  <rect x="1009.230781656805" y="40" width="230.769218343195" height="252.173913043478" fill="url(#grad-danger)" rx="7.344371996477" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1123.692306201184" y="115.652173913044" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Docker</text>
  <text x="1123.692306201184" y="178.695652173913" text-anchor="middle" fill="var(--bg)" font-size="22.376955005067" font-family="Arial, sans-serif">Desktop</text>
  <text x="1123.692306201184" y="229.130434782609" text-anchor="middle" fill="var(--bg)" font-size="22.376955005067" font-family="Arial, sans-serif">Built-in</text>
  <rect x="40" y="367.826086956522" width="1200" height="252.173913043478" fill="url(#grad-ok)" rx="7.344371996477" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="639.999946153845" y="443.478260869565" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Your Local Machine</text>
  <text x="639.999946153845" y="519.130434782609" text-anchor="middle" font-size="28.479760915539" font-family="Arial, sans-serif" fill="var(--ok-text)">Choose based on your needs:</text>
  <text x="639.999946153845" y="569.565217391305" text-anchor="middle" font-size="24.411223641891" font-family="Arial, sans-serif" fill="var(--ok-text)">Learning → Minikube | Testing → Kind | Resource-constrained → K3s</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="300.000058333335" height="193.333333333333" fill="url(#grad-primary)" rx="8.640987717891" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="189.999970833332" y="152.777777777778" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Load Balancer</text>
  <rect x="439.99996111111" y="40" width="240.000023333334" height="193.333333333333" fill="url(#grad-ok)" rx="8.640987717891" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="560.000031111112" y="120.555555555555" text-anchor="middle" fill="var(--bg)" font-size="28.720914976726" font-family="Arial, sans-serif">Master 1</text>
  <text x="560.000031111112" y="185" text-anchor="middle" fill="var(--bg)" font-size="23.934095813938" font-family="Arial, sans-serif">etcd, API</text>
  <rect x="719.999968888888" y="40" width="240.000023333334" height="193.333333333333" fill="url(#grad-ok)" rx="8.640987717891" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840.00003888889" y="120.555555555555" text-anchor="middle" fill="var(--bg)" font-size="28.720914976726" font-family="Arial, sans-serif">Master 2</text>
  <text x="840.00003888889" y="185" text-anchor="middle" fill="var(--bg)" font-size="23.934095813938" font-family="Arial, sans-serif">etcd, API</text>
  <rect x="999.999976666666" y="40" width="240.000023333334" height="193.333333333333" fill="url(#grad-ok)" rx="8.640987717891" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120.000046666668" y="120.555555555555" text-anchor="middle" fill="var(--bg)" font-size="28.720914976726" font-family="Arial, sans-serif">Master 3</text>
  <text x="1120.000046666668" y="185" text-anchor="middle" fill="var(--bg)" font-size="23.934095813938" font-family="Arial, sans-serif">etcd, API</text>
  <rect x="140.000019444445" y="426.666666666667" width="200.00003888889" height="193.333333333333" fill="url(#grad-warn)" rx="8.640987717891" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240.00003888889" y="539.444444444445" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Worker 1</text>
  <rect x="380.000042777779" y="426.666666666667" width="200.00003888889" height="193.333333333333" fill="url(#grad-warn)" rx="8.640987717891" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="479.999945555554" y="539.444444444445" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Worker 2</text>
  <rect x="619.999949444443" y="426.666666666667" width="200.00003888889" height="193.333333333333" fill="url(#grad-warn)" rx="8.640987717891" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="719.999968888888" y="539.444444444445" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Worker 3</text>
  <rect x="859.999972777777" y="426.666666666667" width="200.00003888889" height="193.333333333333" fill="url(#grad-warn)" rx="8.640987717891" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="959.999992222222" y="539.444444444445" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">Worker 4</text>
  <line x1="189.999970833332" y1="233.333333333333" x2="560.000031111112" y2="233.333333333333" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="189.999970833332" y1="233.333333333333" x2="840.00003888889" y2="233.333333333333" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="189.999970833332" y1="233.333333333333" x2="1120.000046666668" y2="233.333333333333" stroke="var(--text-muted)" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">PersistentVolume Access Modes</text>
  <rect x="160" y="144" width="320" height="180" fill="#4285f4" rx="8" />
  <text x="320" y="198" text-anchor="middle" fill="white" font-weight="bold">ReadWriteOnce (RWO)</text>
  <text x="320" y="243" text-anchor="middle" fill="white" font-size="17.6">Single node</text>
  <text x="320" y="279" text-anchor="middle" fill="white" font-size="17.6">Read-write access</text>
  <text x="320" y="315" text-anchor="middle" fill="white" font-size="17.6">Most common</text>
  <rect x="512" y="144" width="320" height="180" fill="#34a853" rx="8" />
  <text x="672" y="198" text-anchor="middle" fill="white" font-weight="bold">ReadOnlyMany (ROX)</text>
  <text x="672" y="243" text-anchor="middle" fill="white" font-size="17.6">Multiple nodes</text>
  <text x="672" y="279" text-anchor="middle" fill="white" font-size="17.6">Read-only access</text>
  <text x="672" y="315" text-anchor="middle" fill="white" font-size="17.6">Shared data</text>
  <rect x="864" y="144" width="320" height="180" fill="#fbbc04" rx="8" />
  <text x="1024" y="198" text-anchor="middle" font-weight="bold">ReadWriteMany (RWX)</text>
  <text x="1024" y="243" text-anchor="middle" font-size="17.6">Multiple nodes</text>
  <text x="1024" y="279" text-anchor="middle" font-size="17.6">Read-write access</text>
  <text x="1024" y="315" text-anchor="middle" font-size="17.6">NFS, CephFS</text>
  <rect x="400" y="378" width="480" height="144" fill="#e8f5e9" rx="8" />
  <text x="640" y="423" text-anchor="middle" font-weight="bold">New Mode (1.22+)</text>
  <text x="640" y="468" text-anchor="middle" font-size="19.2">ReadWriteOncePod (RWOP)</text>
  <text x="640" y="504" text-anchor="middle" font-size="17.6">Single pod only</text>
</svg>
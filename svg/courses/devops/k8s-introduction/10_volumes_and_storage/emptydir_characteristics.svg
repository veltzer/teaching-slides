<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="241.666666666666" fill="url(#grad-ok)" rx="9.165149957857" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000087499973" y="112.5" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Pod Created</text>
  <rect x="190.000153124952" y="136.666666666666" width="299.999956250014" height="96.666666666666" fill="url(#grad-primary)" rx="9.165149957857" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.000131249959" y="197.083333333334" text-anchor="middle" fill="var(--bg)" font-size="27.924531644099" font-family="Arial, sans-serif">Container 1</text>
  <rect x="789.999890625034" y="136.666666666666" width="299.999956250014" height="96.666666666666" fill="url(#grad-primary)" rx="9.165149957857" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940.000043749986" y="197.083333333334" text-anchor="middle" fill="var(--bg)" font-size="27.924531644099" font-family="Arial, sans-serif">Container 2</text>
  <rect x="430.000328124897" y="330" width="419.999693750096" height="120.833333333334" fill="url(#grad-warn)" rx="9.165149957857" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000087499973" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">emptyDir Volume</text>
  <path d="M 340.000131249959 233.333333333334 L 550.00006562498 317.916666666666" stroke="var(--text-muted)" stroke-width="1.7284"/>
  <path d="M 940.000043749986 233.333333333334 L 729.99993437502 317.916666666666" stroke="var(--text-muted)" stroke-width="1.7284"/>
  <text x="640.000087499973" y="523.333333333334" text-anchor="middle" font-size="30.462972677426" font-family="Arial, sans-serif" fill="var(--text)">✓ Shared between containers</text>
  <text x="640.000087499973" y="571.666666666666" text-anchor="middle" font-size="30.462972677426" font-family="Arial, sans-serif" fill="var(--text)">✓ Survives container restarts</text>
  <text x="640.000087499973" y="620" text-anchor="middle" font-size="30.462972677426" font-family="Arial, sans-serif" fill="var(--text)">❌ Deleted when Pod deleted</text>
</svg>

  <text x="1110" y="94.836373" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.457524" font-weight="bold" fill="var(--bg)">Pod</text>
  <text x="1110" y="132.800005" text-anchor="middle" font-family="monospace" font-size="12.323014" fill="var(--danger-accent)">spec:</text>
  <text x="1110" y="153.890898" text-anchor="middle" font-family="monospace" font-size="12.323014" fill="var(--danger-accent)">  volumes:</text>
  <text x="1110" y="174.981921" text-anchor="middle" font-family="monospace" font-size="11.816783" fill="var(--warn-accent)">  - name: data</text>
  <text x="1110" y="193.963737" text-anchor="middle" font-family="monospace" font-size="11.816783" fill="var(--warn-accent)">    persistentVolumeClaim:</text>
  <text x="1110" y="212.945554" text-anchor="middle" font-family="monospace" font-size="11.816783" fill="var(--warn-accent)">      claimName: my-data-pvc</text>
  <text x="1110" y="234.036446" text-anchor="middle" font-family="monospace" font-size="12.323014" fill="var(--danger-accent)">  containers:</text>
  <text x="1110" y="253.018262" text-anchor="middle" font-family="monospace" font-size="11.816783" fill="var(--warn-accent)">  - volumeMounts:</text>
  <text x="1110" y="272.000079" text-anchor="middle" font-family="monospace" font-size="11.816783" fill="var(--warn-accent)">    - name: data</text>
  <text x="1110" y="290.981895" text-anchor="middle" font-family="monospace" font-size="11.816783" fill="var(--warn-accent)">      mountPath: /data</text>
  <text x="1110" y="356.363648" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.323014" fill="var(--text-muted)">Namespace-scoped</text>
  <text x="1110" y="375.345465" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.323014" fill="var(--text-muted)">References PVC by name</text>
  <rect x="300" y="472.363753" width="720" height="84.36357" rx="7.09007" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="660" y="506.109102" text-anchor="middle" font-family="Arial,sans-serif" font-size="16.430527" font-weight="bold" fill="var(--text-muted)">Physical Storage</text>
  <text x="660" y="533.527223" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.349892" fill="var(--text-muted)">AWS EBS  |  GCP PD  |  Azure Disk  |  NFS  |  Ceph RBD  |  Local Disk</text>
  <line x1="470" y1="419.636326" x2="470" y2="472.363753" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <rect x="40" y="533.527223" width="580" height="86.472777" rx="7.09007" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="50" y="554.618247" font-family="Arial,sans-serif" font-size="13.349892" font-weight="bold" fill="var(--text)">Access Modes</text>
  <text x="60" y="575.709139" font-family="Arial,sans-serif" font-size="12.323014" fill="var(--text-muted)">ReadWriteOnce (RWO)   — single node R/W</text>
  <text x="60" y="594.690955" font-family="Arial,sans-serif" font-size="12.323014" fill="var(--text-muted)">ReadOnlyMany  (ROX)   — many nodes read-only</text>
  <text x="60" y="613.672772" font-family="Arial,sans-serif" font-size="12.323014" fill="var(--text-muted)">ReadWriteMany (RWX)  — many nodes R/W (NFS, CephFS)</text>
  <rect x="660" y="533.527223" width="580" height="86.472777" rx="7.09007" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="670" y="554.618247" font-family="Arial,sans-serif" font-size="13.349892" font-weight="bold" fill="var(--text)">Reclaim Policies</text>
  <text x="679.999893" y="575.709139" font-family="Arial,sans-serif" font-size="12.323014" fill="var(--text-muted)">Retain   — keep data, manual cleanup required</text>
  <text x="679.999893" y="594.690955" font-family="Arial,sans-serif" font-size="12.323014" fill="var(--text-muted)">Delete   — delete PV and backing storage</text>
  <text x="679.999893" y="613.672772" font-family="Arial,sans-serif" font-size="12.323014" fill="var(--text-muted)">Recycle  — deprecated (use Delete)</text>
</svg>
  <text x="679.999893" y="594.690955" font-size="12.323014" fill="var(--text-muted)" font-family="Arial, sans-serif">Delete — remove PV</text>
  <text x="679.999893" y="613.672772" font-size="12.323014" fill="var(--text-muted)" font-family="Arial, sans-serif">Recycle — deprecated</text>
</svg>

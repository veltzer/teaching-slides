  <text x="310" y="236.145391" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.816783" fill="var(--info-accent)">provision</text>
  <rect x="340" y="40" width="260" height="379.636326" rx="7.09007" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="340" y="40" width="260" height="48.509144" rx="7.09007" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="340" y="75.854556" width="260" height="12.654588" fill="var(--primary-fill)" rx="7.09007" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="73.745611" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.457524" font-weight="bold" fill="var(--bg)">PersistentVolume</text>
  <text x="470" y="111.709244" text-anchor="middle" font-family="monospace" font-size="12.323014" fill="var(--primary-accent)">kind: PersistentVolume</text>
  <text x="470" y="132.800005" text-anchor="middle" font-family="monospace" font-size="12.323014" fill="var(--primary-accent)">name: pv-ssd-100g</text>
  <text x="470" y="153.890898" text-anchor="middle" font-family="monospace" font-size="12.323014" fill="var(--text-muted)">capacity:</text>
  <text x="470" y="172.872714" text-anchor="middle" font-family="monospace" font-size="11.816783" fill="var(--primary-accent)">  storage: 100Gi</text>
  <text x="470" y="193.963737" text-anchor="middle" font-family="monospace" font-size="12.323014" fill="var(--text-muted)">accessModes:</text>
  <text x="470" y="212.945554" text-anchor="middle" font-family="monospace" font-size="11.816783" fill="var(--primary-accent)">  - ReadWriteOnce</text>
  <text x="470" y="234.036446" text-anchor="middle" font-family="monospace" font-size="12.323014" fill="var(--text-muted)">storageClassName: fast-ssd</text>
  <text x="470" y="255.127208" text-anchor="middle" font-family="monospace" font-size="12.323014" fill="var(--text-muted)">persistentVolumeReclaimPolicy:</text>
  <text x="470" y="274.109024" text-anchor="middle" font-family="monospace" font-size="11.816783" fill="var(--primary-accent)">  Retain</text>

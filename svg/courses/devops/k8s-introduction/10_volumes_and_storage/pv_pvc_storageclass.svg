  <ns0:text x="44.4444" y="504.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#333">Access Modes</ns0:text>
  <ns0:text x="53.3333" y="522.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">ReadWriteOnce (RWO)   — single node R/W</ns0:text>
  <ns0:text x="53.3333" y="538.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">ReadOnlyMany  (ROX)   — many nodes read-only</ns0:text>
  <ns0:text x="53.3333" y="554.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">ReadWriteMany (RWX)  — many nodes R/W (NFS, CephFS)</ns0:text>
  <ns0:rect x="586.6667" y="487.1111" width="515.5556" height="72.8889" rx="8.8889" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.3333" />
  <ns0:text x="595.5556" y="504.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#333">Reclaim Policies</ns0:text>
  <ns0:text x="604.4444" y="522.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Retain   — keep data, manual cleanup required</ns0:text>
  <ns0:text x="604.4444" y="538.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Delete   — delete PV and backing storage</ns0:text>
  <ns0:text x="604.4444" y="554.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#555">Recycle  — deprecated (use Delete)</ns0:text>

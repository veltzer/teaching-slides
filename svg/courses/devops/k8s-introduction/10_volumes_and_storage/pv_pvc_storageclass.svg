  <text x="660" y="506.109102" text-anchor="middle" font-size="16.430527" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Physical Storage</text>
  <text x="660" y="533.527223" text-anchor="middle" font-size="13.349892" fill="var(--text-muted)" font-family="Arial, sans-serif">EBS | GCP PD | Azure | NFS | Ceph | Local</text>
  <line x1="470" y1="419.636326" x2="470" y2="472.363753" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)"/>
  <rect x="40" y="533.527223" width="580" height="86.472777" rx="7.09007" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="50" y="554.618247" font-size="13.349892" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Access Modes</text>
  <text x="60" y="575.709139" font-size="12.323014" fill="var(--text-muted)" font-family="Arial, sans-serif">RWO — one node R/W</text>
  <text x="60" y="594.690955" font-size="12.323014" fill="var(--text-muted)" font-family="Arial, sans-serif">ROX — many read-only</text>
  <text x="60" y="613.672772" font-size="12.323014" fill="var(--text-muted)" font-family="Arial, sans-serif">RWX — many R/W (NFS)</text>
  <rect x="660" y="533.527223" width="580" height="86.472777" rx="7.09007" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="670" y="554.618247" font-size="13.349892" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Reclaim Policies</text>

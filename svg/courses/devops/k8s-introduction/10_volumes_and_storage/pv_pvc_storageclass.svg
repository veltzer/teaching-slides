  <text x="160" y="185" text-anchor="middle" font-size="12.323014" fill="var(--info-accent)" font-family="Courier New, monospace">ebs.csi.aws.com</text>
  <text x="160" y="210" text-anchor="middle" font-size="11.816783" fill="var(--info-accent)" font-family="Courier New, monospace">type: gp3</text>
  <text x="160" y="240" text-anchor="middle" font-size="12.323014" fill="var(--text-muted)" font-family="Courier New, monospace">reclaim: Retain</text>
  <text x="160" y="355" text-anchor="middle" font-size="12.323014" fill="var(--text-muted)" font-family="Arial, sans-serif">Cluster-scoped, admin-made</text>
  <line x1="280" y1="229.818163" x2="340" y2="229.818163" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="225" text-anchor="middle" font-size="11.816783" fill="var(--info-accent)" font-family="Arial, sans-serif">provision</text>
  <rect x="340" y="40" width="260" height="379.636326" rx="7.09007" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="340" y="40" width="260" height="48.509144" rx="7.09007" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="340" y="75.854556" width="260" height="12.654588" fill="url(#grad-primary)" rx="7.09007" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="73.745611" text-anchor="middle" font-size="17.457524" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">PersistentVolume</text>
  <text x="470" y="120" text-anchor="middle" font-size="12.323014" fill="var(--primary-accent)" font-family="Courier New, monospace">name: pv-ssd-100g</text>
  <text x="470" y="150" text-anchor="middle" font-size="11.816783" fill="var(--primary-accent)" font-family="Courier New, monospace">storage: 100Gi</text>
  <text x="470" y="180" text-anchor="middle" font-size="11.816783" fill="var(--primary-accent)" font-family="Courier New, monospace">ReadWriteOnce</text>
  <text x="470" y="210" text-anchor="middle" font-size="12.323014" fill="var(--text-muted)" font-family="Courier New, monospace">class: fast-ssd</text>
  <text x="470" y="240" text-anchor="middle" font-size="11.816783" fill="var(--primary-accent)" font-family="Courier New, monospace">reclaim: Retain</text>
  <rect x="380" y="288.872819" width="180" height="31.636404" rx="7.09007" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="309.963711" text-anchor="middle" font-size="13.349892" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Status: Bound</text>
  <text x="470" y="388" text-anchor="middle" font-size="12.323014" fill="var(--text-muted)" font-family="Arial, sans-serif">Cluster-scoped, real storage</text>
  <line x1="600" y1="229.818163" x2="660" y2="229.818163" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="219.272782" text-anchor="middle" font-size="11.816783" fill="var(--text-muted)" font-family="Arial, sans-serif">binds</text>
  <rect x="660" y="61.091023" width="260" height="337.45441" rx="7.09007" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="61.091023" width="260" height="48.509144" rx="7.09007" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="96.945449" width="260" height="12.654588" fill="url(#grad-ok)" rx="7.09007" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="94.836373" text-anchor="middle" font-size="17.457524" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">PersistentVolumeClaim</text>
  <text x="790" y="130.69106" text-anchor="middle" font-size="12.323014" fill="var(--ok-accent)" font-family="Courier New, monospace">kind: PersistentVolumeClaim</text>

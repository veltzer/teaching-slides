  <text x="1110" y="290.981895" text-anchor="middle" font-size="11.816783" fill="var(--warn-accent)" font-family="Courier New, monospace">      mountPath: /data</text>
  <text x="1110" y="368" text-anchor="middle" font-size="12.323014" fill="var(--text-muted)" font-family="Arial, sans-serif">Namespace-scoped, refs PVC</text>

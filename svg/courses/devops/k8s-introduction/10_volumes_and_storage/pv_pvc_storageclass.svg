  <text x="790" y="191.85453" text-anchor="middle" font-size="11.816783" fill="var(--ok-accent)" font-family="Courier New, monospace">  storage: 20Gi</text>
  <text x="790" y="212.945554" text-anchor="middle" font-size="12.323014" fill="var(--text-muted)" font-family="Courier New, monospace">accessModes:</text>
  <text x="790" y="231.92737" text-anchor="middle" font-size="11.816783" fill="var(--ok-accent)" font-family="Courier New, monospace">  - ReadWriteOnce</text>
  <text x="790" y="253.018262" text-anchor="middle" font-size="12.323014" fill="var(--text-muted)" font-family="Courier New, monospace">storageClassName: fast-ssd</text>
  <rect x="700" y="267.781795" width="180" height="31.636404" rx="7.09007" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="288.872819" text-anchor="middle" font-size="13.349892" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Status: Bound</text>
  <text x="790" y="368" text-anchor="middle" font-size="12.323014" fill="var(--text-muted)" font-family="Arial, sans-serif">Namespace-scoped, dev request</text>
  <line x1="920" y1="229.818163" x2="980" y2="229.818163" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="949.999893" y="219.272782" text-anchor="middle" font-size="11.816783" fill="var(--text-muted)" font-family="Arial, sans-serif">mounts</text>
  <rect x="980" y="61.091023" width="260" height="337.45441" rx="7.09007" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="980" y="61.091023" width="260" height="48.509144" rx="7.09007" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="980" y="96.945449" width="260" height="12.654588" fill="url(#grad-warn)" rx="7.09007" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="94.836373" text-anchor="middle" font-size="17.457524" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Pod</text>
  <text x="1110" y="132.800005" text-anchor="middle" font-size="12.323014" fill="var(--danger-accent)" font-family="Courier New, monospace">spec:</text>
  <text x="1110" y="153.890898" text-anchor="middle" font-size="12.323014" fill="var(--danger-accent)" font-family="Courier New, monospace">  volumes:</text>
  <text x="1110" y="174.981921" text-anchor="middle" font-size="11.816783" fill="var(--warn-accent)" font-family="Courier New, monospace">  - name: data</text>
  <text x="1110" y="193.963737" text-anchor="middle" font-size="11.816783" fill="var(--warn-accent)" font-family="Courier New, monospace">    persistentVolumeClaim:</text>
  <text x="1110" y="212.945554" text-anchor="middle" font-size="11.816783" fill="var(--warn-accent)" font-family="Courier New, monospace">      claimName: my-data-pvc</text>
  <text x="1110" y="234.036446" text-anchor="middle" font-size="12.323014" fill="var(--danger-accent)" font-family="Courier New, monospace">  containers:</text>
  <text x="1110" y="253.018262" text-anchor="middle" font-size="11.816783" fill="var(--warn-accent)" font-family="Courier New, monospace">  - volumeMounts:</text>

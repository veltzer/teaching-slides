<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="77.5" y="136.6667" width="225" height="225.5556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="77.5" y="136.6667" width="225" height="37.0556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="77.5" y="164.0556" width="225" height="9.6667" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="190" y="162.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.7735" font-weight="bold" fill="var(--bg)">StorageClass</text>
  <text x="190" y="189.8333" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--info-accent)">kind: StorageClass</text>
  <text x="190" y="205.9444" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--info-accent)">name: fast-ssd</text>
  <text x="190" y="222.0556" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">provisioner:</text>
  <text x="190" y="236.5556" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--info-accent)">  ebs.csi.aws.com</text>
  <text x="190" y="252.6667" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">parameters:</text>
  <text x="190" y="267.1667" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--info-accent)">  type: gp3</text>
  <text x="190" y="281.6667" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">reclaimPolicy: Retain</text>
  <text x="190" y="338.0556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Cluster-scoped</text>
  <text x="190" y="352.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Admin creates once</text>
  <line x1="302.5" y1="249.4444" x2="358.75" y2="249.4444" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="330.625" y="241.3889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--info-accent)">dynamic</text>
  <text x="330.625" y="254.2777" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--info-accent)">provision</text>
  <rect x="358.75" y="104.4444" width="243.75" height="290" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="358.75" y="104.4444" width="243.75" height="37.0556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="358.75" y="131.8333" width="243.75" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="480.625" y="130.2223" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.7735" font-weight="bold" fill="var(--bg)">PersistentVolume</text>
  <text x="480.625" y="159.2223" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">kind: PersistentVolume</text>
  <text x="480.625" y="175.3333" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--primary-accent)">name: pv-ssd-100g</text>
  <text x="480.625" y="191.4444" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">capacity:</text>
  <text x="480.625" y="205.9444" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-accent)">  storage: 100Gi</text>
  <text x="480.625" y="222.0556" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">accessModes:</text>
  <text x="480.625" y="236.5556" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-accent)">  - ReadWriteOnce</text>
  <text x="480.625" y="252.6667" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">storageClassName: fast-ssd</text>
  <text x="480.625" y="268.7777" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">persistentVolumeReclaimPolicy:</text>
  <text x="480.625" y="283.2777" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--primary-accent)">  Retain</text>
  <rect x="396.25" y="294.5556" width="168.75" height="24.1667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="480.625" y="310.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">Status: Bound</text>
  <text x="480.625" y="362.2223" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Cluster-scoped resource</text>
  <text x="480.625" y="376.7223" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Backed by real storage</text>
  <line x1="602.5" y1="249.4444" x2="658.75" y2="249.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="630.625" y="241.3889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">binds</text>
  <rect x="658.75" y="120.5556" width="243.75" height="257.7777" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />

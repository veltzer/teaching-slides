  <text x="160" y="272.000079" text-anchor="middle" font-family="monospace" font-size="12.323014" fill="var(--text-muted)">reclaimPolicy: Retain</text>
  <text x="160" y="345.818268" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.323014" fill="var(--text-muted)">Cluster-scoped</text>
  <text x="160" y="364.800084" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.323014" fill="var(--text-muted)">Admin creates once</text>
  <line x1="280" y1="229.818163" x2="340" y2="229.818163" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Chain layout: StorageClass → PV → PVC → Pod, left to right -->

  <!-- ===== StorageClass ===== -->
  <rect x="40" y="120" width="240" height="280" rx="14" fill="#ede7f6" stroke="#7e57c2" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="40" y="120" width="240" height="46" rx="14" fill="#7e57c2"/>
  <rect x="40" y="154" width="240" height="12" fill="#7e57c2"/>
  <text x="160" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#fff">StorageClass</text>
  <text x="160" y="186" text-anchor="middle" font-family="monospace" font-size="12" fill="#4527a0">kind: StorageClass</text>
  <text x="160" y="206" text-anchor="middle" font-family="monospace" font-size="12" fill="#4527a0">name: fast-ssd</text>
  <text x="160" y="226" text-anchor="middle" font-family="monospace" font-size="12" fill="#555">provisioner:</text>
  <text x="160" y="244" text-anchor="middle" font-family="monospace" font-size="11" fill="#7b1fa2">  ebs.csi.aws.com</text>
  <text x="160" y="264" text-anchor="middle" font-family="monospace" font-size="12" fill="#555">parameters:</text>
  <text x="160" y="282" text-anchor="middle" font-family="monospace" font-size="11" fill="#7b1fa2">  type: gp3</text>
  <text x="160" y="300" text-anchor="middle" font-family="monospace" font-size="12" fill="#555">reclaimPolicy: Retain</text>
  <text x="160" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#777">Cluster-scoped</text>
  <text x="160" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#777">Admin creates once</text>

  <!-- Arrow SC → PV (dynamic provision) -->
  <line x1="280" y1="260" x2="340" y2="260" stroke="#7e57c2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="310" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#7b1fa2">dynamic</text>
  <text x="310" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#7b1fa2">provision</text>

  <!-- ===== PersistentVolume ===== -->
  <rect x="340" y="80" width="260" height="360" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="340" y="80" width="260" height="46" rx="14" fill="url(#grad-accent)"/>
  <rect x="340" y="114" width="260" height="12" fill="url(#grad-accent)"/>
  <text x="470" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#fff">PersistentVolume</text>
  <text x="470" y="148" text-anchor="middle" font-family="monospace" font-size="12" fill="#1a237e">kind: PersistentVolume</text>
  <text x="470" y="168" text-anchor="middle" font-family="monospace" font-size="12" fill="#1a237e">name: pv-ssd-100g</text>
  <text x="470" y="188" text-anchor="middle" font-family="monospace" font-size="12" fill="#555">capacity:</text>
  <text x="470" y="206" text-anchor="middle" font-family="monospace" font-size="11" fill="#1565c0">  storage: 100Gi</text>
  <text x="470" y="226" text-anchor="middle" font-family="monospace" font-size="12" fill="#555">accessModes:</text>
  <text x="470" y="244" text-anchor="middle" font-family="monospace" font-size="11" fill="#1565c0">  - ReadWriteOnce</text>
  <text x="470" y="264" text-anchor="middle" font-family="monospace" font-size="12" fill="#555">storageClassName: fast-ssd</text>
  <text x="470" y="284" text-anchor="middle" font-family="monospace" font-size="12" fill="#555">persistentVolumeReclaimPolicy:</text>
  <text x="470" y="302" text-anchor="middle" font-family="monospace" font-size="11" fill="#1565c0">  Retain</text>
  <!-- Status pill -->
  <rect x="380" y="316" width="180" height="30" rx="8" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="470" y="336" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1b5e20">Status: Bound</text>
  <text x="470" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#777">Cluster-scoped resource</text>
  <text x="470" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#777">Backed by real storage</text>

  <!-- Arrow PV → PVC (binding) -->
  <line x1="600" y1="260" x2="660" y2="260" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="630" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">binds</text>

  <!-- ===== PVC ===== -->
  <rect x="660" y="100" width="260" height="320" rx="14" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="660" y="100" width="260" height="46" rx="14" fill="#388e3c"/>
  <rect x="660" y="134" width="260" height="12" fill="#388e3c"/>
  <text x="790" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#fff">PersistentVolumeClaim</text>
  <text x="790" y="166" text-anchor="middle" font-family="monospace" font-size="12" fill="#1b5e20">kind: PersistentVolumeClaim</text>
  <text x="790" y="186" text-anchor="middle" font-family="monospace" font-size="12" fill="#1b5e20">name: my-data-pvc</text>
  <text x="790" y="206" text-anchor="middle" font-family="monospace" font-size="12" fill="#555">resources.requests:</text>
  <text x="790" y="224" text-anchor="middle" font-family="monospace" font-size="11" fill="#2e7d32">  storage: 20Gi</text>
  <text x="790" y="244" text-anchor="middle" font-family="monospace" font-size="12" fill="#555">accessModes:</text>
  <text x="790" y="262" text-anchor="middle" font-family="monospace" font-size="11" fill="#2e7d32">  - ReadWriteOnce</text>
  <text x="790" y="282" text-anchor="middle" font-family="monospace" font-size="12" fill="#555">storageClassName: fast-ssd</text>
  <!-- Status pill -->
  <rect x="700" y="296" width="180" height="30" rx="8" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="790" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1b5e20">Status: Bound</text>
  <text x="790" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#777">Namespace-scoped</text>
  <text x="790" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#777">Developer's request</text>

  <!-- Arrow PVC → Pod -->
  <line x1="920" y1="260" x2="980" y2="260" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="950" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">mounts</text>

  <!-- ===== Pod ===== -->
  <rect x="980" y="100" width="260" height="320" rx="14" fill="#fff3e0" stroke="#f57c00" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="980" y="100" width="260" height="46" rx="14" fill="#f57c00"/>
  <rect x="980" y="134" width="260" height="12" fill="#f57c00"/>
  <text x="1110" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#fff">Pod</text>
  <text x="1110" y="168" text-anchor="middle" font-family="monospace" font-size="12" fill="#bf360c">spec:</text>
  <text x="1110" y="188" text-anchor="middle" font-family="monospace" font-size="12" fill="#bf360c">  volumes:</text>
  <text x="1110" y="208" text-anchor="middle" font-family="monospace" font-size="11" fill="#e65100">  - name: data</text>
  <text x="1110" y="226" text-anchor="middle" font-family="monospace" font-size="11" fill="#e65100">    persistentVolumeClaim:</text>
  <text x="1110" y="244" text-anchor="middle" font-family="monospace" font-size="11" fill="#e65100">      claimName: my-data-pvc</text>
  <text x="1110" y="264" text-anchor="middle" font-family="monospace" font-size="12" fill="#bf360c">  containers:</text>
  <text x="1110" y="282" text-anchor="middle" font-family="monospace" font-size="11" fill="#e65100">  - volumeMounts:</text>
  <text x="1110" y="300" text-anchor="middle" font-family="monospace" font-size="11" fill="#e65100">    - name: data</text>
  <text x="1110" y="318" text-anchor="middle" font-family="monospace" font-size="11" fill="#e65100">      mountPath: /data</text>
  <text x="1110" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#777">Namespace-scoped</text>
  <text x="1110" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#777">References PVC by name</text>

  <!-- Physical storage underneath -->
  <rect x="300" y="490" width="720" height="80" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="522" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#37474f">Physical Storage</text>
  <text x="660" y="548" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#546e7a">AWS EBS  |  GCP PD  |  Azure Disk  |  NFS  |  Ceph RBD  |  Local Disk</text>

  <!-- Arrow PV down to physical -->
  <line x1="470" y1="440" x2="470" y2="490" stroke="#607d8b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Access modes table -->
  <rect x="40" y="548" width="580" height="82" rx="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="50" y="568" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#333">Access Modes</text>
  <text x="60" y="588" font-family="Arial,sans-serif" font-size="12" fill="#555">ReadWriteOnce (RWO)   — single node R/W</text>
  <text x="60" y="606" font-family="Arial,sans-serif" font-size="12" fill="#555">ReadOnlyMany  (ROX)   — many nodes read-only</text>
  <text x="60" y="624" font-family="Arial,sans-serif" font-size="12" fill="#555">ReadWriteMany (RWX)  — many nodes R/W (NFS, CephFS)</text>

  <!-- Reclaim policy table -->
  <rect x="660" y="548" width="580" height="82" rx="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="670" y="568" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#333">Reclaim Policies</text>
  <text x="680" y="588" font-family="Arial,sans-serif" font-size="12" fill="#555">Retain   — keep data, manual cleanup required</text>
  <text x="680" y="606" font-family="Arial,sans-serif" font-size="12" fill="#555">Delete   — delete PV and backing storage</text>
  <text x="680" y="624" font-family="Arial,sans-serif" font-size="12" fill="#555">Recycle  — deprecated (use Delete)</text>
</svg>

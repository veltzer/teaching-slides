  <text x="790" y="172.872714" text-anchor="middle" font-family="monospace" font-size="12.323014" fill="var(--text-muted)">resources.requests:</text>
  <text x="790" y="191.85453" text-anchor="middle" font-family="monospace" font-size="11.816783" fill="var(--ok-accent)">  storage: 20Gi</text>
  <text x="790" y="212.945554" text-anchor="middle" font-family="monospace" font-size="12.323014" fill="var(--text-muted)">accessModes:</text>
  <text x="790" y="231.92737" text-anchor="middle" font-family="monospace" font-size="11.816783" fill="var(--ok-accent)">  - ReadWriteOnce</text>
  <text x="790" y="253.018262" text-anchor="middle" font-family="monospace" font-size="12.323014" fill="var(--text-muted)">storageClassName: fast-ssd</text>
  <rect x="700" y="267.781795" width="180" height="31.636404" rx="7.09007" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="288.872819" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.349892" font-weight="bold" fill="var(--ok-accent)">Status: Bound</text>

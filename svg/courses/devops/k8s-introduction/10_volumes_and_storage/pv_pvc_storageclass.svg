  <rect x="660" y="96.945449" width="260" height="12.654588" fill="var(--ok-fill)" rx="7.09007" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="94.836373" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.457524" font-weight="bold" fill="var(--bg)">PersistentVolumeClaim</text>
  <text x="790" y="130.69106" text-anchor="middle" font-family="monospace" font-size="12.323014" fill="var(--ok-accent)">kind: PersistentVolumeClaim</text>

  <rect x="658.75" y="147.9444" width="243.75" height="9.6667" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="780.625" y="146.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.7735" font-weight="bold" fill="var(--bg)">PersistentVolumeClaim</text>
  <text x="780.625" y="173.7223" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--ok-accent)">kind: PersistentVolumeClaim</text>
  <text x="780.625" y="189.8333" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--ok-accent)">name: my-data-pvc</text>
  <text x="780.625" y="205.9444" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">resources.requests:</text>
  <text x="780.625" y="220.4444" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--ok-accent)">  storage: 20Gi</text>
  <text x="780.625" y="236.5556" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">accessModes:</text>
  <text x="780.625" y="251.0556" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--ok-accent)">  - ReadWriteOnce</text>
  <text x="780.625" y="267.1667" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-muted)">storageClassName: fast-ssd</text>
  <rect x="696.25" y="278.4444" width="168.75" height="24.1667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="780.625" y="294.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">Status: Bound</text>
  <text x="780.625" y="346.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Namespace-scoped</text>
  <text x="780.625" y="360.6111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Developer's request</text>
  <line x1="902.5" y1="249.4444" x2="958.75" y2="249.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="930.6249" y="241.3889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">mounts</text>
  <rect x="958.75" y="120.5556" width="243.75" height="257.7777" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="958.75" y="120.5556" width="243.75" height="37.0556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="958.75" y="147.9444" width="243.75" height="9.6667" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1080.625" y="146.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="14.7735" font-weight="bold" fill="var(--bg)">Pod</text>
  <text x="1080.625" y="175.3333" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--danger-accent)">spec:</text>
  <text x="1080.625" y="191.4444" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--danger-accent)">  volumes:</text>
  <text x="1080.625" y="207.5556" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--warn-accent)">  - name: data</text>
  <text x="1080.625" y="222.0556" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--warn-accent)">    persistentVolumeClaim:</text>
  <text x="1080.625" y="236.5556" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--warn-accent)">      claimName: my-data-pvc</text>
  <text x="1080.625" y="252.6667" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--danger-accent)">  containers:</text>
  <text x="1080.625" y="267.1667" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--warn-accent)">  - volumeMounts:</text>
  <text x="1080.625" y="281.6667" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--warn-accent)">    - name: data</text>
  <text x="1080.625" y="296.1667" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--warn-accent)">      mountPath: /data</text>
  <text x="1080.625" y="346.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Namespace-scoped</text>
  <text x="1080.625" y="360.6111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">References PVC by name</text>
  <rect x="321.25" y="434.7223" width="675" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="658.75" y="460.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text-muted)">Physical Storage</text>
  <text x="658.75" y="481.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)">AWS EBS  |  GCP PD  |  Azure Disk  |  NFS  |  Ceph RBD  |  Local Disk</text>
  <line x1="480.625" y1="394.4444" x2="480.625" y2="434.7223" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <rect x="77.5" y="481.4444" width="543.75" height="66.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="86.875" y="497.5556" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text)">Access Modes</text>
  <text x="96.25" y="513.6667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">ReadWriteOnce (RWO)   — single node R/W</text>
  <text x="96.25" y="528.1667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">ReadOnlyMany  (ROX)   — many nodes read-only</text>
  <text x="96.25" y="542.6667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">ReadWriteMany (RWX)  — many nodes R/W (NFS, CephFS)</text>
  <rect x="658.75" y="481.4444" width="543.75" height="66.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="668.125" y="497.5556" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text)">Reclaim Policies</text>
  <text x="677.4999" y="513.6667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Retain   — keep data, manual cleanup required</text>
  <text x="677.4999" y="528.1667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Delete   — delete PV and backing storage</text>
  <text x="677.4999" y="542.6667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)">Recycle  — deprecated (use Delete)</text>
</svg>
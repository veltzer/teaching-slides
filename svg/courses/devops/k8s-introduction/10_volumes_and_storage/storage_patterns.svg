<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="276.92312662722" height="580" fill="url(#grad-primary)" rx="11.138291612814" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="178.461509467455" y="214" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Shared Config</text>
  <text x="178.461509467455" y="359" text-anchor="middle" fill="var(--bg)" font-size="33.936332524115" font-family="Arial, sans-serif">ConfigMap</text>
  <text x="178.461509467455" y="475.000000000001" text-anchor="middle" fill="var(--bg)" font-size="33.936332524115" font-family="Arial, sans-serif">ReadOnlyMany</text>
  <text x="178.461509467455" y="591.000000000002" text-anchor="middle" fill="var(--bg)" font-size="33.936332524115" font-family="Arial, sans-serif">Multiple pods</text>
  <rect x="353.846188639054" y="40" width="276.92312662722" height="580" fill="url(#grad-ok)" rx="11.138291612814" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492.307698106509" y="214" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Database</text>
  <text x="492.307698106509" y="359" text-anchor="middle" fill="var(--bg)" font-size="33.936332524115" font-family="Arial, sans-serif">StatefulSet</text>
  <text x="492.307698106509" y="475.000000000001" text-anchor="middle" fill="var(--bg)" font-size="33.936332524115" font-family="Arial, sans-serif">ReadWriteOnce</text>
  <text x="492.307698106509" y="591.000000000002" text-anchor="middle" fill="var(--bg)" font-size="33.936332524115" font-family="Arial, sans-serif">Per-pod PVC</text>
  <rect x="667.692269585798" y="40" width="276.92312662722" height="580" fill="url(#grad-warn)" rx="11.138291612814" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="806.153886745563" y="214" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Shared Data</text>
  <text x="806.153886745563" y="359" text-anchor="middle" font-size="33.936332524115" font-family="Arial, sans-serif" fill="var(--warn-text)">NFS/CephFS</text>
  <text x="806.153886745563" y="475.000000000001" text-anchor="middle" font-size="33.936332524115" font-family="Arial, sans-serif" fill="var(--warn-text)">ReadWriteMany</text>
  <text x="806.153886745563" y="591.000000000002" text-anchor="middle" font-size="33.936332524115" font-family="Arial, sans-serif" fill="var(--warn-text)">Concurrent</text>
  <rect x="981.538458224852" y="40" width="258.461541775148" height="580" fill="url(#grad-danger)" rx="11.138291612814" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.769229112426" y="214" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Cache</text>
  <text x="1110.769229112426" y="359" text-anchor="middle" fill="var(--bg)" font-size="33.936332524115" font-family="Arial, sans-serif">emptyDir</text>
  <text x="1110.769229112426" y="475.000000000001" text-anchor="middle" fill="var(--bg)" font-size="33.936332524115" font-family="Arial, sans-serif">Memory</text>
  <text x="1110.769229112426" y="591.000000000002" text-anchor="middle" fill="var(--bg)" font-size="33.936332524115" font-family="Arial, sans-serif">Ephemeral</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="76.25" width="1200" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640" y="40" text-anchor="middle" font-size="29.9142" font-weight="bold">Common Storage Patterns</text>
  <rect x="125.7143" y="130.625" width="257.1429" height="181.25" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="254.2857" y="185" text-anchor="middle" fill="var(--bg)" font-weight="bold">Shared Config</text>
  <text x="254.2857" y="230.3125" text-anchor="middle" fill="var(--bg)" font-size="18.2809">ConfigMap</text>
  <text x="254.2857" y="266.5625" text-anchor="middle" fill="var(--bg)" font-size="18.2809">ReadOnlyMany</text>
  <text x="254.2857" y="302.8125" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Multiple pods</text>
  <rect x="417.1429" y="130.625" width="257.1429" height="181.25" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="545.7143" y="185" text-anchor="middle" fill="var(--bg)" font-weight="bold">Database</text>
  <text x="545.7143" y="230.3125" text-anchor="middle" fill="var(--bg)" font-size="18.2809">StatefulSet</text>
  <text x="545.7143" y="266.5625" text-anchor="middle" fill="var(--bg)" font-size="18.2809">ReadWriteOnce</text>
  <text x="545.7143" y="302.8125" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Per-pod PVC</text>
  <rect x="708.5714" y="130.625" width="257.1429" height="181.25" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="837.1429" y="185" text-anchor="middle" font-weight="bold">Shared Data</text>
  <text x="837.1429" y="230.3125" text-anchor="middle" font-size="18.2809">NFS/CephFS</text>
  <text x="837.1429" y="266.5625" text-anchor="middle" font-size="18.2809">ReadWriteMany</text>
  <text x="837.1429" y="302.8125" text-anchor="middle" font-size="18.2809">Concurrent</text>
  <rect x="1000" y="130.625" width="240" height="181.25" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1120" y="185" text-anchor="middle" fill="var(--bg)" font-weight="bold">Cache</text>
  <text x="1120" y="230.3125" text-anchor="middle" fill="var(--bg)" font-size="18.2809">emptyDir</text>
  <text x="1120" y="266.5625" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Memory</text>
  <text x="1120" y="302.8125" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Ephemeral</text>
</svg>
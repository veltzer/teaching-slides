<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="1120" height="540" fill="#f0f0f0" stroke="#333" stroke-width="3.2" />
  <text x="640" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Container Storage Problem</text>
  <g id="without">
    <text x="320" y="144" text-anchor="middle" font-size="19.2">Without Volumes</text>
    <rect x="160" y="180" width="320" height="144" fill="#ea4335" rx="8" />
    <text x="320" y="234" text-anchor="middle" fill="white" font-weight="bold">Container</text>
    <text x="320" y="270" text-anchor="middle" fill="white" font-size="17.6">Writes data</text>
    <text x="320" y="306" text-anchor="middle" fill="white" font-size="17.6">Container crashes ❌</text>
    <rect x="160" y="360" width="320" height="108" fill="#888" rx="8" />
    <text x="320" y="423" text-anchor="middle" fill="white">Data Lost!</text>
  </g>
  <g id="with">
    <text x="880" y="144" text-anchor="middle" font-size="19.2">With Volumes</text>
    <rect x="720" y="180" width="320" height="144" fill="#34a853" rx="8" />
    <text x="880" y="234" text-anchor="middle" fill="white" font-weight="bold">Container</text>
    <text x="880" y="270" text-anchor="middle" fill="white" font-size="17.6">Writes to volume</text>
    <text x="880" y="306" text-anchor="middle" fill="white" font-size="17.6">Container crashes ✓</text>
    <rect x="720" y="360" width="320" height="108" fill="#4285f4" rx="8" />
    <text x="880" y="423" text-anchor="middle" fill="white">Data Persists!</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="688.3093" y="80" text-anchor="middle" font-size="30.9179" font-weight="bold">PV-PVC Binding Process</text>
  <rect x="108.599" y="145.2174" width="289.855" height="173.913" fill="var(--primary-fill)" rx="10.4167" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="253.5266" y="210.4349" text-anchor="middle" fill="var(--bg)" font-weight="bold">PV Created</text>
  <text x="253.5266" y="253.913" text-anchor="middle" fill="var(--bg)" font-size="19.3236">10Gi Available</text>
  <text x="253.5266" y="297.3913" text-anchor="middle" fill="var(--bg)" font-size="19.3236">Status: Available</text>
  <rect x="495.0725" y="145.2174" width="289.855" height="173.913" fill="var(--ok-fill)" rx="10.4167" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640.0001" y="210.4349" text-anchor="middle" fill="var(--bg)" font-weight="bold">PVC Created</text>
  <text x="640.0001" y="253.913" text-anchor="middle" fill="var(--bg)" font-size="19.3236">Request: 5Gi</text>
  <text x="640.0001" y="297.3913" text-anchor="middle" fill="var(--bg)" font-size="19.3236">Status: Pending</text>
  <rect x="881.5459" y="145.2174" width="289.855" height="173.913" fill="var(--warn-fill)" rx="10.4167" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1026.4735" y="210.4349" text-anchor="middle" font-weight="bold">Binding</text>
  <text x="1026.4735" y="253.913" text-anchor="middle" font-size="19.3236">Match found</text>
  <text x="1026.4735" y="297.3913" text-anchor="middle" font-size="19.3236">PVC → PV</text>
  <rect x="398.4543" y="406.087" width="579.7101" height="173.913" fill="var(--danger-fill)" rx="10.4167" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="688.3093" y="471.3043" text-anchor="middle" fill="var(--bg)" font-weight="bold">Bound State</text>
  <text x="688.3093" y="525.6523" text-anchor="middle" fill="var(--bg)" font-size="21.2561">PV Status: Bound</text>
  <text x="688.3093" y="569.1304" text-anchor="middle" fill="var(--bg)" font-size="21.2561">PVC Status: Bound</text>
  <path d="M 398.4543 232.174 L 485.4107 232.174" stroke="var(--text-muted)" stroke-width="2.2261" marker-end="url(#arrow)" />
  <path d="M 784.9277 232.174 L 871.8841 232.174" stroke="var(--text-muted)" stroke-width="2.2261" marker-end="url(#arrow)" />
  <path d="M 1026.4735 319.1304 L 688.3093 395.2174" stroke="var(--text-muted)" stroke-width="2.2261" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="54" text-anchor="middle" font-size="25.6" font-weight="bold">PV-PVC Binding Process</text>
  <rect x="160" y="108" width="240" height="144" fill="#4285f4" rx="8" />
  <text x="280" y="162" text-anchor="middle" fill="white" font-weight="bold">PV Created</text>
  <text x="280" y="198" text-anchor="middle" fill="white" font-size="16">10Gi Available</text>
  <text x="280" y="234" text-anchor="middle" fill="white" font-size="16">Status: Available</text>
  <rect x="480" y="108" width="240" height="144" fill="#34a853" rx="8" />
  <text x="600" y="162" text-anchor="middle" fill="white" font-weight="bold">PVC Created</text>
  <text x="600" y="198" text-anchor="middle" fill="white" font-size="16">Request: 5Gi</text>
  <text x="600" y="234" text-anchor="middle" fill="white" font-size="16">Status: Pending</text>
  <rect x="800" y="108" width="240" height="144" fill="#fbbc04" rx="8" />
  <text x="920" y="162" text-anchor="middle" font-weight="bold">Binding</text>
  <text x="920" y="198" text-anchor="middle" font-size="16">Match found</text>
  <text x="920" y="234" text-anchor="middle" font-size="16">PVC → PV</text>
  <rect x="400" y="324" width="480" height="144" fill="#ea4335" rx="8" />
  <text x="640" y="378" text-anchor="middle" fill="white" font-weight="bold">Bound State</text>
  <text x="640" y="423" text-anchor="middle" fill="white" font-size="17.6">PV Status: Bound</text>
  <text x="640" y="459" text-anchor="middle" fill="white" font-size="17.6">PVC Status: Bound</text>
  <path d="M 400 180 L 472 180" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 720 180 L 792 180" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 920 252 L 640 315" stroke="#666" stroke-width="3.2" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#666" />
    </marker>

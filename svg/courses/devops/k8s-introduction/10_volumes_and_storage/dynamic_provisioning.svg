<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="76.2499" width="1200" height="543.7501" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="639.9999" y="40" text-anchor="middle" font-size="29.9142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Dynamic Volume Provisioning</text>
  <rect x="125.7141" y="130.625" width="257.1429" height="108.7498" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.2857" y="175.9376" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">PVC Created</text>
  <text x="254.2857" y="212.1875" text-anchor="middle" fill="var(--bg)" font-size="16.6189" font-family="Arial, sans-serif">StorageClass: fast</text>
  <rect x="468.5713" y="130.625" width="257.1429" height="108.7498" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="597.143" y="175.9376" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Provisioner</text>
  <text x="597.143" y="212.1875" text-anchor="middle" fill="var(--bg)" font-size="16.6189" font-family="Arial, sans-serif">Creates storage</text>
  <rect x="811.4285" y="130.625" width="257.1429" height="108.7498" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="175.9376" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">PV Created</text>
  <text x="940" y="212.1875" text-anchor="middle" font-size="16.6189" font-family="Arial, sans-serif" fill="var(--warn-text)">Automatically</text>
  <rect x="468.5713" y="311.8749" width="257.1429" height="108.7498" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="597.143" y="357.1875" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Bound</text>
  <text x="597.143" y="393.4374" text-anchor="middle" fill="var(--bg)" font-size="16.6189" font-family="Arial, sans-serif">PVC → PV</text>
  <path d="M 382.8572 185 L 459.9999 185" stroke="var(--text-muted)" stroke-width="1.1693" marker-end="url(#arrow)"/>
  <path d="M 725.7144 185 L 802.8571 185" stroke="var(--text-muted)" stroke-width="1.1693" marker-end="url(#arrow)"/>
  <path d="M 940 239.3749 L 597.143 302.8125" stroke="var(--text-muted)" stroke-width="1.1693" marker-end="url(#arrow)"/>
  <rect x="297.1427" y="456.8752" width="685.7142" height="108.7498" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="502.1876" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">No Manual PV Creation Needed!</text>
  <text x="639.9999" y="538.4374" text-anchor="middle" font-size="18.2809" font-family="Arial, sans-serif" fill="var(--ok-text)">Storage provisioned on-demand</text>
</svg>

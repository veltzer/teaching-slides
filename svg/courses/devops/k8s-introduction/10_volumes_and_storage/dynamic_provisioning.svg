<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="55.6522" y="62.6087" width="779.1304" height="375.6522" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="445.2174" y="37.5652" text-anchor="middle" font-size="20.0348" font-weight="bold">Dynamic Volume Provisioning</text>
  <rect x="111.3043" y="100.1739" width="166.9565" height="75.1304" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="194.7826" y="131.4783" text-anchor="middle" fill="var(--bg)" font-weight="bold">PVC Created</text>
  <text x="194.7826" y="156.5217" text-anchor="middle" fill="var(--bg)" font-size="11.1304">StorageClass: fast</text>
  <rect x="333.913" y="100.1739" width="166.9565" height="75.1304" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="417.3913" y="131.4783" text-anchor="middle" fill="var(--bg)" font-weight="bold">Provisioner</text>
  <text x="417.3913" y="156.5217" text-anchor="middle" fill="var(--bg)" font-size="11.1304">Creates storage</text>
  <rect x="556.5217" y="100.1739" width="166.9565" height="75.1304" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="131.4783" text-anchor="middle" font-weight="bold">PV Created</text>
  <text x="640" y="156.5217" text-anchor="middle" font-size="11.1304">Automatically</text>
  <rect x="333.913" y="225.3913" width="166.9565" height="75.1304" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="417.3913" y="256.6957" text-anchor="middle" fill="var(--bg)" font-weight="bold">Bound</text>
  <text x="417.3913" y="281.7391" text-anchor="middle" fill="var(--bg)" font-size="11.1304">PVC → PV</text>
  <path d="M 278.2609 137.7391 L 328.3478 137.7391" stroke="var(--text-muted)" stroke-width="2.2261" marker-end="url(#arrow)" />
  <path d="M 500.8696 137.7391 L 550.9565 137.7391" stroke="var(--text-muted)" stroke-width="2.2261" marker-end="url(#arrow)" />
  <path d="M 640 175.3043 L 417.3913 219.1304" stroke="var(--text-muted)" stroke-width="2.2261" marker-end="url(#arrow)" />
  <rect x="222.6087" y="325.5652" width="445.2174" height="75.1304" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="445.2174" y="356.8696" text-anchor="middle" font-weight="bold">No Manual PV Creation Needed!</text>
  <text x="445.2174" y="381.913" text-anchor="middle" font-size="12.2435">Storage provisioned on-demand</text>
</svg>
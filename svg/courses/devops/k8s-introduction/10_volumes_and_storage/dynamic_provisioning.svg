<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect x="111.532" y="80.6291" width="704.6241" height="339.7295" fill="var(--surface)" stroke="var(--border)" stroke-width="0.7248" rx="5.4263" />
  <text x="463.844" y="57.9805" text-anchor="middle" font-size="18.1189" font-weight="bold">Dynamic Volume Provisioning</text>
  <rect x="161.8622" y="114.6021" width="150.9909" height="67.9458" fill="var(--primary-fill)" rx="5.4263" stroke="var(--primary-border)" stroke-width="1.4495" />
  <text x="237.3577" y="142.9129" text-anchor="middle" fill="var(--bg)" font-weight="bold">PVC Created</text>
  <text x="237.3577" y="165.5615" text-anchor="middle" fill="var(--bg)" font-size="10.066">StorageClass: fast</text>
  <rect x="363.1834" y="114.6021" width="150.9909" height="67.9458" fill="var(--ok-fill)" rx="5.4263" stroke="var(--ok-border)" stroke-width="1.4495" />
  <text x="438.6789" y="142.9129" text-anchor="middle" fill="var(--bg)" font-weight="bold">Provisioner</text>
  <text x="438.6789" y="165.5615" text-anchor="middle" fill="var(--bg)" font-size="10.066">Creates storage</text>
  <rect x="564.5045" y="114.6021" width="150.9909" height="67.9458" fill="var(--warn-fill)" rx="5.4263" stroke="var(--warn-border)" stroke-width="1.4495" />
  <text x="640" y="142.9129" text-anchor="middle" font-weight="bold">PV Created</text>
  <text x="640" y="165.5615" text-anchor="middle" font-size="10.066">Automatically</text>
  <rect x="363.1834" y="227.8452" width="150.9909" height="67.9458" fill="var(--danger-fill)" rx="5.4263" stroke="var(--danger-border)" stroke-width="1.4495" />
  <text x="438.6789" y="256.156" text-anchor="middle" fill="var(--bg)" font-weight="bold">Bound</text>
  <text x="438.6789" y="278.8046" text-anchor="middle" fill="var(--bg)" font-size="10.066">PVC → PV</text>
  <path d="M 312.8531 148.575 L 358.1503 148.575" stroke="var(--text-muted)" stroke-width="1.6134" marker-end="url(#arrow)" />
  <path d="M 514.1743 148.575 L 559.4715 148.575" stroke="var(--text-muted)" stroke-width="1.6134" marker-end="url(#arrow)" />
  <path d="M 640 182.5479 L 438.6789 222.1831" stroke="var(--text-muted)" stroke-width="1.6134" marker-end="url(#arrow)" />
  <rect x="262.5228" y="318.4398" width="402.6423" height="67.9458" fill="var(--ok-fill)" rx="5.4263" stroke="var(--ok-border)" stroke-width="1.4495" />
  <text x="463.844" y="346.7506" text-anchor="middle" font-weight="bold">No Manual PV Creation Needed!</text>
  <text x="463.844" y="369.3991" text-anchor="middle" font-size="11.0727">Storage provisioned on-demand</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="153.889" y="111.25" width="972.2221" height="468.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.487"/>
  <text x="640" y="80" text-anchor="middle" font-size="25" font-weight="bold">Dynamic Volume Provisioning</text>
  <rect x="223.3333" y="158.125" width="208.3333" height="93.7499" fill="var(--primary-fill)" rx="7.487" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="327.5" y="197.1876" text-anchor="middle" fill="var(--bg)" font-weight="bold">PVC Created</text>
  <text x="327.5" y="228.4375" text-anchor="middle" fill="var(--bg)" font-size="13.8888">StorageClass: fast</text>
  <rect x="501.1111" y="158.125" width="208.3333" height="93.7499" fill="var(--ok-fill)" rx="7.487" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="605.2778" y="197.1876" text-anchor="middle" fill="var(--bg)" font-weight="bold">Provisioner</text>
  <text x="605.2778" y="228.4375" text-anchor="middle" fill="var(--bg)" font-size="13.8888">Creates storage</text>
  <rect x="778.8888" y="158.125" width="208.3333" height="93.7499" fill="var(--warn-fill)" rx="7.487" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="883.0555" y="197.1876" text-anchor="middle" font-weight="bold">PV Created</text>
  <text x="883.0555" y="228.4375" text-anchor="middle" font-size="13.8888">Automatically</text>
  <rect x="501.1111" y="314.375" width="208.3333" height="93.7499" fill="var(--danger-fill)" rx="7.487" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="605.2778" y="353.4375" text-anchor="middle" fill="var(--bg)" font-weight="bold">Bound</text>
  <text x="605.2778" y="384.6874" text-anchor="middle" fill="var(--bg)" font-size="13.8888">PVC → PV</text>
  <path d="M 431.6667 205 L 494.1666 205" stroke="var(--text-muted)" stroke-width="2.2261" marker-end="url(#arrow)" />
  <path d="M 709.4445 205 L 771.9444 205" stroke="var(--text-muted)" stroke-width="2.2261" marker-end="url(#arrow)" />
  <path d="M 883.0555 251.8749 L 605.2778 306.5625" stroke="var(--text-muted)" stroke-width="2.2261" marker-end="url(#arrow)" />
  <rect x="362.2222" y="439.375" width="555.5555" height="93.7499" fill="var(--ok-fill)" rx="7.487" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="478.4375" text-anchor="middle" font-weight="bold">No Manual PV Creation Needed!</text>
  <text x="640" y="509.6874" text-anchor="middle" font-size="15.2778">Storage provisioned on-demand</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <rect x="40" y="76.2499" width="1200" height="543.7501" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="639.9999" y="40" text-anchor="middle" font-size="29.9142" font-weight="bold">Dynamic Volume Provisioning</text>
  <rect x="125.7141" y="130.625" width="257.1429" height="108.7498" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.2857" y="175.9376" text-anchor="middle" fill="var(--bg)" font-weight="bold">PVC Created</text>
  <text x="254.2857" y="212.1875" text-anchor="middle" fill="var(--bg)" font-size="16.6189">StorageClass: fast</text>
  <rect x="468.5713" y="130.625" width="257.1429" height="108.7498" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="597.143" y="175.9376" text-anchor="middle" fill="var(--bg)" font-weight="bold">Provisioner</text>
  <text x="597.143" y="212.1875" text-anchor="middle" fill="var(--bg)" font-size="16.6189">Creates storage</text>
  <rect x="811.4285" y="130.625" width="257.1429" height="108.7498" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="175.9376" text-anchor="middle" font-weight="bold">PV Created</text>
  <text x="940" y="212.1875" text-anchor="middle" font-size="16.6189">Automatically</text>
  <rect x="468.5713" y="311.8749" width="257.1429" height="108.7498" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="597.143" y="357.1875" text-anchor="middle" fill="var(--bg)" font-weight="bold">Bound</text>
  <text x="597.143" y="393.4374" text-anchor="middle" fill="var(--bg)" font-size="16.6189">PVC → PV</text>
  <path d="M 382.8572 185 L 459.9999 185" stroke="var(--text-muted)" stroke-width="1.1693" marker-end="url(#arrow)" />
  <path d="M 725.7144 185 L 802.8571 185" stroke="var(--text-muted)" stroke-width="1.1693" marker-end="url(#arrow)" />
  <path d="M 940 239.3749 L 597.143 302.8125" stroke="var(--text-muted)" stroke-width="1.1693" marker-end="url(#arrow)" />
  <rect x="297.1427" y="456.8752" width="685.7142" height="108.7498" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="502.1876" text-anchor="middle" font-weight="bold">No Manual PV Creation Needed!</text>
  <text x="639.9999" y="538.4374" text-anchor="middle" font-size="18.2809">Storage provisioned on-demand</text>
</svg>
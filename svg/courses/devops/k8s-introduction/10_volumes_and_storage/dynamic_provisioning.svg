<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="327.272727272727" height="144.999733333333" fill="url(#grad-primary)" rx="7.816066716009" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.636554545423" y="100.4168" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">PVC Created</text>
  <text x="203.636554545423" y="148.75" text-anchor="middle" fill="var(--bg)" font-size="21.649071857779" font-family="Arial, sans-serif">StorageClass: fast</text>
  <rect x="476.363636363636" y="40" width="327.272727272727" height="144.999733333333" fill="url(#grad-ok)" rx="7.816066716009" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000318181765" y="100.4168" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Provisioner</text>
  <text x="640.000318181765" y="148.75" text-anchor="middle" fill="var(--bg)" font-size="21.649071857779" font-family="Arial, sans-serif">Creates storage</text>
  <rect x="912.727272727273" y="40" width="327.272727272727" height="144.999733333333" fill="url(#grad-warn)" rx="7.816066716009" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.363699999989" y="100.4168" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">PV Created</text>
  <text x="1076.363699999989" y="148.75" text-anchor="middle" font-size="21.649071857779" font-family="Arial, sans-serif" fill="var(--warn-text)">Automatically</text>
  <rect x="476.363636363636" y="281.666533333334" width="327.272727272727" height="144.999733333333" fill="url(#grad-danger)" rx="7.816066716009" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000318181765" y="342.083333333334" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Bound</text>
  <text x="640.000318181765" y="390.416533333335" text-anchor="middle" fill="var(--bg)" font-size="21.649071857779" font-family="Arial, sans-serif">PVC → PV</text>
  <path d="M 367.272981818139 112.500000000001 L 465.454583636357 112.500000000001" stroke="var(--text-muted)" stroke-width="1.1693" marker-end="url(#arrow)"/>
  <path d="M 803.636618181776 112.500000000001 L 901.818219999994 112.500000000001" stroke="var(--text-muted)" stroke-width="1.1693" marker-end="url(#arrow)"/>
  <path d="M 1076.363699999989 184.999866666667 L 640.000318181765 269.583333333333" stroke="var(--text-muted)" stroke-width="1.1693" marker-end="url(#arrow)"/>
  <rect x="258.181818181818" y="475.000266666667" width="872.727018181861" height="144.999733333333" fill="url(#grad-ok)" rx="7.816066716009" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="694.545454545455" y="535.416800000001" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">No Manual PV Creation Needed!</text>
  <text x="694.545454545455" y="583.749866666668" text-anchor="middle" font-size="23.814122338113" font-family="Arial, sans-serif" fill="var(--ok-text)">Storage provisioned on-demand</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="153.8889" y="111.25" width="972.2222" height="468.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.3333"/>
  <text x="640" y="80" text-anchor="middle" font-size="25" font-weight="bold">StatefulSet Volume Claims</text>
  <rect x="223.3333" y="158.125" width="277.7778" height="93.75" fill="var(--primary-fill)" rx="8.3333" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="362.2222" y="205" text-anchor="middle" fill="var(--bg)" font-weight="bold">web-0</text>
  <text x="362.2222" y="236.25" text-anchor="middle" fill="var(--bg)" font-size="15.2778">Pod</text>
  <rect x="223.3333" y="283.125" width="277.7778" height="93.75" fill="var(--ok-fill)" rx="8.3333" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="362.2222" y="330" text-anchor="middle" fill="var(--bg)" font-weight="bold">www-web-0</text>
  <text x="362.2222" y="361.25" text-anchor="middle" fill="var(--bg)" font-size="15.2778">PVC (1Gi)</text>
  <rect x="528.8889" y="158.125" width="277.7778" height="93.75" fill="var(--primary-fill)" rx="8.3333" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="667.7778" y="205" text-anchor="middle" fill="var(--bg)" font-weight="bold">web-1</text>
  <text x="667.7778" y="236.25" text-anchor="middle" fill="var(--bg)" font-size="15.2778">Pod</text>
  <rect x="528.8889" y="283.125" width="277.7778" height="93.75" fill="var(--ok-fill)" rx="8.3333" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="667.7778" y="330" text-anchor="middle" fill="var(--bg)" font-weight="bold">www-web-1</text>
  <text x="667.7778" y="361.25" text-anchor="middle" fill="var(--bg)" font-size="15.2778">PVC (1Gi)</text>
  <rect x="834.4444" y="158.125" width="277.7778" height="93.75" fill="var(--primary-fill)" rx="8.3333" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="973.3333" y="205" text-anchor="middle" fill="var(--bg)" font-weight="bold">web-2</text>
  <text x="973.3333" y="236.25" text-anchor="middle" fill="var(--bg)" font-size="15.2778">Pod</text>
  <rect x="834.4444" y="283.125" width="277.7778" height="93.75" fill="var(--ok-fill)" rx="8.3333" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="973.3333" y="330" text-anchor="middle" fill="var(--bg)" font-weight="bold">www-web-2</text>
  <text x="973.3333" y="361.25" text-anchor="middle" fill="var(--bg)" font-size="15.2778">PVC (1Gi)</text>
  <path d="M 362.2222 251.875 L 362.2222 275.3125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 667.7778 251.875 L 667.7778 275.3125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 973.3333 251.875 L 973.3333 275.3125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="439.375" text-anchor="middle" font-size="16.6667">Each pod gets its own PVC</text>
  <text x="640" y="470.625" text-anchor="middle" font-size="16.6667">PVCs persist when pods are deleted</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="375.000047851561" height="173.99984" fill="url(#grad-primary)" rx="7.937253778169" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.50002392578" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">web-0</text>
  <text x="227.50002392578" y="185.00016" text-anchor="middle" fill="var(--bg)" font-size="24.183357098889" font-family="Arial, sans-serif">Pod</text>
  <rect x="40" y="272" width="375.000047851561" height="173.99984" fill="url(#grad-ok)" rx="7.937253778169" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.50002392578" y="359" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">www-web-0</text>
  <text x="227.50002392578" y="417.00016" text-anchor="middle" fill="var(--bg)" font-size="24.183357098889" font-family="Arial, sans-serif">PVC (1Gi)</text>
  <rect x="452.499921386722" y="40" width="375.000047851561" height="173.99984" fill="url(#grad-primary)" rx="7.937253778169" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000164062494" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">web-1</text>
  <text x="640.000164062494" y="185.00016" text-anchor="middle" fill="var(--bg)" font-size="24.183357098889" font-family="Arial, sans-serif">Pod</text>
  <rect x="452.499921386722" y="272" width="375.000047851561" height="173.99984" fill="url(#grad-ok)" rx="7.937253778169" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000164062494" y="359" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">www-web-1</text>
  <text x="640.000164062494" y="417.00016" text-anchor="middle" fill="var(--bg)" font-size="24.183357098889" font-family="Arial, sans-serif">PVC (1Gi)</text>
  <rect x="864.999952148439" y="40" width="375.000047851561" height="173.99984" fill="url(#grad-primary)" rx="7.937253778169" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.49997607422" y="127" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">web-2</text>
  <text x="1052.49997607422" y="185.00016" text-anchor="middle" fill="var(--bg)" font-size="24.183357098889" font-family="Arial, sans-serif">Pod</text>
  <rect x="864.999952148439" y="272" width="375.000047851561" height="173.99984" fill="url(#grad-ok)" rx="7.937253778169" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.49997607422" y="359" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">www-web-2</text>
  <text x="1052.49997607422" y="417.00016" text-anchor="middle" fill="var(--bg)" font-size="24.183357098889" font-family="Arial, sans-serif">PVC (1Gi)</text>
  <path d="M 227.50002392578 213.999999999999 L 227.50002392578 257.5" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)"/>
  <path d="M 640.000164062494 213.999999999999 L 640.000164062494 257.5" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)"/>
  <path d="M 1052.49997607422 213.999999999999 L 1052.49997607422 257.5" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)"/>
  <text x="602.49985302735" y="562" text-anchor="middle" font-size="26.381844107879" font-family="Arial, sans-serif" fill="var(--text)">Each pod gets its own PVC</text>
  <text x="602.49985302735" y="620" text-anchor="middle" font-size="26.381844107879" font-family="Arial, sans-serif" fill="var(--text)">PVCs persist when pods are deleted</text>
</svg>

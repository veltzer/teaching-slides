  <ns0:path d="M 420 157.5 L 420 174.375" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  <ns0:path d="M 640 157.5 L 640 174.375" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />

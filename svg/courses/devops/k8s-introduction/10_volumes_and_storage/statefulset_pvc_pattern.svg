  <text x="297.1429" y="185" text-anchor="middle" fill="var(--bg)" font-weight="bold">web-0</text>
  <text x="297.1429" y="221.2501" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Pod</text>
  <rect x="125.7143" y="275.625" width="342.8572" height="108.7499" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1429" y="330" text-anchor="middle" fill="var(--bg)" font-weight="bold">www-web-0</text>
  <text x="297.1429" y="366.2501" text-anchor="middle" fill="var(--bg)" font-size="18.2809">PVC (1Gi)</text>
  <rect x="502.8571" y="130.625" width="342.8572" height="108.7499" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.2859" y="185" text-anchor="middle" fill="var(--bg)" font-weight="bold">web-1</text>
  <text x="674.2859" y="221.2501" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Pod</text>
  <rect x="502.8571" y="275.625" width="342.8572" height="108.7499" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.2859" y="330" text-anchor="middle" fill="var(--bg)" font-weight="bold">www-web-1</text>
  <text x="674.2859" y="366.2501" text-anchor="middle" fill="var(--bg)" font-size="18.2809">PVC (1Gi)</text>
  <rect x="880" y="130.625" width="342.8572" height="108.7499" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4286" y="185" text-anchor="middle" fill="var(--bg)" font-weight="bold">web-2</text>
  <text x="1051.4286" y="221.2501" text-anchor="middle" fill="var(--bg)" font-size="18.2809">Pod</text>
  <rect x="880" y="275.625" width="342.8572" height="108.7499" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4286" y="330" text-anchor="middle" fill="var(--bg)" font-weight="bold">www-web-2</text>
  <text x="1051.4286" y="366.2501" text-anchor="middle" fill="var(--bg)" font-size="18.2809">PVC (1Gi)</text>
  <path d="M 297.1429 239.375 L 297.1429 266.5625" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)" />
  <path d="M 674.2859 239.375 L 674.2859 266.5625" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)" />
  <path d="M 1051.4286 239.375 L 1051.4286 266.5625" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)" />
  <text x="639.9999" y="456.875" text-anchor="middle" font-size="19.9428">Each pod gets its own PVC</text>
  <text x="639.9999" y="493.125" text-anchor="middle" font-size="19.9428">PVCs persist when pods are deleted</text>
</svg>
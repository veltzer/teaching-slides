<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.196775063387"/>
  <rect x="125.7143" y="97.999711999841" width="342.8572" height="115.99995733331" fill="url(#grad-primary)" rx="6.196775063387" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1429" y="155.999743999859" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">web-0</text>
  <text x="297.1429" y="194.666538666596" text-anchor="middle" fill="var(--bg)" font-size="18.880437542713" font-family="Arial, sans-serif">Pod</text>
  <rect x="125.7143" y="252.666463999888" width="342.8572" height="115.99995733331" fill="url(#grad-ok)" rx="6.196775063387" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1429" y="310.666495999906" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">www-web-0</text>
  <text x="297.1429" y="349.333290666643" text-anchor="middle" fill="var(--bg)" font-size="18.880437542713" font-family="Arial, sans-serif">PVC (1Gi)</text>
  <rect x="502.8571" y="97.999711999841" width="342.8572" height="115.99995733331" fill="url(#grad-primary)" rx="6.196775063387" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.2859" y="155.999743999859" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">web-1</text>
  <text x="674.2859" y="194.666538666596" text-anchor="middle" fill="var(--bg)" font-size="18.880437542713" font-family="Arial, sans-serif">Pod</text>
  <rect x="502.8571" y="252.666463999888" width="342.8572" height="115.99995733331" fill="url(#grad-ok)" rx="6.196775063387" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.2859" y="310.666495999906" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">www-web-1</text>
  <text x="674.2859" y="349.333290666643" text-anchor="middle" fill="var(--bg)" font-size="18.880437542713" font-family="Arial, sans-serif">PVC (1Gi)</text>
  <rect x="880" y="97.999711999841" width="342.8572" height="115.99995733331" fill="url(#grad-primary)" rx="6.196775063387" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4286" y="155.999743999859" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">web-2</text>
  <text x="1051.4286" y="194.666538666596" text-anchor="middle" fill="var(--bg)" font-size="18.880437542713" font-family="Arial, sans-serif">Pod</text>
  <rect x="880" y="252.666463999888" width="342.8572" height="115.99995733331" fill="url(#grad-ok)" rx="6.196775063387" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4286" y="310.666495999906" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">www-web-2</text>
  <text x="1051.4286" y="349.333290666643" text-anchor="middle" fill="var(--bg)" font-size="18.880437542713" font-family="Arial, sans-serif">PVC (1Gi)</text>
  <path d="M 297.1429 213.999775999876 L 297.1429 242.999791999885" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)"/>
  <path d="M 674.2859 213.999775999876 L 674.2859 242.999791999885" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)"/>
  <path d="M 1051.4286 213.999775999876 L 1051.4286 242.999791999885" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)"/>
  <text x="639.9999" y="445.999903999947" text-anchor="middle" font-size="20.596840955687" font-family="Arial, sans-serif" fill="var(--text)">Each pod gets its own PVC</text>
  <text x="639.9999" y="484.666591999959" text-anchor="middle" font-size="20.596840955687" font-family="Arial, sans-serif" fill="var(--text)">PVCs persist when pods are deleted</text>
</svg>

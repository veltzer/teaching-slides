<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="76.2503" width="1200" height="543.7497" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="639.9999" y="40" text-anchor="middle" font-size="29.9142" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">StatefulSet Volume Claims</text>
  <rect x="125.7143" y="130.625" width="342.8572" height="108.7499" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1429" y="185" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">web-0</text>
  <text x="297.1429" y="221.2501" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Pod</text>
  <rect x="125.7143" y="275.625" width="342.8572" height="108.7499" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.1429" y="330" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">www-web-0</text>
  <text x="297.1429" y="366.2501" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">PVC (1Gi)</text>
  <rect x="502.8571" y="130.625" width="342.8572" height="108.7499" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.2859" y="185" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">web-1</text>
  <text x="674.2859" y="221.2501" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Pod</text>
  <rect x="502.8571" y="275.625" width="342.8572" height="108.7499" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.2859" y="330" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">www-web-1</text>
  <text x="674.2859" y="366.2501" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">PVC (1Gi)</text>
  <rect x="880" y="130.625" width="342.8572" height="108.7499" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4286" y="185" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">web-2</text>
  <text x="1051.4286" y="221.2501" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">Pod</text>
  <rect x="880" y="275.625" width="342.8572" height="108.7499" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4286" y="330" text-anchor="middle" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">www-web-2</text>
  <text x="1051.4286" y="366.2501" text-anchor="middle" fill="var(--bg)" font-size="18.2809" font-family="Arial, sans-serif">PVC (1Gi)</text>
  <path d="M 297.1429 239.375 L 297.1429 266.5625" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)" />
  <path d="M 674.2859 239.375 L 674.2859 266.5625" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)" />
  <path d="M 1051.4286 239.375 L 1051.4286 266.5625" stroke="var(--text-muted)" stroke-width="0.8647" marker-end="url(#arrow)" />
  <text x="639.9999" y="456.875" text-anchor="middle" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--text)">Each pod gets its own PVC</text>
  <text x="639.9999" y="493.125" text-anchor="middle" font-size="19.9428" font-family="Arial, sans-serif" fill="var(--text)">PVCs persist when pods are deleted</text>
</svg>
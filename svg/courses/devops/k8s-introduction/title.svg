<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#121d33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Kubernetes wheel logo -->
  <g transform="translate(400,180)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#326ce5" stroke-width="4" opacity="0.7"/>
    <circle cx="0" cy="0" r="30" fill="#326ce5" opacity="0.85"/>
    <circle cx="0" cy="0" r="18" fill="#fff" opacity="0.9"/>
    <!-- Seven spokes -->
    <line x1="0" y1="-30" x2="0" y2="-95" stroke="#326ce5" stroke-width="5" stroke-linecap="round"/>
    <line x1="26" y1="-15" x2="83" y2="-48" stroke="#326ce5" stroke-width="5" stroke-linecap="round"/>
    <line x1="26" y1="15" x2="83" y2="48" stroke="#326ce5" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="30" x2="0" y2="95" stroke="#326ce5" stroke-width="5" stroke-linecap="round"/>
    <line x1="-26" y1="15" x2="-83" y2="48" stroke="#326ce5" stroke-width="5" stroke-linecap="round"/>
    <line x1="-26" y1="-15" x2="-83" y2="-48" stroke="#326ce5" stroke-width="5" stroke-linecap="round"/>
    <!-- Pod dots on spokes -->
    <circle cx="0" cy="-100" r="10" fill="#326ce5" opacity="0.6"/>
    <circle cx="87" cy="-50" r="10" fill="#326ce5" opacity="0.6"/>
    <circle cx="87" cy="50" r="10" fill="#326ce5" opacity="0.6"/>
    <circle cx="0" cy="100" r="10" fill="#326ce5" opacity="0.6"/>
    <circle cx="-87" cy="50" r="10" fill="#326ce5" opacity="0.6"/>
    <circle cx="-87" cy="-50" r="10" fill="#326ce5" opacity="0.6"/>
  </g>
  <!-- Container boxes on the sides -->
  <g opacity="0.5">
    <!-- Left containers -->
    <rect x="80" y="120" width="60" height="45" rx="4" fill="none" stroke="#326ce5" stroke-width="1.5"/>
    <rect x="88" y="128" width="44" height="10" rx="2" fill="#326ce5" opacity="0.3"/>
    <rect x="88" y="143" width="44" height="10" rx="2" fill="#326ce5" opacity="0.3"/>
    <rect x="80" y="185" width="60" height="45" rx="4" fill="none" stroke="#326ce5" stroke-width="1.5"/>
    <rect x="88" y="193" width="44" height="10" rx="2" fill="#326ce5" opacity="0.3"/>
    <rect x="88" y="208" width="44" height="10" rx="2" fill="#326ce5" opacity="0.3"/>
    <!-- Right containers -->
    <rect x="660" y="120" width="60" height="45" rx="4" fill="none" stroke="#326ce5" stroke-width="1.5"/>
    <rect x="668" y="128" width="44" height="10" rx="2" fill="#326ce5" opacity="0.3"/>
    <rect x="668" y="143" width="44" height="10" rx="2" fill="#326ce5" opacity="0.3"/>
    <rect x="660" y="185" width="60" height="45" rx="4" fill="none" stroke="#326ce5" stroke-width="1.5"/>
    <rect x="668" y="193" width="44" height="10" rx="2" fill="#326ce5" opacity="0.3"/>
    <rect x="668" y="208" width="44" height="10" rx="2" fill="#326ce5" opacity="0.3"/>
  </g>
  <!-- Connection lines from containers to wheel -->
  <line x1="145" y1="145" x2="295" y2="170" stroke="#326ce5" stroke-width="1" opacity="0.3"/>
  <line x1="145" y1="210" x2="295" y2="195" stroke="#326ce5" stroke-width="1" opacity="0.3"/>
  <line x1="655" y1="145" x2="505" y2="170" stroke="#326ce5" stroke-width="1" opacity="0.3"/>
  <line x1="655" y1="210" x2="505" y2="195" stroke="#326ce5" stroke-width="1" opacity="0.3"/>
  <!-- Docker whale hint at bottom -->
  <g transform="translate(400,340)" opacity="0.3">
    <rect x="-30" y="-8" width="12" height="10" rx="1" fill="#2496ed"/>
    <rect x="-15" y="-8" width="12" height="10" rx="1" fill="#2496ed"/>
    <rect x="0" y="-8" width="12" height="10" rx="1" fill="#2496ed"/>
    <rect x="-15" y="-20" width="12" height="10" rx="1" fill="#2496ed"/>
    <rect x="0" y="-20" width="12" height="10" rx="1" fill="#2496ed"/>
    <path d="M -40 5 Q -20 15 40 5" fill="none" stroke="#2496ed" stroke-width="3"/>
  </g>
  <!-- Decorative particles -->
  <circle cx="60" cy="60" r="2" fill="#326ce5" opacity="0.3"/>
  <circle cx="740" cy="70" r="3" fill="#326ce5" opacity="0.25"/>
  <circle cx="100" cy="370" r="2" fill="#326ce5" opacity="0.3"/>
  <circle cx="700" cy="380" r="2" fill="#326ce5" opacity="0.25"/>
  <!-- Bottom accent -->
  <rect x="300" y="380" width="200" height="3" rx="1.5" fill="#326ce5" opacity="0.4"/>
</svg>

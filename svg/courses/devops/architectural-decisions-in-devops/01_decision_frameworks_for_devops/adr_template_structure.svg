<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="54.3236" y="22.069" width="1068.3643" height="617.931" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="588.5057" y="83.8621" text-anchor="middle" font-size="27.1618" font-weight="bold">ADR-0001: Use Kubernetes for Orchestration</text>
  <line x1="90.5393" y1="105.931" x2="1086.4722" y2="105.931" stroke="var(--border)" stroke-width="1.8108" />
  <text x="90.5393" y="158.8966" font-size="23.5402" font-weight="bold" fill="var(--primary-accent)">Status:</text>
  <text x="217.2944" y="158.8966" font-size="23.5402">Accepted</text>
  <line x1="90.5393" y1="180.9655" x2="1086.4722" y2="180.9655" stroke="var(--surface)" stroke-width="1.8108" />
  <text x="90.5393" y="233.931" font-size="23.5402" font-weight="bold" fill="var(--primary-accent)">Context:</text>
  <text x="90.5393" y="273.6552" font-size="19.9186">We need container orchestration for 30+ microservices.</text>
  <text x="90.5393" y="308.9655" font-size="19.9186">Team has experience with both Docker Swarm and Kubernetes.</text>
  <line x1="90.5393" y1="331.0345" x2="1086.4722" y2="331.0345" stroke="var(--surface)" stroke-width="1.8108" />
  <text x="90.5393" y="384" font-size="23.5402" font-weight="bold" fill="var(--primary-accent)">Decision:</text>
  <text x="90.5393" y="423.7241" font-size="19.9186">We will use Kubernetes (EKS) for container orchestration.</text>
  <line x1="90.5393" y1="445.7931" x2="1086.4722" y2="445.7931" stroke="var(--surface)" stroke-width="1.8108" />
  <text x="90.5393" y="498.7586" font-size="23.5402" font-weight="bold" fill="var(--primary-accent)">Consequences:</text>
  <text x="90.5393" y="538.4828" font-size="19.9186">+ Industry standard, large ecosystem, strong hiring pool.</text>
  <text x="90.5393" y="573.7931" font-size="19.9186">- Steeper learning curve, higher initial operational cost.</text>
  <text x="90.5393" y="609.1034" font-size="19.9186">- Requires investment in cluster management tooling.</text>
</svg>
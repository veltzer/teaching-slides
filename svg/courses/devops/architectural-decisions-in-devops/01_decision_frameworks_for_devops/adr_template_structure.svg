<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.999893" y="40" text-anchor="middle" font-size="31.330557" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">ADR-0001: Use Kubernetes for Orchestration</text>
  <line x1="40" y1="64.369647" x2="1240" y2="64.369647" stroke="var(--border)" stroke-width="1.8108" />
  <text x="40" y="122.857176" font-size="27.153187" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Status:</text>
  <text x="192.727275" y="122.857176" font-size="27.153187" font-family="Arial, sans-serif" fill="var(--text)">Accepted</text>
  <line x1="40" y1="147.226824" x2="1240" y2="147.226824" stroke="var(--surface)" stroke-width="1.8108" />
  <text x="40" y="205.714235" font-size="27.153187" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Context:</text>
  <text x="40" y="249.579882" font-size="22.975704" font-family="Arial, sans-serif" fill="var(--text)">We need container orchestration for 30+ microservices.</text>
  <text x="40" y="288.571412" font-size="22.975704" font-family="Arial, sans-serif" fill="var(--text)">Team has experience with both Docker Swarm and Kubernetes.</text>
  <line x1="40" y1="312.941176" x2="1240" y2="312.941176" stroke="var(--surface)" stroke-width="1.8108" />
  <text x="40" y="371.428588" font-size="27.153187" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Decision:</text>
  <text x="40" y="415.294118" font-size="22.975704" font-family="Arial, sans-serif" fill="var(--text)">We will use Kubernetes (EKS) for container orchestration.</text>
  <line x1="40" y1="439.663882" x2="1240" y2="439.663882" stroke="var(--surface)" stroke-width="1.8108" />
  <text x="40" y="498.151176" font-size="27.153187" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Consequences:</text>
  <text x="40" y="542.016824" font-size="22.975704" font-family="Arial, sans-serif" fill="var(--text)">+ Industry standard, large ecosystem, strong hiring pool.</text>
  <text x="40" y="581.008353" font-size="22.975704" font-family="Arial, sans-serif" fill="var(--text)">- Steeper learning curve, higher initial operational cost.</text>
  <text x="40" y="620" font-size="22.975704" font-family="Arial, sans-serif" fill="var(--text)">- Requires investment in cluster management tooling.</text>
</svg>
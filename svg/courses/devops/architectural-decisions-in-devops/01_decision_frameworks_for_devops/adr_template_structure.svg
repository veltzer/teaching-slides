<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:rect x="54.3236" y="22.069" width="1068.3643" height="617.931" fill="#f5f5f5" stroke="#333" stroke-width="3.6216" rx="10.8647" />
  <ns0:text x="588.5057" y="83.8621" text-anchor="middle" font-size="27.1618" font-weight="bold">ADR-0001: Use Kubernetes for Orchestration</ns0:text>
  <ns0:line x1="90.5393" y1="105.931" x2="1086.4722" y2="105.931" stroke="#ccc" stroke-width="1.8108" />
  <ns0:text x="90.5393" y="158.8966" font-size="23.5402" font-weight="bold" fill="#1565c0">Status:</ns0:text>
  <ns0:text x="217.2944" y="158.8966" font-size="23.5402">Accepted</ns0:text>
  <ns0:line x1="90.5393" y1="180.9655" x2="1086.4722" y2="180.9655" stroke="#eee" stroke-width="1.8108" />
  <ns0:text x="90.5393" y="233.931" font-size="23.5402" font-weight="bold" fill="#1565c0">Context:</ns0:text>
  <ns0:text x="90.5393" y="273.6552" font-size="19.9186">We need container orchestration for 30+ microservices.</ns0:text>
  <ns0:text x="90.5393" y="308.9655" font-size="19.9186">Team has experience with both Docker Swarm and Kubernetes.</ns0:text>
  <ns0:line x1="90.5393" y1="331.0345" x2="1086.4722" y2="331.0345" stroke="#eee" stroke-width="1.8108" />
  <ns0:text x="90.5393" y="384" font-size="23.5402" font-weight="bold" fill="#1565c0">Decision:</ns0:text>
  <ns0:text x="90.5393" y="423.7241" font-size="19.9186">We will use Kubernetes (EKS) for container orchestration.</ns0:text>
  <ns0:line x1="90.5393" y1="445.7931" x2="1086.4722" y2="445.7931" stroke="#eee" stroke-width="1.8108" />
  <ns0:text x="90.5393" y="498.7586" font-size="23.5402" font-weight="bold" fill="#1565c0">Consequences:</ns0:text>
  <ns0:text x="90.5393" y="538.4828" font-size="19.9186">+ Industry standard, large ecosystem, strong hiring pool.</ns0:text>
  <ns0:text x="90.5393" y="573.7931" font-size="19.9186">- Steeper learning curve, higher initial operational cost.</ns0:text>
  <ns0:text x="90.5393" y="609.1034" font-size="19.9186">- Requires investment in cluster management tooling.</ns0:text>
</ns0:svg>
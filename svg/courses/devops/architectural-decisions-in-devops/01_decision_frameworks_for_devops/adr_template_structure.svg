<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="59.0769" y="24" width="1161.8462" height="672" fill="#f5f5f5" stroke="#333" stroke-width="3.9385" rx="11.8154" />
  <text x="640" y="91.2" text-anchor="middle" font-size="29.5385" font-weight="bold">ADR-0001: Use Kubernetes for Orchestration</text>
  <line x1="98.4615" y1="115.2" x2="1181.5385" y2="115.2" stroke="#ccc" stroke-width="1.9692" />
  <text x="98.4615" y="172.8" font-size="25.6" font-weight="bold" fill="#1565c0">Status:</text>
  <text x="236.3077" y="172.8" font-size="25.6">Accepted</text>
  <line x1="98.4615" y1="196.8" x2="1181.5385" y2="196.8" stroke="#eee" stroke-width="1.9692" />
  <text x="98.4615" y="254.4" font-size="25.6" font-weight="bold" fill="#1565c0">Context:</text>
  <text x="98.4615" y="297.6" font-size="21.6615">We need container orchestration for 30+ microservices.</text>
  <text x="98.4615" y="336" font-size="21.6615">Team has experience with both Docker Swarm and Kubernetes.</text>
  <line x1="98.4615" y1="360" x2="1181.5385" y2="360" stroke="#eee" stroke-width="1.9692" />
  <text x="98.4615" y="417.6" font-size="25.6" font-weight="bold" fill="#1565c0">Decision:</text>
  <text x="98.4615" y="460.8" font-size="21.6615">We will use Kubernetes (EKS) for container orchestration.</text>
  <line x1="98.4615" y1="484.8" x2="1181.5385" y2="484.8" stroke="#eee" stroke-width="1.9692" />
  <text x="98.4615" y="542.4" font-size="25.6" font-weight="bold" fill="#1565c0">Consequences:</text>
  <text x="98.4615" y="585.6" font-size="21.6615">+ Industry standard, large ecosystem, strong hiring pool.</text>
  <text x="98.4615" y="624" font-size="21.6615">- Steeper learning curve, higher initial operational cost.</text>
  <text x="98.4615" y="662.4" font-size="21.6615">- Requires investment in cluster management tooling.</text>
</svg>
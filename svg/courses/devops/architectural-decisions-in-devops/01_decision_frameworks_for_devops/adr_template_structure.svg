<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="639.9999" y="98" text-anchor="middle" font-size="27.889" font-weight="bold">ADR-0001: Use Kubernetes for Orchestration</text>
  <line x1="80.6779" y1="118.7142" x2="1199.3221" y2="118.7142" stroke="var(--border)" stroke-width="1.8108" />
  <text x="80.6779" y="168.4286" font-size="24.1705" font-weight="bold" fill="var(--primary-accent)">Status:</text>
  <text x="223.0508" y="168.4286" font-size="24.1705">Accepted</text>
  <line x1="80.6779" y1="189.1428" x2="1199.3221" y2="189.1428" stroke="var(--surface)" stroke-width="1.8108" />
  <text x="80.6779" y="238.8571" font-size="24.1705" font-weight="bold" fill="var(--primary-accent)">Context:</text>
  <text x="80.6779" y="276.1429" font-size="20.4519">We need container orchestration for 30+ microservices.</text>
  <text x="80.6779" y="309.2857" font-size="20.4519">Team has experience with both Docker Swarm and Kubernetes.</text>
  <line x1="80.6779" y1="330" x2="1199.3221" y2="330" stroke="var(--surface)" stroke-width="1.8108" />
  <text x="80.6779" y="379.7143" font-size="24.1705" font-weight="bold" fill="var(--primary-accent)">Decision:</text>
  <text x="80.6779" y="417" font-size="20.4519">We will use Kubernetes (EKS) for container orchestration.</text>
  <line x1="80.6779" y1="437.7143" x2="1199.3221" y2="437.7143" stroke="var(--surface)" stroke-width="1.8108" />
  <text x="80.6779" y="487.4285" font-size="24.1705" font-weight="bold" fill="var(--primary-accent)">Consequences:</text>
  <text x="80.6779" y="524.7143" font-size="20.4519">+ Industry standard, large ecosystem, strong hiring pool.</text>
  <text x="80.6779" y="557.8571" font-size="20.4519">- Steeper learning curve, higher initial operational cost.</text>
  <text x="80.6779" y="591" font-size="20.4519">- Requires investment in cluster management tooling.</text>
</svg>
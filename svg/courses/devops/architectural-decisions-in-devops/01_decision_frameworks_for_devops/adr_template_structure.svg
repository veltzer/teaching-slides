<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.999893" y="40" text-anchor="middle" font-size="31.330557" font-weight="bold">ADR-0001: Use Kubernetes for Orchestration</text>
  <line x1="40" y1="64.369647" x2="1240" y2="64.369647" stroke="var(--border)" stroke-width="1.8108" />
  <text x="40" y="122.857176" font-size="27.153187" font-weight="bold" fill="var(--primary-accent)">Status:</text>
  <text x="192.727275" y="122.857176" font-size="27.153187">Accepted</text>
  <line x1="40" y1="147.226824" x2="1240" y2="147.226824" stroke="var(--surface)" stroke-width="1.8108" />
  <text x="40" y="205.714235" font-size="27.153187" font-weight="bold" fill="var(--primary-accent)">Context:</text>
  <text x="40" y="249.579882" font-size="22.975704">We need container orchestration for 30+ microservices.</text>
  <text x="40" y="288.571412" font-size="22.975704">Team has experience with both Docker Swarm and Kubernetes.</text>
  <line x1="40" y1="312.941176" x2="1240" y2="312.941176" stroke="var(--surface)" stroke-width="1.8108" />
  <text x="40" y="371.428588" font-size="27.153187" font-weight="bold" fill="var(--primary-accent)">Decision:</text>
  <text x="40" y="415.294118" font-size="22.975704">We will use Kubernetes (EKS) for container orchestration.</text>
  <line x1="40" y1="439.663882" x2="1240" y2="439.663882" stroke="var(--surface)" stroke-width="1.8108" />
  <text x="40" y="498.151176" font-size="27.153187" font-weight="bold" fill="var(--primary-accent)">Consequences:</text>
  <text x="40" y="542.016824" font-size="22.975704">+ Industry standard, large ecosystem, strong hiring pool.</text>
  <text x="40" y="581.008353" font-size="22.975704">- Steeper learning curve, higher initial operational cost.</text>
  <text x="40" y="620" font-size="22.975704">- Requires investment in cluster management tooling.</text>
</svg>
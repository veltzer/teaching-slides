<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="235.9183" y="40" text-anchor="middle" font-size="29.3599" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Org Structure</text>
  <text x="1044.0817" y="40" text-anchor="middle" font-size="29.3599" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">System Architecture</text>
  <rect x="40" y="72.8302" width="391.8368" height="87.5472" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="235.9183" y="127.5472" text-anchor="middle" font-size="25.1657" font-family="Arial, sans-serif" fill="var(--primary-text)">Frontend Team</text>
  <rect x="40" y="204.151" width="391.8368" height="87.5472" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="235.9183" y="258.868" text-anchor="middle" font-size="25.1657" font-family="Arial, sans-serif" fill="var(--info-text)">Backend Team</text>
  <rect x="40" y="335.4717" width="391.8368" height="87.5472" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="235.9183" y="390.1887" text-anchor="middle" font-size="25.1657" font-family="Arial, sans-serif" fill="var(--ok-text)">Data Team</text>
  <rect x="40" y="466.7924" width="391.8368" height="87.5472" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="235.9183" y="521.5095" text-anchor="middle" font-size="25.1657" font-family="Arial, sans-serif" fill="var(--warn-text)">Infra Team</text>
  <rect x="848.1632" y="72.8302" width="391.8368" height="87.5472" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1044.0817" y="127.5472" text-anchor="middle" font-size="25.1657" font-family="Arial, sans-serif" fill="var(--primary-text)">UI Service</text>
  <rect x="848.1632" y="204.151" width="391.8368" height="87.5472" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1044.0817" y="258.868" text-anchor="middle" font-size="25.1657" font-family="Arial, sans-serif" fill="var(--info-text)">API Service</text>
  <rect x="848.1632" y="335.4717" width="391.8368" height="87.5472" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1044.0817" y="390.1887" text-anchor="middle" font-size="25.1657" font-family="Arial, sans-serif" fill="var(--ok-text)">Data Pipeline</text>
  <rect x="848.1632" y="466.7924" width="391.8368" height="87.5472" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1044.0817" y="521.5095" text-anchor="middle" font-size="25.1657" font-family="Arial, sans-serif" fill="var(--warn-text)">Infrastructure</text>
  <line x1="431.8368" y1="116.6038" x2="848.1632" y2="116.6038" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="10.8647 5.4324" marker-end="url(#arrow)" />
  <line x1="431.8368" y1="247.9246" x2="848.1632" y2="247.9246" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="10.8647 5.4324" marker-end="url(#arrow)" />
  <line x1="431.8368" y1="379.2453" x2="848.1632" y2="379.2453" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="10.8647 5.4324" marker-end="url(#arrow)" />
  <line x1="431.8368" y1="510.5661" x2="848.1632" y2="510.5661" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="10.8647 5.4324" marker-end="url(#arrow)" />
  <text x="639.9999" y="620" text-anchor="middle" font-size="23.0684" fill="var(--text-muted)" font-family="Arial, sans-serif">Teams mirror services 1:1</text>
</svg>
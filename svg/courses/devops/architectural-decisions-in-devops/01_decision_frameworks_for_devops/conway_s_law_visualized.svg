<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_conway" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 14.4 L 17.7231 7.2 z" fill="#555" />
    </marker>
  </defs>
  <text x="235.9183" y="40" text-anchor="middle" font-size="29.3599" font-weight="bold">Org Structure</text>
  <text x="1044.0817" y="40" text-anchor="middle" font-size="29.3599" font-weight="bold">System Architecture</text>
  <rect x="40" y="72.8302" width="391.8368" height="87.5472" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="235.9183" y="127.5472" text-anchor="middle" font-size="25.1657">Frontend Team</text>
  <rect x="40" y="204.151" width="391.8368" height="87.5472" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="235.9183" y="258.868" text-anchor="middle" font-size="25.1657">Backend Team</text>
  <rect x="40" y="335.4717" width="391.8368" height="87.5472" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="235.9183" y="390.1887" text-anchor="middle" font-size="25.1657">Data Team</text>
  <rect x="40" y="466.7924" width="391.8368" height="87.5472" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="235.9183" y="521.5095" text-anchor="middle" font-size="25.1657">Infra Team</text>
  <rect x="848.1632" y="72.8302" width="391.8368" height="87.5472" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1044.0817" y="127.5472" text-anchor="middle" font-size="25.1657">UI Service</text>
  <rect x="848.1632" y="204.151" width="391.8368" height="87.5472" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1044.0817" y="258.868" text-anchor="middle" font-size="25.1657">API Service</text>
  <rect x="848.1632" y="335.4717" width="391.8368" height="87.5472" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1044.0817" y="390.1887" text-anchor="middle" font-size="25.1657">Data Pipeline</text>
  <rect x="848.1632" y="466.7924" width="391.8368" height="87.5472" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1044.0817" y="521.5095" text-anchor="middle" font-size="25.1657">Infrastructure</text>
  <line x1="431.8368" y1="116.6038" x2="848.1632" y2="116.6038" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="10.8647 5.4324" marker-end="url(#arrow_conway)" />
  <line x1="431.8368" y1="247.9246" x2="848.1632" y2="247.9246" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="10.8647 5.4324" marker-end="url(#arrow_conway)" />
  <line x1="431.8368" y1="379.2453" x2="848.1632" y2="379.2453" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="10.8647 5.4324" marker-end="url(#arrow_conway)" />
  <line x1="431.8368" y1="510.5661" x2="848.1632" y2="510.5661" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="10.8647 5.4324" marker-end="url(#arrow_conway)" />
  <text x="639.9999" y="620" text-anchor="middle" font-size="23.0684" fill="var(--text-muted)">Teams mirror services 1:1</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_conway" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 14.4 L 17.7231 7.2 z" fill="#555" />
    </marker>
  </defs>
  <text x="289.7259" y="55.1724" text-anchor="middle" font-size="25.351" font-weight="bold">Org Structure</text>
  <text x="887.2856" y="55.1724" text-anchor="middle" font-size="25.351" font-weight="bold">System Architecture</text>
  <rect x="144.863" y="88.2759" width="289.7259" height="88.2759" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="289.7259" y="143.4483" text-anchor="middle" font-size="21.7295">Frontend Team</text>
  <rect x="144.863" y="220.6897" width="289.7259" height="88.2759" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="289.7259" y="275.8621" text-anchor="middle" font-size="21.7295">Backend Team</text>
  <rect x="144.863" y="353.1034" width="289.7259" height="88.2759" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="289.7259" y="408.2759" text-anchor="middle" font-size="21.7295">Data Team</text>
  <rect x="144.863" y="485.5172" width="289.7259" height="88.2759" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="289.7259" y="540.6897" text-anchor="middle" font-size="21.7295">Infra Team</text>
  <rect x="742.4226" y="88.2759" width="289.7259" height="88.2759" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="887.2856" y="143.4483" text-anchor="middle" font-size="21.7295">UI Service</text>
  <rect x="742.4226" y="220.6897" width="289.7259" height="88.2759" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="887.2856" y="275.8621" text-anchor="middle" font-size="21.7295">API Service</text>
  <rect x="742.4226" y="353.1034" width="289.7259" height="88.2759" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="887.2856" y="408.2759" text-anchor="middle" font-size="21.7295">Data Pipeline</text>
  <rect x="742.4226" y="485.5172" width="289.7259" height="88.2759" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="887.2856" y="540.6897" text-anchor="middle" font-size="21.7295">Infrastructure</text>
  <line x1="434.5889" y1="132.4138" x2="742.4226" y2="132.4138" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="10.8647 5.4324" marker-end="url(#arrow_conway)" />
  <line x1="434.5889" y1="264.8276" x2="742.4226" y2="264.8276" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="10.8647 5.4324" marker-end="url(#arrow_conway)" />
  <line x1="434.5889" y1="397.2414" x2="742.4226" y2="397.2414" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="10.8647 5.4324" marker-end="url(#arrow_conway)" />
  <line x1="434.5889" y1="529.6552" x2="742.4226" y2="529.6552" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="10.8647 5.4324" marker-end="url(#arrow_conway)" />
  <text x="588.5057" y="640" text-anchor="middle" font-size="19.9186" fill="var(--text-muted)">Teams mirror services 1:1</text>
</svg>
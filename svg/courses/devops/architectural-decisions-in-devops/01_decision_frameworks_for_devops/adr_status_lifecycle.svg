<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_adr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 24 L 17.7231 12 z" fill="#333" />
    </marker>
  </defs>
  <rect x="55.6018" y="244.7059" width="185.3394" height="169.4118" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="148.2715" y="350.1176" text-anchor="middle" font-size="22.2408" font-weight="bold">Proposed</text>
  <rect x="315.0769" y="244.7059" width="185.3394" height="169.4118" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="407.7466" y="350.1176" text-anchor="middle" font-size="22.2408" font-weight="bold">Accepted</text>
  <rect x="574.552" y="131.7647" width="203.8733" height="169.4118" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="676.4887" y="237.1765" text-anchor="middle" font-size="22.2408" font-weight="bold">Superseded</text>
  <rect x="574.552" y="376.4706" width="203.8733" height="169.4118" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="676.4887" y="481.8824" text-anchor="middle" font-size="22.2408" font-weight="bold">Deprecated</text>
  <rect x="852.5611" y="131.7647" width="203.8733" height="169.4118" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="954.4977" y="237.1765" text-anchor="middle" font-size="22.2408" font-weight="bold">Replaced by</text>
  <line x1="240.9412" y1="327.5294" x2="315.0769" y2="327.5294" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_adr)" />
  <line x1="500.4163" y1="289.8824" x2="574.552" y2="214.5882" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_adr)" />
  <line x1="500.4163" y1="365.1765" x2="574.552" y2="459.2941" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_adr)" />
  <line x1="778.4253" y1="214.5882" x2="852.5611" y2="214.5882" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_adr)" />
  <text x="148.2715" y="527.0588" text-anchor="middle" font-size="18.5339" fill="var(--text-muted)">Under review</text>
  <text x="407.7466" y="527.0588" text-anchor="middle" font-size="18.5339" fill="var(--text-muted)">Active decision</text>
  <text x="676.4887" y="640" text-anchor="middle" font-size="18.5339" fill="var(--text-muted)">No longer valid</text>
  <text x="954.4977" y="376.4706" text-anchor="middle" font-size="18.5339" fill="var(--text-muted)">New ADR linked</text>
</svg>
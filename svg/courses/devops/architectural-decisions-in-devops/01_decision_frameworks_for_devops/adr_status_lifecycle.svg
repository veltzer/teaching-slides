<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="168.8889" width="222.2223" height="193.3334" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="151.1111" y="289.1851" text-anchor="middle" font-size="26.0161" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Proposed</text>
  <rect x="351.1111" y="168.8889" width="222.2223" height="193.3334" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="462.2222" y="289.1851" text-anchor="middle" font-size="26.0161" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Accepted</text>
  <rect x="662.2222" y="40" width="244.4444" height="193.3334" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="784.4445" y="160.2963" text-anchor="middle" font-size="26.0161" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Superseded</text>
  <rect x="662.2222" y="319.2593" width="244.4444" height="193.3334" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="784.4445" y="439.5556" text-anchor="middle" font-size="26.0161" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Deprecated</text>
  <rect x="995.5556" y="40" width="244.4444" height="193.3334" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1117.7777" y="160.2963" text-anchor="middle" font-size="26.0161" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Replaced by</text>
  <line x1="262.2223" y1="263.4074" x2="351.1111" y2="263.4074" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="573.3333" y1="220.4445" x2="662.2222" y2="134.5185" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="573.3333" y1="306.3704" x2="662.2222" y2="413.7778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="906.6666" y1="134.5185" x2="995.5556" y2="134.5185" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="151.1111" y="491.1111" text-anchor="middle" font-size="21.68" fill="var(--text-muted)" font-family="Arial, sans-serif">Under review</text>
  <text x="462.2222" y="491.1111" text-anchor="middle" font-size="21.68" fill="var(--text-muted)" font-family="Arial, sans-serif">Active decision</text>
  <text x="784.4445" y="620" text-anchor="middle" font-size="21.68" fill="var(--text-muted)" font-family="Arial, sans-serif">No longer valid</text>
  <text x="1117.7777" y="319.2593" text-anchor="middle" font-size="21.68" fill="var(--text-muted)" font-family="Arial, sans-serif">New ADR linked</text>
</svg>
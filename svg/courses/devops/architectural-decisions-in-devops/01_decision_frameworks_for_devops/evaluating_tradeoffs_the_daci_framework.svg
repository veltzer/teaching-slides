<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="59.0769" y="86.4" width="275.6923" height="230.4" fill="#1565c0" stroke="#0d47a1" stroke-width="3.9385" rx="15.7538" />
  <text x="196.9231" y="172.8" text-anchor="middle" font-size="27.5692" font-weight="bold" fill="white">Driver</text>
  <text x="196.9231" y="230.4" text-anchor="middle" font-size="19.6923" fill="#bbdefb">Owns the process</text>
  <text x="196.9231" y="273.6" text-anchor="middle" font-size="19.6923" fill="#bbdefb">Gathers input</text>
  <rect x="364.3077" y="86.4" width="275.6923" height="230.4" fill="#2e7d32" stroke="#1b5e20" stroke-width="3.9385" rx="15.7538" />
  <text x="502.1538" y="172.8" text-anchor="middle" font-size="27.5692" font-weight="bold" fill="white">Approver</text>
  <text x="502.1538" y="230.4" text-anchor="middle" font-size="19.6923" fill="#c8e6c9">Makes final call</text>
  <text x="502.1538" y="273.6" text-anchor="middle" font-size="19.6923" fill="#c8e6c9">One person only</text>
  <rect x="669.5385" y="86.4" width="275.6923" height="230.4" fill="#e65100" stroke="#bf360c" stroke-width="3.9385" rx="15.7538" />
  <text x="807.3846" y="172.8" text-anchor="middle" font-size="27.5692" font-weight="bold" fill="white">Contributors</text>
  <text x="807.3846" y="230.4" text-anchor="middle" font-size="19.6923" fill="#ffe0b2">Provide expertise</text>
  <text x="807.3846" y="273.6" text-anchor="middle" font-size="19.6923" fill="#ffe0b2">Share knowledge</text>
  <rect x="974.7692" y="86.4" width="275.6923" height="230.4" fill="#7b1fa2" stroke="#4a148c" stroke-width="3.9385" rx="15.7538" />
  <text x="1112.6154" y="172.8" text-anchor="middle" font-size="27.5692" font-weight="bold" fill="white">Informed</text>
  <text x="1112.6154" y="230.4" text-anchor="middle" font-size="19.6923" fill="#e1bee7">Notified of result</text>
  <text x="1112.6154" y="273.6" text-anchor="middle" font-size="19.6923" fill="#e1bee7">No input needed</text>
  <text x="640" y="460.8" text-anchor="middle" font-size="23.6308" fill="#333">Assign exactly one Approver per decision to avoid deadlock</text>
  <text x="640" y="518.4" text-anchor="middle" font-size="23.6308" fill="#333">The Driver is not necessarily the Approver</text>
</svg>
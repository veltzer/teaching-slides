<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="277.6859" height="309.3333" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="3.9385" rx="6"/>
  <text x="178.843" y="156" text-anchor="middle" font-size="32.0598" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Driver</text>
  <text x="178.843" y="233.3333" text-anchor="middle" font-size="22.8999" fill="var(--primary-accent)" font-family="Arial, sans-serif">Owns the process</text>
  <text x="178.843" y="291.3333" text-anchor="middle" font-size="22.8999" fill="var(--primary-accent)" font-family="Arial, sans-serif">Gathers input</text>
  <rect x="347.4381" y="40" width="277.6859" height="309.3333" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="3.9385" rx="6"/>
  <text x="486.281" y="156" text-anchor="middle" font-size="32.0598" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Approver</text>
  <text x="486.281" y="233.3333" text-anchor="middle" font-size="22.8999" fill="var(--ok-accent)" font-family="Arial, sans-serif">Makes final call</text>
  <text x="486.281" y="291.3333" text-anchor="middle" font-size="22.8999" fill="var(--ok-accent)" font-family="Arial, sans-serif">One person only</text>
  <rect x="654.8761" y="40" width="277.6859" height="309.3333" fill="var(--warn-accent)" stroke="var(--danger-border)" stroke-width="3.9385" rx="6"/>
  <text x="793.719" y="156" text-anchor="middle" font-size="32.0598" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Contributors</text>
  <text x="793.719" y="233.3333" text-anchor="middle" font-size="22.8999" fill="var(--warn-accent)" font-family="Arial, sans-serif">Provide expertise</text>
  <text x="793.719" y="291.3333" text-anchor="middle" font-size="22.8999" fill="var(--warn-accent)" font-family="Arial, sans-serif">Share knowledge</text>
  <rect x="962.3141" y="40" width="277.6859" height="309.3333" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1101.1571" y="156" text-anchor="middle" font-size="32.0598" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Informed</text>
  <text x="1101.1571" y="233.3333" text-anchor="middle" font-size="22.8999" fill="var(--info-accent)" font-family="Arial, sans-serif">Notified of result</text>
  <text x="1101.1571" y="291.3333" text-anchor="middle" font-size="22.8999" fill="var(--info-accent)" font-family="Arial, sans-serif">No input needed</text>
  <text x="625.124" y="542.6667" text-anchor="middle" font-size="27.4799" fill="var(--text)" font-family="Arial, sans-serif">Assign exactly one Approver per decision to avoid deadlock</text>
  <text x="625.124" y="620" text-anchor="middle" font-size="27.4799" fill="var(--text)" font-family="Arial, sans-serif">The Driver is not necessarily the Approver</text>
</svg>

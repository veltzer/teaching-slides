<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="277.6859" height="309.3333" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="3.9385" rx="6" />
  <text x="178.843" y="156" text-anchor="middle" font-size="32.0598" font-weight="bold" fill="var(--bg)">Driver</text>
  <text x="178.843" y="233.3333" text-anchor="middle" font-size="22.8999" fill="var(--primary-accent)">Owns the process</text>
  <text x="178.843" y="291.3333" text-anchor="middle" font-size="22.8999" fill="var(--primary-accent)">Gathers input</text>
  <rect x="347.4381" y="40" width="277.6859" height="309.3333" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="3.9385" rx="6" />
  <text x="486.281" y="156" text-anchor="middle" font-size="32.0598" font-weight="bold" fill="var(--bg)">Approver</text>
  <text x="486.281" y="233.3333" text-anchor="middle" font-size="22.8999" fill="var(--ok-accent)">Makes final call</text>
  <text x="486.281" y="291.3333" text-anchor="middle" font-size="22.8999" fill="var(--ok-accent)">One person only</text>
  <rect x="654.8761" y="40" width="277.6859" height="309.3333" fill="var(--warn-accent)" stroke="var(--danger-border)" stroke-width="3.9385" rx="6" />
  <text x="793.719" y="156" text-anchor="middle" font-size="32.0598" font-weight="bold" fill="var(--bg)">Contributors</text>
  <text x="793.719" y="233.3333" text-anchor="middle" font-size="22.8999" fill="var(--warn-accent)">Provide expertise</text>
  <text x="793.719" y="291.3333" text-anchor="middle" font-size="22.8999" fill="var(--warn-accent)">Share knowledge</text>
  <rect x="962.3141" y="40" width="277.6859" height="309.3333" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1101.1571" y="156" text-anchor="middle" font-size="32.0598" font-weight="bold" fill="var(--bg)">Informed</text>
  <text x="1101.1571" y="233.3333" text-anchor="middle" font-size="22.8999" fill="var(--info-accent)">Notified of result</text>
  <text x="1101.1571" y="291.3333" text-anchor="middle" font-size="22.8999" fill="var(--info-accent)">No input needed</text>
  <text x="625.124" y="542.6667" text-anchor="middle" font-size="27.4799" fill="var(--text)">Assign exactly one Approver per decision to avoid deadlock</text>
  <text x="625.124" y="620" text-anchor="middle" font-size="27.4799" fill="var(--text)">The Driver is not necessarily the Approver</text>
</svg>
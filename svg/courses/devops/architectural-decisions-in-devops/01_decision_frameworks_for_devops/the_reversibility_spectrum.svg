<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="40" y1="540.9091" x2="1240" y2="540.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="40" y1="540.9091" x2="40" y2="40" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="620" text-anchor="middle" font-size="24.9599" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Difficulty to Reverse</text>
  <text x="40" y="290.4545" text-anchor="middle" font-size="24.052" font-weight="bold" transform="rotate(-90, 40, 125)" font-family="Arial, sans-serif" fill="var(--text)">Cost of Change</text>
  <rect x="159.939" y="420.219" width="83.1994" height="83.1994" rx="14" fill="url(#grad-ok)" opacity="0.8" filter="url(#shadow)"/>
  <text x="201.5384" y="475" text-anchor="middle" font-size="20.7998" fill="var(--bg)" font-family="Arial, sans-serif">Config</text>
  <text x="201.5384" y="501.3636" text-anchor="middle" font-size="20.7998" fill="var(--bg)" font-family="Arial, sans-serif">flag</text>
  <rect x="363.471" y="350.149" width="91.5196" height="91.5196" rx="14" fill="url(#grad-ok)" opacity="0.8" filter="url(#shadow)"/>
  <text x="409.2308" y="388" text-anchor="middle" font-size="20.7998" fill="var(--bg)" font-family="Arial, sans-serif">CI tool</text>
  <text x="409.2308" y="417" text-anchor="middle" font-size="20.7998" fill="var(--bg)" font-family="Arial, sans-serif">swap</text>
  <rect x="611.077" y="225.273" width="103.999" height="103.999" rx="14" fill="url(#grad-warn)" opacity="0.8" filter="url(#shadow)"/>
  <text x="663.077" y="269.3636" text-anchor="middle" font-size="20.7998" fill="var(--bg)" font-family="Arial, sans-serif">Container</text>
  <text x="663.077" y="298.3636" text-anchor="middle" font-size="20.7998" fill="var(--bg)" font-family="Arial, sans-serif">runtime</text>
  <rect x="858.684" y="113.579" width="116.479" height="116.479" rx="14" fill="url(#grad-danger)" opacity="0.8" filter="url(#shadow)"/>
  <text x="916.9232" y="163.9091" text-anchor="middle" font-size="20.7998" fill="var(--bg)" font-family="Arial, sans-serif">Cloud</text>
  <text x="916.9232" y="192.9091" text-anchor="middle" font-size="20.7998" fill="var(--bg)" font-family="Arial, sans-serif">provider</text>
  <rect x="1062.22" y="43.5096" width="124.799" height="124.799" rx="14" fill="var(--danger-accent)" opacity="0.8"/>
  <text x="1124.6153" y="98" text-anchor="middle" font-size="20.7998" fill="var(--bg)" font-family="Arial, sans-serif">Database</text>
  <text x="1124.6153" y="127" text-anchor="middle" font-size="20.7998" fill="var(--bg)" font-family="Arial, sans-serif">engine</text>
</svg>

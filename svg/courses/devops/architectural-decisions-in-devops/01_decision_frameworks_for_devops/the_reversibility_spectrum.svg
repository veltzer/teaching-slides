<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_rev" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 16.6154 L 17.7231 8.3077 z" fill="#333" />
    </marker>
  </defs>
  <line x1="40" y1="540.9091" x2="1240" y2="540.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_rev)" />
  <line x1="40" y1="540.9091" x2="40" y2="40" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_rev)" />
  <text x="640" y="620" text-anchor="middle" font-size="24.9599" font-weight="bold">Difficulty to Reverse</text>
  <text x="40" y="290.4545" text-anchor="middle" font-size="24.052" font-weight="bold" transform="rotate(-90, 40, 125)">Cost of Change</text>
  <rect x="159.939" y="420.219" width="83.1994" height="83.1994" rx="14" fill="var(--ok-fill)" opacity="0.8" filter="url(#shadow)"/>
  <text x="201.5384" y="475" text-anchor="middle" font-size="20.7998" fill="var(--bg)">Config</text>
  <text x="201.5384" y="501.3636" text-anchor="middle" font-size="20.7998" fill="var(--bg)">flag</text>
  <rect x="363.471" y="350.149" width="91.5196" height="91.5196" rx="14" fill="var(--ok-fill)" opacity="0.8" filter="url(#shadow)"/>
  <text x="409.2308" y="388" text-anchor="middle" font-size="20.7998" fill="var(--bg)">CI tool</text>
  <text x="409.2308" y="417" text-anchor="middle" font-size="20.7998" fill="var(--bg)">swap</text>
  <rect x="611.077" y="225.273" width="103.999" height="103.999" rx="14" fill="var(--warn-fill)" opacity="0.8" filter="url(#shadow)"/>
  <text x="663.077" y="269.3636" text-anchor="middle" font-size="20.7998" fill="var(--bg)">Container</text>
  <text x="663.077" y="298.3636" text-anchor="middle" font-size="20.7998" fill="var(--bg)">runtime</text>
  <rect x="858.684" y="113.579" width="116.479" height="116.479" rx="14" fill="var(--danger-fill)" opacity="0.8" filter="url(#shadow)"/>
  <text x="916.9232" y="163.9091" text-anchor="middle" font-size="20.7998" fill="var(--bg)">Cloud</text>
  <text x="916.9232" y="192.9091" text-anchor="middle" font-size="20.7998" fill="var(--bg)">provider</text>
  <rect x="1062.22" y="43.5096" width="124.799" height="124.799" rx="14" fill="var(--danger-accent)" opacity="0.8"/>
  <text x="1124.6153" y="98" text-anchor="middle" font-size="20.7998" fill="var(--bg)">Database</text>
  <text x="1124.6153" y="127" text-anchor="middle" font-size="20.7998" fill="var(--bg)">engine</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_rev" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 16.6154 L 17.7231 8.3077 z" fill="#333" />
    </marker>
  </defs>
  <line x1="145.6356" y1="563.2" x2="1092.2667" y2="563.2" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_rev)" />
  <line x1="145.6356" y1="563.2" x2="145.6356" y2="76.8" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_rev)" />
  <text x="618.9511" y="640" text-anchor="middle" font-size="21.8454" font-weight="bold">Difficulty to Reverse</text>
  <text x="72.8177" y="320" text-anchor="middle" font-size="21.8454" font-weight="bold" transform="rotate(-90, 40, 125)">Cost of Change</text>
  <circle cx="273.0666" cy="486.4" r="36.4089" fill="var(--ok-fill)" opacity="0.8" />
  <text x="273.0666" y="499.2" text-anchor="middle" font-size="18.2044" fill="var(--bg)">Config</text>
  <text x="273.0666" y="524.8" text-anchor="middle" font-size="18.2044" fill="var(--bg)">flag</text>
  <circle cx="436.9067" cy="422.4" r="40.0498" fill="var(--ok-fill)" opacity="0.8" />
  <text x="436.9067" y="414.72" text-anchor="middle" font-size="18.2044" fill="var(--bg)">CI tool</text>
  <text x="436.9067" y="442.88" text-anchor="middle" font-size="18.2044" fill="var(--bg)">swap</text>
  <circle cx="637.1556" cy="307.2" r="45.5111" fill="var(--warn-fill)" opacity="0.8" />
  <text x="637.1556" y="299.52" text-anchor="middle" font-size="18.2044" fill="var(--bg)">Container</text>
  <text x="637.1556" y="327.68" text-anchor="middle" font-size="18.2044" fill="var(--bg)">runtime</text>
  <circle cx="837.4045" cy="204.8" r="50.9725" fill="var(--danger-fill)" opacity="0.8" />
  <text x="837.4045" y="197.12" text-anchor="middle" font-size="18.2044" fill="var(--bg)">Cloud</text>
  <text x="837.4045" y="225.28" text-anchor="middle" font-size="18.2044" fill="var(--bg)">provider</text>
  <circle cx="1001.2444" cy="140.8" r="54.6133" fill="var(--danger-accent)" opacity="0.8" />
  <text x="1001.2444" y="133.12" text-anchor="middle" font-size="18.2044" fill="var(--bg)">Database</text>
  <text x="1001.2444" y="161.28" text-anchor="middle" font-size="18.2044" fill="var(--bg)">engine</text>
</svg>
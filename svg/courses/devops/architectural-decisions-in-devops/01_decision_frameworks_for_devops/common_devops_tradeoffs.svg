<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_trade" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 16.6154 L 13.7846 8.3077 z" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="69.2308" text-anchor="middle" font-size="27.5692" font-weight="bold">Tension Pairs</text>
  <rect x="78.7692" y="124.6154" width="256" height="96.9231" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="206.7692" y="185.5385" text-anchor="middle" font-size="21.6615">Speed</text>
  <line x1="334.7692" y1="171.6923" x2="433.2308" y2="171.6923" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow_trade)" />
  <line x1="433.2308" y1="171.6923" x2="334.7692" y2="171.6923" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow_trade)" />
  <rect x="433.2308" y="124.6154" width="256" height="96.9231" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="561.2308" y="185.5385" text-anchor="middle" font-size="21.6615">Stability</text>
  <rect x="78.7692" y="276.9231" width="256" height="96.9231" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="206.7692" y="337.8462" text-anchor="middle" font-size="21.6615">Flexibility</text>
  <line x1="334.7692" y1="324" x2="433.2308" y2="324" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow_trade)" />
  <line x1="433.2308" y1="324" x2="334.7692" y2="324" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow_trade)" />
  <rect x="433.2308" y="276.9231" width="256" height="96.9231" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="561.2308" y="337.8462" text-anchor="middle" font-size="21.6615">Standardization</text>
  <rect x="768" y="124.6154" width="256" height="96.9231" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="896" y="185.5385" text-anchor="middle" font-size="21.6615">Security</text>
  <line x1="1024" y1="171.6923" x2="1122.4615" y2="171.6923" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow_trade)" />
  <line x1="1122.4615" y1="171.6923" x2="1024" y2="171.6923" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow_trade)" />
  <rect x="1122.4615" y="124.6154" width="98.4615" height="96.9231" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1171.6923" y="185.5385" text-anchor="middle" font-size="21.6615">Speed</text>
  <rect x="768" y="276.9231" width="256" height="96.9231" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="896" y="337.8462" text-anchor="middle" font-size="21.6615">Cost</text>
  <line x1="1024" y1="324" x2="1122.4615" y2="324" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow_trade)" />
  <line x1="1122.4615" y1="324" x2="1024" y2="324" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow_trade)" />
  <rect x="1122.4615" y="276.9231" width="98.4615" height="96.9231" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1171.6923" y="337.8462" text-anchor="middle" font-size="21.6615">Quality</text>
  <text x="640" y="484.6154" text-anchor="middle" font-size="23.6308" fill="var(--text-muted)">Every decision involves balancing competing concerns</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="304.4068" y="40" width="671.1865" height="111.5384" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="3.6306" rx="6"/>
  <text x="640.0001" y="106.9231" text-anchor="middle" font-size="24.2324" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Architecture Review Board</text>
  <rect x="40" y="240.7693" width="366.1016" height="111.5384" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="3.6306" rx="6"/>
  <text x="223.0509" y="307.6923" text-anchor="middle" font-size="22.3684" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Platform Team ADRs</text>
  <rect x="456.9491" y="240.7693" width="366.1016" height="111.5384" fill="var(--warn-accent)" stroke="var(--danger-border)" stroke-width="3.6306" rx="6"/>
  <text x="640.0001" y="307.6923" text-anchor="middle" font-size="22.3684" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Cross-Team ADRs</text>
  <rect x="873.8983" y="240.7693" width="366.1016" height="111.5384" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1056.9491" y="307.6923" text-anchor="middle" font-size="22.3684" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Security ADRs</text>
  <rect x="40" y="463.8462" width="244.0678" height="89.2308" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="162.034" y="519.6154" text-anchor="middle" font-size="18.6403" font-family="Arial, sans-serif" fill="var(--ok-text)">Team A ADRs</text>
  <rect x="324.7457" y="463.8462" width="244.0678" height="89.2308" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="446.7797" y="519.6154" text-anchor="middle" font-size="18.6403" font-family="Arial, sans-serif" fill="var(--ok-text)">Team B ADRs</text>
  <rect x="711.1865" y="463.8462" width="244.0678" height="89.2308" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="833.2204" y="519.6154" text-anchor="middle" font-size="18.6403" font-family="Arial, sans-serif" fill="var(--ok-text)">Team C ADRs</text>
  <rect x="995.9322" y="463.8462" width="244.0678" height="89.2308" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1117.9661" y="519.6154" text-anchor="middle" font-size="18.6403" font-family="Arial, sans-serif" fill="var(--ok-text)">Team D ADRs</text>
  <line x1="640.0001" y1="151.5384" x2="223.0509" y2="240.7693" stroke="var(--text)" stroke-width="2"/>
  <line x1="640.0001" y1="151.5384" x2="640.0001" y2="240.7693" stroke="var(--text)" stroke-width="2"/>
  <line x1="640.0001" y1="151.5384" x2="1056.9491" y2="240.7693" stroke="var(--text)" stroke-width="2"/>
  <line x1="223.0509" y1="352.3077" x2="162.034" y2="463.8462" stroke="var(--text)" stroke-width="1.8152"/>
  <line x1="223.0509" y1="352.3077" x2="446.7797" y2="463.8462" stroke="var(--text)" stroke-width="1.8152"/>
  <line x1="1056.9491" y1="352.3077" x2="833.2204" y2="463.8462" stroke="var(--text)" stroke-width="1.8152"/>
  <line x1="1056.9491" y1="352.3077" x2="1117.9661" y2="463.8462" stroke="var(--text)" stroke-width="1.8152"/>
  <text x="640.0001" y="620" text-anchor="middle" font-size="20.5043" fill="var(--text-muted)" font-family="Arial, sans-serif">Decisions flow up for review, governance flows down as guidelines</text>
</svg>

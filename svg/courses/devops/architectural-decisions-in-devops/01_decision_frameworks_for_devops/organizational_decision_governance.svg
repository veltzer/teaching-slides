  <text x="962.0867" y="308.1481" text-anchor="middle" font-size="21.7831" font-weight="bold" fill="var(--bg)">Security ADRs</text>
  <rect x="54.4577" y="474.0741" width="217.831" height="94.8148" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="163.3733" y="533.3333" text-anchor="middle" font-size="18.1526">Team A ADRs</text>

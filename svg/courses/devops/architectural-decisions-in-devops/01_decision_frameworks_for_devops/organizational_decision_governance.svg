  <text x="417.5094" y="533.3333" text-anchor="middle" font-size="18.1526">Team B ADRs</text>
  <rect x="653.4929" y="474.0741" width="217.831" height="94.8148" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="762.4084" y="533.3333" text-anchor="middle" font-size="18.1526">Team C ADRs</text>
  <rect x="907.629" y="474.0741" width="217.831" height="94.8148" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1016.5445" y="533.3333" text-anchor="middle" font-size="18.1526">Team D ADRs</text>
  <line x1="589.9589" y1="142.2222" x2="217.831" y2="237.0371" stroke="var(--text)" stroke-width="2" />
  <line x1="589.9589" y1="142.2222" x2="589.9589" y2="237.0371" stroke="var(--text)" stroke-width="2" />
  <line x1="589.9589" y1="142.2222" x2="962.0867" y2="237.0371" stroke="var(--text)" stroke-width="2" />
  <line x1="217.831" y1="355.5556" x2="163.3733" y2="474.0741" stroke="var(--text)" stroke-width="1.8152" />
  <line x1="217.831" y1="355.5556" x2="417.5094" y2="474.0741" stroke="var(--text)" stroke-width="1.8152" />
  <line x1="962.0867" y1="355.5556" x2="762.4084" y2="474.0741" stroke="var(--text)" stroke-width="1.8152" />
  <line x1="962.0867" y1="355.5556" x2="1016.5445" y2="474.0741" stroke="var(--text)" stroke-width="1.8152" />
  <text x="589.9589" y="640" text-anchor="middle" font-size="19.9678" fill="var(--text-muted)">Decisions flow up for review, governance flows down as guidelines</text>
</svg>
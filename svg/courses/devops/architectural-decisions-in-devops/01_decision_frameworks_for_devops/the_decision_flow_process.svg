<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 14.4 L 17.7231 7.2 z" fill="#333" />
    </marker>
  </defs>
  <rect x="452.6967" y="22.069" width="271.618" height="88.2759" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="588.5057" y="77.2414" text-anchor="middle" font-size="21.7295">Identify Decision</text>
  <line x1="588.5057" y1="110.3448" x2="588.5057" y2="154.4828" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_flow)" />
  <rect x="452.6967" y="154.4828" width="271.618" height="88.2759" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="588.5057" y="209.6552" text-anchor="middle" font-size="21.7295">Gather Context</text>
  <line x1="588.5057" y1="242.7586" x2="588.5057" y2="286.8966" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_flow)" />
  <rect x="452.6967" y="286.8966" width="271.618" height="88.2759" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="588.5057" y="342.069" text-anchor="middle" font-size="21.7295">Explore Options</text>
  <line x1="588.5057" y1="375.1724" x2="588.5057" y2="419.3103" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_flow)" />
  <rect x="452.6967" y="419.3103" width="271.618" height="88.2759" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="588.5057" y="474.4828" text-anchor="middle" font-size="21.7295">Evaluate Tradeoffs</text>
  <line x1="588.5057" y1="507.5862" x2="588.5057" y2="551.7241" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_flow)" />
  <rect x="452.6967" y="551.7241" width="271.618" height="88.2759" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="588.5057" y="606.8966" text-anchor="middle" font-size="21.7295">Document in ADR</text>
  <text x="887.2856" y="77.2414" text-anchor="start" font-size="18.1079" fill="var(--text-muted)">Is this architectural?</text>
  <text x="887.2856" y="209.6552" text-anchor="start" font-size="18.1079" fill="var(--text-muted)">Constraints, requirements</text>
  <text x="887.2856" y="342.069" text-anchor="start" font-size="18.1079" fill="var(--text-muted)">PoCs, benchmarks, research</text>
  <text x="887.2856" y="474.4828" text-anchor="start" font-size="18.1079" fill="var(--text-muted)">Decision matrix, DACI</text>
  <text x="887.2856" y="606.8966" text-anchor="start" font-size="18.1079" fill="var(--text-muted)">Context, decision, consequences</text>
</svg>
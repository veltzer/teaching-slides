<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="185" height="284.528301886793" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="132" y="89.245283018867" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--primary-text)">1. Frame</text>
  <text x="132" y="138.490566037736" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">State problem</text>
  <text x="132" y="171.320754716981" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Stakeholders</text>
  <text x="132" y="204.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Success criteria</text>
  <text x="132" y="236.981132075472" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Constraints</text>

  <rect x="249" y="40" width="185" height="284.528301886793" rx="8.368855109814" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="341" y="89.245283018867" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--warn-text)">2. Explore</text>
  <text x="341" y="138.490566037736" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">List options</text>
  <text x="341" y="171.320754716981" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">Prior art</text>
  <text x="341" y="204.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">Spike unknowns</text>

  <rect x="458" y="40" width="185" height="284.528301886793" rx="8.368855109814" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="89.245283018867" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--info-text)">3. Evaluate</text>
  <text x="550" y="138.490566037736" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">Trade-offs</text>
  <text x="550" y="171.320754716981" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">Cost / benefit</text>
  <text x="550" y="204.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">Risk</text>
  <text x="550" y="236.981132075472" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">Reversibility</text>

  <rect x="667" y="40" width="185" height="284.528301886793" rx="8.368855109814" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="759" y="89.245283018867" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--ok-text)">4. Decide</text>
  <text x="759" y="138.490566037736" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Pick option</text>
  <text x="759" y="171.320754716981" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Record ADR</text>
  <text x="759" y="204.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Assign owner</text>

  <rect x="876" y="40" width="185" height="284.528301886793" rx="8.368855109814" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="968" y="89.245283018867" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--danger-text)">5. Execute</text>
  <text x="968" y="138.490566037736" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--danger-text)">Roll out slices</text>
  <text x="968" y="171.320754716981" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--danger-text)">Feature flags</text>
  <text x="968" y="204.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--danger-text)">Communicate</text>

  <rect x="1085" y="40" width="155" height="284.528301886793" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162" y="89.245283018867" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--primary-text)">6. Learn</text>
  <text x="1162" y="138.490566037736" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Measure</text>
  <text x="1162" y="171.320754716981" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Compare goals</text>
  <text x="1162" y="204.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Revisit</text>
  <text x="1162" y="236.981132075472" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Adjust</text>

  <line x1="225" y1="182.264150943396" x2="249" y2="182.264150943396" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="434" y1="182.264150943396" x2="458" y2="182.264150943396" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="643" y1="182.264150943396" x2="667" y2="182.264150943396" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="852" y1="182.264150943396" x2="876" y2="182.264150943396" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1061" y1="182.264150943396" x2="1085" y2="182.264150943396" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 1162 324.528301886793 L 1162 565.283018867925 L 132 565.283018867925 L 132 324.528301886793" stroke="var(--text-muted)" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <rect x="440" y="532.452830188679" width="400" height="87.547169811321" rx="8.368855109814" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="570.754716981133" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.783817108354" font-weight="bold" fill="var(--text)">Feedback loop</text>
  <text x="640" y="600.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">New data reframes the next decision</text>
</svg>

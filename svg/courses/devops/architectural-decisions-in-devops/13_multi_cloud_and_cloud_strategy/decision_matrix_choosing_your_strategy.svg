<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="72" y="40" width="1120" height="103.1111" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="632" y="104.4444" text-anchor="middle" font-weight="bold" font-size="21.5566" fill="var(--info-accent)">Cloud Strategy Decision Tree</text>
  <rect x="472" y="194.6667" width="320" height="90.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="632" y="251.3778" text-anchor="middle" font-size="18.2402">Regulatory constraints?</text>
  <line x1="472" y1="238.4889" x2="312" y2="349.3333" stroke="var(--text-muted)" stroke-width="2" />
  <text x="376" y="297.7778" font-size="16.582" fill="var(--ok-accent)">Yes</text>
  <line x1="792" y1="238.4889" x2="952" y2="349.3333" stroke="var(--text-muted)" stroke-width="2" />
  <text x="888" y="297.7778" font-size="16.582" fill="var(--danger-accent)">No</text>
  <rect x="152" y="349.3333" width="320" height="90.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312" y="406.0444" text-anchor="middle" font-size="18.2402">Data in multiple regions?</text>
  <rect x="792" y="349.3333" width="320" height="90.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="952" y="406.0444" text-anchor="middle" font-size="18.2402">Team size &gt; 50 engineers?</text>
  <line x1="232" y1="439.5556" x2="152" y2="529.7778" stroke="var(--text-muted)" stroke-width="2" />
  <text x="176" y="491.1111" font-size="16.582" fill="var(--ok-accent)">Yes</text>
  <line x1="392" y1="439.5556" x2="472" y2="529.7778" stroke="var(--text-muted)" stroke-width="2" />
  <text x="448" y="491.1111" font-size="16.582" fill="var(--danger-accent)">No</text>
  <line x1="872" y1="439.5556" x2="792" y2="529.7778" stroke="var(--text-muted)" stroke-width="2" />
  <text x="816" y="491.1111" font-size="16.582" fill="var(--ok-accent)">Yes</text>
  <line x1="1032" y1="439.5556" x2="1112" y2="529.7778" stroke="var(--text-muted)" stroke-width="2" />
  <text x="1088" y="491.1111" font-size="16.582" fill="var(--danger-accent)">No</text>
  <rect x="40" y="529.7778" width="240" height="90.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="586.4889" text-anchor="middle" font-size="18.2402" font-weight="bold" fill="var(--ok-accent)">Multi-Cloud</text>
  <rect x="360" y="529.7778" width="240" height="90.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="586.4889" text-anchor="middle" font-size="18.2402" font-weight="bold" fill="var(--warn-accent)">Hybrid Cloud</text>
  <rect x="680" y="529.7778" width="240" height="90.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="586.4889" text-anchor="middle" font-size="18.2402" font-weight="bold" fill="var(--primary-accent)">Consider Multi</text>
  <rect x="1000" y="529.7778" width="240" height="90.2222" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="586.4889" text-anchor="middle" font-size="18.2402" font-weight="bold" fill="var(--info-accent)">Single Cloud</text>
</svg>
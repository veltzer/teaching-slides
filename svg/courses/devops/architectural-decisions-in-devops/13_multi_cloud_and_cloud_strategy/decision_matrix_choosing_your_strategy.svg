<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <rect x="80" y="72" width="1120" height="96" rx="9.6" fill="#e1bee7" stroke="#6a1b9a" stroke-width="2.4" />
  <text x="640" y="132" text-anchor="middle" font-weight="bold" font-size="20.8" fill="#6a1b9a">Cloud Strategy Decision Tree</text>
  <rect x="480" y="216" width="320" height="84" rx="9.6" fill="#fff9c4" stroke="#f57c00" stroke-width="2.4" />
  <text x="640" y="268.8" text-anchor="middle" font-size="17.6">Regulatory constraints?</text>
  <line x1="480" y1="256.8" x2="320" y2="360" stroke="#666" stroke-width="2.4" />
  <text x="384" y="312" font-size="16" fill="#2e7d32">Yes</text>
  <line x1="800" y1="256.8" x2="960" y2="360" stroke="#666" stroke-width="2.4" />
  <text x="896" y="312" font-size="16" fill="#c62828">No</text>
  <rect x="160" y="360" width="320" height="84" rx="9.6" fill="#fff9c4" stroke="#f57c00" stroke-width="2.4" />
  <text x="320" y="412.8" text-anchor="middle" font-size="17.6">Data in multiple regions?</text>
  <rect x="800" y="360" width="320" height="84" rx="9.6" fill="#fff9c4" stroke="#f57c00" stroke-width="2.4" />
  <text x="960" y="412.8" text-anchor="middle" font-size="17.6">Team size &gt; 50 engineers?</text>
  <line x1="240" y1="444" x2="160" y2="528" stroke="#666" stroke-width="2.4" />
  <text x="184" y="492" font-size="16" fill="#2e7d32">Yes</text>
  <line x1="400" y1="444" x2="480" y2="528" stroke="#666" stroke-width="2.4" />
  <text x="456" y="492" font-size="16" fill="#c62828">No</text>
  <line x1="880" y1="444" x2="800" y2="528" stroke="#666" stroke-width="2.4" />
  <text x="824" y="492" font-size="16" fill="#2e7d32">Yes</text>
  <line x1="1040" y1="444" x2="1120" y2="528" stroke="#666" stroke-width="2.4" />
  <text x="1096" y="492" font-size="16" fill="#c62828">No</text>
  <rect x="48" y="528" width="240" height="84" rx="9.6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="168" y="580.8" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#2e7d32">Multi-Cloud</text>
  <rect x="368" y="528" width="240" height="84" rx="9.6" fill="#fff3e0" stroke="#e65100" stroke-width="3.2" />
  <text x="488" y="580.8" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#e65100">Hybrid Cloud</text>
  <rect x="688" y="528" width="240" height="84" rx="9.6" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.2" />
  <text x="808" y="580.8" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#1565c0">Consider Multi</text>
  <rect x="1008" y="528" width="240" height="84" rx="9.6" fill="#e1bee7" stroke="#6a1b9a" stroke-width="3.2" />
  <text x="1128" y="580.8" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#6a1b9a">Single Cloud</text>
</svg>
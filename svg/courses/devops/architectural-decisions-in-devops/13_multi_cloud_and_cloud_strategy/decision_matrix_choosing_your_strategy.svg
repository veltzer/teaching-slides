<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="80" y="72" width="1120" height="96" rx="9.6" fill="var(--info-tint)" stroke="var(--info-dk)" stroke-width="2.4" />
  <text x="640" y="132" text-anchor="middle" font-weight="bold" font-size="20.8" fill="var(--info-dk)">Cloud Strategy Decision Tree</text>
  <rect x="480" y="216" width="320" height="84" rx="9.6" fill="var(--warn-pale4)" stroke="var(--warn-mid)" stroke-width="2.4" />
  <text x="640" y="268.8" text-anchor="middle" font-size="17.6">Regulatory constraints?</text>
  <line x1="480" y1="256.8" x2="320" y2="360" stroke="var(--text-mid)" stroke-width="2.4" />
  <text x="384" y="312" font-size="16" fill="var(--ok-dk)">Yes</text>
  <line x1="800" y1="256.8" x2="960" y2="360" stroke="var(--text-mid)" stroke-width="2.4" />
  <text x="896" y="312" font-size="16" fill="var(--danger-dk)">No</text>
  <rect x="160" y="360" width="320" height="84" rx="9.6" fill="var(--warn-pale4)" stroke="var(--warn-mid)" stroke-width="2.4" />
  <text x="320" y="412.8" text-anchor="middle" font-size="17.6">Data in multiple regions?</text>
  <rect x="800" y="360" width="320" height="84" rx="9.6" fill="var(--warn-pale4)" stroke="var(--warn-mid)" stroke-width="2.4" />
  <text x="960" y="412.8" text-anchor="middle" font-size="17.6">Team size &gt; 50 engineers?</text>
  <line x1="240" y1="444" x2="160" y2="528" stroke="var(--text-mid)" stroke-width="2.4" />
  <text x="184" y="492" font-size="16" fill="var(--ok-dk)">Yes</text>
  <line x1="400" y1="444" x2="480" y2="528" stroke="var(--text-mid)" stroke-width="2.4" />
  <text x="456" y="492" font-size="16" fill="var(--danger-dk)">No</text>
  <line x1="880" y1="444" x2="800" y2="528" stroke="var(--text-mid)" stroke-width="2.4" />
  <text x="824" y="492" font-size="16" fill="var(--ok-dk)">Yes</text>
  <line x1="1040" y1="444" x2="1120" y2="528" stroke="var(--text-mid)" stroke-width="2.4" />
  <text x="1096" y="492" font-size="16" fill="var(--danger-dk)">No</text>
  <rect x="48" y="528" width="240" height="84" rx="9.6" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="3.2" />
  <text x="168" y="580.8" text-anchor="middle" font-size="17.6" font-weight="bold" fill="var(--ok-dk)">Multi-Cloud</text>
  <rect x="368" y="528" width="240" height="84" rx="9.6" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="3.2" />
  <text x="488" y="580.8" text-anchor="middle" font-size="17.6" font-weight="bold" fill="var(--warn-dk)">Hybrid Cloud</text>
  <rect x="688" y="528" width="240" height="84" rx="9.6" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="3.2" />
  <text x="808" y="580.8" text-anchor="middle" font-size="17.6" font-weight="bold" fill="var(--primary-dk)">Consider Multi</text>
  <rect x="1008" y="528" width="240" height="84" rx="9.6" fill="var(--info-tint)" stroke="var(--info-dk)" stroke-width="3.2" />
  <text x="1128" y="580.8" text-anchor="middle" font-size="17.6" font-weight="bold" fill="var(--info-dk)">Single Cloud</text>
</svg>
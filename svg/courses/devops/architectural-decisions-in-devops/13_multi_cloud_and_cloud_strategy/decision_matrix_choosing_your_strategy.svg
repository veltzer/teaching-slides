<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="72" y="40" width="1120" height="103.1111" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="632" y="104.4444" text-anchor="middle" font-weight="bold" font-size="21.5566" fill="var(--info-accent)" font-family="Arial, sans-serif">Cloud Strategy Decision Tree</text>
  <rect x="472" y="194.6667" width="320" height="90.2222" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="632" y="251.3778" text-anchor="middle" font-size="18.2402" font-family="Arial, sans-serif" fill="var(--warn-text)">Regulatory constraints?</text>
  <line x1="472" y1="238.4889" x2="312" y2="349.3333" stroke="var(--text-muted)" stroke-width="2" />
  <text x="376" y="297.7778" font-size="16.582" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <line x1="792" y1="238.4889" x2="952" y2="349.3333" stroke="var(--text-muted)" stroke-width="2" />
  <text x="888" y="297.7778" font-size="16.582" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <rect x="152" y="349.3333" width="320" height="90.2222" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312" y="406.0444" text-anchor="middle" font-size="18.2402" font-family="Arial, sans-serif" fill="var(--warn-text)">Data in multiple regions?</text>
  <rect x="792" y="349.3333" width="320" height="90.2222" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="952" y="406.0444" text-anchor="middle" font-size="18.2402" font-family="Arial, sans-serif" fill="var(--warn-text)">Team size &gt; 50 engineers?</text>
  <line x1="232" y1="439.5556" x2="152" y2="529.7778" stroke="var(--text-muted)" stroke-width="2" />
  <text x="176" y="491.1111" font-size="16.582" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <line x1="392" y1="439.5556" x2="472" y2="529.7778" stroke="var(--text-muted)" stroke-width="2" />
  <text x="448" y="491.1111" font-size="16.582" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <line x1="872" y1="439.5556" x2="792" y2="529.7778" stroke="var(--text-muted)" stroke-width="2" />
  <text x="816" y="491.1111" font-size="16.582" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <line x1="1032" y1="439.5556" x2="1112" y2="529.7778" stroke="var(--text-muted)" stroke-width="2" />
  <text x="1088" y="491.1111" font-size="16.582" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <rect x="40" y="529.7778" width="240" height="90.2222" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="586.4889" text-anchor="middle" font-size="18.2402" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Multi-Cloud</text>
  <rect x="360" y="529.7778" width="240" height="90.2222" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="586.4889" text-anchor="middle" font-size="18.2402" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Hybrid Cloud</text>
  <rect x="680" y="529.7778" width="240" height="90.2222" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="586.4889" text-anchor="middle" font-size="18.2402" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Consider Multi</text>
  <rect x="1000" y="529.7778" width="240" height="90.2222" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="586.4889" text-anchor="middle" font-size="18.2402" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Single Cloud</text>
</svg>
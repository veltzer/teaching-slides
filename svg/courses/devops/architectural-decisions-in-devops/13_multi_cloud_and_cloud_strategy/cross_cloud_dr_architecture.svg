<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="302.2222" y="10" width="604.4445" height="90" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="604.4445" y="64" text-anchor="middle" font-weight="bold" font-size="19.6444" fill="var(--info-accent)">External DNS (Cloudflare / NS1)</text>
  <line x1="453.3334" y1="100.0001" x2="272" y2="180" stroke="var(--info-border)" stroke-width="2" />
  <line x1="755.5556" y1="100.0001" x2="936.889" y2="180" stroke="var(--info-border)" stroke-width="2" />
  <rect x="60.4444" y="180" width="423.1111" height="460" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="272" y="230" text-anchor="middle" font-weight="bold" font-size="21.1556" fill="var(--warn-accent)">AWS (Primary)</text>
  <rect x="105.7778" y="260" width="151.1111" height="70" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="181.3333" y="304.0001" text-anchor="middle" font-size="15.1111">EKS Cluster</text>
  <rect x="287.1111" y="260" width="151.1111" height="70" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="362.6667" y="304.0001" text-anchor="middle" font-size="15.1111">RDS Primary</text>
  <rect x="105.7778" y="370" width="151.1111" height="70" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="181.3333" y="414" text-anchor="middle" font-size="15.1111">S3 Buckets</text>
  <rect x="287.1111" y="370" width="151.1111" height="70" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="362.6667" y="414" text-anchor="middle" font-size="15.1111">ElastiCache</text>
  <rect x="151.1111" y="490" width="241.7778" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="272" y="530.0001" text-anchor="middle" font-size="15.1111" font-weight="bold">Live Traffic</text>
  <rect x="725.3334" y="180" width="423.1111" height="460" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="9.0667 4.5333" />
  <text x="936.889" y="230" text-anchor="middle" font-weight="bold" font-size="21.1556" fill="var(--ok-accent)">GCP (DR Standby)</text>
  <rect x="770.6667" y="260" width="151.1111" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="846.2223" y="304.0001" text-anchor="middle" font-size="15.1111">GKE Cluster</text>
  <rect x="952.0001" y="260" width="151.1111" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1027.5556" y="304.0001" text-anchor="middle" font-size="15.1111">Cloud SQL</text>
  <rect x="770.6667" y="370" width="151.1111" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="846.2223" y="414" text-anchor="middle" font-size="15.1111">GCS Buckets</text>
  <rect x="952.0001" y="370" width="151.1111" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1027.5556" y="414" text-anchor="middle" font-size="15.1111">Memorystore</text>
  <rect x="816.0001" y="490" width="241.7778" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="936.889" y="530.0001" text-anchor="middle" font-size="15.1111" font-weight="bold">Standby</text>
  <line x1="483.5556" y1="340" x2="725.3334" y2="340" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="9.0667 4.5333" />
  <text x="604.4445" y="326.0001" text-anchor="middle" font-size="15.1111" fill="var(--danger-accent)">Data Replication</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="306.6667" y="40" width="666.6667" height="82.8571" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="89.7143" text-anchor="middle" font-weight="bold" font-size="19.7951" fill="var(--info-accent)" font-family="Arial, sans-serif">External DNS (Cloudflare / NS1)</text>
  <line x1="473.3334" y1="122.8572" x2="273.3334" y2="196.5079" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="806.6667" y1="122.8572" x2="1006.6667" y2="196.5079" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="40" y="196.5079" width="466.6666" height="423.4921" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="273.3334" y="242.5397" text-anchor="middle" font-weight="bold" font-size="21.3179" fill="var(--warn-accent)" font-family="Arial, sans-serif">AWS (Primary)</text>
  <rect x="90.0001" y="270.1587" width="166.6666" height="64.4444" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="173.3333" y="310.6668" text-anchor="middle" font-size="15.2271" font-family="Arial, sans-serif" fill="var(--warn-text)">EKS Cluster</text>
  <rect x="290" y="270.1587" width="166.6666" height="64.4444" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="373.3334" y="310.6668" text-anchor="middle" font-size="15.2271" font-family="Arial, sans-serif" fill="var(--warn-text)">RDS Primary</text>
  <rect x="90.0001" y="371.4286" width="166.6666" height="64.4444" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="173.3333" y="411.9365" text-anchor="middle" font-size="15.2271" font-family="Arial, sans-serif" fill="var(--warn-text)">S3 Buckets</text>
  <rect x="290" y="371.4286" width="166.6666" height="64.4444" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="373.3334" y="411.9365" text-anchor="middle" font-size="15.2271" font-family="Arial, sans-serif" fill="var(--warn-text)">ElastiCache</text>
  <rect x="140" y="481.9048" width="266.6667" height="55.2381" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="273.3334" y="518.7303" text-anchor="middle" font-size="15.2271" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Live Traffic</text>
  <rect x="773.3334" y="196.5079" width="466.6666" height="423.4921" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="9.0667 4.5333" filter="url(#shadow)"/>
  <text x="1006.6667" y="242.5397" text-anchor="middle" font-weight="bold" font-size="21.3179" fill="var(--ok-accent)" font-family="Arial, sans-serif">GCP (DR Standby)</text>
  <rect x="823.3333" y="270.1587" width="166.6666" height="64.4444" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="906.6667" y="310.6668" text-anchor="middle" font-size="15.2271" font-family="Arial, sans-serif" fill="var(--ok-text)">GKE Cluster</text>
  <rect x="1023.3334" y="270.1587" width="166.6666" height="64.4444" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1106.6667" y="310.6668" text-anchor="middle" font-size="15.2271" font-family="Arial, sans-serif" fill="var(--ok-text)">Cloud SQL</text>
  <rect x="823.3333" y="371.4286" width="166.6666" height="64.4444" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="906.6667" y="411.9365" text-anchor="middle" font-size="15.2271" font-family="Arial, sans-serif" fill="var(--ok-text)">GCS Buckets</text>
  <rect x="1023.3334" y="371.4286" width="166.6666" height="64.4444" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1106.6667" y="411.9365" text-anchor="middle" font-size="15.2271" font-family="Arial, sans-serif" fill="var(--ok-text)">Memorystore</text>
  <rect x="873.3334" y="481.9048" width="266.6667" height="55.2381" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.6667" y="518.7303" text-anchor="middle" font-size="15.2271" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Standby</text>
  <line x1="506.6667" y1="343.8095" x2="773.3334" y2="343.8095" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="9.0667 4.5333"/>
  <text x="640.0001" y="330.9207" text-anchor="middle" font-size="15.2271" fill="var(--danger-accent)" font-family="Arial, sans-serif">Data Replication</text>
</svg>

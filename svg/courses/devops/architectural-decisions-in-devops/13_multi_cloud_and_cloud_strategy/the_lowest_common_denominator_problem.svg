<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="338.0282" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.0141" y="98" text-anchor="middle" font-weight="bold" font-size="21.7079" fill="var(--primary-accent)" font-family="Arial, sans-serif">AWS Features</text>
  <rect x="73.8028" y="132.8" width="270.4225" height="58" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.0141" y="172.24" text-anchor="middle" font-size="16.6984" font-family="Arial, sans-serif" fill="var(--primary-text)">Lambda@Edge</text>
  <rect x="73.8028" y="202.4" width="270.4225" height="58" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.0141" y="241.84" text-anchor="middle" font-size="16.6984" font-family="Arial, sans-serif" fill="var(--primary-text)">DynamoDB Streams</text>
  <rect x="73.8028" y="272" width="270.4225" height="58" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.0141" y="311.44" text-anchor="middle" font-size="16.6984" font-family="Arial, sans-serif" fill="var(--primary-text)">S3 Object Storage</text>
  <rect x="73.8028" y="341.6" width="270.4225" height="58" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.0141" y="381.04" text-anchor="middle" font-size="16.6984" font-family="Arial, sans-serif" fill="var(--primary-text)">EC2 Compute</text>
  <rect x="73.8028" y="411.2" width="270.4225" height="58" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.0141" y="450.64" text-anchor="middle" font-size="16.6984" font-family="Arial, sans-serif" fill="var(--primary-text)">VPC Networking</text>
  <rect x="462.5352" y="40" width="338.0282" height="580" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.5493" y="98" text-anchor="middle" font-weight="bold" font-size="21.7079" fill="var(--ok-accent)" font-family="Arial, sans-serif">GCP Features</text>
  <rect x="496.338" y="132.8" width="270.4225" height="58" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.5493" y="172.24" text-anchor="middle" font-size="16.6984" font-family="Arial, sans-serif" fill="var(--ok-text)">Cloud Spanner</text>
  <rect x="496.338" y="202.4" width="270.4225" height="58" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.5493" y="241.84" text-anchor="middle" font-size="16.6984" font-family="Arial, sans-serif" fill="var(--ok-text)">BigQuery ML</text>
  <rect x="496.338" y="272" width="270.4225" height="58" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.5493" y="311.44" text-anchor="middle" font-size="16.6984" font-family="Arial, sans-serif" fill="var(--ok-text)">GCS Object Storage</text>
  <rect x="496.338" y="341.6" width="270.4225" height="58" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.5493" y="381.04" text-anchor="middle" font-size="16.6984" font-family="Arial, sans-serif" fill="var(--ok-text)">GCE Compute</text>
  <rect x="496.338" y="411.2" width="270.4225" height="58" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.5493" y="450.64" text-anchor="middle" font-size="16.6984" font-family="Arial, sans-serif" fill="var(--ok-text)">VPC Networking</text>
  <rect x="901.9718" y="202.4" width="338.0282" height="371.2" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.9859" y="260.4" text-anchor="middle" font-weight="bold" font-size="21.7079" fill="var(--warn-accent)" font-family="Arial, sans-serif">Common Subset</text>
  <rect x="935.7746" y="295.2" width="270.4225" height="58" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.9859" y="334.64" text-anchor="middle" font-size="16.6984" font-family="Arial, sans-serif" fill="var(--warn-text)">Object Storage</text>
  <rect x="935.7746" y="364.8" width="270.4225" height="58" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.9859" y="404.24" text-anchor="middle" font-size="16.6984" font-family="Arial, sans-serif" fill="var(--warn-text)">Compute VMs</text>
  <rect x="935.7746" y="434.4" width="270.4225" height="58" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.9859" y="473.84" text-anchor="middle" font-size="16.6984" font-family="Arial, sans-serif" fill="var(--warn-text)">VPC Networking</text>
  <text x="1070.9859" y="550.4" text-anchor="middle" font-size="18.3682" fill="var(--warn-accent)" font-style="italic" font-family="Arial, sans-serif">Only basic features!</text>
</svg>

  <rect x="112" y="427.5" width="256" height="56.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="240" y="465.75" text-anchor="middle" font-size="16">VPC Networking</text>

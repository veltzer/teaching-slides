  <rect x="512" y="157.5" width="256" height="56.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="195.75" text-anchor="middle" font-size="16">Cloud Spanner</text>
  <rect x="512" y="225" width="256" height="56.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="263.25" text-anchor="middle" font-size="16">BigQuery ML</text>
  <rect x="512" y="292.5" width="256" height="56.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />

  <text x="1056" y="353.25" text-anchor="middle" font-size="16">Object Storage</text>
  <rect x="928" y="382.5" width="256" height="56.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1056" y="420.75" text-anchor="middle" font-size="16">Compute VMs</text>
  <rect x="928" y="450" width="256" height="56.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1056" y="488.25" text-anchor="middle" font-size="16">VPC Networking</text>
  <text x="1056" y="562.5" text-anchor="middle" font-size="17.6" fill="var(--warn-accent)" font-style="italic">Only basic features!</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="340" y="40" width="529.4118" height="105.4546" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.7058" y="101.5152" text-anchor="middle" font-weight="bold" font-size="22.053" fill="var(--info-accent)" font-family="Arial, sans-serif">Orchestration / Abstraction Layer</text>
  <line x1="251.7647" y1="145.4546" x2="251.7647" y2="250.9091" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7.5294 7.5294" />
  <line x1="604.7058" y1="145.4546" x2="604.7058" y2="250.9091" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7.5294 7.5294" />
  <line x1="957.647" y1="145.4546" x2="957.647" y2="250.9091" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7.5294 7.5294" />
  <rect x="40" y="250.9091" width="423.5295" height="175.7576" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="251.7647" y="312.4242" text-anchor="middle" font-weight="bold" font-size="20.4777" fill="var(--warn-accent)" font-family="Arial, sans-serif">AWS</text>
  <text x="251.7647" y="356.3637" text-anchor="middle" font-size="17.3273" font-family="Arial, sans-serif" fill="var(--warn-text)">EKS, RDS, S3</text>
  <text x="251.7647" y="391.5151" text-anchor="middle" font-size="17.3273" font-family="Arial, sans-serif" fill="var(--warn-text)">Compute workloads</text>
  <rect x="516.4705" y="250.9091" width="423.5295" height="175.7576" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="728.2353" y="312.4242" text-anchor="middle" font-weight="bold" font-size="20.4777" fill="var(--primary-accent)" font-family="Arial, sans-serif">Azure</text>
  <text x="728.2353" y="356.3637" text-anchor="middle" font-size="17.3273" font-family="Arial, sans-serif" fill="var(--primary-text)">AKS, SQL DB, Blob</text>
  <text x="728.2353" y="391.5151" text-anchor="middle" font-size="17.3273" font-family="Arial, sans-serif" fill="var(--primary-text)">Enterprise / AD</text>
  <rect x="816.4705" y="250.9091" width="423.5295" height="175.7576" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1028.2353" y="312.4242" text-anchor="middle" font-weight="bold" font-size="20.4777" fill="var(--ok-accent)" font-family="Arial, sans-serif">GCP</text>
  <text x="1028.2353" y="356.3637" text-anchor="middle" font-size="17.3273" font-family="Arial, sans-serif" fill="var(--ok-text)">GKE, BigQuery, GCS</text>
  <text x="1028.2353" y="391.5151" text-anchor="middle" font-size="17.3273" font-family="Arial, sans-serif" fill="var(--ok-text)">ML / Analytics</text>
  <rect x="163.5295" y="514.5454" width="882.353" height="105.4546" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.7058" y="576.0606" text-anchor="middle" font-size="20.4777" fill="var(--info-accent)" font-family="Arial, sans-serif">Unified Monitoring, Logging, and Security</text>
  <line x1="251.7647" y1="426.6667" x2="428.2353" y2="514.5454" stroke="var(--text-faint)" stroke-width="2" />
  <line x1="728.2353" y1="426.6667" x2="604.7058" y2="514.5454" stroke="var(--text-faint)" stroke-width="2" />
  <line x1="1028.2353" y1="426.6667" x2="781.1765" y2="514.5454" stroke="var(--text-faint)" stroke-width="2" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="340" y="40" width="529.4118" height="105.4546" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.7058" y="101.5152" text-anchor="middle" font-weight="bold" font-size="22.053" fill="var(--info-accent)">Orchestration / Abstraction Layer</text>
  <line x1="251.7647" y1="145.4546" x2="251.7647" y2="250.9091" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7.5294 7.5294" />
  <line x1="604.7058" y1="145.4546" x2="604.7058" y2="250.9091" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7.5294 7.5294" />
  <line x1="957.647" y1="145.4546" x2="957.647" y2="250.9091" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7.5294 7.5294" />
  <rect x="40" y="250.9091" width="423.5295" height="175.7576" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="251.7647" y="312.4242" text-anchor="middle" font-weight="bold" font-size="20.4777" fill="var(--warn-accent)">AWS</text>
  <text x="251.7647" y="356.3637" text-anchor="middle" font-size="17.3273">EKS, RDS, S3</text>
  <text x="251.7647" y="391.5151" text-anchor="middle" font-size="17.3273">Compute workloads</text>
  <rect x="516.4705" y="250.9091" width="423.5295" height="175.7576" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="728.2353" y="312.4242" text-anchor="middle" font-weight="bold" font-size="20.4777" fill="var(--primary-accent)">Azure</text>
  <text x="728.2353" y="356.3637" text-anchor="middle" font-size="17.3273">AKS, SQL DB, Blob</text>
  <text x="728.2353" y="391.5151" text-anchor="middle" font-size="17.3273">Enterprise / AD</text>
  <rect x="816.4705" y="250.9091" width="423.5295" height="175.7576" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1028.2353" y="312.4242" text-anchor="middle" font-weight="bold" font-size="20.4777" fill="var(--ok-accent)">GCP</text>
  <text x="1028.2353" y="356.3637" text-anchor="middle" font-size="17.3273">GKE, BigQuery, GCS</text>
  <text x="1028.2353" y="391.5151" text-anchor="middle" font-size="17.3273">ML / Analytics</text>
  <rect x="163.5295" y="514.5454" width="882.353" height="105.4546" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.7058" y="576.0606" text-anchor="middle" font-size="20.4777" fill="var(--info-accent)">Unified Monitoring, Logging, and Security</text>
  <line x1="251.7647" y1="426.6667" x2="428.2353" y2="514.5454" stroke="var(--text-faint)" stroke-width="2" />
  <line x1="728.2353" y1="426.6667" x2="604.7058" y2="514.5454" stroke="var(--text-faint)" stroke-width="2" />
  <line x1="1028.2353" y1="426.6667" x2="781.1765" y2="514.5454" stroke="var(--text-faint)" stroke-width="2" />
</svg>
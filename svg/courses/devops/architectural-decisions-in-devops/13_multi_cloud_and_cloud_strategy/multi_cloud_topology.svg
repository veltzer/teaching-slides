<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="376.4706" y="18.8235" width="451.7647" height="112.9412" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="602.3529" y="84.7059" text-anchor="middle" font-weight="bold" font-size="21.0824" fill="var(--info-accent)">Orchestration / Abstraction Layer</text>
  <line x1="301.1765" y1="131.7647" x2="301.1765" y2="244.7059" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7.5294 7.5294" />
  <line x1="602.3529" y1="131.7647" x2="602.3529" y2="244.7059" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7.5294 7.5294" />
  <line x1="903.5294" y1="131.7647" x2="903.5294" y2="244.7059" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7.5294 7.5294" />
  <rect x="120.4706" y="244.7059" width="361.4118" height="188.2353" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="301.1765" y="310.5882" text-anchor="middle" font-weight="bold" font-size="19.5765" fill="var(--warn-accent)">AWS</text>
  <text x="301.1765" y="357.6471" text-anchor="middle" font-size="16.5647">EKS, RDS, S3</text>
  <text x="301.1765" y="395.2941" text-anchor="middle" font-size="16.5647">Compute workloads</text>
  <rect x="527.0588" y="244.7059" width="361.4118" height="188.2353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="707.7647" y="310.5882" text-anchor="middle" font-weight="bold" font-size="19.5765" fill="var(--primary-accent)">Azure</text>
  <text x="707.7647" y="357.6471" text-anchor="middle" font-size="16.5647">AKS, SQL DB, Blob</text>
  <text x="707.7647" y="395.2941" text-anchor="middle" font-size="16.5647">Enterprise / AD</text>
  <rect x="783.0588" y="244.7059" width="361.4118" height="188.2353" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="963.7647" y="310.5882" text-anchor="middle" font-weight="bold" font-size="19.5765" fill="var(--ok-accent)">GCP</text>
  <text x="963.7647" y="357.6471" text-anchor="middle" font-size="16.5647">GKE, BigQuery, GCS</text>
  <text x="963.7647" y="395.2941" text-anchor="middle" font-size="16.5647">ML / Analytics</text>
  <rect x="225.8824" y="527.0588" width="752.9412" height="112.9412" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="602.3529" y="592.9412" text-anchor="middle" font-size="19.5765" fill="var(--info-accent)">Unified Monitoring, Logging, and Security</text>
  <line x1="301.1765" y1="432.9412" x2="451.7647" y2="527.0588" stroke="var(--text-faint)" stroke-width="2" />
  <line x1="707.7647" y1="432.9412" x2="602.3529" y2="527.0588" stroke="var(--text-faint)" stroke-width="2" />
  <line x1="963.7647" y1="432.9412" x2="752.9412" y2="527.0588" stroke="var(--text-faint)" stroke-width="2" />
</svg>
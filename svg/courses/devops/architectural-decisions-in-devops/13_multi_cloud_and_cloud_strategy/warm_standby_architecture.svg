  <text x="315.6757" y="211.2381" text-anchor="middle" font-size="16.6937">Web x5</text>
  <rect x="412.973" y="150.4762" width="145.9459" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="485.9459" y="211.2381" text-anchor="middle" font-size="16.6937">Cache x3</text>
  <rect x="153.5135" y="316.1905" width="324.3243" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="315.6757" y="376.9524" text-anchor="middle" font-size="16.6937" font-weight="bold">Primary DB (Multi-AZ)</text>
  <rect x="153.5135" y="468.0953" width="324.3243" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="315.6757" y="528.8572" text-anchor="middle" font-size="16.6937">100% traffic</text>
  <line x1="591.3514" y1="316.1905" x2="688.6486" y2="316.1905" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="288.5714" text-anchor="middle" font-size="16.6937" fill="var(--primary-accent)">Sync</text>
  <text x="640" y="371.4286" text-anchor="middle" font-size="16.6937" fill="var(--primary-accent)">Replication</text>
  <rect x="688.6486" y="67.619" width="551.3514" height="552.381" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="964.3243" y="40" text-anchor="middle" font-weight="bold" font-size="23.3711" fill="var(--primary-accent)">DR Region (Reduced Scale)</text>
  <rect x="769.7297" y="150.4762" width="145.9459" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="842.7027" y="211.2381" text-anchor="middle" font-size="16.6937">App x2</text>
  <rect x="940" y="150.4762" width="145.9459" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1012.973" y="211.2381" text-anchor="middle" font-size="16.6937">Web x1</text>
  <rect x="850.8108" y="316.1905" width="324.3243" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1012.973" y="376.9524" text-anchor="middle" font-size="16.6937" font-weight="bold">Read Replica DB</text>
  <rect x="850.8108" y="468.0953" width="324.3243" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1012.973" y="528.8572" text-anchor="middle" font-size="16.6937">0% traffic (standby)</text>
</svg>
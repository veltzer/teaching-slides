<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="67.619" width="551.3514" height="552.381" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315.6757" y="40" text-anchor="middle" font-weight="bold" font-size="23.3711" fill="var(--ok-accent)" font-family="Arial, sans-serif">Primary Region (Full Scale)</text>
  <rect x="72.4324" y="150.4762" width="145.9459" height="96.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.4054" y="211.2381" text-anchor="middle" font-size="16.6937" font-family="Arial, sans-serif" fill="var(--ok-text)">App x10</text>
  <rect x="242.7027" y="150.4762" width="145.9459" height="96.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315.6757" y="211.2381" text-anchor="middle" font-size="16.6937" font-family="Arial, sans-serif" fill="var(--ok-text)">Web x5</text>
  <rect x="412.973" y="150.4762" width="145.9459" height="96.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.9459" y="211.2381" text-anchor="middle" font-size="16.6937" font-family="Arial, sans-serif" fill="var(--ok-text)">Cache x3</text>
  <rect x="153.5135" y="316.1905" width="324.3243" height="96.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315.6757" y="376.9524" text-anchor="middle" font-size="16.6937" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Primary DB (Multi-AZ)</text>
  <rect x="153.5135" y="468.0953" width="324.3243" height="96.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315.6757" y="528.8572" text-anchor="middle" font-size="16.6937" font-family="Arial, sans-serif" fill="var(--ok-text)">100% traffic</text>
  <line x1="591.3514" y1="316.1905" x2="688.6486" y2="316.1905" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="288.5714" text-anchor="middle" font-size="16.6937" fill="var(--primary-accent)" font-family="Arial, sans-serif">Sync</text>
  <text x="640" y="371.4286" text-anchor="middle" font-size="16.6937" fill="var(--primary-accent)" font-family="Arial, sans-serif">Replication</text>
  <rect x="688.6486" y="67.619" width="551.3514" height="552.381" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="964.3243" y="40" text-anchor="middle" font-weight="bold" font-size="23.3711" fill="var(--primary-accent)" font-family="Arial, sans-serif">DR Region (Reduced Scale)</text>
  <rect x="769.7297" y="150.4762" width="145.9459" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="842.7027" y="211.2381" text-anchor="middle" font-size="16.6937" font-family="Arial, sans-serif" fill="var(--primary-text)">App x2</text>
  <rect x="940" y="150.4762" width="145.9459" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1012.973" y="211.2381" text-anchor="middle" font-size="16.6937" font-family="Arial, sans-serif" fill="var(--primary-text)">Web x1</text>
  <rect x="850.8108" y="316.1905" width="324.3243" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1012.973" y="376.9524" text-anchor="middle" font-size="16.6937" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Read Replica DB</text>
  <rect x="850.8108" y="468.0953" width="324.3243" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1012.973" y="528.8572" text-anchor="middle" font-size="16.6937" font-family="Arial, sans-serif" fill="var(--primary-text)">0% traffic (standby)</text>
</svg>

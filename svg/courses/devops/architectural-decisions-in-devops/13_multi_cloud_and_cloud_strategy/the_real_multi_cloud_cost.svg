<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="60" text-anchor="middle" font-weight="bold" font-size="22.4" fill="#333">Hidden Costs of Multi-Cloud</text>
  <rect x="96" y="120" width="192" height="480" rx="6.4" fill="#ef5350" stroke="#c62828" stroke-width="2.4" />
  <text x="192" y="384" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">Compute</text>
  <text x="192" y="420" text-anchor="middle" font-size="16" fill="#fff">+15-25%</text>
  <rect x="320" y="192" width="192" height="408" rx="6.4" fill="#ff7043" stroke="#d84315" stroke-width="2.4" />
  <text x="416" y="420" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">Staff</text>
  <text x="416" y="456" text-anchor="middle" font-size="16" fill="#fff">+30-50%</text>
  <rect x="544" y="264" width="192" height="336" rx="6.4" fill="#ffa726" stroke="#e65100" stroke-width="2.4" />
  <text x="640" y="456" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">Networking</text>
  <text x="640" y="492" text-anchor="middle" font-size="16" fill="#fff">+10-20%</text>
  <rect x="768" y="312" width="192" height="288" rx="6.4" fill="#ffca28" stroke="#f57f17" stroke-width="2.4" />
  <text x="864" y="480" text-anchor="middle" font-size="17.6" font-weight="bold">Tooling</text>
  <text x="864" y="516" text-anchor="middle" font-size="16">+5-15%</text>
  <rect x="992" y="384" width="192" height="216" rx="6.4" fill="#ffee58" stroke="#f9a825" stroke-width="2.4" />
  <text x="1088" y="504" text-anchor="middle" font-size="17.6" font-weight="bold">Compliance</text>
  <text x="1088" y="540" text-anchor="middle" font-size="16">+5-10%</text>
  <text x="640" y="672" text-anchor="middle" font-size="19.2" fill="#666" font-style="italic">Compared to single cloud baseline</text>
</svg>
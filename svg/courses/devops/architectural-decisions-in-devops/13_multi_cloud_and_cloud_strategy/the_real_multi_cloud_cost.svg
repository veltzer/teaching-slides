<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-weight="bold" font-size="22.9014" fill="var(--text)" font-family="Arial, sans-serif">Hidden Costs of Multi-Cloud</text>
  <rect x="40" y="96.8627" width="211.7647" height="454.902" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.8823" y="347.0588" text-anchor="middle" font-size="16.3582" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Compute</text>
  <text x="145.8823" y="381.1765" text-anchor="middle" font-size="16.3582" fill="var(--bg)" font-family="Arial, sans-serif">+15-25%</text>
  <rect x="287.0588" y="165.098" width="211.7647" height="386.6667" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="392.9412" y="381.1765" text-anchor="middle" font-size="16.3582" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Staff</text>
  <text x="392.9412" y="415.2941" text-anchor="middle" font-size="16.3582" fill="var(--bg)" font-family="Arial, sans-serif">+30-50%</text>
  <rect x="534.1176" y="233.3333" width="211.7647" height="318.4314" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="415.2941" text-anchor="middle" font-size="16.3582" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Networking</text>
  <text x="640" y="449.4117" text-anchor="middle" font-size="16.3582" fill="var(--bg)" font-family="Arial, sans-serif">+10-20%</text>
  <rect x="781.1765" y="278.8235" width="211.7647" height="272.9412" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="887.0588" y="438.0392" text-anchor="middle" font-size="17.994" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Tooling</text>
  <text x="887.0588" y="472.1569" text-anchor="middle" font-size="16.3582" font-family="Arial, sans-serif" fill="var(--warn-text)">+5-15%</text>
  <rect x="1028.2353" y="347.0588" width="211.7647" height="204.7059" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1134.1177" y="460.7843" text-anchor="middle" font-size="17.994" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Compliance</text>
  <text x="1134.1177" y="494.9019" text-anchor="middle" font-size="16.3582" font-family="Arial, sans-serif" fill="var(--warn-text)">+5-10%</text>
  <text x="640" y="620" text-anchor="middle" font-size="19.6298" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">Compared to single cloud baseline</text>
</svg>

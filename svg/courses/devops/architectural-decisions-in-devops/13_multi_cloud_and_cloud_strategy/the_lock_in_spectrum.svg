<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="lockgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="50%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e74c3c"/>
    </linearGradient>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.948314" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The Lock-in Spectrum</text>

  <text x="40" y="103.853211" font-size="22.695431" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Low Lock-in</text>
  <text x="1240" y="103.853211" text-anchor="end" font-size="22.695431" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">High Lock-in</text>

  <rect x="40" y="125.137615" width="1200" height="127.706422" rx="6.189663" fill="url(#lockgrad)"/>

  <line x1="160" y1="252.844037" x2="160" y2="306.055046" stroke="var(--text)" stroke-width="2"/>
  <rect x="40" y="311.376147" width="240" height="308.623853" rx="6.189663" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="375.229358" text-anchor="middle" font-size="22.695431" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">VMs / IaaS</text>
  <text x="160" y="444.40367" text-anchor="middle" font-size="16.505768" fill="var(--ok-text)" font-family="Arial, sans-serif">Raw compute</text>
  <text x="160" y="497.614679" text-anchor="middle" font-size="16.505768" fill="var(--ok-text)" font-family="Arial, sans-serif">Portable images</text>
  <text x="160" y="561.46789" text-anchor="middle" font-size="16.505768" fill="var(--ok-text)" font-family="Arial, sans-serif">Easy migration</text>

  <line x1="400" y1="252.844037" x2="400" y2="306.055046" stroke="var(--text)" stroke-width="2"/>
  <rect x="290" y="311.376147" width="240" height="308.623853" rx="6.189663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="375.229358" text-anchor="middle" font-size="22.695431" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Kubernetes</text>
  <text x="410" y="444.40367" text-anchor="middle" font-size="16.505768" fill="var(--primary-text)" font-family="Arial, sans-serif">Standard API</text>
  <text x="410" y="497.614679" text-anchor="middle" font-size="16.505768" fill="var(--primary-text)" font-family="Arial, sans-serif">Portable workloads</text>
  <text x="410" y="561.46789" text-anchor="middle" font-size="16.505768" fill="var(--primary-text)" font-family="Arial, sans-serif">Ingress varies</text>

  <line x1="660" y1="252.844037" x2="660" y2="306.055046" stroke="var(--text)" stroke-width="2"/>
  <rect x="540" y="311.376147" width="240" height="308.623853" rx="6.189663" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="375.229358" text-anchor="middle" font-size="22.695431" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Managed DB</text>
  <text x="660" y="444.40367" text-anchor="middle" font-size="16.505768" fill="var(--warn-text)" font-family="Arial, sans-serif">RDS, Aurora</text>
  <text x="660" y="497.614679" text-anchor="middle" font-size="16.505768" fill="var(--warn-text)" font-family="Arial, sans-serif">Portable SQL</text>
  <text x="660" y="561.46789" text-anchor="middle" font-size="16.505768" fill="var(--warn-text)" font-family="Arial, sans-serif">Heavy migration</text>

  <line x1="910" y1="252.844037" x2="910" y2="306.055046" stroke="var(--text)" stroke-width="2"/>
  <rect x="790" y="311.376147" width="240" height="308.623853" rx="6.189663" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="910" y="375.229358" text-anchor="middle" font-size="22.695431" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Serverless</text>
  <text x="910" y="444.40367" text-anchor="middle" font-size="16.505768" fill="var(--info-text)" font-family="Arial, sans-serif">Lambda, Functions</text>
  <text x="910" y="497.614679" text-anchor="middle" font-size="16.505768" fill="var(--info-text)" font-family="Arial, sans-serif">Trigger-bound</text>
  <text x="910" y="561.46789" text-anchor="middle" font-size="16.505768" fill="var(--info-text)" font-family="Arial, sans-serif">Rewrite required</text>

  <line x1="1160" y1="252.844037" x2="1160" y2="306.055046" stroke="var(--text)" stroke-width="2"/>
  <rect x="1040" y="311.376147" width="200" height="308.623853" rx="6.189663" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="375.229358" text-anchor="middle" font-size="20.63221" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Proprietary AI</text>
  <text x="1140" y="444.40367" text-anchor="middle" font-size="16.505768" fill="var(--danger-text)" font-family="Arial, sans-serif">Bedrock, Vertex</text>
  <text x="1140" y="497.614679" text-anchor="middle" font-size="16.505768" fill="var(--danger-text)" font-family="Arial, sans-serif">Unique models</text>
  <text x="1140" y="561.46789" text-anchor="middle" font-size="16.505768" fill="var(--danger-text)" font-family="Arial, sans-serif">Strongest moat</text>
</svg>

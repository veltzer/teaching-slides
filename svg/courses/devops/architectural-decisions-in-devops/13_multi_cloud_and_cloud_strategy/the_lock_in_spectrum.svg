<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="lockgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="50%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e74c3c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.948314" font-weight="bold" fill="var(--text)">The Lock-in Spectrum</text>

  <text x="40" y="103.853211" font-size="22.695431" font-weight="bold" fill="var(--ok-accent)">Low Lock-in</text>
  <text x="1240" y="103.853211" text-anchor="end" font-size="22.695431" font-weight="bold" fill="var(--danger-accent)">High Lock-in</text>

  <rect x="40" y="125.137615" width="1200" height="127.706422" rx="6.189663" fill="url(#lockgrad)"/>

  <line x1="160" y1="252.844037" x2="160" y2="306.055046" stroke="var(--text)" stroke-width="2"/>
  <rect x="40" y="311.376147" width="240" height="308.623853" rx="6.189663" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="375.229358" text-anchor="middle" font-size="22.695431" font-weight="bold" fill="var(--ok-text)">VMs / IaaS</text>
  <text x="160" y="444.40367" text-anchor="middle" font-size="16.505768" fill="var(--ok-text)">Raw compute</text>
  <text x="160" y="497.614679" text-anchor="middle" font-size="16.505768" fill="var(--ok-text)">Portable images</text>
  <text x="160" y="561.46789" text-anchor="middle" font-size="16.505768" fill="var(--ok-text)">Easy migration</text>

  <line x1="400" y1="252.844037" x2="400" y2="306.055046" stroke="var(--text)" stroke-width="2"/>
  <rect x="290" y="311.376147" width="240" height="308.623853" rx="6.189663" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="375.229358" text-anchor="middle" font-size="22.695431" font-weight="bold" fill="var(--primary-text)">Kubernetes</text>
  <text x="410" y="444.40367" text-anchor="middle" font-size="16.505768" fill="var(--primary-text)">Standard API</text>
  <text x="410" y="497.614679" text-anchor="middle" font-size="16.505768" fill="var(--primary-text)">Portable workloads</text>
  <text x="410" y="561.46789" text-anchor="middle" font-size="16.505768" fill="var(--primary-text)">Ingress varies</text>

  <line x1="660" y1="252.844037" x2="660" y2="306.055046" stroke="var(--text)" stroke-width="2"/>
  <rect x="540" y="311.376147" width="240" height="308.623853" rx="6.189663" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="375.229358" text-anchor="middle" font-size="22.695431" font-weight="bold" fill="var(--warn-text)">Managed DB</text>
  <text x="660" y="444.40367" text-anchor="middle" font-size="16.505768" fill="var(--warn-text)">RDS, Aurora</text>
  <text x="660" y="497.614679" text-anchor="middle" font-size="16.505768" fill="var(--warn-text)">Portable SQL</text>
  <text x="660" y="561.46789" text-anchor="middle" font-size="16.505768" fill="var(--warn-text)">Heavy migration</text>

  <line x1="910" y1="252.844037" x2="910" y2="306.055046" stroke="var(--text)" stroke-width="2"/>
  <rect x="790" y="311.376147" width="240" height="308.623853" rx="6.189663" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="910" y="375.229358" text-anchor="middle" font-size="22.695431" font-weight="bold" fill="var(--info-text)">Serverless</text>
  <text x="910" y="444.40367" text-anchor="middle" font-size="16.505768" fill="var(--info-text)">Lambda, Functions</text>
  <text x="910" y="497.614679" text-anchor="middle" font-size="16.505768" fill="var(--info-text)">Trigger-bound</text>
  <text x="910" y="561.46789" text-anchor="middle" font-size="16.505768" fill="var(--info-text)">Rewrite required</text>

  <line x1="1160" y1="252.844037" x2="1160" y2="306.055046" stroke="var(--text)" stroke-width="2"/>
  <rect x="1040" y="311.376147" width="200" height="308.623853" rx="6.189663" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="375.229358" text-anchor="middle" font-size="20.63221" font-weight="bold" fill="var(--danger-text)">Proprietary AI</text>
  <text x="1140" y="444.40367" text-anchor="middle" font-size="16.505768" fill="var(--danger-text)">Bedrock, Vertex</text>
  <text x="1140" y="497.614679" text-anchor="middle" font-size="16.505768" fill="var(--danger-text)">Unique models</text>
  <text x="1140" y="561.46789" text-anchor="middle" font-size="16.505768" fill="var(--danger-text)">Strongest moat</text>
</svg>

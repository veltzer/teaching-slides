<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="390.0001" y="40" width="500" height="93.5484" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="96.129" text-anchor="middle" font-weight="bold" font-size="19.9541" fill="var(--info-accent)" font-family="Arial, sans-serif">Global Load Balancer / DNS</text>
  <line x1="473.3333" y1="133.5484" x2="273.3334" y2="208.3871" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="806.6667" y1="133.5484" x2="1006.6666" y2="208.3871" stroke="var(--info-border)" stroke-width="2"/>
  <text x="340" y="174.7097" text-anchor="middle" font-size="15.3494" fill="var(--info-accent)" font-family="Arial, sans-serif">50% traffic</text>
  <text x="940" y="174.7097" text-anchor="middle" font-size="15.3494" fill="var(--info-accent)" font-family="Arial, sans-serif">50% traffic</text>
  <rect x="40" y="208.3871" width="466.6667" height="411.6129" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="273.3334" y="255.1613" text-anchor="middle" font-weight="bold" font-size="19.9541" fill="var(--ok-accent)" font-family="Arial, sans-serif">Region A (us-east-1)</text>
  <rect x="90.0001" y="283.2258" width="166.6667" height="65.4839" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="173.3333" y="324.3871" text-anchor="middle" font-size="15.3494" font-family="Arial, sans-serif" fill="var(--ok-text)">App Cluster</text>
  <rect x="290" y="283.2258" width="166.6667" height="65.4839" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="373.3333" y="324.3871" text-anchor="middle" font-size="15.3494" font-family="Arial, sans-serif" fill="var(--ok-text)">Cache</text>
  <rect x="140" y="395.4839" width="266.6667" height="65.4839" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="273.3334" y="436.6451" text-anchor="middle" font-size="15.3494" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">DB (Read/Write)</text>
  <rect x="140" y="507.7418" width="266.6667" height="65.4839" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="273.3334" y="548.9032" text-anchor="middle" font-size="15.3494" font-family="Arial, sans-serif" fill="var(--ok-text)">Active</text>
  <rect x="773.3333" y="208.3871" width="466.6667" height="411.6129" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.6666" y="255.1613" text-anchor="middle" font-weight="bold" font-size="19.9541" fill="var(--primary-accent)" font-family="Arial, sans-serif">Region B (eu-west-1)</text>
  <rect x="823.3333" y="283.2258" width="166.6667" height="65.4839" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="906.6667" y="324.3871" text-anchor="middle" font-size="15.3494" font-family="Arial, sans-serif" fill="var(--primary-text)">App Cluster</text>
  <rect x="1023.3333" y="283.2258" width="166.6667" height="65.4839" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1106.6667" y="324.3871" text-anchor="middle" font-size="15.3494" font-family="Arial, sans-serif" fill="var(--primary-text)">Cache</text>
  <rect x="873.3334" y="395.4839" width="266.6667" height="65.4839" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.6666" y="436.6451" text-anchor="middle" font-size="15.3494" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">DB (Read/Write)</text>
  <rect x="873.3334" y="507.7418" width="266.6667" height="65.4839" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.6666" y="548.9032" text-anchor="middle" font-size="15.3494" font-family="Arial, sans-serif" fill="var(--primary-text)">Active</text>
  <line x1="406.6667" y1="427.2903" x2="873.3334" y2="427.2903" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="9.0667 4.5333"/>
  <text x="640" y="414.1935" text-anchor="middle" font-size="15.3494" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Bi-directional Replication</text>
</svg>

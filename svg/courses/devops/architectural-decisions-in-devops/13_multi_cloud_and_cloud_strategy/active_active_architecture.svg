  <text x="273.3334" y="548.9032" text-anchor="middle" font-size="15.3494">Active</text>
  <rect x="773.3333" y="208.3871" width="466.6667" height="411.6129" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.6666" y="255.1613" text-anchor="middle" font-weight="bold" font-size="19.9541" fill="var(--primary-accent)">Region B (eu-west-1)</text>
  <rect x="823.3333" y="283.2258" width="166.6667" height="65.4839" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="906.6667" y="324.3871" text-anchor="middle" font-size="15.3494">App Cluster</text>
  <rect x="1023.3333" y="283.2258" width="166.6667" height="65.4839" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1106.6667" y="324.3871" text-anchor="middle" font-size="15.3494">Cache</text>
  <rect x="873.3334" y="395.4839" width="266.6667" height="65.4839" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.6666" y="436.6451" text-anchor="middle" font-size="15.3494" font-weight="bold">DB (Read/Write)</text>
  <rect x="873.3334" y="507.7418" width="266.6667" height="65.4839" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.6666" y="548.9032" text-anchor="middle" font-size="15.3494">Active</text>
  <line x1="406.6667" y1="427.2903" x2="873.3334" y2="427.2903" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="9.0667 4.5333" />
  <text x="640" y="414.1935" text-anchor="middle" font-size="15.3494" fill="var(--danger-accent)" font-weight="bold">Bi-directional Replication</text>
</svg>
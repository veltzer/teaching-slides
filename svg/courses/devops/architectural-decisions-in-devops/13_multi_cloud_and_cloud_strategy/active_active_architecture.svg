<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="377.7778" y="20" width="453.3333" height="100" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="604.4444" y="80" text-anchor="middle" font-weight="bold" font-size="19.6444" fill="var(--info-accent)">Global Load Balancer / DNS</text>
  <line x1="453.3333" y1="120" x2="272" y2="200" stroke="var(--info-border)" stroke-width="2" />
  <line x1="755.5555" y1="120" x2="936.8888" y2="200" stroke="var(--info-border)" stroke-width="2" />
  <text x="332.4444" y="164" text-anchor="middle" font-size="15.1111" fill="var(--info-accent)">50% traffic</text>
  <text x="876.4444" y="164" text-anchor="middle" font-size="15.1111" fill="var(--info-accent)">50% traffic</text>
  <rect x="60.4444" y="200" width="423.1111" height="440" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="272" y="250" text-anchor="middle" font-weight="bold" font-size="19.6444" fill="var(--ok-accent)">Region A (us-east-1)</text>
  <rect x="105.7778" y="280" width="151.1111" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="181.3333" y="324" text-anchor="middle" font-size="15.1111">App Cluster</text>
  <rect x="287.1111" y="280" width="151.1111" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="362.6666" y="324" text-anchor="middle" font-size="15.1111">Cache</text>
  <rect x="151.1111" y="400" width="241.7778" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="272" y="443.9999" text-anchor="middle" font-size="15.1111" font-weight="bold">DB (Read/Write)</text>
  <rect x="151.1111" y="519.9999" width="241.7778" height="70" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="272" y="564" text-anchor="middle" font-size="15.1111">Active</text>
  <rect x="725.3333" y="200" width="423.1111" height="440" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="936.8888" y="250" text-anchor="middle" font-weight="bold" font-size="19.6444" fill="var(--primary-accent)">Region B (eu-west-1)</text>
  <rect x="770.6666" y="280" width="151.1111" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="846.2222" y="324" text-anchor="middle" font-size="15.1111">App Cluster</text>
  <rect x="951.9999" y="280" width="151.1111" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1027.5555" y="324" text-anchor="middle" font-size="15.1111">Cache</text>
  <rect x="816" y="400" width="241.7778" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="936.8888" y="443.9999" text-anchor="middle" font-size="15.1111" font-weight="bold">DB (Read/Write)</text>
  <rect x="816" y="519.9999" width="241.7778" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="936.8888" y="564" text-anchor="middle" font-size="15.1111">Active</text>
  <line x1="392.8889" y1="434" x2="816" y2="434" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="9.0667 4.5333" />
  <text x="604.4444" y="420" text-anchor="middle" font-size="15.1111" fill="var(--danger-accent)" font-weight="bold">Bi-directional Replication</text>
</svg>
  <text x="273.3334" y="255.1613" text-anchor="middle" font-weight="bold" font-size="19.9541" fill="var(--ok-accent)">Region A (us-east-1)</text>
  <rect x="90.0001" y="283.2258" width="166.6667" height="65.4839" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="173.3333" y="324.3871" text-anchor="middle" font-size="15.3494">App Cluster</text>
  <rect x="290" y="283.2258" width="166.6667" height="65.4839" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="373.3333" y="324.3871" text-anchor="middle" font-size="15.3494">Cache</text>

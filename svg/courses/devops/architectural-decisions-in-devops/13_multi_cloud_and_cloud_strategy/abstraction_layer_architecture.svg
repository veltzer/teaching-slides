<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="155.1515" y="19.3939" width="930.9091" height="96.9697" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="620.6061" y="77.5758" text-anchor="middle" font-weight="bold" font-size="21.7212" fill="var(--info-accent)">Application Code</text>
  <rect x="155.1515" y="155.1515" width="930.9091" height="96.9697" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="620.6061" y="213.3333" text-anchor="middle" font-weight="bold" font-size="20.1697" fill="var(--bg)">Cloud Abstraction SDK</text>
  <rect x="155.1515" y="290.9091" width="930.9091" height="96.9697" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="620.6061" y="349.0909" text-anchor="middle" font-weight="bold" font-size="20.1697" fill="var(--bg)">Provider Adapter Layer</text>
  <rect x="155.1515" y="426.6667" width="279.2727" height="96.9697" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="294.7879" y="484.8485" text-anchor="middle" font-weight="bold" font-size="18.6182" fill="var(--warn-accent)">AWS SDK</text>
  <rect x="480.9697" y="426.6667" width="279.2727" height="96.9697" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="620.6061" y="484.8485" text-anchor="middle" font-weight="bold" font-size="18.6182" fill="var(--primary-accent)">Azure SDK</text>
  <rect x="806.7879" y="426.6667" width="279.2727" height="96.9697" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="946.4242" y="484.8485" text-anchor="middle" font-weight="bold" font-size="18.6182" fill="var(--ok-accent)">GCP SDK</text>
  <rect x="155.1515" y="562.4242" width="279.2727" height="77.5758" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="294.7879" y="610.9091" text-anchor="middle" font-size="17.0667">AWS Services</text>
  <rect x="480.9697" y="562.4242" width="279.2727" height="77.5758" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="620.6061" y="610.9091" text-anchor="middle" font-size="17.0667">Azure Services</text>
  <rect x="806.7879" y="562.4242" width="279.2727" height="77.5758" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="946.4242" y="610.9091" text-anchor="middle" font-size="17.0667">GCP Services</text>
  <text x="77.5758" y="77.5758" text-anchor="middle" font-size="15.5152" fill="var(--text-faint)">Layer 4</text>
  <text x="77.5758" y="213.3333" text-anchor="middle" font-size="15.5152" fill="var(--text-faint)">Layer 3</text>
  <text x="77.5758" y="349.0909" text-anchor="middle" font-size="15.5152" fill="var(--text-faint)">Layer 2</text>
  <text x="77.5758" y="484.8485" text-anchor="middle" font-size="15.5152" fill="var(--text-faint)">Layer 1</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="360" height="243.2258" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.9999" y="86.7742" text-anchor="middle" font-weight="bold" font-size="23.1088" fill="var(--primary-accent)" font-family="Arial, sans-serif">North America</text>
  <text x="219.9999" y="133.5483" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--primary-text)">CCPA (California)</text>
  <text x="219.9999" y="170.9677" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--primary-text)">PIPEDA (Canada)</text>
  <text x="219.9999" y="208.387" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--primary-text)">HIPAA (Healthcare)</text>
  <text x="219.9999" y="245.8065" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--primary-text)">FedRAMP (Gov)</text>
  <rect x="459.9999" y="40" width="360" height="243.2258" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="86.7742" text-anchor="middle" font-weight="bold" font-size="23.1088" fill="var(--ok-accent)" font-family="Arial, sans-serif">Europe</text>
  <text x="640" y="133.5483" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--ok-text)">GDPR</text>
  <text x="640" y="170.9677" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--ok-text)">Data must stay in EU</text>
  <text x="640" y="208.387" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--ok-text)">Schrems II ruling</text>
  <text x="640" y="245.8065" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--ok-text)">Right to erasure</text>
  <rect x="880" y="40" width="360" height="243.2258" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1059.9999" y="86.7742" text-anchor="middle" font-weight="bold" font-size="23.1088" fill="var(--warn-accent)" font-family="Arial, sans-serif">Asia-Pacific</text>
  <text x="1059.9999" y="133.5483" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--warn-text)">PIPL (China)</text>
  <text x="1059.9999" y="170.9677" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--warn-text)">PDPA (Singapore)</text>
  <text x="1059.9999" y="208.387" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--warn-text)">APPI (Japan)</text>
  <text x="1059.9999" y="245.8065" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--warn-text)">Strict localization</text>
  <rect x="260" y="376.7742" width="360" height="243.2258" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="423.5484" text-anchor="middle" font-weight="bold" font-size="23.1088" fill="var(--danger-accent)" font-family="Arial, sans-serif">South America</text>
  <text x="440" y="470.3226" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--danger-text)">LGPD (Brazil)</text>
  <text x="440" y="507.7419" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--danger-text)">Inspired by GDPR</text>
  <text x="440" y="545.1614" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--danger-text)">Cross-border rules</text>
  <rect x="759.9999" y="376.7742" width="360" height="243.2258" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="939.9999" y="423.5484" text-anchor="middle" font-weight="bold" font-size="23.1088" fill="var(--info-accent)" font-family="Arial, sans-serif">Middle East / Africa</text>
  <text x="939.9999" y="470.3226" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--info-text)">POPIA (South Africa)</text>
  <text x="939.9999" y="507.7419" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--info-text)">PDPL (Saudi Arabia)</text>
  <text x="939.9999" y="545.1614" text-anchor="middle" font-size="17.776" font-family="Arial, sans-serif" fill="var(--info-text)">Emerging frameworks</text>
</svg>

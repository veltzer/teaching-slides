<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="63.5817" y="56.4706" width="286.1177" height="244.7059" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="206.6405" y="103.5294" text-anchor="middle" font-weight="bold" font-size="20.6641" fill="var(--primary-accent)">North America</text>
  <text x="206.6405" y="150.5882" text-anchor="middle" font-size="15.8954">CCPA (California)</text>
  <text x="206.6405" y="188.2353" text-anchor="middle" font-size="15.8954">PIPEDA (Canada)</text>
  <text x="206.6405" y="225.8823" text-anchor="middle" font-size="15.8954">HIPAA (Healthcare)</text>
  <text x="206.6405" y="263.5295" text-anchor="middle" font-size="15.8954">FedRAMP (Gov)</text>
  <rect x="397.3856" y="56.4706" width="286.1177" height="244.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="540.4445" y="103.5294" text-anchor="middle" font-weight="bold" font-size="20.6641" fill="var(--ok-accent)">Europe</text>
  <text x="540.4445" y="150.5882" text-anchor="middle" font-size="15.8954">GDPR</text>
  <text x="540.4445" y="188.2353" text-anchor="middle" font-size="15.8954">Data must stay in EU</text>
  <text x="540.4445" y="225.8823" text-anchor="middle" font-size="15.8954">Schrems II ruling</text>
  <text x="540.4445" y="263.5295" text-anchor="middle" font-size="15.8954">Right to erasure</text>
  <rect x="731.1896" y="56.4706" width="286.1177" height="244.7059" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="874.2484" y="103.5294" text-anchor="middle" font-weight="bold" font-size="20.6641" fill="var(--warn-accent)">Asia-Pacific</text>
  <text x="874.2484" y="150.5882" text-anchor="middle" font-size="15.8954">PIPL (China)</text>
  <text x="874.2484" y="188.2353" text-anchor="middle" font-size="15.8954">PDPA (Singapore)</text>
  <text x="874.2484" y="225.8823" text-anchor="middle" font-size="15.8954">APPI (Japan)</text>
  <text x="874.2484" y="263.5295" text-anchor="middle" font-size="15.8954">Strict localization</text>
  <rect x="238.4314" y="395.2941" width="286.1177" height="244.7059" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="381.4902" y="442.353" text-anchor="middle" font-weight="bold" font-size="20.6641" fill="var(--danger-accent)">South America</text>
  <text x="381.4902" y="489.4118" text-anchor="middle" font-size="15.8954">LGPD (Brazil)</text>
  <text x="381.4902" y="527.0588" text-anchor="middle" font-size="15.8954">Inspired by GDPR</text>
  <text x="381.4902" y="564.706" text-anchor="middle" font-size="15.8954">Cross-border rules</text>
  <rect x="635.817" y="395.2941" width="286.1177" height="244.7059" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="778.8758" y="442.353" text-anchor="middle" font-weight="bold" font-size="20.6641" fill="var(--info-accent)">Middle East / Africa</text>
  <text x="778.8758" y="489.4118" text-anchor="middle" font-size="15.8954">POPIA (South Africa)</text>
  <text x="778.8758" y="527.0588" text-anchor="middle" font-size="15.8954">PDPL (Saudi Arabia)</text>
  <text x="778.8758" y="564.706" text-anchor="middle" font-size="15.8954">Emerging frameworks</text>
</svg>
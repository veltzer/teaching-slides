<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="67.619" width="480" height="552.381" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="40" text-anchor="middle" font-weight="bold" font-size="24.0296" fill="var(--ok-accent)" font-family="Arial, sans-serif">Primary Region</text>
  <rect x="91.4286" y="150.4762" width="171.4286" height="110.4762" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.1429" y="219.5238" text-anchor="middle" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--ok-text)">App Servers</text>
  <rect x="297.1429" y="150.4762" width="171.4286" height="110.4762" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="382.8571" y="219.5238" text-anchor="middle" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--ok-text)">Database</text>
  <rect x="160" y="343.8095" width="240" height="110.4762" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="412.8572" text-anchor="middle" font-size="18.8804" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Scheduled Backups</text>
  <line x1="520" y1="399.0477" x2="760" y2="399.0477" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="12.8 6.4"/>
  <text x="640" y="371.4286" text-anchor="middle" font-size="17.164" fill="var(--text-muted)" font-family="Arial, sans-serif">Periodic copy</text>
  <rect x="760" y="67.619" width="480" height="552.381" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="9.6 4.8" filter="url(#shadow)"/>
  <text x="1000" y="40" text-anchor="middle" font-weight="bold" font-size="24.0296" fill="var(--danger-accent)" font-family="Arial, sans-serif">DR Region (Cold)</text>
  <rect x="862.8571" y="343.8095" width="274.2857" height="110.4762" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="412.8572" text-anchor="middle" font-size="18.8804" font-family="Arial, sans-serif" fill="var(--danger-text)">Backup Storage</text>
  <text x="1000" y="233.3334" text-anchor="middle" font-size="20.5968" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">No running infra</text>
  <text x="1000" y="288.5714" text-anchor="middle" font-size="20.5968" fill="var(--text-faint)" font-style="italic" font-family="Arial, sans-serif">until failover</text>
</svg>

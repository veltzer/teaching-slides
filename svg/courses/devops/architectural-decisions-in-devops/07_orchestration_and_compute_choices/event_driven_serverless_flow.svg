<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="38.8984" y="56.8889" width="194.492" height="113.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136.1444" y="128" text-anchor="middle" font-size="19.4492" font-weight="bold" fill="var(--primary-accent)">S3 Upload</text>
  <rect x="38.8984" y="213.3333" width="194.492" height="113.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="136.1444" y="284.4444" text-anchor="middle" font-size="19.4492" font-weight="bold" fill="var(--ok-accent)">SQS Queue</text>
  <rect x="38.8984" y="369.7778" width="194.492" height="113.7778" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="136.1444" y="440.8889" text-anchor="middle" font-size="19.4492" font-weight="bold" fill="var(--warn-accent)">Schedule</text>
  <rect x="38.8984" y="526.2222" width="194.492" height="113.7778" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="136.1444" y="597.3333" text-anchor="middle" font-size="19.4492" font-weight="bold" fill="var(--info-accent)">DB Stream</text>
  <line x1="233.3903" y1="113.7778" x2="427.8823" y2="327.1111" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="233.3903" y1="270.2222" x2="427.8823" y2="327.1111" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="233.3903" y1="426.6667" x2="427.8823" y2="355.5556" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="233.3903" y1="583.1111" x2="427.8823" y2="369.7778" stroke="var(--info-border)" stroke-width="2" />
  <rect x="427.8823" y="270.2222" width="252.8395" height="156.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="554.302" y="335.6444" text-anchor="middle" font-size="21.3941" font-weight="bold" fill="var(--danger-accent)">Lambda</text>
  <text x="554.302" y="392.5333" text-anchor="middle" font-size="19.4492" fill="var(--text-muted)">Process Event</text>
  <line x1="680.7218" y1="307.2" x2="836.3153" y2="170.6667" stroke="var(--text)" stroke-width="2" />
  <line x1="680.7218" y1="347.0222" x2="836.3153" y2="347.0222" stroke="var(--text)" stroke-width="2" />
  <line x1="680.7218" y1="392.5333" x2="836.3153" y2="540.4444" stroke="var(--text)" stroke-width="2" />
  <rect x="836.3153" y="99.5556" width="233.3903" height="113.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="953.0105" y="170.6667" text-anchor="middle" font-size="19.4492" font-weight="bold" fill="var(--primary-accent)">DynamoDB</text>
  <rect x="836.3153" y="284.4444" width="233.3903" height="113.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="953.0105" y="355.5556" text-anchor="middle" font-size="19.4492" font-weight="bold" fill="var(--ok-accent)">SNS Topic</text>
  <rect x="836.3153" y="483.5556" width="233.3903" height="113.7778" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="953.0105" y="554.6667" text-anchor="middle" font-size="19.4492" font-weight="bold" fill="var(--info-accent)">S3 Bucket</text>
</svg>
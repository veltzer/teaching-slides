<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text)">The Compute Spectrum</text>

  <rect x="40" y="100" width="290" height="360" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">VMs / Bare Metal</text>
  <text x="185" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Full OS control</text>
  <text x="185" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Any workload</text>
  <text x="185" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Patch everything</text>
  <text x="185" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Capacity planning</text>
  <text x="185" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Slow to scale</text>
  <text x="185" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--primary-text)">EC2, GCE, on-prem</text>

  <rect x="340" y="100" width="290" height="360" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="485" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Self-Managed K8s</text>
  <text x="485" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">You run control plane</text>
  <text x="485" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Full tunability</text>
  <text x="485" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Heavy ops burden</text>
  <text x="485" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Upgrades are risky</text>
  <text x="485" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Need platform team</text>
  <text x="485" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--info-text)">kubeadm, rke2</text>

  <rect x="640" y="100" width="290" height="360" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="785" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Managed K8s</text>
  <text x="785" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Cloud runs masters</text>
  <text x="785" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Standard Kubernetes</text>
  <text x="785" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Still run workers</text>
  <text x="785" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Autoscale nodes</text>
  <text x="785" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Sane default today</text>
  <text x="785" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--ok-text)">EKS, GKE, AKS</text>

  <rect x="940" y="100" width="300" height="360" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1090" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Serverless</text>
  <text x="1090" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">No servers to manage</text>
  <text x="1090" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Scale to zero</text>
  <text x="1090" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Per-request pricing</text>
  <text x="1090" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Cold starts</text>
  <text x="1090" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">Vendor lock-in</text>
  <text x="1090" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--danger-text)">Lambda, Cloud Run</text>

  <rect x="40" y="490" width="1200" height="130" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--text)">Pick by workload shape, not novelty</text>
  <line x1="80" y1="560" x2="1200" y2="560" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="120" y="595" text-anchor="start" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">More control, more ops</text>
  <text x="1160" y="595" text-anchor="end" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Less control, less ops</text>
</svg>

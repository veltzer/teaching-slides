<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.7273 6.8923,0" fill="#333" />
    </marker>
  </defs>
  <rect x="39.3846" y="98.1818" width="196.9231" height="163.6364" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="137.8462" y="180" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="var(--primary-accent)">Event</text>
  <text x="137.8462" y="229.0909" text-anchor="middle" font-size="19.6923" fill="var(--text-muted)">HTTP / Queue</text>
  <line x1="236.3077" y1="180" x2="334.7692" y2="180" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="334.7692" y="98.1818" width="216.6154" height="163.6364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="443.0769" y="180" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="var(--warn-accent)">API Gateway</text>
  <text x="443.0769" y="229.0909" text-anchor="middle" font-size="19.6923" fill="var(--text-muted)">Route + Auth</text>
  <line x1="551.3846" y1="180" x2="649.8462" y2="180" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="649.8462" y="65.4545" width="236.3077" height="229.0909" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="768" y="147.2727" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="var(--ok-accent)">Function</text>
  <text x="768" y="196.3636" text-anchor="middle" font-size="19.6923" fill="var(--text-muted)">Your Code</text>
  <text x="768" y="245.4545" text-anchor="middle" font-size="19.6923" fill="var(--text-muted)">Runs on demand</text>
  <line x1="886.1538" y1="180" x2="984.6154" y2="180" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="984.6154" y="98.1818" width="236.3077" height="163.6364" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1102.7692" y="180" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="var(--info-accent)">Backend</text>
  <text x="1102.7692" y="229.0909" text-anchor="middle" font-size="19.6923" fill="var(--text-muted)">DB / Storage / API</text>
  <rect x="236.3077" y="392.7273" width="827.0769" height="196.3636" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.8154" />
  <text x="649.8462" y="474.5455" text-anchor="middle" font-size="21.6615" font-weight="bold" fill="var(--text-muted)">Provider Manages Everything Below</text>
  <text x="393.8462" y="540" font-size="19.6923" fill="var(--text-faint)">OS</text>
  <text x="531.6923" y="540" font-size="19.6923" fill="var(--text-faint)">Runtime</text>
  <text x="669.5385" y="540" font-size="19.6923" fill="var(--text-faint)">Scaling</text>
  <text x="807.3846" y="540" font-size="19.6923" fill="var(--text-faint)">Networking</text>
  <text x="945.2308" y="540" font-size="19.6923" fill="var(--text-faint)">Security</text>
</svg>
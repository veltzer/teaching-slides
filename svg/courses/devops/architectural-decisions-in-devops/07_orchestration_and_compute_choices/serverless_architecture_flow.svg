  <line x1="280" y1="55" x2="330" y2="55" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="330" y="20" width="120" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,32.7273 6.8923,0" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="76.25" width="200" height="181.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0001" y="166.875" text-anchor="middle" font-size="20.8863" font-weight="bold" fill="var(--primary-accent)">Event</text>
  <text x="140.0001" y="221.25" text-anchor="middle" font-size="20.8863" fill="var(--text-muted)">HTTP / Queue</text>
  <line x1="240" y1="166.875" x2="340" y2="166.875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="340" y="76.25" width="220" height="181.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="166.875" text-anchor="middle" font-size="20.8863" font-weight="bold" fill="var(--warn-accent)">API Gateway</text>
  <text x="450" y="221.25" text-anchor="middle" font-size="20.8863" fill="var(--text-muted)">Route + Auth</text>
  <line x1="560" y1="166.875" x2="660" y2="166.875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="660" y="40" width="240" height="253.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="130.625" text-anchor="middle" font-size="20.8863" font-weight="bold" fill="var(--ok-accent)">Function</text>
  <text x="780" y="185" text-anchor="middle" font-size="20.8863" fill="var(--text-muted)">Your Code</text>
  <text x="780" y="239.375" text-anchor="middle" font-size="20.8863" fill="var(--text-muted)">Runs on demand</text>
  <line x1="899.9999" y1="166.875" x2="1000" y2="166.875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1000" y="76.25" width="240" height="181.25" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1119.9999" y="166.875" text-anchor="middle" font-size="20.8863" font-weight="bold" fill="var(--info-accent)">Backend</text>
  <text x="1119.9999" y="221.25" text-anchor="middle" font-size="20.8863" fill="var(--text-muted)">DB / Storage / API</text>
  <rect x="240" y="402.5001" width="839.9999" height="217.4999" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.8154" />
  <text x="660" y="493.1251" text-anchor="middle" font-size="22.9749" font-weight="bold" fill="var(--text-muted)">Provider Manages Everything Below</text>
  <text x="400.0001" y="565.625" font-size="20.8863" fill="var(--text-faint)">OS</text>
  <text x="540" y="565.625" font-size="20.8863" fill="var(--text-faint)">Runtime</text>
  <text x="680" y="565.625" font-size="20.8863" fill="var(--text-faint)">Scaling</text>
  <text x="820" y="565.625" font-size="20.8863" fill="var(--text-faint)">Networking</text>
  <text x="960" y="565.625" font-size="20.8863" fill="var(--text-faint)">Security</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="76.25" width="200" height="181.25" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0001" y="166.875" text-anchor="middle" font-size="20.8863" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Event</text>
  <text x="140.0001" y="221.25" text-anchor="middle" font-size="20.8863" fill="var(--text-muted)" font-family="Arial, sans-serif">HTTP / Queue</text>
  <line x1="240" y1="166.875" x2="340" y2="166.875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="76.25" width="220" height="181.25" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="166.875" text-anchor="middle" font-size="20.8863" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">API Gateway</text>
  <text x="450" y="221.25" text-anchor="middle" font-size="20.8863" fill="var(--text-muted)" font-family="Arial, sans-serif">Route + Auth</text>
  <line x1="560" y1="166.875" x2="660" y2="166.875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660" y="40" width="240" height="253.75" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="130.625" text-anchor="middle" font-size="20.8863" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Function</text>
  <text x="780" y="185" text-anchor="middle" font-size="20.8863" fill="var(--text-muted)" font-family="Arial, sans-serif">Your Code</text>
  <text x="780" y="239.375" text-anchor="middle" font-size="20.8863" fill="var(--text-muted)" font-family="Arial, sans-serif">Runs on demand</text>
  <line x1="899.9999" y1="166.875" x2="1000" y2="166.875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1000" y="76.25" width="240" height="181.25" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1119.9999" y="166.875" text-anchor="middle" font-size="20.8863" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Backend</text>
  <text x="1119.9999" y="221.25" text-anchor="middle" font-size="20.8863" fill="var(--text-muted)" font-family="Arial, sans-serif">DB / Storage / API</text>
  <rect x="240" y="402.5001" width="839.9999" height="217.4999" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="11.8154"/>
  <text x="660" y="493.1251" text-anchor="middle" font-size="22.9749" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Provider Manages Everything Below</text>
  <text x="400.0001" y="565.625" font-size="20.8863" fill="var(--text-faint)" font-family="Arial, sans-serif">OS</text>
  <text x="540" y="565.625" font-size="20.8863" fill="var(--text-faint)" font-family="Arial, sans-serif">Runtime</text>
  <text x="680" y="565.625" font-size="20.8863" fill="var(--text-faint)" font-family="Arial, sans-serif">Scaling</text>
  <text x="820" y="565.625" font-size="20.8863" fill="var(--text-faint)" font-family="Arial, sans-serif">Networking</text>
  <text x="960" y="565.625" font-size="20.8863" fill="var(--text-faint)" font-family="Arial, sans-serif">Security</text>
</svg>

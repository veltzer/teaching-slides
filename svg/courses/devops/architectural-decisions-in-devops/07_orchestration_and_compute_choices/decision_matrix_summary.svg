<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="284.7458" height="161.111111111111" rx="6.324555320337" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.3729" y="104.444555555556" text-anchor="middle" font-size="20.741062945278" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Small Team</text>
  <text x="182.3729" y="162.444444444444" text-anchor="middle" font-size="20.741062945278" fill="var(--text-muted)" font-family="Arial, sans-serif">&lt; 5 engineers</text>
  <rect x="40" y="233.333333333333" width="284.7458" height="128.888888888889" rx="6.324555320337" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.3729" y="313.888888888889" text-anchor="middle" font-size="20.741062945278" fill="var(--ok-accent)" font-family="Arial, sans-serif">Serverless / Managed</text>
  <line x1="182.3729" y1="201.111111111111" x2="182.3729" y2="233.333333333333" stroke="var(--text)" stroke-width="2"/>
  <rect x="497.6271" y="40" width="284.7458" height="161.111111111111" rx="6.324555320337" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="104.444555555556" text-anchor="middle" font-size="20.741062945278" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Medium Team</text>
  <text x="640.0001" y="162.444444444444" text-anchor="middle" font-size="20.741062945278" fill="var(--text-muted)" font-family="Arial, sans-serif">5-15 engineers</text>
  <rect x="497.6271" y="233.333333333333" width="284.7458" height="128.888888888889" rx="6.324555320337" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="313.888888888889" text-anchor="middle" font-size="20.741062945278" fill="var(--danger-accent)" font-family="Arial, sans-serif">Managed K8s / Hybrid</text>
  <line x1="640.0001" y1="201.111111111111" x2="640.0001" y2="233.333333333333" stroke="var(--text)" stroke-width="2"/>
  <rect x="955.2542" y="40" width="284.7458" height="161.111111111111" rx="6.324555320337" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097.6271" y="104.444555555556" text-anchor="middle" font-size="20.741062945278" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Large Team</text>
  <text x="1097.6271" y="162.444444444444" text-anchor="middle" font-size="20.741062945278" fill="var(--text-muted)" font-family="Arial, sans-serif">15+ engineers</text>
  <rect x="955.2542" y="233.333333333333" width="284.7458" height="128.888888888889" rx="6.324555320337" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097.6271" y="313.888888888889" text-anchor="middle" font-size="20.741062945278" fill="var(--primary-accent)" font-family="Arial, sans-serif">K8s + Platform Team</text>
  <line x1="1097.6271" y1="201.111111111111" x2="1097.6271" y2="233.333333333333" stroke="var(--text)" stroke-width="2"/>
  <rect x="182.3729" y="426.666666666667" width="915.2542" height="193.333333333333" rx="6.324555320337" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0001" y="507.222222222222" text-anchor="middle" font-size="22.815095453327" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Key Principle</text>
  <text x="640.0001" y="578.111111111111" text-anchor="middle" font-size="20.741062945278" fill="var(--text-muted)" font-family="Arial, sans-serif">Choose the simplest model that meets your requirements.</text>
</svg>

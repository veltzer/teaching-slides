<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.000107017532" y="40" text-anchor="middle" font-size="29.347418083452" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Shared Cluster</text>
  <rect x="40" y="85.789483240996" width="357.894665497084" height="244.210456232697" rx="6.829136664587" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.947439766074" y="146.842248614939" text-anchor="middle" font-size="23.058579947978" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">ns: team-a</text>
  <rect x="71.579054385953" y="177.368449722988" width="115.7894380117" height="76.31580540166" rx="6.829136664587" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="128.421095438592" y="229.263221606639" text-anchor="middle" font-size="20.962490267728" fill="var(--text)" font-family="Arial, sans-serif">Svc 1</text>
  <rect x="208.42108830409" y="177.368449722988" width="115.7894380117" height="76.31580540166" rx="6.829136664587" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="265.26323637426" y="229.263221606639" text-anchor="middle" font-size="20.962490267728" fill="var(--text)" font-family="Arial, sans-serif">Svc 2</text>
  <rect x="461.05277426899" y="85.789483240996" width="357.894665497084" height="244.210456232697" rx="6.829136664587" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000107017532" y="146.842248614939" text-anchor="middle" font-size="23.058579947978" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">ns: team-b</text>
  <rect x="492.631614619879" y="177.368449722988" width="115.7894380117" height="76.31580540166" rx="6.829136664587" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="549.473869707582" y="229.263221606639" text-anchor="middle" font-size="20.962490267728" fill="var(--text)" font-family="Arial, sans-serif">Svc 3</text>
  <rect x="629.473648538016" y="177.368449722988" width="115.7894380117" height="76.31580540166" rx="6.829136664587" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="686.315903625718" y="229.263221606639" text-anchor="middle" font-size="20.962490267728" fill="var(--text)" font-family="Arial, sans-serif">Svc 4</text>
  <rect x="882.105334502916" y="85.789483240996" width="357.894665497084" height="244.210456232697" rx="6.829136664587" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.052667251458" y="146.842248614939" text-anchor="middle" font-size="23.058579947978" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">ns: team-c</text>
  <rect x="913.684174853805" y="177.368449722988" width="115.7894380117" height="76.31580540166" rx="6.829136664587" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="970.526322923976" y="229.263221606639" text-anchor="middle" font-size="20.962490267728" fill="var(--text)" font-family="Arial, sans-serif">Svc 5</text>
  <rect x="1050.526315789474" y="177.368449722988" width="115.7894380117" height="76.31580540166" rx="6.829136664587" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1107.368356842112" y="229.263221606639" text-anchor="middle" font-size="20.962490267728" fill="var(--text)" font-family="Arial, sans-serif">Svc 6</text>
  <rect x="40" y="375.789543767303" width="1199.999785964936" height="106.842006509709" rx="6.829136664587" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000107017532" y="446.000060526308" text-anchor="middle" font-size="23.058579947978" fill="var(--primary-accent)" font-family="Arial, sans-serif">Shared Control Plane + Shared Node Pool</text>
  <rect x="40" y="513.157993490291" width="1199.999785964936" height="106.842006509709" rx="6.829136664587" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000107017532" y="583.36838919668" text-anchor="middle" font-size="23.058579947978" fill="var(--danger-accent)" font-family="Arial, sans-serif">NetworkPolicy + RBAC + OPA/Gatekeeper Enforcement</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="580.6451" height="354.4444" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.3226" y="104.4444" text-anchor="middle" font-size="24.2796" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Kubernetes Cluster</text>
  <rect x="69.0323" y="143.1111" width="154.8387" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.4516" y="204.3333" text-anchor="middle" font-size="20.233" fill="var(--text)" font-family="Arial, sans-serif">API Gateway</text>
  <rect x="252.9032" y="143.1111" width="154.8387" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.3226" y="204.3333" text-anchor="middle" font-size="20.233" fill="var(--text)" font-family="Arial, sans-serif">Core API</text>
  <rect x="436.7742" y="143.1111" width="154.8387" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="514.1935" y="204.3333" text-anchor="middle" font-size="20.233" fill="var(--text)" font-family="Arial, sans-serif">Auth Service</text>
  <rect x="69.0323" y="272" width="154.8387" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.4516" y="333.2222" text-anchor="middle" font-size="20.233" fill="var(--text)" font-family="Arial, sans-serif">Redis Cache</text>
  <rect x="252.9032" y="272" width="154.8387" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.3226" y="333.2222" text-anchor="middle" font-size="20.233" fill="var(--text)" font-family="Arial, sans-serif">PostgreSQL</text>
  <rect x="698.0645" y="40" width="541.9355" height="161.1111" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="969.0323" y="104.4444" text-anchor="middle" font-size="22.2563" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Serverless Functions</text>
  <text x="794.8387" y="162.4444" font-size="20.233" fill="var(--text)" font-family="Arial, sans-serif">Image Resize</text>
  <text x="969.0323" y="162.4444" font-size="20.233" fill="var(--text)" font-family="Arial, sans-serif">Email Send</text>
  <text x="1123.8709" y="162.4444" font-size="20.233" fill="var(--text)" font-family="Arial, sans-serif">Webhooks</text>
  <rect x="698.0645" y="233.3333" width="541.9355" height="161.1111" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="969.0323" y="297.7778" text-anchor="middle" font-size="22.2563" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Managed Containers</text>
  <text x="794.8387" y="355.7778" font-size="20.233" fill="var(--text)" font-family="Arial, sans-serif">Batch Jobs</text>
  <text x="969.0323" y="355.7778" font-size="20.233" fill="var(--text)" font-family="Arial, sans-serif">Data Pipeline</text>
  <text x="1143.2257" y="355.7778" font-size="20.233" fill="var(--text)" font-family="Arial, sans-serif">Reports</text>
  <rect x="214.1936" y="475" width="870.9677" height="145" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="649.6774" y="565.2222" text-anchor="middle" font-size="22.2563" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Shared: Message Queue, Object Storage, CDN</text>
  <line x1="330.3226" y1="394.4444" x2="649.6774" y2="475" stroke="var(--info-border)" stroke-width="1.9692" stroke-dasharray="7.8769"/>
  <line x1="969.0323" y1="201.1111" x2="649.6774" y2="475" stroke="var(--info-border)" stroke-width="1.9692" stroke-dasharray="7.8769"/>
  <line x1="969.0323" y1="394.4444" x2="649.6774" y2="475" stroke="var(--info-border)" stroke-width="1.9692" stroke-dasharray="7.8769"/>
</svg>

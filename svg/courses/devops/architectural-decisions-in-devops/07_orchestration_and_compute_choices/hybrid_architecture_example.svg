<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="19.6923" y="30" width="590.7692" height="330" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="315.0769" y="90" text-anchor="middle" font-size="23.6308" font-weight="bold" fill="var(--primary-accent)">Kubernetes Cluster</text>
  <rect x="49.2308" y="126" width="157.5385" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="128" y="183" text-anchor="middle" font-size="19.6923" fill="var(--text)">API Gateway</text>
  <rect x="236.3077" y="126" width="157.5385" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="315.0769" y="183" text-anchor="middle" font-size="19.6923" fill="var(--text)">Core API</text>
  <rect x="423.3846" y="126" width="157.5385" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="502.1538" y="183" text-anchor="middle" font-size="19.6923" fill="var(--text)">Auth Service</text>
  <rect x="49.2308" y="246" width="157.5385" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="128" y="303" text-anchor="middle" font-size="19.6923" fill="var(--text)">Redis Cache</text>
  <rect x="236.3077" y="246" width="157.5385" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="315.0769" y="303" text-anchor="middle" font-size="19.6923" fill="var(--text)">PostgreSQL</text>
  <rect x="689.2308" y="30" width="551.3846" height="150" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="964.9231" y="90" text-anchor="middle" font-size="21.6615" font-weight="bold" fill="var(--ok-accent)">Serverless Functions</text>
  <text x="787.6923" y="144" font-size="19.6923" fill="var(--text)">Image Resize</text>
  <text x="964.9231" y="144" font-size="19.6923" fill="var(--text)">Email Send</text>
  <text x="1122.4615" y="144" font-size="19.6923" fill="var(--text)">Webhooks</text>
  <rect x="689.2308" y="210" width="551.3846" height="150" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="964.9231" y="270" text-anchor="middle" font-size="21.6615" font-weight="bold" fill="var(--warn-accent)">Managed Containers</text>
  <text x="787.6923" y="324" font-size="19.6923" fill="var(--text)">Batch Jobs</text>
  <text x="964.9231" y="324" font-size="19.6923" fill="var(--text)">Data Pipeline</text>
  <text x="1142.1538" y="324" font-size="19.6923" fill="var(--text)">Reports</text>
  <rect x="196.9231" y="435" width="886.1538" height="135" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="519" text-anchor="middle" font-size="21.6615" font-weight="bold" fill="var(--info-accent)">Shared: Message Queue, Object Storage, CDN</text>
  <line x1="315.0769" y1="360" x2="640" y2="435" stroke="var(--info-border)" stroke-width="1.9692" stroke-dasharray="7.8769" />
  <line x1="964.9231" y1="180" x2="640" y2="435" stroke="var(--info-border)" stroke-width="1.9692" stroke-dasharray="7.8769" />
  <line x1="964.9231" y1="360" x2="640" y2="435" stroke="var(--info-border)" stroke-width="1.9692" stroke-dasharray="7.8769" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="413.7705" y="40" width="491.8033" height="98.7234" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="659.6721" y="101.7022" text-anchor="middle" font-size="22.2975" font-weight="bold" fill="var(--primary-accent)">Need Kubernetes?</text>
  <line x1="512.1312" y1="138.7234" x2="276.0655" y2="212.766" stroke="var(--text)" stroke-width="2" />
  <line x1="807.2131" y1="138.7234" x2="1043.2786" y2="212.766" stroke="var(--text)" stroke-width="2" />
  <text x="354.754" y="175.7447" font-size="18.5813" fill="var(--ok-accent)">Yes</text>
  <text x="954.754" y="175.7447" font-size="18.5813" fill="var(--danger-accent)">No</text>
  <rect x="79.3442" y="212.766" width="393.4427" height="98.7234" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="276.0655" y="274.4681" text-anchor="middle" font-size="20.4393" fill="var(--ok-accent)">On-prem or air-gapped?</text>
  <rect x="846.5573" y="212.766" width="393.4427" height="98.7234" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.2786" y="274.4681" text-anchor="middle" font-size="20.4393" fill="var(--warn-accent)">Use managed containers</text>
  <line x1="177.7049" y1="311.4894" x2="177.7049" y2="385.5319" stroke="var(--text)" stroke-width="2" />
  <line x1="374.4262" y1="311.4894" x2="374.4262" y2="385.5319" stroke="var(--text)" stroke-width="2" />
  <text x="138.3605" y="360.851" font-size="18.5813" fill="var(--ok-accent)">Yes</text>
  <text x="403.9344" y="360.851" font-size="18.5813" fill="var(--danger-accent)">No</text>
  <rect x="40" y="385.5319" width="275.4099" height="98.7234" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.7049" y="447.234" text-anchor="middle" font-size="20.4393" fill="var(--danger-accent)">Self-managed K8s</text>
  <rect x="374.4262" y="385.5319" width="275.4099" height="98.7234" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="512.1312" y="447.234" text-anchor="middle" font-size="20.4393" fill="var(--info-accent)">Managed K8s</text>
  <rect x="40" y="508.9362" width="275.4099" height="111.0638" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.7049" y="553.3616" text-anchor="middle" font-size="18.5813" fill="var(--text)">kubeadm, kops, Rancher</text>
  <text x="177.7049" y="595.3191" text-anchor="middle" font-size="18.5813" fill="var(--danger-accent)">High ops burden</text>
  <rect x="374.4262" y="508.9362" width="275.4099" height="111.0638" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="512.1312" y="553.3616" text-anchor="middle" font-size="18.5813" fill="var(--text)">EKS, AKS, GKE</text>
  <text x="512.1312" y="595.3191" text-anchor="middle" font-size="18.5813" fill="var(--info-accent)">Medium ops burden</text>
</svg>
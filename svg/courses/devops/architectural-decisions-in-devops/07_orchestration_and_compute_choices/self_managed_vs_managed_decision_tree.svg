<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="413.7705" y="40" width="491.8033" height="98.7234" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="659.6721" y="101.7022" text-anchor="middle" font-size="22.2975" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Need Kubernetes?</text>
  <line x1="512.1312" y1="138.7234" x2="276.0655" y2="212.766" stroke="var(--text)" stroke-width="2"/>
  <line x1="807.2131" y1="138.7234" x2="1043.2786" y2="212.766" stroke="var(--text)" stroke-width="2"/>
  <text x="354.754" y="175.7447" font-size="18.5813" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <text x="954.754" y="175.7447" font-size="18.5813" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <rect x="79.3442" y="212.766" width="393.4427" height="98.7234" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="276.0655" y="274.4681" text-anchor="middle" font-size="20.4393" fill="var(--ok-accent)" font-family="Arial, sans-serif">On-prem or air-gapped?</text>
  <rect x="846.5573" y="212.766" width="393.4427" height="98.7234" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.2786" y="274.4681" text-anchor="middle" font-size="20.4393" fill="var(--warn-accent)" font-family="Arial, sans-serif">Use managed containers</text>
  <line x1="177.7049" y1="311.4894" x2="177.7049" y2="385.5319" stroke="var(--text)" stroke-width="2"/>
  <line x1="374.4262" y1="311.4894" x2="374.4262" y2="385.5319" stroke="var(--text)" stroke-width="2"/>
  <text x="138.3605" y="360.851" font-size="18.5813" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <text x="403.9344" y="360.851" font-size="18.5813" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <rect x="40" y="385.5319" width="275.4099" height="98.7234" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.7049" y="447.234" text-anchor="middle" font-size="20.4393" fill="var(--danger-accent)" font-family="Arial, sans-serif">Self-managed K8s</text>
  <rect x="374.4262" y="385.5319" width="275.4099" height="98.7234" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="512.1312" y="447.234" text-anchor="middle" font-size="20.4393" fill="var(--info-accent)" font-family="Arial, sans-serif">Managed K8s</text>
  <rect x="40" y="508.9362" width="275.4099" height="111.0638" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.7049" y="553.3616" text-anchor="middle" font-size="18.5813" fill="var(--text)" font-family="Arial, sans-serif">kubeadm, kops, Rancher</text>
  <text x="177.7049" y="595.3191" text-anchor="middle" font-size="18.5813" fill="var(--danger-accent)" font-family="Arial, sans-serif">High ops burden</text>
  <rect x="374.4262" y="508.9362" width="275.4099" height="111.0638" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="512.1312" y="553.3616" text-anchor="middle" font-size="18.5813" fill="var(--text)" font-family="Arial, sans-serif">EKS, AKS, GKE</text>
  <text x="512.1312" y="595.3191" text-anchor="middle" font-size="18.5813" fill="var(--info-accent)" font-family="Arial, sans-serif">Medium ops burden</text>
</svg>

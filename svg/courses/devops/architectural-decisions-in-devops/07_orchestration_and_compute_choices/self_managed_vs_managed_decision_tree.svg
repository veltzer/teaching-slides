<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="371.5193" y="26.1224" width="464.3991" height="104.4898" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="603.7188" y="91.4286" text-anchor="middle" font-size="22.2912" font-weight="bold" fill="var(--primary-accent)">Need Kubernetes?</text>
  <line x1="464.3991" y1="130.6122" x2="241.4875" y2="208.9796" stroke="var(--text)" stroke-width="2" />
  <line x1="743.0385" y1="130.6122" x2="965.95" y2="208.9796" stroke="var(--text)" stroke-width="2" />
  <text x="315.7913" y="169.7959" font-size="18.576" fill="var(--ok-accent)">Yes</text>
  <text x="882.3582" y="169.7959" font-size="18.576" fill="var(--danger-accent)">No</text>
  <rect x="55.7279" y="208.9796" width="371.5193" height="104.4898" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="241.4875" y="274.2857" text-anchor="middle" font-size="20.4335" fill="var(--ok-accent)">On-prem or air-gapped?</text>
  <rect x="780.1904" y="208.9796" width="371.5193" height="104.4898" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="965.95" y="274.2857" text-anchor="middle" font-size="20.4335" fill="var(--warn-accent)">Use managed containers</text>
  <line x1="148.6077" y1="313.4694" x2="148.6077" y2="391.8367" stroke="var(--text)" stroke-width="2" />
  <line x1="334.3673" y1="313.4694" x2="334.3673" y2="391.8367" stroke="var(--text)" stroke-width="2" />
  <text x="111.4557" y="365.7142" font-size="18.576" fill="var(--ok-accent)">Yes</text>
  <text x="362.2313" y="365.7142" font-size="18.576" fill="var(--danger-accent)">No</text>
  <rect x="18.576" y="391.8367" width="260.0635" height="104.4898" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="148.6077" y="457.1428" text-anchor="middle" font-size="20.4335" fill="var(--danger-accent)">Self-managed K8s</text>
  <rect x="334.3673" y="391.8367" width="260.0635" height="104.4898" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="464.3991" y="457.1428" text-anchor="middle" font-size="20.4335" fill="var(--info-accent)">Managed K8s</text>
  <rect x="18.576" y="522.449" width="260.0635" height="117.551" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="148.6077" y="569.4693" text-anchor="middle" font-size="18.576" fill="var(--text)">kubeadm, kops, Rancher</text>
  <text x="148.6077" y="613.8775" text-anchor="middle" font-size="18.576" fill="var(--danger-accent)">High ops burden</text>
  <rect x="334.3673" y="522.449" width="260.0635" height="117.551" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="464.3991" y="569.4693" text-anchor="middle" font-size="18.576" fill="var(--text)">EKS, AKS, GKE</text>
  <text x="464.3991" y="613.8775" text-anchor="middle" font-size="18.576" fill="var(--info-accent)">Medium ops burden</text>
</svg>
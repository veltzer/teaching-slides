<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="40" y1="40" x2="40" y2="550.4" stroke="var(--text)" stroke-width="2"/>
  <line x1="40" y1="550.4" x2="1240" y2="550.4" stroke="var(--text)" stroke-width="2"/>
  <text x="40" y="306.8" text-anchor="middle" font-size="23.0072" fill="var(--text)" transform="rotate(-90,40,135)" font-family="Arial, sans-serif">Monthly Cost ($)</text>
  <text x="639.9999" y="620" text-anchor="middle" font-size="23.8441" fill="var(--text)" font-family="Arial, sans-serif">Request Volume / Traffic</text>
  <text x="195.5555" y="585.2001" font-size="19.8701" fill="var(--text-muted)" font-family="Arial, sans-serif">Low</text>
  <text x="639.9999" y="585.2001" font-size="19.8701" fill="var(--text-muted)" font-family="Arial, sans-serif">Medium</text>
  <text x="1084.4444" y="585.2001" font-size="19.8701" fill="var(--text-muted)" font-family="Arial, sans-serif">High</text>
  <polyline points="40,480.8 306.6666,457.6 639.9999,376.4 973.3333,295.2 1195.5557,214" fill="none" stroke="var(--primary-border)" stroke-width="5.4458"/>
  <polyline points="40,422.8 306.6666,399.6 639.9999,330 973.3333,272 1195.5557,237.2" fill="none" stroke="var(--info-border)" stroke-width="5.4458"/>
  <polyline points="40,527.2 306.6666,480.8 639.9999,353.2 973.3333,179.2 1195.5557,63.2001" fill="none" stroke="var(--warn-border)" stroke-width="5.4458"/>
  <rect x="795.5555" y="40" width="26.6667" height="27.84" fill="var(--primary-accent)" rx="6"/>
  <text x="840" y="65.52" font-size="19.8701" fill="var(--text)" font-family="Arial, sans-serif">Kubernetes</text>
  <rect x="795.5555" y="86.4" width="26.6667" height="27.84" fill="var(--info-accent)" rx="6"/>
  <text x="840" y="111.92" font-size="19.8701" fill="var(--text)" font-family="Arial, sans-serif">Managed Containers</text>
  <rect x="795.5555" y="132.8" width="26.6667" height="27.84" fill="var(--warn-accent)" rx="6"/>
  <text x="840" y="158.32" font-size="19.8701" fill="var(--text)" font-family="Arial, sans-serif">Serverless</text>
  <text x="528.8888" y="248.8" font-size="19.8701" fill="var(--warn-accent)" font-style="italic" font-family="Arial, sans-serif">Serverless cost rises steeply</text>
  <text x="262.2221" y="446.0001" font-size="19.8701" fill="var(--primary-accent)" font-style="italic" font-family="Arial, sans-serif">K8s base cost is fixed</text>
</svg>

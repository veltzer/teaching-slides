<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <line x1="145.2207" y1="47.4074" x2="145.2207" y2="568.8889" stroke="var(--text)" stroke-width="2" />
  <line x1="145.2207" y1="568.8889" x2="1125.46" y2="568.8889" stroke="var(--text)" stroke-width="2" />
  <text x="72.6103" y="320" text-anchor="middle" font-size="21.7831" fill="var(--text)" transform="rotate(-90,40,135)">Monthly Cost ($)</text>
  <text x="635.3403" y="640" text-anchor="middle" font-size="21.7831" fill="var(--text)">Request Volume / Traffic</text>
  <text x="272.2887" y="604.4445" font-size="18.1526" fill="var(--text-muted)">Low</text>
  <text x="635.3403" y="604.4445" font-size="18.1526" fill="var(--text-muted)">Medium</text>
  <text x="998.3919" y="604.4445" font-size="18.1526" fill="var(--text-muted)">High</text>
  <polyline points="145.2207,497.7778 363.0516,474.0741 635.3403,391.1111 907.629,308.1481 1089.1549,225.1852" fill="none" stroke="var(--primary-border)" stroke-width="5.4458" />
  <polyline points="145.2207,438.5185 363.0516,414.8148 635.3403,343.7037 907.629,284.4444 1089.1549,248.8889" fill="none" stroke="var(--info-border)" stroke-width="5.4458" />
  <polyline points="145.2207,545.1852 363.0516,497.7778 635.3403,367.4074 907.629,189.6296 1089.1549,71.1112" fill="none" stroke="var(--warn-border)" stroke-width="5.4458" />
  <rect x="762.4084" y="47.4074" width="21.7831" height="28.4444" fill="var(--primary-accent)" rx="6"/>
  <text x="798.7135" y="73.4815" font-size="18.1526" fill="var(--text)">Kubernetes</text>
  <rect x="762.4084" y="94.8148" width="21.7831" height="28.4444" fill="var(--info-accent)" rx="6"/>
  <text x="798.7135" y="120.8889" font-size="18.1526" fill="var(--text)">Managed Containers</text>
  <rect x="762.4084" y="142.2222" width="21.7831" height="28.4444" fill="var(--warn-accent)" rx="6"/>
  <text x="798.7135" y="168.2963" font-size="18.1526" fill="var(--text)">Serverless</text>
  <text x="544.5774" y="260.7407" font-size="18.1526" fill="var(--warn-accent)" font-style="italic">Serverless cost rises steeply</text>
  <text x="326.7464" y="462.2223" font-size="18.1526" fill="var(--primary-accent)" font-style="italic">K8s base cost is fixed</text>
</svg>
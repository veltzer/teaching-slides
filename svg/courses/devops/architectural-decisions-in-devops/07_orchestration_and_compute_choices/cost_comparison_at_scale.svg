<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <line x1="40" y1="40" x2="40" y2="550.4" stroke="var(--text)" stroke-width="2" />
  <line x1="40" y1="550.4" x2="1240" y2="550.4" stroke="var(--text)" stroke-width="2" />
  <text x="40" y="306.8" text-anchor="middle" font-size="23.0072" fill="var(--text)" transform="rotate(-90,40,135)">Monthly Cost ($)</text>
  <text x="639.9999" y="620" text-anchor="middle" font-size="23.8441" fill="var(--text)">Request Volume / Traffic</text>
  <text x="195.5555" y="585.2001" font-size="19.8701" fill="var(--text-muted)">Low</text>
  <text x="639.9999" y="585.2001" font-size="19.8701" fill="var(--text-muted)">Medium</text>
  <text x="1084.4444" y="585.2001" font-size="19.8701" fill="var(--text-muted)">High</text>
  <polyline points="40,480.8 306.6666,457.6 639.9999,376.4 973.3333,295.2 1195.5557,214" fill="none" stroke="var(--primary-border)" stroke-width="5.4458" />
  <polyline points="40,422.8 306.6666,399.6 639.9999,330 973.3333,272 1195.5557,237.2" fill="none" stroke="var(--info-border)" stroke-width="5.4458" />
  <polyline points="40,527.2 306.6666,480.8 639.9999,353.2 973.3333,179.2 1195.5557,63.2001" fill="none" stroke="var(--warn-border)" stroke-width="5.4458" />
  <rect x="795.5555" y="40" width="26.6667" height="27.84" fill="var(--primary-accent)" rx="6.2183"/>
  <text x="840" y="65.52" font-size="19.8701" fill="var(--text)">Kubernetes</text>
  <rect x="795.5555" y="86.4" width="26.6667" height="27.84" fill="var(--info-accent)" rx="6.2183"/>
  <text x="840" y="111.92" font-size="19.8701" fill="var(--text)">Managed Containers</text>
  <rect x="795.5555" y="132.8" width="26.6667" height="27.84" fill="var(--warn-accent)" rx="6.2183"/>
  <text x="840" y="158.32" font-size="19.8701" fill="var(--text)">Serverless</text>
  <text x="528.8888" y="248.8" font-size="19.8701" fill="var(--warn-accent)" font-style="italic">Serverless cost rises steeply</text>
  <text x="262.2221" y="446.0001" font-size="19.8701" fill="var(--primary-accent)" font-style="italic">K8s base cost is fixed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow_sl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <line x1="95.7823" y1="358.9116" x2="1184.2177" y2="358.9116" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow_sl)" />
  <rect x="136.0947" y="256.8707" width="181.4059" height="204.0816" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.5586" />
  <text x="226.7977" y="375.9184" text-anchor="middle" font-size="22.1718" font-weight="bold">Code</text>
  <rect x="357.8131" y="256.8707" width="181.4059" height="204.0816" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.5586" />
  <text x="448.516" y="375.9184" text-anchor="middle" font-size="22.1718" font-weight="bold">Build</text>
  <rect x="579.5314" y="256.8707" width="181.4059" height="204.0816" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.5586" />
  <text x="670.2343" y="375.9184" text-anchor="middle" font-size="22.1718" font-weight="bold">Test</text>
  <rect x="801.2497" y="256.8707" width="181.4059" height="204.0816" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.5586" />
  <text x="891.9528" y="375.9184" text-anchor="middle" font-size="22.1718" font-weight="bold">Deploy</text>
  <rect x="1022.968" y="256.8707" width="141.0935" height="204.0816" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.5586" />
  <text x="1093.5147" y="375.9184" text-anchor="middle" font-size="22.1718" font-weight="bold">Prod</text>
  <path d="M 841.5621 205.8503 C 740.7811 86.8027 438.4379 86.8027 196.5634 205.8503" fill="none" stroke="var(--danger-border)" stroke-width="3.2" stroke-dasharray="9.6" marker-end="url(#arrow_sl)" />
  <text x="519.0627" y="80" text-anchor="middle" font-size="24.1875" fill="var(--danger-accent)" font-weight="bold">Shift Left</text>
  <text x="640" y="580" text-anchor="middle" font-size="22.1718" fill="var(--text-muted)">Find bugs earlier = cheaper to fix</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrow_sl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <line x1="72.8415" y1="272.9489" x2="900.5863" y2="272.9489" stroke="var(--text)" stroke-width="1.521" marker-end="url(#arrow_sl)" />
  <rect x="103.4987" y="195.3477" width="137.9575" height="155.2021" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.521" rx="5.7482" />
  <text x="172.4775" y="285.8824" text-anchor="middle" font-size="16.8614" font-weight="bold">Code</text>
  <rect x="272.1135" y="195.3477" width="137.9575" height="155.2021" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.521" rx="5.7482" />
  <text x="341.0922" y="285.8824" text-anchor="middle" font-size="16.8614" font-weight="bold">Build</text>
  <rect x="440.7281" y="195.3477" width="137.9575" height="155.2021" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.521" rx="5.7482" />
  <text x="509.7068" y="285.8824" text-anchor="middle" font-size="16.8614" font-weight="bold">Test</text>
  <rect x="609.3428" y="195.3477" width="137.9575" height="155.2021" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.521" rx="5.7482" />
  <text x="678.3216" y="285.8824" text-anchor="middle" font-size="16.8614" font-weight="bold">Deploy</text>
  <rect x="777.9575" y="195.3477" width="107.3003" height="155.2021" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.521" rx="5.7482" />
  <text x="831.6076" y="285.8824" text-anchor="middle" font-size="16.8614" font-weight="bold">Prod</text>
  <path d="M 640 156.5472 C 563.357 66.0126 333.4279 66.0126 149.4846 156.5472" fill="none" stroke="var(--danger-border)" stroke-width="2.4336" stroke-dasharray="7.3007" marker-end="url(#arrow_sl)" />
  <text x="394.7423" y="60.8392" text-anchor="middle" font-size="18.3944" fill="var(--danger-accent)" font-weight="bold">Shift Left</text>
  <text x="486.7139" y="441.0845" text-anchor="middle" font-size="16.8614" fill="var(--text-muted)">Find bugs earlier = cheaper to fix</text>

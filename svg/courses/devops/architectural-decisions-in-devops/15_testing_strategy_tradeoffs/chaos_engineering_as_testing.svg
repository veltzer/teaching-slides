<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrow_ce" markerWidth="22.8571" markerHeight="28.8" refX="20.5714" refY="8.64" orient="auto">
      <path d="M 0 0 L 0 17.28 L 20.5714 8.64 z" fill="#333" />
    </marker>
  </defs>
  <rect x="68.5714" y="86.4" width="297.1429" height="144" fill="#e8f5e9" stroke="#333" stroke-width="3.4286" rx="11.4286" />
  <text x="217.1429" y="144" text-anchor="middle" font-size="25.1429" font-weight="bold">1. Steady State</text>
  <text x="217.1429" y="187.2" text-anchor="middle" font-size="22.8571">Define normal behavior</text>
  <rect x="480" y="86.4" width="297.1429" height="144" fill="#fff9c4" stroke="#333" stroke-width="3.4286" rx="11.4286" />
  <text x="628.5714" y="144" text-anchor="middle" font-size="25.1429" font-weight="bold">2. Hypothesis</text>
  <text x="628.5714" y="187.2" text-anchor="middle" font-size="22.8571">Predict system response</text>
  <rect x="891.4286" y="86.4" width="320" height="144" fill="#ffe0b2" stroke="#333" stroke-width="3.4286" rx="11.4286" />
  <text x="1051.4286" y="144" text-anchor="middle" font-size="25.1429" font-weight="bold">3. Inject Fault</text>
  <text x="1051.4286" y="187.2" text-anchor="middle" font-size="22.8571">Kill pod, add latency</text>
  <rect x="274.2857" y="432" width="320" height="144" fill="#ffcdd2" stroke="#333" stroke-width="3.4286" rx="11.4286" />
  <text x="434.2857" y="489.6" text-anchor="middle" font-size="25.1429" font-weight="bold">4. Observe</text>
  <text x="434.2857" y="532.8" text-anchor="middle" font-size="22.8571">Compare to hypothesis</text>
  <rect x="708.5714" y="432" width="320" height="144" fill="#e3f2fd" stroke="#333" stroke-width="3.4286" rx="11.4286" />
  <text x="868.5714" y="489.6" text-anchor="middle" font-size="25.1429" font-weight="bold">5. Learn / Fix</text>
  <text x="868.5714" y="532.8" text-anchor="middle" font-size="22.8571">Improve resilience</text>
  <line x1="365.7143" y1="158.4" x2="480" y2="158.4" stroke="#333" stroke-width="3.4286" marker-end="url(#arrow_ce)" />
  <line x1="777.1429" y1="158.4" x2="891.4286" y2="158.4" stroke="#333" stroke-width="3.4286" marker-end="url(#arrow_ce)" />
  <line x1="1051.4286" y1="230.4" x2="1051.4286" y2="316.8" stroke="#333" stroke-width="3.4286" />
  <line x1="1051.4286" y1="316.8" x2="594.2857" y2="432" stroke="#333" stroke-width="3.4286" marker-end="url(#arrow_ce)" />
  <line x1="594.2857" y1="504" x2="708.5714" y2="504" stroke="#333" stroke-width="3.4286" marker-end="url(#arrow_ce)" />
</svg>